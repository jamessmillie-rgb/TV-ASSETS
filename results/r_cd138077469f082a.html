const REPORT_DATA = {"patient_name":"Dean Michael Baker","dob":"02/07/1985","report_date":"2026-10-16","summary":"This is a 41-year-old male presenting with a BMI of 25.5, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are about average (volume 5 out of 10). He does no structured cardio or resistance training, with 2,000 to 5,000 daily steps. He works night shifts or rotating shifts. He sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash. Stress rarely feels hard to manage. He drinks 1 to 4 alcoholic drinks a week. He supplements with vitamin D, creatine and protein powder. He has had a previous blood test but never saw the results. He reports brain fog, low sex drive and poor exercise recovery, all lasting over a year. His goals are to build muscle, balance hormones and lose body fat.\n\nThe finding that should be discussed with his GP first is his lipid profile. His total cholesterol is 7.3, well above the desirable threshold of 5.18. His LDL cholesterol, the form that deposits cholesterol into artery walls, is 4.33 against a target below 3.0. His ApoB, a protein that acts as a direct count of the atherogenic particles circulating in the blood, is 1.28 against a target below 0.9, placing it in the laboratory's 'high' category. His triglycerides are 4.03, more than double the fasting target of 1.7, and his VLDL, the triglyceride-rich lipoprotein the liver produces, is 1.83 against an upper limit of 0.78. His HDL cholesterol, the protective fraction that carries cholesterol back to the liver for disposal, is 1.2, which is above the high-risk threshold of 1.04 but below the desirable level of 1.55. His ApoB to ApoA-I ratio, one of the best single summaries of cardiovascular risk, is 0.85, sitting in the average-risk band but approaching the higher-risk threshold of 0.9. His non-HDL cholesterol, which captures all the atherogenic fractions in one number, is 6.1 against a target below 4.0. His TC to HDL ratio is 6.08 against a target below 4.5. His Cardiovascular Risk Score, a TrueVitals index scored from 0 to 100 that is built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c and measures the cumulative burden of risk rather than a ten-year event probability, is 70 out of 100, well above the ideal threshold of 20 and the acceptable threshold of 40. At 41, his ten-year risk of a cardiovascular event remains statistically low because age is the dominant term in those models, but the gap between a low ten-year risk and a high burden score is exactly the window he has to act in. The inputs driving that score are the elevated ApoB, the very high triglycerides and the below-ideal HDL.\n\nOne piece of genuinely useful information within the lipid panel is his Lp(a). Lipoprotein(a) is an inherited, genetically fixed particle that deposits cholesterol, promotes clotting and drives inflammation in artery walls. His level is 30.03 against a threshold of 32, placing it in the normal range. This means the entire lipid picture above is driven by modifiable factors, primarily diet, body composition, activity level and metabolic health, rather than by an inherited particle he cannot change. That is important because it means every abnormal lipid marker in this report can improve.\n\nThe very high triglycerides deserve specific attention because they point to a metabolic pattern. Triglycerides at 4.03 with a fasting glucose of 4.6 and a fasting insulin of 3.43 is an unusual combination. His HOMA-IR, a calculation that estimates how sensitive the body's cells are to insulin (built from fasting glucose multiplied by fasting insulin divided by 22.5), is 0.7, which is optimal and means his cells respond well to insulin. His HbA1c, a measure of average blood sugar over the preceding two to three months, is 39 mmol/mol, which is within the normal range below 42 but sits above the optimal threshold of 36. So the insulin system is working efficiently, but the triglycerides are very high regardless. The most likely explanation at his weight, activity level and diet is dietary carbohydrate load combined with minimal physical activity. With zero cardio days, zero resistance days and only 2,000 to 5,000 steps, the liver is packaging excess dietary energy into triglyceride-rich VLDL particles that are not being cleared by muscle activity. Night shift work compounds this because circadian disruption independently raises triglycerides by altering the timing of lipid metabolism. The LDL calculation used by the laboratory (the Sampson equation) can overestimate LDL when triglycerides are this high, but his ApoB at 1.28 confirms independently that there are too many atherogenic particles in the blood, so the LDL elevation is real. His Lp(a)-corrected LDL, which removes the cholesterol carried by Lp(a) to show what is modifiable, is 4.23, confirming that virtually all the excess LDL is diet and lifestyle driven.\n\nHis thyroglobulin antibody is 7.3 against an upper limit of 4.4. Thyroglobulin antibodies are proteins the immune system produces against thyroglobulin, the scaffold protein the thyroid gland uses to manufacture thyroid hormones. In isolation, a mildly elevated thyroglobulin antibody does not mean the thyroid is under attack, but it does mean the immune system has recognised thyroid tissue as a target, and it places him in a population with a slightly higher lifetime risk of developing autoimmune thyroid disease, a condition called Hashimoto's thyroiditis. Crucially, his thyroid peroxidase antibodies (TPO), the other antibody associated with Hashimoto's, are negative at less than 6.6 against a limit of 13.8, and his thyroid function is working well: TSH at 1.43 is in the ideal range, free T4 at 19.8 is in the upper part of the ideal range, and free T3 at 5.4 is within the ideal band. His FT3 to FT4 ratio, which shows how efficiently the body converts the storage form of thyroid hormone into its active form, is 0.273, right at the lower edge of the optimal range. So the thyroid is healthy and producing well, but the positive thyroglobulin antibody should be noted in his permanent medical record and rechecked in 12 months to track whether it rises, stays stable or resolves.\n\nHis PTH, or parathyroid hormone, which is produced by four small glands behind the thyroid and controls calcium levels by pulling calcium from bone, activating vitamin D and reducing calcium loss through the kidneys, is 0.8 against a lower limit of 0.98. His corrected calcium is 2.56, sitting right at the upper end of the reference range of 2.2 to 2.6. When calcium is at the top of its range, PTH is supposed to fall because the parathyroid glands sense there is enough calcium and reduce output. So a low PTH with a high-normal calcium is physiologically appropriate rather than pathological. His vitamin D at 72 is sufficient but below the optimal range of 75 to 120, and since vitamin D and PTH work in opposite directions, raising his vitamin D further with supplementation may bring both markers into a more comfortable position.\n\nHis C-Peptide is 0.782 micrograms per litre, which converts to approximately 259 pmol/L, below the laboratory's lower limit of 1.1 micrograms per litre (364 pmol/L). C-Peptide is a fragment released in equal amounts to insulin when the pancreas produces it, and it acts as a more stable measure of pancreatic insulin output than insulin itself. However, his fasting glucose is 4.6, his HbA1c is 39, and his HOMA-IR is 0.7, all of which confirm that blood sugar control is working well. A low C-Peptide alongside normal glucose and low-normal insulin simply means the pancreas does not need to produce much insulin because his cells are sensitive to it. This is a sign of good metabolic efficiency, not pancreatic insufficiency.\n\nHis progesterone is 0.35 against a male range of 0.89 to 3.88. Progesterone in men is produced in small amounts by the adrenal glands and the testes. At this level it is below range, but progesterone is not routinely measured or treated in men, and low progesterone in a male has no established clinical consequence. It is noted for completeness.\n\nHis testosterone is 17.2 against a reference range of 8.4 to 28.7. This is within range but below the optimal band of 18 to 30. His free testosterone, the fraction not bound to proteins and therefore available to tissues, is 0.353 against a range of 0.13 to 1.04, and his bioavailable testosterone is 8.46 against a range of 2 to 9. His SHBG, the protein that binds testosterone and reduces its availability, is 33.5, which is in a good range. His LH and FSH, the pituitary hormones that drive the testes, are both within range, meaning the brain-testis signalling axis is intact. So the hormonal machinery is working, but the output is at the lower end of optimal. At 41, with no resistance training, night shifts and 2,000 to 5,000 steps, the most likely explanations for a below-optimal testosterone are the lack of resistance exercise, circadian disruption from shift work and the fact that testosterone naturally declines by about one per cent a year from the early thirties. This connects directly to his symptoms of low libido and poor exercise recovery, and it is one of the most modifiable findings in the report because resistance training is the single most effective non-pharmaceutical intervention for raising testosterone.\n\nHis cortisol is 116, which is below the morning reference range of 145 to 619. However, this result must be interpreted with the time of blood draw in mind. If the sample was taken in the afternoon, or if he had just come off a night shift, cortisol at 116 is entirely expected because cortisol follows a circadian rhythm, peaking within an hour of waking and falling throughout the day. Given that he works night shifts, a shifted cortisol rhythm is the most likely explanation, and this connects to his pattern of being slow to get going on waking and crashing in the afternoon, which is a hallmark of disrupted circadian cortisol timing.\n\nTurning to the positives, and there are many. His inflammation markers are excellent. His hsCRP, the most sensitive measure of systemic inflammation, is below 0.5, which is as low as the assay reports and means there is virtually no inflammatory activity in the body. His ESR at 8 is well within range. His white cell count at 8.01, neutrophils at 4.49 and lymphocytes at 2.99 are all comfortably placed, and his immunoglobulins (IgG 10.1, IgM 1.2, IgA 2.1, IgE 23.7) show an immune system that is balanced, with no sign of allergy, chronic infection or immune deficiency. His rheumatoid factor is negative. His tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of his symptoms.\n\nHis liver is in good health. ALT at 19 and GGT at 24 are both within their ideal ranges, and his AST at 24, ALP at 84, bilirubin at 7 and albumin at 44 are all normal. His FIB-4, a calculation that screens for liver fibrosis using age, platelets, AST and ALT, is 1.18 against a threshold of 1.45, ruling out significant fibrosis. His APRI score at 0.313 and NAFLD fibrosis score at minus 1.911 both confirm a healthy liver with no sign of fat accumulation or scarring. This is reassuring given the very high triglycerides, because it means the liver is handling the lipid load without developing fatty change, at least for now.\n\nHis kidney function is solid. Creatinine at 92 gives an eGFR of 89, and his Cystatin C at 0.97 gives a Cystatin C eGFR of 91. The combined eGFR is 91, which is above the optimal threshold of 90. Cystatin C is a protein filtered by the kidneys that is not affected by muscle mass, so it provides a more accurate picture in men who may gain or lose muscle. Urea at 7.8 is within range, and his urea to creatinine ratio at 84.8 is normal, suggesting adequate hydration and no kidney strain. Uric acid at 309 is within the optimal range for a male. Sodium, chloride, bicarbonate and magnesium are all within range, with magnesium at 0.94 sitting in the optimal band of 0.85 to 1.05.\n\nHis iron studies are balanced. Ferritin at 164 is within the optimal range for a male (50 to 200), serum iron at 14.6 is within range, transferrin at 2.21 is within range, iron binding capacity at 53.2 is within range, and transferrin saturation at 26.31 per cent sits within the optimal band of 25 to 40 per cent. His haemoglobin at 150, red cell count at 4.87 and haematocrit at 0.425 are all healthy. His B12 at 317 is within the laboratory range but below the optimal level of 500; given his symptoms of brain fog and fatigue, bringing this up with sublingual methylcobalamin supplementation is worth doing. His folate at 8 is right at the lower edge of the optimal range.\n\nHis MCHC at 353 is above the laboratory upper limit of 345. MCHC, or mean corpuscular haemoglobin concentration, measures how densely packed haemoglobin is within each red cell. At this small margin it is not a concern on its own. His reticulocyte percentage at 0.81 is within range, but his absolute reticulocyte count at 39.4 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a count below 50 can mean the marrow is producing at a slightly reduced rate. With haemoglobin at 150 and no anaemia, the most likely explanation is that the body simply does not need to produce red cells at a high rate because there is no increased demand. This is a monitoring point rather than a concern.\n\nHis total antioxidant activity at 1.9 is above the upper range of 1.77. This marker measures the combined antioxidant capacity of the blood, and a result above range is not harmful. It most likely reflects his supplementation (vitamin D, creatine and protein powder can contribute, as can dietary antioxidants). His prostate markers are excellent, with PSA at 0.59 against a limit of 2.5 and a free PSA ratio of 0.83, which is strongly reassuring. His tumour markers CA19-9 and CEA are both well within range. Creatine kinase at 132 is mid-range, consistent with someone who is not doing heavy resistance training. His basophils are reported as less than 0.01 against a lower limit of 0.01, which is a rounding artefact at the detection limit and has no clinical significance.\n\nHis PhenoAge, a composite biological age calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 34.4 against a calendar age of 41, meaning his biological age is 6.6 years younger than his chronological age. This is driven primarily by his excellent inflammatory markers, good kidney function and healthy blood counts. The lipid abnormalities do not feed into PhenoAge, so while it is a positive finding, it does not offset the cardiovascular risk that needs addressing.\n\nHis urinalysis is clean, with no protein, glucose, ketones, blood or white cells detected, and pH and specific gravity are normal. Bacterial count and urine culture results are pending and will be reviewed when available.\n\nConnecting his symptoms to the results: his brain fog, low libido and poor exercise recovery have persisted for over a year. The below-optimal testosterone, the below-optimal B12, the circadian disruption from night shifts and the complete absence of resistance training are the most plausible contributors. The bloods have excluded thyroid disease, anaemia, iron deficiency, coeliac disease, diabetes, inflammation and kidney or liver dysfunction. His afternoon crash aligns with the shifted cortisol pattern expected from night shift work. Building resistance training into his routine, optimising B12 and managing his sleep-wake cycle as far as shift work allows will address the modifiable factors behind these symptoms.\n\nLate-arriving results: the additional markers received are fully consistent with the picture already described in the main report and do not change any of its conclusions. The urinalysis is completely clean, with no growth on culture, no white or red blood cells, no nitrites and no casts, confirming a healthy urinary tract. The glucose and HOMA-IR of 0.7 confirm optimal insulin sensitivity, which sits in reassuring contrast to the very high triglycerides and underlines that the lipid abnormalities are driven by diet and inactivity rather than insulin resistance. The lipid and VLDL markers reinforce the importance of the dietary and exercise changes already recommended: triglycerides at 4.03, VLDL at 1.83 and an HDL fraction of only 16.4 per cent of total cholesterol all point to the same modifiable pattern. The reticulocyte count at 39.4, mildly below the lower limit of 50, is noted again here: in the context of haemoglobin at 150 and healthy red cell indices across the board, this most likely reflects low production demand rather than any marrow problem, and it should be rechecked at his next test. The PTH at 0.8, just below its lower limit of 0.98, remains appropriately low in the context of a high-normal corrected calcium of 2.56, and continuing to improve his vitamin D from 72 towards the optimal range of 75 to 120 remains the most sensible next step. All other late-arriving markers, including the kidney function indices, FIB-4, liver and thyroid results and prostate markers, confirm what was already described: solid organ function across the board, with the lipid and metabolic picture as the clear priority for action.","links":"The dominant finding in this report is the lipid profile, and it connects to his lifestyle in a straightforward way. With no structured exercise, low daily steps, a standard mixed diet with only moderate vegetable intake, and night shift work disrupting circadian lipid metabolism, the liver is packaging excess dietary energy into triglyceride-rich VLDL particles that are not being burned by muscle activity. This drives the very high triglycerides at 4.03, which in turn inflate the VLDL at 1.83, depress the HDL at 1.2 (because HDL and triglycerides move in opposite directions), and contribute to the elevated LDL at 4.33 and ApoB at 1.28. The Lp(a) at 30.03 being normal confirms that this entire pattern is modifiable.\n\nThe second thread links testosterone, libido, exercise recovery and body composition. His testosterone at 17.2 is functional but below optimal at 41, and the most evidence-based way to raise it is resistance training, which he currently does none of. The absence of training also explains his poor recovery from exercise: a body that does not train regularly loses its capacity to recover efficiently. Night shifts compound this by disrupting the pulsatile release of testosterone and growth hormone that occurs during deep sleep. Improving sleep quality and adding resistance training will target both the hormonal and the recovery complaints simultaneously.\n\nThe third thread is the circadian disruption from shift work, which ties together several findings: the low cortisol (likely a timing artefact from a shifted wake-sleep cycle), the afternoon crash, the slow waking, and the contribution to elevated triglycerides. Shift work is a recognised independent risk factor for metabolic syndrome, and the lipid pattern in this report is consistent with that literature. Managing the circadian challenge as far as possible, through fixed meal timing, light exposure on waking and a disciplined sleep routine on rest days, is one of the most important non-dietary interventions available.\n\nThe thyroglobulin antibody at 7.3 is a standalone finding that does not connect to the lipid or hormonal picture. It sits at a low positive level, both thyroid function and TPO antibodies are normal, and it may resolve or may slowly rise over years. It requires monitoring rather than action, but it should be recorded because if thyroid symptoms emerge in the future, the antibody history will be valuable context.\n\nWhat has been excluded is as important as what has been found. Coeliac disease, thyroid dysfunction, anaemia, iron deficiency, diabetes, liver disease, kidney disease, chronic inflammation, immune deficiency and prostate pathology have all been ruled out. The symptoms of brain fog, low libido and poor recovery are not caused by any of these. They are most likely driven by the combination of suboptimal testosterone, low B12, circadian disruption, deconditioning and a diet that, while not poor, is not yet supporting his goals.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish or leftover meat. Anchor: protein goes on the plate before anything else. Why: protein supports muscle building, helps with satiety to support fat loss, and at 82.6 kg with a goal to build muscle you need at least 107 to 132 grams a day, which will not happen without a conscious effort at every meal.\nSwap refined carbohydrates (white bread, pasta, sugary cereals) for oats, rye bread, sweet potato or lentils, one meal at a time starting with your most carb-heavy meal. Anchor: when you reach for the carbohydrate, choose the slower version. Why: rapidly absorbed carbohydrate is the most likely driver of your triglycerides at 4.03, and slower carbohydrates produce a lower insulin and triglyceride response.\nAdd two portions of oily fish a week (salmon, mackerel, sardines). Anchor: pick two fixed days as fish days. Why: omega-3 fatty acids lower triglycerides directly, and at 4.03 your triglycerides are the most elevated marker in the report. If oily fish is not realistic, an omega-3 supplement covers it.\nWalk for fifteen to twenty minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: post-meal walking accelerates triglyceride clearance from the blood and will help bring that 4.03 down. This also adds to your step count, which at 2,000 to 5,000 is well below the level associated with metabolic health.\nBegin resistance training twice a week, full body, focusing on compound movements (squats, deadlifts, rows, presses, pull-ups or their assisted versions). Anchor: pick two fixed days and treat them as appointments. Why: resistance training is the single most effective intervention for raising testosterone from its current 17.2 toward the optimal range of 18 to 30, improving exercise recovery, building the muscle you want and clearing triglycerides. Start with bodyweight or light weights and build gradually.\nOn rest days and days off, aim for 7,000 to 10,000 steps. Anchor: set a phone reminder at lunchtime to check your step count and walk if you are behind. Why: daily movement is the background engine for triglyceride clearance, insulin sensitivity and body composition.\nOn waking, get outside or use a bright light for 10 to 15 minutes within the first hour, especially after a night shift. Anchor: first thing after getting up, before checking your phone. Why: light is the strongest signal for resetting your circadian clock, which shift work disrupts. This will help with the slow mornings and afternoon crash you describe.\nSet a caffeine cut-off six hours before your intended sleep time. Anchor: set an alarm labelled 'last coffee'. Why: caffeine has a half-life of five to six hours and will fragment sleep quality even if you fall asleep, worsening the circadian disruption from shift work and the slow mornings you report.","flags":"Lipid profile significantly abnormal: total cholesterol 7.3 (target below 5.18), LDL 4.33 (target below 3.0), ApoB 1.28 (target below 0.9, classified as 'high'), triglycerides 4.03 (target below 1.7), VLDL 1.83 (limit 0.78), HDL 1.2 (desirable above 1.55), non-HDL 6.1 (target below 4.0), TC/HDL ratio 6.08 (target below 4.5), ApoB/A-I ratio 0.85 (approaching higher-risk threshold of 0.9). Cardiovascular Risk Score 70/100. Lp(a) normal at 30.03, confirming the entire pattern is modifiable. Recommend GP review, fasting lipid confirmation, and discussion of whether dietary intervention alone or pharmacological support is appropriate.\nThyroglobulin antibody 7.3 against an upper limit of 4.4 with negative TPO antibodies and normal thyroid function (TSH 1.43, FT4 19.8, FT3 5.4). Low-level positivity with no functional impact at present. Recommend recording in medical notes and rechecking in 12 months.\nPTH 0.8 against a lower limit of 0.98, with corrected calcium 2.56 at the upper end of range (2.2 to 2.6) and vitamin D 72. The low PTH is physiologically appropriate given the high-normal calcium. No action needed unless calcium rises above range or symptoms develop.\nC-Peptide 0.782 ug/L (approximately 259 pmol/L) below the lower limit of 1.1 ug/L, with normal glucose 4.6, HbA1c 39 and HOMA-IR 0.7. Reflects low insulin demand in an insulin-sensitive individual rather than pancreatic insufficiency. No action needed.\nProgesterone 0.35 against a male range of 0.89 to 3.88. Below range but no established clinical consequence in men. Noted for completeness.\nTestosterone 17.2, within range (8.4 to 28.7) but below the optimal band of 18 to 30. Free testosterone 0.353 and bioavailable testosterone 8.46 both within range. LH 4.11 and FSH 3.77 within range. Likely driven by lack of resistance training, shift work and age. Connects to symptoms of low libido and poor recovery.\nCortisol 116 against a morning range of 145 to 619. Most likely reflects afternoon or post-night-shift sampling rather than adrenal insufficiency. If symptoms persist, a morning cortisol repeated between 7 and 9 am on a non-shift day would clarify.\nMCHC 353 against an upper limit of 345. At this margin, not a concern on its own. No clinical concern.\nReticulocyte absolute count 39.4 against a lower limit of 50. With haemoglobin at 150 and no anaemia, indicates the marrow is producing at a rate adequate for current demand. Monitor on retest.\nHbA1c 39 mmol/mol, within normal range (below 42) but above the optimal threshold of 36. Not pre-diabetic, but worth monitoring as part of metabolic health.\nReassuring negatives: thyroid function normal with negative TPO antibodies, coeliac screen negative, PSA 0.59 with free ratio 0.83, liver function and fibrosis scores all normal, kidney function normal (combined eGFR 91), iron studies balanced, fasting glucose and HOMA-IR optimal, hsCRP below 0.5, immunoglobulins normal, rheumatoid factor negative, creatine kinase normal, urinalysis clean.","recommendations":"Discuss the lipid profile with your GP, bringing the following numbers: total cholesterol 7.3, LDL 4.33, ApoB 1.28, triglycerides 4.03, HDL 1.2. Ask whether a three-to-six-month trial of dietary and lifestyle changes (outlined in this report) is appropriate before considering medication, or whether the degree of elevation warrants earlier pharmacological intervention.\nAsk the GP to record the positive thyroglobulin antibody (7.3, limit 4.4) in your medical notes alongside the negative TPO and normal thyroid function. Request a repeat in 12 months to track the trend.\nIf brain fog and fatigue persist after implementing the lifestyle changes, ask the GP for a morning cortisol between 7 and 9 am on a non-shift day to confirm the low cortisol at 116 is timing-related rather than reflecting adrenal insufficiency.\nDiscuss the below-optimal testosterone (17.2, optimal above 18) in the context of your low libido. The GP should know you are starting resistance training and addressing sleep, and if testosterone does not improve on retest in six months, further investigation may be warranted.\nRetest in four to six months: fasting lipid profile (including ApoB and triglycerides), HbA1c, testosterone, thyroglobulin antibodies, vitamin D, B12 and a full blood count. This will show whether the lifestyle changes have moved the lipids and whether the antibody has changed. Aim for a calorie intake of approximately 2,150 to 2,350 kcal per day (maintenance for your current weight at a light activity level is around 2,400; a modest deficit supports fat loss while building muscle), with at least 107 to 132 g of protein per day (1.3 to 1.6 g per kg at your current weight).","supplementation":"Vitamin D3 (cholecalciferol), 3,000 IU daily taken with a meal containing fat. Why: your vitamin D is 72, which is sufficient but below the optimal range of 75 to 120. A dose of 3,000 IU should bring it comfortably into the optimal band within three months. Take alongside vitamin K2 below.\nVitamin K2 (MK-7), 100 mcg daily, taken at the same time as vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bone rather than into artery walls, and with your corrected calcium already at 2.56 (upper end of range), this is a sensible pairing.\nOmega-3 fish oil, 2 to 3 g of combined EPA and DHA daily, taken with food. Why: omega-3 fatty acids lower triglycerides directly, and at 4.03 your triglycerides are the most elevated marker in the report. This is one of the few supplements with strong evidence for triglyceride reduction.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 317 is within the laboratory range but below the optimal level of 500. Sublingual methylcobalamin bypasses gut absorption and is the most effective supplemental form. Optimising B12 may help with the brain fog you report.\nMagnesium glycinate, 300 mg before bed. Why: your magnesium at 0.94 is within the optimal range, but glycinate supports sleep quality and muscle recovery, both of which matter given your shift work, slow mornings and goal of building muscle. It also supports the resistance training you are about to start.\nContinue creatine monohydrate at 3 to 5 g daily. Why: creatine is well supported for muscle building and recovery, which aligns with your goals, and your creatine kinase at 132 shows no concern.\nDo not take iron supplements. Your ferritin at 164, transferrin saturation at 26 per cent and serum iron at 14.6 are all in a healthy range. Supplemental iron when stores are adequate can cause gastrointestinal problems and push ferritin above the desirable range.\nThe most important changes from this report are not supplements. They are adding resistance training twice a week, increasing daily steps, reducing refined carbohydrates to bring triglycerides down, and managing circadian disruption from shift work as far as possible through consistent light exposure and meal timing.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 52 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 52.1. Weakest systems: lipids & cardiovascular 6%, thyroid 46%, vitamins & nutrients 52%. Biggest drags: Triglycerides, LDL Cholesterol, Apolipoprotein B, Remnant Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"34.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3739","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is a composite biological age calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 34.4 against a calendar age of 41, his biological age is 6.6 years younger than his chronological age. This is a strong positive finding driven primarily by his excellent inflammatory markers (CRP below 0.5), healthy kidney function, normal blood counts and good liver function. The lipid abnormalities do not feed into PhenoAge, so while it is encouraging, it does not capture the cardiovascular risk that needs addressing.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cumulative burden of risk being built in the arteries rather than a ten-year event probability. At 70, this is well above the ideal threshold of 20 and the acceptable threshold of 40. At 41, his ten-year risk of a cardiovascular event remains statistically low because age is the dominant variable in those models, but the gap between a low ten-year risk and a high burden score is the window for acting. The inputs driving this score are the elevated ApoB (1.28), the very high triglycerides (4.03) and the below-ideal HDL (1.2). With Lp(a) normal, every component is modifiable.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1696","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme found primarily inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so the level in blood acts as a window into liver health. At 19, this is well within the optimal range for a male (below 30) and shows the liver is under no significant strain. This is a reassuring finding given the elevated triglycerides elsewhere in the report.","low_causes":"","high_causes":"Liver disease, fatty liver, hepatitis, alcohol excess, medications, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5104","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5729","units":"IU/l","description":"AST is an enzyme found in the liver, heart and muscles. It rises with liver damage, but also after intense exercise or muscle injury. At 24, this is comfortably in the middle of the reference range and within the optimal band, indicating no liver or muscle damage.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, strenuous exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1644","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.3816","units":"IU/l","description":"Gamma GT is a liver enzyme that is particularly sensitive to alcohol, medications and bile duct problems. It is often the first enzyme to rise when the liver is under metabolic stress. At 24, this is within the optimal range (below 25) and shows the liver is coping well, with no sign of alcohol-related or metabolic strain. This is a positive finding.","low_causes":"","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. Elevated levels can indicate bile duct obstruction, bone disease or liver problems. At 84, this sits comfortably within the normal and optimal range, showing healthy liver and bile duct function.","low_causes":"Zinc deficiency, malnutrition, anaemia","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Elevated bilirubin can indicate liver disease, bile duct obstruction, or a harmless inherited condition called Gilbert's syndrome. At 7, this is low within the normal range and shows efficient liver processing.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects liver synthetic function, nutritional status and immune health. At 75, this is in a healthy position within the optimal range.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and medications, and maintains fluid balance. At 44, this is within the optimal range and confirms good liver synthetic function and adequate protein intake.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/l","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies) and transport proteins. At 31, this is within the laboratory reference range but marginally above the optimal band of 20 to 30. This is not a concern, as his individual immunoglobulins are all within range and there is no sign of chronic infection or inflammation.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatitis or pancreatic disease. At 62, this is comfortably mid-range and shows healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5248","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5567","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down fats. It is the most specific blood marker for pancreatitis. At 40, this is well within the normal and optimal range, confirming healthy pancreatic function.","low_causes":"","high_causes":"Pancreatitis, pancreatic disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7059","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the combined amount of all cholesterol in the blood, including LDL (harmful), HDL (protective) and VLDL (triglyceride-carrying). At 7.3, this is significantly above the desirable threshold of 5.18. The non-HDL fraction (total minus HDL) is 6.1 against a target below 4.0, confirming that the excess is in the atherogenic (artery-damaging) fractions. This is the headline finding that needs addressing.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet high in saturated fat, obesity, hypothyroidism, genetic factors, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"4.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats in the blood that the body uses for energy. After a meal, the liver packages excess calories, particularly from carbohydrates and alcohol, into triglyceride-rich VLDL particles. At 4.03, this is more than double the fasting target of 1.7 and four times the optimal level of 1.0. Very high triglycerides drive down HDL, inflate LDL calculations, and are an independent risk factor for cardiovascular disease and pancreatitis. Diet, exercise and circadian rhythm are the primary levers to bring this down.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption","high_causes":"Diet high in refined carbohydrates, excess alcohol, obesity, insulin resistance, hypothyroidism, medications, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL is the protective cholesterol that carries excess cholesterol from artery walls back to the liver for disposal. Higher HDL is better. At 1.2, this is above the high-risk threshold of 1.04 but below the desirable level of 1.55 and well below the optimal level of 1.4. Low HDL and high triglycerides typically move together, and exercise is the most effective way to raise HDL. Adding resistance training and increasing daily steps will help this marker.","low_causes":"Sedentary lifestyle, smoking, poor diet, obesity, high triglycerides","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.33","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7217","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL is the cholesterol fraction that deposits cholesterol into artery walls, driving atherosclerosis over time. At 4.33, this is significantly above the target of 3.0 and well above the optimal level of 2.6. The Sampson calculation used by the laboratory can overestimate LDL when triglycerides are very high, but the ApoB at 1.28 independently confirms that atherogenic particle numbers are elevated. Dietary changes, particularly reducing saturated fat, increasing soluble fibre and adding omega-3, alongside exercise, are the first-line approach.","low_causes":"Hyperthyroidism, liver disease, malabsorption, very low-fat diet","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"1.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL is the lipoprotein particle the liver produces to transport triglycerides to tissues. At 1.83, this is more than double the upper limit of 0.78, reflecting the very high triglyceride level. VLDL particles are themselves atherogenic, meaning they contribute to artery wall damage. Reducing dietary refined carbohydrates and increasing physical activity will lower VLDL by reducing the triglyceride load the liver needs to export.","low_causes":"","high_causes":"High triglycerides, excess carbohydrate intake, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic fractions (LDL, VLDL, IDL and Lp(a)) in one number. At 6.1, this is significantly above the target of 4.0 and the optimal level of 3.4. This is a more complete measure of cardiovascular risk than LDL alone, especially when triglycerides are high.","low_causes":"","high_causes":"Elevated LDL, elevated triglycerides, metabolic syndrome, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6756","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio expresses how much of the total cholesterol is in the protective HDL fraction. A lower ratio is better. At 6.08 against a target below 4.5, the ratio is elevated, driven by the high total cholesterol and the below-optimal HDL. This ratio will improve as triglycerides fall (raising HDL) and dietary changes lower total cholesterol.","low_causes":"","high_causes":"Elevated total cholesterol, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is a protein that sits on the surface of every atherogenic lipoprotein particle (LDL, VLDL, IDL and Lp(a)), one molecule per particle. This makes it a direct count of the total number of particles that can deposit cholesterol into artery walls, and it is considered the single best blood marker for cardiovascular risk. At 1.28, this is above the desirable threshold of 0.9 and classified as 'high' by the laboratory. The optimal target is below 0.8. Reducing saturated fat, increasing soluble fibre (oats, beans, lentils), adding oily fish and increasing exercise are the dietary levers that lower ApoB.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"High LDL, high triglycerides, metabolic syndrome, diet high in saturated fat, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6292","lower_normal":"1.2","upper_normal":"2.1","lower_optimal":"1.4","upper_optimal":"2.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6111","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the functional capacity of the HDL system. At 1.51, this is above the desirable threshold of 1.2 and within the optimal range. This is a positive finding and suggests his HDL particles, while not numerous enough, are functionally adequate.","low_causes":"Sedentary lifestyle, smoking, poor diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6071","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is one of the best single summaries of cardiovascular risk, balancing the atherogenic particle count (ApoB) against the protective particle count (ApoA1). At 0.85, this is above the lower-risk threshold of 0.7 and approaching the higher-risk threshold of 0.9. It sits in the 'average risk' band. Reducing ApoB through diet and exercise, while maintaining or raising ApoA1 through physical activity, will bring this into the lower-risk range.","low_causes":"","high_causes":"Elevated ApoB, low ApoA1, metabolic syndrome, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"30.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4691","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a) is a genetically determined lipoprotein particle that deposits cholesterol, promotes blood clotting and drives inflammation in artery walls. Unlike LDL and triglycerides, Lp(a) levels are inherited and cannot be changed through diet, exercise or currently available medications. At 30.03, this is below the risk threshold of 32, which is genuinely useful information because it confirms the entire elevated lipid profile is driven by modifiable lifestyle factors rather than by an inherited particle. This result only needs to be measured once in a lifetime.","low_causes":"","high_causes":"Genetic inheritance (not modifiable by diet or exercise)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the level of sugar in the blood after an overnight fast. At 4.6, this is comfortably within the optimal range of 4.0 to 5.4 and well below the pre-diabetic threshold of 6.0. This shows that the body is managing blood sugar effectively despite the very high triglycerides, which is a positive dissociation.","low_causes":"Fasting, excess insulin, alcohol, liver disease","high_causes":"Diabetes, pre-diabetes, stress, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c expressed as a percentage. At 5.7 per cent, this is within the normal range (below 6.0) and right at the boundary of optimal. See the mmol/mol result below for the more detailed interpretation.","low_causes":"","high_causes":"Pre-diabetes, diabetes, high average blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated (had sugar attached to it) over the preceding two to three months, giving an average picture of blood sugar control. At 39, this is within the normal range (below 42) but above the optimal threshold of 36. It is not pre-diabetic, but it suggests that average blood sugar is slightly higher than ideal, which is consistent with a diet that includes refined carbohydrates and minimal physical activity to burn glucose. Reducing refined carbohydrate intake and adding exercise will help bring this toward the optimal range on retest.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Pre-diabetes, diabetes, high average blood sugar over 2-3 months","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin (Fasting)","group":"GLUCOSE & INSULIN","result":"3.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3706","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3066","upper_optimal_position":"0.4475","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar normal. Lower is generally better, as it indicates the body's cells are responding efficiently to insulin. At 3.43, this is in the lower part of the reference range and well within the optimal band of 2 to 8. This confirms excellent insulin sensitivity, meaning the cells are responding to small amounts of insulin. This is a genuinely positive finding, particularly given the high triglycerides, and suggests the triglyceride elevation is driven more by dietary carbohydrate load and inactivity than by metabolic insulin resistance.","low_causes":"Low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, obesity, PCOS, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.782","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2606","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is a fragment released in equal amounts to insulin when the pancreas produces it. It is a more stable measure of pancreatic insulin output because, unlike insulin, it is not cleared by the liver on first pass. At 0.782, this is below the laboratory lower limit of 1.1. However, with fasting glucose at 4.6, HbA1c at 39 and HOMA-IR at 0.7, blood sugar control is working well. A low C-Peptide alongside normal glucose and low-normal insulin simply reflects that the pancreas does not need to produce much insulin because his cells are highly sensitive to it. This is not a sign of pancreatic insufficiency.","low_causes":"High insulin sensitivity, low carbohydrate diet, prolonged fasting, sample handling delay","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP measures systemic inflammation at very low levels. It is one of the best markers for chronic low-grade inflammation, which drives cardiovascular disease, metabolic syndrome and ageing. At below 0.5 (reported as the assay's lower detection limit), this is excellent and well within the optimal range of below 1.0. There is virtually no systemic inflammation detectable in the blood.","low_causes":"","high_causes":"Infection, chronic inflammation, cardiovascular disease, obesity, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over one hour. It rises with inflammation, infection and autoimmune conditions. At 8 against a limit of 12, this is within the optimal range and shows no chronic inflammatory process.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is an electrolyte that regulates fluid balance, blood pressure and nerve function. At 142, this is comfortably within the optimal range of 136 to 143, indicating good hydration and kidney function.","low_causes":"Excess water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works with sodium and bicarbonate to maintain fluid balance, acid-base balance and proper cell function. At 95, this sits exactly on the lower boundary of the reference range and below the optimal band of 98 to 106. Borderline chloride at the lower end is usually a laboratory variation or a reflection of a mildly elevated bicarbonate (his bicarbonate is 28.6, in the upper part of its range). It is not clinically significant in isolation.","low_causes":"Vomiting, diuretics, metabolic alkalosis, adrenal insufficiency","high_causes":"Dehydration, renal tubular acidosis, excess salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"28.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6121","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a buffer that helps maintain the acid-base balance of the blood. At 28.6, this is within the laboratory range but slightly above the optimal band of 22 to 28. A mildly elevated bicarbonate alongside a low-normal chloride suggests a very mild metabolic alkalosis, which is typically not clinically significant and can reflect diet or hydration status.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease","high_causes":"Vomiting, metabolic alkalosis, diuretics, respiratory compensation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.61, this is within the reference range but slightly above the optimal band of 2.2 to 2.55, sitting in the upper part of the range. His corrected calcium at 2.56 adjusts for albumin levels and sits right at the top of the reference range. The low PTH at 0.8 is the appropriate parathyroid response to this high-normal calcium.","low_causes":"Vitamin D deficiency, parathyroid disease, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6233","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate reflection of the calcium available in the blood. At 2.56, this sits right at the upper boundary of the reference range of 2.2 to 2.6 and above the optimal band of 2.2 to 2.5. His PTH being appropriately suppressed confirms the parathyroid glands are responding correctly to this level.","low_causes":"Vitamin D deficiency, parathyroid disease, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5690","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/l","description":"Magnesium is an essential mineral involved in over 300 enzymatic reactions, including muscle contraction, nerve function, energy production and sleep regulation. At 0.94, this sits within the optimal range of 0.85 to 1.05. This is a positive finding and supports good muscle and nerve function.","low_causes":"Poor diet, alcohol excess, diuretics, stress, intense exercise","high_causes":"Kidney disease, excessive supplementation, Addison's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"309","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4405","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5221","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced naturally by the body. Elevated levels can cause gout and are associated with cardiovascular risk. At 309, this is well within the optimal range for a male (200 to 380) and shows efficient uric acid clearance by the kidneys.","low_causes":"Low purine diet, medications, liver disease","high_causes":"High purine diet (red meat, shellfish, beer), obesity, kidney disease, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"97","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6068","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism that is filtered by the kidneys. At 92, this is within the optimal range and reflects healthy kidney filtration. It can be influenced by muscle mass, creatine supplementation and meat intake; his creatine supplementation may contribute slightly to this level.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product from protein breakdown, filtered by the kidneys. At 7.8, this is within the laboratory range but slightly above the optimal band of 3.5 to 7.0. This is likely explained by his protein powder supplementation, which increases the protein load the kidneys process. With creatinine and eGFR both normal, kidney function is not in question.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7417","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from the creatinine level, age, sex and ethnicity. At 89, this is above the clinical threshold of 60 but just below the optimal level of 90. His creatine supplementation may slightly elevate creatinine and therefore slightly reduce the creatinine-based eGFR. The Cystatin C-based eGFR at 91, which is not affected by muscle mass or creatine, provides a more accurate reading and is above the optimal threshold.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"High cardiac output, pregnancy, early diabetes","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/l","description":"Cystatin C is a protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not influenced by muscle mass, diet or creatine supplementation, making it a more accurate measure of kidney function. At 0.97, this is within the optimal range and gives a Cystatin C eGFR of 91, confirming healthy kidney filtration.","low_causes":"","high_causes":"Kidney disease, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatincegfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8273","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR uses cystatin C rather than creatinine to estimate kidney filtration rate. At 91, this is above the optimal threshold of 90 and provides a more reliable estimate than the creatinine-based eGFR of 89, particularly in someone who supplements creatine. Kidney function is confirmed as healthy.","low_causes":"Kidney disease, ageing","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"150","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/L","description":"Haemoglobin is the iron-containing protein in red blood cells that carries oxygen from the lungs to the tissues. At 150, this is right in the middle of the male reference range (130 to 170) and within the optimal band, confirming good oxygen-carrying capacity and ruling out anaemia.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, smoking, altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4567","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures how many red cells are in a litre of blood. At 4.87, this is within the optimal range and shows the bone marrow is producing an adequate number of red cells.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, smoking, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.425","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.4","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.425, this is within the optimal range and indicates good blood viscosity and hydration.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"13.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4952","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"%","description":"RDW measures the variation in size of red blood cells. A higher RDW suggests a mixture of old and new cells, which can indicate iron deficiency, B12/folate deficiency or chronic disease. At 13.2, this is within the optimal range and shows the red cells are uniform in size, which is a marker of healthy red cell production.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"87.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4072","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"MCV measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency; large cells (high MCV) suggest B12 or folate deficiency. At 87.3, this is within the optimal range of 85 to 95, confirming normal red cell size and ruling out iron or B12/folate-related anaemia.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"30.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 30.8, this
