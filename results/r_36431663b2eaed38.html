<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

at the upper boundary at 58 against a limit of 60. This is not clinically significant but is worth noting for future comparison.\n\nHer thyroid is functioning well. TSH, the signal the pituitary gland sends to the thyroid telling it how hard to work, is 1.94 mIU/L, sitting within the optimal range of 1.0 to 2.5. Free T4, the inactive thyroid hormone, is 18.7 pmol/L, within the optimal band of 14 to 20. Free T3, the active form the body actually uses, is 5.0 pmol/L, within the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which effectively rules out autoimmune thyroid disease as a contributor to her hair thinning or fatigue. This is useful information to have.\n\nHer blood sugar regulation is well controlled. HbA1c, which reflects average blood sugar over the past three months, is 35 mmol/mol, within the optimal range below 36. Fasting glucose can be inferred from the insulin and HOMA calculations and is clearly healthy given the HbA1c. Her fasting insulin at 2.75 mIU/L sits just inside the lower end of the laboratory range and within the optimal band of 2 to 8, reflecting very good insulin sensitivity. Her C-Peptide, which the lab returned at 0.689 ug/L (equivalent to approximately 228 pmol/L), is below the laboratory range of 1.1 to 4.4 ug/L. C-Peptide is produced by the pancreas in a one-to-one ratio with insulin, so a low C-Peptide alongside a low-normal insulin simply confirms that the pancreas is not being asked to produce much insulin because blood sugar is well controlled. This is consistent with good insulin sensitivity rather than pancreatic insufficiency, particularly given her healthy HbA1c. The HOMA-IR, which estimates insulin resistance, calculates to a very favourable value in her case.\n\nTurning to the findings most relevant to her symptoms, her iron studies tell an important story. Her ferritin, the body's iron storage protein, is 32 ng/mL. While this sits within the broad laboratory range of 10 to 291, it is below the 40 optimal threshold for women and is low enough to contribute to both hair shedding and fatigue. Hair follicles are among the most rapidly dividing cells in the body and are sensitive to iron depletion well before ferritin drops low enough to cause anaemia. Her serum iron at 27.9 umol/L and transferrin saturation at 45.53% are actually healthy, which is somewhat paradoxical alongside the low ferritin. Her transferrin, the transport protein that carries iron through the blood, is marginally below range at 2.44 g/L against a lower limit of 2.5. Transferrin often rises when iron stores are low as the body tries to capture more iron, so seeing it slightly low rather than elevated is unexpected. One explanation is that the HRT and testosterone therapy are influencing protein synthesis; another is that the irregular prolonged bleeding she describes is depleting stored iron faster than the body can replenish it from dietary intake, while her circulating iron remains adequate in the short term. The low ferritin is very likely a significant contributor to her hair thinning, and building stores back above 50 to 70 ng/mL should be a priority.\n\nHer reticulocyte count supports this picture. Reticulocytes are young red blood cells freshly released from the bone marrow, and her absolute reticulocyte count is 25.11 x10^9/L against a lower limit of 50. This is notably low and suggests the bone marrow is not producing red blood cells at the rate it should. In the context of low ferritin and ongoing menstrual blood loss, the most likely explanation is that iron stores have fallen to a level where the bone marrow cannot sustain a higher production rate. Her haemoglobin at 145 g/L is still strong, sitting in the upper half of the female range, so she is not anaemic yet, but the low reticulocyte count is an early signal that iron-limited erythropoiesis may be developing. This reinforces the need to build ferritin stores.\n\nHer hormone profile reflects her current HRT and testosterone replacement. Her testosterone at 3.4 nmol/L is above the standard female reference range of 0.5 to 2.6, which is expected given that she is on TRT. Her Free Androgen Index at 3.79 is within the female range of 0.5 to 6.5. Her DHEA-S at 3.3 umol/L (approximately 1,216 ug/dL) is within range. Her SHBG, sex hormone binding globulin which is the protein that binds testosterone and oestradiol making them unavailable to tissues, is 89.6 nmol/L. This is within range but sits in the upper half, meaning a meaningful proportion of her total testosterone is being bound rather than remaining free. Her calculated free testosterone is 0.03 nmol/L, which is low, and this is being driven by the high SHBG. The combination of elevated total testosterone with low free testosterone and high SHBG is worth discussing with her HRT prescriber, as the biologically active fraction may not be reaching the tissues at the level intended. This could also be contributing to the hair thinning if the TRT was partly prescribed to support hair follicle health, although paradoxically, excess free androgens can also drive hair shedding at the scalp in women who are sensitive to dihydrotestosterone. The balance here is nuanced and her prescriber is best placed to assess it.\n\nHer oestradiol at 574 pmol/L sits above the follicular range and within the luteal and midcycle ranges, consistent with HRT supplementation. Her progesterone at 1.27 nmol/L is consistent with a follicular phase reading, and given the irregular bleeding she describes from the progesterone component of her HRT, this may simply reflect the timing of the blood draw relative to her HRT cycle rather than true progesterone insufficiency. Her LH at 5.3 and FSH at 9.68 are both within the follicular reference ranges and are not in the postmenopausal bracket, suggesting her HRT is effectively suppressing the menopausal hormone pattern. Her prolactin at 404 uIU/mL is within range.\n\nHer cortisol at 618 nmol/L sits right at the upper boundary of the morning reference range of 145.4 to 619.4. While technically within range if drawn in the 7 to 9am window, it is at the ceiling and is flagged as abnormal by the lab. The most likely explanation is her ADHD medication, as stimulant medications such as methylphenidate and lisdexamfetamine activate the sympathetic nervous system and can elevate cortisol. Chronically elevated cortisol can contribute to hair shedding, sleep disruption, and digestive discomfort, all of which she reports. This is worth mentioning to both her GP and her ADHD prescriber to ensure the cortisol response is monitored over time.\n\nHer magnesium at 1.12 mmol/L is marginally above the laboratory upper limit of 1.11. This is so close to the boundary that it is almost certainly within normal physiological variation and is not clinically significant. Her corrected calcium at 2.29 is within range, her PTH at 1.4 is within range, and her vitamin D at 95 nmol/L is within the optimal band of 75 to 120. Her B12 at 300 pg/mL is within the laboratory range but below the optimal threshold of 500, and given that adequate B12 is important for red blood cell production and neurological function, a gentle increase through sublingual supplementation would be sensible. Her folate at 15 ng/mL is good and well above the optimal threshold of 8.\n\nHer kidney function shows an eGFR of 72 by creatinine and a Cystatin C eGFR of 74. These are both above the 60 threshold that defines chronic kidney disease, but they are below the 90 threshold that would be considered fully optimal for a 43-year-old. Cystatin C is a more reliable marker of kidney filtration than creatinine because it is not influenced by muscle mass, diet, or exercise, so the fact that both methods agree at around 72 to 74 gives confidence in the result. This is not alarming at 43, as there is a wide range of normal kidney function, but it is worth establishing as a baseline and repeating in 12 months to ensure it remains stable. Her uric acid at 202 umol/L is within range. Her urinalysis is clean, with no protein, no glucose, no blood, and no white cells, which is reassuring for kidney health.\n\nHer immune markers are all within range. IgG, IgA, IgM, and IgE are healthy, rheumatoid factor is negative, and her coeliac screen (tissue transglutaminase IgA) is negative. Her tumour markers are reassuring, with CA-125 at 22.4 within range, CA 19-9 at 15.26 within range, and CEA below 0.5. CA 15-3 is noted as to follow and should be checked when the result arrives. Her total antioxidant activity at 1.42 is within range.\n\nHer full blood count is largely healthy. Her haemoglobin, red cell count, haematocrit, and platelet count are all within range. Her white cell count at 4.48 is within range, and her differential including neutrophils, lymphocytes, monocytes, eosinophils, and basophils are all within their respective ranges. Her MCHC at 349 g/L is marginally above the upper limit of 345. At this margin it is not a concern on its own. Her creatine kinase at 130 is comfortably within the female range, reflecting normal muscle recovery from her training.\n\nIn summary, the key findings from this report are the elevated Lp(a) which should be recorded permanently and discussed with her GP, the low ferritin which is the most likely driver of her hair shedding and which needs to be corrected through supplementation, the low absolute reticulocytes which reflect early iron-limited red cell production, the borderline cortisol which may be ADHD medication-related and could be contributing to symptoms, and the kidney function which is adequate but should be tracked over time. Her cardiovascular profile aside from Lp(a) is exceptional, her liver, thyroid, blood sugar regulation, and inflammation are all excellent, and her HRT appears to be maintaining pre-menopausal hormone levels effectively, though the free testosterone question is worth raising with her prescriber.\n\nLate-arriving results: Bacterial Count: 10^5; Urine Culture and Sensitivities: Significant growth of Enterococcus faecalis. Your urine culture showed significant growth of Enterococcus faecalis. This is worth showing to your GP, who can decide whether any treatment is needed, particularly if you have urinary symptoms. Still awaited from the laboratory: CA 15-3.","links":"Marny's most actionable priorities from this report centre on iron repletion, cardiovascular risk management in the context of her inherited Lp(a), and working with her prescribers to optimise her HRT and ADHD medication.\n\nFor iron repletion, her ferritin at 32 needs to rise to at least 50, and ideally to 70 or above, to support hair regrowth and healthy red blood cell production. Given the prolonged irregular bleeding from her HRT, dietary iron alone is unlikely to be sufficient. She should take ferrous bisglycinate 25mg on alternate days with a source of vitamin C such as a small glass of orange juice to enhance absorption. Alternate-day dosing has been shown to improve absorption compared with daily dosing because the hormone hepcidin, which regulates iron uptake, rises after an iron dose and temporarily blocks absorption. She should avoid taking iron within two hours of tea, coffee, or calcium-rich foods. A retest of ferritin and a full blood count including reticulocytes in three to four months will show whether stores are building. If ferritin has not risen meaningfully despite supplementation, her GP should consider investigating for occult blood loss or malabsorption.\n\nFor her Lp(a), the key conversation with her GP should include the following points: Lp(a) is 159.67 nmol/L, placing her in the moderate risk category; this is genetically determined and will not change with lifestyle; every other modifiable risk factor should be optimised; her current lipid profile is otherwise excellent with ApoB 0.79, HDL 2.2, and triglycerides 0.81; she should have Lp(a) recorded permanently in her medical notes; and first-degree relatives should be offered testing. There are currently no licensed medications that specifically lower Lp(a) in the UK, though clinical trials of antisense oligonucleotides are underway. The practical strategy is to keep every other risk factor as clean as possible, which she is already doing impressively well.\n\nFor calorie and protein targets, at 66.7kg with four training sessions per week and 7,500 to 10,000 daily steps, her maintenance calories sit at approximately 1,950 to 2,100 per day using a moderate activity multiplier of 1.6 applied to an estimated basal metabolic rate of around 1,280. Her diet volume is rated 5 out of 10, which suggests she may be under-eating. Given that she is not trying to lose weight and her BMI is 25.2, she should aim for the full maintenance range of 1,950 to 2,100 calories. Under-eating with ongoing blood loss and training demands is a recipe for continued iron depletion and hair shedding. Her protein target should be 1.4 to 1.6g per kilogram, giving a range of 93 to 107g of protein per day. Protein is essential for hair follicle keratin production, red blood cell synthesis, and muscle recovery from resistance training.\n\nFor her B12 at 300, which is within the laboratory range but below the optimal threshold of 500, sublingual methylcobalamin 1,000mcg daily would be appropriate. Sublingual delivery bypasses the digestive tract and is more reliably absorbed than oral tablets.\n\nFor her kidney function, the eGFR of 72 to 74 should be discussed with her GP as a baseline. It does not require treatment at present, but a repeat Cystatin C eGFR in 12 months would confirm stability. She should ensure she stays well hydrated, particularly around training, and her GP should be aware if she is prescribed any nephrotoxic medications in the future.\n\nFor her digestive symptoms, the bloating she reports could have several contributors. Her coeliac screen is negative, which rules out coeliac disease. Possible contributors include the progesterone component of her HRT, which can slow gut motility and cause bloating, and her ADHD medication, which can affect appetite patterns and meal timing. Practical steps include eating at regular intervals rather than skipping meals and then eating large volumes, incorporating fermented foods such as natural yoghurt, kefir, or sauerkraut for gut microbiome support, ensuring adequate fibre from vegetables, fruits, and whole grains aiming for 25 to 30g per day, and chewing food thoroughly. If bloating persists despite these measures, a hydrogen breath test through her GP could assess for small intestinal bacterial overgrowth.\n\nFor cortisol, she should mention the 618 nmol/L result to both her GP and her ADHD prescriber. If the blood was drawn in the morning window, this sits right at the ceiling. Monitoring over time will clarify whether this is a transient effect of the new medication or a sustained elevation. Stress management practices such as maintaining a consistent sleep schedule, limiting caffeine after midday especially on stimulant medication, and incorporating brief breathing exercises can help modulate cortisol.\n\nFor her HRT prescriber specifically, the points to raise are: total testosterone is 3.4 nmol/L which is above the standard female range as expected on TRT, but SHBG is 89.6 nmol/L and calculated free testosterone is only 0.03 nmol/L, suggesting that much of the administered testosterone is being bound. The prescriber may wish to consider whether the TRT dose or delivery method needs adjustment. The ongoing irregular bleeding and low progesterone level at the time of testing should also be reviewed in the context of the HRT regimen.\n\nFor retesting, we would recommend repeating the following markers in three to four months: ferritin, full blood count with reticulocytes, iron studies, B12, cortisol (morning, timed to the same window), and free testosterone with SHBG. A Cystatin C eGFR should be repeated in 12 months.","flags":"CARDIOVASCULAR: Lp(a) 159.67 nmol/L (limit below 32). Genetically determined, moderate risk category. All other lipid markers are within optimal ranges. Should be recorded permanently in medical notes. First-degree relatives should be offered testing. GP to assess overall cardiovascular risk score incorporating this fixed risk factor.\n\nIRON AND HAEMATOLOGY: Ferritin 32 ng/mL, below optimal threshold of 40 for women, in the context of prolonged irregular menstrual bleeding from HRT. Absolute reticulocytes 25.11 x10^9/L (range 50 to 100), indicating reduced red blood cell production likely secondary to low iron stores. Haemoglobin 145 g/L remains robust. Transferrin 2.44 g/L marginally below range of 2.5. Transferrin saturation 45.53% is adequate. Pattern suggests early iron-limited erythropoiesis. Recommend iron supplementation and retest in 3 to 4 months.\n\nENDOCRINE: Cortisol 618 nmol/L at upper boundary of morning range (145.4 to 619.4). Patient recently started ADHD medication which may elevate cortisol. Recommend monitoring. Testosterone 3.4 nmol/L above female range (0.5 to 2.6), expected on TRT. SHBG 89.6 nmol/L with calculated free testosterone 0.03 nmol/L suggests high binding. HRT prescriber to review.\n\nMETABOLIC: C-Peptide 0.689 ug/L (228 pmol/L), below range of 1.1 to 4.4 ug/L. In context of low-normal insulin (2.75 mIU/L) and healthy HbA1c (35 mmol/mol), this reflects low insulin demand rather than pancreatic pathology.\n\nKIDNEY: eGFR 72 (creatinine) and 74 (Cystatin C). Above 60 threshold but below 90 optimal. Should be established as baseline and repeated in 12 months.\n\nMINOR: MCHC 349 g/L marginally above 345, not a concern on its own. Magnesium 1.12 marginally above 1.11, not clinically significant.\n\nThe urine culture result has now arrived: significant growth of Enterococcus faecalis.\n\nReassuring negatives: Thyroid function and antibodies normal, coeliac screen negative, rheumatoid factor negative, all tumour markers within range, CRP 0.3, ESR 1, liver function excellent, HbA1c optimal, urinalysis clean.","recommendations":"1. Begin iron supplementation with ferrous bisglycinate 25mg on alternate days taken with vitamin C to rebuild ferritin stores above 50 to 70 and support hair regrowth and reticulocyte production.\n\n2. Discuss Lp(a) result of 159.67 nmol/L with GP for permanent medical record entry and cardiovascular risk assessment. Offer Lp(a) testing to first-degree relatives.\n\n3. Discuss free testosterone level and SHBG of 89.6 with HRT prescriber to assess whether the biologically active fraction of testosterone is reaching target levels.\n\n4. Mention cortisol of 618 to both GP and ADHD prescriber for monitoring in the context of recently started stimulant medication.\n\n5. Increase daily calorie intake to 1,950 to 2,100 calories with 93 to 107g of protein per day. Under-eating alongside ongoing blood loss and training is likely contributing to low iron stores and hair shedding.\n\n6. Begin sublingual methylcobalamin 1,000mcg daily to bring B12 from 300 toward the optimal range above 500.\n\n7. Discuss eGFR of 72 to 74 with GP to establish as baseline and plan repeat Cystatin C eGFR in 12 months.\n\n8. For bloating, eat at regular intervals, increase dietary fibre gradually to 25 to 30g per day, include fermented foods, and discuss possible gut motility effects of progesterone component of HRT with prescriber.\n\n9. Limit caffeine intake after midday, particularly on ADHD medication days, to support cortisol regulation and sleep quality.\n\n10. Retest in 3 to 4 months: ferritin, full blood count with reticulocytes, iron studies, B12, cortisol (timed morning draw), free testosterone, and SHBG.","supplementation":"Iron: Ferrous bisglycinate, 25mg on alternate days, taken with a source of vitamin C such as a small glass of orange juice or a few strawberries. Take on an empty stomach or with a light meal, avoiding tea, coffee, dairy, and calcium supplements within two hours. Alternate-day dosing improves absorption by allowing the iron-regulating hormone hepcidin to reset between doses. The goal is to raise ferritin from 32 to above 50 to 70 ng/mL to support hair follicle cycling and red blood cell production. Once ferritin reaches 70, switch to maintenance through dietary iron and retest every six months given her ongoing menstrual losses.\n\nVitamin B12: Sublingual methylcobalamin, 1,000mcg daily, dissolved under the tongue. Sublingual delivery bypasses the digestive tract and avoids any absorption issues. Her current level of 300 pg/mL is adequate to prevent deficiency but below the 500 optimal threshold associated with best neurological function and red cell support.\n\nVitamin D3: Her current level of 95 nmol/L is within the optimal band of 75 to 120, so she is doing well here. A maintenance dose of 1,000 to 2,000 IU daily of cholecalciferol taken with a meal containing fat will maintain this level through the autumn and winter months when UVB exposure declines.\n\nVitamin K2: MK-7 form, 100mcg daily, taken alongside vitamin D3. Vitamin K2 directs calcium into bones and teeth rather than soft tissues and arterial walls, complementing vitamin D's role in calcium absorption.\n\nMagnesium: Her magnesium is at the top of range at 1.12, so supplementation is not essential. However, if she experiences sleep difficulty or muscle tension, magnesium glycinate 200 to 300mg before bed is a well-tolerated option that supports sleep quality and muscle recovery.\n\nOmega-3: Given her elevated Lp(a) and the importance of keeping every modifiable cardiovascular risk factor optimal, a high-quality fish oil providing 2g of combined EPA and DHA daily would support anti-inflammatory pathways and endothelial function. This does not lower Lp(a) but contributes to the overall cardiovascular risk reduction strategy.\n\nThe most important changes from this report are not supplements. They are increasing her overall food intake to match her training and metabolic demands, discussing her Lp(a) and free testosterone levels with the appropriate clinicians, and ensuring her iron stores are rebuilt to support hair regrowth and healthy blood cell production.","biomarkers":[{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"145","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"155","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.7222","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Marny's level of 145 g/L is in the upper portion of the healthy female range, which is reassuring given her ongoing irregular bleeding. It confirms she is not anaemic despite her low ferritin, though the low reticulocyte count suggests the bone marrow may be beginning to struggle to maintain this level.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"red_blood_count","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6167","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6889","units":"x10^12/L","description":"Red blood cells carry oxygen throughout the body. Marny's count of 4.65 is healthy and within the optimal range, reflecting adequate red cell production at present despite the early signs of iron-limited erythropoiesis seen in her reticulocyte count.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Dehydration, polycythaemia vera, testosterone use, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.415","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6233","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Marny's value of 0.415 sits in the middle of the healthy range, indicating a good balance between red cells and plasma volume.","low_causes":"Anaemia, overhydration, blood loss, bone marrow failure","high_causes":"Dehydration, polycythaemia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"11.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3611","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"%","description":"RDW measures the variation in size among red blood cells. A higher value suggests a mix of older and newer cells of different sizes, which can indicate iron or vitamin deficiency. Marny's value of 11.8% is near the lower end of range, indicating uniform red cell size and no current sign of mixed deficiency affecting cell production.","low_causes":"Generally not clinically significant when low","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, reticulocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name" imal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within red blood cells. Marny's value of 349 g/L is marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and storage conditions during sample transport. At this margin it does not indicate any underlying condition.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, sample artefact from temperature or storage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"223","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4141","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot and repair damaged blood vessels. Marny's count of 223 is healthy and well within the optimal range, indicating normal clotting function.","low_causes":"Viral infections, bone marrow disorders, medications, autoimmune conditions","high_causes":"Iron deficiency, infection, inflammation, post-surgery, essential thrombocythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. Marny's MPV of 8.8 fL is well within range, suggesting normal platelet production and turnover.","low_causes":"Bone marrow suppression, certain inflammatory conditions","high_causes":"Increased platelet destruction or consumption, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"white_blood_count","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4133","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the body's immune defenders. Marny's total count of 4.48 is within the laboratory range but sits just below the optimal threshold of 4.5. This is not concerning on its own and is a common finding in lean, active women. It suggests a calm immune system with no active infection or inflammation, consistent with her very low CRP and ESR.","low_causes":"Viral infection, autoimmune conditions, bone marrow suppression, medications, under-eating","high_causes":"Bacterial infection, inflammation, stress, corticosteroid use, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3613","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. Marny's count of 2.14 is within the laboratory range but below the optimal threshold. In the context of her overall healthy immune profile and very low inflammation, this likely reflects a constitutionally lean immune system rather than any pathology.","low_causes":"Viral infections, medications, autoimmune conditions, nutritional deficiency, benign ethnic neutropenia","high_causes":"Bacterial infection, inflammation, stress, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5117","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including producing antibodies and fighting viral infections. Marny's count of 2.07 is healthy and within the optimal range.","low_causes":"Viral infections (including HIV), corticosteroid use, autoimmune conditions, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest pathogens and cellular debris, and play a role in tissue repair. Marny's count of 0.22 is within the laboratory range, sitting near the lower end. This is not concerning and reflects a quiet immune system.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic infections, autoimmune disease, inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Marny's low count of 0.03 is normal and indicates no active allergic or parasitic response.","low_causes":"Generally not clinically significant","high_causes":"Allergies, asthma, parasitic infections, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and are involved in allergic and inflammatory responses. Marny's count of 0.02 is at the lower boundary of normal, which is typical and entirely healthy.","low_causes":"Generally not clinically significant","high_causes":"Allergic reactions, chronic myeloid leukaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_percentage","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.7","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage indicates the proportion of total red cells that are newly made. Marny's value of 0.54% is just inside the laboratory range but below optimal levels, consistent with early iron-limited red cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease, aplastic anaemia","high_causes":"Recovery from blood loss, haemolytic anaemia, response to iron/B12 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"25.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1674","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells being released by the bone marrow. Marny's count of 25.11 is notably below the lower limit of 50, indicating that red blood cell production is running at roughly half the expected rate. In the context of her low ferritin and ongoing menstrual blood loss, this strongly suggests that iron stores have fallen to a level where the bone marrow cannot sustain adequate production. This is the earliest measurable sign of iron-limited erythropoiesis, occurring before the haemoglobin itself begins to drop.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, aplastic anaemia, chronic kidney disease","high_causes":"Recovery from blood loss, haemolytic anaemia, response to supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"","upper_normal":"12","lower_optimal":"","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"mm/hour","description":"ESR measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates inflammation. Marny's ESR of 1 mm/hour is exceptionally low, confirming the absence of any systemic inflammatory process. Together with her CRP of 0.3, this paints a picture of remarkably low background inflammation.","low_causes":"Generally reflects good health with no active inflammation","high_causes":"Infection, autoimmune disease, malignancy, anaemia, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"45.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5809","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5289","units":"%","description":"Transferrin saturation measures the percentage of iron-carrying capacity currently being used. Marny's level of 45.53% is within the laboratory range and above the 40% optimal ceiling but still well within normal limits. This indicates that circulating iron is adequate and the transport system is well supplied, even though stored iron (ferritin) is low. This is a snapshot of current iron availability in the blood rather than a reflection of total body stores.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, haemolytic anaemia, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"27.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6262","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3737","upper_optimal_position":"0.6291","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. Marny's level of 27.9 umol/L is in the upper portion of the healthy range. While this is a good sign for immediate iron availability, serum iron fluctuates significantly throughout the day and after meals, so ferritin is the more reliable indicator of overall iron status.","low_causes":"Iron deficiency, chronic disease, blood loss, malabsorption","high_causes":"Haemochromatosis, iron overload, liver damage, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2897","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. The body typically increases transferrin production when iron stores are low, as a way of trying to capture and deliver more iron. Marny's transferrin is marginally below range at 2.44 g/L against a lower limit of 2.5. This is somewhat unexpected given her low ferritin, as transferrin would normally be expected to rise in response to depleted stores. One possible explanation is that her HRT or TRT is influencing hepatic protein synthesis. Transferrin is also a negative acute phase reactant, meaning it can fall during inflammation, but her CRP is exceptionally low so this is unlikely. The finding is minor and should be tracked on retest alongside ferritin.","low_causes":"Iron overload, liver disease, inflammation, nephrotic syndrome, malnutrition, hormonal influences","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron_binding_capacity","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"56.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6042","units":"umol/L","description":"TIBC reflects the total capacity of the blood to transport iron, which is closely related to transferrin levels. Marny's TIBC of 56.8 umol/L is healthy and mid-range, consistent with adequate iron transport capacity.","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3595","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3654","upper_optimal_position":"0.4840","units":"ng/mL","description":"Ferritin is the body's iron storage protein, and is the single most useful marker of total body iron reserves. Marny's level of 32 ng/mL is within the very broad laboratory range of 10 to 291 but falls below the optimal threshold of 40 for women. At this level, iron stores are low enough at the lower edge of the optimal range and well within normal limits.","low_causes":"Vomiting, diuretics, metabolic alkalosis, Addison's disease","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3970","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is the body's main buffer against acid, helping to maintain blood pH within the narrow range needed for normal cellular function. Marny's level of 20.7 mmol/L is just within the laboratory range but below the optimal threshold of 22. A slightly low bicarbonate can reflect mild metabolic acidosis, which can be associated with high-protein diets, intense exercise, or simply dietary variation. It is not clinically significant in isolation but is worth noting for completeness.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, intense exercise, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretic use, excessive antacid intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6193","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. Marny's level of 5.4 mmol/L is healthy and within the optimal range, indicating normal protein metabolism and kidney clearance.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6260","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from normal muscle metabolism, filtered by the kidneys. Marny's level of 85 umol/L is within the laboratory range but toward the upper end for a woman. Creatinine is influenced by muscle mass and diet, and can sit slightly higher in women who resistance train. The more important metric is the eGFR derived from creatinine and the Cystatin C eGFR, which both agree at around 72 to 74.","low_causes":"Low muscle mass, malnutrition","high_causes":"Reduced kidney function, dehydration, high meat intake, intense exercise, high muscle mass","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood. A value above 90 is considered fully optimal, while above 60 is the threshold for normal function. Marny's creatinine-based eGFR of 72 is above the 60 threshold but below the 90 optimal target. This is corroborated by her Cystatin C-based eGFR of 74, which is important because Cystatin C is not influenced by muscle mass or diet, giving a more reliable estimate. Both methods agreeing at this level provides confidence in the result. At 43, this is worth establishing as a baseline and repeating in 12 months. It does not indicate kidney disease but warrants monitoring.","low_causes":"Chronic kidney disease, dehydration, nephrotoxic medications, diabetes, hypertension","high_causes":"Hyperfiltration in early diabetes, pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"Cystatin C eGFR provides a more accurate estimate of kidney filtration than creatinine-based eGFR because Cystatin C is produced by all cells at a constant rate and is not influenced by muscle mass, diet, or exercise. Marny's value of 74 agrees closely with her creatinine-based eGFR of 72, confirming that kidney filtration is above the 60 threshold for normal function but below the 90 optimal target. This should be recorded as a baseline.","low_causes":"Chronic kidney disease, nephrotoxic drugs, diabetes, hypertension","high_causes":"Hyperfiltration, high thyroid function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"202","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3398","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3076","upper_optimal_position":"0.4886","units":"umol/L", cription":"The FIB-4 score is a calculated index that estimates liver fibrosis (scarring) using age, ALT, AST, and platelet count. A score below 1.3 in someone under 65 is very reassuring and suggests no significant liver fibrosis. Marny's score of 0.96 is well below this threshold, confirming a healthy liver.","low_causes":"Young age, healthy liver, low ALT/AST, high platelets","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2763","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4474","units":"IU/L","description":"Gamma GT is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct issues, and metabolic stress. It is often the first enzyme to rise when the liver is under strain. Marny's GGT of 21 IU/L is well within the optimal range for women (below 25), indicating the liver is handling its metabolic load comfortably with no sign of biliary or alcohol-related stress.","low_causes":"Generally not clinically significant","high_causes":"Alcohol consumption, bile duct disease, fatty liver, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3902","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme that breaks down starch and is produced mainly
