ol/L is low and healthy, consistent with her excellent triglyceride level.","low_causes":"Generally reflects healthy lipid metabolism","high_causes":"High triglycerides, obesity, diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7097","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective cholesterol fraction that removes excess cholesterol from artery walls and carries it back to the liver for disposal. Marny's HDL of 2.2 mmol/L is exceptionally high, well above the 1.6 optimal threshold for women. This provides significant cardiovascular protection and contributes to her excellent ApoB/A-I ratio. High HDL is partly genetic and partly driven by regular exercise.","low_causes":"Sedentary lifestyle, obesity, smoking, high-sugar diet, metabolic syndrome","high_causes":"Regular exercise, genetics, moderate alcohol intake, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4627","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5067","units":"mmol/L","description":"LDL carries cholesterol from the liver to the tissues and is the primary atherogenic lipoprotein, meaning it can deposit cholesterol into artery walls. Marny's LDL of 2.46 mmol/L is within the optimal range below 2.6. In the context of her elevated Lp(a), keeping LDL as low as possible is particularly important to minimise the combined atherogenic burden.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2522","lower_normal":"","upper_normal":"4.5","lower_optimal":"","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a useful summary of cardiovascular risk. Lower values indicate a more favourable balance between total and protective cholesterol. Marny's ratio of 2.27 is excellent, well below the 4.5 threshold and even below the optimal 3.5 target, driven by her exceptionally high HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7333","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"This shows the proportion of total cholesterol made up by HDL. A higher percentage is protective. Marny's HDL makes up 44% of her total cholesterol, which is exceptionally high and reflects excellent cardiovascular protection.","low_causes":"Low HDL relative to total cholesterol","high_causes":"High HDL, low LDL","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"","upper_normal":"4","lower_optimal":"","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol, capturing all the potentially atherogenic lipoproteins (LDL, VLDL, and remnants) in one number. Marny's non-HDL of 2.8 mmol/L is well within the optimal range below 3.2, confirming a low atherogenic burden.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"High LDL, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5429","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Higher levels reflect more protective HDL particles in circulation. Marny's ApoA1 of 1.52 g/L is above the 1.4 threshold, consistent with her high HDL cholesterol and contributing to her excellent ApoB/A-I ratio.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic factors","high_causes":"Regular exercise, genetics, oestrogen, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4389","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on LDL, VLDL, and Lp(a) particles. Each atherogenic particle carries exactly one ApoB molecule, making it the most accurate count of potentially harmful particles in the blood. Marny's ApoB of 0.79 g/L is below the 0.9 desirable limit and even below the stricter 0.8 optimal target. This is an excellent result, particularly important given her elevated Lp(a), as it confirms that the number of atherogenic particles from modifiable sources is well controlled.","low_causes":"Low LDL, malnutrition, hyperthyroidism","high_causes":"High LDL, familial hypercholesterolaemia, diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"","upper_normal":"0.6","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA-I ratio is considered the single best summary metric of cardiovascular lipid risk, balancing the atherogenic particles (ApoB) against the protective ones (ApoA-I). A ratio below 0.6 in women indicates lower risk. Marny's ratio of 0.52 is well within the lower risk bracket, reflecting the excellent balance between her low ApoB and high ApoA-I.","low_causes":"High ApoA-I, low ApoB, regular exercise","high_causes":"High ApoB, low ApoA-I, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"159.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a specialised lipoprotein particle that is almost entirely determined by genetics. It cannot be meaningfully lowered through diet, exercise, or most currently available medications. Marny's Lp(a) of 159.67 nmol/L is well above the 32 nmol/L threshold and places her in the moderate risk category (90 to 200 nmol/L). Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clot formation by interfering with the body's clot-dissolving pathway (the plasminogen system), and it drives inflammation at the vessel wall. This result should be recorded permanently in her medical notes, as it only needs to be measured once. First-degree relatives should be offered testing because the trait is inherited. The practical response is to keep every modifiable risk factor, including LDL, ApoB, blood pressure, inflammation, and blood sugar, as low as possible. On this front, Marny is already in an excellent position.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited trait), not modifiable by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"","upper_normal":"6.0","lower_optimal":"","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar levels over the past two to three months. Marny's HbA1c of 5.4% is well within the normal range and within the optimal zone below 5.5%, confirming excellent long-term blood sugar control.","low_causes":"Hypoglycaemia, haemolytic anaemia, blood loss, recent transfusion","high_causes":"Diabetes, pre-diabetes, insulin resistance, high-sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Marny's value of 35 mmol/mol is within the optimal range below 36, confirming healthy blood sugar regulation with no suggestion of pre-diabetes.","low_causes":"Hypoglycaemia, haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"2.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3378","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3933","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas needs to produce to keep blood sugar normal after an overnight fast. Lower levels generally indicate better insulin sensitivity, meaning the body responds efficiently to small amounts of insulin. Marny's insulin of 2.75 mIU/L is at the low end of the laboratory range and within the optimal band of 2 to 8, reflecting excellent insulin sensitivity. The pancreas is achieving healthy blood sugar levels with very little insulin output, which is a strong metabolic positive.","low_causes":"Excellent insulin sensitivity, low-carbohydrate diet, type 1 diabetes (with elevated glucose)","high_causes":"Insulin resistance, metabolic syndrome, obesity, PCOS, high-carb diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.689","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1569","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5152","units":"ug/L","description":"C-Peptide is a fragment released by the pancreas in equal amounts to insulin. It provides a stable measure of insulin production because it is not cleared by the liver as quickly as insulin. Marny's C-Peptide of 0.689 ug/L (equivalent to approximately 228 pmol/L) is below the laboratory range of 1.1 to 4.4. In the context of her healthy HbA1c of 35 and low-normal fasting insulin, this reflects low insulin demand from excellent insulin sensitivity rather than pancreatic insufficiency. This does not require clinical action but should be interpreted alongside the overall metabolic picture, which is healthy.","low_causes":"Low insulin demand (insulin sensitivity), type 1 diabetes (with elevated glucose), sample degradation","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0300","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is the most widely used marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Levels below 1.0 mg/L indicate low cardiovascular and inflammatory risk. Marny's CRP of 0.3 mg/L is exceptionally low, confirming minimal background inflammation. This is a genuinely positive finding that supports cardiovascular health and suggests no hidden inflammatory process.","low_causes":"Good health, low inflammatory burden","high_causes":"Infection, autoimmune disease, obesity, cardiovascular risk, metabolic syndrome, chronic stress","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5140","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3743","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone health, nerve signalling, muscle contraction, and blood clotting. Marny's calcium of 2.39 mmol/L is healthy and mid-range, indicating well-regulated calcium metabolism.","low_causes":"Vitamin D deficiency, parathyroid disorders, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium value for the albumin level, providing a more accurate picture of biologically active calcium. Marny's corrected calcium of 2.29 mmol/L is within range and healthy ulation. Marny's level of 95 nmol/L is within the optimal range of 75 to 120, which is excellent and suggests she is either supplementing or getting good sun exposure. Maintaining this level through the darker months with a maintenance dose of vitamin D3 is important.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption, winter months","high_causes":"Excess supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4449","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5387","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate balance. It rises when calcium or vitamin D is low. Marny's PTH of 1.4 pmol/L is in the lower portion of the range, which is consistent with her good vitamin D and healthy calcium levels. The parathyroid glands are not being pushed to work hard, which is the ideal scenario.","low_causes":"Hypoparathyroidism, excess calcium or vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, low calcium, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"300","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3692","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.5811","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. Marny's B12 of 300 pg/mL is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Suboptimal B12 can contribute to fatigue, brain fog, and poor red blood cell production, and given her already low reticulocyte count, ensuring B12 is in the optimal range would support the bone marrow's ability to produce healthy red blood cells. Sublingual methylcobalamin supplementation is recommended.","low_causes":"Vegan/vegetarian diet, malabsorption, pernicious anaemia, metformin use, aging","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) works alongside B12 in DNA synthesis and red blood cell production. Marny's folate of 15 ng/mL is healthy and well within the optimal range above 8, indicating good dietary intake of leafy greens, legumes, or fortified foods.","low_causes":"Poor diet, malabsorption, alcohol, medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, high folate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5595","units":"pmol/L","description":"Free T4 is the inactive thyroid hormone that circulates in the blood and is converted into the active form, T3, in tissues. Marny's FT4 of 18.7 pmol/L is within the optimal band of 14 to 20, indicating healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary dysfunction, sick euthyroid syndrome","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4429","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4153","upper_optimal_position":"0.4862","units":"mIU/L","description":"TSH is the signal sent by the pituitary gland to the thyroid, telling it how much hormone to produce. A higher TSH means the pituitary is having to push harder to get enough thyroid hormone, while a lower TSH suggests the thyroid is producing plenty. Marny's TSH of 1.94 mIU/L is within the optimal range of 1.0 to 2.5, indicating that the thyroid is producing adequate hormone with normal pituitary signalling. This effectively rules out thyroid dysfunction as a contributor to her hair thinning or fatigue.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, iodine deficiency, recovery from illness, early Hashimoto's","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production, and tissue repair. It is converted from FT4 in tissues throughout the body. Marny's FT3 of 5.0 pmol/L is within the optimal range of 4.5 to 6.5, confirming healthy thyroid hormone conversion and adequate active hormone levels.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, T3-secreting thyroid nodule, excess T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"","upper_normal":"13.8","lower_optimal":"","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a pattern seen in autoimmune thyroid conditions such as Hashimoto's thyroiditis. Marny's result of less than 6.6 U/mL is well below the 13.8 threshold, confirming no evidence of autoimmune thyroid disease. This is useful in the context of her hair loss investigation, as it effectively rules out Hashimoto's as a contributor.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"","upper_normal":"4.4","lower_optimal":"","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies, like TPO antibodies, are markers of autoimmune s":"","high_causes":"Breast cancer, ovarian cancer, liver disease, benign breast conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"15.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2062","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker primarily associated with pancreatic and biliary cancers, though it can also be elevated in benign conditions. Marny's level of 15.26 U/mL is well within the normal range below 37, which is reassuring.","low_causes":"Generally not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gallstones, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA (Carcinoembryonic Antigen)","group":"TUMOR MARKERS","result":"< 0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1087","lower_normal":"","upper_normal":"2.3","lower_optimal":"","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA is a protein that can be elevated in certain cancers, particularly colorectal, but also rises with smoking and some benign conditions. Marny's CEA of less than 0.5 ng/mL is very low and well within the non-smoker range of 0 to 2.3, which is reassuring.","low_causes":"Generally reflects good health","high_causes":"Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"130","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells during normal metabolism and rises after intense exercise or muscle damage. Marny's CK of 130 U/L is within the female range and within the optimal band, indicating normal muscle recovery from her training with no excessive muscle breakdown.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"618","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6668","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5824","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal rhythm, peaking in the early morning and falling throughout the day. Marny's cortisol of 618 nmol/L sits right at the upper boundary of the morning reference range (145.4 to 619.4). While technically at the ceiling rather than above it, the lab has flagged it as abnormal. The most likely explanation is her recently started ADHD medication, as stimulant medications activate the hypothalamic-pituitary-adrenal axis and can elevate cortisol. Sustained cortisol elevation is associated with hair shedding (telogen effluvium), sleep disruption, digestive changes, and metabolic effects, all of which overlap with her reported symptoms. This should be monitored with her ADHD prescriber.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary dysfunction","high_causes":"Stress, ADHD stimulant medications, Cushing's syndrome, corticosteroid use, illness, high-intensity exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"574","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"71.6","upper_normal":"1309.1","lower_optimal":"200","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3671","upper_optimal_position":"0.5248","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, responsible for reproductive function, bone health, cardiovascular protection, and skin and hair health. Marny's level of 574 pmol/L is above the follicular range (71.6 to 529.2) and within the luteal range (204.8 to 786.1), consistent with her HRT supplementation. This suggests her HRT is providing adequate oestradiol replacement. The exact interpretation depends on the timing of the blood draw relative to her HRT cycle, which her prescriber can assess.","low_causes":"Menopause, perimenopause, low body fat, excessive exercise, pituitary dysfunction","high_causes":"HRT, ovulation, PCOS, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is a female hormone that supports the second half of the menstrual cycle and pregnancy. In premenopausal women, levels vary dramatically depending on cycle phase, from near zero in the follicular phase to over 10 in the luteal phase. Marny's level of 1.27 nmol/L is consistent with a follicular phase reading (0 to 4.45). Given that she is experiencing irregular bleeding from the progesterone component of her HRT, this low level may simply reflect the timing of the blood draw rather than inadequate progesterone supplementation. Her HRT prescriber should interpret this in the context of her specific HRT regimen and cycle timing.","low_causes":"Follicular phase, anovulation, menopause, HRT timing","high_causes":"Luteal phase, pregnancy, ovarian cysts, HRT","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"2.0","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3422","upper_optimal_position":"0.5736","units":"mIU/mL","description":"LH is a pituitary hormone that stimulates ovulation and hormone production by the ovaries. In post-menopausal women, LH rises significantly as the pituitary tries to stimulate ovaries that are no longer responding. Marny's LH of 5.3 mIU/mL is within the follicular range (1.9 to 12.5) and well below the post-menopausal range (15.9 to 54), suggesting her HRT is effectively maintaining a pre-menopausal hormonal pattern.","low_causes":"HRT suppression, pituitary dysfunction, stress, extreme exercise","high_causes":"Menopause, perimenopause, PCOS, primary ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"9.68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6270","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3541","upper_optimal_position":"0.5476","units":"mIU/mL","description":"FSH is a pituitary hormone that stimulates follicle development in the ovaries. Like LH, it rises significantly in menopause. Marny's FSH of 9.68 mIU/mL is within the follicular range (2.5 to 10.2) but sitting toward the upper end. While this is not in the post-menopausal bracket (23 to 116.3), the upper-end positioning may reflect early perimenopausal hormonal shifts that her HRT is partially masking. This is not concerning but is consistent with her age and the reason she is on HRT.","low_causes":"HRT suppression, pregnancy, pituitary dysfunction","high_causes":"Menopause, perimenopause, primary ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"3.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7952","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Testosterone is an androgen hormone important for libido, energy, muscle maintenance, bone density, and mood in women, though at much lower levels than men. Marny's total testosterone of 3.4 nmol/L is above the standard female reference range of 0.5 to 2.6, which is expected given that she is on testosterone replacement therapy. However, the clinically important question is how much of this testosterone is biologically available (free) rather than bound to SHBG. With her SHBG at 89.6 and her calculated free testosterone at only 0.03 nmol/L, a large proportion of the administered testosterone is being bound and rendered inactive. This is worth discussing with her HRT prescriber to ensure the therapeutic intent is being met.","low_causes":"Aging, menopause, adrenal insufficiency, pituitary dysfunction, oral contraceptives"," const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
