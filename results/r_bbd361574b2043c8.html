rmal":"529.2","lower_optimal":"100","upper_optimal":"450","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3541","upper_optimal_position":"0.6108","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen in premenopausal women, produced mainly by the ovaries. It fluctuates significantly across the menstrual cycle. Jessica's result of 267 is consistent with either the follicular or luteal phase of the cycle. Alongside her progesterone of 15.44 (within luteal range), LH and FSH, this confirms she is cycling normally. Her FSH of 4.79 is well below the post-menopausal threshold, which rules out premature ovarian insufficiency at age 31.","low_causes":"Menopause, premature ovarian insufficiency, low body weight, excessive exercise, pituitary disorders","high_causes":"Ovulation, pregnancy, oestrogen-producing tumours, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"15.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"14.12","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3829","upper_optimal_position":"0.5830","units":"nmol/L","description":"Progesterone is a hormone produced by the ovaries after ovulation, during the luteal phase of the menstrual cycle. It prepares the uterine lining for potential pregnancy and supports early pregnancy. Jessica's result of 15.44 falls within the luteal phase range of 10.62 to 81.28, confirming that she ovulated in this cycle. This is a reassuring finding. Progesterone at this level also confirms she is in the luteal phase, which gives context to her other hormone results.","low_causes":"Anovulation, luteal phase defect, menopause, stress","high_causes":"Pregnancy, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"7.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0.5","upper_normal":"16.9","lower_optimal":"1.0","upper_optimal":"12.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3638","upper_optimal_position":"0.5351","units":"mIU/mL","description":"LH (luteinising hormone) is produced by the pituitary gland and triggers ovulation in women. It also stimulates the ovaries to produce oestrogen and progesterone. Jessica's result of 7.31 is consistent with the luteal phase range of 0.5 to 16.9, confirming normal pituitary-ovarian communication.","low_causes":"Pituitary disorders, anorexia, stress, hormonal contraception","high_causes":"Menopause, premature ovarian insufficiency, PCOS, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"4.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"1.5","upper_normal":"9.1","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3662","upper_optimal_position":"0.6183","units":"mIU/mL","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and stimulates the ovaries to develop eggs. In menopause, FSH rises significantly as the pituitary tries to stimulate ovaries that are no longer responding. Jessica's FSH of 4.79 is within the luteal range and well below the post-menopausal threshold of 23 and above. This confirms normal ovarian reserve at 31 and rules out premature ovarian insufficiency, which is reassuring information.","low_causes":"Pituitary disorders, pregnancy, hormonal contraception, stress","high_causes":"Menopause, premature ovarian insufficiency, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands in smaller amounts than in men. It plays a role in libido, energy, mood, bone density, and muscle maintenance. Jessica's result of 1.1 is within the female range and within the optimal band. This is a healthy level and does not suggest any concern regarding androgen deficiency or excess.","low_causes":"Ageing, menopause, pituitary disorders, adrenal insufficiency, hormonal contraception","high_causes":"PCOS, adrenal hyperplasia, androgen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"3.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5122","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is a calculation that estimates the proportion of testosterone that is free and biologically active, based on the ratio of testosterone to SHBG. Jessica's FAI of 3.73 is within the healthy range for women. This confirms that the balance between total testosterone and SHBG is appropriate.","low_causes":"High SHBG, low testosterone, ageing","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5146","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3495","upper_optimal_position":"0.5534","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is the most abundant steroid hormone in the body and declines with age. Jessica's result of 5.8 umol/L (approximately 2,137 ug/dL) is within the optimal range, indicating healthy adrenal function. This is a positive finding, particularly given her description of burnout-like fatigue, as significantly low DHEA-S would have suggested adrenal depletion.","low_causes":"Ageing, adrenal insufficiency, chronic illness, steroid medications","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"239","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4066","upper_optimal_position":"0.5953","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production during breastfeeding. In non-pregnant, non-breastfeeding women, prolactin should be within the non-pregnant range. Jessica's result of 239 is within the non-pregnant range of 59 to 619. At 2.5 years postpartum, if she is no longer breastfeeding, this level is normal.","low_causes":"Pituitary dysfunction","high_causes":"Pregnancy, breastfeeding, pituitary tumour (prolactinoma), medications, stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"29.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3477","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3436","upper_optimal_position":"0.5263","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to sex hormones, particularly testosterone and oestradiol, controlling how much is free and active in the body. Low SHBG means more free hormones are available. Jessica's SHBG of 29.5 is only marginally above the lower limit of 27.8 and below the optimal range of 40 to 100. Low SHBG in women is strongly associated with insulin resistance, and this finding is consistent with her elevated HOMA-IR. As insulin sensitivity improves through the recommended lifestyle changes, SHBG would be expected to rise.","low_causes":"Insulin resistance, obesity, PCOS, hypothyroidism, androgen excess","high_causes":"Oestrogen, pregnancy, hyperthyroidism, liver disease, ageing, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.022","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0.005","upper_normal":"0.045","lower_optimal":"0.01","upper_optimal":"0.035","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"nmol/L","description":"Free testosterone is the portion of total testosterone not bound to proteins and therefore biologically active. It is calculated from total testosterone, SHBG, and albumin. Jessica's free testosterone of 0.022 is within a healthy range for women, confirming adequate androgen availability for energy, libido, and muscle maintenance.","low_causes":"High SHBG, low total testosterone, ageing, menopause","high_causes":"PCOS, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4119","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3686","upper_optimal_position":"0.4863","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how hard to work. A high TSH means the pituitary is having to push the thyroid harder, suggesting underactivity. A low TSH suggests the thyroid is overactive. Jessica's TSH of 1.67 sits comfortably within the optimal range of 1.0 to 2.5, indicating the pituitary is satisfied with the thyroid's output. This effectively rules out thyroid dysfunction as a contributor to her fatigue, brain fog, and weight gain.","low_causes":"Hyperthyroidism, Graves' disease, pituitary dysfunction, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3893","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3893","upper_optimal_position":"0.5982","units":"pmol/L","description":"FT4 (free thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the more active T3 in the tissues. Jessica's FT4 of 14 sits at the lower edge of the optimal range of 14 to 20. While this is within the optimal band, being right at the boundary means it could benefit from monitoring. Her TSH at 1.67 confirms the thyroid is not being pushed hard, so this level of FT4 is adequate for the body's current needs.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3 (free triiodothyronine) is the active thyroid hormone that drives metabolism in cells throughout the body. It is converted from T4 in the tissues. Jessica's FT3 of 4.6 is within the optimal range of 4.5 to 6.5, confirming good conversion from T4 to the active hormone. The thyroid is functioning well.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a hallmark of autoimmune thyroid disease (Hashimoto's thyroiditis). Jessica's result of below 6.6 is well within the normal range of below 13.8, confirming no evidence of autoimmune thyroid attack. This is an important negative finding because many of her symptoms (fatigue, brain fog, weight gain, mood changes) overlap with thyroid dysfunction, and this result definitively excludes that explanation.","low_causes":"No autoimmune thyroid activity (normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce thyroid hormones. Their presence can indicate autoimmune thyroid disease. Jessica's result of below 1.3 is well within the normal range, further confirming no autoimmune thyroid activity. Over 80% of the population have undetectable levels, so this is a typical and reassuring finding.","low_causes":"No autoimmune thyroid activity (normal)","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3700","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin that regulates calcium absorption, bone health, immune function, mood, and inflammation. It is primarily produced in the skin in response to sunlight. Jessica's result of 74 is above the sufficiency threshold of 50 but just below the optimal range of 75 to 120. At a BMI of 29, vitamin D is partially sequestered in fat tissue, meaning she needs a higher intake than a leaner person to maintain the same blood level. Given her symptoms of low mood, brain fog, and the significant inflammation from endometriosis, optimising vitamin D into the 75 to 120 range is particularly relevant because of its anti-inflammatory and mood-supporting properties.","low_causes":"Low sunlight exposure, dark skin, obesity (fat sequestration), malabsorption, northern latitude, winter","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4693","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5400","units":"pmol/L","description":"PTH (parathyroid hormone) is produced by the parathyroid glands and regulates calcium levels in the blood. When calcium drops, PTH rises to release calcium from bones. Jessica's PTH of 2.5 is within the optimal range, confirming that her calcium regulation is working normally. This is consistent with her corrected calcium being within range.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"307","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3811","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6160","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is found in animal products and can become deficient in vegetarians, vegans, or people with absorption issues. Jessica's result of 307 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Levels below 500 are associated with subtle neurological symptoms including brain fog, poor concentration, and fatigue, all of which Jessica reports. Supplementation with sublingual methylcobalamin at 1,000 micrograms daily should raise this into the optimal range over 8 to 12 weeks.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, metformin, ageing","high_causes":"Excessive supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for cell division, DNA synthesis, and red blood cell production. It works closely with vitamin B12. Jessica's result of 12 is within the optimal range of above 8, confirming good dietary folate intake. This is a positive finding and means folate deficiency is not contributing to her symptoms.","low_causes":"Poor diet, alcohol, malabsorption, pregnancy, certain medications","high_causes":"Excessive supplementation, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, which are unstable molecules that damage cells and contribute to inflammation and ageing. Jessica's result of 1.3 sits at the very bottom of the laboratory range of 1.3 to 1.77 and below the optimal threshold. This suggests her antioxidant defences are running low. Increasing intake of brightly coloured vegetables, berries, dark leafy greens, green tea, and omega-3 rich foods would help replenish antioxidant capacity. This is particularly relevant given her significant inflammatory load, as inflammation generates more free radicals, increasing the demand for antioxidant protection.","low_causes":"Low fruit and vegetable intake, high oxidative stress, chronic inflammation, smoking","high_causes":"High antioxidant intake from food or supplements, vitamin C or E supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"170","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles, the heart, and the brain. It function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const t0=performance.now(), dur=1400;
