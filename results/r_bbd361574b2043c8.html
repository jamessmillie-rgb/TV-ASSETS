Her coeliac screen is negative. Her immunoglobulins are all within their respective ranges. Her total antioxidant activity at 1.3 sits at the very bottom of the range, suggesting her antioxidant defences could benefit from more colourful vegetables, berries, and omega-3 rich foods.\n\nHer basophils at 0.01 are marginally below the lower limit of 0.02. Basophils are the rarest type of white blood cell and are involved in allergic and inflammatory responses. At this margin, this is laboratory variation and not clinically significant. Her electrolytes, calcium, magnesium, and bicarbonate are all within healthy ranges, with magnesium at 0.94 sitting comfortably within the optimal band of 0.85 to 1.05, which is a positive finding given its role in sleep, mood, and muscle recovery.\n\nPulling this together, the dominant theme of this report is inflammation. A hs-CRP of 12.7 is the highest priority finding and almost certainly reflects her stage 4 endometriosis driving a systemic inflammatory state. That inflammation is in turn contributing to the insulin resistance her HOMA-IR reveals, the difficulty losing weight, the brain fog, the fatigue, and the low mood. The feeling of physical burnout she describes, distinct from mental burnout, is consistent with a body dealing with a significant chronic inflammatory load. Addressing the inflammation, whether through endometriosis management with her GP, dietary anti-inflammatory strategies, and targeted supplementation, is the single most impactful thing she can do for almost every symptom and goal she has listed.","links":"Jessica's results point to a clear set of actions, and the most important is a conversation with her GP about her inflammatory picture. Her hs-CRP at 12.7 is significantly elevated and almost certainly driven by her stage 4 endometriosis. She should discuss whether her current endometriosis management plan is sufficient or whether escalation, whether medical or surgical, might reduce the systemic inflammatory burden. She should also ask her GP to monitor her metabolic health, specifically her fasting glucose, insulin, and HOMA-IR, given the early insulin resistance pattern emerging.\n\nFor weight loss, Jessica's maintenance calories at her current weight and activity level sit at approximately 1,900 to 2,050 calories per day. A moderate deficit of 1,500 to 1,700 calories per day would support steady fat loss of around 0.3 to 0.5 kilograms per week without further stressing a body already under inflammatory load. Aggressive caloric restriction would be counterproductive here because it tends to worsen inflammation and cortisol. Her protein intake should be at least 100 to 120 grams per day, which at her weight equates to 1.3 to 1.6 grams per kilogram, supporting muscle preservation during fat loss and helping with satiety. Her diet volume score of 5 out of 10 suggests she is not eating large quantities, so the focus should be on food quality and protein density rather than eating less.\n\nTo tackle the inflammation from the dietary side, she should increase her intake of oily fish to three portions per week (salmon, mackerel, sardines), increase colourful vegetables and berries which provide polyphenols and antioxidants (her total antioxidant activity is at the floor of its range), reduce ultra-processed foods and refined carbohydrates which worsen both inflammation and insulin resistance, and consider turmeric with black pepper in cooking for its modest anti-inflammatory properties.\n\nFor her insulin resistance, the most effective non-pharmaceutical intervention is increasing daily movement. Her current 5,000 to 7,500 steps should be pushed toward 8,000 to 10,000, with even a 15-minute walk after her main meals making a measurable difference to post-meal glucose handling. Her two resistance training sessions per week are valuable because muscle is the body's largest glucose sink, and adding a third session would be beneficial if her energy allows. The glucose at 5.7 and HOMA-IR at 1.82 are early signals, not alarming numbers, and they are very responsive to these kinds of changes.\n\nHer vitamin D at 74 needs topping up to reach the 75 to 120 optimal range, and at her BMI she will need a higher dose than average because fat tissue absorbs and holds vitamin D. A daily dose of 3,000 to 4,000 IU of vitamin D3 taken with a meal containing fat, paired with 100 to 200 micrograms of vitamin K2 in the MK-7 form, will support both her vitamin D levels and ensure calcium is directed to bone rather than soft tissue. Her B12 at 307 should be raised above 500 with sublingual methylcobalamin at 1,000 micrograms daily, which bypasses any absorption issues and supports the energy production and cognitive function she is seeking. Her ferritin at 38 would benefit from gentle iron supplementation in the form of ferrous bisglycinate at 25 milligrams every other day, taken with a source of vitamin C to enhance absorption, aiming to bring stores above 50 and ideally toward 80 over the next three to four months.\n\nFor her brain fog and mood, the anti-inflammatory dietary changes, vitamin D optimisation, B12 supplementation, and increased movement will all contribute. Omega-3 supplementation at 2 to 3 grams of combined EPA and DHA daily will provide both anti-inflammatory and mood-supporting benefits, as EPA in particular has evidence for supporting mood in the context of inflammation. Magnesium glycinate at 300 to 400 milligrams before bed may help with sleep quality, which in turn supports mood and cognitive clarity.\n\nShe should bring the following to her GP: hs-CRP of 12.7 in the context of stage 4 endometriosis, HOMA-IR of 1.82 with fasting glucose of 5.7 suggesting early insulin resistance, the pending urine culture result alongside WBCs of 20 and positive nitrites, and the low reticulocyte count with borderline ferritin and raised RDW suggesting early iron store depletion.\n\nFor retesting, we would recommend repeating hs-CRP, fasting glucose, insulin, HOMA-IR, ferritin, vitamin D, and B12 in 12 to 16 weeks to track the response to supplementation and dietary changes. Lp(a) should be reviewed as soon as the result is available.","flags":"hs-CRP 12.7 mg/L (limit below 5.0, optimal below 1.0): Significantly elevated systemic inflammation. Most likely driven by stage 4 endometriosis. Contributing to insulin resistance, fatigue, brain fog, and difficulty losing weight. Recommend GP review of endometriosis management and consideration of whether inflammatory burden warrants intervention.\n\nHOMA-IR 1.82 (optimal range 0.5 to 1.5): Early insulin resistance. Fasting glucose 5.7 mmol/L (upper limit 6.0, optimal below 5.4) and HbA1c 37 mmol/mol (optimal below 36) support a pattern of mildly impaired glucose handling. Likely driven in part by chronic inflammation. Lifestyle intervention is first line.\n\nC-Peptide 0.752 ug/L (range 1.1 to 4.4, approximately 249 pmol/L): Below range, but laboratory note states sample degradation to 44% of baseline if not separated within 4 hours. Insulin at 7.19 is normal, making pancreatic insufficiency unlikely. Likely artefactual. Repeat only if clinical concern persists.\n\nUrine WBCs 20/uL (significant above 10) with positive nitrites: Raises the possibility of urinary tract infection. Bacterial culture and sensitivities pending. Recommend GP review when culture result is available, or sooner if symptomatic.\n\nReticulocyte absolute count 37.9 x10^9/L (range 50 to 100): Low red cell production rate. In context of ferritin 38 (below optimal 40) and RDW 14.5 (above upper limit 14.0), suggests early iron store depletion affecting red cell production.\n\nRDW 14.5% (range 11.6 to 14.0): Marginally elevated. Early marker of red cell size variation, consistent with borderline iron stores.\n\nFerritin 38 ng/mL: Within laboratory range (10 to 291) but below optimal of 40 for women, particularly relevant with endometriosis and 2.5 years postpartum.\n\nApoB/ApoA1 ratio 0.65 (lower risk below 0.6): Average risk band. ApoA1 at 1.26 is below the desirable 1.4 threshold. ApoB at 0.82 is within desirable range. Modifiable with exercise and omega-3.\n\nLDL 2.72 mmol/L: Within laboratory range (0.5 to 3.0) but above optimal target of below 2.6.\n\nVitamin D 74 nmol/L: Sufficient but below optimal range of 75 to 120. Requires supplementation, higher dose due to BMI 29.\n\nB12 307 pg/mL: Within laboratory range (193 to 982) but below optimal 500. Relevant to brain fog and energy symptoms.\n\nSHBG 29.5 nmol/L: Marginally above lower limit of 27.8. Low SHBG in women is associated with insulin resistance, consistent with HOMA-IR findings.\n\nBasophils 0.01 x10^9/L (range 0.02 to 0.1): Marginally below range. Not clinically significant at this margin.\n\nLp(a): Pending. Review when available.\n\nBacterial culture and urine sensitivities: Pending. Review when available.\n\nReassuring negatives: Thyroid function normal with negative antibodies, ruling out autoimmune thyroid disease. Liver function excellent across all markers. Kidney function strong (Cystatin C eGFR 98). CA-125 normal. CA 15-3, CA 19-9, CEA all normal. Coeliac screen negative. Rheumatoid factor negative. No anaemia. Electrolytes balanced. Cortisol within range. Hormonal profile consistent with normal cycling.","recommendations":"1. Discuss hs-CRP of 12.7 with GP in the context of stage 4 endometriosis. Ask whether current endometriosis management is sufficient or whether escalation would reduce the systemic inflammatory load.\n\n2. Discuss the early insulin resistance pattern with GP: HOMA-IR 1.82, fasting glucose 5.7, HbA1c 37. These are early and modifiable but should be on the GP's radar.\n\n3. Follow up on the pending urine culture. If urinary symptoms are present (burning, frequency, urgency), see GP promptly. If asymptomatic, review the culture result when it returns.\n\n4. Increase daily steps from 5,000 to 7,500 toward a target of 8,000 to 10,000. Add a 10 to 15 minute walk after the main meal of the day to improve post-meal glucose handling.\n\n5. Consider adding a third resistance training session per week if energy permits. Muscle mass is the most effective long-term tool for improving insulin sensitivity.\n\n6. Increase oily fish intake to three portions per week. Add more colourful vegetables, berries, and leafy greens to boost antioxidant intake.\n\n7. Reduce refined carbohydrates and ultra-processed foods, which worsen both inflammation and insulin resistance.\n\n8. Target 1,500 to 1,700 calories per day with a protein floor of 100 to 120 grams per day for gradual fat loss without worsening inflammation.\n\n9. Begin vitamin D3 supplementation at 3,000 to 4,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 at 100 to 200 micrograms.\n\n10. Begin sublingual methylcobalamin B12 at 1,000 micrograms daily.\n\n11. Begin ferrous bisglycinate iron at 25 milligrams every other day with vitamin C.\n\n12. Begin omega-3 fish oil providing 2 to 3 grams combined EPA and DHA daily.\n\n13. Consider magnesium glycinate 300 to 400 milligrams before bed for sleep and mood support.\n\n14. Review Lp(a) result when it returns to complete the cardiovascular risk picture.\n\n15. Retest hs-CRP, fasting glucose, insulin, HOMA-IR, ferritin, vitamin D, and B12 in 12 to 16 weeks.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 to 4,000 IU daily, taken with the largest meal of the day or any meal containing fat. Jessica's level at 74 is just below the optimal range of 75 to 120, and at a BMI of 29, fat tissue will absorb a proportion of supplemented vitamin D, so a higher dose is needed than for a leaner individual. Vitamin D supports immune regulation, mood, bone health, and has anti-inflammatory properties, all of which are relevant to her presentation.\n\nVitamin K2 (MK-7): 100 to 200 micrograms daily, taken alongside the vitamin D. K2 ensures that the calcium mobilised by vitamin D is directed into bones and teeth rather than depositing in blood vessels and soft tissue.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This is the single most important supplement for Jessica given her hs-CRP of 12.7. EPA and DHA are potent anti-inflammatory fatty acids that reduce CRP, support cardiovascular health, and have evidence for improving mood in the context of systemic inflammation. Look for a product listing the EPA and DHA content separately, aiming for at least 1,000 milligrams of EPA.\n\nSublingual methylcobalamin (vitamin B12): 1,000 micrograms daily, dissolved under the tongue. Sublingual delivery bypasses any potential gut absorption issues. Her B12 at 307 is below the optimal threshold of 500, and given her brain fog and fatigue, optimising B12 is likely to contribute to improvement in both.\n\nFerrous bisglycinate (iron): 25 milligrams every other day, taken with a source of vitamin C such as a glass of orange juice or a kiwi fruit. Every other day dosing has been shown to optimise absorption compared to daily dosing. Her ferritin at 38 with a raised RDW and low reticulocyte count suggests iron stores are beginning to fall, and with stage 4 endometriosis potentially increasing menstrual losses, replenishing stores now will prevent a deficiency from developing. Aim to recheck ferritin in 12 to 16 weeks, targeting above 50 and ideally approaching 80.\n\nMagnesium glycinate: 300 to 400 milligrams taken 30 to 60 minutes before bed. Glycinate is the best tolerated form and the least likely to cause digestive upset. Jessica's serum magnesium at 0.94 is within the optimal range, but magnesium supports sleep quality, mood, muscle recovery after training, and helps modulate the stress response, all of which are relevant given her symptoms. Serum magnesium is also a poor reflection of total body stores, so supplementation can still help even when the blood level looks adequate.\n\nThe most important changes from this report are not supplements. They are the conversation with her GP about managing her endometriosis-driven inflammation, the dietary shift toward anti-inflammatory whole foods with adequate protein, and the gradual increase in daily movement and resistance training. These will do more for her energy, mood, brain fog, and body composition than any supplement can achieve alone.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after a period without eating. It reflects how well the body maintains blood sugar balance at rest. Jessica's result of 5.7 is within the laboratory range of 3.5 to 6.0 but sits above the optimal ceiling of 5.4 mmol/L. At this level, the body is keeping glucose controlled but is having to work slightly harder to do so. In the context of her HOMA-IR being above optimal, this suggests the earliest stage of reduced insulin sensitivity, likely driven in part by the significant systemic inflammation her hs-CRP reveals. Increasing daily movement, particularly walking after meals, and reducing refined carbohydrates are the most effective ways to bring this number down.","low_causes":"Fasting, excessive insulin production, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c measures the percentage of haemoglobin, the oxygen-carrying protein in red blood cells, that has glucose attached to it. Because red blood cells live for around three months, this gives an average picture of blood sugar control over that period, rather than a snapshot like fasting glucose. Jessica's result of 5.6% falls within the normal range of below 6.0% and below the pre-diabetes threshold of 6.0 to 6.4%. This confirms that her average blood sugar control over the past two to three months has been adequate, though when read alongside her fasting glucose and HOMA-IR, the overall trajectory is one to keep an eye on.","low_causes":"Low carbohydrate diet, blood loss, haemolytic conditions","high_causes":"Pre-diabetes, diabetes, high carbohydrate intake, reduced red cell turnover","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4405","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5788","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol rather than as a percentage. Jessica's result of 37 is within the normal range of below 42 (the pre-diabetes threshold) but sits above the optimal target of below 36. This is consistent with the picture from her fasting glucose and HOMA-IR: blood sugar control is within safe limits but not in the optimal zone. The combination of increased movement, dietary quality improvements, and addressing her systemic inflammation should help move this marker in the right direction.","low_causes":"Low carbohydrate diet, blood loss, haemolytic conditions","high_causes":"Pre-diabetes, diabetes, high carbohydrate intake, reduced red cell turnover","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4023","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4095","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar controlled in the resting state. A healthy level means the body does not need to produce excessive insulin to handle glucose. Jessica's result of 7.19 is within both the laboratory range and the optimal band of 2 to 8 mIU/L. This is a genuinely positive finding. Despite the early insulin resistance her HOMA-IR suggests, the pancreas is not yet having to over-produce insulin to compensate, meaning the resistance is still mild and very responsive to lifestyle changes.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.752","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1052","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It is used as a measure of how much insulin the body is actually producing, and because it is cleared more slowly than insulin, it can be a more stable indicator. Jessica's result of 0.752 ug/L (approximately 249 pmol/L) is below the laboratory lower limit of 1.1 ug/L. However, the laboratory notes that C-Peptide can degrade significantly in samples not separated within four hours, potentially falling to 44% of its true value. Given that her insulin level of 7.19 is healthy and her blood sugar control is intact, this low C-Peptide is very likely a sample handling artefact rather than a sign of genuine pancreatic underperformance. No action is needed unless there is specific clinical concern.","low_causes":"Sample degradation, type 1 diabetes, low carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7773","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to the effects of insulin. A lower number means the body handles glucose efficiently; a higher number means the body is having to work harder. Jessica's result of 1.82 is above the optimal upper limit of 1.5 and approaching the 1.9 threshold where early insulin resistance is formally recognised. At her age and BMI, this is a modifiable finding. The systemic inflammation from her endometriosis is likely a significant contributor, as chronic inflammation directly impairs insulin signalling in cells. Increasing physical activity, reducing refined carbohydrates, and addressing the inflammatory driver are the most effective interventions.","low_causes":"High insulin sensitivity, low carbohydrate diet, very active lifestyle","high_causes":"Insulin resistance, metabolic syndrome, chronic inflammation, obesity, PCOS, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"65.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2177","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, which are the cells that produce insulin. Jessica's calculated HOMA-B of approximately 65 is below the 80 to 200 range. This calculation uses both insulin and glucose, and with her glucose at 5.7 (making the denominator in the formula smaller), the score is pushed lower. However, her actual insulin production at 7.19 mIU/L is healthy and appropriate, so this does not indicate true pancreatic failure. The low C-Peptide, likely from sample degradation, may also be contributing to a misleadingly low picture. This should be interpreted with caution rather than as a standalone concern.","low_causes":"Fasting glucose near 3.5 inflating the calculation, sample degradation affecting C-Peptide, early beta cell decline, type 1 diabetes","high_causes":"Insulin resistance (compensatory overproduction), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6173","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood, the two main types of protein that perform functions from carrying nutrients and hormones to fighting infection. Jessica's result of 67 is within the laboratory range of 57 to 82. Her albumin and globulin levels are both individually within range, and the total reflects adequate protein status.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, infection, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is a protein made by the liver that carries hormones, vitamins, and other substances through the blood. It also helps maintain fluid balance, keeping water inside the blood vessels. Jessica's result of 37 is within the laboratory range of 34 to 50 but below the optimal threshold of 40. Albumin can be lowered by chronic inflammation, and with her hs-CRP at 12.7, the inflammatory state from her endometriosis may be suppressing albumin production. This is worth monitoring on retest to see if it rises as inflammation is addressed.","low_causes":"Chronic inflammation, liver disease, kidney disease, malnutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. They play a key role in immune function and inflammation. Jessica's result of 30 is within range and within the optimal band, reflecting a balanced immune protein profile.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio compares the two main protein types in the blood. A lower ratio can indicate that globulin is relatively high compared to albumin, which can occur with chronic inflammation. Jessica's ratio of 1.23 is within the laboratory range but below the optimal threshold of 1.3, consistent with her albumin being slightly suppressed by her inflammatory state.","low_causes":"Chronic inflammation, liver disease, immune overactivity","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and digestive system. It is used to assess liver and bone health. Jessica's result of 75 is comfortably within range and reflects healthy liver and bone metabolism.","low_causes":"Zinc or magnesium deficiency, hypothyroidism, anaemia","high_causes":"Liver disease, bile duct obstruction, bone disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. It is processed by the liver and excreted in bile. Jessica's result of 7 is well within range, confirming healthy red cell turnover and liver processing.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1607","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found primarily in the liver. When liver cells are damaged or inflamed, ALT leaks into the blood, so elevated levels signal liver strain. Jessica's result of 18 is well below the laboratory limit of 56 and below the optimal ceiling of 25 for women, confirming a liver under no strain whatsoever. This is a reassuring finding.","low_causes":"Not clinically significant","high_causes":"Liver disease, fatty liver, alcohol, medications, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3646","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Like ALT, elevated levels can indicate liver damage, though AST is less specific to the liver. Jessica's result of 18 is well within range and confirms the excellent liver health picture alongside her ALT.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1655","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. A low score effectively rules out significant liver fibrosis. Jessica's score of 0.48 is well below the threshold of 1.45, confirming no sign of liver fibrosis. Combined with her excellent ALT, AST, and GGT, her liver is in excellent health.","low_causes":"Young age, healthy liver, high platelets","high_causes":"Liver fibrosis, cirrhosis, older age, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3421","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct issues, and metabolic strain on the liver. Jessica's result of 26 is within the laboratory range of 4 to 38 for women but marginally above the optimal target of below 25. At 26, this is a borderline finding and not a concern, though it may reflect the systemic inflammatory load from her endometriosis rather than any liver-specific issue.","low_causes":"Not clinically significant","high_causes":"Alcohol, liver disease, bile duct obstruction, metabolic syndrome, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4280","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5947","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. It is primarily used to assess pancreatic health. Jessica's result of 55 is comfortably within range, confirming normal pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5745","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is another pancreatic enzyme, specifically responsible for breaking down fats. It is a more specific marker for pancreatic health than amylase. Jessica's result of 47 is within range, confirming healthy pancreatic function.","low_causes":"Not clinically significant","high_causes":"Pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4728","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol types in the blood, including HDL (protective), LDL (potentially harmful), and VLDL. On its own, total cholesterol is a crude measure because it does not distinguish between good and bad cholesterol. Jessica's result of 4.9 is within the desirable range of below 5.18. Her excellent HDL of 1.8 makes up a large proportion of this total, meaning the overall picture is favourable.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet, obesity, hypothyroidism, genetics, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2706","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, largely influenced by recent carbohydrate and sugar intake, alcohol, and metabolic health. Jessica's result of 0.92 is within the optimal range of below 1.0, which is an excellent finding. Low triglycerides alongside high HDL is one of the strongest indicators of healthy metabolic function, and this is encouraging given the early insulin resistance her HOMA-IR suggests. It means the lipid side of her metabolism is still functioning well.","low_causes":"Low fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2692","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to the tissues. It is considered an atherogenic particle, meaning it contributes to artery plaque formation. Jessica's result of 0.42 is within range and within the optimal band, consistent with her excellent triglyceride level.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5806","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is often called good cholesterol because it carries cholesterol away from the arteries back to the liver for processing. Higher HDL provides greater cardiovascular protection. Jessica's result of 1.8 is above both the desirable threshold of 1.55 and the optimal threshold of 1.6 for women. This is an excellent level and one of the strongest positives in her lipid profile. It provides significant protection against cardiovascular disease.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4453","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6107","units":"mmol/L","description":"LDL (low-density lipoprotein) is often called bad cholesterol because it deposits cholesterol in artery walls, contributing to plaque formation over time. Jessica's result of 2.72 is within the laboratory range of 0.5 to 3.0 but above the optimal target of below 2.6. Systemic inflammation, such as the level her hs-CRP indicates, can impair the liver's ability to clear LDL from the blood, so addressing the inflammatory driver may help bring this down. Increasing soluble fibre intake (oats, beans, lentils) and oily fish would also support LDL reduction.","low_causes":"Hyperthyroidism, malnutrition, liver disease, very low fat diet","high_causes":"Diet high in saturated fat, obesity, genetics, hypothyroidism, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3022","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple way of expressing how much of the total cholesterol is protective versus potentially harmful. A lower ratio is better. Jessica's ratio of 2.72 is excellent, well within the desirable limit of below 4.5 and within the optimal range. This reflects her strong HDL level pulling the ratio into a very favourable position.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"36.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6122","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"This expresses what proportion of the total cholesterol is made up of protective HDL. A higher percentage is better, with above 20% being the minimum target. Jessica's result of 36.73% is excellent, meaning over a third of her total cholesterol is the protective type. This is a strong cardiovascular positive.","low_causes":"Low HDL, metabolic syndrome, sedentary lifestyle","high_causes":"High HDL, regular exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol types in a single number, including LDL, VLDL, and remnants. Jessica's result of 3.1 is within the laboratory limit of below 4.0 but marginally above the optimal target of below 3.0, consistent with her LDL being just above optimal.","low_causes":"Very low LDL, malnutrition, hyperthyroidism","high_causes":"High LDL, high triglycerides, metabolic syndrome, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.45","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein of HDL particles. It is arguably a better measure of protective cholesterol than HDL cholesterol itself because it reflects the number of HDL particles rather than just the amount of cholesterol they carry. Jessica's result of 1.26 is below the desirable threshold of 1.4 or above. This is somewhat surprising given her HDL cholesterol level is excellent at 1.8, and the discrepancy may reflect HDL particles that are large and cholesterol-rich but fewer in number. Regular cardiovascular exercise, omega-3 intake, and moderate increases in healthy fats can help raise ApoA1.","low_causes":"Sedentary lifestyle, metabolic syndrome, smoking, low fat diet, genetic factors","high_causes":"Regular exercise, moderate alcohol, oestrogen, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this result effectively counts the total number of atherogenic (artery-damaging) particles in the blood. Many cardiologists consider ApoB the single best measure of cardiovascular risk from lipids. Jessica's result of 0.82 is within the desirable range of below 0.9 but above the optimal target of below 0.8. This is a borderline finding. Dietary improvements, particularly increasing soluble fibre and omega-3, and addressing the inflammatory driver, would be the approaches to bring this into the optimal zone.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, metabolic syndrome, genetics, diet high in saturated fat, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (artery-damaging) particles to the number of protective particles. It is considered one of the best overall measures of lipid-related cardiovascular risk. Jessica's ratio of 0.65 is marginally above the lower risk threshold of below 0.6, placing her in the average risk band (0.6 to 0.8). For women, the threshold for concern is lower at 0.6 compared to 0.7 for men. The ratio is being driven by the slightly below-target ApoA1 rather than an elevated ApoB. Increasing cardiovascular exercise and omega-3 intake would be the most effective strategies to improve this ratio by raising ApoA1.","low_causes":"High ApoA1, low ApoB, excellent cardiovascular fitness","high_causes":"Low ApoA1, high ApoB, metabolic syndrome, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"32","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL that carries additional inflammatory and clotting risks. It is entirely inherited and does not change with diet or lifestyle. Jessica's result is pending and will be reviewed when it becomes available. This is an important result because it will determine whether any residual cardiovascular risk in her lipid profile is modifiable (diet and lifestyle) or genetic (requiring permanent medical record and family testing).","low_causes":"Genetics","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.17","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin sensitivity and metabolic health. A low ratio suggests the body handles fats and sugars efficiently. Jessica's ratio of 0.51 is within the optimal range of below 0.87 and is an excellent finding. It is one of the strongest indicators that her metabolic machinery, at the lipid level at least, is functioning well despite the early insulin resistance her HOMA-IR shows.","low_causes":"Excellent metabolic health, high HDL, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2375","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich lipoproteins after they have delivered their fat payload. It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent cardiovascular risk factor. Jessica's result of 0.38 is within the optimal range of below 0.5, which is a positive finding and consistent with her excellent triglyceride level.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"12.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a protein produced by the liver in response to inflammation anywhere in the body. It is the most widely used blood marker for systemic inflammation. At very low levels (below 1.0), it indicates minimal inflammation and low cardiovascular risk. At Jessica's level of 12.7, it indicates significant systemic inflammation. The most likely driver in her case is stage 4 endometriosis, which involves inflammatory tissue growing outside the uterus and generating a chronic inflammatory signal that the liver responds to by producing CRP. This level of inflammation has wide-ranging effects: it impairs insulin signalling (contributing to her elevated HOMA-IR), drives fatigue and brain fog, can lower mood, makes weight loss more difficult, and can suppress albumin production (her albumin at 37 is below optimal). It is also associated with increased cardiovascular risk over the long term. Discussing endometriosis management with her GP to reduce this inflammatory burden is the highest priority action from this report.","low_causes":"Low inflammation, healthy immune regulation","high_causes":"Chronic inflammatory conditions (endometriosis, autoimmune disease), infection, obesity, metabolic syndrome, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"< 2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates de works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and acid-base equilibrium. Jessica's result of 97 is within the laboratory range of 95 to 108, just below the optimal band of 98 to 106. This is a marginal finding and not a concern.","low_causes":"Vomiting, diuretics, adrenal insufficiency, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3545","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3879","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, helping maintain the blood at the correct pH. Jessica's result of 20.7 is within the laboratory range of 20 to 31 but sits just above the lower limit and below the optimal range of 22 to 28. A slightly low bicarbonate can reflect the body buffering a mild acid load, which can occur with higher protein intake, intense exercise, or metabolic processes. In isolation, this is not a concern but adds context if future tests show a similar pattern.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, lactic acidosis","high_causes":"Vomiting, diuretics, metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2953","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Jessica's unadjusted calcium of 2.18 is within the laboratory range of 2.08 to 2.65. However, calcium must be interpreted alongside albumin because calcium binds to albumin in the blood. With her albumin at 37 (below optimal), the corrected calcium of 2.31 is the more accurate measure. The corrected value of 2.31 is within the normal range of 2.2 to 2.6 and within the optimal band, so calcium status is adequate.","low_causes":"Low albumin, vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium result for the albumin level, giving a more accurate picture of the body's true calcium status. Jessica's corrected calcium of 2.31 is within both the laboratory range and the optimal band of 2.2 to 2.5, confirming healthy calcium balance. Her PTH (parathyroid hormone) at 2.5 is also within range, meaning the system that regulates calcium is working normally.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5690","lower_normal":"0.53","upper_ ":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3700","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is a calculated marker that reflects the balance between the innate immune system (neutrophils) and the adaptive immune system (lymphocytes). It is used as a simple marker of systemic inflammation and immune stress. Jessica's NLR of 1.08 is within the optimal range of 1.0 to 2.0, which is a positive finding and somewhat surprising given her significantly elevated hs-CRP. This suggests the inflammation from her endometriosis is driving CRP through liver signalling rather than through an elevated white cell inflammatory response.","low_causes":"High lymphocyte count, viral infection","high_causes":"Bacterial infection, chronic inflammation, physical stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"28.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4616","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5180","units":"%","description":"Transferrin saturation measures what percentage of the body's transferrin (iron transport protein) is loaded with iron. It reflects how much iron is currently being transported in the blood. Jessica's result of 28.93% is within the optimal range of 25 to 40%, confirming adequate iron mation, her significantly elevated hs-CRP may be suppressing transferrin production, masking what might otherwise be a higher level in response to her borderline ferritin.","low_causes":"Chronic inflammation (negative acute phase protein), liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4829","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3954","upper_optimal_position":"0.6144","units":"umol/L","description":"TIBC (total iron binding capacity) measures the blood's total capacity to transport iron. It reflects the amount of transferrin available to bind iron. Jessica's TIBC of 59 is within the optimal range, consistent with the rest of her iron transport markers being adequate.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.5155","units":"ng/mL","description":"Ferritin is the body's iron storage protein. It is the most reliable single marker of iron stores. Jessica's result of 38 is within the wide laboratory range of 10 to 291 for women but below the optimal threshold of 40. At 2.5 years postpartum with stage 4 endometriosis, which can cause increased menstrual blood
