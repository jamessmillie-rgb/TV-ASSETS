<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

errin is 2.75, which is within range, and his transferrin saturation is 40.4%, which sits right at the top of the ideal band. The saturation is not dramatically elevated, which leans slightly away from haemochromatosis and slightly towards the inflammatory and metabolic explanation, but it does not exclude it. The combination of elevated ferritin, a saturation at the upper boundary, and European ancestry means his GP should request an HFE gene test to check for the haemochromatosis mutations. In the meantime, he should not take any iron supplements or multivitamins containing iron, as adding iron to already elevated stores could accelerate organ damage if haemochromatosis is present.\n\nHis GGT is 102.7, well above the male upper limit of 71. GGT, or gamma-glutamyltransferase, is a liver enzyme that is particularly sensitive to alcohol, but it also rises with metabolic stress, fatty liver, high triglycerides and obesity. With 15 or more drinks per week, the alcohol is almost certainly the primary driver here. His ALT is 51, which is within the laboratory range of below 55 but above the optimal threshold of 30 for men, suggesting the liver is under real metabolic strain even though it has not crossed the formal limit. His AST is 36.6, within range, and his AST:ALT ratio (the De Ritis ratio) is 0.72, which is below the optimal band of 0.8 to 1.3. A ratio below 1.0 with an elevated GGT is a pattern commonly seen with alcohol-related liver stress rather than with scarring or advanced disease, and the fibrosis scores confirm this: his FIB-4 is 0.57 and his APRI is 0.27, both well within the safe zone, making significant liver fibrosis very unlikely at this point. His NAFLD Fibrosis Score is minus 3.538, also reassuring. The liver is under strain, but the scores show no sign of scarring. That is genuinely good news, but it is a window of opportunity rather than a clean bill of health. The combination of very high triglycerides, elevated GGT, borderline ALT and heavy alcohol intake means fatty liver is a real possibility, and a liver ultrasound through his GP would check for it.\n\nHis hsCRP is 1.06, marginally above the 1.0 threshold. High-sensitivity C-reactive protein is a broad marker of systemic inflammation. At 1.06 the elevation is mild, but in the context of very high triglycerides, elevated GGT, high ferritin and a raised BMI, it fits a pattern of low-grade metabolic inflammation rather than infection. His Complement C3 is 1.66, just above the 1.6 upper limit, which is another marker that rises with metabolic syndrome and insulin resistance and adds to that inflammatory picture. His soluble IL-2 receptor alpha (sIL-2Ra) is 0.50, above the 0.19 upper limit. sIL-2Ra is shed by activated T-cells and is a marker of immune activation. At this level it may reflect the chronic low-grade inflammation from the metabolic picture, or it may be driven by the alcohol. His soluble TNF receptor II (sTNFRII) is 0.34, marginally above 0.32, and his Heparin-binding EGF-like growth factor (HB-EGF) is 269.69, above the 135.99 upper limit. HB-EGF is involved in tissue repair and cell growth and rises with vascular stress and inflammation. Together, these inflammatory markers paint a picture of a body under chronic metabolic and inflammatory strain. His Interleukin-15 is 0.56, below the 0.89 lower limit. IL-15 is involved in natural killer cell and T-cell maintenance. A low level may reflect immune regulation being diverted by the chronic inflammatory load elsewhere.\n\nHis bicarbonate is 13.5, below the 22 lower limit. Bicarbonate is the blood's main acid buffer. A level this low does not fit with the rest of his results: his potassium, chloride, creatinine and glucose are all within range and his urine shows no ketones. It should not be acted on from this one reading, and it is worth asking his GP to repeat it.\n\nHis Dickkopf-1 (DKK-1) is 4,404.8, above the upper limit of 3,261.7. DKK-1 is a protein involved in bone metabolism: it inhibits the Wnt signalling pathway, which means at high levels it can suppress new bone formation. Elevated DKK-1 is seen in metabolic syndrome, inflammatory states and occasionally with certain cancers, and in this context the metabolic and inflammatory picture is the most likely driver. His calcium, phosphate, PTH and ALP are all within range, so there is no sign of active bone loss at present, but DKK-1 is worth mentioning to his GP as part of the metabolic picture.\n\nHis Apolipoprotein E is 14.85 against an upper limit of 7.3, and his Apolipoprotein CII is 15.54 against 9.17, with his Apolipoprotein CIII at 29.88 against 18. These are all apolipoproteins involved in triglyceride-rich lipoprotein metabolism. ApoE helps clear triglyceride-rich particles from the blood, and when it is elevated alongside very high triglycerides, it suggests either the clearance system is overwhelmed or there is an underlying genetic variant (particularly ApoE4) that slows clearance. ApoCII activates the enzyme (lipoprotein lipase) that breaks down triglycerides, while ApoCIII inhibits it: both being elevated reflects the sheer volume of triglyceride-rich particles in circulation. His small LDL cholesterol is 79.92 mg/dl against a limit of 60.8, meaning 40.9% of his LDL particles are the small, dense type that penetrate artery walls more easily. His VLDL cholesterol, the triglyceride-rich fraction, is 3.56 against a target of below 1.0. His non-HDL cholesterol is 8.61 against a target of below 3.8, and his atherogenic index of plasma is 0.776 against an ideal of below 0.11. Every lipid and lipoprotein metric in this report is significantly abnormal, and they all tell the same story: massive triglyceride excess driving a highly atherogenic particle profile.\n\nHis Prostate Cancer Risk Score is reported as increased risk. His total PSA is 1.05, which is within the normal range of below 1.4 and well within safe limits for a 38-year-old. The risk score is a composite that may be reflecting other inputs, but with a PSA this low, this is not an urgent finding. It should be mentioned to his GP for completeness, and PSA should be tracked over time.\n\nHis ANA (anti-nuclear antibodies) is positive with a speckled pattern at 1:80. ANA tests detect antibodies directed against the body's own cell nuclei, and a positive result can be associated with autoimmune conditions such as lupus, Sjogren's syndrome or mixed connective tissue disease. However, a 1:80 titre is the lowest positive level, and speckled-pattern ANAs at this titre are found in up to 15% of healthy people with no autoimmune disease at all. In the absence of joint pain, skin rashes, mouth ulcers, dry eyes or other autoimmune symptoms, this is most likely a non-specific finding. It does not need urgent action, but it is worth recording and mentioning to his GP so that if autoimmune symptoms ever develop in the future, the baseline is documented.\n\nHis Cystatin C is 1.06, marginally above the 1.05 upper limit. Cystatin C is a small protein filtered by the kidneys that gives a more accurate estimate of kidney function than creatinine alone, particularly in muscular or overweight individuals. His eGFR from Cystatin C is 79, below the optimal threshold of 90, and his combined creatinine and Cystatin C eGFR is 84. His creatinine-based eGFR is 88. For a 38-year-old, an eGFR in the low 80s is below where it should be. It is not in the danger zone (anything above 60 is within the laboratory range), but at 38 it should be comfortably above 90. The most likely explanations are the metabolic load from the weight, the high-protein diet, the alcohol, and the chronic low-grade inflammation. His urea is 6.30, within range, and his microalbumin-to-creatinine ratio was not detected, which is reassuring and means there is no protein leaking into the urine. This is not a kidney disease finding, but it is a signal that the kidneys are working harder than they should be at his age, and it gives him another reason to address the metabolic picture.\n\nHis SHBG is 17.50, below the 18.3 lower limit. Sex hormone binding globulin is the protein that carries testosterone in the blood, and low SHBG is strongly associated with insulin resistance, metabolic syndrome, high BMI and high alcohol intake, all of which apply here. His total testosterone is 12.50, within the laboratory range of 8.64 to 29 but well below the optimal band of 18 to 30 for a 38-year-old man. His free testosterone is 0.301, within range, and his bioavailable testosterone is 8.45, also within range. Because SHBG is low, a greater proportion of his total testosterone is free and bioavailable, which partly compensates for the low total. This means the tissues are seeing a reasonable amount of testosterone despite the low headline number. The low total testosterone is most likely driven by the combination of excess weight, high alcohol intake and metabolic inflammation rather than by a primary testicular or pituitary problem, and his LH at 6.2 and FSH at 4.23 are both normal, confirming the brain is signalling the testes appropriately. If the metabolic picture improves (weight loss, alcohol reduction), testosterone would be expected to rise. His cortisol is 180, at the lower end of the 138 to 690 range. A morning cortisol this low is still within range but is worth noting alongside his symptoms of fatigue, slow mornings and afternoon crashes, as cortisol should peak in the morning and decline through the day. His progesterone is 0.95, above the 0.47 upper limit for men. In men, progesterone is produced in small amounts by the adrenal glands and testes, and mild elevations are usually clinically insignificant.\n\nHis Epstein-Barr Virus (EBV) antibody results show a classic pattern of past infection: his EBNA IgG is 110 and his VCA IgG is 1,545, both strongly positive, while his VCA IgM is 0.515, negative. This means he caught EBV at some point in the past (most adults have) and his immune system dealt with it. The virus is latent, not active, and this is a normal finding.\n\nTurning to the positives, and there are genuine ones despite the metabolic strain in these results. His thyroid is working well overall: TSH is 0.794, FT4 is 19.90 and both thyroid antibodies are negative, making autoimmune thyroid disease very unlikely. His FT3 is 6.72, within the laboratory range but marginally above the optimal band of 4.5 to 6.5, with a healthy FT3:FT4 conversion ratio of 0.338 confirming efficient T4-to-T3 conversion. His blood sugar control, despite the metabolic picture, is surprisingly good: his HbA1c is 34.86, below the ideal threshold of 36, meaning his average blood sugar over the past three months has been well controlled. His fasting glucose is 6.30, which is within range but at the upper end, and his HOMA-IR (a measure of insulin resistance calculated from glucose and insulin) is 1.54, within the target of below 2.0. However, his HOMA-B, which estimates how hard the pancreas is working to produce insulin, is 39, below the 60 lower limit. This is a pattern to watch: blood sugar is currently controlled, but the pancreas may not be producing insulin as robustly as it should. His insulin is 38.3 pmol/L, at the lower end of the range, and his C-peptide is 2.60 ng/ml, within range. His adiponectin, a hormone from fat tissue that improves insulin sensitivity, is 1.65, at the very bottom of its range. Low adiponectin is strongly associated with visceral fat and metabolic syndrome. His fructosamine at 228 and estimated average glucose at 5.9 are both within range and consistent with the HbA1c.\n\nHis full blood count is largely healthy. Haemoglobin is 162, haematocrit 49.7%, red cell count 5.11, MCV 97.3, MCH 31.7 and MCHC 326, all within range. His white cell count is 7.11 with neutrophils at 3.29 and lymphocytes at 2.53, both healthy. His platelet count is 339, within range. His monocyte count is 0.94, above the 0.8 upper limit. Monocytes are white blood cells involved in inflammation and tissue repair, and mild elevation is commonly seen with chronic inflammation, metabolic syndrome and alcohol use, fitting the pattern in this report. His vitamin D is 83, within the optimal band of 75 to 120 but toward the lower end of it; a slightly higher dose would bring it closer to the middle of the optimal zone. His B12 is 604, within the optimal band of 500 to 900, reflecting his supplementation. His active B12 is 125, healthy. His folate is 18 and red cell folate is 1,247, both excellent. His zinc is 18.9, within the laboratory range but near the upper limit of 19.5 and above the optimal band.\n\nHis copper is 10.2, below the 11.0 lower limit. Copper and zinc compete for absorption, and his high-normal zinc (18.9, near the 19.5 upper limit), likely helped by the zinc in his multivitamin, is the most likely explanation for the low copper, as too much zinc suppresses copper absorption. He should check his multivitamin and any standalone zinc supplement and reduce the total zinc dose. Copper deficiency, if it persists, can cause anaemia and neurological symptoms, so this is worth correcting and rechecking.\n\nHis homocysteine is 11.0, within the laboratory range of 5 to 20 but above the optimal threshold of below 9. Homocysteine is an amino acid that, at elevated levels, is associated with cardiovascular risk and is metabolised using B12, folate and B6. His B12 and folate are both excellent, which suggests the elevation may be driven by inadequate B6 or by the sheer metabolic load, or by genetics (the MTHFR polymorphism). Given the severity of his cardiovascular picture, bringing homocysteine into the optimal zone is worth pursuing.\n\nHis globulin is 22.4, marginally below the 23 lower limit. Globulin is the sum of the blood's immune and transport proteins. At this margin, it is not a concern on its own, and his individual immunoglobulin levels (IgA 2.64, IgG 9.50, IgM 1.00) are all within range, confirming normal immune function. His albumin is 51.9, marginally above the 50 upper limit. Albumin is produced by the liver, and a marginally elevated level usually reflects good liver synthetic function and adequate protein intake rather than any disease process.\n\nHis creatine kinase is 381, above the 320 upper limit. CK is an enzyme released from muscles during exercise, and with three resistance sessions per week at moderate intensity, this is most likely exercise-induced muscle breakdown. His CK-MB (the heart-specific fraction) is 2.759, well within range, his troponin T is 11.10, within range, and his myoglobin is 54.12, within range, confirming the heart is not the source. The elevated CK is most likely from his training.\n\nHis uric acid is 393.6, within the laboratory range of 200 to 430 but above the optimal band of 200 to 380. Uric acid rises with high-protein diets, alcohol, metabolic syndrome and kidney strain, all of which are present. It is worth watching as it approaches the upper limit.\n\nHis PhenoAge is 36.7 against a calendar age of 38, meaning his biological age by this measure is 1.3 years younger than his actual age. This is a reasonable result, and it is being pulled in a favourable direction by his strong albumin, good lymphocyte count and modest CRP. However, the PhenoAge model does not capture the lipid picture in this report, and his true cardiovascular risk is far worse than his PhenoAge suggests.\n\nHis pancreatic markers are all healthy: lipase 34, pancreatic amylase 16, bile acids 2.60 and pancreastatin 22.72, all comfortably within range. His tumour markers are all within range: AFP 1.7, CA 19-9 at 10.6, calcitonin 1.46, CEA below 0.5, hCG below 0.2, mesothelin below 2.66 and HER2 ECD at 1.03. His autoimmune markers beyond the low-titre ANA are all negative: anti-CCP below 8, rheumatoid factor 8.49, anti-tissue transglutaminase 1.4 (making coeliac disease very unlikely), gastric parietal cell antibodies and intrinsic factor antibodies both negative. His diabetes autoantibodies (GAD65 at 37.3, IA-2 at 7.0, ZnT8 at 8.54 and insulin autoantibodies below 67.4) are all negative, confirming no autoimmune component to his blood sugar picture. His H. pylori antibody is 21.48, well below the 81.07 threshold, making active H. pylori infection unlikely. His urinalysis is entirely clean.\n\nConnecting his symptoms to the results: his fatigue, brain fog, low mood, afternoon crashes and poor sleep have been present for over a year. The bloods offer several plausible contributors. His testosterone is below optimal for his age, and low testosterone is strongly associated with fatigue, low mood and poor concentration. His cortisol is at the lower end of the morning range, which may contribute to his slow starts. His very high triglycerides and metabolic inflammation could themselves cause fatigue and brain fog through impaired cerebral blood flow and inflammatory signalling. His sleep of 6 to 7 hours with poor quality on waking is likely insufficient for recovery, particularly with his training load and alcohol intake. Alcohol at 15 or more drinks per week disrupts sleep architecture, suppresses REM sleep, elevates cortisol in the second half of the night and impairs next-day energy and mood. The vaping delivers nicotine, which is a stimulant that can disrupt sleep onset and quality. The afternoon crash pattern alongside a fasting glucose at the upper end of range and low HOMA-B may also reflect blood sugar instability through the day, particularly if meals are infrequent or carbohydrate-heavy when they do occur. The single biggest lever for his symptoms is likely the alcohol, followed by sleep duration and quality, followed by the metabolic improvements that will come with weight loss.","links":"The dominant story in this report is severe dyslipidaemia with a genetic amplifier. The triglycerides at 7.83, LDL at 5.05, total cholesterol at 9.92, and the full suite of atherogenic particle markers (elevated ApoB, ApoCII, ApoCIII, ApoE, small dense LDL, VLDL) all point to a lipid metabolism that is overwhelmed. On top of that, an Lp(a) of 205.1 means the cardiovascular risk is being driven from two directions: inherited and modifiable. The modifiable portion is large, as the Lp(a)-corrected LDL of 4.39 confirms, and the triglycerides are the most immediately actionable piece because they respond to alcohol reduction and dietary change more than any other lipid marker. The triglycerides are also the thread that connects the liver findings (elevated GGT, borderline ALT), the inflammatory markers (raised C3, raised sIL-2Ra, raised HB-EGF, mildly raised hsCRP), and the metabolic signals (low adiponectin, low SHBG, borderline glucose) into a single metabolic syndrome picture.\n\nThe ferritin at 606 sits within this metabolic story but also raises an independent question. The transferrin saturation at 40.4% is at the top of the ideal band, not dramatically above it, which makes the inflammatory and metabolic explanation plausible: chronic metabolic inflammation and alcohol both elevate ferritin as an acute phase response. But the European ancestry and the degree of elevation mean haemochromatosis cannot be assumed absent without the HFE gene test. The answer to that question changes the management plan: if haemochromatosis is confirmed, regular venesection (blood donation) becomes part of the treatment and the iron stores need active monitoring for life.\n\nThe bicarbonate at 13.5 is the one result that does not fit the rest of the picture. His potassium, chloride, creatinine and glucose are normal and his urine shows no ketones, so it is best treated as a single reading to repeat through his GP rather than built into the explanation for anything else.\n\nThe kidney function is a secondary concern that flows from the metabolic picture. Cystatin C at 1.06 and eGFR in the low 80s at 38 suggest the kidneys are working harder than expected for his age. The metabolic load and the uric acid (approaching the upper limit) are likely contributors. If the metabolic picture improves, kidney function should recover, but it needs monitoring.\n\nThe symptoms of fatigue, brain fog, low mood and poor sleep do not have a single dramatic blood-test explanation, but the report offers at least four contributory mechanisms: below-optimal testosterone, very high triglycerides and metabolic inflammation, alcohol-disrupted sleep architecture, and simple sleep insufficiency. None of these alone would explain symptoms lasting over a year, but stacked together they are more than sufficient. The absence of thyroid disease, anaemia, B12 or folate deficiency, coeliac disease, diabetes autoimmunity and significant kidney disease is genuinely useful information: it narrows the field to the metabolic and lifestyle factors that are within his control.\n\nThe low copper driven by zinc excess from supplementation is a separate, straightforward issue. Reducing the zinc dose and rechecking copper in three months should resolve it. The positive ANA at 1:80 is most likely a non-specific finding in the context of metabolic inflammation and does not require action unless autoimmune symptoms develop.","lifestyle":"Cut alcohol to under seven drinks per week as the first priority, and aim for under four within three months. Anchor: set two or three alcohol-free days that are fixed (e.g. Monday, Wednesday, Sunday to start). Why: alcohol is the single biggest modifiable driver of his GGT at 102.7, his triglycerides at 7.83, his ferritin at 606, his sleep disruption, his below-optimal testosterone and his afternoon crashes. Reducing it will move more markers in this report than any other single change.\nAdd two portions of oily fish per week (salmon, mackerel, sardines) and replace any remaining refined carbohydrate with whole grains, oats or legumes. Anchor: make two evening meals per week a fish-based meal. Why: omega-3 from fish lowers triglycerides directly, and soluble fibre from oats and legumes helps clear LDL cholesterol. His triglycerides at 7.83 and LDL at 5.05 both need dietary support alongside any medication his GP may consider.\nAdd a palm-sized portion of protein to every meal and ensure he is eating at least three meals a day with consistent timing. Anchor: breakfast within an hour of waking, protein on the plate before anything else. Why: consistent meal timing and adequate protein stabilise blood sugar through the day, which addresses his afternoon crash and fasting glucose of 6.30. His protein target is 126g per day.\nIncrease vegetable and fruit portions from 2 to 3 per day to at least 5, with emphasis on leafy greens, broccoli, peppers and berries. Anchor: add a portion of vegetables to every meal, starting with lunch. Why: more vegetables and fruit add fibre, potassium and magnesium, help bring down LDL and triglycerides alongside the other changes, and support the liver and gut.\nFix his wake time at the same time every day, including weekends, and get outside into natural light within 30 minutes of waking. Set a caffeine cut-off of 1pm and stop vaping after 7pm. Anchor: alarm at the same time, shoes on, walk outside before checking his phone. Why: a fixed wake time and morning light reset the circadian rhythm and lift morning cortisol (his is 180, at the lower end), which directly addresses the slow-to-get-going mornings and afternoon crash. Nicotine is a stimulant that disrupts sleep onset.\nAim for a calorie intake of around 2,700 kcal per day, which is roughly 300 below his estimated expenditure of 2,990 kcal, to support a gradual fat loss towards a first milestone of 90 kg and an eventual target of around 83 kg (a BMI just under 25). Anchor: track roughly for two weeks to calibrate portion sizes, then eat to hunger with the protein floor of 126g per day as the non-negotiable. Why: reducing body fat will lower triglycerides, raise HDL, improve testosterone, reduce ferritin (if metabolic rather than genetic) and take strain off the kidneys.\nStop any standalone zinc supplement and check his multivitamin for zinc content. Why: his zinc is 18.9, near the ceiling, which is the most likely reason his copper is below range at 10.2.","flags":"Total cholesterol 9.92 (limit below 5.0), LDL 5.05 (limit below 3.0), triglycerides 7.83 (limit below 2.3), HDL 1.31 (ideal above 1.55), ApoB 145 mg/dl, ApoB:A-I ratio 0.99, non-HDL cholesterol 8.61, VLDL 3.56, small dense LDL 79.92 (limit 60.8), atherogenic index 0.776, LDL:HDL ratio 3.85, TC:HDL ratio 7.57 and Cardiovascular Risk Score 100/100. Severe mixed dyslipidaemia with every lipid and atherogenic particle marker significantly above target. Needs prompt GP review for medication consideration and investigation for familial hyperlipidaemia. Elevated ApoE (14.85, limit 7.3), ApoCII (15.54, limit 9.17) and ApoCIII (29.88, limit 18) reflect the volume of triglyceride-rich particles and may point to a genetic component in triglyceride clearance.\nLipoprotein(a) 205.1 nmol/L (threshold 75). Significantly elevated inherited cardiovascular risk factor. Does not change with lifestyle. Should be recorded permanently in medical notes. First-degree relatives should be offered Lp(a) testing. Discuss with GP as part of overall cardiovascular risk assessment.\nFerritin 606 ug/L (upper limit 300), transferrin saturation 40.4%. Markedly elevated iron stores. Could reflect metabolic inflammation and alcohol, but haemochromatosis must be excluded with an HFE gene test given European ancestry and the degree of elevation. No iron supplements until resolved.\nGGT 102.7 IU/L (male upper limit 71), ALT 51 IU/L (within lab range but above optimal male threshold of 30), De Ritis ratio 0.72 (below optimal 0.8). Pattern consistent with alcohol-related liver stress, possibly compounded by fatty liver. FIB-4 0.57 and APRI 0.27 make fibrosis unlikely. A liver ultrasound is recommended.\nBicarbonate 13.5 mmol/L (lower limit 22). Below range, but it does not fit his other results (potassium, chloride, creatinine and glucose normal, no urine ketones). Ask the GP to repeat it before reading anything into it.\nNon-esterified fatty acids (NEFA) 1.750 mmol/L (limit 0.9). Nearly double the upper limit. Reflects high rates of fat mobilisation, likely from the low-carb diet, an overnight fast, alcohol and metabolic stress. Contributes to the liver's triglyceride production.\nCystatin C 1.06 (limit 1.05), eGFR (Cystatin C) 79, eGFR (combined) 84. Kidney filtration is below optimal for age 38. No proteinuria detected, which is reassuring. Likely driven by metabolic load. Should improve with the lifestyle changes but warrants monitoring.\nSHBG 17.50 nmol/L (lower limit 18.3), total testosterone 12.50 nmol/L (optimal above 18). Low SHBG driven by metabolic syndrome and alcohol. Total testosterone below optimal but free and bioavailable fractions compensated. Expect improvement with alcohol reduction and weight loss.\nhsCRP 1.06 mg/L (limit 1.0), Complement C3 1.66 g/L (limit 1.6), sIL-2Ra 0.50 ng/ml (limit 0.19), sTNFRII 0.34 ng/ml (limit 0.32), HB-EGF 269.69 pg/ml (limit 135.99), IL-15 0.56 pg/ml (lower limit 0.89). Multiple inflammatory markers mildly to moderately elevated, consistent with chronic metabolic inflammation. sIL-2Ra at more than double its limit may warrant mention to GP.\nCopper 10.2 umol/L (lower limit 11.0), zinc 18.9 umol/L (near upper limit 19.5). Low copper most likely driven by zinc from supplements. Reduce zinc intake and recheck copper in three months.\nHomocysteine 11.0 umol/L (optimal below 9). Above optimal despite excellent B12 and folate. Consider adding pyridoxal-5-phosphate (active B6) to bring it down, given the severity of the cardiovascular picture.\nHOMA-B 39% (lower limit 60). Below range, suggesting the pancreas may not be producing insulin as robustly as expected. Blood sugar control is currently good (HbA1c 34.86) but this warrants monitoring as a pre-diabetes risk marker.\nDKK-1 4,404.8 pg/ml (upper limit 3,261.7). Elevated bone metabolism inhibitor, likely driven by metabolic inflammation. Bone markers (calcium, phosphate, PTH, ALP) are normal. Mention to GP for context.\nCreatine kinase 381 IU/L (upper limit 320). Mildly elevated, with normal cardiac markers (CK-MB 2.759, troponin T 11.10). Most likely exercise-related from three resistance sessions per week.\nMonocyte count 0.94 x10^9/L (upper limit 0.8). Mild monocytosis consistent with chronic metabolic inflammation.\nAlbumin 51.9 g/L (upper limit 50), globulin 22.4 g/L (lower limit 23). Both marginally outside range. Albumin reflects good liver synthetic function. Globulin marginally low but individual immunoglobulins all normal.\nProgesterone 0.95 nmol/L (male upper limit 0.47). Mild elevation in a male is usually clinically insignificant.\nANA positive, speckled pattern 1:80. Low-titre positive ANA with no autoimmune symptoms. Found in up to 15% of healthy individuals. Record for baseline; no action needed unless symptoms develop.\nProstate Cancer Risk Score reported as increased risk despite PSA 1.05 (limit 1.4). PSA is well within safe limits for age 38. Mention to GP for context and baseline recording.\nReassuring negatives: thyroid function, thyroid antibodies, coeliac serology, diabetes autoantibodies, rheumatoid factor, anti-CCP, intrinsic factor and parietal cell antibodies, full blood count (apart from monocytes), B12, folate, liver fibrosis scores, urinalysis, pancreatic enzymes, all tumour markers, cardiac injury markers, H. pylori and EBV (past infection, not active) all make autoimmune disease, coeliac disease, type 1 diabetes, significant liver fibrosis, active infection, and cardiac injury unlikely.\nNot reported on this occasion: reticulocyte count.","recommendations":"Book a GP appointment to discuss the lipid results. Bring the numbers: total cholesterol 9.92, LDL 5.05, triglycerides 7.83, HDL 1.31, ApoB 145 mg/dl, Lp(a) 205.1 nmol/L. The GP should consider whether a statin and/or fibrate is appropriate given the severity of the dyslipidaemia and the Lp(a), and whether referral to a lipid clinic is warranted for investigation of familial hyperlipidaemia.\nRequest an HFE gene test to investigate the ferritin of 606 and exclude hereditary haemochromatosis. Do not take iron supplements or iron-containing multivitamins until this is resolved.\nAsk for the bicarbonate (13.5) to be repeated, as it does not fit his other results.\nRequest a liver ultrasound to assess for fatty liver disease, given GGT 102.7, borderline ALT and very high triglycerides.\nAsk the GP to record the Lp(a) of 205.1 permanently and to consider offering Lp(a) testing to first-degree relatives.\nMention the positive ANA (speckled 1:80) for baseline documentation and the Prostate Cancer Risk Score for context alongside the normal PSA of 1.05.\nRetest in four months, focusing on: lipid panel including triglycerides, GGT, ALT, ferritin (with HFE result by then), bicarbonate, cystatin C and eGFR, HOMA-IR and HOMA-B, copper, hsCRP and testosterone. Calorie target 2,700 kcal per day, protein floor 126g per day, first weight milestone 90 kg.","supplementation":"DO NOT take iron supplements or any multivitamin containing iron. His ferritin is 606, more than double the upper limit, and adding iron could cause organ damage, particularly if haemochromatosis is confirmed.\nVitamin D3 (cholecalciferol): 3,000 IU daily, taken with his largest meal (which contains fat for absorption). His level is 83, within range but below the middle of the optimal band (75 to 120). At a BMI of 29, fat tissue sequesters vitamin D, so a slightly higher dose than standard is appropriate. Always take with vitamin K2 (below).\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. Vitamin K2 directs calcium into bones and teeth and away from artery walls, which is particularly important given his elevated DKK-1 and severe cardiovascular risk profile.\nOmega-3 fish oil: 3g combined EPA and DHA daily, split across two doses with meals. His triglycerides at 7.83 are the primary target. Omega-3 at this dose has a direct triglyceride-lowering effect of roughly 15 to 25%, and he is already taking fish oil, so he should check the label and increase to this therapeutic dose.\nMagnesium glycinate: 400mg before bed. Supports sleep quality, blood pressure, insulin sensitivity and muscle recovery. He is already supplementing, but should ensure the form is glycinate (best absorbed and most calming) at this dose.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily. His B12 is 604, within the optimal range, so his current supplementation is working. Continue at this dose. Sublingual methylcobalamin is the preferred form as it bypasses the gut.\nPyridoxal-5-phosphate (active vitamin B6): 50mg daily. His homocysteine is 11.0 despite excellent B12 and folate, suggesting the B6-dependent pathway may be the bottleneck. P5P is the active form that does not require liver conversion.\nStop any standalone zinc supplement and choose a multivitamin that contains no more than 10mg of zinc, or switch to one without zinc entirely. His zinc is 18.9 (near the 19.5 ceiling) and his copper is 10.2 (below the 11.0 lower limit). Zinc at this level is the most likely reason his copper is low.\nThe most important changes from this report are not supplements. They are reducing alcohol to under seven drinks per week, adding oily fish and vegetables, and losing weight towards 90 kg, then 83 kg. Those changes will move the triglycerides, GGT, ferritin, testosterone, SHBG and kidney function more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 45 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 44.8. Weakest systems: lipids & cardiovascular 9%, iron studies 16%, immunology 25%. Biggest drags: Gamma-Glutamyltransferase (GGT), LDL Cholesterol, Lipoprotein (a), Triglycerides.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"36.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"","upper_normal":"43","lower_optimal":"","upper_optimal":"38","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4419","units":"years","description":"PhenoAge is a biological age estimate calculated from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. His PhenoAge of 36.7 is 1.3 years younger than his calendar age of 38, which is a favourable result. The good albumin, healthy lymphocyte count and modest CRP are pulling his PhenoAge down. However, PhenoAge does not capture lipid risk, so it understates his true cardiovascular vulnerability. RDW was reported by the lab at 13.5%.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"100","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built now, not the ten-year chance of a heart attack. His score of 100 is the maximum possible, driven by extreme triglycerides, significantly elevated LDL and ApoB, low HDL, very high Lp(a) and marginally elevated hsCRP. At 38, his statistical ten-year event risk may still be low because of his age, but the score captures the damage being accumulated right now. The gap between those two numbers is the window he has to act.","low_causes":"Healthy lipids, low inflammation, low Lp(a)","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3672","lower_normal":"50","upper_normal":"375","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.4051","units":"nmol/l","description":"Vitamin D is a fat-soluble hormone that supports bone health, immune function, mood and muscle strength. His level of 83 is within the optimal range of 75 to 120, meaning his supplementation is doing its job. At a BMI of 29, fat tissue sequesters vitamin D, so he needs a slightly higher dose than a leaner person to maintain this level. Continuing his current supplement with a modest increase to 3,000 IU will help keep him in the middle of the optimal zone.","low_causes":"Inadequate sun exposure, dark skin, obesity, malabsorption, low dietary intake","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"activeb12","name":"Active B12","group":"VITAMINS & NUTRIENTS","result":"125.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"25.1","upper_normal":"165","lower_optimal":"70","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4403","upper_optimal_position":"0.6667","units":"pmol/l","description":"Active B12, also called holotranscobalamin, is the form of vitamin B12 that is immediately available for use by the body's cells. It is a more accurate measure of B12 status than total B12 because it reflects what is actually being delivered to the tissues. His level of 125 is well within the optimal range, confirming that his B12 supplementation is effective and his body is absorbing it well.","low_causes":"Inadequate dietary intake, malabsorption, pernicious anaemia, metformin use","high_causes":"B12 supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"copper","name":"Copper","group":"VITAMINS & NUTRIENTS","result":"10.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3128","lower_normal":"11","upper_normal":"24","lower_optimal":"13","upper_optimal":"22","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.6154","units":"umol/l","description":"Copper is an essential trace mineral involved in iron metabolism, energy production, connective tissue formation and antioxidant defence. His level of 10.2 is below the 11.0 lower limit. The most likely cause is competitive inhibition by his high zinc intake: zinc and copper share the same absorption pathway in the gut, and his zinc is 18.9, near the ceiling of its range. Reducing zinc supplementation should allow copper levels to normalise. Persistent copper deficiency can cause anaemia and neurological symptoms, so this should be rechecked after adjusting supplements.","low_causes":"Excess zinc supplementation, malabsorption, Menkes disease, gastric surgery","high_causes":"Inflammation, infection, Wilson's disease, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folicacid","name":"Folic Acid","group":"VITAMINS & NUTRIENTS","result":"18.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5434","lower_normal":"3","upper_normal":"26.8","lower_optimal":"8","upper_optimal":"26.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4034","upper_optimal_position":"0.6667","units":"ug/l","description":"Folic acid, or folate, is a B vitamin essential for DNA synthesis, red blood cell production and homocysteine metabolism. His level of 18.0 is well within the optimal range, reflecting good dietary intake from his protein-rich foods and likely contribution from his multivitamin. This is helping keep his homocysteine in check, though not fully into the optimal zone.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, certain medications","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glutathionereductase","name":"Glutathione Reductase","group":"VITAMINS & NUTRIENTS","result":"44.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"33","upper_normal":"","lower_optimal":"33","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5000","upper_optimal_position":"1.0000","units":"IU/L","description":"Glutathione reductase is an enzyme that reflects riboflavin (vitamin B2) status. A result above 33 indicates adequate B2 levels. His level of 44 confirms good riboflavin status, which is important because B2 supports energy metabolism, antioxidant defence and the recycling of glutathione, the body's master antioxidant.","low_causes":"Riboflavin (B2) deficiency, malnutrition","high_causes":"B2 supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"redcellfolate","name":"Red Cell Folate","group":"VITAMINS & NUTRIENTS","result":"1247.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6623","lower_normal":"523","upper_normal":"1257","lower_optimal":"800","upper_optimal":"1257","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4591","upper_optimal_position":"0.6667","units":"ug/l","description":"Red cell folate measures the folate stored inside red blood cells over the previous three months, giving a longer-term picture of folate status than the serum level alone. His result of 1,247 is near the top of the range and well within the optimal zone, confirming excellent long-term folate stores.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, increased demand","high_causes":"Supplementation, high dietary intake, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tas","name":"Total Antioxidant Status (TAS)","group":"VITAMINS & NUTRIENTS","result":"2.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8385","lower_normal":"1.3","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5769","upper_optimal_position":"1.0000","units":"mmol/l","description":"Total antioxidant status measures the overall capacity of the blood to neutralise free radicals, reflecting the combined effect of dietary antioxidants, endogenous enzymes and supplementation. His level of 2.18 is comfortably above the 1.3 minimum, indicating good antioxidant defence. This is important given the metabolic and inflammatory strain seen elsewhere in the report.","low_causes":"Poor diet, oxidative stress, chronic disease, smoking","high_causes":"High fruit and vegetable intake, antioxidant supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"604","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5697","lower_normal":"197","upper_normal":"771","lower_optimal":"500","upper_optimal":"771","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5093","upper_optimal_position":"0.6667","units":"ng/l","description":"Vitamin B12 is essential for nerve function, red blood cell formation and DNA synthesis. His level of 604 sits within the optimal range of 500 to 900, confirming that his B12 supplementation is effective. This is particularly important given his alcohol intake, as alcohol can impair B12 absorption over time.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, alcohol, metformin","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"zinc","name":"Zinc","group":"VITAMINS & NUTRIENTS","result":"18.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6429","lower_normal":"11.1","upper_normal":"19.5","lower_optimal":"12","upper_optimal":"18","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6071","units":"umol/l","description":"Zinc is an essential mineral involved in immune function, wound healing, testosterone production and over 300 enzymatic reactions. His level of 18.9 is within the laboratory range but above the optimal upper limit of 18, sitting near the 19.5 ceiling. At this level, excess zinc is competitively inhibiting copper absorption, driving his copper below range. He should reduce his zinc intake by stopping any standalone zinc supplement and checking his multivitamin's zinc content.","low_causes":"Poor dietary intake, malabsorption, alcohol, chronic disease","high_causes":"Excessive supplementation, contamination","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"zinctransporter8znt8auto","name":"Zinc Transporter 8 (ZnT8) Autoantibodies","group":"SPECIALIZED TESTS","result":"8.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0757","lower_normal":"","upper_normal":"56.41","lower_optimal":"","upper_optimal":"56.41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"NG/ML","description":"ZnT8 autoantibodies target a zinc transporter on the surface of insulin-producing beta cells in the pancreas. Their presence would suggest an autoimmune attack on the pancreas, as seen in type 1 diabetes. His level of 8.54 is well below the 56.41 threshold, confirming no autoimmune component to his blood sugar picture.","low_causes":"","high_causes":"Type 1 diabetes, latent autoimmune diabetes in adults (LADA)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"1.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3453","lower_normal":"1.44","upper_normal":"7.27","lower_optimal":"3","upper_optimal":"7.27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4225","upper_optimal_position":"0.6667","units":"ug/ml","description":"Adiponectin is a hormone produced by fat tissue that improves insulin sensitivity, reduces inflammation and protects blood vessels. Unlike most things fat tissue produces, adiponectin goes down as body fat goes up, which is one of the paradoxes of metabolic syndrome. His level of 1.65 is at the very bottom of the range, well below the optimal zone starting at 3.0. Low adiponectin is strongly associated with visceral fat, insulin resistance, high triglycerides and cardiovascular risk. Losing weight is the most effective way to raise adiponectin.","low_causes":"Visceral obesity, metabolic syndrome, insulin resistance, genetics","high_causes":"Low body fat, exercise, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4848","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5758","units":"ng/ml","description":"C-peptide is released in equal amounts to insulin when the pancreas produces it, making it a reliable measure of how much insulin the pancreas is actually making. His level of 2.60 ng/ml is within the optimal range, confirming the pancreas is producing insulin. Taken alongside the low HOMA-B, this suggests the pancreas is producing insulin but perhaps not as generously as expected for the glucose level it is facing.","low_causes":"Type 1 diabetes, LADA, low-carbohydrate diet, fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"228","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5056","lower_normal":"151","upper_normal":"300","lower_optimal":"180","upper_optimal":"270","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3982","upper_optimal_position":"0.5996","units":"umol/l","description":"Fructosamine measures average blood sugar control over the past two to three weeks, complementing HbA1c which looks at the past three months. His level of 228 is within the optimal range, consistent with the good HbA1c result and confirming stable blood sugar control in both the short and medium term.","low_causes":"Low albumin, protein-losing conditions","high_causes":"Poorly controlled diabetes, high blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"6.30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5889","lower_normal":"4","upper_normal":"7","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4889","units":"mmol/l","description":"Fasting glucose measures the concentration of sugar in the blood after an overnight fast. His level of 6.30 is within the laboratory range but above the optimal threshold of 5.4. A fasting glucose between 5.5 and 6.9 is classified as impaired fasting glucose, which is a pre-diabetic range. In the context of his good HbA1c of 34.86 and low HOMA-IR of 1.54, this single reading may partly reflect the high-protein diet (gluconeogenesis from protein) or alcohol the evening before. It is worth monitoring but is not diagnostic of pre-diabetes on its own.","low_causes":"Fasting, excess insulin, alcohol, liver disease","high_causes":"Pre-diabetes, diabetes, stress, high carbohydrate intake, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"34.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4150","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated (coated with sugar) over the past two to three months, giving the best long-term picture of blood sugar control. His level of 34.86 is below the 36 optimal threshold and well below the 42 diabetic threshold. This is a genuinely good result and confirms that, despite the fasting glucose being at the upper end, his average blood sugar over the past three months has been well controlled.","low_causes":"Low average blood sugar, haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3850","lower_normal":"","upper_normal":"2","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and insulin to estimate how resistant the body's cells are to insulin's signal. A higher number means more resistance. His result of 1.54 is within the target of below 2.0 and close to the optimal threshold of 1.5. At a BMI of 29 with very high triglycerides, having a HOMA-IR this low is a genuine positive, suggesting the body's insulin sensitivity at the cellular level has been partly preserved, likely helped by his resistance training and protein-rich diet.","low_causes":"High insulin sensitivity, low carbohydrate intake, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"38.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3774","lower_normal":"17.8","upper_normal":"173","lower_optimal":"17.8","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4154","units":"pmol/l","description":"Insulin is the hormone produced by the pancreas that moves glucose from the blood into cells for energy. Fasting insulin reflects how hard the pancreas is working to keep blood sugar stable overnight. His level of 38.3 pmol/L is at the lower end of the laboratory range, which in isolation is a good sign, meaning the pancreas does not need to produce much insulin to control his blood sugar. However, taken alongside a fasting glucose of 6.30 and a HOMA-B of 39, it raises the question of whether the pancreas is producing slightly less insulin than the glucose level demands.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, obesity, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids (NEFA)","group":"GLUCOSE & INSULIN","result":"1.750","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9722","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2778","units":"mmol/l","description":"Non-esterified fatty acids, also called free fatty acids, are released from fat tissue into the blood to be used as fuel. His level of 1.750 is nearly double the 0.9 upper limit. Very high NEFA indicates rapid fat mobilisation, which is common on low-carb diets and during fasting, but at this level alongside very high triglycerides, it suggests the liver is being flooded with fatty acids and converting them to triglyceride-rich VLDL particles faster than the body can clear them. This is a major contributor to the triglyceride result.","low_causes":"Fed state, insulin action, low fat diet","high_causes":"Fasting, low-carb diet, uncontrolled diabetes, insulin resistance, alcohol, lipolysis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"afp","name":"Alpha-Fetoprotein (AFP)","group":"TUMOR MARKERS","result":"1.7","within_normal":"T
