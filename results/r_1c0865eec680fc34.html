ses":"Prostate cancer, benign prostatic hyperplasia, prostatitis, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"Alanine Aminotransferase (ALT)","group":"LIVER & METABOLIC","result":"51.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4636","lower_normal":"","upper_normal":"55","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2727","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. His level of 51 is within the laboratory range of below 55 but well above the optimal male threshold of below 30. This confirms the liver is under significant metabolic strain, consistent with the elevated GGT. The combination points to fatty liver disease driven by alcohol and the metabolic picture. The good news is that ALT responds well to lifestyle change, and reducing alcohol and losing weight should bring it down substantially.","low_causes":"Normal liver function","high_causes":"Fatty liver, alcohol, hepatitis, medications, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"51.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7089","lower_normal":"35","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains blood volume, carries hormones and nutrients, and reflects liver synthetic function. His level of 51.9 is marginally above the 50 upper limit. A mildly elevated albumin usually reflects good protein intake and adequate hydration rather than any disease process. It can also be seen with mild dehydration. This is not a concern.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, fluid overload","high_causes":"Dehydration, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aldolase","name":"Aldolase","group":"LIVER & METABOLIC","result":"5.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3289","lower_normal":"","upper_normal":"7.6","lower_optimal":"","upper_optimal":"7.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/L","description":"Aldolase is an enzyme found in muscle and liver tissue. Elevated levels can indicate muscle damage or certain liver conditions. His level of 5.00 is within the normal range, confirming no significant muscle or liver tissue breakdown beyond what is expected from his training.","low_causes":"","high_causes":"Muscle damage, liver disease, myositis, muscular dystrophy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3852","lower_normal":"30","upper_normal":"120","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5926","units":"IU/L","description":"ALP is an enzyme found in the liver, bones and bile ducts. It is particularly useful for identifying bile duct obstruction or bone disease. His level of 44 is well within the normal range, confirming no bile duct issues and healthy bone turnover.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ast","name":"Aspartate Aminotransferase (AST)","group":"LIVER & METABOLIC","result":"36.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4575","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. It is less specific to the liver than ALT because it is also released during exercise. His level of 36.6 is within the laboratory range but above the optimal threshold of 30. Given his three resistance sessions per week, some of this may be from muscle turnover, but alongside the elevated GGT and borderline ALT, it adds to the picture of liver strain.","low_causes":"Normal liver and muscle function","high_causes":"Liver disease, alcohol, heart attack, muscle damage, exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"bileacids","name":"Bile Acids","group":"LIVER & METABOLIC","result":"2.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1300","lower_normal":"","upper_normal":"10","lower_optimal":"","upper_optimal":"10","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"umol/l","description":"Bile acids are produced by the liver and stored in the gallbladder to help digest fats. Elevated levels can indicate liver disease or bile duct obstruction. His level of 2.60 is well within the normal range, confirming healthy bile metabolism.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, cholestasis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"directbilirubin","name":"Direct Bilirubin","group":"LIVER & METABOLIC","result":"0.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0108","lower_normal":"","upper_normal":"6","lower_optimal":"","upper_optimal":"6","lower helmed by the volume of triglyceride-rich particles, or there may be a genetic ApoE variant (such as ApoE2/E2) that impairs clearance. His GP may consider ApoE genotyping as part of the lipid investigation.","low_causes":"Efficient lipoprotein clearance","high_causes":"Hypertriglyceridaemia, ApoE2/E2 genotype (Type III hyperlipidaemia), metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"146.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5231","lower_normal":"95","upper_normal":"186","lower_optimal":"150","upper_optimal":"186","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5348","upper_optimal_position":"0.6667","units":"mg/dl","description":"ApoA-I is the main structural protein of HDL, the protective cholesterol that removes cholesterol from artery walls. His level of 146.8 is within the laboratory range but below the optimal threshold of 150. Higher ApoA-I reflects more protective HDL particles, so this is consistent with his below-optimal HDL cholesterol of 1.31.","low_causes":"Low HDL, metabolic syndrome, smoking, sedentary lifestyle, genetics","high_causes":"Exercise, moderate alcohol, genetics, healthy lipid metabolism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"145","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5914","lower_normal":"49","upper_normal":"173","lower_optimal":"49","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4167","units":"mg/dl","description":"Apolipoprotein B is the single best measure of atherogenic particle number. Each LDL, VLDL and Lp(a) particle carries exactly one ApoB molecule, so the ApoB level tells you how many artery-damaging particles are circulating. His level of 145 mg/dl is within the broad laboratory range but far above the optimal target of below 80, reflecting the massive excess of atherogenic particles driven by his elevated LDL, very high triglycerides (producing VLDL) and elevated Lp(a).","low_causes":"Low LDL, low VLDL, healthy lipid metabolism, medication","high_causes":"High LDL, hypertriglyceridaemia, metabolic syndrome, familial hyperlipidaemia, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteincii","name":"Apolipoprotein CII","group":"LIPIDS & CARDIOVASCULAR","result":"15.54","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9502","lower_normal":"1.68","upper_normal":"9.17","lower_optimal":"1.68","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4811","units":"mg/dl","description":"ApoCII is a small protein that sits on the surface of triglyceride-rich lipoproteins and activates lipoprotein lipase, the enzyme that breaks down triglycerides. His level of 15.54 is well above the 9.17 upper limit. Elevated ApoCII reflects the sheer volume of triglyceride-rich particles in circulation. It is a consequence of the hypertriglyceridaemia rather than a separate finding.","low_causes":"ApoCII deficiency (rare genetic cause of hypertriglyceridaemia)","high_causes":"Hypertriglyceridaemia, metabolic syndrome, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinciii","name":"Apolipoprotein CIII","group":"LIPIDS & CARDIOVASCULAR","result":"29.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9600","lower_normal":"4.5","upper_normal":"18","lower_optimal":"4.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4691","units":"mg/dl","description":"ApoCIII inhibits lipoprotein lipase, the enzyme that clears triglycerides from the blood. His level of 29.88 is significantly above the 18 upper limit. High ApoCIII slows triglyceride clearance and is a direct contributor to hypertriglyceridaemia. It is also an independent cardiovascular risk factor because it promotes inflammation and endothelial dysfunction. This marker will fall as triglycerides come down with alcohol reduction and dietary change.","low_causes":"Efficient triglyceride clearance","high_causes":"Hypertriglyceridaemia, metabolic syndrome, insulin resistance, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"7.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7570","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"","description":"The TC:HDL ratio divides total cholesterol by protective HDL cholesterol. A ratio below 5 is the target, and below 4 is ideal. His ratio of 7.57 is well above both thresholds, driven by very high total cholesterol and below-optimal HDL. This is one of the simplest measures of overall lipid-driven cardiovascular risk, and his is significantly elevated.","low_causes":"High HDL, low total cholesterol, healthy lifestyle","high_causes":"High total cholesterol, low HDL, metabolic syndrome, familial hyperlipidaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4226","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.55","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5000","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL cholesterol is the protective form that removes cholesterol from artery walls and transports it back to the liver for disposal, a process called reverse cholesterol transport. His level of 1.31 is below both the laboratory minimum of 1.55 and the male optimal target of above 1.4. Low HDL is strongly associated with metabolic syndrome, high triglycerides, excess weight, sedentary behaviour and alcohol excess. Exercise (particularly resistance training) and weight loss are the most effective ways to raise HDL.","low_causes":"Metabolic syndrome, obesity, physical inactivity, smoking, high triglycerides, genetics","high_causes":"Exercise, moderate alcohol, genetics, healthy body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"11.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"5","upper_normal":"20","lower_optimal":"5","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4222","units":"umol/l","description":"Homocysteine is an amino acid produced during protein metabolism. Elevated levels are associated with increased cardiovascular risk, as homocysteine damages the lining of blood vessels and promotes blood clotting. His level of 11.0 is within the laboratory range but above the optimal threshold of below 9. His B12 and folate are both excellent, so the elevation is likely driven by inadequate vitamin B6, which is needed for one of the two homocysteine-clearing pathways. Given the severity of his cardiovascular risk profile, adding active B6 (pyridoxal-5-phosphate) to bring homocysteine below 9 is a worthwhile step.","low_causes":"Good B12, folate and B6 status","high_causes":"B12/folate/B6 deficiency, MTHFR mutation, renal impairment, alcohol, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8417","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL cholesterol is the primary carrier of cholesterol that deposits in artery walls, driving atherosclerosis. His level of 5.05 is well above the 3.0 upper limit and nearly double the 2.6 optimal target. Even after correcting for the cholesterol carried by his Lp(a), his Lp(a)-corrected LDL is still 4.39, confirming a large modifiable component. This is a result that needs both lifestyle change and likely medication to bring into a safe range, particularly given his elevated Lp(a).","low_causes":"Low saturated fat diet, statin use, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"205.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"75","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lipoprotein(a), often written Lp(a), is a modified LDL particle with an extra protein (apolipoprotein(a)) attached. It is entirely genetically determined and does not change with diet, exercise or most medications. His level of 205.1 is significantly above the 75 nmol/L threshold at which it is considered to add meaningful cardiovascular risk. At this level, Lp(a) works through three mechanisms: it deposits cholesterol in artery walls like LDL, it encourages blood clot formation by interfering with fibrinolysis (the body's clot-dissolving system), and it drives inflammation inside the artery wall. This is a significant and independent inherited risk factor. It should be permanently recorded in his medical notes, and his first-degree relatives should be offered Lp(a) testing because the trait is genetic. His GP should factor this into the overall cardiovascular risk discussion.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"79.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6572","lower_normal":"","upper_normal":"60.8","lower_optimal":"","upper_optimal":"40","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3289","units":"mg/dl","description":"Small dense LDL particles are a subtype of LDL that are more dangerous than large buoyant LDL because they penetrate artery walls more easily and are more susceptible to oxidation. His level of 79.92 is above the 60.8 limit, with 40.9% of his total LDL being the small dense type. High triglycerides are the primary driver of small dense LDL formation, because triglyceride-rich VLDL particles exchange triglycerides for cholesterol with LDL particles, making the LDL smaller and denser. Lowering triglycerides will shift the LDL profile towards larger, less dangerous particles.","low_causes":"Low triglycerides, healthy lipid metabolism","high_causes":"High triglycerides, metabolic syndrome, insulin resistance, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"9.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9920","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood: LDL, HDL and VLDL. His level of 9.92 is nearly double the 5.0 upper limit. This reflects the combined effect of elevated LDL, very high triglyceride-rich VLDL and low HDL. Total cholesterol alone is a blunt measure, but at this level it confirms a severely abnormal lipid profile that needs prompt attention.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"High fat diet, familial hypercholesterolaemia, hypothyroidism, metabolic syndrome, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"7.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"2.3","lower_optimal":"","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are the main form of fat in the blood, carried in VLDL particles produced by the liver. His level of 7.83 is more than three times the 2.3 upper limit and is in a range that warrants investigation in its own right. Triglycerides above 10 carry a risk of acute pancreatitis, and at 7.83 he is approaching that territory. The main drivers of very high triglycerides are alcohol (which directly stimulates hepatic triglyceride production), excess carbohydrate, obesity, insulin resistance and genetic predisposition. At 15 or more drinks per week, alcohol is almost certainly the dominant factor. Reducing alcohol is the single most effective intervention for triglycerides at this level, and his GP may also consider a fibrate medication.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"Alcohol, obesity, metabolic syndrome, diabetes, high sugar/carb diet, familial hypertriglyceridaemia, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"beta2microglobulin","name":"Beta-2-Microglobulin","group":"KIDNEY FUNCTION","result":"1.80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"0.9","upper_normal":"3","lower_optimal":"0.9","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5873","units":"mg/l","description":"Beta-2-microglobulin is a small protein filtered by the kidneys and is a sensitive marker of kidney function and immune activation. His level of 1.80 is within the optimal range, suggesting the kidneys are filtering small proteins adequately.","low_causes":"","high_causes":"Kidney disease, multiple myeloma, lymphoma, autoimmune disease, HIV","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"97.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6133","lower_normal":"64","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5917","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. Higher levels can indicate reduced kidney function, though muscular men naturally have higher creatinine from greater muscle mass. His level of 97.6 is within the laboratory range but above the optimal band, consistent with his training and body composition. The more informative measure is the eGFR derived from Cystatin C, which accounts for body composition better.","low_causes":"Low muscle mass, malnutrition","high_causes":"Reduced kidney function, high muscle mass, high protein diet, dehydration, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6736","lower_normal":"0.57","upper_normal":"1.05","lower_optimal":"0.6","upper_optimal":"0.9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet or exercise, making it a more reliable marker of kidney function in active or muscular individuals. His level of 1.06 is marginally above the 1.05 upper limit. This translates to a Cystatin C-based eGFR of 79, which is below optimal for a 38-year-old and suggests the kidneys are working harder than expected. The most likely explanation is the metabolic load from his weight, high-protein diet, alcohol, high uric acid and chronic low-grade inflammation.","low_causes":"Good kidney function","high_causes":"Reduced kidney function, inflammation, thyroid disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated Glomerular Filtration Rate (eGFR)","group":"KIDNEY FUNCTION","result":"88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"ml/min/1.73m2","description":"eGFR estimates how much blood the kidneys filter per minute, calculated from creatinine. His creatinine-based eGFR is 88, within the reference range of above 60 but below the optimal threshold of 90. For a 38-year-old, eGFR should ideally be well above 90. However, his high protein intake and muscle mass may inflate his creatinine, making this estimate less reliable. The Cystatin C-based eGFR of 79 is likely more accurate for him.","low_causes":"Kidney disease, dehydration, kidney obstruction, medications","high_causes":"Hyperfiltration (early diabetes, high protein diet), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"microalbumincreatininera","name":"Microalbumin / Creatinine Ratio","group":"KIDNEY FUNCTION","result":"not detected","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/mmol creatinine","description":"The microalbumin-to-creatinine ratio detects tiny amounts of the protein albumin in the urine, which is an early sign of kidney damage. His result is not detected, meaning no albumin is leaking into the urine. This is reassuring and confirms that despite the Cystatin C being marginally elevated, there is no evidence of kidney damage at this stage.","low_causes":"","high_causes":"Early kidney disease, diabetes, hypertension, heart failure","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5723","lower_normal":"2.5","upper_normal":"7.8","lower_optimal":"3","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3648","upper_optimal_position":"0.6164","units":"mmol/l","description":"Urea is a waste product from protein metabolism, produced by the liver and excreted by the kidneys. His level of 6.30 is within the optimal range. On a high-protein diet, urea naturally runs higher, so this is a reassuring result.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, high protein diet, dehydration, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"393.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6139","lower_normal":"200","upper_normal":"430","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5942","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in red meat, organ meats, shellfish and alcohol (particularly beer). His level of 393.6 is within the laboratory range but above the optimal band of 200 to 380 for men. Elevated uric acid is associated with gout, kidney stones, metabolic syndrome and cardiovascular risk. His high-protein diet, alcohol intake and metabolic profile are all contributors. As the metabolic picture improves, uric acid should come down.","low_causes":"Low purine diet, medication","high_causes":"High purine diet, alcohol (especially beer), obesity, metabolic syndrome, kidney disease, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophilcount","name":"Basophil Count","group":"HEMATOLOGY","result":"0.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic reactions and inflammation. His count of 0.07 is within the normal range.","low_causes":"","high_causes":"Allergic reactions, myeloproliferative disorders, arrying protein in red blood cells. His level of 162 is well within the optimal range for a man, confirming he is not anaemic and his blood is carrying oxygen efficiently.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease, altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5373","lower_normal":"1","upper_normal":"3.5","lower_optimal":"1.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"10^9/L","description":"Lymphocytes are white blood cells that include T-cells, B-cells and natural killer cells, forming the backbone of the adaptive immune system. His count of 2.53 is within the optimal range, confirming healthy immune function.","low_causes":"Viral infection, immunosuppression, corticosteroids, stress","high_causes":"Viral infection, lymphoproliferative disorders, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Red Blood Cell Mean Cell Volume (MCV)","group":"HEMATOLOGY","result":"97.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6292","lower_normal":"76","upper_normal":"100","lower_optimal":"82","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5972","units":"fl","description":"MCV measures the average size of red blood cells. His level of 97.3 is within the laboratory range but above the optimal band of 82 to 95. A slightly elevated MCV can be seen with alcohol use, as alcohol interferes with folate metabolism in the bone marrow. His folate levels are excellent, so this is likely a direct effect of ystatin C is not affected by muscle mass. His eGFR of 79 is below the optimal threshold of 90 for a 38-year-old, confirming that kidney filtration is working harder than expected. The combination of metabolic load, high protein diet, alcohol and chronic low-grade inflammation is the likely cause. No proteinuria was detected, which is reassuring. This should improve as the metabolic picture is addressed but warrants monitoring.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration, early diabetes, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and Cystatin C for the most accurate estimate of kidney function. His combined eGFR of 84 is in line with the Cystatin C estimate and confirms kidney filtration is below optimal for his age. The absence of proteinuria is reassuring, and this is expected to improve with lifestyle changes.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration, early diabetes","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"64.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4694","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps dis function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
