<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Katy Hill","dob":"08/09/1974","report_date":"2026-07-27","summary":"Katy is a 51-year-old female presenting with a BMI of 22.4, following a low-carb, high-protein diet rated 8 out of 10 for quality with a volume of 3 out of 10. She trains 6 times per week (3 cardio, 3 resistance) at very high intensity with 15,000 or more daily steps. She is on HRT and takes no other medication. She reports brain fog, low sex drive, and joint pain and stiffness. Her goals are to improve long-term health and longevity, prevent disease, and boost her immune system.\n\nThere is a lot to be reassured by. Her kidney function is healthy on both creatinine and Cystatin C measures (eGFR 92). Her liver is in good health, with ALT at 9, AST at 27, and Gamma GT at 27 all within range. Her blood sugar control is excellent, with glucose at 4.2, HbA1c at 39, and HOMA-IR at 0.34 showing her cells respond to insulin exceptionally well. Her iron stores are genuinely good, with ferritin at 92 and serum iron at 26.7, which is a strong result for someone training at her volume. Her haemoglobin at 135 is within the ideal range. Her vitamin D at 123 is within optimal. Her B12 at 320 is within the ideal range, though at its lower boundary. Her thyroid is working with normal TSH, negative antibodies, and no sign of autoimmune disease. Her inflammation markers are low, with CRP at 1.2 and ESR at 8. Her rheumatoid factor at 4 rules out rheumatoid arthritis as a cause of the joint pain. Her coeliac screen is negative and reliable, confirmed by a normal IgA level. Her immune antibodies are all normal. Her tumour markers are within range, though CA125 at 21.6 is above the ideal level and worth repeating. Her Lipoprotein(a) at 25 is normal, which means there is no inherited cardiovascular risk and her cholesterol picture is entirely modifiable. Her urinalysis is normal, with the laboratory identifying the small amount of growth as probable skin contamination during collection.\n\nThe finding that speaks most directly to her symptoms is her available testosterone. Her free testosterone is 0.007, which is very low. Women produce far less testosterone than men, but it does important work: it supports sexual desire, mental clarity, mood, muscle maintenance, and the collagen that makes up joints and connective tissue. At 0.007, almost none is reaching her tissues, and this connects to all three symptoms she reported.\n\nTwo things have combined to produce it. Her total testosterone at 0.7 is in the lower part of the range for a woman, which is expected after the menopause since the ovaries contribute a meaningful share of a woman's testosterone. And her SHBG at 85.3 is toward the high end, so more of that already modest amount is bound up and unavailable. Three things she is currently doing all raise SHBG: the oestrogen in HRT raises it, low-carbohydrate eating raises it, and sustained caloric restriction raises it further. Each is modest on its own, but they stack.\n\nHer oestradiol at 204 is a reasonable level on HRT and considerably higher than it would be without it, which means the oestrogen replacement is working. This matters because it points the explanation for the low libido away from oestrogen and toward testosterone specifically. This is worth raising with whoever prescribes her HRT. Testosterone is prescribed for women in this situation in the UK and her prescriber will be familiar with the conversation. Her FSH at 50.29 confirms post-menopausal status, and it is common for FSH to remain elevated despite HRT.\n\nBeyond the testosterone finding, several other results share a common thread. Her cortisol is 425, above the ideal ceiling of 400. Cortisol is the body's main stress hormone, and in her case the most likely driver is physical rather than psychological. When the body is doing a great deal of work and receiving less fuel than that work costs, it raises cortisol to release stored energy. Six training sessions a week, more than 15,000 steps a day, and a food volume of 3 out of 10 is exactly the combination that produces this.\n\nHer free T3 is 4.2, below the ideal level of 4.5, with free T4 at 13.6 also marginally below ideal. Her TSH is normal at 0.94 and her thyroid antibodies are negative, so this is not a thyroid problem. When fuel is short, the body converts less of the storage form of thyroid hormone into the active form, which slows metabolism to conserve energy. This contributes to the brain fog and the sense of running below capacity.\n\nHer transferrin is 2.3, below the range that starts at 2.5. This is not an iron problem, since her ferritin at 92 is healthy and her iron levels are at the top of their range. What has fallen is the transport protein itself. Building transport proteins costs energy and amino acids, and a body running a deficit economises on that kind of housekeeping.\n\nHer white cell count at 4.09 and neutrophils at 2.36 are both sitting at the floor of their ranges rather than below them. Her reticulocytes at 52.3 are just above the lower limit. Immune cell production is one of the more expensive things the body does, and it is among the first to be trimmed when energy is limited. She listed strengthening her immune system as a goal, and the most direct answer this report can give is that the constraint is fuel and recovery, not a missing supplement.\n\nPut those findings together, the elevated cortisol, the suppressed thyroid conversion, the low transferrin, the immune counts at their floor, and one explanation covers all of them. She is eating an excellent diet but not enough of it. The body is economising.\n\nThe encouraging part is that her cortisol, while above ideal, has not risen dramatically. Her thyroid gland itself is working properly. Her ferritin is genuinely good. She is close to the edge rather than well past it, and that makes the correction straightforward.\n\nHer joint pain has a clear negative: rheumatoid factor, CRP and ESR all argue against inflammatory or autoimmune joint disease. What is left has two explanations that both link to the energy picture. Cortisol at 425 breaks down collagen faster than the body rebuilds it, and very low free testosterone removes one of the main hormonal signals that maintains connective tissue. Training 6 times a week on limited fuel then adds mechanical load to tissue being maintained less well than it should be.\n\nHer ApoB is 1.03, above the target of 0.9, and her ApoB/A-I ratio is 0.652, above the female threshold of 0.6. Her LDL at 2.96 is just inside its limit. This is the most useful cardiovascular finding to understand, because the particle count is above target while the LDL looks acceptable. Two things are likely contributing: the menopausal lipid shift, which raises LDL and ApoB in most women even on HRT, and the recognised pattern where lean, insulin-sensitive people on low-carbohydrate diets show raised LDL and ApoB alongside low triglycerides and high HDL, which is exactly her profile. Importantly, her Lp(a) at 25 is normal. There is no inherited component, and the elevation is modifiable. Worth discussing with her GP.\n\nHer amylase is 123, above its limit of 118, and her lipase is 70, above its limit of 60. When both pancreatic enzymes rise together it is more meaningful than either alone. Her kidney function is normal, so reduced clearance does not explain it. A very high-fat, low-carbohydrate diet places sustained demand on lipase production, which is a plausible and benign explanation. Her CA 19-9 is very low at 7.94, which is reassuring. The sensible step is to repeat both in a few months.\n\nHer FIB-4 liver score is 2.35, above the screening threshold, and the reason is a quirk of arithmetic rather than liver disease. FIB-4 uses ALT underneath a square root in the bottom half of its calculation. Her ALT is 9, which is unusually low, and that single number is what has pushed the score above the line. A low ALT is the opposite of what liver damage produces. Her actual liver markers are all normal. This is worth mentioning to her GP purely so nobody reading the number in isolation reaches the wrong conclusion.\n\nHer C-Peptide at 112.9 and HOMA-B at 52 are both below range, and her insulin at 1.82 is below range too. Her HOMA-IR at 0.34 is below range in the favourable direction. In someone with rising blood sugar these would matter a great deal. Her glucose is 4.2 and her HbA1c is 39, both normal. Her pancreas is producing very little because very little is being asked of it. This is adaptation, not failure.\n\nHer anion gap is 22.1, above the limit of 16. Her bicarbonate is entirely normal at 25.6, which argues against a true acid-base problem. A high-protein diet and heavy training both contribute. Worth repeating.\n\nHer MCHC at 346 is one point above range, which is usually laboratory variation. Her Total Antioxidant Activity at 1.79 is marginally above range, reflecting diet quality and supplementation. Neither is a concern.\n\nPhosphate was not returned by the laboratory and is worth including at the next blood test.","links":"The most important conversation is with her HRT prescriber. The findings to bring are the free testosterone of 0.007, the total testosterone of 0.7, the SHBG of 85.3, and the oestradiol of 204. The oestrogen replacement appears to be working, but available testosterone is very low, and this connects directly to the low libido, the brain fog, and the joint stiffness. Testosterone is prescribed for women in this situation in the UK. It is also worth asking whether the current HRT delivery method is contributing to the high SHBG, since different methods affect it differently.\n\nThe central lifestyle change is to eat more. Her diet quality at 8 out of 10 is genuinely good. Nothing needs changing about what she eats. The volume, at 3 out of 10, is the problem against 6 training sessions and 15,000 or more steps.\n\nAt 53kg and 154cm with that workload, caloric maintenance is approximately 1,900 to 2,100 calories. Protein should be 85 to 106g per day. Most of the gap is likely total energy rather than protein.\n\nSome carbohydrate around training is worth considering. Low-carb is working well for blood sugar and triglycerides, but carbohydrate also lowers SHBG, which would increase available testosterone. Placing 50 to 80g of carbohydrate around training sessions (rice, potatoes, oats, fruit) would support recovery and hormone availability without changing the rest of the approach.\n\nOne full rest day per week. A deload every fourth to sixth week. Sleep of 7 to 8 hours. These are the recovery basics that would support the immune counts, the thyroid conversion, the transferrin production, and the cortisol.\n\nFor the GP: the ApoB of 1.03 with a normal Lp(a) of 25, meaning the elevation is modifiable. The amylase of 123 and lipase of 70, both mildly raised, to repeat in a few months. The FIB-4 of 2.35, explained by a very low ALT of 9 rather than liver disease. The CA125 of 21.6 to repeat. And phosphate to include at next test.\n\nA follow-up test in 12 weeks: cortisol, free T3 and T4, transferrin, full blood count, ApoB and lipid panel, free and total testosterone with SHBG, amylase and lipase, anion gap, CA125, and B12.","flags":"Free testosterone 0.007, very low. Total testosterone 0.7, lower part of female range, with SHBG 85.3 toward the high end. HRT oestrogen, low-carb eating, and caloric restriction all raise SHBG. Directly relevant to low libido, brain fog, and joint stiffness. Oestradiol 204 indicates oestrogen replacement is working, pointing explanation at testosterone. Raise with HRT prescriber.\n\nCortisol 425, above ideal ceiling of 400. Consistent with low energy availability from 6 sessions per week, 15,000+ steps, and diet volume 3 out of 10.\n\nFree T3 4.2, below ideal 4.5. Free T4 13.6, marginally below ideal. TSH normal, antibodies negative. Reduced conversion under energy restriction, not thyroid disease.\n\nTransferrin 2.3, below range (limit 2.5). Not an iron problem: ferritin 92, iron 26.7. Reduced transport protein production from energy deficit.\n\nApoB 1.03 (above 0.9) and ApoB/A-I ratio 0.652 (above 0.6 female threshold). LDL 2.96 just inside limit. Lp(a) 25 normal, so no inherited component and elevation is modifiable. Likely menopausal lipid shift and low-carb pattern in a lean, insulin-sensitive person.\n\nAmylase 123 (above 118) and lipase 70 (above 60), both raised together. Kidney function normal (Cystatin C 0.96), excluding reduced clearance. CA 19-9 7.94. High-fat diet demand is plausible explanation. Repeat in a few months.\n\nFIB-4 2.35 (above 1.45). Driven by ALT of 9, unusually low, sitting under a square root in the denominator. Low ALT is the opposite of liver damage. AST 27, GGT 27, bilirubin 13, albumin 42 all normal.\n\nInsulin 1.82, C-Peptide 112.9, HOMA-IR 0.34, HOMA-B 52, all below range. Glucose 4.2 and HbA1c 39 normal. Reflects low insulin demand. HOMA-IR below range is favourable.\n\nAnion gap 22.1 (above 16). Bicarbonate normal at 25.6. High protein and training load. Repeat.\n\nMCHC 346, one point above range. Marginal.\n\nTotal Antioxidant Activity 1.79, marginally above range. Supplementation.\n\nCA125 21.6, within range, above ideal. Repeat at next test.\n\nPhosphate not returned by the laboratory. Include at next test.\n\nReassuring negatives: rheumatoid factor 4, CRP 1.2, ESR 8, ruling out inflammatory joint disease. Coeliac negative and reliable. Kidney function healthy. Thyroid antibodies negative. Ferritin 92. Vitamin D 123. Urine clear.","recommendations":"Increase how much you eat. The quality of your diet is good, the volume is not keeping pace with six training sessions a week and more than 15,000 steps a day. Aim for roughly 1,900 to 2,100 calories with 85 to 106g of protein.\n\nAdd 50 to 80g of carbohydrate around your training sessions without changing the rest of your low-carbohydrate approach. This supports recovery and helps lower SHBG, which would increase your available testosterone.\n\nSpeak to your HRT prescriber about your free testosterone of 0.007 alongside your SHBG of 85.3 and oestradiol of 204. This connects directly to the low libido, the brain fog and the joint stiffness.\n\nTake one full rest day a week, and halve your training volume for one week in every four to six.\n\nAsk your GP about the ApoB of 1.03, noting that your Lipoprotein(a) of 25 is normal so the elevation is modifiable.\n\nAsk your GP to repeat the amylase of 123 and lipase of 70 in a few months.\n\nMention the FIB-4 score of 2.35 to your GP with the explanation that it is driven by an unusually low ALT of 9 rather than by any liver problem.\n\nPhosphate was not returned by the laboratory this time, so ask for it at your next test.\n\nRetest in twelve weeks, covering cortisol, thyroid hormones, transferrin and iron studies, the full blood count, ApoB and the lipid panel, testosterone with SHBG, amylase and lipase, the anion gap, CA125 and B12.","supplementation":"There is less to recommend here than usual, because your nutrient levels are largely good and the change that matters most is food rather than supplements.\n\nVitamin B12 as sublingual methylcobalamin at 1,000 micrograms daily, dissolved under the tongue rather than swallowed. Your level of 320 is within the ideal range but at its lower boundary, and B12 supports nerve function and mental clarity, which is worth attending to given the brain fog. The sublingual form absorbs directly through the lining of the mouth, which makes it reliable regardless of stomach acid.\n\nMagnesium glycinate at 300 to 400mg before bed. Your level is good at 0.98, so this is maintenance rather than correction. You lose magnesium in sweat, and it supports sleep quality, muscle relaxation and recovery, all of which serve the recovery theme running through this report. The glycinate form is chosen because it absorbs well and does not upset the stomach.\n\nCreatine monohydrate at 3 to 5g daily if you are not already taking it. It is well researched in women as well as men, it supports strength and recovery, and there is growing evidence for benefit to cognition, which is relevant to the brain fog. Note that it raises creatine kinase and creatinine slightly, so mention it before any future blood test.\n\nContinue your vitamin D, which at 123 is exactly where it should be. Through the autumn and winter, 1,000 to 2,000 IU daily with a meal containing fat, alongside vitamin K2 as MK-7 at 100 micrograms, would hold it there.\n\nIron is not needed. Your ferritin at 92 is a good store and your serum iron is at the top of its range. The low transferrin is about protein production rather than iron, and adding iron would not address it.\n\nThe most valuable changes in this report are not supplements. They are eating more, particularly around training, taking genuine recovery, and having the testosterone conversation with your HRT prescriber. Those three would improve the cortisol, the thyroid conversion, the transferrin, the immune counts, the libido, the brain fog and the joint stiffness together, and no supplement will do that while the gap between what you ask of your body and what you give it stays where it is.","biomarkers":[{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","units":"g/l","description":"Within the ideal range. Albumin is the main protein in blood and it falls when the body is genuinely short of protein, so a healthy level here is worth noting given how little you are eating relative to your training.","low_causes":"Undernutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583333333","upper_optimal_position":"0.625","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","units":"IU/l","description":"Within range at 9, which is unusually low. ALT is an enzyme found in liver and muscle, and a low level is not a problem in itself. It matters here only because it is the reason your FIB-4 score below has come out high, so it is worth understanding rather than ignoring.","low_causes":"Low muscle turnover, vitamin B6 status, lean body composition","high_causes":"Liver strain","padding":"1","one_sided":"0.5","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3469","lower_normal":"7","upper_normal":"56","lower_optimal":"7","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4217687075","range_type":"normal"},{"key":"alkalinephosphatase","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","units":"IU/l","description":"At the lower boundary of the ideal range.","low_causes":"Nutritional insufficiency","high_causes":"Bone or bile duct conditions","padding":"1","one_sided":"0.5","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4","lower_normal":"46","upper_normal":"116","lower_optimal":"60","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.5904761905","range_type":"normal"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","units":"IU/l","description":"Marginally above the ideal ceiling, comfortably within the laboratory range. AST is found in both liver and muscle, and with training six times a week a small amount of muscle release is expected.","low_causes":"Rarely significant","high_causes":"Muscle release from training","padding":"1","one_sided":"0.5","result":"27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4792","lower_normal":"13","upper_normal":"45","lower_optimal":"13 ushed this score above the threshold, and a low ALT is the opposite of what liver damage produces. Your actual liver markers are all reassuring: AST 27, Gamma GT 27, bilirubin 13 and albumin 42 are all normal.\n\nIn other words, this score is high because your liver enzymes are low, which is not a problem. It is worth mentioning to your GP purely so that nobody looking at the number in isolation reaches the wrong conclusion.","low_causes":"Not applicable","high_causes":"Very low ALT, age","padding":"1","one_sided":"0.5","result":"2.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8103","lower_normal":"","upper_normal":"1.45","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3448275862","range_type":"no lower"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Within the laboratory range, marginally above the ideal level.","low_causes":"Rarely significant","high_causes":"Diet, menopause","padding":"1","one_sided":"0.5","result":"5.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4904","lower_normal":"","upper_normal":"5.2","lower_optimal":"","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4326923077","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Just inside the upper limit at 2.96. LDL is the cholesterol that gets deposited into artery walls.","low_causes":"Rarely significant","high_causes":"Diet, menopause, genetics","padding":"1","one_sided":"0.5","result":"2.96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4933","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","l eal range. ApoA-1 is the protein carried by protective HDL particles, so it counts the protective side.","low_causes":"Sedentary lifestyle","high_causes":"Exercise","padding":"1","one_sided":"0.5","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.517","lower_normal":"1.04","upper_normal":"2.02","lower_optimal":"1.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4897959184","upper_optimal_position":"0.6598639456","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","units":"g/L","description":"Above the target at 1.03, against a threshold of 0.9, and this is the most useful cardiovascular number in the report.\n\nEvery particle capable of depositing cholesterol into an artery wall carries exactly one ApoB protein on its surface, so measuring ApoB counts the particles. LDL only measures how much cholesterol those particles happen to be carrying between them. Yours is the more interesting comparison, because your LDL at 2.96 is just inside its limit while your particle count is above target. That combination means you are carrying a greater number of smaller, more densely packed particles than the LDL figure alone suggests.\n\nTwo things are likely to be contributing. The first is the menopause. Falling oestrogen shifts cholesterol handling unfavourably in most women, raising LDL and ApoB, and HRT offsets some but not always all of that. The second is the diet. In lean, very active, insulin-sensitive people, a low-carbohydrate, higher-fat diet quite commonly raises LDL and ApoB while keeping triglycerides low and HDL high, which is exactly the pattern you have. It is a recognised response and it is still being debated among specialists.\n\nWhat makes this genuinely encouraging is your Lipoprotein(a) of 25, which is normal. There is no inherited component here, which means the elevated particle count is modifiable rather than fixed. This is worth discussing with your GP.","low_causes":"Rarely significant","high_causes":"Menopause, low-carbohydrate diet, genetics","padding":"1","one_sided":"0.5","result":"1.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5722","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Above the threshold for women at 0.652, against a limit of 0.6. This compares harmful particles against protective ones. Your protective side is healthy, so this is being driven by the ApoB rather than by any shortage of protection.","low_causes":"High ApoA-1","high_causes":"Elevated ApoB","padding":"1","one_sided":"0.5","result":"0.652","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5432","lower_normal":"","upper_normal":"0.6","lower_optimal":"","upper_optimal":"0.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333333333","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Within the ideal range. This ratio is a good indicator of how well the body handles insulin, and a low figure is a strong sign.","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.456","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.152","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Within the ideal range.","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"","upper_normal":"0.8","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3125","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","units":"nmol/l","description":"Within range at 25, and this is a genuinely important result.\n\nLp(a), said as lipoprotein little a, is a cholesterol particle that is set entirely by genetics. It cannot be changed by diet, exercise, weight or medication, so when it is raised there is nothing a person can do about it. Yours is not raised.\n\nThat matters because it tells you where your elevated ApoB is coming from. It is not inherited. It is coming from things that can be influenced, which means the higher particle count is a problem you can work on rather than one you simply have to accept.","low_causes":"Genetics","high_causes":"Genetics, inherited","padding":"1","one_sided":"0.5","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3906","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.21875","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"At the lower boundary of the ideal range. Good blood sugar control.","low_causes":"Excess insulin, low intake","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"3.5","upper_normal":"6","lower_optimal y","high_causes":"Low transferrin, supplementation","padding":"1","one_sided":"0.5","result":"46.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5877","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963963964","upper_optimal_position":"0.5315315315","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","units":"g/L","description":"Below range at 2.3. Transferrin is the protein that carries iron around the bloodstream, and your liver manufactures it.\n\nThis is not an iron problem. Your ferritin at 92 is healthy and your serum iron is at the top of its range, so you have plenty of iron. What is reduced is the transport protein itself.\n\nTransferrin falls for three main reasons: inflammation, iron overload, and the body having limited resources to spend on manufacturing transport proteins. Your CRP is 1.2, so inflammation is not the answer, and your iron stores are normal rather than overloaded. That leaves the third, which fits the rest of this report. Making transport proteins costs energy and amino acids, and when the body is running a sustained energy deficit it economises on exactly this kind of housekeeping.","low_causes":"Low protein synthesis from energy deficit, inflammation","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","result":"2.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2821","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.358974359","upper_optimal_position":"0.5128205128","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","units":"nmol/L","description":"Within the laboratory range at 0.7 but below the ideal level, sitting in the lower part of the range for a woman. Read together with your SHBG and free testosterone below, this is the most symptom-relevant hormone finding in the report.","low_causes":"Age, low energy availability, ovarian function after menopause","high_causes":"Supplementation, PCOS","padding":"1","one_sided":"0.5","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3651","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.380952381","upper_optimal_position":"0.5714285714","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","units":"nmol/l","description":"Very low at 0.007. This is the fraction of testosterone not bound to a carrier protein, and therefore the only portion your tissues can actually use.\n\nTwo things have combined to produce it. Your total testosterone at 0.7 is in the lower part of its range to begin with, which is expected after the menopause since the ovaries contribute a meaningful share of a woman's testosterone. And your SHBG, the protein that binds testosterone and holds it out of circulation, is 85.3, which is high. A smaller amount of testosterone with more of it bound leaves very little available.\n\nWomen produce far less testosterone than men, but it does important work: it supports sexual desire, mood, mental clarity, muscle maintenance and the collagen in joints and connective tissue. At 0.007 there is almost none available to do any of that, which is directly relevant to the low libido, the brain fog and the joint stiffness you describe. This is worth raising with whoever prescribes your HRT.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.007","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"freeandrogenindex","name":"Free Androgen Index","group":"HORMONES","units":"Ratio","description":"Within the laboratory range but at the very bottom of it, and below the ideal level. This index compares testosterone against SHBG, so it tells the same story as the free testosterone above.","low_causes":"Low testosterone, high SHBG","high_causes":"PCOS","padding":"1","one_sided":"0.5","result":"0.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3511","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611111111","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","units":"nmol/l","description":"Within the ideal range at 85.3, though toward the higher end, and it is worth understanding why it sits there.\n\nSHBG is the protein that binds sex hormones and keeps them out of circulation. Three of the things you are currently doing all push it upward. Oestrogen from HRT raises SHBG, which is a well-recognised effect of the treatment. Low-carbohydrate eating raises it. And sustained caloric restriction raises it further.\n\nNone of those is a problem in itself, but together they mean more of your already modest testosterone is bound up and unavailable, which is what the free testosterone result reflects.","low_causes":"Obesity, insulin resistance","high_causes":"HRT oestrogen, low-carbohydrate diet, caloric restriction","padding":"1","one_sided":"0.5","result":"85.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4955","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3677382967","upper_optimal_position":"0.5369430344","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","units":"mIU/ml","description":"Raised at 20.7, which alongside the FSH below confirms post-menopausal status. The brain is signalling hard to ovaries that are no longer responding, which is the normal pattern after the menopause and not something that needs correcting.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"20.7","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","units":"mIU/ml","description":"Clearly raised at 50.29, confirming post-menopausal status. It is worth noting that this remains high despite HRT, which is common and does not by itself mean the dose is inadequate, since the FSH signal responds only partly to replacement oestrogen.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"50.29","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"estradiol","name":"Oestradiol","group":"HORMONES","units":"pmol/L","description":"At 204, which is a reasonable level for a woman taking HRT and considerably higher than would be expected without it. This is worth knowing because it means your oestrogen replacement is working. It also points the explanation for your low libido away from oestrogen and toward testosterone, which is discussed above.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"204","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","units":"nmol/L","description":"Low at 0.86, which is expected after the menopause. Whether this matters depends on the type of HRT you take, since some regimes include progesterone and others do not. Worth mentioning to your prescriber only in that context.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.86","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","units":"uIU/ml","description":"Within the ideal range.","low_causes":"Not significant","high_causes":"Stress, pituitary conditions","padding":"1","one_sided":"0.5","result":"225","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5152","lower_normal":"45","upper_normal":"375","lower_optimal":"100","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5909090909","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","units":"nmol/l","description":"Above the ideal ceiling of 400 at 425, though below the laboratory limit of 497. Cortisol is the body's main stress hormone.\n\nIn your case the most likely driver is not psychological stress but physical. When the body is doing a great deal of work and receiving less fuel than that work costs, it raises cortisol to release stored energy. Six training sessions a week, more than 15,000 steps a day and a food volume you rate at 3 out of 10 is exactly the combination that produces this.\n\nCortisol at this level for a sustained period suppresses immune cell production, breaks down connective tissue faster than it can be rebuilt, and interferes with mental clarity. All three connect to what you have reported.","low_causes":"Adrenal insufficiency","high_causes":"Low energy availability, training load, chronic stress","padding":"1","one_sided":"0.5","result":"425","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5928","lower_normal":"172","upper_normal":"497","lower_optimal":"250","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133333333","upper_optimal_position":"0.5671794872","range_type":"normal"},{"key":"dheas","name":"D H E A Sulphate","group":"HORMONES","units":"ug/L","description":"Within the laboratory range but below the ideal level. DHEA-S is an adrenal hormone that supports energy and resilience and acts as a building block for other hormones including testosterone. It declines naturally with age, and a level in this region is partly age-expected, but it also contributes to the low testosterone picture.","low_causes":"Age-related decline, adrenal load","high_causes":"Adrenal overactivity","padding":"1","one_sided":"0.5","result":"552.75","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3718","lower_normal":"96","upper_normal":"4054","lower_optimal":"800","upper_optimal":"3000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3926225366","upper_optimal_position":"0.577901297","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","units":"mIU/l","description":"Within the laboratory range, marginally below the ideal level. TSH is the signal from the brain telling the thyroid how hard to work.","low_causes":"Overactive thyroid","high_causes":"Underactive thyroid","padding":"1","one_sided":"0.5","result":"0.94","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3641","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3687943262","upper_optimal_position":"0.4869976359","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine","group":"THYROID","units":"pmol/l","description":"Within the laboratory range at 13.6, marginally below the ideal level of 14. FT4 is the storage form of thyroid hormone.","low_causes":"Underactive thyroid, low energy availability","high_causes":"Overactive thyroid","padding":"1","one_sided":"0.5","result":"13.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4077380952","upper_optimal_position":"0.5267857143","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","units":"pmol/L","description":"Within the laboratory range at 4.2, below the ideal level of 4.5. FT3 is the active form of thyroid hormone, the one that actually drives metabolism in every cell, so it is the more meaningful of the two.\n\nThis is worth reading in context rather than alone. When the body is running a sustained energy deficit, one of the first economies it makes is to convert less T4 into active T3, which slows metabolism to conserve fuel. Your thyroid gland itself is working normally, with a normal TSH and negative antibodies. What this reflects is the amount of fuel available rather than a thyroid problem, and it contributes to the brain fog and the sense of running slow.","low_causes":"Low energy availability, reduced conversion","high_causes":"Overactive thyroid","padding":"1","one_sided":"0.5","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4740740741","upper_optimal_position":"0.5481481481","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","units":"U/ml","description":"Negative, which rules out the most common autoimmune thyroid condition.","low_causes":"Not applicable","high_causes":"Autoimmune thyroid disease","padding":"1","one_sided":"0.5","result":"6.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2391","lower_normal":"","upper_normal":"13.8","lower_optimal":"","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2173913043","range_type":"no lower"},{"key":"thyroglobulinantibody","name":"Thyroglobulin Antibody","group":"THYROID","units":"U/ml","description":"Negative.","low_causes":"Not applicable","high_causes":"Autoimmune thyroid disease","padding":"1","one_sided":"0.5","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"","upper_normal":"4.4","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2272727273","range_type":"no lower"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","units":"nmol/L","description":"Within the ideal range at 123. Vitamin D behaves more like a hormone than a vitamin and supports immune function, muscle function and bone health, all three of which matter to you. A good result.","low_causes":"Limited sun exposure","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","result":"123","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4956","lower_normal":"50","upper_normal":"200","lower_optimal":"100","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5555555556","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","units":"pg/ml","description":"Within the ideal range at 320, though at its lower boundary. B12 is needed for nerve function and mental clarity, which is worth noting given the brain fog you describe. There is room to improve this.","low_causes":"Low intake, poor absorption","high_causes":"Supplementation","padding":"1","one_sided":"0.5","result":"320","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.387","lower_normal":"193","upper_normal":"982","lower_optimal":"300","upper_optimal":"600","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3785382341","upper_optimal_position":"0.5052809463","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","units":"ng/ml","description":"At the very top of the laboratory range. Folate is water soluble so the body excretes what it does not need, and a level at this end usually reflects supplementation or fortified foods.","low_causes":"Poor intake","high_causes":"Supplementation, fortified foods","padding":"1","one_sided":"0.5","result":"17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4523809524","upper_optimal_position":"0.5952380952","range_type":"normal"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","units":"U/L","description":"Within the laboratory range at 37, below the ideal level. Creatine kinase is an enzyme released from muscle when fibres are stressed by training. A low level in someone training six times a week is worth noting, because it suggests either that the sample was taken well away from a hard session, or that muscle turnover is lower than the training volume would predict. Read alongside the very low ALT, the second explanation is plausible.","low_causes":"Low muscle turnover, timing away from training","high_causes":"Recent hard training","padding":"1","one_sided":"0.5","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3562","lower_normal":"25","upper_normal":"200","lower_optimal":"50","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.380952381","upper_optimal_position":"0.5714285714","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","units":"IU/L","description":"Above range at 123. Amylase is a digestive enzyme produced by the pancreas and the salivary glands, and it breaks down starch.\n\nOn its own a mildly raised amylase is common and often means very little. What makes it worth mentioning here is that your lipase is raised too, and when both pancreatic enzymes rise together it is more meaningful than either alone. Your kidney function is normal, so reduced clearance does not explain it.","low_causes":"Reduced pancreatic function","high_causes":"Pancreatic irritation, salivary source","padding":"1","one_sided":"0.5","result":"123","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6856","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712121212","upper_optimal_position":"0.5227272727","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","units":"U/L","description":"Above range at 70. Lipase is the enzyme the pancreas produces specifically to digest fat, and it is the more specific of the two pancreatic enzymes.\n\nBoth of your pancreatic enzymes are raised together, which is worth mentioning to your GP even though you have not reported any digestive symptoms. A very high-fat, low-carbohydrate diet places sustained demand on lipase production, which is a plausible and benign explanation. Your kidney function is normal, so poor clearance is not the cause, and your CA 19-9 is very low, which is reassuring.\n\nThe sensible step is a repeat test in a few months to see whether both settle, rather than any action now.","low_causes":"Reduced pancreatic function","high_causes":"High-fat diet demand, pancreatic irritation","padding":"1","one_sided":"0.5","result":"70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7376","lower_normal":"13","upper_normal":"60","lower_optimal":"20","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3829787234","upper_optimal_position":"0.5602836879","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","units":"g/l","description":"Marginally above the ideal ceiling, within the laboratory range. IgG is the main long-term antibody in blood, and a healthy level shows that the antibody arm of your immune system is fully intact, which is a useful counterweight to the low-normal white cell count.","low_causes":"Immune deficiency","high_causes":"Chronic infection, immune activity","padding":"1","one_sided":"0.5","result":"14.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.607","lower_normal":"6.5","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3859649123","upper_optimal_position":"0.5964912281","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","units":"g/l","description":"Within the ideal range.","low_causes":"Immune deficiency","high_causes":"Recent infection","paddi const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
