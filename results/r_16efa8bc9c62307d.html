const REPORT_DATA = {"patient_name":"Alexandre Levy","dob":"07/10/1984","report_date":"2026-09-09","summary":"Alexandre is a 41-year-old male presenting with a BMI of 21.0, following a standard mixed diet rated 5 out of 10 for quality with a volume of 7 out of 10. He does not currently engage in any structured cardio or resistance training and averages 5,000 to 7,500 daily steps. He takes no medications and reports no specific habits. He reports low energy and fatigue, poor sleep and insomnia, and low mood with anxiety. His goals are to improve sleep quality, improve cardiovascular fitness, and improve long-term health and longevity.\n\nThere is a good deal of reassurance in these results. Alexandre's blood sugar regulation is excellent. His fasting glucose is 4.5, his HbA1c is 31 mmol/mol, which is well below the pre-diabetic threshold of 42, and his HOMA-IR, a calculation that estimates how resistant the body's cells are to the hormone insulin, sits at 0.66. Anything below 1.0 indicates high insulin sensitivity, so Alexandre's body is processing sugar with very little effort. His liver is in excellent health. ALT, the enzyme most specific to liver cell stress, is 22, well within the optimal range. Gamma GT (GGT), a marker particularly sensitive to metabolic strain, alcohol, and fatty liver, is 22, which is clean. AST is 22, bilirubin is 18, albumin is 49, and his FIB-4 score, a composite that screens for liver scarring, is 1.04, well under the 1.45 threshold. His pancreatic enzymes, amylase and lipase, are both comfortably within range, confirming the digestive organs are healthy. His inflammation is essentially absent. High-sensitivity CRP (hs-CRP), a marker of systemic low-grade inflammation linked to cardiovascular risk, metabolic disease, and accelerated ageing, is below 0.2, which is as low as the assay can read. His ESR, a second and older measure of inflammation, is 2, also negligible. This is a genuinely strong finding, particularly when looking at long-term health goals. His thyroid is working very well. TSH, the signal the brain sends to the thyroid, is 0.74, meaning the brain is not having to shout at the thyroid to produce hormone. Free T4 is 20, at the upper end of the ideal window, and Free T3, the active thyroid hormone that actually drives metabolic rate, is 5.7, which is excellent. Both thyroid antibody tests, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. His iron studies are balanced. Ferritin, the body's stored iron, is 137, comfortably within the optimal band of 50 to 200. Transferrin saturation is 31%, within the ideal 25 to 40% corridor, and serum iron and transferrin are both healthy. His prostate markers are reassuring, with a PSA of 0.7 against a limit of 2.5 and a free PSA ratio of 43%, both of which are excellent at 41. His immune system markers, IgG, IgM, IgA, and IgE, are all within range, and his coeliac screen is negative. His uric acid at 265 is within the laboratory range, his electrolytes are balanced, and his creatine kinase (CK), a marker of muscle damage, is 87, healthy and unremarkable.\n\nTurning to the areas that deserve attention, the most important finding is his lipid and cardiovascular profile. His LDL cholesterol, the fraction that deposits cholesterol into artery walls, is 3.27 against an optimal target below 2.6. His ApoB, the protein that rides on every atherogenic lipoprotein particle and is considered the single best measure of how many cholesterol-carrying particles are circulating, is 0.91 against an optimal target below 0.8. His ApoA1, the protein on the protective HDL particles, is 1.1, just below the desirable threshold of 1.2. This gives an ApoB to ApoA1 ratio of 0.83, which sits in the average risk band of 0.7 to 0.9. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls, is 1.2, which is above the risk threshold of 1.04 but below the desirable level of 1.55 and well below the optimal of 1.4 for a male. His triglycerides are 1.28, within the laboratory range but above the optimal of 1.0, giving a TG to HDL ratio of 1.07, which is acceptable but not ideal. His Lp(a), a genetically inherited lipoprotein that independently increases cardiovascular risk, is below 25 nmol/L, which is genuinely useful information. It means the elevated LDL and ApoB are driven entirely by modifiable factors, specifically diet, exercise, and body composition, rather than by a fixed genetic loading. For a man whose primary goals include cardiovascular fitness and longevity, this lipid profile is the main area to work on. A diet quality of 5 out of 10 with no structured exercise and only moderate daily steps provides a clear explanation for these numbers, and more importantly provides a clear path to improving them.\n\nHis Cystatin C, a protein filtered by the kidneys that is considered a more accurate measure of kidney filtration than creatinine alone, is 1.18 against an upper limit of 1.1. This gives a Cystatin C-based estimated GFR of 83, which is below the optimal threshold of 90. His creatinine-based eGFR is reported as above 90, so there is a discrepancy between the two methods. At a BMI of 21 with no heavy resistance training, Cystatin C is generally considered the more reliable of the two because creatinine is influenced by muscle mass. A Cystatin C eGFR of 83 at 41 is mildly below optimal but is not in the range that indicates kidney disease. It does, however, warrant a note to his GP and a repeat in six months to establish whether this is stable or trending. Adequate hydration, which is easy to overlook, can genuinely influence this marker.\n\nHis testosterone is 12.5 nmol/L against a laboratory range of 8.4 to 28.7. While this is technically within range, it sits at the very bottom, barely above the 12 nmol/L threshold the lab itself flags as the recommended minimum. The optimal band is 18 to 30 nmol/L, so Alexandre is well below the level associated with good energy, mood, body composition, and cardiovascular protection. His SHBG, sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation, is 24.6, at the lower end of range. His free testosterone, the unbound fraction that cells can actually use, is calculated at 0.272, marginally above the upper limit of 0.25, which is a mathematical consequence of the low SHBG rather than a sign of excess testosterone. In practical terms, Alexandre has a low total testosterone with a low SHBG, and the free fraction is only adequate because so little of it is being bound. This pattern is associated with the symptoms he reports: low energy, poor sleep, and low mood. It does not confirm that low testosterone is the cause of those symptoms, but the association is well established and worth exploring with his GP. No structured exercise, suboptimal sleep, and moderate diet quality are all factors that suppress testosterone production, and improving these may raise his levels without any medical intervention.\n\nHis cortisol is 242 nmol/L. Without knowing the exact time of the blood draw, this is difficult to interpret precisely, as cortisol follows a strong circadian rhythm, peaking in the early morning and dropping through the day. If drawn before 9am, 242 would sit at the lower end of the morning reference, which in the context of fatigue and poor sleep could suggest the cortisol awakening response is blunted. If drawn later in the morning, this is a normal reading. It is worth noting rather than acting on.\n\nHis vitamin D is 71 nmol/L, which the laboratory classifies as sufficient (above 50), but it sits below the optimal range of 75 to 120 nmol/L that is associated with the best outcomes for immune function, mood, sleep quality, and bone health. Given his symptoms of low mood, poor sleep, and fatigue, bringing vitamin D into the optimal band is a simple and worthwhile intervention. His B12 is 304 pg/ml, which is within the laboratory range of 193 to 982 but below the optimal threshold of 500 that is associated with the best neurological and energy outcomes. His folate is 8 ng/ml, which just reaches the optimal threshold but leaves little margin. Both of these reflect a diet quality of 5 out of 10 and are easy to improve.\n\nHis C-Peptide is 0.988 ug/L, which converts to approximately 327 pmol/L. The laboratory range starts at 1.1 ug/L (364 pmol/L), so this is marginally below. However, C-Peptide is a measure of how much insulin the pancreas is producing, and in the context of a fasting glucose of 4.5 and an HbA1c of 31, this simply means the pancreas does not need to produce much insulin because the body is so sensitive to it. His HOMA-B, a calculation estimating beta cell function of the pancreas, works out to 65.8, which is below the 80 to 200 range, but again this is consistent with low insulin demand rather than pancreatic insufficiency. This is not a concern.\n\nHis absolute reticulocyte count is 46.4 against a lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a marginally low count indicates the marrow is producing red cells at a slightly leisurely pace. His haemoglobin is 162, his RBC count is 5.27, and his haematocrit is 0.459, all healthy, so the marrow has no reason to push harder. This is consistent with adequate red cell mass rather than with any suppression of production.\n\nHis MCHC, the mean corpuscular haemoglobin concentration, is 352 against an upper limit of 345. The lab notes that MCHC can be affected by temperature and storage during transit. At this margin, this is almost certainly a pre-analytical artefact rather than a genuine finding. His total antioxidant activity (TAA) is 1.85 against an upper limit of 1.77, which simply indicates a good dietary or supplemental antioxidant intake and is not a clinical concern. His calcium is healthy at 2.43 corrected, his magnesium is 1.08 which is within range but above the optimal ceiling of 1.05 by a negligible margin, and his phosphate is 1.4, all well balanced. His parathyroid hormone (PTH) is 2.1, sitting comfortably mid-range, confirming normal calcium-phosphate regulation.\n\nThe urinalysis shows urine white blood cells at 20 against a significance threshold of 10. However, his nitrites are negative, his bacterial count is below 1, his urine culture shows no growth, and he reports no urinary symptoms. In the absence of bacteria and symptoms, this is most likely a contaminant finding or minor inflammation rather than an infection. It is worth noting but does not require treatment. All other urinary markers are negative and unremarkable.\n\nHis rheumatoid factor result is reported as pending and will need to be reviewed when it arrives.\n\nIn summary, Alexandre's metabolic health is excellent, his liver is clean, his inflammation is negligible, his thyroid is strong, and his iron stores are well balanced. The areas to focus on are his lipid profile, which is modifiably elevated and represents the main long-term cardiovascular risk in these results; his testosterone, which is low and likely connected to his symptoms; his Cystatin C, which warrants monitoring; and his vitamin D and B12, which would both benefit from supplementation. The strongest lever Alexandre has is lifestyle. Introducing structured resistance training, improving diet quality, prioritising sleep hygiene, and adding targeted supplementation could meaningfully shift every one of these findings.","links":"Alexandre's results point to a clear set of actions, and the encouraging news is that every area of concern in this report is modifiable.\n\nStarting with exercise, which is the single most impactful change available. Alexandre currently does no structured training and walks 5,000 to 7,500 steps daily. Introducing three resistance training sessions per week would address multiple findings simultaneously. Resistance training is the most effective non-pharmacological intervention for raising testosterone, improving insulin sensitivity (which is already good but would be protected long-term), raising HDL cholesterol, lowering LDL and ApoB, improving sleep quality, and supporting mood. Two to three sessions of 45 to 60 minutes focusing on compound movements (squats, deadlifts, presses, rows, pull-ups) would be the foundation. Adding two sessions of moderate-intensity cardiovascular exercise, even 30-minute brisk walks, cycles, or swims, would directly support his goal of improving cardiovascular fitness and would further improve his lipid profile. Increasing daily steps to 8,000 to 10,000 would add further benefit with minimal effort.\n\nFor nutrition, Alexandre's current diet is rated 5 out of 10 for quality with a volume of 7 out of 10. At 80kg, 195cm, and a BMI of 21 with a goal of improving body composition and long-term health, his estimated maintenance calories are approximately 2,300 to 2,500 per day at his current activity level, rising to 2,600 to 2,800 once training is introduced. His protein intake should be at least 1.3 to 1.6g per kilogram of body weight, which means 104 to 128 grams of protein per day. If he introduces serious resistance training, this should increase to 1.6 to 2.0g/kg, or 128 to 160 grams daily. To address his lipid profile specifically, the dietary priorities are: increasing soluble fibre intake (oats, lentils, beans, flaxseed, apples, and psyllium husk are all excellent sources, aiming for 10 to 15 grams of soluble fibre per day); eating oily fish (salmon, mackerel, sardines) at least twice per week; reducing saturated fat intake from processed foods, fatty cuts of meat, and full-fat dairy; and replacing some saturated fat with monounsaturated sources such as olive oil, avocados, and nuts. These changes alone can reduce LDL by 10 to 15% over three months.\n\nFor sleep, which Alexandre identifies as a primary goal and which connects to his fatigue and low mood, the evidence-based foundations are: setting a fixed wake time seven days a week (this is more important than bedtime); getting outside within an hour of waking for natural light exposure, which resets the circadian clock; cutting caffeine by 1pm at the latest, as caffeine has a half-life of 5 to 7 hours; keeping the bedroom cool (16 to 18 degrees Celsius); avoiding screens for 60 minutes before bed or using blue-light blocking glasses; and considering magnesium glycinate supplementation before bed, which supports both sleep onset and sleep quality. Resistance training also improves sleep architecture significantly, particularly deep sleep.\n\nFor the GP conversation, Alexandre should discuss three findings. First, his Cystatin C of 1.18 with an eGFR of 83, to establish a baseline and arrange a repeat in six months. The GP should check hydration status and consider whether any further investigation is warranted. Second, his testosterone of 12.5, which sits at the bottom of range and may be contributing to his fatigue, low mood, and poor sleep. The GP may wish to repeat this with an early morning sample alongside LH and FSH (which are already in this panel and are normal, suggesting the brain is not signalling for more testosterone production). Third, the urine white cells of 20 with no bacteria or symptoms, which should be repeated on a fresh sample if any urinary symptoms develop.\n\nA retest of the following markers in four to six months would be valuable: a fasting lipid panel including ApoB and ApoA1 (to assess the impact of dietary and exercise changes), Cystatin C and creatinine-based eGFR (to confirm kidney function is stable), testosterone with SHBG (ideally as an early morning sample), and vitamin D (to confirm supplementation has brought levels into the optimal range). B12 can be rechecked at the same time.","flags":"LIPIDS AND CARDIOVASCULAR: LDL 3.27 mmol/L (optimal below 2.6). ApoB 0.91 g/L (optimal below 0.8, lab desirable below 0.9). ApoA1 1.1 g/L (desirable above 1.2). ApoB/A1 ratio 0.83 (lower risk below 0.7). HDL 1.2 mmol/L (desirable above 1.55, risk threshold 1.04). Triglycerides 1.28 (optimal below 1.0). Lp(a) below 25, confirming risk is modifiable. Pattern is consistent with suboptimal diet quality and sedentary lifestyle. Recommend dietary intervention (soluble fibre, oily fish, saturated fat reduction), structured exercise, and retest in four to six months. Consider statin discussion if lifestyle changes do not bring ApoB below 0.9 within 12 months.\n\nKIDNEY FUNCTION: Cystatin C 1.18 mg/L (upper limit 1.1). Cystatin C-based eGFR 83 (optimal above 90). Creatinine-based eGFR above 90. Discrepancy noted. At BMI 21 without heavy resistance training, Cystatin C is likely the more accurate measure. Recommend repeat in six months to establish trajectory. Ensure adequate hydration.\n\nHORMONES: Total testosterone 12.5 nmol/L (laboratory range 8.4 to 28.7, optimal 18 to 30). Sits at the recommended minimum of 12. SHBG 24.6 nmol/L (low end of range). Free testosterone 0.272 nmol/L (marginally above upper limit of 0.25, driven by low SHBG). LH 2.84 and FSH 5.88, both within range, suggesting the hypothalamic-pituitary axis is not compensating. Symptoms of fatigue, poor sleep, and low mood are consistent with low testosterone. Recommend early morning repeat and GP discussion.\n\nHAEMATOLOGY: MCHC 352 g/L (upper limit 345). Marginal elevation, likely pre-analytical artefact per lab note regarding temperature and storage. Absolute reticulocytes 46.4 (lower limit 50). Marginally low in context of adequate haemoglobin (162), RBC (5.27), and haematocrit (0.459). Marrow output appropriate to demand.\n\nGLUCOSE AND INSULIN: C-Peptide 0.988 ug/L (lower limit 1.1). Marginally below range but consistent with low insulin demand given glucose 4.5, HbA1c 31, and HOMA-IR 0.66. Not indicative of pancreatic insufficiency.\n\nURINALYSIS: Urine WBCs 20 (significance threshold 10). Nitrites negative, bacterial count below 1, culture no growth, no symptoms. Most likely contamination or minor non-infectious inflammation. Repeat if symptoms develop.\n\nPENDING: Rheumatoid factor result to follow.\n\nReassuring negatives: hs-CRP below 0.2 (negligible cardiovascular inflammation). ESR 2 (no systemic inflammation). Thyroid function excellent with negative antibodies. Liver function entirely clean. HbA1c 31 with HOMA-IR 0.66 (excellent metabolic health). PSA 0.7 with free ratio 43% (prostate healthy). Lp(a) below 25 (no inherited lipoprotein risk). Iron studies balanced. Coeliac screen negative. All immunoglobulins within range. Tumour markers all within range. Pancreatic enzymes normal.","recommendations":"1. Introduce structured resistance training three times per week, focusing on compound movements, and add two cardiovascular sessions of at least 30 minutes each. This is the single most impactful change for testosterone, lipids, sleep, mood, and long-term health.\n\n2. Increase daily step count to 8,000 to 10,000.\n\n3. Improve diet quality from 5 to at least 7 out of 10. Prioritise protein intake of 104 to 128 grams per day (rising to 128 to 160 grams with training). Add 10 to 15 grams of soluble fibre daily (oats, lentils, beans, flaxseed). Eat oily fish at least twice per week. Reduce saturated fat from processed sources.\n\n4. Implement sleep hygiene fundamentals: fixed wake time, morning outdoor light exposure within one hour of waking, no caffeine after 1pm, cool bedroom (16 to 18 degrees), screen-free hour before bed.\n\n5. Begin vitamin D3 supplementation at 3,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 at 100 mcg.\n\n6. Begin sublingual methylcobalamin (B12) at 1,000 mcg daily.\n\n7. Consider magnesium glycinate 300 to 400mg before bed to support sleep quality.\n\n8. Consider omega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily to support lipid profile and cardiovascular health.\n\n9. Discuss with GP: Cystatin C of 1.18 with eGFR 83 for baseline and repeat in six months. Testosterone of 12.5 and its potential connection to symptoms. Urine WBCs of 20 in an otherwise clean sample.\n\n10. Retest in four to six months: fasting lipid panel with ApoB and ApoA1, Cystatin C, testosterone with SHBG (early morning), vitamin D, and B12.","supplementation":"Vitamin D3: 3,000 IU (75 mcg) of cholecalciferol daily, taken with the largest fat-containing meal of the day. Alexandre's vitamin D is 71, which is sufficient but below the 75 to 120 optimal range associated with best outcomes for immune function, mood, bone health, and sleep quality. At his lean body composition, 3,000 IU should bring him into the 90 to 110 range within three months.\n\nVitamin K2: 100 mcg of the MK-7 form, taken alongside the vitamin D. K2 directs the calcium that vitamin D helps absorb into bones rather than into artery walls. It should always accompany vitamin D supplementation.\n\nVitamin B12: 1,000 mcg of sublingual methylcobalamin daily, dissolved under the tongue rather than swallowed. Alexandre's B12 is 304, within the laboratory range but well below the 500 to 900 optimal band. The sublingual form bypasses digestion and is absorbed directly into the bloodstream, making it more reliable than oral tablets. This supports energy production, neurological function, and mood, all relevant to his reported symptoms.\n\nMagnesium glycinate: 300 to 400mg taken 30 to 60 minutes before bed. Magnesium supports over 300 enzymatic reactions in the body, and the glycinate form is specifically chosen because it crosses the blood-brain barrier more effectively and has a calming effect that supports sleep onset and sleep quality. Alexandre's serum magnesium is 1.08, which appears adequate, but serum magnesium represents less than 1% of total body magnesium and is a poor reflection of intracellular stores. Given his sleep complaints, this is a well-supported and low-risk intervention.\n\nOmega-3 fish oil: A supplement providing 2 to 3 grams of combined EPA and DHA daily, ideally with a higher EPA fraction. This supports the reduction of triglycerides (currently 1.28, optimal below 1.0), raises HDL cholesterol (currently 1.2, optimal above 1.4), and provides an anti-inflammatory foundation that complements his already excellent hs-CRP. It also supports mood and cognitive function, which is relevant to his reported low mood and anxiety. Take with food to improve absorption and reduce any fishy aftertaste.\n\nThe most important changes from this report are not supplements. They are introducing structured resistance and cardiovascular training, improving diet quality with an emphasis on protein, soluble fibre, and oily fish, and implementing consistent sleep hygiene practices. These lifestyle changes will have a far greater impact on Alexandre's testosterone, lipid profile, energy, mood, and sleep than any supplement can achieve.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4533","upper_optimal_position":"0.5893","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It is the body's primary fuel source, regulated by insulin. Alexandre's result of 4.5 mmol/L sits comfortably within the optimal range of 4.0 to 5.4, indicating that his body is maintaining blood sugar at a healthy level without strain.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5733","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for roughly three months, this gives a rolling average of blood sugar control over that period. Alexandre's result of 5.0% is well within the normal range (below 6.0%) and far from the pre-diabetic threshold of 6.0 to 6.4%, confirming excellent long-term blood sugar management.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5152","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the international standard unit. Alexandre's result of 31 mmol/mol is well below the pre-diabetic threshold of 42 and comfortably within the optimal range below 36, confirming excellent blood sugar control over the past three months.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3432","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2653","upper_optimal_position":"0.5756","units":"mIU/L","description":"Fasting insulin measures how much of the hormone insulin the pancreas needs to produce to keep blood sugar stable. A low fasting insulin with a normal glucose, as Alexandre has, indicates high insulin sensitivity, meaning his cells respond effectively to small amounts of insulin. His result of 3.29 mIU/L is within both the laboratory and optimal ranges, reflecting excellent metabolic efficiency.","low_causes":"High insulin sensitivity (positive), very low carbohydrate diet, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate intake, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"327","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2807","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, making it a reliable marker of how much insulin the body is actually producing. Alexandre's result of 327 pmol/L (converted from 0.988 ug/L) is marginally below the lower limit of 364 pmol/L. However, in the context of a fasting glucose of 4.5, an HbA1c of 31, and a HOMA-IR of 0.66, this simply reflects low insulin demand. The pancreas is producing exactly as much insulin as the body needs, which happens to be a small amount because the body is highly sensitive to it. This is not a sign of pancreatic insufficiency.","low_causes":"High insulin sensitivity (in context of normal glucose), low carbohydrate intake, type 1 diabetes (in context of high glucose)","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation that estimates how resistant the body's cells are to insulin, using fasting glucose and fasting insulin. A lower score is better. Alexandre's result of 0.66 indicates excellent insulin sensitivity. Anything below 1.0 means the body's cells are responding efficiently to insulin, requiring only small amounts to keep blood sugar stable.","low_causes":"High insulin sensitivity, very low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, sedentary lifestyle, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"65.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2193","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, which are the cells that produce insulin. Alexandre's result of 65.8 is below the reference range of 80 to 200. However, like his C-Peptide, this reflects low insulin demand rather than failing beta cells. With a glucose of 4.5 and HbA1c of 31, the pancreas is producing exactly as much insulin as the body requires, and the body requires very little because it is so insulin-sensitive.","low_causes":"High insulin sensitivity with low insulin demand (in context of normal glucose), beta cell dysfunction (in context of raised glucose)","high_causes":"Insulin resistance driving increased insulin production, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it the most specific single marker of liver cell health. Alexandre's result of 22 IU/L is well within the optimal range for males (below 30), indicating that his liver cells are under no significant stress.","low_causes":"Not clinically significant when low","high_causes":"Fatty liver disease, alcohol, hepatitis, medications, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4271","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Unlike ALT, an elevated AST can come from sources other than the liver, but when both ALT and AST are within range together, it confirms healthy liver function. Alexandre's AST of 22 IU/L is well within both the laboratory and optimal ranges.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3014","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is an enzyme that is particularly sensitive to alcohol intake, bile duct problems, and metabolic strain on the liver. It is often the first liver marker to rise when the liver is under stress. Alexandre's result of 22 IU/L is within the optimal range for males (below 25), indicating that his liver is handling its workload comfortably.","low_causes":"Not clinically significant when low","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"102","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, and bile ducts. It can be elevated by bone growth or turnover as well as liver or bile duct problems. Alexandre's result of 102 IU/L is within the laboratory range of 46 to 116 but slightly above the optimal ceiling of 100. In the context of completely clean ALT, AST, GGT, and bilirubin, this is not concerning and is most likely related to normal bone turnover.","low_causes":"Zinc deficiency, hypothyroidism, anaemia","high_causes":"Bone disease, bile duct obstruction, liver disease, vitamin D deficiency, growth (in younger individuals)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Alexandre's result of 18 umol/L is within the laboratory range of 5 to 21 but slightly above the optimal ceiling of 17. With all liver enzymes clean, a mildly elevated bilirubin often reflects a benign inherited condition called Gilbert's syndrome, which affects 5 to 10% of the population and has no health consequences. It may also simply reflect normal variation.","low_causes":"Not clinically significant when low","high_causes":"Gilbert's syndrome (benign), liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform essential functions including maintaining fluid balance, transporting substances, and supporting the immune system. Alexandre's result of 76 g/L is within the optimal range, indicating good nutritional status and healthy protein production by the liver.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6458","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and is an excellent marker of liver synthetic function and nutritional status. Alexandre's result of 49 g/L is near the top of the range and within the optimal band, confirming that his liver is producing protein effectively.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) and transport proteins. It is calculated by subtracting albumin from total protein. Alexandre's result of 27 g/L is within both the laboratory and optimal ranges, indicating a healthy immune and transport protein level.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between these two protein groups. Alexandre's ratio of 1.81 is well within the optimal range, confirming a healthy balance of liver-produced and immune-related proteins.","low_causes":"Liver disease, chronic infection, autoimmune conditions, kidney disease","high_causes":"Immune deficiency (some types)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3586","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a composite calculation that screens for liver fibrosis (scarring) using age, ALT, AST, and platelet count. A score below 1.3 in someone under 65 indicates a very low likelihood of significant liver fibrosis. Alexandre's score of 1.04 is reassuringly low, confirming no evidence of liver scarring.","low_causes":"Not applicable, lower is better","high_causes":"Liver fibrosis or cirrhosis, age (score naturally increases with age), low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4621","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. It is used to assess pancreatic health. Alexandre's result of 68 IU/L is comfortably within the optimal range, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis (advanced), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4738","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5738","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase and is used alongside it to assess pancreatic health. Alexandre's result of 33 U/L is within both the laboratory and optimal ranges, confirming healthy pancreatic function.","low_causes":"Not clinically significant when low","high_causes":"Acute pancreatitis, chronic pancreatitis, pancreatic cancer, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4826","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4344","units":"mmol/L","description":"Total cholesterol measures all the cholesterol circulating in the blood, including both the protective HDL and the atherogenic LDL and VLDL fractions. Alexandre's result of 5.0 mmol/L is just under the desirable limit of 5.18 but above the optimal target of 4.5. The total number alone tells a limited story. The breakdown into LDL, HDL, and triglycerides, along with ApoB, provides a much clearer picture of cardiovascular risk.","low_causes":"Hyperthyroidism, liver disease, malnutrition, certain medications","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3765","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, largely influenced by recent carbohydrate and alcohol intake, and by insulin sensitivity. Alexandre's result of 1.28 mmol/L is within the laboratory range (below 1.7 fasting) but above the optimal target of below 1.0. Exercise, reducing refined carbohydrates, and adding omega-3 fatty acids are the most effective ways to bring triglycerides into the optimal range.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition","high_causes":"High carbohydrate intake, alcohol, insulin resistance, obesity, sedentary lifestyle, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3718","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues around the body. It is a precursor to LDL and contributes to arterial plaque. Alexandre's result of 0.58 mmol/L is within the laboratory range (below 0.78) but above the optimal target of 0.5, consistent with his slightly elevated triglycerides.","low_causes":"Very low-fat diet, hyperthyroidism","high_causes":"High carbohydrate intake, insulin resistance, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"2.07","lower_optimal":"1.4","upper_optimal":"2.07","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6748","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) cholesterol is the protective fraction of cholesterol. It picks up excess cholesterol from artery walls and transports it back to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is generally better. Alexandre's result of 1.2 mmol/L is above the risk threshold of 1.04 but below both the desirable level of 1.55 and the optimal male target of 1.4. Regular aerobic exercise and omega-3 fatty acids are the most effective interventions to raise HDL.","low_causes":"Sedentary lifestyle, smoking, obesity, high refined carbohydrate diet, certain medications","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.27","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5540","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol is the fraction that deposits cholesterol into artery walls, driving the formation of atherosclerotic plaques over time. It is the primary target of cardiovascular risk reduction. Alexandre's result of 3.27 mmol/L is above both the laboratory upper limit of 3.0 and the optimal target of 2.6. Given his Lp(a) is low, this elevation is driven by modifiable factors including diet composition and physical activity level, and is expected to respond well to lifestyle intervention.","low_causes":"Hyperthyroidism, malnutrition, liver disease, statin therapy","high_causes":"Diet high in saturated fat, sedentary lifestyle, genetic predisposition, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4633","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick measure of the balance between atherogenic and protective cholesterol. A lower ratio is better. Alexandre's ratio of 4.17 is within the laboratory limit of 4.5 but above the optimal target of 3.5, reflecting the combination of modestly elevated total cholesterol and suboptimal HDL.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, sedentary lifestyle, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"20","upper_normal":"60","lower_optimal":"28","upper_optimal":"60","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6000","upper_optimal_position":"1","units":"%","description":"This measures what proportion of total cholesterol is made up of the protective HDL fraction. A higher percentage indicates a healthier lipid balance. Alexandre's result of 24% is above the minimum threshold of 20% but below the optimal target of 28%, consistent with the need to raise HDL and lower LDL through exercise and dietary changes.","low_causes":"Sedentary lifestyle, obesity, poor diet, smoking","high_causes":"Regular exercise, genetic factors, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions (LDL, VLDL, and remnant cholesterol) in one number. Alexandre's result of 3.8 mmol/L is within the laboratory limit of 4.0 but above the optimal target of 3.4, consistent with his elevated LDL and ApoB.","low_causes":"Very low-fat diet, statin therapy, hyperthyroidism","high_causes":"High saturated fat diet, sedentary lifestyle, genetic factors, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4583","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. It drives the reverse cholesterol transport process that removes cholesterol from arteries. Higher levels are protective. Alexandre's result of 1.1 g/L is just below the desirable threshold of 1.2, consistent with his suboptimal HDL cholesterol level. Aerobic exercise is the most effective way to raise ApoA1.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, genetic factors","high_causes":"Regular aerobic exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this is considered the most accurate measure of how many cholesterol-carrying particles are in the bloodstream, and therefore the best single predictor of cardiovascular risk. Alexandre's result of 0.91 g/L is above the desirable limit of 0.9 and above the optimal target of 0.8. With a low Lp(a), this elevation is entirely modifiable through diet, exercise, and potentially omega-3 supplementation.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"High saturated fat diet, sedentary lifestyle, genetic predisposition, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5929","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (artery-clogging) particles to protective (artery-clearing) particles. It is one of the strongest predictors of cardiovascular risk. Alexandre's ratio of 0.83 sits in the average risk band (0.7 to 0.9), above the lower risk threshold of 0.7 and the optimal target of 0.6. Reducing ApoB through diet while raising ApoA1 through exercise will improve this ratio from both directions.","low_causes":"Statin therapy, regular exercise, high HDL","high_causes":"Elevated LDL, low HDL, sedentary lifestyle, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined lipoprotein that is essentially an LDL particle with an additional protein (apolipoprotein(a)) attached. It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clotting, and it drives local inflammation. Crucially, Lp(a) levels are almost entirely inherited and do not change with diet or exercise. Alexandre's result of below 25 nmol/L is well within the normal range (below 32), which is a genuinely useful piece of information. It confirms that the elevated LDL and ApoB seen in his other results are driven by modifiable lifestyle factors rather than by a fixed genetic loading, meaning they should respond well to dietary and exercise interventions.","low_causes":"Genetic variation (normal and favourable)","high_causes":"Genetic inheritance (not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant lipoproteins, which are increasingly recognised as an independent cardiovascular risk factor. Alexandre's result of 0.53 mmol/L is within the laboratory range (below 0.8) but slightly above the optimal target of 0.5, consistent with his mildly elevated triglycerides.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.07","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3567","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful proxy for insulin resistance and small dense LDL particles. A lower ratio suggests larger, more buoyant (and less dangerous) LDL particles. Alexandre's result of 1.07 is within the laboratory range (below 1.5) but above the optimal target of 0.87, suggesting there may be some proportion of smaller, denser LDL particles. Improving this ratio through exercise and dietary changes will enhance cardiovascular protection.","low_causes":"High insulin sensitivity, regular exercise, healthy diet","high_causes":"Insulin resistance, sedentary lifestyle, high carbohydrate diet, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic low-grade inflammation produced by the liver. Chronic low-grade inflammation is associated with cardiovascular disease, metabolic syndrome, and accelerated ageing. Alexandre's result of below 0.2 mg/L is essentially at the lowest detectable level, indicating negligible systemic inflammation. This is an excellent finding, particularly in the context of cardiovascular risk assessment, where a CRP below 1.0 is associated with the lowest risk category.","low_causes":"Not clinically significant, lower is better","high_causes":"Infection, chronic inflammation, obesity, smoking, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red cells to clump together. Alexandre's ESR of 2 mm/hour is very low, confirming the absence of significant systemic inflammation, consistent with his excellent hs-CRP.","low_causes":"Not clinically significant, lower is better","high_causes":"Infection, autoimmune disease, cancer, chronic inflammation, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"146","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is an electrolyte that regulates fluid balance, blood pressure, and nerve and muscle function. Alexandre's result of 146 mmol/L sits exactly at the upper limit of the laboratory range. This is most commonly seen with mild dehydration at the time of blood draw. Ensuring good hydration before a repeat test would help confirm whether this is a genuine finding or simply reflects fluid status.","low_causes":"Overhydration, diuretic use, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, certain medications, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"4.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4259","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is an electrolyte essential for heart rhythm, muscle contraction, and nerve signalling. Alexandre's result of 3.9 mmol/L is within the laboratory range but just below the optimal band of 4.0 to 5.0. The lab notes that potassium results should be interpreted with caution if the sample was delayed or remained on cells, as potassium can leak from red blood cells during transit. This is a borderline result that is not clinically concerning.","low_causes":"Poor dietary intake, diarrhoea, vomiting, diuretic use, excessive sweating","high_causes":"Kidney disease, certain medications (ACE inhibitors, potassium-sparing diuretics), sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works closely with sodium to maintain fluid balance and acid-base equilibrium. Alexandre's result of 103 mmol/L is within both the laboratory and optimal ranges.","low_causes":"Vomiting, metabolic alkalosis, overhydration, diuretic use","high_causes":"Dehydration, metabolic acidosis, kidney disease, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3515","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer that helps the body maintain the correct acid-base balance in the blood. Alexandre's result of 20.6 mmol/L is within the laboratory range (20 to 31) but sits at the lower end, just above the lower limit. This is borderline and may reflect mild dehydration or metabolic acid production. It is not clinically concerning in isolation but is consistent with the sodium at the upper boundary, both suggesting the sample may have been taken in a slightly dehydrated state.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, intense exercise","high_causes":"Metabolic alkalosis, vomiting, dehydration, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6374","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3860","upper_optimal_position":"0.5380","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. The body tightly regulates blood calcium levels via parathyroid hormone and vitamin D. Alexandre's uncorrected calcium of 2.6 mmol/L is within the laboratory range but at the upper end. The corrected calcium (adjusted for albumin) gives a more accurate picture.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium measurement for the albumin level in the blood, giving a more accurate picture of the biologically active calcium. Alexandre's corrected calcium of 2.43 mmol/L is within the optimal range of 2.25 to 2.5, confirming healthy calcium regulation. His parathyroid hormone (PTH) of 2.1 pmol/L is also mid-range, further confirming the calcium-parathyroid axis is functioning normally.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5710","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3816","upper_optimal_position":"0.6149","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and is involved in energy production (ATP), DNA synthesis, and acid-base balance. Alexandre's result of 1.4 mmol/L is within both the laboratory and optimal ranges, confirming healthy phosphate metabolism.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, alcohol excess","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6494","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5188","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic processes in the body, including energy production, muscle relaxation, nerve function, and sleep regulation. Alexandre's serum magnesium of 1.08 mmol/L is within the laboratory range (0.53 to 1.11) but just above the optimal ceiling of 1.05 by a negligible margin. Serum magnesium is a poor reflection of total body magnesium, as less than 1% is in the blood. It is possible to be serum-replete but intracellularly deficient, which is why supplementation is still recommended for individuals with sleep complaints.","low_causes":"Poor dietary intake, alcohol, diuretics, intense exercise, malabsorption","high_causes":"Excessive supplementation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5800","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. It is used alongside creatinine and eGFR to assess kidney function. Alexandre's result of 6.9 mmol/L is within the optimal range, indicating normal protein metabolism and kidney excretion.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4957","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3762","upper_optimal_position":"0.5905","units":"umol/L","description":"Creatinine is a waste product of muscle metabolism, filtered by the kidneys. It is used to estimate glomerular filtration rate (eGFR), a measure of how well the kidneys are filtering blood. Alexandre's creatinine of 84 umol/L is within both the laboratory and optimal ranges. The creatinine-based eGFR is reported as above 90, which is normal.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Estimated glomerular filtration rate (eGFR) calculates how much blood the kidneys filter per minute, based on creatinine, age, sex, and ethnicity. An eGFR above 90 is considered normal. Alexandre's creatinine-based eGFR is reported as above 90, which indicates normal kidney filtration. However, his Cystatin C-based eGFR is 83, which is lower, and at his lean BMI and activity level, the Cystatin C measurement may be more accurate.","low_causes":"Kidney disease, dehydration, reduced kidney blood flow, medications","high_causes":"Not typically clinically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not influenced by muscle mass, diet, or exercise, making it a more accurate marker of kidney filtration in many people. Alexandre's Cystatin C of 1.18 mg/L is above the upper limit of 1.1, giving a Cystatin C-based eGFR of 83. At 41 with a BMI of 21 and no heavy resistance training, Cystatin C is likely the more reliable estimate of his kidney function. An eGFR of 83 is mildly below the optimal threshold of 90 but is not in the range that indicates kidney disease (below 60). This warrants a note to his GP and a repeat in six months to confirm the result is stable.","low_causes":"Not clinically significant when low","high_causes":"Reduced kidney filtration, inflammation (less common), thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6917","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"","description":"This is the estimated glomerular filtration rate calculated from Cystatin C rather than creatinine. Alexandre's result of 83 is above the lower limit of 60 that defines chronic kidney disease but below the optimal threshold of 90. The discrepancy with his creatinine-based eGFR (above 90) may reflect the fact that creatinine is influenced by muscle mass and Cystatin C is not. At his lean build and sedentary activity level, the Cystatin C-based estimate is likely more representative. A repeat in six months will determine whether this is stable.","low_causes":"Kidney disease, dehydration, reduced blood flow to kidneys","high_causes":"Not typically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"265","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3803","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3109","upper_optimal_position":"0.5216","units":"umol/L","description":"Uric acid is a waste product of purine metabolism, cleared by the kidneys. Elevated levels can cause gout and are associated with cardiovascular risk. Alexandre's result of 265 umol/L is within the laboratory range and within the optimal band for males (200 to 380), indicating healthy purine metabolism and adequate kidney clearance of uric acid.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High purine diet (red meat, organ meats, shellfish), alcohol, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"16.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7125","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is a calculation using sodium, potassium, chloride, and bicarbonate that helps assess acid-base balance. Alexandre's result of 16.3 is marginally above the upper limit of 16. In the context of a sodium at the upper boundary and a bicarbonate at the lower boundary, both likely reflecting mild dehydration at the time of the blood draw, this is not a clinically significant finding. It does not suggest an underlying acid-base dis oportion of circulating red cells are newly minted. Alexandre's percentage of 0.88% is within the optimal range, indicating normal marrow output relative to his total red cell mass.","low_causes":"Bone marrow suppression, iron/B12/folate deficiency, chronic disease, low erythropoietin","high_causes":"Haemolysis, acute blood loss, response to treatment for anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"46.376","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2979","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells per litre of blood. Alexandre's result of 46.4 is marginally below the lower limit of 50. However, his haemoglobin (162), RBC count (5.27), and haematocrit (0.459) are all healthy, meaning the bone marrow has no reason to ramp up red cell production. The marrow is producing at a rate that matches demand, and the demand is low because the existing red cell mass is adequate. This is not a concern.","low_causes":"Adequate red cell mass (appropriate downregulation), bone marrow suppression, iron/B12/folate deficiency","high_causes":"Haemolysis, acute blood loss, response to anaemia treatment, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is a simple marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, and between 1 and 2 is optimal. Alexandre's NLR of 1.24 is within the optimal range, consistent with his excellent hs-CRP and ESR, confirming no systemic inflammation.","low_causes":"Not typically significant, can be seen with neutropenia","high_causes":"Infection, inflammation, physiological stress, cardiovascular disease, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"31.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4547","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-transport protein transferrin that is currently loaded with iron. It indicates how much of the body's iron-carrying capacity is being used. Alexandre's result of 31.42% is within the optimal range of 25 to 40%, indicating a healthy balance between iron supply and transport capacity.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6156","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. It fluctuates through the day and with recent meals but provides useful context alongside ferritin and transferrin saturation. Alexandre's result of 20.2 umol/L is within the optimal range.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Iron overload, haemochromatosis, haemolysis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4244","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.2","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3444","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. The body increases transferrin production when iron stores are low (to scavenge more iron) and decreases it when stores are adequate. Alexandre's transferrin of 2.56 g/L is within both the laboratory and optimal ranges, consistent with his healthy ferritin and iron levels.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"58.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4887","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3957","upper_optimal_position":"0.5840","units":"umol/L","description":"Total iron binding capacity (TIBC) measures the total capacity of the blood to bind and transport iron. It moves inversely to iron stores: when iron is low, TIBC rises to capture more; when iron is adequate,
