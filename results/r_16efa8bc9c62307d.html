and may be contributing to his reported fatigue, poor sleep, and low mood. No structured exercise, suboptimal sleep, and a diet rated 5 out of 10 are all factors that suppress testosterone production, and addressing these may raise his levels meaningfully.","low_causes":"Sedentary lifestyle, poor sleep, stress, obesity, ageing, low calorie intake, alcohol","high_causes":"Exogenous testosterone or steroid use, adrenal tumours, testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.272","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7250","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.1","upper_optimal":"0.25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to proteins (SHBG or albumin) and therefore available for the body to use directly. Alexandre's calculated free testosterone of 0.272 nmol/L is marginally above the upper reference limit of 0.25. This is a mathematical consequence of his low SHBG (24.6) rather than a sign of excess testosterone. With a low SHBG, less testosterone is bound, so proportionally more is free, even though his total testosterone is at the bottom of range. In practical terms, his free testosterone is only adequate because so little is being bound, not because total production is healthy.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"Low SHBG (mathematical effect), exogenous testosterone, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"24.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3834","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3842","upper_optimal_position":"0.5789","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds testosterone and oestrogen, controlling how much is freely available for the body to use. Alexandre's SHBG of 24.6 nmol/L is within the laboratory range (17.3 to 65.8) but just below the optimal band of 25 to 55. Low SHBG can be associated with insulin resistance, but Alexandre's HOMA-IR is excellent at 0.66, so that is not the driver here. A low-normal SHBG in the context of low total testosterone means the free fraction appears adequate only because binding is low, not because production is strong.","low_causes":"Insulin resistance, obesity, hypothyroidism, steroid use, PCOS (females)","high_causes":"Ageing, hyperthyroidism, liver disease, oral oestrogen, anticonvulsants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"50.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5068","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) is calculated as (total testosterone / SHBG) x 100. It provides another estimate of the proportion of testosterone that is biologically active. Alexandre's FAI of 50.81 is within both the laboratory and optimal ranges. However, FAI can appear adequate when SHBG is low (which inflates the ratio) despite total testosterone being suboptimal, as is the case here.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"Low SHBG, PCOS (females), exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2910","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen, present in smaller amounts in men where it plays a role in bone health, brain function, and cardiovascular protection. In men, it is produced by the aromatisation of testosterone. Alexandre's oestradiol of 85 pmol/L is within the laboratory range (below 146.1) and within the optimal band, indicating a healthy testosterone-to-oestrogen balance.","low_causes":"Very low testosterone (insufficient substrate for aromatisation), aromatase inhibitor use","high_causes":"Obesity (increased aromatase activity), liver disease, medications, exogenous oestrogen","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in balancing other hormones. Alexandre's result of 1.61 nmol/L is within both the laboratory and optimal ranges.","low_causes":"Adrenal insufficiency, ageing","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3924","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mIU/mL","description":"LH (luteinising hormone) is produced by the pituitary gland in the brain and signals the testes to produce testosterone. Alexandre's LH of 2.84 is within the laboratory range but below the optimal band of 3 to 8, and notably the pituitary is not sending a strong signal for more testosterone despite the total testosterone being at the bottom of range. In secondary hypogonadism (where the problem originates in the brain rather than the testes), LH is low or inappropriately normal despite low testosterone. This pattern may warrant further investigation if testosterone remains low after lifestyle interventions.","low_causes":"Pituitary dysfunction, stress, obesity, opioid use, overtraining","high_causes":"Primary testicular failure, menopause (females), PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"5.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5073","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5486","units":"mIU/mL","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and supports sperm production in men. Alexandre's FSH of 5.88 is within both the laboratory and optimal ranges, indicating normal pituitary-testicular signalling for this function.","low_causes":"Pituitary dysfunction, steroid use, stress","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3894","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5455","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in lactation but also involved in immune regulation and reproductive function. In men, excessively high prolactin can suppress testosterone and libido. Alexandre's prolactin of 101 uIU/mL is within both the laboratory and optimal ranges, which is reassuring in the context of his low testosterone, as it rules out prolactin excess (prolactinoma) as a cause.","low_causes":"Not typically clinically significant","high_causes":"Prolactinoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"2874.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4836","lower_normal":"162.1","upper_normal":"4939.9","lower_optimal":"1000","upper_optimal":"4000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5806","units":"ug/dL","description":"DHEA-S (dehydroepiandrosterone sulphate) is the most abundant steroid hormone in the body, produced by the adrenal glands. It serves as a precursor to both testosterone and oestrogen and declines with age. Alexandre's result of 7.8 umol/L (approximately 2,874 ug/dL) is within both the laboratory and optimal ranges, indicating healthy adrenal function and a good hormonal reserve for his age.","low_causes":"Ageing, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"242","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4370","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3819","upper_optimal_position":"0.6150","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a strong circadian rhythm, peaking in the early morning and declining through the day. Alexandre's result of 242 nmol/L falls within the morning reference range (145 to 619). Without knowing the exact time of the blood draw, precise interpretation is limited. If taken before 9am, this sits at the lower end of the morning range, which in the context of fatigue and poor sleep could suggest the cortisol awakening response is blunted. If taken later in the morning, this is an entirely normal reading.","low_causes":"Adrenal insufficiency, chronic stress (adrenal fatigue is not a recognised medical diagnosis but prolonged stress can reduce cortisol output), late sample time","high_causes":"Acute stress, Cushing's syndrome, early morning sample, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5893","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4083","upper_optimal_position":"0.5887","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It is converted into the more active T3 in tissues throughout the body. 'Free' means the unbound fraction available for use. Alexandre's FT4 of 20 pmol/L sits at the top of the optimal range (14 to 20), indicating strong thyroid hormone production.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3482","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3652","upper_optimal_position":"0.4714","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. When the thyroid is producing enough T4 and T3, TSH stays low. When production falls, TSH rises. Alexandre's TSH of 0.74 is within the laboratory range (0.55 to 4.78) and sits below the optimal band of 1.0 to 2.5. However, in the context of an FT4 at 20 and an FT3 at 5.7 (both excellent), a low TSH simply means the pituitary does not need to send a strong signal because the thyroid is producing plenty of hormone. This is a positive finding, not a concern.","low_causes":"Adequate thyroid hormone production (physiological), hyperthyroidism, thyroiditis, excessive thyroid medication, biotin interference","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5630","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4889","upper_optimal_position":"0.6148","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolic rate, energy production, and body temperature regulation. Most T3 is produced by conversion from T4 in the liver and other tissues. Alexandre's FT3 of 5.7 pmol/L is within the optimal range (4.5 to 6.5), indicating excellent thyroid hormone conversion and metabolic activity.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies target the enzyme involved in thyroid hormone production. Their presence above the reference range suggests autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Alexandre's result of below 6.6 U/mL is well within the normal range (below 13.8), ruling out TPO-mediated autoimmune thyroid disease.","low_causes":"Not applicable, absence is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein involved in thyroid hormone storage. Like TPO antibodies, their presence above range suggests autoimmune thyroid disease. Alexandre's result of 1.3 U/mL is within the normal iption":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. The body cannot produce it and must obtain it from animal products or supplements. Alexandre's B12 of 304 pg/mL is within the laboratory range (193 to 982) but well below the optimal threshold of 500 pg/mL. Suboptimal B12 is associated with fatigue, low mood, brain fog, and reduced cognitive function, all of which are relevant to his reported symptoms. Sublingual methylcobalamin supplementation is recommended.","low_causes":"Poor dietary intake (especially vegetarian/vegan), malabsorption, pernicious anaemia, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and amino acid metabolism. It works closely with B12 and is particularly important for homocysteine regulation. Alexandre's folate of 8 ng/mL just reaches the optimal threshold of 8, within the laboratory range (3 to 17). This leaves little margin and would benefit from increased intake of folate-rich foods such as dark leafy greens, lentils, and fortified cereals.","low_causes":"Poor dietary intake, malabsorption, alcohol, certain medications (methotrexate), pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4307","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5738","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the four small parathyroid glands behind the thyroid. It is the master regulator of calcium levels, increasing calcium absorption from the gut, reducing calcium loss in urine, and releasing calcium from bones when needed. Alexandre's PTH of 2.1 pmol/L is within both the laboratory and optimal ranges, confirming normal calcium-parathyroid regulation.","low_causes":"Post-thyroid surgery, autoimmune hypoparathyroidism, magnesium deficiency, excess calcium","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3893","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle tissue. It is released into the blood when muscle cells are damaged, whether from exercise, injury, or disease. Alexandre's CK of 87 U/L is within both the laboratory and optimal ranges, consistent with his sedentary lifestyle (no recent muscle damage from training).","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise (especially eccentric), muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7234","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4681","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity (TAA) measures the overall capacity of the blood to neutralise free radicals, which are reactive molecules that can damage cells. Alexandre's TAA of 1.85 mmol/L is marginally above the upper limit of 1.77. This is not a clinical concern and typically reflects good dietary antioxidant intake from fruits, vegetables, tea, coffee, or supplemental antioxidants such as vitamin C or E. A higher antioxidant capacity is generally positive for health.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"Good dietary antioxidant intake, supplementation, certain foods (berries, dark chocolate, green tea)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1400","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/mL","description":"Prostate-specific antigen (PSA) is a protein produced by the prostate gland. While it is best known as a screening marker for prostate cancer, it can also be elevated by benign prostatic hyperplasia (BPH), prostatitis, and recent ejaculation. Alexandre's PSA of 0.7 ng/mL is well within both the laboratory limit (2.5) and the optimal range, providing excellent reassurance about prostate health at 41.","low_causes":"Not clinically significant","high_causes":"Prostate cancer, BPH, prostatitis, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":" function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);

}

  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;

    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
