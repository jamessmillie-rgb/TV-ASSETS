<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Alan Sanders","dob":"14/06/1954","report_date":"2026-11-10","summary":"Customer is a 72-year-old male following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are small, and he often skips meals (volume 2 out of 10). He trains 4 times per week (2 cardio, 2 resistance) at moderate intensity with 2,000 to 5,000 daily steps. He sleeps poorly and has been experiencing low libido, hair thinning and insomnia for over a year. He takes metformin and an SSRI. He supplements with vitamin D, magnesium, vitamin B12 and zinc. He has a diagnosis of type 2 diabetes and a family history of type 2 diabetes. He does not drink alcohol. A previous blood test was reported as normal. His goals are to build muscle, prevent disease and improve cardiovascular fitness.\n\nThe most important finding in this report is significant microscopic blood in the urine. His urinary red blood cell count is 50, well above the threshold of 25 that the laboratory considers significant. At 72, isolated microscopic haematuria, which means red blood cells in the urine without an obvious infection, needs urological investigation. His urinary white cells are below 1, his nitrites are negative, and the laboratory has called the urine culture a mixed growth consistent with probable contamination, so there is no evidence of a urinary tract infection driving this. We would strongly recommend he discusses this with his GP as a priority so that referral for further investigation can be arranged.\n\nThe second finding that needs his GP's attention is his thyroid. His TSH, thyroid stimulating hormone, the signal the pituitary gland sends to tell the thyroid how hard to work, is 0.32, below the lower limit of 0.55. A low TSH means the pituitary is receiving too much thyroid hormone and is dialling its signal down. His free T4, the main hormone the thyroid produces, is 20.3, which is within the laboratory range of 11.5 to 22.7 but above the optimal band of 14 to 20. His free T3, the active form the body converts T4 into, is 4.9, comfortably within range. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which makes autoimmune thyroid disease unlikely. The pattern of a suppressed TSH with a high-normal T4 could reflect early or subclinical hyperthyroidism, where the thyroid is producing slightly more hormone than it should. It could also be driven by medication or by a transient shift. Either way, a TSH below range at 72 warrants a GP review and likely a repeat in six to eight weeks, because sustained excess thyroid hormone at this age increases the risk of atrial fibrillation and bone loss.\n\nHis diabetes management shows a mixed picture. His HbA1c is 52 mmol/mol, which is above the 48 threshold that defines diabetes and confirms his glucose control is not yet at target. HbA1c measures the average blood sugar over the preceding two to three months by looking at how much glucose has attached itself to haemoglobin, the oxygen-carrying molecule in red blood cells. A target below 48 is generally recommended for someone on metformin. His fasting glucose, however, is 3.7, which is actually at the lower end of the laboratory range of 3.5 to 6 and technically verging on hypoglycaemia. This is an unusual combination: a low fasting glucose alongside an elevated HbA1c suggests that his blood sugar may be spiking significantly after meals and then dropping between meals or overnight, a pattern of wide glucose swings rather than a steady elevation. Metformin works by reducing the amount of glucose the liver releases and by improving insulin sensitivity, and it is likely responsible for keeping his fasting glucose low, but the post-meal peaks are still driving the HbA1c up. His urine glucose shows a reading of ++++, which is heavily positive and consistent with blood glucose levels exceeding the renal threshold (usually around 10 mmol/l) after meals. This reinforces the picture of significant post-meal glucose spikes. His fasting insulin is 2.34, fractionally below the laboratory lower limit of 2.6. In the context of type 2 diabetes treated with metformin, a low fasting insulin can reflect the medication suppressing hepatic glucose output rather than the pancreas failing. His HOMA-IR, a calculation that estimates insulin resistance from fasting glucose and insulin, is 0.38, which is below the reference range of 0.5 to 1.5. Because HOMA-IR measures insulin resistance, a value below the lower end of the range means the system is measuring very high insulin sensitivity, which is in the favourable direction. This is a genuinely positive signal: his body is responding to the insulin it does produce. His C-peptide, a molecule released in equal amounts to insulin and a more stable measure of pancreatic output, is 2.07 ug/l, comfortably within range. This confirms his pancreas is still producing insulin adequately. The estimated average glucose from the HbA1c is 8.4 mmol/l, above the ideal of below 7, and the TyG index is 8.05, within the acceptable range. The overall story is that his pancreas is working, his insulin sensitivity is good, but his post-meal glucose control needs tightening. This is a dietary challenge more than a medication failure, and it connects directly to his eating pattern: small meals with skipped meals followed by larger or later eating can produce exactly this kind of swing.\n\nHis kidney function needs attention. Cystatin C is a protein produced at a constant rate by all cells and filtered by the kidneys, making it a very reliable measure of how well they are working. His cystatin C is 1.41, above the upper limit of 1.1, giving an estimated glomerular filtration rate (eGFR) of 67, which is in the mildly reduced range (stage G2). The creatinine-based eGFR is reported as above 90, but cystatin C is more reliable in older adults because creatinine is influenced by muscle mass, and at 63.5 kg with small meals, his creatinine may be underestimating the picture. The combined creatinine and cystatin C eGFR, which uses both markers together, also comes to 67. His urea is 6.9 and the urea-to-creatinine ratio is 100, at the upper boundary of the reference range, which is consistent with mild kidney impairment. His electrolytes are reassuring: sodium 137, chloride 97, bicarbonate 24.9 and serum osmolality 284.6 are all within the ideal range. His uric acid at 398 is within range but above the optimal band for a male (200 to 380), and at this level with reduced kidney function, it is worth keeping an eye on because the kidneys clear uric acid and a rising level can be both a consequence and a contributor to kidney strain. The metformin he takes is cleared by the kidneys, so his GP should be aware of the eGFR of 67 to ensure the dose remains appropriate.\n\nThere is a great deal of positive news in this report. His liver is in excellent health. His GGT at 19 is well below the optimal threshold of 25, his bilirubin is 12, his alkaline phosphatase is 62, and his AST is 26, all comfortably within range. His ALT is reported as below 7, which is very low but not a concern in itself; it simply reflects a liver under no metabolic strain. The AST-to-ALT ratio (De Ritis ratio) comes out at 3.71, which is above the normal range of 0.6 to 1.6. This is being driven entirely by the very low ALT denominator rather than by liver disease, and every other liver marker confirms the liver is healthy. The APRI score, a fibrosis estimate, is 0.285, well within the ideal range. The FIB-4 score is 3.1, which is above the standard threshold of 1.45, but at 72 the age term in the FIB-4 calculation inflates the score significantly. When every actual liver marker, GGT, ALT, AST, bilirubin and albumin, is healthy, the FIB-4 is being driven by the arithmetic of age rather than by any sign of liver disease. It is still worth noting to his GP for context, and if there is any clinical doubt, a FibroScan would settle it definitively.\n\nHis lipid profile is largely favourable. His total cholesterol is 4.8, his HDL is 1.6, which is genuinely excellent for a male and above the optimal threshold of 1.4, and his triglycerides are 1.06, within the ideal range. His VLDL is 0.48 and his non-HDL cholesterol is 3.2, both within range. His apolipoprotein A1, the protein that drives HDL's protective function, is 2.06, well above the normal threshold of 1.2, and his ApoB-to-ApoA1 ratio is 0.5, comfortably within the lower-risk range. His Lp(a), lipoprotein(a), which is an inherited particle that carries cholesterol and cannot be changed by diet or exercise, is below 25, which is ideal and means any elevation in his other lipid markers is driven entirely by modifiable factors. The one marker that is above target is his apolipoprotein B (ApoB), at 1.03 against a target of below 0.9. ApoB counts the number of particles capable of depositing cholesterol into artery walls, and it is the single most important marker for cardiovascular risk. His LDL cholesterol is 2.76, within the laboratory range but above the optimal of below 2.6. His Lp(a)-corrected LDL, which removes the small contribution of Lp(a) particles, is 2.68, still slightly above ideal. The atherogenic index of plasma is negative 0.179, which is favourable, and his Castelli II ratio (LDL-to-HDL) is 1.73, also well within the ideal range. The cardiovascular risk score, which combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c into a single index from 0 to 100, is 50, above the acceptable threshold of 40. This is being driven primarily by the ApoB of 1.03 and the HbA1c of 52. With his excellent HDL, low triglycerides and ideal Lp(a), the modifiable levers are dietary changes to bring ApoB below 0.9 and tighter glucose control to bring HbA1c below 48.\n\nHis testosterone is 22.3, which at 72 is genuinely excellent and sits within the optimal band of 18 to 30. His free testosterone is 0.394 and his bioavailable testosterone is 8.82, both within range. His SHBG, sex hormone binding globulin, the protein that binds testosterone and reduces the amount available to tissues, is 47.7, within the ideal band of 25 to 55. His free androgen index is 46.75, healthy. His DHEA-sulphate, a precursor hormone produced by the adrenal glands that naturally declines with age, is 0.6 umol/L, which is low but expected at 72. His oestradiol is 84, within range, and his LH and FSH are 5.24 and 7.21 respectively, both normal. His cortisol is 214, within the reference range. His prolactin is 93, normal. His progesterone is 0.62, below the male reference range of 0.89 to 3.88; in men, progesterone has a minor role in brain function and sleep, and a low level at 72 is common and not a primary driver of symptoms. His low libido and hair thinning, which he has experienced for over a year, are therefore not explained by testosterone deficiency. The SSRI he takes is a well-recognised cause of reduced libido, and this is by far the most likely explanation. Hair thinning at 72 is most commonly androgenetic (pattern) hair loss driven by genetics and time. His insomnia is worth considering alongside the low progesterone, the SSRI (which can disrupt sleep architecture), and the thyroid finding: a mildly overactive thyroid can cause difficulty sleeping, restlessness and a sense of being wired.\n\nHis inflammatory markers are reassuring. His hsCRP, high-sensitivity C-reactive protein, which measures low-grade systemic inflammation, is 1.3, within the laboratory range of below 5 and only slightly above the optimal of below 1.0. His ESR, erythrocyte sedimentation rate, another inflammation marker, is 2, which is excellent. The systemic immune-inflammation index is 444, within range, and his platelet-to-lymphocyte ratio is 68.1, fractionally below the reference range of 60 to 210 but not a concern.\n\nHis iron studies tell an interesting story. His serum iron is 33.2, above the upper limit of 31.3. His transferrin saturation is 51.24%, within the laboratory range of 18 to 55% but above the optimal band of 25 to 40%. His ferritin, however, is only 30, which is within the laboratory range of 22 to 322 but below the optimal of 50 for a male. His transferrin is 2.58 and iron binding capacity is 61, both within range. The combination of high serum iron and high saturation with low ferritin is unusual. Serum iron fluctuates with recent meals and time of day, so a single elevated reading does not necessarily indicate iron overload. However, with a saturation above 50%, it is worth the GP checking a repeat fasting iron and saturation, and if persistently elevated, an HFE gene test for hereditary haemochromatosis would be prudent, particularly given his northern European ancestry.\n\nHis full blood count shows several findings. His white cell count is 10.61, marginally above the upper limit of 10. His lymphocytes are 3.35, slightly above the upper limit of 3. These mild elevations together may reflect a minor viral exposure, a stress response, or simply his baseline. There is no clinical concern given the normal CRP and ESR. His RDW, red cell distribution width, which measures the variation in size of red blood cells, is 16.4%, above the upper limit of 15%. An elevated RDW can reflect early iron deficiency (his ferritin is below optimal), vitamin B12 or folate issues (his B12 is 404 and folate is above 24, so folate is not the issue, but B12 could be more optimal), or it can be a feature of chronic disease including diabetes. In the context of metformin use, which can reduce B12 absorption over time, the RDW elevation may be an early signal that B12 is not quite keeping up despite supplementation. His reticulocyte percentage is 0.74%, within range, but his absolute reticulocyte count is 37.2, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A low absolute count suggests the bone marrow is producing red cells at a slower pace than ideal. At 72, some reduction in marrow activity is expected, and the combination of below-optimal ferritin with an elevated RDW and low reticulocytes is consistent with early iron-restricted erythropoiesis: the marrow has enough iron to maintain a normal haemoglobin (142, within range) but not enough stored reserves to produce red cells at full capacity. His haemoglobin, haematocrit, MCV, MCH and MCHC are all within range. His platelets are 228, healthy. His MPV, mean platelet volume, is 10.4, marginally above the range of 7.1 to 10.1; at this margin, it is usually a normal variant.\n\nHis creatine kinase (CK) is 492, above the upper limit of 320. CK is an enzyme released when muscle is damaged. At 72, training 4 times a week at moderate intensity, the most likely explanation is delayed onset muscle soreness from a recent session. If the blood was drawn within 48 hours of resistance training, this is expected. If he is experiencing persistent muscle pain, cramping or dark urine, it would be worth mentioning to his GP, but in the context of regular training, a CK of 492 is not alarming.\n\nHis immune system shows two notable findings. His IgM is below 0.2, well under the lower limit of 0.5. IgM is the first antibody the body produces in response to a new infection. A very low IgM can be seen as part of normal ageing, as a medication effect, or as a sign of a condition affecting immunoglobulin production. His IgG and IgA are both within range, which is reassuring. However, an IgM this low should be flagged to his GP, who may wish to repeat it and consider whether further investigation is needed. His IgE is 239, well above the upper limit of 100. IgE is the antibody involved in allergic responses. An elevated IgE suggests his immune system is reacting to something, whether an environmental allergen, a food, or rarely, a parasitic infection. If he has symptoms of allergy such as hay fever, eczema, or nasal congestion, this may explain the elevation. If he does not, it would be worth discussing with his GP.\n\nHis vitamin D is 171, which is above the sufficient threshold of 50 and reflects his supplementation, though it is above the optimal band of 75 to 120. His calcium and corrected calcium are 2.49 and 2.52 respectively, both within range, and his parathyroid hormone is 2.3, within range and appropriate. His phosphate is 1.3 and magnesium is 0.9, both within the ideal range, reflecting his magnesium supplementation. His vitamin B12 is 404, within the laboratory range of 193 to 982 but below the optimal of 500 despite supplementation. At this level, he is not deficient, but given his metformin use (which impairs B12 absorption over time) and the elevated RDW, optimising B12 further would be worthwhile. His folate is above 24, above the laboratory upper limit of 17, which likely reflects dietary intake or supplementation and is not a concern.\n\nHis total antioxidant activity is 2.1, above the upper limit of 1.77. This is typically elevated by supplementation, particularly vitamin C, vitamin E, zinc and polyphenol-rich foods, and is not a concern.\n\nHis prostate markers are reassuring. His PSA is 2.66, comfortably within the age-appropriate range. His free PSA is 0.97, marginally above the threshold of 0.9, and his free-to-total PSA ratio is 0.365, well above the 0.19 threshold. A high free PSA ratio is reassuring because it favours benign prostatic changes over anything more concerning. His CA19-9 is 35.1, just within the upper limit of 37, and his CEA is 1.21, well within the reference range below 2.3. His tissue transglutaminase IgA is negative, making coeliac disease unlikely. His rheumatoid factor is below 4, negative.\n\nHis amylase is 26, marginally below the lower limit of 30. Amylase is an enzyme produced by the pancreas and salivary glands to digest starch. A slightly low level in isolation, with a normal lipase of 21, is not a sign of pancreatic disease. It may reflect his low dietary volume: the pancreas produces less amylase when consistently asked to digest less food.\n\nHis PhenoAge, a biological ageing estimate built from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 72.9 against a calendar age of 72, a difference of less than one year. The slightly elevated WBC, RDW and glucose-related markers are nudging this fractionally above his calendar age, but the gap is small and will narrow as glucose control improves.\n\nHis FT3-to-FT4 ratio is 0.241, fractionally below the optimal band of 0.27 to 0.4 but within the reference range. This may reflect conversion being slightly dampened, and it connects to the overall thyroid picture that needs GP review.","links":"The central thread in this report is the interplay between type 2 diabetes management, dietary volume and kidney function. His HbA1c of 52 confirms glucose control is above target, but his fasting glucose of 3.7 and fasting insulin of 2.34 show that between meals, metformin is driving his blood sugar low and his pancreas is producing very little insulin at rest. The heavily positive urine glucose confirms that after meals, blood sugar is spiking well above the renal threshold of around 10 mmol/l. This pattern of wide glucose swings is driven in large part by his eating habits: a diet volume of 2 out of 10, with meals often skipped, means that when he does eat, the glucose load arrives in a concentrated burst that overwhelms the system. The pancreas is functional (C-peptide is healthy), insulin sensitivity is preserved (HOMA-IR is below range in the favourable direction), and the problem is timing and distribution of food rather than pancreatic failure.\n\nThe kidney function finding is connected to the diabetes. A cystatin C eGFR of 67 at 72 may partly reflect age-related decline, but diabetes is the single most common cause of progressive kidney disease, and an HbA1c above target accelerates that decline. Bringing glucose control into the target range is therefore not just about the diabetes: it is kidney-protective. The metformin dose should also be reviewed at this eGFR, as dose adjustment is typically recommended below 60 and monitoring is recommended between 60 and 90.\n\nThe suppressed TSH with a high-normal FT4 runs as a separate thread. If confirmed on repeat testing, subclinical hyperthyroidism at 72 has specific implications: it increases the risk of atrial fibrillation, accelerates bone loss, and can worsen sleep, all of which are relevant to his symptoms and goals. It may also contribute to the low fasting glucose by increasing metabolic rate. The negative antibodies make Graves' disease unlikely, so the differential includes a toxic nodule, early autonomous thyroid function, or a medication effect.\n\nThe iron story sits between two possibilities. His serum iron and transferrin saturation are elevated while his ferritin is below optimal. If the high serum iron is simply a timing artefact from a non-fasting sample or a recent iron-rich meal, then his true picture is mildly iron-depleted, which would explain the elevated RDW and low absolute reticulocytes: the bone marrow is not getting enough stored iron to produce red cells at full pace. If the high saturation is persistent on repeat testing, hereditary haemochromatosis needs to be excluded with a gene test, particularly given his European ancestry. The two explanations are managed differently, so a fasting repeat will settle it.\n\nTwo findings stand alone. The urinary red blood cells at 50, without infection, require urological investigation regardless of the other results. And the very low IgM warrants its own follow-up, because an isolated immunoglobulin deficiency can increase susceptibility to certain infections, and at 72 this is worth documenting even if it turns out to be age-related.","lifestyle":"Eat three meals a day, every day, with no meals skipped. Start with breakfast within an hour of waking, even if it is small. Anchor: alarm goes off, breakfast follows. Why: his fasting glucose of 3.7 suggests he is running low between meals, and skipping meals means the next meal produces a larger glucose spike, which is driving his HbA1c of 52 and the ++++ urine glucose.\nAdd a palm-sized portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, tinned sardines or lentils. Anchor: protein goes on the plate first, before anything else. Why: protein slows glucose absorption, reduces post-meal spikes, and at 63.5 kg aiming to build muscle he needs a minimum of 83 to 95 grams of protein a day, which is very difficult to reach on small or skipped meals.\nSwap white bread, white rice and potatoes for oats, sweet potato, wholegrain bread or lentils, one meal at a time, starting with whatever he eats most often. Why: slower-digesting carbohydrates produce a lower post-meal glucose peak, which is the mechanism behind the gap between his fasting glucose of 3.7 and his HbA1c of 52.\nWalk for 15 minutes immediately after his largest meal. Anchor: last bite, shoes on, out the door. Why: a post-meal walk lowers the glucose spike from that meal by up to 30%, which directly targets the pattern driving his HbA1c and urine glucose.\nIncrease daily steps to 5,000 to 7,000 by adding a morning walk, ideally outside within an hour of waking. Anchor: before the first cup of tea. Why: morning light resets the circadian clock, which improves sleep quality (he reports insomnia), and the additional movement supports glucose control and cardiovascular fitness.\nContinue his 4 training sessions per week and aim to increase resistance sessions from 2 to 3 over the next month, as his body allows. Prioritise compound movements (squats, rows, presses) with a weight that feels challenging by the last 2 to 3 repetitions. Why: resistance training is the most effective stimulus for building muscle at 72, it improves insulin sensitivity independently of weight loss, and his testosterone of 22.3 means he has the hormonal support to respond well to training.\nSet a fixed wake time 7 days a week and a caffeine cut-off at midday. Keep the bedroom cool and dark. Why: his insomnia may be partly driven by his suppressed TSH (excess thyroid hormone disrupts sleep) and partly by his SSRI, both of which his GP can review, but sleep hygiene gives the best foundation while those are being investigated.\nAim for a daily calorie intake of approximately 1,900 to 2,100 kcal across three meals and one snack, with at least 83 to 95 grams of protein. At his current weight of 63.5 kg with moderate activity, this supports muscle building without excessive glucose loading. A food diary for two weeks would help identify where the gaps are.","flags":"Urinary RBCs at 50, above the significant threshold of 25, with no evidence of infection (WBCs below 1, nitrites negative, culture shows mixed growth consistent with contamination). At 72, isolated microscopic haematuria requires urological investigation to exclude bladder and kidney pathology. This should be discussed with the GP as a priority.\nTSH 0.32, below the lower limit of 0.55, with FT4 at 20.3 (near the top of the 11.5 to 22.7 range) and FT3 4.9 (within range). Both thyroid antibodies are negative. This pattern is consistent with subclinical hyperthyroidism. At 72, a persistently suppressed TSH increases the risk of atrial fibrillation and bone loss. Recommend GP review and repeat thyroid function in 6 to 8 weeks.\nHbA1c 52 mmol/mol, above the diabetes threshold of 48, with fasting glucose 3.7 (near the lower limit of 3.5) and urine glucose ++++. The pattern suggests significant post-meal glucose spikes with low inter-meal glucose. Insulin 2.34 (below range at 2.6) and HOMA-IR 0.38 confirm insulin sensitivity is preserved. C-peptide 2.07 ug/l suggests adequate pancreatic output. Dietary restructuring (meal frequency, carbohydrate quality) is the primary lever. GP to review whether metformin dose or timing adjustment would help.\nCystatin C 1.41, above the upper limit of 1.1, giving a cystatin C eGFR of 67 and a combined eGFR of 67, in the mildly reduced range (stage G2). The creatinine-based eGFR of above 90 likely overestimates function given his low muscle mass. GP should be aware for metformin dose review and monitoring.\nIgM below 0.2, well under the lower limit of 0.5, with IgG and IgA within range. An isolated low IgM at 72 may be age-related but should be repeated and documented by the GP.\nIgE 239, above the upper limit of 100. Suggests an allergic or atopic process. Worth discussing with the GP, particularly if he has symptoms of allergy.\nApoB 1.03, above the target of 0.9. LDL 2.76, above the optimal of 2.6. Cardiovascular risk score 50 out of 100, driven primarily by ApoB and HbA1c. HDL 1.6, triglycerides 1.06 and Lp(a) below 25 are all favourable, and the ApoB:ApoA1 ratio is 0.5 (lower risk). Dietary changes (oily fish, soluble fibre, reduction in saturated fat) and glucose control improvement should bring ApoB to target.\nSerum iron 33.2, above the upper limit of 31.3, with transferrin saturation 51.24% (above the optimal of 40%) and ferritin 30 (below the optimal of 50). Recommend a fasting repeat of iron and saturation. If saturation remains above 45%, HFE gene testing for hereditary haemochromatosis is warranted.\nRDW 16.4%, above the upper limit of 15%, with absolute reticulocytes 37.2 (below the lower limit of 50). This pattern is consistent with early iron-restricted erythropoiesis or B12 insufficiency (B12 404, below optimal of 500) in the context of metformin use. Haemoglobin is maintained at 142.\nWBC 10.61, marginally above the upper limit of 10, with lymphocytes 3.35, marginally above the upper limit of 3. CRP and ESR are low, making infection or inflammation unlikely. Likely a normal variant or minor viral exposure.\nCreatine kinase 492, above the upper limit of 320. Most likely post-exercise in the context of regular resistance training. If associated with persistent muscle pain or dark urine, GP review is advised.\nProgesterone 0.62, below the male range of 0.89 to 3.88. Common at 72 and not a primary clinical concern.\nDe Ritis ratio (AST:ALT) 3.71, above the range of 0.6 to 1.6. This is driven entirely by the very low ALT (below 7) and does not reflect liver disease; all liver markers are healthy.\nFIB-4 3.1, above 1.45 but driven by the age term in the calculation. All direct liver markers are normal. A FibroScan would confirm if there is any clinical doubt.\nAmylase 26, marginally below the lower limit of 30, with lipase 21 within range. Not a sign of pancreatic disease; likely reflects low dietary volume.\nMPV 10.4, marginally above the range of 7.1 to 10.1. At this margin, this is usually a normal variant.\nReassuring negatives: liver function is excellent (GGT 19, ALT below 7, AST 26, bilirubin 12, albumin 41, APRI 0.285), making significant liver disease unlikely. Testosterone 22.3 with healthy free testosterone and SHBG makes androgen deficiency unlikely. PSA 2.66 with a free ratio of 0.365 makes prostate pathology unlikely. Negative coeliac antibodies make coeliac disease unlikely. Negative rheumatoid factor makes rheumatoid arthritis unlikely. ESR 2 and CRP 1.3 make significant systemic inflammation unlikely. Calcium, magnesium and phosphate are all within range, making metabolic bone disease unlikely.\nNot reported on this occasion: potassium.","recommendations":"Discuss the urinary RBC finding of 50 with the GP as a priority. At 72, isolated microscopic haematuria without infection requires urological referral for further investigation including imaging and cystoscopy.\nDiscuss the suppressed TSH of 0.32 with a high-normal FT4 of 20.3. The GP should arrange a repeat thyroid function test in 6 to 8 weeks. If TSH remains below range, further investigation for subclinical hyperthyroidism may be needed.\nReview HbA1c of 52 and the pattern of low fasting glucose (3.7) alongside heavily positive urine glucose. Discuss whether metformin dose or timing adjustment, or the addition of a post-meal glucose-lowering strategy, would help close the gap between fasting and post-meal control. A home glucose monitor or continuous glucose monitor trial for two weeks would reveal the extent of the post-meal spikes.\nReview kidney function: cystatin C eGFR is 67, and the GP should confirm whether the current metformin dose is appropriate at this level and arrange monitoring.\nDiscuss the IgM below 0.2 and IgE of 239. The GP may wish to repeat immunoglobulins and consider whether the low IgM warrants further investigation or documentation.\nArrange a fasting repeat of serum iron and transferrin saturation. If saturation remains above 45%, request HFE gene testing to exclude hereditary haemochromatosis.\nDiscuss whether the SSRI could be contributing to his low libido and poor sleep. If these symptoms are significantly affecting quality of life, the GP may consider a review of the medication or a trial of an alternative.\nCalorie target: 1,900 to 2,100 kcal per day across three meals and one snack. Protein target: 83 to 95 grams per day (approximately 1.3 to 1.5 g per kg). Retest HbA1c, cystatin C, thyroid function, iron studies and immunoglobulins in 3 months to track progress.","supplementation":"Vitamin D3 (cholecalciferol): continue current supplementation. His level of 171 is above the optimal band of 75 to 120. A maintenance dose of 2,000 IU daily with a fat-containing meal, paired with vitamin K2 (MK-7) 100 mcg, is appropriate. No need to increase.\nVitamin K2 (MK-7): 100 mcg daily, taken with his vitamin D. Why: K2 directs calcium into bones rather than arteries, which is particularly important at 72 with a suppressed TSH (excess thyroid hormone can accelerate bone loss).\nMagnesium glycinate: continue current supplementation at 300 to 400 mg before bed. His magnesium is 0.9, within the ideal range, and the glycinate form supports sleep quality, which is relevant to his insomnia.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, taken in the morning. Why: his B12 is 404, below the optimal of 500, and metformin impairs B12 absorption over time. The sublingual route bypasses the gut absorption step that metformin disrupts. His current B12 supplement may be an oral tablet, which is less effective in this context.\nZinc: continue current supplementation. His zinc level was not measured separately, but his total antioxidant activity of 2.1 suggests adequate antioxidant status.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 supports the reduction of ApoB (currently 1.03, above the 0.9 target), lowers triglycerides, and has a mild anti-inflammatory effect that may help bring hsCRP from 1.3 toward the optimal of below 1.0.\nDO NOT take iron supplements at this stage. His serum iron is already elevated at 33.2 with a transferrin saturation of 51.24%, and adding supplemental iron before the repeat fasting iron studies and possible HFE gene test could worsen an iron overload picture if haemochromatosis is present.\nThe most important changes from this report are not supplements. They are eating three meals a day with protein at every meal, switching to slower carbohydrates, walking after his largest meal, and discussing the thyroid, kidney and urinary findings with his GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4273","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 47 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 47.2. Weakest systems: immunology 13%, specialized tests 18%, glucose & insulin 25%. Biggest drags: Apolipoprotein B, TSH, White Cell Count, HbA1c.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"72.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4734","lower_normal":"","upper_normal":"77","lower_optimal":"","upper_optimal":"72","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4675","units":"years","description":"PhenoAge is a biological ageing estimate calculated from a set of blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge of 72.9 against a calendar age of 72 gives a biological age gap of less than one year. The mildly elevated WBC, elevated RDW and the glucose markers are nudging this fractionally above his calendar age. With improved glucose control, the gap should narrow or reverse.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built rather than the ten-year probability of an event. His score of 50 is above the acceptable threshold of 40, driven primarily by his ApoB of 1.03 (above 0.9) and his HbA1c of 52 (above 48). His excellent HDL of 1.6, controlled triglycerides of 1.06 and ideal Lp(a) below 25 are working in his favour. The dietary and glucose control changes recommended in this report should bring this score down on retest.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Blood glucose measures the concentration of sugar in the blood at the time the sample is taken. His fasting glucose is 3.7, which is within the laboratory range of 3.5 to 6 but below the optimal band of 4.0 to 5.4. In a person with type 2 diabetes taking metformin, this suggests the medication is effectively suppressing glucose between meals, possibly a little too effectively. When viewed alongside his HbA1c of 52, this indicates that his average glucose over time is higher than this fasting reading suggests, meaning post-meal spikes are the main driver.","low_causes":"Excess insulin, metformin, skipped meals, prolonged fasting, alcohol, adrenal insufficiency","high_causes":"Diabetes, insulin resistance, stress, infection, medications (steroids)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8182","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin, the oxygen-carrying protein in red blood cells, that has glucose permanently attached to it. Because red blood cells live for about 120 days, HbA1c gives an average picture of blood sugar control over the preceding two to three months. His result of 52 mmol/mol is above the diabetes threshold of 48 and above the target of below 42 for someone without diabetes. For a person with diagnosed type 2 diabetes, the typical treatment target is below 48. His result confirms that glucose control needs to improve. The combination of a low fasting glucose (3.7) with an HbA1c of 52 points to significant post-meal glucose elevations that are driving the average up.","low_causes":"Low carbohydrate diet, very high physical activity, haemolytic anaemia, blood loss","high_causes":"Type 2 diabetes, insulin resistance, high carbohydrate diet, low physical activity, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3294","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is a hormone produced by the pancreas that allows cells to absorb glucose from the blood. A fasting insulin level shows how much insulin the pancreas needs to produce to maintain blood sugar between meals. His result of 2.34 is fractionally below the laboratory lower limit of 2.6 and also below the optimal lower bound of 2.6. In the context of metformin use and type 2 diabetes, a low fasting insulin reflects the medication reducing hepatic glucose output and the pancreas needing to produce very little insulin at rest. This is not a sign of pancreatic failure, as confirmed by his healthy C-peptide.","low_causes":"Metformin use, low carbohydrate diet, high insulin sensitivity, type 1 diabetes (progressive), pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes (early), obesity, high carbohydrate diet, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4313","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin. Because it is more stable in the blood than insulin itself, it gives a reliable measure of how much insulin the pancreas is actually producing. His result of 2.07 ug/l is comfortably within the laboratory range and confirms that his pancreas is producing insulin adequately. This is reassuring in the context of type 2 diabetes: it means his pancreatic beta cells are functional, and the disease has not progressed to the point of significant insulin deficiency.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, pancreatectomy","high_causes":"Insulin resistance, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2933","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is a calculation that uses fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A lower number means greater insulin sensitivity, which is favourable. His result of 0.38 is below the laboratory reference range of 0.5 to 1.5. Because HOMA-IR measures insulin resistance, a value below the lower limit indicates very high insulin sensitivity, which is in the favourable direction: it means his cells are responding well to insulin. In a person with diagnosed type 2 diabetes, this is a genuinely positive finding that suggests the insulin resistance component of his diabetes is well controlled, likely helped by metformin.","low_causes":"High insulin sensitivity, metformin use, low carbohydrate diet, fasting state, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, type 2 diabetes, high carbohydrate diet, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"8.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose is calculated from the HbA1c and represents the average blood sugar level over the preceding two to three months. His result of 8.4 mmol/L is above the ideal of below 7, confirming that his overall glucose exposure is higher than target. This is being driven by post-meal spikes rather than elevated fasting glucose, as his fasting glucose is 3.7.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4574","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is a calculation using fasting triglycerides and fasting glucose that provides a surrogate estimate of insulin resistance. His result of 8.05 is within both the reference range and the optimal band. This is consistent with his HOMA-IR finding: despite having type 2 diabetes, his insulin sensitivity is well maintained.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"51.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6328","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of transferrin, the iron transport protein, that is currently loaded with iron. His result of 51.24% is within the laboratory range of 18 to 55% but above the optimal band of 25 to 40%. A saturation above 45% raises the possibility of iron overload or hereditary haemochromatosis, particularly in someone of European ancestry. However, serum iron can be elevated by a recent meal or time of day, so a fasting repeat is needed before drawing conclusions. The combination of high saturation with a below-optimal ferritin of 30 is unusual and needs clarification.","low_causes":"Iron deficiency, chronic disease, inflammation, low dietary iron","high_causes":"Hereditary haemochromatosis, iron overload, liver disease, haemolytic anaemia, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"33.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6988","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6108","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. His result of 33.2 is above the upper limit of 31.3. Serum iron is the most variable of the iron markers, fluctuating significantly with meals, time of day and recent supplementation. A single elevated reading needs confirmation with a fasting repeat. Taken alongside his transferrin saturation of 51.24%, this suggests he may have a tendency to absorb more iron than usual, which warrants investigation.","low_causes":"Iron deficiency, chronic disease, inflammation, malabsorption, blood loss","high_causes":"Hereditary haemochromatosis, iron supplementation, liver disease, haemolysis, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4289","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. His level of 2.58 is within both the laboratory range and the optimal band. A normal transferrin alongside elevated serum iron and saturation is consistent with either a timing artefact (the iron was high at the moment of the draw) or a genuine tendency to absorb too much iron. The transferrin level itself is reassuring in that the body is not signalling iron deficiency.","low_causes":"Iron overload, liver disease, malnutrition, chronic inflammation, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5099","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the maximum amount of iron the blood can carry, reflecting how much transferrin is available to bind iron. His result of 61 is within both the laboratory range and the optimal band. A normal TIBC with elevated serum iron and saturation means the transport system is adequate but more of it is occupied by iron than usual.","low_causes":"Iron overload, liver disease, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3422","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's main iron storage protein. His result of 30 is within the laboratory range of 22 to 322 but below the optimal threshold of 50 for a male. Ferritin below 50 can contribute to fatigue, reduced exercise /12/l","description":"The red blood cell count measures the total number of red blood cells in a given volume of blood. His result of 5.03 is within both the laboratory and optimal ranges, confirming adequate red cell production despite the low absolute reticulocyte count.","low_causes":"Anaemia, blood loss, bone marrow failure, chronic disease, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. His result of 0.43 is within both the laboratory range and the optimal band, reflecting a healthy balance between red cells and plasma.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"16.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8000","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"%","description":"Red cell distribution width measures the variation in size among red blood cells. A higher number means more variation. His result of 16.4% is above the upper limit of 15%. An elevated RDW can reflect early iron deficiency (his ferritin is below optimal at 30), suboptimal B12 (his B12 is 404, below the optimal of 500), or chronic conditions including diabetes. In the context of metformin use, which impairs B12 absorption, and below-optimal ferritin, the RDW is likely reflecting that the bone marrow is producing some red cells that are smaller than normal (iron-restricted) and some that are normal, creating more variation in size.","low_causes":"Normal red cell production","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, chronic disease, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"85.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3796","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"fl","description":"Mean corpuscular volume is the average size of a red blood cell. His result of 85.5 is within both the laboratory range and the optimal band. A normal MCV alongside an elevated RDW suggests a mixed picture where most cells are normal-sized but a subpopulation is not, which is consistent with early or mild nutritional insufficiency.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"28.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"pg","description":"Mean corpuscular haemoglobin is the average amount of haemoglobin in each red blood cell. His result of 28.2 is within both the laboratory range and the optimal band, indicating each red cell is carrying
