healthy pancreatic function.","low_causes":"Chronic pancreatitis (advanced), cystic fibrosis","high_causes":"Acute pancreatitis, gallstones, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL, and VLDL. His result of 4.8 is below the desirable threshold of 5.18. Total cholesterol alone is not the best marker of cardiovascular risk, because it does not distinguish between the protective HDL and the harmful LDL. His HDL of 1.6 is excellent, meaning a good proportion of his total cholesterol is the protective kind.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, familial hypercholesterolaemia, hypothyroidism, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3118","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the most common type of fat in the blood, stored from dietary carbohydrates and fats. His result of 1.06 is within the fasting reference range of below 1.7 but slightly above the optimal of below 1.0. This is a good result. The small margin above optimal is not a concern and may respond to the dietary changes recommended in this report.","low_causes":"Malnutrition, hyperthyroidism, very low carbohydrate diet","high_causes":"High carbohydrate diet, obesity, diabetes, alcohol, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3077","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/l","description":"Very low-density lipoprotein cholesterol carries triglycerides and is a precursor to LDL. His result of 0.48 is within both the laboratory range and the optimal band.","low_causes":"","high_causes":"High triglycerides, diabetes, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/l","description":"High-density lipoprotein cholesterol is the protective form of cholesterol that transports excess cholesterol away from artery walls and back to the liver for disposal. His result of 1.6 is above both the laboratory threshold of 1.04 and the optimal threshold of 1.4 for a male. This is an excellent level and one of the genuine positives in the report. Good HDL protects against cardiovascular disease even when other lipid markers are elevated.","low_causes":"Physical inactivity, smoking, obesity, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetics, medication","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6347","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"Low-density lipoprotein cholesterol is the form of cholesterol most associated with plaque build-up in arteries. His result of 2.76 is within the laboratory range of 0.5 to 3 but above the optimal of below 2.6. At 72 with type 2 diabetes, his cardiovascular risk is higher than average, and a lower LDL is beneficial. The dietary changes in this report, particularly increasing soluble fibre and oily fish, should help bring this toward optimal.","low_causes":"Very low fat diet, hyperthyroidism, liver disease, malabsorption","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a useful summary of the balance between harmful and protective cholesterol. His ratio of 3 is within both the reference range and the optimal band. A lower ratio is better, and his reflects the excellent HDL of 1.6.","low_causes":"","high_causes":"High total cholesterol, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"33.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8332","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is the protective HDL type. His result of 33.33% is above the minimum of 20% and above the optimal of 25%, confirming a favourable cholesterol balance.","low_causes":"Physical inactivity, obesity, metabolic syndrome","high_causes":"Regular exercise, genetics, good lipid balance","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, giving all the cholesterol that is potentially harmful. His result of 3.2 is within the reference range of below 4 but above the optimal of below 2.6. This is consistent with his slightly elevated LDL and ApoB.","low_causes":"","high_causes":"High LDL, high triglycerides, diet, familial factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8583","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apol RUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB-to-ApoA1 ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA1). A lower ratio is better. His result of 0.5 is within the lower-risk range of below 0.7, meaning his high ApoA1 is partially offsetting his elevated ApoB. This is a favourable balance.","low_causes":"","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a) is a genetically determined particle similar to LDL but with an additional protein attached. It carries cholesterol, promotes clotting and drives inflammation. Unlike other lipid markers, it cannot be changed by diet, exercise or most medications, so knowing the level is genuinely useful information. His result of below 25 is within the ideal range of below 32. This is a positive finding because it means any elevation in his LDL or ApoB is driven entirely by modifiable factors such as diet, rather than by an inherited particle that cannot be changed.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"492","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8714","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found mainly in skeletal muscle, heart muscle and brain. When muscle fibres are damaged, CK leaks into the blood. His result of 492 is above the upper limit of 320. In the context of regular resistance training at moderate intensity, this is most likely delayed onset muscle soreness from a recent session. CK can remain elevated for 24 to 72 hours after exercise. If he is not experiencing persistent muscle pain, weakness or dark-coloured urine, this is expected and not a concern.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Recent exercise, muscle damage, rhabdomyolysis, medications (statins), hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5952","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/l","description":"Free T4 is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in tissues throughout the body. His result of 20.3 is within the laboratory range of 11.5 to 22.7 but above the optimal band of 14 to 20. Taken alongside a suppressed TSH of 0.32, a high-normal FT4 suggests the thyroid may be producing slightly more hormone than the body needs. This warrants a GP review and repeat testing.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency, medications","high_causes":"Hyperthyroidism, thyroiditis, excess iodine, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3152","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/l","description":"Thyroid stimulating hormone is produced by the pituitary gland in the brain and tells the thyroid how much hormone to produce. When the pituitary detects too much thyroid hormone in the blood, it reduces TSH to tell the thyroid to slow down. His TSH of 0.32 is below the lower limit of 0.55, meaning the pituitary is seeing more thyroid hormone than it wants. With both thyroid antibodies negative, autoimmune thyroid disease (Graves' disease) is unlikely. The most common explanation at 72 would be a thyroid nodule producing hormone independently (toxic nodule) or early autonomous thyroid function. A suppressed TSH at 72 is significant because excess thyroid hormone increases the risk of atrial fibrillation and accelerates bone loss. This needs GP review and a repeat in 6 to 8 weeks.","low_causes":"Hyperthyroidism, thyroiditis, medications (steroids, dopamine agonists), pituitary dysfunction","high_causes":"Hypothyroidism, iodine deficiency, recovery from thyroiditis, pituitary adenoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5037","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy, mood and body temperature. It is produced mainly by converting T4 in tissues. His result of 4.9 is within both the laboratory range and the optimal band. Despite the suppressed TSH, his T3 is not elevated, which is a reassuring sign. In subclinical hyperthyroidism, T3 and T4 may be normal or only at the upper end of range.","low_causes":"Hypothyroidism, chronic illness, calorie restriction, medications","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence is a hallmark of autoimmune thyroid disease, including Hashimoto's thyroiditis and Graves' disease. His result of below 6.6 is well within the normal range of below 13.8, making autoimmune thyroid disease unlikely.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to make its hormones. His result of below 1.3 is well within range and, alongside the negative TPO antibodies, confirms that autoimmune thyroid disease is unlikely.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.241","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3880","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3-to-FT4 ratio shows how efficiently the body is converting the inactive thyroid hormone (T4) into the active form (T3). His ratio of 0.241 is within the reference range of 0.2 to 0.45 but below the optimal band of 0.27 to 0.4. This is being driven by the high-normal FT4 of 20.3 against a mid-range FT3 of 4.9, suggesting conversion is not quite keeping pace with the amount of T4 being produced. This is relevant to the overall thyroid picture and will be clearer on repeat testing.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"171","within_normal":"TRUE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune function, mood and muscle strength. It is produced in the skin from sunlight and obtained from food and supplements. His result of 171 is well above the sufficient threshold of 50 but above the optimal range of 75 to 120, meaning he is supplementing beyond the ideal band. There is no concern about toxicity at this level, but reducing his dose to a maintenance level of 2,000 IU daily would bring the level toward the optimal range over time.","low_causes":"Lack of sunlight, dark skin, obesity, malabsorption, ageing, kidney disease","high_causes":"Supplementation, excess sun exposure (rarely)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4507","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.6018","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the four small parathyroid glands behind the thyroid and regulates calcium levels. When calcium drops, PTH rises to pull calcium from bones and increase gut absorption. His result of 2.3 is within both the laboratory range and the optimal band. A normal PTH alongside excellent vitamin D and calcium confirms his bone mineral metabolism is well balanced.","low_causes":"Excess vitamin D, hypercalcaemia, magnesium deficiency, surgery","high_causes":"Vitamin D deficiency, chronic kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"404","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4225","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. His result of 404 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Despite supplementing with B12, his level is not yet in the optimal range. Metformin is known to reduce B12 absorption over time by interfering with the calcium-dependent uptake of B12 in the gut. His elevated RDW of 16.4% may partly reflect this suboptimal B12 level. Switching to sublingual methylcobalamin at 1,000 mcg daily would bypass the gut absorption issue and should bring his level into the optimal range.","low_causes":"Metformin use, pernicious anaemia, vegan diet, malabsorption, ageing, gastric surgery","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"> 24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, red blood cell production and DNA synthesis. His result of above 24 is above the laboratory upper limit of 17, which typically reflects good dietary intake of leafy greens and legumes or supplementation. An elevated folate is not a concern and can be protective against cardiovascular disease through its role in reducing homocysteine.","low_causes":"Poor diet, malabsorption, alcoholism, medications (methotrexate), pregnancy","high_causes":"Supplementation, high dietary intake, B12 deficiency (can cause folate trapping)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9007","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position res the amount of PSA circulating unbound in the blood. The free-to-total ratio is the clinically important metric: a ratio above 0.25 (25%) is reassuring because benign conditions tend to produce more free PSA, while prostate cancer tends to produce more bound PSA. His free PSA of 0.97 is marginally above the reference threshold of 0.9, but his free-to-total ratio is 0.365 (36.5%), which is well above the reassuring threshold and makes prostate pathology unlikely.","low_causes":"","high_causes":"Benign prostatic hyperplasia, prostatitis, normal age-related changes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prat","name":"PSA Ratio","group":"PROSTATE","result":"0.365","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9605","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6579","upper_optimal_position":"1.0000","units":"","description":"The PSA ratio (free-to-total PSA) helps distinguish between benign and potentially concerning causes of PSA elevation. A ratio above 0.19 is normal, and above 0.25 is reassuring. His ratio of 0.365 is well above the threshold, meaning the PSA is overwhelmingly in its free, unbound form. This pattern strongly favours benign prostatic changes rather than anything concerning.","low_causes":"Prostate cancer (possible, but not diagnostic)","high_causes":"Benign prostatic hyperplasia, normal prostate","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"c19","name":"CA 19-9","group":"TUMOR MARKERS","result":"35.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4743","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3378","units":"U/ml","description":"CA 19-9 is a protein that can be elevated in pancreatic and biliary cancers, but also in benign conditions such as gallstones, pancreatitis and liver disease. His result of 35.1 is within the laboratory range of below 37 but above the optimal of below 25. At this level, with no symptoms and normal liver and pancreatic markers (lipase 21, amylase 26, GGT 19, bilirubin 12), this is not a concern. It is worth noting for baseline tracking.","low_causes":"","high_causes":"Pancreatic cancer, biliary disease, pancreatitis, liver disease, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2630","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/ml","description":"Carcinoembryonic antigen is a protein used primarily to monitor colorectal cancer but can be elevated in other cancers and some benign conditions. His result of 1.21 is well within the reference range of below 2.3.","low_causes":"","high_causes":"Colorectal cancer, smoking, inflammatory bowel disease, liver disease, other cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5088","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/l","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections the body has previously encountered, either through infection or vaccination. His result of 11.5 is within the laboratory range, confirming a healthy long-term immune memory.","low_causes":"Immunodeficiency, medications (immunosuppressants), protein-losing conditions","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"< 0.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2933","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/l","description":"IgM is the first antibody the body produces when it encounters a new infection. It is a large molecule that is very effective at activating the complement system, a key part of the innate immune response. His result of below 0.2 is well under the lower limit of 0.5. A very low IgM can be seen with normal ageing, with certain medications (his SSRI is not a known cause), or as part of a specific immunoglobulin deficiency. With IgG and IgA both within range, this appears to be an isolated finding. It should be flagged to his GP for documentation and a repeat, and if confirmed, a discussion about whether further investigation is appropriate.","low_causes":"Ageing, medications, selective IgM deficiency, lymphoproliferative disorders","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5914","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/l","description":"IgA is the antibody that protects mucosal surfaces, including the gut, lungs and urinary tract. His result of 2.8 is within the laboratory range. A normal IgA is also important for the reliability of the coeliac (tTG-IgA) test, confirming that the negative coeliac result can be trusted.","low_causes":"Selective IgA deficiency, immunosuppression, medications","high_causes":"Liver disease, coeliac disease, chronic infections, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"239","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"IU/ml","description":"IgE is the antibody that drives allergic responses and defends against parasitic infections. His result of 239 is more than double the upper limit of 100. An elevated IgE indicates his immune system is mounting an allergic-type response to something, whether an environmental allergen (dust mites, pet dander, mould, pollen), a food allergen, or less commonly a parasitic infection. His eosinophils are normal, making a parasitic cause less likely. If he has symptoms such as nasal congestion, itchy eyes, skin rashes or breathing difficulties, this would point toward environmental allergy. If he has no obvious symptoms, it may be a low-level sensitisation. Either way, it is worth discussing with his GP, who may suggest specific allergy testing to identify the trigger.","low_causes":"Immunodeficiency","high_causes":"Allergies, atopy, eczema, asthma, parasitic infection, medications, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_norm imal band. This suggests his adrenal function is normal.","low_causes":"Adrenal insufficiency, pituitary dysfunction, chronic fatigue syndrome","high_causes":"Stress, Cushing's syndrome, medications (steroids), depression, sleep disruption","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"0","upper_normal":"146.1","lower_optimal":"","upper_optimal":"120","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen in the body. In men, it is produced by converting testosterone via the aromatase enzyme, mainly in fat tissue. It plays a role in bone health, brain function and cardiovascular protection. His result of 84 is within both the laboratory range and the optimal band, indicating a healthy balance between testosterone and oestradiol.","low_causes":"Low testosterone, aromatase inhibitors, very low body fat","high_causes":"Obesity, liver disease, aromatase excess, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3032","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3456","upper_optimal_position":"0.5686","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It has a role in brain function, sleep and as a precursor to other hormones. His result of 0.62 is below the male reference range of 0.89 to 3.88. At 72, low progesterone is common and reflects the natural decline in adrenal hormone production with age. It may contribute to his sleep difficulties, as progesterone has a calming effect on the brain and supports sleep quality. This is not typically treated in men but is worth noting in the context of his insomnia.","low_causes":"Ageing, adrenal fatigue, low cholesterol, stress","high_causes":"Adrenal overproduction, congenital adrenal hyperplasia, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4932","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3547","upper_optimal_position":"0.6111","units":"mIU/ml","description":"Luteinising hormone, produced by the pituitary gland, stimulates the testes to produce testosterone. His result of 5.24 is within both the laboratory range and the optimal band, confirming the pituitary-testicular axis is functioning well.","low_causes":"Pituitary dysfunction, medications (opioids, steroids), severe illness","high_causes":"Primary hypogonadism, age-related testicular decline, menopause (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"7.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4493","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3453","upper_optimal_position":"0.5449","units":"mIU/ml","description":"Follicle stimulating hormone, produced by the pituitary gland, stimulates sperm production in the testes. His result of 7.21 is within both the laboratory range and the optimal band.","low_causes":"Pituitary dysfunction, medications, severe illness","high_causes":"Primary hypogonadism, testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"22.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5616","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"28.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4910","upper_optimal_position":"0.6667","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, libido, energy and mood. His result of 22.3 is within both the laboratory range and the optimal band of 18 to 30. At 72, this is an excellent level. Many men of this age have testosterone well below the optimal range. His low libido is therefore not explained by testosterone deficiency and is much more likely a side effect of his SSRI, which is one of the most common medication-related causes of reduced libido.","low_causes":"Ageing, obesity, chronic illness, medications (opioids, steroids), sleep disorders, pituitary dysfunction","high_causes":"Exogenous testosterone, anabolic steroids, tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3818","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3384","upper_optimal_position":"0.5909","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone and reduce libido. His result of 93 is within both the laboratory range and the optimal band, confirming this is not a contributor to his low libido.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, medications (SSRIs, antipsychotics), hypothyroidism, stress","padding" const data = REPORT_DATA;

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
