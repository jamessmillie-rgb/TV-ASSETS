const REPORT_DATA = {"patient_name":"Tracey Parish","dob":"05/10/1974","report_date":"2026-09-26","summary":"Tracey is a 51-year-old female presenting with a BMI of 29.2, following a takeaway and convenience-based diet, eating 0 to 1 portions of vegetables and fruit a day with ultra-processed food weekly and sugary food some days; portions are slightly below average (volume 4 out of 10). She does no structured cardio or resistance training, with 7,500 to 10,000 daily steps. She sleeps 6 to 7 hours, is slow to get going on waking, and her energy is low all day. Stress rarely feels hard to manage. She drinks 1 to 4 alcoholic drinks per week. She takes no medications and supplements with vitamin D. Her periods have stopped, consistent with perimenopause or menopause. She has no diagnosed medical conditions. This is her first blood test. She reports low energy and fatigue, brain fog, bloating and digestive discomfort, and joint pain and stiffness. Her goals are to balance her hormones, improve long-term health and longevity, and lose body fat. She adds that she feels tired, has crying outbursts, feels fat, and has aches and pains when she wakes up and walks down the stairs.\n\nThe single most important finding in this report is severe iron deficiency anaemia, and this must go to her GP promptly. Her haemoglobin is 92, well below the lower limit of 120 for women. Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body, and at 92 the blood is carrying roughly three quarters of the oxygen it should. Her ferritin, the protein that stores iron, is 7, below the lower limit of 10 and far below the optimal floor of 40. Her serum iron is 2.9 against a lower limit of 9, meaning there is almost no iron circulating in the blood for use. Her transferrin saturation, the percentage of her iron-transport protein that is actually loaded with iron, is 3.46% against a lower limit of 18%, which is critically low. Her total iron binding capacity is 79.5, above the upper limit of 76.1, because the body has ramped up production of the transport protein in a desperate attempt to capture whatever iron is available. This is a textbook iron deficiency picture and it explains almost every symptom she walked in with. Iron deficiency at this level causes fatigue, brain fog, aching muscles and joints, breathlessness, low mood, irritability and poor concentration. The crying outbursts, the aches walking downstairs, the low energy all day, and the brain fog she describes are all recognised consequences of tissue iron depletion at this severity. The reason the body is so depleted needs investigating: heavy or prolonged periods before they stopped, poor dietary iron intake from a convenience-based diet low in red meat and green vegetables, or less commonly a gut absorption problem. Her GP should arrange investigation into the cause and will very likely start iron replacement, possibly intravenously given how low the stores are, because oral iron at this level of depletion may not recover stores quickly enough.\n\nHer full blood count reflects the iron deficiency throughout. Her MCV, which measures the average size of each red blood cell, is 66.2 against a lower limit of 83. Iron-deficient red cells are small because there is not enough iron to build full-sized haemoglobin molecules, and this is called microcytic anaemia. Her MCH, the average weight of haemoglobin in each cell, is 21.7 against a lower limit of 27, confirming each cell is underloaded. Her haematocrit, the proportion of blood that is red cells, is 0.279 against a lower limit of 0.36, because the cells are small and poorly filled. Her RDW, which measures how much variation there is in cell size, is 19.8% against an upper limit of 14%, meaning the bone marrow is releasing a mixture of normal-sized and undersized cells as it struggles with limited iron. Her platelets are 514, above the upper limit of 410. Reactive thrombocytosis, where the platelet count rises in response to iron deficiency, is well recognised and is expected to normalise once the iron stores recover. Her reticulocyte count at 1.84% and absolute reticulocytes at 77.6 are within range, which is itself informative: in severe iron deficiency, the bone marrow cannot mount a proper reticulocyte response even though it wants to, so a count that looks normal is actually inappropriately low for the degree of anaemia. Her Mentzer index at 15.7 is well above 13, which helps confirm iron deficiency rather than a thalassaemia trait as the cause of the small cells.\n\nHer inflammatory markers are significantly raised. Her hsCRP, a marker of systemic inflammation produced by the liver, is 12.6 against an upper limit of 5 and far above the optimal ceiling of 1.0. Her ESR, the erythrocyte sedimentation rate which measures how quickly red blood cells settle in a tube and rises with inflammation, is 44 against an upper limit of 12. Both of these could be driven by the iron deficiency anaemia itself, because anaemia changes the protein composition of the blood and can raise both CRP and ESR. Her BMI of 29.2 may also contribute, as visceral fat is metabolically active and produces inflammatory signals. However, the degree of elevation, particularly the CRP at 12.6, is higher than iron deficiency and weight alone typically produce, and the GP should consider whether there is an additional inflammatory driver, particularly given her joint pain and stiffness. Her rheumatoid factor is negative at below 4, which is reassuring against rheumatoid arthritis, but a negative rheumatoid factor does not exclude all inflammatory joint conditions. Her Systemic Immune-Inflammation Index, a composite score built from neutrophils, platelets and lymphocytes, is 755 against an upper limit of 600, and her Platelet to Lymphocyte Ratio is 204, just within range but above optimal at 160. Both are being pushed up by the reactive platelet count rather than by a separate immune process, and both should settle once the iron recovers. Her IgE at 49.9, IgG at 11, IgA at 2.7 and IgM at 1.3 are all within range, and her tissue transglutaminase antibody is negative, which rules out coeliac disease as a cause of malabsorption.\n\nHer blood sugar and insulin results show a clear pre-diabetic pattern that is the second most important finding in this report. Her HbA1c, which reflects average blood sugar over the previous two to three months, is 46 mmol/mol, above the pre-diabetes threshold of 42 and approaching the diabetes threshold of 48. Her fasting glucose is 6.0, sitting right at the top of the laboratory range. Her fasting insulin is 15.33 mIU/L, within the laboratory range of 2.6 to 24.9 but well above the optimal ceiling of 8, meaning her pancreas is working hard to keep blood sugar under control. Her HOMA-IR, a calculation that estimates insulin resistance from fasting glucose and insulin, is 4.09 against an upper limit of 1.5, confirming significant insulin resistance. Her C-Peptide at 2.45 ug/L (approximately 811 pmol/L) confirms the pancreas is producing substantial insulin. Her estimated average glucose, derived from the HbA1c, is 7.5 mmol/L against an optimal ceiling of 6.2. The picture is one where the cells have become resistant to insulin's signal, so the pancreas compensates by producing more, and despite that extra effort blood sugar is still drifting above healthy levels. This is driven primarily by the convenience-based diet, the low vegetable intake, the sugary food some days, and the absence of any resistance training, which is the most powerful way to improve how muscles respond to insulin. The good news is that pre-diabetes is fully reversible with dietary change and movement, and this report will set out exactly how.\n\nHer cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 80 out of 100 against an ideal ceiling of 20. This is high, and the three markers driving it are the hsCRP at 12.6, the ApoB at 1.41 and the HbA1c at 46. Her total cholesterol is 6.1, above the desirable ceiling of 5.18. Her LDL cholesterol, the form that deposits into artery walls and drives plaque formation, is 4.17 against an upper limit of 3.0. Her ApoB, which counts the actual number of atherogenic lipoprotein particles in the blood and is a more precise measure of cardiovascular risk than LDL alone, is 1.41 against an upper limit of 0.9, which the laboratory classifies as very high. Her non-HDL cholesterol is 4.6 against an upper limit of 4.0. Her ApoB to ApoA-I ratio, which summarises the balance between harmful and protective lipoproteins, is 0.92 against an upper limit of 0.6, placing her in the higher risk category. Against this, her Lp(a), a genetically determined lipoprotein that cannot be changed by diet or exercise, is 28.22 nmol/L, safely below the 32 threshold. This is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors: diet, weight, insulin resistance and movement. Her Lp(a)-corrected LDL at 4.08 confirms that almost all of the LDL is the conventional, modifiable type. Her triglycerides at 1.08 are within range and her VLDL at 0.49 is within range, both of which are better than might be expected given the metabolic picture. Her HDL at 1.5 is reasonable, sitting just below the desirable threshold of 1.55 and above the risk threshold of 1.04. Her ApoA-I at 1.54 is just above the 1.4 floor, confirming adequate protective lipoprotein. Her TC to HDL ratio at 4.07 is within the 4.5 ceiling. Her atherogenic index of plasma at minus 0.143 is within range. Her LDL to HDL ratio at 2.78 is within the 3.5 ceiling. The lipid picture overall shows a pattern that is diet and insulin-resistance driven rather than genetic, and that is the kind that responds well to the changes outlined below.\n\nHer liver markers tell a mixed story. Her GGT at 54 is above the female upper limit of 38. GGT is an enzyme that rises with metabolic stress on the liver, alcohol, certain medications, and fatty infiltration. At 1 to 4 drinks per week, alcohol is unlikely to be the primary driver, and the more likely explanation is the insulin resistance and the convenience-based diet generating metabolic load on the liver. Her ALT at 43 is above the female optimal ceiling of 25 but within the laboratory range. Her AST at 35 is within range. Her De Ritis ratio, AST divided by ALT, is 0.81, within the normal band, and her FIB-4 score at 0.53 is well below the 1.45 threshold, confirming there is no sign of liver scarring. Her APRI at 0.17 is well within range, and her NAFLD fibrosis score at minus 4.296 is below the lower limit of minus 4, placing her firmly in the low-risk category for advanced fibrosis. Her albumin at 38 is within range, her total protein at 72 is within range, and her bilirubin at 5 is at the lower limit. Her amylase at 77 and lipase at 34 are both comfortably within range, confirming no pancreatic strain. The liver is under metabolic pressure from the insulin resistance and the diet but has not sustained any structural damage, and the GGT should come down as the metabolic picture improves.\n\nHer hormonal picture is consistent with perimenopause transitioning into menopause. Her FSH at 29.62 is above the normal follicular range and approaching the post-menopausal threshold of 23, while her LH at 32.25 is above the follicular range and within the post-menopausal range. Her oestradiol at 294 pmol/L is above the post-menopausal ceiling of 118.2, which suggests the ovaries are still producing some oestrogen intermittently, consistent with late perimenopause where hormone levels fluctuate widely. Her progesterone at 0.83 is within the post-menopausal range, consistent with absent or very infrequent ovulation. The combination of rising FSH and LH with fluctuating oestradiol and flat progesterone is the classic perimenopausal pattern, and it directly explains the crying outbursts, the mood instability, the joint stiffness, and the difficulty losing weight that she describes. Her testosterone at 0.8 nmol/L is within the female range of 0.5 to 2.6, and her free androgen index at 1.69 is within range. Her bioavailable testosterone at 0.25 nmol/L is within range. Her SHBG at 47.2 is within range. Her DHEA-S at 2.5 umol/L (approximately 921 ug/dL) is within range. Her prolactin at 143 is within the non-pregnant range. Her cortisol at 206 nmol/L is within the morning reference range. She should discuss the perimenopausal symptoms with her GP, because hormone replacement therapy may be appropriate and would address the mood changes, the joint stiffness, and the long-term bone and cardiovascular protection that oestrogen provides.\n\nHer thyroid is working well. Her TSH at 1.03, the hormone from the pituitary gland that tells the thyroid how hard to work, is within the optimal range of 1.0 to 2.5. Her free T4 at 14.9, the main hormone the thyroid produces, is within range though at the lower end of optimal. Her free T3 at 4.2, the active thyroid hormone that cells actually use, is within range but below the optimal floor of 4.5. Her FT3 to FT4 ratio at 0.282 is within range. Both thyroid antibody tests, TPO at below 6.6 and thyroglobulin at below 1.3, are clearly negative, which rules out autoimmune thyroid disease. The slightly below-optimal free T3 could be contributing a small amount to the fatigue and brain fog, but at this margin the iron deficiency is the far more likely driver, and FT3 may improve once the anaemia resolves and the body has more resources for thyroid hormone conversion.\n\nHer kidney function is adequate. Her creatinine-based eGFR is above 90, and her cystatin C, a more precise filtration marker that is not affected by muscle mass, is 1.05 against an upper limit of 1.1, giving a cystatin C eGFR of 85. The combined eGFR is 85, which is below the optimal floor of 90 and places kidney function in the mildly reduced category for a 51-year-old. This is worth noting but not alarming; the systemic inflammation from the anaemia may be mildly affecting the cystatin C, and a repeat after the iron has recovered will give a cleaner reading. Her urea at 6.1, sodium at 142, chloride at 102, bicarbonate at 24.8, and potassium at 5.1 are all within range, though the potassium at 5.1 is near the upper limit and the laboratory notes that delayed separation can raise potassium, so this is likely a sample effect rather than a true elevation. Her uric acid at 365 is within range but above the female optimal ceiling of 320 umol/L, and elevated uric acid is associated with insulin resistance, so this may improve as the metabolic picture does. Her urea to creatinine ratio at 96.8 is within range. Her corrected calcium at 2.49 is within range, her magnesium at 0.96 is within the optimal range, and her parathyroid hormone at 1.835 is within range, confirming normal calcium and mineral regulation.\n\nHer vitamin D at 114 nmol/L is within the optimal range of 75 to 120, which reflects her supplementation and is exactly where it should be. Her vitamin B12 at 334 pg/mL is within the laboratory range but below the optimal floor of 500. At this level there is enough B12 to prevent deficiency disease, but not enough for optimal nerve function, energy metabolism, and red blood cell production, and given the severity of her anaemia, optimising B12 is important to support the recovery of red cell production once iron is replaced. Her serum folate at 3 ng/mL sits right at the lower limit of the range, which is not surprising given a diet with 0 to 1 portions of vegetables and fruit a day, since folate comes almost exclusively from green leafy vegetables, beans and pulses. Like B12, folate is essential for red blood cell production, and low folate alongside severe iron deficiency can slow the recovery of the anaemia.\n\nHer urinalysis shows white blood cells above 500 per microlitre, which is significantly elevated above the threshold of 10, and red blood cells at 130 per microlitre, above the threshold of 25. Nitrites are negative. The bacterial count and culture are pending. The most likely explanation at this level of white cells is a urinary tract infection, and the culture results when they return will confirm whether bacteria are present and which antibiotic would be appropriate. She should let her GP know about these findings, and if she has any urinary symptoms such as burning, frequency or urgency, she should seek prompt review.\n\nHer cancer screening markers are all reassuring. CA-125 at 12.8 is well within range, CA 15-3 at 21.25 is within range, CA 19-9 at 9.72 is within range, and CEA at 0.9 is within the non-smoker range. Her total antioxidant activity at 1.98 is above the upper limit of 1.77, which is likely being driven by her vitamin D supplementation and is not a concern. Her creatine kinase at 59 is within range.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 67.9, about 17 years older than a calendar age of 51. The two markers most likely dragging biological age upward in her case would be the CRP at 12.6 and the RDW at 19.8, both of which should improve substantially once the iron deficiency resolves and the inflammation settles.\n\nHer free oestradiol index at 6.23 is reported for context during the perimenopausal transition and is not a standalone diagnostic marker. Her albumin-corrected anion gap at 20.3 is reported for information.\n\nTo summarise: the iron deficiency anaemia is severe and is the most urgent finding, requiring GP review for investigation of the cause and iron replacement. The pre-diabetic metabolic picture with significant insulin resistance is the second priority and is fully reversible with dietary and movement changes. The raised cholesterol and ApoB are being driven by the same metabolic pattern and will improve with the same interventions. The raised GGT reflects metabolic liver strain rather than structural damage. The perimenopausal hormone pattern explains the mood symptoms, the joint stiffness and the difficulty with weight, and hormone replacement therapy is worth discussing. The urinalysis findings need GP review. The B12 and folate are below optimal and should be supplemented to support the recovery from anaemia. The vitamin D is in an excellent place thanks to her current supplementation. There is a great deal that can be improved here, and most of it responds to the same set of changes.","links":"The central thread running through this report is iron deficiency, and it connects more findings than might be immediately obvious. The severely depleted iron stores have produced microcytic anaemia with a haemoglobin of 92, which in turn has driven the reactive thrombocytosis with platelets at 514, the markedly elevated RDW at 19.8, and the low haematocrit at 0.279. The anaemia itself is contributing to the raised ESR at 44 and may be contributing to part of the CRP elevation at 12.6, because changes in blood protein composition during anaemia accelerate red cell sedimentation and can stimulate hepatic CRP production. The iron deficiency is also the most likely single explanation for the fatigue, brain fog, morning aches and low energy that Tracey reports, because every tissue in the body is receiving less oxygen than it needs.\n\nThe second thread is metabolic. The HbA1c at 46, the fasting glucose at 6.0, the fasting insulin at 15.33, and the HOMA-IR at 4.09 form a coherent picture of significant insulin resistance progressing toward type 2 diabetes. This insulin resistance is the most likely driver of the elevated ApoB at 1.41 and LDL at 4.17, because when cells are resistant to insulin the liver overproduces VLDL particles, which are remodelled into LDL in the bloodstream. The same metabolic pattern explains the raised GGT at 54, as the liver is handling more fat and sugar than it can process efficiently. Crucially, the Lp(a) at 28.22 being normal means the entire lipid picture is modifiable through diet, weight and movement rather than being genetically fixed.\n\nThe third thread is hormonal. The FSH at 29.62 and LH at 32.25 rising while oestradiol fluctuates at 294 and progesterone sits flat at 0.83 is the signature of late perimenopause. Falling oestrogen levels during this transition drive joint stiffness, mood instability including the crying outbursts Tracey describes, disrupted sleep quality, and redistribution of body fat toward the abdomen, which in turn worsens insulin resistance. The metabolic and hormonal threads therefore reinforce each other: the perimenopause makes the insulin resistance harder to manage, and the insulin resistance makes the perimenopausal symptoms feel worse.\n\nWhat has been excluded is important. The negative thyroid antibodies and normal TSH rule out autoimmune thyroid disease as a cause of the fatigue and weight gain. The negative coeliac screen rules out gluten-driven malabsorption as the cause of the iron and folate depletion. The negative rheumatoid factor reduces the likelihood that the joint symptoms represent an inflammatory arthritis, though it does not exclude it entirely given the elevated CRP. The normal immunoglobulin levels and low IgE rule out an allergic or immune-mediated process. The clean FIB-4, APRI and NAFLD fibrosis score confirm the liver has not sustained structural damage despite the metabolic load.\n\nThe loose ends are the cause of the iron deficiency and the urinalysis. The most likely explanation for the iron depletion in a 51-year-old woman whose periods have recently stopped is prolonged heavy menstrual bleeding in the years before cessation, combined with a diet very low in iron-rich foods. However, the GP should confirm this with a clinical history and consider whether any investigation of the gut is warranted to exclude a second source of blood loss. The urinary white cells above 500 and red cells at 130 need the culture result to clarify whether this is a urinary tract infection, and that result is pending.","lifestyle":"Add a palm-sized portion of protein to every meal: eggs, chicken, tinned fish, Greek yoghurt, beans, or mince. Anchor: before anything else goes on the plate. Why: protein at every meal blunts the insulin spike behind your HOMA-IR of 4.09 and your HbA1c of 46, and supports the recovery of your haemoglobin.\nSwap one takeaway or convenience meal per week for a home-cooked meal built around protein and vegetables, and build from there. Anchor: pick the same day each week to start. Why: convenience food is typically high in refined carbohydrate and low in the iron, folate and fibre your blood is telling us you need.\nEat at least one portion of dark green leafy vegetables every day: spinach, broccoli, kale, or spring greens, cooked or raw. Anchor: add to your evening meal as a non-negotiable side. Why: your folate is at the floor of the range at 3 and your iron stores are critically low; dark greens provide both, and the vitamin C in vegetables helps iron absorption.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, which is the mechanism behind your HOMA-IR of 4.09 and your fasting glucose sitting at 6.0.\nAdd two 20-minute resistance sessions per week using bodyweight or light dumbbells. Anchor: fixed days, such as Tuesday and Saturday morning before anything else. Why: resistance training is the single most powerful way to improve how muscles respond to insulin, and building even modest muscle mass raises your basal metabolic rate, making fat loss easier and more sustainable.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking for natural light. Anchor: alarm at the same time, shoes on immediately. Why: morning light resets the cortisol rhythm that governs energy across the day, and you report being slow to get going and low energy all day, which suggests the rhythm has flattened.\nCut sugary food from some days to one day per week maximum. Anchor: a specific day you choose as your one. Why: sugar drives the insulin resistance directly, and reducing it is the fastest dietary route to bringing your HbA1c below 42.\nAim for 1,400 to 1,550 calories per day with at least 95 grams of protein. Your estimated maintenance is around 1,850 calories at your current activity, so a deficit of 300 to 400 calories per day will produce steady fat loss of roughly 0.3 to 0.5 kg per week. A target weight range of 58 to 65 kg would bring your BMI into the healthy range. Increase calories by 100 to 150 once you add the resistance sessions.","flags":"Haemoglobin 92 g/L (lower limit 120), MCV 66.2 fL (lower limit 83), MCH 21.7 pg (lower limit 27), HCT 0.279 (lower limit 0.36), RDW 19.8% (upper limit 14), platelets 514 (upper limit 410): severe microcytic iron deficiency anaemia with reactive thrombocytosis. Requires GP investigation of the cause and iron replacement, likely intravenous given the severity.\nFerritin 7 ng/mL (lower limit 10, optimal 40), serum iron 2.9 umol/L (lower limit 9), transferrin saturation 3.46% (lower limit 18), iron binding capacity 79.5 (upper limit 76.1): profoundly depleted iron stores consistent with the anaemia above.\nhsCRP 12.6 mg/L (upper limit 5), ESR 44 mm/hour (upper limit 12): significant systemic inflammation. Partly driven by the anaemia and BMI, but the degree of CRP elevation warrants GP assessment for any additional inflammatory source, particularly given joint symptoms.\nHbA1c 46 mmol/mol (pre-diabetes threshold 42, diabetes threshold 48), fasting glucose 6.0 mmol/L (top of range), fasting insulin 15.33 mIU/L (optimal ceiling 8), HOMA-IR 4.09 (upper limit 1.5): pre-diabetic pattern with significant insulin resistance. Lifestyle intervention is the first-line treatment.\nApoB 1.41 g/L (upper limit 0.9), LDL 4.17 mmol/L (upper limit 3.0), total cholesterol 6.1 (desirable below 5.18), non-HDL 4.6 (upper limit 4.0), ApoB/A-I ratio 0.92 (upper limit 0.6): elevated atherogenic lipoproteins driven by insulin resistance and diet. Lp(a) 28.22 is normal, confirming the pattern is modifiable.\nGGT 54 IU/L (female upper limit 38): raised, likely reflecting metabolic liver strain from insulin resistance rather than alcohol. FIB-4 0.53, APRI 0.17 and NAFLD fibrosis score minus 4.296 confirm no fibrotic change.\nFSH 29.62, LH 32.25, oestradiol 294, progesterone 0.83: perimenopausal hormonal pattern consistent with cessation of periods. Relevant to mood symptoms, joint stiffness and metabolic changes.\nUrine WBC above 500 (significant above 10), urine RBC 130 (significant above 25): likely urinary tract infection; bacterial culture pending.\nSerum folate 3 ng/mL (lower limit 3): at the floor of the range, insufficient to support red cell recovery.\nVitamin B12 334 pg/mL (optimal floor 500): below optimal, supplementation advised to support anaemia recovery.\nCardiovascular Risk Score 80/100 (ideal below 20): high, driven by CRP 12.6, ApoB 1.41 and HbA1c 46.\nReassuring negatives: Lp(a) 28.22 (below 32, confirming modifiable lipid risk), thyroid function normal with TSH 1.03 and negative antibodies, coeliac screen negative, rheumatoid factor negative, cancer markers CA-125 12.8, CA 15-3 21.25, CA 19-9 9.72 and CEA 0.9 all within range, immunoglobulins normal, liver fibrosis scores all low risk, kidney function adequate with combined eGFR 85.","recommendations":"GP appointment to investigate the cause of severe iron deficiency anaemia (haemoglobin 92, ferritin 7, transferrin saturation 3.46%). Take this report. The GP will need to establish whether heavy menstrual bleeding before periods stopped is the full explanation or whether gut investigation is needed. Iron replacement, potentially intravenous, should be discussed.\nDiscuss the pre-diabetic HbA1c of 46 mmol/mol and HOMA-IR of 4.09 with the GP. The lifestyle changes in this report are first-line treatment, and the GP may wish to monitor with a repeat HbA1c in three to four months.\nDiscuss the elevated ApoB of 1.41 and LDL of 4.17 with the GP in the context of the cardiovascular risk score of 80. Lifestyle modification is the starting point given the Lp(a) is normal, but the GP may consider lipid-lowering medication if the numbers do not respond to dietary change within six months.\nReport the hsCRP of 12.6 and ESR of 44 to the GP. Much of this is likely driven by the anaemia, but given the joint pain and stiffness, the GP should assess whether any additional investigation is warranted once the anaemia has been treated.\nDiscuss perimenopausal symptoms with the GP: the crying outbursts, joint stiffness, fatigue and mood changes, with FSH 29.62, LH 32.25 and fluctuating oestradiol at 294. Hormone replacement therapy may be appropriate and would address symptoms as well as long-term bone and cardiovascular protection.\nChase the urine culture result. If bacteria are confirmed, antibiotic treatment may be needed. If the result is negative, the raised WBC and RBC may warrant a repeat clean-catch sample.\nRetest in four months with: full blood count, ferritin, serum iron, transferrin saturation, HbA1c, fasting insulin, HOMA-IR, lipid panel with ApoB, hsCRP, GGT, folate, B12, and kidney function including cystatin C. Target: haemoglobin above 120, ferritin above 50, HbA1c below 42, HOMA-IR below 2.0, ApoB below 1.0, CRP below 5.\nCalorie target: 1,400 to 1,550 kcal per day. Protein target: at least 95 grams per day (1.3 g per kg). Weight target range: 58 to 65 kg. These are the foundations that will move every metabolic marker in this report.","supplementation":"Iron: your GP will prescribe iron replacement, likely intravenously given the severity of the deficiency (ferritin 7, haemoglobin 92). Do not self-supplement with iron until you have seen the GP, because the cause of the deficiency needs to be established first and the dose will depend on the route they choose. If oral iron is prescribed, take it with vitamin C (a glass of orange juice or 500 mg ascorbic acid) on an empty stomach, separated from tea, coffee and dairy by at least two hours.\nFolate: methylfolate (5-MTHF), 400 to 800 mcg daily with food. Why: your serum folate is at the floor of the range at 3 ng/mL, and folate is essential for red blood cell production alongside iron. The methylfolate form is better absorbed than folic acid.\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 334 is below the optimal floor of 500, and B12 works alongside folate and iron to produce healthy red blood cells. Sublingual delivery bypasses any gut absorption issues.\nVitamin D3: continue your current supplementation. Your level at 114 nmol/L is within the optimal range of 75 to 120. A maintenance dose of 2,000 IU daily with a fat-containing meal is appropriate. If you are taking more than this, you could reduce to 2,000 IU.\nVitamin K2: MK-7 form, 100 mcg daily, taken with your vitamin D. Why: K2 directs calcium into bone rather than soft tissue, and is a recommended companion to vitamin D supplementation, particularly during the menopausal transition when bone density is declining.\nMagnesium: magnesium glycinate, 300 to 400 mg before bed. Why: your magnesium at 0.96 is within range but glycinate specifically supports sleep quality, which you report as poor, and may help with the muscle aches and joint stiffness.\nOmega-3: fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 supports the reduction of inflammation (CRP 12.6), improves insulin sensitivity (HOMA-IR 4.09), and supports cardiovascular health alongside the dietary changes for your ApoB of 1.41.\nDo not take vitamin C supplements above 500 mg per day as they can interfere with HbA1c measurement. A small dose alongside iron is fine.\nThe most important changes from this report are not supplements. They are getting the iron deficiency investigated and treated by the GP, adding protein and vegetables to every meal, cutting back on sugary and convenience food, and starting resistance training twice a week. Those four changes will move the HbA1c, the insulin resistance, the cholesterol, the GGT and the weight more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 40 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Needs medical attention. Raw 40. Weakest systems: urinalysis 0%, inflammation 5%, hematology 9%. Biggest drags: Haemoglobin, Platelets, Transferrin Saturation, High-Sensitivity CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"67.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6063","lower_normal":"","upper_normal":"56","lower_optimal":"","upper_optimal":"51","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4554","units":"years","description":"PhenoAge is calculated from your measured results. It sits outside the ideal range. It is being driven by High-Sensitivity CRP, which sits outside the ideal range.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, so it measures the risk being built rather than the ten-year event probability. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. Tracey's score at 80 is high, driven primarily by the hsCRP at 12.6, the ApoB at 1.41, and the HbA1c at 46. The encouraging part is that all three drivers are modifiable: the CRP should fall once the anaemia and inflammation resolve, the ApoB will respond to dietary change and weight loss, and the HbA1c will respond to the metabolic interventions. This score has significant room to improve.","low_causes":"Optimal lipids, low inflammation, good blood sugar control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Tracey's result at 6.0 sits right at the top of the laboratory range, and above the optimal ceiling of 5.4. Combined with her elevated HbA1c and insulin, this confirms her blood sugar regulation is under strain. Dietary changes, particularly reducing refined carbohydrate and sugary food, alongside post-meal walking and resistance training, are the most effective ways to bring this down.","low_causes":"Fasting, excessive insulin production, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar over the past two to three months. Tracey's result at 6.4% falls in the pre-diabetes range (6.0 to 6.4%). This means blood sugar has been consistently above optimal for several months. It is important to note that iron deficiency anaemia can sometimes falsely elevate HbA1c because the red cells live longer when production is impaired, giving glucose more time to attach. However, the elevated fasting insulin and HOMA-IR confirm genuine insulin resistance, so the HbA1c is reflecting a real metabolic problem even if the exact number may be slightly overstated by the anaemia.","low_causes":"Iron deficiency (can falsely lower), increased red cell turnover, blood loss","high_causes":"Pre-diabetes, type 2 diabetes, high carbohydrate diet, insulin resistance, iron deficiency anaemia (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7619","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units. Tracey's result at 46 mmol/mol is above the pre-diabetes threshold of 42 and approaching the diabetes threshold of 48. The optimal target is below 36. This result needs to be discussed with the GP and retested in three to four months after dietary changes have been implemented.","low_causes":"Increased red cell turnover, haemolytic anaemia","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"15.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5244","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3244","upper_optimal_position":"0.4133","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar controlled. Tracey's result at 15.33 is within the laboratory range but nearly double the optimal ceiling of 8. This means her pancreas is working very hard to keep glucose under control, and the cells in her muscles, liver and fat tissue are not responding to insulin as they should. This level of hyperinsulinaemia drives fat storage, raises cholesterol production, and makes weight loss difficult. Reducing refined carbohydrate, adding protein to meals, and starting resistance training are the most effective ways to lower fasting insulin.","low_causes":"Low carbohydrate diet, high insulin sensitivity, fasting","high_causes":"Insulin resistance, pre-diabetes, high carbohydrate diet, excess body fat, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4697","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4242","units":"ug/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, so it provides a reliable measure of how much insulin the body is actually producing. Tracey's result at 2.45 ug/L (approximately 811 pmol/L) is within the laboratory range but above the optimal ceiling, confirming the pancreas is producing more insulin than ideal. This is consistent with the elevated fasting insulin and HOMA-IR, and confirms the insulin resistance pattern.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"7.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and gives an approximation of what blood sugar has averaged over the past two to three months. Tracey's result at 7.5 mmol/L is above the upper limit of 7 and the optimal ceiling of 6.2, consistent with the pre-diabetic HbA1c. This number makes it tangible: her blood sugar has been averaging around 7.5, when the ideal is below 6.2. The dietary and exercise changes outlined in this report are aimed at bringing this down.","low_causes":"Excellent blood sugar control, low carbohydrate diet","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4858","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Blood Glucose, which sits outside the ideal range.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. Tracey's result at 92 is significantly below the lower limit of 120 for women, confirming moderate to severe anaemia. At this level, every tissue in the body is receiving less oxygen than it needs, which directly explains her fatigue, brain fog, breathlessness, aches and low energy. This needs prompt GP investigation and iron replacement.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4733","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Tracey's count at 4.22 is within range, which may seem surprising given the severe anaemia. However, in iron deficiency the body can maintain a near-normal number of red cells while each individual cell is smaller and carries less haemoglobin. This is why her haemoglobin is so low despite a normal cell count.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.279","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0600","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. Tracey's result at 0.279 is well below the lower limit of 0.36, consistent with the small, iron-depleted red cells reducing the total packed cell volume. This will normalise as the iron deficiency is treated and the red cells return to their proper size.","low_causes":"Iron deficiency anaemia, blood loss, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"19.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9500","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"%","description":"RDW measures the variation in size between the largest and smallest red blood cells. A high RDW means the bone marrow is producing cells of very different sizes, which is a hallmark of iron deficiency anaemia as the marrow alternates between making normal cells and small iron-depleted cells. Tracey's result at 19.8 is markedly elevated above the upper limit of 14, consistent with the severe iron deficiency picture. This should normalise as iron stores recover.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"66.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0222","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of each red blood cell. Tracey's result at 66.2 is well below the lower limit of 83, confirming microcytic (small cell) anaemia. The most common cause of microcytic anaemia in a woman of this age is iron deficiency, which is confirmed by her critically low iron stores. The cells are small because there is not enough iron to build full-sized haemoglobin molecules inside them.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism, alcohol, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"21.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0267","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average weight of haemoglobin inside each red blood cell. Tracey's result at 21.7 is well below the lower limit of 27, confirming that each red cell is carrying much less haemoglobin than it should. This is a direct consequence of the severe iron deficiency and will recover as iron is replaced.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"328","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4778","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the concentration of haemoglobin within the red cells. Tracey's result at 328 is within the optimal range. In iron deficiency, MCHC can sometimes fall, but here it is maintained, meaning the haemoglobin that is present is properly concentrated within each cell, even though the cells themselves are small and carrying less total haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, dehydration of red cells","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"514","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8077","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6282","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot. Tracey's count at 514 is above the upper limit of 410. This is a reactive thrombocytosis, meaning the platelet count has risen in response to the severe iron deficiency anaemia. The bone marrow overproduces platelets when it is struggling with iron-deficient red cell production. This is expected to normalise as iron stores recover and does not require separate treatment.","low_causes":"Viral infections, bone marrow disorders, certain medications, B12 or folate deficiency","high_causes":"Iron deficiency (reactive), infection, inflammation, post-surgery, essential thrombocythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"7.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV measures the average size of platelets. Tracey's result at 7.7 is within the optimal range. In reactive thrombocytosis from iron deficiency, MPV is often normal or slightly low, which is consistent with her picture and confirms the elevated platelet count is reactive rather than a primary bone marrow problem.","low_causes":"Inflammatory conditions, reactive thrombocytosis","high_causes":"Immune thrombocytopenia, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4953","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells circulating in the blood. Tracey's result at 6.92 is within the optimal range, indicating her immune system is functioning normally and there is no sign of infection or suppression in the blood.","low_causes":"Viral infection, bone marrow suppression, autoimmune conditions, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. Tracey's count at 3.7 is within the optimal range, which is reassuring.","low_causes":"Viral infections, certain medications, autoimmune conditions, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including fighting viruses and producing antibodies. Tracey's count at 2.52 is within the optimal range, confirming a healthy immune response.","low_causes":"Viral infection, steroid use, autoimmune conditions, low energy availability","high_causes":"Viral infection, chronic lymphocytic leukaemia, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf bacteria and dead cells and help coordinate the immune response. Tracey's count at 0.42 is within the optimal range.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic inflammation, infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4931","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5903","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and fighting parasites. Tracey's count at 0.25 is within the optimal range, with no sign of allergic activation.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infections, eczema","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the least common white blood cells and play a role in allergic and inflammatory responses. Tracey's count at 0.03 is within the optimal range.","low_causes":"Steroid use, acute allergic reaction","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"%","description":"Reticulocytes are young, newly released red blood cells. The percentage measures what proportion of the total red cells are new. Tracey's result at 1.84% appears normal, but in the context of severe anaemia this is actually an inappropriately low response. When the body is significantly anaemic, the bone marrow should be releasing reticulocytes at a much higher rate to compensate. The fact that it is not confirms the marrow is constrained by the lack of iron.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression","high_causes":"Recovery from anaemia, blood loss, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"77.648","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5183","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells per litre of blood. At 77.6 this is within range but, as with the percentage, the bone marrow should be producing more in the face of a haemoglobin of 92. Once iron replacement begins, an increase in reticulocyte count within 7 to 10 days is the first sign that the treatment is working.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression","high_causes":"Recovery from anaemia, haemolysis, blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"15.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3438","lower_normal":"13","upper_normal":"99","lower_optimal":"13","upper_optimal":"99","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"index","description":"The Mentzer index divides MCV by RBC count and helps distinguish between iron deficiency anaemia and thalassaemia trait. A value above 13 favours iron deficiency, while below 13 suggests thalassaemia. Tracey's index at 15.7 is above 13, confirming iron deficiency as the cause of her microcytic anaemia rather than thalassaemia trait.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.57","within_normal":"FALSE"," ","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3190","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in certain foods and produced by the body. Tracey's result at 365 is within the laboratory range but above the optimal ceiling of 320 for women. Elevated uric acid is closely associated with insulin resistance and metabolic syndrome, and improving insulin sensitivity through dietary change and movement should bring this marker down alongside the other metabolic improvements.","low_causes":"Low purine diet, certain medications","high_causes":"Insulin resistance, high purine diet, kidney impairment, gout, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This is the eGFR calculated from cystatin C rather than creatinine. At 85 it is mildly below the optimal floor of 90 but above the lower limit of 60. Cystatin C can be mildly elevated by systemic inflammation, and the CRP of 12.6 and ESR of 44 may be contributing. A repeat once the anaemia and inflammation have resolved will give a more accurate reading.","low_causes":"Kidney disease, inflammation, dehydration","high_causes":"Corticosteroid use (can lower cystatin C, raising calculated eGFR)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_p ion of a healthy PTH, good vitamin D and normal corrected calcium is reassuring for bone health.","low_causes":"Hypoparathyroidism, high calcium, excessive vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"334","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4512","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5289","upper_optimal_position":"0.6375","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Tracey's result at 334 is within the laboratory range but below the optimal floor of 500. At this level there is enough to prevent overt deficiency but not enough for optimal function. Given her severe iron deficiency anaemia, optimising B12 is important because B12 works alongside iron and folate in red blood cell production. Sublingual methylcobalamin at 1,000 mcg daily is recommended.","low_causes":"Poor dietary intake, vegetarian/vegan diet, malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for red blood cell production, DNA synthesis and cell division. Tracey's result at 3 sits right at the lower limit of the on":"Triglycerides are fats carried in the blood, primarily reflecting recent carbohydrate and fat intake. Tracey's result at 1.08 is within the laboratory range but above the optimal ceiling of 1.0. Given the degree of insulin resistance, the triglycerides are relatively well controlled, which is a positive sign. Reducing refined carbohydrate and sugary food should bring this below 1.0.","low_causes":"Low fat/carbohydrate diet, hyperthyroidism, malnutrition","high_causes":"High carbohydrate diet, insulin resistance, alcohol, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3141","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. Tracey's result at 0.49 is within the optimal range, consistent with the relatively controlled triglycerides.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"Insulin resistance, high carbohydrate diet, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. Tracey's result at 1.5 is above the risk threshold of 1.04 but below the desirable level of 1.55 and below the female optimal floor of 1.6. Increasing physical activity, particularly adding resistance training, is the most effective way to raise HDL. Weight loss and omega-3 supplementation can also help.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6957","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL cholesterol is the form that deposits into artery walls, forming plaques that can narrow arteries and eventually cause heart attacks or strokes. Tracey's result at 4.17 is well above the upper limit of 3.0 and the optimal ceiling of 2.6. Given the normal Lp(a), this elevation is driven entirely by modifiable factors: the insulin resistance, the dietary pattern, and the lack of physical activity. Reducing saturated fat, increasing soluble fibre (oats, beans, lentils), oily fish twice a week, and the metabolic improvements from exercise and weight loss should all contribute to lowering LDL.","low_causes":"Hyperthyroidism, malnutrition, very low fat diet","high_causes":"Diet high in saturated fat, insulin resistance, hypothyroidism, genetic factors, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.07","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4522","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position": poB.","low_causes":"Low LDL, low triglycerides","high_causes":"High LDL, high triglycerides, insulin resistance, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.55","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA-I is the main protein on HDL particles and a marker of protective lipoprotein function. Tracey's result at 1.54 is above the 1.4 floor and within the optimal range. This is a genuine positive and shows that her body is producing adequate protective lipoproteins.","low_causes":"Low HDL, sedentary lifestyle, smoking, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein on every LDL, VLDL and Lp(a) particle, so it effectively counts the total number of atherogenic (artery-damaging) particles in the blood. It is a more precise measure of cardiovascular risk than LDL cholesterol alone. Tracey's result at 1.41 is well above the upper limit of 0.9 and the laboratory classifies it as very high. Each ApoB particle can penetrate the artery wall and start plaque formation. Reducing this to below 0.9, and ideally below 0.8, through dietary change, weight loss and improved insulin sensitivity is a key goal.","low_causes":"Low LDL, hyperthyroidism, malnutrition","high_causes":"High LDL, insulin resistance, diet high in saturated fat, genetic factors, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA-I ratio is one of the best single markers of cardiovascular risk, summarising the balance between harmful and protective lipoproteins. Below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Tracey's ratio at 0.92 falls in the higher risk category. The high ApoB is the numerator driving this; her ApoA-I at 1.54 is healthy. Bringing the ApoB down will shift this ratio significantly.","low_causes":"Low ApoB, high ApoA-I, healthy lipid metabolism","high_causes":"High ApoB, low ApoA-I, insulin resistance, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"28.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined variant of LDL that cannot be changed by diet, exercise or medication. It is measured once because the level is fixed for life and should be recorded permanently. Tracey's result at 28.22 is below the 32 nmol/L threshold, which is genuinely useful information because it confirms that her elevated LDL and ApoB are driven entirely by modifiable factors: diet, weight, insulin resistance and activity. This means the lipid picture has the best possible chance of responding to lifestyle change.","low_causes":"Genetic (fixed for life)","high_causes":"Genetic (fixed for life)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6095","units":"U/L","description":"CK is an enzyme released when muscle cells are damaged or stressed. It rises after heavy exercise, injury or in muscle disorders. Tracey's result at 59 is within the optimal range, confirming no muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin use, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4351","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5849","units":"pmol/L","description":"Free T4 is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in the tissues. Tracey's result at 14.9 is within the optimal range, though at the lower end. Combined with a healthy TSH, this indicates the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3713","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4393","upper_optimal_position":"0.4747","units":"mIU/L","description":"TSH is a hormone released by the pituitary gland that tells the thyroid how hard to work. A high TSH means the thyroid is struggling and needs more stimulation; a low TSH means the thyroid is overactive. Tracey's result at 1.03 is within the optimal range of 1.0 to 2.5, indicating the pituitary is happy with the thyroid's output.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroid inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the most active thyroid hormone, responsible for driving energy production, metabolism and body temperature at the cellular level. Tracey's result at 4.2 is within the laboratory range but below the optimal floor of 4.5. A slightly below-optimal T3 can contribute to fatigue and sluggish metabolism, but at this margin the severe iron deficiency is the far more significant factor. T3 conversion requires adequate iron, selenium and zinc, and the iron deficiency itself may be mildly suppressing the conversion from T4 to T3. This should be retested after iron recovery.","low_causes":"Non-thyroidal illness (sick euthyroid), calorie restriction, iron deficiency, chronic stress","high_causes":"Hyperthyroidism, excessive T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced when the immune system mistakenly attacks the thyroid gland, as happens in Hashimoto's thyroiditis. Tracey's result at below 6.6 is clearly negative, ruling out autoimmune thyroid disease.","low_causes":"Normal immune function","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target a protein used in thyroid hormone production. Tracey's result at below 1.3 is clearly negative, which alongside the negative TPO antibodies provides strong evidence against autoimmune thyroid disease.","low_causes":"Normal immune function","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.282","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4427","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio indicates how efficiently the body is converting the inactive thyroid hormone T4 into the active form T3. Tracey's ratio at 0.282 is within the optimal range, suggesting adequate conversion despite the FT3 being slightly below optimal. The iron deficiency may be mildly impairing conversion, and this should improve as iron stores recover.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"9.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1314","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker associated with pancreatic and gastrointestinal cancers. Tracey's result at 9.72 is well within range, which is reassuring.","low_causes":"","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1957","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA is a tumour marker that can be elevated in colorectal, lung and other cancers, as well as in smokers and some benign conditions. Tracey's result at 0.9 is well within the non-smoker range, which is reassuring.","low_causes":"","high_causes":
