const REPORT_DATA = {"patient_name":"Tracey Parish","dob":"05/10/1974","report_date":"2026-09-26","summary":"Patient is a 52-year-old female presenting with a BMI of 29.2, following a takeaway and convenience-based diet, eating 0 to 1 portions of vegetables and fruit a day with ultra-processed food weekly and sugary food some days; portions are slightly below average (volume 4 out of 10). She does no structured cardio or resistance training, with 7,500 to 10,000 daily steps. She sleeps 6 to 7 hours and is slow to get going on waking, with energy low all day. Stress rarely feels hard to manage. She drinks 1 to 4 alcoholic drinks a week. She supplements vitamin D. Her periods have stopped, consistent with perimenopause or menopause. She has no diagnosed conditions and takes no medications. She reports low energy and fatigue, brain fog, bloating and digestive discomfort, and joint pain and stiffness, and adds that she feels tired, has crying outbursts, feels fat, and has aches and pains when she wakes up and walks down the stairs. Her goals are to balance her hormones, improve long-term health and longevity, and lose body fat. This is her first blood test.\n\nThis is a report with several findings that need her GP's attention, and the most important of them is a significant iron deficiency anaemia that explains a large part of how she feels every day. Her haemoglobin is 92, well below the lower limit of 120 for women, meaning her blood is carrying substantially less oxygen than it should. Her ferritin, which is the body's stored iron, is just 7, below the lower limit of 10 and far below the optimal floor of 40. Her serum iron is 2.9 against a lower limit of 9, her transferrin saturation is 3.46% against a lower limit of 18%, and her total iron binding capacity is 79.5, above the upper limit of 76.1, which is the body's way of reaching for every molecule of iron it can find because there is so little available. Her MCV, the size of each red blood cell, is 66.2 against a lower limit of 83, and her MCH, the amount of haemoglobin packed into each cell, is 21.7 against a lower limit of 27. Both are classic signatures of iron deficiency: when there is not enough iron to build haemoglobin, the bone marrow produces smaller, paler red cells. Her RDW, which measures how much variation there is in the size of those red cells, is 19.8% against an upper limit of 14%, confirming the marrow is struggling to produce cells of a consistent size. Her platelets are 514, above the upper limit of 410, and reactive thrombocytosis, where the platelet count rises in response to iron deficiency, is a well-recognised pattern. Her ESR, the erythrocyte sedimentation rate, which measures how quickly red cells settle in a tube and acts as a broad marker of inflammation, is 44 against an upper limit of 12. While part of that is driven by the anaemia itself, because smaller cells settle differently, and part by her raised CRP, it is high enough that her GP should see it alongside everything else. The Mentzer Index, a simple ratio of MCV to red cell count, is 15.7; a value above 13 points towards iron deficiency rather than a genetic cause of small red cells such as thalassaemia trait, and this is consistent with the iron studies. Her GP needs to investigate the cause of the iron deficiency, which at 52 with periods that have stopped could include gastrointestinal blood loss, absorption problems, or simply years of inadequate dietary iron compounded by a diet very low in vegetables, fruit and quality protein. She will almost certainly need prescribed iron replacement, and her GP may want to check for coeliac disease with a blood test and consider whether any further investigation of the gut is warranted.\n\nHer hs-CRP, a sensitive marker of systemic inflammation, is 12.6, well above the upper limit of 5 and far above the optimal ceiling of 1.0. At this level it is not a cardiovascular risk marker in the usual sense; it is telling us there is active inflammation somewhere in the body. The iron deficiency anaemia itself, being overweight at a BMI of 29.2, the joint pain she describes, and the possibility of an undiagnosed inflammatory or autoimmune process could all contribute. Her rheumatoid factor is reassuringly below 4, which makes rheumatoid arthritis less likely as the explanation for her joint stiffness, but a CRP this high deserves a GP conversation to look for other causes. The Systemic Immune-Inflammation Index, which combines neutrophils, platelets and lymphocytes into a single number, is 755 against an upper limit of 600, consistent with the inflammatory signal from the CRP. Her Platelet-to-Lymphocyte Ratio is 204, at the top of the reference range, again reflecting the reactive platelet count.\n\nHer blood sugar picture is the second major finding. Her HbA1c, which reflects average blood sugar over the past two to three months, is 46 mmol/mol, above the pre-diabetes threshold of 42 and just below the diabetes threshold of 48. Her fasting glucose is 6.0, sitting exactly on the upper limit of the reference range. Her fasting insulin is 15.33, and her HOMA-IR, which is calculated from glucose and insulin and measures how hard the body has to work to keep blood sugar controlled, is 4.09 against an upper limit of 1.5, indicating significant insulin resistance. In plain terms, her pancreas is producing more than twice the ideal amount of insulin to keep her blood sugar from rising further, and it is not quite keeping up. The estimated average glucose derived from her HbA1c is 7.5 mmol/L, above the upper limit of 7. The TyG Index, another measure of metabolic health built from triglycerides and glucose, is 8.55, just above its optimal ceiling of 8.5. This is a pattern that responds very well to dietary change, and the changes do not need to be dramatic: reducing sugary food, swapping ultra-processed convenience meals for whole foods with protein and fibre, and adding a walk after meals can move these numbers meaningfully within three to six months. Her GP should be aware of the HbA1c and may want to repeat it in three months alongside a fasting glucose to track the trajectory.\n\nHer PhenoAge, a composite biological age score built from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 67.6 against her calendar age of 52, a gap of nearly 16 years. This is not a diagnosis, but it reflects the cumulative burden of the anaemia, the inflammation, the blood sugar dysregulation and the metabolic strain her body is under. The good news is that every marker driving that gap is modifiable: correcting the iron deficiency, bringing the CRP down, and improving the blood sugar will all pull PhenoAge back towards her true age. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 80 out of 100 against a target of below 40 and an ideal of below 20. The two biggest drivers are the CRP at 12.6 and the HbA1c at 46, followed by the elevated ApoB and LDL. Once the inflammation is addressed and the blood sugar improves, this score should fall substantially even before the lipids change.\n\nHer lipid profile shows elevated LDL cholesterol at 4.17 against an upper limit of 3.0, elevated ApoB at 1.41 against a target of below 0.9, and a total cholesterol of 6.1. ApoB is a direct count of the number of atherogenic particles in the blood, each one capable of depositing cholesterol in artery walls, and at 1.41 it is well above the desirable threshold. Her non-HDL cholesterol is 4.6 against a target of below 4. Her ApoB-to-ApoA1 ratio is 0.92, above the higher-risk threshold of 0.8 for women, meaning the balance between harmful and protective particles is tipped the wrong way. Her Lp(a)-corrected LDL is 4.08, very close to her measured LDL, which tells us that her Lp(a), a genetically determined and unchangeable particle, is not contributing meaningfully to the LDL total; this is confirmed by her Lp(a) of 28.22, comfortably below the 32 nmol/L ideal threshold. That is genuinely useful information: it means her elevated LDL and ApoB are driven entirely by modifiable factors, principally diet, weight, insulin resistance and inflammation. Her HDL is 1.5, just below the desirable threshold of 1.6 but within the laboratory range, and her triglycerides are 1.08, well within the healthy range. The Atherogenic Index of Plasma is -0.143, within the optimal range, and the Castelli II ratio (LDL to HDL) is 2.78, within range but above the optimal ceiling of 2.5. The triglyceride picture and Lp(a) are both in her favour, and the LDL and ApoB are the targets for dietary change.\n\nHer hormone picture is consistent with perimenopause or early menopause. Her FSH is 29.62 and LH is 32.25, both in the range between late follicular or perimenopausal and fully postmenopausal levels. Her oestradiol is 294, which is above the postmenopausal ceiling of 118.2 and within the follicular range, suggesting her ovaries are still producing oestrogen intermittently, which is typical of the perimenopausal transition and may explain the crying outbursts and mood swings she describes. Progesterone is 0.83, within the postmenopausal range and below the level that would indicate regular ovulation. Her testosterone is 0.8, within range for women, and her free androgen index is 1.69, also within range. Bioavailable testosterone is 0.25, within the normal range. SHBG is 47.2, well within range. DHEA-S is 2.5 umol/L, within the wide reference range. Cortisol is 206, within the morning reference range. Prolactin is 143, within the nonpregnant range. Her GP or a menopause specialist would be the right person to discuss whether hormone replacement therapy might help with her symptoms of fatigue, mood instability, joint stiffness and brain fog, particularly given that her oestradiol is still fluctuating rather than consistently low.\n\nHer folate is 3, sitting exactly on the lower limit of the reference range and below the optimal floor of 8. Low folate contributes to the anaemia picture and is consistent with a diet very low in vegetables and fruit. She should discuss this with her GP alongside the iron deficiency, as folate supplementation may be appropriate while the diet improves.\n\nHer vitamin B12 is 334, within the laboratory range but below the optimal floor of 500. At this level it is unlikely to be causing symptoms on its own, but bringing it into the optimal range with sublingual methylcobalamin would support red cell production alongside the iron and folate correction.\n\nHer liver markers tell a mixed story. GGT is 54, above the upper limit of 38 for women, and ALT is 43, within the laboratory range but above the optimal ceiling of 25 for women. AST is 35, within range, and the De Ritis ratio (AST to ALT) is 0.81, within the optimal band. ALP is 104, within range. Bilirubin is 5, at the lower limit of the reference range. The FIB-4 score, which estimates liver scarring from age, AST, ALT and platelets, is 0.53, well within the safe range, and the APRI score is 0.17, also reassuring. The NAFLD Fibrosis Score is -4.259, within the optimal range. So while there is no sign of liver scarring or serious liver disease, the raised GGT and above-optimal ALT suggest the liver is under some metabolic strain, most likely from the combination of insulin resistance, the convenience-based diet, and being overweight. These markers typically improve with the same dietary changes that will improve the blood sugar.\n\nHer urine sample showed greater than 500 white blood cells per microlitre, which is significantly above the threshold of 10, and 130 red blood cells per microlitre, above the threshold of 25. However, the nitrites were negative and the culture returned mixed growth with probable contamination. The laboratory has reported this as likely contamination rather than a true infection, and the results should be interpreted in that context. If she has any urinary symptoms such as burning, frequency, urgency or lower abdominal pain, a repeat clean-catch midstream sample would be worthwhile. If she has no symptoms, the most likely explanation is sample contamination and no action is needed.\n\nHer kidney function is sound. Cystatin C is 1.05, within range, giving a Cystatin C eGFR of 85 and a combined eGFR of 85. These are within the laboratory range but just below the optimal floor of 90, which at 52 with a BMI of 29.2 is worth monitoring but not a concern. Urea, creatinine, sodium, chloride, bicarbonate and the urea-to-creatinine ratio are all within range. Uric acid is 365, within range. Serum osmolality is 296.1, marginally above the upper limit of 295, which at this margin is clinically insignificant and may simply reflect mild dehydration at the time of the blood draw. Potassium is 5.1, within range but towards the upper end; this is worth a routine repeat with her GP if they would like to confirm it. The albumin-corrected anion gap is 20.3, reported for context.\n\nHer thyroid is working well. TSH is 1.03, within the optimal range of 1.0 to 2.5, meaning the pituitary is not having to push the thyroid hard. Free T4 is 14.9, within the laboratory range though towards the lower end, and free T3 is 4.2, within range but below the optimal floor of 4.5. The FT3-to-FT4 ratio is 0.282, within the optimal band, suggesting conversion from T4 to the active T3 form is adequate. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. The mildly below-optimal FT3 is worth noting because T3 is the metabolically active thyroid hormone and influences energy, mood and metabolic rate, but with a TSH this well controlled and negative antibodies, this is not driving her symptoms.\n\nHer calcium and parathyroid hormone are both within range: corrected calcium 2.49 and PTH 1.835. Magnesium is 0.96, within the optimal range. Vitamin D is 114, within the optimal range of 75 to 120, which shows her supplementation is working well.\n\nHer immune markers are reassuring. IgG, IgM, IgA and IgE are all within range. Rheumatoid factor is below 4, negative. Tissue transglutaminase IgA is negative, which rules out coeliac disease as a cause of the iron malabsorption on a gluten-containing diet, though her GP may want to confirm IgA levels are adequate for this test to be reliable, which they are: her IgA is 2.7. Her white cell count, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within range, and her NLR (neutrophil-to-lymphocyte ratio) is within the optimal band. Reticulocytes are 1.84%, within range, and absolute reticulocytes are 77.6, within range, suggesting the bone marrow is responding appropriately to the degree of anaemia it can with the iron available to it.\n\nHer total antioxidant activity is 1.98, above the upper limit of 1.77, which is likely driven by her vitamin D supplementation and is not a concern. Creatine kinase is 59, well within range, indicating no muscle damage. The tumour markers CA125, CA15-3, CA19-9 and CEA are all within their reference ranges, which is reassuring.\n\nHer MCHC is 328, within range. Her MPV is 7.7, within range. Her red blood cell count is 4.22, within range despite the anaemia, because the body is maintaining cell numbers while producing smaller, iron-depleted cells. Albumin is 38, within range but below optimal, which may reflect the inflammatory state (albumin falls as a negative acute-phase protein when inflammation is present). Total protein and globulin are within range. The A/G ratio is 1.12, within range. Amylase and lipase are both within range, and her VLDL is 0.49, within range.\n\nThe free oestradiol index is 6.23, reported for context given her perimenopausal status. The glucose-corrected sodium is 142, confirming sodium is unaffected by the borderline glucose.","links":"The central story in this report is iron deficiency anaemia driving a cascade of abnormalities that, taken together, explain the majority of how this patient feels. Her ferritin at 7, serum iron at 2.9, and transferrin saturation at just 3.46% mean her body has virtually no iron stores and very little circulating iron to work with. The bone marrow responds by producing small, pale red cells (MCV 66.2, MCH 21.7) with wide variation in size (RDW 19.8%), and the haemoglobin falls to 92 because there simply is not enough iron to build it. The reactive thrombocytosis, with platelets at 514, is the bone marrow's compensatory response to iron deficiency. The raised ESR at 44 is partly a consequence of the anaemia itself and partly of the systemic inflammation shown by the CRP. Every symptom she reports, the crushing fatigue, the brain fog, the aches and stiffness on waking, and the low energy all day, has iron deficiency anaemia as a plausible and likely contributor. Iron carries oxygen to every tissue, and at a haemoglobin of 92 her muscles, brain, joints and immune system are all running on a reduced oxygen supply.\n\nThe second thread is metabolic: insulin resistance and early blood sugar dysregulation. Her HbA1c at 46 places her in the pre-diabetic range, her fasting glucose is at the top of normal, and her HOMA-IR at 4.09 confirms significant insulin resistance. This is connected to her weight (BMI 29.2), her convenience-based diet with minimal vegetables and regular sugary food, and the absence of any resistance training. Insulin resistance also drives the liver enzyme pattern: GGT at 54 and ALT at 43 reflect metabolic strain on the liver, likely from fatty infiltration, though the reassuring FIB-4 and APRI scores confirm there is no scarring yet. The lipid profile, with elevated LDL, ApoB and non-HDL cholesterol, is also partly driven by insulin resistance, which impairs the liver's ability to clear LDL particles from the bloodstream. The Lp(a) at 28.22, below the ideal threshold, confirms that the lipid elevation is entirely modifiable.\n\nThe third thread is the inflammation. A CRP of 12.6 is higher than metabolic syndrome and mild obesity alone would typically produce, and the iron deficiency anaemia, the perimenopausal hormone fluctuations, the joint pain and the possibility of an undiagnosed inflammatory condition all need to be considered by her GP. The negative rheumatoid factor is reassuring but does not exclude other inflammatory arthropathies. Once the iron deficiency is corrected and the metabolic picture improves, a repeat CRP will show whether the inflammation settles or persists, which would change the investigation.\n\nThe fourth thread ties the hormonal picture to her emotional symptoms. Her FSH and LH are in the perimenopausal range, and her oestradiol at 294, still within a cycling range, confirms the ovaries are producing oestrogen intermittently. This fluctuation, rather than a steady low level, is what produces the mood swings, crying outbursts, sleep disruption and brain fog that characterise perimenopause. It also contributes to joint stiffness, because oestrogen has anti-inflammatory effects on joints, and the fluctuating withdrawal of it can cause the morning stiffness she describes.\n\nWhat was excluded matters. Her thyroid is working well with negative antibodies, ruling out the most common hormonal cause of fatigue and weight gain in women of this age. Coeliac disease is negative. Her kidney function is intact. There is no sign of liver scarring. Her tumour markers are clear. Her immune system is functioning normally. Her vitamin D is in the optimal range. These exclusions narrow the focus to the four threads above: iron, metabolism, inflammation, and hormonal transition.\n\nThe loose end is the cause of the iron deficiency itself. With periods stopped, the most common cause of iron loss in premenopausal women is removed, and the question becomes whether she is not absorbing iron (coeliac is negative, but other gut causes exist), not eating enough of it (a convenience-based diet with 0 to 1 portions of vegetables and fruit is very likely to be iron-poor), or losing it somewhere in the gastrointestinal tract. Her GP will need to decide whether further investigation, such as stool testing for occult blood or referral for endoscopy, is appropriate alongside starting iron replacement.","lifestyle":"Add a palm-sized portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, tinned lentils, or beans. Anchor: before anything else goes on the plate. Why: protein at every meal will help control the insulin response behind your HOMA-IR of 4.09, support muscle preservation while losing body fat, and begin to address the nutritional gaps driving your anaemia.\nSwap one convenience or takeaway meal per day for something home-cooked with vegetables and a protein source, starting with whichever meal is easiest. A stir-fry with frozen vegetables, a jacket potato with tuna and salad, or an omelette with spinach all count. Anchor: plan tomorrow's swap tonight. Why: your diet is currently providing almost no vegetables (0 to 1 portions a day), which means very little folate (yours is at the floor at 3), very little dietary iron, and very little fibre to feed your gut and reduce the bloating you describe.\nBuild up to at least three portions of vegetables or fruit a day within the next month, adding one portion per week. Anchor: one portion at lunch, one at dinner, one as a snack. Why: folate at 3, iron stores at 7, and fibre for the bloating and insulin resistance.\nWalk for 15 minutes immediately after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses your HOMA-IR of 4.09 and HbA1c of 46.\nCut sugary food from some days to no more than once a week, and when you do have it, have it straight after a protein-containing meal rather than on its own. Anchor: the rule is protein first, sugar after, never sugar alone. Why: sugar on an empty stomach produces the sharpest insulin spike, and your pancreas is already producing more than twice the ideal amount of insulin.\nAim for 7.5 to 8 hours in bed, with a fixed wake time seven days a week, and get outside within an hour of waking for at least 10 minutes of daylight. Anchor: alarm at the same time every day, including weekends. Why: you sleep 6 to 7 hours and are slow to get going; a fixed wake time resets the cortisol rhythm that drives morning energy, and daylight exposure is the strongest signal for that reset.\nStart two short resistance sessions per week, even 15 to 20 minutes at home with bodyweight exercises: squats, wall press-ups, step-ups on the stairs. Anchor: pick two fixed days and do them before your morning shower. Why: resistance training is the single most effective tool for improving insulin sensitivity, preserving muscle during fat loss, supporting bone density through menopause, and reducing joint stiffness.\nCalorie target for gradual fat loss: approximately 1,500 to 1,650 kcal per day (your estimated maintenance is around 1,900 to 2,050 kcal based on your height, weight and activity level, with a modest deficit of 300 to 400 kcal). Protein target: 97 to 120 g per day (1.3 to 1.6 g per kg of bodyweight). Weight target range: 58 to 67 kg (a BMI of 22.5 to 26). There is no rush; aim for 0.5 kg per week.","flags":"Iron deficiency anaemia: haemoglobin 92 (lower limit 120), ferritin 7 (lower limit 10, optimal 40), serum iron 2.9 (lower limit 9), transferrin saturation 3.46% (lower limit 18%), TIBC 79.5 (upper limit 76.1), MCV 66.2 (lower limit 83), MCH 21.7 (lower limit 27), RDW 19.8% (upper limit 14%). Classic microcytic iron deficiency anaemia. GP investigation needed for the cause, likely a combination of dietary insufficiency and possible gastrointestinal cause given periods have stopped. Prescribed iron replacement required.\nReactive thrombocytosis: platelets 514 (upper limit 410). Consistent with iron deficiency as the driver; should resolve once iron stores are replenished. GP to confirm no additional cause.\nESR 44 (upper limit 12). Elevated from the combination of anaemia, inflammation (CRP 12.6), and possibly the perimenopausal state. GP to review alongside CRP and iron studies.\nhs-CRP 12.6 (upper limit 5, optimal below 1.0). Active systemic inflammation. Higher than obesity and insulin resistance alone would explain. GP to consider additional inflammatory causes given joint pain, including inflammatory arthropathy screen if clinically indicated, alongside the iron deficiency and metabolic contributors.\nPre-diabetes: HbA1c 46 mmol/mol (pre-diabetes range 42 to 47, diabetes threshold 48), fasting glucose 6.0 (upper limit 6.0), HOMA-IR 4.09 (upper limit 1.5, significant insulin resistance above 2.9). Fasting insulin 15.33 within lab range but driving a high HOMA-IR. GP to repeat HbA1c in 3 months; dietary and lifestyle intervention is the first-line treatment.\nLipid profile: ApoB 1.41 (target below 0.9), LDL 4.17 (upper limit 3.0), non-HDL 4.6 (target below 4), total cholesterol 6.1, ApoB/A1 ratio 0.92 (target below 0.6 for women). Lp(a) 28.22 (below 32, ideal), confirming the elevation is entirely modifiable. HDL 1.5 and triglycerides 1.08 are both acceptable. Cardiovascular Risk Score 80/100. Diet, weight loss and insulin resistance correction should be the first intervention; GP to reassess in 6 months and consider statin discussion if ApoB remains above 0.9 after lifestyle change.\nLiver: GGT 54 (upper limit 38 for women), ALT 43 (within lab range but above female optimal of 25). No scarring: FIB-4 0.53, APRI 0.17. Metabolic strain from insulin resistance and weight. Should improve with dietary change and weight loss.\nFolate 3 ng/ml (lower limit 3, optimal above 8). At the floor of the reference range and contributing to the anaemia. GP to consider supplementation alongside iron.\nVitamin B12 334 pg/ml (within range, optimal above 500). Below optimal; sublingual methylcobalamin recommended.\nPerimenopausal hormone profile: FSH 29.62, LH 32.25, oestradiol 294 (above postmenopausal ceiling of 118.2, consistent with intermittent ovarian activity), progesterone 0.83 (postmenopausal range). Fluctuating oestrogen is the likely driver of mood swings, crying outbursts and joint stiffness. GP or menopause specialist review for consideration of HRT.\nFree T3 4.2 (within range, below optimal of 4.5). TSH 1.03 (optimal), FT4 14.9 (within range). Antibodies negative. Not driving symptoms but worth monitoring alongside the metabolic changes.\nPhenoAge 67.6 against calendar age of 52 (15.6-year gap). Driven by CRP 12.6, MCV 66.2, RDW 19.8, glucose 6.0 and albumin 38. All modifiable.\nUrine: WBC greater than 500, RBC 130, but nitrites negative and culture returned mixed growth with probable contamination. Most likely sample contamination. Repeat clean-catch sample only if urinary symptoms are present.\nPotassium 5.1 (within range, upper end). Worth a routine repeat with GP to confirm.\nReassuring negatives: thyroid function normal with negative antibodies, coeliac screen negative (tTG IgA negative with adequate IgA), kidney function intact (cystatin C eGFR 85), no liver scarring (FIB-4 0.53, APRI 0.17), rheumatoid factor negative, tumour markers CA125 12.8, CA15-3 21.25, CA19-9 9.72 and CEA 0.9 all within range, IgG/IgM/IgA/IgE within range, Lp(a) ideal at 28.22, vitamin D optimal at 114, calcium and PTH normal, magnesium optimal.","recommendations":"Iron deficiency anaemia investigation and treatment: bring haemoglobin 92, ferritin 7, serum iron 2.9, transferrin saturation 3.46%, MCV 66.2 and RDW 19.8 to the GP. Prescribed iron replacement is needed alongside investigation of the cause, which may include stool testing for occult blood and consideration of endoscopy given her periods have stopped.\nPre-diabetes management: HbA1c 46, fasting glucose 6.0, HOMA-IR 4.09. Request a repeat HbA1c in 3 months to track the trajectory alongside the dietary and lifestyle changes in this report.\nInflammation investigation: CRP 12.6 is higher than obesity and insulin resistance alone would typically explain. Ask the GP to consider additional inflammatory causes, particularly given joint pain and stiffness, and whether an inflammatory arthropathy screen is indicated.\nLipid review: ApoB 1.41, LDL 4.17, non-HDL 4.6. Lp(a) is ideal at 28.22, so the elevation is entirely modifiable. Lifestyle change is the first intervention; reassess lipids in 6 months and discuss statin candidacy with the GP if ApoB remains above 0.9.\nFolate supplementation: folate 3 ng/ml is at the floor and contributing to the anaemia. Discuss supplementation with the GP alongside the iron replacement.\nPerimenopause discussion: FSH 29.62, oestradiol fluctuating at 294, symptoms of mood instability, fatigue, joint stiffness and crying outbursts. Discuss with GP or menopause specialist whether HRT would be appropriate.\nRepeat potassium with GP to confirm the 5.1 reading.\nCalorie target 1,500 to 1,650 kcal per day, protein target 97 to 120 g per day, weight target range 58 to 67 kg. Retest bloods in 4 to 6 months, repeating: full blood count, ferritin, serum iron, transferrin saturation, HbA1c, fasting glucose, fasting insulin, HOMA-IR, CRP, liver panel including GGT and ALT, lipid panel with ApoB, folate and B12.","supplementation":"DO NOT take iron supplements over the counter. Her ferritin is 7, serum iron is 2.9 and haemoglobin is 92; this degree of iron deficiency anaemia requires prescribed iron replacement at a dose her GP will determine. Over-the-counter doses are insufficient for this level of depletion.\nFolic acid: 400 mcg daily, or methylfolate 400 to 800 mcg daily if preferred. Take in the morning with food. Why: folate is at the floor at 3 ng/ml and is needed alongside iron for red cell production.\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Why: B12 at 334 is below the optimal floor of 500 and supports the red cell recovery alongside iron and folate.\nVitamin D3: continue current supplementation at 2,000 to 3,000 IU daily with a fat-containing meal. Her level at 114 is in the optimal range, and maintenance dosing will keep it there. Always take with vitamin K2 MK-7 100 mcg to direct calcium into bone rather than soft tissue.\nMagnesium glycinate: 300 mg before bed. Why: supports sleep quality (she is slow to get going on 6 to 7 hours), muscle recovery, insulin sensitivity and bone health through the menopausal transition. Her serum magnesium at 0.96 is within optimal range, but serum levels do not reflect intracellular stores and supplementation supports all four of her goals.\nOmega-3 fish oil: 2 g EPA and DHA combined daily, with food. Why: ApoB 1.41 and CRP 12.6; omega-3 supports both lipid metabolism and the resolution of inflammation.\nThe most important changes from this report are not supplements. They are correcting the iron deficiency with prescribed iron, overhauling the diet from convenience-based eating to whole foods with protein, vegetables and fibre at every meal, and starting resistance training twice a week. These three changes will move the blood sugar, the liver enzymes, the lipids, the inflammation and the biological age score more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 37 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Needs medical attention. Raw 37.1. Weakest systems: inflammation 5%, hematology 9%, lipids & cardiovascular 18%. Biggest drags: LDL Cholesterol, Apolipoprotein B, HOMA-IR, hs-CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"67.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5930","lower_normal":"","upper_normal":"57","lower_optimal":"","upper_optimal":"52","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4561","units":"years","description":"PhenoAge is a composite biological age score built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 67.6 is 15.6 years older than her calendar age of 52. The gap is driven primarily by her CRP at 12.6, her MCV at 66.2, her RDW at 19.8 and her glucose at 6.0. Every one of these drivers is modifiable: correcting the iron deficiency will normalise MCV and RDW, treating the underlying causes of inflammation will bring CRP down, and dietary change will lower the glucose. The PhenoAge should move substantially closer to her true age within six to twelve months of these interventions.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It contains no age term; it measures the risk being built right now regardless of age. Her score of 80 is well above the target of below 40 and the ideal of below 20. The two biggest drivers are CRP at 12.6 and HbA1c at 46, followed by ApoB at 1.41 and LDL at 4.17. Addressing the inflammation and the blood sugar dysregulation should produce a substantial drop in this score even before the lipids change, because CRP and HbA1c carry heavy weight in the calculation.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3839","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found mainly inside liver cells. When those cells are irritated or damaged, ALT leaks into the bloodstream, so a rising level tells us the liver is under strain. Her ALT at 43 is within the laboratory range of up to 56 but above the optimal ceiling of 25 for women. This is not alarming and there is no sign of liver scarring, but it is a signal that the liver is working harder than ideal, most likely from the insulin resistance and the convenience-heavy diet. This marker typically responds well to dietary improvement and weight loss.","low_causes":"","high_causes":"Fatty liver, obesity, insulin resistance, alcohol, medications, hepatitis","padding":"1","one_sided":"","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart and muscles. Her AST at 35 is within the laboratory range of 13 to 45. It is mildly above the optimal ceiling but not flagged. The De Ritis ratio (AST divided by ALT) is 0.81, within the optimal band, which is reassuring because a ratio above 1.5 can suggest more advanced liver issues. No action is needed on this marker alone.","low_causes":"","high_causes":"Liver disease, muscle damage, heart disease, medications","padding":"1","one_sided":"","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"54","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8235","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is an enzyme produced by the liver and bile ducts. It rises in response to metabolic strain, bile duct issues, alcohol and certain medications. Her GGT at 54 is above the upper limit of 38 for women. With FIB-4 and APRI both reassuring, this is most likely metabolic: insulin resistance and a diet high in processed food increase the fat deposited in liver cells, and GGT is one of the first enzymes to respond. At 1 to 4 alcoholic drinks per week, alcohol is a possible minor contributor but not the primary driver. Dietary improvement and weight loss are the most effective ways to bring this down.","low_causes":"","high_causes":"Fatty liver, insulin resistance, alcohol, bile duct obstruction, medications","padding":"1","one_sided":"","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"104","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6095","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bile ducts and bone. Her ALP at 104 is within the laboratory range of 46 to 116. In perimenopausal women, ALP can rise slightly due to increased bone turnover as oestrogen levels fluctuate. This is within normal limits and not a concern.","low_causes":"Malnutrition, zinc deficiency","high_causes":"Bile duct obstruction, bone disease, liver disease, perimenopause","padding":"1","one_sided":"","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Her bilirubin at 5 is at the lower end of the reference range, which is normal and expected. In the context of her anaemia, a low bilirubin is actually consistent: fewer red cells are being produced and broken down, so less bilirubin is generated.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood. Her total protein at 72 is within the optimal range, showing the liver is producing proteins adequately.","low_causes":"Liver disease, malnutrition, kidney disease","high_causes":"Chronic infection, inflammation, dehydration","padding":"1","one_sided":"","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and drugs, and maintains fluid balance. Her albumin at 38 is within the laboratory range but below the optimal floor of 40. Albumin is a negative acute-phase protein, meaning it falls when inflammation is present, and with a CRP of 12.6 this is the most likely explanation. As the inflammation resolves, albumin should rise.","low_causes":"Inflammation, liver disease, malnutrition, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin includes the antibodies and transport proteins in the blood. Her globulin at 34 is within the laboratory range and towards the upper end, which is consistent with the inflammatory response indicated by her CRP. No action is needed.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3381","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"ratio","description":"The A/G ratio compares albumin to globulin. Her ratio at 1.12 is within the laboratory range but below the optimal floor of 1.3, reflecting the mildly low albumin and mildly elevated globulin from the inflammatory response. This should normalise as the CRP comes down.","low_causes":"Inflammation, liver disease, autoimmune disease","high_causes":"Immune deficiency","padding":"1","one_sided":"","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5114","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that digests starch. Her amylase at 77 is well within range, confirming normal pancreatic function.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, salivary gland disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4823","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is an enzyme produced by the pancreas to digest fats. Her lipase at 34 is within the optimal range, confirming the pancreas is functioning well.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, kidney disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1828","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3448","units":"score","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis (scarring) using age, AST, ALT and platelet count. Her FIB-4 at 0.53 is well within the safe range of below 1.45, which is reassuring: despite the raised GGT and above-optimal ALT, there is no sign of liver scarring.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age-driven calculation","padding":"1","one_sided":"","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0567","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"APRI, the AST-to-platelet ratio index, is another calculator that estimates liver scarring. Her score of 0.17 is well within the optimal range of below 0.5, confirming no evidence of fibrosis.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-4.259","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3768","lower_normal":"-5","upper_normal":"0.676","lower_optimal":"-5","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5415","units":"score","description":"The NAFLD Fibrosis Score estimates the risk of advanced fibrosis in non-alcoholic fatty liver disease using age, BMI, diabetes status, albumin, AST, ALT and platelets. Her score of -4.259 is within the optimal range, confirming that despite the metabolic risk factors, there is no evidence of advanced liver scarring.","low_causes":"","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4033","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio divides AST by ALT. A ratio below 1 is typical when the ALT is the dominant enzyme, as seen in fatty liver or metabolic strain. Her ratio of 0.81 is within the optimal range, and a ratio well below 2 is reassuring because higher ratios can indicate more serious liver disease.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5888","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including the protective HDL and the potentially harmful LDL. Her total cholesterol at 6.1 is above the desirable level of 5.18. On its own, total cholesterol is a blunt measure; the breakdown into LDL, HDL and ApoB tells us more about what is driving the risk. In her case, the elevated total is driven mainly by elevated LDL and ApoB, while HDL and triglycerides are in an acceptable range.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, obesity, insulin resistance, hypothyroidism, genetics, menopause","padding":"1","one_sided":"","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3176","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, largely influenced by recent carbohydrate and sugar intake, alcohol and metabolic health. Her triglycerides at 1.08 are within the laboratory range and not far above the optimal ceiling of 1.0. Given her insulin resistance and HbA1c in the pre-diabetic range, it is a positive that triglycerides are not elevated, as they often rise alongside insulin resistance.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, insulin resistance, obesity","padding":"1","one_sided":"","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7212","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL, or high-density lipoprotein, is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. Higher is better. Her HDL at 1.5 is above the lower risk threshold of 1.04 but below the optimal floor of 1.6 for women. Exercise, particularly cardio, is one of the most effective ways to raise HDL, and she currently does none. Adding regular walking and eventually resistance training should help.","low_causes":"Sedentary lifestyle, obesity, smoking, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8227","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, or low-density lipoprotein, carries cholesterol to the tissues and, when elevated, deposits it in artery walls where it can form plaques over decades. Her LDL at 4.17 is above the upper limit of 3.0 and well above the optimal ceiling of 2.6. With her Lp(a) at 28.22 (ideal, below 32), the Lp(a)-corrected LDL is 4.08, confirming that virtually all of this LDL is modifiable through diet, weight loss and addressing insulin resistance. This is an important marker for her long-term cardiovascular health.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, obesity, insulin resistance, genetics, menopause","padding":"1","one_sided":"","range_type":"normal"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3141","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to the tissues. Her VLDL at 0.49 is within the optimal range, consistent with her acceptable triglyceride level.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus the protective HDL, capturing all the potentially harmful cholesterol-carrying particles including LDL, VLDL and remnants. Her non-HDL at 4.6 is above the target of 4, reflecting the elevated LDL. This marker will improve alongside LDL and ApoB with dietary change and weight management.","low_causes":"","high_causes":"Elevated LDL, high triglycerides, insulin resistance","padding":"1","one_sided":"","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.07","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4522","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"ratio","description":"The TC/HDL ratio divides total cholesterol by HDL. Her ratio at 4.07 is within the laboratory range of below 4.5 but above the optimal ceiling of 3.5. Bringing LDL down and HDL up will improve this ratio.","low_causes":"","high_causes":"High LDL, low HDL","padding":"1","one_sided":"","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"24.59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6148","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"The percentage of total cholesterol that is protective HDL. Her 24.59% is above the 20% floor but below the optimal target of 28% or more. As the total cholesterol comes down through LDL reduction and HDL rises with exercise, this percentage will improve.","low_causes":"Sedentary lifestyle, obesity, insulin resistance","high_causes":"Exercise, healthy weight, genetics","padding":"1","one_sided":"","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single protein carried on every LDL, VLDL and Lp(a) particle, making it a direct count of how many atherogenic particles are in the blood. It is widely considered the best single measure of cardiovascular risk from cholesterol. Her ApoB at 1.41 is classified as very high, well above the desirable threshold of 0.9 and the optimal target of 0.8. Each ApoB-carrying particle is capable of crossing into the artery wall and depositing cholesterol there, so the higher the count, the faster plaque builds over time. With Lp(a) ideal at 28.22, the entire ApoB elevation is modifiable through diet, weight loss and insulin resistance correction. If ApoB remains above 0.9 after six months of lifestyle change, her GP should discuss whether a statin is appropriate.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, obesity, insulin resistance, genetics, menopause","padding":"1","one_sided":"","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5000","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the body's cholesterol removal capacity. Her ApoA1 at 1.54 is above the desirable threshold of 1.4, which is positive. However, the ApoB/A1 ratio matters more than either number alone.","low_causes":"Sedentary lifestyle, obesity, smoking","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"","range_type":"no upper"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"ratio","description":"The ApoB/A1 ratio compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1). For women, below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Her ratio at 0.92 is in the higher-risk category, meaning the balance is tipped towards harmful particles. The ApoA1 at 1.54 is healthy, so the ratio is driven entirely by the elevated ApoB at 1.41. Reducing ApoB through diet and weight loss will bring this ratio back towards the healthy range.","low_causes":"","high_causes":"High ApoB, low ApoA1","padding":"1","one_sided":"","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"28.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle similar to LDL but with an additional protein that promotes clotting and inflammation in artery walls. Unlike LDL, Lp(a) cannot be changed by diet or lifestyle. Her Lp(a) at 28.22 is below the ideal threshold of 32, which is genuinely useful information: it means the elevated LDL and ApoB in this report are driven entirely by modifiable factors such as diet, weight and insulin resistance, not by an inherited particle that cannot be changed.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2687","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is what is left after subtracting HDL and LDL from total cholesterol. It represents the cholesterol carried by triglyceride-rich particles, which are increasingly recognised as an independent cardiovascular risk factor. Her remnant cholesterol at 0.43 is within the optimal range of below 0.5, which is a positive finding and consistent with her acceptable triglycerides.","low_causes":"","high_causes":"High triglycerides, insulin resistance","padding":"1","one_sided":"","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2400","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"The triglyceride-to-HDL ratio is a simple proxy for insulin resistance and small, dense LDL particles. Her ratio at 0.72 is within the optimal range of below 0.9, which is a positive finding that suggests her LDL particles are not predominantly the small, dense, more dangerous type despite the overall LDL being elevated.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet","padding":"1","one_sided":"","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"4.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6800","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This adjusts the LDL value by subtracting the cholesterol carried by Lp(a) particles, giving a clearer picture of how much of the LDL is modifiable. Her Lp(a)-corrected LDL at 4.08 is very close to her measured LDL of 4.17, confirming that almost none of the LDL burden is from the inherited Lp(a) particle. The entire elevation is driven by factors she can change.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5694","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from triglycerides and HDL and reflects the balance between harmful and protective lipid particles. Her index at -0.143 is within the optimal range, indicating a favourable triglyceride-to-HDL balance. This is a positive finding that sits alongside her optimal TG/HDL ratio.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3971","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II ratio divides LDL by HDL. Her ratio at 2.78 is within the reference range but above the optimal ceiling of 2.5, driven by the elevated LDL. Reducing LDL will bring this into the optimal band.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting glucose measures the sugar in the blood after an overnight fast. Her glucose at 6.0 sits exactly on the upper limit of the reference range and well above the optimal ceiling of 5.4. In the context of her HbA1c at 46 and HOMA-IR at 4.09, this confirms that her body is struggling to keep blood sugar controlled. Dietary changes, particularly reducing sugar and ultra-processed food and adding protein and fibre, will help bring this down.","low_causes":"Excessive insulin, fasting, medications","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, diet","padding":"1","one_sided":"","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin with sugar attached, reflecting average blood sugar over two to three months. Her HbA1c at 6.4% falls in the pre-diabetes range (6.0 to 6.4%). This confirms that blood sugar has been elevated consistently, not just on the day of the test. However, iron deficiency anaemia can falsely elevate HbA1c because red blood cells live longer when production is impaired, giving sugar more time to attach. Her GP should be aware of this and may want to repeat the HbA1c once the iron deficiency is corrected to get a truer picture.","low_causes":"Iron deficiency (can paradoxically raise it), haemolysis","high_causes":"Pre-diabetes, diabetes, insulin resistance","padding":"1","one_sided":"","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5476","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the international standard unit. Her value of 46 is in the pre-diabetes range of 42 to 47, with diabetes defined at 48 and above. As noted, iron deficiency anaemia can falsely elevate this reading, so a repeat once iron stores are replenished will give a clearer result. Regardless, the fasting glucose at 6.0 and the HOMA-IR at 4.09 independently confirm insulin resistance, so the dietary and lifestyle changes remain urgent.","low_causes":"","high_causes":"Pre-diabetes, diabetes, prolonged red cell lifespan","padding":"1","one_sided":"","range_type":"no lower"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"15.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5236","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar controlled. Her insulin at 15.33 is within the laboratory range of 2.6 to 24.9 but nearly double the optimal ceiling of 8. This means the pancreas is working overtime to keep glucose from rising further, which is the hallmark of insulin resistance. The combination of high insulin and a glucose at the top of range produces her HOMA-IR of 4.09, confirming significant insulin resistance. Reducing sugar, ultra-processed food and refined carbohydrates, adding protein to every meal, walking after meals and starting resistance training are the most effective interventions.","low_causes":"Low carbohydrate diet, insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, obesity, high carbohydrate diet","padding":"1","one_sided":"","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4697","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is released by the pancreas in equal amounts to insulin and serves as a stable measure of how much insulin the pancreas is producing (insulin itself is cleared quickly from the blood). Her C-Peptide at 2.45 ug/L is within the laboratory range, confirming the pancreas is functioning and producing insulin. The value is consistent with the elevated fasting insulin.","low_causes":"Type 1 diabetes, low insulin production","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"4.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"index","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin. It quantifies how hard the body is working to keep blood sugar controlled. The ideal range is 0.5 to 1.0; below 1.0 means excellent insulin sensitivity. Her HOMA-IR at 4.09 is well above the upper limit of 1.5 and above the threshold of 2.9 that indicates significant insulin resistance. In practical terms, her cells are not responding properly to insulin, so the pancreas is producing far more than it should to achieve the same effect. This is the central metabolic finding in this report and the mechanism behind the elevated HbA1c, the liver enzyme strain, and partly the lipid profile. Dietary change, weight loss and exercise will improve it.","low_causes":"High insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, obesity, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"7.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose is derived from the HbA1c and represents the average blood sugar level over the past two to three months. Her value of 7.5 is above the upper limit of 7, consistent with the pre-diabetic HbA1c. As noted, iron deficiency can inflate this number, so the true average may be slightly lower.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4858","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is calculated from triglycerides and fasting glucose and serves as another measure of insulin resistance. Her TyG at 8.55 is within the reference range but just above the optimal ceiling of 8.5, consistent with the insulin resistance pattern confirmed by HOMA-IR. It is driven by the fasting glucose at 6.0.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"12.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP, or C-reactive protein, is produced by the liver in response to inflammation anywhere in the body. Below 1.0 is optimal, below 5 is the laboratory upper limit, and above 10 is considered an active inflammatory response rather than a background cardiovascular risk marker. Her CRP at 12.6 is well above both thresholds, indicating active systemic inflammation. The iron deficiency anaemia, the insulin resistance, being overweight, and the joint pain she describes could all contribute. Her GP should investigate whether there is an additional inflammatory cause, particularly given her joint stiffness, and a repeat CRP once the iron is corrected and the metabolic picture improves will show whether the inflammation settles.","low_causes":"","high_causes":"Infection, autoimmune disease, obesity, insulin resistance, injury, chronic disease","padding":"1","one_sided":"","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. It rises with inflammation, anaemia, and elevated plasma proteins. Her ESR at 44 is significantly above the upper limit of 12. The anaemia itself is a major contributor because microcytic (small) red cells and altered plasma protein from inflammation change sedimentation speed. The raised CRP at 12.6 confirms this is a genuine inflammatory signal rather than a laboratory artefact. Her GP should see this alongside the CRP and the iron studies.","low_causes":"Polycythaemia, sickle cell disease","high_causes":"Anaemia, inflammation, infection, autoimmune disease, malignancy","padding":"1","one_sided":"","range_type":"no lower"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"INFLAMMATION","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4170","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.4812","units":"ratio","description":"The neutrophil-to-lymphocyte ratio is a simple marker of the balance between acute (neutrophil) and chronic (lymphocyte) immune responses. Her NLR at 1.47 is within the optimal range of 1.0 to 2.0, indicating a balanced immune response despite the elevated CRP and ESR.","low_causes":"","high_causes":"Acute infection, stress, systemic inflammation","padding":"1","one_sided":"","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"204","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6533","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio combines platelet count and lymphocytes as another inflammatory marker. Her PLR at 204 is within the reference range but above the optimal ceiling of 160, driven by the reactive thrombocytosis (platelets 514) from iron deficiency. This should normalise once iron stores are replenished.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"755","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7700","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets and lymphocytes into a single inflammatory index. Her SII at 755 is above the upper limit of 600, driven primarily by the elevated platelet count from iron deficiency. The neutrophils and lymphocytes are both within range, so the platelets are the dominant input. This is another marker that should normalise once the iron deficiency is corrected.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":
