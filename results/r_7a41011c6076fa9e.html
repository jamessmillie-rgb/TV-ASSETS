f biologically active calcium. Her corrected calcium at 2.49 is within the optimal range.","low_causes":"Low PTH, vitamin D deficiency","high_causes":"Hyperparathyroidism, malignancy","padding":"1","one_sided":"","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5805","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzyme reactions including muscle relaxation, sleep, blood sugar regulation and bone mineralisation. Her magnesium at 0.96 is within the optimal range of 0.85 to 1.05. However, serum magnesium is a poor reflection of total body stores because most magnesium is inside cells and bone. Supplementation with magnesium glycinate before bed supports sleep, muscle recovery and insulin sensitivity.","low_causes":"Poor diet, alcohol, medications, diabetes","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"365","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5488","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines in food and within the body. Her uric acid at 365 is within the laboratory range but above the optimal ceiling of 320 for women. Elevated uric acid is associated with insulin resistance, and in her case the two likely go hand in hand. Reducing fructose (found in sugary drinks, fruit juice and many processed foods) and improving insulin sensitivity through the dietary changes recommended in this report should help bring uric acid down.","low_causes":"Low purine diet, kidney disease","high_causes":"Insulin resistance, high purine diet, alcohol, kidney impairment, gout","padding":"1","one_sided":"","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"20.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6767","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride and bicarbonate and helps assess acid-base balance. Her anion gap at 20.3 is marginally above the upper limit of 20. At this margin, and with all individual electrolytes within range, this is not clinically significant. The mildly elevated potassium at 5.1 contributes to the calculation.","low_causes":"Low albumin, dilution","high_causes":"Metabolic acidosis, ketoacidosis, lactic acidosis, kidney disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium reading for the effect of elevated blood sugar, which can dilute sodium in the blood. Her corrected value of 142 is the same as her measured sodium, confirming that glucose is not affecting the sodium reading. Reported for context.","low_causes":"Overhydration","high_causes":" ase, dehydration, medications","high_causes":"","padding":"1","one_sided":"","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4773","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced by all cells and filtered by the kidneys, providing an alternative measure of kidney function that is less affected by muscle mass, age and diet than creatinine. Her Cystatin C at 1.05 is within the laboratory range but above the optimal ceiling of 0.9. The Cystatin C-derived eGFR of 85 is slightly below the optimal threshold of 90 and lower than the creatinine-based eGFR of above 90. At 52 with a BMI of 29.2, this is worth monitoring at future tests but not a concern on its own. Staying well hydrated, controlling blood sugar and maintaining a healthy weight all support kidney function.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction, obesity","padding":"1","one_sided":"","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C for the most accurate estimate of kidney filtration. Her value of 85 is within the reference range but below the optimal floor of 90. At 52, this is within normal age-related variation and not a concern, but it is worth tracking at future tests.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"96.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between causes of raised urea. Her ratio at 96.8 is within the reference range but above the optimal ceiling of 90. This is marginally above ideal and may reflect mild dehydration at the time of the draw. No clinical concern.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Her haemoglobin at 92 is significantly below the lower limit of 120 for women, confirming moderate anaemia. At this level, the body is receiving substantially less oxygen than it needs, which explains the crushing fatigue, the brain fog, the feeling of being unable to get going in the morning, and the aches on waking. Her GP needs to investigate the cause and begin prescribed iron replacement.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10/12/l","description":"The red blood cell count measures how many red cells are in the blood. Her RBC at 4.22 is within the optimal range, which is notable because despite severe iron deficiency, the body is maintaining cell numbers. The cells are just much smaller and carry less haemoglobin (MCV 66.2, MCH 21.7). This pattern is classic for iron deficiency anaemia.","low_causes":"Blood loss, bone marrow failure, chronic disease","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.279","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0633","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. Her haematocrit at 0.279 is significantly below the lower limit of 0.36, consistent with the anaemia. With small red cells (MCV 66.2), even a normal red cell count produces a low haematocrit because each cell occupies less volume. This will improve as iron replacement restores normal red cell size.","low_causes":"Anaemia, blood loss, fluid overload","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"66.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0222","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fl","description":"MCV, or mean corpuscular volume, is the average size of each red blood cell. Her MCV at 66.2 is significantly below the lower limit of 83, confirming microcytic (small cell) anaemia. This is the hallmark of iron deficiency: without enough iron to build haemoglobin, the bone marrow produces smaller cells. The Mentzer Index (MCV divided by RBC) at 15.7 is above 13, which points towards iron deficiency rather than a genetic cause such as thalassaemia trait, though her GP may wish to confirm this.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"21.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH, or mean corpuscular haemoglobin, is the average amount of haemoglobin in each red blood cell. Her MCH at 21.7 is significantly below the lower limit of 27, confirming hypochromic (pale) red cells. Each cell is carrying much less oxygen-transporting haemoglobin than it should, which is another direct consequence of iron deficiency.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"328","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4778","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, is the average concentration of haemoglobin within each red cell. Her MCHC at 328 is within the optimal range. This means that while each cell is smaller and carries less total haemoglobin (MCH 21.7), the concentration within the cell is still normal, which is typical of iron deficiency anaemia.","low_causes":"Iron deficiency (severe), thalassaemia","high_causes":"Spherocytosis, dehydration","padding":"1","one_sided":"","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"19.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"%","description":"RDW, or red cell distribution width, measures the variation in size of red blood cells. Her RDW at 19.8% is well above the upper limit of 14%, indicating a wide spread of cell sizes. This is characteristic of iron deficiency anaemia: the bone marrow is producing new, small iron-depleted cells alongside older, normal-sized cells, creating a mixed population. A high RDW in this context confirms active iron deficiency rather than a longstanding stable state.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia","padding":"1","one_sided":"","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"514","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8000","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"375","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.6218","units":"x10^9/L","description":"Platelets are the small blood cells that help form clots and stop bleeding. Her platelet count at 514 is above the upper limit of 410. Reactive thrombocytosis, where the platelet count rises in response to iron deficiency, is a well-recognised phenomenon. The bone marrow's response to low iron stimulates platelet production as a by-product. Once iron stores are replenished, the platelet count should fall back to normal. Her GP will want to confirm this resolves.","low_causes":"Bone marrow disorders, medications, infection, autoimmune","high_causes":"Iron deficiency, inflammation, infection, blood disorders","padding":"1","one_sided":"","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"7.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV, or mean platelet volume, measures the average size of platelets. Her MPV at 7.7 is within the optimal range. A low MPV alongside a high platelet count is consistent with reactive thrombocytosis (the body is producing many small platelets quickly in response to iron deficiency), rather than a primary bone marrow disorder.","low_causes":"Reactive thrombocytosis, ulcerative colitis","high_causes":"Immune thrombocytopenia, myeloproliferative disorders","padding":"1","one_sided":"","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"%","description":"Reticulocytes are young, newly released red blood cells. Their count reflects how actively the bone marrow is producing new cells. Her reticulocyte count at 1.84% is within the optimal range. In the context of significant anaemia, a reticulocyte count that is not elevated above range suggests the bone marrow is trying to respond but is limited by the lack of iron to build haemoglobin. Once iron is replaced, the reticulocyte count should rise temporarily as the marrow ramps up production.","low_causes":"Bone marrow failure, iron deficiency (limits response), B12 or folate deficiency","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"","range_type":"normal"},{"key":"reticulocytesabs","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"77.648","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red cells in the blood, removing the percentage artefact. Her absolute reticulocyte count at 77.6 is within the optimal range. As with the percentage, the fact that it is not elevated despite significant anaemia reflects the bone marrow's inability to mount a full response without adequate iron.","low_causes":"Bone marrow failure, nutritional deficiency","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.92","within_normal" ed in allergic and inflammatory responses. Her basophils at 0.03 are within the optimal range.","low_causes":"","high_causes":"Allergic reactions, myeloproliferative disorders","padding":"1","one_sided":"","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"15.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by the red blood cell count and helps distinguish between iron deficiency anaemia and thalassaemia trait when MCV is low. An index above 13 favours iron deficiency, while below 13 favours thalassaemia. Her index of 15.7 leans towards iron deficiency, which is consistent with the iron studies showing severely depleted stores. Her GP may confirm this clinically.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1425","lower_normal":"2","upper_normal":"","lower_optimal":"3","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"index","description":"Reticulocyte Production Index is calculated from her measured results. It sits outside the ideal range. It is being driven by Haemoglobin, which sits outside the ideal range.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"2.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2383","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3801","upper_optimal_position":"0.5826","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, available for red cell production and other functions. Her serum iron at 2.9 is drastically below the lower limit of 9, meaning there is almost no iron available for the body to use. This is the direct cause of her microcytic anaemia and a key finding in this report.","low_causes":"Iron deficiency, chronic disease, blood loss, poor absorption","high_causes":"Haemochromatosis, iron supplementation, haemolysis","padding":"1","one_sided":"","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3298","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. Her ferritin at 7 is below the laboratory lower limit of 10 and far below the optimal floor of 40 for women. The stores are virtually empty. Ferritin is also an acute-phase protein that rises with inflammation, so a ferritin of 7 in the presence of a CRP of 12.6 means the true iron stores may be even lower than 7 suggests, because the inflammation would normally push ferritin upward. This is a significant finding that requires prescribed iron replacement.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Inflammation, infection, haemochromatosis, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5487","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.6154","units":"g/L","description":"Transferrin is the transport protein that carries iron through the blood. Her transferrin at 3.34 is within the optimal range. In iron deficiency, the liver often increases transferrin production to try to capture more iron, and the fact that it is within the upper part of the range is consistent with this compensatory response.","low_causes":"Chronic disease, iron overload, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy, oestrogen","padding":"1","one_sided":"","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"3.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2023","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation is the percentage of transferrin that is actually carrying iron. Her saturation at 3.46% is drastically below the lower limit of 18%, meaning the vast majority of her iron transport capacity is empty. Alongside a ferritin of 7 and serum iron of 2.9, this completes the picture of severe iron deficiency. The body has more than enough transport capacity (transferrin 3.34) but almost no iron to fill it.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron supplementation, haemolysis","padding":"1","one_sided":"","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"79.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7020","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/l","description":"TIBC, or total iron binding capacity, measures the total capacity of transferrin to bind iron. Her TIBC at 79.5 is above the upper limit of 76.1. In iron deficiency, the body increases its iron binding capacity as a compensatory response, trying to capture every available molecule of iron. An elevated TIBC alongside depleted iron and ferritin is a classic iron deficiency pattern.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women supports muscle mass, bone density, energy, mood and libido. Her testosterone at 0.8 is within the laboratory range but sits at the bottom of the optimal band. In the perimenopausal transition, testosterone gradually declines, and at the lower end it may contribute to the fatigue, difficulty maintaining muscle and mood changes she describes.","low_causes":"Menopause, ageing, adrenal insufficiency, low DHEA","high_causes":"PCOS, adrenal hyperplasia, medications","padding":"1","one_sided":"","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.012","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3361","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"nmol/l","description":"Free testosterone is the tiny fraction of total testosterone not bound to proteins (SHBG and albumin), and it is the biologically active form. Her free testosterone at 0.012 is within the laboratory range but well below the optimal floor of 0.02. This reflects the combination of a low-normal total testosterone (0.8) and an SHBG (47.2) that is binding most of what is available. Low free testosterone can contribute to fatigue, low libido, difficulty building muscle and low mood.","low_causes":"Menopause, high SHBG, low total testosterone, ageing","high_causes":"PCOS, low SHBG, insulin resistance","padding":"1","one_sided":"","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3994","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"index","description":"The Free Androgen Index is calculated from total testosterone and SHBG, providing another estimate of biologically available testosterone. Her FAI at 1.69 is within the optimal range. It is consistent with the low-normal testosterone and mid-range SHBG.","low_causes":"Low testosterone, high SHBG, menopause","high_causes":"PCOS, insulin resistance, low SHBG","padding":"1","one_sided":"","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"47.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3880","lower_normal":"27.8","upper_normal":"146","lower_optimal":"35","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3536","upper_optimal_position":"0.5087","units":"nmol/l","description":"SHBG, or sex hormone binding globulin, is a protein that binds testosterone and oestradiol, controlling how much is free and active. Her SHBG at 47.2 is within the optimal range. It is not particularly high, so the low free testosterone is primarily a reflection of the low total testosterone rather than excessive binding.","low_causes":"Obesity, insulin resistance, hypothyroidism","high_causes":"Oestrogen, hyperthyroidism, ageing, liver disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4029","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3873","upper_optimal_position":"0.5425","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor for both testosterone and oestrogen. Her DHEA-S at 2.5 umol/L is within the laboratory range. DHEA-S naturally declines with age, and her level is consistent with her age and perimenopausal status.","low_causes":"Adrenal insufficiency, ageing, chronic disease","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"294","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"118.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary oestrogen, responsible for menstrual cycle regulation, bone density, cardiovascular protection, brain function and joint lubrication. Her oestradiol at 294 is above the postmenopausal ceiling of 118.2 and within the follicular phase range, indicating that despite periods having stopped, her ovaries are still producing oestrogen intermittently. This fluctuation, with oestradiol rising and falling unpredictably, is characteristic of the perimenopausal transition and is the likely driver of her mood swings, crying outbursts and the waxing and waning of joint stiffness. Her GP or a menopause specialist can discuss whether HRT would stabilise these fluctuations.","low_causes":"Menopause, low body fat, hypothalamic amenorrhoea","high_causes":"Perimenopausal fluctuation, PCOS, obesity, HRT","padding":"1","one_sided":"","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.83","within_normal":"TRUE","within_optimal":"","result_position":"0.4526","lower_normal":"0","upper_normal":"2.32","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is the hormone produced after ovulation and during pregnancy. In the postmenopausal reference range, her progesterone at 0.83 is within normal limits. The low level confirms she is not currently in a luteal (post-ovulation) phase, consistent with the perimenopausal state where ovulation becomes infrequent even when oestradiol is still being produced.","low_causes":"Anovulation, menopause, perimenopause","high_causes":"Ovulation, pregnancy, HRT","padding":"1","one_sided":"","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"32.25","within_normal":"TRUE","within_optimal":"","result_position":"0.4764","lower_normal":"15.9","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH, or luteinising hormone, is produced by the pituitary gland and in women triggers ovulation and stimulates progesterone production. Her LH at 32.25 is within the postmenopausal range of 15.9 to 54, consistent with the perimenopausal transition. Elevated LH is the pituitary's response to declining ovarian function.","low_causes":"Hypothalamic dysfunction, pituitary failure","high_causes":"Menopause, perimenopause, PCOS, primary ovarian insufficiency","padding":"1","one_sided":"","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"29.62","within_normal":"TRUE","within_optimal":"","result_position":"0.3570","lower_normal":"23","upper_normal":"116.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"FSH, or follicle stimulating hormone, is produced by the pituitary gland to stimulate the ovaries to produce eggs and oestrogen. Her FSH at 29.62 is within the postmenopausal range of 23 to 116.3. In the perimenopausal transition, FSH rises as the pituitary works harder to stimulate declining ovarian function. Her level at the lower end of the postmenopausal range, combined with the still-elevated oestradiol of 294, suggests she is in the earlier stages of the transition rather than fully postmenopausal.","low_causes":"Hypothalamic dysfunction, pituitary failure, pregnancy","high_causes":"Menopause, perimenopause, primary ovarian insufficiency","padding":"1","one_sided":"","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5363","units":"uIU/ml","description":"Prolactin is produced by the pituitary gland and is best known for its role in breast milk production, but it also influences mood, immune function and reproductive health. Her prolactin at 143 is within the optimal range.","low_causes":"Dopamine excess, medications","high_causes":"Stress, prolactinoma, medications, hypothyroidism","padding":"1","one_sided":"","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"206","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3759","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5475","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. Her cortisol at 206 is within the laboratory morning range but towards the lower end. A lower morning cortisol can contribute to the difficulty getting going in the morning that she describes. It is not outside range and does not indicate adrenal insufficiency, but it is consistent with the energy pattern of feeling slow on waking and low all day. Improving sleep, getting outside in morning daylight and gradually building exercise can support a healthier cortisol rhythm.","low_causes":"Adrenal insufficiency, chronic fatigue, poor sleep","high_causes":"Stress, Cushing's syndrome, steroid medication","padding":"1","one_sided":"","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4545","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both the free fraction and the albumin-bound fraction, representing the testosterone accessible to tissues. Her bioavailable testosterone at 0.25 is within the optimal range, which is a more reassuring picture than the very low free testosterone might suggest, because the albumin-bound fraction is biologically available even though it is not technically free.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"6.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Free Oestradiol Index estimates the proportion of oestradiol not bound to SHBG. Her index of 6.23 is reported for context. Given her perimenopausal status with fluctuating oestradiol, this reflects a snapshot of a moving picture and is consistent with intermittent ovarian activity.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3712","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/l","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland and tells the thyroid how hard to work. A TSH within the optimal range of 1.0 to 2.5 means the pituitary is satisfied with the thyroid's output. Her TSH at 1.03 is within the optimal range, which is reassuring and rules out the thyroid as a cause of her fatigue and weight gain.","low_causes":"Hyperthyroidism, excessive thyroid medication","high_causes":"Hypothyroidism, thyroid underperformance","padding":"1","one_sided":"","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"14.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4345","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/l","description":"Free T4 is the inactive thyroid hormone produced by the thyroid gland, which must be converted into the active T3 form in the tissues. Her FT4 at 14.9 is within the optimal range of 14 to 20, though towards the lower end. Combined with a well-controlled TSH, this shows the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, pituitary failure","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production, mood and body temperature at the cellular level. Her FT3 at 4.2 is within the laboratory range but below the optimal floor of 4.5. A slightly below-optimal FT3 can contribute to fatigue and sluggish metabolism, though with a well-controlled TSH at 1.03 and negative antibodies, this is not a primary concern. Iron deficiency can impair T4-to-T3 conversion, so correcting the iron deficiency may improve FT3 as a secondary benefit.","low_causes":"Low iron, chronic illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a condition known as Hashimoto's thyroiditis. Her TPO antibodies are below 6.6 against a threshold of 13.8, which is negative. This rules out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. Her result is below 1.3 against a cut-off of 4.4, which is negative and confirms no autoimmune thyroid process.","low_causes":"","high_causes":"Hashimoto's thyroiditis, thyroid cancer follow-up interference","padding":"1","one_sided":"","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.282","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4427","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts inactive T4 into active T3. Her ratio at 0.282 is within the optimal range, suggesting adequate conversion despite the FT3 being slightly below ideal. This is reassuring.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"114","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is a hormone that supports bone health, immune function, mood and muscle function. Her vitamin D at 114 is within the optimal range of 75 to 120, showing her supplementation is working well. She should continue at a maintenance dose to keep it in this range.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption","high_causes":"Excessive supplementation","padding":"1","one_sided":"","range_type":"no upper"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"334","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3929","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for   if (b.within_normal === 'FALSE') return 'flag';

const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
