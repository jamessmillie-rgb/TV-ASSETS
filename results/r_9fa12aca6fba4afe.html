"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is a calculated score that estimates how sensitive the body's cells are to insulin. It uses fasting glucose and fasting insulin to model this relationship. A score below 1.0 indicates excellent insulin sensitivity, meaning the body needs very little insulin to keep blood sugar controlled. Anthony's HOMA-IR at 0.65 is outstanding and confirms his metabolic transformation. Below 1.0 is considered insulin-sensitive, which is the optimal state. For someone who has lost 9 stone, this result confirms that the weight loss has had a profound positive effect on metabolic health.","low_causes":"High insulin sensitivity, low carbohydrate intake, fasting","high_causes":"Insulin resistance, type 2 diabetes, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"47.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1968","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates pancreatic beta-cell function, or how actively the pancreas is producing insulin. It is calculated as (20 x insulin) / (glucose - 3.5). Anthony's HOMA-B at 47.23 is below the lower limit of 80. However, this is directly related to his very low insulin level rather than indicating pancreatic failure. When glucose is well controlled on minimal insulin, as it is here, HOMA-B will be mathematically low because the pancreas simply does not need to work hard. His fasting glucose of 4.8 and HbA1c of 36 confirm that the pancreas is producing exactly as much insulin as the body needs. The GLP-1 medication further reduces the demand on the pancreas.","low_causes":"Low insulin demand, fasting, GLP-1 medication, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, early type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP measures low-grade chronic inflammation in the body, particularly within blood vessel walls. It is one of the most important cardiovascular risk markers. Anthony's hs-CRP at 0.3 is well within the optimal range of below 1.0. This is an excellent result that confirms there is no significant systemic inflammatory process running, which is particularly reassuring alongside his elevated Lp(a) and ApoB, as low inflammation reduces the rate at which those particles cause arterial damage.","low_causes":"","high_causes":"Chronic inflammation, infection, obesity, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a tube over one hour. Faster settling indicates more inflammation. Anthony's ESR at below 2 is essentially at the floor of the range, confirming minimal inflammation. This complements his excellent hs-CRP result and helps rule out inflammatory conditions as a cause of his joint pain.","low_causes":"","high_causes":"Infection, autoimmune disease, chronic inflammation, cancer, anaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/l","description":"Sodium is the primary electrolyte that regulates fluid balance, blood pressure, and nerve signalling. Anthony's sodium at 141 is in the optimal range and confirms healthy fluid and electrolyte balance.","low_causes":"Excess water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6410","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and is important for digestion and acid-base balance. Anthony's chloride at 95 sits at the lower limit of the laboratory range. While technically in range, it is below the optimal floor of 98. At this margin, it is unlikely to be clinically significant and may reflect his fasting state at the time of the blood draw or mild metabolic alkalosis.","low_causes":"Vomiting, diuretics, metabolic alkalosis, Addison's disease","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"21.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3697","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's primary buffer against acid in the blood. It helps maintain the blood's pH within the narrow range required for normal function. Anthony's bicarbonate at 21.8 is within the laboratory range but just below the optimal floor of 22. This is a minor finding and may reflect his fasting state or the metabolic effects of intermittent fasting.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"1.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1579","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.5789","units":"mmol/l","description":"Calcium is the most abundant mineral in the body and is essential for bone structure, muscle contraction, nerve signalling, blood clotting, and heart rhythm. The body guards calcium levels extremely tightly because even small deviations can affect heart and muscle function. Anthony's calcium at 1.98 is below the lower limit of 2.08 and significantly below the optimal range of 2.2 to 2.5. This finding, particularly in combination with a suppressed PTH, requires GP investigation. While the lab notes that calcium can be falsely reduced in older specimens, the degree of suppression alongside low PTH makes this more than a sample handling artefact and warrants repeat testing on a fresh, same-day-processed sample.","low_causes":"Hypoparathyroidism, vitamin D deficiency, magnesium deficiency, kidney disease, malabsorption, sample degradation","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"1.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium measurement for the albumin level in the blood, because calcium binds to albumin and a high or low albumin can distort the raw value. This gives a more accurate picture of the biologically active calcium level. Anthony's corrected calcium at 1.93 is significantly below the lower limit of 2.2, which is the GP-urgent finding in this report. With his albumin at 44 being healthy, the correction confirms that the low calcium is a genuine finding and not an artefact of low albumin. The combination of low corrected calcium with low PTH suggests the parathyroid glands are not responding appropriately and requires investigation.","low_causes":"Hypoparathyroidism, vitamin D deficiency, magnesium deficiency, kidney disease, malabsorption, sample degradation","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6494","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar regulation, and bone health. Anthony's magnesium at 1.1 is at the very top of the laboratory range and just above the optimal ceiling of 1.05. This is reassuring, particularly in the context of his low calcium, because magnesium deficiency is one of the causes of suppressed PTH, and his magnesium is clearly not the issue here. Serum magnesium represents only about 1% of total body magnesium, with the rest stored in bone and muscle, so a healthy serum level is a good but not definitive sign.","low_causes":"Poor diet, alcohol, diuretics, GI disease, intense exercise","high_causes":"Kidney disease, excess supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ua","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"170","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1529","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5766","units":"umol/l","description":"Uric acid is produced when the body breaks down purines, substances found in certain foods and in the body's own cells. It is filtered by the kidneys and excreted in urine. Anthony's uric acid at 170 is below the lower limit of 220. Low uric acid is not harmful in itself, but it is associated with reduced purine intake, which fits with his caloric restriction and intermittent fasting. GLP-1 medications can also increase renal excretion of uric acid, contributing to the low level. This finding adds to the broader picture of a body running on tight energy reserves but does not require specific treatment.","low_causes":"Low purine intake, caloric restriction, GLP-1 medication, Fanconi syndrome, Wilson's disease","high_causes":"Gout, kidney disease, high purine diet, alcohol, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate). However, Anthony's potassium was not individually reported in this panel, so this calculation has been performed using the standard formula with the available electrolytes. The result of 24.2 appears elevated above the 8 to 16 range. This may be influenced by the low chloride at 95 and the borderline-low bicarbonate at 21.8, both of which reduce the denominator and inflate the gap. Without a confirmed potassium value, this result should be interpreted with caution. If the GP is investigating the calcium finding, a full electrolyte panel including potassium and phosphate would clarify this.","low_causes":"Laboratory error, hypoalbuminaemia","high_causes":"Metabolic acidosis, ketosis, lactic acidosis, renal failure, toxin ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.6190","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. It reflects both protein intake and kidney filtration ability. Anthony's urea at 6.8 is within the optimal range, suggesting healthy kidney function and adequate, though not excessive, protein intake.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein intake, GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6026","units":"umol/l","description":"Creatinine is a waste product of muscle metabolism, filtered by the kidneys at a constant rate. It is used to estimate kidney function. Anthony's creatinine at 86 is in the optimal range and consistent with a healthy, active 43-year-old male.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate measures how much blood the kidneys filter per minute and is the primary measure of kidney function. Anthony's creatinine-based eGFR is reported as above 90, indicating healthy kidney filtration. At 43, this is exactly where it should be.","low_causes":"Chronic kidney disease, dehydration, kidney injury, certain medications","high_causes":"Hyperfiltration (early diabetes, high protein intake)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.775","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR provides an alternative estimate of kidney function using Cystatin C, a protein produced by all nucleated cells at a constant rate. It is more reliable than creatinine-based eGFR because it is not affected by muscle mass, diet, or exercise. Anthony's Cystatin C eGFR at 93 confirms healthy kidney function and closely agrees with his creatinine-based eGFR, providing strong confidence in this result.","low_causes":"Chronic kidney disease, kidney injury","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/l","description":"Cystatin C is a small protein filtered by the kidneys. When the kidneys are not filtering well, Cystatin C accumulates in the blood. Anthony's Cystatin C at 0.99 is within the optimal range and confirms his kidneys are filtering effectively.","low_causes":"","high_causes":"Reduced kidney function, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"147","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/L","description":"Haemoglobin is the iron-containing protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Anthony's haemoglobin at 147 is within the optimal range for a male, confirming adequate oxygen-carrying capacity and ruling out anaemia.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, smoking, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures the total number of red blood cells in the blood. Anthony's RBC at 4.75 is within the optimal range, consistent with his healthy haemoglobin and confirming adequate red blood cell production despite the mildly low reticulocyte count.","low_causes":"Anaemia, blood loss, bone marrow suppression, nutritional deficiency","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.432","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"l/l","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Anthony's haematocrit at 0.432 is within the optimal range and confirms a healthy balance between red blood cells and plasma volume.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"90.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4778","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6000","units":"fl","description":"MCV, or mean corpuscular volume, measures the average size of red blood cells. Small cells suggest iron deficiency, while large cells suggest B12 or folate deficiency. Anthony's MCV at 90.8 is mid-range and optimal, confirming that his red blood cells are a normal, healthy size.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12/folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"pg","description":"MCH, or mean corpuscular haemoglobin, measures the average amount of haemoglobin in each red blood cell. Anthony's MCH at 30.8 is within the optimal range, confirming that each red blood cell is carrying an appropriate amount of oxygen-transporting haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12/folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"339","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, measures the average concentration of haemoglobin within each red blood cell. Anthony's MCHC at 339 is within the optimal range, confirming that haemoglobin is being packed into his red blood cells at the correct density.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"12.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"RDW, or red cell distribution width, measures how much variation there is in the size of red blood cells. A high RDW can indicate mixed nutritional deficiencies or recent blood loss. Anthony's RDW at 12.3 is within the optimal range, confirming that his red blood cells are being produced consistently and uniformly in size.","low_causes":"","high_causes":"Iron deficiency, B12/folate deficiency, mixed deficiency, haemolysis, recent blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"155","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3526","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small cell fragments that enable blood clotting. Anthony's platelets at 155 are within the laboratory range but sit just above the lower limit of 150 and below the optimal floor of 175. The body appears to be compensating by producing slightly larger platelets, reflected in the marginally elevated MPV. In the context of his multi-lineage mild suppression pattern, this adds to the picture of bone marrow economising under low energy availability. His platelets are not dangerously low and clotting function should be unaffected.","low_causes":"Viral infection, bone marrow suppression, autoimmune conditions, medications, alcohol, nutritional deficiency","high_causes":"Infection, inflammation, iron deficiency, splenectomy, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6990","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV, or mean platelet volume, measures the average size of platelets. Larger platelets tend to be younger and more metabolically active. Anthony's MPV at 10.2 is marginally above the upper limit of 10.1. When platelet count sits at the lower end, the body compensates by producing larger, more active platelets, which is exactly what this reflects. At a margin of 0.1 above range, this is physiological compensation rather than a concern.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Compensatory response to low platelet count, platelet consumption, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3617","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. Anthony's WBC at 4.77 is within the laboratory range of 4 to 10 but below the optimal floor of 5. While technically in range, this low-normal count, combined with low neutrophils, very low monocytes, and low eosinophils, forms a pattern consistent with the bone marrow operating in an energy-conserving mode. This is not immunodeficiency, but it does mean his immune reserves are running leaner than ideal.","low_causes":"Low energy availability, viral infection, bone marrow suppression, medications, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"1.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2713","lower_normal":"2","upper_normal":"7","lower_optimal":"2","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and serve as the body's first line of defence against bacterial infection. They are produced in the bone marrow and have a short lifespan, making them sensitive to changes in energy availability and bone marrow output. Anthony's neutrophils at 1.81 are below the lower limit of 2.0. This mild neutropenia, combined with his low monocytes and eosinophils, is consistent with the bone marrow reducing production across multiple cell lines due to low energy availability. At this level he retains significant immune function, but he should be aware that his infection-fighting capacity is running below optimal.","low_causes":"Low energy availability, viral infection, medications, autoimmune neutropenia, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, producing antibodies and fighting viral infections. Anthony's lymphocytes at 2.88 are in the upper part of the optimal range. Interestingly, while his innate immune cells (neutrophils, monocytes, eosinophils) are suppressed, his adaptive immune system is running strongly. This pattern is consistent with the body prioritising long-term immune memory while economising on the shorter-lived innate immune cells.","low_causes":"Viral infection, immunodeficiency, steroid use, autoimmune disease","high_causes":"Viral infection, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1333","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that mature into macrophages in tissues, where they engulf and destroy pathogens, dead cells, and debris. They also play a role in presenting foreign material to the adaptive immune system. Anthony's monocytes at 0.04 are well below the lower limit of 0.2, representing the most suppressed of his white cell subsets. This level of monocytopenia is consistent with the multi-lineage bone marrow suppression pattern seen across his full blood count and is most likely driven by low energy availability.","low_causes":"Bone marrow suppression, low energy availability, aplastic anaemia, hairy cell leukaemia","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Anthony's eosinophils are reported as below 0.02, which sits at the very floor of the reference range. While the lab flagged this as abnormal, at this level it is consistent with the overall pattern of reduced innate immune cell production. Very low eosinophils on their own are not harmful and actually reflect a low allergy and parasitic burden, but they add to the multi-lineage picture.","low_causes":"Bone marrow suppression, cortisol elevation, acute stress, low energy availability","high_causes":"Allergies, parasitic infection, asthma, autoimmune disease, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3556","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6111","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and are involved in allergic and inflammatory responses. Anthony's basophils at 0.03 are within the optimal range. This is the one innate immune cell line that has maintained its normal level.","low_causes":"Acute allergic reactions, hyperthyroidism, steroid use","high_causes":"Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.7","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly released red blood cells that have just left the bone marrow. The reticulocyte percentage measures what proportion of circulating red blood cells are newly produced. Anthony's reticulocyte percentage at 0.93% is within the optimal range, indicating that the bone marrow is producing red blood cells at an adequate rate relative to the total red blood cell pool.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease","high_causes":"Haemolysis, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"44.175","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2398","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in circulation, rather than the percentage. Anthony's absolute count at 44.175 is below the lower limit of 50, indicating that the bone marrow is producing red blood cells at a slightly reduced rate in absolute terms. His haemoglobin remains healthy at 147, so the body has adequate red blood cells, but production is running slightly below its full capacity. This is consistent with the broader pattern of mild bone marrow conservation seen in his other cell lines.","low_causes":"Bone marrow suppression, low energy availability, nutritional deficiency, chronic disease","high_causes":"Haemolysis, blood loss, recovery from anaemia, erythropoietin therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil/Lymphocyte Ratio)","group":"HEMATOLOGY","result":"0.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1433","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is calculated by dividing the neutrophil count by the lymphocyte count. It is used as a marker of the balance between innate and adaptive immunity and as a proxy for systemic inflammation. Anthony's NLR at 0.63 is below the lower limit of 1.0, reflecting his low neutrophils relative to his healthy lymphocytes. A low NLR in this context is driven by the suppressed neutrophil count rather than an excess of lymphocytes, and is not in itself concerning. It confirms the immune cell imbalance already described.","low_causes":"Low neutrophils relative to lymphocytes, bone marrow suppression, low energy availability","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"32.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7292","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455","upper_optimal_position":"0.6162","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. It fluctuates significantly with meals and time of day. Anthony's serum iron at 32.5 is mildly above the upper limit of 31.3. This is most likely a transient elevation related to timing of his last meal relative to the blood draw. A single mildly elevated serum iron without a matching pattern in transferrin or iron binding capacity is not diagnostic of iron overload. It should be monitored on retest.","low_causes":"Iron deficiency, chronic disease, blood loss, malabsorption","high_causes":"Iron supplementation, haemochromatosis, liver disease, haemolysis, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"50.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5789","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures the percentage of the iron-transport protein transferrin that is currently carrying iron. It is one of the most important markers for detecting iron overload. Anthony's transferrin saturation at 50.36% is within the laboratory range of 18 to 55% but above the optimal ceiling of 40%. A saturation consistently above 45% can suggest hereditary haemochromatosis, a genetic condition where the body absorbs too much iron. However, his transferrin and iron binding capacity are both mid-range, which is reassuring. If the saturation remains above 45% on a repeat fasting sample, his GP should consider an HFE gene test.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6100","units":"g/L","description":"Transferrin is the main protein that transports iron in the blood. The body produces more transferrin when iron stores are low and less when they are adequate. Anthony's transferrin at 2.57 is in the optimal range, suggesting his body perceives its iron supply as adequate and is producing a normal amount of transport protein.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"60.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4694","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3520","upper_optimal_position":"0.6143","units":"umol/l","description":"Total iron binding capacity measures the total amount of iron that the blood's transferrin could carry if fully saturated. It reflects the body's iron transport capacity. Anthony's TIBC at 60.3 is within the optimal range, confirming that his iron transport system is functioning normally. In iron overload, TIBC is typically low, and in iron deficiency, it is high. His mid-range result is reassuring.","low_causes":"Iron overload, haemochromatosis, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"239","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5478","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5260","units":"ng/ml","description":"Ferritin is the body's iron storage protein, and its blood level reflects how much iron is held in reserve in the liver, spleen, and bone marrow. Anthony's ferritin at 239 is within the laboratory range for a man but above the optimal ceiling of 200. Ferritin can be elevated by inflammation, but his hs-CRP at 0.3 rules that out. In the context of his elevated serum iron and transferrin saturation above 50%, his ferritin adds another data point that suggests iron stores are generous. He should avoid iron supplements and have his iron studies repeated at his next blood test.","low_causes":"Iron deficiency, blood loss, vegetarian diet, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"20.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4517","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, mood, energy, libido, and body composition. Anthony's testosterone at 20.4 is within the optimal range of 18 to 30 for a man. This is a genuinely positive result for a 43-year-old who has been through major weight loss on a GLP-1 agonist, as both caloric restriction and significant weight loss can temporarily suppress testosterone production. His level suggests his hypothalamic-pituitary-gonadal axis is functioning well.","low_causes":"Ageing, obesity, low energy availability, chronic stress, sleep deprivation, medications, pituitary dysfunction","high_causes":"Exogenous testosterone, anabolic steroids, tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.369","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4920","lower_normal":"0.2","upper_normal":"0.55","lower_optimal":"0.3","upper_optimal":"0.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/l","description":"Free testosterone is the portion of testosterone that is not bound to proteins and is therefore biologically active, available to enter cells and exert its effects. It is calculated from total testosterone, SHBG, and albumin. Anthony's free testosterone at 0.369 is within the optimal range, confirming that not only is his total testosterone healthy, but an adequate proportion is available for use by his muscles, brain, and other tissues.","low_causes":"High SHBG, low total testosterone, ageing, obesity","high_causes":"Low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"42.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4938","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6113","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, reducing their biological availability. Anthony's SHBG at 42.9 is within the optimal range of 25 to 55. A mid-range SHBG means he is neither over-binding his testosterone (which would reduce free testosterone) nor under-binding it (which can occur with insulin resistance and obesity). This healthy SHBG is another marker of his improved metabolic health following weight loss.","low_causes":"Insulin resistance, obesity, type 2 diabetes, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, low caloric intake, oestrogen excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"47.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4546","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"","description":"The free androgen index is calculated as (total testosterone / SHBG) x 100 and provides an estimate of androgen availability. Anthony's FAI at 47.55 is within the optimal range, confirming that the balance between his testosterone production and SHBG binding is healthy.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"High testosterone, low SHBG, PCOS (females), exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2706","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4106","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen and plays important roles in men including bone health, brain function, and cardiovascular protection. Men produce oestradiol through the conversion of testosterone by the enzyme aromatase. Anthony's oestradiol at 79 is within the optimal range for a male, providing adequate oestrogen for bone and cardiovascular health without being excessive.","low_causes":"Low body fat, aromatase inhibitors, hypogonadism","high_causes":"Obesity, excess aromatase activity, liver disease, exogenous oestrogen","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3166","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is produced in small amounts in men by the adrenal glands and testes. It plays a minor role in balancing other hormones and may support sleep quality. Anthony's progesterone at 0.84 is marginally below the lower limit of 0.89. At this margin, the finding is of minimal clinical significance. Male progesterone levels are naturally low and variable, and this result does not indicate a hormonal problem.","low_causes":"Adrenal insufficiency, low cholesterol availability, caloric restriction","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, exogenous progesterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4545","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3397","upper_optimal_position":"0.6154","units":"mIU/ml","description":"LH is a pituitary hormone that stimulates the testes to produce testosterone. It serves as a communication signal between the brain and the testes. Anthony's LH at 5.03 is mid-range and optimal, confirming that the pituitary gland is sending appropriate signals and the feedback loop between brain and testes is functioning well.","low_causes":"Pituitary dysfunction, exogenous testosterone, high stress, low energy availability","high_causes":"Primary hypogonadism, ageing, testicular failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"10.47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5375","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5291","units":"mIU/ml","description":"FSH is a pituitary hormone that in men supports sperm production. Anthony's FSH at 10.47 is within the laboratory range but above the optimal ceiling of 8. A mildly elevated FSH can reflect subtle changes in testicular feedback and is seen with ageing, though 43 is relatively young for this. In the context of healthy testosterone and LH, this is not clinically concerning but is noted.","low_causes":"Pituitary dysfunction, exogenous testosterone, high stress","high_causes":"Ageing, testicular dysfunction, primary hypogonadism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"121","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4101","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3384","upper_optimal_position":"0.5556","units":"uIU/ml","description":"Prolactin is a pituitary hormone primarily known for stimulating milk production in women, but it also plays roles in immune regulation, metabolism, and reproductive function in men. Very high prolactin can suppress testosterone and libido. Anthony's prolactin at 121 is within the laboratory range and not elevated enough to affect testosterone or reproductive function.","low_causes":"Dopamine agonist medications","high_causes":"Stress, pituitary tumour, medications, hypothyroidism, chest wall stimulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"260","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4080","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5817","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, released by the adrenal glands in a circadian pattern with the highest levels in the morning. It regulates blood sugar, immune function, inflammation, and the stress response. Anthony's morning cortisol at 260 is within the optimal range. It sits in the lower half of the range, which in the context of chronic sleep deprivation below 6 hours is worth noting, as the body may be running with a somewhat flattened cortisol rhythm. However, a single morning measurement cannot confirm this.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, sleep deprivation, excessive exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3640","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3609","upper_optimal_position":"0.5745","units":"umol/L","description":"DHEA-S is a precursor hormone produced by the adrenal glands that converts into testosterone and oestrogen. It is often considered a marker of adrenal reserve and biological ageing, as levels naturally decline with age. Anthony's DHEA-S at 3 umol/L, equivalent to approximately 1,105 ug/dL, is within the laboratory range but below the optimal floor of 4. For a 43-year-old, a slightly below-optimal DHEA-S may reflect the adrenal effects of chronic sleep restriction and caloric restriction. Despite this, his downstream testosterone production is healthy.","low_causes":"Ageing, adrenal insufficiency, chronic stress, caloric restriction","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5833","units":"pmol/l","description":"FT4, or free thyroxine, is the main hormone produced by the thyroid gland. It is converted into the more active T3 in tissues throughout the body. Anthony's FT4 at 19.5 is in the upper part of the optimal range of 14 to 20, confirming strong thyroid hormone production. This, combined with his healthy TSH, shows his thyroid is functioning well.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3714","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4729","units":"mIU/l","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland to regulate the thyroid. When thyroid hormones are low, TSH rises to stimulate more production, and when they are adequate, TSH stays low. Anthony's TSH at 1.16 is within the optimal range of 1.0 to 2.5, indicating that his pituitary is content with his thyroid hormone levels and the feedback loop is working correctly.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"FT3, or free triiodothyronine, is the active thyroid hormone that drives metabolism, energy production, and body temperature regulation in every cell. Anthony's FT3 at 5.3 is comfortably within the optimal range of 4.5 to 6.5. This is particularly reassuring because caloric restriction and weight loss can suppress T3 as the body attempts to conserve energy. His healthy FT3 suggests his thyroid conversion is functioning well despite his lower caloric intake.","low_causes":"Caloric restriction, chronic illness, hypothyroidism, selenium deficiency","high_causes":"Hyperthyroidism, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies that attack the thyroid peroxidase enzyme, which is essential for thyroid hormone production. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Anthony's TPO antibodies at below 6.6 are well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid gland to produce thyroid hormones. Like TPO antibodies, their presence can indicate autoimmune thyroid disease. Anthony's thyroglobulin antibodies at below 1.3 are well within range and confirm no autoimmune thyroid process.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"117","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone that regulates calcium absorption, bone health, immune function, and mood. It is produced in the skin in response to sunlight and obtained from diet and supplements. Anthony's vitamin D at 117 is excellent, sitting within the optimal range of 75 to 120 nmol/L. This is particularly important given his low calcium finding, as vitamin D deficiency would worsen calcium absorption. His healthy vitamin D level rules out one of the common causes of hypocalcaemia.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, winter months","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"390","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4174","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4559","upper_optimal_position":"0.6120","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and neurotransmitter metabolism. It is obtained primarily from animal foods. Anthony's B12 at 390 is within the laboratory range but below the optimal floor of 500. Suboptimal B12 can contribute to fatigue, low mood, and impaired cognitive function, all of which align with Anthony's reported symptoms. GLP-1 medications can reduce nutrient absorption by slowing gastric emptying, and intermittent fasting with a diet volume of 5 out of 10 may limit B12 intake. Sublingual methylcobalamin supplementation bypasses the gut and would be the most effective way to raise this level.","low_causes":"Vegetarian/vegan diet, malabsorption, GLP-1 medication, pernicious anaemia, low intake","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4048","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, cell division, and methylation, a biochemical process that produces neurotransmitters, repairs DNA, and recycles the amino acid homocysteine. Anthony's folate at 7 is within the laboratory range but just below the optimal floor of 8. Suboptimal folate alongside suboptimal B12 may impair methylation efficiency, potentially contributing to his low mood and fatigue. Good dietary sources include dark leafy greens, legumes, and cruciferous vegetables. Supplementing with methylfolate, the active form, would help bring this into the optimal range.","low_causes":"Low vegetable intake, alcohol, malabsorption, GLP-1 medication, caloric restriction","high_causes":"Supplementation, fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Intact Parathormone","group":"VITAMINS & NUTRIENTS","result":"0.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2027","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.6140","units":"pmol/L","description":"Parathyroid hormone is released by four small glands behind the thyroid to regulate calcium, phosphate, and vitamin D metabolism. When calcium drops, PTH should rise to pull calcium from bone, increase gut absorption, and reduce kidney excretion. Anthony's PTH at 0.6 is below the lower limit of 0.98, and critically, it is low at the same time as his calcium is low. The appropriate physiological response to low calcium would be a high PTH. The fact that PTH is suppressed suggests the parathyroid glands are not functioning as they should. This combination is called hypoparathyroidism and requires GP investigation. The lab notes that PTH results should be viewed with caution if not centrifuged and separated on the day of sampling, so a repeat on a fresh, properly handled sample is the first step.","low_causes":"Hypoparathyroidism, post-surgical damage to parathyroids, magnesium deficiency, sample handling","high_causes":"Hyperparathyroidism, vitamin D deficiency, chronic kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"106","within_normal":"TRUE","within_optimal":"TRUE","result_po   if (b.within_normal === 'FALSE') return 'flag';

  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
