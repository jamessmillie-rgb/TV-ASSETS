<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Anthony Mayer","dob":"11/01/1983","report_date":"2026-08-18","summary":"Anthony is a 43-year-old male presenting with a BMI of 25.1, following an intermittent fasting protocol rated 8 out of 10 for quality with a volume of 5 out of 10. He trains 8 times per week, split evenly between 4 cardio and 4 resistance sessions, with 5,000 to 7,500 daily steps. He has been on Mounjaro, a GLP-1 receptor agonist, for 18 months and has lost an extraordinary 9 stone during that period. He reports difficulty losing further weight, low mood and anxiety, and joint pain and stiffness. His goals are to lose body fat, build muscle, and balance his hormones. He sleeps fewer than 6 hours most nights.\n\nThe finding that needs to go to his GP before anything else in this report is his corrected calcium. At 1.93, it sits significantly below the lower limit of 2.2. Calcium is the mineral the body uses for muscle contraction, nerve signalling, heart rhythm, and bone structure. The body guards its calcium level extremely tightly, and when it drops, the parathyroid glands, four small glands behind the thyroid, release parathyroid hormone (PTH) to pull calcium back up from bone, gut, and kidneys. Anthony's PTH is 0.6, which is also below the lower limit of 0.98. This combination, low calcium with low PTH, is called hypoparathyroidism, and it means the parathyroid glands are not responding to the low calcium the way they should. There are a few possible explanations. One is that rapid, substantial weight loss can deplete magnesium and calcium stores, and GLP-1 medications can reduce nutrient absorption by slowing gastric emptying. Another is that the sample may have degraded slightly in transit, as the lab itself flags that calcium can be falsely reduced in older specimens. However, even accounting for some laboratory artefact, the degree of suppression alongside a suppressed PTH is unusual enough that Anthony should have this repeated on a fresh, same-day-processed sample through his GP, and the GP should investigate his parathyroid function directly. His magnesium at 1.1 is right at the top of the laboratory range, which is reassuring because low magnesium is one of the causes of suppressed PTH, and that does not appear to be happening here. His vitamin D is excellent at 117, so poor vitamin D status is not driving this either. The GP should repeat corrected calcium, PTH, ionised calcium if available, phosphate, and a fresh magnesium.\n\nTurning to what is working well, and there is a great deal to feel good about here. Anthony has lost 9 stone and brought his BMI down to 25.1, which is a genuinely remarkable achievement. His metabolic health reflects that transformation. His fasting glucose at 4.8 is within the optimal window, and his HbA1c, which measures average blood sugar over the preceding three months, is 36 mmol/mol, right at the top of the optimal zone. His fasting insulin at 3.07 is low and healthy, and his HOMA-IR, a calculated score that estimates how sensitive the body's cells are to insulin, is 0.65, which is excellent and confirms strong insulin sensitivity. For someone who was clearly carrying significant excess weight 18 months ago, this metabolic profile is outstanding. His inflammation marker hs-CRP, which measures background vascular inflammation, is 0.3, well inside the optimal zone of below 1.0. His ESR, another inflammation marker measuring how quickly red blood cells settle in a tube, is below 2, which is as low as it gets. Together, these confirm there is no systemic inflammatory process running. His thyroid is working well. TSH at 1.16 is in the optimal range, free T4 at 19.5 is in the upper part of the optimal window, and free T3 at 5.3, the active thyroid hormone that drives metabolism, is comfortably optimal. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His kidney function is solid, with a Cystatin C-derived eGFR of 93, and his creatinine-based eGFR is above 90. Cystatin C is a more reliable kidney marker than creatinine because it is not affected by muscle mass. His liver panel is reassuring. AST at 29 and GGT at 31 are well within range, his FIB-4 score at 1.26 is below the threshold, and his bilirubin, albumin, and total protein are all healthy. His ALT at 41 is within the laboratory reference range of below 56, but it sits above the tighter optimal threshold of below 30 for men, so while it is not alarming, it is worth watching on a future retest. Lipase at 60 sits right at the upper boundary of its range, which is worth noting but not concerning in isolation. His amylase at 60 is mid-range and healthy. His prostate markers are excellent, with a PSA of 0.91 against a limit of 2.5 and a free PSA ratio of 0.396, which is strongly reassuring. His tumour markers CEA and CA 19-9 are both very low. His testosterone at 20.4 is within the optimal range of 18 to 30 for a man, and his free androgen index at 47.55 is healthy. SHBG, the protein that binds testosterone and reduces its availability, is 42.9, comfortably mid-range. These are genuinely good hormone numbers for a 43-year-old man who has been through major weight loss. His DHEA-S, a precursor hormone produced by the adrenal glands, converts to 1,105.5 ug/dL, which is within range. His cortisol at 260 is within the expected morning window. His immune system markers, IgG, IgM, IgA, and IgE, are all within their laboratory ranges, and his rheumatoid factor is negative, which is particularly reassuring given his joint pain symptoms. His coeliac screen is negative. His total antioxidant activity at 1.47 is healthy. His creatine kinase at 106, an enzyme released when muscle is damaged or worked hard, is well within range, suggesting his training load is being managed without excessive muscle breakdown. His triglycerides at 0.8 are excellent, and his HDL at 1.6 is in the optimal zone for a man, giving him a TG/HDL ratio of 0.5, which is outstanding and one of the strongest markers of metabolic health.\n\nHowever, the lipid picture is not entirely straightforward, and this is where his Lp(a) result changes the conversation significantly. Lp(a), pronounced lipoprotein little a, is a genetically inherited form of LDL cholesterol that the body produces at a fixed rate determined entirely by DNA. It cannot be changed through diet, exercise, or lifestyle. Anthony's Lp(a) is 176.16 nmol/L, which places him in the moderate to high risk category. Lp(a) particles are particularly harmful because they carry cholesterol into artery walls just like regular LDL, but they also promote blood clotting and drive inflammation at the vessel lining. This is a permanent part of his medical record and should be shared with his GP. His first-degree relatives, parents, siblings, and children, should also be tested. Alongside this, his LDL cholesterol at 3.57 is above the 3.0 upper limit, his ApoB, which counts the total number of cholesterol-depositing particles in the blood, is 1.24, well above the 0.9 target and classified as high, and his ApoB to ApoA-I ratio at 0.91 is above the 0.7 threshold. His total cholesterol at 5.5 is above the desirable level of 5.18, and his remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.33, which is actually within the optimal zone. The critical question is how much of his elevated ApoB is being driven by his Lp(a). With an Lp(a) this high, a meaningful proportion of those ApoB particles are Lp(a) particles that no lifestyle change can remove. The modifiable portion, driven by diet and metabolic factors, is likely smaller than the headline number suggests. Nonetheless, his GP should be aware of the full picture, and there are still meaningful dietary and supplementation steps he can take to reduce the modifiable LDL fraction, which we cover below.\n\nHis full blood count reveals a pattern that deserves attention. His neutrophils, the most abundant white blood cell and the body's first-line defence against bacterial infection, are 1.81, below the lower limit of 2.0. His monocytes, another type of immune cell involved in clearing debris and fighting infection, are 0.04, well below the lower limit of 0.2. His eosinophils, which are involved in allergic and parasitic responses, are reported as below 0.02, which the lab has flagged as abnormal. His reticulocytes, which are newly produced red blood cells released from the bone marrow, are 44.175 in absolute terms, below the lower limit of 50. Taken individually, each of these could be a minor variation. Taken together, they form a pattern that is consistent with the bone marrow producing at a slightly reduced rate across multiple cell lines. In a 43-year-old who has lost 9 stone, is intermittent fasting with a diet volume of only 5 out of 10, training 8 times per week, and sleeping fewer than 6 hours most nights, the most likely explanation is that the body is in a state of low energy availability. When the body is not receiving quite enough total energy relative to what it is burning, it economises by quietly downgrading the functions it can survive without in the short term, and immune cell production is one of the first things to be dialled back. The GLP-1 medication will be contributing to this by suppressing appetite and potentially reducing nutrient absorption. His overall white cell count at 4.77 is still within range, and his haemoglobin at 147 is healthy, so this is not an emergency, but it is a signal that his body would benefit from more fuel. His platelets at 155 are just above the lower limit of 150, and his MPV, the average size of his platelets, at 10.2 is marginally above the upper limit of 10.1. When platelet count is at the lower end, the body often compensates by producing slightly larger, more active platelets, which is exactly what the MPV reflects. This is not a concern in itself but fits the same pattern of the marrow running slightly lean.\n\nHis C-Peptide is 0.31 ug/L, which converts to approximately 102.6 pmol/L, well below the lower limit of the range. C-Peptide is released by the pancreas in equal measure to insulin and is used as a marker of how much insulin the pancreas is actually producing. In the context of a normal fasting glucose, a normal HbA1c, and an excellent HOMA-IR, a low C-Peptide most likely reflects genuinely low insulin demand rather than pancreatic insufficiency. Anthony is eating in a time-restricted window, has excellent insulin sensitivity, and is on a GLP-1 agonist that reduces glucose excursions, so his pancreas simply does not need to produce much insulin. The lab also notes that samples not separated within four hours can degrade C-Peptide levels to 44% of baseline, so the true value may be somewhat higher. This should be noted but does not require urgent action.\n\nHis serum iron at 32.5 is above the upper limit of 31.3, and his transferrin saturation at 50.36% is within the laboratory range but sits above the optimal ceiling of 40%. His ferritin at 239 is within the laboratory range for a man but above the optimal upper limit of 200. His transferrin at 2.57 and iron binding capacity at 60.3 are both mid-range and healthy. The mildly elevated serum iron is most likely a reflection of a recent iron-rich meal or the fasting window timing, and with his transferrin and binding capacity being completely normal, there is no pattern here suggestive of iron overload or haemochromatosis. However, given his transferrin saturation is in the upper zone, Anthony should avoid iron supplements and should have his iron studies repeated at his next blood test. If the saturation remains above 45% on a confirmed fasting sample, his GP may consider an HFE gene test to rule out hereditary haemochromatosis.\n\nHis uric acid at 170 is below the lower limit of 220. Uric acid is produced when the body breaks down purines from food and from its own cells. Low levels are common during rapid weight loss and in people with lower caloric intake, and the GLP-1 medication may also be contributing by increasing uric acid excretion through the kidneys. At this level it is not harmful, but it adds to the picture of a body running with tight energy reserves.\n\nHis vitamin D at 117 is excellent, sitting comfortably in the optimal range of 75 to 120. His B12 at 390 is within the laboratory range but below the optimal floor of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism, and given his symptoms of low mood and fatigue, bringing this into the optimal range would be worthwhile. His folate at 7 is within the laboratory range of 3 to 17 but just below the optimal floor of 8. Folate works alongside B12 in methylation, the biochemical process that builds neurotransmitters, repairs DNA, and recycles homocysteine. With both B12 and folate sitting below optimal, his methylation cycle may not be running at full efficiency, and improving both could support mood and energy.\n\nHis progesterone at 0.84 is marginally below the lower limit of 0.89. In men, progesterone is produced in small amounts and plays a role in balancing other hormones and supporting sleep. At this margin, the finding is of minimal clinical significance, particularly in the context of otherwise healthy hormone levels.\n\nHis urine shows 20 white blood cells per microlitre, which is above the threshold of 10 considered not significant. This could indicate a low-grade urinary tract infection or prostate-related inflammation, though the nitrites are negative, which makes bacterial infection less likely. The bacterial count and culture results are pending and will clarify this. If Anthony is experiencing any urinary symptoms, such as frequency, urgency, or discomfort, he should mention this to his GP.\n\nAnthony's joint pain and stiffness are worth connecting to the broader picture. His rheumatoid factor is negative and his inflammatory markers are very low, which makes inflammatory arthritis unlikely. At 43, having lost 9 stone, joint pain is commonly related to the mechanical changes the body undergoes during rapid weight loss, changes in gait, altered loading patterns, and reduced cushioning. Chronic sleep restriction below 6 hours also impairs the body's ability to repair connective tissue overnight. His low mood and anxiety are likely multifactorial. Sleep deprivation below 6 hours is one of the strongest drivers of anxiety and low mood, independent of any blood marker. His below-optimal B12 and folate may be contributing. The psychological adjustment to major body composition change is also a recognised factor. His difficulty losing further weight at BMI 25.1 is expected, as the body's set-point mechanisms and metabolic adaptation make continued loss progressively harder, particularly on a GLP-1 agonist where appetite suppression may be reducing total caloric intake below what is needed to support his training volume and recovery.","links":"Anthony's most important next step is a GP visit to investigate his calcium and parathyroid findings. He should bring these specific numbers: corrected calcium 1.93 (range 2.2 to 2.6), PTH 0.6 (range 0.98 to 4.73). The GP should repeat corrected calcium, PTH, phosphate, and ionised calcium on a fresh, same-day-processed sample. He should also mention his Lp(a) result of 176.16 nmol/L (limit below 32) and his ApoB of 1.24 g/L (target below 0.9) so that his cardiovascular risk can be assessed in full context. The GP should record his Lp(a) permanently in his medical notes. If urinary culture returns positive, the GP should be made aware of the 20 WBCs in his urine sample.\n\nFor his cardiovascular risk, the modifiable portion of his lipid profile can be improved. He should aim for 2 to 3 portions of oily fish per week, such as salmon, mackerel, sardines, or trout, providing long-chain omega-3 fatty acids that reduce ApoB particle number and triglycerides. He should increase soluble fibre intake to 10 to 15 grams per day through oats, beans, lentils, flaxseed, and psyllium husk, as soluble fibre binds bile acids in the gut and forces the liver to pull LDL cholesterol from the blood to make more. He should reduce saturated fat from red meat, butter, cheese, and coconut oil, replacing with olive oil, avocado, and nuts.\n\nFor his energy, mood, and recovery, the single most impactful change Anthony can make is increasing his sleep to 7 hours or more per night. Sleep below 6 hours impairs immune function, slows muscle recovery, elevates cortisol, worsens mood and anxiety, reduces testosterone production, and impairs the body's ability to clear metabolic waste. Practical steps include setting a fixed wake time 7 days a week, getting outside within an hour of waking for natural light exposure, cutting caffeine after midday, keeping the bedroom cool at around 18 degrees Celsius, and avoiding screens for 30 to 60 minutes before bed. If sleep duration is being limited by schedule rather than insomnia, he should work backwards from his wake time and protect a 7.5-hour sleep window.\n\nFor his nutrition, Anthony's current diet quality is strong at 8 out of 10, but his volume at 5 out of 10 is likely too low for his training load. At 84 kg with 8 training sessions per week, his estimated maintenance calories are approximately 2,500 to 2,700 per day, using a moderate to high activity multiplier. If his goal is continued fat loss, a deficit of 300 to 400 calories would give a target of 2,100 to 2,400 per day, with a protein floor of 135 to 170 grams per day to support muscle building and preserve lean mass during weight loss. He should not go below 2,000 calories per day given his training volume, as dropping further will worsen the low energy availability pattern his blood work is showing. This is particularly important while on Mounjaro, which can suppress appetite to the point where intake falls below what the body needs. If he is struggling to eat enough in his feeding window, he should consider widening it from a typical 16:8 to a 14:10 pattern, or prioritising calorie-dense nutrient-rich foods such as nuts, avocado, olive oil, oily fish, and eggs.\n\nFor his joint pain, given that inflammatory and autoimmune causes have been ruled out by his blood work, a physiotherapy assessment would help identify whether the pain is related to biomechanical changes from his weight loss. Omega-3 supplementation at therapeutic doses also has anti-inflammatory properties that may help. Collagen peptide supplementation at 10 to 15 grams daily has some evidence for supporting joint cartilage and connective tissue, particularly alongside vitamin C.\n\nAnthony should have his first-degree relatives tested for Lp(a), as this is inherited and each of his parents, siblings, and children has a 50% chance of carrying the same elevation.\n\nRecommended retest: 4 to 6 months, specifically repeating corrected calcium, PTH, phosphate, full blood count with differential, iron studies, ApoB, folate, B12, ALT, and C-Peptide on a confirmed separated-within-four-hours sample.","flags":"GP-URGENT: Corrected calcium 1.93 mmol/L (range 2.2 to 2.6), significantly below range. PTH 0.6 pmol/L (range 0.98 to 4.73), also below range. The combination of hypocalcaemia with inappropriately low PTH suggests hypoparathyroidism and requires investigation. Recommend repeat on fresh same-day-processed sample with ionised calcium and phosphate.\n\nLp(a) 176.16 nmol/L (limit below 32): genetically determined, places patient at moderate to high cardiovascular risk. Permanent medical record. First-degree relatives should be screened. No lifestyle modification alters Lp(a).\n\nApoB 1.24 g/L (target below 0.9), classified as high. LDL 3.57 mmol/L (limit 3.0). ApoB/A-I ratio 0.91 (limit 0.7). A significant proportion of the ApoB elevation is likely driven by Lp(a) particles, but the modifiable fraction should still be addressed through diet and potentially pharmacotherapy if lifestyle changes are insufficient.\n\nNeutrophils 1.81 (range 2.0 to 7.0), monocytes 0.04 (range 0.2 to 1.0), eosinophils below 0.02 (range 0.02 to 0.5), reticulocyte absolute 44.175 (range 50 to 100): multi-lineage mild suppression. Most likely low energy availability in the context of rapid weight loss, GLP-1 therapy, intermittent fasting with low volume intake, high training load, and chronic sleep restriction. Monitor on retest after nutritional optimisation.\n\nC-Peptide 0.31 ug/L (102.6 pmol/L, range 1.1 to 4.4 ug/L or 364 to 1,456 pmol/L): below range. In context of normal glucose, normal HbA1c, and excellent HOMA-IR, reflects low insulin demand rather than pancreatic failure. Lab notes sample degradation caveat. Repeat on properly handled sample if clinical concern.\n\nSerum iron 32.5 umol/L (range 11.6 to 31.3), mildly elevated. Transferrin saturation 50.36% (lab range 18 to 55, optimal below 40%). Ferritin 239 (range 22 to 322, optimal below 200). Transferrin and TIBC normal. No definitive iron overload pattern, but if transferrin saturation remains elevated on repeat, HFE gene testing should be considered.\n\nUric acid 170 umol/L (range 220 to 547): below range. Likely related to reduced purine intake during caloric restriction and possible increased renal excretion with GLP-1 therapy. Not clinically harmful.\n\nProgesterone 0.84 nmol/L (range 0.89 to 3.88): marginally below range. Minimal clinical significance in a male.\n\nMPV 10.2 fL (range 7.1 to 10.1): marginally above range. Consistent with compensatory platelet enlargement alongside low-normal platelet count. Not concerning.\n\nUrine WBCs 20 per microlitre (significant above 10): no nitrites detected. Bacterial culture pending. May represent low-grade UTI, prostate-related inflammation, or contamination. Review when culture returns.\n\nALT 41 IU/L: within lab range (below 56) but above male optimal of below 30. All other liver markers normal. Monitor.\n\nReassuring negatives: hs-CRP 0.3 (excellent), ESR below 2, thyroid function optimal with negative antibodies, PSA 0.91 with excellent free ratio, CEA and CA 19-9 very low, rheumatoid factor negative, coeliac screen negative, HbA1c 36, HOMA-IR 0.65, haemoglobin 147, eGFR 93 by Cystatin C, vitamin D 117.","recommendations":"1. GP visit as priority to investigate corrected calcium 1.93 and PTH 0.6. Request repeat corrected calcium, PTH, ionised calcium, and phosphate on fresh same-day sample. Bring this report.\n\n2. Record Lp(a) 176.16 nmol/L permanently in GP medical notes. Discuss cardiovascular risk in the context of elevated ApoB 1.24 alongside inherited Lp(a). Arrange Lp(a) testing for first-degree relatives.\n\n3. Increase total daily calorie intake to 2,100 to 2,400 kcal per day. If appetite suppression from Mounjaro makes this difficult, consider widening the eating window or choosing calorie-dense whole foods.\n\n4. Ensure protein intake of 135 to 170 grams per day to support muscle building and preserve lean mass.\n\n5. Increase sleep to a minimum of 7 hours per night. This is the single most impactful change for mood, recovery, immune function, and hormonal health.\n\n6. Increase oily fish to 2 to 3 portions per week. Increase soluble fibre to 10 to 15 grams per day. Reduce saturated fat intake.\n\n7. Begin sublingual methylcobalamin 1,000 mcg daily to bring B12 into the optimal range.\n\n8. Begin methylfolate 400 mcg daily to bring folate into the optimal range.\n\n9. Begin omega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily to support cardiovascular and joint health.\n\n10. If urinary culture returns positive, discuss with GP for treatment.\n\n11. Retest in 4 to 6 months: corrected calcium, PTH, phosphate, full blood count with differential, iron studies, ApoB, B12, folate, ALT, C-Peptide.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Anthony's B12 at 390 is below the optimal floor of 500. B12 supports nerve function, red blood cell production, and neurotransmitter synthesis, and improving it may help with his low mood and energy. Sublingual delivery bypasses the gut, which is important because GLP-1 medication slows gastric emptying and may reduce absorption of oral tablets.\n\nMethylfolate: 400 mcg daily, taken alongside B12. His folate at 7 is just below the optimal floor of 8. Folate and B12 work together in the methylation cycle, and supplementing one without the other can mask deficiency in the partner nutrient. Methylfolate is the active form and does not require conversion.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with his largest meal. This supports reduction of ApoB particle number, provides anti-inflammatory benefits for his joints, and may support mood. He should look for a product that specifies the EPA and DHA content per capsule rather than just total fish oil.\n\nMagnesium glycinate: 300 to 400 mg before bed. Although his serum magnesium is at the top of the laboratory range, magnesium glycinate supports sleep quality and duration, which is his most critical area for improvement. Glycinate is the preferred form because it is well absorbed and has a calming effect.\n\nVitamin D3: Anthony's vitamin D at 117 is excellent and in the optimal range. He should continue whatever supplementation or sun exposure he is currently getting. If he is supplementing, 2,000 IU daily through the autumn and winter months should maintain this level, taken with a fat-containing meal alongside vitamin K2.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with vitamin D. K2 directs calcium into bone and teeth and away from soft tissues and arteries, which is particularly relevant given Anthony's low calcium and the need to ensure any calcium replacement is properly directed.\n\nCollagen peptides: 10 to 15 grams daily, mixed into a drink or food, taken with a source of vitamin C to support absorption. This may help with his joint pain and stiffness by providing the amino acids used to rebuild cartilage and connective tissue.\n\nDO NOT take iron supplements. Anthony's serum iron is above range at 32.5, his transferrin saturation is in the upper zone at 50.36%, and his ferritin is above the optimal ceiling. Adding supplemental iron could push these higher and would be counterproductive.\n\nThe most important changes from this report are not supplements. They are increasing sleep to 7 or more hours per night, increasing total calorie and protein intake to match his training demands, and getting his calcium and parathyroid function investigated by his GP.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3661","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver health. Anthony's ALT at 41 is within the laboratory reference range of below 56 but sits above the tighter optimal threshold of below 30 for men. In the context of his otherwise clean liver panel, this mild elevation may reflect the metabolic remodelling that comes with rapid weight loss and intermittent fasting. It is worth monitoring on retest to ensure it trends downward.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, medication effects, excessive alcohol, intense exercise, metabolic stress","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5952","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is fairly specific to the liver, AST can be released from muscle tissue after intense exercise. Anthony's AST at 29 is comfortably within the optimal range and shows no sign of liver or muscle stress.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver damage, muscle damage, heart disease, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2123","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol intake, bile duct obstruction, and metabolic strain. It is often the first liver enzyme to rise when the liver is under pressure. Anthony's GGT at 31 is within the laboratory range but above the tighter optimal ceiling of 25 for men. This mild elevation is not concerning in isolation, particularly during a period of significant weight loss when the liver is processing large amounts of mobilised fat. All other liver markers being healthy provides strong reassurance.","low_causes":"","high_causes":"Alcohol consumption, liver disease, bile duct obstruction, metabolic syndrome, certain medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6103","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and gut. It is used as a marker of liver and bone health. Anthony's ALP at 48 is at the lower end of the reference range, which is a healthy finding and suggests no bile duct obstruction or abnormal bone turnover.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Liver disease, bile duct obstruction, bone disorders, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Anthony's bilirubin at 13 is mid-range and healthy, confirming that his liver is efficiently clearing this waste product and that there is no excessive red blood cell breakdown.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects liver synthetic function, kidney health, immune status, and nutritional adequacy. Anthony's total protein at 71 is well within range and suggests his liver is producing proteins effectively despite his caloric restriction.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic inflammation, infection, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications around the body and maintains fluid balance in blood vessels. Anthony's albumin at 44 is in the optimal range and confirms good liver synthetic function and adequate protein nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/l","description":"Globulin encompasses a group of proteins in the blood that include antibodies and transport proteins. Anthony's globulin at 27 is mid-range, confirming a healthy balance of immune and transport proteins.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic inflammation, infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between liver-produced albumin and immune-related globulins. Anthony's ratio of 1.63 is well within the optimal range and reflects healthy liver and immune function.","low_causes":"Liver disease, autoimmune conditions, chronic infection","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"1.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4345","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. Anthony's score of 1.26 is below the 1.3 threshold for his age, meaning liver fibrosis is unlikely. His platelets at 155, while in range, sit at the lower end, which can slightly inflate this score. Given that all his direct liver markers are healthy, his FIB-4 provides additional reassurance.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age-related calculation effect, low platelets","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4318","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6136","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. It is primarily used as a marker of pancreatic health. Anthony's amylase at 60 is mid-range and healthy, indicating no pancreatic inflammation or obstruction.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4894","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase and is the preferred marker for detecting pancreatic inflammation. Anthony's lipase at 60 sits exactly at the upper boundary of the laboratory range. While not above range, this borderline position means it cannot be classified as optimal. GLP-1 receptor agonists such as Mounjaro can mildly elevate lipase levels, and this is a recognised, usually benign, effect. With amylase being mid-range and no symptoms of pancreatitis, this is noted for monitoring rather than concern, but Anthony should mention any persistent upper abdominal pain radiating to the back to his GP.","low_causes":"","high_causes":"Pancreatitis, GLP-1 medication, gallstones, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5310","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL. Anthony's total cholesterol at 5.5 is above the desirable level of 5.18. However, total cholesterol is a crude measure that does not distinguish between harmful LDL particles and protective HDL. His HDL at 1.6 accounts for a healthy proportion of the total, meaning the concern lies specifically with his LDL and ApoB rather than total cholesterol as a whole.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2353","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary carbohydrate and sugar intake. They are a strong marker of metabolic health. Anthony's triglycerides at 0.8 are excellent, well within the optimal zone of below 1.0. This confirms that his intermittent fasting protocol and diet quality are keeping his metabolic machinery running efficiently.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar/refined carbohydrate intake, excess alcohol, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5769","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein, is the protective form of cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. Anthony's HDL at 1.6 is in the optimal range for a man, above the 1.4 optimal floor. This is a strong positive finding and reflects his regular cardiovascular exercise.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, metabolic syndrome","high_causes":"Regular exercise, genetic factors, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5950","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL, or low-density lipoprotein, is the form of cholesterol that deposits into artery walls and drives atherosclerosis over time. Anthony's LDL at 3.57 is above the upper limit of 3.0. A significant proportion of this elevation is likely driven by his very high Lp(a), which carries cholesterol particles that are counted within the LDL measurement but cannot be reduced through lifestyle changes. The modifiable portion should still be addressed through dietary changes, particularly increasing soluble fibre and omega-3 intake while reducing saturated fat.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Saturated fat intake, genetic factors including Lp(a), hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2308","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to the rest of the body. It is closely linked to triglyceride levels and metabolic health. Anthony's VLDL at 0.36 is well within the optimal range, consistent with his excellent triglyceride result and strong metabolic profile.","low_causes":"","high_causes":"High triglycerides, insulin resistance, excess carbohydrate intake, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic or artery-damaging cholesterol fractions in a single number. Anthony's non-HDL at 3.9 is within the laboratory reference but above the optimal ceiling of 3.4, consistent with his elevated LDL and ApoB. As with LDL, a portion of this is driven by his inherited Lp(a) elevation.","low_causes":"","high_causes":"Elevated LDL, elevated VLDL, genetic factors, dietary factors","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3822","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol and is used as a quick cardiovascular risk indicator. Anthony's ratio of 3.44 is within the optimal range of below 4.0, reflecting the protective effect of his strong HDL level. However, this ratio can be misleadingly reassuring when Lp(a) is elevated, so ApoB remains the more reliable measure of particle-driven risk.","low_causes":"","high_causes":"High total cholesterol, low HDL, poor metabolic health","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3636","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This represents the percentage of total cholesterol that is carried in the protective HDL fraction. Anthony's HDL makes up 29% of his total cholesterol, which is a healthy proportion and reflects good cardiovascular protection from his HDL levels.","low_causes":"Low HDL, elevated total cholesterol","high_causes":"High HDL relative to total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.3","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5417","upper_optimal_position":"1","units":"g/L","description":"ApoA-I is the main protein component of HDL cholesterol particles. It is a direct measure of the number of protective HDL particles in the blood. Anthony's ApoA-I at 1.36 is above the 1.2 minimum and within the optimal range, confirming good HDL particle number. This is used alongside ApoB to calculate the ApoB/A-I ratio, which is one of the most reliable cardiovascular risk metrics.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome","high_causes":"Regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein that sits on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this marker effectively counts the total number of atherogenic particles in the blood. It is the single best measure of particle-driven cardiovascular risk. Anthony's ApoB at 1.24 is classified as high, well above the 0.9 desirable limit and above the 0.8 optimal target. However, with an Lp(a) of 176.16, a substantial number of these ApoB particles are Lp(a) particles that cannot be reduced through lifestyle changes. The modifiable ApoB can be lowered through dietary changes including increased soluble fibre, omega-3 fatty acids, and reduced saturated fat. If these measures are insufficient, his GP may consider pharmacotherapy.","low_causes":"","high_causes":"Elevated LDL, elevated Lp(a), dietary saturated fat, genetic hypercholesterolaemia, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6500","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio compares the number of harmful cholesterol particles (ApoB) to protective ones (ApoA-I). It is one of the most powerful predictors of cardiovascular risk. Anthony's ratio of 0.91 places him in the higher risk category, above the 0.7 threshold. This ratio is elevated partly due to his genetically high Lp(a), which inflates his ApoB count. His ApoA-I at 1.36 is healthy, meaning the protective side of the equation is doing its job, but the atherogenic particle burden remains high.","low_causes":"","high_causes":"High ApoB, low ApoA-I, elevated Lp(a), poor metabolic health","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"176.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a) is a genetically inherited variant of LDL cholesterol. Unlike regular LDL, Lp(a) levels are determined almost entirely by DNA and cannot be meaningfully changed through diet, exercise, or lifestyle. Anthony's Lp(a) at 176.16 nmol/L is significantly elevated, placing him in the moderate to high risk category. Lp(a) is particularly harmful because it deposits cholesterol into artery walls, promotes blood clot formation, and drives inflammation at the vessel lining. This is a permanent finding and should be recorded in Anthony's medical notes. His first-degree relatives, including parents, siblings, and children, should be tested. The clinical significance is that a meaningful portion of his elevated LDL and ApoB is being driven by Lp(a) particles that are beyond lifestyle modification. There are emerging pharmaceutical treatments for Lp(a), and Anthony's GP may wish to keep this finding under review as these therapies become available.","low_causes":"","high_causes":"Genetic inheritance (not modifiable)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_chol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2063","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried in triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. It is an independent risk factor for cardiovascular disease. Anthony's remnant cholesterol at 0.33 is well within the optimal range of below 0.5, reflecting his excellent triglyceride and VLDL levels. This confirms that the atherogenic risk in his profile is concentrated in LDL and Lp(a) particles rather than triglyceride-rich remnants.","low_causes":"","high_causes":"High triglycerides, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is one of the most reliable markers of insulin resistance and metabolic health. It is calculated by dividing triglycerides by HDL cholesterol. Anthony's ratio of 0.50 is outstanding, well within the optimal zone of below 0.87. This confirms excellent metabolic flexibility and insulin sensitivity, and is one of the strongest positive findings in this report.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It is a snapshot of how well the body is managing blood sugar in that moment. Anthony's glucose at 4.8 is well within the optimal range of 4.0 to 5.4, confirming excellent blood sugar control. For someone who has undergone major weight loss, this is an outstanding metabolic result.","low_causes":"Excess insulin, prolonged fasting, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, infection, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the preceding two to three months. It provides a longer-term view of blood sugar control than a single fasting glucose reading. Anthony's HbA1c at 36 is at the optimal ceiling, confirming consistently well-controlled blood sugar over the past three months. Below 42 is normal, and his result sits well below that threshold.","low_causes":"Haemolytic anaemia, blood loss, iron deficiency","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance, high sugar intake","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4500","units":"%","description":"This is the same HbA1c measurement expressed as a percentage rather than in mmol/mol. Anthony's 5.4% is within the normal range of below 6.0% and at the optimal ceiling. Both units confirm excellent long-term blood sugar control.","low_causes":"Haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3511","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3244","upper_optimal_position":"0.4140","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. A low fasting insulin with normal blood sugar is the hallmark of excellent insulin sensitivity, meaning the body's cells respond strongly to small amounts of insulin. Anthony's insulin at 3.07 is within the optimal range of 2 to 8, confirming outstanding insulin sensitivity. This is one of the strongest metabolic markers in his report.","low_causes":"Type 1 diabetes, low carbohydrate intake, pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, obesity, metabolic syndrome, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0312","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-Peptide is released by the pancreas in equal amounts to insulin and is used as a stable measure of how much insulin the body is actually producing, because unlike insulin, C-Peptide is not cleared quickly by the liver. Anthony's C-Peptide at 0.31 ug/L, which converts to approximately 102.6 pmol/L, is below the lower limit of 1.1. However, this must be interpreted in the context of his normal glucose, normal HbA1c, and excellent insulin sensitivity. His pancreas simply does not need to produce much insulin because his cells are highly responsive to it. His intermittent fasting pattern and GLP-1 medication both contribute to reducing insulin demand. The lab also notes that C-Peptide can degrade significantly in samples not separated within 4 hours, so the true value may be higher. This finding should be noted and repeated on a properly handled sample if there is any clinical concern.","low_causes":"Low insulin demand, type 1 diabetes, GLP-1 medication, fasting, sample degradation","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":
