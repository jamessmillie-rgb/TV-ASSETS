lood vessels and tissues. At 40 g/L, Gwen's albumin is within the optimal range, confirming that her liver is producing protein normally. Albumin can fall during chronic inflammation, so maintaining a healthy level despite a CRP of 15.8 is a positive sign.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins are a group of proteins that include immunoglobulins (antibodies) and transport proteins. At 36 g/L, Gwen's globulin sits at the upper boundary of the laboratory range. Globulin can be mildly elevated during chronic inflammation or active immune responses, which is consistent with her inflammatory conditions. This is not a concern but it does reflect the immune system being active.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic inflammation, infection, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio (Calculated)","group":"LIVER & METABOLIC","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3381","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood. At 1.11, Gwen's ratio is just within the lower limit of the laboratory range. The slightly lower ratio reflects the globulin sitting at the top of range due to her inflammatory conditions, while albumin remains healthy. This is consistent with the clinical picture rather than indicating any new concern.","low_causes":"Chronic inflammation, liver disease, autoimmune conditions","high_causes":"Immune deficiency (reduced globulin production)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5476","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5619","units":"IU/L","description":"ALP is an enzyme found in the liver and bones. It rises with liver obstruction, bone disorders and during bone remodelling. At 91 IU/L, Gwen's ALP is within the laboratory range but just above the optimal ceiling of 90. Given her bone conditions, including degenerative disc disease and osteoarthritis, a mildly elevated ALP within the laboratory range likely reflects bone turnover rather than liver pathology, especially since her other liver markers are excellent.","low_causes":"Zinc deficiency, hypothyroidism, anaemia","high_causes":"Liver obstruction, bone disease, vitamin D deficiency, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. It is processed by the liver and excreted in bile. At 8 umol/L, Gwen's bilirubin is within the healthy range, confirming normal red blood cell turnover and healthy liver processing.","low_causes":"Not clinically significant when low","high_causes":"Liver disease, gallstones, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1518","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT, or alanine aminotransferase, is a liver enzyme that leaks into the bloodstream when liver cells are damaged. It is the most specific routine marker of liver cell health. At 17 IU/L, Gwen's ALT is well within the optimal range of under 25 for women. This is an excellent result that confirms her liver cells are healthy and under no metabolic strain, which at a BMI of 43.4 is genuinely reassuring. Non-alcoholic fatty liver disease is common at this BMI, and the clean ALT helps rule it out.","low_causes":"Not clinically significant when low","high_causes":"Fatty liver disease, viral hepatitis, medication toxicity, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4896","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5729","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart and muscles. At 30 IU/L, Gwen's AST is within the optimal range. Because AST is found in multiple tissues, a mildly elevated AST with a normal ALT can indicate muscle or cardiac strain rather than liver damage. In Gwen's case, both enzymes are healthy.","low_causes":"Not clinically significant when low","high_causes":"Liver disease, heart damage, muscle injury, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4448","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the risk of liver fibrosis, or scarring, using age, ALT, AST and platelet count. At 1.29, Gwen's score is within the safe threshold of under 1.45 and just within the optimal range. This indicates a low risk of significant liver fibrosis. The score should be managed in primary care and reassessed in two to five years.","low_causes":"Young age, very high platelets, very low liver enzymes","high_causes":"Advancing age, elevated liver enzymes, low platelets, liver fibrosis or cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1842","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic stress. At 14 IU/L, Gwen's GGT is well within the optimal range of under 25. At her BMI, this is an excellent result that confirms the liver is not under any metabolic or toxic strain. GGT is often one of the first markers to rise with fatty liver disease or regular alcohol consumption, and its being this clean is genuinely reassuring.","low_causes":"Not clinically significant when low","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. At 52 IU/L, Gwen's amylase is comfortably within the healthy range, confirming normal pancreatic function. Elevated amylase can indicate pancreatitis or other pancreatic disorders.","low_causes":"Chronic pancreatitis (late stage), pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5816","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. At 37 U/L, Gwen's lipase is within the healthy range, confirming normal pancreatic digestive function. It is more specific to the pancreas than amylase.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, pancreatic duct obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"135","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is the primary electrolyte that maintains fluid balance and blood pressure. At 136 mmol/L, Gwen's sodium is within the optimal range, indicating normal fluid and electrolyte balance.","low_causes":"Excess water intake, diuretics, heart failure, liver disease, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2564","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. At 94 mmol/L, Gwen's chloride is marginally below the lower limit of 95. Low chloride alongside low bicarbonate can suggest a mild metabolic disturbance, which in the context of chronic systemic inflammation is a recognised pattern. This is a minor finding that does not require specific intervention but contributes to the broader picture.","low_causes":"Chronic inflammation, vomiting, metabolic alkalosis, excessive sweating","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2788","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.5848","units":"mmol/L","description":"Bicarbonate is a buffer that helps the body maintain the correct pH of the blood. At 19.4 mmol/L, Gwen's bicarbonate is marginally below the lower limit of 20, suggesting a very mild metabolic acidosis. Chronic systemic inflammation can contribute to this, as can obesity. This is consistent with the broader clinical picture and does not require specific treatment.","low_causes":"Metabolic acidosis, chronic inflammation, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product of protein metabolism, filtered out of the blood by the kidneys. At 7.5 mmol/L, Gwen's urea is within the laboratory range but above the optimal ceiling of 7.0. Mild elevation can reflect higher protein intake, mild dehydration or early kidney functional changes. Given the Cystatin C eGFR of 77, this is consistent with mildly reduced kidney filtration and supports monitoring over time.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"High protein intake, dehydration, reduced kidney function, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4553","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product of muscle metabolism that is filtered by the kidneys at a relatively constant rate. At 63 umol/L, Gwen's creatinine is within the optimal range. However, creatinine is influenced by muscle mass, and at a higher BMI with no resistance training, it may underestimate kidney function decline. This is why the Cystatin C measurement is more informative in her case.","low_causes":"Low muscle mass, liver disease","high_causes":"Reduced kidney function, dehydration, high protein diet, high muscle mass","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimates how well the kidneys are filtering waste from the blood, calculated from creatinine, age, sex and ethnicity. At greater than 90 ml/min, Gwen's creatinine-based eGFR appears normal. However, this calculation relies on creatinine, which is produced by muscles. At a higher BMI with low muscle mass, creatinine can be misleadingly low, making eGFR appear better than it truly is. The Cystatin C-based eGFR of 77 is a more reliable measure in Gwen's case and suggests mildly reduced filtration.","low_causes":"Kidney disease, reduced blood flow to kidneys, dehydration, medications","high_causes":"High muscle mass, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.55","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a protein produced by all cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of true kidney function, particularly in people with very high or very low muscle mass. At 1.21 mg/L, Gwen's Cystatin C is above the threshold of 1.1, and the calculated Cystatin C eGFR of 77 suggests that her true kidney filtration rate is mildly below the ideal of above 90. At 48, a GFR of 77 is not alarming and does not constitute kidney disease, but it does warrant monitoring. Chronic systemic inflammation, as reflected by her CRP of 15.8, can affect kidney function, and reducing inflammation through the management of her underlying conditions may help preserve kidney function over time.","low_causes":"Hyperthyroidism, high corticosteroid levels","high_causes":"Reduced kidney function, inflammation, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"This is the estimated glomerular filtration rate calculated from Cystatin C rather than creatinine. At 77 ml/min, it is above the clinical concern threshold of 60 but below the optimal threshold of 90. This is likely the more accurate measure of Gwen's kidney function given her BMI and low muscle mass. It suggests mild early reduction in filtration capacity that may be partly driven by chronic inflammation and elevated BMI. Monitoring at subsequent tests is recommended.","low_causes":"Kidney disease, chronic inflammation, hypertension, obesity-related kidney stress","high_causes":"Hyperthyroidism, high corticosteroids","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"266","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5181","units":"umol/L","description":"Uric acid is a waste product of purine metabolism, filtered by the kidneys. At 266 umol/L, Gwen's uric acid is within the optimal range for women of 160 to 320. Elevated uric acid is associated with gout, kidney stones and cardiovascular risk. Given her inflammatory conditions, maintaining a healthy uric acid is a positive finding.","low_causes":"Low purine diet, medications","high_causes":"High purine diet (red meat, shellfish, alcohol), reduced kidney clearance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4424","upper_optimal_position":"0.5766","units":"mmol/L","description":"Magnesium is essential for over 300 enzymatic reactions in the body, including muscle relaxation, nerve function and sleep regulation. At 1.18 mmol/L, Gwen's magnesium is above the upper laboratory limit of 1.11 and above the optimal ceiling of 1.05. This is almost certainly from supplementation. Mildly elevated magnesium from supplements is not a clinical concern, but there is no benefit to levels above the optimal range, and she should consider reducing her magnesium supplement dose slightly to bring the level into the 0.85 to 1.05 optimal window.","low_causes":"Poor dietary intake, alcohol, diuretics, diabetes, chronic diarrhoea","high_causes":"Excessive supplementation, kidney disease (impaired excretion), antacids containing magnesium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"159","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"148","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6600","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 159 g/L, Gwen's haemoglobin is above the female upper limit of 150. Elevated haemoglobin means the body is producing more oxygen-carrying capacity than expected. The most common explanation in someone with a BMI of 43.4 and chronic sleep restriction is compensatory polycythaemia, where intermittent low oxygen levels during sleep, potentially from obstructive sleep apnoea, trigger the body to produce more red blood cells. This pattern should be discussed with her GP, and a sleep study may be appropriate.","low_causes":"Iron deficiency, chronic disease, blood loss, B12/folate deficiency","high_causes":"Chronic hypoxia (sleep apnoea, lung disease), dehydration, polycythaemia vera, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8600","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells in circulation. At 5.38, Gwen's count is above the female upper limit of 4.8, consistent with the elevated haemoglobin. Both findings point to the same explanation: the body is producing extra red cells, most likely in response to intermittent low oxygen levels. This reinforces the recommendation to discuss a sleep study with her GP.","low_causes":"Iron deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Chronic hypoxia, dehydration, polycythaemia vera, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.449","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5733","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.449, Gwen's haematocrit is within the laboratory range but above the optimal ceiling of 0.44, consistent with the elevated haemoglobin and red cell count. It sits close to the upper boundary, further supporting the pattern of compensatory red cell production.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Dehydration, chronic hypoxia, polycythaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"13.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5694","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5903","units":"%","description":"RDW, or red cell distribution width, measures the variation in size among red blood cells. At 13.3%, Gwen's RDW is within the optimal range, indicating that her red cells are uniform in size. This helps rule out iron deficiency, B12 or folate deficiency as causes of the elevated red cell indices, supporting the hypoxia-driven explanation.","low_causes":"Not clinically significant","high_causes":"Iron deficiency, B12/folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"83.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3611","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV, or mean corpuscular volume, measures the average size of red blood cells. At 83.5 fL, Gwen's MCV is just within the lower boundary of the laboratory range and below the optimal threshold of 85. A low-normal MCV can be an early indicator of iron depletion affecting red cell production, even before frank iron deficiency anaemia develops. With ferritin at 47 and transferrin saturation at 20.9%, both at the lower end of their ranges, this is consistent with iron stores that are adequate but not abundant.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 deficiency, folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"29.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"pg","description":"MCH, or mean corpuscular haemoglobin, measures the average amount of haemoglobin in each red blood cell. At 29.6 pg, Gwen's MCH is within the optimal range, confirming that each red cell is carrying a healthy amount of haemoglobin despite the MCV being at the lower boundary.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"355","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7778","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, measures the average concentration of haemoglobin within red blood cells. At 355 g/L, Gwen's MCHC is above the upper limit of 345. The lab noted that MCHC can be affected by temperature and storage conditions. A marginally elevated MCHC in isolation is most commonly a laboratory artefact. However, in the context of elevated haemoglobin and red cell count, it is consistent with the broader pattern of increased red cell production and supports the discussion about a possible sleep study.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact (temperature, storage), dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"270","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot and repair damaged blood vessels. At 270, Gwen's platelet count is within the optimal range, indicating normal clotting capacity and no signs of bone marrow suppression or excessive consumption.","low_causes":"Bone marrow suppression, medications, autoimmune destruction, liver disease","high_causes":"Iron deficiency, chronic inflammation, infection, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5889","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6556","units":"fL","description":"MPV, or mean platelet volume, measures the average size of platelets. Larger platelets tend to be younger and more active. At 9.4 fL, Gwen's MPV is within the optimal range, indicating normal platelet production and turnover.","low_causes":"Bone marrow suppression, older platelet population","high_causes":"Active platelet production, inflammation, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4764","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the bloodstream. At 6.59, Gwen's count is within the optimal range, indicating a healthy immune system that is neither suppressed nor overactivated.","low_causes":"Bone marrow suppression, viral infections, medications, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4540","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and form the first line of defence against bacterial infections. At 3.81, Gwen's neutrophils are within the optimal range, indicating a healthy innate immune response.","low_causes":"Viral infections, medications, autoimmune conditions, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5950","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for the adaptive immune response, including the production of antibodies and the destruction of infected or abnormal cells. At 2.57, Gwen's lymphocytes are within the optimal range, confirming a healthy adaptive immune system.","low_causes":"Viral infections (HIV, hepatitis), immunosuppressive therapy, steroid use","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2083","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that play a role in tissue repair and immune surveillance. They migrate into tissues where they become macrophages, engulfing debris and pathogens. At 0.14, Gwen's monocytes are marginally below the lower limit of 0.2. An isolated low monocyte count with all other white cell lines normal is rarely clinically significant and may reflect natural variation. It is worth noting but does not require specific action.","low_causes":"Natural variation, bone marrow suppression, corticosteroid use","high_causes":"Chronic inflammation, infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3472","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. At 0.04, Gwen's eosinophils are within the normal range, indicating no active allergic or parasitic response.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergic conditions, parasitic infections, asthma, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the least common white blood cells, involved in allergic and inflammatory responses. At 0.03, Gwen's basophils are within the normal range.","low_causes":"Not clinically significant when low","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_pct","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The reticulocyte percentage shows how actively the bone marrow is producing new red cells. At 1.34%, Gwen's reticulocyte percentage is within the normal range, indicating steady red cell production.","low_causes":"Bone marrow suppression, iron deficiency, chronic disease, B12/folate deficiency","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_abs","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"72.092","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in circulation, independent of the total red cell count. At 72, this is within the optimal range and confirms that the bone marrow is producing red cells at a normal rate. The elevated haemoglobin and red cell count are therefore due to reduced red cell destruction or chronic stimulation rather than acute overproduction.","low_causes":"Bone marrow suppression, nutritional deficiency","high_causes":"Active blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"20.92","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4081","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3522","upper_optimal_position":"0.5279","units":"%","description":"Transferrin saturation measures what percentage of the iron-carrying protein transferrin is loaded with iron. At 20.9%, Gwen's saturation is within the laboratory range but below the optimal band of 25 to 40%. This suggests that while she has adequate iron stores (ferritin 47), the available transport capacity is not fully utilised. The low transferrin level itself, driven by inflammation, complicates the interpretation because saturation is calculated as iron divided by total iron-binding capacity.","low_causes":"Iron deficiency, chronic inflammation (low transferrin), chronic disease","high_causes":"Iron overload, haemochromatosis, liver disease, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"12.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3822","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3473","upper_optimal_position":"0.5814","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the bloodstream at the time of the blood draw. At 12.4 umol/L, Gwen's iron is within the laboratory range but at the lower end. Serum iron fluctuates throughout the day and with recent food intake, so it is best interpreted alongside ferritin and transferrin saturation. The overall picture is one of adequate but not abundant iron availability.","low_causes":"Iron deficiency, chronic inflammation, poor dietary intake, blood loss","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2282","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3410","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. At 2.36 g/L, Gwen's transferrin is below the lower limit of 2.5. Transferrin is a negative acute phase reactant, meaning its production decreases during active inflammation. With a CRP of 15.8, the low transferrin is almost certainly driven by the inflammatory response from her ankylosing spondylitis rather than representing a primary problem with iron transport. If inflammation were controlled and the CRP came down, transferrin would be expected to normalise.","low_causes":"Chronic inflammation (negative acute phase response), iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"53.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6037","units":"umol/L","description":"TIBC, or total iron-binding capacity, measures the total capacity of transferrin to bind iron. At 53.4 umol/L, Gwen's TIBC is within the optimal range. TIBC is often elevated in iron deficiency and low in inflammation or iron overload. The normal result here suggests that despite the slightly low transferrin, the overall iron-binding capacity is adequate.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3465","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5176","units":"ng/mL","description":"Ferritin is the body's iron storage protein. At 47 ng/mL, Gwen's ferritin is within the female optimal range of 40 to 150, though at the lower end. Ferritin is also an acute phase reactant, meaning it rises during inflammation. Given her CRP of 15.8, the true iron stores may be somewhat lower than the ferritin suggests, because inflammation can artificially inflate the reading. However, the MCV at 83.5 and the transferrin saturation at 20.9% suggest that iron stores, while not abundant, are currently adequate. No iron supplementation is needed at this stage.","low_causes":"Iron deficiency, blood loss, inadequate dietary iron, heavy menstruation","high_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5565","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3929","upper_optimal_position":"0.5595","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. It circulates in the bloodstream and is converted into the active hormone T3 by tissues throughout the body. At 19 pmol/L, Gwen's FT4 is within the optimal range of 14 to 20, confirming strong thyroid hormone production. This rules out underactive thyroid as a contributor to her weight gain and fatigue.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4351","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4874","units":"mIU/L","description":"TSH, or thyroid-stimulating hormone, is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. It is the most sensitive marker of thyroid function. At 1.83 mIU/L, Gwen's TSH sits right in the optimal zone of 1.0 to 2.5, meaning the brain is satisfied with the amount of thyroid hormone being produced. This is an important finding at 48 with symptoms of weight gain and fatigue, as it definitively rules out thyroid dysfunction as a cause.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use to regulate metabolism, energy production and body temperature. At 5.1 pmol/L, Gwen's FT3 is within the optimal range of 4.5 to 6.5, confirming that her body is converting T4 to T3 effectively. Good T3 levels alongside optimal TSH and FT4 confirm a fully functioning thyroid.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, T3-containing medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are immune proteins that attack thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At less than 6.6 U/mL, well below the threshold of 13.8, Gwen's result is negative, ruling out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a precursor protein used in thyroid hormone production. Like TPO antibodies, their presence suggests autoimmune thyroid disease. At less than 1.3 U/mL, well below the 4.4 threshold, Gwen's result is negative. With both thyroid antibody tests negative, autoimmune thyroid disease is effectively ruled out.","low_causes":"No autoimmune thyroid disease (more than 80% of people have undetectable levels)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"121","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.605","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function and mood regulation. At 121 nmol/L, Gwen's vitamin D is above the sufficient threshold and just above the optimal ceiling of 120. This excellent level likely reflects supplementation. At her BMI, achieving this level is notable because fat tissue sequesters vitamin D, making it harder to maintain adequate levels. However, there is no additional benefit to levels above 120, and the suppressed PTH confirms the body is responding to the high vitamin D. She should reduce her supplementation to a maintenance dose of 2,000 IU daily to hold her level in the 75 to 100 sweet spot.","low_causes":"Insufficient sun exposure, inadequate supplementation, obesity (fat sequesters vitamin D), dark skin","high_causes":"Excessive supplementation, high sun exposure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"0.424","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1312","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3481","upper_optimal_position":"0.5680","units":"pmol/L","description":"PTH, or parathyroid hormone, is produced by the four small parathyroid glands behind the thyroid. It regulates calcium and phosphate levels by controlling calcium absorption from food, calcium release from bones, and calcium reabsorption in the kidneys. At less than 0.424 pmol/L, Gwen's PTH is suppressed below the lower limit of 0.98. The most likely explanation is her high vitamin D level of 121, which increases calcium absorption and signals the parathyroid glands to reduce PTH output. This is an expected physiological response rather than a sign of parathyroid gland disease. The lab noted that PTH can be affected if the sample was not centrifuged and separated on the day of collection, so the true value may be somewhat higher. Reducing her vitamin D supplementation to 2,000 IU daily should allow PTH to normalise, and this should be rechecked in six months.","low_causes":"High vitamin D levels, high calcium intake, hypoparathyroidism, sample handling","high_causes":"Vitamin D deficiency, low calcium, kidney disease, parathyroid adenoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"324","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3888","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4560","upper_optimal_position":"0.6116","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation and DNA synthesis. At 324 pg/mL, Gwen's B12 is within the laboratory range but below the optimal threshold of 500. Suboptimal B12 can contribute to fatigue, brain fog and low energy, all of which overlap with her current symptoms. B12 is best supplemented as sublingual methylcobalamin at 1,000 mcg daily, which dissolves under the tongue and bypasses any gut absorption issues.","low_causes":"Inadequate dietary intake, malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, works alongside B12 to support red blood cell formation, DNA synthesis and homocysteine metabolism. At 12 ng/mL, Gwen's folate is within the optimal range above 8, confirming good dietary intake. This is a positive finding that supports healthy red cell production and keeps homocysteine in check.","low_causes":"Inadequate dietary intake, malabsorption, alcohol, medications, pregnancy","high_causes":"Supplementation, high dietary intake of leafy greens","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"323","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4626","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"170","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5815","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and declining through the day. At 323 nmol/L, Gwen's cortisol is within the optimal morning range, indicating healthy adrenal function. This rules out adrenal insufficiency or excess cortisol production as contributors to her symptoms.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, prednisolone use, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"346","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"71.6","upper_normal":"1309.1","lower_optimal":"100","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5889","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, produced mainly by the ovaries. It regulates the menstrual cycle, supports bone density, protects cardiovascular health and influences mood, sleep and cognitive function. At 346 pmol/L, Gwen's oestradiol falls within the follicular and luteal phase ranges, indicating active ovarian function. This is not consistent with menopause, where levels fall below 118. However, in perimenopause, oestradiol can fluctuate significantly from cycle to cycle, so a single measurement cannot rule out early perimenopausal changes.","low_causes":"Menopause, perimenopause, low body fat, hypothalamic dysfunction, primary ovarian insufficiency","high_causes":"Midcycle surge, pregnancy, oestrogen-producing tumours, obesity (peripheral conversion)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is produced primarily after ovulation by the corpus luteum. It supports the second half of the menstrual cycle and is essential for pregnancy. At 0.95 nmol/L, Gwen's progesterone is within the follicular phase range of 0 to 4.45, which is consistent with the blood being drawn before ovulation. To assess whether ovulation is occurring, progesterone would need to be measured on day 21 of the cycle, when it should rise above 10 nmol/L in the luteal phase.","low_causes":"Follicular phase timing, anovulation, perimenopause, menopause","high_causes":"Luteal phase, pregnancy, ovarian cysts, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"2.0","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3426","upper_optimal_position":"0.5981","units":"mIU/mL","description":"LH, or luteinising hormone, is produced by the pituitary gland and triggers ovulation in women. At 2.3 mIU/mL, Gwen's LH is within the follicular phase range of 1.9 to 12.5, consistent with the early part of the menstrual cycle. In menopause, LH rises above 15.9 as the brain increases its signal to the ovaries. At 2.3, Gwen's LH is clearly within premenopausal range, indicating that her pituitary-ovarian axis is functioning normally at the time of this test.","low_causes":"Pituitary disease, hypothalamic dysfunction, stress, extreme exercise","high_causes":"Menopause, perimenopause, midcycle surge, PCOS, primary ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"5.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4218","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3.0","upper_optimal":"9.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3398","upper_optimal_position":"0.6169","units":"mIU/mL","description":"FSH, or follicle-stimulating hormone, is produced by the pituitary gland to stimulate the ovaries to develop egg-containing follicles. At 5.01 mIU/mL, Gwen's FSH is within the follicular phase range and well below the postmenopausal threshold of 23. FSH is the most reliable single hormone for assessing menopausal status: it rises as the ovaries become less responsive, requiring more stimulation from the brain. At 5.01, Gwen's ovaries are responding to a normal level of stimulation, confirming that she is not yet menopausal at the time of this test. However, FSH can fluctuate in early perimenopause, so a single normal result does not rule out the very early stages.","low_causes":"Pituitary disease, hypothalamic dysfunction, PCOS (sometimes), pregnancy","high_causes":"Menopause, perimenopause, primary ovarian failure, diminished ovarian reserve","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4127","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4127","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays important roles in energy, libido, muscle maintenance, bone density and mood. At 1.0 nmol/L, Gwen's testosterone is within the laboratory range but at the bottom boundary of the optimal range. This is consistent with her age and the fact that testosterone naturally declines in women from the mid-30s onwards. If she experiences symptoms such as reduced libido, difficulty building muscle or persistent low energy, this borderline level may be contributing.","low_causes":"Aging, menopause, oral contraceptives, chronic illness, stress","high_causes":"PCOS, adrenal hyperplasia, insulin resistance, androgen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4144","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is free and biologically active, by relating total testosterone to SHBG. At 1.96, Gwen's FAI is within the optimal range, indicating an appropriate balance between total testosterone and the binding protein that carries it. This is reassuring and suggests that the testosterone available to tissues is adequate.","low_causes":"High SHBG, low testosterone, menopause","high_causes":"PCOS, insulin resistance, low SHBG, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3850","upper_optimal_position":"0.5627","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 4.3 umol/L (approximately 1,585 ug/dL), Gwen's DHEA-S is within the optimal range, indicating healthy adrenal function. DHEA-S naturally declines with age, and maintaining a mid-range level at 48 is a positive finding.","low_causes":"Aging, adrenal insufficiency, chronic stress","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4464","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","units":"uIU/mL","description":"Prolactin is a pituitary hormone best known for its role in breast milk production, but it also influences menstrual regularity, libido and immune function. At 142 uIU/mL, Gwen's prolactin is within the normal range for a non-pregnant female, indicating healthy pituitary function.","low_causes":"Dopamine-enhancing medications, pituitary underfunction","high_causes":"Pituitary adenoma, stress, medications (antipsychotics, PPIs), hypothyroidism, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4639","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3603","upper_optimal_position":"0.5440","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds sex hormones, particularly testosterone and oestradiol, reducing their biological activity. At 51 nmol/L, Gwen's SHBG is within the optimal range. SHBG tends to be lower in obesity and insulin resistance, so a healthy SHBG at her BMI is a positive finding that aligns with her excellent insulin sensitivity.","low_causes":"Obesity, insulin resistance, hypothyroidism, high androgen states","high_causes":"Aging, oestrogen therapy, hyperthyroidism, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.0139","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3372","lower_normal":"0.013","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3626","upper_optimal_position":"0.5790","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone that is not bound to proteins and is therefore biologically active. At 0.0139 nmol/L, Gwen's free testosterone sits at the very bottom of the laboratory range, just above the lower limit of 0.013, and below the optimal threshold of 0.02. This very low free testosterone means that while her total testosterone is within range, very little is available for tissues to use. This could contribute to symptoms such as reduced energy, difficulty building or maintaining muscle, and low libido. It is consistent with her age and the gradual decline in female androgen production from the mid-30s onward.","low_causes":"Aging, high SHBG, menopause, chronic illness, oral contraceptives","high_causes":"PCOS, insulin resistance, low SHBG, androgen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3762","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme found primarily in muscles. It leaks into the bloodstream when muscle cells are damaged by exercise, injury or disease. At 41 U/L, Gwen's CK is at the lower end of the range, reflecting her limited current exercise load. This confirms that there is no muscle damage or breakdown occurring.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statins, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7319","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":" // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

},{rootMargin:'-45% 0px -50% 0px'});

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
