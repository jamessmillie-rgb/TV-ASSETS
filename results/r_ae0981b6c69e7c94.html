<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Gwen Czaja","dob":"02/10/1977","report_date":"2026-09-16","summary":"Gwen is a 48-year-old female presenting with a BMI of 43.4, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. She trains once per week with cardio only, no resistance training, and averages 2,000 to 5,000 daily steps. She takes no prescribed medication, having declined pharmaceutical treatment years ago, and uses CBD oil for pain. She has been diagnosed with ankylosing spondylitis, osteoarthritis, degenerative disc disease, hypermobility and lipoedema. She reports weight gain and difficulty losing weight, joint pain and stiffness, and poor sleep, sleeping less than six hours on most nights. Her goals are to improve long-term health and longevity, lose body fat, and balance her hormones. She believes she may be perimenopausal and notes that pain is limiting her ability to exercise and that her posture is out of alignment, which she is working to address. She has sought this blood test as a baseline because she feels the medical system has not provided adequate help and wants to fix things naturally.\n\nThe most significant finding in this report is a highly elevated high-sensitivity C-reactive protein, or hs-CRP, at 15.8 mg/L against a threshold of under 5. CRP is a protein produced by the liver in response to inflammation anywhere in the body. At 15.8, this is well above the cardiovascular risk threshold and firmly into the territory of active systemic inflammation. Given Gwen's diagnoses of ankylosing spondylitis and osteoarthritis, there is a very clear explanation for this result. Ankylosing spondylitis in particular is a systemic inflammatory condition that drives CRP substantially, and the combination of active joint disease, chronic pain and sleep deprivation creates a cycle where inflammation fuels poor sleep, and poor sleep fuels further inflammation. This CRP level also means that several other markers in this report, particularly the lipid panel and some of the haematology findings, need to be interpreted through the lens of active inflammation rather than taken at face value. We would recommend discussing this with her GP, because while the likely explanation is her known inflammatory conditions, a CRP this high warrants clinical review to ensure nothing additional is contributing.\n\nAlongside this, Gwen's Lipoprotein(a), known as Lp(a), is 189 nmol/L, substantially above the 32 nmol/L threshold and placing her in the moderate-to-high cardiovascular risk category for this inherited marker. Lp(a) is a modified form of LDL cholesterol that is genetically determined and does not change with diet, exercise or lifestyle. It increases cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls like LDL, it encourages blood clot formation, and it drives local inflammation. This result is permanent medical information. It will not change, it should be recorded in her GP notes permanently, and her first-degree relatives, siblings and children, should be offered testing because they have a 50% chance of inheriting the same elevated level. The combination of a very high Lp(a) and active systemic inflammation from ankylosing spondylitis means that managing every other modifiable cardiovascular risk factor becomes especially important.\n\nThere is a good deal of genuinely positive news in this report. Gwen's thyroid is working well. TSH, which is the signal the brain sends to the thyroid gland to request more hormone, sits at 1.83, right in the optimal zone. Free T4, the main circulating thyroid hormone, is 19, and Free T3, the active form the body actually uses, is 5.1, both comfortably within their optimal ranges. Both thyroid antibody tests are negative, which rules out autoimmune thyroid disease such as Hashimoto's. At 48 with fatigue and weight gain, confirming that the thyroid is not the cause is genuinely useful information. Her liver is in excellent health. ALT at 17 and Gamma GT at 14 are both well within their optimal ranges, and GGT at 14 is about as clean as that marker gets. The FIB-4 score, a composite measure of liver fibrosis risk, is 1.29, which is within the safe threshold. Amylase and lipase, both markers of pancreatic health, are comfortably within range. Total bilirubin is normal. At a BMI of 43.4, a liver this clean is a genuinely reassuring finding because the liver is often the first organ to show strain from excess weight, and hers is showing none.\n\nHer glucose metabolism is in a very strong position. Fasting glucose at 5.2 is within the optimal range, HbA1c at 35 mmol/mol, which reflects average blood sugar over the preceding three months, is optimal at below 36, and her HOMA-IR, a calculated measure of insulin resistance, is 0.9, which places her firmly in the insulin-sensitive category. At her BMI, this is a genuinely surprising and positive finding. It means that despite carrying significant excess weight, her body is still handling sugar efficiently and her pancreas is not being overworked. Fasting insulin at 3.89 is at the lower end of the laboratory range but within the optimal band of 2 to 8, reflecting low insulin demand. Her C-Peptide, which is a byproduct of insulin production and a measure of how much insulin the pancreas is making, came back at 0.504 ug/L, which converts to approximately 167 pmol/L, below the laboratory range of 1.1 to 4.4 ug/L. However, in the context of a normal glucose, optimal HbA1c and excellent HOMA-IR, this reflects a pancreas that simply does not need to produce much insulin rather than one that is failing. The lab also noted that C-Peptide can degrade in samples not separated promptly, so the true value may be somewhat higher. This is not a concern.\n\nHer immune system markers are well balanced. IgG, IgA, IgM and IgE, the four classes of immunoglobulin that represent different arms of the immune defence system, are all within their laboratory ranges. Rheumatoid factor at 8 is below the threshold of 14, which is reassuring given her joint conditions, as it helps distinguish her pattern from rheumatoid arthritis. The coeliac screen, tissue transglutaminase IgA, is negative, ruling out coeliac disease as a contributor to any of her symptoms. Both tumour markers tested, CA 19-9 and CEA, are below their detection thresholds, and CA-125, a marker sometimes associated with ovarian pathology, is 16.3 against a threshold of 35, all reassuring. Her ESR, the erythrocyte sedimentation rate, which is another measure of inflammation, is less than 2 mm/hour, which is interesting because it contrasts with the very high CRP. ESR and CRP measure inflammation through different mechanisms and can diverge, but the CRP is the more sensitive and clinically relevant marker here.\n\nHer urine is clean, with no protein, no glucose, no blood, no white cells, no nitrites and no casts. The bacterial culture and sensitivities are pending and will be reported when available.\n\nTurning to the areas that need attention beyond the CRP and Lp(a). Her haemoglobin is 159 g/L, above the female upper limit of 150, and her red blood cell count is 5.38, above the upper limit of 4.8. Her haematocrit, the proportion of blood made up of red cells, is 0.449, which is within range but at the higher end. The most common explanation for elevated haemoglobin and red cell count in someone with chronic inflammatory disease and sleep-disordered breathing patterns is chronic low-grade hypoxia, where the body is not getting quite enough oxygen during sleep and compensates by producing more red cells. Sleep restriction of under six hours combined with a BMI of 43.4 raises the possibility of obstructive sleep apnoea, which would drive exactly this pattern. Her MCHC at 355 is marginally above the upper limit of 345, which can be affected by sample temperature and storage as the lab noted, but the combination of elevated haemoglobin, high red cell count and borderline haematocrit makes it worth discussing with her GP whether a sleep study might be appropriate. If she does have undiagnosed sleep apnoea, treating it could improve her energy, her pain tolerance, her inflammatory burden and her ability to lose weight.\n\nHer monocytes at 0.14 are below the lower limit of 0.2. Monocytes are white blood cells that play a role in tissue repair and immune surveillance. A marginally low monocyte count in isolation, with all other white cell lines normal, is rarely significant and may simply reflect natural variation, but it is worth noting in the context of her inflammatory conditions.\n\nHer lipid panel shows a total cholesterol of 5.8 mmol/L, LDL cholesterol of 3.67 against a target of under 3, ApoB of 1.11 against a target of under 0.9, and a non-HDL cholesterol of 4.2 against a target of under 4. Her ApoB to ApoA-I ratio is 0.673, above the lower-risk threshold of 0.6 and placing her in the average-risk category. However, there is an important nuance here. Her HDL cholesterol at 1.6 is in the desirable range and exactly at the female optimal threshold. Her triglycerides at 1.32 are within the healthy range. Her ApoA-I at 1.65 is above the desirable threshold. These are genuinely good results. The elevated LDL and ApoB are driven by two factors that are both clearly identifiable: the very high Lp(a) at 189 directly contributes to the LDL measurement because Lp(a) particles are counted within the LDL fraction, and the active systemic inflammation at a CRP of 15.8 alters lipid metabolism. This means her true modifiable LDL burden is lower than the headline number suggests, but even accounting for the Lp(a) contribution, the ApoB at 1.11 indicates there are more atherogenic particles circulating than is ideal. Given the combination of high Lp(a) and active inflammation, her GP should be aware of the full lipid picture because managing modifiable lipid risk becomes more important when inherited risk from Lp(a) cannot be changed.\n\nHer Cystatin C is 1.21 mg/L, above the threshold of 1.1, giving an estimated GFR from Cystatin C of 77 ml/min. Cystatin C is a more reliable marker of kidney filtration than creatinine because it is not affected by muscle mass, which matters at higher BMIs. Her creatinine-based eGFR is greater than 90, but the Cystatin C-based eGFR of 77 suggests that true kidney filtration may be mildly reduced. A GFR of 77 is not alarming and does not indicate kidney disease, but at 48 it is below where it should ideally sit, and the active systemic inflammation could be contributing. This is worth monitoring over time. Her chloride at 94 is marginally below the lower limit of 95, and her bicarbonate at 19.4 is marginally below the lower limit of 20. Together these suggest a very mild metabolic acidosis, which can be associated with chronic inflammation and is consistent with her clinical picture. Neither is a concern in isolation but both support the broader pattern.\n\nHer transferrin at 2.36 is below the lower limit of 2.5. Transferrin is the protein that carries iron through the bloodstream. It is a negative acute phase reactant, meaning its levels fall when inflammation is high. With a CRP of 15.8, the low transferrin is almost certainly driven by the inflammatory response rather than representing a primary iron transport problem. Her ferritin at 47 is within the laboratory range but below the female optimal of 40 to 150, sitting at the lower end of optimal. Her transferrin saturation at 20.9% is within range but below the optimal band of 25 to 40%, and her serum iron at 12.4 is within range. The picture is one of adequate but not abundant iron stores, with the transferrin being suppressed by inflammation. Iron supplementation is not needed at this stage, but iron status should be monitored.\n\nHer vitamin D at 121 nmol/L is above the sufficient and optimal thresholds, which is excellent and likely reflects supplementation. However, her parathyroid hormone, or PTH, is suppressed at less than 0.424 pmol/L, well below the lower limit of 0.98. PTH is the hormone that regulates calcium and phosphate balance, and it is suppressed when vitamin D levels are high because the body reduces PTH output when it senses adequate calcium absorption. At a vitamin D of 121, the suppressed PTH is the expected physiological response rather than a sign of parathyroid gland disease. However, the lab noted that PTH can be affected if the sample was not centrifuged and separated on the day of collection, so the true value may be somewhat higher. If Gwen is taking high-dose vitamin D supplementation, she should ensure she is not exceeding 4,000 IU daily without monitoring, and she may wish to reduce to a maintenance dose of 2,000 IU daily given that her level is already above the optimal ceiling of 120.\n\nHer magnesium at 1.18 is above the upper laboratory limit of 1.11. This is almost certainly from supplementation. Mildly elevated magnesium in someone taking magnesium supplements is not a clinical concern but she should review her dose and consider reducing it slightly, as her level is already well above the optimal ceiling of 1.05.\n\nHer B12 at 324 pg/mL is within the laboratory range but below the optimal threshold of 500. Given that she takes multiple supplements, B12 may not be among them, or the form she is taking may not be well absorbed. Folate at 12 ng/mL is within the optimal range above 8, which is good.\n\nHer hormonal picture is consistent with a regular menstrual cycle rather than perimenopause. Her FSH at 5.01 and LH at 2.3 are both within follicular phase ranges, well below the postmenopausal thresholds of 23 and 15.9 respectively. FSH is the hormone the brain uses to stimulate the ovaries, and it rises significantly during perimenopause and menopause. At 5.01, Gwen's ovaries are still responding to normal levels of stimulation. Her oestradiol at 346 pmol/L is within the follicular and midcycle ranges, and her progesterone at 0.95 nmol/L is consistent with the follicular phase, when progesterone is naturally low before ovulation. These results suggest the sample was taken during the first half of her cycle. Her testosterone at 1 nmol/L is within the female range of 0.5 to 2.6, her free testosterone at 0.0139 is at the very bottom of the reference range of 0.013 to 0.25, and her SHBG at 51 is within range. DHEA-S, which converts to approximately 1,585 ug/dL, is within range, and prolactin and cortisol are both within their expected ranges. While her hormone levels do not currently confirm perimenopause, her symptoms of weight gain, poor sleep, joint stiffness and difficulty losing weight could still reflect early perimenopausal changes that fluctuate cycle to cycle, or they may be driven primarily by her inflammatory conditions, sleep restriction and weight. A single snapshot of hormones cannot rule out perimenopause, but it does show that her ovarian function is currently intact.\n\nHer CA 15-3, a breast cancer antigen marker, is 29.14 against a threshold of 30. This is within the laboratory range but close to the boundary. In the absence of symptoms or clinical suspicion, a result just under the threshold is not a concern, particularly because CA 15-3 can be mildly elevated by inflammation, liver conditions and benign breast disease. It should be noted and monitored at subsequent testing.\n\nHer total antioxidant activity at 1.87 is above the upper limit of 1.77, which is consistent with supplementation and is not a concern. Her creatine kinase at 41 is within range, reflecting low muscle mass and low training load, which is expected.","links":"Gwen's results tell a clear story: her body is dealing with significant systemic inflammation from her known conditions, compounded by chronic sleep deprivation and excess weight, but her metabolic core, her liver, her thyroid and her blood sugar handling, are all in remarkably good shape. The priorities that emerge from this report are reducing inflammation, protecting cardiovascular health given the inherited Lp(a) risk, improving sleep, and beginning a gradual, sustainable weight loss programme that respects her pain limitations.\n\nThe single most impactful change Gwen could make is improving her sleep. Sleeping under six hours most nights drives inflammation, impairs insulin sensitivity over time, increases appetite hormones, slows recovery from joint pain and may be contributing to the elevated haemoglobin through intermittent low oxygen levels. She should aim for a fixed wake time seven days a week, get outside within an hour of waking to set her circadian rhythm, cut caffeine entirely after midday, keep the bedroom cool (around 18 degrees Celsius), and consider whether her pain management before bed could be optimised to reduce night-time waking. If she snores, wakes gasping, or her partner has noticed pauses in her breathing, she should ask her GP about a sleep study for obstructive sleep apnoea. Treating sleep apnoea, if present, could improve her energy, reduce her CRP, help with weight loss and explain the elevated haemoglobin.\n\nFor weight loss, at 114 kg and 162 cm with minimal activity, her estimated maintenance calories sit around 2,200 to 2,400 per day. A sustainable deficit of 300 to 500 calories would place her target intake at 1,800 to 2,000 calories per day. At her current weight, protein is critical for preserving what muscle mass she has: she should aim for at least 130 to 150 grams of protein per day, spread across three to four meals. This is roughly 1.2 to 1.3 grams per kilogram of body weight, which is appropriate given her limited ability to do resistance training. Protein also has the highest satiety of any macronutrient, which helps with hunger management. A realistic initial target would be to reach 105 kg over six to nine months, which represents roughly 0.5 kg per week. Her diet quality at 7 out of 10 is good, so the focus should be on portion control and protein prioritisation rather than a complete dietary overhaul.\n\nFor cardiovascular protection, given the Lp(a) at 189 and the ApoB at 1.11, she should increase her intake of soluble fibre, which binds cholesterol in the gut and reduces LDL. Good sources include oats, barley, beans, lentils, apples, citrus fruits and ground flaxseed, aiming for at least 10 grams of soluble fibre daily. She should aim for two to three portions of oily fish per week, such as salmon, mackerel, sardines or trout, for the omega-3 content, which helps with both lipids and inflammation. Reducing saturated fat intake modestly, by swapping butter for olive oil, reducing cheese portions, and choosing leaner cuts of meat, would also help lower ApoB. These dietary changes work alongside the omega-3 supplementation recommended below.\n\nFor her inflammatory conditions, the anti-inflammatory effects of omega-3 fatty acids, improved sleep, gradual weight loss and consistent gentle movement are all evidence-based approaches that work without medication. Regarding exercise, she should work within her pain limits but aim to gradually increase her daily steps towards 5,000 to 7,000 as her postural alignment work progresses. Pool-based exercise, whether swimming or aqua aerobics, would be ideal because it supports joints while allowing cardiovascular work and gentle resistance. Even 10 to 15 minutes of daily walking, broken into short bouts if needed, would contribute.\n\nFor her GP, she should bring the following points: the CRP of 15.8 in the context of her ankylosing spondylitis and osteoarthritis, to discuss whether her current management approach is adequately controlling the inflammatory burden; the Lp(a) of 189 as a permanent cardiovascular risk factor that should be recorded in her notes, with first-degree relatives offered testing; the elevated haemoglobin and red cell count with the question of whether a sleep study is appropriate; the Cystatin C eGFR of 77, which warrants monitoring; and the full lipid panel including the ApoB of 1.11 and ApoB to ApoA-I ratio of 0.673, to discuss whether any lipid-lowering intervention is warranted given the combination of high Lp(a) and elevated ApoB.\n\nShe should also discuss the vitamin D supplementation dose with her GP or practitioner. Her level at 121 is slightly above the optimal ceiling and has suppressed her PTH. A maintenance dose of 2,000 IU daily would be appropriate to hold her level in the 75 to 100 range without over-supplementing.\n\nA retest in six months would be ideal, focusing on: hs-CRP to track inflammatory burden, a full lipid panel including ApoB, Cystatin C to monitor kidney filtration, a full blood count to check whether the haemoglobin normalises with improved sleep, vitamin D and PTH to confirm the PTH recovers as vitamin D is brought into the optimal window, and B12 to check whether supplementation has raised the level.","flags":"CRP 15.8 mg/L (threshold under 5): Significantly elevated. Most likely driven by known ankylosing spondylitis and osteoarthritis, compounded by chronic sleep deprivation and elevated BMI. Requires GP review to ensure no additional inflammatory source and to discuss adequacy of current management strategy.\n\nLipoprotein(a) 189 nmol/L (threshold under 32): Genetically determined, moderate-to-high cardiovascular risk. Permanent medical record. First-degree relatives should be offered testing. Unmodifiable, but increases the importance of managing all modifiable cardiovascular risk factors aggressively.\n\nApolipoprotein B 1.11 g/L (threshold under 0.9): Borderline high. Partially inflated by Lp(a) contribution to LDL fraction. Indicates elevated atherogenic particle number. Combined with Lp(a) risk, warrants discussion of lipid-lowering intervention.\n\nLDL cholesterol 3.67 mmol/L (target under 3): Elevated. Partially reflects Lp(a) contribution. ApoB is the more reliable measure of particle number.\n\nNon-HDL cholesterol 4.2 mmol/L (target under 4): Marginally elevated. Consistent with LDL and ApoB findings.\n\nApoB/A-I ratio 0.673 (target under 0.6): Average risk category. Driven by elevated ApoB.\n\nHaemoglobin 159 g/L (upper limit 150) and red blood cell count 5.38 (upper limit 4.8): Both elevated. Pattern raises the possibility of chronic low-grade hypoxia, potentially from obstructive sleep apnoea given BMI 43.4 and sleep restriction. Sleep study should be considered.\n\nCystatin C 1.21 mg/L (threshold under 1.1) with Cystatin C eGFR 77: Mildly reduced kidney filtration. More reliable than creatinine-based eGFR at this BMI. Not alarming but warrants monitoring. Active inflammation may be contributing.\n\nMCHC 355 g/L (upper limit 345): Marginally elevated. May be affected by sample temperature and storage as noted by the lab. Consistent with the broader polycythaemic picture.\n\nMonocytes 0.14 (lower limit 0.2): Marginally low. Isolated finding with all other white cell lines normal. Low clinical significance.\n\nC-Peptide 0.504 ug/L (range 1.1 to 4.4): Below range. In context of normal glucose, optimal HbA1c and excellent HOMA-IR, reflects low insulin demand rather than pancreatic insufficiency. Sample degradation may also contribute.\n\nTransferrin 2.36 g/L (lower limit 2.5): Below range. Transferrin is a negative acute phase reactant and the low result is consistent with the CRP of 15.8. Not a primary iron transport problem.\n\nChloride 94 mmol/L (lower limit 95) and bicarbonate 19.4 mmol/L (lower limit 20): Both marginally below range. Suggest mild metabolic acidosis, consistent with chronic inflammation.\n\nPTH less than 0.424 pmol/L (lower limit 0.98): Suppressed. Expected physiological response to vitamin D of 121. Lab notes sample handling caveat. Vitamin D dose should be reduced to maintenance.\n\nMagnesium 1.18 mmol/L (upper limit 1.11): Mildly elevated from supplementation. Dose reduction recommended.\n\nCA 15-3 29.14 U/mL (threshold under 30): Just under threshold. No clinical concern in absence of symptoms. May be mildly elevated by systemic inflammation. Monitor at next test.\n\nTotal antioxidant activity 1.87 mmol/L (upper limit 1.77): Above range from supplementation. Not a concern.\n\nReassuring negatives: Liver function excellent with ALT 17, GGT 14 and FIB-4 1.29 despite BMI 43.4. Thyroid function optimal with negative antibodies ruling out Hashimoto's. Glucose metabolism excellent with HbA1c 35 and HOMA-IR 0.9. ESR less than 2. Rheumatoid factor negative. Coeliac screen negative. CA-125, CA 19-9 and CEA all well below thresholds. Urine clean. Immunoglobulins all within range. Creatine kinase normal.","recommendations":"Discuss the CRP of 15.8 with the GP to review whether current management of ankylosing spondylitis is adequately controlling systemic inflammation.\n\nRecord the Lp(a) of 189 nmol/L permanently in GP notes and arrange testing for first-degree relatives.\n\nDiscuss the full lipid panel with the GP, specifically the ApoB of 1.11 and ApoB/A-I ratio of 0.673 in the context of the Lp(a), to determine whether lipid-lowering therapy is warranted.\n\nAsk the GP about a sleep study for obstructive sleep apnoea, given the BMI of 43.4, sleep under six hours, and elevated haemoglobin and red cell count.\n\nPrioritise sleep above all other lifestyle changes. Fix wake time, get outside early, cut caffeine after midday, cool the bedroom to around 18 degrees.\n\nBegin a gradual calorie reduction to 1,800 to 2,000 calories per day with at least 130 to 150 grams of protein daily. Target a loss of 0.5 kg per week towards an initial goal of 105 kg.\n\nIncrease soluble fibre intake to at least 10 grams per day from oats, beans, lentils, apples, citrus and ground flaxseed.\n\nAim for two to three portions of oily fish per week.\n\nGradually increase daily steps towards 5,000 to 7,000. Consider pool-based exercise to reduce joint loading.\n\nReduce vitamin D supplementation to a maintenance dose of 2,000 IU daily and recheck vitamin D and PTH in six months.\n\nReduce magnesium supplementation dose slightly, as the current level is above the optimal ceiling.\n\nBegin sublingual methylcobalamin B12 supplementation at 1,000 mcg daily to bring B12 into the optimal range.\n\nRetest in six months: hs-CRP, full lipid panel with ApoB, Cystatin C, full blood count, vitamin D, PTH, B12.","supplementation":"Omega-3 fish oil: 3 grams of combined EPA and DHA daily, taken with a meal containing fat. This is the most important supplement for Gwen given the combination of high CRP, elevated ApoB and high Lp(a). Omega-3 fatty acids reduce triglycerides, lower inflammation, and may help modestly with the joint stiffness from ankylosing spondylitis. A high-quality concentrated fish oil allows this dose in two to three capsules rather than eight to ten standard ones.\n\nVitamin D3 (cholecalciferol): reduce to 2,000 IU daily, taken with a meal containing fat. Her current level of 121 is slightly above the optimal ceiling of 120, and the suppressed PTH confirms the body is responding to a high vitamin D level. Bringing the dose down to 2,000 IU will hold her in the sweet spot of 75 to 100 over time.\n\nVitamin K2 (MK-7): 200 mcg daily, taken alongside vitamin D. K2 directs calcium into bones and teeth rather than soft tissues and artery walls, which is important when supplementing vitamin D, especially given Gwen's suppressed PTH.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Her B12 at 324 is below the optimal threshold of 500. Sublingual methylcobalamin bypasses gut absorption issues and is the most effective form for raising levels. Place under the tongue first thing in the morning and allow to dissolve.\n\nMagnesium (glycinate): reduce current dose to achieve a target of 200 to 300 mg elemental magnesium daily, taken before bed. Her magnesium at 1.18 is above the upper laboratory limit, indicating her current dose is too high. Magnesium glycinate is the preferred form for sleep support without digestive side effects, and a slightly lower dose will bring her level into the optimal range of 0.85 to 1.05 while still supporting sleep quality and muscle relaxation.\n\nGwen should review her remaining supplements and consider whether any contain iron. Her iron stores are adequate and she does not need additional iron supplementation. She should also check whether any of her supplements contain additional vitamin D beyond the 2,000 IU dose recommended above, as multiple sources can push levels too high.\n\nThe most important changes from this report are not supplements. They are improving sleep duration and quality, beginning a gradual, sustainable calorie reduction with high protein intake, increasing gentle daily movement within her pain limits, and having a thorough conversation with her GP about managing her inflammatory burden and cardiovascular risk given the Lp(a) finding.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Blood glucose measures the amount of sugar circulating in the bloodstream after fasting. At 5.2 mmol/L, Gwen's result falls within the optimal range of 4.0 to 5.4, indicating that her body is regulating blood sugar effectively. At a BMI of 43.4, maintaining optimal fasting glucose is a genuinely positive finding that reflects good metabolic resilience. Elevated levels would suggest the early stages of insulin resistance or prediabetes, while very low levels could indicate insufficient caloric intake or excessive insulin production.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin-producing tumours","high_causes":"Insulin resistance, prediabetes, type 2 diabetes, stress, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c reflects the average blood sugar level over the preceding two to three months by measuring how much glucose has attached to haemoglobin in red blood cells. At 5.3%, Gwen's result is well within the normal range of under 6.0% and below the prediabetes threshold. This confirms that her blood sugar control has been consistently good over recent months, not just at the moment of the blood draw.","low_causes":"Shortened red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Sustained elevated blood sugar, prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. At 35, Gwen's result is below the optimal ceiling of 36 and well below the prediabetes threshold of 42. This is an excellent result that confirms sustained good blood sugar control despite her elevated BMI.","low_causes":"Shortened red cell lifespan, blood loss","high_causes":"Sustained elevated blood sugar, prediabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3914","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3107","upper_optimal_position":"0.5348","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. At 3.89 mIU/L, Gwen's insulin is low, sitting comfortably within the optimal range of 2 to 8, which means her body requires very little insulin to manage glucose. This is a sign of excellent insulin sensitivity. At a BMI of 43.4, many people would have insulin levels two to five times higher, so this is a genuinely reassuring result that suggests her metabolic machinery is functioning well despite the excess weight.","low_causes":"Low carbohydrate diet, excellent insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, prediabetes, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.504","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1818","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and is a reliable measure of how much insulin the body is producing. At 0.504 ug/L, Gwen's result is below the laboratory range of 1.1 to 4.4. However, in the context of her normal fasting glucose, optimal HbA1c and excellent HOMA-IR, this low C-Peptide reflects a pancreas that simply does not need to produce much insulin, rather than one that is failing. The lab also noted that C-Peptide can degrade in samples not separated promptly, which may have contributed to the low reading.","low_causes":"Low insulin demand due to insulin sensitivity, low carbohydrate intake, sample degradation","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"","description":"HOMA-IR is a calculated measure of insulin resistance derived from fasting glucose and fasting insulin. A score under 1.0 indicates excellent insulin sensitivity, meaning the body handles sugar efficiently with minimal insulin. At 0.9, Gwen sits firmly in the insulin-sensitive category. At a BMI of 43.4, this is a genuinely exceptional result. It means that despite carrying significant excess weight, her metabolic machinery has not yet shifted towards insulin resistance, which is the precursor to type 2 diabetes. This metabolic resilience gives her a window of opportunity: losing weight now, while insulin sensitivity is still intact, will be significantly easier than trying to do so once insulin resistance has developed.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome, excess visceral fat","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homa_b","name":"HOMA-B (Calculated)","group":"GLUCOSE & INSULIN","result":"45.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1906","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, the cells responsible for producing insulin. It is calculated from fasting insulin and glucose. At 45.8, Gwen's result is below the reference range of 80 to 200. However, HOMA-B must be interpreted alongside glucose and HbA1c. Because both of these are optimal, the low HOMA-B reflects low insulin demand rather than failing beta cell function. Her pancreas is producing exactly as much insulin as her body needs, which at her level of insulin sensitivity is not very much. If glucose or HbA1c were elevated alongside a low HOMA-B, that would suggest the pancreas was not keeping up, but that is clearly not the case here.","low_causes":"Low insulin demand, excellent insulin sensitivity, low carbohydrate diet, early beta cell dysfunction if glucose is also elevated","high_causes":"Insulin resistance with compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5599","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the bloodstream, including HDL (protective), LDL (harmful when elevated) and VLDL. At 5.8 mmol/L, Gwen's total cholesterol is above the desirable threshold of 5.18. However, total cholesterol alone is a blunt tool. The breakdown matters more: her HDL at 1.6 is good, which means a meaningful portion of the total is protective cholesterol. The more concerning element is the LDL and ApoB, which are discussed in their own entries. Her Lp(a) at 189 also contributes to the total cholesterol reading because Lp(a) particles carry cholesterol and are counted within the LDL fraction.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, insulin resistance, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3882","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the bloodstream, primarily influenced by recent food intake, carbohydrate consumption and alcohol. At 1.32 mmol/L, Gwen's triglycerides are within the healthy fasting range of under 1.7 but above the optimal threshold of under 1.0. This is a reasonable result at her BMI and is not concerning. Triglycerides tend to fall with weight loss, reduced refined carbohydrate intake and increased omega-3 fatty acid consumption.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism","high_causes":"Excess carbohydrate or alcohol intake, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3846","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to tissues around the body. At 0.6 mmol/L, Gwen's VLDL is within the laboratory range and at the boundary of optimal. This is consistent with her triglyceride level and indicates that the liver is not producing excessive amounts of triglyceride-rich particles.","low_causes":"Low fat diet, genetic factors","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.6","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective form of cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. At 1.6 mmol/L, Gwen's HDL sits at the female optimal threshold. This is a genuinely good result, particularly at her BMI, because HDL tends to be lower in people carrying excess weight. It suggests that her metabolic profile has some inherent resilience.","low_causes":"Sedentary lifestyle, obesity, smoking, high refined carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6117","lower_normal":"0","upper_normal":"3.0","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the form of cholesterol that deposits in artery walls and drives atherosclerosis when elevated. At 3.67 mmol/L, Gwen's LDL is above the target of under 3.0. However, an important caveat applies: Lp(a) particles are measured within the LDL fraction, and with an Lp(a) of 189, a meaningful portion of this LDL reading is actually Lp(a) rather than standard LDL. The ApoB measurement at 1.11 is a more reliable indicator of how many harmful particles are circulating, because it counts each atherogenic particle individually regardless of type.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, statin therapy","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, elevated Lp(a), chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4033","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol to give a simple measure of cardiovascular risk. At 3.63, Gwen's ratio is within the desirable range of under 4.5, which reflects the protective contribution of her good HDL level. A ratio under 3.5 would be considered optimal.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, combined lipid abnormalities","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"27.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6898","lower_normal":"20.0","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. At 27.6%, more than a quarter of Gwen's total cholesterol is the protective HDL form. A value above 20% is desirable, and above 25% is optimal. This is a positive finding that helps offset the elevated total cholesterol number.","low_causes":"Low HDL, very high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.525","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol types, including LDL, VLDL and Lp(a), in a single number. At 4.2 mmol/L, Gwen's non-HDL is marginally above the target of under 4.0. This is consistent with her LDL and ApoB findings and is partly driven by the very high Lp(a).","low_causes":"Very low LDL, low triglycerides","high_causes":"Elevated LDL, elevated triglycerides, elevated Lp(a), dietary saturated fat, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5893","lower_normal":"1.4","upper_normal":"100","lower_optimal":"1.6","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA-I is the main structural protein of HDL cholesterol particles. It is a direct measure of the number of protective HDL particles in the bloodstream, whereas HDL cholesterol measures the amount of cholesterol those particles carry. At 1.65 g/L, Gwen's ApoA-I is above the desirable threshold of 1.4 and within the optimal range above 1.6. This confirms that she has a healthy number of protective cholesterol particles.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single most important lipid marker in modern cardiovascular medicine. Each potentially harmful lipoprotein particle, whether LDL, VLDL or Lp(a), carries exactly one ApoB molecule, so the ApoB measurement directly counts the number of atherogenic particles in the bloodstream. At 1.11 g/L, Gwen's ApoB is above the desirable threshold of 0.9 and in the borderline high category. This confirms that she has more harmful particles circulating than is ideal. Part of this ApoB count comes from her very high Lp(a), which is genetically fixed and cannot be reduced through lifestyle changes, but the remainder is modifiable through diet, weight loss and potentially medication.","low_causes":"Very low fat diet, statin therapy, genetic factors","high_causes":"Diet high in saturated fat, genetic predisposition, elevated Lp(a), insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.673","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5608","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A-I ratio is the best single summary of the balance between harmful and protective cholesterol particles. It divides the count of atherogenic particles (ApoB) by the count of protective particles (ApoA-I). At 0.673, Gwen's ratio is above the lower-risk threshold of 0.6 for women and sits in the average-risk category (0.6 to 0.8). The ratio is being pushed up by the high ApoB, which itself is partly driven by the inherited Lp(a). A ratio below 0.6 would be ideal, and targeting the modifiable portion of ApoB through diet, omega-3 and weight loss is the path to improving this.","low_causes":"Low ApoB, high ApoA-I, favourable lipid profile","high_causes":"Elevated ApoB, low ApoA-I, unfavourable lipid balance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"189.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL cholesterol that carries an additional protein called apolipoprotein(a). It increases cardiovascular risk through three distinct mechanisms: it deposits cholesterol in artery walls like LDL, it promotes blood clot formation by interfering with the body's clot-dissolving system, and it drives local inflammation in blood vessel walls. At 189 nmol/L, Gwen's Lp(a) is significantly above the normal threshold of 32, placing her in the moderate-to-high risk category. This is an inherited trait that does not change with diet, exercise, weight loss or any currently available lifestyle intervention. It is permanent medical information that should be recorded in her GP notes. Her first-degree relatives, children and siblings, have a 50% chance of carrying the same elevated level and should be offered testing. Because this risk factor cannot be modified, it makes managing every other modifiable cardiovascular risk factor, including LDL, ApoB, blood pressure, weight and inflammation, especially important.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance only. Does not change with lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2767","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a useful proxy for insulin resistance and metabolic health. It divides triglycerides by HDL cholesterol. At 0.83, Gwen's ratio is within the optimal range of under 0.87, which aligns with her excellent HOMA-IR result and confirms that she is metabolically healthy despite her elevated BMI. This is one of the most positive findings in the report.","low_causes":"Excellent metabolic health, low carbohydrate diet, high HDL","high_causes":"Insulin resistance, high carbohydrate diet, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated by subtracting both HDL and LDL from total cholesterol. It captures the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent driver of cardiovascular disease. At 0.53 mmol/L, Gwen's remnant cholesterol is within the laboratory range of under 0.8 but marginally above the optimal threshold of under 0.5. This is a minor finding consistent with her mildly elevated triglycerides.","low_causes":"Low triglycerides, efficient triglyceride clearance","high_causes":"Elevated triglycerides, insulin resistance, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"15.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a protein produced by the liver in response to inflammation anywhere in the body. It is the most sensitive blood marker for systemic inflammation. At 15.8 mg/L, Gwen's CRP is significantly elevated, more than three times the laboratory threshold of 5 and more than fifteen times the optimal cardiovascular risk threshold of under 1.0. In Gwen's case, the most likely explanation is her diagnosed ankylosing spondylitis and osteoarthritis, both of which are inflammatory conditions that drive CRP production. Chronic sleep deprivation of under six hours and excess weight also contribute to inflammatory burden. This level of inflammation has implications beyond joint pain: it affects lipid metabolism, can impair kidney function, and independently increases cardiovascular risk. Reducing this CRP through better sleep, gradual weight loss, omega-3 supplementation and discussion with her GP about managing the underlying conditions is a priority.","low_causes":"Absence of significant inflammation","high_causes":"Inflammatory arthritis (ankylosing spondylitis, rheumatoid arthritis), infection, obesity, chronic sleep deprivation, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a test tube over one hour. It is an older, less specific measure of inflammation compared to CRP. At less than 2 mm/hour, Gwen's ESR is very low, which contrasts with her significantly elevated CRP. CRP and ESR measure inflammation through different mechanisms and can diverge. CRP responds more quickly to acute inflammatory changes and is generally considered the more reliable marker. The low ESR does not negate the CRP finding.","low_causes":"Low inflammation, polycythaemia (high red cell count, which slows sedimentation)","high_causes":"Infection, inflammatory conditions, anaemia, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"NLR (Calculated)","group":"INFLAMMATION","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5","units":"","description":"The neutrophil-to-lymphocyte ratio is a calculated marker that gives a snapshot of the balance between the innate immune system (neutrophils) and the adaptive immune system (lymphocytes). At 1.48, Gwen's NLR is within the optimal range of 1.0 to 2.0, indicating a healthy balance. Elevated NLR is associated with systemic inflammation and cardiovascular risk, so this healthy result is reassuring despite the elevated CRP.","low_causes":"Viral infection, autoimmune conditions","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6387","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins carry hormones, fight infection, maintain fluid balance and serve many other functions. At 76 g/L, Gwen's total protein is well within the healthy range and optimal band, reflecting adequate nutrition and normal liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Chronic infection, inflammatory conditions, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and medications through the bloodstream and maintains the fluid balance between b
