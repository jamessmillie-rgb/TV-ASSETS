:"1","one_sided":"0","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4759","lower_normal":"2","upper_normal":"3.8","lower_optimal":"2.2","upper_optimal":"3.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/l","description":"Transferrin is the protein that transports iron in the blood. At 2.77, it is within the optimal range, confirming normal iron transport capacity.","low_causes":"Chronic disease, inflammation, iron overload, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"29.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4389","lower_normal":"20","upper_normal":"50","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying protein transferrin is loaded with iron. At 29.5%, it is within the optimal range of 25 to 40%, confirming the body's iron supply and transport are balanced.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"uibc","name":"UIBC","group":"IRON STUDIES","result":"41.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"20","upper_normal":"60","lower_optimal":"25","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"umol/l","description":"UIBC (Unsaturated Iron Binding Capacity) measures the reserve capacity of transferrin to bind more iron. At 41.6, it is within the optimal range, confirming healthy iron transport with adequate reserve capacity.","low_causes":"Iron overload","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"irontibcratio","name":"Iron:TIBC Ratio","group":"IRON STUDIES","result":"0.295","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"0.15","upper_normal":"0.5","lower_optimal":"0.25","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.5714","units":"ratio","description":"This ratio is equivalent to transferrin saturation and confirms iron supply relative to binding capacity. At 0.295, it is within the optimal range, confirming balanced iron status.","low_causes":"Iron deficiency","high_causes":"Iron overload","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"21.600","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5291","lower_normal":"8.64","upper_normal":"29","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4795","upper_optimal_position":"0.6828","units":"nmol/l","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, libido, mood and red blood cell production. At 21.6, it is well within the optimal range of 18 to 30 for a male. This is a strong result at 41, especially in the context of nutritional stress, and confirms the testes and pituitary axis are functioning well.","low_causes":"Ageing, obesity, chronic stress, sleep deprivation, medications, pituitary disorders","high_causes":"Steroid use, tumours","padding":"1","one_sided":"0","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone","group":"HORMONES","result":"0.315","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4387","lower_normal":"0.155","upper_normal":"0.593","lower_optimal":"0.3","upper_optimal":"0.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4362","upper_optimal_position":"0.6164","units":"nmol/l","description":"Free testosterone is the portion not bound to proteins and available to tissues for use. At 0.315, it is within the laboratory range but at the lower end of the optimal band. The elevated SHBG at 57.1 is binding more testosterone than ideal, reducing the free fraction. As calorie intake improves and SHBG comes down, free testosterone should rise.","low_causes":"High SHBG, ageing, obesity, calorie restriction, liver disease","high_causes":"Low SHBG, steroid use, obesity (paradoxically lowers SHBG)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"sexhormonebindingglobuli","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"57.10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7133","lower_normal":"18.3","upper_normal":"54.1","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3894","upper_optimal_position":"0.6692","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, making them unavailable to tissues. At 57.1, it is above the upper limit of 54.1. High SHBG reduces free testosterone despite a healthy total testosterone. SHBG rises with calorie restriction, low body weight, and thyroid hormone (though thyroid is normal here). As nutrition improves and calorie intake reaches maintenance, SHBG is expected to fall and free testosterone to rise.","low_causes":"Obesity, insulin resistance, type 2 diabetes, hypothyroidism","high_causes":"Calorie restriction, low body weight, ageing, liver disease, hyperthyroidism, medications","padding":"1","one_sided":"0","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"145.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5951","lower_normal":"41.4","upper_normal":"159","lower_optimal":"60","upper_optimal":"130","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3824","upper_optimal_position":"0.5862","units":"pmol/l","description":"Oestradiol is the primary oestrogen, present in small amounts in men where it supports bone density, brain function and cardiovascular health. At 145, it is within the laboratory range but above the optimal ceiling of 130. This is mildly elevated for a male and may be related to the aromatase activity seen with stress. It does not require treatment and should be monitored on retest.","low_causes":"Low body fat, low testosterone, medications","high_causes":"Obesity, liver disease, aromatase excess, medications","padding":"1","one_sided":"0","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6596","lower_normal":"0","upper_normal":"0.47","lower_optimal":"0","upper_optimal":"0.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4255","units":"nmol/l","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. At 0.62, it is above the male upper limit of 0.47. A marginally elevated level is rarely significant and can fluctuate with adrenal stress and cortisol production. His cortisol at 305 sits at the upper end of its range, and adrenal activity can produce a small amount of extra progesterone as a byproduct of cortisol synthesis. This is not a clinical concern.","low_causes":"","high_causes":"Adrenal stress, congenital adrenal hyperplasia, tumours (rare)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igf1","name":"Insulin-like Growth Factor-1 (IGF-1)","group":"HORMONES","result":"11.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2647","lower_normal":"12.6","upper_normal":"29.6","lower_optimal":"15","upper_optimal":"27","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3808","upper_optimal_position":"0.6188","units":"nmol/l","description":"IGF-1 is a hormone produced mainly by the liver in response to growth hormone and adequate nutrition, particularly protein and total calorie intake. It promotes tissue growth, repair and maintenance. At 11.2, it is below the lower limit of 12.6, confirming that the body is in a state of undernutrition. The liver reduces IGF-1 production when it senses insufficient fuel. Low IGF-1 is associated with reduced muscle maintenance, slower recovery, impaired immune function and lower energy. The answer is more food, specifically more protein (target 121 g per day), not a supplement.","low_causes":"Malnutrition, low protein intake, liver disease, growth hormone deficiency","high_causes":"Excess growth hormone, acromegaly","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"305","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5688","lower_normal":"69","upper_normal":"345","lower_optimal":"100","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3710","upper_optimal_position":"0.5870","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It rises in response to physical, metabolic and psychological stress. At 305, it is within the laboratory range but above the optimal ceiling of 280, sitting near the top of its range. In a man who has been chronically undereating, this is expected: the body raises cortisol to mobilise stored energy when dietary fuel is insufficient. Elevated cortisol promotes insulin resistance, raises SHBG, and can suppress immune function. As nutrition improves and metabolic stress reduces, cortisol should settle.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Physical or psychological stress, calorie restriction, Cushing's syndrome, medications (steroids)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"folliclestimulatinghormo","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3642","lower_normal":"1.5","upper_normal":"12.4","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3486","upper_optimal_position":"0.5321","units":"iu_l","description":"FSH stimulates sperm production in men and is regulated by the pituitary gland. At 2.51, it is within the optimal range, confirming normal pituitary-testicular signalling.","low_causes":"Pituitary disease, steroid use","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0","range_type":"normal"},{"key":"luteinisinghormone","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"3.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4493","lower_normal":"1.7","upper_normal":"8.6","lower_optimal":"2.5","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3812","upper_optimal_position":"0.5942","units":"iu_l","description":"LH stimulates the testes to produce testosterone. At 3.9, it is within the optimal range, confirming normal pituitary signalling and adequate testosterone production.","low_causes":"Pituitary disease, steroid use, severe illness","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3417","lower_normal":"86","upper_normal":"324","lower_optimal":"100","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3725","upper_optimal_position":"0.5813","units":"miu/l","description":"Prolactin is a pituitary hormone that, when elevated in men, can suppress testosterone and libido. At 88, it is just above the lower limit of 86 and within the laboratory range. Low-normal prolactin in a man is not a concern. Prolactin can be transiently low with stress.","low_causes":"Dopamine agonist medications","high_causes":"Stress, medications, pituitary tumours, hypothyroidism","padding":"1","one_sided":"0","range_type":"normal"},{"key":"dheas","name":"Dehydroepiandrosterone Sulphate (DHEAs)","group":"HORMONES","result":"12.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5531","lower_normal":"1.5","upper_normal":"17.7","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3827","upper_optimal_position":"0.6481","units":"umol/l","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to testosterone and oestrogen. At 12.2 umol/L (approximately 4,497 ug/dL), it is within the optimal range, indicating healthy adrenal function. This is a positive finding at 41.","low_causes":"Ageing, adrenal insufficiency, chronic stress","high_causes":"Adrenal tumours, PCOS (in women), congenital adrenal hyperplasia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"7.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6157","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and testosterone loosely bound to albumin (which can easily detach and enter cells). At 7.93, it is within the optimal range, confirming that despite the elevated SHBG, enough testosterone is reaching tissues for normal function.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"2.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol not bound to SHBG. It is reported for context and is not applicable at present.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"lhfshratio","name":"LH:FSH Ratio","group":"HORMONES","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"","upper_normal":"2","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"ratio","description":"This ratio compares the two pituitary hormones that regulate testicular function. At 1.55, it is within the laboratory range but marginally above the optimal ceiling of 1.5. In isolation, this is not significant. Both LH and FSH are individually within their optimal ranges.","low_causes":"","high_causes":"Pattern seen in polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"testosteronecortisolratio","name":"Testosterone:Cortisol Ratio","group":"HORMONES","result":"70.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6196","lower_normal":"15","upper_normal":"80","lower_optimal":"25","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5641","units":"x1000","description":"This ratio reflects the balance between anabolic (testosterone) and catabolic (cortisol) hormones. At 70.82, it is within the laboratory range but above the optimal ceiling of 60, driven by the cortisol sitting at the top of its range. A high cortisol relative to testosterone tips the body toward breakdown rather than repair. As nutritional stress reduces and cortisol falls, this ratio will improve.","low_causes":"High stress load, overtraining","high_causes":"High testosterone, low cortisol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.020","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3777","lower_normal":"0.35","upper_normal":"5.5","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3728","upper_optimal_position":"0.4638","units":"miu/l","description":"TSH is produced by the pituitary gland to stimulate the thyroid. At 1.02, it is within the optimal range of 1.0 to 2.5. A TSH at this level indicates the pituitary is satisfied with thyroid hormone output and is not pushing the thyroid to work harder. This rules out thyroid dysfunction as a cause of his fatigue, brain fog or feeling cold.","low_causes":"Hyperthyroidism, pituitary disease, medications","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19.10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5804","lower_normal":"11.9","upper_normal":"21.6","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4046","upper_optimal_position":"0.5825","units":"pmol/l","description":"FT4 is the main thyroid hormone circulating in the blood. At 19.1, it is within the optimal range of 14 to 20, indicating healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, medications","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3","name":"Free Tri-iodothyronine (FT3)","group":"THYROID","result":"4.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4981","lower_normal":"3.1","upper_normal":"6.8","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4279","upper_optimal_position":"0.6216","units":"pmol/l","description":"FT3 is the active thyroid hormone that drives metabolism, energy and body temperature. At 4.94, it is within the optimal range of 4.5 to 6.5. This confirms the thyroid is converting T4 to the active T3 form adequately. His feeling cold is therefore not thyroid-related and is more likely driven by the low calorie intake and low BMR.","low_causes":"Hypothyroidism, severe illness, calorie restriction (non-thyroidal illness)","high_causes":"Hyperthyroidism, thyroiditis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tbg","name":"Thyroxine-binding Globulin (TBG)","group":"THYROID","result":"17.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5549","lower_normal":"6.3","upper_normal":"22.7","lower_optimal":"10","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5732","units":"ug/ml","description":"TBG is the main carrier protein for thyroid hormones in the blood. At 17.3, it is within the optimal range, confirming normal thyroid hormone transport.","low_causes":"Liver disease, steroid use, nephrotic syndrome","high_causes":"Pregnancy, oestrogen therapy, hepatitis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.259","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"This ratio reflects how efficiently the body converts inactive T4 to active T3. At 0.259, it is within the laboratory range but just below the optimal threshold of 0.27. Given that both FT3 and FT4 are within their optimal ranges, this marginal ratio is not a concern. Conversion efficiency can be slightly reduced by calorie restriction and should improve with better nutrition.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tshft4ratio","name":"TSH:FT4 Ratio","group":"THYROID","result":"0.053","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0883","lower_normal":"","upper_normal":"0.3","lower_optimal":"","upper_optimal":"0.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"This ratio compares TSH to FT4 and reflects how hard the pituitary needs to work relative to thyroid output. At 0.053, it is very low, meaning the pituitary is barely having to push the thyroid at all. This confirms excellent thyroid function.","low_causes":"Optimal thyroid function, hyperthyroidism","high_causes":"Pituitary working harder to maintain thyroid output","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1829","lower_normal":"50","upper_normal":"375","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5487","units":"nmol/l","description":"Vitamin D supports immune function, bone health, mood, and energy. At 42, it is below the lower limit of 50 and well below the optimal range of 75 to 120. South Asian skin produces less vitamin D from sunlight at UK latitudes because higher melanin content reduces UV absorption. Combined with low dietary intake, deficiency is expected. Low vitamin D is associated with increased susceptibility to respiratory infections, which fits his pattern of frequent illness, as well as joint stiffness, fatigue and low mood. He needs supplementation at 4,000 IU daily year-round, with a retest in six months.","low_causes":"Insufficient sunlight, dark skin, low dietary intake, malabsorption, obesity","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"531","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5265","lower_normal":"197","upper_normal":"771","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4929","upper_optimal_position":"0.6699","units":"ng/l","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 531, it is just within the optimal range of 500 to 900. Given his dietary limitations, this is acceptable but would benefit from improvement. Meat, fish, eggs and dairy are the main dietary sources. If dietary intake remains low, sublingual methylcobalamin supplementation would be appropriate.","low_causes":"Low dietary intake (especially vegan/vegetarian), pernicious anaemia, malabsorption","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"activeb12","name":"Active B12","group":"VITAMINS & NUTRIENTS","result":"147.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6147","lower_normal":"25.1","upper_normal":"165","lower_optimal":"50","upper_optimal":"130","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3927","upper_optimal_position":"0.5571","units":"pmol/l","description":"Active B12 (holotranscobalamin) measures the portion of B12 available for cells to use, making it a more functional measure than total B12. At 147, it is within the laboratory range but above the optimal ceiling of 130. A high active B12 with a borderline total B12 is not a concern and simply reflects that a good proportion of the available B12 is in its active form. His intrinsic factor antibodies are negative, ruling out pernicious anaemia.","low_causes":"B12 deficiency, malabsorption, pernicious anaemia","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"folicacid","name":"Folic Acid","group":"VITAMINS & NUTRIENTS","result":"9.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"3","upper_normal":"26.8","lower_optimal":"8","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4034","upper_optimal_posit  CELIAC","result":"Positive","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"ANA tests for antibodies directed against the body's own cell nuclei, used as a screening test for autoimmune conditions including lupus, Sjogren's syndrome and others. A positive ANA is found in 15 to 20 percent of healthy people and does not, on its own, mean he has an autoimmune disease. His specific autoimmune markers (RF, anti-CCP, anti-TPO, anti-Tg) are all negative, which is reassuring. If joint stiffness worsens or new symptoms develop (rashes, mouth ulcers, dry eyes), a more detailed autoimmune panel (extractable nuclear antigens) could be considered.","low_causes":"","high_causes":"Autoimmune disease (SLE, Sjogren's, scleroderma), infections, medications, healthy individuals","padding":"1","one_sided":"0","range_type":"normal"},{"key":"intrinsicfactorantibodie","name":"Intrinsic Factor Antibodies","group":"AUTOIMMUNE & CELIAC","result":"<0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0075","lower_normal":"0","upper_normal":"20","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"u/ml","description":"These antibodies attack intrinsic factor, a protein needed to absorb vitamin B12 from the gut. A positive result indicates pernicious anaemia. At less than 0.3, this is clearly negative, ruling out pernicious anaemia and confirming that any B12 issue is dietary rather than autoimmune.","low_causes":"","high_causes":"Pernicious anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"antitg","name":"Anti-Thyroglobulin Antibody (Anti-Tg)","group":"AUTOIMMUNE & CELIAC","result":"<10.01","within_normal":"TRUE","wit // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
