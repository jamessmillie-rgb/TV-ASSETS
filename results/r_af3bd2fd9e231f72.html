.55, it is well below the male threshold of 0.7 and indicates a favourable balance between harmful and protective lipoproteins. This is a reassuring result.","low_causes":"","high_causes":"High ApoB, low ApoA-I, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"4.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5817","units":"mg/dl","description":"Apolipoprotein E plays a role in clearing triglyceride-rich lipoproteins from the blood. At 4.87, it is well within range, indicating normal lipoprotein clearance.","low_causes":"","high_causes":"Elevated triglycerides, genetic variants","padding":"1","one_sided":"0","range_type":"normal"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"24.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2024","lower_normal":"0","upper_normal":"60.8","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2467","units":"mg/dl","description":"Small dense LDL particles are considered more atherogenic than larger LDL particles because they penetrate artery walls more easily. At 24.6, well within the optimal ceiling of 30, this means the LDL he does have is predominantly the larger, less dangerous type. This is a positive finding.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"49.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"0","upper_normal":"75","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lp(a) is a genetically inherited lipoprotein that deposits cholesterol in artery walls, encourages blood clotting, and drives inflammation. Unlike other lipid markers, it cannot be changed by diet, exercise, weight loss or any currently available supplement. At 49.5, it is within the laboratory range of under 75 but above the optimal threshold of 32. This adds a small but permanent layer of cardiovascular risk. This result should be recorded permanently in his medical notes, and first-degree relatives (parents, siblings, children) should be tested, as they have a 50 percent chance of carrying the same elevated level.","low_causes":"","high_causes":"Entirely genetic, inherited from one or both parents","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"9.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3133","lower_normal":"0","upper_normal":"20","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.225","units":"umol/l","description":"Homocysteine is an amino acid that, when elevated, is associated with increased cardiovascular risk and can indicate suboptimal B12, folate or B6 status. At 9.4, it is within the laboratory range but marginally above the optimal ceiling of 9. His B12 at 531 and folate at 9.8 are within range but not yet at optimal levels, and as these improve with better nutrition, homocysteine should fall below 9.","low_causes":"","high_causes":"Low B12, low folate, low B6, genetic variants (MTHFR), kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"5.40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"4","upper_normal":"7","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4889","units":"mmol/l","description":"Fasting glucose measures blood sugar after an overnight fast. At 5.4, it sits exactly at the upper boundary of the optimal range of 4.0 to 5.4 and is within the laboratory range. While not elevated, in combination with the HOMA-IR of 2.88, it suggests the pancreas is working harder than ideal to keep glucose controlled. Consistent meals and exercise will help.","low_causes":"Fasting, excessive exercise, insulin-producing tumours","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, medications","padding":"1","one_sided":"0","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"41.42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4927","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c reflects average blood sugar over the past two to three months. At 41.42, it is within the laboratory range (below 42) but above the optimal ceiling of 36. The pre-diabetes threshold is 42, so this result is borderline. In a South Asian male, whose ethnic risk for type 2 diabetes is significantly elevated, this deserves attention. The combination of consistent meals, more fibre, and resistance exercise is the most effective way to lower HbA1c.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, diabetes, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"83.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3862","lower_normal":"17.8","upper_normal":"173","lower_optimal":"14","upper_optimal":"56","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3088","upper_optimal_position":"0.4548","units":"pmol/l","description":"Fasting insulin shows how much insulin the pancreas needs to produce to keep blood sugar controlled. At 83.2 pmol/L (approximately 11.9 mIU/L), it is within the laboratory range but well above the optimal ceiling of approximately 8 mIU/L (56 pmol/L). This means the pancreas is working harder than it should to maintain normal blood sugar, a hallmark of early insulin resistance. The HOMA-IR calculation confirms this. Consistent meals with adequate protein and fibre, and resistance exercise, are the most effective interventions.","low_causes":"Low carbohydrate diet, high insulin sensitivity, pancreatic insufficiency","high_causes":"Insulin resistance, high carbohydrate or sugar intake, obesity, stress, South Asian ethnicity","padding":"1","one_sided":"0","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","result":"0.310","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2778","units":"mmol/l","description":"Non-esterified fatty acids are free fats circulating in the blood, released from fat stores between meals. At 0.31, this is within the optimal range and suggests that fat metabolism is functioning normally despite the dietary challenges.","low_causes":"","high_causes":"Fasting, insulin resistance, diabetes, obesity, stress","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1250.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4801","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"500","upper_optimal":"1100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3706","upper_optimal_position":"0.5707","units":"pmol/l","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a more stable measure of how much insulin the pancreas is producing. The lab reported 3.78 ng/ml, which converts to 1,250 pmol/L. This is within the laboratory range but above the optimal ceiling, confirming that the pancreas is producing more insulin than ideal, consistent with the insulin resistance pattern seen in the HOMA-IR.","low_causes":"Type 1 diabetes, low carbohydrate diet, pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, obesity","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"255","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5503","lower_normal":"151","upper_normal":"300","lower_optimal":"180","upper_optimal":"270","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3944","upper_optimal_position":"0.5839","units":"umol/l","description":"Fructosamine reflects average blood sugar over the past two to three weeks, offering a shorter window than HbA1c. At 255, it is within range and suggests blood sugar has been reasonably controlled in the recent term.","low_causes":"Low albumin, blood loss","high_causes":"Poorly controlled diabetes, high blood sugar","padding":"1","one_sided":"0","range_type":"normal"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"1.47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3387","lower_normal":"1.44","upper_normal":"7.27","lower_optimal":"3","upper_optimal":"7.27","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5671","upper_optimal_position":"1","units":"ug/ml","description":"Adiponectin is a hormone produced by fat cells that improves insulin sensitivity, reduces inflammation, and protects blood vessels. At 1.47, it is barely above the lower limit of 1.44 and far below the optimal threshold of 3.0. Low adiponectin is strongly associated with insulin resistance and is common in South Asian populations. As insulin sensitivity improves through exercise and consistent nutrition, adiponectin typically rises.","low_causes":"Insulin resistance, visceral obesity, South Asian ethnicity, physical inactivity","high_causes":"Good insulin sensitivity, regular exercise, weight loss","padding":"1","one_sided":"0","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4929","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over two to three months. At 6.9, it is within the laboratory range but above the optimal ceiling of 6.2. This is consistent with the borderline HbA1c of 41.42 and reflects the early insulin resistance.","low_causes":"Very low carbohydrate diet, excellent insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index, derived from fasting triglycerides and glucose, is a surrogate marker of insulin resistance. At 8.39, it is within the optimal range, suggesting that the lipid arm of insulin resistance has not yet developed significantly. The HOMA-IR, which uses insulin directly, is more sensitive and has flagged the issue earlier.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5760","lower_normal":"","upper_normal":"2.5","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"HOMA-IR is a calculated index of insulin resistance derived from fasting glucose and fasting insulin. At 2.88, it is above the upper limit of 2.0 and above the optimal ceiling of 1.5. This confirms early insulin resistance: the body needs more insulin than normal to keep blood sugar in range. In a lean South Asian male, this is a significant metabolic signal. The most effective interventions are consistent meals (not calorie restriction), adequate protein and fibre, and resistance exercise.","low_causes":"High insulin sensitivity, low carbohydrate intake","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"126","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"60","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"%","description":"HOMA-B estimates pancreatic beta-cell function, measuring how well the insulin-producing cells are working. At 126%, it is within the optimal range, confirming the pancreas is producing adequate insulin. The problem is not insulin production but insulin resistance, as shown by the elevated HOMA-IR.","low_causes":"Beta cell exhaustion","high_causes":"Compensation for insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucoseinsulinratio","name":"Glucose:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"8.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9000","lower_normal":"4.5","upper_normal":"","lower_optimal":"7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7778","upper_optimal_position":"1.0000","units":"mg/dL per mIU/L","description":"This ratio compares glucose to insulin, where a lower ratio indicates the body needs more insulin per unit of glucose. At 8.1, it is above both the lower limit of 4.5 and the optimal threshold of 7, suggesting insulin efficiency is still borderline acceptable despite the HOMA-IR being elevated.","low_causes":"Insulin resistance","high_causes":"High insulin sensitivity, low carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"adiponectininsulinratio","name":"Adiponectin:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"0.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2000","lower_normal":"0.3","upper_normal":"","lower_optimal":"0.7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"1.0000","upper_optimal_position":"1.0000","units":"ratio","description":"This ratio combines adiponectin (an insulin-sensitising hormone) with insulin to provide a composite measure of metabolic health. At 0.12, it is well below the lower limit of 0.3, confirming the insulin resistance pattern. The combination of very low adiponectin and above-optimal insulin produces this unfavourable ratio. Exercise and consistent nutrition are the primary levers to improve both components.","low_causes":"Low adiponectin with high insulin, metabolically unhealthy weight","high_causes":"High insulin sensitivity, high adiponectin, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"1.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8900","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mg/l","description":"HsCRP measures low-grade systemic inflammation. At 1.78, it is above the ideal ceiling of 1.0. In a lean non-drinker, this is higher than expected and is most likely driven by the active immune process reflected in the elevated IgE and eosinophils, along with the general inflammatory burden of nutritional deficiency. Once the underlying cause is identified and nutrition improves, this should fall.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, poor diet, autoimmune conditions, allergic or parasitic response","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"191.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4798","lower_normal":"0","upper_normal":"200","lower_optimal":"0","upper_optimal":"150","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"iu/ml","description":"ASO measures antibodies against streptococcal bacteria, indicating recent or past streptococcal infection (such as a throat or skin infection). At 191.9, it is just within the upper limit of 200, suggesting relatively recent streptococcal exposure. This is consistent with his pattern of frequent illness. It does not require treatment at present but is worth monitoring if joint symptoms worsen.","low_causes":"","high_causes":"Recent streptococcal infection, rheumatic fever, post-streptococcal glomerulonephritis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","result":"0.090","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1016","lower_normal":"0","upper_normal":"0.443","lower_optimal":"0","upper_optimal":"0.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3386","units":"ug/ml","description":"D-Dimer is a breakdown product of blood clots. A low level rules out significant active clotting. At 0.090, this is well within range and reassuring.","low_causes":"","high_causes":"Blood clots (DVT, PE), recent surgery, inflammation, infection, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il5","name":"Interleukin-5 (IL-5)","group":"INFLAMMATION","result":"<0.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0","lower_normal":"0","upper_normal":"1.49","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3356","units":"pg/ml","description":"IL-5 is a cytokine that promotes eosinophil production and activation. Despite the elevated eosinophil count, IL-5 is undetectable, which is interesting and may suggest the eosinophil elevation is being driven by other pathways (such as IgE-mediated activation) rather than IL-5. This is a nuance for specialist interpretation if needed.","low_causes":"","high_causes":"Allergic disease, parasitic infection, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il8","name":"Interleukin-8 (IL-8)","group":"INFLAMMATION","result":"7.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3475","lower_normal":"4.94","upper_normal":"240.09","lower_optimal":"4.94","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.3695","units":"pg/ml","description":"IL-8 is a cytokine that attracts neutrophils to sites of infection or injury. At 7.35, it is at the lower end of range, indicating no significant neutrophilic inflammation. The lab noted this sample was received at incorrect temperature; however, the result is within expected range and consistent with the clinical picture.","low_causes":"","high_causes":"Active infection, inflammation, tissue injury","padding":"1","one_sided":"0","range_type":"normal"},{"key":"il15","name":"Interleukin-15 (IL-15)","group":"INFLAMMATION","result":"0.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1554","lower_normal":"0.89","upper_normal":"2.02","lower_optimal":"1.0","upper_optimal":"1.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3659","upper_optimal_position":"0.6136","units":"pg/ml","description":"IL-15 is a cytokine critical for the development, survival and function of natural killer (NK) cells and memory T-cells, which form the first line of defence against viruses. At 0.52, it is below the lower limit of 0.89. Low IL-15 may contribute to the frequent infections he describes. Nutritional deficiency, particularly of zinc, copper and overall calorie intake, can suppress cytokine production. This is expected to improve as nutrition is restored.","low_causes":"Malnutrition, chronic stress, immune dysregulation","high_causes":"Autoimmune disease, chronic inflammation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"egf","name":"Epidermal Growth Factor (EGF)","group":"INFLAMMATION","result":"113","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4610","lower_normal":"29","upper_normal":"240","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3665","upper_optimal_position":"0.6068","units":"pg/ml","description":"EGF is a growth factor involved in cell growth and tissue repair. At 113, it is within range, suggesting normal tissue repair capacity.","low_causes":"Malnutrition, chronic illness","high_causes":"Tissue injury, certain cancers","padding":"1","one_sided":"0","range_type":"normal"},{"key":"hbegf","name":"Heparin-binding EGF-like Growth Factor (HB-EGF)","group":"INFLAMMATION","result":"97.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5569","lower_normal":"17.99","upper_normal":"135.99","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3672","upper_optimal_position":"0.5612","units":"pg/ml","description":"HB-EGF is a growth factor involved in wound healing and tissue repair. At 97.77, it is within the laboratory range. This is not a concern and reflects normal tissue maintenance.","low_causes":"","high_causes":"Tissue injury, inflammation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"mcp1","name":"Monocyte Chemotactic Protein-1 (MCP-1)","group":"INFLAMMATION","result":"300","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5197","lower_normal":"130","upper_normal":"433","lower_optimal":"150","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3554","upper_optimal_position":"0.5545","units":"pg/ml","description":"MCP-1 is a cytokine that recruits monocytes to sites of inflammation. At 300, it is within the laboratory range and at the boundary of the optimal ceiling. This is not a concern on its own.","low_causes":"","high_causes":"Chronic inflammation, obesity, atherosclerosis, infection","padding":"1","one_sided":"0","range_type":"normal"},{"key":"gmcsf","name":"Granulocyte Macrophage Colony Stimulating Factor (GM-CSF)","group":"INFLAMMATION","result":"<0.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0","lower_normal":"0","upper_normal":"1.46","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3425","units":"pg/ml","description":"GM-CSF stimulates the bone marrow to produce white blood cells. Undetectable in healthy individuals is normal. This is a reassuring result.","low_causes":"","high_causes":"Active infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"interleukin17a","name":"Interleukin 17A","group":"INFLAMMATION","result":"<0.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0","lower_normal":"0","upper_normal":"1.13","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3540","units":"pg/ml","description":"IL-17A is a pro-inflammatory cytokine involved in autoimmune and inflammatory responses. Undetectable is the expected finding in a healthy person and is reassuring given the positive ANA.","low_causes":"","high_causes":"Autoimmune disease, psoriasis, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"interleukin17f","name":"Interleukin 17F","group":"INFLAMMATION","result":"<0.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0","lower_normal":"0","upper_normal":"0.44","lower_optimal":"0","upper_optimal":"0.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3409","units":"pg/ml","description":"IL-17F is a pro-inflammatory cytokine similar to IL-17A. Undetectable is normal and reassuring.","low_causes":"","high_causes":"Autoimmune disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"interleukin22","name":"Interleukin 22","group":"INFLAMMATION","result":"3.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2782","lower_normal":"0","upper_normal":"6.51","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3841","units":"pg/ml","description":"IL-22 is a cytokine involved in gut barrier defence and tissue repair. At 3.62, it is within range, suggesting the gut mucosal barrier is being maintained.","low_causes":"","high_causes":"Inflammatory bowel disease, psoriasis, infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"adjusted","name":"Calcium (adjusted)","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/l","description":"Adjusted calcium is corrected for albumin levels to give a true reading of calcium in the blood. At 2.42, it is within the optimal range. Calcium is essential for bones, nerve function and muscle contraction. This is reassuring given his low vitamin D, as calcium levels have been maintained.","low_causes":"Low vitamin D, low parathyroid hormone, malnutrition","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D","padding":"1","one_sided":"0","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"103.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5487","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that helps maintain fluid balance and acid-base equilibrium. At 103.4, it is within the optimal range. Chloride tends to rise slightly when bicarbonate falls, as is seen here, maintaining electrical neutrality in the blood.","low_causes":"Vomiting, metabolic alkalosis","high_causes":"Dehydration, metabolic acidosis, renal tubular acidosis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.770","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3917","lower_normal":"0.7","upper_normal":"1.1","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"mmol/l","description":"Magnesium is essential for hundreds of enzymatic reactions, including energy production, muscle relaxation and nerve function. At 0.77, it is within the laboratory range but below the optimal threshold of 0.85. Low-optimal magnesium can contribute to muscle stiffness, poor sleep quality, and afternoon energy crashes. Given his low dietary intake, supplementation with magnesium glycinate before bed would be beneficial.","low_causes":"Poor dietary intake, malabsorption, alcohol, certain medications","high_causes":"Renal impairment, excess supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.270","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5571","lower_normal":"0.8","upper_normal":"1.5","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"mmol/l","description":"Phosphate works alongside calcium for bone health and is essential for energy production (ATP). At 1.27, it is comfortably within the optimal range.","low_causes":"Malnutrition, vitamin D deficiency, hyperparathyroidism","high_causes":"Kidney disease, excess vitamin D, hypoparathyroidism","padding":"1","one_sided":"0","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4759","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is an electrolyte essential for heart rhythm, muscle contraction and nerve function. At 4.27, it is within the optimal range. This is a reassuring result.","low_causes":"Vomiting, diarrhoea, diuretics, malnutrition","high_causes":"Kidney disease, medications (ACE inhibitors), haemolysis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"138.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4846","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the primary electrolyte controlling fluid balance and blood pressure. At 138.9, it is within the optimal range and indicates healthy hydration and kidney regulation.","low_causes":"Excess fluid intake, heart failure, liver disease, medications","high_causes":"Dehydration, excess salt intake","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1905","lower_normal":"22","upper_normal":"29","lower_optimal":"23","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"mmol/l","description":"Bicarbonate is part of the body's acid-base buffering system. At 19.0, it is below the lower limit of 22, indicating a mild metabolic acidosis. In a man who has been chronically undereating, the most likely explanation is that the body is generating acidic byproducts from breaking down fat and protein for energy, which consume bicarbonate. Increasing food intake, particularly carbohydrate and vegetables (which are alkaline-forming), should correct this. If it persists after dietary improvement, kidney tubular function should be checked.","low_causes":"Metabolic acidosis, chronic energy deficit, diarrhoea, renal tubular acidosis, ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"ELECTROLYTES & MINERALS","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4151","lower_normal":"1.6","upper_normal":"6.9","lower_optimal":"2.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3585","upper_optimal_position":"0.5660","units":"pmol/l","description":"PTH regulates calcium and phosphate levels by acting on bones, kidneys and the gut. At 2.6, it is within the optimal range. Despite the low vitamin D, PTH has not risen to compensate, which means calcium levels have been maintained. If vitamin D remains low, PTH may eventually rise (secondary hyperparathyroidism), so correcting the vitamin D deficiency now prevents that.","low_causes":"Excess vitamin D, hypoparathyroidism","high_causes":"Low vitamin D, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"dkk1","name":"Dickkopf-1 (DKK-1)","group":"ELECTROLYTES & MINERALS","result":"2381.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5499","lower_normal":"719.4","upper_normal":"3261.7","lower_optimal":"1000","upper_optimal":"2500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703","upper_optimal_position":"0.5940","units":"pg/ml","description":"DKK-1 is a protein involved in bone metabolism that inhibits the Wnt signalling pathway, which is responsible for bone formation. At 2381, it is within the laboratory range. Elevated DKK-1 can be associated with reduced bone formation, but at this level within range, it is not a concern. Maintaining adequate vitamin D, calcium and exercise will support healthy bone turnover.","low_causes":"","high_causes":"Bone metastases, osteoporosis, certain cancers","padding":"1","one_sided":"0","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"ELECTROLYTES & MINERALS","result":"77.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5613","lower_normal":"64","upper_normal":"83","lower_optimal":"68","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6140","units":"g/l","description":"Total protein is the sum of albumin and globulin in the blood. At 77.1, it is within the optimal range, indicating adequate protein in the bloodstream despite his low dietary intake. The body maintains blood protein levels until deficiency is quite advanced, so this does not mean dietary protein is sufficient.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, dehydration, autoimmune disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"microalbumincreatininera","name":"Microalbumin / Creatinine Ratio","group":"KIDNEY FUNCTION","result":"not detected","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0","upper_normal":"30","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/mmol","description":"This ratio measures tiny amounts of albumin leaking into the urine, which is an early marker of kidney damage. Not detected means the kidneys are filtering perfectly with no albumin leakage. This is an excellent result.","low_causes":"","high_causes":"Diabetes, hypertension, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"78.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4558","lower_normal":"64","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5917","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 78.7, it is within the optimal range and gives a creatinine-based eGFR of 110, indicating excellent kidney function.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high protein diet, intense exercise","padding":"1","one_sided":"0","range_type":"normal"},{"key":"egfr","name":"Estimated Glomerular Filtration Rate (eGFR)","group":"KIDNEY FUNCTION","result":"110","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.7","description":"eGFR estimates how well the kidneys filter waste from the blood. At 110, based on creatinine, this is well above the optimal threshold of 90 and indicates excellent kidney filtration.","low_causes":"Kidney disease, dehydration, ageing","high_causes":"","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5903","lower_normal":"0.57","upper_normal":"1.05","lower_optimal":"0.6","upper_optimal":"0.9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"mg/l","description":"Cystatin C is a protein filtered by the kidneys that provides a more accurate measure of kidney function than creatinine because it is not affected by muscle mass. At 0.96, it is within the laboratory range but above the optimal ceiling of 0.9, giving a cystatin C-based eGFR of 89, which is just below the optimal threshold of 90. The combined eGFR of 100 (using both creatinine and cystatin C together) is the most reliable estimate and sits comfortably in the healthy range. The slight discrepancy between the two eGFR estimates is not a concern at 41.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"beta2microglobulin","name":"Beta-2-Microglobulin","group":"KIDNEY FUNCTION","result":"1.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0.9","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3492","upper_optimal_position":"0.5397","units":"mg/l","description":"Beta-2-microglobulin is a protein found on the surface of most cells and is filtered by the kidneys. It can rise with kidney disease, inflammation, or certain blood cancers. At 1.60, it is within the optimal range, confirming healthy kidney function and no lymphoproliferative concern.","low_causes":"","high_causes":"Kidney disease, lymphoma, myeloma, inflammation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4434","lower_normal":"2.5","upper_normal":"7.8","lower_optimal":"3.0","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3648","upper_optimal_position":"0.5849","units":"mmol/l","description":"Urea is a waste product from protein breakdown, filtered by the kidneys. At 4.26, it is within the optimal range. In a man who is undereating, urea can be low if protein intake is very low; at 4.26, it suggests some protein is being consumed but not excessively.","low_causes":"Low protein intake, liver disease","high_causes":"Kidney disease, dehydration, high protein intake, GI bleeding","padding":"1","one_sided":"0","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"340.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5363","lower_normal":"200","upper_normal":"430","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5797","units":"umol/l","description":"Uric acid is a waste product from purine metabolism. Elevated levels can cause gout and are associated with cardiovascular risk. At 340.3, it is within the optimal range of 200 to 380 for a male. This is a healthy result.","low_causes":"Low purine diet, some medications","high_causes":"High purine diet (red meat, shellfish), alcohol, obesity, kidney disease, gout","padding":"1","one_sided":"0","range_type":"normal"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C alone, which is not affected by muscle mass and can be more accurate than creatinine-based eGFR. At 89, it is just below the optimal threshold of 90 but well above the lower limit of 60. The combined eGFR (using both creatinine and cystatin C) is 100, which is the most reliable estimate and confirms healthy kidney function at 41.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8333","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C, making it the most accurate estimate of kidney filtration rate. At 100, it is well above the optimal threshold of 90 and confirms excellent kidney function.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"54.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4117","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio helps distinguish between pre-renal (dehydration), renal and post-renal causes of kidney dysfunction. At 54.1, it is within the optimal range, confirming normal kidney function and hydration status.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"150.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/l","description":"Haemoglobin is the protein in red blood cells that carries oxygen to tissues. At 150, it is within the optimal range of 140 to 160 for a male, confirming adequate oxygen-carrying capacity. No anaemia.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, high altitude, smoking","padding":"1","one_sided":"0","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"46.400","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"40","upper_normal":"54","lower_optimal":"42","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"%","description":"Haematocrit is the percentage of blood volume occupied by red blood cells. At 46.4%, it is within the optimal range, indicating healthy blood viscosity and red cell volume.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Dehydration, polycythaemia, high altitude","padding":"1","one_sided":"0","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"26.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2667","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH is the average amount of haemoglobin in each red blood cell. At 26.0, it is just below the lower limit of 27. Combined with an MCV at the lower end of range (80.6), this suggests his red cells are slightly smaller and carry slightly less haemoglobin than average. His iron studies are reassuring (ferritin 74, transferrin saturation 29.5%), so iron deficiency is not the cause. The most likely explanation is either thalassaemia trait, which is common in South Asian populations, or simply his personal normal. A haemoglobin electrophoresis through his GP would settle the question.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism","padding":"1","one_sided":"0","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"323.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"320","upper_normal":"360","lower_optimal":"330","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/l","description":"MCHC is the average concentration of haemoglobin within each red blood cell. At 323, it is within the laboratory range but just above the lower limit, sitting below the optimal threshold of 330. This is consistent with the low MCH and low-end MCV, forming a coherent picture of slightly smaller red cells. It is not a concern on its own.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"Hereditary spherocytosis, haemolysis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"mcv","name":"Red Blood Cell Mean Cell Volume (MCV)","group":"HEMATOLOGY","result":"80.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3694","lower_normal":"76","upper_normal":"100","lower_optimal":"82","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5972","units":"fl","description":"MCV measures the average size of red blood cells. At 80.6, it is within the laboratory range but at the lower end, below the optimal threshold of 82. Smaller red cells can indicate iron deficiency or thalassaemia trait. Since iron studies are normal, thalassaemia trait is the more likely explanation in a South Asian male.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, liver disease, alcohol, hypothyroidism","padding":"1","one_sided":"0","range_type":"normal"},{"key":"redbloodcellcount","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5433","lower_normal":"4.5","upper_normal":"6.5","lower_optimal":"4.7","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"10^12/l","description":"This counts the total number of red blood cells. At 5.76, it is within the optimal range. Notably, a slightly elevated red cell count with smaller cells is a classic thalassaemia trait pattern, where the body compensates for smaller cells by making more of them. This is harmless if confirmed.","low_causes":"Anaemia, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, thalassaemia trait, high altitude","padding":"1","one_sided":"0","range_type":"normal"},{"key":"basophilcount","name":"Basophil Count","group":"HEMATOLOGY","result":"0.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"10^9/l","description":"Basophils are a type of white blood cell involved in allergic and inflammatory responses. At 0.11, it is just above the upper limit of 0.1. This is a minor elevation that, in the context of the significantly raised IgE and eosinophils, supports an active allergic or parasitic immune process. Basophils release histamine and other mediators during allergic reactions.","low_causes":"Steroid use, acute stress, hyperthyroidism","high_causes":"Allergic reactions, parasitic infection, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"eosinophilcount","name":"Eosinophil Count","group":"HEMATOLOGY","result":"0.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8722","lower_normal":"0.04","upper_normal":"0.4","lower_optimal":"0.04","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5741","units":"10^9/l","description":"Eosinophils are white blood cells that rise in response to allergic reactions and parasitic infections. At 0.65, this is more than one and a half times the upper limit of 0.4 and is one of the most significant findings in this report. Combined with the IgE of 477 and the basophils above range, this forms a clear pattern of an active allergic or parasitic immune response. Stool testing for parasites should be the first investigation.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergic disease, parasitic infection, asthma, eczema, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"3.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5547","lower_normal":"1","upper_normal":"3.5","lower_optimal":"1.5","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6133","units":"10^9/l","description":"Lymphocytes are white blood cells that include T-cells, B-cells and natural killer cells, forming the core of the adaptive immune system. At 3.16, this is within the optimal range, meaning the adaptive immune system has adequate cell numbers to mount responses. This is a reassuring result given his frequent illness.","low_causes":"Viral infections, steroid use, malnutrition, HIV","high_causes":"Viral infections, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5444","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"10^9/l","description":"Monocytes are white blood cells that migrate into tissues to become macrophages, engulfing pathogens and dead cells. At 0.66, this is within the optimal range.","low_causes":"Bone marrow disorders, steroid use","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophil Count","group":"HEMATOLOGY","result":"4.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4649","lower_normal":"2","upper_normal":"7.5","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"10^9/l","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infections. At 4.28, this is within the optimal range, indicating the body has adequate bacterial defence capability.","low_causes":"Viral infections, medications, bone marrow disorders, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, steroid use","padding":"1","one_sided":"0","range_type":"normal"},{"key":"whitebloodcellcount","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"8.86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5477","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"10^9/l","description":"The total white blood cell count measures the overall number of immune cells in the blood. At 8.86, it is within the laboratory range but above the optimal ceiling of 8. The elevation is partly explained by the raised eosinophils (0.65) and basophils (0.11), which together add 0.76 to the total. The remaining white cell populations are all within their optimal ranges.","low_causes":"Viral infections, bone marrow disorders, malnutrition, medications","high_causes":"Infection, inflammation, allergic response, stress, steroid use","padding":"1","one_sided":"0","range_type":"normal"},{"key":"plateletcount","name":"Platelet Count","group":"HEMATOLOGY","result":"290","within_normal":"TRUE","within_optimal":"TRUE"," lects the balance between innate (monocyte) and adaptive (lymphocyte) immunity. At 0.21, it is within the optimal range.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lmr","name":"Lymphocyte-to-Monocyte Ratio","group":"HEMATOLOGY","result":"4.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4351","lower_normal":"2.5","upper_normal":"10","lower_optimal":"3.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5778","units":"ratio","description":"The lymphocyte-to-monocyte ratio is the inverse of the MLR and provides a similar measure of immune balance. At 4.79, it is within the optimal range, confirming healthy immune cell proportions.","low_causes":"Chronic inflammation","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nmr","name":"Neutrophil-to-Monocyte Ratio","group":"HEMATOLOGY","result":"6.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"4","upper_normal":"14","lower_optimal":"5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5333","units":"ratio","description":"This ratio compares neutrophils to monocytes. At 6.5, it is within the optimal range, indicating a normal balance within the innate immune system.","low_causes":"","high_causes":"Acute inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Iron","group":"IRON STUDIES","result":"17.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4680","lower_normal":"5.8","upper_normal":"34.5","lower_optimal":"10","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3822","upper_optimal_position":"0.5910","units":"umol/
