<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Omar Aziz","dob":"21/04/1985","report_date":"2026-10-16","summary":"Patient is a 41-year-old South Asian male presenting with a BMI of 23.9, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are small or he often skips meals (volume 2 out of 10). He does no structured cardio or resistance training and takes 5,000 to 7,500 steps a day. He sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress feels hard to manage some weeks. He does not drink alcohol, takes no medications or supplements, and has no diagnosed conditions. He reports brain fog, frequent illness (roughly every five to six weeks), joint pain and stiffness, feeling cold with cold hands and feet, headaches, and an afternoon energy dip, all developing over the last several months after a period during which he did not have reliable access to enough food. His goals are to improve energy, boost immune resilience, and support long-term health. He has not had blood tests before. There is no reported family history.\n\nThe single most important finding in this report is that his immune system is signalling an active allergic or parasitic response. His Immunoglobulin E, which is the antibody class the body produces in response to allergens, parasites and certain infections, is 477, almost five times the upper limit of 100. That is not a borderline finding. Alongside it, his eosinophil count, a white blood cell type that rises in allergic and parasitic conditions, is 0.65, more than one and a half times the upper limit of 0.4, and his basophil count, another cell type involved in allergic and parasitic reactions, is 0.11, just above the upper limit of 0.1. Together, these three markers form a coherent pattern. In a man with no history of asthma, eczema or known allergies, living in the UK, the two most likely explanations are a new environmental or food allergy that has developed over the past year, or a parasitic infection picked up from food, water or travel. The fact that he has been getting ill every five to six weeks, and that these symptoms began after his diet became unreliable, makes both explanations plausible, but the parasitic possibility needs to be excluded first because it is treatable and because a heavy IgE response like this is more typical of parasitic infection than mild allergy. His GP should order stool ova and parasite testing (ideally three samples on separate days), a total IgE confirmation, and possibly specific IgE panels for common environmental and food allergens. If stool testing is negative, referral to immunology or allergy services would be appropriate.\n\nHis Anti-Nuclear Antibodies, which are antibodies directed against the body's own cell nuclei and are used as a screening test for autoimmune conditions, have come back positive. In isolation, a positive ANA is common, occurring in around 15 to 20 percent of healthy people, and it does not mean he has an autoimmune disease. However, in the context of his joint stiffness, feeling cold, and frequent illness, it is worth noting. His rheumatoid factor and anti-CCP antibodies, which are specific markers for rheumatoid arthritis, are both clearly negative, which is reassuring and makes rheumatoid arthritis very unlikely. The positive ANA is most likely incidental, but his GP should be aware of it alongside his joint symptoms. If joint stiffness worsens or new symptoms develop, a more detailed autoimmune panel (extractable nuclear antigens) could be considered.\n\nHis high-sensitivity CRP, a marker of systemic inflammation, is 1.78, above the ideal threshold of 1.0. This is not dramatically elevated, but in a lean 41-year-old non-drinker, it is higher than expected and is consistent with an immune system that is actively working, whether against an allergen, a pathogen, or the general inflammatory burden of nutritional deficiency. The elevated eosinophils and IgE provide a plausible explanation. If those are addressed, the CRP may fall on its own.\n\nHis Interleukin-15, a cytokine involved in the development and survival of natural killer cells and memory T-cells, is 0.52, below the lower limit of 0.89. IL-15 supports the immune cells that form the first line of defence against viruses, and a low level may contribute to his pattern of catching infections frequently. Nutritional deficiency, particularly of zinc and copper, can suppress cytokine production, and both are relevant here.\n\nHis copper is 9.5, below the lower limit of 11. Copper is an essential trace mineral involved in immune function, iron metabolism, connective tissue formation, and energy production. Low copper can contribute to fatigue, joint stiffness, poor wound healing, and impaired immune defence, all of which he reports. In a man who has not been eating enough, and whose vegetable and fruit intake is 0 to 1 portions a day, copper deficiency from inadequate dietary intake is the most likely explanation. Shellfish, liver, nuts, seeds, and dark chocolate are the richest dietary sources. A short course of supplementation alongside dietary improvement would be appropriate.\n\nHis vitamin D is 42, below the lower limit of 50 and well below the optimal range of 75 to 120. Vitamin D supports immune function, bone health, mood, and energy. At 42, his immune system is not getting the support it needs, and low vitamin D is associated with increased susceptibility to respiratory infections, which fits his pattern of frequent illness. South Asian skin produces less vitamin D from sunlight at UK latitudes, and his low dietary intake compounds the problem. He needs supplementation through the winter and likely year-round.\n\nHis IGF-1, which is Insulin-like Growth Factor 1, a hormone produced mainly by the liver in response to growth hormone and adequate nutrition, is 11.2, just below the lower limit of 12.6. IGF-1 is a sensitive marker of nutritional status, particularly protein and calorie intake. When the body is not getting enough food, IGF-1 drops because the liver reduces its production to conserve energy. This is one of the clearest signals in the report that his body has been in a state of undernutrition. Low IGF-1 is associated with reduced muscle maintenance, slower recovery, impaired immune function, and lower energy, all of which he describes. The answer is not a supplement; it is more food, and specifically more protein.\n\nHis lipase, an enzyme produced by the pancreas to digest fat, is 82, above the upper limit of 65. His pancreatic amylase, the companion enzyme for carbohydrate digestion, is 51, just within range at a limit of 53. An isolated mild lipase elevation without abdominal pain, nausea or vomiting is common and is usually not clinically significant, but in a man who has been eating irregularly and has a very low calorie intake, the pancreas may be responding to erratic meal patterns. This should be mentioned to his GP for a baseline record, and if he develops any upper abdominal pain or symptoms after eating fatty food, it should be investigated further.\n\nHis SHBG, which is Sex Hormone Binding Globulin, a protein produced by the liver that binds testosterone and carries it in the blood, is 57.1, above the upper limit of 54.1. When SHBG is high, more testosterone is bound and less is available to tissues. His total testosterone is a healthy 21.6, well within the optimal range of 18 to 30, but his free testosterone, the portion available to muscles, brain and other tissues, is 0.315, which sits in the lower half of its range. SHBG tends to rise when calorie intake is low and when body fat is low, both of which apply here. As his nutrition improves, SHBG should fall and free testosterone should rise. This is not a finding that needs treatment; it needs food.\n\nHis bicarbonate is 19.0, below the lower limit of 22. Bicarbonate is part of the body's acid-base buffering system. A low level suggests a mild metabolic acidosis, meaning the blood is slightly more acidic than it should be. In a man who is undereating, the most likely explanation is that the body is breaking down fat and, to some extent, muscle for energy, producing acidic byproducts (ketones and organic acids) that consume bicarbonate. His urine ketones are negative, so this is not a dramatic ketotic state, but a mild, chronic energy deficit can lower bicarbonate without producing detectable urine ketones. Eating more, and specifically more carbohydrate and vegetables (which are alkaline-forming), should normalise this.\n\nHis MCH, which is the average amount of haemoglobin packed into each red blood cell, is 26.0, just below the lower limit of 27. His MCV, the average size of each red cell, is 80.6, within range but sitting at the lower end. Together, these suggest his red cells are on the smaller side with slightly less haemoglobin than ideal. This is a pattern seen in early iron deficiency or in South Asian populations as a normal variant (thalassaemia trait). His iron studies, however, are reassuring: ferritin at 74, transferrin saturation at 29.5 percent, and serum iron at 17.4 are all comfortably within the optimal range. This means his iron stores are healthy and his bone marrow has enough iron to work with. The most likely explanation for the low MCH is either a mild thalassaemia trait, which is common in South Asian populations, or simply being at the lower end of his personal normal. His Mentzer index is 14, which is above the 13 threshold that would point toward thalassaemia trait, so this does not strongly suggest it, but if he has never been tested, a haemoglobin electrophoresis through his GP would settle the question. It is not urgent.\n\nHis progesterone is 0.62, above the upper limit of 0.47 for males. In men, progesterone is produced in small amounts by the adrenal glands and testes. A marginally elevated level is rarely significant and can fluctuate with stress and cortisol production. His cortisol at 305 is at the upper end of its range (69 to 345), which is consistent with a body under nutritional and physical stress, and adrenal activity can produce a small amount of extra progesterone as a byproduct of cortisol synthesis. This does not need investigation.\n\nHis Epstein-Barr Nuclear Antigen IgG is 199, well above the positive threshold of 1.0. This confirms past Epstein-Barr virus infection (the virus that causes glandular fever). EBNA IgG remains positive for life after infection and simply means he was exposed at some point, probably during childhood or adolescence. His VCA IgM, which would be raised during an active or recent infection, is 0.376, well below the positive threshold, confirming there is no current EBV reactivation. This is not a concern.\n\nTurning to the positives, and there are many. His liver is in excellent health. ALT at 14, AST at 20.4, GGT at 18.6, GLDH at 2.0, bilirubin at 8, and bile acids at 2.3 are all well within range, and his FIB-4 score, a calculated index that estimates liver scarring, is 0.77, comfortably below the 1.3 threshold, meaning there is no sign of fibrosis whatsoever. His liver is clean and unstressed. His kidneys are working well, with creatinine at 78.7, urea at 4.26, and a cystatin C of 0.96 giving a cystatin C-based eGFR of 89 and a combined eGFR of 100, both indicating healthy filtration. His urine is completely clear with no protein, no blood, no glucose, and no signs of infection. His thyroid is functioning well, with a TSH of 1.02, comfortably within the optimal range of 1.0 to 2.5, free T4 at 19.1, and free T3 at 4.94, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His coeliac screen is negative. His cardiac markers, including troponin T, CK-MB, myoglobin, and FABP-3, are all well within range, showing no cardiac stress. His fasting glucose at 5.4 and HbA1c at 41.42 are within the laboratory range, though both sit at the upper end of where they should ideally be, a point worth returning to. His tumour markers, including AFP, CEA, CA 19-9, NSE, mesothelin, calcitonin, and hCG, are all within range. His total PSA is 0.98, well within the normal range for his age, and his D-dimer at 0.090 rules out any active clotting concern. His complement proteins C3 and C4 are healthy, his haptoglobin is normal (ruling out haemolysis), and his immunoglobulins IgA, IgG and IgM are all within range, meaning the core antibody-producing arm of his immune system is intact. His B12 at 531, active B12 at 147, folic acid at 9.8, and red cell folate at 683 are all within range, though B12 and folate would ideally be higher, particularly given his low dietary intake. His zinc at 13.7 is within the optimal range of 12 to 18, which is a genuine positive in someone who has been undereating. His total antioxidant status at 1.85 is healthy. His homocysteine at 9.4 is within range but above the optimal threshold of 9, reflecting the borderline B12 and folate, and this should improve as his nutrition does.\n\nHis lipid panel tells an important story. His total cholesterol at 4.90 is within range, and his ApoB at 83 mg/dl (0.83 g/L) is just above the optimal threshold of 0.8 g/L. His LDL at 3.06 is marginally above the 3.0 limit, and when corrected for Lp(a), which is the inherited lipoprotein that inflates the LDL measurement, his Lp(a)-corrected LDL falls to 2.9, which is within the laboratory range but still above the optimal target of 2.0. His Lp(a) itself is 49.5, which is within the laboratory range of under 75 but above the optimal threshold of 32. Lp(a) is entirely inherited, cannot be changed by diet, exercise or any currently available supplement, and remains the same for life. At 49.5, it is modestly elevated and adds a small but permanent layer of cardiovascular risk. This is genuinely useful information because it means he should be more attentive to the modifiable lipid markers than someone with a low Lp(a). His HDL at 1.38 is below the male lower limit of 1.55 and well below the optimal threshold of 1.4. Low HDL in a lean non-drinker who does no exercise and is undereating is explained by exactly those factors: exercise raises HDL, and adequate nutrition supports its production. His triglycerides at 1.02 are within range but above the optimal target of 1.0. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 60, which is above the ideal threshold of 20 and above the acceptable threshold of 40. The three inputs driving this score are the Lp(a) at 49.5, the HDL at 1.38, and the hsCRP at 1.78. Because Lp(a) is fixed, the modifiable levers are raising HDL through exercise and nutrition, lowering inflammation, and keeping LDL as low as possible through diet. As a South Asian male, his baseline cardiovascular risk is already higher than the European average, so these numbers deserve attention even though his ten-year event risk at 41 is still low. The gap between a high score and a low ten-year risk is the window for acting.\n\nHis adiponectin, a hormone produced by fat cells that improves insulin sensitivity and has anti-inflammatory effects, is 1.47, just scraping above the lower limit of 1.44. Low adiponectin is associated with insulin resistance, and his HOMA-IR, a calculated index of insulin resistance derived from fasting glucose and insulin, is 2.88, above the upper limit of 2.0. His fasting insulin, when converted from the 83.2 pmol/L the lab reported, is approximately 11.9 mIU/L, which is above the optimal ceiling of 8. His adiponectin-to-insulin ratio is 0.12, well below the healthy threshold of 0.3, confirming that the balance between insulin sensitivity and insulin production is tilted in the wrong direction. His glucose at 5.4 and HbA1c at 41.42 are still within range, meaning his pancreas is compensating, but this is early insulin resistance and it is the metabolic finding that matters most for his long-term health. In a lean man with a BMI of 23.9, insulin resistance is less common than in someone carrying excess weight, but South Asian ethnicity confers a significantly higher risk of type 2 diabetes at any BMI, and chronic undernutrition followed by erratic eating patterns can itself promote insulin resistance through cortisol elevation and visceral fat deposition. The fix is not calorie restriction; it is the opposite. Regular, consistent meals with adequate protein and fibre, anchored to a routine, will lower fasting insulin over time. Resistance training, even two sessions a week, would be the single most powerful intervention for improving insulin sensitivity.\n\nHis PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, alkaline phosphatase and white cell count, is 32.7 against a calendar age of 41, meaning his blood is ageing 8.3 years younger than his birth certificate. RDW was not measured on this panel, so a typical value of 13 percent was assumed; the effect on the estimate is small. This is a genuinely encouraging result and reflects the fact that despite the nutritional challenges, his liver, kidneys, and core blood health are in strong shape.\n\nHis Prostate Cancer Risk Score is reported as Increased Risk by the laboratory. However, this must be interpreted in context. His total PSA at 0.98 is low and well within the normal range for a 41-year-old man. The Randox Prostate Cancer Risk Score uses a proprietary algorithm that includes nicked PSA, which was not returned on this sample, so the score may not be reliable. His GP does not need to act on this at present, but the PSA provides a useful baseline for future comparison.\n\nHis ASO titre, which measures antibodies against streptococcal bacteria, is 191.9, just within the upper limit of 200. This suggests relatively recent exposure to a streptococcal infection (a throat or skin infection), which fits his pattern of frequent illness. It is not currently above range and does not require treatment, but if his joint stiffness worsens or he develops a rash or cardiac symptoms after a sore throat, the ASO should be repeated.\n\nPulling everything together, the central story of this report is one of a body that is fundamentally healthy but running on too little fuel. The low IGF-1, the low copper, the low vitamin D, the borderline B12 and folate, the mildly elevated cortisol, the raised SHBG, the low bicarbonate, and the suppressed IL-15 all point in the same direction: chronic energy and micronutrient deficiency. On top of that, the dramatically elevated IgE and eosinophils need investigation to exclude a parasitic infection or identify an allergy. And the early insulin resistance, while seemingly paradoxical in someone who is undereating, is a real metabolic signal that South Asian men in particular should take seriously. The good news is that almost everything flagged in this report is modifiable through food, a small amount of targeted supplementation, and the introduction of some structured exercise.","links":"The thread that connects the majority of findings in this report is nutritional insufficiency. Patient has been transparent about not having reliable access to enough food for most of this year, eating 0 to 1 portions of vegetables and fruit a day, frequently skipping meals, and having a diet volume of just 2 out of 10. The consequences are visible across multiple systems. His IGF-1 has dropped below range because the liver reduces its production when protein and calorie intake fall short. His copper is below range because the trace minerals that come from nuts, seeds, shellfish and organ meats are absent from a restricted diet. His vitamin D is below the lower limit and well below optimal, compounded by South Asian skin at UK latitude and minimal dietary sources. His bicarbonate is low because the body, running short of dietary fuel, is generating acidic byproducts from fat and protein breakdown. His SHBG is elevated because calorie restriction drives the liver to produce more of it, binding more testosterone and reducing the free fraction available to tissues. His cortisol sits at the top of range because the body is under metabolic stress. His IL-15, a cytokine that supports natural killer cells and memory T-cells, is suppressed. None of these findings exist in isolation; they are a single pattern with a single cause.\n\nThe immune picture adds a second, overlapping story. His IgE at 477 and eosinophils at 0.65 are not explained by nutritional deficiency alone. These markers point to an allergic or parasitic process. In a man who has had unreliable food sources and has been getting ill every five to six weeks, a parasitic infection is a real possibility that must be excluded before assuming allergy. The raised basophils and the elevated hsCRP fit this picture: the immune system is activated and producing inflammatory mediators. The low IL-15, while partly nutritional, may also reflect an immune system that has diverted resources toward the allergic or parasitic response at the expense of the antiviral arm. If stool testing is negative for parasites, allergy testing becomes the next step, and the most common culprits in adult-onset allergy are dust mites, moulds, animal dander, and certain foods.\n\nThe insulin resistance may seem paradoxical in a lean man who is undereating, but it has a clear mechanistic explanation. Chronic calorie restriction raises cortisol, and cortisol promotes insulin resistance by telling the liver to release glucose and telling muscle cells to resist insulin's signal. South Asian ethnicity independently increases the risk of insulin resistance at any BMI, through higher visceral fat deposition relative to total body weight and differences in adiponectin production. His adiponectin at 1.47, barely above the lower limit, confirms this: his fat cells are not producing enough of the hormone that improves insulin sensitivity. The solution is not to eat less, which would worsen the cortisol response, but to eat consistently and to add resistance exercise, which improves insulin sensitivity through a pathway that does not depend on weight loss.\n\nWhat has been excluded is equally important. His liver is clean across every enzyme and every fibrosis index. His kidneys are healthy. His thyroid is working well with no autoimmune antibodies. His coeliac screen is negative. His cardiac markers show no stress. His core immunoglobulins IgA, IgG and IgM are all within range, meaning the adaptive immune system is structurally intact. His rheumatoid factor and anti-CCP are negative, making rheumatoid arthritis very unlikely as a cause of his joint symptoms. His iron stores are adequate. His B12 and folate are present, if not optimal. The positive ANA is a loose end: it may be incidental, or it may be an early signal that warrants monitoring if symptoms change, but for now the negative specific antibodies are reassuring.\n\nThe remaining loose end is the mildly elevated lipase. An isolated lipase elevation of this degree, without symptoms, without amylase elevation, and without any imaging abnormality, is most often a statistical finding or a reflection of erratic eating patterns. It should be recorded so the GP has a baseline, and it should be repeated in six months alongside the other markers, but it does not need urgent investigation unless symptoms develop.","lifestyle":"Start eating three meals a day, every day, at roughly the same times. This is the single most important change in this report. Anchor: set three alarms on your phone for breakfast, lunch and dinner until the habit is automatic. Why: your IGF-1, copper, vitamin D, bicarbonate, cortisol and SHBG are all being driven by not eating enough, and no supplement can fix what food can.\nAdd a palm-sized portion of protein to every meal: eggs, chicken, fish, lentils, chickpeas, Greek yoghurt, tofu, or tinned sardines. Anchor: protein goes on the plate first, before anything else. Why: your IGF-1 is below range because your body is not getting enough protein to produce it, and your protein target is 121 grams a day, which needs deliberate effort at every meal.\nBuild vegetable and fruit portions from 0 to 1 up to at least 4 a day, adding one extra portion each week. Frozen vegetables count. Tinned beans count. A banana counts. Anchor: one portion at lunch, one at dinner this week; add one more next week. Why: vegetables are alkaline-forming and will help correct your low bicarbonate, they provide copper and other trace minerals you are missing, and the fibre slows the glucose response that is driving your insulin resistance.\nWalk for 20 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, which is the mechanism behind your HOMA-IR of 2.88, and it is the easiest form of exercise to start with.\nIntroduce two resistance training sessions a week, starting with bodyweight exercises at home: press-ups, squats, lunges, rows with a bag or bottle. Anchor: pick two fixed days and times, and start with just 20 minutes. Why: resistance training is the single most effective intervention for improving insulin sensitivity, raising HDL cholesterol, and stimulating IGF-1 production, all of which need improving in this report.\nGet outside within an hour of waking, even on overcast days, for at least 10 minutes. Anchor: step outside when you make your first drink of the day. Why: morning light resets your circadian clock, which will help with the slow-to-get-going mornings and the afternoon crash, and UV exposure on skin is the primary source of vitamin D.\nCut caffeine after 1pm if you drink it. Anchor: after lunch, switch to water or herbal tea. Why: caffeine after early afternoon disrupts deep sleep even when you feel you sleep fine, and poor sleep quality drives the morning sluggishness, afternoon crash and brain fog you describe.\nInclude copper-rich foods at least three times a week: cashews, almonds, sunflower seeds, dark chocolate (70%+), mushrooms, or tinned shellfish. Anchor: a small handful of nuts or seeds as a snack, or dark chocolate after dinner. Why: your copper is below range and these foods are the richest dietary sources.","flags":"Immunoglobulin E (IgE) 477 ku/l (limit <100), eosinophils 0.65 (limit 0.4), basophils 0.11 (limit 0.1). This triad indicates a significant allergic or parasitic immune response. Stool ova and parasite testing (three samples), total IgE confirmation, and specific allergen panels are recommended. If parasitic infection is excluded, referral to allergy or immunology services.\nHsCRP 1.78 mg/l (ideal <1.0). Low-grade systemic inflammation in a lean non-drinker, likely driven by the active immune process above and nutritional deficiency. Should fall once the IgE cause is identified and nutrition improves.\nIL-15 0.52 pg/ml (range 0.89 to 2.02). Suppressed cytokine that supports natural killer cell and memory T-cell function. Likely nutritional and may contribute to frequent illness. Expected to improve with adequate calorie and micronutrient intake.\nHOMA-IR 2.88 (limit <2.0), fasting insulin approximately 11.9 mIU/L (optimal <8), adiponectin 1.47 (lower limit 1.44), adiponectin-to-insulin ratio 0.12 (ideal >0.3). Early insulin resistance in a lean South Asian male. Driven by chronic calorie restriction, elevated cortisol and ethnic predisposition. HbA1c 41.42 and glucose 5.4 are still within range but at the upper end. Dietary consistency and resistance exercise are the primary interventions. Retest in six months.\nCopper 9.5 umol/l (lower limit 11). Deficiency from inadequate dietary intake. Contributes to immune suppression, fatigue and possibly joint symptoms. Dietary improvement and short-term supplementation recommended.\nVitamin D 42 nmol/l (lower limit 50, optimal 75 to 120). Deficiency contributing to immune vulnerability, fatigue and possibly joint stiffness. Supplementation required.\nIGF-1 11.2 nmol/l (lower limit 12.6). Below range, reflecting chronic protein and calorie deficiency. Expected to normalise with adequate nutrition.\nLDL 3.06 mmol/l (limit <3.0), HDL 1.38 mmol/l (male ideal >1.55), ApoB 0.83 g/L (optimal <0.8), Lp(a) 49.5 nmol/l (optimal <32), Cardiovascular Risk Score 60/100 (ideal <20). Modestly adverse lipid profile in a South Asian male with inherited Lp(a) elevation. Modifiable through diet (soluble fibre, oily fish, reduced saturated fat), exercise (to raise HDL), and inflammation reduction. Lp(a) is inherited, unchangeable, and should be recorded permanently. First-degree relatives should be tested.\nSHBG 57.1 nmol/l (upper limit 54.1). Mildly elevated, driven by calorie restriction. Reduces free testosterone availability. Expected to normalise with improved nutrition.\nBicarbonate 19.0 mmol/l (lower limit 22). Mild metabolic acidosis, most likely from chronic energy deficit. Should normalise with consistent eating and increased vegetable intake.\nLipase 82 IU/L (upper limit 65), pancreatic amylase 51 IU/L (upper limit 53). Mildly elevated lipase without symptoms. Most likely related to erratic eating pattern. Should be repeated in six months for baseline comparison.\nMCH 26.0 pg (lower limit 27) with MCV 80.6 fl (within range but low-end). Iron studies are reassuring. May reflect thalassaemia trait, common in South Asian populations. Haemoglobin electrophoresis through GP would confirm.\nANA positive with negative RF, anti-CCP, anti-TPO and anti-Tg. Most likely incidental (positive in 15 to 20 percent of healthy people). Joint symptoms are more likely nutritional. Monitor if symptoms change.\nProgesterone 0.62 nmol/l (male limit <0.47). Marginally above range, consistent with adrenal stress response alongside cortisol at 305. Not clinically significant.\nASO 191.9 iu/ml (limit <200). Just within range but suggests recent streptococcal exposure, consistent with frequent illness pattern.\nProstate Cancer Risk Score reported as Increased Risk by Randox, but total PSA is 0.98, well within normal for age 41, and nicked PSA was not returned, so the score may not be reliable. No action needed; PSA provides a useful baseline.\nReassuring negatives: liver function entirely normal across all enzymes and fibrosis indices (FIB-4 0.77, APRI 0.176); kidney function healthy (eGFR combined 100, cystatin C 0.96, microalbumin not detected); thyroid optimal (TSH 1.02, FT4 19.1, FT3 4.94, both antibodies negative); coeliac screen negative; cardiac markers clear; rheumatoid factor and anti-CCP negative; iron stores adequate (ferritin 74, transferrin saturation 29.5%); D-dimer normal; B12 531, active B12 147, folate 9.8; complement C3 and C4 normal; haptoglobin normal; all tumour markers within range; urinalysis clear.\nAssays on the Randox Signature specification that their laboratory does not currently process (not outstanding, not arriving later, and not part of what the customer receives or pays for): Apolipoprotein CII, Apolipoprotein CIII, Leptin, Resistin, IL-6, TNFa, Cystatin C (Urine), NGAL, KIM-1, Gastrin, Pepsinogen I, Pepsinogen II, PGI/II ratio, Gastrin-17, IL-1a, IL-1b, IL-2, IL-3, IL-4, IL-7, IL-10, IL-12p70, IL-13, IL-23, sIL-2Ra, sIL-6R, sTNFR-I, sTNFR-II, Amphiregulin, TGF-a, VEGF, MIP-1a, MMP-9, E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1, PD-1, EBV VCA IgG, Gastric Parietal Cell Antibodies, Nicked PSA, FABP-4, FABP-5, FABP-6, FABP-7, FABP-9, and the full autoantibody panel (G-CSF, GM-CSF, IFN-a, IL-10, IL-12p35, IL-12p40, IL-17A, IL-17F, IL-18, IL-1a, IL-1b, IL-2, IL-22, IL-4, IL-6, IL-7, IL-8, IFN-gamma, IFN-omega, TNFa autoantibodies).","recommendations":"Discuss the IgE of 477, eosinophils of 0.65 and basophils of 0.11 with your GP. Ask for stool ova and parasite testing (three samples on different days) and, if negative, referral for allergen testing or immunology review. Bring this report to the appointment.\nAsk your GP to check copper levels on the NHS and discuss a short course of copper supplementation (2 mg elemental copper daily for 8 to 12 weeks) alongside the dietary changes in this report.\nMention the positive ANA alongside your joint stiffness. Note that RF and anti-CCP are negative. Ask whether an extractable nuclear antigen (ENA) panel is warranted, or whether monitoring is sufficient for now.\nMention the lipase of 82 (limit 65) for your GP's records. No action is needed unless you develop upper abdominal pain or nausea after fatty food.\nMention the MCH of 26.0 and ask whether a haemoglobin electrophoresis would be useful given your South Asian background, to check for thalassaemia trait.\nRecord your Lp(a) of 49.5 nmol/l permanently in your medical notes. This is inherited and unchangeable. Ask your GP to note it and consider testing first-degree relatives (parents, siblings, children).\nDiscuss the HOMA-IR of 2.88 and HbA1c of 41.42 with your GP in the context of South Asian cardiovascular and metabolic risk. These are not yet diabetic but warrant monitoring and lifestyle intervention.\nYour maintenance calorie target is approximately 2,400 kcal per day, and your protein target is 121 grams per day (1.6 g per kg of body weight). These are the minimums your body needs to reverse the IGF-1, copper, SHBG and bicarbonate findings. Retest in six months, repeating: full blood count, IgE, eosinophils, copper, vitamin D, IGF-1, HbA1c, fasting insulin, HOMA-IR, lipid panel with ApoB, hsCRP, liver enzymes and lipase.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal (which should contain some fat for absorption). Continue year-round given South Asian skin at UK latitude. Why: your vitamin D is 42, below the lower limit of 50 and well below the optimal range of 75 to 120. Retest in six months and adjust the dose to maintain a level between 75 and 100.\nVitamin K2 (MK-7): 100 mcg daily, taken alongside vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones and teeth rather than into arteries. Always pair with vitamin D supplementation.\nMagnesium glycinate: 300 mg before bed. Why: your magnesium at 0.77 is within range but below the optimal threshold of 0.85. Glycinate is the best-absorbed form, supports sleep quality, reduces muscle stiffness, and helps with the joint discomfort you describe.\nOmega-3 fish oil: 2 g combined EPA and DHA daily, with food. Why: omega-3 lowers triglycerides, raises HDL, reduces inflammation (your hsCRP is 1.78), and supports joint comfort. Look for a product listing EPA and DHA content separately on the label.\nCopper bisglycinate: 2 mg daily with food, for 8 to 12 weeks, then retest. Why: your copper is 9.5, below the lower limit of 11. Take copper at a different time of day from zinc to avoid competition for absorption. Stop after 12 weeks and recheck levels; copper excess is harmful.\nDO NOT take iron supplements. Your ferritin is 74 and your transferrin saturation is 29.5%, both healthy. Additional iron is unnecessary and, in the presence of inflammation, could be harmful.\nThe most important changes from this report are not supplements. They are eating three consistent meals a day with adequate protein at every one, increasing vegetable and fruit intake from 0 to 1 portions to at least 4, and introducing two resistance training sessions a week. No supplement can replace food, and the IGF-1, SHBG, bicarbonate, insulin resistance and HDL findings will only change when nutrition and exercise change.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 63.2; held to 59 by a system rated \"See your GP\". Weakest systems: inflammation 14%, immunology 24%, electrolytes & minerals 34%. Biggest drags: High Sensitivity C-Reactive Protein (hsCRP), Bicarbonate, HOMA-IR, Vitamin D.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"32.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3554","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, alkaline phosphatase and white cell count. At 32.7 against a calendar age of 41, his blood is ageing 8.3 years younger than his birth certificate. RDW was not measured on this panel, so a typical value of 13.0% was assumed; the effect on the estimate is small. This is an encouraging result and reflects the fact that despite the nutritional challenges, his liver, kidneys and core blood health are in strong shape.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built, not a ten-year event probability. At 60, it is above both the ideal threshold of 20 and the acceptable threshold of 40. The three main inputs driving this score are the inherited Lp(a) at 49.5, the low HDL at 1.38, and the hsCRP at 1.78. Because Lp(a) is fixed, the modifiable levers are raising HDL through exercise and nutrition, lowering inflammation, and keeping LDL as low as possible. At 41, the ten-year event risk is still low, and this gap is the window for acting.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"Alanine Aminotransferase (ALT)","group":"LIVER & METABOLIC","result":"14.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4179","lower_normal":"0","upper_normal":"55","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2727","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. At 14, this is well below even the optimal male ceiling of 30, indicating a liver under no metabolic strain at all. This is an excellent result, especially in the context of metabolic stress from undernutrition.","low_causes":"","high_causes":"Alcohol excess, fatty liver disease, viral hepatitis, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4481","lower_normal":"30","upper_normal":"120","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"IU/L","description":"ALP is an enzyme found in the liver and bones. It can rise with liver disease, bile duct obstruction, or bone disorders. At 61, it sits comfortably mid-range and confirms healthy liver and bone turnover.","low_causes":"Malnutrition, zinc deficiency","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ast","name":"Aspartate Aminotransferase (AST)","group":"LIVER & METABOLIC","result":"20.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3367","lower_normal":"0","upper_normal":"40","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. It rises when any of these tissues are damaged. At 20.4, it is well within both the laboratory and optimal ranges, confirming no liver or muscle injury.","low_causes":"","high_causes":"Liver disease, heart damage, heavy exercise, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma-Glutamyltransferase (GGT)","group":"LIVER & METABOLIC","result":"18.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3718","lower_normal":"0","upper_normal":"71","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1761","units":"IU/L","description":"GGT is a liver enzyme particularly sensitive to alcohol use, bile duct issues, and metabolic stress. At 18.6, well below the optimal ceiling of 25, this confirms the liver is handling its workload comfortably with no sign of metabolic strain.","low_causes":"","high_causes":"Alcohol excess, bile duct disease, fatty liver, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldh","name":"Lactate Dehydrogenase (LDH)","group":"LIVER & METABOLIC","result":"380","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5507","lower_normal":"230","upper_normal":"460","lower_optimal":"250","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3623","upper_optimal_position":"0.5797","units":"IU/L","description":"LDH is an enzyme found in most tissues that rises with cell turnover or tissue damage. At 380, it is within both the laboratory and optimal ranges. The slightly upper-mid position is not a concern and can reflect normal tissue turnover.","low_causes":"","high_causes":"Haemolysis, liver disease, muscle damage, infection, malignancy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"gldh","name":"Glutamate Dehydrogenase (GLDH)","group":"LIVER & METABOLIC","result":"2.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"7","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2857","units":"IU/L","description":"GLDH is a liver-specific enzyme found inside the mitochondria of liver cells. It is a very specific marker of liver damage. At 2.0, well within range, it adds further confidence that the liver is healthy.","low_causes":"","high_causes":"Liver cell damage, toxic liver injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalbilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2524","lower_normal":"0","upper_normal":"21","lower_optimal":"0","upper_optimal":"17","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4048","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. At 8.0, this is well within range and confirms healthy red cell turnover and liver clearance.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"directbilirubin","name":"Direct Bilirubin","group":"LIVER & METABOLIC","result":"1.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1422","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"umol/l","description":"Direct bilirubin is the water-soluble form processed by the liver for excretion. At 1.28, this is low and healthy, confirming no bile duct obstruction or conjugation issue.","low_causes":"","high_causes":"Bile duct obstruction, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"bileacids","name":"Bile Acids","group":"LIVER & METABOLIC","result":"2.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1533","lower_normal":"0","upper_normal":"10","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"umol/l","description":"Bile acids are produced by the liver to help digest fats. Elevated levels can indicate liver disease or bile flow problems. At 2.3, this is healthy and confirms normal bile production and clearance.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, cholestasis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5876","lower_normal":"35","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance and transports hormones and nutrients. At 46.4, this is comfortably within the optimal range and is a positive sign of liver synthetic function and adequate protein status, despite the overall dietary shortfall.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5472","lower_normal":"23","upper_normal":"35","lower_optimal":"25","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"g/l","description":"Globulins are a group of proteins in the blood that include antibodies and transport proteins. At 30.7, this is within the laboratory range. The slightly upper-mid position is consistent with an active immune response, which fits the elevated IgE and eosinophils seen elsewhere in this report.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"aldolase","name":"Aldolase","group":"LIVER & METABOLIC","result":"5.00","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"7.6","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3947","units":"IU/L","description":"Aldolase is an enzyme involved in energy production, found in muscle and liver tissue. It rises with muscle damage or certain metabolic conditions. At 5.0, this is within range and confirms no muscle or liver injury.","low_causes":"","high_causes":"Muscle damage, liver disease, myopathy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"pancreaticamylase","name":"Pancreatic Amylase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"13","upper_normal":"53","lower_optimal":"15","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6000","units":"IU/L","description":"Pancreatic amylase is an enzyme produced by the pancreas to break down starch. At 51, it is within the laboratory range but at the upper end, sitting above the optimal ceiling of 45. Combined with the elevated lipase, this suggests the pancreas is slightly more active than expected, possibly in response to erratic eating patterns. On its own, this is not a concern.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Pancreatitis, pancreatic duct obstruction, renal impairment","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"82.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7577","lower_normal":"5","upper_normal":"65","lower_optimal":"10","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"IU/L","description":"Lipase is an enzyme produced by the pancreas to digest dietary fat. At 82, it is above the upper limit of 65. A mildly elevated lipase without abdominal pain, nausea or vomiting is a common incidental finding and is usually not clinically significant. In a man who has been eating irregularly and undereating, the pancreas may respond to erratic meal patterns with slightly increased enzyme production. This should be mentioned to the GP for a baseline record and repeated in six months.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Pancreatitis, gallstones, renal impairment, medications, erratic eating patterns","padding":"1","one_sided":"0","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.90","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.45","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. At 4.90, it is within the laboratory limit of 5.0 but above the optimal target of 4.5. The individual fractions below give a more detailed picture.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5100","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL cholesterol carries cholesterol to the artery walls, where it can build up as plaque. At 3.06, it is marginally above the 3.0 limit. When corrected for Lp(a), which inflates the LDL measurement, the Lp(a)-corrected LDL falls to 2.9, within the laboratory range but still above the optimal target of 2.0. Dietary changes, particularly increasing soluble fibre and reducing saturated fat, are the first-line intervention.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetic factors, low physical activity, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4452","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.4516","upper_optimal_position":"1","units":"mmol/l","description":"HDL cholesterol carries cholesterol away from artery walls back to the liver for removal, acting as the body's cleanup mechanism. At 1.38, it is below the male lower limit of 1.55 and below the optimal threshold of 1.4. In a lean man who does no structured exercise and is undereating, this is expected. Exercise, particularly regular moderate-intensity cardio and resistance training, is the most effective way to raise HDL. Adequate calorie intake also supports its production.","low_causes":"Physical inactivity, smoking, poor diet, metabolic syndrome, low calorie intake","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3550","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.35","units":"%","description":"This ratio compares total cholesterol to HDL and is a useful summary of cardiovascular risk. At 3.55, it is within the laboratory limit of 5 but marginally above the optimal ceiling of 3.5, driven by the low HDL. As HDL rises with exercise and improved nutrition, this ratio will improve.","low_causes":"","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.02","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2217","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats circulating in the blood, primarily influenced by carbohydrate and sugar intake. At 1.02, this is within the laboratory range but marginally above the optimal target of 1.0. This is a good result and suggests dietary carbohydrate is not a major problem. Consistent meal timing and slightly more fibre should keep this stable.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High sugar or refined carbohydrate intake, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"151.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5387","lower_normal":"95","upper_normal":"186","lower_optimal":"120","upper_optimal":"186","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4249","upper_optimal_position":"0.6667","units":"mg/dl","description":"Apolipoprotein A-I is the main protein component of HDL cholesterol and is essential for reverse cholesterol transport (removing cholesterol from arteries). At 151.4, it is well within range and represents a positive finding for cardiovascular protection.","low_causes":"Physical inactivity, smoking, metabolic syndrome","high_causes":"Exercise, genetic factors","padding":"1","one_sided":"0","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3030","lower_normal":"0","upper_normal":"173","lower_optimal":"0","upper_optimal":"80","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2312","units":"mg/dl","description":"ApoB is the protein carried by every atherogenic (artery-damaging) lipoprotein particle, including LDL and VLDL. One ApoB molecule sits on each particle, so this number effectively counts how many potentially harmful particles are in the blood. At 83 mg/dl (0.83 g/L), it is within the laboratory range but above the optimal target of 0.8 g/L. This is the single best marker of cardiovascular risk in the lipid panel, and bringing it below 0.8 through dietary changes and exercise would be beneficial.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High saturated fat intake, genetic factors, insulin resistance, low physical activity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2750","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.35","units":"","description":"This ratio compares atherogenic particles (ApoB) to protective particles (ApoA-I). At 0
