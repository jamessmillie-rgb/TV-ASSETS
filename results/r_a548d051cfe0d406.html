re targeted changes could make a significant difference to how he feels day to day and to his long-term cardiovascular health.\n\nThe first priority is a GP conversation about his hormonal profile. His testosterone at 59.6, suppressed LH and FSH, elevated oestradiol at 199, and free androgen index of 310 form a pattern that his GP needs to see. He should bring these specific numbers. If he is using testosterone, whether prescribed or otherwise, his GP should be monitoring haematocrit, liver enzymes, lipid profile, blood pressure, and PSA at regular intervals. The elevated oestradiol may warrant discussion about aromatase inhibitor use under medical supervision. His fertility should also be discussed, as suppressed gonadotropins mean sperm production is likely severely reduced. His cystatin C at 1.16 and cystatin C-based eGFR of 81 should also be raised with his GP. A repeat in three to six months with a urine albumin-to-creatinine ratio would clarify whether this is a one-off or a trend to watch.\n\nFor his weight and body composition, Chris is 85 kg at 158 cm, giving a BMI of 34.0. His maintenance calories at his current activity level, using a light activity multiplier of 1.45, are approximately 2,340 kcal per day. To lose weight at a sustainable rate of 0.5 to 0.75 kg per week, he should aim for 1,840 to 2,090 kcal per day. His protein target should be 1.3 to 1.6 g per kilogram of body weight, which means 110 to 136 g of protein per day. At his current diet quality rating of 5 out of 10, the single most impactful change would be reducing takeaway frequency and increasing home-cooked meals built around protein sources such as chicken, fish, eggs, Greek yoghurt, and legumes. A realistic first target would be reducing to a BMI of 30 or below, which means reaching approximately 75 kg. Even a 5 kg loss would be expected to improve his HDL, lower his triglycerides and ApoB, and improve his energy levels.\n\nFor his cardiovascular goals specifically, his lipid profile will respond to several changes. Increasing soluble fibre intake through oats, beans, lentils, and psyllium husk can lower LDL by 5 to 10 percent. Eating oily fish such as salmon, mackerel, or sardines two to three times per week provides omega-3 fatty acids that lower triglycerides and raise HDL. Reducing saturated fat from takeaway food, processed meat, and full-fat dairy, and replacing it with olive oil, nuts, and avocado, directly lowers ApoB particle numbers. Increasing his training to at least three sessions per week, ideally including two resistance sessions and two cardio sessions, would raise his HDL, the protective cholesterol fraction, which is currently below the desirable level.\n\nFor his fatigue and mood symptoms, his B12 at 266 is below the optimal level of 500 and may be contributing. B12 is essential for nerve function, red blood cell production, and the synthesis of neurotransmitters including serotonin and dopamine. At his current diet quality, he is unlikely to be getting enough from food alone. A sublingual methylcobalamin supplement at 1,000 mcg daily would be the most effective way to raise this. His step count of 5,000 to 7,500 is a reasonable foundation, but increasing to 8,000 to 10,000 steps daily, particularly with morning outdoor walking, would benefit both mood and energy through increased light exposure, improved circadian rhythm, and the well-documented antidepressant effect of regular movement. Sleep quality matters enormously for both mood and energy. A fixed wake time, getting outside within an hour of waking, cutting caffeine after 1pm, keeping the bedroom cool and dark, and avoiding screens for 30 minutes before bed are all practical steps with strong evidence behind them.\n\nFor his joint pain and stiffness, the most effective intervention is weight loss. Every kilogram of body weight places approximately four kilograms of force through the knees during walking. A 10 kg loss would reduce the mechanical load on his joints by roughly 40 kg with every step. Omega-3 supplementation at 2 to 3 g of combined EPA and DHA daily has a modest anti-inflammatory effect on joints. Adding two resistance training sessions per week would strengthen the muscles around his joints, reducing pain and improving function.\n\nNicotine vaping should be noted as a cardiovascular risk factor. While vaping avoids the combustion products of smoking, nicotine itself raises blood pressure, stiffens arteries, and impairs endothelial function. For someone whose primary goal is cardiovascular fitness, reducing and ultimately stopping nicotine use would be beneficial.\n\nA retest in four to six months should include a kidney panel with cystatin C and urine albumin-to-creatinine ratio, a full lipid panel with ApoB, vitamin B12, a full hormonal panel including testosterone, LH, FSH, oestradiol, and SHBG, and a repeat PTH on a promptly processed sample.","flags":"HORMONAL AXIS SUPPRESSION (GP REQUIRED): Testosterone 59.6 nmol/L (upper limit 28.7), LH below 0.07 mIU/ml (lower limit 1.5), FSH 0.46 mIU/ml (lower limit 1.4), oestradiol 199 pmol/L (upper limit 146.1), SHBG 19.2 nmol/L (near lower limit 17.3), free androgen index 310 (upper limit 150), progesterone 0.82 nmol/L (lower limit 0.89). This pattern is consistent with exogenous androgen administration causing hypothalamic-pituitary-gonadal axis suppression. GP should discuss monitoring requirements including haematocrit, liver function, lipids, blood pressure, PSA, and fertility implications.\n\nKIDNEY FUNCTION: Cystatin C 1.16 mg/L (upper limit 1.1), cystatin C-based eGFR 81 (expected above 90 at age 38). Creatinine-based eGFR reported as above 90, but cystatin C is more reliable at elevated BMI. Recommend repeat in three to six months with urine albumin-to-creatinine ratio.\n\nLIPID PROFILE: ApoB 1.11 g/L (desirable below 0.9, optimal below 0.8), LDL 3.04 mmol/L (upper limit 3.0), ApoB/A-I ratio 0.90 (target below 0.7), HDL 1.2 mmol/L (below desirable 1.55). Lp(a) below 25 nmol/L confirms risk is modifiable. Recommend dietary intervention, weight loss, and increased physical activity.\n\nPTH: 0.4 pmol/L (lower limit 0.98) with normal corrected calcium 2.49 and adequate vitamin D 83. May reflect sample handling. Recommend repeat on promptly processed sample if clinically indicated.\n\nC-PEPTIDE: 0.401 ug/L (lower limit 1.1), likely sample degradation given lab caveat and entirely normal glucose, insulin, HbA1c, and HOMA-IR.\n\nCHLORIDE: 94 mmol/L (lower limit 95), marginal, clinically insignificant in context of normal sodium, bicarbonate, and anion gap.\n\nURIC ACID: 208 umol/L (lower limit 220), marginally below range, benign in isolation.\n\nMCHC: 350 g/L (upper limit 345), likely pre-analytical artefact per lab notation.\n\nALT: 41 IU/L, within lab range but above optimal of 30 for males. Monitor in context of BMI and diet. All other liver markers reassuring.\n\nB12: 266 pg/ml, within lab range but below optimal of 500. May contribute to reported fatigue and low mood.\n\nFT4: 13.7 pmol/L, within lab range but below optimal of 14. TSH and FT3 both optimal. Monitor.\n\nBacterial count and urine culture pending at time of report.\n\nReassuring negatives: Excellent glucose metabolism (HOMA-IR 0.63, HbA1c 37) despite BMI 34. CRP 0.4 indicating minimal systemic inflammation. Clean full blood count. Balanced iron stores. Negative thyroid antibodies. Normal PSA. Negative coeliac screen. Normal immunoglobulins. Normal rheumatoid factor. Lp(a) normal. Clean urinalysis. FIB-4 0.68 indicating no liver fibrosis.","recommendations":"1. Arrange a GP appointment to discuss the hormonal profile. Bring the testosterone, LH, FSH, oestradiol, SHBG, and free androgen index results. Discuss monitoring requirements and fertility implications.\n\n2. Discuss cystatin C of 1.16 and eGFR of 81 with the GP. Request a repeat cystatin C and urine albumin-to-creatinine ratio in three to six months.\n\n3. Begin a structured calorie deficit of 1,840 to 2,090 kcal per day with 110 to 136 g of protein daily. Reduce takeaway meals and replace with home-cooked meals built around lean protein, vegetables, and whole grains. Target weight: 75 kg (BMI 30).\n\n4. Increase training to at least three to four sessions per week, including two resistance sessions and two cardio sessions. This will raise HDL, lower triglycerides, improve mood, and protect joints.\n\n5. Increase daily steps to 8,000 to 10,000, with priority on morning outdoor walking for circadian and mood benefits.\n\n6. Improve lipid profile through diet: daily soluble fibre from oats, beans, and lentils; oily fish two to three times per week; reduce saturated fat from takeaway and processed food; replace with olive oil, nuts, and avocado.\n\n7. Begin sublingual methylcobalamin 1,000 mcg daily to raise B12 from 266 toward the optimal range of 500 to 900.\n\n8. Begin omega-3 fish oil providing 2 to 3 g of combined EPA and DHA daily to support lipid profile and joint health.\n\n9. Work toward reducing and ultimately stopping nicotine vaping for cardiovascular benefit.\n\n10. Retest in four to six months: kidney panel with cystatin C and urine albumin-to-creatinine ratio, full lipid panel with ApoB, B12, full hormonal panel, and repeat PTH on a promptly processed sample.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Chris's B12 at 266 is within the laboratory range but below the optimal level of 500. B12 is essential for nerve function, energy production, and the synthesis of mood-regulating neurotransmitters. At his current diet quality, food sources alone are unlikely to bring this to optimal. The sublingual form bypasses the digestive system and is more reliably absorbed than standard oral tablets.\n\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with a meal containing fat. This directly addresses his elevated ApoB and LDL by lowering triglycerides, mildly raising HDL, and reducing the number of atherogenic particles. It also has a modest anti-inflammatory effect that may help with his joint pain and stiffness.\n\nMagnesium glycinate: 300 mg before bed. While his magnesium at 0.93 is within the optimal range, magnesium glycinate supports sleep quality, muscle recovery, and stress management, all relevant to his reported fatigue, low mood, and joint stiffness. The glycinate form is well absorbed and has a calming effect that supports sleep.\n\nVitamin D3: maintain current intake or supplement at 2,000 IU daily with a fat-containing meal to sustain his level of 83 within the optimal 75 to 120 range. At a BMI of 34, fat tissue sequesters vitamin D, meaning he needs a higher intake to maintain adequate levels. If he is not currently supplementing, the fact that his level is 83 suggests some dietary or sun exposure source, but a maintenance dose through the autumn and winter months is sensible.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with vitamin D. K2 directs calcium into bones and teeth and away from arterial walls, complementing vitamin D's role in calcium absorption.\n\nThe most important changes from this report are not supplements. They are reducing body weight from 85 kg toward 75 kg through a structured calorie deficit and improved diet quality, increasing training from one session per week to three or four, and having an honest conversation with his GP about his hormonal profile and kidney function. No supplement can replace those three actions.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6093","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in a resting state. Chris's result of 4.5 mmol/L is excellent, sitting comfortably within the optimal range of 4.0 to 5.4. At a BMI of 34, this is a genuinely strong result and shows his body is handling glucose well despite carrying extra weight.","low_causes":"Prolonged fasting, excessive insulin production, certain medications, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4583","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"3.5","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4387","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the past two to three months. Chris's result of 5.5% is within the normal range (below 6.0%) and well below the pre-diabetes threshold of 6.0 to 6.4%. While not in the tightest optimal bracket, it confirms healthy long-term glucose management.","low_causes":"Anaemia, blood loss, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised unit for measuring long-term blood sugar control. Chris's result of 37 mmol/mol is within the normal range of below 42 and just above the tightest optimal target of below 36. This confirms that his blood sugar has been well controlled over the past two to three months.","low_causes":"Anaemia, blood loss, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3414","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3243","upper_optimal_position":"0.4054","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas needs to produce to keep blood sugar stable overnight. Lower levels indicate better insulin sensitivity, meaning the body's cells respond efficiently to insulin's signal. Chris's result of 3.15 mIU/L is low and optimal, indicating excellent insulin sensitivity. At a BMI of 34, this is a particularly impressive finding.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, pancreatic insufficiency (when accompanied by high glucose)","high_causes":"Insulin resistance, early type 2 diabetes, high carbohydrate diet, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.401","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1216","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin. It provides a stable measure of how much insulin the pancreas is producing, as it is not cleared as quickly as insulin itself. Chris's result of 0.401 ug/L (approximately 133 pmol/L) is below the lower limit of 1.1 ug/L. However, the lab notes that samples not separated within four hours can see C-peptide decrease to 44% of baseline. Given his entirely normal fasting glucose, insulin, HbA1c, and HOMA-IR, this is most likely a sample handling artefact rather than a genuine sign of pancreatic insufficiency. A repeat on a promptly processed sample would clarify.","low_causes":"Sample degradation, very low insulin demand, low carbohydrate diet, type 1 diabetes (when accompanied by high glucose)","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's signal. A lower number means better insulin sensitivity. Chris's result of 0.63 is excellent, well below 1.0, confirming he is insulin-sensitive. At a BMI of 34, this is a genuinely positive finding that shows his metabolic health is significantly better than his weight alone might suggest.","low_causes":"High insulin sensitivity, very low carbohydrate diet, prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, metabolic syndrome, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"63.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2433","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B, or the Homeostatic Model Assessment of Beta-cell function, estimates how well the beta cells in the pancreas are producing insulin relative to the glucose level. Chris's result of 63 is below the lower limit of 80. However, in the context of a perfectly normal fasting glucose of 4.5 and low insulin demand, this reflects a pancreas that simply does not need to work hard, rather than a pancreas that is struggling. The formula uses (20 x insulin) / (glucose - 3.5), so when glucose is low and insulin demand is minimal, the score naturally falls. This is a mathematical consequence of excellent metabolic health, not a concern.","low_causes":"Low insulin demand in insulin-sensitive individuals, low carbohydrate diet, early beta-cell decline (only if glucose is also elevated)","high_causes":"Insulin resistance (pancreas compensating by producing more insulin), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3661","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Chris's result of 41 IU/L is within the laboratory range of below 56 but above the optimal threshold of below 30 for men. In the context of a BMI of 34 and a takeaway-based diet, mildly elevated ALT can indicate early fatty changes in the liver, known as non-alcoholic fatty liver disease or NAFLD. His other liver markers are reassuring, with GGT, AST, bilirubin, albumin, and FIB-4 all within range, suggesting no significant liver damage or fibrosis at this stage.","low_causes":"Very low levels are normal and not a concern","high_causes":"Fatty liver disease, alcohol use, medications, viral hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in liver cells but also in heart and muscle tissue. It is less specific to the liver than ALT, but the ratio between the two can provide useful clinical information. Chris's result of 28 IU/L is well within range and optimal, and the AST/ALT ratio below 1.0 is consistent with a metabolic rather than alcoholic cause for his mildly elevated ALT.","low_causes":"Very low levels are normal and not a concern","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, alcohol use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2534","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to bile duct obstruction, alcohol use, and metabolic stress. Chris's result of 37 IU/L is within the male laboratory range of 4 to 73 but above the optimal level of below 25. At a BMI of 34 with a convenience-based diet, a mildly elevated GGT is consistent with metabolic strain from excess body fat. It is not alarming at this level, but it adds to the picture that weight loss and dietary improvement would benefit his liver health.","low_causes":"Very low levels are normal","high_causes":"Alcohol use, fatty liver disease, bile duct obstruction, obesity, certain medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","units":"IU/L","description":"Alkaline phosphatase, or ALP, is an enzyme found in the liver, bile ducts, and bones. It can indicate bile duct obstruction or bone turnover when elevated. Chris's result of 46 IU/L sits right at the lower limit of the reference range, which is normal and not a concern.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism (when significantly below range)","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. It is processed by the liver and excreted in bile. Chris's result of 8 umol/L is well within range and indicates healthy red blood cell turnover and liver processing.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome (benign inherited), liver disease, bile duct obstruction, excessive red blood cell breakdown","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects nutritional status, liver function, and immune activity. Chris's result of 72 g/L is well within range and indicates adequate protein synthesis by the liver and appropriate immune protein production.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and minerals, and helps maintain fluid balance between blood vessels and tissues. Chris's result of 43 g/L is well within the optimal range, confirming healthy liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, kidney disease (protein loss), chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6222","units":"g/L","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies) and transport proteins. The level reflects immune activity and liver function. Chris's result of 29 g/L is within range, indicating a healthy balance of immune and transport proteins.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood. It provides a quick check on the balance between liver synthetic function (albumin) and immune activity (globulin). Chris's calculated ratio of 1.48 is within the optimal range, confirming a healthy balance.","low_causes":"Liver disease, chronic inflammation, autoimmune conditions, kidney disease","high_causes":"Immune deficiency (rare at mildly elevated levels)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2345","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation using age, ALT, AST, and platelet count to estimate the likelihood of liver fibrosis (scarring). A score below 1.3 in people under 65 suggests a low risk of significant fibrosis. Chris's score of 0.68 is reassuringly low, indicating no evidence of liver scarring despite his elevated BMI and mildly raised ALT.","low_causes":"Low scores are reassuring and not a concern","high_causes":"Liver fibrosis, cirrhosis, age-related platelet decline, low ALT denominator","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5114","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3447","upper_optimal_position":"0.6250","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands that breaks down starch. It is used as a marker of pancreatic health. Chris's result of 90 IU/L is well within range, indicating normal pancreatic function.","low_causes":"Chronic pancreatitis (burnt-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5567","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase. Chris's result of 60 U/L sits exactly at the upper limit of the reference range. With amylase well within range and no abdominal symptoms, this is not a concern but is noted for completeness.","low_causes":"Not clinically significant at mild levels","high_causes":"Pancreatitis, gallstones, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the combined amount of all cholesterol in the blood, including HDL (protective), LDL (atherogenic), and VLDL. While a useful screening number, it is less informative than the individual fractions and ApoB. Chris's result of 4.8 mmol/L is within the desirable range of below 5.18.","low_causes":"Malnutrition, hyperthyroidism, liver disease, certain medications","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3971","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the most common type of fat in the blood. They are produced from excess calories, particularly from carbohydrates, alcohol, and sugar. Elevated triglycerides are a component of metabolic syndrome and increase cardiovascular risk. Chris's result of 1.35 mmol/L is within the laboratory range of below 1.7 fasting, but above the optimal level of below 1.0. Weight loss, reduced refined carbohydrate intake, and omega-3 supplementation would all help lower this.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, excess calories, alcohol, obesity, insulin resistance, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3910","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.65","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mmol/L","description":"VLDL, or very low-density lipoprotein cholesterol, is produced by the liver to transport triglycerides to tissues. It is a precursor to LDL and contributes to arterial plaque. Chris's result of 0.61 mmol/L is within the desirable range of below 0.78.","low_causes":"Not clinically significant","high_causes":"High triglycerides, obesity, insulin resistance, excess carbohydrate or alcohol intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"3.10","lower_optimal":"1.4","upper_optimal":"3.10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3507","upper_optimal_position":"0.6667","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective cholesterol fraction. It carries excess cholesterol from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Higher is better. Chris's result of 1.2 mmol/L is above the minimum risk threshold of 1.04 but below the desirable level of 1.55 and the optimal target for men of 1.4. Low HDL is common at elevated BMI with limited exercise. Regular aerobic exercise, weight loss, and dietary changes are the most effective ways to raise HDL.","low_causes":"Sedentary lifestyle, obesity, smoking/nicotine, high refined carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol use, genetic factors, high-fat healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5067","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the primary carrier of cholesterol to the tissues and, when in excess, deposits cholesterol in artery walls, forming plaques that narrow and stiffen the arteries. Chris's result of 3.04 mmol/L is just above the upper limit of 3.0 and above the optimal target of below 2.6. In combination with his elevated ApoB, this confirms that the number of atherogenic particles in his blood is above the ideal level for cardiovascular protection. With his Lp(a) being normal, this is entirely modifiable through diet, weight loss, and exercise.","low_causes":"Hyperthyroidism, malnutrition, liver disease, very low-fat diet","high_causes":"Diet high in saturated fat, obesity, sedentary lifestyle, genetic predisposition, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick measure of cardiovascular risk. A lower ratio indicates more of the total cholesterol is the protective HDL fraction. Chris's ratio of 4.0 is within the desirable range of below 4.5 but above the optimal target of below 3.5, reflecting his relatively low HDL and mildly elevated LDL.","low_causes":"High HDL levels, low total cholesterol","high_causes":"Low HDL, high total cholesterol, obesity, sedentary lifestyle, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"20","upper_normal":"100","lower_optimal":"28","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5100","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. A higher percentage means a greater proportion of protective cholesterol. Chris's result of 25% is above the minimum threshold of 20% but below the optimal level of above 28%, reflecting the same pattern seen in his HDL and ratio values.","low_causes":"Low HDL, elevated total cholesterol, metabolic syndrome","high_causes":"High HDL, low total cholesterol, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus the protective HDL fraction. It captures all the potentially atherogenic cholesterol-carrying particles: LDL, VLDL, and IDL combined. Chris's result of 3.6 mmol/L is within the laboratory range of below 4.0 but above the optimal level of below 3.2, reflecting the combined effect of his mildly elevated LDL and above-optimal triglycerides.","low_causes":"Low LDL, very low-fat diet, malnutrition","high_causes":"High LDL, high triglycerides, obesity, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.20","upper_normal":"2.46","lower_optimal":"1.40","upper_optimal":"2.46","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5159","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1, or ApoA-I, is the main structural protein of HDL particles. It drives the reverse cholesterol transport process that removes cholesterol from artery walls. Higher levels are protective. Chris's result of 1.23 g/L is just above the minimum threshold of 1.20 but below the optimal level of 1.40, consistent with his below-optimal HDL level.","low_causes":"Sedentary lifestyle, obesity, smoking/nicotine, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B, or ApoB, is the single protein found on each LDL, VLDL, and Lp(a) particle. Because there is exactly one ApoB molecule per particle, it directly measures the total number of atherogenic particles in the blood, making it a more accurate predictor of cardiovascular risk than LDL cholesterol alone. Chris's result of 1.11 g/L is classified as borderline high, above the desirable threshold of 0.9 and significantly above the optimal target of 0.8. This is the most important number in his lipid panel for assessing cardiovascular risk and is the key metric to track as he improves his diet and loses weight.","low_causes":"Very low-fat diet, hyperthyroidism, malnutrition, certain medications","high_causes":"High saturated fat diet, obesity, insulin resistance, genetic factors, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6429","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio is considered one of the best single indicators of cardiovascular risk. It captures both the atherogenic particle burden (ApoB) and the protective capacity (ApoA-I) in one number. Chris's ratio of 0.90 places him at the border between average and higher risk (above 0.9 for men). This reflects the combined effect of elevated ApoB and a below-optimal ApoA-I. Both sides of this ratio are modifiable through diet, exercise, and weight management.","low_causes":"High HDL, low LDL, excellent cardiovascular profile","high_causes":"High LDL/ApoB, low HDL/ApoA-I, metabolic syndrome, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that independently increases cardiovascular risk. Unlike LDL and HDL, Lp(a) levels are almost entirely inherited and do not change meaningfully with diet, exercise, or most medications. Chris's result is below 25 nmol/L, well within the normal range of below 32. This is genuinely useful information because it confirms that his elevated ApoB and LDL are driven entirely by modifiable lifestyle factors rather than by an inherited Lp(a) burden. This result only needs to be tested once in a lifetime.","low_causes":"Genetic (favourable), not modifiable","high_causes":"Genetic (inherited), not modifiable by diet or lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3500","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. These particles are small enough to enter artery walls and are increasingly recognised as an independent cardiovascular risk factor. Chris's result of 0.56 mmol/L is within the laboratory range of below 0.8 but slightly above the optimal target of below 0.5, consistent with his above-optimal triglyceride level.","low_causes":"Low triglycerides, healthy lipid metabolism","high_causes":"Elevated triglycerides, insulin resistance, obesity, high carbohydrate diet, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3767","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful surrogate marker for insulin resistance and cardiovascular risk. A lower ratio indicates a more favourable metabolic profile with larger, less atherogenic LDL particles. Chris's ratio of 1.13 is within the normal range of below 1.5 but above the optimal threshold of below 0.87. Improving this ratio through weight loss, reduced refined carbohydrates, and increased exercise would be beneficial.","low_causes":"Low triglycerides, high HDL, excellent metabolic health","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein, or hs-CRP, is the most sensitive blood marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Levels below 1.0 are associated with low cardiovascular risk and minimal systemic inflammation. Chris's result of 0.4 mg/L is excellent and falls well within the optimal range. At a BMI of 34, this is a genuinely impressive finding, as excess body fat typically drives chronic low-grade inflammation that elevates CRP. His body is not in an inflammatory state despite carrying extra weight.","low_causes":"Low levels are optimal and not a concern","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate, or ESR, measures how quickly red blood cells settle in a test tube over one hour. Faster settling indicates more inflammation in the body, as inflammatory proteins make red cells clump together. Chris's result of 1 mm/hour is excellent, confirming the absence of systemic inflammation alongside his low hs-CRP.","low_causes":"Low levels are normal and not a concern","high_causes":"Infection, autoimmune disease, chronic inflammation, cancer, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5256","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is the primary electrolyte in the blood that regulates fluid balance, nerve signalling, and muscle contraction. Chris's result of 142 mmol/L is within the optimal range, indicating healthy fluid and electrolyte balance.","low_causes":"Excess fluid intake, diuretics, kidney disease, adrenal insufficiency, heart failure","high_causes":"Dehydration, excess salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3077","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and the acid-base balance of the blood. Chris's result of 94 mmol/L is marginally below the lower limit of 95 by a single unit. In the context of normal sodium, normal bicarbonate, and a normal calculated anion gap, this is not clinically significant and most likely reflects minor laboratory variation or hydration status at the time of the blood draw.","low_causes":"Vomiting, metabolic alkalosis, excess sweating, certain medications, over-hydration","high_causes":"Dehydration, kidney disease, metabolic acidosis, excess salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4424","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer in the blood that maintains the acid-base balance, or pH. It is regulated by the kidneys and lungs working together. Chris's result of 23.6 mmol/L is within the optimal range, confirming healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diabetic ketoacidosis, severe diarrhoea","high_causes":"Metabolic alkalosis, vomiting, certain medications, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"12.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5042","lower_normal":"8","upper_normal":"16","lower_optimal":"9","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is a calculated value using sodium, potassium, chloride, and bicarbonate. Note: potassium was not available in this panel, so this has been calculated as (sodium) minus (chloride + bicarbonate), giving an approximate value. It helps identify the cause of metabolic acid-base disturbances. Chris's approximate anion gap of 12.1 is within the normal range, confirming no metabolic acidosis.","low_causes":"Dilution, hypoalbuminaemia, laboratory error","high_causes":"Diabetic ketoacidosis, lactic acidosis, kidney failure, toxin ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Total Calcium","group":"ELECTROLYTES & MINERALS","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5836","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.20","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6158","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Total calcium includes both the protein-bound and free (active) forms. Chris's result of 2.51 mmol/L is within the optimal range, indicating healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, low albumin","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, certain medications, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the patient's albumin level, giving a more accurate picture of the biologically active calcium. This is important because about half of circulating calcium is bound to albumin, and changes in albumin can make total calcium appear falsely high or low. Chris's corrected calcium of 2.49 mmol/L is within the optimal range, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5632","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar regulation, and sleep. Chris's result of 0.93 mmol/L is within the optimal range of 0.85 to 1.05, indicating adequate magnesium status.","low_causes":"Poor dietary intake, alcohol use, medications (e.g. PPIs, diuretics), diabetes, malabsorption","high_causes":"Kidney disease, excess supplementation, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"208","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2991","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4822","units":"umol/L","description":"Uric acid is a waste product created when the body breaks down purines, substances found in certain foods and produced naturally by the body. It is filtered by the kidneys and excreted in urine. Chris's result of 208 umol/L is marginally below the lower limit of 220. Low uric acid in isolation, without symptoms of kidney stones or other issues, is a benign finding. Uric acid serves as an antioxidant in the blood, so mildly low levels simply mean slightly less of that particular antioxidant buffer. This is not a concern at this margin.","low_causes":"Low purine diet, certain medications, Fanconi syndrome, SIADH","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5960","units":"mmol/L","description":"Urea is a waste product from protein metabolism, produced by the liver and excreted by the kidneys. It provides a measure of kidney filtration and protein intake. Chris's result of 5.3 mmol/L is within the optimal range, indicating healthy kidney processing of protein waste.","low_causes":"Low protein diet, liver disease, over-hydration","high_causes":"Dehydration, high protein diet, kidney disease, heart failure, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6282","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, produced at a fairly constant rate and filtered by the kidneys. It is the most commonly used marker for estimating kidney filtration. Chris's result of 92 umol/L is within the optimal range. However, creatinine can be influenced by muscle mass and body composition, which is why the cystatin C-based eGFR provides a more reliable assessment of his true kidney filtration.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine-based)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate, or eGFR, estimates how much blood the kidneys filter per minute. It is the primary measure of kidney function. Chris's creatinine-based eGFR is reported as above 90, which would normally be considered fully healthy. However, his cystatin C-based eGFR of 81 suggests the creatinine-based estimate may be overstating his true kidney function, as discussed in the cystatin C marker.","low_causes":"Kidney disease, dehydration, certain medications, ageing","high_causes":"High values are normal and not a concern","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5273","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells in the body at a constant rate. Unlike creatinine, it is not affected by muscle mass, body composition, diet, or exercise, making it a more reliable marker of kidney filtration, particularly in people with high or low muscle mass. Chris's result of 1.16 mg/L is above the upper limit of 1.1, yielding a cystatin C-based eGFR of 81, which is below the 90 threshold expected for a 38-year-old. At a BMI of 34
