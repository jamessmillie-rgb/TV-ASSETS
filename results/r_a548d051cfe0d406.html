t_position":"0.4554","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3457","upper_optimal_position":"0.6142","units":"umol/L","description":"Total iron binding capacity, or TIBC, measures the blood's total capacity to bind iron via transferrin. It moves inversely with iron stores: rising when iron is deficient and falling when iron is abundant. Chris's result of 55.8 umol/L is within the optimal range, consistent with healthy iron balance.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3733","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5260","units":"ng/mL","description":"Ferritin is the body's primary iron storage protein. It reflects total iron reserves and is the most useful single marker for assessing iron status. Chris's result of 58 ng/mL is within the optimal range of 50 to 200 for men, indicating adequate iron stores to support energy production, red blood cell formation, and immune function.","low_causes":"Iron deficiency from poor intake, blood loss, malabsorption, heavy exercise","high_causes":"Haemochromatosis, inflammation (acute phase reactant), liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"94.9","upper_normal":"462.4","lower_optimal":"94.9","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5613","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and declining through the day. The lab provides a range of 94.9 to 462.4 for afternoon samples. Chris's result of 102 nmol/L falls within this range, indicating appropriate adrenal function. Without a timed morning sample for comparison, no firm conclusions can be drawn, but this level is not concerning in context.","low_causes":"Adrenal insufficiency, pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, steroid use, illness, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"199","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6811","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. Men produce small amounts from the conversion of testosterone via an enzyme called aromatase, primarily in fat tissue. Chris's result of 199 pmol/L is significantly above the male upper limit of 146.1. In the context of his supraphysiological testosterone level of 59.6, this is a direct consequence of increased aromatase conversion: more testosterone in the body means more substrate available for conversion to oestradiol. Elevated oestradiol in men can contribute to water retention, mood changes, and, over time, gynaecomastia (breast tissue development). This should be discussed with his GP or prescriber.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"Exogenous testosterone (increased aromatase conversion), obesity, liver disease, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2891","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5970","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in regulating other hormones and supporting mood. Chris's result of 0.82 nmol/L is marginally below the lower limit of 0.89. In the context of his suppressed gonadotropins from exogenous testosterone use, this is consistent with reduced testicular hormone production across the board. It is not a standalone concern but is part of the broader pattern of HPG axis suppression.","low_causes":"Pituitary suppression (exogenous testosterone), adrenal insufficiency","high_causes":"Adrenal tumours, congenital adrenal hyperplasia (rare in males)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"< 0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0060","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3399","upper_optimal_position":"0.6196","units":"mIU/mL","description":"Luteinising hormone, or LH, is produced by the pituitary gland and signals the testes to produce testosterone. It is part of the hypothalamic-pituitary-gonadal axis. Chris's LH is below 0.07, effectively undetectable, against a lower limit of 1.5. This profound suppression is the hallmark of exogenous testosterone use: when supraphysiological testosterone levels are present, the pituitary shuts down LH production because it detects that testosterone levels are already far above what the body needs. This means the testes are not being stimulated to produce testosterone or sperm independently, which has implications for fertility and for what happens if exogenous testosterone is discontinued.","low_causes":"Exogenous testosterone or anabolic steroid use, pituitary dysfunction, severe illness, opioid use","high_causes":"Primary hypogonadism (testicular failure), Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2381","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5339","units":"mIU/mL","description":"Follicle stimulating hormone, or FSH, is produced by the pituitary gland and drives sperm production in the testes (a process called spermatogenesis). Chris's FSH at 0.46 is well below the lower limit of 1.4, consistent with the same pituitary suppression seen in his LH. Suppressed FSH means that sperm production is likely severely reduced or absent. If fertility is a current or future consideration, this is an important finding to discuss with his GP.","low_causes":"Exogenous testosterone or anabolic steroid use, pituitary dysfunction, severe illness","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"59.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8192","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, body hair, libido, mood, and red blood cell production. Chris's result of 59.6 nmol/L is more than double the upper limit of 28.7, a level that is not achievable through natural production. Combined with his suppressed LH and FSH, this pattern is consistent with exogenous testosterone administration. Supraphysiological testosterone carries risks including elevated haematocrit (thickening of the blood), adverse lipid changes, liver strain, cardiovascular events, and suppression of natural fertility. Regular medical monitoring is essential.","low_causes":"Ageing, obesity, pituitary dysfunction, chronic illness, opioid use, sleep deprivation","high_causes":"Exogenous testosterone or anabolic steroid use, testicular tumour (rare), adrenal tumour (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"191","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4818","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3439","upper_optimal_position":"0.6106","units":"uIU/mL","description":"Prolactin is a pituitary hormone best known for its role in lactation in women, but men also produce it. Elevated levels in men can suppress testosterone and libido. Chris's result of 191 uIU/mL is within the optimal range, which is reassuring and rules out prolactinoma (a benign pituitary tumour) as a cause of any hormonal changes.","low_causes":"Dopamine agonist medications, pituitary dysfunction (rare)","high_causes":"Prolactinoma, certain medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"310.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8607","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5278","units":"","description":"The free androgen index, or FAI, is calculated as (total testosterone / SHBG) x 100. It estimates the proportion of testosterone that is biologically active and not bound to carrier proteins. Chris's FAI of 310 is more than double the upper limit of 150, driven by both his very high testosterone and his low SHBG. This confirms extremely high androgenic exposure at the tissue level.","low_causes":"Low testosterone, high SHBG, ageing, liver disease, hyperthyroidism","high_causes":"Exogenous testosterone, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-Sulphate","group":"HORMONES","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4233","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2.0","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3453","upper_optimal_position":"0.5709","units":"umol/L","description":"DHEA-sulphate is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. Chris's result of 3.5 umol/L (approximately 1,290 ug/dL) is within the optimal range for a 38-year-old, indicating healthy adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic illness, steroid use","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, polycystic ovary syndrome (in females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"19.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3465","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3492","upper_optimal_position":"0.5676","units":"nmol/L","description":"Sex hormone binding globulin, or SHBG, is a protein produced by the liver that binds testosterone and oestrogen, controlling how much of each is freely available to tissues. Chris's SHBG of 19.2 nmol/L is near the bottom of the reference range (lower limit 17.3) and well below the optimal range of 25 to 55. Low SHBG is common in the context of supraphysiological testosterone, insulin resistance, and elevated BMI. It means a disproportionately large fraction of his already very high testosterone is unbound and biologically active, amplifying the androgenic effect at the tissue level.","low_causes":"Exogenous testosterone, insulin resistance, obesity, hypothyroidism, NAFLD","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen use, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"1.997","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5566","lower_normal":"0.2","upper_normal":"0.62","lower_optimal":"0.3","upper_optimal":"0.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4127","upper_optimal_position":"0.6111","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone not bound to SHBG or albumin and therefore fully available to exert biological effects. Chris's calculated free testosterone of 1.997 nmol/L is extremely high, consistent with his supraphysiological total testosterone and low SHBG. This confirms very high androgenic activity at the tissue level.","low_causes":"Low total testosterone, high SHBG, ageing, chronic illness","high_causes":"Exogenous testosterone, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"13.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3529","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5905","units":"pmol/L","description":"Free thyroxine, or FT4, is the unbound form of the main thyroid hormone. The thyroid produces T4, which is then converted to the active form T3 in tissues. Chris's FT4 of 13.7 pmol/L is within the laboratory range (11.5 to 22.7) but sits just below the optimal threshold of 14. His TSH at 2.41 is within the optimal range, and his FT3 at 5.5 is optimal, indicating that despite the FT4 being at the lower end, the thyroid is converting effectively to active T3. This is not a concern currently but is worth monitoring over time.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4812","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4795","units":"mIU/L","description":"Thyroid stimulating hormone, or TSH, is produced by the pituitary gland to regulate thyroid function. It acts as a thermostat: rising when the thyroid is underperforming and falling when it is overactive. Chris's TSH of 2.41 is within the optimal range of 1.0 to 2.5, indicating well-regulated thyroid function with no sign of the pituitary needing to push the thyroid harder.","low_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5481","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the active thyroid hormone that drives metabolism, energy production, and body temperature regulation. It is converted from T4 in peripheral tissues. Chris's FT3 of 5.5 pmol/L is within the optimal range of 4.5 to 6.5, confirming that the thyroid is producing adequate active hormone. This is the most important thyroid marker for how someone actually feels day to day.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, severe illness, low calorie intake","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase antibodies, or TPO antibodies, are autoantibodies directed against a key enzyme in the thyroid gland. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Chris's result is below 6.6, well under the 13.8 threshold, confirming no autoimmune attack on the thyroid.","low_causes":"Negative results are normal and desirable","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1594","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein produced by the thyroid gland used in the production of thyroid hormones. Elevated levels, like TPO antibodies, indicate autoimmune thyroid disease. Chris's result of 1.4 U/mL is well below the 4.4 threshold. The lab notes that more than 80% of the population have undetectable levels (below 1.3), so his result just above that cut-off is entirely normal and not indicative of autoimmune thyroid disease.","low_causes":"Negative results are normal and desirable","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. Chris's result of 83 nmol/L is within the optimal range of 75 to 120. At a BMI of 34, this is a good result, as fat tissue sequesters vitamin D, making it harder to maintain adequate levels. A maintenance dose of 2,000 IU daily, particularly through autumn and winter, would help sustain this level.","low_causes":"Insufficient sun exposure, low dietary intake, obesity (fat sequesters vitamin D), malabsorption, darker skin","high_causes":"Excessive supplementation (rare with normal doses)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1067","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3340","upper_optimal_position":"0.5340","units":"pmol/L","description":"Parathyroid hormone, or PTH, is produced by the four parathyroid glands behind the thyroid. It regulates calcium and phosphate levels by controlling calcium release from bones, calcium absorption in the gut (via vitamin D activation), and calcium retention in the kidneys. Chris's PTH of 0.4 pmol/L is below the lower limit of 0.98. His corrected calcium is 2.49 (normal) and his vitamin D is 83 (sufficient). Low PTH with normal calcium can occur when adequate vitamin D means the body simply does not need much PTH to maintain calcium. However, the lab warns that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection, so this may be a sample handling issue. It is worth mentioning to his GP for a potential repeat on a promptly processed sample.","low_causes":"Adequate vitamin D suppressing PTH, sample degradation, hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"266","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3425","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6148","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and the production of neurotransmitters that regulate mood and energy, including serotonin and dopamine. Chris's result of 266 pg/mL is within the laboratory range (193 to 982) but significantly below the optimal level of 500. Suboptimal B12 is common on a convenience-based diet and can contribute to fatigue, low mood, and poor concentration, all of which Chris reports. Sublingual methylcobalamin at 1,000 mcg daily is recommended to bring this toward the optimal range.","low_causes":"Poor dietary intake (especially low in meat, fish, dairy), malabsorption, pernicious anaemia, metformin use, aging","high_causes":"Supplementation, B12 injections, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, works alongside B12 in DNA synthesis, red blood cell formation, and the methylation cycle that regulates gene expression, detoxification, and neurotransmitter production. Chris's result of 10 ng/mL is within the optimal range, indicating adequate folate intake from his diet.","low_causes":"Poor dietary intake, alcohol use, malabsorption, certain medications (methotrexate, phenytoin), pregnancy","high_causes":"Supplementation, high folate diet, impaired folate metabolism (MTHFR variants)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3619","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3546","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the reactive molecules that damage cells and contribute to ageing, inflammation, and chronic disease. Chris's result of 1.34 mmol/L is within the laboratory range but below the optimal level of 1.4. At a diet quality rating of 5 out of 10, increasing fruit and vegetable intake, particularly berries, leafy greens, and colourful vegetables, would help boost his antioxidant capacity.","low_causes":"Low fruit and vegetable intake, poor diet quality, chronic oxidative stress, smoking/vaping","high_causes":"High fruit and vegetable intake, antioxidant supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase, or CK, is an enzyme found mainly in skeletal muscle, the heart, and the brain. It is released into the blood when muscle tissue is dam function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
