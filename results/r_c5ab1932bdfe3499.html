<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Johren Higgins","dob":"15/05/1996","report_date":"2026-11-11","summary":"Patient is a 30-year-old male presenting with a BMI of 33.5, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). He does not report any cardio or resistance training days and his step count is not recorded. He sleeps 7 to 8 hours but is slow to get going on waking, with energy that feels wired at night. Stress feels hard to manage constantly. He does not drink alcohol. He works night shifts or rotating shifts and uses nicotine lozenges and microtabs. He takes an SSRI, ADHD medication, and cetirizine 10mg daily as an antihistamine. He has been diagnosed with ADHD, anxiety disorder, major depressive disorder, dermatographia, and histamine intolerance. He supplements with vitamin D, a methyl-free B complex, magnesium, omega-3 fish oil, a multivitamin, and creatine. His family history includes an autoimmune condition, type 2 diabetes, and thyroid disease. This is his first blood test. He reports low mood and anxiety, low energy and fatigue, brain fog, and bloating and digestive discomfort, all of which he says have always been present. His goals are to reduce stress and anxiety, improve mood, and improve energy levels.\n\nThe finding in this report that should be discussed with his GP first is his testosterone. Total testosterone is 7.1 nmol/L, below the lower limit of 8.4, and well below the recommended level of 12. Testosterone is the primary male hormone responsible for energy, mood, motivation, muscle mass, libido, and cognitive sharpness, and at 7.1 it is low enough to contribute meaningfully to several of the symptoms he reports, particularly the low energy, low mood, brain fog, and difficulty with motivation. What makes this more significant is the pattern around it. Luteinising hormone (LH), the signal the pituitary gland sends to the testes to produce testosterone, is 1.09, below its lower limit of 1.5. When testosterone is low AND LH is low, it points to the brain not sending the signal rather than the testes failing to respond, a pattern sometimes called secondary hypogonadism. His free androgen index (FAI), which measures how much testosterone is available to tissues rather than bound up by carrier proteins, is also below range at 28.06 against a lower limit of 30, and his bioavailable testosterone is 3.52 against a lower limit of 3.8. The whole testosterone axis is suppressed. There are several possible explanations. His BMI of 33.5 is one: excess body fat converts testosterone to oestradiol through an enzyme called aromatase, and his oestradiol at 140, just inside the upper limit of 146, is consistent with that process. His SSRI may also be contributing; some studies have reported an association between SSRIs and lower testosterone, though this is not consistent across all research, and he should not stop or change any prescribed medication without discussing it with his prescriber. Night shift work disrupts the circadian rhythm of testosterone production, which normally peaks in the early morning, and cortisol at 592, near the top of the morning reference range, may reflect chronic stress or a shifted circadian pattern. His ADHD medication can also suppress appetite and affect the hypothalamic-pituitary axis. This needs a repeat morning sample through his GP, ideally taken between 8am and 10am on a day off, to confirm the finding, followed by a conversation about whether investigation or treatment is appropriate.\n\nThe second finding that needs attention is his inflammatory profile. His hs-CRP, a highly sensitive measure of systemic inflammation, is 7.0 mg/L against an upper limit of 5.0 and an optimal target of below 1.0. His ESR (erythrocyte sedimentation rate), another marker of inflammation that reflects how quickly red blood cells settle in a tube, is 22 mm/hour against an upper limit of 12. These two markers measure inflammation through different mechanisms, and having both elevated together makes it more likely that genuine low-grade inflammation is present rather than laboratory noise. At BMI 33.5, excess adipose tissue is the most common driver: fat cells release inflammatory signalling molecules called cytokines, and CRP rises in proportion. His histamine intolerance and dermatographia, both of which involve an overactive immune response, could also contribute. His IgE, the antibody class associated with allergy, is 181 IU/ml against an upper limit of 100, which fits with an allergic or histamine-mediated component to his inflammation. His RDW (red cell distribution width), which measures how variable his red blood cells are in size, is 15.4% against an upper limit of 15.0, and elevated RDW is independently associated with chronic inflammation. His PLR (platelet-to-lymphocyte ratio) is 69.6, actually below the lower end of its range at 60, which is somewhat unusual alongside elevated CRP, and his SII (systemic immune-inflammation index) at 139 is just below the lower end of its range, driven by his low neutrophil count. The inflammation does not appear to be coming from infection, joint disease, or liver damage. Rheumatoid factor is negative at 4, liver enzymes are within range, and urinalysis is clean. The most likely explanation is a combination of adiposity-driven inflammation and his underlying histamine and allergic tendency. Bringing his weight down and managing the histamine intolerance are the two levers that will move CRP the most.\n\nHis cardiovascular risk score is 90 out of 100, which is high. This is a TrueVitals index that measures the metabolic risk being built rather than the ten-year probability of a heart attack, and at 30 his ten-year risk remains low simply because of his age. But the gap between the two is the window for acting. His LDL cholesterol is 3.29 mmol/L against an upper limit of 3.0, and his ApoB, which counts the actual number of cholesterol-carrying particles in the blood and is the best single predictor of cardiovascular risk, is 1.19 g/L against a target of below 0.9. His Lp(a)-corrected LDL is 3.21, which means almost all of the LDL elevation is modifiable through diet and weight loss rather than driven by Lp(a), the inherited cholesterol particle. His Lp(a) itself is below 25 nmol/L, well within the ideal range of below 32, which is genuinely useful information because it confirms the lipid picture is lifestyle-driven. His total cholesterol is 5.5 against a desirable level of below 5.18, and his non-HDL cholesterol is 3.9, just inside the upper limit of 4.0. The positive side of his lipid profile is real: HDL is 1.6, above the desirable threshold of 1.55 and within the optimal range for a male, and his ApoA1 at 1.98 is strong, giving an ApoB/A1 ratio of 0.60, below the lower-risk threshold of 0.7. Triglycerides at 1.5 are within the reference limit of 1.7 but above the optimal target of below 1.0. His atherogenic index of plasma at -0.028 is well within range, and his Castelli II ratio at 2.06 is within the optimal band. The story here is that he has a healthy HDL system but too many LDL particles, and the combination of weight loss, increased soluble fibre, oily fish twice a week, and reduced saturated fat will bring ApoB and LDL down without medication.\n\nHis blood sugar control is currently adequate but showing early signs of strain. Fasting glucose at 4.8 and HbA1c at 36 mmol/mol are both within optimal ranges, which means he is not diabetic or pre-diabetic. However, his fasting insulin at 11.57 mIU/L is above the optimal ceiling of 8, and his HOMA-IR, a calculation that estimates how resistant his cells are to insulin, is 2.47 against an upper limit of 1.5. A HOMA-IR above 1.9 indicates early insulin resistance, meaning his pancreas is having to produce more insulin than it should to keep his blood sugar in the healthy range. His C-peptide at 1.76 ug/L confirms the pancreas is working harder than ideal. His TyG index at 8.66 is within range but approaching the upper limit of 8.8. With a family history of type 2 diabetes, this is the pattern that leads to diabetes over the next 10 to 20 years if nothing changes, and it is also the pattern that reverses completely with weight loss and dietary adjustment. This is important context for his energy levels: insulin resistance causes glucose to be cleared less efficiently after meals, contributing to the afternoon energy dips and the wired-at-night feeling he describes.\n\nHis PhenoAge is 32.6 against a calendar age of 30, a difference of 2.6 years. PhenoAge is a composite biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. The gap is being driven primarily by his elevated CRP and his RDW, both of which reflect the inflammation discussed above. Bringing CRP down through weight loss and histamine management will pull PhenoAge back toward or below his calendar age.\n\nThere is genuine good news in this report. His kidney function is excellent, with a cystatin C of 1.06, just inside range, giving a cystatin C eGFR of 98 and a combined eGFR of 98, exactly where it should be at 30. The cystatin C eGFR is more reliable than the creatinine-based eGFR at higher BMI because creatinine is influenced by muscle mass, and at BMI 33.5 the cystatin C gives the truer picture. His liver is in good health: ALT at 33 is within the reference range of below 56, GGT at 21 is well within the optimal range of below 25, AST at 26 is mid-range, bilirubin is normal, albumin is healthy, and his FIB-4 score at 0.59 and APRI at 0.284 both sit comfortably in the low-risk range for liver fibrosis. His NAFLD fibrosis score at -2.188 is within the optimal band. His De Ritis ratio (AST divided by ALT) at 0.79 is just below the optimal band of 0.8 to 1.3, driven by the ALT being slightly higher than the AST, but both are within range and this is not a concern. His thyroid is functioning well. TSH at 4.39 is within range, though it sits in the upper quarter of the reference range of 0.55 to 4.78 and is above the optimal ceiling of 2.5. Free T4 at 15.9 is within the optimal band, and free T3 at 5.7 is also within the optimal band, which means the thyroid is converting T4 to its active form efficiently. His FT3:FT4 ratio at 0.358 is within the optimal range. Both thyroid antibodies are negative, which makes autoimmune thyroid disease unlikely despite his family history of thyroid disease. The TSH being at the upper end is worth keeping an eye on at future tests, but with both hormones in the optimal range and antibodies negative, the thyroid is not contributing to his symptoms right now. His vitamin D is 146 nmol/L, well above the sufficient threshold of 50 and reflecting good supplementation, though it sits above the optimal ceiling of 120. His calcium and corrected calcium are within range, parathyroid hormone is normal, phosphate and magnesium are both within their optimal ranges. His B12 at 440 is within the laboratory range but below the optimal floor of 500; given that he is supplementing with a B complex, the level suggests the dose or form may not be fully adequate, and a small adjustment may help. Folate at 8 ng/ml sits right at the optimal floor. His homocysteine at 9.86 is below the desirable limit of 15 but above the optimal target of below 9, and since homocysteine is driven by B12 and folate status, bringing both of those into the optimal range should lower it. His iron studies are well balanced: ferritin at 48 is just below the optimal floor of 50 for a male, serum iron at 26.5 is healthy, transferrin saturation at 41.38% is within the laboratory range but just above the optimal ceiling of 40%, and transferrin and iron binding capacity are both within range. His haemoglobin at 143 is healthy, red cell count, haematocrit, MCV, MCH, and MCHC are all within range. His white cell count at 5.98 is healthy. Platelets at 229 are well within range, and MPV at 9.9 is within range. His prostate markers are excellent: PSA at 0.21 is very low, free PSA ratio at 0.905 is strongly reassuring, and the tumour markers CA19-9 and CEA are both within range. Amylase and lipase, which reflect pancreatic function, are both mid-range. Creatine kinase at 64 is within range. His immunoglobulins IgG, IgM, and IgA are all within range, and coeliac screening with tissue transglutaminase IgA is negative, making coeliac disease very unlikely as a cause of his bloating. Rheumatoid factor is negative. Prolactin at 214 is within range, which makes a prolactinoma unlikely as the cause of his low LH. DHEA-S at 3 umol/L is within range. SHBG at 25.3 is within the laboratory range but at the lower end, and free testosterone, while technically within the laboratory range at 0.165, is low in the context of his total testosterone being below range. His cortisol at 592 is near the top of the morning reference range, and given his night shift work, this may reflect a shifted circadian cortisol rhythm rather than true excess. It is worth the GP noting alongside the wired-at-night and constant stress pattern.\n\nHis neutrophil count at 1.99 is marginally below the lower limit of 2.0. This is a very small margin and in isolation would be considered normal variation, but in the context of his elevated lymphocytes at 3.29 (above the upper limit of 3.0), it creates an NLR (neutrophil-to-lymphocyte ratio) of 0.60, below the lower limit of 1.0. A low NLR with lymphocyte predominance can be seen in chronic stress, viral carriage, and atopic or allergic conditions. Given his known histamine intolerance, elevated IgE, and chronic stress, this pattern is most likely driven by his immune and allergic tendency rather than anything more serious. His reticulocyte percentage at 0.96 is within range, but the absolute reticulocyte count at 47.6 is marginally below the lower limit of 50, which at this margin is laboratory variation rather than a sign of bone marrow suppression, especially with a normal haemoglobin and healthy red cell indices. His basophils are reported as below 0.01, which the lab has flagged, but basophils are the rarest white cell type and a value at or near zero is common and not clinically significant. His total antioxidant activity at 1.97 is above the upper limit of 1.77, which is expected given his supplementation with a multivitamin, omega-3, and vitamin D, all of which contribute to antioxidant capacity. His oestradiol at 140 is just inside the upper limit of 146 and is relevant in the context of his low testosterone and BMI, as discussed above. His progesterone at 1.32 is within the male reference range and is not a concern. His urinalysis is clean: no protein, no glucose, no ketones, no nitrites, no significant white cells, no red cells, no bacterial growth, and urine culture shows no growth. His estimated average glucose at 6.1 is within range, and his serum osmolality at 285 is within the optimal band. His uric acid at 368 is within the optimal range.","links":"The thread running through this report connects three systems: weight, inflammation, and hormones, and they are reinforcing each other.\n\nAt BMI 33.5, excess adipose tissue is doing two things simultaneously. First, it is driving the inflammatory markers. Fat cells release cytokines that raise CRP, and his CRP at 7.0 is the clearest sign that this process is active. The ESR at 22 confirms it through a different mechanism. His elevated IgE at 181 adds an allergic and histamine-mediated layer on top of the adiposity-driven inflammation, and together these are the most likely explanation for the elevated RDW at 15.4, since chronic inflammation increases variability in red blood cell size. His PhenoAge of 32.6, 2.6 years above his calendar age, is being pulled up primarily by the CRP and RDW.\n\nSecond, excess body fat is converting testosterone to oestradiol through aromatase. His oestradiol at 140 is near the upper limit, his testosterone at 7.1 is below range, and the pituitary appears to have responded by suppressing LH to 1.09, possibly because it is reading oestradiol as a signal that sex hormone levels are adequate. This creates a cycle: low testosterone makes it harder to build and maintain lean mass, which makes it harder to lose fat, which keeps aromatase activity high. His night shift work compounds this by disrupting the early-morning testosterone peak, and the cortisol at 592, near the top of the morning range, may reflect either the shifted circadian pattern or the chronic stress he reports. The SSRI is a possible additional contributor, though the evidence for this is mixed across studies.\n\nThe insulin resistance, with HOMA-IR at 2.47 and fasting insulin at 11.57, is the metabolic consequence of the same excess weight. It is not yet causing blood sugar problems, with glucose at 4.8 and HbA1c at 36, but the pancreas is working harder than it should to maintain that control. With a family history of type 2 diabetes, this is the stage where intervention has the highest return. Insulin resistance also worsens inflammation and promotes fat storage, particularly visceral fat, which produces more cytokines, completing another reinforcing loop.\n\nThe lipid picture, with ApoB at 1.19 and LDL at 3.29, is being driven by the same metabolic pattern. The Lp(a) below 25 confirms that the LDL elevation is modifiable through lifestyle rather than inherited, and the strong HDL at 1.6 and ApoA1 at 1.98 show that his reverse cholesterol transport is working well. The cardiovascular risk score of 90 out of 100 is high, but it is high because of modifiable factors, and that is the key point: the score measures risk being built, not destiny.\n\nWhat has been excluded matters. His thyroid is working well despite his family history of thyroid disease, with antibodies negative and both T3 and T4 in optimal ranges. Coeliac disease is very unlikely with a negative tissue transglutaminase. His liver is healthy despite his BMI. His kidneys are excellent. His iron is balanced. These exclusions narrow the focus to the weight-inflammation-hormone triangle as the explanation for his symptoms, with his histamine intolerance and shift work as aggravating factors.\n\nThe loose end is the bloating and digestive discomfort he reports. Nothing in the blood panel explains it directly. Coeliac has been excluded. Liver and pancreatic enzymes are normal. The most likely causes are histamine intolerance (which he already knows about), possible food intolerances that blood tests cannot detect, and the effect of chronic stress on gut motility. A food and symptom diary, and possibly a hydrogen breath test for SIBO or lactose intolerance, would be the next steps if the bloating remains troublesome despite managing histamine triggers.","lifestyle":"Increase protein at every meal to at least 130g per day, aiming for a palm-sized portion of protein as the base of each meal. Eggs, Greek yoghurt, chicken, fish, or beans. Anchor: protein goes on the plate first, before anything else. Why: protein supports lean mass, which raises your metabolic rate and helps lower the insulin resistance behind your HOMA-IR of 2.47, and adequate protein is needed to support testosterone production.\nReduce sugary food from some days to rarely, swapping for whole fruit, nuts, or dark chocolate when cravings hit. Anchor: when you reach for something sweet, swap it once, then decide. Why: sugar drives the insulin spikes your pancreas is already overproducing to manage, and reducing it is the fastest way to bring your fasting insulin of 11.57 closer to the optimal ceiling of 8.\nAdd one extra portion of vegetables or fruit per day, building from 2 to 3 up to 4 to 5 over the next month. Anchor: add one portion to whichever meal is easiest, starting today. Why: vegetables provide soluble fibre, which lowers LDL cholesterol and ApoB, feeds beneficial gut bacteria that may help your bloating, and slows glucose absorption.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door or on a treadmill. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses your HOMA-IR of 2.47, and walking is the most effective single intervention for bringing CRP down alongside weight loss.\nStart two resistance training sessions per week, even 20 minutes of bodyweight exercises at home. Anchor: pick two fixed days and treat them like shifts. Why: resistance training builds the lean mass that raises testosterone, improves insulin sensitivity, and increases your metabolic rate, making weight loss sustainable. Your creatine supplementation supports this.\nSet a fixed wake time on days off that is no more than one hour later than your work days, and get outside or near a bright window within 30 minutes of waking. Anchor: alarm goes off, curtains open or step outside before coffee. Why: your wired-at-night pattern and slow mornings suggest a shifted circadian rhythm, which night shifts will worsen; anchoring the wake time and getting morning light is the strongest signal to reset the body clock, and a stable rhythm supports testosterone production and cortisol regulation.\nCut caffeine by 1pm on all days, including night shifts. Anchor: no caffeine after lunch, switch to water or herbal tea. Why: caffeine after midday delays melatonin onset by up to 40 minutes, worsening the wired-at-night pattern and making morning grogginess worse the next day.\nAim for a calorie intake of around 2,000 to 2,200 kcal per day, with at least 130g of protein, to create a moderate deficit that supports gradual weight loss of 0.5 to 0.75 kg per week toward a target weight of around 85 to 90 kg. Why: this is the single biggest lever in the report, because bringing your weight down will lower your CRP, improve your insulin sensitivity, bring your testosterone up, lower your ApoB and LDL, and reduce the strain on every system that is currently flagged.","flags":"Testosterone 7.1 nmol/L (below range 8.4, below recommended 12) with LH 1.09 mIU/mL (below range 1.5), free androgen index 28.06 (below range 30), and bioavailable testosterone 3.52 nmol/L (below range 3.8). This pattern points to secondary hypogonadism, where the pituitary is not sending adequate signal to the testes. Possible contributors include BMI 33.5 with aromatisation to oestradiol (140, near the upper limit of 146), night shift work disrupting the circadian testosterone peak, SSRI use, and chronic stress. Repeat morning sample recommended.\nhs-CRP 7.0 mg/L (above limit of 5.0, optimal below 1.0) and ESR 22 mm/hour (above limit of 12). Both elevated together, indicating genuine systemic inflammation. At BMI 33.5, adiposity-driven inflammation is the most likely primary driver, with histamine intolerance and elevated IgE as additional contributors.\nIgE 181 IU/mL (above limit of 100). Consistent with his known histamine intolerance and dermatographia. Confirms an allergic or histamine-mediated component to his inflammatory picture.\nHOMA-IR 2.47 (above limit of 1.5, indicating early insulin resistance) with fasting insulin 11.57 mIU/L (within reference range but above optimal ceiling of 8). Glucose 4.8 and HbA1c 36 are both optimal, meaning the pancreas is compensating, but with a family history of type 2 diabetes this pattern needs active management through weight loss and dietary change.\nApoB 1.19 g/L (above target of 0.9), LDL 3.29 mmol/L (above limit of 3.0), total cholesterol 5.5 (above desirable 5.18), Lp(a)-corrected LDL 3.21 (above limit of 3.0). HDL 1.6, ApoA1 1.98, and ApoB/A1 ratio 0.60 are all positive. Lp(a) below 25 confirms the elevation is modifiable. Cardiovascular risk score 90 out of 100, driven by ApoB, LDL, CRP, and triglycerides.\nTSH 4.39 mIU/L (within laboratory range 0.55 to 4.78 but above optimal ceiling of 2.5). FT4 15.9 and FT3 5.7 are both in optimal ranges. Both thyroid antibodies negative. Not causing symptoms now, but worth monitoring given family history of thyroid disease.\nNeutrophils 1.99 x10^9/L (marginally below limit of 2.0) with lymphocytes 3.29 (marginally above limit of 3.0), giving NLR 0.60 (below lower normal limit of 0.78). Most likely reflects his atopic and allergic tendency (histamine intolerance, elevated IgE) and chronic stress rather than pathology.\nRDW 15.4% (marginally above limit of 15.0). Associated with chronic inflammation; fits with his CRP and ESR elevation.\nReticulocyte absolute count 47.6 x10^9/L (marginally below limit of 50). At this margin, with normal haemoglobin and healthy red cell indices, this is laboratory variation.\nCortisol 592 nmol/L (near top of morning range 145.4 to 619.4). Night shift work may shift the circadian cortisol pattern. Worth the GP noting alongside the wired-at-night and constant stress pattern.\nB12 440 pg/mL (within laboratory range but below optimal 500). Folate 8 ng/mL (at optimal floor). Homocysteine 9.86 (below desirable 15 but above optimal 9). Optimising B12 and folate should lower homocysteine.\nFerritin 48 ng/mL (within laboratory range but marginally below optimal 50 for a male). Not low enough to cause symptoms; iron studies are otherwise well balanced.\nTotal antioxidant activity 1.97 mmol/L (above limit of 1.77). Expected given multivitamin, omega-3, and other supplementation.\nPhenoAge 32.6 against calendar age 30, a gap of 2.6 years driven primarily by CRP and RDW. Will improve as inflammation comes down.\nBasophils below 0.01 (flagged by lab). Basophils are the rarest white cell type and a value at or near zero is common and not clinically significant.\nReassuring negatives: thyroid antibodies negative, making autoimmune thyroid disease unlikely despite family history. Coeliac screen negative. Liver enzymes, FIB-4, and APRI all within range, making significant liver disease unlikely. Kidney function excellent with eGFR 98. PSA 0.21 with free ratio 0.905, making prostate pathology very unlikely. Rheumatoid factor negative. Urine culture negative with no haematuria. Fasting glucose and HbA1c both optimal, making diabetes unlikely at present. Prolactin within range, making prolactinoma unlikely. Immunoglobulins IgG, IgM, and IgA within range.","recommendations":"Discuss the testosterone result with your GP. Total testosterone is 7.1, below range, with LH 1.09 also below range, pointing to secondary hypogonadism. Request a repeat morning blood sample taken between 8am and 10am on a day off from night shifts, including testosterone, LH, FSH, prolactin, oestradiol, and SHBG, to confirm the finding and determine whether investigation or referral is needed.\nMention the inflammatory markers. hs-CRP is 7.0 and ESR is 22, both above range. While BMI and histamine intolerance are the most likely explanations, the GP may wish to exclude other causes if the levels do not improve with weight loss over the next 3 to 6 months.\nDiscuss the early insulin resistance. HOMA-IR is 2.47 with fasting insulin 11.57, indicating the pancreas is working harder than ideal to maintain normal blood sugar. With a family history of type 2 diabetes, the GP should be aware and may wish to include fasting glucose and HbA1c in routine monitoring.\nMention the lipid results. ApoB is 1.19 against a target of 0.9, and LDL is 3.29 against a limit of 3.0. At 30 with no other major risk factors, lifestyle change is the first-line approach, and the GP can reassess after 6 months of dietary adjustment and weight loss.\nNote the TSH of 4.39 at the upper end of range, with negative antibodies and optimal FT4 and FT3. Given the family history of thyroid disease, the GP may wish to include thyroid function in future routine checks.\nMention the IgE of 181 and the pattern of low neutrophils with high lymphocytes. The GP may wish to correlate with his histamine intolerance management and consider whether allergy clinic input would help.\nDiscuss the cortisol of 592, near the top of the morning range, in the context of night shift work. The GP may wish to check a repeat morning cortisol on a day off to assess the circadian pattern.\nAim for a calorie intake of 2,000 to 2,200 kcal per day with at least 130g of protein per day (approximately 1.4g per kg of a target weight of 90 kg), targeting gradual weight loss toward 85 to 90 kg. Retest in 6 months with: testosterone, LH, FSH, SHBG, oestradiol, fasting insulin, HOMA-IR, HbA1c, hs-CRP, ESR, ApoB, LDL, full blood count, and thyroid function to track progress.","supplementation":"Continue vitamin D3 (cholecalciferol) at 4,000 IU daily with a meal containing fat. At BMI 33.5, fat tissue sequesters vitamin D, so a higher dose is needed to maintain the excellent level of 146 nmol/L. Pair with vitamin K2 (MK-7) at 200 mcg daily if not already included in his multivitamin, to direct calcium to bone rather than arteries.\nIncrease B12 and folate intake. His current methyl-free B complex is a good choice given his preference for non-methylated forms, but his B12 at 440 is below the optimal 500 and folate at 8 is at the optimal floor. He should speak with a pharmacist about whether a higher-dose non-methylated B12 (such as hydroxocobalamin or adenosylcobalamin) and a non-methylated folate (such as folinic acid) are available to add alongside his current complex, aiming to bring B12 above 500 and homocysteine below 9.\nContinue magnesium glycinate at 300 to 400 mg before bed. His magnesium at 0.92 is within the optimal range, and magnesium glycinate supports sleep quality, stress management, and insulin sensitivity, all of which are relevant to his goals.\nContinue omega-3 fish oil at 2 to 3g of combined EPA and DHA daily with food. Omega-3 lowers triglycerides, reduces inflammation (his CRP is 7.0), and supports mood, which is relevant to his anxiety and low mood.\nContinue creatine at 3 to 5g daily. Creatine supports brain function and energy, both of which are relevant to his ADHD and brain fog, and will support any resistance training he adds.\nDo not take iron supplements. His ferritin at 48 is marginally below optimal but his iron, transferrin saturation, and haemoglobin are all healthy. Additional iron at this level risks pushing stores too high.\nThe most important changes from this report are not supplements. They are reducing body weight through a moderate calorie deficit with high protein, adding resistance training, managing the circadian disruption from night shifts, and discussing the testosterone finding with his GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 50 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 49.6. Weakest systems: inflammation 6%, immunology 21%, glucose & insulin 32%. Biggest drags: HOMA-IR, hs-CRP, Apolipoprotein B, LDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"32.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4657","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a composite biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. His PhenoAge of 32.6 against a calendar age of 30 represents a gap of 2.6 years, meaning his blood markers suggest a biological age slightly older than his chronological age. The gap is primarily driven by his elevated CRP (7.0) and RDW (15.4), both of which reflect the chronic inflammation discussed throughout this report. Bringing CRP down through weight loss and histamine management will pull PhenoAge back toward or below his calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It measures the metabolic risk being built rather than the ten-year probability of a cardiovascular event. His score of 90 is high, driven primarily by his ApoB at 1.19, LDL at 3.29, CRP at 7.0, and triglycerides at 1.5. At 30, his ten-year risk remains low because of his age, but the gap between the score and the ten-year risk is the window for acting. Every modifiable input to this score (ApoB, LDL, CRP, triglycerides) will improve with weight loss and dietary change.","low_causes":"Optimal lipids, low inflammation, healthy weight","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the concentration of sugar in the blood after fasting, and it is one of the primary markers used to assess diabetes risk. His level of 4.8 mmol/L sits comfortably within the optimal range of 4.0 to 5.4, meaning his blood sugar is being well controlled. This is a reassuring result, though it needs to be read alongside his insulin level, because glucose can appear normal even when the pancreas is having to work harder than it should to keep it there.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, giving a picture of average blood sugar control over the past two to three months. His result of 5.4% is within the normal range (below 6.0%) and well below the pre-diabetes threshold of 6.0 to 6.4%. This confirms that his blood sugar control has been good over recent months.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Diabetes, pre-diabetes, iron deficiency, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5758","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol. His result of 36 is within the normal range of below 42 and at the optimal ceiling. Below 42 is classified as normal, 42 to 47 as pre-diabetes, and above 48 as diabetes. At 36, his average blood sugar control is healthy.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Diabetes, pre-diabetes, iron deficiency, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"11.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4674","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone the pancreas produces to move glucose from the blood into cells. A fasting insulin level shows how hard the pancreas has to work to keep blood sugar under control. His level of 11.57 mIU/L is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8. This means his pancreas is producing more insulin than ideal to maintain his healthy blood sugar of 4.8, which is one of the earliest signs of insulin resistance. At BMI 33.5 and with a family history of type 2 diabetes, this is a finding that responds well to weight loss and dietary adjustment.","low_causes":"Low carbohydrate diet, very lean body composition, type 1 diabetes","high_causes":"Insulin resistance, obesity, high carbohydrate diet, polycystic ovary syndrome, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4242","units":"ug/L","description":"C-peptide is released by the pancreas in equal amounts to insulin, so it acts as an independent measure of how much insulin the body is producing. His level of 1.76 ug/L is within the laboratory range of 1.1 to 4.4, confirming that his pancreas is producing insulin adequately. It sits above the optimal ceiling of 2.0, consistent with the insulin level showing the pancreas working a little harder than ideal to maintain glucose control.","low_causes":"Type 1 diabetes, low insulin production, fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9900","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (homeostatic model assessment of insulin resistance) is a calculation that uses fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 means excellent insulin sensitivity. His score of 2.47, above the upper limit of 1.5 and above the 1.9 threshold that indicates early insulin resistance, means his cells are not responding to insulin as efficiently as they should, and the pancreas is compensating by producing more. With a family history of type 2 diabetes, bringing this below 1.5 through weight loss and dietary change is one of the most important goals from this report.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, very lean body composition","high_causes":"Insulin resistance, obesity, high carbohydrate diet, sedentary lifestyle, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over the past two to three months. His level of 6.1 mmol/L is within the optimal range of below 6.2, confirming good average blood sugar control.","low_causes":"Excellent blood sugar control, low carbohydrate diet","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4920","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index (triglyceride-glucose index) is a surrogate marker for insulin resistance, calculated from fasting triglycerides and glucose. His index of 8.66 is within the reference range but above the optimal ceiling of 8.5, consistent with his HOMA-IR showing early insulin resistance. It will improve as triglycerides and glucose respond to weight loss and dietary change.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"9.86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3287","lower_normal":"0","upper_normal":"15","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"umol/L","description":"Homocysteine is an amino acid that builds up in the blood when the body does not have enough B12 or folate to recycle it. Elevated levels are associated with increased cardiovascular risk and can also reflect suboptimal B vitamin status. His level of 9.86 umol/L is below the desirable limit of 15 but above the optimal target of below 9. Given his B12 at 440 (below optimal 500) and folate at 8 (at the optimal floor), optimising both of these should bring homocysteine below 9.","low_causes":"Good B vitamin status, supplementation","high_causes":"B12 deficiency, folate deficiency, B6 deficiency, kidney disease, genetic variants (MTHFR), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"41.38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5440","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. It reflects how much iron is actively being transported in the blood. His level of 41.38% is within the laboratory range of 18 to 55% but just above the optimal ceiling of 40%. Iron transport is working well, and this is a minor finding that does not require any action.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"26.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5854","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6108","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood. Iron is essential for oxygen transport in red blood cells and for energy production. His level of 26.5 umol/L is within the optimal range of 14 to 28, showing good iron availability.","low_causes":"Iron deficiency, chronic disease, poor absorption, vegetarian diet","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron through the blood to the bone marrow and other tissues. His level of 2.55 g/L is within the optimal range of 2.3 to 3.3, indicating healthy iron transport capacity.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"58.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4860","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity (TIBC) measures the total capacity of transferrin to bind iron. It rises when iron stores are low and falls when they are high. His level of 58.7 umol/L is within the optimal range, consistent with balanced iron status.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3622","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/mL","description":"Ferritin is the body's iron storage protein and reflects how much iron is held in reserve. His level of 48 ng/mL is within the laboratory range of 22 to 322 but marginally below the optimal floor of 50 for a male. This is not low enough to cause symptoms, especially since his serum iron and transferrin saturation are both healthy, but it is worth keeping an eye on. His elevated CRP could theoretically raise ferritin as an acute phase protein, meaning his true stores might be slightly lower than 48 suggests.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"130","upper_normal":"170","lower_optimal":"135","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. His level of 143 g/L is within the optimal range of 135 to 165, confirming he is not anaemic and that oxygen delivery is working well.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the number of red cells per litre of blood. His count of 4.96 is within the optimal range, consistent with his healthy haemoglobin and confirming good red cell production.","low_causes":"Anaemia, blood loss, bone marrow disorders, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key" ust above the optimal ceiling of 3.5. With excellent vitamin D at 146 and normal corrected calcium at 2.34, this is not a concern; PTH is simply sitting at the upper end of its range.","low_causes":"Excess calcium, excess vitamin D, hypoparathyroidism","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"440","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4377","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. His level of 440 pg/mL is within the laboratory range of 193 to 982 but below the optimal floor of 500. Given that he is supplementing with a methyl-free B complex, the level suggests the current dose may not be fully adequate to reach optimal status. B12 below optimal can contribute to fatigue, brain fog, and low mood, all of which he reports. Increasing his B12 intake in the non-methylated form he already uses should bring this above 500.","low_causes":"Inadequate dietary intake (vegan/vegetarian), pernicious anaemia, malabsorption, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_positio
