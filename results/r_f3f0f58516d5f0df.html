s is below the optimal threshold of 1.0 and well below the laboratory limit of 5.0. This is a genuinely good result and indicates that despite his alcohol intake and training load, Chris does not have significant systemic inflammation. A CRP below 1.0 is associated with the lowest cardiovascular risk category from an inflammatory perspective.","low_causes":"Low levels are favourable and indicate minimal systemic inflammation","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, cardiovascular disease, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. At 4, this is low and confirms the absence of significant systemic inflammation, consistent with his low CRP.","low_causes":"Low levels are favourable","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6487","units":"mmol/L","description":"Sodium is the main electrolyte that regulates fluid balance, blood pressure, and nerve function. At 143, this is within the optimal range and reflects normal hydration and kidney function.","low_causes":"Overhydration, kidney disease, heart failure, diuretics, vomiting, diarrhoea","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. At 4.8, this is within the laboratory range of 3.5 to 5.3 but above the optimal band of 3.8 to 5.0. The lab notes that delayed sample processing can falsely elevate potassium as it leaks from red blood cells. At 4.8, this is mildly above optimal but not concerning. It may reflect a combination of his high training volume and dietary intake.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low dietary intake","high_causes":"Delayed sample processing, kidney disease, certain medications, excessive supplementation, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 102, this is within the optimal range and unremarkable.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4455","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is a buffer that helps maintain the blood's acid-base balance. At 23.7, this is within range and indicates normal acid-base status. The kidneys and lungs work together to keep bicarbonate within a tight range.","low_causes":"Metabolic acidosis, kidney disease, severe diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"22.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8292","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate) and helps assess acid-base balance. At 22.1, this is above the normal range of 8 to 16. However, this calculation is sensitive to the method used and the inclusion of potassium. The individual electrolyte values are all within range, bicarbonate is normal, and there are no clinical features suggesting a significant acid-base disturbance. This is likely a laboratory artefact related to the calculation methodology rather than a genuine metabolic concern. If Chris were experiencing a true high anion gap acidosis, other markers such as bicarbonate and glucose would typically be deranged. This can be noted for the GP but is not actionable in isolation.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Lactic acidosis, ketoacidosis, renal failure, toxin ingestion, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5292","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6228","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. At 2.43, this is within the optimal range. Calcium is tightly regulated by parathyroid hormone (PTH) and vitamin D, both of which are within range for Chris.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium level for the albumin concentration, giving a more accurate picture of true calcium status. At 2.41, this is within the optimal range and confirms healthy calcium metabolism.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5478","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3839","upper_optimal_position":"0.6149","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and energy production in every cell. At 1.4, this is within the optimal range. Phosphate is regulated by the kidneys, PTH, and vitamin D, all of which are functioning well for Chris.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive dairy intake, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle relaxation, nerve function, and sleep regulation. At 0.95, Chris is within the optimal range of 0.85 to 1.05. This is a strong result, particularly relevant given his high training volume and his symptoms of fatigue and low mood, as magnesium deficiency can contribute to both. Alcohol can deplete magnesium, so maintaining this level despite his intake is positive.","low_causes":"Alcohol, diuretics, poor dietary intake, excessive sweating, malabsorption","high_causes":"Kidney disease, excessive supplementation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"424","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5407","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4823","units":"umol/L","description":"Uric acid is the end product of purine metabolism, purines being found in foods like red meat, organ meats, shellfish, and beer. The kidneys excrete uric acid, and levels rise when production exceeds excretion. At 424, Chris is within the laboratory range of 220 to 547 but above the optimal range of 200 to 380. Elevated uric acid is associated with gout, kidney stones, and cardiovascular inflammation. Alcohol is a significant contributor because it competes with uric acid for excretion through the kidneys, and beer in particular is high in purines. Reducing alcohol intake and moderating purine-rich foods would be the most effective strategies to bring this into the optimal range.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"Alcohol, high purine diet, kidney impairment, metabolic syndrome, dehydration, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/L","description":"Urea is a waste product of protein metabolism, filtered by the kidneys. At 7, this is within the optimal range and reflects normal kidney function and adequate protein intake. Higher levels can indicate dehydration, excessive protein intake, or reduced kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4188","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered at a constant rate by healthy kidneys. At 75, this is within the optimal range and reflects normal kidney function. Creatinine levels are influenced by muscle mass, so the Cystatin C-based eGFR provides a complementary and muscle-mass-independent assessment.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimates how efficiently the kidneys filter blood. The lab reports this as >90, which is above both the normal threshold of 60 and the optimal threshold of 90. Combined with the Cystatin C eGFR of 105, this confirms healthy kidney function at 35.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, nephrotoxic medications","high_causes":"Not typically a concern when high, can occur in early diabetes with hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.875","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable measure of kidney function in active individuals. At 105, Chris's Cystatin C-based eGFR confirms excellent kidney function.","low_causes":"Chronic kidney disease, acute kidney injury","high_causes":"Not typically a concern","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4273","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C itself at 0.94 is within the laboratory range of below 1.1 and within optimal bounds. This raw value is used to calculate the Cystatin C eGFR above.","low_causes":"Not typically a concern","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"161","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 161, this is within the male reference range of 130 to 170 and within the optimal band. This is a healthy result. PED use, particularly testosterone, can push haemoglobin higher due to increased red blood cell production, a side effect called polycythaemia. Chris's level is within range, which is reassuring, but this should be monitored on future tests.","low_causes":"Iron deficiency, vitamin B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, PED/testosterone use, polycythaemia vera, chronic hypoxia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. At 5.12, this is within range and consistent with his healthy haemoglobin and haematocrit.","low_causes":"Anaemia from iron, B12, or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, PED use, polycythaemia vera, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.4","upper_optimal":"0.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.47, this is within range. PED use can push haematocrit above 0.50, which increases blood viscosity and cardiovascular risk. Chris's level is within a safe range, but monitoring on future tests is important while PED use continues.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Dehydration, PED use, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"12.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4476","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"RDW, red cell distribution width, measures the variation in size among red blood cells. A higher RDW indicates more variation, which can suggest iron or B12 deficiency. At 12.7, this is within the optimal range and indicates uniformly sized, healthy red blood cells.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"91.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4981","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV, mean corpuscular volume, measures the average size of red blood cells. At 91.9, this is within the optimal range. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. A normal MCV with normal iron, B12, and folate confirms healthy red cell production.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5573","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH, mean corpuscular haemoglobin, measures the average amount of haemoglobin in each red blood cell. At 31.6, this is within the optimal range and indicates that each cell is carrying an appropriate amount of oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"343","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, mean corpuscular haemoglobin concentration, measures how concentrated the haemoglobin is within each red blood cell. At 343, this is within range and near the upper end, which is normal. The lab notes that temperature and storage can affect this measurement.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration, laboratory artefact from sample storage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"199","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3897","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that clump together to form blood clots and stop bleeding. At 199, this is within the optimal range and reflects healthy bone marrow production.","low_causes":"Viral infections, bone marrow disorders, alcohol, autoimmune conditions, medications","high_causes":"Iron deficiency, infection, inflammation, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7200","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV, mean platelet volume, measures the average size of platelets. Larger platelets are younger and more metabolically active. At 10.4, this is marginally above the upper limit of 10.1. At this margin, this is typically a normal variant and reflects slightly larger, younger platelets being released from the bone marrow. With a normal platelet count of 199 and no other haematological concerns, this is not significant.","low_causes":"Bone marrow suppression, aplastic anaemia, chemotherapy","high_causes":"Increased platelet turnover, immune thrombocytopenia, myeloproliferative disorders, normal variant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2633","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6000","units":"x10^9/L","description":"White blood cells are the immune system's army, defending against infection, viruses, and abnormal cells. At 3.58, Chris's total white cell count is below the lower limit of 4.0. This is driven primarily by low neutrophils at 1.62. The remaining white cell subtypes, lymphocytes, monocytes, eosinophils, and basophils, are all within range. A mildly low WBC in a young, active man with no history of recurrent infections can result from several factors: high-volume exercise redistributes neutrophils out of the circulating blood into tissues, anabolic steroids and PEDs can suppress bone marrow function, and regular alcohol consumption is another recognised contributor. His CRP at 0.6 and ESR at 4 are both low, which argues against active infection or an inflammatory process consuming the cells. This should be monitored on his next blood test.","low_causes":"Viral infections, bone marrow suppression from PEDs or medications, high-volume exercise, alcohol, benign ethnic neutropenia, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2573","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. At 1.62, this is below the lower limit of 2.0 and is the primary driver of Chris's low total white cell count. Mild neutropenia at this level, sometimes called benign neutropenia, is common in the context of heavy exercise, PED use, and regular alcohol intake. The clinical significance depends on whether Chris experiences frequent or unusual infections. If he does not, this is likely a benign finding, but it should be discussed with his GP and monitored.","low_causes":"High-volume exercise, PED/anabolic steroid use, alcohol, viral infections, benign ethnic neutropenia, autoimmune conditions, certain medications","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including fighting viruses and producing antibodies. At 1.45, this is within the optimal range and provides reassurance that the adaptive immune system is intact despite the low overall white cell count.","low_causes":"Viral infections (acute phase), corticosteroid use, immunodeficiency, severe stress","high_causes":"Viral infections (recovery phase), chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become normal":"TRUE","within_optimal":"TRUE","result_position":"0.3893","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a calculated marker of systemic inflammation and immune balance. At 1.12, this is within the optimal range of 1.0 to 2.0. A low NLR alongside low CRP confirms that there is no significant inflammatory or infectious process, which is reassuring context for the low absolute neutrophil count.","low_causes":"Neutropenia (as seen here), generally favourable when within range","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly released red blood cells. The reticulocyte percentage reflects how actively the bone marrow is producing new red cells. At 1.08%, this is within range and indicates normal bone marrow activity. This is reassuring in the context of PED use, as it suggests the bone marrow is not being overstimulated.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Recovery from blood loss, haemolytic anaemia, response to erythropoietin or PED use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"55.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3843","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"The absolute reticulocyte count provides the actual number of young red blood cells per litre of blood, which is more reliable than the percentage in some situations. At 55.3, this is within the laboratory range of 50 to 100 but sitting at the lower end. This is consistent with stable, adequate red cell production rather than the increased production sometimes seen with PED-driven erythropoiesis.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Recovery from blood loss or anaemia, haemolytic anaemia, PED use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"38.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5151","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3982","upper_optimal_position":"0.5306","units":"%","description":"Transferrin saturation measures what percentage of the iron-carrying protein transferrin is loaded with iron. At 38.2%, this is within the optimal range of 25 to 40%. A saturation below 20% suggests iron deficiency, while above 45% may suggest iron overload. Chris's result is well balanced.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"28.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6092","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3738","upper_optimal_position":"0.6472","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. At 28.3, this is within the optimal range. Serum iron fluctuates throughout the day and with recent meals, so it is best interpreted alongside transferrin saturation and ferritin, both of which are also well placed.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, excessive iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. At 2.95, this is within the optimal range. Normal transferrin alongside normal ferritin and saturation provides a comprehensive picture of healthy iron metabolism.","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency (body produces more transferrin to capture scarce iron), pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"64.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5502","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3955","upper_optimal_position":"0.6252","units":"umol/L","description":"Total iron binding capacity measures the total capacity of transferrin to carry iron. At 64.9, this is within the optimal range. TIBC rises when the body needs more iron and falls when iron stores are sufficient. A normal TIBC alongside normal ferritin and transferrin confirms balanced iron metabolism.","low_causes":"Iron overload, liver disease, chronic inflammation","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"180","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5089","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3933","upper_optimal_position":"0.5267","units":"ng/mL","description":"Ferritin is the body's iron storage protein. At 180, this is within the optimal male range of 50 to 200. Adequate ferritin is essential for energy production, oxygen transport, and immune function. A level below 50 can cause fatigue even when haemoglobin is normal, because the body draws on ferritin stores to maintain haemoglobin production. Chris's level is healthy and he does not need iron supplementation.","low_causes":"Iron deficiency, blood loss, poor dietary iron intake, malabsorption, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation (acute phase reactant), liver disease, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"16.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4713","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, red blood cell production, libido, mood, and energy. At 16.8, Chris is within the laboratory range of 8.4 to 28.7 but below the optimal threshold of 18. However, this result must be interpreted entirely in the context of his reported PED use. His LH is suppressed to below 0.07 and his FSH is 0.9, meaning his own natural testosterone production has been shut down by the exogenous hormones. This measured testosterone of 16.8 is therefore entirely exogenous. The level is not supraphysiological, which may mean he is on a low dose, between cycles, or using a compound that does not cross-react fully with the testosterone immunoassay. His symptoms of fatigue, low mood, and brain fog may be related to the overall hormonal disruption rather than the absolute testosterone number.","low_causes":"Hypogonadism, aging, obesity, PED cessation without recovery protocol, chronic illness, opioids, stress","high_causes":"Exogenous testosterone or PED use, testicular tumour, adrenal disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"33.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4423","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3836","upper_optimal_position":"0.5793","units":"nmol/L","description":"SHBG, sex hormone binding globulin, is a protein that binds to testosterone and oestradiol, controlling how much is available to tissues. Higher SHBG means less free testosterone. At 33.2, this is within the optimal range of 25 to 55. PED use can suppress SHBG, so this mid-range result is reasonable.","low_causes":"Obesity, insulin resistance, PED use, hypothyroidism, type 2 diabetes","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen use, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index","group":"HORMONES","result":"50.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The free androgen index is calculated as (testosterone / SHBG) x 100 and provides an estimate of biologically active testosterone. At 50.6, this is within the optimal range. It reflects the relationship between Chris's measured testosterone and his SHBG level.","low_causes":"Low testosterone, high SHBG, aging, obesity","high_causes":"PED use, low SHBG, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0.2","upper_normal":"0.5","lower_optimal":"0.35","upper_optimal":"0.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, and therefore available to act on tissues. At 0.35, this is within the laboratory range but sitting at the lower edge of the optimal band. Given that all of Chris's circulating testosterone is exogenous, this level reflects the dose and timing of his PED protocol rather than natural production.","low_causes":"Low total testosterone, high SHBG, aging, obesity","high_causes":"PED use, low SHBG, adrenal disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1883","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen, produced in men by conversion of testosterone via the enzyme aromatase. At 55, this is within range and at a reasonable level. In men on exogenous testosterone, oestradiol can rise significantly if aromatisation is high. Chris's level suggests aromatisation is not excessive, which is positive.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"PED use with high aromatisation, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.92","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3444","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.2","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3770","upper_optimal_position":"0.5719","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the testes and adrenal glands. It plays a role in mood regulation, sleep quality, neurological calm, and is a precursor to other hormones. At 0.92, Chris is sitting right at the floor of the reference range of 0.89 to 3.88 and below the optimal threshold. In men using exogenous testosterone, natural testicular function is suppressed, which reduces progesterone production alongside LH and FSH. His near-floor progesterone may be contributing to his low mood and anxiety symptoms.","low_causes":"Suppressed testicular function from PED use, adrenal insufficiency","high_causes":"Adrenal overproduction, certain medications, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1503","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6026","units":"mIU/mL","description":"LH, luteinising hormone, is produced by the pituitary gland and signals the testes to produce testosterone. At below 0.07, Chris's LH is effectively undetectable, far below the lower limit of 1.5. This is the expected and inevitable consequence of exogenous testosterone or PED use. When the body detects sufficient testosterone from an outside source, the pituitary shuts down its own LH production through a feedback loop. The result is that the testes receive no stimulation, natural testosterone production ceases, and testicular size typically reduces. If PED use were stopped, LH would need to recover for natural testosterone production to restart, and this recovery can take months or may require medical support.","low_causes":"Exogenous testosterone or PED use (primary cause here), pituitary disorders, Kallmann syndrome, severe illness","high_causes":"Primary hypogonadism, Klinefelter syndrome, menopause (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2841","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3694","upper_optimal_position":"0.5165","units":"mIU/mL","description":"FSH, follicle stimulating hormone, is produced by the pituitary gland and drives sperm production in the testes. At 0.9, this is below the lower limit of 1.4 and is suppressed for the same reason as LH: exogenous testosterone or PED use shuts down the pituitary signals. Suppressed FSH means sperm production will be significantly impaired or absent. For any man considering future fertility, this is an important finding to discuss with a doctor, as recovery of spermatogenesis can take six to twelve months or longer after PED cessation.","low_causes":"Exogenous testosterone or PED use (primary cause here), pituitary disorders, Kallmann syndrome","high_causes":"Primary testicular failure, Klinefelter syndrome, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3687","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6106","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone production, reduce libido, and cause mood disturbance. At 80, Chris's prolactin is within the optimal range. Some PEDs, particularly certain progestins, can raise prolactin significantly, so this normal level is reassuring.","low_causes":"Dopamine excess, certain medications","high_causes":"Pituitary adenoma, certain medications (antipsychotics, some PEDs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"363","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4594","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3819","upper_optimal_position":"0.5818","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and declining through the day. At 363, measured within the morning window, this is within the optimal range and indicates a normally functioning adrenal stress response. Very high cortisol can drive fatigue, anxiety, and weight gain, while very low cortisol suggests adrenal insufficiency. Chris's level is balanced.","low_causes":"Adrenal insufficiency, pituitary disease, chronic fatigue, prolonged stress exhaustion","high_causes":"Acute or chronic stress, Cushing's syndrome, corticosteroid use, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4190","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4609","upper_optimal_position":"0.5893","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to testosterone and oestrogen. At 3.7 umol/L (approximately 1,363 ug/dL), this is within the laboratory range but marginally below the optimal threshold of 4.0. DHEA-S naturally declines with age, but at 35 a slightly below-optimal level may reflect the overall hormonal disruption from PED use or adrenal adaptation to chronic training stress. This is a minor finding.","low_causes":"Aging, adrenal insufficiency, chronic stress, corticosteroid use","high_causes":"Adrenal tumour, PCOS (women), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5506","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the inactive form of thyroid hormone that circulates in the blood and is converted to active T3 in tissues. At 18.8, this is within the optimal range of 14 to 20. This confirms that the thyroid gland is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, thyroiditis","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, thyroiditis (early phase)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3668","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4163","upper_optimal_position":"0.5688","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland and controls how hard the thyroid works. At 1.41, this is within the optimal range of 1.0 to 2.5. A normal TSH means the pituitary is satisfied with the amount of thyroid hormone being produced, neither asking for more nor signalling to slow down.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6296","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5259","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that directly drives metabolism, energy production, and body temperature. At 6.6, this is at the upper end of the laboratory range and marginally above the optimal ceiling of 6.5. This is not a concern; it indicates excellent conversion from T4 to the active T3 form. A high-normal T3 supports energy and metabolism, though if it were above 7.1 it would warrant investigation for hyperthyroidism, which is not the case here.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are autoantibodies that attack thyroid peroxidase, an enzyme essential for thyroid hormone production. Elevated levels indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At below 6.6, Chris is well within range, ruling out autoimmune thyroid disease.","low_causes":"Not applicable, low is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a precursor protein used to make thyroid hormones. At below 1.3, this is well within range. Combined with negative TPO antibodies, autoimmune thyroid disease is effectively ruled out.","low_causes":"Not applicable, low is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"104","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1.0","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone-like vitamin essential for bone health, immune function, mood regulation, and muscle function. At 104, Chris is within the optimal range of 75 to 120. Levels below 50 are considered insufficient and below 30 deficient. This strong result suggests he is either supplementing effectively or getting significant sun exposure. Vitamin D plays a role in mood regulation, and maintaining this level year-round may support his goal of improving mood.","low_causes":"Insufficient sun exposure, lack of supplementation, darker skin, obesity (fat sequesters vitamin D), malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"739","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5548","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5225","upper_optimal_position":"0.6162","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 739, Chris is within the optimal range of 500 to 900. Levels below 300 are associated with fatigue, brain fog, and nerve damage. His strong level means B12 deficiency is not contributing to his reported fatigue or brain fog.","low_causes":"Vegetarian or vegan diet, malabsorption, pernicious anaemia, metformin use, age-related decline","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6190","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5714","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, vitamin B9, works alongside B12 for red blood cell production, DNA synthesis, and homocysteine metabolism. At 16, this is within the optimal range and near the top of the reference band. Strong folate alongside strong B12 ensures healthy red cell production and homocysteine clearance.","low_causes":"Poor dietary intake of leafy greens, alcohol, malabsorption, pregnancy, certain medications","high_causes":"Supplementation, high dietary intake of leafy greens and fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3426","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"0.98","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6139","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium and phosphate levels by controlling calcium release from bones, calcium absorption from the gut, and calcium excretion by the kidneys. At 1.14, this is at the lower end of the range, which alongside his healthy vitamin D of 104 and normal calcium makes physiological sense. When vitamin D is adequate, the body needs less PTH to maintain calcium. This is a reassuring and coherent result.","low_causes":"Adequate vitamin D and calcium (as here), hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, hyperparathyroidism, chronic kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"166","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found in muscle tissue that leaks into the blood when muscles are damaged or working hard. At 166, this is within the optimal range and suggests Chris's muscles are recovering adequately from his training. Very high CK (above 1,000) can indicate rhabdomyolysis or significant muscle injury. His mid-range result is appropriate for someone doing regular resistance training.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise (especially eccentric), rhabdomyolysis, muscle injury, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_antioxidant_activity","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4048","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the reactive molecules that damage cells and contribute to ageing and disease. At 1.61, this is within the optimal range and reflects a diet with adequate antioxidant intake from fruits, vegetables, and other whole foods.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease, smoking","high_causes":"High dietary antioxidant intake, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0780","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"1.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"ng/mL","description":"PSA, prostate-specific antigen, is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, inflammation, or cancer. At 0.39, this is very low and indicates no current prostate concern. This is a useful baseline at 35.","low_causes":"Normal, no prostate concern","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, vigorous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1222","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA measures the proportion of PSA that is not bound to proteins. A higher free-to-total ratio is reassuring. At 0.22 with a total PSA of 0.39, the ratio of 0.564 (56.4%) is very high, which is strongly reassuring a function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}

      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){

  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');

  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);

  requestAnimationFrame(step);

  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
