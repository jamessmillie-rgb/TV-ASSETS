<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Chris Davies","dob":"05/10/1990","report_date":"2026-08-14","summary":"Chris is a 35-year-old male presenting with a BMI of 28.4, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He trains seven or more times per week, with five or more cardio sessions and two resistance sessions, averaging 7,500 to 10,000 daily steps. He reports using anabolic steroids or PEDs such as testosterone or SARMs and consuming more than seven alcoholic drinks per week. He reports low energy and fatigue, low mood and anxiety, and brain fog. His goals are to lose body fat, improve mood, and improve digestion and gut health.\n\nThe most important finding in this report is the hormonal pattern created by his PED use. His LH, which is luteinising hormone, the signal sent from the pituitary gland in the brain to tell the testes to produce testosterone, is suppressed to below 0.07, effectively undetectable against a lower limit of 1.5. His FSH, follicle stimulating hormone, which drives sperm production, is 0.9, also below its lower limit of 1.4. This is the expected and inevitable consequence of exogenous testosterone or similar compounds. When the body detects testosterone arriving from an outside source, it shuts down its own signalling pathway entirely. The pituitary stops sending LH and FSH because it believes enough testosterone is already present. The result is that the testes are receiving no stimulation at all, which means natural testosterone production has ceased and sperm production will be significantly impaired or absent. His measured testosterone of 16.8 is within the laboratory range of 8.4 to 28.7, but this is entirely exogenous, it is not being produced by his own HPG axis. For a 35-year-old on PEDs, the fact that testosterone is only 16.8 rather than supraphysiological suggests he may be between cycles, on a low dose, or using a compound that does not directly measure as testosterone on immunoassay. What matters most here is the complete suppression of LH and FSH. If Chris were to stop PED use abruptly, there is a real risk that his natural production would not restart promptly, potentially leaving him profoundly hypogonadal. We would strongly recommend he discusses this with a GP or an endocrinologist, ideally one experienced in post-cycle recovery, to have a proper plan in place. His symptoms of low energy, low mood, anxiety, and brain fog are all recognised features of hormonal disruption, and while the measured testosterone level looks adequate on paper, the underlying axis is not functioning, and the downstream hormonal environment may not be as balanced as a single testosterone number suggests. His progesterone at 0.92 is sitting right at the floor of the range at 0.89, which is common in men on exogenous testosterone because the natural testicular production of progesterone is also suppressed. Progesterone plays a role in mood regulation, sleep quality, and neurological calm, and its near-absence may be contributing to his low mood and anxiety.\n\nTurning to genuine positives, and there are several. His blood sugar control is excellent. Fasting glucose at 4.7 sits within the optimal window of 4.0 to 5.4, HbA1c at 35 mmol per mol is below the optimal ceiling of 36, and his HOMA-IR, a calculated measure of insulin resistance, is 1.16, comfortably within the healthy range. His fasting insulin at 5.57 is within the optimal band of 2 to 8. His C-Peptide, which the lab has flagged as low at 0.948 against a range of 1.1 to 4.4, is almost certainly a reflection of his good insulin sensitivity and the relatively low insulin demand his body requires, rather than any pancreatic insufficiency. With glucose and HbA1c both excellent, his pancreas is producing exactly as much insulin as it needs to and no more. This is not a concern. His kidney function is strong, with a Cystatin C of 0.94 giving a calculated eGFR of 105, and creatinine-based eGFR above 90, both well within healthy territory at 35. His thyroid is working well. TSH at 1.41 sits within the optimal range of 1.0 to 2.5, free T4 at 18.8 is within the optimal band of 14 to 20, and free T3 at 6.6 is at the upper end of range, suggesting excellent conversion from T4 to the active hormone. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His iron studies are in good shape. Ferritin at 180 is within the optimal male range of 50 to 200, transferrin saturation at 38.2% sits perfectly within the optimal band of 25 to 40%, serum iron and transferrin are both well placed, and iron binding capacity is healthy. His red cell production is solid, with haemoglobin at 161 within the male range, red blood cell count at 5.12, haematocrit at 0.47, and all red cell indices, MCV, MCH, and MCHC, within range. His reticulocyte count at 1.08% with an absolute count of 55 is within range, showing the bone marrow is producing red cells at a normal pace. His calcium, phosphate, magnesium, and electrolytes are all within range, with magnesium at 0.95 sitting within the optimal band of 0.85 to 1.05. Vitamin D at 104 is within the optimal range of 75 to 120, which is an excellent result and suggests he is either supplementing or getting meaningful sun exposure. Vitamin B12 at 739 is well within the optimal range of 500 to 900, and folate at 16 is strong. His CRP, a marker of systemic inflammation, is 0.6, below the optimal ceiling of 1.0, which is a genuinely good result and suggests no significant inflammatory burden despite his alcohol intake and training load. His ESR at 4 is very low. His PSA at 0.39 is negligible, and all tumour markers are well within range. Creatine kinase at 166 is within range, suggesting his muscles are recovering adequately from training. His cortisol at 363 sits within the morning reference range. His DHEA-S at 3.7 umol per litre, equivalent to approximately 1,363 ug per dL, is within range. His total antioxidant activity at 1.61 is healthy.\n\nThe second area of concern is his lipid profile, and specifically the combination of elevated LDL cholesterol and a raised Lp(a). His total cholesterol is 5.6, above the desirable threshold of 5.18. His LDL, which is low-density lipoprotein, the particle that deposits cholesterol into artery walls, is 3.69, above the upper limit of 3.0 and well above the optimal target of below 2.6. His ApoB, apolipoprotein B, which is the best single measure of atherogenic particle number because every LDL particle carries exactly one ApoB molecule, is 1.26, classified as high against a target of below 0.9. His ApoB to ApoA1 ratio is 0.84, sitting in the average risk zone between 0.7 and 0.9 but above the lower risk threshold. On the positive side, his HDL at 1.6 is above the desirable threshold of 1.55, his triglycerides at 0.77 are excellent and below the optimal ceiling of 1.0, and his VLDL at 0.35 is low. His calculated TG to HDL ratio comes out at 0.48, which is excellent. His remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.31, well within the optimal range of below 0.5. So the picture is mixed: his triglyceride and HDL profile is genuinely excellent, but the LDL particle count is high. His Lp(a), lipoprotein little a, is 57.46 nmol per litre, above the 32 nmol per litre threshold. Lp(a) is entirely genetically determined. It does not change with diet, exercise, or lifestyle. It is an LDL-like particle that is stickier than regular LDL, promotes clotting, and drives inflammation in artery walls. At 57.46 it sits in the slightly increased risk category of 32 to 90. This is a permanent finding that should be recorded in his medical notes and kept for life. It also means that not all of his elevated LDL and ApoB is modifiable, some of it is being contributed by Lp(a) particles, which carry their own ApoB. However, a meaningful portion of his ApoB is still driven by conventional LDL, and that portion is modifiable through diet, body composition, and potentially PED choices. Anabolic steroids and similar compounds are well known to worsen the lipid profile, typically by raising LDL and suppressing HDL. The fact that his HDL has held up at 1.6 is reassuring, but the elevated ApoB may be partly driven by his PED use. Alcohol above seven drinks per week can also contribute to lipid changes, though it more commonly raises triglycerides, which are excellent here. We would recommend he discusses his Lp(a) result and overall lipid profile with his GP, and considers whether his PED use may be contributing to the elevated ApoB. His first-degree relatives, parents and siblings, should also be offered an Lp(a) test, as approximately 50% of the value is inherited from each parent.\n\nHis liver shows a mixed picture. ALT at 50 is within the laboratory range of below 56 but above the optimal threshold of below 30 for a male, and AST at 34 is within range. The finding that stands out is his GGT, gamma-glutamyl transferase, at 103, well above the upper limit of 73 and significantly above the optimal level of below 25. GGT is an enzyme found in liver cells that is particularly sensitive to alcohol, certain medications, and metabolic stress. At 103, with more than seven drinks per week and concurrent PED use, both alcohol and PEDs are the most likely drivers. Anabolic steroids place direct metabolic load on the liver, and alcohol compounds that effect. His FIB-4 score at 0.85 is reassuringly low, and his alkaline phosphatase, bilirubin, albumin, and total protein are all normal, which means there is no sign of structural liver damage or fibrosis. His amylase and lipase, markers of pancreatic function, are both within range. The liver is coping, but the GGT is a clear signal that it is working harder than it should be. Reducing alcohol to under seven drinks per week, ideally under four, and discussing liver monitoring with his GP in the context of his PED use would be the two most important steps.\n\nHis white blood cell count at 3.58 is below the lower limit of 4.0, driven primarily by neutrophils at 1.62 against a lower limit of 2.0. Lymphocytes, monocytes, eosinophils, and basophils are all within range. Mild neutropenia like this has several possible explanations. Benign ethnic neutropenia is one, though Chris identifies as White European where this is less common. Anabolic steroids can suppress bone marrow function. Heavy training loads, particularly the five or more cardio sessions per week, can redistribute neutrophils out of the circulating pool. Alcohol above seven drinks per week is another recognised contributor. His CRP is low and ESR is low, so there is no active infection or inflammation driving the cells elsewhere. At 35 with no history of recurrent infections, this is unlikely to be clinically dangerous, but it should be noted by his GP, particularly in the context of PED use, and monitored on his next blood test. His MPV, mean platelet volume, at 10.4 is marginally above the upper limit of 10.1. At this margin, this is typically a normal variant and reflects slightly larger, younger platelets. It is not a concern in isolation with a normal platelet count of 199.\n\nHis uric acid at 424 is within the laboratory range of 220 to 547 but above the optimal range of 200 to 380 for a male. Uric acid is a byproduct of purine metabolism and at higher levels is associated with gout risk and cardiovascular inflammation. Alcohol is a significant driver of uric acid because it competes with uric acid for excretion through the kidneys. Reducing alcohol intake would likely bring this into the optimal range. His non-HDL cholesterol at 4.0 sits exactly on the upper limit of 4.0, which is borderline and consistent with the elevated LDL and ApoB picture already discussed.\n\nNo urine sample was received by the laboratory, so the full urinalysis panel could not be completed. This is worth repeating on the next test if Chris is able to provide a sample.","links":"Chris's results point to three main areas of action: his hormonal health in the context of PED use, his cardiovascular lipid profile, and his liver health. Each of these connects directly to his symptoms of fatigue, low mood, and brain fog, and to his goals of losing body fat and improving mood.\n\nThe most important conversation Chris needs to have is with a GP or endocrinologist about his PED use and the complete suppression of his LH and FSH. He should bring the specific numbers: LH below 0.07 against a range of 1.5 to 9.3, FSH 0.9 against a range of 1.4 to 18.1, and testosterone 16.8. The GP needs to understand that these gonadotrophins are suppressed because of exogenous hormone use and that natural production has ceased. If Chris is considering stopping PED use, or cycling off, this needs to be managed rather than done abruptly, as the HPG axis can take months to recover and some men require medical support such as selective oestrogen receptor modulators to restart natural production. The low mood, fatigue, and brain fog he reports may improve significantly if his hormonal environment is optimised, either through a properly managed PED protocol with medical oversight or through a supervised transition off PEDs.\n\nFor his lipid profile, Chris should discuss his Lp(a) of 57.46 with his GP and ensure it is recorded permanently in his medical notes. His first-degree relatives should be offered testing. For the modifiable portion of his elevated ApoB at 1.26, the following dietary changes would help: increasing soluble fibre intake through oats, beans, lentils, and psyllium husk, which bind bile acids and force the liver to pull LDL out of the blood to make more. Eating oily fish such as salmon, mackerel, or sardines three times per week provides EPA and DHA which lower VLDL production and may modestly lower ApoB. Reducing saturated fat from red meat, cheese, butter, and processed foods and replacing it with olive oil, avocado, and nuts shifts the LDL particle profile favourably. He should also consider whether his PED use is contributing to the elevated LDL and ApoB, as this is a well-documented side effect of most anabolic compounds.\n\nFor his liver, reducing alcohol to below seven drinks per week and ideally below four would be the single most effective change. If PED use continues, liver function including GGT should be monitored every three to six months. The GGT at 103 is not dangerous in isolation, but it is a clear signal that the liver is under metabolic strain from the combination of alcohol and PEDs.\n\nFor body fat loss, Chris's estimated maintenance calories at his current weight of 95 kg, height of 183 cm, and very active training schedule sit at approximately 2,850 to 3,040 calories per day. A sustainable deficit for fat loss would be 2,300 to 2,550 calories per day, targeting a loss of 0.5 to 0.75 kg per week. A target weight range of 82 to 87 kg would bring his BMI into the 24 to 26 range. His protein intake should be at least 150 to 170 grams per day, which at 1.6 to 1.8 grams per kilogram supports muscle retention during a deficit, particularly important given his resistance training. His diet quality and volume are both rated 7 out of 10, which is a solid foundation. The main adjustments are calorie control, increasing soluble fibre, and reducing saturated fat and alcohol.\n\nFor his digestion and gut health goal, reducing alcohol is likely to be the single most impactful change, as alcohol disrupts the gut lining, alters the microbiome, and increases intestinal permeability. Increasing fibre from vegetables, legumes, and whole grains supports a healthier microbiome. A daily probiotic or fermented foods such as kefir, sauerkraut, or kimchi may help, though the evidence is modest.\n\nFor sleep and mood, which connect to his brain fog and low mood, maintaining a fixed wake time, getting outside within an hour of waking for natural light exposure, cutting caffeine by early afternoon, and keeping the bedroom cool would all support better sleep architecture. His magnesium at 0.95 is within optimal range, and continuing or starting magnesium glycinate before bed can support sleep quality.\n\nRetest recommendations: a repeat blood test in four to six months focusing on a full blood count to monitor the neutropenia, liver function including GGT, a lipid profile including ApoB, and a hormone panel including LH, FSH, and testosterone. Lp(a) does not need repeating as it is genetically fixed.","flags":"HORMONES (GP discussion recommended): LH below 0.07 mIU/ml (range 1.5 to 9.3) and FSH 0.9 mIU/ml (range 1.4 to 18.1), both suppressed. Consistent with exogenous androgen use suppressing the hypothalamic-pituitary-gonadal axis. Testosterone 16.8 nmol/L is within range but is exogenous. Progesterone 0.92 nmol/L is at the floor of range (0.89). If cessation of PEDs is planned, endocrinology input is recommended for managed recovery of the HPG axis.\n\nLIPIDS (GP discussion recommended): LDL 3.69 mmol/L (limit 3.0), ApoB 1.26 g/L (target below 0.9, classified high), ApoB/A1 ratio 0.84 (target below 0.7). Lp(a) 57.46 nmol/L (threshold 32), genetically determined, slightly increased risk category. Should be recorded permanently. First-degree relatives should be offered Lp(a) testing. Total cholesterol 5.6, non-HDL cholesterol 4.0 (at upper limit). Positive findings: HDL 1.6 (desirable), triglycerides 0.77 (excellent), TG/HDL ratio 0.48, remnant cholesterol 0.31. PED use is a likely contributor to elevated LDL/ApoB.\n\nLIVER: GGT 103 IU/L (limit 73). ALT 50 IU/L (within lab range of below 56 but above optimal of below 30). Most likely driven by combination of alcohol intake above seven drinks per week and PED use. FIB-4 0.85, ALP 51, bilirubin 15, albumin 43 are all normal. No evidence of fibrosis or structural liver disease.\n\nHAEMATOLOGY: WBC 3.58 x10^9/L (range 4.0 to 10.0), neutrophils 1.62 x10^9/L (range 2.0 to 7.0). Mild neutropenia. Possible contributors include PED use, high-volume training, and alcohol. CRP 0.6 and ESR 4 argue against infection or active inflammation. MPV 10.4 fL (limit 10.1), marginal, not clinically significant.\n\nGLUCOSE/INSULIN: C-Peptide 0.948 ug/L (range 1.1 to 4.4), flagged low by lab. In the context of normal fasting glucose (4.7), normal HbA1c (35), and normal insulin (5.57), this reflects low insulin demand rather than pancreatic insufficiency. Not clinically concerning.\n\nKIDNEY: Uric acid 424 umol/L, within lab range but above optimal (200 to 380). Alcohol is a likely contributor.\n\nURINALYSIS: No urine sample received. Recommend providing sample on next test.\n\nReassuring negatives: Kidney function excellent (Cystatin C eGFR 105, creatinine eGFR above 90). Thyroid function normal with negative antibodies. Iron studies balanced with optimal ferritin and transferrin saturation. Blood sugar control excellent with HOMA-IR 1.16. CRP 0.6 (no systemic inflammation). PSA 0.39 (negligible). All tumour markers normal. FIB-4 0.85 (no fibrosis). Vitamin D 104 (optimal). B12 739 (optimal). Folate 16 (strong). Magnesium 0.95 (optimal). Coeliac screen negative. Immunoglobulins within range.","recommendations":"1. Discuss PED use and suppressed LH/FSH with a GP or endocrinologist. Bring the specific results: LH below 0.07, FSH 0.9, testosterone 16.8. If planning to stop PEDs, this should be medically supervised.\n\n2. Record Lp(a) of 57.46 nmol/L permanently in medical notes. Offer Lp(a) testing to parents and siblings.\n\n3. Discuss elevated ApoB (1.26) and LDL (3.69) with GP in the context of Lp(a) and PED use. Cardiovascular risk assessment is appropriate.\n\n4. Reduce alcohol intake to below seven drinks per week, ideally below four. This is the single change most likely to improve GGT, uric acid, gut health, mood, and energy.\n\n5. Increase soluble fibre: daily oats, beans, lentils, or psyllium husk to help lower LDL.\n\n6. Eat oily fish three times per week for EPA and DHA.\n\n7. Reduce saturated fat from red meat, cheese, and butter. Replace with olive oil, avocado, and nuts.\n\n8. Target 2,300 to 2,550 calories per day for fat loss, with at least 150 to 170 grams of protein per day.\n\n9. Target weight range of 82 to 87 kg over the next six to nine months.\n\n10. Monitor liver function including GGT every three to six months while PED use and alcohol intake continue.\n\n11. Retest in four to six months: full blood count, liver function with GGT, lipid profile with ApoB, and hormone panel (LH, FSH, testosterone).\n\n12. Provide a urine sample on the next test.","supplementation":"Given Chris's results, his supplement needs are relatively modest because his vitamin and mineral levels are generally well placed. The focus should be on maintaining what is already good and supporting areas of cardiovascular and liver concern.\n\nVitamin D3 (cholecalciferol): continue current intake at 2,000 IU daily with a fat-containing meal. His level at 104 is within the optimal range of 75 to 120 and maintaining this through the winter months will require continued supplementation. Take with vitamin K2 (MK-7) at 100 to 200 mcg daily, which directs calcium into bones rather than arteries and is particularly important alongside vitamin D supplementation.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, ideally with a meal. This supports a modest reduction in ApoB and VLDL production, provides anti-inflammatory benefit, and may support mood. Look for a product that provides at least 1,000 mg EPA per day, as EPA has the strongest evidence for mood support.\n\nMagnesium glycinate: 300 to 400 mg before bed. His magnesium is within optimal range at 0.95, but glycinate is well absorbed, supports sleep quality, and may help with mood and anxiety. This form is also gentle on the gut, which aligns with his digestion goal.\n\nA daily soluble fibre supplement such as psyllium husk (5 to 10 grams daily, built up gradually) can complement dietary fibre to support LDL reduction and gut health. Take with plenty of water, away from medications.\n\nHe does not need iron supplementation. His ferritin at 180 and transferrin saturation at 38.2% are both within optimal range, and additional iron would risk pushing stores too high.\n\nHe does not need B12 supplementation. His level at 739 is within the optimal range.\n\nHe does not need folate supplementation. His level at 16 is strong.\n\nThe most important changes from this report are not supplements. They are addressing PED use with medical guidance, reducing alcohol intake, and making the dietary shifts toward more soluble fibre, oily fish, and less saturated fat. These will have a far greater impact on his symptoms and long-term health than any supplement.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in Chris's blood after an overnight fast. At 4.7, this sits within the optimal range of 4.0 to 5.4, indicating that his body is managing blood sugar effectively. Glucose is the primary fuel for every cell in the body, and fasting levels reflect how well insulin is keeping it in check overnight. This result, combined with his excellent HbA1c and HOMA-IR, confirms strong metabolic health.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been coated with sugar over the past two to three months, giving a longer-term picture of blood sugar control than a single glucose reading. At 5.3%, Chris is well within the normal range and below the pre-diabetes threshold of 6.0%. This confirms consistently good blood sugar management over recent months.","low_causes":"Conditions that shorten red blood cell lifespan, blood loss, certain haemoglobin variants","high_causes":"Sustained high blood sugar, pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. At 35 mmol/mol, Chris is below the normal ceiling of 42 and within the optimal range of below 36. The pre-diabetes range begins at 42 and diabetes at 48, so he is well clear of both thresholds.","low_causes":"Conditions that shorten red blood cell lifespan, blood loss","high_causes":"Sustained high blood sugar, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"5.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4706","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3107","upper_optimal_position":"0.4187","units":"mIU/L","description":"Fasting insulin measures how much insulin Chris's pancreas needs to produce to keep his blood sugar in check. At 5.57, this is within both the laboratory range and the optimal band of 2 to 8. A low fasting insulin alongside normal glucose is the hallmark of good insulin sensitivity, meaning his cells respond efficiently to insulin and the pancreas does not need to overwork. Higher levels would suggest the body is becoming resistant to insulin's effects.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.948","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2618","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5242","units":"ug/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and provides a reliable measure of how much insulin the body is producing. At 0.948, this is marginally below the laboratory lower limit of 1.1. However, in the context of Chris's excellent fasting glucose of 4.7, HbA1c of 35, and healthy insulin of 5.57, this simply reflects low insulin demand. His pancreas is producing exactly as much insulin as it needs. The lab note mentions that delayed sample separation can reduce C-Peptide levels, which may also be a factor. This is not a concern. In pmol/L this converts to approximately 314, consistent with adequate pancreatic function.","low_causes":"Low insulin demand from good insulin sensitivity, low carbohydrate diet, delayed sample processing, type 1 diabetes (in the context of high glucose)","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated score that estimates insulin resistance using fasting glucose and fasting insulin. At 1.16, Chris is well within the healthy range and below the 1.9 threshold where early insulin resistance begins. This confirms that his cells are responding well to insulin. A result below 1.0 would indicate optimal insulin sensitivity, and at 1.16 he is very close to that ideal. This is a strong result that supports his metabolic health.","low_causes":"High insulin sensitivity, very low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate diet, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"92.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4402","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B is a calculated estimate of pancreatic beta-cell function, the cells that produce insulin. Calculated as (20 x insulin) / (glucose - 3.5), Chris's result of 92.8 falls within the reference range of 80 to 200, confirming that his pancreas is producing an appropriate amount of insulin for his blood sugar level. This is consistent with healthy pancreatic function.","low_causes":"Beta-cell exhaustion, type 1 diabetes, prolonged uncontrolled type 2 diabetes, very low carbohydrate diet","high_causes":"Insulin resistance with compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4464","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are stressed or damaged, ALT leaks into the bloodstream. At 50, Chris is within the laboratory range of below 56 but above the optimal male threshold of below 30. In the context of his elevated GGT, alcohol intake above seven drinks per week, and PED use, the ALT is mildly elevated and consistent with metabolic strain on the liver. Resistance training can also raise ALT slightly through normal muscle turnover.","low_causes":"Generally not clinically significant when low","high_causes":"Alcohol, medications, fatty liver disease, PED use, intense exercise, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5156","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/L","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. At 34, this is within both the laboratory range and a reasonable optimal band. Unlike ALT, which is more liver-specific, AST can be elevated by muscle damage from training. Chris's result is unremarkable and does not add to the liver concern independently.","low_causes":"Vitamin B6 deficiency, generally not clinically significant","high_causes":"Liver disease, alcohol, PED use, muscle damage, intense exercise, heart disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"103","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7055","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4014","units":"IU/L","description":"GGT, gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol, certain medications, and metabolic stress. At 103, this is significantly above the upper limit of 73 and well above the optimal level of below 25. GGT is one of the first liver markers to rise with regular alcohol consumption and is also commonly elevated by anabolic steroids and PEDs, which place direct metabolic burden on the liver. The combination of more than seven alcoholic drinks per week and PED use is the most likely explanation for this result. The fact that his FIB-4 score is low and other liver markers are within range is reassuring and suggests no structural liver damage, but GGT at this level is a clear early-warning signal that the liver is under more strain than it should be.","low_causes":"Generally not clinically significant","high_causes":"Alcohol consumption, PED and anabolic steroid use, fatty liver disease, bile duct obstruction, certain medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"ALP, alkaline phosphatase, is an enzyme found in the liver, bones, and bile ducts. At 51, this is within the normal range and sitting at the lower end, which is reassuring. Elevated ALP alongside elevated GGT would suggest bile duct involvement, but with ALP normal, the GGT elevation is more likely driven by direct hepatocellular stress from alcohol and PEDs rather than bile duct pathology.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down, processed by the liver, and excreted in bile. At 15, this is within range and unremarkable. A normal bilirubin with elevated GGT is consistent with metabolic strain on the liver rather than bile flow obstruction.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6533","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 75, this is within range and reflects adequate protein intake and normal liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, infection, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. At 43, this is within the optimal range and confirms that the liver's synthetic function is intact, which is reassuring alongside the elevated GGT.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5926","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/L","description":"Globulins are a group of proteins that include immune antibodies and transport proteins. At 32, this is within range and suggests a normally functioning immune system from a protein perspective.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. At 1.34, this is within the normal range of 1.1 to 2.5 and reflects a healthy balance between these two protein groups. A low ratio can indicate liver disease or chronic inflammation, while a high ratio is generally less concerning.","low_causes":"Liver disease, autoimmune conditions, chronic infection, kidney disease","high_causes":"Generally not clinically significant, can occur with underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2931","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis, or scarring, using age, AST, ALT, and platelet count. At 0.85, Chris is well below the 1.3 threshold that would warrant further investigation such as a FibroScan. This is reassuring and means that despite the elevated GGT, there is no sign of structural liver damage or fibrosis at present.","low_causes":"Not applicable, low is favourable","high_causes":"Liver fibrosis, cirrhosis, age-driven elevation, low platelet count, low ALT in denominator","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4394","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. At 58, this is within range and confirms normal pancreatic function. Elevated amylase would suggest pancreatic inflammation or obstruction.","low_causes":"Pancreatic insufficiency, cystic fibrosis","high_causes":"Pancreatitis, pancreatic obstruction, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. At 46, this is within range and, alongside the normal amylase, confirms healthy pancreatic function. This is relevant to Chris's digestion goal, as normal pancreatic enzyme levels mean fat digestion is not a likely source of digestive discomfort.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5406","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL (protective), LDL (atherogenic), and VLDL. At 5.6, this is above the desirable threshold of 5.18. However, total cholesterol alone is a blunt tool. The more important question is what makes up that total. In Chris's case, his HDL is healthy at 1.6, but his LDL at 3.69 and ApoB at 1.26 are elevated, which is driving the total upward. The ApoB result is the more actionable number.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, PED use, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2265","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, largely influenced by recent carbohydrate and alcohol intake. At 0.77, this is an excellent result, below the optimal threshold of 1.0 and well below the upper limit of 1.7. Low triglycerides alongside good HDL is a strong metabolic signal and suggests that Chris's body is handling dietary fats and carbohydrates efficiently. Interestingly, despite his alcohol intake of more than seven drinks per week, his triglycerides remain very low, which is a genuine positive.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2244","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, very low-density lipoprotein, carries triglycerides from the liver to tissues. At 0.35, this is well within range and consistent with his excellent triglyceride level. Low VLDL means the liver is not overproducing triglyceride-rich particles.","low_causes":"Low triglyceride production, low-fat diet","high_causes":"Insulin resistance, high carbohydrate diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein, is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. At 1.6, Chris is above both the desirable threshold of 1.55 and the optimal male threshold of 1.4. This is a genuinely good result and somewhat surprising alongside PED use, which typically suppresses HDL. His high training volume, particularly the five or more cardio sessions per week, is likely supporting this healthy HDL level.","low_causes":"Physical inactivity, obesity, smoking, anabolic steroid use, very low-fat diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.69","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6147","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, low-density lipoprotein, is the particle that carries cholesterol into artery walls and drives atherosclerosis. At 3.69, this is above the upper limit of 3.0 and well above the optimal target of below 2.6. LDL is one of the most modifiable cardiovascular risk factors, responsive to dietary changes, body composition, and in Chris's case possibly influenced by his PED use. His Lp(a) at 57.46 will also be contributing some of this measured LDL, as Lp(a) particles are counted within the LDL fraction.","low_causes":"Hyperthyroidism, liver disease, malabsorption, very low-fat diet","high_causes":"Diet high in saturated fat, genetic factors, PED use, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk balance. At 3.5, this is within the desirable range of below 4.5 and within the optimal band. The ratio is helped by his healthy HDL of 1.6, which partially offsets the elevated total cholesterol. However, the ApoB and ApoB/A1 ratio are more precise measures of atherogenic risk.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"28.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This represents the proportion of total cholesterol that is carried by protective HDL particles. At 28.57%, this is above the desirable threshold of 20% and indicates that a healthy proportion of Chris's total cholesterol is the protective type. The higher this percentage, the better the balance between protective and atherogenic cholesterol.","low_causes":"Low HDL, metabolic syndrome, physical inactivity, smoking","high_causes":"Regular exercise, healthy body composition, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol in one number, including LDL, VLDL, and Lp(a). At 4.0, Chris is sitting exactly on the upper limit. This is consistent with his elevated LDL and ApoB and is driven by the same factors: diet, PED use, and the genetic contribution from Lp(a).","low_causes":"Low LDL, low triglycerides, low VLDL","high_causes":"Elevated LDL, elevated triglycerides, PED use, genetic factors, diet high in saturated fat","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.625","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Every HDL particle carries at least one ApoA1 molecule, so this is a direct measure of HDL particle number. At 1.5, this is above the desirable threshold of 1.2 and above the optimal level of 1.4, confirming that Chris has a healthy number of protective HDL particles. ApoA1 is part of the ApoB/A1 ratio, which is one of the most powerful single predictors of cardiovascular risk.","low_causes":"Physical inactivity, smoking, obesity, anabolic steroid use, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this is the most accurate single measure of how many artery-damaging particles are circulating. At 1.26, this is classified as high, significantly above the desirable target of below 0.9 and the optimal target of below 0.8. This tells us that Chris has a high number of atherogenic particles in his blood, which increases long-term cardiovascular risk regardless of how much cholesterol each particle carries. Some of this ApoB is contributed by his Lp(a) particles, which is not modifiable, but the majority is from conventional LDL, which responds to diet, body composition, and potentially PED cessation.","low_causes":"Hyperthyroidism, malabsorption, liver disease","high_causes":"Elevated LDL, diet high in saturated fat, genetic factors, PED use, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the most powerful single predictors of cardiovascular risk because it captures the balance between atherogenic particles (ApoB) and protective particles (ApoA1) in one number. At 0.84, Chris is above the lower risk threshold of 0.7 and sits in the average risk category of 0.7 to 0.9. The ratio is being driven up by his elevated ApoB at 1.26, partially offset by his healthy ApoA1 at 1.5. Reducing ApoB through dietary changes and addressing modifiable contributors such as PED use would improve this ratio.","low_causes":"Low LDL particle count, high HDL particle count","high_causes":"High LDL particle count, low HDL, metabolic syndrome, PED use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"57.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8978","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a genetically determined variant of LDL that carries an additional protein called apolipoprotein(a). At 57.46 nmol/L, Chris is above the 32 nmol/L threshold, placing him in the slightly increased risk category of 32 to 90. Lp(a) is entirely inherited and does not change with diet, exercise, or lifestyle. It increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clotting by interfering with the body's clot-dissolving system, and it drives inflammation. This result should be recorded permanently in his medical notes because it never needs retesting and is relevant to every future cardiovascular risk assessment. His first-degree relatives, parents and siblings, should also be offered an Lp(a) test, as approximately half of the level is inherited from each parent. The presence of elevated Lp(a) means that some of his measured LDL and ApoB is coming from Lp(a) particles, which cannot be reduced by lifestyle changes. However, the remainder of his ApoB is from conventional LDL, which is modifiable.","low_causes":"Genetic factors (favourable)","high_causes":"Entirely genetic, inherited from parents, not modifiable by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1600","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin sensitivity and metabolic health. A lower ratio indicates better insulin sensitivity and a more favourable metabolic profile. At 0.48, this is an excellent result, well within the optimal range of below 0.87. This confirms that Chris's metabolic machinery is handling fats efficiently despite the elevated LDL in other measures.","low_causes":"Excellent insulin sensitivity, low triglycerides, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1938","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, and represents the cholesterol carried by triglyceride-rich remnant particles. These remnants are increasingly recognised as independent drivers of cardiovascular disease. At 0.31, this is within the optimal range of below 0.5 and reflects Chris's excellent triglyceride metabolism.","low_causes":"Low triglycerides, efficient lipid metabolism","high_causes":"Elevated triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0600","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures low-grade systemic inflammation, which is a key driver of cardiovascular disease, metabolic dysfunction, and many chronic conditions. At 0.6, thi
