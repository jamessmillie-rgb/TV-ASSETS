1 is well above the 0.9 desirable threshold, classified in the 'high' category (1.2 to 1.39). This is the most actionable lipid marker in the report. Dietary changes to reduce saturated fat and increase soluble fibre are the first-line approach, with lipid-lowering medication considered if these prove insufficient after three to six months.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"Diet high in saturated fat, genetics, familial hypercholesterolaemia, Lp(a), hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6056","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio is the single best summary of the balance between atherogenic (harmful) and anti-atherogenic (protective) particles in the blood. A ratio below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Navir's ratio at 1.09 places him in the higher risk category, driven by his elevated ApoB (1.31) and a borderline ApoA1 (1.2). The target for a man is below 0.7. Bringing ApoB down through dietary changes and raising ApoA1 through exercise and omega-3 intake will both improve this ratio.","low_causes":"","high_causes":"High ApoB, low ApoA1, high LDL, low HDL","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"100.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7831","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a), or lipoprotein(a), is a cholesterol-carrying particle similar to LDL but with an additional protein called apolipoprotein(a) attached. It deposits cholesterol into artery walls, promotes blood clotting and drives local arterial inflammation, making it one of the most potent independent risk factors for cardiovascular disease. Critically, Lp(a) is entirely inherited and determined by genetics. It does not change meaningfully with diet, exercise or lifestyle. Navir's Lp(a) at 100.26 nmol/L is more than three times the 32 nmol/L threshold, placing him in the moderate risk category. This result should be recorded permanently in his medical notes. First-degree relatives should be tested because the trait is inherited. The Lp(a) contribution makes a portion of his measured LDL immutable, but the remaining modifiable LDL (Lp(a)-corrected LDL 3.51) can still be reduced through diet and, if needed, medication.","low_causes":"","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It is one of the primary screens for diabetes and pre-diabetes. Navir's glucose at 4.7 is within the optimal range of 4.0 to 5.4, confirming excellent blood sugar regulation at the time of the test.","low_causes":"Fasting, excessive insulin, medications, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar over the past two to three months. Below 6.0% is normal, 6.0 to 6.4% indicates pre-diabetes, and above 6.5% indicates diabetes. Navir's HbA1c at 5.1% is well within the normal range.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Pre-diabetes, diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. Below 42 is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Navir's HbA1c at 33 mmol/mol is well within the optimal range of under 36, confirming excellent average blood sugar control over the past three months.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Pre-diabetes, diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3094","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5488","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar stable. High levels indicate insulin resistance, where cells have become less responsive and the pancreas must produce more insulin to compensate. Very low levels can indicate either efficient insulin sensitivity (the body needs very little) or, rarely, pancreatic underproduction. Navir's insulin at 2.58 is fractionally below the laboratory range of 2.6 to 24.9. However, in the context of a perfect fasting glucose of 4.7, an HbA1c of 33 and a HOMA-IR of 0.54, this reflects excellent insulin sensitivity: his cells respond so efficiently to insulin that the pancreas does not need to produce much. This is a metabolically favourable pattern.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, fasting","high_causes":"Insulin resistance, metabolic syndrome, pre-diabetes, obesity, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.759","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2103","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5242","units":"ug/l","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It provides a direct and reliable measure of pancreatic insulin production because, unlike insulin, it is not cleared by the liver on first pass. Navir's C-Peptide at 0.759 ug/L (approximately 251 pmol/L) is below the 1.1 to 4.4 reference range. As with the insulin result, this reflects low insulin demand from highly sensitive cells rather than pancreatic failure. The normal glucose, excellent HbA1c and healthy HOMA-IR confirm that the pancreas is producing exactly as much insulin as the body needs.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.3","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2667","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and fasting insulin that estimates how resistant the body's cells are to insulin's effects. A value below 1.0 indicates good insulin sensitivity, above 1.9 suggests early insulin resistance, and above 2.9 indicates significant insulin resistance. Navir's HOMA-IR at 0.54 places him firmly in the insulin-sensitive category, which is an excellent result. For a South Asian man at 40, where the population baseline risk for insulin resistance is elevated, this is particularly reassuring.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate average blood glucose level over the past two to three months. Navir's estimated average glucose at 5.6 mmol/L is within the optimal range, confirming consistently well-controlled blood sugar.","low_causes":"Hypoglycaemia, low carbohydrate intake","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4614","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP, or C-reactive protein, is a marker of systemic inflammation produced by the liver. At low levels (under 1.0 mg/L), it reflects minimal inflammation. Between 1.0 and 3.0, it suggests low-grade inflammation that may contribute to cardiovascular risk over time. Above 3.0, it may indicate a more active inflammatory process. Navir's hs-CRP at 1.4 is within the laboratory range of under 5 but above the optimal threshold of under 1.0. This low-grade inflammation could be contributed to by diet quality (rated 5 out of 10), nicotine vaping, or subclinical processes. It is worth tracking on retest to see whether dietary improvements and any reduction in vaping bring it down.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, smoking/vaping, poor diet, cardiovascular risk","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. It is a broad, non-specific marker of inflammation. Faster settling (higher ESR) suggests proteins related to inflammation are coating the red cells. Navir's ESR at 1 is about as low as this marker gets, which is an excellent result and confirms no significant systemic inflammation.","low_causes":"","high_causes":"Infection, autoimmune disease, cancer, anaemia, chronic inflammation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6410","units":"mmol/l","description":"Sodium is the primary electrolyte in blood plasma and plays a central role in fluid balance, nerve function and muscle contraction. Navir's sodium at 143 is within the optimal range, confirming normal hydration and electrolyte regulation.","low_causes":"Excess fluid intake, SIADH, diuretics, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. It is also a component of stomach acid. Navir's chloride at 99 is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3939","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a key buffer in the blood that helps maintain the body's acid-base balance. Navir's bicarbonate at 23 is within the optimal range, confirming normal acid-base regulation.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5310","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6091","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling and blood clotting. Navir's calcium at 2.42 is within the optimal range, confirming healthy calcium levels and appropriate regulation by PTH and vitamin D.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate reading of the physiologically active calcium in the blood. Navir's corrected calcium at 2.32 is within the optimal range, confirming normal calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6898","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar regulation and blood pressure. Navir's magnesium at 1.14 is marginally above the upper limit of 1.11. At this level, this is almost certainly due to supplementation or a magnesium-rich diet and carries no clinical significance. There is no risk of toxicity at this level.","low_causes":"Poor dietary intake, alcohol, diarrhoea, medications, diabetes","high_causes":"Supplementation, kidney impairment, excessive intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ua","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"207","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2938","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2724","upper_optimal_position":"0.5558","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced naturally by the body. It also acts as an antioxidant in the blood. Very high levels can cause gout and kidney stones, while very low levels are occasionally seen with high fluid intake, low purine diets, or certain genetic variations. Navir's uric acid at 207 is marginally below the 220 lower limit. From a health perspective, this is actually favourable: it means he is at very low risk of gout and uric-acid-related cardiovascular strain.","low_causes":"High fluid intake, low purine diet, genetics, liver disease, Fanconi syndrome","high_causes":"Gout, high purine diet, kidney disease, obesity, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-Corrected Sodium is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"298.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7267","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Calculated Serum Osmolality is calculated from your measured results. It sits outside the ideal range. It is being driven by Urea, which sits outside the ideal range.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product produced when the liver breaks down protein. The kidneys filter it from the blood. Elevated levels can indicate reduced kidney function or dehydration, while low levels may suggest low protein intake or liver disease. Navir's urea at 7.9 is within the laboratory range of 3.2 to 8.2 but above the optimal ceiling of 7.0. In the context of excellent kidney function (eGFR 98), this most likely reflects mild dehydration at the time of the draw or higher protein intake the day before.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism that is filtered by the kidneys at a steady rate. It is used to estimate kidney filtration rate. Navir's creatinine at 77 is within the optimal range, confirming healthy kidney function.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR, or estimated glomerular filtration rate, is a calculation that estimates how well the kidneys filter waste from the blood. An eGFR above 90 indicates normal kidney function. Navir's eGFR is reported as above 90, confirming healthy kidney filtration.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"This eGFR is calculated from Cystatin C, a small protein produced at a constant rate by all cells, rather than from creatinine. It is not affected by muscle mass, diet or exercise, making it a more accurate measure of kidney function in some situations. Navir's Cystatin C eGFR at 98 confirms excellent kidney filtration, consistent with the creatinine-based eGFR.","low_causes":"Kidney disease, ageing","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and filtered by the kidneys. Unlike creatinine, its level is not influenced by muscle mass, making it a more reliable marker of kidney function. Navir's Cystatin C at 0.99 is within the optimal range and below the 1.1 threshold, confirming excellent kidney function.","low_causes":"","high_causes":"Kidney disease, inflammation, thyroid dysfunction","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and Cystatin C to provide the most accurate estimate of kidney filtration. At 98, Navir's combined eGFR is well within the optimal range, confirming excellent kidney function.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"102.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6811","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal causes of elevated urea (dehydration, high protein intake) and intrinsic kidney disease. Navir's ratio at 102.6 is marginally above the 40 to 100 range. In the context of excellent kidney function (eGFR 98), normal creatinine (77), and clean urinalysis, this most likely reflects mild dehydration at the time of the blood draw or a higher protein meal the evening before. It does not suggest kidney disease.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"153","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Navir's haemoglobin at 153 is within the optimal range for a man (140 to 165), confirming adequate oxygen-carrying capacity and no anaemia."," ts":"ng/ml","description":"Ferritin is the body's main iron storage protein. Low levels indicate depleted iron stores, while very high levels can indicate iron overload, inflammation, or liver disease. Navir's ferritin at 313 is within the laboratory range of 22 to 322 but above the optimal ceiling of 200 for a man. His transferrin saturation at 28.27% is within the normal and optimal band, and his transferrin at 2.69 is mid-range, which together make haemochromatosis unlikely. The ferritin may reflect his natural baseline or be mildly influenced by the low-grade inflammation shown in the CRP of 1.4. No iron supplementation should be taken. Monitor on retest to check the trend.","low_causes":"Iron deficiency, blood loss, malabsorption, heavy exercise, vegetarian diet","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"33.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7257","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4911","upper_optimal_position":"0.6898","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, libido, energy, mood and red blood cell production. Navir's total testosterone at 33.9 nmol/L is above the 8.4 to 28.7 laboratory range. While this is an unusual finding, it is not a clinical concern in the absence of symptoms of testosterone excess. His SHBG at 79.3 is also elevated, meaning a larger proportion of this testosterone is bound and unavailable to tissues. His free testosterone at 0.419 is within the normal range, and bioavailable testosterone at 10.48 is slightly above the upper reference, suggesting that the effective hormone reaching tissues is adequate.","low_causes":"Ageing, obesity, stress, medications, hypogonadism, sleep deprivation","high_causes":"Exogenous testosterone, adrenal tumours, genetics, high SHBG with compensatory increase","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"79.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7586","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3849","upper_optimal_position":"0.5811","units":"nmol/l","description":"SHBG, or sex hormone binding globulin, is a protein produced by the liver that binds testosterone and oestradiol, reducing the amount of free hormone available to tissues. High SHBG means less free testosterone despite a high total reading. Navir's SHBG at 79.3 is above the 17.3 to 65.8 range. This is likely constitutional, influenced by his lean body composition (BMI 26.4), thyroid function, and genetics. It explains why his total testosterone is high while his free testosterone is mid-range.","low_causes":"Obesity, insulin resistance, hypothyroidism, metabolic syndrome","high_causes":"Lean body composition, hyperthyroidism, liver disease, ageing, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.419","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4149","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3923","upper_optimal_position":"0.5310","units":"nmol/l","description":"Free testosterone is the unbound fraction of testosterone that is immediately available for cells to use. It is calculated from total testosterone, SHBG and albumin. Navir's free testosterone at 0.419 is within the laboratory range of 0.13 to 1.04 and above the lower optimal boundary of 0.3. Despite his high total testosterone, the elevated SHBG means the free fraction is mid-range rather than elevated, which is the fraction that determines how much testosterone tissues actually receive.","low_causes":"High SHBG, ageing, obesity, hypogonadism","high_causes":"Low SHBG, exogenous testosterone, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"42.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4058","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5694","units":"","description":"The free androgen index is a ratio of total testosterone to SHBG that provides a clinical estimate of androgenic activity. Navir's FAI at 42.75 is within the optimal range, confirming that androgenic function is appropriate despite the individually elevated total testosterone and SHBG.","low_causes":"High SHBG, low testosterone, hypogonadism","high_causes":"Low SHBG, PCOS (in women), exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3322","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the main form of oestrogen. In men, it is produced in small amounts from testosterone by the enzyme aromatase and plays important roles in bone density, brain function, and cardiovascular health. Navir's oestradiol at 97 is within the optimal range for a man, confirming healthy aromatase activity and appropriate oestrogen levels.","low_causes":"Low body fat, aromatase inhibitors, hypogonadism","high_causes":"Obesity, liver disease, aromatase excess, exogenous oestrogen","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2095","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role compared to women. Navir's progesterone at 0.37 is below the 0.89 to 3.88 reference range. In men, below-range progesterone is a common finding and is rarely clinically significant. It does not require investigation or treatment.","low_causes":"Normal variation in men, adrenal suppression","high_causes":"Adrenal hyperplasia, testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4101","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3994","upper_optimal_position":"0.5596","units":"mIU/ml","description":"LH, or luteinising hormone, is produced by the pituitary gland and signals the testes to produce testosterone. Navir's LH at 3.55 is within the optimal range, confirming that the pituitary is regulating testosterone production appropriately.","low_causes":"Pituitary dysfunction, stress, obesity, medications","high_causes":"Primary hypogonadism (testes not responding), menopause (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3576","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"1.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5288","units":"mIU/ml","description":"FSH, or follicle stimulating hormone, is produced by the pituitary gland and in men supports sperm production. Navir's FSH at 2.25 is within the optimal range, confirming normal pituitary signalling and reproductive function.","low_causes":"Pituitary dysfunction, stress, exogenous testosterone","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3373","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5030","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated levels can suppress testosterone and affect libido. Navir's prolactin at 56 is at the lower end of the 45 to 375 range, confirming normal pituitary function and no prolactin-related suppression of testosterone.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"214","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"145.4","upper_normal":"619.4","lowe "description":"FT4, or free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, FT3, in tissues. Navir's FT4 at 18 is within the optimal range of 14 to 20, confirming that the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3641","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3669","upper_optimal_position":"0.4790","units":"mIU/l","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland and tells the thyroid how hard to work. High TSH means the pituitary is shouting at the thyroid to produce more, suggesting underactivity. Low TSH means the pituitary is pulling back, suggesting the thyroid is producing too much. Navir's TSH at 0.94 is within the laboratory range and just fractionally below the lower optimal boundary of 1.0. His FT4 and FT3 are both within range, so this TSH is not concerning and reflects a thyroid that is working efficiently.","low_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3, or free triiodothyronine, is the active thyroid hormone that cells use to regulate metabolism, energy production and body temperature. It is produced mostly by converting FT4 in peripheral tissues. Navir's FT3 at 4.5 sits exactly at the lower boundary of the optimal range of 4.5 to 6.5. While technically within optimal, it is at the floor, and the FT3 to FT4 ratio of 0.25 is just below the optimal band of 0.27 to 0.40. This suggests that conversion from T4 to T3 is adequate but not strong, which could contribute subtly to his reported fatigue. Supporting T4 to T3 conversion through selenium-rich foods (Brazil nuts, fish, eggs) and reducing stress may help.","low_causes":"Non-thyroidal illness, caloric restriction, stress, selenium deficiency","high_causes":"Hyperthyroidism, Graves' disease, T3 thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3261","units":"U/ml","description":"TPO antibodies are markers of autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Navir's TPO antibodies are below 6.6, well within the negative range (below 13.8), ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lowe     names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
