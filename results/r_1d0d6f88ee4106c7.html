<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Navir Rustomfram Shukla","dob":"15/11/1985","report_date":"2026-10-02","summary":"Navir is a 40-year-old male presenting with a BMI of 26.4, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. He trains four times per week (three cardio, one resistance) with 7,500 to 10,000 daily steps. He vapes nicotine and takes no medications. He reports low energy and fatigue, low mood and anxiety, and joint pain and stiffness. His goals are to improve digestion and gut health, improve long-term health and longevity, and boost his immune system. His ethnicity is South Asian, which is clinically relevant because South Asian populations carry a higher baseline cardiovascular risk and are more susceptible to insulin resistance and type 2 diabetes at lower BMI thresholds than European populations.\n\nThe most important finding in this report is a cardiovascular risk profile that needs attention, driven by a combination of elevated ApoB, elevated LDL, and a significantly raised Lp(a). These need to be discussed with his GP. We will come to them in detail, but first there is a great deal of good news in these results.\n\nNavir's blood sugar control is excellent. His fasting glucose is 4.7, comfortably within the ideal range of 4.0 to 5.4, and his HbA1c, which is a measure of average blood sugar over the past three months, is 33 mmol/mol, well within the optimal zone below 36. His HOMA-IR, a calculation that estimates how sensitive the body's cells are to insulin, is 0.54, which places him in the insulin-sensitive category. For a South Asian man at 40, this is a genuinely reassuring finding because it means his metabolism is handling glucose efficiently despite the elevated baseline ethnic risk. His estimated average glucose, derived from HbA1c, is 5.6, confirming the same picture from a different angle.\n\nHis kidney function is strong. Cystatin C is 0.99, giving a Cystatin C eGFR of 98, and the combined creatinine and Cystatin C eGFR is also 98, both comfortably above the 90 threshold that marks ideal filtration at 40. His electrolytes are well balanced, with sodium at 143, chloride at 99 and bicarbonate at 23 all sitting where they should. His urea at 7.9 is at the upper end of the 3.2 to 8.2 range, and the urea to creatinine ratio at 102.6 is marginally above the 40 to 100 reference range. This is a minor finding and most commonly reflects mild dehydration at the time of the blood draw or a higher protein intake the day before. It is not a concern in the context of a normal creatinine of 77, a clean urinalysis, and excellent eGFR.\n\nHis liver is in good health. ALT at 26 and AST at 25 are both within their respective ranges, and the De Ritis ratio, which compares the two, is 0.96, sitting within the optimal band. His FIB-4 score, a calculation that estimates whether there is any scarring in the liver, is 0.76, well below the 1.45 threshold, ruling out any significant fibrosis. The APRI score of 0.241 and the NAFLD Fibrosis Score of negative 3.168 confirm the same conclusion from two further angles. Albumin is 46, a strong marker of both liver synthetic function and overall nutritional status. Bilirubin at 10 is clean. His GGT at 50 is within the male reference range of 4 to 73 but above the optimal threshold of 25. GGT, or gamma-glutamyl transferase, is an enzyme that rises with metabolic strain, alcohol, certain medications, and oxidative stress. In the absence of any other liver enzyme elevation, this is not alarming, but it is worth noting as a metric to bring down through diet quality improvements. Nicotine vaping can contribute to oxidative stress, and this may be one factor.\n\nHis thyroid is working well. TSH, the signal the pituitary gland sends to the thyroid telling it how hard to work, is 0.94, within the ideal range of 1.0 to 2.5 and just fractionally below. Free T4, the main hormone the thyroid produces, is 18, sitting in the ideal zone between 14 and 20. Free T3, the active form that cells actually use, is 4.5, at the lower boundary of the optimal range of 4.5 to 6.5. The FT3 to FT4 ratio of 0.25 is within the laboratory range but just below the optimal band of 0.27 to 0.40, suggesting that conversion from T4 to T3 is adequate but not exceptional. This could be one contributor to his fatigue, because T3 is the hormone that drives cellular energy production. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease.\n\nHis immune system is well balanced. IgG, IgM, IgA and IgE are all within their reference ranges, with IgE at 32.3, well below the 100 threshold, suggesting no significant allergic activation. Rheumatoid factor is below 4, which is reassuring given his joint pain and stiffness, as it makes rheumatoid arthritis much less likely as an explanation. Tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of his digestive symptoms. His white cell count at 4.97, neutrophils at 2.3 and lymphocytes at 2.26 are all within range, and the neutrophil to lymphocyte ratio of 1.02 is within the optimal band of 1.0 to 2.0, suggesting a calm immune baseline with no active inflammation or infection. The platelet to lymphocyte ratio at 114.6 and the systemic immune-inflammation index at 264 both confirm this picture. His ESR, a measure of how quickly red cells settle in a tube and a broad marker of inflammation, is 1, about as low as that number gets. His CRP, a more specific inflammation marker, is 1.4, within the laboratory range of under 5 but above the optimal threshold of under 1.0. CRP at this level is mildly elevated and can reflect low-grade systemic inflammation from several sources: body composition, diet quality, vaping, or simply a minor immune response at the time of the draw. It is worth tracking on retest.\n\nHis prostate markers are excellent. PSA at 0.41 is well below the 2.5 threshold, and the free PSA ratio of 0.512, or 51.2%, is strongly reassuring. The tumour markers CA19-9 and CEA are both within their reference ranges. His total antioxidant activity at 1.61 is within the healthy range of 1.3 to 1.77. Creatine kinase at 102 is comfortably mid-range, showing no muscle damage from his training.\n\nHis PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase, is 32.4 years against a calendar age of 40. That is 7.6 years younger, which is an excellent result and reflects the strong metabolic, kidney, liver and immune markers described above.\n\nNow to the findings that need attention. The cardiovascular profile is the central story of this report, and the key number is Lp(a). Lipoprotein(a) is a particle that carries cholesterol in the blood, similar to LDL, but with an additional protein called apolipoprotein(a) attached to it. It is entirely inherited, determined by genetics, and does not change meaningfully with diet, exercise or lifestyle. Navir's Lp(a) is 100.26 nmol/L, which places him in the moderate risk category, more than three times the 32 nmol/L threshold. This is a permanent finding and should be recorded in his medical notes for life. It means that a portion of his measured LDL cholesterol is actually being carried by Lp(a) particles rather than by standard LDL particles, and Lp(a) particles are particularly harmful because they deposit cholesterol into artery walls, promote blood clotting and drive local inflammation. The Lp(a)-corrected LDL, which subtracts the cholesterol carried by Lp(a) from the total LDL figure, is 3.51, still above the 3.0 upper limit. This tells us that even after removing the genetic contribution, his modifiable LDL is elevated.\n\nHis total cholesterol is 5.4, above the desirable threshold of 5.18. His LDL is 3.83, above the 3.0 upper limit. His ApoB, which counts the actual number of atherogenic particles in the blood and is considered the best single predictor of cardiovascular risk, is 1.31 g/L, well above the 0.9 desirable threshold and classified as high. His HDL, the protective cholesterol that removes lipids from artery walls, is 1.2, which is above the high-risk threshold of 1.04 but below the desirable level of 1.55 and below the optimal target of 1.4 for a man. His ApoA1, the protein on HDL particles, is 1.2, sitting exactly at the lower boundary of the desirable range. The ApoB to ApoA1 ratio, which is the single best summary of the balance between harmful and protective particles, is 1.09, well above the 0.7 threshold for lower risk and above the 0.9 threshold for higher risk. His triglycerides at 0.9 are excellent, below the optimal 1.0 target, which is a genuine positive. The triglyceride to HDL ratio at 0.75 is within the optimal range, and the atherogenic index of plasma at negative 0.125 is also within the ideal band. The Castelli II ratio, which is LDL divided by HDL, is 3.19, within the laboratory range of under 3.5 but above the optimal target of under 2.5. Non-HDL cholesterol at 4.2 is above the 4.0 target. VLDL at 0.41 and remnant cholesterol at 0.37 are both within their ideal ranges.\n\nPutting this together, the cardiovascular risk score, a TrueVitals index from 0 to 100 that measures the risk being built rather than the ten-year chance of an event, is 85 out of 100. This is high. The three inputs driving it are the Lp(a) at 100.26, the ApoB at 1.31 and the LDL at 3.83. At 40, his ten-year absolute risk of a cardiovascular event remains statistically low because he is young, but the gap between a high score and a low ten-year risk is the window for acting. In a South Asian man, where baseline cardiovascular risk is already elevated compared to European populations, this profile needs to be discussed with his GP. The Lp(a) cannot be changed, but the modifiable portion of his LDL and ApoB can be reduced through dietary changes, and if those prove insufficient, his GP may consider lipid-lowering medication. First-degree relatives, particularly siblings and parents, should also be tested for Lp(a) because it is inherited.\n\nHis fasting insulin at 2.58 mIU/L is fractionally below the laboratory range of 2.6 to 24.9, and his C-Peptide at 0.759 ug/L, which converts to approximately 251 pmol/L, is below the 1.1 to 4.4 reference range. C-Peptide is a protein released by the pancreas in equal amounts to insulin, so it serves as a direct measure of how much insulin the pancreas is producing. In the context of a perfect fasting glucose of 4.7, an excellent HbA1c of 33, and a HOMA-IR of 0.54 confirming strong insulin sensitivity, these low values are not a sign of pancreatic failure. They reflect low insulin demand: his cells respond efficiently to small amounts of insulin, so the pancreas does not need to produce much. This is a metabolically favourable pattern, not a pathological one. His HOMA-B, which estimates how hard the beta cells in the pancreas are working, was not computable as the inputs did not meet the calculation threshold, but the clinical picture from glucose, HbA1c and HOMA-IR is unambiguous. No action is needed here.\n\nHis lipase at 77 U/L is above the upper limit of 60. Lipase is an enzyme produced by the pancreas that breaks down fats. A mild elevation like this, without symptoms of acute pancreatitis such as severe abdominal pain radiating to the back, nausea and vomiting, and without a raised amylase (his is 111, within the 30 to 118 range), is usually a benign finding. It can reflect a naturally higher baseline in some individuals, or it can be associated with gut inflammation or a heavier meal the day before the test. Given that Navir's goals include improving digestion and gut health, this is worth mentioning to his GP for awareness, but it does not in itself suggest pancreatic disease.\n\nHis testosterone at 33.9 nmol/L is above the laboratory range of 8.4 to 28.7. This is unusual and worth noting, though it is not a clinical concern in the absence of symptoms of excess such as aggression, acne, or hair loss beyond normal patterns. His SHBG, sex hormone binding globulin, which is a protein that binds testosterone and reduces the amount available for cells to use, is 79.3 nmol/L, above the 17.3 to 65.8 range. High SHBG means that although total testosterone is elevated, a larger proportion is bound and unavailable. His free testosterone, the unbound fraction that cells can actually use, is 0.419 nmol/L, comfortably within the 0.13 to 1.04 range but not exceptional. His bioavailable testosterone, which includes both free testosterone and the loosely bound fraction, is 10.48 nmol/L, above the upper limit of the 2 to 9 range, suggesting that despite the high SHBG, the active testosterone available to tissues is adequate to slightly above average. The free androgen index at 42.75 is within range. LH at 3.55 and FSH at 2.25 are both within their respective ranges, confirming that the pituitary gland is regulating the system normally. DHEA-S at 1.6 umol/L, which converts to approximately 590 ug/dL, is within the reference range. The high SHBG could be driven by thyroid status, genetics, or body composition. At a BMI of 26.4 with a lean build, SHBG tends to be higher than in heavier individuals. Oestradiol at 97 pmol/L is within the male range of under 146.1. Cortisol at 214 nmol/L is within the morning reference range and not suggestive of adrenal dysfunction.\n\nHis progesterone at 0.37 nmol/L is below the 0.89 to 3.88 reference range. In men, progesterone plays a minor role compared to women, and levels below range are common and rarely clinically significant. It does not require investigation.\n\nHis ferritin at 313 ng/ml is within the laboratory range of 22 to 322 but above the optimal ceiling of 200 for a man. Ferritin is the body's iron storage protein, and at this level it is not in the danger zone for iron overload, but it is worth monitoring. His serum iron at 19.1, transferrin at 2.69, iron binding capacity at 61.6 and transferrin saturation at 28.27% are all within their respective ranges, and the saturation sits within the optimal band of 25 to 40%. This pattern does not suggest haemochromatosis, which would typically show a much higher saturation and lower transferrin. The ferritin may simply reflect his natural baseline, or it could be mildly elevated by the low-grade inflammation reflected in the CRP of 1.4. No supplementation with iron is needed, and he should avoid iron-containing multivitamins.\n\nHis vitamin D at 99 nmol/L is excellent, sitting within the optimal range of 75 to 120. For a South Asian man, who typically has lower vitamin D synthesis from sunlight due to higher melanin levels, this is a strong result and suggests either good sun exposure, supplementation, or both. His B12 at 537 pg/ml is within the optimal range of 500 to 900. His folate is above 24 ng/ml, above the upper limit of 17, which is common with supplementation or a diet rich in fortified foods and leafy greens, and is not harmful. His magnesium at 1.14 is above the upper limit of 1.11, which is a marginal elevation. At this level, it is most likely due to supplementation or a magnesium-rich diet and carries no clinical significance. PTH at 2.4 is within range, and corrected calcium at 2.32 is within range, so the calcium-PTH axis is functioning normally.\n\nHis uric acid at 207 umol/L is below the lower limit of 220. Uric acid acts as an antioxidant in the blood, and very low levels are occasionally seen in people with high fluid intake, low purine diets, or certain genetic patterns. At 207, this is only marginally below range and is not a concern. It is actually a positive from a cardiovascular and gout-prevention perspective, as elevated uric acid is the pattern that causes problems, not low.\n\nHis full blood count is largely healthy. Haemoglobin at 153, red blood count at 5.17, haematocrit at 0.442, MCV at 85.6, MCH at 29.6 and RDW at 13.8 are all within their respective ranges. Platelets at 259 and MPV at 9.6 are both mid-range. His reticulocyte percentage at 0.82 is within range, but the absolute reticulocyte count at 42.394 is below the 50 to 100 reference range. Reticulocytes are young red blood cells freshly released from the bone marrow, and a count below 50 suggests the marrow is producing red cells at a slightly reduced rate. In the context of a normal haemoglobin, normal MCV and no signs of anaemia, this is a mild finding and most likely reflects the body simply not needing to produce red cells at a high rate because there is no demand signal. The Mentzer index at 16.6 is consistent with iron-replete red cell production. This is worth tracking on retest but does not need investigation now.\n\nHis MCHC at 346 is marginally above the 315 to 345 range. MCHC measures the average concentration of haemoglobin within each red cell, and at one point above the upper limit, this is almost certainly laboratory variation related to temperature and sample storage, as the lab itself notes. It is not clinically significant.\n\nHis urinalysis is entirely clean. No protein, no glucose, no ketones, no blood, no white cells, no nitrites, no bacterial growth, and a clean culture. This is an excellent result.\n\nReturning to Navir's symptoms of low energy, low mood and anxiety, and joint pain and stiffness. The bloods have ruled out the most common metabolic causes of fatigue: his thyroid is working, he is not anaemic, his iron stores are full, his B12 and folate are strong, his blood sugar is well controlled, and there is no significant inflammation. The mildly low FT3 to FT4 conversion ratio and the FT3 sitting at the lower edge of optimal could be contributing a small amount to his fatigue, but this is subtle rather than explanatory. The most likely drivers of his fatigue and low mood are factors that blood tests cannot fully measure: sleep quality and quantity, stress, the nicotine vaping which disrupts sleep architecture and stimulates the sympathetic nervous system, and diet quality which at 5 out of 10 has clear room for improvement. Nicotine is a vasoconstrictor and could also contribute to joint stiffness. His negative rheumatoid factor and low inflammatory markers make an autoimmune joint condition unlikely, and the joint symptoms may relate to training pattern (three cardio to one resistance is an imbalance that can load joints without strengthening the supporting musculature), body mechanics, or simply the early stages of wear at 40. A targeted approach to sleep hygiene, stress management, dietary improvement, and a review of the resistance to cardio ratio would be the most productive next steps for these symptoms.","links":"The central thread in this report is the cardiovascular risk profile, and it has two distinct components that must be understood separately. The first is the inherited Lp(a) at 100.26 nmol/L, which Navir cannot change through any lifestyle intervention. This is a genetic trait, likely present since birth, and it contributes a fixed amount of atherogenic risk by depositing cholesterol into artery walls, promoting clot formation and driving local inflammation. The second component is the modifiable lipid pattern: an LDL of 3.83, an ApoB of 1.31 and an HDL of 1.2. Even after subtracting the cholesterol carried by Lp(a), the corrected LDL remains at 3.51, above the 3.0 target, confirming that there is a meaningful diet-driven component on top of the genetic risk. The triglycerides at 0.9 and VLDL at 0.41 are both excellent, which tells us that the liver's fat processing is efficient and that the lipid problem is specifically in the LDL and ApoB pathway rather than a broad metabolic lipid disorder.\n\nThe second thread is the relationship between his metabolic health and his ethnic background. South Asian men carry a higher genetic susceptibility to insulin resistance and cardiovascular disease at lower BMI thresholds than European men, which makes his excellent insulin sensitivity, with a HOMA-IR of 0.54, glucose of 4.7 and HbA1c of 33, particularly noteworthy. His body is currently handling carbohydrate metabolism extremely well, and this is a foundation to protect. However, the combination of strong metabolic health with a high cardiovascular risk score of 85 underscores that cardiovascular risk is not always driven by metabolic syndrome. In Navir's case, genetics (Lp(a)) and the modifiable LDL and ApoB are the drivers, not insulin resistance.\n\nThe third thread connects his symptoms to what the bloods can and cannot explain. His fatigue, low mood and joint stiffness are real, but the blood results have excluded the major metabolic explanations: thyroid disease, anaemia, iron deficiency, B12 and folate deficiency, significant inflammation, coeliac disease, and blood sugar dysregulation. The FT3 at the lower edge of optimal and the FT3 to FT4 ratio just below the optimal band suggest that thyroid conversion is adequate but not firing on all cylinders, and this could contribute a fraction of his fatigue. The CRP at 1.4, while within the laboratory range, is above the optimal threshold and points to low-grade inflammation that may reflect diet quality, vaping, or subtle gut-related processes. These are contributing factors rather than standalone explanations.\n\nWhat was excluded is as valuable as what was found. The negative rheumatoid factor, low ESR and low CRP together make inflammatory arthritis very unlikely as a cause of his joint symptoms. The negative coeliac screen rules out gluten-mediated gut damage. The clean urinalysis, strong eGFR and normal electrolytes exclude kidney involvement. The liver, despite a GGT of 50 that sits above the optimal threshold, shows no evidence of fatty change, fibrosis or functional impairment across five separate scoring systems. The immune panel is balanced, with no immunoglobulin excess or deficiency and no allergic activation. The prostate and tumour markers are clean.\n\nThe loose end is the mildly elevated lipase at 77, which sits in isolation without a raised amylase, without symptoms of pancreatitis, and without any imaging to contextualise it. It may reflect a naturally higher baseline, or it may relate to the gut and digestive symptoms that brought Navir to testing. If digestive symptoms persist, this marker and the broader gut picture would benefit from further investigation, potentially including a hydrogen breath test for small intestinal bacterial overgrowth or food intolerances, which blood tests cannot detect.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, fish, lentils or paneer. Anchor: protein goes on the plate first before anything else. Why: protein supports satiety, muscle maintenance with his training, and does not spike insulin, protecting the excellent HOMA-IR of 0.54 he currently has.\nIncrease soluble fibre by adding oats at breakfast, a portion of beans or lentils at lunch, and a second portion of vegetables at dinner. Anchor: one new fibre source per meal, building up over two weeks to avoid bloating. Why: soluble fibre binds cholesterol in the gut before it is absorbed, directly lowering the modifiable portion of his LDL of 3.83 and ApoB of 1.31. Oats, barley, lentils, chickpeas, aubergine and okra are the strongest sources.\nEat oily fish (salmon, mackerel, sardines) at least three times per week, replacing a portion of red or processed meat each time. Anchor: plan the three fish meals on Sunday for the week ahead. Why: omega-3 fatty acids lower triglycerides (already good at 0.9), raise HDL (currently 1.2, below the 1.4 optimal target), reduce inflammation (CRP 1.4), and provide direct cardiovascular protection that is especially important alongside his Lp(a) of 100.26.\nReduce saturated fat by swapping butter for olive oil, full-fat cheese for smaller portions, and fatty cuts of meat for leaner options. Anchor: one swap per week until it becomes default. Why: saturated fat is the primary dietary driver of LDL particle production, and reducing it is the single most effective dietary lever for bringing his ApoB down.\nAdd a second resistance training session per week, aiming for two sessions of 30 to 45 minutes focusing on compound movements (squats, deadlifts, rows, presses). Anchor: attach it to an existing cardio day by swapping one cardio session for resistance. Why: resistance training supports joint stability (relevant to his joint pain), raises HDL, improves insulin sensitivity, and maintains the lean mass that keeps his metabolism efficient. Three cardio and one resistance is an imbalance that loads joints without strengthening the structures around them.\nWalk for fifteen minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and lipid response to that meal, supporting both blood sugar control and lipid clearance.\nSet a fixed wake time seven days a week and get outside within the first hour for natural light. Anchor: alarm at the same time every day including weekends. Why: a consistent circadian rhythm improves sleep quality, morning energy, and mood, all three of which Navir reports struggling with. The light exposure resets the cortisol rhythm and supports the fatigue and low mood he describes.\nConsider a plan to reduce and eventually stop nicotine vaping. Anchor: use the GP appointment recommended in this report to discuss nicotine replacement options. Why: nicotine is a vasoconstrictor that can contribute to joint stiffness, it disrupts sleep architecture even when it does not feel like it is affecting sleep, it raises baseline sympathetic nervous system activity which contributes to anxiety, and it drives oxidative stress that may be behind the GGT of 50.","flags":"Lp(a) 100.26 nmol/L, more than three times the 32 nmol/L threshold (moderate risk category). This is entirely inherited, permanent, and cannot be changed by diet or lifestyle. It should be recorded in his medical notes permanently. First-degree relatives (parents, siblings, children) should be tested. It independently raises cardiovascular risk through cholesterol deposition, clot promotion and arterial inflammation.\nApoB 1.31 g/L (desirable below 0.9, classified as high), LDL 3.83 mmol/L (above the 3.0 upper limit), Lp(a)-corrected LDL 3.51 mmol/L (still above 3.0), non-HDL cholesterol 4.2 (above 4.0 target), ApoB/A1 ratio 1.09 (higher risk, above 0.9), HDL 1.2 (above high-risk threshold but below the 1.55 desirable level). Total cholesterol 5.4 (above 5.18 desirable). Cardiovascular risk score 85/100, driven by Lp(a), ApoB and LDL. Triglycerides are excellent at 0.9 and VLDL at 0.41 is ideal, confirming the risk is in the LDL/ApoB pathway specifically. In a South Asian man at 40 with an inherited Lp(a) this profile warrants GP discussion regarding lipid-lowering therapy if dietary changes prove insufficient.\nLipase 77 U/L, above the upper limit of 60. Amylase 111, within range. No symptoms of acute pancreatitis. Likely a benign baseline elevation but relevant given his goal of improving gut health. Worth monitoring and mentioning to his GP.\nInsulin 2.58 mIU/L (fractionally below the 2.6 lower limit) and C-Peptide 0.759 ug/L (approximately 251 pmol/L, below the 1.1 to 4.4 range). In the context of fasting glucose 4.7, HbA1c 33 and HOMA-IR 0.54, this reflects efficient insulin sensitivity with low insulin demand rather than pancreatic insufficiency. No action required.\nSHBG 79.3 nmol/L, above the 17.3 to 65.8 range. Total testosterone 33.9 nmol/L, above the 8.4 to 28.7 range. Bioavailable testosterone 10.48 nmol/L, above the 2 to 9 range. Free testosterone 0.419, within range. The high SHBG is binding a larger proportion of total testosterone but free and bioavailable fractions remain adequate. This pattern may be constitutional. LH and FSH are normal, confirming appropriate pituitary regulation.\nFerritin 313 ng/ml, within the laboratory range of 22 to 322 but above the optimal ceiling of 200. Transferrin saturation 28.27%, within the optimal band of 25 to 40%. Does not suggest iron overload. Monitor on retest. Do not supplement with iron.\nhs-CRP 1.4 mg/L, within the laboratory range of under 5 but above the optimal threshold of 1.0. Suggests low-grade systemic inflammation. May reflect diet quality, vaping, or other subclinical processes. Monitor on retest.\nGGT 50 IU/L, within the male laboratory range of 4 to 73 but above the optimal threshold of 25. All other liver markers and fibrosis scores are clean. May reflect oxidative stress, vaping, or diet quality. Not a concern in isolation but worth tracking.\nProgesterone 0.37 nmol/L, below the 0.89 to 3.88 range. In men, low progesterone is a common finding and rarely clinically significant. No action required.\nReticulocytes absolute 42.394 x10^9/L, below the 50 to 100 range. In the context of normal haemoglobin, normal MCV and no anaemia, this reflects low demand for new red cell production rather than marrow pathology. Monitor on retest.\nMCHC 346 g/L, one point above the 315 to 345 range. Almost certainly laboratory variation related to sample temperature and storage. Not clinically significant.\nUric acid 207 umol/L, marginally below the 220 lower limit. Clinically favourable from a cardiovascular and gout-prevention perspective. Not a concern.\nFolate above 24 ng/ml, above the upper limit of 17. Likely reflects supplementation or a diet rich in fortified foods. Not harmful.\nMagnesium 1.14 mmol/L, marginally above the 1.11 upper limit. Likely reflects supplementation. Not harmful at this level.\nUrea:creatinine ratio 102.6, marginally above the 40 to 100 range. Most likely mild dehydration at the time of the draw. Kidney function is otherwise excellent.\nReassuring negatives: thyroid function normal with negative antibodies, kidney function excellent (eGFR 98), liver fibrosis excluded (FIB-4 0.76, APRI 0.241, NAFLD score negative 3.168), blood sugar control excellent (HbA1c 33, HOMA-IR 0.54), no insulin resistance, rheumatoid factor negative, coeliac screen negative, PSA 0.41, tumour markers clean, urinalysis clean, ESR 1, immunoglobulins balanced, PhenoAge 32.4 (7.6 years younger than calendar age).","recommendations":"Discuss the Lp(a) result of 100.26 nmol/L with your GP. This is inherited, permanent, and should be recorded in your medical notes. Ask whether referral to a lipid clinic is appropriate given your South Asian ethnicity, the elevated ApoB of 1.31 and LDL of 3.83, and the cardiovascular risk score of 85. Bring this report to the appointment.\nAsk your GP whether lipid-lowering medication should be considered alongside the dietary changes in this report, given that a portion of your cardiovascular risk (the Lp(a)) cannot be modified by lifestyle. Dietary changes should be trialled first for three to six months, with a retest to assess their impact on the modifiable LDL and ApoB.\nRecommend that first-degree relatives (parents, siblings, and any children) are tested for Lp(a), as it is inherited and the result has implications for their cardiovascular risk management.\nMention the lipase of 77 (above 60) to your GP. In the absence of symptoms, this is likely benign, but given your goal of improving gut health and any ongoing digestive symptoms, your GP may wish to monitor it or investigate further with imaging if symptoms warrant.\nIf digestive symptoms persist, ask your GP about a hydrogen breath test for small intestinal bacterial overgrowth (SIBO) or lactose and fructose intolerance. These are common causes of bloating and digestive discomfort that blood tests cannot detect.\nDiscuss stopping nicotine vaping. Your GP can advise on nicotine replacement therapy or cessation support. Vaping contributes to the GGT of 50, the CRP of 1.4, and may be a factor in joint stiffness, sleep quality and anxiety.\nCalorie and protein targets: at 78 kg, 172 cm, BMI 26.4, training four times per week with 7,500 to 10,000 steps, his estimated maintenance calories are approximately 2,350 to 2,500 kcal per day (BMR of approximately 1,720 multiplied by a moderate activity factor of 1.6, adjusted to 2,350 to 2,500 given his mixed training). If fat loss is desired (his BMI suggests a modest amount would be beneficial for cardiovascular risk), a deficit of 300 to 400 kcal per day would target 0.3 to 0.4 kg per week, aiming for a calorie range of 1,950 to 2,150 kcal per day. Protein target: 1.3 to 1.6 g per kg, giving 101 to 125 g of protein per day. A target weight range of 72 to 75 kg would bring his BMI to approximately 24.3 to 25.4. Retest in four to six months, repeating the full lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB, ApoA1), hs-CRP, GGT, ferritin, lipase and a full blood count including reticulocytes. Lp(a) does not need repeating as it does not change.","supplementation":"Omega-3 fish oil providing 2 to 3 g of combined EPA and DHA daily, taken with a meal containing fat. Why: omega-3 supports HDL (currently 1.2, target above 1.4), reduces inflammation (CRP 1.4), lowers triglycerides (already good but the anti-inflammatory and HDL-raising effects are the priority here), and provides direct cardiovascular protection alongside his elevated Lp(a) of 100.26 and ApoB of 1.31.\nVitamin D3 (cholecalciferol) 2,000 IU daily, taken with a fat-containing meal, to maintain his current excellent level of 99 nmol/L through the winter months. South Asian skin synthesises less vitamin D from sunlight, so a maintenance dose through autumn and winter is appropriate.\nVitamin K2 (MK-7) 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones and away from artery walls, which is especially relevant alongside his elevated cardiovascular risk markers.\nMagnesium glycinate 300 mg before bed, if not already supplementing (his magnesium at 1.14 suggests he may be). Why: magnesium supports sleep quality, muscle recovery, and mood, all three of which are relevant to his reported symptoms of fatigue, low mood and joint stiffness. The glycinate form is gentle on the gut, which matters given his digestive goals.\nDo not take iron supplements. His ferritin at 313 is at the upper end of the range and above the optimal ceiling of 200. Additional iron supplementation could push ferritin into a range associated with oxidative stress and is not needed.\nThe most important changes from this report are not supplements. They are the dietary changes to reduce saturated fat and increase soluble fibre to lower the modifiable portion of his LDL and ApoB, the addition of a second resistance training session, the GP conversation about his Lp(a) and whether lipid-lowering medication is appropriate, and a plan to stop nicotine vaping.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 58.9. Weakest systems: lipids & cardiovascular 17%, hormones 32%, electrolytes & minerals 55%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), SHBG.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"31.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3489","lower_normal":"","upper_normal":"45","lower_optimal":"","upper_optimal":"40","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase. It estimates the pace of biological ageing based on these inputs. Navir's PhenoAge is 32.4 years against a calendar age of 40, a difference of 7.6 years younger. This is an excellent result and reflects his strong metabolic, kidney, liver and immune markers. Fasting glucose was not returned by the laboratory for this calculation, so the estimated average glucose from HbA1c (5.2 mmol/L) was used in its place. The cardiovascular and dietary changes recommended in this report should protect and potentially improve this biological age advantage.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built right now rather than the ten-year chance of an event, so it has no age term. Navir's score of 85 is high, driven primarily by his Lp(a) at 100.26 nmol/L, ApoB at 1.31 g/L and LDL at 3.83 mmol/L. At 40, his ten-year absolute risk remains statistically low because of his age, but the gap between a high score and a low ten-year risk is the window for acting. The Lp(a) is inherited and unchangeable, but the modifiable LDL and ApoB can be reduced through dietary changes and, if needed, medication. This is the most important conversation to have with his GP.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1548","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5119","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so a rising level signals liver strain. Navir's ALT at 26 is within both the laboratory range and the optimal threshold of under 30 for a man, confirming that his liver cells are not under stress.","low_causes":"","high_causes":"Liver disease, alcohol excess, obesity, medications, viral hepatitis, non-alcoholic fatty liver disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, muscle and other tissues. Unlike ALT, AST is not specific to the liver, so it is interpreted alongside ALT to understand the source of any elevation. Navir's AST at 25 is mid-range and sits within the optimal band, confirming healthy liver and muscle tissue.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, heavy exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5617","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4348","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that responds to metabolic strain, alcohol, certain medications and oxidative stress. It is often the first liver enzyme to rise when the liver is under low-grade pressure. Navir's GGT at 50 is within the laboratory range for men (4 to 73) but above the optimal threshold of 25. In the context of clean ALT, AST, bilirubin and fibrosis scores, this does not indicate liver disease, but it suggests the liver is experiencing some low-level oxidative or metabolic load. Nicotine vaping and diet quality are possible contributors. Improving diet quality and reducing or stopping vaping should bring this number down.","low_causes":"","high_causes":"Alcohol, obesity, metabolic syndrome, medications, vaping, oxidative stress, bile duct issues","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bones and bile ducts. It rises with bile duct obstruction, bone turnover, or liver disease. Navir's ALP at 92 is within both the laboratory and optimal ranges, confirming healthy bile duct and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Elevated bilirubin can indicate liver problems, bile duct obstruction, or increased red cell destruction. Navir's bilirubin at 10 is well within range and confirms normal red cell turnover and liver clearance.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein is the combined measurement of albumin and globulin in the blood. It reflects liver synthetic function, immune activity and nutritional status. Navir's total protein at 77 is within the optimal range, confirming adequate nutrition and balanced protein synthesis.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6666666667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and drugs, and maintains fluid balance. It is also one of the strongest general markers of health. Navir's albumin at 46 is within the optimal range, indicating excellent liver synthetic function and good nutritional status.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6481","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) and transport proteins. The level reflects immune system activity and liver function. Navir's globulin at 31 is within the optimal range, consistent with a balanced immune system and healthy liver.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"111","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5758","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5606","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels can indicate pancreatic inflammation. Navir's amylase at 111 is within the laboratory range of 30 to 118 but above the optimal zone. In conjunction with the mildly elevated lipase, this places the pancreatic enzymes at the higher end of normal, which is not pathological but worth monitoring alongside his digestive goals.","low_causes":"Pancreatic insufficiency, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7611","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5602","units":"U/L","description":"Lipase is an enzyme produced primarily by the pancreas that breaks down dietary fats. It is the most specific blood marker for pancreatic function, and significant elevations (typically more than three times the upper limit) suggest acute pancreatitis. Navir's lipase at 77 is mildly above the 60 upper limit but well below the threshold for pancreatitis concern. In the absence of severe abdominal symptoms and with amylase within range, this most likely represents a naturally higher baseline or mild digestive system variation. Given his goal of improving gut health, this is worth mentioning to his GP and monitoring on retest.","low_causes":"Pancreatic insufficiency, chronic pancreatitis","high_causes":"Pancreatitis, bowel obstruction, kidney disease, medications, gut inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5223","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the combined measurement of all cholesterol in the blood, including LDL, HDL and VLDL. On its own it is a blunt instrument, because it includes the protective HDL alongside the harmful LDL. Navir's total cholesterol at 5.4 is above the desirable threshold of 5.18. The breakdown shows the excess is driven by LDL rather than a deficiency of HDL.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2647","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats in the blood used for energy storage. They rise with excess carbohydrate, sugar and alcohol intake, and are a marker of metabolic health. Navir's triglycerides at 0.9 are within the optimal range of under 1.0, which is an excellent result and confirms efficient fat metabolism.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"Excess carbohydrate, sugar, alcohol, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2628","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein cholesterol, carries triglycerides from the liver to tissues. It is a precursor to LDL and reflects how much fat the liver is packaging for export. Navir's VLDL at 0.41 is within the optimal range, confirming that his liver's fat processing is efficient.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"Excess carbohydrate, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"1.55","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein cholesterol, is often called 'good' cholesterol because it removes excess cholesterol from artery walls and transports it back to the liver for disposal. Higher levels are protective. Navir's HDL at 1.2 is above the high-risk threshold of 1.04 but below the desirable level of 1.55 and below the optimal target of 1.4 for a man. Increasing HDL through regular resistance training, omega-3 intake and oily fish consumption would improve the overall balance between harmful and protective cholesterol particles.","low_causes":"Sedentary lifestyle, obesity, smoking/vaping, poor diet, genetics","high_causes":"Regular exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6383","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, or low-density lipoprotein cholesterol, is the primary carrier of cholesterol to tissues and artery walls. Excess LDL deposits cholesterol into arterial linings, driving atherosclerosis over decades. Navir's LDL at 3.83 is above the 3.0 upper limit. Even after correcting for the cholesterol carried by his Lp(a), the Lp(a)-corrected LDL is 3.51, still above the target, confirming that there is a meaningful diet-modifiable component. Reducing saturated fat and increasing soluble fibre are the primary dietary levers for lowering LDL.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, familial hypercholesterolaemia, Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. A lower ratio indicates a better balance between harmful and protective cholesterol. Navir's ratio at 4.5 sits exactly at the upper limit of the reference range, driven by the combination of an elevated total cholesterol and an HDL that is below the desirable level. Improving HDL and lowering LDL will bring this ratio down.","low_causes":"","high_causes":"High LDL, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"22.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"20","upper_normal":"100","lower_optimal":"28","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5400","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. A higher percentage means more of the total cholesterol is protective. Navir's 22.22% is above the 20% minimum but below the optimal threshold of 28%, reflecting the same pattern seen in the TC/HDL ratio: the balance favours harmful particles over protective ones.","low_causes":"Low HDL, elevated LDL","high_causes":"High HDL, low LDL, healthy lifestyle","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all of the atherogenic cholesterol fractions (LDL, VLDL, IDL and Lp(a)) in a single number and is considered a better predictor of cardiovascular risk than LDL alone. Navir's non-HDL at 4.2 is above the 4.0 target, driven by the elevated LDL and Lp(a).","low_causes":"Malnutrition, hyperthyroidism","high_causes":"Diet high in saturated fat, genetics, Lp(a), insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1, or apolipoprotein A1, is the main protein on HDL particles. It is the functional component that enables HDL to remove cholesterol from artery walls. Higher levels are protective. Navir's ApoA1 at 1.2 sits exactly at the lower boundary of the desirable range and below the optimal threshold of 1.4, mirroring his HDL result. Increasing exercise, particularly resistance training, and omega-3 intake should raise both ApoA1 and HDL.","low_causes":"Sedentary lifestyle, obesity, smoking/vaping, genetics","high_causes":"Regular exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB, or apolipoprotein B, is a protein present on every LDL, VLDL and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this measurement effectively counts the total number of atherogenic particles in the blood. It is considered the single best predictor of cardiovascular risk, superior to LDL cholesterol alone. Navir's ApoB at 1.3
