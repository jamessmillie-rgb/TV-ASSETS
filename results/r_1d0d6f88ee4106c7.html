<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Navir Rustomfram Shukla","dob":"15/11/1985","report_date":"2026-10-02","summary":"Navir is a 40-year-old male of South Asian ancestry presenting with a BMI of 26.4, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. He trains four times per week (three cardio sessions and one resistance session) with 7,500 to 10,000 daily steps. He vapes nicotine and takes no medications. He reports low energy and fatigue, low mood and anxiety, and joint pain and stiffness. His goals are to improve digestion and gut health, improve long-term health and longevity, and boost his immune system.\n\nThe single most important finding in this report is Navir's cardiovascular risk profile, and because of his South Asian heritage this carries extra weight. His Lipoprotein(a), usually written Lp(a), is 100.26 nmol/L, more than three times the 32 nmol/L threshold. Lp(a) is a modified LDL particle that deposits cholesterol into artery walls, promotes clotting, and drives local inflammation. It is entirely inherited, it does not change with diet or exercise, and it cannot be lowered by any currently available lifestyle intervention. It is a permanent piece of medical information that should be recorded in his GP notes and shared with any future cardiologist. It also means that his first-degree relatives, parents, siblings and eventually children, should be tested for it, because roughly half of them will carry the same variant. South Asian populations already carry a higher baseline cardiovascular risk at any given cholesterol level compared with European populations, and an elevated Lp(a) on top of that materially increases the stakes. The TrueVitals Cardiovascular Risk Score, an internal index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, scores Navir at 85 out of 100, where anything above 40 is flagged. At 40, Navir's ten-year absolute event risk is still low simply because of his age, but the score is measuring the risk being built right now, and the gap between the two numbers is the window in which he can act.\n\nAlongside the Lp(a), the rest of his lipid panel is significantly elevated. His ApoB, a direct count of the number of atherogenic particles in the blood, is 1.31 g/L against a target below 0.9 and an ideal below 0.8, placing him in the high-risk category. His LDL cholesterol is 3.83 mmol/L against a reference of 3.0 and an ideal below 2.6. Even after subtracting the cholesterol carried by Lp(a) particles, his Lp(a)-corrected LDL is 3.51 mmol/L, still well above the target of 3.0, which tells us that the LDL elevation is not simply an artefact of the Lp(a) but reflects genuinely high concentrations of standard LDL particles as well. His total cholesterol is 5.4, his non-HDL cholesterol is 4.2 against a target below 4.0, and his ApoB to ApoA-I ratio is 1.09, well into the higher-risk zone above 0.9. His HDL, the protective cholesterol that carries lipids away from arteries, is 1.2 mmol/L. That is above the high-risk threshold of 1.04 but below the desirable level of 1.55 and well below the optimal of 1.4 for a man. The one genuinely good lipid result is his triglycerides at 0.9 mmol/L, which is excellent and within the optimal range below 1.0, giving a TG to HDL ratio of 0.75, a marker of insulin sensitivity that sits well inside the ideal band. Put together, this is a lipid profile that needs active management: the Lp(a) component is fixed and unmodifiable, but the standard LDL and ApoB are driven by diet, body composition and potentially medication, and bringing those down is the most important thing this report can achieve for Navir's long-term health.\n\nThe good news is that there is a great deal working well. His blood sugar control is excellent. Fasting glucose is 4.7 mmol/L, comfortably inside the optimal range of 4.0 to 5.4. HbA1c, a measure of average blood sugar over the preceding three months, is 33 mmol/mol, well within the optimal threshold of 36 and a long way from the pre-diabetic range starting at 42. His HOMA-IR, which estimates how resistant the body's cells are to insulin, is 0.54, indicating excellent insulin sensitivity. This is particularly reassuring given his South Asian background, where type 2 diabetes risk is elevated at lower BMI thresholds than in European populations. His liver is in solid health. ALT at 26 and AST at 25 are both within the ideal range, and more importantly the FIB-4 score of 0.76, a composite that screens for liver scarring (fibrosis), is well below the 1.45 threshold, and the APRI score of 0.241 confirms the same picture. His NAFLD Fibrosis Score of -3.168 rules out significant fibrosis. His GGT at 50 is within the laboratory range of 4 to 73 but above the optimal threshold of 25. On its own, with clean ALT, AST and bilirubin, this is not a concern for liver disease, but GGT is also a marker of oxidative stress and metabolic load, and it is worth watching. His kidney function is excellent. Cystatin C, a more reliable marker of kidney filtration than creatinine alone because it is not affected by muscle mass, is 0.99, giving a Cystatin C eGFR of 98 and a combined eGFR of 98, both comfortably above the optimal threshold of 90. His thyroid is working well. TSH at 0.94 is within the optimal range of 1.0 to 2.5, sitting just below the lower optimal bound but comfortably within the laboratory range, indicating the pituitary is not having to push the thyroid hard. Free T4 at 18 pmol/L is right in the middle of the optimal band of 14 to 20. Free T3 at 4.5 pmol/L sits at the lower edge of the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which rules out autoimmune thyroid disease. His inflammatory markers are reassuring. ESR is 1, about as low as it gets. CRP at 1.4 is within the laboratory range below 5 but above the optimal threshold of 1.0. At a BMI of 26.4 with no other inflammatory signals, this is a minor finding, but it is worth noting because chronic low-grade inflammation is one of the mechanisms through which cardiovascular risk accumulates, and bringing CRP below 1.0 is a worthwhile target. His immune system is balanced. IgG, IgA, IgM and IgE are all within range, rheumatoid factor is undetectable, and his coeliac screen (tissue transglutaminase IgA) is negative. His PSA at 0.41 with a free ratio of 51.2% is exemplary for prostate health. His tumour markers CA19-9 and CEA are both well within normal limits. His total antioxidant activity at 1.61 is within range. His vitamin D at 99 nmol/L is within the optimal band of 75 to 120, which is a genuine positive given that South Asian skin produces less vitamin D from sunlight. His B12 at 537 pg/mL is within the optimal range of 500 to 900.\n\nHis PhenoAge, a composite biological ageing marker built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes in at 31.4 years against his calendar age of 40, meaning his blood markers are ageing nearly nine years younger than his birth certificate. The main drivers of this favourable gap are his excellent glucose, low white cell count, healthy albumin and low CRP.\n\nTurning to the findings that need attention beyond the lipid profile. His testosterone is 33.9 nmol/L, which is above the upper laboratory limit of 28.7. His SHBG, the protein that binds testosterone and makes it unavailable to tissues, is 79.3 nmol/L, above the upper limit of 65.8. When testosterone is high but SHBG is also high, a large proportion of that testosterone is bound and inactive. His free testosterone, calculated from these two values, is 0.419 nmol/L, which is within the laboratory range of 0.13 to 1.04, and his bioavailable testosterone at 10.48 nmol/L is above the upper reference of 9. The free androgen index at 42.75 is within range. In practical terms, Navir has plenty of testosterone but his body is binding more of it than usual. Elevated SHBG in men is commonly seen with low body fat, high thyroid function, and ageing, and less commonly with liver conditions (which are ruled out here). At BMI 26.4, the most likely driver is simply individual variation, but if he develops symptoms of low testosterone in future, the SHBG is the number to watch. Progesterone at 0.37 nmol/L is below the male reference range of 0.89 to 3.88. In men, progesterone is produced in small amounts by the adrenal glands and testes, and it plays a role in mood, sleep and neurological function. A low level in isolation, without other hormonal disruption, is common and usually not clinically significant, but given that Navir reports low mood and anxiety, it is worth noting for his GP.\n\nHis insulin at 2.58 mIU/L is fractionally below the laboratory lower limit of 2.6, and his C-Peptide at 0.759 ug/L (equivalent to approximately 251 pmol/L) is below the reference range of 1.1 to 4.4. C-Peptide is released by the pancreas in equal amounts to insulin and is a measure of how much insulin the body is producing. Both being low, in the context of a perfectly normal fasting glucose of 4.7 and an HbA1c of 33, means the pancreas is producing very little insulin because it does not need to. This is a sign of excellent insulin sensitivity, not pancreatic insufficiency. His HOMA-IR of 0.54 confirms this. This is a positive finding dressed in an abnormal flag.\n\nHis lipase at 77 U/L is above the upper reference limit of 60. Lipase is an enzyme produced by the pancreas to digest dietary fat. A mild elevation like this, roughly 1.3 times the upper limit, without symptoms of acute pancreatitis (severe upper abdominal pain radiating to the back, nausea, vomiting) is usually not significant. His amylase at 111 is within range. However, given that one of Navir's primary goals is digestive health, and mild chronic lipase elevation can occasionally reflect low-grade pancreatic irritation, this is worth flagging for his GP and repeating on a fasting sample.\n\nHis folate is reported as greater than 24 ng/mL against an upper limit of 17. In isolation, elevated folate is usually from diet (leafy greens, fortified foods) or supplementation and is not harmful. It does not require action unless B12 were low, which it is not.\n\nHis magnesium at 1.14 mmol/L is marginally above the laboratory upper limit of 1.11. This is a very small margin and is most likely from supplementation or dietary intake. At this level, there is no clinical concern. His uric acid at 207 umol/L is just below the lower reference of 220. Low uric acid is generally considered favourable and is associated with lower cardiovascular and gout risk. It does not require action.\n\nHis reticulocyte absolute count at 42.4 is mildly below the lower reference of 50. Reticulocytes are young red blood cells released by the bone marrow, and a mildly low count with a normal haemoglobin of 153, normal MCV of 85.6 and normal RDW of 13.8 simply means the marrow is producing red cells at a relaxed pace because it does not need to replace them any faster. This is not a concern. His MCHC at 346 is 1 unit above the upper limit of 345. At this margin, this is laboratory variation and has no clinical significance.\n\nHis ferritin at 313 ng/mL is within the laboratory range of 22 to 322 but above the optimal upper bound of 200 for a man. His transferrin saturation at 28.27% is within the optimal range of 25 to 40%, and his serum iron and transferrin are both normal. This pattern, high-normal ferritin with normal saturation, is most commonly seen with mild inflammation, higher BMI or simply individual variation. It does not suggest iron overload, but it does mean Navir should not take iron supplements.\n\nHis cortisol at 214 nmol/L is within the morning reference range of 145.4 to 619.4. It sits in the lower half of the range, which is reassuring against chronic stress-driven elevation. His DHEA-S at 1.6 umol/L (approximately 590 ug/dL) is within range. His oestradiol at 97 pmol/L is within the male range below 146.1. LH and FSH are both within range, confirming normal pituitary-gonadal signalling. Prolactin at 56 is within range.\n\nHis calculated serum osmolality at 298.6 mOsm/kg is marginally above the reference range of 275 to 295. This is a calculated estimate rather than a direct measurement, and at this margin, with normal sodium, normal glucose and normal kidney function, it simply suggests mild dehydration at the time of the blood draw. It is not clinically significant but is a reminder to stay well hydrated.\n\nRegarding Navir's symptoms, his fatigue, low mood and joint stiffness are not explained by a single clear abnormality in this blood panel. This is genuinely useful information. His thyroid is working well, his blood sugar is excellent, his B12 and folate are healthy, his iron stores are full, his haemoglobin is normal, his testosterone is high, and his inflammatory markers are low. What this means is that the most likely drivers of his symptoms sit outside what blood can measure. His diet quality at 5 out of 10 and volume at 5 out of 10 suggest room for improvement in the fuel he is giving his body. His single resistance session per week is low for someone reporting joint stiffness, because resistance training is the most evidence-based intervention for joint health, tendon resilience and mood via endorphin and BDNF release. Nicotine vaping causes vasoconstriction, which can contribute to joint stiffness and fatigue, and the stimulant effect disrupts sleep architecture even when sleep duration feels adequate. Low mood and anxiety in the absence of hormonal or thyroid abnormality are most commonly driven by sleep quality, stress, physical activity patterns and diet composition, particularly protein, omega-3 and fibre intake. Given his goals around gut health, a food and symptom diary for two to four weeks would help identify whether specific foods are driving bloating or discomfort, and if symptoms persist, a hydrogen breath test for SIBO (small intestinal bacterial overgrowth) or lactose intolerance would be a proportionate next step.\n\nHis urine is completely clear: no protein, no glucose, no blood, no white cells, no nitrites, no bacterial growth. His urea to creatinine ratio at 102.6 is marginally above the reference upper limit of 100. This is consistent with mild dehydration at the time of the sample or a higher protein meal the evening before, and with normal creatinine and normal eGFR, it carries no clinical weight.","links":"The dominant thread in this report is cardiovascular risk, and it has two distinct strands. The first is inherited and permanent: Navir's Lp(a) at 100.26 nmol/L is genetically determined and cannot be changed by any lifestyle measure currently available. It deposits cholesterol, promotes clotting and drives inflammation in arterial walls independently of anything else in the lipid panel. The second strand is modifiable: his LDL at 3.83, ApoB at 1.31 and non-HDL at 4.2 are all elevated beyond what Lp(a) alone accounts for, since even after correcting for Lp(a)-carried cholesterol his LDL remains 3.51, well above target. His HDL at 1.2 is below the desirable level. His triglycerides, the one bright spot in the lipid panel, are excellent at 0.9, confirming that the problem is cholesterol-carrying particle number rather than a triglyceride-driven metabolic pattern. These modifiable lipids are driven by diet composition, specifically saturated fat intake, fibre intake and omega-3 status, and they will respond to targeted changes.\n\nThe second thread is metabolic efficiency. His insulin and C-Peptide are both below or at the floor of the laboratory range, yet his glucose and HbA1c are textbook-perfect. His HOMA-IR at 0.54 confirms exceptional insulin sensitivity. This is the metabolic profile of someone whose pancreas is working with minimal effort because the tissues are responding efficiently. It explains why his TyG index at 8.12 is well within range and why his triglycerides are low. This is a genuinely favourable finding and one of the strongest positives in the report.\n\nThe third thread connects his hormonal findings. Testosterone is high at 33.9 but SHBG is also elevated at 79.3, meaning much of that testosterone is bound and unavailable. His free testosterone at 0.419 is mid-range and his bioavailable testosterone at 10.48 is actually above the upper reference. In practical terms he has adequate testosterone reaching his tissues, but if SHBG continues to rise with age, the balance could shift. Low progesterone alongside this pattern is common in men and rarely clinically significant, but it may contribute to his mood symptoms given progesterone's role as a neurosteroid.\n\nThe fourth thread concerns what was excluded. His fatigue, low mood and joint stiffness have no clear biochemical driver. Thyroid function, anaemia, iron deficiency, B12 deficiency, blood sugar dysregulation, chronic inflammation, coeliac disease, autoimmune markers and testosterone deficiency have all been ruled out with strong numbers. This points the search towards lifestyle factors: diet quality, resistance training frequency, nicotine use, sleep quality and stress management.\n\nThe mild lipase elevation stands as a loose end. It could reflect a transient post-meal rise, mild chronic pancreatic irritation, or simply individual variation. With normal amylase and no symptoms of pancreatitis, it does not suggest acute disease, but given Navir's focus on digestive health it warrants a fasting repeat and, if persistently elevated, imaging of the pancreas.\n\nFinally, the ferritin at 313 with normal saturation, the GGT at 50 with clean liver enzymes, and the CRP at 1.4 form a low-grade cluster that could reflect mild systemic metabolic load. None is concerning in isolation, but together they suggest that optimising diet quality, increasing resistance training and reducing nicotine exposure could bring all three into the ideal range simultaneously.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, fish or lentils. Anchor: before anything else goes on the plate. Why: protein supports satiety, muscle maintenance on your single resistance session, and at 78 kg you need at least 100 to 125 g per day, which a diet rated 5 out of 10 is unlikely to be delivering.\nAdd two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: replace two existing evening meals. Why: omega-3 fatty acids lower ApoB and LDL, reduce inflammation (bringing CRP below 1.0), and improve mood, which matters given your low mood and anxiety.\nAdd a daily portion of soluble fibre: oats at breakfast, a handful of almonds as a snack, or a portion of beans or lentils at lunch. Anchor: attach to a meal you already eat. Why: soluble fibre binds cholesterol in the gut and reduces LDL absorption, which is the single most effective dietary lever for your ApoB of 1.31.\nIncrease resistance training from one to three sessions per week, even if they are 20 to 30 minutes each. Anchor: attach to days you are already going for cardio. Why: resistance training is the strongest evidence-based intervention for joint stiffness, it raises HDL, it improves mood through endorphin release, and it supports the muscle mass that keeps your metabolic rate healthy as you age.\nWalk for 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk blunts the glucose and insulin response to that meal and supports digestive motility, which aligns with your gut health goal.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking, even on overcast days. Anchor: before checking your phone. Why: morning light resets the circadian clock, improves energy levels through the day, supports cortisol rhythm and is one of the most effective interventions for low mood and anxiety.\nSet a caffeine and nicotine cut-off of 2pm. Anchor: after lunch, no more of either. Why: nicotine is a stimulant that disrupts sleep architecture even when you feel you are sleeping enough, and poor sleep quality drives fatigue, low mood and elevated CRP.\nAim for five or more portions of vegetables and fruit each day, prioritising colour variety. Anchor: two portions at lunch, two at dinner, one as a snack. Why: plant fibre feeds beneficial gut bacteria, supports digestive health, provides antioxidants that lower CRP, and delivers the micronutrients a 5 out of 10 diet may be missing.","flags":"Lp(a) 100.26 nmol/L, more than three times the 32 nmol/L threshold. This is inherited, permanent and unmodifiable by lifestyle. It independently drives cardiovascular risk through cholesterol deposition, clot promotion and arterial inflammation. South Asian ancestry compounds baseline cardiovascular risk. GP should record this permanently, consider referral to lipid clinic, and recommend testing first-degree relatives.\nApoB 1.31 g/L (target below 0.9, ideal below 0.8), LDL 3.83 mmol/L (target below 3.0, ideal below 2.6), Lp(a)-corrected LDL 3.51 mmol/L (still above 3.0), non-HDL cholesterol 4.2 mmol/L (target below 4.0), ApoB/A-I ratio 1.09 (target below 0.7), HDL 1.2 mmol/L (below desirable 1.55). Cardiovascular Risk Score 85/100. This is a significantly atherogenic lipid profile. The elevated standard LDL beyond what Lp(a) accounts for confirms that lifestyle-modifiable and potentially statin-responsive dyslipidaemia exists alongside the inherited Lp(a) risk. GP should consider lipid clinic referral, QRISK3 calculation accounting for South Asian ethnicity and Lp(a), and discussion of statin therapy.\nSHBG 79.3 nmol/L (above upper limit 65.8) with testosterone 33.9 nmol/L (above upper limit 28.7). Free testosterone 0.419 nmol/L is within range. Elevated SHBG is binding excess testosterone. No clinical action needed at present but should be noted if symptoms of androgen deficiency develop.\nLipase 77 U/L (above upper limit 60) with amylase 111 IU/L (within range). Mild isolated lipase elevation without symptoms of acute pancreatitis. Recommend fasting repeat in 6 to 8 weeks and if persistently elevated consider pancreatic imaging, particularly given the patient's digestive health goals.\nInsulin 2.58 mIU/L (marginally below lower limit 2.6) and C-Peptide 0.759 ug/L (below range 1.1 to 4.4). In the context of normal glucose 4.7 and HbA1c 33, this reflects excellent insulin sensitivity with low insulin demand, not pancreatic failure. HOMA-IR 0.54 confirms this.\nProgesterone 0.37 nmol/L (below range 0.89 to 3.88). Low progesterone in men is common and usually not clinically significant. May contribute to mood symptoms given progesterone's neurosteroid role.\nFerritin 313 ng/mL, within laboratory range but above optimal 200. Transferrin saturation 28.27% is normal. Does not suggest iron overload but iron supplementation should be avoided.\nGGT 50 IU/L, within laboratory range (4 to 73) but above optimal (below 25). With clean ALT, AST and bilirubin, this does not indicate liver disease but may reflect oxidative stress or metabolic load.\nhsCRP 1.4 mg/L, within laboratory range (below 5) but above optimal (below 1.0). Low-grade inflammation contributing to cardiovascular risk.\nReassuring negatives: thyroid function normal with negative antibodies, HbA1c 33 and glucose 4.7 ruling out diabetes, eGFR 98 confirming excellent kidney function, FIB-4 0.76 and APRI 0.241 ruling out liver fibrosis, PSA 0.41 with free ratio 51.2% indicating healthy prostate, coeliac screen negative, rheumatoid factor undetectable, all immunoglobulins normal, tumour markers CA19-9 and CEA normal, urine clear, PhenoAge 31.4 (8.6 years younger than calendar age).","recommendations":"Discuss Lp(a) result of 100.26 nmol/L with GP. This is a permanent inherited risk factor that should be recorded in the medical notes. Request referral to a lipid clinic for formal cardiovascular risk assessment incorporating Lp(a) and South Asian ethnicity. Recommend Lp(a) testing for parents, siblings and eventually children.\nDiscuss the full lipid profile with GP: ApoB 1.31, LDL 3.83, non-HDL 4.2, HDL 1.2. Request a QRISK3 calculation adjusted for South Asian ethnicity. Given the Lp(a) and the ethnicity-adjusted risk, discuss whether statin therapy is appropriate now rather than waiting for a cardiovascular event. The lifestyle changes in this report should run in parallel with that discussion, not as a substitute for it.\nRequest a fasting repeat of lipase in 6 to 8 weeks. If still elevated above 60, discuss pancreatic imaging (ultrasound or CT) given the patient's digestive symptoms and goals.\nIf fatigue, low mood and joint stiffness persist after 8 to 12 weeks of the lifestyle changes in this report, consider a sleep study to assess sleep quality (particularly given nicotine use), and a food and symptom diary followed by hydrogen breath testing for SIBO or lactose intolerance if digestive symptoms are present.\nCalorie target: approximately 2,300 to 2,500 kcal per day for maintenance at current activity level (BMR approximately 1,730 kcal multiplied by an activity factor of 1.45 for light to moderate activity). Protein target: 100 to 125 g per day (1.3 to 1.6 g per kg at 78 kg with resistance training). If fat loss is a goal, a deficit of 300 to 500 kcal (1,800 to 2,200 kcal) with protein maintained at 125 g would be appropriate. Retest lipids, hsCRP, GGT and lipase in 12 weeks to assess the impact of dietary changes and any medication started.","supplementation":"DO NOT take iron supplements. Ferritin at 313 ng/mL is already above the optimal ceiling of 200, and additional iron could push stores into an unhelpful range.\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with a meal containing fat. Why: omega-3 lowers ApoB, reduces triglycerides (already good but supports the ratio), lowers hsCRP from 1.4 towards the ideal below 1.0, and has evidence for improving mood, which is relevant to Navir's low mood and anxiety. Choose a product that lists EPA and DHA separately on the label and aim for at least 1,200 mg EPA.\nMagnesium glycinate: 300 to 400 mg before bed. Why: supports sleep quality, joint comfort and mood. Navir's serum magnesium at 1.14 is marginally above range, which may reflect existing supplementation; if he is already supplementing, he can continue at the same dose. If not, this is a useful addition.\nVitamin D3 (cholecalciferol): continue whatever is maintaining the current level of 99 nmol/L. If not currently supplementing, 2,000 IU daily with a fat-containing meal will maintain this level through winter. Always pair with vitamin K2 (MK-7) at 100 to 200 mcg daily to direct calcium into bone rather than arteries.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with vitamin D. Why: supports cardiovascular health by preventing arterial calcification, which is particularly relevant given the elevated Lp(a) and lipid profile.\nThe most important changes from this report are not supplements. They are adding oily fish twice a week, increasing soluble fibre daily, increasing resistance training to three sessions per week, cutting nicotine after 2pm, and having the lipid conversation with the GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5182","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 57 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden  where darker skin reduces natural vitamin D synthesis. Whatever Navir is doing, whether supplementing or getting regular sun exposure, it is working well.","low_causes":"Limited sun exposure, dark skin, obesity, malabsorption, northern latitude, winter","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4453","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4047","upper_optimal_position":"0.6044","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to pull calcium from bone and increase gut absorption. Navir's PTH of 2.4 pmol/L is within the optimal range, consistent with his healthy calcium and vitamin D levels. This confirms normal parathyroid gland function.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"537","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5220","upper_optimal_position":"0.7095","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Navir's 537 pg/mL is within the optimal range of 500 to 900, indicating healthy B12 status. No supplementation is needed at this level.","low_causes":"Vegan/vegetarian diet, pernicious anaemia, malabsorption, metformin use, gastric surgery","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":">24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444","upper_optimal_position":"","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and nerve function. Navir's result is greater than 24 ng/mL, which is above the laboratory upper limit of 17. Elevated folate is nearly always from dietary sources (leafy greens, legumes, fortified foods) or supplementation and is not harmful. It would only be a concern if B12 were low, masking a deficiency, but Navir's B12 at 537 is within the optimal range.","low_causes":"Poor diet, alcohol, malabsorption, coeliac disease, pregnancy, medications","high_causes":"Supplementation, high folate diet, fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures low-grade systemic inflammation. It is one of the most important markers for cardiovascular risk because chronic inflammation damages artery walls and accelerates plaque formation. Navir's 1.4 mg/L is within the laboratory range of below 5 but above the optimal threshold of below 1.0. In the context of his elevated lipid risk profile, bringing this below 1.0 through omega-3 supplementation, increased vegetable intake and regular exercise would provide a meaningful additional layer of cardiovascular protection.","low_causes":"Low body fat, anti-inflammatory diet, exercise, statin use","high_causes":"Infection, obesity, smoking, metabolic syndrome, autoimmune disease, chronic stress, gum disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5213","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood. Navir's 5.4 mmol/L is above the desirable threshold of 5.18. This is a component of the broader lipid picture rather than a standalone concern, and the more important markers are ApoB and LDL, which are covered below.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, obesity, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2647","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood from dietary sources and the liver. Navir's 0.9 mmol/L is within the optimal range below 1.0, which is an excellent result. Low triglycerides are a strong indicator of insulin sensitivity and metabolic health, consistent with his favourable HOMA-IR.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High-carbohydrate diet, alcohol, obesity, insulin resistance, metabolic syndrome, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2628","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. Navir's 0.41 mmol/L is within the optimal range, consistent with his excellent triglyceride level and good metabolic health.","low_causes":"Low-fat diet, malabsorption","high_causes":"High-carbohydrate diet, insulin resistance, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. Navir's 1.2 mmol/L is above the high-risk threshold of 1.04 but below the desirable level of 1.55 and the optimal of 1.4. Raising HDL is important for cardiovascular protection, and the most effective lifestyle tools are regular exercise (particularly resistance training), omega-3 fatty acids and reducing refined carbohydrate intake.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, medications (fibrates, niacin)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4420","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) carries cholesterol to the tissues and, when elevated, deposits it in artery walls where it forms plaques. Navir's 3.83 mmol/L is significantly above the target of 3.0 and the ideal of below 2.6. Given his elevated Lp(a), reducing the modifiable portion of his LDL through diet, exercise and potentially statin therapy is a priority.","low_causes":"Hyperthyroidism, malabsorption, liver disease, statin therapy, low-fat diet","high_causes":"Diet (saturated fat, trans fat), genetics, hypothyroidism, obesity, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick indicator of cardiovascular risk. Navir's ratio of 4.5 sits at the boundary of the reference range. It is above the optimal of 3.5, reflecting the combination of elevated total cholesterol and below-ideal HDL. As both improve with the dietary and exercise changes in this report, this ratio will come down.","low_causes":"High HDL, low total cholesterol, statins, exercise","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5250","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the atherogenic cholesterol fractions in one number: LDL, VLDL and Lp(a)-carried cholesterol. Navir's 4.2 mmol/L is above the target of 4.0 and the ideal of 3.4, consistent with the rest of his elevated lipid profile.","low_causes":"Statin therapy, healthy diet, exercise, hyperthyroidism","high_causes":"Diet, genetics, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It is a direct measure of how many protective HDL particles are circulating. Navir's 1.2 g/L sits at the lower normal threshold of 1.2 and below the optimal of 1.4, consistent with his below-ideal HDL cholesterol. Raising ApoA-I through exercise, omega-3 and dietary improvement will improve his ApoB/A-I ratio.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, statins","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein carried by every LDL, VLDL and Lp(a) particle. Because each particle carries exactly one ApoB molecule, the ApoB level is a direct count of atherogenic particles in the blood, and it is considered the best single predictor of cardiovascular risk. Navir's 1.31 g/L is well above the desirable threshold of 0.9 and the ideal of 0.8, placing him in the 'high' category. This is the number that matters most for guiding treatment, and it should be discussed with his GP and a lipid specialist.","low_causes":"Statin therapy, healthy diet, exercise, hyperthyroidism, malabsorption","high_causes":"Genetics, diet (saturated fat), obesity, hypothyroidism, insulin resistance, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7786","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA-I). It is one of the strongest predictors of cardiovascular events. Navir's ratio of 1.09 is well into the higher-risk zone above 0.9. Both sides of the ratio need work: ApoB needs to come down through dietary changes and potentially statin therapy, while ApoA-I needs to come up through exercise and omega-3.","low_causes":"High HDL, low LDL, exercise, statin therapy","high_causes":"High LDL, low HDL, sedentary lifestyle, poor diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"100.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7831","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a modified LDL particle with an extra protein, apolipoprotein(a), wrapped around it. It deposits cholesterol in artery walls, promotes blood clotting and drives arterial inflammation, all independently of standard LDL. Unlike every other lipid marker, Lp(a) is entirely genetically determined and does not change with diet, exercise or lifestyle. Navir's 100.26 nmol/L is more than three times the 32 nmol/L threshold, placing him in the moderate risk category (90 to 200 nmol/L). This is a permanent piece of medical information. It means Navir has inherited an additional cardiovascular risk factor that amplifies the danger from his already elevated LDL and ApoB. His first-degree relatives should be tested. There are no currently approved medications that lower Lp(a), although clinical trials are underway. The immediate priority is to reduce every other modifiable risk factor as aggressively as possible: LDL, ApoB, CRP, HDL, blood pressure, weight and smoking/vaping.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), not modifiable by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4071","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged, whether through exercise, injury or disease. Navir's 102 U/L is within the optimal range, indicating no excessive muscle breakdown. This is consistent with his current training load of one resistance session per week.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin therapy, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5268","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4256","upper_optimal_position":"0.5793","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It is converted into the active form, T3, in the tissues. Navir's 18 pmol/L is right in the middle of the optimal range of 14 to 20, indicating healthy thyroid hormone output.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.94","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3641","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3674","upper_optimal_position":"0.4797","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how much hormone to make. A low TSH means the thyroid is producing plenty of hormone without being pushed. Navir's 0.94 mIU/L is within the laboratory range but just below the optimal lower bound of 1.0. At this margin, with FT4 at 18 and FT3 at 4.5, both comfortably within range, this is normal variation and the thyroid is functioning well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary insufficiency, high-dose biotin","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy and body temperature in the cells. Navir's 4.5 pmol/L sits at the lower boundary of the optimal range of 4.5 to 6.5. This is adequate and within a healthy range, though a higher FT3 is associated with better energy levels. If fatigue persists despite other changes, FT3 is worth repeating.","low_causes":"Hypothyroidism, low calorie intake, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced when the immune system mistakenly attacks the thyroid gland, a pattern seen in Hashimoto's thyroiditis. Navir's result of less than 6.6 U/mL is well below the 13.8 threshold, ruling out autoimmune thyroid disease. This is reassuring.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. Navir's result of less than 1.3 U/mL is well below the 4.4 threshold, consistent with no autoimmune attack on the thyroid. More than 80% of the population have undetectable levels, and Navir is in that majority.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts inactive thyroid hormone (T4) into the active form (T3). Navir's ratio of 0.25 is within the laboratory range but below the optimal band of 0.27 to 0.40. This is driven by FT3 sitting at the lower edge of its optimal range at 4.5. The conversion efficiency is adequate but not strong. Selenium, zinc and adequate calorie intake support T4-to-T3 conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"Total PSA","group":"PROSTATE","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0820","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/mL","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, inflammation or, less commonly, prostate cancer. Navir's 0.41 ng/mL is well within the normal range and provides an excellent baseline measurement at 40.","low_causes":"Not clinically significant","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA measures the unbound portion of PSA in the blood. A higher free-to-total PSA ratio is reassuring, as prostate cancer tends to produce more bound PSA. Navir's free PSA of 0.21 with a free ratio of 51.2% is strongly reassuring.","low_causes":"Not applicable in isolation","high_causes":"Benign prostatic hyperplasia, prostatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"Free PSA Ratio","group":"PROSTATE","result":"0.512","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The free PSA ratio shows how much of the total PSA is in its free (unbound) form. A ratio above 0.19 is normal, and a ratio above 0.25 is reassuring. Navir's ratio of 0.512 (51.2%) is well above both thresholds, which is strongly reassuring for prostate health.","low_causes":"Prostate cancer (tends to produce more bound PSA)","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"<1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker primarily associated with pancreatic and biliary cancers. Navir's result of less than 1.2 U/mL is well within the normal range of below 37, which is reassuring. Tumour markers are screening tools and are not diagnostic on their own.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, biliary cancer, pancreatitis, liver disease, other cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2065","lower_
