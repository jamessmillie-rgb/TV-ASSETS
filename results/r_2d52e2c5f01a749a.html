<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Will Middlemiss","dob":"29/07/1996","report_date":"2026-08-29","summary":"Will is a 30-year-old male presenting with a BMI of 29.2, following a standard mixed diet rated 4 out of 10 for quality with a volume of 7 out of 10. He does not currently engage in any structured cardio or resistance training and averages 2,000 to 5,000 daily steps. He takes no medications and has no diagnosed conditions. He reports brain fog, low energy and fatigue, and difficulty losing weight. His goals are to build muscle, improve cardiovascular fitness, and improve mood.\n\nThe most important finding in this report is Will's testosterone. At 8.4 nmol/L he sits right on the floor of the laboratory reference range and well below the recommended level of 12 nmol/L. For a 30-year-old man, this is genuinely low and is very likely contributing to the fatigue, brain fog, difficulty losing weight, and low mood he describes. Testosterone is the primary male hormone, responsible for muscle protein synthesis, energy, motivation, cognitive sharpness, and body composition. His SHBG, the protein that binds testosterone and makes it unavailable to tissues, is 19.7 nmol/L, sitting at the bottom of its range, which means the body is already doing everything it can to keep free testosterone available, and his Free Androgen Index at 42.64 is within range largely because of that low SHBG rather than because testosterone production is adequate. His LH, the pituitary hormone that signals the testes to produce testosterone, is only 1.65 mIU/mL, barely above the lower limit of 1.5. In a man with testosterone this low, you would expect LH to be elevated as the brain tries to drive more production. The fact that it is not suggests the issue may be coming from the pituitary or hypothalamic level rather than the testes themselves, a pattern sometimes called secondary hypogonadism. His FSH at 2.2 follows the same pattern, sitting in the lower portion of its range. His prolactin at 161 uIU/mL is within range, which is reassuring because significantly elevated prolactin can suppress LH and testosterone. His DHEA-S, a precursor hormone produced by the adrenal glands, is elevated at 19.1 umol/L (approximately 7,040 ug/dL), well above the upper limit of 13.4 umol/L. In isolation this can reflect adrenal overactivity and warrants further investigation alongside the testosterone picture. We would strongly recommend Will discusses these hormone findings with his GP. The combination of low testosterone, low LH, and elevated DHEA-S at age 30 warrants proper endocrine investigation, likely including a repeat early-morning testosterone, LH, FSH, prolactin, and possibly pituitary imaging.\n\nThere is a good deal of positive news in this report. Will's glucose metabolism is in excellent shape. His fasting glucose at 4.6 mmol/L is well within the optimal window, his HbA1c at 32 mmol/mol is comfortably below the optimal ceiling of 36, and his HOMA-IR, a measure of how sensitive his cells are to insulin, is 0.74, which is genuinely optimal and means his body needs very little insulin to control blood sugar. At a BMI of 29.2 with no structured exercise, that level of insulin sensitivity is a real strength. His fasting insulin at 3.6 mIU/L is low and healthy. His kidney function is strong. Cystatin C, which is a more reliable measure of kidney filtration than creatinine alone, gives an eGFR of 104, exactly where it should be at 30. His creatinine-based eGFR is above 90 as well. Uric acid at 341 umol/L is within the optimal range. His liver is largely healthy. GGT at 32 is within the male reference range, ALP at 74 and bilirubin at 13 are both normal, and his FIB-4 score at 0.91 shows no suggestion of liver fibrosis. His ALT at 42 is within the laboratory reference range of under 56 but sits above the tighter optimal threshold of 30 for men, which at this level usually reflects body composition rather than liver disease. His thyroid is working well. TSH at 1.99 mIU/L sits in the optimal window, Free T4 at 16.5 pmol/L and Free T3 at 5.9 pmol/L are both within their optimal ranges, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His ESR, a broad measure of inflammation, is less than 1, which is as low as that marker gets. His iron studies are balanced, with ferritin at 178 ng/mL sitting in the optimal zone for a man, transferrin saturation at 42.96% within the ideal window, and serum iron, transferrin, and iron binding capacity all within range. His full blood count is largely reassuring, with haemoglobin at 146 g/L, red cell count, haematocrit, MCV, MCH, and MCHC all within normal limits, and a healthy reticulocyte percentage. His creatine kinase at 177 U/L is normal, his amylase and lipase are both within range confirming healthy pancreatic function, and his PSA at 0.42 with a free ratio of 52.4% is excellent and entirely unremarkable. His tumour markers CA 19-9 and CEA are both well within normal limits. His immunoglobulins IgG, IgM, and IgA are all within their reference ranges, and rheumatoid factor is negative. Tissue transglutaminase IgA is negative, effectively ruling out coeliac disease while he remains on a gluten-containing diet. His cortisol at 342 nmol/L sits comfortably in the morning reference range. His oestradiol at 111 pmol/L and progesterone at 3.11 nmol/L are both within range for a male.\n\nTurning to cardiovascular risk, Will's lipid profile shows a mixed picture. His total cholesterol at 4.9 mmol/L is just under the desirable threshold, and his triglycerides at 0.98 mmol/L are excellent, sitting within the optimal band of under 1.0 mmol/L. His VLDL at 0.45 is healthy. However, his LDL cholesterol at 3.39 mmol/L is above the upper reference limit of 3.0 and above the optimal target of 2.6. His ApoB, a protein that represents the number of potentially harmful cholesterol particles in the blood, is 0.88 g/L, which just squeaks under the 0.9 desirable threshold but sits above the optimal target of 0.8. His HDL, the protective cholesterol fraction, is 1.1 mmol/L, which is above the high-risk threshold of 1.04 but well below the optimal level of 1.4 for a man. His ApoA1, the protein on HDL particles, is 1.08 g/L, below the desirable level of 1.2, and his ApoB to ApoA1 ratio is 0.81, above the lower-risk threshold of 0.7. His Lp(a), which is lipoprotein(a), a genetically inherited particle that carries cholesterol and promotes clotting and arterial inflammation, is 63.42 nmol/L, above the 32 nmol/L threshold. This is an important finding. Lp(a) is entirely genetic, it does not change with diet or exercise, and it cannot be lowered by lifestyle modification. It means Will carries a modestly elevated inherited cardiovascular risk that will be with him for life. This should be recorded permanently in his medical notes and his first-degree relatives, particularly parents and siblings, should be offered Lp(a) testing. The practical implication is that every modifiable risk factor becomes more important: keeping LDL and ApoB as low as possible, raising HDL through exercise, maintaining the excellent insulin sensitivity he already has, and managing body composition. His remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.41 mmol/L, which is within the optimal range and suggests his triglyceride-rich particles are well managed.\n\nHis hs-CRP, a sensitive marker of systemic inflammation, is 1.8 mg/L. While this is within the laboratory reference range of under 5, it sits above the optimal threshold of 1.0 mg/L. At his BMI and activity level, some low-grade inflammation is expected, and bringing body fat down and introducing regular exercise would be expected to lower this. His vitamin D at 75 nmol/L sits right at the lower edge of the optimal range of 75 to 120, which means he is sufficient but has no buffer. His vitamin B12 at 334 pg/mL is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell formation, and energy metabolism, and suboptimal levels can contribute to brain fog and fatigue. His folate at 17 ng/mL sits at the top of the reference range, which is good.\n\nHis C-Peptide, a marker of how much insulin the pancreas is producing, came back at 0.479 ug/L (approximately 159 pmol/L), which is below the laboratory reference range of 1.1 to 4.4 ug/L. However, the lab note flags that samples not separated within four hours can see C-Peptide decrease to 44% of baseline. Given that his fasting glucose, HbA1c, and HOMA-IR are all excellent, this low C-Peptide almost certainly reflects either a pre-analytical sample handling issue or simply that his pancreas does not need to produce much insulin because his cells are so sensitive to it. This is not a concern in context, but it is worth noting.\n\nHis bicarbonate at 14 mmol/L is below the lower limit of 20, which is a significant drop. Bicarbonate is a buffer that keeps blood pH stable. A low reading can reflect a genuine metabolic acidosis or it can be a sample handling artefact, as bicarbonate is one of the most fragile analytes in blood and falls if the sample is exposed to air or delayed in processing. Given that his sodium, chloride, and kidney function are all normal and he has no symptoms suggesting acidosis, a sample artefact is the most likely explanation, but this should be repeated on a fresh sample to confirm. His calculated anion gap, using sodium, potassium (not provided in this panel), chloride, and bicarbonate, cannot be fully calculated without a potassium result, but sodium minus chloride minus bicarbonate alone gives 33, which is elevated and consistent with either a genuine acidosis or the bicarbonate being artificially low.\n\nHis absolute reticulocyte count at 45.8 x10^9/L is marginally below the lower limit of 50, while his reticulocyte percentage at 0.97% is within range. This is a very minor finding and at this margin likely represents normal his first-degree relatives can be offered Lp(a) testing. The low bicarbonate of 14 mmol/L should be repeated on a fresh, promptly processed sample to confirm whether it is genuine or artefactual. If Will experiences any allergic symptoms such as nasal congestion, itchy eyes, skin rashes, or wheezing, the elevated IgE of 433 should prompt referral for specific allergen testing.\n\nFor exercise, Will currently does no structured training and averages 2,000 to 5,000 steps per day. This is the single biggest lever available to him. Resistance training directly stimulates testosterone production, improves insulin sensitivity (which is already good but will help maintain it as body composition changes), raises HDL cholesterol, lowers LDL and ApoB, reduces hs-CRP, improves mood, clears brain fog, and builds the muscle mass that is his primary goal. He should aim for three resistance sessions per week to start, focusing on compound movements such as squats, deadlifts, bench press, rows, and overhead press. Alongside this, increasing daily steps to 7,000 to 10,000 and adding two sessions of moderate-intensity cardio (brisk walking, cycling, rowing, or swimming for 30 to 45 minutes) would address his cardiovascular fitness goal and help improve the lipid profile. Exercise is also one of the few interventions shown to raise HDL cholesterol meaningfully.\n\nFor nutrition, Will rates his diet quality at 4 out of 10 with a volume of 7, which suggests he is eating enough food but the quality of what he eats is poor. At 99 kg and 184 cm with a goal of losing body fat while building muscle, he should aim for a modest caloric deficit. His estimated maintenance calories at his current low activity level are approximately 2,400 to 2,550 kcal per day (99 kg x 1.3 sedentary multiplier, adjusted upward as training is introduced). To lose fat while preserving and building muscle, he should target 2,000 to 2,200 kcal per day once training begins (rising to 2,300 to 2,500 as training volume increases). Protein is the priority: at 99 kg with a goal of building muscle, he should aim for 145 to 160 grams of protein per day (approximately 1.5 to 1.6 g/kg). Protein should come from whole food sources first: chicken, turkey, fish, eggs, Greek yoghurt, legumes, and lean red meat. To improve his diet quality rating from 4 toward 7 or 8, the key changes are: increasing oily fish to two to three portions per week (salmon, mackerel, sardines) for omega-3 and HDL support; adding 5 to 10 grams of soluble fibre daily from oats, beans, lentils, and flaxseed to help lower LDL cholesterol; reducing processed food, refined carbohydrates, and added sugars; eating a wide variety of colourful vegetables and fruits daily; and reducing saturated fat intake by swapping butter for olive oil and choosing leaner cuts of meat. These dietary changes will directly support reducing his LDL from 3.39 toward the 2.6 target and improving ApoB.\n\nFor body composition, a realistic initial target would be to reduce from 99 kg toward 88 to 92 kg over the next six to nine months while building muscle, which should bring his BMI into the 26 to 27 range. Given his excellent insulin sensitivity, his body is well primed to respond to these changes.\n\nA retest in four to five months would be ideal to reassess the lipid profile after dietary and exercise changes have been established, repeat the bicarbonate on a fresh sample, check vitamin D after supplementation, recheck B12, and importantly, review testosterone, LH, and DHEA-S following the GP investigation. The specific markers to repeat would be: testosterone, LH, FSH, DHEA-S, full lipid panel including ApoB and ApoA1, hs-CRP, vitamin D, B12, bicarbonate, and a full blood count.","flags":"HORMONAL (RECOMMEND GP REVIEW):\nTestosterone 8.4 nmol/L, at the floor of the reference range (8.4-28.7) and below the recommended level of 12 nmol/L. LH 1.65 mIU/mL (range 1.5-9.3), inappropriately low for a man with testosterone at the lower limit. FSH 2.2 mIU/mL, also low-normal. This pattern is consistent with secondary hypogonadism (hypothalamic-pituitary origin) rather than primary testicular failure. Prolactin 161 uIU/mL is within range, which is reassuring. DHEA-S 19.1 umol/L (approx. 7,040 ug/dL), significantly above the upper limit of 13.4 umol/L. Elevated DHEA-S at age 30 with low testosterone and low LH warrants endocrine investigation. Recommend: repeat early-morning fasted testosterone, LH, FSH, prolactin, DHEA-S; consider pituitary imaging if secondary hypogonadism confirmed.\n\nCARDIOVASCULAR:\nLDL 3.39 mmol/L (above reference limit of 3.0, above optimal target of 2.6). ApoB 0.88 g/L (under 0.9 desirable threshold but above 0.8 optimal). HDL 1.1 mmol/L (above high-risk threshold of 1.04 but below optimal of 1.4). ApoA1 1.08 g/L (below desirable 1.2). ApoB/A1 ratio 0.81 (above lower-risk threshold of 0.7, within average-risk band). Lp(a) 63.42 nmol/L (above 32 nmol/L threshold; genetically determined, non-modifiable). This is a slightly increased inherited cardiovascular risk. Recommend permanent medical record entry and first-degree relative testing. Modifiable risk factor optimisation is the management strategy.\n\nELECTROLYTES:\nBicarbonate 14 mmol/L, significantly below the lower limit of 20 mmol/L. Most likely a pre-analytical artefact (CO2 loss from sample exposure to air or delayed processing), given normal renal function, normal sodium and chloride, and no clinical symptoms of acidosis. Recommend repeat on fresh, promptly processed sample.\n\nIMMUNOLOGY:\nIgE 433 IU/mL, significantly above the upper limit of 100. Indicates allergic sensitisation. If symptomatic, recommend specific allergen testing (RAST or skin prick testing).\n\nINFLAMMATION:\nhs-CRP 1.8 mg/L. Within laboratory range (<5) but above optimal threshold of 1.0. Likely related to BMI 29.2 and sedentary lifestyle. Expected to improve with weight loss and exercise.\n\nMINOR FINDINGS:\nC-Peptide 0.479 ug/L (159 pmol/L), below range of 1.1-4.4 ug/L. Lab notes sample degradation possible. In context of normal glucose, HbA1c, and HOMA-IR, this is not clinically significant. Absolute reticulocytes 45.8 x10^9/L, marginally below lower limit of 50. Reticulocyte percentage 0.97% is within range. Not significant at this margin. MPV 10.7 fL, marginally above upper limit of 10.1. No clinical significance in isolation. ALT 42 IU/L, within laboratory range but above optimal male threshold of 30. Likely reflects body composition. Vitamin B12 334 pg/mL, within range but below optimal of 500. Vitamin D 75 nmol/L, at the lower edge of optimal (75-120). Corrected calcium 2.2 mmol/L, at the lower boundary of range. PTH normal at 1.8 pmol/L.\n\nUrine: Mixed growth, probable contamination. Plain bottle received (no boric acid). WBC 10 (borderline), RBC <1, nitrites negative. No clinical action needed; repeat on boric acid specimen if urinary symptoms develop.\n\nReassuring negatives: Kidney function excellent (Cystatin C eGFR 104). Thyroid function optimal with negative antibodies. Liver fibrosis excluded (FIB-4 0.91). Glucose metabolism excellent (HOMA-IR 0.74, HbA1c 32). PSA 0.42 with free ratio 52.4%. ESR <1. Coeliac excluded (TTG negative). Rheumatoid factor negative. Tumour markers CEA and CA 19-9 within normal limits. Iron stores balanced.","recommendations":"1. Book a GP appointment to discuss the hormone findings: testosterone at 8.4 nmol/L with low LH at 1.65 and elevated DHEA-S at 19.1 umol/L. Request early-morning fasted repeat testosterone, LH, FSH, prolactin, and DHEA-S. Ask the GP whether pituitary imaging is warranted.\n\n2. Request that Lp(a) at 63.42 nmol/L is recorded permanently in medical notes. Ask whether first-degree relatives can be tested.\n\n3. Ask the GP to repeat bicarbonate on a fresh, promptly processed sample to confirm whether the result of 14 mmol/L is genuine or artefactual.\n\n4. Begin resistance training three times per week, focusing on compound movements. This is the single most impactful change for testosterone, body composition, mood, energy, and cardiovascular risk.\n\n5. Increase daily steps to 7,000 to 10,000 and add two moderate-intensity cardio sessions per week (30 to 45 minutes each).\n\n6. Improve diet quality from 4 toward 7 or 8 out of 10: increase protein to 145 to 160 grams per day; eat oily fish two to three times per week; add soluble fibre from oats, beans, lentils, and flaxseed; reduce processed food, refined carbohydrates, and saturated fat; eat a wide variety of vegetables and fruits.\n\n7. Target calorie intake of 2,000 to 2,200 kcal per day initially, rising to 2,300 to 2,500 as training volume increases.\n\n8. Target a body weight of 88 to 92 kg over the next six to nine months.\n\n9. If experiencing any allergic symptoms (nasal congestion, skin irritation, itchy eyes, wheezing), discuss the elevated IgE of 433 with the GP and request allergen-specific testing.\n\n10. Retest in four to five months: testosterone, LH, FSH, DHEA-S, full lipid panel (including ApoB, ApoA1, Lp(a)), hs-CRP, vitamin D, B12, bicarbonate, and full blood count.","supplementation":"Vitamin D3: 3,000 IU (75 mcg) of cholecalciferol daily, taken with a meal containing fat. Will's vitamin D at 75 nmol/L is right at the lower edge of the optimal range. At a BMI of 29.2, fat tissue sequesters vitamin D, meaning a higher maintenance dose is needed to push into the 90 to 110 nmol/L sweet spot. This should be paired with Vitamin K2 (MK-7) at 100 to 200 mcg daily to ensure calcium is directed to bone rather than soft tissue.\n\nVitamin B12: 1,000 mcg of sublingual methylcobalamin daily, dissolved under the tongue rather than swallowed. Will's B12 at 334 pg/mL is within the laboratory range but below the optimal threshold of 500. B12 supports nerve function, red blood cell formation, and energy production, and suboptimal levels may be contributing to his brain fog and fatigue. Sublingual delivery bypasses the gut and is more reliably absorbed.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports lowering LDL and ApoB, reducing hs-CRP, raising HDL, and improving the ApoB/A1 ratio. It also supports mood, which is one of Will's stated goals. Choose a product that states the EPA and DHA content per serving, not just the total fish oil dose.\n\nMagnesium glycinate: 300 to 400 mg before bed. Will's magnesium at 1.08 mmol/L is within range, but magnesium glycinate supports sleep quality, recovery from training (which he is about to begin), and mood. The glycinate form is well absorbed and less likely to cause gastrointestinal side effects.\n\nThe most important changes from this report are not supplements. They are starting resistance training three times per week, improving diet quality and hitting 145 to 160 grams of protein daily, increasing daily steps, and having the GP conversation about his testosterone and DHEA-S findings.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in the resting state. Will's result of 4.6 mmol/L sits comfortably within the optimal range of 4.0 to 5.4, indicating excellent blood sugar regulation. At a BMI of 29.2 with no structured exercise, this is a genuinely strong result.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, medications such as corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2778","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c (percentage) measures the proportion of haemoglobin in red blood cells that has been glycated, meaning it has had sugar attached to it. It provides a picture of average blood sugar control over the preceding two to three months. Will's result of 5.0% is well below the pre-diabetes threshold of 6.0% and indicates excellent long-term glucose control.","low_causes":"Blood loss, haemolytic anaemia, chronic kidney disease","high_causes":"Insulin resistance, type 2 diabetes, high carbohydrate diet, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the IFCC-standardised unit for glycated haemoglobin, giving the same clinical information as the percentage form. Will's result of 32 mmol/mol is comfortably below the normal ceiling of 42 and within the optimal target of below 36, confirming excellent average blood sugar control over the past two to three months.","low_causes":"Blood loss, haemolytic anaemia, chronic kidney disease","high_causes":"Insulin resistance, type 2 diabetes, high carbohydrate diet, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3481","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3243","upper_optimal_position":"0.4054","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas releases to keep blood sugar stable after an overnight fast. Lower fasting insulin generally indicates better insulin sensitivity, meaning the body's cells respond efficiently to insulin and less is needed. Will's result of 3.6 mIU/L is within the optimal range of 2 to 8 and sits in the lower, healthier part of the range, reflecting excellent insulin sensitivity.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, obesity, polycystic ovary syndrome, high carbohydrate intake, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.479","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1940","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is released in equal amounts to insulin when the pancreas produces insulin. It provides a stable measure of how much insulin the pancreas is making, because unlike insulin, C-Peptide is not cleared rapidly by the liver. Will's result of 0.479 ug/L (approximately 159 pmol/L) is below the laboratory reference range. However, the lab notes that samples not separated within four hours can see C-Peptide fall to 44% of baseline, making pre-analytical degradation the most likely explanation. Given that his glucose, HbA1c, and HOMA-IR are all excellent, this low result almost certainly reflects low insulin demand or sample handling rather than pancreatic insufficiency.","low_causes":"Low insulin demand due to high insulin sensitivity, low carbohydrate diet, sample degradation, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to the effects of insulin. A lower score indicates better insulin sensitivity. Will's result of 0.74 is well within the optimal range and below 1.0, which is considered insulin-sensitive. At a BMI of 29.2 with no structured exercise, this level of insulin sensitivity is a genuine strength and means his body is efficiently managing blood sugar with minimal insulin.","low_causes":"High insulin sensitivity, low carbohydrate diet, regular exercise","high_causes":"Insulin resistance, obesity, sedentary lifestyle, high sugar diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"65.45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2121","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the beta cells of the pancreas are producing insulin relative to the glucose level. Will's calculated HOMA-B is 65.5, below the reference range of 80 to 200. However, this reflects the same picture as his low insulin and C-Peptide: with excellent insulin sensitivity and a fasting glucose of 4.6, the pancreas simply does not need to produce much insulin. This is a sign of metabolic efficiency rather than pancreatic failure. If glucose were elevated alongside a low HOMA-B, the interpretation would be different, but in Will's case the full metabolic picture is reassuring.","low_causes":"Low insulin demand from high insulin sensitivity, low carbohydrate diet, early beta-cell decline (only if glucose is also elevated)","high_causes":"Insulin resistance (compensatory overproduction), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"42.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5424","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5522","units":"%","description":"Transferrin saturation indicates the percentage of the iron-transport protein transferrin that is currently loaded with iron. It provides a snapshot of how much iron is in active circulation. Will's result of 42.96% is within the reference range of 18 to 55% and just above the upper optimal limit of 40%. This is a healthy result, indicating well-balanced iron transport without overload or deficiency.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"28.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6102","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3699","upper_optimal_position":"0.5369","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside transferrin saturation and ferritin. Will's result of 28.7 umol/L is within the reference range and indicates good iron availability.","low_causes":"Iron deficiency, chronic disease, poor dietary intake, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.15","upper_optimal":"3.65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Transferrin is the protein responsible for transporting iron through the bloodstream. Its level reflects the body's iron status and the liver's synthetic function. Will's result of 2.66 g/L is well within range, indicating the body is producing an appropriate amount of iron-transport protein.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"60.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5026","lower_normal":"44","upper_normal":"76.1","lower_optimal":"44","upper_optimal":"76.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"umol/L","description":"Total iron binding capacity measures the maximum amount of iron that transferrin can carry. It is an indirect measure of transferrin levels and helps assess iron status. Will's result of 60.3 umol/L is within the normal range, consistent with balanced iron metabolism.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"178","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5956","units":"ng/mL","description":"Ferritin is the body's primary iron storage protein. It reflects how much iron the body has in reserve. Will's ferritin at 178 ng/mL sits within the optimal range of 50 to 200 for a man, indicating well-stocked iron stores without any suggestion of overload or deficiency.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"146","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. It determines the blood's ability to transport oxygen from the lungs to every tissue in the body. Will's result of 146 g/L falls within the optimal range for a male, confirming good oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, living at altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4067","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^12/L","description":"Red blood cell count measures the total number of red blood cells circulating in the blood. Will's result of 4.72 x10^12/L is within the healthy range, confirming adequate red blood cell production.","low_causes":"Anaemia, blood loss, bone marrow disorders, nutritional deficiencies","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.429","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.4","upper_optimal":"0.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Will's result of 0.429 is within the normal range, indicating a healthy balance between red cells and plasma.","low_causes":"Anaemia, overhydration, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"13.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"Red cell distribution width measures how much variation there is in the size of red blood cells. A narrow RDW means the cells are uniform, which is healthy. Will's result of 13.6% is within the normal range, indicating consistent red blood cell production.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemias, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"89.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4537","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"Mean cell volume measures the average size of red blood cells. It helps identify the type of anaemia if one is present. Will's MCV of 89.5 fL is within the optimal range, indicating normal-sized red blood cells consistent with adequate iron, B12, and folate.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"30.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"27","upper_normal":"32","l netics","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on LDL, VLDL, and Lp(a) particles. Each of these potentially harmful particles carries exactly one ApoB molecule, making ApoB the single best measure of the total number of atherogenic particles in the blood. Will's ApoB at 0.88 g/L is just under the desirable threshold of 0.9 but above the optimal target of 0.8. Given his elevated Lp(a), lowering ApoB as much as possible through lifestyle changes is especially important.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, familial hypercholesterolaemia, obesity, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5786","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the most powerful single predictors of cardiovascular risk. It compares the number of harmful cholesterol particles (ApoB) against the protective capacity (ApoA1). Will's ratio of 0.81 falls in the average-risk band of 0.7 to 0.9, above the lower-risk threshold of 0.7. Reducing this ratio requires both lowering ApoB (through dietary changes and weight loss) and raising ApoA1 (through exercise). With his inherited Lp(a) elevation adding to baseline risk, optimising this ratio is a priority.","low_causes":"Low LDL, high HDL, healthy lifestyle","high_causes":"High LDL, low HDL, obesity, sedentary lifestyle, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"63.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9909","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined lipoprotein particle similar to LDL but with an additional protein called apolipoprotein(a) attached. It promotes cholesterol deposition in arterial walls, encourages blood clot formation, and drives arterial inflammation. Unlike other cardiovascular risk factors, Lp(a) cannot be changed by diet, exercise, or standard lipid-lowering medications. Will's Lp(a) at 63.42 nmol/L is above the 32 nmol/L threshold, placing him in the 'slightly increased risk' category. This is an inherited trait that should be recorded permanently in his medical notes. His first-degree relatives (parents and siblings) should be offered Lp(a) testing. The practical implication is that every modifiable cardiovascular risk factor, including LDL, ApoB, HDL, body composition, blood pressure, blood sugar, and inflammatory markers, becomes more important to optimise.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited); cannot be modified by lifestyle or most medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","res nce.","low_causes":"Poor diet (low fruit and vegetable intake), chronic illness, oxidative stress","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"177","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4964","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles, the heart, and the brain. It is released into the blood when muscle tissue is damaged. Will's CK at 177 U/L is within the normal range, indicating no significant muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"342","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4571","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5817","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal rhythm, peaking in the early morning and declining through the day. Morning cortisol is used to assess adrenal function. Will's result of 342 nmol/L is within the optimal range for a morning sample, indicating normal adrenal function and appropriate stress hormone production.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic fatigue","high_causes s":"Adrenal overactivity, congenital adrenal hyperplasia, rarely testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"1.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3526","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3910","upper_optimal_position":"0.5449","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and signals the testes to produce testosterone. In a man with low testosterone, LH should normally rise as the brain detects insufficient hormone and tries to drive more production. Will's LH at 1.65 mIU/mL is barely above the lower limit of 1.5 and is inappropriately low given his testosterone sitting at the floor of the range. This pattern suggests the problem may lie at the pituitary or hypothalamic level (secondary hypogonadism) rather than the testes themselves, and warrants further investigation.","low_causes":"Pituitary disease, hypothalamic dysfunction, obesity, medications (opioids, anabolic steroids), stress, hyperprolactinaemia","high_causes":"Primary hypogonadism (testicular failure), menopause (females), PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3747","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3866","upper_optimal_position":"0.5181","units":"mIU/mL","description":"Follicle-stimulating hormone (FSH) is produced by the pituitary gland and, in men, stimulates sperm production in the testes. Like LH, Will's FSH at 2.2 mIU/mL sits in the lower portion of the range, consistent with the pattern of low pituitary drive that is contributing to his low testosterone.","low_causes":"Pituitary disease, hypothalamic dysfunction, obesity, medications, stress","high_causes":"Primary testicular failure, ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"8.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, fat distribution, red blood cell production, mood, energy, cognitive function, and libido. Will's testosterone at 8.4 nmol/L sits right at the floor of the laboratory reference range of 8.4 to 28.7 and well below the recommended level of 12 nmol/L. For a 30-year-old man, this is genuinely low. His symptoms of fatigue, brain fog, and difficulty losing weight are all recognised features of low testosterone. The low LH suggests the cause may be at the hypothalamic-pituitary level. Contributing factors may include his BMI of 29.2 (excess body fat increases aromatase conversion of testosterone to oestrogen), sedentary lifestyle, and poor diet quality. Weight loss, resistance training, improved sleep, and stress management can all support natural testosterone production, but given the degree of suppression and the low LH, GP investigation is recommended.","low_causes":"Obesity, pituitary or hypothalamic dysfunction, medications (opioids, corticosteroids), chronic illness, sleep deprivation, excessive alcohol, ageing","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{ function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
