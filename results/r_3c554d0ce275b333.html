<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%}
.mpill-green .mpill-dot{background:var(--green)}.mpill-amber .mpill-dot{background:var(--amber)}.mpill-red .mpill-dot{background:var(--red)}

/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard-green .scard-ic{background:var(--green-soft)}.scard-green .scard-ic svg{color:var(--green)}
.scard-amber .scard-ic{background:var(--amber-soft)}.scard-amber .scard-ic svg{color:var(--amber)}
.scard-red .scard-ic{background:var(--red-soft)}.scard-red .scard-ic svg{color:var(--red)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}
.sb-green{background:var(--green-soft);color:var(--green)}.sb-amber{background:var(--amber-soft);color:var(--amber)}.sb-red{background:var(--red-soft);color:var(--red)}

/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}

const REPORT_DATA = {"patient_name":"Michael Kellett","dob":"16/03/1988","report_date":"2026-07-26","summary":"IMPORTANT: This report contains a finding that we recommend discussing with your GP as a priority. It is explained in full below and listed first in the flags.\n\nMichael is 38, 96kg and 185cm, which puts his BMI at 28.1. He follows a standard mixed diet that he rates 4 out of 10 for quality, eaten in a volume he also rates 4 out of 10. He walks 7,500 to 10,000 steps a day, but does no structured exercise, no cardiovascular sessions and no resistance training. He takes no medication and has no diagnosed conditions. He came to this test with three symptoms, low energy and fatigue, low mood and anxiety, and brain fog, and three goals, to improve energy, to reduce stress and anxiety, and to balance his hormones.\n\nStarting with what is working, because there is a great deal of it. His liver is in good health. ALT and AST, the two enzymes that leak into the blood when liver cells are stressed or damaged, are 23 and 22, both comfortably within the ideal range, and his FIB-4 score of 1.06, a calculation used to screen for liver scarring, is normal. His thyroid, the gland in the neck that sets the pace of metabolism in every cell, is working well across every measure, with TSH 0.93, FT4 17.1 and FT3 6.2, and both thyroid antibody tests negative, which rules out the autoimmune thyroid conditions. His iron picture is healthy throughout, with ferritin, the storage form of iron, at 121 and transferrin saturation, the proportion of the iron transport system actually carrying iron, at 27.43%. His vitamin B12 at 593 and folate at 16 are both within the ideal range, which matters because both are needed for nerve function and mental clarity. His prostate markers are clean, with PSA at 0.97. His coeliac screen is negative. His immune proteins are all normal and his IgE at 28.2 shows minimal allergic burden. His rheumatoid factor is normal. His magnesium at 0.99 is ideal. His urine analysis is normal, and the culture showed mixed growth consistent with sample contamination rather than infection.\n\nThe rest of this report is about two things, and it matters that they are kept separate. One of them is inherited and cannot be changed. Everything else is within Michael's control and is at an early, reversible stage.\n\nTHE INHERITED PART\n\nMichael's Lipoprotein(a), spoken as lipoprotein little a and usually written Lp(a), is 172.55 against an upper limit of 32. That is more than five times the limit, and it is the single most important number in this report.\n\nLp(a) is a cholesterol-carrying particle, similar to LDL, but with an extra protein wrapped around it. That extra protein happens to closely resemble a molecule the body uses to break down blood clots. Because it is similar but not identical, it gets in the way of the clot-clearing process rather than helping it. The result is that Lp(a) particles do three things inside an artery wall rather than one. They deposit cholesterol, they encourage clotting at the site, and they drive inflammation there. Particle for particle, they cause more damage than ordinary LDL.\n\nThe level is set by genetics. It is inherited from parents, it is essentially fixed from childhood, and it does not move meaningfully with diet, exercise, weight loss, or with statins, which are the standard cholesterol medication. This is not a failure of effort and it is not something Michael has caused. It is also not routinely measured, which is why most people who carry a high level never find out. A standard cholesterol test does not include it, and the NHS generally only checks it where there is a family history of early heart disease.\n\nTwo things follow from this. The first is that Michael's cardiovascular risk has been accumulating for longer than his other numbers alone would suggest, so his GP will want to treat the changeable side of the picture more firmly than they might for someone with identical cholesterol and a normal Lp(a). The second is that because it is inherited, close blood relatives, meaning parents, siblings and children, have a meaningful chance of carrying a raised level too, and may want to ask their own GP about being tested.\n\nMichael should ask for this result to be recorded permanently in his medical notes. Treatments designed to lower Lp(a) directly are in late-stage clinical trials and may become available in the coming years, and having the result on record now will matter then.\n\nTHE CHANGEABLE PART\n\nThe rest of the cholesterol picture is elevated well beyond what the Lp(a) alone accounts for, and this part responds to what Michael does.\n\nHis ApoB is 1.86 against a target below 0.9, so more than double. ApoB is worth understanding properly, because it is the most useful cholesterol number on this report. Every single particle capable of burying cholesterol in an artery wall carries exactly one ApoB protein on its surface, so measuring ApoB counts the particles. LDL, by contrast, measures how much cholesterol those particles are carrying between them. The distinction matters because the damage is done by particles colliding with and entering the artery wall, not by the cargo sitting inside them. Two people can have identical LDL results and very different particle counts, and the one with more particles is at greater risk.\n\nSome of Michael's ApoB count comes from the Lp(a), because every Lp(a) particle carries an ApoB protein and is counted in the total. But his LDL at 5.18 against a limit of 3 shows the ordinary, diet-driven component is high in its own right. This is not only a genetic problem.\n\nHis total cholesterol is 7.4 and his non-HDL cholesterol, meaning everything except the protective type, is 6.2 against a limit of 4. His HDL, the protective particle that collects cholesterol back out of artery walls and returns it to the liver for disposal, is 1.2, sitting at the very bottom of where it should be. Because the harmful side is high and the protective side is low, the ratios come out poorly. His total cholesterol to HDL ratio is 6.17 against a limit of 4.5, and his ApoB to ApoA-1 ratio, which compares harmful particles to protective ones, is 1.465 against a limit of 0.7. In plain terms, for every protective particle in his circulation there are roughly one and a half harmful ones.\n\nAlongside these sit the fats that respond fastest to food. His triglycerides, the form fat takes when it travels in the blood, are 2.32 against a limit of 1.7. His VLDL at 1.05 and his remnant cholesterol at 1.02 are both above their limits, and remnant particles are particularly good at lodging in artery walls. His triglyceride to HDL ratio is 1.933 against a limit of 1.5. This group is driven by refined carbohydrate, sugary drinks, alcohol and insulin resistance rather than by dietary fat, and it is also the group that improves quickest, often visibly within six to eight weeks of eating differently.\n\nTHE METABOLIC ENGINE UNDERNEATH\n\nHis HOMA-IR is 1.86 against a limit of 1.5. HOMA-IR is a calculation that compares fasting glucose against fasting insulin to estimate how well cells are responding to insulin. Insulin is the hormone that unlocks cells so glucose can enter and be used for energy. When cells stop responding properly, which is what insulin resistance means, the pancreas compensates by producing more insulin to get the same job done.\n\nThe encouraging detail is that Michael's pancreas is coping well with that extra demand. His insulin at 8.55 and C-Peptide at 542.8, which measures insulin production directly, are both within range, and his fasting glucose at 4.9 is normal as a result. His HbA1c, which reflects average blood sugar over roughly the previous three months by measuring how much sugar has attached to red blood cells, is 37, or 5.6%. That is above the ideal level of 35 but well below 42, the threshold for prediabetes. He is not diabetic and he is not prediabetic. What the numbers show is that the machinery that leads there has started to engage, and this is the stage at which it reverses most easily and most completely.\n\nHis high sensitivity CRP is 3.4 against an ideal level below 1. CRP is made by the liver in response to inflammation anywhere in the body. Fat tissue is not inert storage, it is metabolically active and releases inflammatory signalling molecules called cytokines, and at a BMI of 28.1 this is the most likely source, with a diet high in processed food contributing. His globulin at 36 sits at the top of its range, which fits the same low-grade inflammatory picture.\n\nInflammation matters here because it is the second half of the artery story. Cholesterol particles getting into the artery wall is the first half. Inflammation is what determines whether the resulting deposit stays quiet and stable or becomes the unstable kind that causes sudden problems. Raised ApoB together with raised CRP is a worse combination than either on its own, which is why the CRP is worth taking as seriously as the cholesterol.\n\nWHY MICHAEL FEELS THE WAY HE DOES\n\nHis cortisol is 460. The absolute upper limit is 497 and the ideal ceiling is 400, so this is high but not extreme. Cortisol is the body's principal stress hormone. In short bursts it is useful, raising blood sugar, sharpening attention and mobilising energy. Sustained at this level it does the opposite of what Michael is asking for from this test.\n\nPersistently raised cortisol depletes serotonin and dopamine, the two brain chemicals most involved in mood, motivation and the ability to feel settled, which maps directly onto the low mood and anxiety he describes. It impairs the prefrontal cortex and the hippocampus, the regions responsible for focus, working memory and recall, which is the brain fog. And it drains energy by keeping the body in a state of readiness that is expensive to maintain, which is the fatigue. All three symptoms he reported have the same fingerprint on them.\n\nWhat makes this important rather than merely unfortunate is that it forms a loop. Insulin resistance and inflammation are themselves physical stressors, and the body raises cortisol in response to them. Raised cortisol then worsens insulin resistance and pushes fat storage toward the abdomen, which generates more inflammation. The metabolic findings and the mood findings in this report are not two separate problems that happen to coexist. They are one loop, and it can be broken at any point in the circle.\n\nHis DHEA-S is 995, within the laboratory range but in the lower part of it. DHEA-S is the other major hormone the adrenal glands produce, and it broadly supports energy, mood and resilience. A pattern of cortisol at the high end with DHEA-S at the low end is often seen where the stress response has been running for a sustained period. It is not diagnostic on its own, but it is consistent with everything else here.\n\nOn the hormone-balancing goal specifically, the news is better than expected. His total testosterone is 17.8, just under the ideal threshold of 18, but his free testosterone, the fraction not bound to carrier proteins and therefore actually available to tissues, is 0.419 and sits comfortably within the ideal range. His SHBG, the protein that binds testosterone and takes it out of circulation, is 27.8 and ideal. This is not a testosterone deficiency. It is a testosterone level being held slightly below where it could be by three things, all of them modifiable.\n\nThe first is body fat. Fat tissue contains an enzyme called aromatase that converts testosterone into oestradiol, a form of oestrogen. Michael's oestradiol is 121 against a limit of 146, sitting at the higher end, which is the visible signature of that conversion happening. Less body fat means less conversion, so testosterone rises and oestradiol falls together. The second is the absence of resistance training, which is the strongest natural stimulus for testosterone production there is. The third is the elevated cortisol, because cortisol and testosterone are produced by overlapping pathways and sustained stress tends to favour cortisol.\n\nHis leptin at 12 is above the ideal range. Leptin is produced by fat cells and its job is to tell the brain that enough energy is stored and eating can stop. The more fat tissue present, the more leptin is produced, and when levels stay high the brain gradually stops responding to the signal, in much the same way that cells stop responding to insulin. The practical consequence is that fullness registers less reliably, which makes eating less harder than it should be. This is worth knowing simply so that the difficulty is understood as physiology rather than a failure of willpower.\n\nTHE SMALLER FINDINGS\n\nSeveral results point in the same direction, toward Michael not drinking enough water. His haemoglobin at 167 is near the top of its range, his haematocrit at 0.484 and MCHC at 345 are both at their ceilings, his urine specific gravity at 1.03 is at the upper limit, and his urea at 6.9 and sodium at 145 are both above ideal. Individually none of these matter. Together they describe blood that is slightly concentrated, because when there is less water in circulation everything measured within it reads a little higher. Two to three litres of water a day would correct this, and would very likely take the edge off the fatigue and brain fog on its own.\n\nHis kidney function needs a small amount of explanation. His creatinine at 87 is normal and the eGFR calculated from it is 90 or above, which looks entirely reassuring. However his Cystatin C is 1.08, close to the limit of 1.1, and the eGFR calculated from Cystatin C is 88. These two measures disagree slightly, and where they do, the Cystatin C figure is generally the more reliable one. Creatinine is a waste product of muscle, so muscle mass and body size skew it, whereas Cystatin C is produced by virtually all cells at a steady rate and is far less affected by build. At 38 years old, kidney function should sit comfortably above 90. This is not alarming and there is no protein leaking into his urine, which is the finding that would signal genuine damage. It is a nudge, and the things that improve it are the same things already recommended, which are hydration, less salt, better blood sugar control and weight loss.\n\nHis anion gap is 26.8 against a limit of 16. The anion gap is not measured directly, it is calculated from the balance of sodium, potassium, chloride and bicarbonate. A raised gap can indicate a disturbance in the body's acid balance, but that usually comes with a low bicarbonate, and Michael's bicarbonate at 23.9 is entirely normal. Combined with his high-normal sodium and low-normal chloride, this is most likely a reflection of a high dietary acid and salt load rather than a true acid-base problem. It is worth repeating on the next test.\n\nHis Gamma GT is 53. That is within the range, which goes up to 73, but above the ideal level of 30. GGT is the liver enzyme most sensitive to metabolic workload. It rises with alcohol, which Michael does not report, and with a diet high in processed food, refined fat and sugar, which fits. Since ALT, AST and FIB-4 are all normal, there is no sign of damage or scarring. GGT is usually the first enzyme to move when the liver is handling more fat and sugar than it would like, and it is usually one of the first to come back down when the diet changes.\n\nHis reticulocyte absolute count is 42.2 against a lower limit of 50. Reticulocytes are brand new red blood cells, so this number measures the rate at which the bone marrow is producing replacements. His haemoglobin at 167 is high, so there is no shortage of red cells at present, but production is running slower than it should be. With iron stores, B12 and folate all healthy, the likely explanation is the diet volume and quality both being rated 4 out of 10. It is a quiet reminder that the answer here is eating better rather than simply eating less. His platelet count at 164 is normal but toward the lower end, which fits the same picture.\n\nHis CEA is 3.54 against a limit of 3.8. CEA is a general marker that rises with inflammation in the gut, with smoking and with a number of benign conditions. It is not a cancer test in isolation and this result is within range. Given the raised CRP and the diet, gut inflammation is the most probable explanation. It should simply be repeated at the next test to confirm it is stable or falling.\n\nHis vitamin D is 92, below the ideal level of 100. Vitamin D acts more like a hormone than a vitamin and is involved in mood, immune function and bone health. In the UK, sunlight is too weak between October and March for the skin to make any, so supplementation through those months is sensible for almost everyone.\n\nHis potassium at 3.7 is below ideal while his sodium at 145 is above it. That combination is a fairly direct readout of a diet containing more processed food than plants, since processed food supplies sodium and fruit, vegetables and pulses supply potassium. The balance between the two has a real influence on blood pressure, which is worth attending to given everything else in this report.\n\nWHAT THIS ALL MEANS\n\nMichael has two clocks running. One of them, the Lp(a), he cannot change, and he has been carrying it since birth without knowing. The other, which covers his cholesterol, his blood sugar, his inflammation, his cortisol and his hormones, is entirely responsive to what he does from here.\n\nBecause the first clock cannot be slowed, the second one matters more for him than it would for most people, not less. That is the central message of this report and it is the reason the GP conversation should happen soon.\n\nThe genuinely encouraging part is how early everything else is. He is not diabetic. His liver has no scarring. His kidneys are working. His thyroid is healthy. His testosterone is nearly ideal and his free testosterone already is. His nutrient levels are good. Nothing here has become a disease. What the blood is showing is a set of processes at the beginning of their course, at exactly the point where ordinary changes produce large returns.","links":"There are four things to do, and they are listed in order of importance.\n\nTHE GP CONVERSATION\n\nThis is the priority and it should not wait for the lifestyle changes to take effect. Michael should book an appointment and take this report, or at least the flags section, with him. The specific things to raise are the Lp(a) of 172.55, which is the inherited cholesterol particle that cannot be changed by lifestyle, the ApoB of 1.86, which counts the cholesterol particles capable of entering artery walls, and the LDL of 5.18.\n\nA GP or cardiologist can calculate his overall cardiovascular risk formally, using tools that take the Lp(a) into account, and can advise on whether cholesterol-lowering medication is appropriate. It is worth knowing in advance that statins do not lower Lp(a). What they do lower is the ordinary LDL and the total ApoB count, and since Michael cannot reduce the inherited component, reducing everything around it becomes more valuable. He should also ask for the Lp(a) result to be added permanently to his medical record, and mention it to close blood relatives, since it runs in families.\n\nEXERCISE\n\nMichael currently does no structured exercise at all, which means this is the change with the most available upside. It is also the single intervention that touches every finding in this report at once.\n\nResistance training, meaning weights or bodyweight work, twice a week is the highest priority of the two types. It is the strongest natural stimulus for testosterone production, which addresses the hormone goal directly. It builds muscle, and muscle is the body's largest site for clearing glucose from the blood, which improves the insulin resistance shown by the HOMA-IR of 1.86. Two sessions of forty to fifty minutes covering the main movement patterns, meaning a push, a pull, a squat or leg press, and a hinge or deadlift variation, is enough to start. Beginners gain quickly.\n\nCardiovascular exercise once or twice a week does a different job. It is the most reliable way to raise HDL, the protective cholesterol that is currently sitting at its floor of 1.2, and it lowers triglycerides, currently 2.32. It also regulates cortisol, currently 460. That last point is worth explaining, because it sounds contradictory. Exercise raises cortisol sharply during the session itself, but the body responds by lowering its resting baseline over the following weeks. A stress hormone system with no physical outlet stays elevated. One that is used regularly settles down. Brisk walking that leaves him slightly breathless, cycling or swimming for thirty to forty minutes all qualify.\n\nThe mood, energy and mental clarity benefits typically arrive within two to three weeks, well before any of the blood markers move.\n\nFOOD\n\nThe diet is rated 4 out of 10 for quality and it is driving the changeable half of the cholesterol picture, the triglycerides, the CRP inflammation of 3.4, the GGT of 53 and the insulin resistance. The changes that matter most are specific rather than general.\n\nFor the ApoB and LDL, the relevant lever is saturated fat, which is found in processed meat, pastries, fried food, butter and full-fat dairy, and it should come down. Replacing some of it with olive oil, nuts, avocado and oily fish helps, because these lower the harmful particles rather than simply not raising them. Soluble fibre, from oats, beans, lentils and apples, binds cholesterol in the gut and removes it from the body, and is one of the few dietary levers that reduces ApoB directly.\n\nFor the triglycerides of 2.32, the relevant levers are sugary drinks, refined carbohydrate and alcohol. These respond fast, often within a few weeks.\n\nFor the inflammation and the GGT, the lever is processed food volume generally. Cooking three or four simple meals a week rather than relying on convenience food covers most of this on its own.\n\nFor the sodium at 145 and potassium at 3.7, the fix is the same one, since processed food supplies sodium while vegetables, fruit and pulses supply potassium. Two portions of vegetables a day would shift both.\n\nAt 96kg and 185cm with the current step count and no formal exercise, Michael's maintenance intake is roughly 2,500 to 2,800 calories a day. To lose weight steadily without feeling deprived, 2,200 to 2,400 calories is the target. Protein should be at least 130 to 155g a day, which is important both for retaining muscle while losing weight and because protein is more satisfying per calorie than anything else, which is useful given the leptin picture. Practical sources are chicken, fish, eggs, Greek yoghurt, cottage cheese, lean mince and pulses.\n\nA loss of 5 to 7kg, taking him from 96kg to roughly 89 to 91kg and his BMI from 28.1 to around 26, would be expected to improve insulin resistance, lower CRP, reduce triglycerides, lower the oestradiol currently at 121 and raise testosterone from its current 17.8. That is a realistic target over three to six months at roughly half a kilogram a week.\n\nWATER\n\nThe simplest change on the list. Two to three litres a day. The concentrated blood picture, meaning the haemoglobin of 167, the haematocrit of 0.484, the urine specific gravity of 1.03 and the urea of 6.9, should resolve, and it supports the kidney function shown by the Cystatin C of 1.08. Of everything here, this is the change most likely to produce a noticeable difference to the fatigue and brain fog within days rather than weeks.\n\nRETESTING\n\nA follow-up test in twelve weeks would show whether the changes are working. The markers worth repeating are the full cholesterol panel including ApoB, HbA1c and HOMA-IR for blood sugar, CRP for inflammation, cortisol, testosterone and oestradiol, Cystatin C for kidney function, GGT for the liver, CEA to confirm it is stable, the anion gap, and vitamin D. The Lp(a) does not need repeating, since it does not change.","flags":"DISCUSS WITH GP AS A PRIORITY\n\nLipoprotein(a) at 172.55, against a limit of 32. Lp(a) is an inherited cholesterol particle that also promotes clotting and inflammation in artery walls. It is fixed by genetics and does not respond to diet, exercise or statins. Ask for it to be recorded permanently in medical notes. Close blood relatives may also carry a raised level. GP or cardiologist assessment of overall cardiovascular risk is recommended.\n\nApoB at 1.86, against a target below 0.9. ApoB counts the cholesterol particles capable of entering artery walls. More than double the target. Partly driven by the Lp(a), partly by diet.\n\nLDL cholesterol at 5.18, against a limit of 3.\n\nTotal cholesterol 7.4. Non-HDL cholesterol 6.2, against a limit of 4. Total cholesterol to HDL ratio 6.17, against a limit of 4.5. ApoB to ApoA-1 ratio 1.465, against a limit of 0.7. HDL, the protective cholesterol, at 1.2, sitting at its floor.\n\nCARDIOVASCULAR AND METABOLIC\n\nTriglycerides at 2.32, against a limit of 1.7. VLDL at 1.05, against a limit of 0.78. Remnant cholesterol at 1.02, against a limit of 0.8. Triglyceride to HDL ratio at 1.933, against a limit of 1.5. This group is diet and insulin driven and responds quickly to change.\n\nHOMA-IR at 1.86, against a limit of 1.5. This is a calculation estimating how well cells respond to insulin, the hormone that lets glucose into cells. Insulin resistance confirmed. Pancreas compensating well, with insulin at 8.55, C-Peptide at 542.8 and fasting glucose normal at 4.9.\n\nHbA1c at 37, or 5.6%, above the ideal 35 but below the prediabetes threshold of 42. HbA1c reflects average blood sugar over three months. Not diabetic, not prediabetic, but trending.\n\nHigh sensitivity CRP at 3.4, against an ideal below 1. CRP indicates inflammation. Raised inflammation alongside raised ApoB is a worse combination than either alone. Globulin at 36, at the top of its range, fits the same picture.\n\nHORMONES\n\nCortisol at 460, above the ideal ceiling of 400, limit 497. The main stress hormone. Explains the fatigue, the low mood and anxiety, and the brain fog. Also worsens insulin resistance, forming a loop with the metabolic findings.\n\nDHEA-S at 995, within the laboratory range but in its lower part. The other main adrenal hormone, supporting energy and resilience. High cortisol with low DHEA-S is consistent with a sustained stress response.\n\nTestosterone at 17.8, marginally below the ideal 18. Free testosterone at 0.419 is within ideal, so this is not a deficiency. Being held down by body fat, absence of resistance training, and the raised cortisol. All modifiable.\n\nOestradiol at 121, against a limit of 146, at the higher end. Fat tissue converts testosterone into oestradiol via an enzyme called aromatase. Weight loss lowers it.\n\nLeptin at 12, above ideal. Leptin is the fullness hormone made by fat cells. Sustained high levels reduce the brain's response to it, so fullness registers less reliably.\n\nKIDNEY, LIVER AND OTHER\n\nCystatin C at 1.08, close to the limit of 1.1, with a Cystatin C eGFR of 88, below the ideal 90. Cystatin C is the more reliable measure of kidney function than creatinine, which is skewed by muscle mass. Mildly reduced for age 38. No protein in urine. Supported by hydration, less salt and better blood sugar control.\n\nAnion gap at 26.8, against a limit of 16. Calculated from sodium, potassium, chloride and bicarbonate rather than measured directly. Bicarbonate is normal at 23.9, which argues against a true acid-base disturbance. Most likely reflects the high salt and dietary acid load. Repeat at next test.\n\nGamma GT at 53, within the range which goes to 73, but above the ideal 30. The liver enzyme most sensitive to metabolic load. ALT, AST and FIB-4 all normal, so no damage or scarring. Diet-driven, and usually quick to improve.\n\nReticulocyte absolute at 42.2, against a lower limit of 50. Reticulocytes are new red blood cells, so this measures production rate. Haemoglobin is not low, and iron, B12 and folate are all healthy, so this most likely reflects the diet volume and quality. Platelets at 164, normal but toward the lower end.\n\nCEA at 3.54, against a limit of 3.8. A general marker raised by gut inflammation and other benign causes, not a cancer test in isolation. Within range. Repeat at next test to confirm stability.\n\nVitamin D at 92, below the ideal 100.\n\nSodium at 145 above ideal with potassium at 3.7 below ideal. Reflects processed food intake relative to plants. Relevant to blood pressure.\n\nHaemoglobin 167, haematocrit 0.484, MCHC 345 and urine specific gravity 1.03 all at or near their ceilings, with urea at 6.9. Together these indicate mild chronic dehydration rather than any individual problem.","recommendations":"Book a GP appointment to discuss the Lipoprotein(a) of 172.55, the inherited cholesterol particle, alongside the ApoB of 1.86 and the LDL of 5.18. Request that the Lp(a) is recorded permanently in the medical notes, and let close blood relatives know it runs in families.\n\nBegin resistance training, meaning weights or bodyweight work, twice a week, plus one or two cardiovascular sessions such as brisk walking, cycling or swimming.\n\nReduce saturated fat and processed food, increase soluble fibre from oats, beans and lentils, add oily fish, and cut sugary drinks and refined carbohydrate. Aim for 2,200 to 2,400 calories and at least 130 to 155g of protein daily.\n\nDrink two to three litres of water a day.\n\nTarget a loss of 5 to 7kg over three to six months, taking BMI from 28.1 to around 26.\n\nRetest in twelve weeks, covering the full cholesterol panel with ApoB, HbA1c, HOMA-IR, CRP, cortisol, testosterone, oestradiol, Cystatin C, GGT, CEA, anion gap and vitamin D. The Lp(a) does not need repeating.","supplementation":"Vitamin D3 at 2,000 to 3,000 IU daily, taken with a meal containing fat since it is fat soluble, alongside vitamin K2 as MK-7 at 100 micrograms. His level is 92, below the ideal 100. K2 is included because it helps direct calcium into bone rather than into artery walls, which is worth having in place given the cholesterol picture.\n\nOmega-3 fish oil providing 2 to 3g of combined EPA and DHA daily, taken with food. This is the most useful supplement on the list for Michael specifically. It lowers triglycerides, currently 2.32, more effectively than any other supplement, it has a genuine anti-inflammatory effect relevant to the CRP of 3.4, and it supports mood.\n\nMagnesium glycinate at 400mg before bed. The glycinate form is chosen because it absorbs well and does not upset the stomach the way cheaper forms can. It supports sleep quality, has a calming effect relevant to the anxiety, and modestly improves insulin sensitivity, relevant to the HOMA-IR of 1.86.\n\nCreatine monohydrate at 3 to 5g daily is worth adding once the resistance training is established, taken at any time of day. It improves strength and recovery, and there is growing evidence it supports mental clarity.\n\nNone of these are the main event. The most impactful actions from this report are the GP conversation about the Lipoprotein(a) and the cholesterol, starting resistance training twice a week, and improving the diet. Those three changes would address the cardiovascular risk, the insulin resistance, the inflammation, the cortisol and every symptom Michael reported, and they would do it far more effectively than anything in a bottle.","biomarkers":[{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583333333","upper_optimal_position":"0.625","units":"g/L","description":"Wi
