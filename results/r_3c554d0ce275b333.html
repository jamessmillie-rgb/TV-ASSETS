s":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"24","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5925925926","units":"g/L","description":"At the upper boundary of range at 36. Elevated globulin can reflect chronic low-grade inflammation, consistent with the CRP at 3.4 (above optimal)","low_causes":"Immune deficiency","high_causes":"Chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.35","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"Ratio","description":"Within range but at the lower end, reflecting the elevated globulin","low_causes":"Liver disease","high_causes":"Not significant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3655","lower_normal":"","upper_normal":"1.45","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3448275862","units":"","description":"Within range. No liver scarring despite the elevated GGT","low_causes":"Not applicable","high_causes":"Liver fibrosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7115","lower_normal":"","upper_normal":"5.2","lower_optimal":"","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4326923077","units":"mmol/L","description":"Significantly above range at 7.4. This is one of the most important areas of this report and is discussed in detail below","low_causes":"Very low rare","high_causes":"Genetics, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8633","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333333333","units":"mmol/L","description":"The harmful type of cholesterol that deposits inside artery walls. Significantly above range at 5.18, more than 1.7 times the upper limit of 3. At 38, this level of LDL means cholesterol has been actively accumulating in the artery walls for years. Some of this elevation is genetic (the Lp(a) at 172.55 confirms a major inherited component) and some is being driven by the diet and lifestyle. A GP needs to assess the overall cardiovascular risk and discuss whether lipid-lowering medication is appropriate","low_causes":"Very low rare","high_causes":"Genetics (Lp(a)), poor diet, no exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6","lower_normal":"1.0","upper_normal":"","lower_optimal":"1.2","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6","upper_optimal_position":"","units":"mmol/L","description":"The protective cholesterol particle, which collects cholesterol back out of artery walls and returns it to the liver for disposal. At 1.2 it sits at the very bottom of where it should be, so that protective capacity is minimal at the point it is most needed. Cardiovascular exercise is the most reliable way to raise it, and with no structured exercise currently, there is considerable room to improve. Losing weight and replacing saturated fat with olive oil, nuts and oily fish also help","low_causes":"Sedentary lifestyle, no exercise","high_causes":"Exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6824","lower_normal":"","upper_normal":"1.7","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2941176471","units":"mmol/L","description":"Above range at 2.32, against a limit of 1.7. Triglycerides are the form fat takes when travelling in the blood. They are driven less by dietary fat than by refined carbohydrate, sugary drinks, alcohol and insulin resistance. The upside is that they respond faster than any other cholesterol marker, often visibly within six to eight weeks of dietary change","low_causes":"Very low rare","high_causes":"Poor diet, insulin resistance, processed food","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterolratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6856","lower_normal":"","upper_normal":"4.5","lower_optimal":"","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","units":"Ratio","description":"Significantly above range at 6.17 (limit 4.5). This ratio captures the balance between total and protective cholesterol, and at 6.17 it indicates significant cardiovascular risk. The low HDL (1.2) combined with the very high total cholesterol (7.4) creates this unfavourable balance","low_causes":"Low TC or high HDL","high_causes":"Low HDL, elevated TC","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdloftotal","name":"HDL % of total","group":"LIPIDS & CARDIOVASCULAR","result":"16.22","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"%","description":"Only 16% of all cholesterol is the protective type. Ideally this should be above 25 to 30%","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdlcholesterol","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.775","lower_normal":"","upper_normal":"4","lower_optimal":"","upper_optimal":"3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.375","units":"mmol/L","description":"Significantly above range at 6.2 (limit 4). All cholesterol minus the protective HDL","low_causes":"Very low rare","high_causes":"Genetics, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6731","lower_normal":"","upper_normal":"0.78","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3205128205","units":"mmol/L","description":"Above range at 1.05. Carries triglycerides and contributes to artery wall deposits","low_causes":"Rarely significant","high_causes":"Insulin resistance, processed food","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteina1","name":"Apolipoprotein A-1","group":"LIPIDS & CARDIOVASCULAR","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3516","lower_normal":"1.22","upper_normal":"2.13","lower_optimal":"1.6","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4725274725","upper_optimal_position":"0.619047619","units":"g/L","description":"Protective cholesterol protein. Within range but below optimal at 1.27. Exercise would raise ApoA-1","low_causes":"Similar to low HDL","high_causes":"Exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","units":"g/L","description":"Above the target at 1.86, more than double the 0.9 threshold. ApoB is the most useful cholesterol number on this report and it is worth understanding why.\n\nEvery particle capable of burying cholesterol in an artery wall carries exactly one ApoB protein on its surface. Measuring ApoB therefore counts the particles. LDL, by contrast, measures how much cholesterol those particles are carrying between them. The damage is done by particles entering the artery wall, not by the cargo inside them, so the count is the more meaningful number. Two people can have identical LDL results and very different particle counts, and the one with more particles carries more risk.\n\nPart of this total comes from the Lp(a) at 172.55, since every Lp(a) particle carries an ApoB protein and is included in the count. But the LDL at 5.18 shows the ordinary, diet-driven component is high in its own right, so this is not purely genetic. The changeable portion responds to reducing saturated fat, increasing soluble fibre from oats, beans and lentils, and losing weight","low_causes":"Very low rare","high_causes":"Genetics (Lp(a)), poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.465","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"","upper_normal":"0.7","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3571428571","units":"Ratio","description":"Significantly above the threshold at 1.465, more than twice the 0.7 limit. The harmful particles vastly outnumber the protective ones. The most unfavourable ratio in this report and a strong indicator of cardiovascular risk","low_causes":"High ApoA-1","high_causes":"Genetics, poor diet, no exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.933","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6443","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3","units":"Ratio","description":"Above the 1.5 threshold at 1.933. This ratio is a strong predictor of insulin resistance and metabolic syndrome. At 1.933, it confirms the HOMA-IR finding of insulin resistance and indicates the metabolic dysfunction is being reflected across multiple markers","low_causes":"Very low TG, high HDL","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6375","lower_normal":"","upper_normal":"0.8","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3125","units":"mmol/L","description":"Above range at 1.02. Remnant particles are particularly damaging to artery walls and are driven by triglyceride elevation and insulin resistance","low_causes":"Very low TG","high_causes":"Metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"172.55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.21875","units":"nmol/L","description":"Significantly above range at 172.55, more than five times the upper limit of 32. This is the most important single result in this report.\n\nLp(a), spoken as lipoprotein little a, is a cholesterol-carrying particle similar to LDL but with an extra protein wrapped around it. That protein closely resembles a molecule the body uses to dissolve blood clots. Because it is similar but not identical, it interferes with clot clearing rather than assisting it. The result is that an Lp(a) particle does three things inside an artery wall where ordinary LDL does one. It deposits cholesterol, it promotes clotting at the site, and it drives local inflammation. Particle for particle it causes more damage.\n\nThe level is inherited and essentially fixed from childhood. It does not respond to diet, exercise, weight loss, or to statins. It is also not part of a standard cholesterol test, which is why most people carrying a raised level never find out.\n\nTwo things follow. Because the risk has been accumulating longer than the other numbers alone suggest, the changeable side of the cholesterol picture becomes more important to address, not less. And because it is genetic, parents, siblings and children have a meaningful chance of carrying a raised level too and may want to ask their own GP about testing.\n\nThis result should be recorded permanently in medical notes. Treatments that lower Lp(a) directly are in late-stage clinical trials","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.52","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.2","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4266666667","upper_optimal_position":"0.5333333333","units":"mmol/L","description":"Within range","low_causes":"Excessive insulin","high_causes":"Prediabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4405","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4166666667","units":"mmol/mol","description":"At 37, or 5.6%. HbA1c reflects average blood sugar over roughly the previous three months by measuring how much sugar has attached itself to red blood cells. This is above the ideal level of 35 but well below 42, which is the threshold for prediabetes. Michael is neither diabetic nor prediabetic. Taken with the HOMA-IR of 1.86, what this shows is the early stage of the process that leads there, at the point where it reverses most easily","low_causes":"Iron deficiency","high_causes":"Poor diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"8.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4223","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393124066","upper_optimal_position":"0.4439461883","units":"mIU/L","description":"Within range at 8.55","low_causes":"Low production","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"542.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4134","lower_normal":"240","upper_normal":"1500","lower_optimal":"400","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3756613757","upper_optimal_position":"0.4814814815","units":"pmol/L","description":"Within range at 542.8. Pancreas producing adequate insulin. The issue is cellular resistance, not production","low_causes":"Low output","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7867","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","units":"Ratio","description":"Above the limit at 1.86, against 1.5. HOMA-IR compares fasting glucose against fasting insulin to estimate how well cells are responding to insulin, the hormone that unlocks cells so glucose can enter and be used for energy. When cells respond poorly, which is what insulin resistance means, the pancreas produces more insulin to achieve the same result.\n\nThe reassuring detail is that the pancreas is coping. Insulin at 8.55 and C-Peptide at 542.8 are both within range, and fasting glucose is normal at 4.9 as a result. Combined with triglycerides at 2.32 and CRP at 3.4, this is the early pattern of metabolic syndrome. At BMI 28.1 with no structured exercise and a diet rated 4 out of 10, the drivers are clear and the process is at the stage where it reverses most completely. Building muscle matters here because muscle is the body's largest site for clearing glucose from the blood","low_causes":"High sensitivity","high_causes":"Obesity, poor diet, no exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"122.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4503","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"Within range at 122.1. The pancreas is producing adequate insulin. The issue is resistance, not production","low_causes":"Efficient sensitivity","high_causes":"Overcompensating","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity CRP","group":"INFLAMMATION","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.34","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.1","units":"mg/L","description":"At 3.4, within the laboratory range but well above the ideal level of 1. CRP is produced by the liver in response to inflammation anywhere in the body. Fat tissue is not inert storage, it is metabolically active and releases inflammatory signalling molecules called cytokines, and at BMI 28.1 that is the most likely source, with processed food contributing.\n\nThis matters alongside the cholesterol rather than separately from it. Cholesterol particles entering the artery wall is the first half of the process. Inflammation determines whether the resulting deposit stays quiet and stable or becomes the unstable kind. Raised ApoB together with raised CRP is a worse combination than either alone. Weight loss and reducing processed food both lower it","low_causes":"Rarely significant","high_causes":"Obesity, poor diet, systemic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"","upper_normal":"12","lower_optimal":"","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2083333333","units":"mm/hour","description":"Within range at 8","low_causes":"Rarely significant","high_causes":"Infection, autoimmune","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"INFLAMMATION","result":"1.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"Ratio","description":"Within range at 1.0, at the lower boundary","low_causes":"Viral infection","high_causes":"Systemic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"145","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.641","lower_normal":"133","upper_normal":"146","lower_optimal":"138","upper_optimal":"142","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4615384615","upper_optimal_position":"0.5641025641","units":"mmol/L","description":"Within range but above optimal. A processed food diet is typically very high in sodium","low_causes":"Overhydration","high_causes":"Poor diet (high sodium)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3704","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"4","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4259259259","upper_optimal_position":"0.5740740741","units":"mmol/L","description":"Within range at 3.7 but below ideal, while sodium sits at 145, above ideal. That combination is a fairly direct readout of a diet containing more processed food than plants, since processed food supplies sodium while vegetables, fruit and pulses supply potassium. The balance between the two influences blood pressure, which is worth attending to given the rest of this report","low_causes":"Poor diet (low fruit/veg)","high_causes":"Kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"104","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4102564103","upper_optimal_position":"0.5641025641","units":"mmol/L","description":"Within optimal","low_causes":"Vomiting","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4515","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939393939","upper_optimal_position":"0.5757575758","units":"mmol/L","description":"Within range","low_causes":"Metabolic acidosis","high_causes":"Metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5731","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4619883041","upper_optimal_position":"0.5789473684","units":"mmol/L","description":"Within optimal","low_causes":"Vitamin D deficiency","high_causes":"Hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.575","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","units":"mmol/L","description":"Within optimal","low_causes":"Vitamin D deficiency","high_causes":"Hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5977","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172413793","upper_optimal_position":"0.6034482759","units":"mmol/L","description":"Within optimal. Magnesium supports mood (relevant to the low mood and anxiety), sleep quality, and insulin sensitivity (relevant to the HOMA-IR 1.86). Supplementing before bed may support the mood and stress goals","low_causes":"Stress","high_causes":"Kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"26.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mEq/L","description":"Above range at 26.8, against a limit of 16. The anion gap is not measured directly. It is calculated from the balance of sodium, potassium, chloride and bicarbonate. A raised gap can indicate a disturbance in the body's acid balance, but that normally comes with a low bicarbonate, and the bicarbonate here is entirely normal at 23.9. Combined with sodium at the high end and chloride at the low end of normal, this most likely reflects a high dietary salt and acid load rather than a genuine acid-base problem. Worth repeating on the next test","low_causes":"Hypoalbuminaemia","high_causes":"Dietary acid, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5214","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3760683761","upper_optimal_position":"0.547008547","units":"umol/L","description":"Within range","low_causes":"Low muscle mass","high_causes":"Kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"","units":"mL/min/1.73m2","description":"At 90 or above by creatinine. The Cystatin C eGFR at 88 suggests true kidney function is slightly below the optimal level of 90. At 38, kidney function should be comfortably above 90","low_causes":"CKD","high_causes":"Higher is better","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4909","lower_normal":"","upper_normal":"1.1","lower_optimal":"","upper_optimal":"0.85","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3863636364","units":"mg/L","description":"At 1.08, close to the limit of 1.1, with a Cystatin C eGFR of 88 against an ideal of 90 or above. This disagrees slightly with the creatinine-based eGFR, which reads 90 or above, and where the two differ the Cystatin C figure is generally more reliable. Creatinine is a waste product of muscle, so muscle mass and body size skew it, whereas Cystatin C is produced by virtually all cells at a steady rate.\n\nAt 38, kidney function should sit comfortably above 90. This is not alarming, and there is no protein leaking into the urine, which is the finding that would indicate genuine damage. The things that support it are the same ones alrea ll three would be expected to lift it above the ideal threshold","low_causes":"Obesity, no exercise, cortisol suppression","high_causes":"Steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone","group":"HORMONES","result":"0.419","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5158","lower_normal":"0.2","upper_normal":"0.6","lower_optimal":"0.3","upper_optimal":"0.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","units":"nmol/L","description":"Within optimal at 0.419. Despite the marginally suboptimal total testosterone, the free testosterone is healthy. This is a positive finding","low_causes":"Low total T, high SHBG","high_causes":"Low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeandrogenindex","name":"Free Androgen Index","group":"HORMONES","result":"64.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4279","lower_normal":"30","upper_normal":"150","lower_optimal":"70","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5833333333","units":"Ratio","description":"Within range but below optimal at 64.03","low_causes":"Low T, high SHBG","high_causes":"Low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"27.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4055","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"20","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3518900344","upper_optimal_position":"0.5580756014","units":"nmol/L","description":"Within optimal","low_causes":"Obesity, insulin resistance","high_causes":"Aging","padding" "key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3523","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455964326","upper_optimal_position":"0.5685618729","units":"nmol/L","description":"Within range. Progesterone supports mood and has calming effects on the brain","low_causes":"Adrenal insufficiency","high_causes":"Stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"243","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"45","upper_normal":"375","lower_optimal":"100","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5909090909","units":"mIU/L","description":"Within optimal","low_causes":"Rarely significant","high_causes":"Stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"460","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6287","lower_normal":"172","upper_normal":"497","lower_optimal":"250","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133333333","upper_optimal_position":"0.5671794872","units":"nmol/L","description":"At 460, above the ideal ceiling of 400 though below the absolute limit of 497. Cortisol is the body's main stress hormone. In short bursts it is useful, raising blood sugar, sharpening attention and mobilising energy. Sustained at this level it produces the opposite.\n\nIt depletes serotonin and dopamine, the brain chemicals governing mood, motivation and the ability to feel settled, which matches the low mood and anxiety reported. It impairs the prefrontal cortex and hippocampus, the regions handling focus, working memory and recall, which is the brain fog. And it drains energy by maintaining a state of readiness that is expensive to sustain, which is the fatigue.\n\nIt also forms a loop with the metabolic findings. Insulin resistance and inflammation are physical stressors that raise cortisol, and raised cortisol worsens insulin resistance and drives fat storage toward the abdomen, which generates more inflammation. Exercise is the most effective way to break the loop. It raises cortisol sharply during the session but lowers the resting baseline over the following weeks","low_causes":"Adrenal insufficiency","high_causes":"Chronic stress, metabolic syndrome, no exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-S","group":"HORMONES","result":"995.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3592","lower_normal":"700","upper_normal":"4500","lower_optimal":"2000","upper_optimal":"4000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4473684211","upper_optimal_position":"0.6228070175","units":"ug/L","description":"At 995, within the laboratory range but in its lower part. DHEA-S is the other major hormone produced by the adrenal glands alongside cortisol, and it broadly supports energy, mood and resilience. A pattern of cortisol at the high end with DHEA-S at the low end is often seen where a stress response has been running for a sustained period. It is not diagnostic on its own, but it fits the rest of the picture here","low_causes":"Sustained stress response, adrenal balance","high_causes":"Adrenal overactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"leptin","name":"Leptin","group":"HORMONES","result":"12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7368","lower_normal":"0.5","upper_normal":"10 // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}

      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

}
