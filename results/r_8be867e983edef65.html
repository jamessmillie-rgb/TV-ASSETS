<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Roberta Leonaviciute","dob":"29/09/1993","report_date":"2026-11-07","summary":"Patient is a 33-year-old female presenting with a BMI of 40.5, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food daily; portions are larger than average (volume 7 out of 10). She does no cardio or resistance training and takes 2,000 to 5,000 steps a day. She sleeps eight or more hours but feels tired most mornings, with energy low all day. Stress feels hard to manage constantly. She does not drink alcohol. She supplements with magnesium. She has a diagnosis of polycystic ovary syndrome (PCOS). She reports low energy and fatigue, irregular periods, weight gain and difficulty losing weight, and low mood and anxiety, all of which she describes as having been present always. Her goals are to improve energy levels, lose body fat, and balance her hormones. This is her first blood test.\n\nThe finding that needs to go to her GP first is the thyroid. Her TSH, the hormone the brain sends to tell the thyroid to work harder, is 6.79, well above the upper limit of 4.78. At the same time, her thyroid peroxidase antibodies (TPO) are above 400, far beyond the upper limit of 13.8, and her thyroglobulin antibodies are 81.5 against a limit of 4.4. This pattern, a raised TSH with strongly positive antibodies against both thyroid proteins, is the hallmark of a condition called Hashimoto's thyroiditis, in which the immune system gradually attacks the thyroid gland. Her free T4 at 12.8 is only just inside the lower end of the laboratory range of 11.5 to 22.7, confirming the thyroid is struggling to maintain its output. Her free T3 at 4.9 sits within the laboratory range, which means the gland is still converting adequately for now, but the margin is thin. The raised TSH is the brain pushing harder and harder to squeeze output from a thyroid that is under immune assault, and that effort is showing in the T4 result. Hashimoto's is extremely relevant to almost every symptom she has reported. An underactive thyroid slows metabolism, which promotes weight gain and makes weight loss feel impossible. It causes fatigue and low energy, brain fog, low mood, and menstrual irregularity, all of which she describes. It also slows the clearance of LDL cholesterol from the blood, which connects directly to her lipid findings below. Starting thyroid replacement is a GP decision, but this is the single change most likely to improve how she feels day to day, and we would strongly recommend she discusses it at her earliest opportunity.\n\nBefore turning to the other findings, there is a good deal of reassurance in these results. Her full blood count is in excellent shape. Haemoglobin at 141 sits in the upper half of the female range of 120 to 150, meaning she is not anaemic and her bone marrow is producing red cells well. Her white cell count at 6, with a healthy spread of neutrophils at 2.84 and lymphocytes at 2.65, shows a well-functioning immune system with no sign of infection or suppression. Her platelets at 279 are comfortably within range. Her liver is doing a good job under difficult circumstances. At a BMI of 40.5, the liver is handling a significant metabolic load, and despite that, her ALT at 34 is within the female-appropriate range, her AST at 24 is healthy, her GGT at 26 is within range, and her bilirubin at 9 is clean. The FIB-4 score, which estimates whether there is any scarring in the liver, is 0.49, well within the safe range. The APRI score at 0.215 and the NAFLD Fibrosis Score at minus 2.481 both make significant liver fibrosis very unlikely. Her amylase at 47 and lipase at 49 show her pancreas is healthy. Kidney function measured by creatinine gives an eGFR above 90, and her urea, sodium, chloride and bicarbonate are all well within range. Calcium at 2.36, corrected calcium at 2.31, phosphate at 1 and parathyroid hormone at 3.4 are all within their respective ranges, meaning her bone mineral metabolism is in order. Her magnesium at 0.89 sits within the optimal band of 0.85 to 1.05, which is reassuring and suggests her magnesium supplement is doing its job. Her IgA, IgM, and IgE are all within range, her rheumatoid factor is negative, and her tissue transglutaminase is negative, making coeliac disease and rheumatoid arthritis very unlikely. Her tumour markers, CA125 at 16.1, CA15-3 at 9, CA19-9 at 1.9 and CEA at 0.61, are all comfortably within their reference ranges. Her urine is clean, with no protein, glucose, ketones, casts or nitrites, and white cells below 1. Her cortisol at 395 is well within the morning reference range, and her prolactin at 298 is within the non-pregnant female range.\n\nHer PhenoAge, a composite marker that estimates biological age from blood results including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes back at 24.2 against her calendar age of 33, nearly nine years younger. That is a genuinely positive result and shows that, despite her weight and symptoms, her body is coping well at a cellular level.\n\nThe most significant metabolic finding alongside the thyroid is insulin resistance. Her insulin is 15.86, which is within the laboratory range of 2.6 to 24.9 but well above the optimal ceiling of around 8. HOMA-IR, the index that estimates how hard insulin has to work to control blood sugar, is 3.52, above the upper limit of 1.5 and well into the territory the laboratory classifies as significant insulin resistance. Her glucose at 5 is within the ideal range, and her HbA1c at 39 mmol/mol is within the normal band below 42, so her blood sugar control is still holding. But the cost of that control is high: the pancreas is producing roughly three times the insulin it should need. Her C-Peptide at 3.31 ug/L confirms the pancreas is working hard. The TyG index, another measure of insulin resistance calculated from triglycerides and glucose, is 8.94, above the upper limit of 8.8, reinforcing the same story. This is the classic PCOS metabolic pattern: the body is resistant to insulin, so the pancreas floods the system with more, and the excess insulin drives androgen production, weight gain around the middle, and difficulty losing weight. Her testosterone at 2.1 is within the female laboratory range of 0.5 to 2.6 but sits at the upper end, and her free androgen index at 6.4 is just inside the upper limit of 6.5, both consistent with the androgen excess that PCOS and insulin resistance produce together. Her SHBG at 32.8, while within range, is towards the lower end, and low SHBG is itself driven by high insulin. Her bioavailable testosterone at 0.91 is above the upper limit of 0.6, confirming that more testosterone is reaching the tissues than is ideal for a woman. This pattern ties her PCOS, her weight, her irregular periods and her difficulty losing weight into one interconnected story, and insulin resistance is at the centre of it.\n\nHer lipid profile reflects both the metabolic picture and the thyroid. Her total cholesterol is 5, her LDL is 3.03 which is marginally above the upper limit of 3, and her ApoB, which counts the number of cholesterol-carrying particles in the blood, is 1.07, above the desirable limit of 0.9. ApoB is the single best predictor of cardiovascular risk from cholesterol, because it counts particles rather than the cholesterol inside them. Her triglycerides at 1.91 are above the desirable limit of 1.7, which is directly linked to insulin resistance: excess insulin drives the liver to produce more triglyceride-rich particles. Her HDL at 1.2 is above the high-risk threshold of 1.04 but below the desirable level of 1.55. At a BMI of 40.5 with no exercise, a below-ideal HDL is expected, and adding movement is the most reliable way to raise it. Her ApoA1 at 1.44 is just at the normal threshold. The ApoB to ApoA1 ratio at 0.74 sits in the average risk band of 0.6 to 0.8 for women. Her VLDL at 0.87 is above the limit of 0.78, again driven by the triglyceride overproduction that insulin resistance causes. Her Lp(a), a genetically inherited cholesterol particle, is below 25, which is ideal and means that her elevated LDL and ApoB are driven entirely by modifiable factors, specifically diet, weight, insulin resistance and the underactive thyroid. Her Lp(a)-corrected LDL at 2.95 is just within range, showing that almost all her LDL is the modifiable kind. The Cardiovascular Risk Score, which is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c (it has no age term), is 75, well above the ideal threshold of 20 and the acceptable threshold of 40. The inputs driving it are ApoB, triglycerides and HDL. At 33, her ten-year cardiovascular event risk is low simply because of her age, but the score measures the risk being built, and the gap between the two is the window for acting. The positive news is that every driver is modifiable: weight loss, dietary change and thyroid treatment can all improve these numbers substantially.\n\nHer hsCRP, which measures low-grade inflammation in the body, is 1.2. This is within the laboratory range of below 5 but above the optimal threshold of below 1.0. At a BMI of 40.5, a CRP of 1.2 is actually lower than expected, because excess body fat is an active source of inflammatory signalling. However, her ESR, a different measure of inflammation that tracks how quickly red blood cells settle in a tube, is 52, well above the upper limit of 12. An ESR of 52 in a 33-year-old woman is worth investigating. The most common causes at this age are autoimmune thyroid disease, which her results strongly suggest, and obesity, both of which are known to raise ESR. PCOS itself can contribute. However, the degree of elevation warrants her GP checking it in context and considering a repeat alongside further investigation if there are no other obvious drivers. Her IgG at 16.4 is marginally above the upper limit of 16. A mildly raised IgG can be part of a chronic autoimmune or inflammatory picture, and with a thyroid picture consistent with Hashimoto's, this is the most likely explanation. It is not a concern in isolation but adds to the overall inflammatory and autoimmune context.\n\nHer Cystatin C, a marker of kidney filtration that is more reliable than creatinine at high BMI, is 1.11, marginally above the upper limit of 1.1. The eGFR calculated from Cystatin C is 91, and the combined creatinine and Cystatin C eGFR is also 91, both above the threshold of 90 but not by a wide margin. At 33, an eGFR in the low 90s is still normal and is not kidney disease, but it is worth keeping an eye on. High BMI itself puts extra work on the kidneys, and insulin resistance adds to that strain. Weight loss is the most effective way to protect kidney function over the long term, and this result gives her another reason to pursue it.\n\nHer globulin at 38 is above the upper limit of 36. Globulin includes immunoglobulins and other proteins, and a mildly raised level is consistent with the chronic immune activation from Hashimoto's and possibly PCOS-related inflammation. It is not a finding that needs separate investigation, but it fits the pattern.\n\nHer vitamin D at 51 is classified as sufficient by the laboratory but sits just above the threshold and is well below the optimal range of 75 to 120. At a BMI of 40.5, vitamin D is sequestered in fat tissue, so she needs a higher supplementation dose to reach adequate blood levels. Her B12 at 394 is within the laboratory range but below the optimal threshold of 500, meaning her stores could be higher. Her folate at 10 is within range. Her iron studies are balanced: ferritin at 42 is within range and just above the optimal lower bound of 40, serum iron at 19.3, transferrin at 3.31 and transferrin saturation at 23.22 percent (just below the optimal lower bound of 25 percent) are all reassuring. She is not iron deficient, but her stores are not abundant.\n\nHer oestradiol at 218 and progesterone at 1.31, with LH at 6.52 and FSH at 8.04, suggest she was in the follicular phase of her cycle when the blood was taken. The progesterone of 1.31 is consistent with a follicular-phase draw, and the LH and FSH values are within their follicular ranges. With irregular periods, a single snapshot of these hormones is limited, but the overall pattern is consistent with PCOS: the androgens are at the upper end, the cycle is irregular, and the metabolic backdrop is insulin resistance driving the hormonal imbalance.\n\nHer DHEA-S at 5.7 umol/L is within range. Her free testosterone at 0.038 is within range. Her creatine kinase at 52 is within range.\n\nThe total antioxidant activity at 2.19 is above the upper limit of 1.77. This is very commonly raised by supplementation, in her case likely the magnesium or dietary antioxidants, and is not a clinical concern. Her MCHC at 346 is marginally above the upper limit of 345, which at this margin is laboratory variation and carries no clinical significance.","links":"The central thread running through these results is the relationship between Hashimoto's thyroiditis, insulin resistance, PCOS and weight. These are not four separate problems; they form a self-reinforcing cycle. The underactive thyroid slows metabolism, making it harder to burn energy and easier to gain weight. The excess weight increases insulin resistance, because fat tissue, particularly abdominal fat, makes cells less responsive to insulin. The pancreas compensates by producing more insulin, and the excess insulin drives androgen production in the ovaries, which is the mechanism behind her PCOS symptoms: irregular periods, upper-end testosterone and free androgen index, and difficulty losing weight. The high insulin also suppresses SHBG, which sits at the lower end of its range, meaning more testosterone circulates in its active form, as confirmed by the elevated bioavailable testosterone. Each element makes the others worse.\n\nThe lipid findings connect directly to both the thyroid and the insulin resistance. Hypothyroidism slows the clearance of LDL particles from the blood, which is likely contributing to the ApoB of 1.07 and the LDL of 3.03. Insulin resistance drives the liver to produce more triglyceride-rich VLDL particles, which explains the triglycerides at 1.91 and the VLDL at 0.87. The low HDL at 1.2 reflects both the absence of exercise, which is the most powerful HDL-raising intervention, and the metabolic environment created by insulin resistance. Her Lp(a) below 25 is the key piece of good news here: it confirms that the entire lipid picture is driven by modifiable factors, meaning weight loss, dietary change, exercise and thyroid treatment can all improve it.\n\nThe inflammatory markers tell a consistent story. The ESR at 52 is substantially raised, but the hsCRP at 1.2 is only mildly above optimal. This divergence is common in autoimmune thyroid disease, where the ESR tends to rise more than the CRP. The mildly elevated IgG at 16.4 and the raised globulin at 38 both point to chronic immune activation, which is entirely explained by the Hashimoto's. Once thyroid treatment is established and the autoimmune activity is managed, these markers may settle.\n\nThe Cystatin C at 1.11 and the eGFR of 91 are the loose end. At 33, kidney filtration should comfortably exceed 100. The most likely explanation is the haemodynamic load that a BMI of 40.5 places on the kidneys, compounded by insulin resistance. This is not kidney disease, but it is a signal that the kidneys are working harder than they should be at this age, and it gives weight loss an additional clinical justification beyond the metabolic and hormonal benefits.\n\nThe vitamin D at 51 and B12 at 394 are not connected to the main story but are both below optimal and both easy to correct. At her BMI, vitamin D supplementation needs to be at a higher dose because fat tissue absorbs and holds onto vitamin D, reducing the amount available in the blood.","lifestyle":"Start each day with a protein-rich breakfast: eggs, Greek yoghurt, smoked salmon, or a combination. Aim for 30g of protein before any carbohydrate touches the plate. Anchor: this is the first thing you prepare every morning. Why: protein at breakfast reduces the insulin spike that is driving your HOMA-IR of 3.52 and keeps you fuller for longer, which helps with the calorie reduction you need.\nReplace the daily sugary food or drink with a single specific swap this week: fruit instead of biscuits, sparkling water with lemon instead of a sweet drink, dark chocolate instead of milk chocolate. Anchor: the moment you would normally reach for sugar. Why: daily sugar is one of the strongest drivers of the triglycerides at 1.91 and the insulin resistance behind your PCOS.\nAdd two portions of vegetables to whatever you are already eating, aiming to reach four to five a day. One at lunch, one at dinner. Anchor: plate goes down, vegetables go on first. Why: fibre slows glucose absorption, which lowers the insulin your pancreas is producing three times too much of, and soluble fibre from oats, beans and lentils directly lowers LDL cholesterol.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, and at 2,000 to 5,000 steps a day, this single habit could double your step count. It is the simplest and most effective intervention for your insulin resistance.\nAdd one resistance training session per week, even if it is a 20-minute bodyweight routine at home: squats, lunges, press-ups against a wall, and a plank. Anchor: pick a fixed day and time and protect it. Why: muscle is the biggest consumer of glucose in the body, and building even a small amount of it improves insulin sensitivity more than any supplement.\nSet a fixed wake time seven days a week, even though you sleep eight or more hours, because the tiredness on waking suggests the sleep quality is poor rather than the quantity insufficient. Get outside within 30 minutes of waking for natural light. Anchor: alarm goes off, curtains open, step outside. Why: morning light resets your circadian rhythm, which regulates cortisol, energy and mood, all of which you are struggling with.\nReduce screen exposure and bright light in the last hour before bed, and keep the bedroom cool. Anchor: set a phone alarm one hour before your target bedtime to begin winding down. Why: your stress is constant and your energy is flat all day, which suggests your cortisol rhythm may be shifted; protecting sleep quality is the most direct way to reset it.\nAim for a total daily calorie intake of approximately 1,800 to 2,000 kcal and a protein intake of at least 140g per day. These figures are based on your height, weight and activity level, and they will create a moderate deficit that supports fat loss at roughly 0.5 to 0.75 kg per week without crashing your metabolism. A food tracking app for even two weeks will show you where the calories are coming from.","flags":"TSH 6.79 (limit 4.78), FT4 12.8 (range 11.5 to 22.7, sitting at the floor), TPO antibodies above 400 (limit 13.8), thyroglobulin antibodies 81.5 (limit 4.4). This pattern is strongly associated with Hashimoto's thyroiditis. The thyroid is being pushed hard by the brain (raised TSH) and is barely maintaining output (FT4 near the bottom of range). This is the most clinically significant finding and is likely contributing to fatigue, weight gain, low mood, irregular periods and the elevated LDL. GP referral recommended for thyroid function assessment and consideration of levothyroxine.\nHOMA-IR 3.52 (limit 1.5), fasting insulin 15.86 (lab range 2.6 to 24.9 but optimal below 8), C-Peptide 3.31 ug/L, TyG index 8.94 (limit 8.8). Significant insulin resistance consistent with PCOS. The pancreas is producing approximately three times the optimal insulin to maintain a normal glucose of 5. This is the metabolic driver of her PCOS, weight gain and difficulty losing weight.\nApoB 1.07 (desirable below 0.9), LDL 3.03 (limit 3), triglycerides 1.91 (desirable below 1.7), HDL 1.2 (desirable above 1.55), VLDL 0.87 (limit 0.78), ApoB:ApoA1 ratio 0.74 (desirable below 0.6). Cardiovascular Risk Score 75 out of 100. The lipid profile is driven by insulin resistance, hypothyroidism and the absence of exercise. Lp(a) below 25 confirms the entire picture is modifiable. Weight loss, dietary change, exercise and thyroid treatment should improve all of these.\nESR 52 (limit 12). Significantly raised. Most likely driven by the autoimmune thyroid disease and obesity, but the degree of elevation warrants GP review, a repeat test and consideration of further investigation if no other explanation is found.\nCystatin C 1.11 (limit 1.1), Cystatin C eGFR 91, combined eGFR 91. Marginally raised Cystatin C with eGFR at the lower end of expected for age 33. Most likely reflecting the haemodynamic load of a BMI of 40.5. Not kidney disease, but worth monitoring and another reason to pursue weight loss.\nBioavailable testosterone 0.91 (upper limit 0.6), free androgen index 6.4 (limit 6.5), testosterone 2.1 (upper end of female range). Androgen excess consistent with PCOS and driven by insulin resistance suppressing SHBG.\nGlobulin 38 (limit 36), IgG 16.4 (limit 16). Mildly elevated, consistent with chronic immune activation from Hashimoto's thyroiditis. Not a separate concern but supports the autoimmune picture.\nVitamin D 51 (sufficient but below optimal of 75 to 120). At BMI 40.5, fat tissue sequesters vitamin D and a higher supplementation dose is needed.\nB12 394 (lab range 193 to 982, optimal above 500). Below optimal; supplementation recommended.\nTotal antioxidant activity 2.19 (limit 1.77). Above range, likely from supplementation. Not a clinical concern.\nMCHC 346 (limit 345). Marginally above range by 1 unit. Laboratory variation, no clinical significance.\nReassuring negatives: full blood count healthy with no anaemia, liver enzymes and fibrosis scores make significant liver disease very unlikely, fasting glucose and HbA1c within normal limits making diabetes unlikely at present, kidney function above 90 making kidney disease unlikely, calcium and PTH within range making parathyroid disease unlikely, coeliac screen negative, rheumatoid factor negative, all tumour markers within range, urine clean.","recommendations":"Discuss the thyroid results with your GP as a priority. Bring the numbers: TSH 6.79 (limit 4.78), FT4 12.8 (near the bottom of range), TPO antibodies above 400, thyroglobulin antibodies 81.5. This pattern is associated with Hashimoto's thyroiditis and your GP will assess whether to start thyroid hormone replacement. Treating the thyroid is likely to improve energy, mood, weight, periods and cholesterol.\nDiscuss the insulin resistance and PCOS management. HOMA-IR is 3.52 with insulin of 15.86. Ask your GP whether medication to improve insulin sensitivity would be appropriate alongside the dietary and lifestyle changes in this report, as this is a recognised part of PCOS management.\nAsk your GP to review the ESR of 52. While the most likely explanation is the autoimmune thyroid disease and obesity, the degree of elevation warrants a repeat test and, if it remains high, further investigation to exclude other causes.\nMention the lipid profile: ApoB 1.07 (target below 0.9), LDL 3.03, triglycerides 1.91, HDL 1.2. These are likely to improve with thyroid treatment, weight loss, dietary change and exercise, and the GP can decide whether to recheck after those changes or intervene earlier.\nMention the Cystatin C of 1.11 (limit 1.1) and eGFR of 91. At 33, this warrants a note in the record and monitoring, particularly as weight loss should improve kidney haemodynamics.\nAim for a calorie intake of 1,800 to 2,000 kcal per day, with at least 140g of protein per day (approximately 1.3g per kilogram of body weight). A target weight range of 80 to 90 kg would bring your BMI into a range where insulin resistance, lipids and kidney function should all improve. This does not need to happen quickly: 0.5 to 0.75 kg per week is sustainable and protective. Retest in four to six months, repeating thyroid function (TSH, FT4, FT3), insulin, HOMA-IR, HbA1c, lipid panel including ApoB, ESR, Cystatin C and vitamin D to track progress.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. At a BMI of 40.5, fat tissue absorbs vitamin D and keeps it out of the bloodstream, so the higher dose is needed to raise your level from 51 into the optimal range of 75 to 120. Recheck in four to six months to confirm the dose is sufficient.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. Vitamin K2 directs the calcium that vitamin D helps absorb into bones rather than into blood vessel walls. Always pair these two.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Your B12 at 394 is within the laboratory range but below the optimal level of 500. Sublingual absorption bypasses the gut and is more reliable than oral tablets.\nOmega-3 fish oil: 2g of combined EPA and DHA daily, taken with food. This will help lower triglycerides from 1.91 towards the ideal of below 1.0, support the anti-inflammatory response given the ESR of 52, and may improve mood.\nMagnesium (glycinate): continue your current supplement. Your magnesium at 0.89 is within the optimal range, suggesting your current dose is working. If you are not already taking it before bed, switch to evening dosing, as glycinate form supports sleep quality, which is relevant given you wake tired despite sleeping eight or more hours.\nInositol (myo-inositol): 4g daily, split into two 2g doses with meals. Inositol is one of the best-evidenced supplements for PCOS: it improves insulin sensitivity, may help regulate the menstrual cycle, and supports egg quality. If your GP starts metformin, mention that you take inositol, as both target the same insulin-sensitivity pathway.\nDO NOT take iron supplements. Your ferritin at 42 and iron studies are balanced, and unnecessary iron supplementation at this level can cause side effects without benefit.\nThe most important changes from this report are not supplements. They are getting the thyroid assessed by your GP, reducing sugar and increasing protein to address insulin resistance, and building daily walking and weekly resistance training into your routine.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 56 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 56.3. Weakest systems: inflammation 31%, thyroid 35%, glucose & insulin 39%. Biggest drags: Apolipoprotein B, HOMA-IR, TSH, Triglycerides.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"24.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3184","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a composite biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 24.2 against a calendar age of 33 means her blood markers are ageing nearly nine years younger than her actual age. This is a genuinely positive finding and shows that, despite the BMI, the insulin resistance and the thyroid, her body is coping well at a cellular level. The changes recommended in this report should help maintain or even widen that gap.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It contains no age term. A score of 75 is well above the ideal threshold of 20 and the acceptable threshold of 40. The main drivers are ApoB at 1.07, triglycerides at 1.91 and HDL at 1.2. At 33, her ten-year cardiovascular event risk is low because of her age, but the score measures the risk being built, and the gap between the two is the window for acting. Every driver is modifiable: weight loss, dietary change, exercise and thyroid treatment can all bring this score down substantially.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type" const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>

  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
