<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Laura Harrison","dob":"21/04/1983","report_date":"2026-09-26","summary":"Laura is a 43-year-old female presenting with a BMI of 23.4, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. She trains once per week (one cardio session, no resistance training) with 2,000 to 5,000 daily steps. She has a diagnosed history of rheumatoid arthritis, reports overuse of caffeine or energy drinks, and has no current medications listed. She reports hair thinning, irregular periods and low energy. Her goals are to improve energy levels, balance hormones and improve long-term health and longevity. She believes she may be perimenopausal but also wants to check fertility with a view to potentially having a second child, and wants to understand her overall health before making that decision.\n\nThe most important finding in this report is the hormone picture, and it deserves careful explanation because it bears directly on the fertility question Laura has raised. Her FSH, which is follicle-stimulating hormone, the signal the brain sends to the ovaries to mature eggs each month, is 36.39. In a woman with regular cycles this would normally sit between about 2.5 and 10 during the follicular phase. Laura's level is well into the postmenopausal reference range of 23 to 116, though it also overlaps with the mid-cycle surge range. Her LH, luteinising hormone, the partner signal that triggers ovulation, is 47.28, again firmly within the postmenopausal bracket. Her oestradiol is 398, which is within the follicular or even mid-cycle range and not yet suppressed, suggesting the ovaries are still producing oestrogen intermittently but the brain is having to shout louder and louder to get a response. Her progesterone is 4.62, which sits just above the follicular ceiling of 4.45, meaning she is unlikely to have ovulated in this cycle; in a confirmed ovulatory luteal phase, progesterone would typically be above 10. Her AMH, anti-Mullerian hormone, which is the most direct measure of remaining egg reserve, is 0.017. The lower limit of the age-appropriate range for 40 to 44 is 0.2, and Laura's result is almost undetectable. AMH does not fluctuate with the cycle the way FSH and LH do; it reflects the pool of small follicles waiting in the ovary and falls steadily and irreversibly as that pool shrinks. Put together, these results are consistent with a perimenopausal transition that is already well advanced: the ovaries still produce some oestrogen, which is why Laura still has periods (albeit irregular), but the egg reserve is functionally exhausted. This pattern does not absolutely preclude natural conception, but it suggests the window is extremely narrow, and Laura should discuss this with a fertility specialist as a matter of priority rather than waiting months to retest. The same conversation should cover whether referral for an antral follicle count by ultrasound is appropriate, because AMH and ultrasound together give the clearest picture of what is left.\n\nHer free testosterone, which is the fraction not bound to carrier proteins and therefore the fraction available to tissues, is 0.006, below the lower limit of 0.01. Her total testosterone at 0.8 is within range, and her SHBG, sex hormone binding globulin, the protein that carries testosterone in the blood, is 103.5, which is within the laboratory range of 27.8 to 146 but high enough to bind the vast majority of what the ovaries produce. The combination of elevated SHBG with low free testosterone is a recognised feature of perimenopause and may be contributing directly to her hair thinning, fatigue and reduced energy. Her DHEA-S, a precursor hormone made by the adrenal glands, is 2.5 umol/L (921 ug/dL), comfortably within range, which means adrenal androgen production is intact; the issue is binding rather than production. Her cortisol at 255 is within the expected morning range and does not suggest adrenal insufficiency or excess. Her prolactin at 190 is normal and does not explain the irregular periods.\n\nThere is a second finding that needs a GP conversation. Her CA19-9 is 44.26, above the upper limit of 37. CA19-9 is a protein that can be produced by cells in the pancreas, bile ducts and other parts of the gastrointestinal tract. It is used as a monitoring marker in known cancers but it is not a reliable screening tool because it is elevated in a wide range of benign conditions including gallstones, bile duct inflammation, pancreatitis, ovarian cysts, endometriosis and even minor infections. Importantly, it can also be raised in people with the Lewis blood group antigen, which is a genetic trait unrelated to disease. At 44.26 with a limit of 37, this is a mild elevation and statistically more likely to be benign than significant, particularly because her CEA, another tumour marker, is 0.52, which is excellent, and her CA125 at 14 and CA15-3 at 20.27 are both well within range. Her amylase at 53 and lipase at 38 are both normal, confirming the pancreas is functioning well. Nevertheless, a CA19-9 above range should be flagged to her GP so they can decide whether to repeat it in six to eight weeks and, if it remains elevated, consider an abdominal ultrasound to exclude a benign structural cause.\n\nTurning to the positives, and there are many. Laura's thyroid is working very well. TSH, thyroid-stimulating hormone, the brain's signal to the thyroid gland, is 0.81, sitting in the lower quarter of the range where the gland is under minimal pressure. Free T4, the main circulating thyroid hormone, is 21.1, and free T3, the active form the body actually uses, is 5.9, both within their ideal ranges. The FT3 to FT4 ratio of 0.28 confirms efficient conversion. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease as a cause of her fatigue or hair loss. This is especially worth noting because rheumatoid arthritis is an autoimmune condition, and autoimmune diseases sometimes cluster, so the clean antibody picture is genuinely reassuring.\n\nHer liver is in excellent health. ALT at 18 and GGT at 14, both well within their ideal ranges, mean the liver is under no metabolic strain. AST at 19 is clean. Her FIB-4 score, a calculation that estimates liver scarring using age, platelets, AST and ALT, is 0.78, well under the threshold of 1.45, confirming no evidence of fibrosis. Her bilirubin is 28, above the upper limit of 21, but with every liver enzyme clean this is consistent with Gilbert's syndrome, a harmless inherited trait affecting roughly 5 to 10 percent of the population in which the liver is slightly slower to process bilirubin. It does not progress, does not require treatment, and explains itself entirely when the enzymes around it are normal.\n\nHer kidney function is strong. Cystatin C, a more accurate marker of kidney filtration than creatinine alone, is 0.91, giving a combined eGFR of 99, exactly where it should be at 43. Creatinine at 62, urea at 4.5, sodium at 144, potassium at 3.8, chloride at 101 and bicarbonate at 28 are all within range, and uric acid at 241 is well within the healthy window.\n\nHer blood sugar control is excellent and is one of the strongest areas of the report. Fasting glucose at 4.7 and HbA1c at 38 mmol/mol (5.6 percent) are both within ideal ranges. HbA1c represents the average blood sugar over the preceding two to three months, and 38 sits comfortably below the pre-diabetes threshold of 42. Her fasting insulin at 3.28 is low, and her HOMA-IR, a calculation that estimates insulin resistance using fasting glucose and insulin together, is 0.69, well within the ideal zone. This means her cells respond to insulin efficiently and her pancreas does not have to work hard to keep blood sugar controlled. Her C-Peptide is 0.627 ug/L (207.6 pmol/L), which is below the laboratory range of 1.1 to 4.4 ug/L. C-Peptide is released by the pancreas in equal amounts to insulin and is used to confirm how much insulin the pancreas is actually producing. In the context of a normal fasting glucose, a normal HbA1c and an excellent HOMA-IR, a low C-Peptide simply reflects low insulin demand rather than pancreatic failure. The pancreas is producing exactly as much insulin as it needs to and no more, which is the healthiest pattern.\n\nHer inflammation markers are reassuring, particularly given the rheumatoid arthritis diagnosis. High-sensitivity CRP, a general marker of systemic inflammation, is 0.7, below the ideal threshold of 1.0, which means there is minimal inflammatory activity in the body at the time of sampling. Her ESR, erythrocyte sedimentation rate, another inflammation marker, is 8, well within the limit of 12. Her rheumatoid factor at 13 is just below the upper limit of 14. This does not mean the arthritis is absent, but it does suggest it is well controlled at present. Her immunoglobulins, IgG at 12.8, IgM at 2.5, IgA at 2.3 and IgE at 1.98, are all within range, and her coeliac screen (tissue transglutaminase IgA) is negative.\n\nHer vitamin B12 at 781 is excellent, sitting in the upper half of the ideal range. Her folate is above 24, which is above the laboratory range of 3 to 17, and this is almost certainly from diet or supplementation; high folate is not harmful and in fact is desirable if she is considering pregnancy. Her vitamin D at 81 is sufficient but sits below the optimal band of 75 to 120 at the lower end, and given the importance of vitamin D in immune regulation, bone health and energy, bringing it into the 90 to 120 range with supplementation would be worthwhile. Her calcium at 2.39, corrected calcium at 2.42, phosphate at 1.5 and magnesium at 0.88 are all within range. Her parathyroid hormone at 1.177 is normal, confirming calcium regulation is working as it should.\n\nHer lipid profile is mixed and worth explaining in detail. The protective side is strong: HDL cholesterol, the particles that carry cholesterol away from artery walls, is 2.5, which is exceptional and well above the ideal threshold of 1.6 for women. Her triglycerides at 0.74 are excellent, well below the ideal threshold of 1.0. The TG to HDL ratio, one of the best simple predictors of metabolic health, is 0.30, outstanding. Her ApoA1, the protein on protective HDL particles, is 2.02, well above the threshold of 1.4, and her ApoB to ApoA1 ratio at 0.49 is in the lower-risk zone below 0.6. Her Lp(a), lipoprotein(a), a genetically inherited particle that deposits cholesterol and promotes clotting, is below 25, which is normal and means any elevated LDL is driven entirely by modifiable factors. On the other side, her total cholesterol at 5.6 is above the desirable limit of 5.18, her LDL at 2.8 is within the laboratory range but above the optimal target of 2.6, and her ApoB, the protein that sits on every LDL particle and is the single best measure of atherogenic particle count, is 0.99, above the desirable threshold of 0.9. With her outstanding HDL and triglycerides, the overall cardiovascular risk profile is not alarming, but an ApoB of 0.99 does mean there are more LDL particles circulating than ideal, and dietary modification can bring this down. Her Cardiovascular Risk Score, a composite of ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 30 out of 100, which is acceptable but above the ideal threshold of 20, driven primarily by the ApoB and LDL.\n\nNow to the haematology findings that tie together into one pattern. Laura's white blood cell count is 3.42, below the lower limit of 4.0. Her neutrophils, the most abundant type of white blood cell and the first responders to bacterial infection, are 1.24, below the lower limit of 2.0. Her lymphocytes at 1.76, monocytes at 0.29, eosinophils at 0.09 and basophils at 0.04 are all within range. Her reticulocyte percentage, which measures how actively the bone marrow is producing new red blood cells, is 0.48, just below the lower limit of 0.5, and her absolute reticulocyte count at 22.9 is below the lower limit of 50. Her MCV, the average size of her red blood cells, is 78.8, below the lower limit of 83, and her MCH, the average amount of haemoglobin per red cell, is 26.7, just below the lower limit of 27. Her RDW, which measures how much variation there is in red cell size, is 15.1, above the upper limit of 14. Her haemoglobin at 128 is within range but sits at the lower end. Her ferritin, the body's iron store, is 18. This is within the laboratory range of 10 to 291 but well below the optimal floor of 40. Her transferrin saturation at 22.65 percent is within the laboratory range but below the optimal of 25 percent.\n\nThis constellation tells a clear story. The small red cells (low MCV), low haemoglobin per cell (low MCH), wide variation in cell size (high RDW) and low ferritin together form the classic pattern of iron deficiency. The bone marrow is struggling to make red cells at its normal rate because it does not have enough iron to load them with haemoglobin, which explains the low reticulocyte count. Iron deficiency is the single most common cause of fatigue in women of reproductive age, and with Laura still having periods, albeit irregular, menstrual blood loss is the most likely driver. The low white cell count and neutrophils may be partly constitutional, as some people of European ancestry run a naturally low neutrophil count known as benign ethnic neutropenia, but iron deficiency itself can suppress bone marrow output across all cell lines, so replenishing iron may lift the white cell count as well. Laura's ferritin of 18 is technically within the laboratory range, but the laboratory range reflects population distribution, not the level at which the body functions optimally; most evidence suggests ferritin below 30 is associated with fatigue, hair loss and reduced exercise tolerance, and below 50 is the threshold at which supplementation is usually recommended in symptomatic women. This single finding is likely the biggest contributor to Laura's fatigue and may also be contributing to her hair thinning, as the hair follicle is one of the most metabolically active tissues in the body and is sensitive to iron depletion well before haemoglobin falls out of range.\n\nHer creatine kinase at 53 is normal. Her total antioxidant activity at 1.91 is above the laboratory range of 1.3 to 1.77, which is a positive finding likely reflecting good dietary antioxidant intake or supplementation, and is not a concern. Her ALP, alkaline phosphatase, is 42, marginally below the lower limit of 46. Mild ALP below range is common in women and is rarely significant; it can be seen with low zinc, hypothyroidism (excluded here) or simply as a normal variant. Her zinc was not tested on this panel, but her diet and the mild ALP depression suggest zinc intake is worth reviewing.\n\nHer urinalysis is clean. Protein, glucose, ketones, blood, white cells, nitrites, casts and urobilinogen are all negative. Bacterial culture and sensitivities are pending.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 35.3, about 8 years younger than a calendar age of 43. Her Cardiovascular Risk Score of 30 out of 100 sits above the ideal threshold of 20, driven by the ApoB of 0.99 and LDL of 2.8, but below the flagged threshold of 40, placing her in the acceptable range. With dietary changes to bring ApoB below 0.9, this score should move comfortably into the ideal zone.\n\nIn summary, the report identifies three main areas for action. First, iron deficiency is the most likely explanation for Laura's fatigue and hair thinning and should be treated with supplementation and dietary change. Second, the hormone picture confirms an advanced perimenopausal transition with a functionally depleted egg reserve, and this should be discussed urgently with a fertility specialist given her interest in a second child, and subsequently with her GP regarding symptom management and the option of hormone replacement therapy. Third, the mildly elevated CA19-9 needs flagging to her GP for a repeat test and, if persistently elevated, further investigation. The mildly elevated ApoB is a modifiable dietary finding that does not require medication at this stage.","links":"The findings in this report organise themselves into three threads, and understanding how they connect helps Laura see where to focus.\n\nThe first and most actionable thread is iron deficiency driving fatigue, hair loss and suppressed blood cell production. Laura's ferritin at 18, while technically within the laboratory range, is depleted to the point where the bone marrow cannot produce normally sized, fully loaded red blood cells. The result is the classic microcytic pattern: MCV 78.8 (small cells), MCH 26.7 (less haemoglobin per cell), RDW 15.1 (a wide spread of cell sizes as the marrow produces smaller and smaller cells while older, normal-sized ones are still circulating). The reticulocyte count, which measures fresh red cell production, is suppressed at 0.48 percent and 22.9 absolute, confirming the marrow is underproducing. Iron is also essential for the enzyme that converts the thyroid prohormone T4 into the active T3, but Laura's FT3 at 5.9 shows conversion is still efficient, meaning the iron deficit has hit the marrow before it has hit the thyroid. Her white cell count at 3.42 and neutrophils at 1.24 are both below range. While some individuals carry a benign low neutrophil count, the co-existing iron deficiency is a plausible contributor to marrow suppression across all lines, and replenishing iron may lift these counts. If the neutropenia persists after iron is repleted, it can be assessed on its own merits.\n\nThe second thread is the perimenopausal hormone picture. Laura's FSH at 36.39 and LH at 47.28 both sit in the postmenopausal range, her AMH at 0.017 is functionally undetectable, and her progesterone at 4.62 suggests she has not ovulated this cycle. Her oestradiol at 398 shows the ovaries are still producing oestrogen intermittently, which explains why she still has periods, but the sky-high gonadotropins mean the brain is working increasingly hard to get any response. Her SHBG at 103.5 is binding most of her testosterone, leaving a free testosterone of only 0.006, and this low free androgen level may compound the hair thinning and fatigue that iron deficiency is already driving. The two threads overlap: iron deficiency worsens fatigue that perimenopause is already causing, and treating iron alone will help but may not fully resolve her symptoms if the hormonal component is not also addressed.\n\nThe third thread is the mildly elevated CA19-9 at 44.26. This marker sits in isolation: CEA at 0.52 is excellent, CA125 at 14 and CA15-3 at 20.27 are normal, pancreatic enzymes are clean, liver enzymes are clean, and CRP at 0.7 shows no systemic inflammation. The most likely explanation is a benign one, potentially related to the Lewis blood group antigen, a minor biliary or gynaecological cause, or simply individual variation, but it cannot be dismissed without a repeat test.\n\nThe lipid finding, ApoB at 0.99, stands apart from these three threads. It is not driven by inflammation, thyroid dysfunction or metabolic syndrome; Laura's triglycerides, insulin sensitivity, CRP and thyroid function are all excellent. It is most likely a dietary pattern issue, specifically saturated fat intake, and is modifiable through the dietary changes outlined in the lifestyle section. Her exceptional HDL at 2.5 and outstanding TG to HDL ratio at 0.30 provide significant protection, and the ApoB to ApoA1 ratio at 0.49 confirms the overall balance is favourable, but bringing ApoB below 0.9 would move her Cardiovascular Risk Score from 30 into the ideal zone below 20.\n\nWhat has been excluded matters as much as what has been found. Autoimmune thyroid disease has been ruled out with negative TPO and thyroglobulin antibodies. Coeliac disease, which can cause iron deficiency and fatigue independently, has been excluded by a negative tTG IgA. Diabetes and insulin resistance are absent, with an excellent HOMA-IR of 0.69. Liver and kidney disease are not present. Systemic inflammation is minimal despite the rheumatoid arthritis diagnosis. These exclusions narrow the explanation for Laura's symptoms firmly to iron deficiency and perimenopause, which is clinically useful because it tells her and her GP exactly where to intervene.","lifestyle":"Add a palm-sized portion of red meat, chicken thigh or oily fish to your largest meal three to four times a week, paired with a source of vitamin C such as peppers, tomatoes or citrus. Anchor: when you plan your shopping for the week, choose three iron-rich proteins first. Why: your ferritin at 18 is driving the fatigue and hair thinning, and haem iron from animal sources is absorbed five to ten times more efficiently than plant iron.\nSeparate your coffee and tea from meals by at least an hour, drinking them between meals rather than with food. Anchor: finish your meal, set a one-hour timer, then make your coffee. Why: the tannins and polyphenols in coffee and tea block iron absorption by up to 60 percent, and with your ferritin at 18 and your caffeine intake flagged as high, this single change will meaningfully improve how much iron you absorb from food.\nAdd two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: designate two evenings as fish nights on your weekly plan. Why: omega-3 fatty acids lower ApoB and LDL particles, and your ApoB at 0.99 is the one lipid marker that needs to come down.\nAdd a daily portion of soluble fibre: oats at breakfast, or a handful of almonds, or a portion of beans or lentils at lunch. Anchor: build it into breakfast so it happens before the day gets away from you. Why: soluble fibre binds bile acids and pulls LDL cholesterol out of circulation, directly lowering the ApoB that is driving your Cardiovascular Risk Score of 30.\nBegin two resistance training sessions per week, starting with bodyweight exercises or light dumbbells for 20 to 30 minutes. Anchor: attach them to two fixed days, ideally before your existing cardio day so you have a rest day after. Why: resistance training preserves bone density, which becomes increasingly important as oestrogen declines through perimenopause, and it improves insulin sensitivity and body composition, which will protect the excellent metabolic health you already have.\nIncrease your daily steps to at least 5,000, aiming for 7,500 within four weeks. Anchor: a 15-minute walk after lunch and a 15-minute walk after dinner. Why: at your current 2,000 to 5,000 steps, the lower end is associated with higher cardiovascular risk independent of formal exercise, and the walk after your largest meal blunts the post-meal glucose response.\nAim for seven to eight hours of sleep, with a fixed wake time and a caffeine cut-off by 1pm. Anchor: set an alarm for the cut-off rather than the wake time, and let the wake time become consistent by protecting the other end. Why: your caffeine overuse is likely fragmenting sleep quality even if you fall asleep, and poor sleep drives cortisol, impairs iron absorption and worsens perimenopausal symptoms.\nSpend ten minutes outside within an hour of waking, without sunglasses. Anchor: take your first drink of the morning to the front step or a window with direct light. Why: morning light exposure sets the circadian clock, improves sleep quality at the other end of the day, supports vitamin D synthesis and has been shown to lower cortisol and improve energy through the afternoon.","flags":"CA19-9 at 44.26, above the upper limit of 37. Mild elevation in isolation with normal CEA (0.52), CA125 (14), CA15-3 (20.27), amylase (53) and lipase (38). Most likely benign but requires a repeat in six to eight weeks and, if persistent, abdominal ultrasound to exclude a structural cause.\nAMH at 0.017, functionally undetectable and well below the age-appropriate lower limit of 0.2 for women aged 40 to 44. FSH at 36.39 and LH at 47.28, both in the postmenopausal range. Progesterone at 4.62, just above the follicular ceiling, suggesting anovulation this cycle. This pattern is consistent with advanced perimenopause with a functionally depleted ovarian reserve. Urgent fertility specialist referral recommended given the patient's stated interest in a second child.\nFree testosterone at 0.006, below the lower limit of 0.01, in the context of SHBG at 103.5 binding the majority of circulating testosterone. May contribute to fatigue, hair thinning and reduced wellbeing. Worth discussing with GP in the context of perimenopausal hormone management.\nWBC at 3.42 (range 4 to 10) and neutrophils at 1.24 (range 2 to 7). Reticulocyte percentage at 0.48 (range 0.5 to 2.5), absolute reticulocytes at 22.9 (range 50 to 100). MCV at 78.8 (range 83 to 101), MCH at 26.7 (range 27 to 32), RDW at 15.1 (range 11.6 to 14). Ferritin at 18 (optimal above 40). This constellation forms a classic iron-deficiency pattern with microcytic indices, suppressed reticulocyte production and depleted stores. The low WBC and neutrophils may be partly constitutional but iron-deficiency-related marrow suppression is a contributing factor. Recommend iron supplementation with a full blood count and ferritin repeat at 10 to 12 weeks.\nApoB at 0.99, above the desirable threshold of 0.9. LDL at 2.8, above optimal of 2.6. Total cholesterol at 5.6, above desirable of 5.18. HDL at 2.5 is exceptional, triglycerides at 0.74 excellent, Lp(a) below 25 normal, ApoB/A1 ratio 0.49 lower risk. The elevated particle count is modifiable through diet. Cardiovascular Risk Score 30 out of 100, driven by ApoB and LDL.\nC-Peptide at 0.627 ug/L (207.6 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. In the context of normal fasting glucose (4.7), normal HbA1c (38) and excellent HOMA-IR (0.69), this reflects low insulin demand rather than pancreatic insufficiency. No action required.\nBilirubin at 28, above the upper limit of 21, with all liver enzymes clean. Consistent with Gilbert's syndrome, a benign inherited trait. No action required.\nALP at 42, marginally below the lower limit of 46. Minor finding, common in women, may reflect low zinc intake. Not clinically significant in isolation.\nFolate above 24, above the laboratory range of 3 to 17. Reflects good dietary intake or supplementation. Beneficial, especially if pregnancy is being considered. No action required.\nTAA at 1.91, above the upper limit of 1.77. Positive finding reflecting good antioxidant intake. No action required.\nReassuring negatives: thyroid function excellent with negative antibodies, coeliac disease excluded, diabetes and insulin resistance absent, kidney function strong (eGFR 99), liver healthy with no fibrosis (FIB-4 0.78), CRP 0.7 and ESR 8 indicating minimal systemic inflammation despite rheumatoid arthritis diagnosis, rheumatoid factor at 13 just below threshold, immunoglobulins all within range, CA125, CA15-3 and CEA all normal, urinalysis clean.\nNot returned by the laboratory: urine bacterial culture and sensitivities (pending).","recommendations":"Discuss the AMH result of 0.017 and the FSH/LH pattern with a fertility specialist as soon as possible. The ovarian reserve appears functionally depleted, and if a second child is desired, time-sensitive options including assisted reproduction should be explored without delay.\nDiscuss the perimenopausal hormone picture with your GP, including the low free testosterone of 0.006 and the elevated SHBG of 103.5. Ask about symptom management options and whether hormone replacement therapy is appropriate, particularly given the fatigue, hair thinning and irregular periods.\nAsk your GP to repeat the CA19-9 in six to eight weeks. If it remains above 37, an abdominal ultrasound should be considered to exclude a benign structural cause such as gallstones or a biliary variant.\nAsk your GP to check for iron-deficiency anaemia formally and consider whether a short course of prescribed iron (ferrous bisglycinate 25mg daily) is appropriate given ferritin of 18 with symptoms of fatigue, hair thinning and microcytic red cell indices. Bring the MCV of 78.8, RDW of 15.1 and reticulocyte count of 22.9 to the conversation.\nRequest a repeat full blood count and ferritin after 10 to 12 weeks of iron supplementation to confirm the marrow has responded and the microcytic pattern is resolving. If neutrophils remain below 2.0 after iron repletion, the GP can assess whether further investigation of the neutropenia is warranted.\nCalorie target: approximately 1,850 to 2,000 kcal per day based on a BMR of roughly 1,440 kcal and a light activity multiplier of 1.45, adjusted downward slightly if weight loss is desired or upward if training volume increases. Protein target: 96 to 118 grams per day (1.3 to 1.6 g per kg at 74 kg), prioritising iron-rich animal protein sources. Retest in 10 to 12 weeks, repeating ferritin, full blood count, reticulocytes, ApoB, LDL, CA19-9, and vitamin D to confirm the plan is working.","supplementation":"Iron as ferrous bisglycinate, 25mg, taken on an empty stomach with 500mg vitamin C (as ascorbic acid) to enhance absorption. Take in the morning at least one hour before coffee or tea. Continue for 10 to 12 weeks, then retest ferritin before continuing. Why: ferritin at 18 with microcytic indices, suppressed reticulocytes, fatigue and hair thinning confirms iron depletion that diet alone will take too long to correct.\nVitamin D3 as cholecalciferol, 2,000 IU daily, taken with your largest meal (fat improves absorption). Why: vitamin D at 81 is sufficient but below the optimal band of 75 to 120 at the lower end; 2,000 IU daily will bring it comfortably into the 90 to 110 range and support immune regulation, bone density and energy, all of which become more important as oestrogen declines.\nVitamin K2 as MK-7, 100 mcg daily, taken alongside vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than soft tissues and arteries, and is especially important during perimenopause when bone density begins to decline.\nOmega-3 fish oil providing 2g combined EPA and DHA daily, taken with food. Why: omega-3 lowers ApoB and LDL particle count directly, and has anti-inflammatory properties that may benefit rheumatoid arthritis symptoms. Your ApoB of 0.99 is the primary lipid target.\nMagnesium glycinate, 300mg, taken before bed. Why: magnesium at 0.88 is within range but at the lower end of optimal, and glycinate form supports sleep quality, muscle recovery and stress tolerance, all of which are relevant given the caffeine overuse and perimenopausal transition.\nDo not take high-dose B12 supplements. Your B12 at 781 is excellent and supplementation is unnecessary.\nDo not take folate supplements. Your folate above 24 is already above range and additional supplementation is not needed unless specifically advised by a fertility specialist in the context of pregnancy planning, in which case the standard 400mcg folic acid recommendation applies.\nThe most important changes from this report are not supplements. They are replenishing iron through diet and supplementation, discussing the fertility and perimenopause findings with the appropriate specialists promptly, and adding resistance training and more daily movement to protect bone density and metabolic health as the hormonal transition progresses.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore risk being built rather than a ten-year event probability, so even a young person can score highly if the inputs are unfavourable. Laura's score of 30 is above the ideal threshold of 20 but below the flagged threshold of 40, placing her in the acceptable range. The score is driven primarily by her ApoB of 0.99 and LDL of 2.8. Her outstanding HDL of 2.5, excellent triglycerides of 0.74, low Lp(a), low CRP and healthy HbA1c are all working in her favour. Bringing ApoB below 0.9 through dietary changes should move this score comfortably into the ideal zone.","low_causes":"Excellent lipid profile, low inflammation, good metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amh","name":"Antimullerian Hormone (AMH)","group":"HORMONES","result":"0.017","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0001","lower_normal":"0.2","upper_normal":"39.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"2","upper_optimal":"39.1","lower_optimal_position":"0.3795","upper_optimal_position":"0.6667","units":"pmol/L","description":"AMH, anti-Mullerian hormone, is produced by the small follicles in the ovaries and is the most direct measure of remaining egg reserve. It does not fluctuate with the menstrual cycle the way FSH and LH do, making it the most reliable single fertility marker. Laura's result of 0.017 is functionally undetectable, well below the age-appropriate lower limit of 0.2 for women aged 40 to 44. This indicates that the pool of eggs available for maturation is almost entirely exhausted, consistent with an advanced perimenopausal state. This does not absolutely preclude conception but suggests the window is extremely narrow, and a fertility specialist consultation is strongly recommended.","low_causes":"Diminished ovarian reserve, perimenopause, premature ovarian insufficiency, prior ovarian surgery","high_causes":"Polycystic ovarian syndrome, granulosa cell tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8133","lower_normal":"3.5","upper_normal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"4.0","upper_optimal":"5.4","lower_optimal_position":"0.4000","upper_optimal_position":"0.6093","units":"mmol/L","description":"Fasting blood glucose is the concentration of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in the resting state. Laura's result of 4.7 sits comfortably within the ideal range of 4.0 to 5.4, indicating excellent blood sugar regulation. Combined with her healthy HbA1c and low insulin, this confirms she is metabolically well.","low_causes":"Prolonged fasting, excess insulin, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress response, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (Percentage)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"4.0","upper_normal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"4.0","upper_optimal":"5.9","lower_optimal_position":"0.3333","upper_optimal_position":"0.6500","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the preceding two to three months. Laura's result of 5.6 percent is within the normal range and below the pre-diabetes threshold of 6.0 percent. This confirms good long-term blood sugar regulation.","low_causes":"Iron deficiency (can falsely lower), haemolytic anaemia, blood loss","high_causes":"Chronically elevated blood sugar, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (IFCC)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"20","upper_normal":"42","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"20","upper_optimal":"36","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in IFCC units (mmol/mol) rather than percentage. Laura's result of 38 is below the pre-diabetes threshold of 42 and within the normal range. However, it sits just above the tighter optimal threshold of 36, meaning blood sugar control is good but not quite in the ideal band. In Laura's case, her iron deficiency (low ferritin and microcytic indices) may be slightly affecting this reading, as iron deficiency can alter red cell turnover and influence HbA1c in either direction. With her fasting glucose at 4.7 and HOMA-IR at 0.69, true blood sugar control is almost certainly excellent.","low_causes":"Iron deficiency (can alter), haemolytic anaemia, blood loss","high_causes":"Chronic hyperglycaemia, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"3.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3436","lower_normal":"2.6","upper_normal":"24.9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"2.0","upper_optimal":"8.0","lower_optimal_position":"0.2527","upper_optimal_position":"0.4056","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar under control overnight. A low level means the cells are responding well to insulin and the pancreas does not need to produce much. Laura's result of 3.28 is within the laboratory range and within the ideal window of 2 to 8, confirming excellent insulin sensitivity. This aligns with her healthy HOMA-IR of 0.69.","low_causes":"Very good insulin sensitivity, low-carbohydrate diet, prolonged fasting","high_causes":"Insulin resistance, metabolic syndrome, PCOS, high-carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"207.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1570","lower_normal":"364.1","upper_normal":"1456.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"364.1","upper_optimal":"1000","lower_optimal_position":"0.3333","upper_optimal_position":"0.5276","units":"pmol/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin, providing an independent confirmation of how much insulin is being produced. Laura's result of 207.6 pmol/L (0.627 ug/L) is below the laboratory range. However, in the context of a normal fasting glucose of 4.7, a normal HbA1c of 38, and an excellent HOMA-IR of 0.69, the low C-Peptide simply reflects that the pancreas is producing very little insulin because very little is needed. This is a sign of good insulin sensitivity, not pancreatic failure.","low_causes":"Low insulin demand due to excellent insulin sensitivity, low-carbohydrate diet, prolonged fasting, type 1 diabetes (different context)","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, kidney impairment (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2215","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_no a's result of 128 is within the laboratory range of 120 to 150 but sits at the lower end, below the optimal floor of 125. In the context of her low ferritin and microcytic red cell indices, this is consistent with early iron depletion that has not yet progressed to frank anaemia but is close to the threshold. Replenishing iron stores should lift haemoglobin into the mid-range.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"3.8","upper_normal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"4.0","upper_optimal":"4.7","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"Red blood cell count measures the total number of red cells circulating in the blood. Laura's count of 4.78 is at the upper end of the laboratory range. Interestingly, in iron deficiency the body sometimes compensates for smaller, less haemoglobin-rich cells by producing more of them, which may explain why her count is at the high end despite iron depletion. The number of cells is adequate; it is the quality and size of each cell that is affected.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia, iron deficiency (compensatory)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit (HCT)","group":"HEMATOLOGY","result":"0.377","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3503","lower_normal":"0.36","upper_normal":"0.46","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.37","upper_optimal":"0.44","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. Laura's result of 0.377 is within range but at the lower end, consistent with the low-normal haemoglobin and iron depletion pattern seen across her blood count. As iron stores are replenished and red cell quality improves, haematocrit should rise.","low_causes":"Anaemia, iron deficiency, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"HEMATOLOGY","result":"15.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8111","lower_normal":"11.6","upper_normal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"11.8","upper_optimal":"13.5","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"%","description":"RDW measures the variation in size among red blood cells. A high RDW means the cells are more varied in size than normal, which typically occurs when the bone marrow is producing new, smaller cells alongside older, normal-sized ones. Laura's RDW of 15.1 is above the upper limit of 14, and this is a classic finding in iron deficiency: as iron runs low, newly produced cells are smaller (explaining her low MCV) while the existing cells from when iron was adequate remain normal-sized, creating a wider spread.","low_causes":"Rarely significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, chronic inflammation, thalassaemia trait","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume (MCV)","group":"HEMATOLOGY","result":"78.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1009","lower_normal":"83","upper_normal":"101","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"85","upper_optimal":"98","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average volume of a single red blood cell. Laura's MCV of 78.8 is below the lower limit of 83, meaning her red cells are smaller than they should be, a condition called microcytosis. The most common cause in a premenopausal woman is iron deficiency, and in Laura's case this is confirmed by the low ferritin, low MCH and raised RDW. The bone marrow is making cells with less haemoglobin because there is not enough iron to fill them, and smaller cells are the result. Iron repletion should normalise the MCV over two to three months as new, properly sized cells replace the older small ones.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead exposure","high_causes":"B12 or folate deficiency, alcohol excess, hypothyroidism, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"26.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2733","lower_normal":"27","upper_normal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"28","upper_optimal":"31","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH is the average amount of haemoglobin packed into each red blood cell. Laura's MCH of 26.7 is just below the lower limit of 27, meaning each red cell is carrying slightly less oxygen-carrying protein than ideal. This is consistent with the iron deficiency pattern: without sufficient iron, the body cannot produce enough haemoglobin to fill each cell. This contributes directly to oxygen delivery to tissues and is one of the mechanisms behind her fatigue.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"339","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"315","upper_normal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"320","upper_optimal":"345","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC is the average concentration of haemoglobin within each red blood cell. Laura's MCHC of 339 is within range, meaning that while each cell is smaller and carries less total haemoglobin, the concentration within the cell is still adequate. This is typical of early iron deficiency, where cell size shrinks before concentration drops.","low_causes":"Iron deficiency (severe), thalassaemia trait","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"247","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4564","lower_normal":"150","upper_normal":"410","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"170","upper_optimal":"350","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are cell fragments produced by the bone marrow that are essential for blood clotting. Laura's platelet count of 247 is within the ideal range, confirming the bone marrow's platelet production line is functioning normally despite the iron-driven suppression affecting other cell lines.","low_causes":"Viral infection, autoimmune conditions, medication effects, liver disease, bone marrow suppression","high_causes":"Iron deficiency (reactive), infection, inflammation, chronic disease","padding":" stitutional neutropenia","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1827","lower_normal":"2","upper_normal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"2.5","upper_optimal":"5.5","lower_optimal_position":"0.4333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and are the immune system's first line of defence against bacterial infection. Laura's neutrophil count of 1.24 is below the lower limit of 2.0. This is the cell type driving her overall low white cell count. Iron deficiency can suppress neutrophil production because the bone marrow prioritises red cell production when resources are scarce. Rheumatoid arthritis itself, or medications used to treat it, can also lower neutrophils, though Laura has not listed any immunosuppressive medications. If the count remains low after iron repletion, further investigation may be appropriate.","low_causes":"Iron deficiency, viral infection, autoimmune disease, medication effects, benign constitutional neutropenia, bone marrow suppression","high_causes":"Bacterial infection, inflammation, physical stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"1","upper_normal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"1.2","upper_optimal":"2.8","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including fighting viral infections and producing antibodies. Laura's lymphocyte count of 1.76 is within the ideal range, indicating a healthy adaptive immune system.","low_causes":"Viral infection, HIV, steroid use, immunosuppressive therapy, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3708","lower_normal":"0.2","upper_normal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.2","upper_optimal":"0.8","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, playing a key role in clearing debris, fighting infection and resolving inflammation. Laura's monocyte count of 0.29 is within range and unremarkable.","low_causes":"Bone marrow failure, hairy cell leukaemia","high_causes":"Chronic infection, autoimmune disease, chronic inflammation, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.02","upper_normal":"0.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.02","upper_optimal":"0.4","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Laura's count of 0.09 is within range, indicating no allergic or parasitic activity.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, parasitic infection, asthma, eczema, drug reactions, aut ":"Blood loss recovery, haemolytic anaemia, treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_abs","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"22.944","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1529","lower_normal":"50","upper_normal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"55","upper_optimal":"90","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"This is the absolute number of reticulocytes in the blood, providing a direct count rather than a percentage. Laura's result of 22.9 is well below the lower limit of 50, confirming significant underproduction of new red cells by the bone marrow. This is the most direct evidence that iron deficiency is limiting the marrow's ability to replenish red blood cells.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Blood loss recovery, haemolytic anaemia, treatment response (iron, B12, folate, EPO)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"16.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3469","lower_normal":"13","upper_normal":"99","lower_optimal":"13","upper_optimal":"99","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"index","description":"The Mentzer index divides MCV by RBC count and helps distinguish between iron deficiency anaemia and thalassaemia trait when red cells are small. A value above 13 favours iron deficiency, while a value below 13 favours thalassaemia. Laura's Mentzer index of 16.5 is well above 13, supporting iron deficiency as the cause of her microcytic red cells rather than thalassaemia.","low_causes":"Thalassaemia trait","hig rmal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"25","upper_optimal":"40","lower_optimal_position":"0.3959","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation measures the percentage of the body's iron transport protein (transferrin) that is actually carrying iron. Laura's result of 22.65 percent is within the laboratory range of 18 to 55 but below the optimal floor of 25 percent. This means the transport system has capacity to carry more iron than is currently available, consistent with her depleted ferritin and the iron deficiency pattern throughout the blood count.","low_causes":"Iron deficiency, chronic inflammation, chronic disease","high_causes":"Haemochromatosis, iron overload, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"15.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4377","lower_normal":"9","upper_normal":"30.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"12","upper_optimal":"26","lower_optimal_position":"0.3738","upper_optimal_position":"0.5895","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates significantly with meals, time of day and recent intake, so it is less reliable than ferritin for assessing overall iron status. Laura's serum iron of 15.7 is within range. The fact that circulating iron is adequate while stores (ferritin) are low means the body is using iron as fast as it absorbs it, with nothing going into reserve.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4003","lower_normal":"2.5","upper_normal":"3.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"2.6","upper_optimal":"3.5","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the blood from the gut to the bone marrow and storage sites. The body produces more transferrin when iron is scarce, as a way of scavenging every available molecule. Laura's transferrin of 2.76 is within range and not yet elevated, which suggests the iron deficiency has not been severe enough or prolonged enough to trigger a compensatory rise, or that other factors are keeping it stable.","low_causes":"Chronic inflammation, liver disease, malnutrition, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"65.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5541","lower_normal":"44","upper_normal":"76.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"48","upper_optimal":"72","lower_optimal_position":"0.3748","upper_optimal_position":"0.6207","units":"umol/L","description":"TIBC measures the total capacity of transferrin to bind iron, reflecting how much room there is on the transport system to carry more. Laura's TIBC of 65.3 is within range, indicating the iron transport system is functioning normally.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.361
