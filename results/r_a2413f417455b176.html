re normal, this is a minor finding that does not require investigation.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, coeliac disease, Wilson's disease","high_causes":"Liver disease, bile duct obstruction, bone disease, Paget's disease, pregnancy, growth","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8100","lower_normal":"5","upper_normal":"21","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"5","upper_optimal":"17","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when the liver breaks down old red blood cells. Laura's bilirubin of 28 is above the upper limit of 21. However, with every liver enzyme perfectly clean, ALT at 18, GGT at 14, AST at 19, and no sign of bile duct obstruction, this pattern is consistent with Gilbert's syndrome, a harmless inherited trait affecting approximately 5 to 10 percent of people. In Gilbert's, the liver enzyme that processes bilirubin (UGT1A1) works slightly more slowly than average, causing mild unconjugated bilirubin elevation. It does not progress, does not damage the liver, and does not require treatment. Some research suggests that mildly elevated bilirubin may actually be protective as an antioxidant.","low_causes":"Rarely significant","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3214","lower_normal":"0","upper_normal":"56","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"25","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that is released into the blood when liver cells are damaged or stressed. It is one of the most specific markers of liver health. Laura's ALT of 18 is well within the ideal range of less than 25 for women, confirming the liver is under no metabolic strain.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, hepatitis, alcohol, medications, muscle damage, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3854","lower_normal":"13","upper_normal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"13","upper_optimal":"35","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. It is released into the blood when any of these tissues are damaged. Laura's AST of 19 is within the ideal range, confirming no liver or muscle stress.","low_causes":"Not clinically significant","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT (GGT)","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1842","lower_normal":"4","upper_normal":"38","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"4","upper_optimal":"25","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications and bile duct problems. It is often the first enzyme to rise when the liver is under strain. Laura's GGT of 14 is well within the ideal range of less than 25 for women, which is as clean as this marker gets and confirms no liver stress from any source.","low_causes":"Not clinically significant","high_causes":"Alcohol, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4348","lower_normal":"30","upper_normal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"35","upper_optimal":"100","lower_optimal_position":"0.3901","upper_optimal_position":"0.6136","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Laura's amylase of 53 is within the ideal range, confirming normal pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4468","lower_normal":"13","upper_normal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"15","upper_optimal":"55","lower_optimal_position":"0.3617","upper_optimal_position":"0.6277","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase and is the preferred marker for diagnosing pancreatitis. Laura's lipase of 38 is within the ideal range, confirming normal pancreatic function. This is particularly reassuring alongside the mildly elevated CA19-9, as normal pancreatic enzymes reduce the likelihood of a pancreatic cause.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, cholecystitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5146","lower_normal":"2.08","upper_normal":"2.65","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"2.15","upper_optimal":"2.55","lower_optimal_position":"0.3743","upper_optimal_position":"0.6093","units":"mmol/L","description":"Calcium is the most abundant mineral in the body, essential for bone strength, nerve function, muscle contraction and blood clotting. Laura's calcium of 2.39 is within the ideal range, confirming normal calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, sarcoidosis, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"2.25","upper_optimal":"2.55","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate picture of the biologically active calcium in the blood. Laura's corrected calcium of 2.42 is within the ideal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6092","lower_normal":"0.78","upper_normal":"1.65","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.9","upper_optimal":"1.5","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/L","description":"Phosphate works alongside calcium for bone mineralisation and is essential for energy production in every cell. Laura's phosphate of 1.5 is within the ideal range.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D, tumour lysis syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5362","lower_normal":"0.53","upper_normal":"1.11","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.85","upper_optimal":"1.05","lower_optimal_position":"0.5190","upper_optimal_position":"0.6224","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions including energy production, muscle function, nerve signalling and sleep regulation. Laura's magnesium of 0.88 is within the ideal range of 0.85 to 1.05. It sits at the lower end of optimal, and supplementing with magnesium glycinate before bed may support sleep quality and stress resilience.","low_causes":"Poor dietary intake, alcohol, diuretics, diarrhoea, proton pump inhibitors","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"50","upper_normal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"75","upper_optimal":"120","lower_optimal_position":"0.5000","upper_optimal_position":"0.8000","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune regulation and mood. It is produced in the skin in response to sunlight and obtained from a limited number of foods. Laura's vitamin D of 81 is within the optimal band of 75 to 120 but sits at the lower end. With perimenopause advancing and bone density becoming a priority, maintaining vitamin D in the 90 to 120 range is important. Supplementing with 2,000 IU vitamin D3 daily will comfortably achieve this.","low_causes":"Insufficient sunlight, poor dietary intake, darker skin, obesity, malabsorption, liver or kidney disease","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"THYROID","result":"1.177","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3856","lower_normal":"0.98","upper_normal":"4.73","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"1.0","upper_optimal":"3.5","lower_optimal_position":"0.3387","upper_optimal_position":"0.5547","units":"pmol/L","description":"PTH is produced by the parathyroid glands in the neck and regulates calcium levels in the blood by controlling how much calcium is released from bone, absorbed from food and retained by the kidneys. Laura's PTH of 1.177 is at the lower end of the range, which alongside her normal calcium and adequate vitamin D confirms the calcium regulation system is working efficiently and not under stress.","low_causes":"Hypoparathyroidism, excess calcium, high vitamin D, magnesium deficiency (severe)","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"781","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5789","lower_normal":"193","upper_normal":"982","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"500","upper_optimal":"900","lower_optimal_position":"0.5223","upper_optimal_position":"0.5688","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Laura's B12 of 781 is excellent, sitting in the upper half of the ideal range of 500 to 900. No supplementation is needed.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, metformin use, gastric surgery","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"> 24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7059","lower_normal":"3","upper_normal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"8","upper_optimal":"24","lower_optimal_position":"0.4524","upper_optimal_position":"0.8333","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and neural development. It is particularly important in early pregnancy to prevent neural tube defects. Laura's folate is above 24, which exceeds the laboratory range upper limit of 17. This is a positive finding, likely reflecting good dietary intake or supplementation, and is not harmful. Given her interest in potential pregnancy, having high folate stores is actually beneficial.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, alcohol excess, certain medications","high_causes":"Supplementation, high dietary intake, B12 deficiency (folate can be falsely high)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5415","lower_normal":"0","upper_normal":"5.18","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"5.0","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL and VLDL. Laura's total cholesterol of 5.6 is above the desirable limit of 5.18. However, total cholesterol alone is a poor risk predictor because it includes protective HDL. Laura's exceptionally high HDL of 2.5 accounts for a large proportion of this total, which is why the TC/HDL ratio of 2.24 is excellent. The elevated total cholesterol is therefore less concerning than it appears at first glance, though the LDL and ApoB numbers provide a clearer picture of risk.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2176","lower_normal":"0","upper_normal":"1.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"1.0","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, mainly derived from dietary carbohydrates and fats. High levels are associated with insulin resistance and cardiovascular risk. Laura's triglycerides at 0.74 are excellent, well below the ideal threshold of 1.0, confirming healthy fat metabolism and insulin sensitivity.","low_causes":"Low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate or sugar intake, alcohol, insulin resistance, obesity, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues and is converted into LDL in the bloodstream. Laura's VLDL of 0.34 is within the ideal range, consistent with her excellent triglycerides.","low_causes":"Low fat diet, malnutrition","high_causes":"Insulin resistance, high carbohydrate diet, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8065","lower_normal":"1.55","upper_normal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal":"1.6","upper_optimal":"","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is known as 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for recycling. Higher HDL is protective against cardiovascular disease. Laura's HDL of 2.5 is exceptional, well above the ideal threshold of 1.6 for women. This is one of the strongest results in the report and provides significant cardiovascular protection.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high carbohydrate diet","high_causes":"Genetic advantage, regular exercise, moderate alcohol, healthy diet, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5600","lower_normal":"0.5","upper_normal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.5","upper_optimal":"2.6","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the main carrier of cholesterol to tissues and artery walls. When there is too much, it can deposit cholesterol in artery walls, driving atherosclerosis over decades. Laura's LDL of 2.8 is within the laboratory range of 0.5 to 3.0 but above the optimal target of 2.6. With her Lp(a) below 25 (normal), the elevated LDL is driven entirely by modifiable factors, primarily dietary saturated fat. Her Lp(a)-corrected LDL of 2.72 confirms that the inherited component is minimal.","low_causes":"Hyperthyroidism, liver disease, malabsorption, statin therapy","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2489","lower_normal":"0","upper_normal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"3.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL and is a simple but effective predictor of cardiovascular risk. Lower is better. Laura's ratio of 2.24 is excellent, well below both the general threshold of 4.5 and the ideal of 3.5. This confirms that her elevated total cholesterol is largely made up of protective HDL.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"44.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"20","upper_normal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal":"30","upper_optimal":"","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of protective HDL. Laura's HDL makes up 44.64 percent of her total cholesterol, well above the minimum of 20 percent. This is an outstanding ratio and confirms the dominance of protective particles in her lipid profile.","low_causes":"Low HDL, metabolic syndrome, sedentary lifestyle","high_causes":"Excellent HDL production, genetic advantage, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3875","lower_normal":"0","upper_normal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"2.6","lower_optimal_position":"0","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic particles in one number: LDL, VLDL and remnants. Laura's non-HDL of 3.1 is within the laboratory limit of 4.0 but above the optimal target of 2.6, reflecting the mildly elevated LDL and ApoB. This is the number dietary changes should bring down.","low_causes":"Very healthy lipid profile, lipid-lowering therapy","high_causes":"Elevated LDL, elevated triglycerides, dietary saturated fat, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7214","lower_normal":"1.4","upper_normal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal":"1.6","upper_optimal":"","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein on HDL particles. Higher levels mean more HDL particles available to carry cholesterol away from artery walls. Laura's ApoA1 of 2.02 is excellent, well above the threshold of 1.4 and reflecting her outstanding HDL level.","low_causes":"Low HDL, sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Genetic advantage, exercise, moderate alcohol, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"0.8","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single protein carried on every LDL, VLDL and Lp(a) particle. Because there is exactly one ApoB per particle, it is the most accurate count of atherogenic particles in the blood and the single best predictor of cardiovascular risk from the lipid panel. Laura's ApoB of 0.99 is above the desirable threshold of 0.9 and above the optimal target of 0.8. This means there are more atherogenic particles circulating than ideal. With her Lp(a) below 25, the excess particles are all modifiable LDL, and dietary changes, specifically reducing saturated fat and increasing soluble fibre and oily fish, should bring ApoB below 0.9.","low_causes":"Very healthy lipid metabolism, lipid-lowering therapy, malnutrition","high_causes":"High saturated fat diet, familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.490099","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4084","lower_normal":"0","upper_normal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1) and is the best single-number summary of the lipid profile's risk balance. Laura's ratio of 0.49 is in the lower-risk zone below 0.6 and just within the optimal threshold of 0.5. Despite her ApoB being above 0.9, the exceptional ApoA1 of 2.02 balances the equation. This is reassuring but does not eliminate the benefit of lowering ApoB further.","low_causes":"Excellent lipid balance, high HDL/ApoA1","high_causes":"Elevated LDL/ApoB, low HDL/ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"32","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined particle similar to LDL but with an additional protein (apolipoprotein(a)) attached. It deposits cholesterol in artery walls, promotes blood clotting and drives inflammation. Unlike LDL, Lp(a) cannot be changed by diet or exercise; it is inherited and stays constant throughout life. Laura's Lp(a) is below 25, which is normal and genuinely useful information because it means her elevated LDL and ApoB are driven entirely by modifiable lifestyle factors rather than genetics. This is the best possible starting point for dietary intervention.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3800","lower_normal":"25","upper_normal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"30","upper_optimal":"150","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"U/L","description":"CK is an enzyme released from muscle cells when they are damaged or stressed. It rises after intense exercise, injury or in muscle diseases. Laura's CK of 53 is within the ideal range, indicating no muscle damage or strain.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin therapy, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"21.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6190","lower_normal":"11.5","upper_normal":"22.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"14","upper_optimal":"20","lower_optimal_position":"0.3929","upper_optimal_position":"0.5833","units":"pmol/L","description":"FT4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. It circulates to tissues where it is converted into the active form, T3. Laura's FT4 of 21.1 is within the laboratory range at the upper end. While it is slightly above the tighter optimal ceiling of 20, in the context of a well-suppressed TSH of 0.81 and an excellent FT3 of 5.9, this reflects a thyroid that is producing efficiently with conversion working well. The thyroid is in excellent health.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness, iodine deficiency","high_causes":"Hyperthyroidism, early thyroiditis, excess thyroid medication, biotin interference","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"0.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3948","lower_normal":"0.55","upper_normal":"4.78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"1.0","upper_optimal":"2.5","lower_optimal_position":"0.3773","upper_optimal_position":"0.4717","units":"mIU/L","description":"TSH is the signal sent from the pituitary gland in the brain to the thyroid, telling it how much hormone to produce. A high TSH means the brain is having to push harder to get the thyroid to produce enough. Laura's TSH of 0.81 is within the laboratory range and just below the tighter optimal band of 1.0 to 2.5. A TSH in this range means the pituitary is barely having to push the thyroid at all, which is a sign of a thyroid gland that is responding readily. Combined with her excellent FT4 and FT3, the thyroid is working very well.","low_causes":"Hyperthyroidism, subclinical hyperthyroidism, pituitary dysfunction, non-thyroidal illness, biotin interference","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid surgery, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5778","lower_normal":"2.6","upper_normal":"7.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"4.5","upper_optimal":"6.5","lower_optimal_position":"0.5222","upper_optimal_position":"0.5889","units":"pmol/L","description":"FT3 is the active thyroid hormone that enters cells and drives metabolism, energy production, body temperature and mental clarity. Laura's FT3 of 5.9 sits squarely in the ideal range of 4.5 to 6.5, confirming that her body is efficiently converting T4 into the active form and that thyroid function is not contributing to her fatigue.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, selenium or iron deficiency, severe illness, caloric restriction","high_causes":"Hyperthyroidism, excess thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"13.8","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks thyroid peroxidase, an enzyme the thyroid uses to make hormones. Elevated TPO antibodies are the hallmark of Hashimoto's thyroiditis, the most common cause of underactive thyroid. Laura's TPO antibodies are below 6.6, well within the normal range, which rules out autoimmune thyroid disease. This is particularly reassuring given her existing autoimmune condition (rheumatoid arthritis), as autoimmune diseases can sometimes cluster.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"4.4","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, the protein the thyroid gland uses as a scaffold to build thyroid hormones. Elevated levels suggest autoimmune thyroid disease. Laura's result of less than 1.3 is well within the normal range, and more than 80 percent of the population have undetectable levels at this threshold. Combined with the negative TPO antibodies, autoimmune thyroid disease is conclusively excluded.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3:FT4 ratio reflects how efficiently the body converts the inactive thyroid prohormone T4 into the active hormone T3. Laura's ratio of 0.28 is within the ideal range of 0.27 to 0.40, confirming efficient thyroid hormone conversion. This is particularly useful because poor conversion can cause fatigue even when TSH and FT4 look normal, and in Laura's case, conversion is working well.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"44.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5989","lower_normal":"0","upper_normal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"37","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a protein that can be produced by cells in the pancreas, bile ducts, stomach and colon. It is used to monitor known pancreatic and gastrointestinal cancers, but it is not a reliable screening tool because it is elevated in many benign conditions including gallstones, bile duct inflammation, pancreatitis, liver disease, ovarian cysts, endometriosis and in people with the Lewis blood group antigen (a genetic trait). Laura's CA 19-9 of 44.26 is above the upper limit of 37. At this level, and with her CEA at 0.52 (normal), CA125 at 14 (normal), and pancreatic enzymes clean, the most likely explanation is benign. However, any value above the threshold should be repeated in six to eight weeks, and if it remains elevated, an abdominal ultrasound should be considered to exclude a structural cause.","low_causes":"Not clinically significant (Lewis-negative individuals cannot produce CA19-9 and will always read near zero)","high_causes":"Pancreatic cancer, bile duct cancer, gallstones, pancreatitis, bile duct inflammation, ovarian cysts, endometriosis, liver disease, Lewis blood group antigen","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA (Carcinoembryonic Antigen)","group":"TUMOR MARKERS","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1130","lower_normal":"0","upper_normal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"2.3","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA is a protein used to monitor certain cancers, particularly colorectal, pancreatic and breast. In screening, it provides a baseline. Laura's CEA of 0.52 is well within the normal range for a non-smoker (less than 2.3). This normal CEA is particularly reassuring alongside the mildly elevated CA 19-9, as it makes a malignant cause less likely.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, pancreatic cancer, breast cancer, lung cancer, smoking, inflammatory bowel disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"12.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5544","lower_normal":"6.5","upper_normal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"6.5","upper_optimal":"16","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against bacteria and viruses after infection or vaccination. Laura's IgG of 12.8 is within the laboratory range, indicating a healthy adaptive immune response.","low_causes":"Primary immunodeficiency, immunosuppressive therapy, kidney disease (protein loss)","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"2.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0.5","upper_normal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.5","upper_optimal":"3","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced during an immune response and is a marker of acute or recent infection. Laura's IgM of 2.5 is within range, suggesting no acute immune activation.","low_causes":"Primary immunodeficiency, immunosuppressive therapy","high_causes":"Acute infection, early immune response, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"2.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5290","lower_normal":"0.4","upper_normal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.4","upper_optimal":"3.5","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the antibody found primarily in the mucosal surfaces of the gut, lungs and urinary tract, providing the first line of immune defence. Laura's IgA of 2.3 is within range. Adequate IgA is important for the coeliac screen (tTG IgA) to be valid, and Laura's level confirms the negative coeliac result is reliable.","low_causes":"Selective IgA deficiency (most common primary immunodeficiency), immunosuppressive therapy","high_causes":"Chronic infection, liver disease, autoimmune disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"1.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0099","lower_normal":"0","upper_normal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"50","lower_optimal_position":"0","upper_optimal_position":"0.2500","units":"IU/mL","description":"IgE is the antibody involved in allergic reactions and defence against parasites. Laura's IgE of 1.98 is very low, well within the normal range, indicating no significant allergic sensitisation or parasitic exposure.","low_causes":"Immunodeficiency (rare)","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor (RF)","group":"AUTOIMMUNE & CELIAC","result":"13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"10","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"IU/mL","description":"Rheumatoid factor is an antibody that targets the body's own immunoglobulin G, and is associated with rheumatoid arthritis and other autoimmune conditions. Laura's RF of 13 is just below the upper limit of 14. Given her known rheumatoid arthritis diagnosis, a positive or borderline RF is expected. Importantly, her CRP at 0.7 and ESR at 8 both suggest the disease is well controlled at the time of testing, which is encouraging.","low_causes":"Not clinically significant (absence does not exclude RA, as 20-30% of RA patients are seronegative)","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, lupus, chronic infection, liver disease, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA (tTG)","group":"AUTOIMMUNE & CELIAC","result":"0.658","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0458","lower_normal":"0","upper_normal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal":"0","upper_optimal":"7.19","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"tTG IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the lining of the small intestine and impairs nutrient absorption. Laura's result of 0.658 is negative and well below the threshold of 7.19. Combined with her adequate IgA level (ensuring the test is valid), coeliac disease has been excluded as a cause of her iron deficiency or fatigue.","low_causes":"Not applicable (negative is normal)","high_causes":"Coeliac disease, dermatitis herpetiformis, type 1 diabetes (occasionally mildly positive)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity (TAA)","group":"SPECIALIZED TESTS","result":"1.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7993","lower_normal":"1.3","upper_normal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"1.4","upper_optimal":"1.77","lower_optimal_position":"0.3809","upper_optimal_position":"0.6667","units":"mmol/L","description":"TAA measures the total capacity of the blood to neutralise free radicals, reflecting the combined effect of dietary antioxidants (vitamins C, E, polyphenols), the body's own antioxidant enzymes, and uric acid. Laura's TAA of 1.91 is above the laboratory range upper limit of 1.77. This is a positive finding, likely reflecting good dietary antioxidant intake and possibly augmented by her elevated bilirubin (which itself acts as an antioxidant). Above-range TAA is not harmful and indicates robust antioxidant defences.","low_causes":"Poor dietary intake of fruits and vegetables, oxidative stress, chronic illness","high_causes":"Good dietary antioxidant intake, supplementation, elevated bilirubin (Gilbert's syndrome), elevated uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"255","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4618","lower_normal":"145.4","upper_normal":"619.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"170","upper_optimal":"500","lower_optimal_position":"0.3852","upper_optimal_position":"0.5816","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and falling through the day. Laura's cortisol of 255 is within the morning reference range of 145 to 619 and sits in the lower half, which is a normal finding and does not suggest adrenal insufficiency or excess stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction, steroid withdrawal","high_causes":"Chronic stress, Cushing's syndrome, steroid use, sleep deprivation, illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"398","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"71.6","upper_normal":"1309.1","lower_normal_position":"","upper_normal_position":"","lower_optimal":"","upper_optimal":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone in premenopausal women, essential for bone health, cardiovascular protection, brain function, skin health and reproductive function. Laura's oestradiol of 398 falls within the follicular range (71.6 to 529.2) and the luteal range (204.8 to 786.1), suggesting the ovaries are still producing oestrogen. However, in the context of her FSH of 36.39 and LH of 47.28, both in the postmenopausal range, the brain is having to push much harder to get this level of oestrogen production. This is characteristic of the perimenopausal transition, where oestrogen can still be produced intermittently but the feedback loop between the brain and ovaries is breaking down.","low_causes":"Menopause, premature ovarian failure, hypothalamic amenorrhoea, low body fat, intense exercise","high_causes":"Ovulation, pregnancy, ovarian cyst, oestrogen therapy, obesity (aromatisation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"4.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0","upper_normal":"89.14","lower_normal_position":"","upper_normal_position":"","lower_optimal":"","upper_optimal":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is produced by the corpus luteum after ovulation and is essential for preparing the uterine lining for pregnancy and maintaining early pregnancy. Laura's progesterone of 4.62 is just above the follicular phase ceiling of 4.45, but well below the luteal range of 10.62 to 81.28. This suggests she has not ovulated in this cycle, which is consistent with description":"FSH is produced by the pituitary gland and stimulates the ovaries to mature eggs each month. As egg reserve declines, the pituitary increases FSH production to try to coax a response. Laura's FSH of 36.39 is well above the follicular range (2.5 to 10.2) and sits within the postmenopausal range (23 to 116.3). This confirms that the pituitary is having to work much harder than normal to stimulate the ovaries, consistent with advanced perimenopause and a depleted ovarian reserve, as confirmed by the AMH of 0.017.","low_causes":"Pituitary dysfunction, hypothalamic amenorrhoea, hormonal contraception, PCOS, pregnancy","high_causes":"Perimenopause, menopause, premature ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.5","upper_normal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"0.8","upper_optimal":"2.0","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and is important for energy, mood, libido, muscle maintenance, bone density and hair health. Laura's total testosterone of 0.8 is within the laboratory range of 0.5 to 2.6 but at the lower end. While the total level is within range, most of it is being bound by her high SHBG of 103.5, leaving very little available to tissues (free testosterone 0.006, below range). This combination of low-normal total testosterone and high SHBG is common in perimenopause.","low_causes":"Perimenopause, menopause, adrenal insufficiency, pituitary dysfunction, oral contraceptives (raise SHBG)","high_causes":"PCOS, congenital adrenal hyperplasia, adrenal tumour, ovarian tumour, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index (FAI)","group":"HORMONES","result":"0.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3483","lower_normal":"0.5","upper_normal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"1.0","upper_optimal":"5.0","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index is calculated from total testosterone and SHBG and estimates the proportion of testosterone that is biologically active. Laura's FAI of 0.77 is within the laboratory range but below the optimal floor of 1.0, confirming that SHBG is binding too much of her available testosterone. This may contribute to her fatigue, hair thinning and reduced energy.","low_causes":"High SHBG, perimenopause, oral contraceptives, hyperthyroidism","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"921.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5550","lower_normal":"95.81","upper_normal":"4053.25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal":"200","upper_optimal":"3000","lower_optimal_position":"0.3597","upper_optimal_position":"0.5673","units":"ug/dL","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. Laura's DHEA-S of 921.3 ug/dL (2.5 umol/L) is well within range, indicating healthy adrenal androgen production. This is reassuring because it means the low free testosterone is not caused by adrenal insufficiency but rather by the high SHBG binding most of what is produced.","low_causes":"Adrenal insufficiency, ageing, chronic illness, steroid use","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin" function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail

  if (b.description){

    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }

  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);

      <span class="bc-tick tick-${col}"></span>

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
