<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"dob":"10/11/1992","flags":"IgE 270 IU/ml, nearly three times the upper limit of 100. Indicates active allergic sensitisation. Allergy testing (skin prick or specific IgE panels) recommended to identify the trigger, particularly given digestive symptoms and frequent illness. Other immunoglobulins normal. IgM at the lower boundary (0.5) but within range.\nOestradiol 166 pmol/L, above the male upper limit of 146.1, alongside testosterone 16.8, within range but below the optimal threshold of 18. Suggests mildly increased aromatase activity. Recommend repeat fasting morning sample and clinical correlation with fatigue and brain fog.\nAmylase 155 IU/L, above the upper limit of 118, with lipase 47 (normal). Most likely macroamylasaemia. Record as baseline; if persistent on repeat, confirm with urine amylase clearance.\nPTH 4.9 pmol/L, marginally above the upper limit of 4.73, with vitamin D 208 nmol/L (high) and corrected calcium 2.33 (normal). Most likely biological variation. No action required unless it rises on repeat.\nCK 384 U/L, above the upper limit of 320. Almost certainly exercise-induced given moderate resistance training. No further investigation unless symptoms of muscle pain or dark urine.\nReticulocyte absolute count 41.97, marginally below the lower limit of 50, with reticulocyte percentage (0.86%), haemoglobin (152), ferritin (81) and all red cell indices normal. Normal variation; no action required.\nMCHC 346 g/L, one unit above the upper limit of 345. Laboratory variation, not clinically significant.\nTAA 2.25 mmol/L, above the upper limit of 1.77. Driven by supplementation (multivitamin, omega-3). Not a concern.\nReassuring negatives: thyroid function excellent with negative antibodies (family history of autoimmune disease noted), coeliac screen negative, liver entirely clean with FIB-4 0.79, kidney function normal with Cystatin C eGFR 99, fasting glucose, HbA1c and HOMA-IR all optimal, lipid profile excellent with ApoB 0.84 and Lp(a) below 25, PSA 0.34, tumour markers normal, rheumatoid factor negative, iron studies healthy, B12 and folate optimal, hsCRP 0.7 and ESR 3.","links":"The central thread in this report is that the blood results are largely excellent, and the symptoms Muhammed is experiencing are most likely being driven by two things the bloods can identify and two things they cannot. The first identifiable factor is the elevated IgE at 270, which tells us the immune system is in a state of heightened allergic activation. This could be driving fatigue, brain fog, bloating, and the pattern of frequent illness all at once, because an immune system focused on an allergic response diverts resources from other functions. The second identifiable factor is the mildly elevated oestradiol alongside a below-optimal testosterone, which could be contributing a layer of fatigue and low motivation on top of whatever the allergy is doing.\n\nThe two things the bloods cannot measure but the quiz strongly suggests are sleep insufficiency and dietary volume. Six to seven hours of sleep with a slow start and an afternoon crash is a pattern seen in people who are accumulating sleep debt, and the effect on energy, cognitive sharpness, and immune resilience is well documented. Muhammed's diet volume at 4 out of 10 with limited vegetable and fruit intake means fibre is likely low, which directly affects gut motility, fermentation patterns, and the bloating he reports. The combination of these four factors, allergic activation, hormonal imbalance, sleep debt, and low dietary fibre, explains the full symptom picture more convincingly than any single finding.\n\nWhat was excluded is just as important. His thyroid is functioning well with negative antibodies, making autoimmune thyroid disease very unlikely despite the family history. His iron, B12, and folate are all healthy, ruling out the common nutritional causes of fatigue. His blood sugar and insulin sensitivity are excellent, ruling out metabolic causes. His inflammatory markers are low, his liver and kidneys are clean, and his coeliac screen is negative. These exclusions are genuinely useful because they narrow the field to the allergic and lifestyle factors described above.\n\nThe two loose ends are the elevated amylase and the marginally raised PTH. The amylase is almost certainly benign given the normal lipase, and macroamylasaemia is the most likely explanation. The PTH at 4.9 with a vitamin D of 208 and normal calcium is mildly paradoxical but is most likely simple biological variation at the boundary. Neither requires urgent action, but both should be recorded as baselines.","summary":"Muhammed is a 33-year-old male of South Asian heritage presenting with a BMI of 24.8, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are slightly below average (volume 4 out of 10). He trains three times per week (two cardio, one resistance) at moderate intensity with 5,000 to 7,500 daily steps. He sleeps 6 to 7 hours a night, is slow to get going on waking, and experiences an afternoon energy crash. Stress feels hard to manage some weeks. He does not drink alcohol. He supplements with vitamin D, a multivitamin, and omega-3 fish oil. There is a family history of an autoimmune condition. A previous blood test returned normal results. He reports low energy and fatigue, brain fog, bloating and digestive discomfort, and frequent illness, all persisting for months. His goals are to improve sleep quality, energy levels, and digestion.\n\nThe standout positive in this report is Muhammed's cardiovascular profile, which is genuinely excellent. His total cholesterol is 4.3 with an LDL of 2.48, both well within healthy territory. His HDL, the protective cholesterol that carries fat away from artery walls, is 1.6, which is above the ideal threshold and puts him in the low-risk category. His triglycerides are 0.45, which is exceptionally low and reflects good insulin sensitivity and efficient fat metabolism. ApoB, the protein particle that ferries cholesterol into artery walls and the single best predictor of cardiovascular risk, is 0.84, below the 0.9 desirable threshold and not far from the optimal 0.8 target. His ApoB-to-ApoA1 ratio is 0.57, well below the 0.7 lower-risk cut-off, meaning the balance between atherogenic and protective particles is strongly in his favour. His Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk, is below 25, which is normal. This is a permanently useful piece of information because it means that any future lipid change would be entirely modifiable through diet and lifestyle rather than fixed by genetics. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 5 out of 100, which is ideal. At 33 with South Asian heritage, where cardiovascular disease tends to present a decade earlier than in European populations, this clean a profile is reassuring and worth protecting.\n\nHis blood sugar control is in good shape. Fasting glucose is 4.9, comfortably within the ideal range. HbA1c, a measure of average blood sugar over the previous two to three months, is 39 mmol/mol, which sits below the 42 threshold for pre-diabetes and within the optimal zone. Fasting insulin at 4.89 is low and healthy, and his HOMA-IR, an index that estimates how hard the body has to work to keep blood sugar under control (calculated from glucose and insulin together), is 1.06, which sits right in the insulin-sensitive range. For a man of South Asian descent, where the population risk of type 2 diabetes is roughly four times higher than in European populations, and with a family history of autoimmune disease (which can include type 1 diabetes), this metabolic picture is a genuine strength.\n\nHis liver is in excellent health. ALT at 28 is below the stricter optimal cut-off of 30, and GGT at 15 is well below 25, which is about as clean as that enzyme gets. AST at 36 is within range and the De Ritis ratio (AST divided by ALT) at 1.29 is at the top of its optimal band, which in the context of a mildly elevated CK is explained by muscle turnover rather than liver stress. His FIB-4 score, a fibrosis screening index, is 0.79, well within the safe zone, and the APRI and NAFLD fibrosis scores both confirm there is no sign of liver scarring or fatty liver disease. Bilirubin at 14 is healthy. Albumin at 43 confirms the liver is synthesising protein normally.\n\nKidney function is solid. His Cystatin C, a more accurate filtration marker than creatinine alone because it is not influenced by muscle mass, is 0.93, giving a Cystatin C eGFR of 99 and a combined eGFR of 99 ml/min, which is exactly where it should be at 33. Urea, creatinine, and all electrolytes are within range. His serum osmolality at 288.8 is normal, meaning fluid balance is well maintained.\n\nThyroid function is working well. TSH at 0.75 is at the lower end of range but paired with a free T4 of 20.6 and a free T3 of 5.8, both within their optimal bands, this means the pituitary gland is not having to push hard because the thyroid is producing plenty of hormone on its own. The FT3-to-FT4 ratio at 0.282 confirms healthy conversion from the storage hormone T4 to the active hormone T3. Both thyroid antibodies, TPO and thyroglobulin, are negative, which given the family history of autoimmune disease is particularly reassuring and makes autoimmune thyroid disease very unlikely at present.\n\nHis PhenoAge, a biological ageing score calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 26.4 years against a calendar age of 33, meaning his blood markers suggest a body that is ageing roughly six and a half years younger than expected. This is a strong result and reflects his generally clean metabolic and inflammatory profile.\n\nTurning to the findings that need attention. His IgE is 270, nearly three times the upper limit of 100. IgE is the antibody class the immune system deploys in allergic responses, whether to airborne allergens like dust mites, pollen, and animal dander, or to food allergens, or to parasitic infections. A level this high in a 33-year-old with digestive symptoms (bloating, discomfort) and frequent illness strongly suggests an allergic or atopic process is active. This does not tell us what the trigger is, but it does tell us the immune system is in a state of heightened allergic readiness. Given his digestive symptoms, food allergy or intolerance is one possibility, but environmental allergens are equally common. The practical next step is allergy testing, either skin prick testing or specific IgE panels through his GP, to identify the trigger. It is worth noting that his other immunoglobulins, IgG at 11.4, IgA at 2.0, and IgM at 0.5, are all within their laboratory ranges, meaning the rest of his immune architecture is intact. His IgM sits right at the lower boundary of its range at 0.5, which on its own is not a concern but is worth noting in the context of frequent illness. His tissue transglutaminase IgA, the coeliac screening antibody, is negative, which rules out coeliac disease as a cause of his bloating.\n\nHis oestradiol is 166 pmol/L, above the male upper limit of 146.1. Oestradiol is the primary oestrogen, and in men it is produced by an enzyme called aromatase that converts testosterone into oestradiol, mainly in body fat but also in the liver and other tissues. At a BMI of 24.8, excess body fat is not the obvious driver here. Possible explanations include naturally higher aromatase activity, the slight insulin sensitivity pattern (though his insulin is low, so this is unlikely to be the main driver), or simply normal biological variation that sits just above a laboratory cut-off. His testosterone at 16.8 is within the laboratory range of 8.4 to 28.7 but sits below the optimal band of 18 to 30 for a 33-year-old man. Free testosterone at 0.344 and bioavailable testosterone at 8.07 are both within range, and his SHBG at 34.1 is healthy, so testosterone is not being excessively bound. The mildly elevated oestradiol alongside a below-optimal testosterone could suggest that aromatase is converting a slightly larger share of testosterone into oestradiol than is ideal. This is not an urgent finding, but it is worth discussing with his GP, particularly because oestradiol above range in men can contribute to fatigue, brain fog, and low drive, all of which Muhammed reports. A repeat fasting morning sample would confirm whether this pattern is consistent.\n\nHis parathyroid hormone (PTH) is 4.9 pmol/L, just above the upper limit of 4.73. PTH is the hormone that regulates calcium levels by pulling calcium from bone, increasing calcium absorption from the gut, and reducing calcium loss through the kidneys. A raised PTH usually signals that the body is trying to maintain calcium levels, often because vitamin D or calcium intake is insufficient. However, Muhammed's vitamin D is 208 nmol/L, which is well above the sufficient threshold and above the optimal ceiling of 120, and his corrected calcium at 2.33 is normal. At this vitamin D level, PTH should be fully suppressed, so seeing it marginally above range is mildly paradoxical. The most likely explanation is that this is a marginal overshoot with no clinical significance. It does not warrant action now, but if it were to rise on a future test alongside any change in calcium, it would be worth investigating further.\n\nHis amylase is 155 IU/L, above the upper limit of 118. Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. An elevated amylase in the absence of abdominal pain, nausea, or a history of pancreatitis is usually benign, and the most common cause is a condition called macroamylasaemia, where amylase binds to immunoglobulins in the blood and is cleared more slowly than usual. Importantly, his lipase at 47 is comfortably within range. Lipase is the more specific pancreatic enzyme, and a normal lipase alongside an elevated amylase makes pancreatic disease very unlikely. His digestive symptoms of bloating could theoretically involve the pancreas, but with a normal lipase and no pain, this is far more likely to be a benign elevation. His GP should be made aware so it can be recorded as a baseline, and if it remains elevated on repeat testing, macroamylasaemia can be confirmed with a simple urine test.\n\nHis creatine kinase (CK) is 384 U/L, above the upper limit of 320. CK is an enzyme found predominantly in skeletal muscle that leaks into the blood after muscle damage or heavy use. At this margin, with a man who trains three times a week including resistance work, this is almost certainly exercise-induced and does not indicate a muscle disorder. If the sample was taken within 48 hours of a training session, this result is expected. It explains the mildly elevated AST as well, since AST is found in muscle as well as in the liver, and when CK is elevated from exercise, AST often follows.\n\nHis total antioxidant activity (TAA) is 2.25, above the upper limit of 1.77. TAA measures the combined antioxidant capacity of the blood, and elevations above range are almost always driven by supplementation, particularly vitamin C, vitamin E, and polyphenol-containing supplements. Given that Muhammed takes a multivitamin and omega-3, this is the most likely explanation. This is not a concern.\n\nHis reticulocyte absolute count is 41.97, just below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count can suggest the marrow is producing red cells at a slightly slower rate. However, his haemoglobin at 152, red cell count at 4.88, MCV at 88.9, and ferritin at 81 are all healthy, and his reticulocyte percentage at 0.86 is within range. This marginal absolute count in the context of entirely normal red cell indices is not a clinical concern and most likely reflects normal day-to-day variation in marrow output.\n\nHis MCHC at 346 is marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin within each red cell, and at one unit above range, this is laboratory variation rather than a genuine abnormality, particularly given that the lab notes MCHC can be affected by temperature and storage.\n\nNow, to the question that matters most to Muhammed: the fatigue, brain fog, bloating, and frequent illness. The bloods have ruled out the most common medical causes. His thyroid is working well, his iron stores are healthy with a ferritin of 81 and a transferrin saturation of 32.5%, his B12 at 547 is within the optimal range, his folate at 16 is strong, his blood sugar and insulin are excellent, his inflammatory markers are low (hsCRP 0.7, ESR 3), his liver and kidneys are clean, and his cortisol at 348 sits comfortably within the morning reference range. What the bloods do show is a significantly elevated IgE, which points to an active allergic process that could contribute to all four symptoms: allergic inflammation can cause fatigue and brain fog through immune activation and histamine release, it can cause bloating through gut mucosal irritation, and it can make someone more susceptible to viral infections by keeping the immune system occupied with an allergic response rather than focused on pathogen defence. The mildly elevated oestradiol and below-optimal testosterone may also contribute to the fatigue and low drive, though this is a smaller factor. Beyond the bloods, the lifestyle data point to two clear contributors. First, 6 to 7 hours of sleep with a slow start and an afternoon crash is a pattern consistent with insufficient sleep and possibly a delayed circadian rhythm. The afternoon crash in particular suggests either sleep debt catching up, a post-lunch blood sugar dip (though his glucose control is excellent, so this is less likely), or a cortisol rhythm that dips too early in the day. Second, his diet volume at 4 out of 10 with only 2 to 3 portions of vegetables and fruit is likely leaving him short on fibre (which directly affects bloating and gut motility) and possibly short on total energy, which at a training load of three sessions per week and 5,000 to 7,500 steps would leave the body under-fuelled. The combination of low food volume, moderate sugar intake, low fibre, and an active allergic process is a plausible explanation for the digestive symptoms. The next investigations that would help settle this are: allergy testing through the GP (skin prick or specific IgE panels for common environmental and food allergens), a food and symptom diary for two to three weeks to identify bloating triggers, and a trial of increasing sleep to 7.5 to 8 hours with a fixed wake time to see whether the fatigue and brain fog resolve.\n\nLate-arriving results: your urine results have now been added. Every urine test came back normal: no protein, glucose, ketones, blood or white cells, negative nitrites and no growth on culture, so there is no sign of kidney or urinary tract problems.","is_retest":false,"lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, or tinned fish. Anchor: before anything else goes on the plate. Why: at a diet volume of 4 out of 10 with three training sessions a week, total protein is likely below the 99 to 122 grams a day Muhammed needs, and protein supports testosterone production and immune function.\nIncrease vegetables to 4 to 5 portions a day, starting with one extra portion at lunch and one at dinner. Add spinach, broccoli, peppers, or mixed salad to whatever is already on the plate. Why: fibre from vegetables feeds the gut bacteria that regulate bloating and digestive comfort, and 2 to 3 portions is not enough to support healthy gut motility.\nReduce sugary foods from some days to once or twice a week, swapping for fruit, nuts, or dark chocolate. Anchor: when the craving hits in the afternoon, reach for the swap first. Why: sugar feeds the less helpful gut bacteria and can worsen bloating, and the afternoon crash Muhammed reports may partly be a rebound from a sugary lunch or snack.\nSet a fixed wake time seven days a week, no more than 30 minutes of variation at weekends. Aim for 7.5 to 8 hours in bed. Anchor: set an alarm for the same time every day, including days off. Why: the slow start and afternoon crash pattern suggests insufficient sleep or a shifted circadian rhythm, and a fixed wake time is the single most effective way to reset it.\nGet outside within 30 minutes of waking, even for five minutes. Anchor: shoes on before the phone comes off charge. Why: morning light suppresses melatonin and advances the cortisol awakening response, which directly addresses the slow-to-get-going pattern.\nCut caffeine after 1pm. Anchor: last coffee with or just after lunch. Why: caffeine has a half-life of five to six hours, so a 3pm coffee is still active at 9pm and reduces deep sleep even if Muhammed falls asleep normally.\nAdd one more resistance session per week, building to two. Why: resistance training is the most effective stimulus for testosterone production, and Muhammed's testosterone at 16.8 with a below-optimal level of 18 could benefit from the signal that heavy compound movements provide. It also improves insulin sensitivity and bone density.\nCalorie target: approximately 2,200 to 2,400 kcal per day based on a BMR of roughly 1,740 and a moderate activity multiplier. Protein target: 99 to 122 grams per day (1.3 to 1.6 g per kg of bodyweight). Increasing from the current intake volume of 4 out of 10 to closer to 6 out of 10, with a focus on protein and vegetables rather than simply eating more of everything, would support energy, recovery, and gut health.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","units":"/100","result":"74","padding":"1","one_sided":"0.5","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","range_type":"no upper","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 76.6; held to 74 by a system rated \"Needs attention\". Weakest systems: digestive 7%, immunology 19%, specialized tests 40%. Biggest drags: Oestradiol, Vitamin D 25(OH), Reticulocyte Absolute Count, Amylase.","high_causes":"","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","units":"years","result":"26.4","padding":"1","one_sided":"0.5","low_causes":"Low inflammation, healthy blood counts","range_type":"no lower","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. Muhammed's PhenoAge is 26.4 against a calendar age of 33, meaning his blood markers suggest a body that is ageing approximately six and a half years younger than expected. This is a strong result driven by his low CRP, healthy albumin, normal glucose, and well-maintained blood counts. Maintaining the lifestyle changes recommended in this report should preserve or improve this advantage.","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3474","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","units":"/100","result":"5","padding":"1","one_sided":"0.5","low_causes":"Excellent lipid profile and metabolic health","range_type":"no lower","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the vascular risk being built rather than the ten-year probability of an event. At 5 out of 100, this is ideal, driven by the excellent HDL of 1.6, very low triglycerides of 0.45, ApoB of 0.84 below the desirable threshold, normal Lp(a), low hsCRP, and healthy HbA1c. For a 33-year-old man of South Asian heritage, this is a particularly strong result.","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/L","result":"4.9","padding":"1","one_sided":"0.5","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","range_type":"normal","description":"Blood glucose measures the amount of sugar circulating in the bloodstream after fasting. At 4.9, Muhammed's fasting glucose sits comfortably within the ideal range of 4.0 to 5.4, confirming healthy blood sugar regulation. This is a particularly reassuring result given his South Asian heritage, where the population risk of type 2 diabetes is significantly elevated.","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, medications","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","units":"%","result":"5.8","padding":"1","one_sided":"0.5","low_causes":"Anaemia, blood loss, haemoglobin variants","range_type":"no lower","description":"HbA1c expressed as a percentage. At 5.8%, this is within the normal range of below 6.0%. This marker is reported alongside the mmol/mol value below, which is the primary unit used for clinical interpretation.","high_causes":"Pre-diabetes, diabetes, iron deficiency","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","units":"mmol/mol","result":"39","padding":"1","one_sided":"0.5","low_causes":"Anaemia, blood loss, haemoglobin variants","range_type":"no lower","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has become glycated, meaning sugar has attached to it. Because red blood cells live for roughly three months, this gives an average picture of blood sugar control over that period. At 39, Muhammed is below the pre-diabetes threshold of 42 and within the optimal zone of below 36. This confirms excellent long-term glucose control.","high_causes":"Pre-diabetes, diabetes, iron deficiency, reduced red cell turnover","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","units":"mIU/L","result":"4.89","padding":"1","one_sided":"0.5","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","range_type":"normal","description":"Insulin is the hormone produced by the pancreas to move glucose from the blood into cells for energy. Fasting insulin is one of the earliest markers to rise when insulin resistance is developing. At 4.89, Muhammed's insulin is low and healthy, sitting within the optimal band of 2 to 8. This means his pancreas is controlling blood sugar with minimal effort, a sign of excellent metabolic health.","high_causes":"Insulin resistance, pre-diabetes, high carbohydrate intake, obesity, PCOS","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3676","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","units":"ug/L","result":"1.29","padding":"1","one_sided":"0.5","low_causes":"Low insulin demand, type 1 diabetes, low carbohydrate intake","range_type":"normal","description":"C-Peptide is released by the pancreas in equal amounts to insulin and is a more stable measure of how much insulin the body is actually producing. At 1.29 ug/L (equivalent to approximately 427 pmol/L), Muhammed's C-Peptide is within the laboratory range but sits just below the optimal band. In the context of his low and healthy fasting insulin and excellent glucose control, this simply confirms that his pancreas is producing an appropriately small amount of insulin because it does not need to produce more. This is a reflection   }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
