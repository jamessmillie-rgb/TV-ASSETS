or the presence of protein leaking from the kidneys into the urine. A negative result is normal and indicates the kidneys' filtering membranes are intact and not allowing protein through. This is consistent with her healthy kidney function markers.","low_causes":"","high_causes":"Kidney disease, urinary tract infection, exercise, dehydration, hypertension","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_ketones","name":"Urine Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine ketones test for the presence of ketone bodies, which are produced when the body burns fat for fuel instead of glucose. A negative result indicates normal glucose metabolism and no significant fat catabolism, consistent with her adequate dietary intake.","low_causes":"","high_causes":"Fasting, ketogenic diet, uncontrolled diabetes, starvation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_glucose","name":"Urine Glucose","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine glucose tests for sugar spilling into the urine, which occurs when blood glucose exceeds the kidneys' reabsorption capacity. A negative result is normal and consistent with Soraya's healthy fasting glucose of 4.1.","low_causes":"","high_causes":"Uncontrolled diabetes, renal glycosuria, SGLT2 inhibitor medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"specific_gravity","name":"Specific Gravity","group":"URINALYSIS","result":"1.02","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Specific gravity measures the concentration of the urine. A value of 1.02 is within the normal range of 1.005 to 1.030, indicating adequate hydration. Neither overly dilute nor overly concentrated.","low_causes":"Excessive water intake, diabetes insipidus","high_causes":"Dehydration, heart failure, SIADH","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urobilinogen","name":"Urobilinogen","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urobilinogen is a breakdown product of bilirubin. Small amounts in urine are normal, and a negative result is acceptable, indicating normal bilirubin metabolism and no evidence of haemolysis or liver disease.","low_causes":"Bile duct obstruction, antibiotic use","high_causes":"Haemolysis, liver disease, increased bilirubin production","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_casts","name":"Urine Casts","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine casts are cylindrical structures formed in the kidney tubules that can indicate kidney disease when present. A negative result is normal and indicates healthy kidney tubular function.","low_causes":"","high_causes":"Kidney disease, dehydration, nephrotic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_wbc","name":"Urine WBC","group":"URINALYSIS","result":"< 1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"wbc/ul","description":"Urine white blood cells indicate an immune response in the urinary tract. At less than 1, well below the significant threshold of 10, this is normal and shows no inflammatory response in the urinary tract. This is notable given the positive urine culture, as a true urinary tract infection would typically cause elevated urinary WBCs.","low_causes":"No urinary tract inflammation (normal)","high_causes":"Urinary tract infection, kidney infection, interstitial cystitis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_rbc","name":"Urine RBC","group":"URINALYSIS","result":"< 1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"rbc/ul","description":"Urine red blood cells test for blood in the urine, which can indicate infection, kidney stones, or more serious urological conditions. At less than 1, well below the significant threshold of 25, this is normal and reassuring.","low_causes":"Normal finding","high_causes":"Urinary tract infection, kidney stones, bladder/kidney cancer, glomerulonephritis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_nitrites","name":"Urinary Nitrites","group":"URINALYSIS","result":"Positive","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urinary nitrites are produced when certain bacteria, particularly E. coli, convert dietary nitrates to nitrites. A positive result supports the presence of bacteria in the urine. In Soraya's case, this is consistent with the E. coli growth on culture. However, the absence of urinary WBCs (less than 1) and the plain bottle collection (no boric acid preservative) mean this result should be interpreted with caution. If Soraya has no urinary symptoms, this may represent asymptomatic bacteriuria or specimen contamination.","low_causes":"","high_causes":"Bacterial urinary tract infection (especially E. coli), specimen contamination","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bacterial_count","name":"Bacterial Count","group":"URINALYSIS","result":"10^5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CFU/ml","description":"The bacterial count of 10^5 (100,000) colony-forming units per millilitre is at the threshold traditionally considered significant for a mid-stream urine sample. Two organisms were identified: E. coli and Enterococcus faecalis. However, the plain bottle collection without boric acid preservative means bacterial overgrowth during transit may have inflated this count. Combined with the absence of urinary WBCs, clinical correlation is essential. If Soraya has urinary symptoms, treatment may be warranted. If asymptomatic, this is likely either contamination or asymptomatic bacteriuria, which does not require treatment in most non-pregnant adults.","low_causes":"No bacterial growth, contamination-free collection","high_causes":"Urinary tract infection, specimen contamination, plain bottle overgrowth","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_culture","name": function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){

    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();

    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);

}

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
