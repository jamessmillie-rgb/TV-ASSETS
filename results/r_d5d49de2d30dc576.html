vascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"176.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a modified form of LDL that is entirely genetically determined. It cannot be changed by diet, exercise, or any currently available medication. At 176.87, Soraya's Lp(a) is significantly elevated and places her in the moderate risk category (90 to 200 nmol/L). Lp(a) is more adhesive to artery walls than standard LDL, promotes cholesterol deposition, encourages blood clotting, and drives inflammation, all of which increase cardiovascular risk. Each Lp(a) particle carries one ApoB molecule, meaning a substantial portion of her elevated ApoB is accounted for by Lp(a) rather than standard LDL. This is a permanent finding that should be recorded in her medical notes for life. First-degree relatives should be offered testing as Lp(a) is inherited. Novel Lp(a)-lowering therapies are currently in late-stage clinical trials.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, non-modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0633","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is calculated by dividing triglycerides by HDL (0.68 / 3.5 = 0.19). It is one of the most reliable markers of metabolic health and insulin sensitivity. At 0.19, this is outstanding and among the most favourable ratios possible, reflecting Soraya's excellent triglyceride level and exceptionally high HDL. This result provides strong evidence that her metabolic machinery for fat processing is working exceptionally well.","low_causes":"Excellent metabolic health, high HDL, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, high triglycerides, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1375","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL (7.7 - 3.5 - 3.98 = 0.22). It represents the cholesterol carried in triglyceride-rich remnant particles, which are increasingly recognised as independently atherogenic. At 0.22, well below the optimal threshold of 0.5, this is an excellent result and consistent with her low triglycerides.","low_causes":"Low triglycerides, excellent metabolic health","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein is the most sensitive blood marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. At 0.5, comfortably below the optimal threshold of 1.0, Soraya's systemic inflammation is extremely well controlled. For a 66-year-old with hypertension, this is a genuinely impressive result that reflects the anti-inflammatory effects of her excellent diet and regular exercise.","low_causes":"Low systemic inflammation, anti-inflammatory diet, regular exercise","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. It is a non-specific marker of inflammation that rises with infection, autoimmune disease, and chronic inflammatory conditions. At 2, this is about as low as it gets and confirms the absence of any significant inflammatory process in the body, consistent with her excellent hs-CRP.","low_causes":"No significant inflammation","high_causes":"Infection, autoimmune disease, cancer, anaemia, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"137","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"135","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is the primary electrolyte controlling fluid balance and blood pressure. At 137, this is within the optimal range and is being appropriately managed despite her losartan (ARB) therapy, which affects sodium handling through the renin-angiotensin system.","low_causes":"Diuretics, excessive water intake, heart failure, liver disease, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for nerve signalling, muscle contraction, and heart rhythm. At 4.9, this is within the laboratory range but towards the upper end and above the optimal ceiling of 5.0 by a small margin. Losartan, the ARB Soraya takes for blood pressure, reduces aldosterone signalling, which can raise potassium. At 4.9, this is not concerning but should be monitored at each blood test to ensure it does not drift above the upper limit of 5.3. The lab notes that delayed separation can affect potassium results.","low_causes":"Diuretics, diarrhoea, vomiting, excessive sweating","high_causes":"ARBs, ACE inhibitors, kidney disease, potassium-rich diet, haemolysed sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 98, this is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6136","units":"mmol/L","description":"Bicarbonate is the primary buffer in the blood that maintains the acid-base balance. At 26.5, this is within the optimal range and indicates normal acid-base status.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Vomiting, metabolic alkalosis, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"17.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7250","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate), giving (137 + 4.9) - (98 + 26.5) = 17.4. It estimates unmeasured anions in the blood. At 17.4, this is marginally above the standard range of 8 to 16. A mildly elevated anion gap can be influenced by albumin levels and is most significant when markedly elevated. At this margin, with normal kidney function, normal glucose, and no metabolic acidosis, this is unlikely to be clinically significant but can be noted for context.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Lactic acidosis, ketoacidosis, renal failure, toxin ingestion, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5877","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6228","units":"mmol/L","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction, and blood clotting. At 2.52, this is within the optimal range. The lab notes that calcium can be falsely reduced in older specimens, so this result on a reasonably processed sample is reliable and reassuring.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration, giving a more accurate picture of biologically active calcium. At 2.5, within the optimal range, this confirms that Soraya's calcium metabolism is healthy, supported by her excellent vitamin D level of 146 and appropriately functioning parathyroid glands (PTH 2.5).","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium (Serum)","group":"ELECTROLYTES & MINERALS","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5747","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6149","units":"mmol/L","description":"Serum magnesium measures the magnesium circulating in the blood. At 0.95, this is within the optimal range of 0.85 to 1.05. However, serum magnesium only reflects about 1% of total body magnesium, as most is stored inside cells and in bone. Soraya's red cell magnesium at 28.48 is marginally below the lower limit of 29, suggesting that while her serum level is healthy, her intracellular stores are slightly depleted.","low_causes":"Poor intake, excessive sweating, alcohol, diuretics, diarrhoea","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"red_cell_magnesium","name":"Red Cell Magnesium","group":"ELECTROLYTES & MINERALS","result":"28.48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2957","lower_normal":"29","upper_normal":"42","lower_optimal":"33","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3641","upper_optimal_position":"0.6179","units":"mg/L","description":"Red cell magnesium measures the magnesium stored inside red blood cells, which reflects longer-term magnesium status more accurately than serum magnesium. At 28.48, marginally below the lower limit of 29, this indicates mild intracellular magnesium depletion. Magnesium is essential for over 300 enzymatic processes in the body, including energy production, muscle function, nerve signalling, and sleep regulation. At seven training sessions per week, Soraya is losing magnesium through sweat and using it heavily for muscle contraction. This mild depletion may contribute to her brain fog and warrants supplementation with magnesium glycinate.","low_causes":"High training volume, excessive sweating, inadequate dietary intake, stress, medications","high_causes":"Excessive supplementation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"324","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is the end product of purine metabolism. Purines are found in certain foods, particularly red meat, organ meats, and shellfish, and are also produced by the body during cell turnover. At 324, this is within the laboratory range but marginally above the optimal ceiling of 320 for women. As a pescatarian, Soraya's purine intake from fish may contribute modestly. This is a borderline result and not concerning.","low_causes":"Low purine diet, certain medications","high_causes":"High purine diet, gout, kidney disease, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. At 7.5, this is within the laboratory range but above the optimal ceiling of 7.0. This may simply reflect her high protein intake from fish and other sources, or mild dehydration at the time of sampling. With kidney function confirmed as adequate by Cystatin C eGFR of 83, this is not a concern.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5285","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3480","upper_optimal_position":"0.6179","units":"umol/L","description":"Creatinine is a waste product of muscle metabolism filtered by the kidneys. At 73, this is within the optimal range. However, in Soraya's case, at 46 kg with low muscle mass, creatinine-based eGFR may underestimate true kidney function, which is why the Cystatin C-based eGFR of 83 is the more reliable measure.","low_causes":"Low muscle mass, vegetarian/pescatarian diet","high_causes":"Kidney disease, high muscle mass, dehydration, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"999","lower_optimal":"90","upper_optimal":"999","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimated from creatinine represents how well the kidneys filter waste from the blood. At 74, this is above the threshold of 60 that defines adequate kidney function. However, at 46 kg with low muscle mass, this creatinine-based calculation likely underestimates Soraya's true kidney function. The Cystatin C-based eGFR of 83 is the more accurate measure in her case and is significantly higher.","low_causes":"Kidney disease, age-related decline, dehydration","high_causes":"High cardiac output, pregnancy, early diabetes","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6917","lower_normal":"60","upper_normal":"999","lower_optimal":"90","upper_optimal":"999","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The Cystatin C-based eGFR uses Cystatin C, a small protein produced at a constant rate by all nucleated cells, to estimate kidney function. Unlike creatinine, it is not affected by muscle mass, making it more accurate for someone of Soraya's build. At 83, this is a better estimate of her true kidney function than the creatinine-based eGFR of 74. While below the optimal threshold of 90, at 66 years old some decline in filtration rate is expected and a value of 83 represents healthy age-appropriate kidney function.","low_causes":"Age-related decline, kidney disease, hypertension","high_causes":"High cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4136","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein freely filtered by the kidneys. Its blood level rises when kidney function declines. At 0.91, below the upper limit of 1.1 and within the optimal range, this confirms that Soraya's kidneys are filtering effectively. Combined with the Cystatin C eGFR of 83, this provides strong reassurance about her kidney health.","low_causes":"Not clinically significant","high_causes":"Kidney disease, hyperthyroidism, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"137","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein in red blood cells. At 137, this is within the optimal range for a woman and indicates good oxygen-carrying capacity. This is a healthy result that supports her active training schedule.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6100","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the number of red cells per litre of blood. At 4.63, this is within the optimal range and consistent with her healthy haemoglobin and iron studies.","low_causes":"Anaemia, bleeding, bone marrow disorders, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.395","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit is the percentage of blood volume occupied by red blood cells. At 0.395, or 39.5%, this is within the optimal range and indicates healthy blood composition with good oxygen delivery capacity.","low_causes":"Anaemia, overhydration, bleeding","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6111","units":"%","description":"RDW, red cell distribution width, measures the variation in size of red blood cells. A wider distribution can indicate that new red cells being produced are a different size from older ones, which occurs in iron, B12, or folate deficiency. At 14.4, marginally above the upper limit of 14, this is a very small elevation. With B12 at 650, folate at 17, and iron studies showing a ferritin of 42 with transferrin saturation at 30%, there is no nutritional deficiency driving this. Age-related variation in red cell production is the most likely explanation.","low_causes":"Not clinically significant","high_causes":"Iron deficiency, B12/folate deficiency, mixed anaemia, thalassemia trait, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"85.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4611","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"96","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3389","upper_optimal_position":"0.6056","units":"fL","description":"MCV, mean corpuscular volume, is the average size of a red blood cell. At 85.3, this is within the optimal range and indicates red cells of normal size, ruling out the microcytic (small cell) pattern seen in iron deficiency and the macrocytic (large cell) pattern seen in B12 or folate deficiency.","low_causes":"Iron deficiency, thalassemia, chronic disease","high_causes":"B12/folate deficiency, alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"29.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"pg","description":"MCH, mean corpuscular haemoglobin, is the average amount of haemoglobin per red blood cell. At 29.5, this is within the optimal range, indicating each red cell is carrying an adequate amount of oxygen-carrying haemoglobin.","low_causes":"Iron deficiency, thalassemia","high_causes":"B12/folate deficiency, macrocytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"347","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"MCHC, mean corpuscular haemoglobin concentration, is the average concentration of haemoglobin within each red blood cell. At 347, this is marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and sample storage. At this tiny margin of elevation, this is almost certainly a sample handling effect rather than a genuine clinical finding. It does not warrant any action.","low_causes":"Iron deficiency, thalassemia","high_causes":"Hereditary spherocytosis, sample handling artefact, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"255","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4679","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3410","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small cell fragments that form clots to stop bleeding. At 255, this is within the optimal range and indicates healthy platelet production by the bone marrow and adequate clotting capacity.","low_causes":"Viral infection, autoimmune disorders, bone marrow suppression, liver disease","high_causes":"Infection, inflammation, iron deficiency, post-surgical, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"8.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV, mean platelet volume, measures the average size of platelets. At 8.5, this is within the optimal range and indicates platelets of normal size with normal function.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Increased platelet destruction, inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3739","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. At 4.73, this is within the laboratory range but below the optimal floor of 5.0. At Soraya's BMI of 18.2, a slightly lower white cell count can be normal and does not suggest immune deficiency. All the differential counts (neutrophils, lymphocytes, monocytes, eosinophils) are within range, confirming a healthy immune balance.","low_causes":"Low body weight, viral infection, bone marrow suppression, autoimmune conditions","high_causes":"Infection, inflammation, stress, medications, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3573","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 2.36, this is within the laboratory range but below the optimal floor of 2.5. Combined with the overall WBC of 4.73, this simply reflects Soraya's lean body composition and is not concerning. People of South Asian heritage can also have naturally lower neutrophil counts.","low_causes":"Ethnicity (benign ethnic neutropenia), low body weight, viral infection, medications","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes include T cells, B cells, and natural killer cells, all of which play critical roles in adaptive immunity and fighting viral infections. At 1.8, this is within the optimal range.","low_causes":"Viral infection, HIV, corticosteroids, autoimmune conditions","high_causes":"Viral infection, chronic lymphocytic leukaemia, stress response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4458","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are large white blood cells that migrate into tissues where they become macrophages, engulfing pathogens and debris. At 0.47, this is within the optimal range.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Chronic infection, autoimmune disease, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasites and in allergic responses. At 0.09, this is low-normal and consistent with her low IgE of 14.1, indicating no allergic or parasitic activity.","low_causes":"Acute stress, corticosteroid use","high_causes":"Allergies, asthma, parasitic infection, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2500","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"Basophils are the rarest white blood cells and play a role in allergic responses and inflammation. At 0.01, marginally below the lower limit of 0.02, this is clinically insignificant. Basophils exist at such low absolute numbers that minor fluctuations are meaningless.","low_causes":"Normal variation, acute stress, hyperthyroidism","high_causes":"Allergic reactions, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, immature red blood cells freshly released from the bone marrow. The reticulocyte percentage reflects how actively the bone marrow is producing new red cells. At 1.05%, this is within the optimal range and indicates normal red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic disease","high_causes":"Recovery from bleeding or anaemia, haemolysis, EPO use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"48.615","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3101","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"The absolute reticulocyte count is the total number of young red blood cells per litre of blood. At 48.6, this is marginally below the lower limit of 50. The percentage (1.05%) is within range, and the slight shortfall in absolute count simply reflects the calculation against her red cell count. This is a trivial difference with no clinical significance.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic disease","high_causes":"Recovery from bleeding, haemolysis, EPO use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4883","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio, calculated as neutrophils divided by lymphocytes (2.36 / 1.8 = 1.31), is a marker of systemic inflammation and immune balance. At 1.31, this is within the optimal range of 1.0 to 2.0 and indicates a healthy balance between innate and adaptive immune function with no sign of chronic inflammation or physiological stress.","low_causes":"Not clinically significant","high_causes":"Infection, inflammation, physiological stress, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"29.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4412","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3522","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures the percentage of the iron-transport protein transferrin that is loaded with iron. At 29.94%, this is within the optimal range of 25 to 40%, indicating a healthy balance of iron being transported to where it is needed without excess.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"19.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4907","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"26","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3474","upper_optimal_position":"0.5935","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. At 19.1, this is within the optimal range. Serum iron fluctuates with meals and time of day, so it is best interpreted alongside transferrin saturation and ferritin, both of which are also healthy.","low_causes":"Iron deficiency, chronic disease, poor dietary intake","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3359","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. At 2.54, this is at the very lower edge of the laboratory range (2.5 to 3.8) and below the optimal floor of 2.7. Transferrin levels can be slightly lower when iron stores are adequate (the body produces less transport protein when it does not need to scavenge for iron). With ferritin at 42 and transferrin saturation at 30%, this pattern is consistent with adequate iron stores rather than a problem with transferrin production.","low_causes":"Adequate iron stores (reduced demand), inflammation (negative acute phase protein), liver disease, malnutrition","high_causes":"Iron deficiency (body increases production to find more iron), pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"56.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6143","units":"umol/L","description":"Total iron binding capacity measures the blood's total capacity to bind iron, reflecting how much transferrin is available. At 56.6, this is within the optimal range and consistent with the balanced iron picture seen across all of Soraya's iron markers.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3714","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.5297","units":"ng/ml","description":"Ferritin is the body's iron storage protein. Each ferritin molecule can hold thousands of iron atoms, so the blood ferritin level reflects total body iron stores. At 42, this is within the optimal range of 40 to 150 for a woman. This is a healthy iron store that provides adequate reserve without excess. For someone on a pescatarian diet, maintaining ferritin above 40 demonstrates good dietary iron intake from fish and plant sources.","low_causes":"Iron deficiency, heavy menstruation, chronic bleeding, poor dietary intake","high_causes":"Iron overload, inflammation (acute phase protein), liver disease, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"672","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5420","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5818","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal pattern, peaking in the early morning and declining through the day. At 672, Soraya's cortisol is above the morning upper limit of 619.4. This is a modest elevation that could reflect the acute stress of the blood draw, early morning timing, or genuine sustained activation of the stress response. Chronically elevated cortisol can contribute to brain fog, hair thinning, insulin resistance, and sleep disruption, all of which are relevant to Soraya's symptom profile. A single elevated reading is not diagnostic, but given her symptoms, it is worth flagging to the GP. If there is concern, a repeat morning cortisol (timed carefully) or a 24-hour urinary free cortisol would help distinguish between an acute spike and a persistent elevation.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary failure","high_causes":"Acute stress, chronic stress, Cushing's syndrome, exogenous steroids, early morning sampling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2585","lower_normal":"0","upper_normal":"118.2","lower_optimal":"0","upper_optimal":"118.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen in women. In postmenopausal women, levels are expected to be between 0 and 118.2 pmol/L as the ovaries are no longer producing significant oestrogen. At 61, Soraya's oestradiol is within the expected postmenopausal range and consistent with her FSH of 75.9, which confirms postmenopausal status.","low_causes":"Menopause, ovarian failure, hypothalamic-pituitary dysfunction","high_causes":"HRT, ovarian tumour, obesity (aromatisation in fat tissue), adrenal production","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"119.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone primarily produced by the ovaries after ovulation. In postmenopausal women, progesterone should be very low, typically below 2.32 nmol/L. At 119.16, Soraya's progesterone is dramatically above the postmenopausal upper limit, exceeding it by more than fifty-fold. Her FSH of 75.9 clearly confirms she is postmenopausal, making this level physiologically difficult to explain without an external source. The most likely explanation is an exogenous source of progesterone such as HRT, a bioidentical progesterone cream, or a supplement. If no external source is confirmed, this warrants investigation for a progesterone-secreting ovarian or adrenal source. This is the most important finding in this report and should be discussed with her GP urgently.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Exogenous progesterone (HRT, creams, supplements), ovarian tumour, adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"32.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2148","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and, in premenopausal women, triggers ovulation. After menopause, LH rises as the pituitary attempts to stimulate ovaries that are no longer responding. At 32.28, within the postmenopausal range of 15.9 to 54, this is consistent with Soraya's postmenopausal status.","low_causes":"Pituitary failure, hypothalamic dysfunction, HRT (may suppress)","high_causes":"Menopause, ovarian failure, PCOS (in premenopausal women)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"75.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2840","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland and stimulates the ovaries to develop eggs. After menopause, FSH rises dramatically as the pituitary tries to stimulate ovaries that have ceased functioning. At 75.9, well above the 40 threshold that confirms postmenopausal status, this clearly confirms Soraya is postmenopausal.","low_causes":"Pituitary failure, HRT, pregnancy","high_causes":"Menopause, ovarian failure, premature ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6048","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and is important for libido, energy, mood, and muscle maintenance. At 0.8, this is within the laboratory range but at the very bottom of the optimal band. After menopause, testosterone naturally declines, but at this level, combined with her high SHBG of 102.3, which binds testosterone and makes it unavailable to tissues, the amount of free, biologically active testosterone is very low (free testosterone 0.006 nmol/L, free androgen index 0.78). This is very likely contributing to her reported low libido and may be hindering her ability to build muscle, one of her primary goals. The elevated SHBG is likely partly driven by her statin therapy.","low_causes":"Menopause, adrenal insufficiency, high SHBG, oral medications (statins, oral contraceptives)","high_causes":"PCOS, adrenal tumour, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3489","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.5","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is calculated as (testosterone / SHBG) x 100, giving a ratio that estimates the percentage of testosterone that is biologically available. At 0.78, this is within the laboratory range but well below the optimal floor of 1.5, reflecting how much of Soraya's already low testosterone is being bound by her high SHBG. This low free androgen index is the hormonal fingerprint most likely driving her low libido and difficulty building muscle.","low_causes":"High SHBG, low testosterone, menopause, statins, oral medications","high_causes":"PCOS, low SHBG, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"368.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4263","lower_normal":"95.81","upper_normal":"4055.25","lower_optimal":"150","upper_optimal":"2000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3370","upper_optimal_position":"0.5145","units":"ug/dL","description":"DHEA-S, dehydroepiandrosterone sulphate, is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. Converted from 1 umol/L (x 368.5 = 368.5 ug/dL), this is within the laboratory range. DHEA-S naturally declines with age, and at 66, a value in this range is expected and adequate.","low_causes":"Ageing, adrenal insufficiency, chronic stress","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"150","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"38","upper_normal":"430","lower_optimal":"38","upper_optimal":"430","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"uIU/ml","description":"Prolactin is produced by the pituitary gland. In postmenopausal women, levels between 38 and 430 are considered normal. At 150, this is within the expected range. Elevated prolactin can suppress libido and cause hormonal imbalance, but at this level, prolactin is not contributing to her symptoms.","low_causes":"Not clinically significant in postmenopausal women","high_causes":"Pituitary adenoma (prolactinoma), medications, stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"102.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5631","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3436","upper_optimal_position":"0.5876","units":"nmol/L","description":"SHBG, sex hormone binding globulin, is a protein produced by the liver that binds sex hormones, primarily testosterone and oestradiol, making them biologically inactive. At 102.3, this is within the laboratory range but above the optimal ceiling of 100. High SHBG means more of Soraya's already limited testosterone is being bound and made unavailable to tissues. Statins are a well-recognised cause of elevated SHBG, and in Soraya's case, this is likely the main driver. The clinical consequence is her very low free androgen index of 0.78 and free testosterone of 0.006, which are contributing to her low libido and may be limiting her ability to build muscle.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Statins, oral oestrogen, hyperthyroidism, ageing, liver disease, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.006","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone that is not bound to proteins and is therefore biologically active. At 0.006 nmol/L, this is very low and reflects the combination of Soraya's low total testosterone of 0.8 and high SHBG of 102.3. This very low free testosterone is very likely a key factor in her reported low libido and may be contributing to hair thinning and difficulty building muscle. This finding should be discussed with her GP in the context of potential testosterone replacement therapy for postmenopausal women.","low_causes":"Low total testosterone, high SHBG, menopause, statins","high_causes":"PCOS, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5295","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4726","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is the signal sent from the pituitary gland to the thyroid telling it how much hormone to produce. It is the most sensitive marker of thyroid function. At 2.23, this is within the ideal range of 1.0 to 2.5, indicating the pituitary is happy with the amount of thyroid hormone being produced. The elevated FT4 of 24.6 alongside this normal TSH is an unusual combination discussed further in the FT4 description.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary failure","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, recovery from illness, biotin interference","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"24.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7239","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"FT4, free thyroxine, is the inactive form of thyroid hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, FT3, in tissues. At 24.6, above the upper limit of 22.7, Soraya's FT4 is elevated. However, her TSH at 2.23 is within the ideal range, which is unusual. If the thyroid were genuinely overproducing, TSH should be suppressed. The most common explanations for this pattern are biotin supplement interference (biotin can falsely elevate FT4 in some assays), timing of blood draw, or a laboratory artefact. Less commonly, it can indicate early subclinical hyperthyroidism. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. The GP should be made aware and may wish to repeat the test on a fresh sample, ideally with at least 48 hours without biotin supplements if applicable.","low_causes":"Hypothyroidism, pituitary failure, sick euthyroid syndrome","high_causes":"Hyperthyroidism, biotin interference, thyroid medication, early thyroid overactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4222","upper_optimal_position":"0.6000","units":"pmol/L","description":"FT3, free triiodothyronine, is the biologically active form of thyroid hormone. It is produced primarily by converting FT4 in the liver, kidneys, and other tissues. At 4.4, this is within the laboratory range but just below the optimal floor of 4.5. Despite the elevated FT4 of 24.6, the FT3 is not elevated, which argues against true hyperthyroidism (in which both would typically rise). The slightly below-optimal FT3 may reflect reduced conversion efficiency, which can occur with stress (cortisol inhibits T4-to-T3 conversion), ageing, or nutritional factors.","low_causes":"Poor T4-to-T3 conversion, stress, chronic illness, selenium deficiency, ageing","high_causes":"Hyperthyroidism, T3 supplementation, early Graves' disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies directed against thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence indicates autoimmune attack on the thyroid, most commonly in Hashimoto's thyroiditis. At less than 6.6, below the threshold of 13.8, these are negative, ruling out autoimmune thyroid disease as a cause of any thyroid function changes.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are autoantibodies against thyroglobulin, a protein used by the thyroid to produce thyroid hormones. At less than 1.3, below the 4.4 threshold for autoimmune thyroid disease, these are undetectable, which is the case for over 80% of the population. This confirms no autoimmune thyroid activity.","low_causes":"Normal finding (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"146","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4867","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. At 146, Soraya's vitamin D is well above the sufficient threshold of 50 but above the optimal upper bound of 120. This suggests she is supplementing vitamin D, which is appropriate for a 66-year-old of South Asian heritage living in the UK, as darker skin produces less vitamin D from sunlight. However, there is no additional benefit above 120, and she should consider reducing her supplement dose to maintain a level between 75 and 120.","low_causes":"Inadequate sunlight, dark skin, low dietary intake, malabsorption, obesity","high_causes":"Excessive supplementation, rarely granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4693","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.6139","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium and phosphorus levels in the blood. When calcium drops, the parathyroid glands release PTH to raise it by pulling calcium from bones, increasing kidney reabsorption, and activating vitamin D. At 2.5, this is within the optimal range. Combined with her excellent corrected calcium of 2.5 and vitamin D of 146, this confirms healthy calcium metabolism and bone mineral regulation.","low_causes":"High vitamin D, high calcium, hypoparathyroidism, magnesium deficiency","high_causes":"Low vitamin D, low calcium, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"650","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6148","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 650, this is within the optimal range of 500 to 900. For someone on a pescatarian diet, this is an excellent result, as fish is a good source of B12. B12 deficiency can cause fatigue, brain fog, and nerve problems, so maintaining this level is important.","low_causes":"Vegan/vegetarian diet, pernicious anaemia, metformin, age-related malabsorption","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, vitamin B9, is essential for DNA synthesis, red blood cell production, and is particularly important for homocysteine metabolism. At 17, at the very top of the range, Soraya's folate status is excellent and reflects her high-quality pescatarian diet rich in leafy greens, legumes, and other plant foods.","low_causes":"Poor diet, alcohol, malabsorption, medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, high dietary intake, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"170","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5524","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme found in muscle tissue that is released into the blood when muscle fibres are damaged or stressed, whether through exercise, injury, or disease. At 170, within the laboratory range of 25 to 200 for women but above the optimal ceiling of 150, this is an expected finding for someone training seven times per week including three resistance sessions. It indicates normal exercise-induced muscle turnover rather than pathological muscle damage. No action is needed, and monitoring a statin user's CK is prudent, as statins can occasionally cause muscle breakdown. At 170 with no muscle pain, this is reassuring.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, statin-related myopathy, muscle injury, rhabdomyolysis, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"8.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1792","lower_normal":"0","upper_normal":"24","lower_optimal":"0","upper_optimal":"24","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer but also in many benign conditions including endometriosis, fibroids, and pelvic inflammatory disease. At 8.6, well below the threshold of 24, this is a reassuring result.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15_3","name":"CA 15-3","group":"TUMOR MARKERS","result":"4.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0695","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 15-3 is a tumour marker most commonly associated with breast cancer monitoring. At 4.17, well below the threshold of 30, this is a reassuring result.","low_causes":"Not clinically significant","high_causes":"Breast cancer, ovarian cancer, liver disease, benign breast conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"19.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2576","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker associated with pancreatic and gastrointestinal cancers. At 19.06, within the threshold of 37, this is a reassuring result. Combined with her normal amylase and lipase, there is no suggestion of pancreatic disease.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gastric cancer, benign biliary conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"3.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7891","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4348","units":"ng/ml","description":"CEA, carcinoembryonic antigen, is a protein that can be mildly elevated in several benign conditions as well as in colorectal and other cancers. At 3.63, above the non-smoker threshold of 2.3, this is a modest elevation. CEA can be raised by age, benign gastrointestinal conditions, and mild inflammation. At this level, it is not diagnostic of any malignancy but should be recorded as a baseline and repeated at the next blood test in approximately six months. If it rises further, the GP may wish to investigate with imaging or colonoscopy. If it remains stable or falls, it is likely benign.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, gastric cancer, pancreatic cancer, benign GI conditions, smoking, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4842","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and provides long-term immunity against bacteria and viruses. At 10.8, this is within the laboratory range and indicates a normally functioning adaptive immune system with adequate antibody reserves.","low_causes":"Primary immunodeficiency, medications (rituximab, corticosteroids), chronic lymphocytic leukaemia","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. At 0.6, this is at the lower end of the range but within it. IgM naturally tends to be lower in older adults. This is not concerning.","low_causes":"Ageing, immunodeficiency, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4194","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgA is the immunoglobulin that protects mucosal surfaces, including the gut, respiratory tract, and urinary tract. At 1.2, this is within the laboratory range. Adequate IgA is important for mucosal defence and is also required for the tissue transglutaminase IgA coeliac test to be valid, which it is in Soraya's case.","low_causes":"Selective IgA deficiency (most common immunodeficiency), medications","high_causes":"Liver disease, coeliac disease, IgA nephropathy, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"14.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0705","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"IU/ml","description":"IgE is the immunoglobulin involved in allergic responses and parasitic defence. At 14.1, well below both the laboratory threshold and optimal ceiling, this indicates no significant allergic or parasitic activity.","low_causes":"No allergic sensitisation (normal finding)","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.25","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. At 7, below the threshold of 14, this is negative and effectively rules out rheumatoid arthritis as a current diagnosis.","low_causes":"Not clinically significant","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"7.19","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten. A negative result, with a value of less than 0.2, effectively rules out coeliac disease as a cause of any gastrointestinal symptoms, fatigue, brain fog, or nutritional deficiencies. This test is only valid if IgA levels are adequate, which they are in Soraya's case at 1.2 g/L.","low_causes":"No coeliac disease (normal finding)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_
