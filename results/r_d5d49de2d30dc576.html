<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

thout boric acid preservative, meaning bacterial overgrowth during transit is a real possibility. This pattern, significant growth but no inflammatory response and no reported urinary symptoms, sits somewhere between genuine asymptomatic bacteriuria and specimen contamination. In a 66-year-old woman, asymptomatic bacteriuria does not generally require treatment, but if Soraya is experiencing any urinary symptoms such as frequency, urgency, burning, or lower abdominal discomfort, she should discuss this with her GP, who has full antibiotic sensitivity data available. Both organisms are sensitive to nitrofurantoin, amoxicillin/clavulanic acid, and fosfomycin, among others. The trimethoprim resistance is worth noting as that is the most commonly prescribed first-line antibiotic for urinary tract infections.\n\nHer cortisol at 672 is above the morning reference range upper limit of 619.4. This is a modest elevation and could reflect the stress of the blood draw itself, early morning timing, or genuine hypothalamic-pituitary-adrenal axis activation. Cortisol is the body's primary stress hormone, released by the adrenal glands, and a single elevated morning reading is not diagnostic of any condition. However, given her symptoms of brain fog and hair thinning, both of which can be associated with sustained cortisol elevation, this is worth flagging. If the GP considers it relevant, a repeat morning cortisol or a 24-hour urinary free cortisol could help clarify whether this is a persistent pattern or a one-off.\n\nHer free thyroxine, FT4, is elevated at 24.6, above the upper limit of 22.7. Her TSH, thyroid stimulating hormone, the signal the pituitary gland sends to the thyroid telling it to produce more hormone, is 2.23, which is within the ideal range of 1.0 to 2.5. Her FT3, the active form of thyroid hormone, is 4.4, within the laboratory range but just below the optimal zone of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, ruling out autoimmune thyroid disease. The elevated FT4 with a normal TSH is an unusual combination. In a person taking losartan, which does not typically affect thyroid binding proteins, the most common explanations are either a laboratory artefact from the timing of sampling, the use of biotin supplements which can interfere with the assay, or genuinely increased thyroid hormone production that has not yet triggered TSH suppression. It is worth mentioning to the GP, who may wish to repeat thyroid function on a fresh sample.\n\nTurning to the positives, and there are many. Soraya's metabolic health is in excellent shape for a 66-year-old. Her fasting glucose of 4.1 is within the optimal range, and her HbA1c of 37, which measures average blood sugar over the past two to three months, is below the 42 threshold for prediabetes and within the optimal zone below 36 only by a small margin. Her liver is in outstanding health. ALT at 19 is well below the optimal threshold of 25 for women, Gamma GT at 21 is below the optimal threshold of 25, AST at 30 is mid-range, and bilirubin at 9 is healthy. Her FIB-4 score, a calculation that estimates liver fibrosis risk, is 1.78, which is above the standard threshold of 1.45 but well within the adjusted threshold of 2.0 that applies to people over 65. At her age, the FIB-4 calculation is pushed upward by the age component itself, and with every individual liver marker looking clean, this score is being driven by the maths rather than by any sign of liver disease. Her amylase and lipase, which assess pancreatic health, are both within range, with lipase sitting right at the upper boundary of 60, which is worth noting but not concerning in isolation.\n\nHer inflammatory profile is excellent. High-sensitivity CRP, the most sensitive marker of systemic inflammation, is 0.5, comfortably below the optimal threshold of 1.0. Her ESR, erythrocyte sedimentation rate, another measure of inflammation, is just 2, which is about as low as it gets. For a 66-year-old with hypertension, this level of inflammatory control is genuinely impressive and speaks well to her diet quality and active lifestyle.\n\nHer kidney function is reassuring. Cystatin C, a protein filtered by the kidneys that gives a more accurate estimate of kidney function than creatinine alone, especially in someone with a low muscle mass like Soraya at 46 kg, is 0.91, giving a Cystatin C-based eGFR of 83. The creatinine-based eGFR of 74 is likely underestimating her true kidney function because creatinine production is partly driven by muscle mass, and at her weight and build, the creatinine figure does not fully reflect how well the kidneys are working. The Cystatin C figure of 83 is the more reliable measure here. Urea at 7.5 is within range. Uric acid at 324 is within both the laboratory and optimal ranges.\n\nHer electrolytes are stable. Sodium, chloride, and bicarbonate are all within range. Potassium at 4.9 is within range but towards the upper end, which is worth monitoring given she takes losartan, an ARB, which can raise potassium by reducing aldosterone signalling. This is not concerning at 4.9 but should be checked at each future blood test. Serum magnesium at 0.95 is within the optimal range of 0.85 to 1.05, which is reassuring. However, her red cell magnesium, which measures the magnesium stored inside red blood cells and reflects longer-term magnesium status more accurately than serum magnesium, is 28.48, just below the lower limit of 29. This marginal deficiency suggests her body's magnesium stores are slightly depleted despite the serum level looking healthy. Given her training volume of seven sessions per week, this is not surprising as magnesium is lost through sweat and used heavily in muscle contraction and recovery. This may be contributing to her brain fog, as magnesium is essential for neuronal signalling.\n\nHer calcium and parathyroid hormone are both within healthy ranges, with corrected calcium at 2.5 and PTH at 2.5 pmol/L. Her vitamin D at 146 nmol/L is excellent, well above the sufficient threshold of 50 and above the optimal upper bound of 120, suggesting she supplements vitamin D. At this level, she could consider reducing her dose slightly to maintain a level between 75 and 120, as there is no additional benefit above 120 and some evidence that very high levels can be counterproductive. Her vitamin B12 at 650 is well within the optimal range of 500 to 900, and her folate at 17 is at the top of the laboratory range, both reflecting her excellent diet quality.\n\nHer full blood count is largely healthy. Haemoglobin at 137 is solid for a 66-year-old woman, and her red cell count, haematocrit, MCV, and MCH are all within range. Her RDW, red cell distribution width, which measures variation in the size of red blood cells, is 14.4, marginally above the upper limit of 14. This is a very small elevation and on its own is not concerning, though it can sometimes indicate early iron or B12 deficiency, neither of which appears to be the case here given her healthy B12, folate, and iron studies. Her MCHC at 347 is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation or a minor effect of sample temperature and storage, as noted by the lab. Her reticulocyte percentage at 1.05 is within range, but the absolute reticulocyte count at 48.6 is marginally below the lower limit of 50. This is a trivial shortfall and simply reflects the calculation against her red cell count. Her basophils at 0.01 are marginally below the lower limit of 0.02, which is clinically insignificant as basophils are the rarest white blood cell and minor fluctuations at very low absolute numbers carry no meaning. Her white cell count, neutrophils, lymphocytes, monocytes, and eosinophils are all within healthy ranges. Her platelets at 255 and MPV at 8.5 are both mid-range.\n\nHer iron studies are well balanced. Ferritin at 42 is within the optimal range of 40 to 150 for women, serum iron es one ApoB molecule, so a substantial portion of her elevated ApoB is accounted for by Lp(a) particles rather than standard LDL. This is an important distinction because the Lp(a)-driven component is not modifiable, while the remaining standard LDL component is. She is already taking a statin, which will be addressing the modifiable LDL fraction, and her GP should be aware of the Lp(a) level as it becomes a permanent part of her medical record. First-degree relatives, her children and siblings, should also be offered Lp(a) testing as this trait is inherited. The combination of very high Lp(a) with exceptionally high HDL creates a genuinely mixed picture. Her ApoB/A1 ratio of 0.40 suggests that the protective effect of her HDL is substantially offsetting the risk from her LDL and Lp(a), but the absolute ApoB level still warrants ongoing management. This is a conversation for her GP and potentially a lipid specialist, particularly given that novel Lp(a)-lowering therapies are in late-stage clinical trials and may become available in the coming years.\n\nHer HOMA-IR, homeostatic model assessment of insulin resistance, is 1.9, which is above the optimal upper limit of 1.5. HOMA-IR estimates how hard the body has to work to keep blood sugar controlled, and a value of 1.9 sits right at the threshold the lab describes as early insulin resistance. Her fasting insulin at 10.4, while within the laboratory range of 2.6 to 24.9, is above the optimal ceiling of 8. Her C-peptide at 1.52 ug/L, which converts to approximately 503 pmol/L, is within range and consistent with the insulin level. This is a subtle but important finding because her fasting glucose and HbA1c are both excellent, meaning her body is still controlling blood sugar very effectively, but it is having to use more insulin to do so than is ideal. At a BMI of 18.2, this is unlikely to be driven by excess body fat, which is the most common cause of insulin resistance. Instead, it may relate to her South Asian heritage, as insulin resistance at lower BMI is significantly more common in South Asian populations, or to her cortisol level, as sustained cortisol elevation directly antagonises insulin signalling. It may also reflect the timing of her last meal relative to the blood draw. This is not an urgent finding but it is worth monitoring. Repeating the fasting insulin and glucose at her next blood test, ideally after a twelve-hour fast, would help clarify whether this is a consistent pattern.\n\nHer hormonal profile, beyond the progesterone anomaly discussed above, is consistent with her postmenopausal status. FSH at 75.9 and LH at 32.28 confirm the ovaries are no longer cycling. Oestradiol at 61 is within the postmenopausal range of 0 to 118.2, sitting roughly mid-range for a postmenopausal woman. Testosterone at 0.8 is within the laboratory range of 0.5 to 2.6 but towards the lower end. Her free androgen index at 0.78 and calculated free testosterone at 0.006 nmol/L are both low, reflecting both the low total testosterone and her high SHBG of 102.3, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues. SHBG at 102.3 is within the laboratory range but high, and statins are a known cause of elevated SHBG. The combination of low free testosterone and high SHBG is very likely contributing to her reported low libido and may also be a factor in her hair thinning and difficulty building muscle, which is one of her primary goals. DHEA-S at 1 umol/L, converting to approximately 368.5 ug/dL, is within range. Prolactin at 150 is within the postmenopausal range. This hormonal picture is worth discussing with her GP, particularly whether testosterone replacement might be considered given her symptoms and goals, and whether the statin's effect on SHBG warrants review.\n\nHer immune markers are all within range. IgG at 10.8, IgA at 1.2, and IgE at 14.1 are mid-range, while IgM at 0.6 is at the lower end of its range of 0.5 to 3.0 but still within it. Rheumatoid factor is negative at 7, and tissue transglutaminase IgA is negative, effectively ruling out coeliac disease as a cause of any of her symptoms. Her total antioxidant activity at 1.48 is within range, reflecting her excellent diet.\n\nHer CEA, carcinoembryonic antigen, is 3.63, above the non-smoker threshold of 2.3. CEA is a protein that can be mildly elevated in a number of benign conditions, including age, mild inflammation, and benign gastrointestinal conditions, and a level of 3.63 is only modestly above the reference. It is not a diagnostic test for cancer on its own, but as a baseline marker it should be recorded and repeated at the next blood test. If it rises further, the GP may wish to investigate. CA-125 at 8.6, CA 15-3 at 4.17, and CA 19-9 at 19.06 are all within their respective ranges, which is reassuring.\n\nHer creatine kinase at 170 is within the female range of 25 to 200, which is appropriate for someone training seven times per week and indicates her muscles are recovering adequately between sessions.\n\nHer urine, aside from the culture findings discussed above, is clean. Protein, glucose, ketones, urobilinogen, and casts are all negative, and red and white blood cells are both less than one. The pH of 6 and specific gravity of 1.02 are normal.\n\nHer omega fatty acid profile is outstanding. Her Omega-3 Index at 15.89% is nearly double the cardioprotective threshold of 8%, one of the highest results seen. Her Omega-6 to Omega-3 ratio at 1.3 to 1 is exceptional against a Western average of 15 to 1. Her AA:EPA ratio at 2 is excellent. Her Trans Fat Index at 0.77 is at the floor. Whatever she is doing with diet and supplementation for omega-3 is working exceptionally well. Her albumin to creatinine ratio at 0.81 confirms healthy kidney filtration with no protein leak.\n\nIn summary, Soraya is a lean, active, 66-year-old woman with an excellent diet whose blood work shows several genuinely impressive findings, including outstanding inflammatory control, strong kidney function, a clean liver, excellent blood sugar management, healthy iron stores, and an exceptionally high HDL. The findings that require attention are the unexplained progesterone elevation, which needs urgent GP input, the significantly elevated Lp(a) which is inherited and should be permanently recorded, the modestly elevated HOMA-IR which warrants monitoring, the low free testosterone and high SHBG which are likely contributing to her symptoms, the marginally low red cell magnesium, and the elevated cortisol which may reflect acute stress but should be noted. The CEA should be repeated at the next blood test, and the urine culture findings should be discussed with the GP if she has any urinary symptoms.","links":"Soraya's most important next step is a GP appointment to discuss three findings. First, her progesterone at 119.16 is dramatically above the postmenopausal upper limit of 2.32. She should tell her GP whether she uses any progesterone cream, supplement, or hormone replacement. If she does not, the GP will likely want to repeat the test on a fresh sample and, if confirmed, investigate with ovarian and adrenal imaging. Second, her Lp(a) at 176.87 nmol/L is a permanently inherited cardiovascular risk factor that should be recorded in her medical notes for life. She should ask her GP to add this to her record and to consider offering Lp(a) testing to her first-degree relatives, her children and siblings, as it is genetically transmitted. Third, the elevated CEA at 3.63 against a non-smoker threshold of 2.3 should be recorded as a baseline and repeated at her next blood test in approximately six months.\n\nRegarding her lipids, Soraya is already on a statin, which is appropriate given her ApoB of 1.22 and Lp(a) of 176.87. The portion of her LDL that is modifiable is being addressed, but her GP or a lipid specialist should assess whether her current statin dose is optimised. Adding ezetimibe to her statin could further reduce ApoB by approximately 20 to 25 percent. Dietary measures that complement statin therapy include increasing soluble fibre intake to 10 grams per day through sources such as oats, barley, lentils, flaxseeds, and chia seeds, ensuring she eats oily fish at least three times per week for omega-3, and considering a plant sterol or stanol-enriched spread providing 2 grams per day.\n\nRegarding her insulin sensitivity, her HOMA-IR of 1.9 suggests early insulin resistance despite her low BMI. Given her South Asian heritage, this may reflect an inherent metabolic pattern rather than a lifestyle issue. Maintaining her current training load, particularly resistance training, is the most effective non-pharmacological intervention for improving insulin sensitivity. She should ensure she is consuming adequate protein around her training sessions to maximise the insulin-sensitising effect of resistance exercise. Time-restricted eating with a consistent twelve-hour overnight fast may also help. Her fasting insulin and glucose should be repeated at the next blood test after a confirmed twelve-hour fast.\n\nRegarding nutrition, at 46 kg and 159 cm with a BMI of 18.2, Soraya is underweight. Building muscle, which is her primary goal, requires a caloric surplus combined with adequate protein and progressive resistance training. Her estimated basal metabolic rate is approximately 1,100 calories, and with her activity level of seven training sessions per week plus 7,500 to 10,000 daily steps, her maintenance calories are approximately 1,760 to 1,925 per day using a moderate to very active multiplier. To build muscle, she should aim for 1,950 to 2,100 calories per day, a surplus of roughly 150 to 250 above maintenance. Her protein target should be 1.6 to 2.0 grams per kilogram of body weight, giving a range of 74 to 92 grams of protein per day. On a pescatarian diet, good sources include fish, eggs, Greek yoghurt, cottage cheese, tofu, tempeh, edamame, lentils, and chickpeas. A whey protein or plant-based protein shake providing 25 to 30 grams of protein within an hour of resistance training would support muscle protein synthesis. Gaining 2 to 4 kg of body weight over the next six months would bring her BMI closer to 20 and provide better metabolic reserve as she ages.\n\nRegarding her symptoms, her low libido is very likely linked to her low free testosterone and high SHBG. Statins are known to raise SHBG, which binds testosterone and reduces the amount available to tissues. She should discuss with her GP whether testosterone replacement might be appropriate, as there is growing evidence supporting its use in postmenopausal women with low libido, provided it is prescribed and monitored appropriately. Her hair thinning may also relate to low free testosterone, though thyroid function, iron status, and cortisol can all contribute. Her iron and thyroid are adequately managed, so the focus should be on the hormonal picture. Her brain fog may be multifactorial, with contributions from the marginally low red cell magnesium, the elevated cortisol, and the postmenopausal hormonal environment. Addressing the magnesium deficiency and managing stress are practical starting points.\n\nRegarding her vitamin D, at 146 nmol/L she is above the optimal upper bound of 120. She should reduce her current vitamin D supplement dose. If she is taking 4,000 IU or more daily, reducing to 1,000 to 2,000 IU daily through the winter months and pausing during summer would be reasonable, aiming for a level between 75 and 120 at the next test.\n\nRegarding sleep and stress management, her cortisol at 672 may reflect acute stress but given her brain fog and hair thinning, addressing chronic stress is worthwhile. Practical steps include maintaining a fixed wake time, getting outside within an hour of waking for natural light exposure, setting a caffeine cut-off by early afternoon, keeping the bedroom cool at around 18 degrees, and considering a mindfulness or breathing practice of five to ten minutes daily. Magnesium glycinate before bed will support both sleep quality and her marginally depleted stores.\n\nShe should retest in six months, with the following markers specifically repeated: progesterone, cortisol (morning, timed), fasting insulin and glucose with confirmed twelve-hour fast, CEA, full lipid panel including Lp(a) for the baseline pair, red cell magnesium, and the omega panel if not returned from this sample.","flags":"URGENT FOR GP:\n\nProgesterone 119.16 nmol/L against a postmenopausal upper limit of 2.32 nmol/L. FSH 75.9 confirms postmenopausal status. This level is physiologically incompatible with menopause unless an exogenous source of progesterone is present. If no exogenous source is confirmed, investigation for a progesterone-secreting ovarian or adrenal source is warranted. Recommend repeat on fresh sample and clinical correlation.\n\nFOR GP AWARENESS:\n\nLp(a) 176.87 nmol/L (threshold below 32). Genetically determined, non-modifiable cardiovascular risk factor in the moderate risk category. Should be permanently recorded. First-degree relatives should be offered testing. Novel Lp(a)-lowering therapies are in late-stage trials.\n\nApoB 1.22 g/L (threshold below 0.9). LDL 3.98 mmol/L (range 0.5 to 3.0). Non-HDL cholesterol 4.2 mmol/L (threshold below 4.0). Total cholesterol 7.7 mmol/L. Patient is on a statin. A portion of the ApoB elevation is driven by Lp(a) particles. ApoB/A1 ratio is 0.40, within the lower risk category, reflecting the protective effect of her exceptionally high HDL of 3.5. Consider statin dose optimisation or addition of ezetimibe.\n\nHOMA-IR 1.9 (optimal below 1.5). Fasting insulin 10.4 mIU/L (optimal below 8). Glucose 4.1 and HbA1c 37 are both excellent, indicating effective glucose control but at a higher insulin cost than ideal. BMI 18.2 and South Asian heritage are relevant context. Monitor at next test.\n\nFree thyroxine (FT4) 24.6 pmol/L (range 11.5 to 22.7). TSH 2.23, within ideal range. FT3 4.4, within range. Both thyroid antibodies negative. Isolated FT4 elevation with normal TSH. Consider biotin supplement interference, repeat on fresh sample.\n\nCortisol 672 nmol/L (morning range 145.4 to 619.4). Modest elevation. May reflect acute stress at blood draw. If symptoms of hair thinning and brain fog persist, consider repeat morning cortisol or 24-hour urinary free cortisol.\n\nCEA 3.63 ng/ml (non-smoker threshold 2.3). Modestly elevated. Not diagnostic in isolation. Record as baseline and repeat in six months. CA-125, CA 15-3, and CA 19-9 are all within range.\n\nUrine culture: Significant growth of E. coli and Enterococcus faecalis at 10^5 CFU/ml. Nitrites positive. However, urinary WBC less than 1 and plain bottle received (no boric acid). Pattern is consistent with either asymptomatic bacteriuria or specimen contamination. If symptomatic, sensitivity data available. Trimethoprim-resistant.\n\nPotassium 4.9 mmol/L (range 3.5 to 5.3). Upper end of range on an ARB (losartan). Not concerning but should be monitored at each test.\n\nMINOR FLAGS:\n\nRed cell magnesium 28.48 mg/L (range 29 to 42). Marginally below range. Serum magnesium 0.95 is within optimal range. Suggests mild intracellular depletion, likely related to high training volume.\n\nRDW 14.4% (range 11.6 to 14). Marginally above range. No evidence of iron, B12, or folate deficiency. Likely age-related variation in red cell production.\n\nMCHC 347 g/L (range 315 to 345). Marginally above range. Lab notes temperature and storage effects. Clinically insignificant at this margin.\n\nReticulocytes absolute 48.6 x10^9/L (range 50 to 100). Marginally below range. Percentage within range at 1.05%. Trivial shortfall.\n\nBasophils 0.01 x10^9/L (range 0.02 to 0.1). Clinically insignificant at these absolute numbers.\n\nFIB-4 1.78 (threshold 1.45, adjusted threshold 2.0 for over 65). All individual liver markers are clean. Score is driven by age component of the calculation. No concern for liver fibrosis.\n\nReassuring negatives: CRP 0.5, ESR 2, both thyroid antibodies negative, rheumatoid factor negative, coeliac screen negative, CA-125 8.6, CA 15-3 4.17, CA 19-9 19.06 all within range, urine protein negative, urine glucose negative, urine RBC less than 1, kidney function adequate with Cystatin C eGFR 83, haemoglobin 137, platelets 255, iron studies balanced with ferritin 42 and transferrin saturation 30%.","recommendations":"1. Book a GP appointment to discuss the elevated progesterone of 119.16. Inform the GP of any progesterone creams, supplements, or HRT being used. If none, request repeat testing and investigation.\n\n2. Ask the GP to record the Lp(a) of 176.87 nmol/L permanently in medical notes. Request Lp(a) testing for first-degree relatives.\n\n3. Discuss statin dose optimisation or addition of ezetimibe with the GP to further reduce ApoB from 1.22.\n\n4. Discuss testosterone replacement with the GP for low libido, given low free testosterone of 0.006 nmol/L and high SHBG of 102.3.\n\n5. Increase calorie intake to 1,950 to 2,100 per day to support muscle building. Target 74 to 92 grams of protein daily. Consider adding a protein shake of 25 to 30 grams post-resistance training.\n\n6. Aim to gain 2 to 4 kg of body weight over six months to bring BMI towards 20.\n\n7. Begin magnesium glycinate supplementation at 300 to 400 mg before bed to address marginally low red cell magnesium and support sleep quality.\n\n8. Reduce vitamin D supplement dose to 1,000 to 2,000 IU daily to bring the level from 146 into the 75 to 120 optimal range.\n\n9. Increase soluble fibre intake to 10 grams per day from oats, barley, lentils, flaxseeds, and chia seeds to complement statin therapy.\n\n10. Eat oily fish at least three times per week for omega-3 to support cardiovascular and brain health.\n\n11. If experiencing urinary symptoms, discuss the culture results with the GP. If asymptomatic, no treatment is needed but mention the finding at the next appointment.\n\n12. Retest in six months: progesterone, morning cortisol (timed), fasting insulin and glucose (twelve-hour fast confirmed), CEA, full lipid panel, red cell magnesium, omega panel.","supplementation":"Magnesium glycinate: 300 to 400 mg elemental magnesium, taken before bed. Her red cell magnesium at 28.48 is marginally below the lower limit of 29, indicating mild intracellular depletion despite normal serum levels. At seven training sessions per week, magnesium is being used heavily for muscle contraction and recovery. Glycinate is the preferred form because it is well absorbed and has a calming effect that supports sleep quality, and magnesium supports neuronal signalling which may help with her brain fog.\n\nVitamin D3 (cholecalciferol): Reduce current dose to 1,000 to 2,000 IU daily, taken with a fat-containing meal. Her current level of 146 nmol/L is above the optimal ceiling of 120. The goal is to maintain between 75 and 120. During summer months, she may not need to supplement at all depending on sun exposure. She should continue to pair vitamin D with vitamin K2.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with her vitamin D. K2 directs calcium into bones and teeth rather than soft tissues and artery walls, which is particularly important given her cardiovascular risk profile with elevated Lp(a).\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Given her elevated ApoB and Lp(a), omega-3 supports cardiovascular health through anti-inflammatory effects and triglyceride management. Her triglycerides are already excellent at 0.68, so the primary benefit here is anti-inflammatory and endothelial protection. Her omega-3 index at 15.89% confirms she is getting exceptional omega-3 from her diet. At this level, omega-3 supplementation is not necessary unless she changes her diet. She should continue her current fish intake.\n\nShe should not take iron supplements. Her ferritin at 42 and transferrin saturation at 30 percent indicate adequate and well-balanced iron stores.\n\nThe most important changes from this report are not supplements. They are discussing the progesterone result with her GP, increasing her calorie and protein intake to support muscle building, recording and managing her Lp(a) as a lifelong cardiovascular risk factor, and addressing the hormonal picture that is likely driving her symptoms of low libido and hair thinning.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6267","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. At 4.1, Soraya's fasting glucose is within the optimal range of 4.0 to 5.4, indicating her body is regulating blood sugar effectively. This is particularly reassuring given the slightly elevated HOMA-IR, as it confirms that glucose control itself remains excellent even if more insulin than ideal is being used to achieve it.","low_causes":"Excessive fasting, insulin excess, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, pancreatic dysfunction, corticosteroid use, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c expressed as a percentage reflects the proportion of haemoglobin in red blood cells that has been glycated, or coated in sugar, over the past two to three months. At 5.6%, Soraya is below the prediabetes threshold of 6.0%, indicating healthy average blood sugar control over the preceding weeks.","low_causes":"Low carbohydrate intake, very high red cell turnover","high_causes":"Chronically elevated blood sugar, prediabetes, diabetes, iron deficiency (falsely elevates)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4405","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c expressed in mmol/mol is the IFCC-standardised measure of glycated haemoglobin. At 37, Soraya is below the prediabetes threshold of 42 and marginally above the optimal ceiling of 36. This is a very healthy result that sits just outside the tightest optimal band. It does not suggest any concern and is consistent with her excellent fasting glucose.","low_causes":"Low carbohydrate intake, increased red cell turnover","high_causes":"Chronically elevated blood sugar, prediabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"10.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4498","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3153","upper_optimal_position":"0.4569","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar controlled. At 10.4, Soraya's insulin is within the laboratory range but above the optimal ceiling of 8, indicating her pancreas is working a little harder than ideal to maintain her excellent glucose level of 4.1. This is reflected in her HOMA-IR of 1.9. In a woman with a BMI of 18.2, this pattern is more likely related to her South Asian heritage, which is associated with insulin resistance at lower body weights, or to the elevated cortisol, which directly antagonises insulin action.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate diet, obesity, PCOS, cortisol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"503","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4497","lower_normal":"364","upper_normal":"1456","lower_optimal":"370","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3352","upper_optimal_position":"0.4963","units":"pmol/L","description":"C-peptide is released in equal amounts to insulin by the pancreas and provides a stable measure of insulin production. At 503 pmol/L (converted from 1.52 ug/L), Soraya's C-peptide is within the laboratory range and consistent with her insulin level, confirming that the pancreas is producing insulin normally. The lab notes that samples not separated within four hours can show reduced C-peptide, so the true level may be slightly higher.","low_causes":"Low insulin demand, type 1 diabetes, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the homeostatic model assessment of insulin resistance, is calculated from fasting glucose and fasting insulin. It estimates how efficiently the body uses insulin to control blood sugar. At 1.9, Soraya's HOMA-IR is above the optimal upper limit of 1.5 and sits at the threshold the laboratory defines as early insulin resistance. However, her glucose and HbA1c are both excellent, meaning she is controlling blood sugar effectively but using more insulin than ideal to do so. At her BMI of 18.2, this is not driven by excess body fat and may reflect her South Asian heritage or her elevated cortisol.","low_causes":"Excellent insulin sensitivity, very low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome, obesity, cortisol excess, South Asian heritage at lower BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"346.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, the cells that produce insulin. Calculated as (20 x 10.4) / (4.1 - 3.5) = 346.7, this is above the standard range, which reflects the fact that the pancreas is producing more insulin than expected for this glucose level. This is consistent with the elevated HOMA-IR and the insulin level of 10.4, confirming the pancreas is compensating by producing extra insulin to maintain excellent glucose control.","low_causes":"Beta cell exhaustion, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance with compensatory beta cell hyperfunction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6253","units":"g/L","description":"Total protein measures the combined level of albumin and globulin in the blood, reflecting liver synthetic function, nutritional status, and immune system activity. At 73, Soraya's total protein is well within the optimal range, reflecting her excellent dietary protein intake and healthy liver function.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammatory conditions, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and is one of the best markers of liver synthetic function and nutritional status. At 43, this is within the optimal range and confirms that Soraya's liver is producing protein normally and her nutritional intake is adequate.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin includes immunoglobulins (antibodies) and transport proteins. At 30, this is within the optimal range and reflects a normally functioning immune system without signs of chronic infection or inflammation.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5714","units":"","description":"The albumin-to-globulin ratio, calculated as albumin divided by globulin (43/30 = 1.43), provides a snapshot of the balance between liver synthetic function and immune activity. At 1.43, this is within the optimal range, indicating a healthy balance.","low_causes":"Liver disease, overproduction of globulins (infection, inflammation, myeloma)","high_causes":"Underproduction of globulins, immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, and bile ducts. At 51, this is within the lower portion of the range, which is healthy. In a 66-year-old postmenopausal woman, ALP can rise due to increased bone turnover, so a value at the lower end is reassuring for both liver and bone health.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bone disorders, liver disease, bile duct obstruction, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down, processed by the liver, and excreted in bile. At 9, this is well within the optimal range and indicates healthy red cell turnover and efficient liver processing.","low_causes":"Not clinically significant when low","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1696","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. At 19, well below the optimal threshold of 25 for women, Soraya's liver cells are healthy and under no metabolic stress. This is an excellent result.","low_causes":"Not clinically significant","high_causes":"Liver inflammation, fatty liver disease, alcohol, medications, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5104","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST, aspartate aminotransferase, is found in the liver, heart, and muscles. At 30, this is within the optimal range. AST can be mildly elevated after exercise due to its presence in muscle, so at 30 with seven training sessions per week, this is an excellent result.","low_causes":"Not clinically significant","high_causes":"Liver disease, muscle damage, heart damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2763","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"Gamma GT, gamma-glutamyl transferase, is a liver enzyme particularly sensitive to alcohol, medications, and metabolic strain. At 21, well below the optimal threshold of 25, Soraya's liver is coping comfortably with her statin and ARB without any sign of hepatic strain. This is a reassuring finding for someone on two medications metabolised by the liver.","low_causes":"Not clinically significant","high_causes":"Alcohol, medications, fatty liver disease, bile duct obstruction, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6138","lower_normal":"0","upper_normal":"2.0","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.325","units":"","description":"The FIB-4 score is a calculated index that estimates the risk of liver fibrosis using age, ALT, AST, and platelet count. At 1.78, this is above the standard threshold of 1.45 but well within the adjusted threshold of 2.0 that applies to people over 65. In Soraya's case, the score is being driven primarily by the age component of the formula, as her ALT at 19, AST at 30, GGT at 21, bilirubin at 9, and albumin at 43 are all healthy. There is no indication of liver fibrosis. The lab note itself states that in the absence of other clinical indicators, a score below 2 can be insignificant.","low_causes":"Young age, high platelet count","high_causes":"Age over 60, low ALT, low platelet count, genuine liver fibrosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starches. At 82, this is mid-range and indicates normal pancreatic function with no sign of pancreatic inflammation.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5652","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. At 60, it sits right at the upper boundary of the laboratory range. This is within normal limits but at the top end, which on its own does not indicate pancreatic disease, especially with amylase at a healthy 82. However, it is worth noting and monitoring at the next blood test.","low_causes":"Not clinically significant","high_causes":"Pancreatitis, gallstones, kidney disease, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7432","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL, LDL, and VLDL. At 7.7, this is above the desirable threshold of 5.18. However, in Soraya's case, a large portion of this total is accounted for by her exceptionally high HDL of 3.5, which is protective. The total cholesterol figure alone is misleading here and should be interpreted alongside the full lipid breakdown, particularly the ApoB/A1 ratio of 0.40 and the non-HDL cholesterol of 4.2.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, statins at suboptimal dose, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2000","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat circulating in the blood, derived from dietary fat and produced by the liver. At 0.68, well below the optimal threshold of 1.0, Soraya's triglyceride level is excellent and reflects her healthy diet, active lifestyle, and effective metabolic processing of fats. Low triglycerides are one of the strongest markers of metabolic health.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar/refined carbohydrate diet, alcohol, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1987","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, very low-density lipoprotein, is the triglyceride-rich lipoprotein produced by the liver. At 0.31, this is well within optimal range and consistent with her excellent triglyceride level of 0.68.","low_causes":"Very low fat diet","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0","lower_normal":"1.55","upper_normal":"999","lower_optimal":"1.6","upper_optimal":"999","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein, is the 'protective' cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. At 3.5, Soraya's HDL is exceptionally high and provides substantial cardiovascular protection. This level is well above the optimal threshold of 1.6 for women and is one of the most impressive findings in this report. It is reflected in her excellent ApoA1 of 3.07 and contributes to her very favourable ApoB/A1 ratio of 0.40.","low_causes":"Sedentary lifestyle, obesity, smoking, insulin resistance, poor diet","high_causes":"Genetics, regular exercise, moderate alcohol intake, oestrogen (less relevant postmenopause)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6633","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6107","units":"mmol/L","description":"LDL, low-density lipoprotein, is the cholesterol particle that deposits cholesterol into artery walls, driving atherosclerosis. At 3.98, above the upper limit of 3.0, Soraya's LDL is elevated. However, a portion of this LDL count includes her Lp(a) particles, which are modified LDL particles that are genetically determined and not reducible by diet or statins. The modifiable portion of her LDL is what her statin is targeting. Calculated using the Sampson equation as noted by the lab.","low_causes":"High-dose statin therapy, hyperthyroidism, malnutrition, liver disease","high_causes":"Genetics, diet high in saturated fat, hypothyroidism, medications, familial hypercholesterolaemia, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick summary of the balance between total cholesterol and protective HDL. At 2.2, this is excellent and well below the threshold of 4.5. This low ratio reflects the powerful protective effect of Soraya's exceptionally high HDL of 3.5, which significantly offsets the elevated total cholesterol.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"45.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0","lower_normal":"20","upper_normal":"999","lower_optimal":"30","upper_optimal":"999","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"The percentage of total cholesterol that is HDL. At 45.45%, nearly half of Soraya's total cholesterol is the protective HDL type. This is outstanding and helps explain why her cardiovascular risk ratios are so favourable despite the elevated total cholesterol number.","low_causes":"Low HDL, metabolic syndrome","high_causes":"High HDL, good cardiovascular health, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol fractions, including LDL, VLDL, and Lp(a). At 4.2, marginally above the 4.0 threshold, this is a more accurate summary of Soraya's atherogenic cholesterol burden than LDL alone, and a portion of this is driven by her genetically elevated Lp(a).","low_causes":"Statin therapy, low-fat diet, hyperthyroidism","high_causes":"Genetics, diet, hypothyroidism, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"3.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0","lower_normal":"1.4","upper_normal":"999","lower_optimal":"1.6","upper_optimal":"999","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Each HDL particle carries ApoA1, so this is effectively a count of HDL particles. At 3.07, this is very high and consistent with Soraya's exceptional HDL of 3.5. It forms the denominator of the ApoB/A1 ratio, which at 0.40 is within the lower risk category.","low_causes":"Low HDL, metabolic syndrome, smoking, sedentary lifestyle","high_causes":"Genetics, exercise, healthy diet, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Since each particle carries exactly one ApoB molecule, this is the most accurate count of atherogenic particles in the blood. At 1.22, above the desirable threshold of 0.9, Soraya has more atherogenic particles circulating than ideal. However, a significant portion of these ApoB-carrying particles are her Lp(a) particles, which are genetically determined and not reduced by statins. The modifiable portion is being addressed by her statin therapy. Her ApoB/A1 ratio of 0.40 is well within the lower risk category, reflecting the protective counterbalance of her exceptionally high ApoA1.","low_causes":"Statin therapy, low-fat diet, hyperthyroidism","high_causes":"Genetics, diet, metabolic syndrome, elevated Lp(a), familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is arguably the single best lipid metric for cardiovascular risk assessment, as it directly compares the number of atherogenic (artery-damaging) particles to protective particles. At 0.40, well below the lower risk threshold of 0.6 for women, this is an excellent result. Despite her elevated ApoB in absolute terms, the protective effect of her exceptionally high ApoA1 brings this ratio into the favourable zone.","low_causes":"High ApoA1, low ApoB, excellent lipid balance","high_causes":"High ApoB, low ApoA1, metabolic syndrome, cardio
