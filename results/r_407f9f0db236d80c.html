const REPORT_DATA = {"patient_name":"Michelle Glen","dob":"07/11/1985","report_date":"2026-11-10","summary":"Patient is a 41-year-old female presenting with a BMI of 20.7, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food daily; portions are about average (volume 5 out of 10). She does no cardio or resistance training and has not reported a step count. She sleeps 6 to 7 hours a night, feels tired most mornings, with an afternoon energy crash; stress feels hard to manage most days. She does not drink alcohol. She is on HRT and has a hormonal coil. She has a family history of thyroid disease. She reports low energy and fatigue, brain fog, low mood and anxiety, and low sex drive. In her own words she also suffers pins and needles in her limbs, depression, mood swings, hair loss, bleeding gums, tinnitus and insomnia. Her goals are to improve mood, reduce stress and anxiety, and balance hormones.\n\nHer PhenoAge is 33.1 against a calendar age of 41, which means her blood markers are ageing nearly eight years younger than she is. That is a genuinely excellent result and reflects good metabolic and inflammatory health at the cellular level. Her Cardiovascular Risk Score is 0 out of 100, as low as the scale goes, meaning the lipid, inflammatory and metabolic inputs that drive cardiovascular disease are all in an ideal position.\n\nThere is a lot of good news in this panel. Her cardiovascular profile is outstanding. Total cholesterol is 3.4, LDL is 1.52, ApoB, the protein that carries cholesterol into artery walls and the single best predictor of cardiovascular risk, is 0.64, well inside the ideal threshold of 0.8. Her HDL, the protective cholesterol that moves lipid away from arteries, is 1.4, and her ApoA1, the protein on those protective particles, is 2.0, giving an ApoB to ApoA1 ratio of 0.32, which is excellent. Triglycerides at 1.13 are within the laboratory range and her Lp(a), a genetically inherited lipoprotein that adds cardiovascular risk and cannot be changed by diet or exercise, is below 25, which is ideal. Her liver is in excellent health. ALT at 16 and Gamma GT at 10, about as clean as those markers get, mean the liver is under no metabolic strain. Her APRI score of 0.256 and FIB-4 of 1.05 both make significant liver scarring very unlikely. Amylase and lipase, which reflect pancreatic health, are both comfortably within range. Her blood sugar control is strong: glucose at 4.8 and HbA1c at 32 are both within the optimal range, meaning average blood sugar over the past three months has been well controlled. Her kidney function is excellent. Cystatin C, a more precise measure of kidney filtration than creatinine alone, gives an eGFR of 109, exactly where it should be at 41. Her immune system is balanced, with IgG, IgM, IgA and IgE all within normal limits, rheumatoid factor negative, and coeliac screening negative, which makes coeliac disease very unlikely as a cause of her symptoms. Her CRP, a sensitive marker of systemic inflammation, is 0.9, just below the ideal threshold of 1.0, so there is no sign of significant inflammatory activity driving her fatigue or mood. Her thyroid stimulating hormone, TSH, at 1.24 is within the ideal range, and her TPO antibodies, the main antibody associated with autoimmune thyroid disease, are negative at less than 6.6. Her cortisol at 377, taken during a morning window, is within the expected range and does not suggest adrenal insufficiency. Her calcium, phosphate and parathyroid hormone are all within normal limits. Her ESR, another inflammatory marker, is 10, within range. Her full blood count is largely healthy: haemoglobin at 131 is within the optimal range for a woman, red cell count, MCV, MCH, MCHC and platelets are all where they should be, and her white cell count at 4.65 is within range.\n\nThe most important finding in this report is her thyroglobulin antibody level. Thyroglobulin antibodies are proteins the immune system makes against thyroglobulin, a protein the thyroid gland uses to produce thyroid hormones. Her result is 14.7, more than three times the upper limit of 4.4. This is significant because it means the immune system is targeting the thyroid gland. At present her TSH is 1.24 and her thyroid is still producing adequate hormone, so the gland is coping, but the presence of these antibodies with a family history of thyroid disease raises the possibility of early autoimmune thyroid disease, a pattern associated with a condition called Hashimoto's thyroiditis. This does not mean her thyroid is failing now, but it means it is under immune surveillance and could begin to underperform over time. Several of her symptoms, fatigue, brain fog, low mood, hair loss, and difficulty with sleep, are recognised features of thyroid autoimmunity even when TSH remains within range, because the antibodies themselves and the fluctuating hormone levels they cause can produce symptoms before the TSH rises above the laboratory limit. Her free T4, the main circulating thyroid hormone, is 13.6, which is within the laboratory range of 11.5 to 22.7 but sitting in the lower quarter of that range. Her free T3, the active form the body actually uses, is 5.0, which is comfortably within the ideal range of 4.5 to 6.5, and her FT3 to FT4 ratio of 0.368 suggests the thyroid is converting T4 to T3 adequately. The pattern of a low-normal FT4 with a healthy FT3 and TSH means the gland is working but may not have a large reserve. We would recommend discussing these antibodies with her GP. They do not require treatment today, but they do require monitoring: a repeat of TSH, FT4, FT3, and thyroglobulin antibodies in six months would show whether the picture is stable or progressing.\n\nHer free testosterone is 0.007, below the lower limit of 0.01. Free testosterone is the fraction of testosterone not bound to proteins in the blood, and it is the fraction that is biologically active, driving libido, energy, mood and muscle maintenance. Her total testosterone at 0.9 is within the laboratory range of 0.5 to 2.6 but sits in the lower quarter, and her SHBG, sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation, is 117.9, which is high. SHBG rises with oestrogen, and her oestradiol is 3,578, substantially above any normal menstrual cycle phase. This is consistent with HRT delivering a high oestrogen level, which in turn drives SHBG up, which in turn binds almost all of her already modest testosterone, leaving a free testosterone below range. This single mechanism explains a great deal: low libido is the most direct consequence of low free testosterone in women, and it may also contribute to fatigue, low mood, and difficulty building or maintaining lean tissue. Her bioavailable testosterone, the slightly broader measure that includes loosely bound testosterone, is 0.14, just above the lower optimal limit of 0.12, which confirms the picture is borderline. This is something to raise with whoever prescribes her HRT, because the oestrogen dose may need reviewing, or a small amount of testosterone may be worth considering as part of the HRT regimen, something that is increasingly recognised in women's hormone management.\n\nHer oestradiol at 3,578 is very high. The follicular phase reference is up to 529, the midcycle peak up to 1,309, and the luteal phase up to 786. Even allowing for the fact that HRT can produce levels outside natural cycle ranges, 3,578 is well above what most HRT regimens aim for. High oestradiol can itself contribute to mood swings, anxiety, breast tenderness, headaches and fluid retention. Her progesterone is 1.69, consistent with a follicular phase level, and her LH and FSH at 4.47 and 4.46 are suppressed, which is expected on HRT with a hormonal coil. It would be worth discussing the oestradiol level with her HRT prescriber to confirm whether this is the intended target or whether a dose adjustment is appropriate.\n\nHer HOMA-IR, a measure of how hard the pancreas has to work to control blood sugar, is 1.97, above the ideal limit of 1.5, in the range associated with early insulin resistance. Her insulin is 9.25, within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8, and her C-peptide at 1.54 is within range. Her glucose and HbA1c are both excellent, so the pancreas is currently winning the battle, but it is working harder than it should for someone with a BMI of 20.7 and no excess body fat. The most likely drivers are the daily sugary food and the very low vegetable and fruit intake: sugar without fibre produces a sharp glucose spike that demands more insulin. This is the most actionable finding in the report because it is entirely diet-driven and entirely reversible.\n\nHer ferritin is 29. This is within the laboratory range of 10 to 291 but below the optimal floor of 40 for a woman. Ferritin is the body's iron store, and at 29 the store is not empty but it is low enough to contribute to fatigue, brain fog, hair loss and restless legs or pins and needles. Her serum iron at 14.3, transferrin saturation at 25.2% and iron binding capacity at 51.4 are all within range, so the supply chain is working, but the warehouse is running low. Her transferrin, the protein that carries iron in the blood, is 2.26, just below the lower limit of 2.5. Low transferrin can be a sign that the body is not making enough carrier protein, which can happen with low protein intake, inflammation, or liver disease. Her liver and CRP are both clean, so the most likely explanation is that dietary protein or overall calorie intake is a little low for her needs, which fits with the diet picture: average portions, very few vegetables, and daily sugar displacing more nutrient-dense food. Building ferritin to above 50 should improve her energy, her hair, and possibly the pins and needles.\n\nHer reticulocyte absolute count is 35.6, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count means the marrow is producing red cells at a slower rate than expected. Her haemoglobin and red cell indices are normal, so she is not anaemic, but the low reticulocyte production combined with low ferritin suggests the iron stores are not quite sufficient to support brisk red cell production. As ferritin rises with supplementation and dietary change, the reticulocyte count should normalise.\n\nHer uric acid is 153, below the lower limit of 184. Uric acid is a waste product from purine metabolism, and low levels are occasionally seen with low dietary protein, high oestrogen states, or very efficient kidney clearance. Given her very high oestradiol, which promotes uric acid excretion through the kidneys, this is the most likely explanation. It is not harmful and does not need treatment, but it fits the broader picture of oestrogen driving several findings in this report.\n\nHer bicarbonate is 32, one point above the upper limit of 31. This is a very marginal elevation and is most commonly seen with mild dehydration or as a normal variant. It does not suggest a metabolic problem when her other electrolytes, kidney function and blood gas picture are all normal.\n\nHer creatinine is 43, below the laboratory lower limit of 49. Creatinine is produced by muscle, and at a BMI of 20.7 with no resistance training, a lean woman will naturally produce less creatinine. Her Cystatin C eGFR of 109 confirms that kidney function is excellent and the low creatinine is a reflection of low muscle mass rather than kidney disease. Her urea at 3.0 is also just below the lower limit of 3.2, which again is consistent with modest protein intake rather than any kidney or liver problem.\n\nHer vitamin D is 81, within the optimal range of 75 to 120. Her B12 is 464, within the laboratory range but below the optimal floor of 500. B12 is essential for nerve function, red cell production, and methylation, the chemical process that supports mood, energy and detoxification. At 464, it is not deficient, but given her symptoms of pins and needles, brain fog and fatigue, nudging it above 500 with a sublingual methylcobalamin supplement is a sensible step, because nerve symptoms are among the earliest features of suboptimal B12. Her folate at 18 is just above the upper laboratory limit of 17, which is not a concern; it simply reflects good folate intake, possibly from fortified foods or supplements.\n\nHer serum folate at 18 being mildly above the laboratory range is of no clinical concern and likely reflects dietary intake or supplementation.\n\nHer vitamin D at 81 is within the ideal band but worth maintaining at this level through the winter months with continued or started supplementation.\n\nHer urine is clear: no protein, no glucose, no ketones, no nitrites, no significant white cells, no casts, and insignificant bacterial growth. Her red blood cells in urine are 20, which is below the laboratory threshold of 25 for significance. At 41 with a hormonal coil in situ, low-level urinary red cells are most commonly explained by trace menstrual contamination. This does not require investigation unless it persists on a clean-catch midstream sample away from any bleeding.\n\nHer Ca19-9 at 34.95 is within range but sitting close to the upper limit of 37. Ca19-9 is a tumour marker most associated with pancreatic and biliary disease, but it can be mildly elevated with inflammation, benign ovarian cysts, endometriosis, or even menstruation. Given that her pancreatic enzymes, liver markers and CRP are all clean, this is very unlikely to represent anything sinister, but it is worth noting so that it can be tracked on a future retest. Her Ca125 at 7.3, CEA at 0.75 and Ca15-3 at 8.95 are all well within range.\n\nHer total antioxidant activity at 1.7 is within range. Her creatine kinase at 45 is within range, expected given the absence of resistance training. Her magnesium at 0.85 is at the lower edge of the optimal range of 0.85 to 1.05, adequate but not generous, and worth supporting given her insomnia, stress and afternoon energy crash, because magnesium supports both sleep quality and the body's stress response.\n\nPutting this together, the blood results explain some but not all of her symptoms. The low free testosterone driven by very high SHBG from high-dose oestrogen HRT is the clearest explanation for her absent libido and may contribute to fatigue and low mood. The thyroglobulin antibodies and lower-quarter FT4 raise the possibility that early thyroid autoimmunity is contributing to fatigue, brain fog, hair loss and mood disturbance. The low ferritin may be contributing to fatigue, hair loss and the pins and needles. The early insulin resistance from daily sugar intake is a metabolic finding that will worsen if not addressed. However, the bleeding gums, tinnitus and insomnia are not explained by any marker in this panel. Bleeding gums at 41 with no scurvy-level vitamin C deficiency most commonly reflect gum disease and warrant a dental review. Tinnitus can be associated with stress, poor sleep, jaw tension, or ear pathology, and her GP or an ENT assessment would be the next step if it persists. Insomnia in the context of high oestrogen, daily stress and only 6 to 7 hours of sleep is likely multifactorial: the HRT oestrogen level, her stress load, and her sleep hygiene are all likely contributors. With no training, very low vegetable intake, daily sugar and persistent high stress, her lifestyle is working against her hormones and her mood. The good news is that every modifiable finding in this report responds to changes she can make.","links":"The findings in this report connect around two main threads and a handful of smaller ones.\n\nThe first and most important thread is hormonal. Her HRT is delivering oestradiol at 3,578, well above even the midcycle peak of a natural menstrual cycle. That very high oestrogen drives SHBG to 117.9, which binds almost all of her modest total testosterone of 0.9, leaving free testosterone below range at 0.007. This single cascade, high oestrogen pushing SHBG up and free testosterone down, is the most coherent explanation for her absent libido, and likely contributes to fatigue, low mood and difficulty maintaining lean tissue. The same high oestrogen promotes uric acid excretion through the kidneys, explaining the below-range uric acid of 153. It also suppresses LH and FSH, which is expected on HRT with a hormonal coil. The oestradiol level itself may be contributing to mood swings and anxiety, because oestrogen excess can be as symptomatic as oestrogen deficiency. The solution to this entire thread is a conversation with her HRT prescriber about the oestrogen dose and whether adding testosterone would be appropriate.\n\nThe second thread is nutritional. She eats 0 to 1 portions of vegetables and fruit a day, has daily sugary food, average portions, no training, and a lean frame. Her ferritin at 29 is below optimal, her transferrin at 2.26 is below range, her reticulocyte absolute count at 35.6 is below range, her creatinine and urea are both below range reflecting low muscle mass and modest protein intake, and her B12 at 464 is below the optimal floor. The HOMA-IR of 1.97 is above the early insulin resistance threshold, driven not by body fat but by the sugar and refined carbohydrate content of her diet acting on a pancreas that has no fibre to slow the glucose absorption. Every finding in this thread improves with more protein, more vegetables, less sugar, and an iron supplement to rebuild the ferritin store. This is the most actionable thread in the report because it is entirely within her control.\n\nThe third thread is the thyroglobulin antibody at 14.7, more than three times the upper limit, with a family history of thyroid disease. Her thyroid function is currently preserved, with a healthy TSH and adequate FT3, but the FT4 sitting in the lower quarter of the range hints that the gland may not have abundant reserve. This finding stands somewhat apart from the other two threads: it is not caused by HRT or diet, it is an immune process that may or may not progress. It does, however, connect to her symptoms because autoimmune thyroid activity can produce fatigue, brain fog, hair loss and mood disturbance even before TSH rises above range. Monitoring is the right approach.\n\nThe loose ends are the bleeding gums, tinnitus and insomnia. None of these are explained by anything in the blood panel. The bleeding gums point to a dental review. The tinnitus may relate to her high stress load, poor sleep or jaw tension, and warrants a GP or ENT assessment if it persists. The insomnia is likely multifactorial: high oestrogen, high stress, suboptimal magnesium, no exercise, and no structured wind-down routine all contribute to poor sleep architecture, and addressing these is as important as any supplement.","lifestyle":"Add a portion of protein to every meal before anything else on the plate: eggs, Greek yoghurt, chicken, fish, beans or lentils. Anchor: plate goes down, protein goes on first. Why: protein supports the low transferrin and ferritin, provides the building blocks for muscle your creatinine of 43 says you are short on, and blunts the insulin spike behind your HOMA-IR of 1.97.\nAdd one extra portion of vegetables or fruit to lunch and one to dinner, building to at least four a day over the next month. Start with whatever you already like: a handful of spinach in a wrap, a sliced pepper alongside your plate, a piece of fruit as a snack. Anchor: when you plate up lunch and dinner, the vegetable goes on first. Why: fibre slows glucose absorption, which is the single biggest lever for bringing your insulin of 9.25 and HOMA-IR down, and delivers the micronutrients behind several low results.\nReplace daily sugary food with a lower-sugar alternative for five out of seven days this week. If it is a biscuit with tea, swap for a square of dark chocolate or a handful of nuts. If it is a sugary drink, swap for sparkling water with a slice of lemon. Anchor: the moment you reach for the sugary item, pause and have the swap within arm's reach. Why: daily sugar without fibre is the most likely driver of your HOMA-IR crossing the early insulin resistance threshold at 1.97.\nWalk for 20 minutes every day, ideally outside and within an hour of waking. Anchor: shoes by the door, walk before you check your phone. Why: morning daylight resets your circadian rhythm, which helps both your insomnia and your afternoon energy crash, and even gentle daily movement improves insulin sensitivity and mood.\nAdd two 20-minute resistance sessions a week: bodyweight squats, press-ups (on knees if needed), lunges, a dead-hang or plank. Anchor: pick two fixed days (e.g. Tuesday and Saturday) and set a phone reminder. Why: your creatinine of 43 and urea of 3.0 both reflect low muscle mass, and resistance training is the only stimulus that builds the lean tissue that protects metabolic health, bone density and mood as you age.\nTake magnesium glycinate 300mg with water 30 to 60 minutes before bed. Anchor: leave the bottle next to your toothbrush. Why: your magnesium is 0.85, the floor of the optimal range, and magnesium glycinate specifically supports sleep quality and the stress response, both of which you have flagged as problems.\nSet a fixed wake time seven days a week and a caffeine cut-off at 1pm. Keep the bedroom cool and dark. Anchor: set an alarm for the same time every day including weekends. Why: with 6 to 7 hours of sleep and tired mornings, a fixed wake time is the single most effective sleep hygiene intervention, and a caffeine cut-off protects the second half of the night.\nAim for approximately 1,700 to 1,900 calories a day with at least 83 to 100g of protein. At a BMI of 20.7 with no training, your estimated maintenance is around 1,750 to 1,850 calories; as you add resistance sessions this will rise to approximately 1,900 to 2,000. The goal is not weight loss but nutrient density: replacing sugar calories with protein, vegetables and whole grains.","flags":"Thyroglobulin antibodies 14.7, more than three times the upper limit of 4.4, with TPO antibodies negative and TSH 1.24. This is a positive marker for thyroid autoimmunity, associated with Hashimoto's thyroiditis, and warrants monitoring given her family history of thyroid disease. Thyroid function is currently preserved but FT4 at 13.6 sits in the lower quarter of the range.\nFree testosterone 0.007, below the lower limit of 0.01, with total testosterone 0.9 (lower quarter of range) and SHBG 117.9 (upper quarter of range). The very high oestradiol of 3,578 from HRT is driving SHBG up and free testosterone down. This is the most likely explanation for her absent libido and may contribute to fatigue and low mood.\nOestradiol 3,578, substantially above all menstrual cycle phase references (follicular up to 529, midcycle up to 1,309, luteal up to 786). This level from HRT is driving the high SHBG and low free testosterone. Discuss with HRT prescriber whether the dose is as intended.\nHOMA-IR 1.97, above the ideal limit of 1.5, in the range associated with early insulin resistance. Insulin 9.25 is above the optimal ceiling of 8. Glucose and HbA1c are both optimal, so the pancreas is compensating. Driven by daily sugar intake rather than body fat at BMI 20.7.\nFerritin 29, below the optimal floor of 40 for a woman. Transferrin 2.26, below the lower limit of 2.5. Reticulocyte absolute count 35.6, below the lower limit of 50. Together these suggest low iron stores limiting red cell production. Serum iron and saturation are adequate, so supplementation and dietary improvement should restore the stores.\nB12 464, below the optimal floor of 500. With symptoms of pins and needles, brain fog and fatigue, suboptimal B12 may be contributing to nerve symptoms.\nUric acid 153, below the lower limit of 184. Most likely driven by the very high oestradiol promoting renal excretion. Not harmful; no treatment needed.\nCreatinine 43, below the lower limit of 49, and urea 3.0, below the lower limit of 3.2. Both reflect low muscle mass and modest protein intake at a lean BMI with no resistance training. Cystatin C eGFR of 109 confirms excellent kidney function.\nBicarbonate 32, one point above the upper limit of 31. Marginal and most likely a normal variant or mild dehydration. No action needed in isolation.\nCa19-9 34.95, within range but near the upper limit of 37. All pancreatic, liver and inflammatory markers are clean. Most likely benign but worth tracking on retest.\nFolate 18, one point above the upper laboratory limit of 17. This is not a clinical concern and most likely reflects dietary intake or supplementation; there is no toxicity risk from mildly elevated serum folate.\nReassuring negatives: liver function makes significant liver disease unlikely; HbA1c and glucose make diabetes unlikely; CRP and ESR make significant systemic inflammation unlikely; coeliac screen negative makes coeliac disease unlikely; immunoglobulins and rheumatoid factor make immune deficiency and rheumatoid disease unlikely; Ca125, Ca15-3 and CEA are all well within range; TPO antibodies negative; PSA not applicable; kidney function excellent on Cystatin C eGFR.","recommendations":"Discuss the oestradiol level of 3,578 and the low free testosterone of 0.007 with your HRT prescriber. Ask whether the oestrogen dose is appropriate and whether adding testosterone to the HRT regimen would be suitable given your symptoms of absent libido, fatigue and low mood.\nAsk your GP to note the positive thyroglobulin antibody result of 14.7 with a family history of thyroid disease. Request a repeat of TSH, FT4, FT3 and thyroglobulin antibodies in six months to monitor for progression.\nMention the HOMA-IR of 1.97 and insulin of 9.25 to your GP as a possible sign of early insulin resistance. The dietary changes in this report are the first-line treatment and a retest in four to six months will show whether they have worked.\nAsk your GP or dentist about the bleeding gums, as this is not explained by the blood panel and most commonly reflects gum disease requiring dental assessment.\nMention the tinnitus to your GP. If it persists, an ENT referral may be appropriate to exclude an ear-related cause.\nAim for approximately 1,700 to 1,900 calories a day (rising to 1,900 to 2,000 as training is added) with at least 83 to 100g of protein. Retest in four to six months, repeating at minimum: TSH, FT4, FT3, thyroglobulin antibodies, insulin, HOMA-IR, ferritin, transferrin, reticulocytes, B12, free testosterone, SHBG and oestradiol.","supplementation":"Iron: ferrous bisglycinate 25mg, taken with a source of vitamin C (a glass of orange juice or a vitamin C tablet), on an empty stomach or with a light meal, every other day. Why: ferritin at 29 is below the optimal floor of 40 and is likely contributing to fatigue, hair loss, and the low reticulocyte count of 35.6. Every-other-day dosing improves absorption. Continue until ferritin reaches 50 to 70, then reassess.\nVitamin B12: sublingual methylcobalamin 1,000mcg daily, dissolved under the tongue. Why: B12 at 464 is below the optimal floor of 500, and with pins and needles, brain fog and fatigue, nudging it above 500 supports nerve function, red cell production and methylation.\nVitamin D3: cholecalciferol 2,000 IU daily, taken with a meal containing fat. Why: vitamin D at 81 is within the optimal range but will fall over winter without supplementation. Maintaining it above 75 supports immune function, mood and bone health.\nVitamin K2: MK-7 100mcg daily, taken alongside the vitamin D3. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than soft tissues, and should always accompany vitamin D supplementation.\nMagnesium glycinate: 300mg before bed. Why: magnesium at 0.85 is at the floor of the optimal range, and glycinate is the form best evidenced for sleep quality and stress support, both of which she has flagged as problems.\nOmega-3: fish oil providing 1,000mg combined EPA and DHA daily, with food. Why: with 0 to 1 portions of vegetables and fruit daily and no oily fish reported, omega-3 intake is likely very low. EPA and DHA support mood, brain function and help maintain the excellent inflammatory profile her CRP of 0.9 already shows.\nDo not take a high-dose vitamin A supplement without GP advice, as vitamin A excess can worsen hair loss.\nThe most important changes from this report are not supplements. They are adding protein and vegetables to every meal, reducing daily sugar, starting resistance training, and reviewing the HRT oestradiol dose with your prescriber.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 61.1; held to 59 by a system rated \"See your GP\". Weakest systems: kidney function 24%, hormones 38%, thyroid 46%. Biggest drags: Creatinine, Oestradiol, HOMA-IR, Urea.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"33.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3598","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is a biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 33.1 against a calendar age of 41 means her blood markers are ageing nearly eight years younger than she is. The main drivers of this favourable gap are her excellent CRP of 0.9, healthy glucose of 4.8, and good albumin of 40. With the dietary and lifestyle changes in this report, the gap should remain stable or widen further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score runs from 0 to 100 and is built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built by those markers right now, regardless of age. At 0, this is as low as the scale goes and reflects her excellent lipid, inflammatory and metabolic profiles. Every input to the score is in a favourable position.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, alanine aminotransferase, is an enzyme found mainly inside liver cells. When the liver is stressed or damaged, ALT leaks into the bloodstream and the level rises. Her ALT at 16 is well within the optimal ceiling of 25 for a woman and comfortably within the laboratory limit of 56. This confirms the liver is under no metabolic strain.","low_causes":"","high_causes":"Liver inflammation, fatty liver, alcohol, medications, obesity, hepatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4271","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/l","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart and muscles. Her AST at 22 is within the optimal range, confirming healthy liver and muscle tissue with no sign of cellular damage.","low_causes":"Very low muscle mass, vitamin B6 deficiency","high_causes":"Liver damage, heart damage, muscle injury, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3922","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/l","description":"Gamma GT, gamma-glutamyl transferase, is a liver enzyme that rises with alcohol use, bile duct obstruction, fatty liver and certain medications. At 10, well inside the optimal ceiling of 25, this is about as clean as the marker gets. With no alcohol intake reported, the liver is under no strain from any source.","low_causes":"","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. It can rise with bile duct obstruction, bone disease or during growth. At 51, comfortably within range, it confirms healthy liver and biliary function.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells break down. The liver processes it for excretion. Her bilirubin at 5 sits right at the lower limit of the range. This is normal and reflects efficient bilirubin clearance by the liver.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein measures all protein in the blood, including albumin and globulins. At 74, this is comfortably within the optimal range, suggesting adequate protein production by the liver and a healthy immune system.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, nutrients and medications and maintains fluid balance. At 40, within the optimal range, it confirms healthy liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5926","units":"g/l","description":"Globulins are a group of proteins that include antibodies and transport proteins. At 34, this is within the laboratory range but slightly above the optimal ceiling of 32. A mildly elevated globulin can reflect immune activity, which is consistent with the positive thyroglobulin antibodies suggesting the immune system is active against the thyroid. It is not a concern in itself.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3621","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that uses age, AST, ALT and platelet count to estimate the likelihood of liver fibrosis, or scarring. At 1.05, well below the 1.3 threshold, significant liver fibrosis is very unlikely. Combined with her clean liver enzymes and GGT, the liver is in excellent health.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelets, very low ALT","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"105","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6174","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands that breaks down starches. At 82, comfortably mid-range, it confirms healthy pancreatic function with no sign of inflammation or obstruction.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6099","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5603","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. At 52, within the laboratory range but above the tighter optimal ceiling of 45, it is still well within normal limits and does not suggest pancreatic disease. The small elevation above optimal is of no clinical significance when amylase is mid-range and there are no symptoms of pancreatic illness.","low_causes":"","high_causes":"Pancreatitis, pancreatic obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3282","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including the protective HDL and the potentially harmful LDL fractions. At 3.4, well below the desirable ceiling of 5.18, this is an excellent result. The individual components tell the full story, and in her case they are all favourable.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3324","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, mainly influenced by recent carbohydrate and sugar intake, alcohol, and body fat. At 1.13, she is within the laboratory limit of 1.7 but above the optimal ceiling of 1.0. This is consistent with the daily sugar intake she reports, and as sugar is reduced and vegetables are added, triglycerides should drift down towards the ideal.","low_causes":"Very low-fat diet, malnutrition, hyperthyroidism","high_causes":"Sugar, refined carbohydrates, alcohol, obesity, diabetes, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.6","upper_optimal":"2.5","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL, high-density lipoprotein, is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver. At 1.4, this is within the laboratory's desirable range but below the female optimal floor of 1.6. Her ApoA1 at 2.0 is strong, which means the HDL particles themselves are functioning well. Regular exercise is the most effective way to raise HDL, and even brisk walking produces a measurable improvement.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, diabetes","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4693","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, low-density lipoprotein, is the cholesterol particle most associated with plaque build-up in arteries. At 1.52, well below both the laboratory limit and the optimal ceiling of 2.6, this is an excellent result and one of the strongest protective findings in the report.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vldl","name":"Very Low-Density Lipoprotein","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3269","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL is a lipoprotein made by the liver that carries triglycerides to tissues. At 0.51, within the optimal range, it reflects healthy triglyceride metabolism and adequate liver processing of dietary fats.","low_causes":"","high_causes":"High sugar and carbohydrate intake, obesity, diabetes, alcohol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2700","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. At 2.43, well below the upper limit of 4.5, this indicates a favourable balance between total cholesterol and protective HDL.","low_causes":"","high_causes":"High LDL, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"41.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"This shows how much of total cholesterol is made up of protective HDL. At 41.18%, this is a strong proportion, meaning a large share of her circulating cholesterol is the beneficial kind.","low_causes":"Sedentary lifestyle, obesity, poor diet","high_causes":"Regular exercise, genetics, very low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus the protective HDL, representing all the potentially atherogenic cholesterol in the blood. At 2.0, well below the limit of 4.0, this confirms an excellent cardiovascular lipid profile.","low_causes":"","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7143","lower_normal":"1.4","upper_normal":"2.6","lower_optimal":"1.6","upper_optimal":"2.6","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main structural protein on HDL particles and reflects the functional capacity of the protective cholesterol system. At 2.0, well above the normal floor of 1.4, this is a strong result that indicates her HDL particles are plentiful and functional, supporting efficient reverse cholesterol transport.","low_causes":"Sedentary lifestyle, smoking, obesity","high_causes":"Exercise, genetics, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL and VLDL particle, making it the single best measure of the number of atherogenic particles in the blood. Each particle that can deposit cholesterol in an artery wall carries exactly one ApoB molecule, so ApoB is a direct count of risk. At 0.64, well below the optimal ceiling of 0.8, this is an excellent result and the most reassuring single marker in her cardiovascular profile.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, genetics, hypothyroidism, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio balances the number of harmful particles (ApoB) against the number of protective particles (ApoA1). At 0.32, well below the lower risk threshold of 0.6, this is one of the strongest cardiovascular markers in her report, indicating the balance between atherogenic and protective lipoproteins is firmly in her favour.","low_causes":"","high_causes":"High ApoB, low ApoA1, poor diet, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), often written Lp(a), is a genetically determined lipoprotein that adds cardiovascular risk independently of LDL. Unlike other lipids it cannot be changed by diet or exercise. At below 25, this is within the ideal range below 32, which is genuinely useful information because it means any future changes in her lipid profile would be driven entirely by modifiable factors rather than an inherited risk.","low_causes":"","high_causes":"Inherited, cannot be modified by lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Blood glucose is the amount of sugar circulating in the blood at the time of testing. At 4.8, comfortably within the optimal range of 4.0 to 5.4, her body is controlling blood sugar effectively at the point of measurement.","low_causes":"Fasting, excessive insulin, liver disease","high_causes":"Diabetes, pre-diabetes, stress, high sugar diet, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4667","units":"%","description":"HbA1c expressed as a percentage. At 5.1%, well below the 6.0% pre-diabetes threshold, this confirms good average blood sugar control over the past two to three months.","low_causes":"Anaemia, haemolysis, recent blood loss","high_causes":"Pre-diabetes, diabetes, high sugar diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin that has been glycated, or coated with sugar, over the past two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose. At 32, well within the optimal ceiling of 36 and below the 42 pre-diabetes threshold, her average blood sugar has been well controlled despite the daily sugar intake she reports.","low_causes":"Anaemia, haemolysis, recent blood loss","high_causes":"Pre-diabetes, diabetes, high sugar diet, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"9.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4327","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin shows how much insulin the pancreas needs to produce to keep blood sugar under control. At 9.25, within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8, the pancreas is working slightly harder than ideal to maintain her excellent glucose and HbA1c. This may reflect an early stage of insulin resistance, where glucose is still well controlled but at the cost of higher insulin output. The most likely driver is her daily sugar intake without the buffering fibre of vegetables.","low_causes":"Low carbohydrate diet, very high insulin sensitivity, pancreatic insufficiency","high_causes":"Insulin resistance, high sugar and refined carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3778","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-peptide is released by the pancreas in equal amounts to insulin, providing a measure of how much insulin the body is actually producing. At 1.54, within the optimal range, this confirms the pancreas is functioning well. The slightly elevated insulin from the HOMA-IR calculation is a demand-side issue, not a production failure.","low_causes":"Type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8233","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, combines glucose and insulin to estimate how resistant the body's cells are to insulin's signal. At 1.97, above the upper limit of 1.5 and in the range associated with early insulin resistance, this is the most actionable metabolic finding in the report. At a BMI of 20.7 the driver is not body fat but dietary sugar without fibre. Reducing daily sugar and adding vegetables and protein to meals should bring this below 1.5 within a few months.","low_causes":"Very high insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, high sugar diet, obesity, sedentary lifestyle, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximation of the average blood sugar level over the past two to three months. At 5.5, within the optimal range, this confirms that day-to-day blood sugar has been well controlled despite the insulin working harder than ideal to achieve it.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4756","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index uses triglycerides and glucose to provide another estimate of insulin resistance. At 8.37, within the optimal ceiling of 8.5, this supports the picture that her insulin resistance is at an early stage. The HOMA-IR, which uses insulin directly, is the more sensitive early marker and has already picked up the change.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP measures low-level systemic inflammation. It is produced by the liver in response to inflammatory signals and is used both as a cardiovascular risk marker and a general indicator of inflammatory activity. At 0.9,
