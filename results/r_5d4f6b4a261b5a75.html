<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Beth Naomi Appleford","dob":"22/12/1992","report_date":"2026-09-22","summary":"Beth is a 33-year-old female presenting with a BMI of 32.8, following a fully vegan diet rated 8 out of 10 for quality with a volume of 6 out of 10. She trains four times per week, split evenly between two cardio and two resistance sessions, with 7,500 to 10,000 daily steps. She reports frequent painkiller use, specifically ibuprofen or paracetamol. She reports low energy and fatigue, frequent illness and poor sleep or insomnia. Her goals are to boost her immune system, improve long-term health and longevity, and balance her hormones.\n\nBeth's blood sugar control is in excellent shape. Her fasting glucose is 4.5, her HbA1c is 33, and her fasting insulin is 5.71, all sitting comfortably within the ideal range. Her HOMA-IR, a calculation that combines glucose and insulin to estimate how sensitively her cells respond to insulin, is 1.14. At a BMI of 32.8 this is a genuinely positive finding, because carrying extra weight usually pushes insulin resistance upward, and hers is working well. Her C-Peptide, a marker of how much insulin the pancreas is producing, is 450 pmol/L once converted from laboratory units, sitting within range and confirming the pancreas is under no strain. Her liver is in very good health. ALT at 15 and GGT at 19 are both well inside the ideal range, and the AST to ALT ratio at 1.2 is exactly where it should be. The FIB-4 score, which estimates whether any scarring has built up in the liver, is 0.53, comfortably below the threshold that would prompt further investigation, confirming there is no sign of fibrotic change. Her APRI score of 0.155 and NAFLD Fibrosis Score of minus 2.528 both reinforce this. Her kidneys are working well. Cystatin C is 1.07, giving a Cystatin C-based eGFR of 93 and a combined eGFR of 93, both above the 90 threshold that marks healthy filtration for her age. Urea, creatinine and electrolytes are all within normal limits. Her thyroid is functioning well. TSH at 0.89 is within the ideal range of 1.0 to 2.5 and only marginally below that band, which at this margin is not a concern. Free T4 at 17.5 and Free T3 at 5.0 are both within the ideal range, and the FT3 to FT4 ratio at 0.286 confirms the thyroid is converting its storage hormone into the active form efficiently. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease as a contributor to her fatigue and frequent illness. Her immune system architecture looks reassuring. White cell count at 5.68, neutrophils at 3.75 and lymphocytes at 1.61 are all well within range. The immunoglobulins, IgG, IgM and IgA, are all within range, showing that the three main arms of her antibody-producing system are intact. IgE at 12.1 is low and healthy, with no suggestion of an allergic or parasitic driver. Coeliac screening is negative. Her calcium, corrected calcium, phosphate, magnesium and parathyroid hormone are all within range, and her PhenoAge, a biological age estimate built from inflammatory, metabolic and blood cell markers, will be computed from these results.\n\nThere are, however, several findings that need attention, and they connect into a story that makes sense given Beth's diet, her weight and her symptoms.\n\nThe most important finding is her ferritin. Ferritin measures the body's iron stores, and Beth's is 18. The laboratory range starts at 10, so it is technically within range, but the optimal range for a woman of her age is 40 to 150. At 18, her stores are genuinely depleted. Her serum iron at 18.7, transferrin at 2.71 and transferrin saturation at 27.5% are all within range, which means her circulating iron is adequate right now, but the reservoir behind it is running low. On a fully vegan diet the only iron available is non-haem iron, which the gut absorbs at roughly 5 to 12% compared with 15 to 35% for haem iron from animal sources. Over months and years, this gap quietly drains the stores. Ferritin at this level is one of the most common causes of fatigue in women of Beth's age, and it is very likely contributing to the low energy she reports. It may also be contributing to her frequent illness, because iron plays a role in immune cell function, particularly in the ability of neutrophils and macrophages to kill pathogens.\n\nHer ESR is 26, which is above the upper limit of 12. ESR stands for erythrocyte sedimentation rate and measures how quickly red blood cells settle in a tube over one hour. It rises when there is inflammation somewhere in the body. Her hsCRP, a more specific inflammation marker, is 1.4, which is above the ideal threshold of 1.0 but below the laboratory upper limit of 5. Together these suggest a low-grade inflammatory process. At a BMI of 32.8, excess adipose tissue is the most likely driver, because fat cells release inflammatory cytokines including interleukin-6, which is the main stimulus for ESR elevation. Frequent NSAID use, which Beth reports, can itself cause gut irritation that contributes to systemic inflammation. The raised ESR could also be contributing to her fatigue, because chronic low-grade inflammation is associated with tiredness, poor sleep quality and a feeling of being run down. It is worth noting that her full blood count is otherwise clean, her liver and kidney function are normal, and her immunoglobulins are normal, so there is no suggestion of an underlying autoimmune or haematological condition driving the ESR. The most proportionate explanation is her weight and the NSAID use, and both are modifiable.\n\nHer lipid panel tells a mixed story. Total cholesterol at 4.6 is within desirable limits, and her triglycerides at 1.26 are within range though above the optimal threshold of 1.0. Her VLDL at 0.57 is healthy. However, her HDL cholesterol at 1.0 is at the lower boundary, sitting just below the 1.04 threshold the laboratory flags as undesirable and well below the optimal of 1.6 for a woman. HDL is the cholesterol particle that removes excess cholesterol from artery walls and returns it to the liver, so a low HDL means that clearance mechanism is underperforming. Her LDL at 3.07 is marginally above the laboratory upper limit of 3.0 and above the optimal of 2.6. Her ApoB, which counts the number of cholesterol-carrying particles in the blood and is considered a more accurate measure of cardiovascular risk than LDL alone, is 0.85, within the laboratory desirable range of below 0.9 but above the optimal target of 0.8. Her ApoA1, the protein on the protective HDL particles, is 1.14, below the desirable threshold of 1.4 or above. This gives an ApoB to ApoA1 ratio of 0.75, which falls in the average risk category of 0.6 to 0.8, above the lower risk threshold. Her TC to HDL ratio at 4.6 is above the 4.5 threshold. Remnant cholesterol, which is calculated as total cholesterol minus HDL minus LDL, comes to 0.53, marginally above the optimal of 0.5. Her Lp(a) is below 25, which is genuinely useful information because Lp(a) is entirely inherited and cannot be changed by diet or exercise. A normal Lp(a) means that the lipid findings above are driven entirely by modifiable factors, specifically her weight, her HDL being low, and potentially a dietary pattern that, while plant-based and high quality, may be higher in refined carbohydrates or lower in the specific fats that raise HDL, such as olive oil and nuts. Her Lp(a)-corrected LDL is 2.99, which confirms that essentially all of her LDL is modifiable. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 40, sitting at the upper boundary of the acceptable range and above the ideal threshold of 20. The inputs driving this score are her low HDL, the marginally elevated LDL and ApoB, and the hsCRP of 1.4. At 33 her ten-year absolute cardiovascular risk is low, but the score reflects the risk being built, and the gap between the two is the window for acting.\n\nHer free testosterone, calculated at 0.0111 nmol/L, is below the lower limit of 0.013. Total testosterone at 0.7 is within range, and SHBG at 41.9 is within range, so the issue is not excessive binding but rather that total testosterone is sitting toward the lower end. Free testosterone is the fraction that is unbound and available to tissues, and it plays a role in energy, mood, libido, muscle recovery and motivation. At this level it could be contributing to her fatigue, her difficulty recovering from training, and potentially her sleep quality. DHEA-S at 3.2 umol/L, which converts to approximately 1,179 ug/dL, is within range, so the adrenal contribution to androgens is adequate. Oestradiol at 139, LH at 2.77 and FSH at 5.03 are consistent with a follicular phase reading, and progesterone at 1.03 confirms she was likely in the follicular phase when the sample was taken, which is normal. Prolactin at 123 is within the non-pregnant range. Cortisol at 169 is within the morning reference range, though toward the lower end, which in combination with the low free testosterone and the fatigue symptoms could reflect the body conserving energy. Her bioavailable testosterone at 0.24 is within range, which is reassuring, but the free fraction being below range is still worth addressing.\n\nHer vitamin D at 99 is within the optimal range of 75 to 120, which is a genuinely impressive result on a vegan diet since vitamin D3 is predominantly found in animal sources and sunlight synthesis varies with latitude and season. She is clearly either supplementing effectively or getting good sun exposure. Her B12 at 929 is excellent, well within the optimal range of 500 to 900 and actually just above it, confirming she is supplementing appropriately, which is essential on a vegan diet since B12 is not available from plant foods. Her folate at 16 is within the optimal range, as expected on a plant-rich diet. Her total antioxidant activity at 2.0 is above the laboratory range of 1.3 to 1.77, which is almost certainly driven by supplementation or the high volume of plant foods in her diet and is not a concern.\n\nHer MCHC at 345 sits exactly at the upper limit of range, which at this margin is laboratory variation and not a concern. Her Systemic Immune-Inflammation Index at 675 is above the optimal range of 150 to 450 but within the laboratory range of 100 to 600. This composite index combines neutrophils, platelets and lymphocytes and is consistent with the low-grade inflammatory signal from her ESR and hsCRP rather than representing a separate finding. Her Platelet to Lymphocyte Ratio at 180.1 is within range but above the optimal of 80 to 160, again reflecting the same mild inflammatory picture. Her rheumatoid factor and urine culture results are pending and will be reviewed when available.\n\nReturning to Beth's symptoms, her fatigue has at least two plausible contributors in this panel: the depleted ferritin at 18 and the below-range free testosterone. Both are addressable. The low-grade inflammation from her ESR and hsCRP may also be contributing to the tiredness and the feeling of being run down. Her frequent illness is harder to explain from these bloods alone, because her white cell counts and immunoglobulins are all healthy. The most likely explanations for recurrent infections that blood cannot measure are sleep quality and duration, stress, and the chronic low-grade inflammation itself, which can paradoxically impair the immune response to acute infections even while the baseline immune architecture looks intact. Her poor sleep is not explained by any single marker here. Thyroid function is normal, blood sugar is excellent, and cortisol is within range. Sleep disruption at BMI 32.8 raises the possibility of obstructive sleep apnoea, which is common and underdiagnosed in women, particularly when BMI is above 30, and could explain both the poor sleep and the daytime fatigue. If Beth snores, wakes unrefreshed despite adequate hours, or wakes with headaches, a sleep study would be a proportionate next step. Beyond that, her frequent painkiller use is worth examining: NSAIDs can disrupt sleep architecture, and if the pain driving the painkiller use is itself disturbing sleep, identifying and managing the underlying cause would help more than the painkillers.\n\nIn terms of what Beth can take away from this report, her metabolic health is surprisingly strong for her BMI. Blood sugar, insulin sensitivity, liver function and kidney function are all working well, which gives her an excellent foundation. The areas to focus on are building her iron stores, improving her lipid profile primarily through raising HDL, reducing the low-grade inflammation, and addressing the below-range free testosterone. All of these are modifiable through the dietary, movement and supplementation changes outlined below, and all of them connect directly to the symptoms she is experiencing.","links":"The findings in Beth's report connect into two overlapping patterns rather than being isolated abnormalities.\n\nThe first is a vegan iron depletion pattern. Ferritin at 18 tells us the iron reservoir is running low despite circulating iron being adequate for now. On a fully plant-based diet, the only iron available is non-haem iron, which competes with phytates, oxalates and polyphenols in the gut for absorption. Over time this drains the stores. The depleted ferritin is very likely contributing to her primary complaint of fatigue, and iron's role in immune cell function means it could be a factor in her frequent illness. This is not anaemia: her haemoglobin at 134, MCV at 89.4 and MCH at 30.8 are all healthy, so the red blood cells are being made normally. But the stores behind them are thin, and if nothing changes, anaemia is where this trajectory leads.\n\nThe second pattern is a weight-driven inflammatory and lipid picture. At BMI 32.8, excess adipose tissue is an active endocrine organ that releases inflammatory cytokines. This explains the ESR of 26 and the hsCRP of 1.4 without needing to invoke any other inflammatory condition. The same adipose tissue suppresses HDL production and raises triglycerides and LDL, which explains why her HDL is low at 1.0, her ApoA1 is below desirable at 1.14, and her LDL and ApoB are marginally above their optimal targets. The Cardiovascular Risk Score of 40 is being driven primarily by the low HDL and the inflammation rather than by a dramatically elevated LDL. The reassuring Lp(a) result confirms that the entire lipid picture is modifiable.\n\nThe below-range free testosterone connects to both patterns. Low iron stores can impair androgen production, and excess body fat increases aromatase activity, which converts testosterone to oestradiol. Both mechanisms could be contributing to her free testosterone sitting below range. Addressing the iron stores and gradually reducing body fat should improve this without any hormonal intervention.\n\nWhat was excluded matters. Thyroid disease was ruled out by a normal TSH, normal free hormones and negative antibodies. Coeliac disease, which can cause malabsorption of iron and many of her symptoms, was ruled out by a negative tissue transglutaminase. Autoimmune conditions were largely excluded by normal immunoglobulins and a pending but likely normal rheumatoid factor. Kidney disease was excluded by a healthy eGFR and clean urinalysis. Liver disease was excluded comprehensively by normal enzymes, normal fibrosis scores and normal bilirubin.\n\nThe loose end is sleep. Nothing in these bloods explains poor sleep directly, and the bloods cannot measure the two most likely causes: obstructive sleep apnoea, which is common at her BMI, and the chronic pain that is driving her frequent painkiller use. Both deserve investigation because poor sleep amplifies inflammation, impairs immune function, worsens insulin sensitivity and lowers testosterone, meaning it could be quietly worsening several of the findings in this report.","lifestyle":"Add 25 to 50mg of elemental iron as ferrous bisglycinate with a glass of orange juice or another vitamin C source, taken on an empty stomach in the morning, away from tea and coffee by at least an hour. Anchor: first thing after waking, before breakfast. Why: your ferritin is 18 against an optimal of 40 to 150, and non-haem iron from a vegan diet alone is unlikely to rebuild stores quickly enough.\n\nAdd a palm-sized portion of plant protein to every meal: tofu, tempeh, lentils, chickpeas, edamame, or a pea and rice protein blend. Aim for at least 111 to 136 grams of protein per day, which is 1.3 to 1.6 grams per kilogram of your body weight for your training level. Anchor: protein goes on the plate before anything else. Why: adequate protein supports muscle recovery from your four weekly sessions, helps raise HDL cholesterol, and supports testosterone production.\n\nInclude a source of omega-3 every day: an algae-based EPA and DHA supplement is the most reliable vegan source, or ground flaxseed and walnuts for ALA, though conversion to EPA and DHA is limited. Why: omega-3 raises HDL, lowers triglycerides, and reduces the low-grade inflammation behind your ESR of 26 and hsCRP of 1.4.\n\nAdd a daily portion of oats, barley, or ground flaxseed for soluble fibre, building up gradually to avoid bloating. Anchor: stir into your morning porridge or smoothie. Why: soluble fibre binds cholesterol in the gut and lowers LDL, which at 3.07 is marginally above range.\n\nWalk for 15 to 20 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: post-meal walking lowers glucose and triglyceride responses, and over time improves insulin sensitivity and supports weight management, which is the single biggest lever for your HDL, your inflammation markers and your free testosterone.\n\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking for natural light. Anchor: alarm goes off, curtains open, step outside even briefly. Why: morning light resets the circadian clock and is the single most effective free intervention for poor sleep quality.\n\nSet a caffeine cut-off at 1pm. Any caffeine after that delays sleep onset and reduces deep sleep, even if you feel you fall asleep fine. Why: better sleep will reduce inflammation, support immune function and improve the fatigue you are experiencing.\n\nReview your painkiller use with your GP. Frequent ibuprofen raises ESR and hsCRP through gut irritation, and paracetamol in high doses burdens the liver. Ask about the underlying cause of the pain and whether alternative management, such as physiotherapy, heat, or topical treatments, could reduce the need for oral painkillers. Why: reducing NSAID use will lower your inflammatory markers and protect your gut lining.","flags":"ESR 26, above the upper limit of 12. In the context of a BMI of 32.8 and frequent NSAID use, this most likely reflects adipose-driven and NSAID-related low-grade inflammation. Full blood count, immunoglobulins and liver and kidney function are all normal, making an underlying autoimmune or haematological cause unlikely. Worth mentioning to the GP alongside the hsCRP of 1.4.\n\nFerritin 18 ng/ml, within the laboratory range of 10 to 291 but well below the optimal of 40 to 150 for a premenopausal woman. On a fully vegan diet, iron stores are at risk of progressive depletion. Circulating iron, transferrin and saturation are currently adequate, so this is pre-anaemic iron depletion rather than iron deficiency anaemia. Supplementation with ferrous bisglycinate and a recheck at three months is recommended.\n\nHDL 1.0 mmol/L, below the desirable threshold of 1.04 and well below the optimal of 1.6 for a woman. ApoA1 1.14, below the desirable threshold of 1.4. Together these indicate underperforming reverse cholesterol transport. The primary driver at BMI 32.8 is likely excess adipose tissue combined with a possible shortfall in the dietary fats that raise HDL.\n\nLDL 3.07 mmol/L, marginally above the laboratory upper limit of 3.0 and above optimal of 2.6. ApoB 0.85 g/L, within the desirable range of below 0.9 but above the optimal of 0.8. ApoB to ApoA1 ratio 0.75, average risk category. TC to HDL ratio 4.6, above the 4.5 threshold. Lp(a) below 25, confirming the entire lipid picture is modifiable. Cardiovascular Risk Score 40 out of 100, at the upper boundary of acceptable, driven by low HDL, marginal LDL elevation and hsCRP 1.4.\n\nFree testosterone (calculated) 0.0111 nmol/L, below the lower limit of 0.013. Total testosterone 0.7 and SHBG 41.9 are both within range. This may be contributing to fatigue, poor recovery and low energy. Likely driven by a combination of low iron stores and elevated body fat increasing aromatase activity.\n\nhsCRP 1.4 mg/L, within the laboratory range of below 5 but above the optimal threshold of 1.0. Consistent with the raised ESR and the low-grade inflammatory picture described above.\n\nSII (Systemic Immune-Inflammation Index) 675, above the optimal range of 150 to 450 but within laboratory range. Consistent with the ESR and hsCRP findings and does not represent a separate concern.\n\nRheumatoid Factor: result pending. Review when available; if elevated, consider in the context of the raised ESR and any joint symptoms.\n\nUrine culture and sensitivities: result pending. All other urinalysis markers are negative and reassuring.\n\nReassuring negatives: thyroid function normal with negative antibodies, coeliac screen negative, blood sugar and insulin sensitivity excellent with HOMA-IR 1.14, liver function and fibrosis scores all healthy, kidney function healthy with eGFR 93, immunoglobulins normal, tumour markers CA125, CA15-3, CA19-9 and CEA all within range, Lp(a) below 25, vitamin D 99, B12 929, folate 16.","recommendations":"Discuss the ESR of 26 with your GP, alongside hsCRP of 1.4 and your frequent painkiller use. Ask whether the NSAID use could be contributing, whether the underlying pain can be managed differently, and whether a repeat ESR after reducing NSAIDs would be informative.\n\nAsk your GP about your free testosterone of 0.0111, which is below the lower limit of 0.013. In a 33-year-old woman with fatigue and low energy this is worth reviewing, particularly if it persists after iron stores are rebuilt. A morning repeat alongside a full hormone panel timed to early follicular phase would give the clearest picture.\n\nDiscuss your poor sleep and frequent illness with your GP. Given a BMI of 32.8, ask whether a sleep study to exclude obstructive sleep apnoea would be appropriate, particularly if you snore, wake unrefreshed, or experience morning headaches. Poor sleep amplifies inflammation, impairs immune function and lowers testosterone.\n\nBegin iron supplementation with ferrous bisglycinate 25 to 50mg daily with vitamin C, and recheck ferritin in three months. If ferritin has not risen above 40, your GP may wish to investigate absorption or consider higher-dose or intravenous iron.\n\nReview the pending rheumatoid factor result when it returns. If elevated, discuss with your GP in the context of the raised ESR and any joint symptoms.\n\nCalorie and protein targets: at 85kg, 161cm and training four times per week, your estimated maintenance calories are approximately 2,210 per day (BMR of approximately 1,580 multiplied by an activity factor of 1.4). For gradual fat loss to improve your HDL, inflammation and free testosterone, aim for 1,700 to 1,900 calories per day with a protein floor of 111 grams per day, ideally closer to 130 grams. A realistic initial target is 78 to 82kg over six months, then reassess. Retest in four months with a repeat of ferritin, ESR, hsCRP, full lipid panel including ApoB and ApoA1, free testosterone and a full blood count to track progress.","supplementation":"Iron: ferrous bisglycinate, 25mg elemental iron daily, taken on an empty stomach in the morning with a vitamin C source such as orange juice, at least one hour away from tea, coffee or calcium. Why: ferritin at 18 is below optimal and is likely contributing to your fatigue and frequent illness. Recheck ferritin at three months and stop if it rises above 150.\n\nVitamin D3: cholecalciferol, 3,000 IU daily, taken with your largest meal that contains fat. At BMI 32.8, adipose tissue sequesters vitamin D, so a higher dose is needed to maintain your current level of 99. Take year-round. Why: maintaining vitamin D above 75 supports immune function, which is one of your primary goals.\n\nVitamin K2: MK-7 form, 100 to 200 mcg daily, taken alongside your vitamin D. Why: K2 directs calcium into bone rather than arteries and should always accompany vitamin D supplementation.\n\nOmega-3: algae-based EPA and DHA supplement providing 2g combined EPA and DHA daily, taken with food. Why: your HDL is 1.0 and your triglycerides are 1.26. Omega-3 raises HDL, lowers triglycerides, and reduces the inflammatory markers behind your ESR of 26 and hsCRP of 1.4. Algae-based is the appropriate vegan source.\n\nMagnesium: magnesium glycinate, 300mg before bed. Why: magnesium supports sleep quality, which you report as poor, and your magnesium at 0.9 is within range but could be higher for someone training four times per week.\n\nThe most important changes from this report are not supplements. They are rebuilding your iron stores through supplementation and dietary focus, gradually reducing your body fat to improve your HDL, inflammation and free testosterone, addressing the underlying cause of your frequent painkiller use, and investigating your sleep quality.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 84 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 88; capped below 85 while a system is rated \"Needs attention\"; final 84.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"26.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3487","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, so it measures the risk being built rather than the ten-year probability of an event. Beth's score of 40 sits at the upper boundary of the acceptable range and above the ideal of 20. The inputs driving the score are her low HDL, the marginally elevated LDL and ApoB, and the hsCRP of 1.4. At 33 her ten-year absolute cardiovascular risk is low, but the score reflects the risk being accumulated, and the gap between the two is the window for making changes.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6093","units":"mmol/L","description":"Blood glucose measures the amount of sugar circulating in the bloodstream after fasting. Beth's result of 4.5 is within the ideal range of 4.0 to 5.4, indicating excellent blood sugar regulation. At a BMI of 32.8 this is a reassuring finding, as excess body fat typically pushes fasting glucose upward. Her plant-based diet and regular training are likely contributing to this strong result.","low_causes":"Prolonged fasting, excessive exercise, reactive hypoglycaemia","high_causes":"Insulin resistance, prediabetes, high refined carbohydrate intake, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c percentage is an alternative way of expressing the same glycated haemoglobin result. Beth's 5.2% is well within the normal range of below 6.0% and below the pre-diabetes threshold. This confirms excellent blood sugar control over the preceding two to three months.","low_causes":"","high_causes":"Insulin resistance, prediabetes, diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it. Because red blood cells live for about three months, it gives an average blood sugar reading over that period. Beth's result of 33 is comfortably within the ideal range of below 36 and well below the pre-diabetes threshold of 42. This is an excellent result.","low_causes":"","high_causes":"Insulin resistance, prediabetes, diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"5.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4766","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.4056","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to release to keep blood sugar in check. Beth's result of 5.71 is within the ideal range of 2 to 8, meaning her pancreas is achieving excellent blood sugar control without working hard. At BMI 32.8, this level of insulin sensitivity function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){

  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';

      <span class="bc-tick tick-${col}"></span>

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
      if (lo == null && hi == null) return;
      n++; if (dist(b, useBase ? pv : cv) === 0) ok++;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 116); svg += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by the share of its markers in the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
