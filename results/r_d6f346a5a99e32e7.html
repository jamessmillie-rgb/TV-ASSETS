<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Jonathan Hetherington","dob":"28/07/1993","report_date":"2026-10-19","summary":"This is a 33-year-old male presenting with a BMI of 23.8, following a low-carb, high-protein diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains seven times per week, four cardio and three resistance sessions at hard intensity, with 7,500 to 10,000 daily steps. He sleeps eight or more hours a night but is slow to get going on waking, with steady energy through the day. Stress is rarely hard to manage. He does not drink alcohol, takes no medications and reports no diagnosed conditions. He has not had a previous blood test. His goals are to build muscle, improve mood and improve long-term health and longevity.\n\nThe headline from this report is excellent. His PhenoAge, a biological ageing estimate built from nine blood markers, comes back at 31 against a calendar age of 33, meaning his blood profile is that of someone roughly two years younger. His Cardiovascular Risk Score, a TrueVitals index scored from 0 to 100 and built from the main lipid, inflammatory and metabolic markers, is 5 out of 100, which is as low as it gets and reflects an almost negligible level of vascular risk being built. There is one finding that should be discussed with his GP, a raised bicarbonate, and a handful of results that sit below the ideal range and deserve attention, but the overall picture is of a healthy, well-trained man whose body is responding well to his lifestyle.\n\nStarting with the positives, and there are many. His lipid panel is outstanding. Total cholesterol is 4.0, LDL is 1.98, ApoB, the protein that carries atherogenic particles and the single best predictor of cardiovascular risk, is 0.58, well under the 0.8 optimal target and under the 0.9 desirable limit. HDL, the protective cholesterol, is 1.6, above the 1.4 optimal threshold for men. Triglycerides are 0.97, under 1.0 and in the ideal range. The ApoB to ApoA-I ratio, the best single-number summary of lipid-driven risk, is 0.39, well under 0.7. His Lp(a), lipoprotein(a), a genetically fixed particle that independently drives cardiovascular risk and cannot be changed by diet or exercise, is below 25, meaning it is not a factor and that his entire lipid profile is the product of modifiable, lifestyle-driven inputs. This is genuinely useful information because it means his already excellent lipids are not being offset by an inherited risk he cannot control.\n\nHis liver is in pristine health. ALT, the enzyme most specific to liver-cell stress, is 25, under the 30 optimal threshold for men. GGT, gamma-glutamyl transferase, which rises early in response to metabolic strain, alcohol or fatty infiltration, is 9, about as clean as that marker gets. AST is 25, bilirubin is 9, albumin is 43, and the De Ritis ratio, AST divided by ALT, is 1.0, right in the middle of the optimal band. The FIB-4 score, a fibrosis screening tool, is 0.77, well under 1.45, ruling out any significant liver scarring. The APRI, another fibrosis estimate, is 0.29, and the NAFLD Fibrosis Score is minus 2.84. All three confirm a liver with no metabolic load and no structural concern.\n\nHis thyroid is working well. TSH, thyroid stimulating hormone, is 1.91, sitting comfortably inside the 1.0 to 2.5 optimal range. Free T4, the storage form of thyroid hormone, is 18.3, inside the 14 to 20 optimal band. Free T3, the active hormone that cells actually use for energy and metabolism, is 5.7, which is in the 4.5 to 6.5 optimal range. The FT3 to FT4 ratio, which shows how efficiently the body converts T4 into active T3, is 0.31, right in the sweet spot. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which rules out autoimmune thyroid disease. This is a thyroid doing exactly what it should.\n\nInflammation is virtually absent. His hs-CRP, high-sensitivity C-reactive protein, the most widely used marker of systemic low-grade inflammation, is 0.2, well under the 1.0 optimal ceiling and a level that reflects minimal inflammatory burden across the whole body. ESR, erythrocyte sedimentation rate, another inflammation marker that picks up longer-term trends, is 12, right at the upper limit of its range but still within it and consistent with the CRP being so low. The Neutrophil-to-Lymphocyte Ratio is 2.1, within the optimal band, the Platelet-to-Lymphocyte Ratio is 131.5, and the Systemic Immune-Inflammation Index is 448, all within their respective ranges. His immune system is balanced: IgG, IgA, IgM and IgE are all within range, rheumatoid factor is undetectable, and tissue transglutaminase IgA, the coeliac screening antibody, is negative, ruling out coeliac disease.\n\nHis prostate markers are clear. PSA, prostate-specific antigen, is 0.46, well under the 2.5 threshold, and the free PSA ratio is 0.63, far above the 0.19 normal cut-off. Ca19-9 and CEA, two tumour markers covering gastrointestinal and colorectal screening, are both well within range. Pancreatic health looks excellent: amylase is 106 and lipase is 41, both comfortably within their ranges.\n\nHis kidney function is reassuring when read in context. The creatinine-based eGFR comes back at 78, and the Cystatin C eGFR at 85, with the combined estimate at 85. Creatinine, a waste product from muscle metabolism, is 107, marginally above the 104 upper lab limit, but creatinine is directly influenced by muscle mass and high-protein intake. In a man training seven times a week on a high-protein diet, a creatinine a few points above the standard range is expected and does not indicate kidney impairment. Cystatin C, which is not affected by muscle mass, is 1.0, within its range, and the Cystatin C eGFR of 85 is a more reliable measure for him. While 85 is below the 90 optimal threshold, it is well above 60 and at 33 with no hypertension, no diabetes and a CRP of 0.2, this is very likely the effect of the creatinine measurement rather than any kidney disease. Urea at 7.8 is within range, the urea-to-creatinine ratio is 72.9, and uric acid at 326 is well within the 200 to 380 optimal band. The urine is clean: no protein, no glucose, no casts, no nitrites, no bacterial growth, and the culture confirms no infection. Urine WBCs at 50 are above the 10 threshold, but with no nitrites, no bacteria, no symptoms and a clean culture, this is most likely sample contamination rather than a urinary tract infection. It does not need action unless he develops urinary symptoms.\n\nNow the findings that need attention. The most clinically significant is his bicarbonate at 35.5, which is above the upper limit of 31. Bicarbonate is the body's main acid-buffering molecule, and when it rises above range it suggests the blood is more alkaline than it should be, a state called metabolic alkalosis. In someone who does not take diuretics, does not vomit regularly and has no diagnosed conditions, the most common explanation at this level is dietary: a very low-carb, high-protein diet generates less metabolic acid than a mixed diet, and the kidneys, which constantly adjust acid-base balance, retain more bicarbonate to compensate. Heavy training can also shift bicarbonate through ventilation patterns and the way muscles handle lactate between sessions. His chloride at 100 is within range, which argues against a serious chloride-losing cause, and his sodium at 139 is normal. The anion gap, a calculation that helps classify acid-base disturbances, cannot be computed because potassium was not returned by the lab in this sample, so one piece of the puzzle is missing. At 35.5 with no symptoms and no medications, this is unlikely to reflect anything dangerous, but it is above range by a meaningful margin and should be mentioned to his GP, ideally with a repeat test on a morning fasting sample to confirm whether it is persistent.\n\nHis HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is 2.31, above the 1.5 upper limit and above the 1.9 threshold that the lab flags as early insulin resistance. HOMA-IR is calculated from fasting glucose and fasting insulin: it estimates how hard the pancreas is working to keep blood sugar controlled. His fasting glucose at 5.1 is within the normal range of 3.5 to 6.0 and just inside the 4.0 to 5.4 optimal band. His HbA1c, glycated haemoglobin, which reflects average blood sugar over the past two to three months, is 39 mmol/mol, under the 42 pre-diabetes threshold but above the 36 optimal ceiling. His fasting insulin at 10.18 is within the wide lab range of 2.6 to 24.9 but above the 2 to 8 optimal band. C-Peptide, a molecule released in equal amounts to insulin and a reliable measure of how much insulin the pancreas is actually producing, is 2.43 ug/L (about 804 pmol/L), within range. The TyG index, another insulin resistance estimate, is 8.28, within its range. Taken together, what this pattern says is that his pancreas is producing a little more insulin than ideal to keep his glucose controlled. At a BMI of 23.8 with no family history of type 2 diabetes recorded and no alcohol intake, the most likely driver is carbohydrate quality and timing rather than excess body fat. A low-carb diet with weekly processed food, even in small amounts, can produce uneven glucose spikes if the carbohydrate that is eaten is refined. His vegetable and fruit intake at 2 to 3 portions a day is adequate but not generous, and soluble fibre from vegetables, oats and legumes directly slows glucose absorption. This is not pre-diabetes and not a cause for alarm, but it is the one metabolic marker in the report that is moving in the wrong direction and the one that responds fastest to dietary fine-tuning.\n\nHis phosphate is 0.6, below the lower limit of 0.78. Phosphate is an essential mineral involved in energy production (it forms part of ATP, the molecule every cell uses for fuel), bone mineralisation and the buffering systems that maintain blood pH. Mild hypophosphataemia in an otherwise healthy young man is most commonly caused by intracellular shift: after intense exercise, carbohydrate refeeding or even a large meal before fasting blood is taken, phosphate moves from the blood into cells. His calcium is 2.43, corrected calcium is 2.41, both well within range, and PTH (parathyroid hormone, the hormone that regulates calcium and phosphate) is 2.1, also within range. This makes a parathyroid-driven cause very unlikely. His magnesium at 0.68 is within the lab range but below the 0.85 optimal threshold, which is worth noting because magnesium and phosphate share some of the same transport mechanisms. The low phosphate is most likely transient and related to his training load or the timing of his last meal relative to the blood draw, but if he experiences muscle weakness, cramps or unusual fatigue, it is worth repeating on a fasting morning sample.\n\nHis red blood cell count at 4.35 is marginally below the 4.5 lower limit, and his haematocrit, the percentage of blood volume occupied by red cells, at 0.394 is just below the 0.40 lower limit. His haemoglobin, however, is 136, within the male range of 130 to 170. His reticulocyte percentage is 1.02, within range, but the absolute reticulocyte count at 44.37 is just below the 50 lower limit. What this means is that his red cell mass is at the low end but each cell is well-filled with haemoglobin (MCH 31.2, MCV 90.6, MCHC 344, all within range). His iron stores are healthy: ferritin 97, transferrin saturation 28.3 percent, serum iron 16.9, all within their optimal or normal bands. His B12 at 368 is within the lab range but below the 500 optimal threshold, and his folate at 16 is within range. B12 and folate are both essential for red cell production, and a B12 sitting this far below the optimal level in someone with a marginally low red cell count and low absolute reticulocytes suggests that B12 is not quite where it needs to be to support maximal red cell output. The low-carb, high-protein diet without supplementation may not provide enough B12-rich foods, particularly if dairy and organ meats are limited. This is not anaemia, his haemoglobin is adequate, but optimising B12 with sublingual methylcobalamin is likely to nudge the red cell count upward over the next three to four months.\n\nHis testosterone at 15.7 is within the lab range of 8.4 to 28.7 and above the 12 recommended minimum, but it is below the 18 optimal threshold for a 33-year-old man. Free testosterone at 0.252, calculated from total testosterone and SHBG, is within the lab range of 0.13 to 1.04 but in the lower half, and bioavailable testosterone at 5.91 is within the 4 to 9 optimal band. His SHBG, sex hormone binding globulin, the protein that binds testosterone and reduces the amount available to tissues, is 48.6, within range but toward the upper end, which means a larger proportion of his total testosterone is bound and unavailable. LH and FSH, the pituitary hormones that drive testosterone production, are 4.5 and 3.45 respectively, both within range and not elevated, which means the brain is not sensing a shortfall and pushing harder. DHEA-S at 8.7 is healthy, oestradiol at 106 is within range, progesterone at 1.93 is within range, prolactin at 86 is within range, and cortisol at 225 is within the morning reference range. For a man whose goals include building muscle and improving mood, a testosterone in the lower third of the range is relevant. The most effective levers are sleep quality (he sleeps eight or more hours but wakes slowly, which suggests the sleep may not be as restorative as the duration implies), dietary fat intake (very low-carb diets that are also low in fat can suppress testosterone synthesis because cholesterol is the raw material for steroid hormones), and training recovery (seven hard sessions a week is a high volume, and if recovery is incomplete, cortisol rises and testosterone falls). His cortisol at 225 is not elevated, which is reassuring, but the testosterone-to-cortisol balance is still worth optimising.\n\nHis vitamin D at 94 is within the 75 to 120 optimal range, which is a strong result and suggests either good sun exposure or supplementation. His total antioxidant activity at 2.07 is above the 1.77 upper limit, which in the absence of high-dose antioxidant supplementation reflects a diet rich in polyphenols and colourful plant compounds, and is not a concern.\n\nHis creatine kinase at 392 is above the 320 upper limit. CK is an enzyme released from muscle cells when they are damaged or under heavy load. In a man doing three resistance sessions and four cardio sessions a week at hard intensity, a CK modestly above range is expected and reflects normal training-induced muscle turnover rather than pathology. If he had the blood drawn within 48 hours of a heavy session, this number is entirely predictable. It does not need investigation unless it rises significantly above 1,000 or is accompanied by dark urine or severe muscle pain.\n\nHis MCHC at 344 is one point below the 345 upper limit, which is within range and unremarkable. His ESR at 12 is right at the upper boundary of its range, but with a CRP of 0.2 there is no inflammatory process to explain it and it is not a concern.\n\nOne marker that was not returned by the lab is potassium. This means the anion gap cannot be calculated, and it also removes one lens on the bicarbonate result. It would be worth including potassium when the bicarbonate is repeated.","links":"The thread that runs through this report is a fit, lean, hard-training 33-year-old whose blood work is broadly excellent but whose metabolic and hormonal markers carry the fingerprints of his specific diet and training regimen.\n\nThe most important connection is between his low-carb, high-protein diet, his training load and the cluster of results that includes a HOMA-IR of 2.31, an HbA1c of 39, a fasting insulin of 10.18 and a bicarbonate of 35.5. A low-carb diet typically lowers fasting insulin and improves insulin sensitivity, so a HOMA-IR above 1.9 is unexpected. The most plausible explanation is that the carbohydrate he does eat, even if infrequent, is refined enough to trigger a disproportionate insulin response, and that his overall carbohydrate pattern creates enough glycaemic variability to keep baseline insulin higher than it should be. The raised bicarbonate fits this picture too: fewer dietary acids from reduced carbohydrate metabolism, combined with the respiratory alkalosis that can accompany heavy training, shifts the acid-base balance toward alkalinity. These are not separate problems but two expressions of the same dietary pattern.\n\nThe second thread connects his marginally low red cell count and haematocrit, his below-optimal B12, and his absolute reticulocyte count sitting just under the lower limit. None of these is dramatically abnormal, but they point in the same direction: red cell production is adequate but not optimal, and B12 is the most likely rate-limiting nutrient. His iron stores are healthy, his folate is good, his MCV is normal, so this is not iron-deficiency anaemia or a macrocytic picture. It is a subtle signal that one input to the red cell assembly line is running a little low.\n\nThe third connection is between his testosterone at 15.7, his SHBG at 48.6, his sleep quality and his training volume. Testosterone in the lower third of the range at 33 with goals of muscle building and mood improvement is clinically relevant. His SHBG is binding a meaningful proportion of his total testosterone, and seven hard sessions per week is a volume that, without meticulous recovery, can suppress the hypothalamic-pituitary-gonadal axis. The fact that his cortisol is not elevated is encouraging, but testosterone may respond to better recovery strategy and dietary fat optimisation before any further investigation is needed.\n\nWhat has been positively excluded is important: autoimmune thyroid disease (both antibodies undetectable), coeliac disease (TTG negative), liver disease (every liver marker pristine), significant cardiovascular risk (ApoB 0.58, Lp(a) below 25, CRP 0.2), prostate pathology (PSA 0.46), diabetes (glucose 5.1, HbA1c 39), and chronic kidney disease (Cystatin C eGFR 85 with no proteinuria). The loose ends are the bicarbonate requiring confirmation on a repeat sample, the phosphate requiring a repeat to determine whether it is transient, and potassium not being available to complete the acid-base picture.","lifestyle":"Add one extra portion of vegetables or fruit to every meal, starting with whichever meal currently has the least colour on the plate. Anchor: put the vegetables on the plate before the protein. Why: at 2 to 3 portions a day, fibre and micronutrient intake is below where it needs to be for a man training seven days a week, and more soluble fibre will directly help the fasting insulin of 10.18 and the HOMA-IR of 2.31 by slowing glucose absorption.\nWhen you do eat carbohydrate, make it whole and unprocessed: sweet potato, oats, brown rice, lentils or beans rather than bread, wraps or anything from a packet. Anchor: prep your carbohydrate sources at the start of the week so the easy option is already in the fridge. Why: the insulin resistance signal in this report is almost certainly driven by the quality of the carbohydrate rather than the quantity, and switching the source will lower the insulin response to each meal.\nEat at least two Brazil nuts a day and include one serving of shellfish, eggs or dairy daily. Anchor: keep Brazil nuts next to the kettle or on the kitchen counter. Why: these are the richest whole-food sources of selenium and B12, and your B12 at 368 is below the 500 optimal level that supports red cell production.\nTake one full rest day per week with no structured training, only a walk. Anchor: pick a fixed day and treat it as non-negotiable. Why: seven hard sessions a week with slow-to-get-going mornings suggests recovery is not matching your training load, and testosterone at 15.7 in the lower third of the range at 33 responds to recovery before it responds to anything else.\nInclude a source of healthy fat at every meal: olive oil, avocado, nuts, oily fish. Anchor: add fat to the plate at the same time as the vegetables. Why: very low fat intake can suppress testosterone production because cholesterol is the raw material for steroid hormones, and your testosterone and SHBG profile will benefit from adequate dietary fat.\nGet outside within 30 minutes of waking, even for five minutes, before caffeine. Anchor: shoes by the door, walk to the end of the street and back. Why: morning light exposure resets the circadian clock, improves cortisol rhythm and is one of the most evidence-based interventions for people who wake slowly despite sleeping long enough.\nAim for 4 to 5 portions of vegetables and fruit a day within the next two months. Why: your magnesium at 0.68 is below the 0.85 optimal level, your phosphate is below range at 0.6, and both minerals are abundant in green vegetables, nuts, seeds and legumes. Increasing plant intake addresses both directly.\nCalorie target: approximately 2,650 to 2,800 kcal per day to support training and lean mass gain without fat gain (based on an estimated TDEE of around 2,700 kcal at 72 kg, 174 cm, hard training seven days a week). Protein target: 115 to 130 grams per day (1.6 to 1.8 g per kg), spread across at least three meals. If muscle gain is the priority, aim for the upper end.","flags":"Bicarbonate 35.5, above the upper limit of 31. Metabolic alkalosis in a young man with no medications or vomiting history, most likely diet and training-driven but above range by a meaningful margin. Potassium was not returned, so anion gap cannot be calculated. Recommend repeat fasting sample with electrolytes including potassium to confirm.\nHOMA-IR 2.31, above the 1.5 upper limit and above the 1.9 early insulin resistance threshold. Fasting insulin 10.18 (above the 8 optimal ceiling), HbA1c 39 (above the 36 optimal ceiling but below 42), fasting glucose 5.1 (within optimal). Pattern suggests early physiological insulin resistance, likely driven by carbohydrate quality. Lifestyle modification and retest in four to six months.\nPhosphate 0.6, below the lower limit of 0.78. Calcium, corrected calcium and PTH all within range, making parathyroid cause unlikely. Most likely transient intracellular shift related to training or meal timing. Recommend repeat on fasting sample if persistent.\nRed blood cell count 4.35 (below 4.5), haematocrit 0.394 (below 0.40), absolute reticulocytes 44.37 (below 50). Haemoglobin 136, within range. Iron stores adequate. B12 at 368 below the 500 optimal threshold may be the rate-limiting factor. Not anaemia but suboptimal red cell mass.\nTestosterone 15.7, within lab range but below the 18 optimal threshold for a 33-year-old male. SHBG 48.6 upper-normal, free testosterone 0.252 lower half of range. LH and FSH not elevated. Likely training and recovery driven. Lifestyle optimisation and retest in six months.\nMagnesium 0.68, within the lab range of 0.53 to 1.11 but below the 0.85 optimal threshold. Relevant given training volume and the low phosphate.\nB12 at 368, within the lab range of 193 to 982 but below the 500 optimal threshold. Relevant as a possible contributor to the marginal red cell findings.\nCreatinine 107, marginally above the 104 upper lab limit. Cystatin C 1.0 within range, Cystatin C eGFR 85. The creatinine elevation is almost certainly driven by muscle mass and high-protein intake rather than renal impairment.\nCreatine kinase 392, above the 320 upper limit. Expected finding in a man training seven hard sessions per week. Not pathological unless significantly elevated with symptoms.\nUrine WBCs 50, above the 10 threshold. Nitrites negative, culture no growth, no symptoms. Most likely sample contamination. No action unless urinary symptoms develop.\nTotal antioxidant activity 2.07, above the 1.77 upper limit. Reflects dietary antioxidant intake. Not a clinical concern.\nReassuring negatives: Lp(a) below 25 (no inherited lipoprotein risk), both thyroid antibodies undetectable (no autoimmune thyroid disease), TTG negative (coeliac excluded), PSA 0.46 with free ratio 0.63 (prostate clear), CRP 0.2 (no systemic inflammation), liver panel pristine (GGT 9, ALT 25, FIB-4 0.77), no proteinuria or glycosuria, urine culture no growth.","recommendations":"Discuss the bicarbonate of 35.5 with your GP and request a repeat fasting electrolyte panel that includes potassium, chloride, bicarbonate and a venous blood gas if the GP considers it appropriate. Mention that you follow a low-carb, high-protein diet and train heavily, as this is the most likely explanation but it should be confirmed.\nMention the HOMA-IR of 2.31 and fasting insulin of 10.18 to your GP for recording. This does not require medication at present but should be tracked. The dietary changes in this report are the first-line intervention.\nAsk for phosphate to be included on your next routine blood test to confirm whether the 0.6 result is persistent or transient.\nRequest a repeat red cell count and reticulocyte count in four to six months after optimising B12 intake, to confirm the marginally low values are improving.\nIf testosterone-related symptoms persist (difficulty building muscle, low mood, slow recovery) after three months of the lifestyle changes in this report, request a morning testosterone, SHBG and LH retest between 7am and 10am for the most accurate reading.\nRetest the full panel in six months. Key markers to track: HOMA-IR, fasting insulin, HbA1c, bicarbonate, phosphate, red cell count, reticulocytes, B12, testosterone and magnesium. Calorie target 2,650 to 2,800 kcal per day; protein target 115 to 130 grams per day.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Why: B12 at 368 is below the 500 optimal threshold and is the most likely contributor to the marginally low red cell count and absolute reticulocytes. Sublingual delivery bypasses absorption variability in the gut.\nMagnesium glycinate: 400 mg before bed. Why: magnesium at 0.68 is below the 0.85 optimal level, and at seven hard training sessions a week magnesium is lost through sweat. Glycinate is the best-absorbed form and supports sleep quality, which is relevant given the slow-to-get-going mornings.\nVitamin D3: 2,000 IU daily with a meal containing fat, to maintain the current level of 94 through the winter months. Always take with vitamin K2 (MK-7), 100 mcg daily, which directs calcium into bone rather than soft tissue.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily with food. Why: omega-3 supports insulin sensitivity, which is relevant to the HOMA-IR of 2.31, and provides anti-inflammatory support for the high training volume.\nThe most important changes from this report are not supplements. They are improving carbohydrate quality to address the insulin resistance signal, increasing vegetable and fruit intake from 2 to 3 portions to 4 to 5, adding one full rest day per week, ensuring adequate dietary fat at every meal, and getting morning light exposure to improve waking quality.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 64 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 64.5. Weakest systems: cardiac markers 0%, electrolytes & minerals 25%, hematology 51%. Biggest drags: Bicarbonate, Creatinine, Haematocrit (HCT), Phosphate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4079","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a biological ageing estimate developed by Yale researchers, built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. It estimates the biological age of the body based on how these markers perform. His PhenoAge of 31 against a calendar age of 33 means his blood profile is that of someone approximately two years younger, which is a positive finding. The markers driving this favourable result include his very low CRP of 0.2, healthy albumin and normal white cell count. Note: RDW was assumed at 13 percent as Randox does not routinely report it, though his actual RDW of 13.7 percent was available and is very close to this assumption.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is scored from 0 to 100 and built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term and measures the risk being built rather than the ten-year probability of an event. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. His score of 5 is exceptionally low and reflects his outstanding lipid profile (ApoB 0.58, HDL 1.6, triglycerides 0.97), undetectable inflammation (CRP 0.2) and low Lp(a). The only input pulling the score upward slightly is HbA1c at 39.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2232","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most specific markers of liver-cell stress. His result of 25 is well within the lab range and under the 30 optimal threshold for men, confirming that his liver cells are healthy and under no metabolic strain.","low_causes":"","high_causes":"Liver disease, hepatitis, alcohol excess, fatty liver, medications, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, aspartate aminotransferase, is found in the liver, heart and muscles. It rises with liver damage but also with intense exercise. His result of 25 is comfortably within the optimal band and consistent with a healthy liver. Given his high training volume, a normal AST alongside a normal ALT is reassuring that neither the liver nor the muscles are under excessive strain.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart disease, muscle damage, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0616","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4299","units":"IU/l","description":"GGT, gamma-glutamyl transferase, is one of the earliest liver enzymes to rise in response to alcohol, fatty liver, metabolic strain or bile duct obstruction. His result of 9 is exceptionally low, confirming that his liver is under no metabolic or toxic load whatsoever. Combined with no alcohol intake, this is exactly what would be expected.","low_causes":"","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, metabolic syndrome, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3524","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","u osition":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result for the albumin level, because about half of calcium in the blood is bound to albumin. This gives a more accurate picture of available calcium. His corrected calcium of 2.41 is within the optimal range.","low_causes":"Vitamin D deficiency, parathyroid disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2299","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5862","units":"mmol/l","description":"Phosphate is an essential mineral that forms part of ATP, the energy currency of every cell, and is critical for bone mineralisation, DNA synthesis and acid-base buffering. His result of 0.6 is below the lower limit of 0.78. With calcium, corrected calcium and PTH (parathyroid hormone) all within their normal ranges, a parathyroid-driven cause is very unlikely. The most common explanation in a healthy, hard-training young man is intracellular shift: after intense exercise or carbohydrate refeeding, phosphate moves from the blood into cells to support energy production. This is most likely transient but should be confirmed on a repeat fasting sample.","low_causes":"Intracellular shift after exercise or refeeding, vitamin D excess, hyperparathyroidism, malabsorption, antacid use","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4195","lowe n":"0.3462","upper_optimal_position":"0.6282","units":"umol/l","description":"Creatinine is a waste product produced by muscle metabolism and cleared by the kidneys. Higher levels can indicate reduced kidney function, but creatinine is also influenced by muscle mass, protein intake and exercise. His result of 107 is marginally above the 104 upper lab limit. In a man training seven days a week on a high-protein diet, this is almost certainly a reflection of his muscle mass and dietary protein rather than kidney impairment. His Cystatin C, which is not affected by muscle mass, is within range, and the Cystatin C eGFR of 85 provides a more accurate picture of his kidney function.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, high muscle mass, high protein diet, dehydration, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.65","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate derived from creatinine estimates how well the kidneys are filtering waste. Above 90 is considered optimal, and above 60 is within the normal range. His creatinine-based eGFR of 78 is below the 90 optimal threshold, but this is influenced by his above-range creatinine, which is driven by muscle mass and high protein intake. The Cystatin C eGFR of 85 is a more reliable measure in his case.","low_causes":"Kidney disease, dehydration, medications","high_causes":"Low muscle mass, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1","within_normal":"TRUE","within_optimal":"TRUE", imal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps differentiate between pre-renal causes of elevated urea (such as dehydration or a high-protein diet) and intrinsic kidney disease. His ratio of 72.9 is within the optimal range, confirming that the mildly elevated urea is proportionate to his creatinine and consistent with high protein intake rather than kidney pathology.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"136","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3833","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue. His result of 136 is within the male lab range of 130 to 170 but below the 140 optimal threshold. While this is not anaemia, it sits at the lower end and is consistent with the marginally low red cell count and haematocrit. Optimising B12 intake is the most likely intervention to improve this over time.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bleeding","high_causes":"Dehydration, polycythaemia, living at altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5. // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
