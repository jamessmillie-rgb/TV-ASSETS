<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Alexandra Burns","dob":"03/09/1990","report_date":"2026-09-15","summary":"Alexandra is a 36-year-old female presenting with a BMI of 19.1, following a standard mixed diet rated 7 out of 10 for quality with a volume of 8 out of 10. She trains four times per week, split evenly between two cardio and two resistance sessions, with 7,500 to 10,000 daily steps. She takes no medications and reports no significant habits. She reports low energy and fatigue, low mood and anxiety, and skin breakouts. Her goals are to prevent disease, improve sleep quality, and reduce stress and anxiety. She has a 16-month-old baby and describes feeling constantly depleted, suspects blood sugar problems, and also suffers from headaches.\n\nThe single most important finding in this report is her prolactin level. Prolactin is the hormone that drives milk production, and at 1,147 uIU/ml it sits well above the non-pregnant upper limit of 619. If Alexandra is still breastfeeding, this is entirely expected and is the body doing exactly what it should. However, if she has fully stopped breastfeeding, a prolactin this elevated warrants a conversation with her GP, because persistent elevation outside of lactation can point to a small benign pituitary growth called a prolactinoma, or to other hormonal disruptions that would need investigation. Either way, elevated prolactin has downstream effects that are relevant to how she feels. It suppresses the hormonal signals that drive the menstrual cycle, it can contribute to fatigue and low mood, and it may be one reason she feels so depleted. Her GP should be aware of this result regardless of breastfeeding status, but the urgency depends on whether lactation is still ongoing.\n\nThere is a great deal to feel positive about in this report. Alexandra's cardiovascular and metabolic health is genuinely excellent. Her total cholesterol is 4.4, her LDL, which is the cholesterol fraction that drives arterial plaque, is 2.06, comfortably within the optimal range. Her HDL, the protective cholesterol that removes plaque from arteries, is outstanding at 2.1, well above the 1.6 optimal threshold for women. Her triglycerides are just 0.48, which is exceptionally low and reflects excellent insulin sensitivity and metabolic health. Her ApoB, which is a direct measure of the number of atherogenic particles circulating in the blood, is 0.59, below the 0.8 optimal target, and her ApoB to ApoA1 ratio is 0.35, firmly in the lower risk category. Her Lp(a), a genetically inherited lipid particle that independently drives cardiovascular risk and cannot be changed through lifestyle, is below 25 nmol/L. This is genuinely useful information because it confirms her cardiovascular risk profile is driven entirely by modifiable factors, all of which are already in excellent shape. This is a lipid panel that most people would aspire to.\n\nHer blood sugar control is reassuring and should ease the concern she raised about suspected blood sugar problems. Her fasting glucose is 4.6, right in the middle of the optimal range. Her HbA1c, which reflects average blood sugar over the preceding two to three months, is 37 mmol/mol, just inside the optimal threshold of 36. Her fasting insulin is 4.05, within the optimal band of 2 to 8, and her HOMA-IR, which is a calculated measure of insulin resistance, is 0.83, indicating she is insulin-sensitive. This is an excellent metabolic profile. Her headaches are unlikely to be driven by blood sugar instability, and the more likely explanations are the sleep disruption, stress, and hormonal shifts that come with early motherhood.\n\nHer liver is in excellent health. ALT at 13 and Gamma GT at 14 are both well within optimal ranges, meaning the liver is under no metabolic strain. Her FIB-4 score, which screens for liver fibrosis, is 0.83, comfortably below the threshold. Her kidney function is strong, with a Cystatin C-derived eGFR of 102, exactly where it should be at 36. Her thyroid is working well, with a TSH of 1.7 sitting neatly in the optimal band of 1.0 to 2.5, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. Her inflammation markers are reassuring, with an ESR of 8 and a hs-CRP of 1.3. The CRP is above the optimal threshold of 1.0 but well within the laboratory range, and at this level it may simply reflect the physiological demands of caring for a young child, mild sleep deprivation, or normal hormonal fluctuation rather than any inflammatory condition. Her immune markers, including IgG, IgA, IgM, and IgE, are all within range, and her coeliac screen is negative. Both tumour markers, CA-125 and CA 15-3, are well within range, and her total antioxidant activity is healthy.\n\nTurning to the areas that need attention, the pattern that stands out alongside the prolactin is a picture of mild depletion, which fits exactly with how Alexandra describes feeling. Her red blood cell count is 3.77, fractionally below the lower limit of 3.8. Her absolute reticulocyte count, which measures how many new red blood cells the bone marrow is producing, is 30.5, below the lower limit of 50. Her MCH, which is the average amount of haemoglobin packed into each red cell, is 32.6, marginally above the upper limit of 32. Taken together, this pattern suggests the bone marrow is producing fewer red blood cells than ideal but is compensating by loading each one with slightly more haemoglobin. Her haemoglobin itself is 123, just inside the normal range, so she is not anaemic, but she is running close to the threshold. This mild suppression of red cell production is consistent with the demands of pregnancy, birth, and breastfeeding, which draw heavily on the body's reserves. Her ferritin is 50, which is technically within range but sits right at the lower edge of the optimal band for women of 40 to 150. Her iron and transferrin saturation are both healthy, so iron stores are adequate but not abundant. The combination of borderline ferritin, low reticulocyte production, and her reported fatigue suggests her body could benefit from building those iron stores a little higher.\n\nHer C-Peptide, which measures how much insulin the pancreas is producing, came back at 0.963 ug/L, which converts to approximately 319 pmol/L, below the laboratory lower limit. However, in the context of a fasting glucose of 4.6, an HbA1c of 37, and a HOMA-IR of 0.83, this simply reflects that her pancreas does not need to produce much insulin because her cells are highly responsive to it. This is a sign of metabolic efficiency, not pancreatic insufficiency.\n\nHer vitamin D is 62 nmol/L, which is classified as sufficient but falls below the optimal range of 75 to 120. At her low BMI, a modest increase in supplementation should bring this into the optimal zone relatively quickly. Vitamin D plays a role in mood regulation, immune function, and energy, so optimising it may help with her reported low mood and fatigue. Her vitamin B12 is 297 pg/ml, which is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism, and suboptimal levels can contribute to fatigue, low mood, and brain fog, all of which she is experiencing. This is worth addressing with supplementation.\n\nHer Free T3, the active thyroid hormone that drives metabolism at the cellular level, is 3.9 pmol/L. While this is within the laboratory range of 2.6 to 7.1, it sits below the optimal band of 4.5 to 6.5. With a TSH of 1.7 and a Free T4 of 15.9, the thyroid gland itself appears to be functioning normally, but conversion of T4 into the active T3 form may not be optimal. Suboptimal T3 can contribute to fatigue, difficulty losing weight, feeling cold, and low mood. Adequate selenium, zinc, and iron are all required for efficient T4 to T3 conversion, so addressing her borderline nutrient stores may help improve this.\n\nHer hormonal picture is consistent with the luteal phase of her menstrual cycle, with an oestradiol of 447 pmol/L and a progesterone of 13.04 nmol/L both sitting within the luteal reference ranges. Her FSH of 4.21 and LH of 13.69 are consistent with normal cycling and show no sign of premature ovarian changes. Her testosterone is 0.8 nmol/L and her free testosterone is 0.01 nmol/L, both at the lower end of their respective ranges. While not technically below range, these levels are low enough to potentially contribute to reduced energy and drive. Her DHEA-S, which converts to approximately 1,106 ug/dL at 3 umol/L, is within range. Her cortisol at 513 nmol/L is within the morning reference range of 145 to 619 and is not abnormally elevated, though it sits in the upper half, which is consistent with the chronic stress and sleep disruption she describes.\n\nHer ALP, alkaline phosphatase, is 45, one point below the lower limit of 46. This is a marginal finding and is not clinically significant. ALP can be mildly suppressed by low zinc status, hypothyroidism, or simply by being at the lower end of normal variation. Her urine shows a trace of protein, which at this level is most likely related to hydration status or minor physiological variation and is not a concern given her excellent kidney function markers. Her bacterial culture and sensitivities are pending and will be reviewed when available.\n\nIn summary, Alexandra's blood work tells a clear story. She has an excellent cardiovascular and metabolic profile, a healthy liver, strong kidney function, and a normally functioning thyroid gland. The areas that need attention are her elevated prolactin, which needs a GP conversation to determine whether it is explained by ongoing breastfeeding, her suboptimal vitamin D and B12, her borderline iron stores and mildly suppressed red cell production, and her below-optimal Free T3 conversion. These findings, taken together, offer a very plausible explanation for her fatigue, low mood, and feeling of depletion. The good news is that every one of these findings is addressable.","links":"Alexandra's calorie needs, based on her weight of 52 kg, height of 165 cm, age of 36, and moderate activity level, sit at approximately 1,900 to 2,050 calories per day for maintenance. At a BMI of 19.1, she does not need to lose weight, and if anything, ensuring she is eating enough is more important than restricting. With a 16-month-old and training four times per week, she should aim for at least 1,900 calories daily, and ideally closer to 2,000. Her protein target should be 1.3 to 1.6 grams per kilogram of body weight, which translates to 68 to 83 grams of protein per day. Given her borderline red cell production and low-end ferritin, she should prioritise iron-rich protein sources such as red meat two to three times per week, alongside poultry, fish, eggs, and legumes.\n\nFor her GP, Alexandra should bring the following findings. First and most importantly, her prolactin level of 1,147 uIU/ml, which is above the non-pregnant upper limit of 619. The GP will want to know whether she is still breastfeeding, and if not, may consider a pituitary MRI to exclude a prolactinoma. Second, her red blood cell count of 3.77, absolute reticulocytes of 30.5, and ferritin of 50 should be noted as a mild depletion pattern consistent with the postnatal period. Third, her Free T3 of 3.9 is below optimal and the GP may wish to monitor this alongside her nutrient repletion.\n\nHer vitamin D at 62 needs to be brought into the optimal range of 75 to 120 nmol/L. She should supplement with 3,000 IU of vitamin D3 daily, taken with her largest meal to maximise absorption with dietary fat, paired with 100 to 200 mcg of vitamin K2 in the MK-7 form, which directs calcium into bones rather than arteries. Her B12 at 297 is below the optimal threshold of 500 and should be addressed with 1,000 mcg of sublingual methylcobalamin daily, placed under the tongue for direct absorption, which bypasses any gut absorption variability.\n\nFor her fatigue and low mood, optimising vitamin D, B12, and iron stores is likely to make a tangible difference over the coming eight to twelve weeks. Her Free T3 may also improve as these nutrient stores are replenished, since selenium, zinc, and adequate iron all support the conversion of T4 into active T3. Including two to three Brazil nuts daily would provide a natural source of selenium to support this conversion.\n\nFor her sleep quality goal, the foundations matter more than supplements. A fixed wake time, even on weekends, is the single most effective anchor for the circadian rhythm. Getting outside within the first hour of waking, even on overcast days, helps set the body's internal clock. Caffeine should be cut off by early afternoon, ideally before 1pm, as its half-life means it is still active at bedtime even when it does not feel that way. Keeping the bedroom cool, ideally around 18 degrees, supports the core temperature drop that initiates sleep. With a 16-month-old, sleep disruption may be unavoidable, but protecting these anchors will help maximise the quality of whatever sleep she does get.\n\nFor her stress and anxiety goal, her cortisol is in the upper half of the morning range, which is physiologically appropriate for a new mother managing broken sleep and the demands of a young child. Magnesium glycinate at 300 mg before bed may help with both sleep quality and the feeling of being wired, as magnesium supports GABA activity in the brain, the neurotransmitter responsible for calming the nervous system. Her current magnesium level of 0.94 is within the optimal range, but supplementation at this dose is safe and may provide additional benefit during this demanding period.\n\nFor her skin breakouts, these are most likely hormonally driven, particularly given the postnatal hormonal recalibration her body is undergoing. Ensuring adequate zinc intake, maintaining good hydration, and optimising her vitamin D and B12 may all contribute to improvement. If breakouts persist as her hormonal picture stabilises, this would be worth discussing with her GP.\n\nA retest in four to five months, around February 2027, would be ideal to confirm that her vitamin D and B12 have responded to supplementation, that her reticulocyte count and red blood cell count have improved, and to recheck her prolactin level, particularly if breastfeeding has ceased by then. The retest should include a full blood count, reticulocytes, ferritin, vitamin D, B12, Free T3, and prolactin at minimum.","flags":"PROLACTIN: 1,147 uIU/ml, above the non-pregnant upper limit of 619. If the patient is still breastfeeding, this is physiological. If breastfeeding has ceased, investigation for hyperprolactinaemia is warranted, including consideration of pituitary imaging. Elevated prolactin may be contributing to reported fatigue and low mood.\n\nRED CELL PRODUCTION: RBC 3.77 (below 3.8), absolute reticulocytes 30.5 (below 50), MCH 32.6 (above 32). Mild suppression of erythropoiesis with compensatory haemoglobin loading. Haemoglobin 123, not anaemic but borderline. Ferritin 50, adequate but at the lower edge of optimal for a postnatal woman. Pattern consistent with postnatal depletion.\n\nC-PEPTIDE: 0.963 ug/L (319 pmol/L), below the laboratory lower limit of 1.1 ug/L. Clinically insignificant in the context of fasting glucose 4.6, HbA1c 37, insulin 4.05, and HOMA-IR 0.83. Reflects low insulin demand from high insulin sensitivity, not pancreatic insufficiency.\n\nFREE T3: 3.9 pmol/L, within the laboratory range of 2.6 to 7.1 but below the optimal band of 4.5 to 6.5. TSH 1.7 and FT4 15.9 are both within optimal ranges and thyroid antibodies are negative. Suggests suboptimal T4 to T3 conversion, potentially related to nutrient status.\n\nVITAMIN D: 62 nmol/L, sufficient but below the optimal range of 75 to 120. Supplementation recommended.\n\nVITAMIN B12: 297 pg/ml, within the laboratory range but below the optimal threshold of 500. Supplementation recommended.\n\nALP: 45 IU/L, one point below the lower limit of 46. Marginal and not clinically significant.\n\nhs-CRP: 1.3 mg/L, within the laboratory range but above the optimal threshold of 1.0. Likely physiological in the context of postnatal demands and sleep disruption rather than pathological inflammation.\n\nURINE PROTEIN: Trace. Not significant given excellent kidney function (Cystatin C eGFR 102, creatinine eGFR >90).\n\nURINE CULTURE: Pending.\n\nReassuring negatives: Excellent lipid profile with LDL 2.06, HDL 2.1, ApoB 0.59, TG 0.48, and Lp(a) below 25. No insulin resistance (HOMA-IR 0.83). Clean liver function (ALT 13, GGT 14, FIB-4 0.83). No thyroid autoimmunity (TPO <6.6, thyroglobulin <1.3). Normal kidney function. Negative coeliac screen. CA-125, CA 15-3, CEA, and CA 19-9 all within range. Normal immunoglobulins. ESR 8.","recommendations":"1. Discuss prolactin level of 1,147 with GP, clarifying breastfeeding status. If breastfeeding has stopped, request further investigation including consideration of pituitary imaging.\n\n2. Begin vitamin D3 supplementation at 3,000 IU daily with the largest meal, paired with vitamin K2 (MK-7) at 100 to 200 mcg daily.\n\n3. Begin sublingual methylcobalamin (B12) at 1,000 mcg daily to bring B12 from 297 into the optimal range above 500.\n\n4. Include iron-rich foods such as red meat two to three times per week, alongside vitamin C-rich foods at the same meal to support absorption, to build ferritin stores above 50 and support red blood cell production.\n\n5. Consider magnesium glycinate 300 mg before bed to support sleep quality and stress management.\n\n6. Include two to three Brazil nuts daily for natural selenium to support T4 to T3 thyroid hormone conversion.\n\n7. Ensure daily calorie intake reaches at least 1,900 to 2,000 calories with a minimum of 68 to 83 grams of protein.\n\n8. Anchor sleep with a fixed wake time, morning daylight exposure within the first hour, caffeine cut-off before 1pm, and a cool bedroom around 18 degrees.\n\n9. Retest in four to five months (February 2027) including full blood count, reticulocytes, ferritin, vitamin D, B12, Free T3, and prolactin.","supplementation":"Vitamin D3 in the cholecalciferol form at 3,000 IU daily, taken with her largest meal to ensure absorption with dietary fat. Her current level of 62 nmol/L is sufficient but below the optimal range of 75 to 120, and at her lean body composition this dose should bring her into the optimal zone within three to four months. Vitamin D supports mood regulation, immune function, and bone health, all of which are important for a postnatal woman.\n\nVitamin K2 in the MK-7 form at 100 to 200 mcg daily, taken alongside vitamin D. K2 directs calcium into bones and teeth rather than soft tissues and arteries, and should always accompany vitamin D supplementation.\n\nSublingual methylcobalamin (vitamin B12) at 1,000 mcg daily, placed under the tongue and allowed to dissolve for direct absorption into the bloodstream. Her B12 at 297 is below the optimal threshold of 500, and suboptimal B12 contributes to fatigue, low mood, and impaired red blood cell production, all of which she is experiencing. The sublingual form bypasses gut absorption, which can be variable.\n\nMagnesium glycinate at 300 mg before bed. Her serum magnesium at 0.94 is within the optimal range, but the glycinate form supports GABA activity in the brain, promoting relaxation and sleep onset. Given her goals of improving sleep quality and reducing stress and anxiety, this is well suited to her needs. The glycinate form is also the least likely to cause digestive discomfort.\n\nTwo to three Brazil nuts daily as a natural source of selenium. Selenium is a cofactor for the deiodinase enzymes that convert T4 into the active thyroid hormone T3. Her Free T3 at 3.9 is below the optimal range, and supporting this conversion pathway through adequate selenium, alongside iron and zinc from her diet, may help improve her energy levels.\n\nShe does not need an iron supplement at this stage. Her ferritin at 50 is at the lower edge of optimal but her transferrin saturation is healthy at 37%, and her dietary iron intake from red meat two to three times per week should be sufficient to build stores gradually. If her ferritin has not improved at retest, a low-dose iron supplement such as ferrous bisglycinate at 25 mg every other day with vitamin C could be considered.\n\nThe most important changes from this report are not supplements. They are ensuring she eats enough calories and protein to support her body through this demanding period, discussing her prolactin level with her GP, protecting her sleep anchors as much as a 16-month-old allows, and building her nutrient stores through consistent, adequate nutrition. The supplements support these foundations but do not replace them.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5333","upper_optimal_position":"0.7600","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. At 4.6 mmol/L, Alexandra's fasting glucose sits comfortably in the optimal range of 4.0 to 5.4. This is reassuring given her concern about blood sugar problems. The body is maintaining tight glucose control, and there is no sign of impaired fasting glucose or insulin resistance. Glucose regulation is one of the foundations of metabolic health, and hers is working well.","low_causes":"Excessive fasting, very low carbohydrate intake, adrenal insufficiency, reactive hypoglycaemia","high_causes":"Insulin resistance, prediabetes, type 2 diabetes, stress response, high refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c reflects average blood sugar control over the preceding two to three months by measuring the percentage of haemoglobin that has become glycated, meaning coated with sugar. At 5.6%, Alexandra is within the normal range of below 6.0% and well below the pre-diabetic threshold of 6.0 to 6.4%. This confirms stable, healthy blood sugar regulation over the medium term.","low_causes":"Very low carbohydrate intake, anaemia with rapid red cell turnover","high_causes":"Prediabetes, type 2 diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4405","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. At 37 mmol/mol, Alexandra is within the normal range of below 42 and marginally above the optimal threshold of 36. This is a very minor deviation from optimal and is entirely consistent with healthy glucose metabolism. It does not suggest any blood sugar problem.","low_causes":"Very low carbohydrate intake, anaemia with rapid red cell turnover","high_causes":"Prediabetes, type 2 diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3556","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5757","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to release to keep blood sugar in check. Lower levels in the context of normal blood sugar indicate that the cells are highly responsive to insulin, requiring only small amounts to do the job. At 4.05 mIU/L, Alexandra's insulin is within the optimal range of 2 to 8, reflecting excellent insulin sensitivity. This is one of the strongest indicators of metabolic health.","low_causes":"High insulin sensitivity, low carbohydrate diet, very lean body composition","high_causes":"Insulin resistance, prediabetes, excess refined carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.963","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2355","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"4.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"ug/L","description":"C-Peptide is released in equal amounts to insulin and provides a stable measure of how much insulin the pancreas is producing. At 0.963 ug/L, which converts to approximately 319 pmol/L, this is below the laboratory lower limit of 1.1. However, in the context of Alexandra's normal fasting glucose of 4.6, HbA1c of 37, and HOMA-IR of 0.83, this simply reflects that her pancreas does not need to produce much insulin because her cells respond to it so efficiently. This is a sign of metabolic efficiency rather than pancreatic insufficiency.","low_causes":"High insulin sensitivity with low insulin demand, low carbohydrate intake, very lean body composition","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6100","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated score that estimates insulin resistance using fasting glucose and fasting insulin. A score below 1.0 indicates insulin sensitivity, which is optimal. At 0.83, Alexandra is insulin-sensitive, meaning her body manages blood sugar efficiently with minimal insulin output. This confirms that her suspected blood sugar problems are not supported by the laboratory evidence.","low_causes":"High insulin sensitivity, lean body composition","high_causes":"Insulin resistance, prediabetes, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"73.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2389","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates pancreatic beta-cell function, indicating how hard the pancreas is working to produce insulin. At 73.6, this is marginally below the reference range of 80 to 200. However, just like the low C-Peptide, this reflects the fact that Alexandra's cells are so insulin-sensitive that the pancreas does not need to work hard. In the context of normal glucose, normal HbA1c, and a healthy HOMA-IR, a low HOMA-B is not a concern and actually reflects metabolic efficiency.","low_causes":"High insulin sensitivity with low insulin demand, lean body composition, low carbohydrate intake","high_causes":"Insulin resistance causing the pancreas to overcompensate, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5733","upper_optimal_position":"0.6533","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 70 g/L, this is within the optimal range and reflects healthy liver synthetic function and adequate protein nutrition.","low_causes":"Malnutrition, liver disease, kidney disease with protein loss","high_causes":"Chronic inflammation, dehydration, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and minerals, and maintains fluid balance. At 41 g/L, Alexandra's albumin is within the optimal range, confirming healthy liver function and adequate protein intake.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration", n":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and digestive system. At 45, Alexandra is one point below the lower limit of 46. This is a marginal finding and is not clinically significant. Mildly low ALP can be seen with low zinc status, hypothyroidism, or simply normal variation. Her liver enzymes are otherwise excellent, so this does not suggest liver or bone disease.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, normal variation","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. At 12 umol/L, Alexandra's bilirubin is within the optimal range, confirming healthy liver processing and normal red blood cell turnover.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1161","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. At 13 IU/L, this is well within the female optimal range of below 25, indicating the liver is under no strain at all. This is an excellent result.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, alcohol-related liver damage, viral hepatitis, medication effects","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5313","units":"IU/L","description":"AST is another enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. At 19 IU/L, well within the optimal range, this confirms healthy liver and muscle tissue.","low_causes":"Not clinically significant","high_causes":"Liver disease, muscle damage, heart damage, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2862","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that screens for liver fibrosis using age, ALT, AST, and platelet count. At 0.83, this is well below the threshold of 1.3, indicating no evidence of liver fibrosis. This is an excellent result.","low_causes":"Not clinically significant, indicates healthy liver","high_causes":"Liver fibrosis, cirrhosis, age-related calculation artefact","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma G ise","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5439","upper_optimal_position":"0.6228","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. At 2.44 mmol/L, within the optimal range, Alexandra's calcium is well regulated.","low_causes":"Vitamin D deficiency, parathyroid dysfunction, malabsorption","high_causes":"Hyperparathyroidism, excessive vitamin D supplementation, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium measurement for albumin levels, giving a more accurate picture of true calcium status. At 2.47 mmol/L, within the optimal range, this confirms healthy calcium regulation.","low_causes":"Vitamin D deficiency, parathyroid dysfunction, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5690","lower_normal":"0.53","upper_ e, breastfeeding, stress, oral contraceptives, ageing","high_causes":"PCOS, adrenal hyperplasia, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index","group":"HORMONES","result":"1.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4489","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active, calculated from total testosterone and SHBG. At 1.38, this is within the optimal range and suggests a healthy balance between testosterone production and binding.","low_causes":"Low testosterone, high SHBG, oral contraceptives","high_causes":"PCOS, low SHBG, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-Sulphate","group":"HORMONES","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4263","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3948","upper_optimal_position":"0.5843","units":"umol/L","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. At 3 umol/L (approximately 1,106 ug/dL), this is within the optimal range and reflects healthy adrenal function.","low_causes":"Adrenal insufficiency, chronic stress, ageing","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"1147","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9266","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"619","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"uIU/ml","description":"Prolactin is the hormone that drives milk production. At 1,147 uIU/ml, this is above the non-pregnant upper limit of 619. If Alexandra is still breastfeeding, this level is entirely expected and physiological, as prolactin naturally rises to support lactation. If she has stopped breastfeeding, a persistently elevated prolactin warrants investigation by her GP. Causes of non-lactational hyperprolactinaemia include a prolactinoma, which is a small, almost always benign growth on the pituitary gland, certain medications, and thyroid dysfunction. Elevated prolactin can suppress menstrual cycle hormones and contribute to fatigue, low mood, and reduced libido. Alexandra should discuss this result with her GP regardless of breastfeeding status.","low_causes":"Not clinically significant","high_causes":"Breastfeeding, prolactinoma, certain medications (antipsychotics, anti-emetics), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"57.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4183","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4363","upper_optimal_position":"0.5820","units":"nmol/L","description":"SHBG is a protein that binds sex hormones, including testosterone and oestrogen, regulating how much is available for the body to use. At 57.8 nmol/L, within the optimal range, this is a healthy level that allows an appropriate proportion of sex hormones to remain biologically active.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism","high_causes":"Oral contraceptives, hyperthyroidism, liver disease, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"nmol/L","description":"Free testosterone measures the portion of testosterone not bound to proteins, making it biologically active. At 0.01 nmol/L, this sits at the very bottom of the laboratory range and below the optimal band. This is consistent with her low-end total testosterone and reflects the postnatal hormonal state. Low free testosterone may contribute to fatigue, reduced energy, and difficulty building or maintaining muscle. This should improve as the postnatal period resolves.","low_causes":"Postnatal state, breastfeeding, high SHBG, oral contraceptives","high_causes":"PCOS, low SHBG, adrenal excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5595","upper_optimal_position":"0.5952","units":"pmol/L","description":"Free T4 is the inactive thyroid hormone that circulates in the blood and is converted into active T3 in the tissues. At 15.9 pmol/L, within the optimal range of 14 to 20, the thyroid gland is producing an adequate supply of raw material. This is a healthy result.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4205","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4394","upper_optimal_position":"0.5568","units":"mIU/L","description":"TSH is the hormone produced by the pituitary gland that tells the thyroid how much thyroid hormone to produce. It acts as a thermostat for the thyroid. At 1.7 mIU/L, neatly within the optimal range of 1.0 to 2.5, the pituitary is not having to push the thyroid hard, which means the thyroid is responding normally to gentle signals. This is an excellent result.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, thyroid underactivity, iodine deficiency, Hashimoto's thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4296","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5556","upper_optimal_position":"0.6000","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism at the cellular level, influencing energy production, body temperature, heart rate, and mood. At 3.9 pmol/L, this is within the laboratory range of 2.6 to 7.1 but below the optimal band of 4.5 to 6.5. With TSH and FT4 both in the optimal range, the thyroid gland itself is functioning well, but conversion of inactive T4 into active T3 may not be optimal. This conversion depends on adequate selenium, zinc, and iron, all of which may be borderline in a postnatal woman. Suboptimal T3 can contribute to fatigue, feeling cold, low mood, and difficulty losing weight. Addressing nutrient stores may support improved conversion.","low_causes":"Non-thyroidal illness, calorie restriction, low selenium or zinc, chronic stress, postnatal state","high_causes":"Hyperthyroidism, excessive T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced when the immune system attacks the thyroid gland, as seen in autoimmune thyroid disease such as Hashimoto's thyroiditis. At below 6.6 U/ml, well within the normal range of below 13.8, there is no sign of autoimmune thyroid attack. This is reassuring.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. At below 1.3 U/ml, well within the normal range, this confirms no autoimmune thyroid activity. Combined with the negative TPO antibodies, autoimmune thyroid disease is effectively ruled out.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4133","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation, and muscle function. It is produced in the skin when exposed to sunlight and is difficult to obtain in sufficient quantities from food alone, particularly in the UK. At 62 nmol/L, Alexandra is above the sufficiency threshold of 50 but below the optimal range of 75 to 120. Given her reported low mood and fatigue, optimising vitamin D may provide tangible benefit. At her lean BMI, a dose of 3,000 IU of vitamin D3 daily with food should bring her into the optimal range within three to four months.","low_causes":"Limited sun exposure, UK latitude, winter months, dark skin, obesity, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Intact Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3520","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5720","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood. It rises when calcium is low and falls when calcium is adequate. At 1.05 pmol/L, within the optimal range, this indicates healthy calcium regulation. Combined with her normal corrected calcium, her parathyroid function is working well.","low_causes":"Hypoparathyroidism, magnesium deficiency, high calcium levels","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"297","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3775","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.7225","upper_optimal_position":"0.7731","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. At 297 pg/ml, Alexandra is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Suboptimal B12 can contribute to fatigue, low mood, brain fog, and impaired red blood cell production, all of which she is experiencing. B12 stores can become depleted during pregnancy and breastfeeding. Sublingual methylcobalamin at 1,000 mcg daily is recommended to bring this into the optimal range.","low_causes":"Inadequate dietary intake, malabsorption, pernicious anaemia, pregnancy and breastfeeding depletion","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6905","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate is a B vitamin essential for DNA synthesis, red blood cell production, and neural development. At 14 ng/ml, within the optimal range of above 8, Alexandra's folate status is healthy. This rules out folate deficiency as a contributor to her borderline red cell production.","low_causes":"Poor dietary intake, malabsorption, pregnancy, certain medications","high_causes":"Supplementation, high dietary intake of leafy greens and fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme found in muscles that rises when muscle tissue is damaged, either from exercise or injury. At 62 U/L, well within the optimal range, this confirms there is no excessive muscle breakdown. This is a normal result for someone training two resistance sessions per week.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6240","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.7580","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals and oxidative stress. At 1.71 mmol/L, near the top of the reference range, this reflects a strong antioxidant defence system, likely supported by Alexandra's diet quality rated 7 out of 10.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"Good dietary antioxidant intake, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer, but also rises in many benign conditions including endometriosis, menstruation, and pregnancy. At 3.5 U/ml, well within the normal range of below 35, this is a reassuring result.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, menstruation, pregnancy, pelvic inflammatory disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"7.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1293","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 15-3 is a tumour marker most commonly associated with breast cancer monitoring. At 7.76 U/ml, well within the normal range of below 30, this is a reassuring result.","low_causes":"Not clinically significant","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"2.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0296","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","l utoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. At 1 g/L, within the reference range, this confirms a healthy initial immune response capability.","low_causes":"Immune deficiency, chronic disease","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5806","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgA is the antibody found in mucosal surfaces including the gut, airways, and saliva, forming the first line of immune defence. At 2.7 g/L, within the reference range, this reflects healthy mucosal immunity. An adequate IgA level is also required for the coeliac screen (tTG IgA) to be valid, and hers is well within range.","low_causes":"Selective IgA deficiency, immune suppression","high_causes":"IgA nephropathy, chronic infection, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"8.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0409","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_norma 7.19, makes coeliac disease very unlikely as a cause of her symptoms, provided she has been eating a gluten-containing diet, which her standard mixed diet confirms.","low_causes":"Not clinically significant","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urine_ph","name":"Urine pH","group":"URINALYSIS","result":"6.5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity or alkalinity of the urine. A pH of 6.5 is mildly acidic and within the normal range of 4.5 to 8.0. This is a normal result influenced by diet and hydration.","low_causes":"High protein diet, dehydration, metabolic acidosis","high_causes":"Vegetarian diet, urinary tract infection, metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_protein","name":"Urine Protein","group":"URINALYSIS","result":"Trace","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/L","description":"Urine protein measures whether the kidneys are leaking protein into the urine. A trace amount is common and is usually related to hydration status, exercise, or normal physiological variation. Given Alexandra's excellent kidney function markers, including a Cystatin C eGFR of 102, this trace protein is not a concern.","low_causes":"Normal kidney function","high_causes":"Kidney disease, dehydration, intense exercise, fever, urinary tract infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_ketones","name":"Urine Ketones","group":"URINALYSIS","result":"Negat bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}
