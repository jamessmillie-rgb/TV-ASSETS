<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Chantell Masseratte","dob":"04/09/1977","report_date":"2026-09-26","summary":"Chantell is a 49-year-old female presenting with a BMI of 34.3, following a low-carb, high-protein diet rated 5 out of 10 for quality with a volume of 5 out of 10. She does not do any dedicated cardio but trains with resistance three times per week and walks 10,000 to 15,000 steps daily. She reports frequent painkiller use, specifically ibuprofen or paracetamol. She reports joint pain and stiffness as her primary symptom. Her goals are to lose body fat, build muscle and balance hormones. She is currently waiting for a cholecystectomy, which is the surgical removal of the gallbladder.\n\nThe most important finding in this report is Chantell's Lp(a), and it needs to go onto her permanent medical record and be discussed with her GP at the earliest opportunity. Her Lp(a) is 208, which places her in the high-risk category. Lipoprotein(a) is a genetically determined particle that behaves like LDL cholesterol but is stickier, more inflammatory and promotes blood clotting. Unlike every other lipid marker in this report, it cannot be changed by diet, exercise or weight loss. It is entirely inherited, meaning her first-degree relatives, including her children, siblings and parents, should also be tested. The reason this matters so much is that it is compounding a lipid profile that already needs attention. Her ApoB, which is a direct count of the number of cholesterol-carrying particles in her blood, is 1.25, well above the 0.9 target and classified as high. Her LDL cholesterol is 3.6 against a target of below 3.0, and when the contribution from Lp(a) is removed mathematically, her Lp(a)-corrected LDL comes down to 2.93, which is still just below the laboratory limit of 3.0 but above the ideal of 2.0. What this means in practice is that even if Chantell brings her modifiable LDL down through diet and weight loss, the Lp(a) will continue to deposit cholesterol into her artery walls, encourage inflammation and promote clotting. Her ApoB to ApoA1 ratio, which is one of the best single measures of cardiovascular balance, is 1.01, more than double the 0.6 threshold for lower risk. Her Apolipoprotein A1, the protein on the surface of HDL (the protective cholesterol), is 1.24, below the 1.4 level considered desirable. Her HDL itself is 1.3, which is adequate but below the 1.6 level that would be ideal for a woman. Her total cholesterol is 5.2, marginally above the desirable threshold of 5.18. Her cardiovascular risk score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 90 out of 100, with 20 or below being ideal. That score is being driven overwhelmingly by the Lp(a) and the ApoB. This does not mean Chantell is about to have a cardiac event, but it does mean the risk is being built steadily and the window for acting is now, not in ten years. Her GP should be aware of the Lp(a) result because in some cases, particularly where Lp(a) is this high, medication such as a statin or PCSK9 inhibitor may be considered to bring the modifiable portion of the risk down as far as possible. There is genuinely good news within the lipid panel too. Her triglycerides are 0.72, which is excellent by any standard and reflects well on the low-carb approach. Her triglyceride-to-HDL ratio is 0.55, comfortably within the ideal range, and her VLDL is 0.33, also very low. Remnant cholesterol is 0.3, which is well within the ideal band. So the metabolic component of her lipid risk is well controlled; it is the genetic component that is the problem.\n\nThere is a great deal to feel positive about in Chantell's results. Her blood sugar control is excellent. Fasting glucose is 4.4, HbA1c is 38 mmol/mol, fasting insulin is 6.25, and HOMA-IR, which estimates how hard the body has to work to control blood sugar, is 1.22. At a BMI of 34.3, this level of insulin sensitivity is genuinely impressive and tells us that the low-carb diet and the walking are doing real metabolic work. Her C-Peptide, which is a more stable measure of how much insulin the pancreas is producing, is 1.61, sitting comfortably in range. Her liver is in good health. ALT is 31, which is just above the optimal threshold for women of 25 but well within the laboratory range, and given the frequent painkiller use, this is reassuring rather than concerning. GGT is 30, AST is 19, bilirubin is 6, albumin is 45, and the FIB-4 score, which estimates the likelihood of liver scarring, is 0.69, well below the threshold. The APRI and NAFLD Fibrosis Score are both comfortably in range. The liver is handling the painkiller load without visible strain, though this is something to keep an eye on, particularly with paracetamol, which is metabolised entirely through the liver. Amylase is 40 and lipase is 40, both comfortably mid-range, which is reassuring given that she is waiting for a cholecystectomy; the pancreas, which sits right next to the gallbladder and can be affected by gallstone disease, shows no sign of inflammation. Her kidney function is solid, with a creatinine of 65 giving a creatinine-based eGFR above 90, and a Cystatin C of 0.99 giving a Cystatin C-based eGFR of 89. Cystatin C is a more reliable measure of kidney filtration than creatinine because it is not affected by muscle mass. An eGFR of 89 is just a fraction below the optimal threshold of 90 and at 49 is entirely consistent with healthy ageing. Her urea-to-creatinine ratio is 109, slightly above the upper limit of 100, which can reflect mild dehydration at the time of the blood draw or a high-protein diet, and given that she follows a high-protein diet, this is the most likely explanation. Her thyroid is working well. TSH is 1.18, which is right in the sweet spot of the optimal range. Free T4 is 16.2, Free T3 is 4.6, and the FT3-to-FT4 conversion ratio is 0.284, all sitting within their ideal bands. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. Her immune system looks healthy. IgG, IgM and IgA are all within range, IgE is 50.6 which is within the normal limit of 100, and rheumatoid factor is below 4, which is negative. Given her joint pain and stiffness, a negative rheumatoid factor is a useful finding, though it does not rule out all inflammatory joint conditions. Coeliac screening by tissue transglutaminase IgA is negative. Her tumour markers are all clear: CA125 is 13.4, CA15-3 is 11.73, CA19-9 is 3.56, and CEA is 0.53, all well within their respective limits. Her creatine kinase, a marker of muscle damage, is 193, just within the upper limit of 200 for women, which is consistent with her resistance training three times a week. Her total antioxidant activity is 1.72, sitting near the top of the range, which is a positive finding. Her urinalysis is clean: no protein, no glucose, no blood, no white cells, no nitrites, and urine culture results are pending.\n\nHer hormonal picture is consistent with menopause. FSH is 103.42, well into the postmenopausal range of above 23, and LH is 48.21, also within the postmenopausal reference. Oestradiol is 53, which is within the postmenopausal range of below 118 but confirms that ovarian oestrogen production has largely ceased. Progesterone is 0.94, consistent with the postmenopausal range. These findings confirm that Chantell has transitioned through menopause, and this has implications for several of her goals. The loss of oestrogen accelerates bone density loss, changes where fat is stored, makes it harder to build muscle, and contributes to joint stiffness, which is the symptom she reports. Her testosterone is 0.8, which is within the female reference range of 0.5 to 2.6, and her free testosterone, the portion available for the body to use, is 0.011, sitting right at the floor of the range. Her bioavailable testosterone is 0.28, within range but in the lower half. SHBG is 47.1, which is mid-range and not excessively binding testosterone. DHEA-S is 4.3 umol/L, which is within range and a positive sign that adrenal hormone production is maintained. Prolactin is 198, within the non-pregnant range. Cortisol is 203, which sits within the morning reference range. The combination of confirmed menopause, joint stiffness and goals of building muscle and balancing hormones makes this a conversation worth having with her GP or a menopause specialist. Hormone replacement therapy, if appropriate, would address the oestrogen deficit, protect bone density, and may ease the joint symptoms.\n\nHer parathyroid hormone, PTH, is 0.456, which is below the lower limit of 0.98. PTH is the hormone that regulates calcium and phosphate levels in the blood; when calcium drops, PTH rises to pull calcium from bone and increase absorption from the gut. A suppressed PTH usually means the body is sensing that calcium is adequate and does not need the hormone to top it up. Her corrected calcium is 2.37 and her phosphate is 1.2, both comfortably mid-range. Her vitamin D is 97, which is within the optimal range of 75 to 120. High vitamin D can suppress PTH because vitamin D increases calcium absorption from food, and at 97 her vitamin D is high enough to be contributing to this effect. This is the most likely explanation: the calcium supply is good, the vitamin D is doing its job, and the parathyroid gland has dialled down accordingly. This is not dangerous, but it is worth mentioning to her GP to have on record, particularly because calcium metabolism matters more after menopause when bone density is declining.\n\nHer RDW, which stands for red cell distribution width and measures how much variation there is in the size of red blood cells, is 15.9 against an upper limit of 14. This is a meaningful finding. An elevated RDW in the presence of a normal MCV of 87.4 and normal haemoglobin of 141 most commonly reflects early iron deficiency or early B12 or folate deficiency, where the body is starting to produce cells of mixed sizes but has not yet developed anaemia. Looking at her iron studies, ferritin is 183 which is healthy, serum iron is 18.8, transferrin saturation is 30%, and iron binding capacity is 60.3, all within range. However, her transferrin, the protein that carries iron in the blood, is 2.48, just below the lower limit of 2.5. This is a marginal finding and could be an early sign that iron metabolism is shifting, or it could reflect the fact that transferrin is a negative acute-phase protein, meaning it falls during any low-grade inflammatory process. Her CRP is 1.6, which is above the optimal threshold of 1.0 but well within the laboratory limit of 5.0, suggesting mild background inflammation, possibly related to her joint symptoms or her BMI. Her folate is 4 ng/ml, which is within the laboratory range of 3 to 17 but is low and well below the optimal threshold of above 8. A folate at 4 is the most likely driver of her raised RDW, because folate is essential for DNA synthesis during red blood cell production, and when it is marginal, the bone marrow produces cells of uneven size. Her B12 is 485, which is within the laboratory range but below the optimal threshold of 500. She should increase her folate intake, ideally through dark green vegetables, lentils and fortified foods, and a methylfolate supplement would be appropriate.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 49.1 against a calendar age of 49, so the blood chemistry reads as the calendar age. Her magnesium is 1.02, sitting within the optimal range of 0.85 to 1.05, which is a genuinely good result and supports muscle function and sleep. Her ESR is 10, within the limit of 12, and her platelet-to-lymphocyte ratio is 168.5 and systemic immune-inflammation index is 484, both within range though the SII sits above the optimal ceiling of 450, consistent with mild background inflammation.\n\nTo summarise the priorities: the Lp(a) result is permanent, inherited and the single most important finding in this report. It needs to go on her medical record and her GP should assess whether lipid-lowering medication is warranted given the combined ApoB and Lp(a) burden. The confirmed menopause, with its implications for bone, joints, muscle and body composition, is the second conversation to have. The low folate is the easiest fix and will likely resolve the raised RDW. And the joint stiffness, in the context of negative rheumatoid factor, negative coeliac screen and confirmed menopause, is most likely driven by the loss of oestrogen, the BMI loading her joints, and possibly the mild systemic inflammation reflected in the CRP of 1.6.","links":"The dominant thread in Chantell's results is a cardiovascular risk profile that is being driven primarily by genetics rather than by lifestyle. Her triglycerides are excellent, her blood sugar control is impressive for her BMI, and the metabolic markers that typically deteriorate with excess weight, such as HOMA-IR, fasting insulin and triglycerides, are all well controlled. This tells us that her low-carb, high-protein approach and her daily walking are doing genuine metabolic work. Despite this, her ApoB is high at 1.25 and her LDL is elevated at 3.6. The critical piece of the puzzle is the Lp(a) at 208, which is genetically fixed and cannot be changed by any lifestyle intervention. When the Lp(a) contribution is subtracted from her LDL, the corrected LDL comes down to 2.93, which is still above ideal but dramatically less alarming. This means the modifiable portion of her cholesterol risk is relatively modest, but the inherited portion is substantial and permanent. Her low ApoA1 of 1.24 and HDL of 1.3 mean the protective side of the equation is not fully compensating.\n\nThe second thread is the hormonal transition. Her FSH of 103 and LH of 48 confirm she is postmenopausal. This connects to her joint stiffness, because oestrogen has direct protective effects on joint cartilage and synovial fluid, and to her goals of building muscle and losing body fat, because oestrogen loss shifts fat distribution toward the abdomen and makes muscle protein synthesis less efficient. Her testosterone is in range but her free testosterone is at the absolute floor, which further limits the anabolic signal available for muscle building. The negative rheumatoid factor and negative coeliac screen are important exclusions, because they mean the joint stiffness is much more likely to be hormonal and mechanical (weight on joints) than autoimmune.\n\nThe third thread connects the low folate, the raised RDW and the marginal transferrin. Folate at 4 is technically within range but functionally low, and it is the most plausible explanation for the RDW of 15.9. The bone marrow needs folate to produce red cells of uniform size; when supply is marginal, cell sizes become uneven and the RDW rises before any anaemia develops. The transferrin at 2.48 is only fractionally below range and is unlikely to be clinically significant on its own, but it is consistent with either mild inflammation (CRP 1.6) or early shifts in iron handling that are worth watching.\n\nThe suppressed PTH stands slightly apart from the other findings. It is most likely a physiological response to adequate calcium and good vitamin D levels rather than a pathological process. At 97, her vitamin D enhances calcium absorption sufficiently that the parathyroid gland dials down its output. This is not dangerous but is worth recording, especially post-menopause when calcium and bone metabolism become more important.\n\nWhat has been excluded is as valuable as what has been found. Her liver is healthy despite regular painkiller use. Her pancreas is uninflamed despite gallbladder disease. Her thyroid is optimal with negative antibodies. Her immune system shows no autoimmune activation. Her tumour markers are clear. Her kidneys are filtering well. Her blood sugar metabolism is genuinely excellent. These are not trivial findings at BMI 34 and age 49; they represent a body that is fundamentally resilient and responsive to the right inputs.","lifestyle":"Add 200g of dark green vegetables to your main meal every day: spinach, broccoli, kale or Brussels sprouts. Anchor: when you plate up dinner, the greens go on first. Why: folate from greens will address your low folate of 4 and should bring your RDW back into range within three to four months.\nHit a minimum of 130g of protein every day, spread across at least three meals. You are already eating high-protein; make sure the total reaches 1.3 to 1.6g per kilogram of body weight. Why: at your current weight and with resistance training three times a week, this is the floor for maintaining and building muscle post-menopause.\nSet a calorie target of 1,700 to 1,900 kcal per day. Your estimated maintenance is around 2,300 kcal at your activity level, so a 400 to 600 kcal deficit will produce steady fat loss of 0.4 to 0.5kg per week without undermining training recovery. Your target weight range is 70 to 80kg.\nAdd two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: replace two existing evening meals. Why: omega-3 fatty acids raise ApoA1 and HDL, lower triglycerides further, and have direct anti-inflammatory effects that may help your joint stiffness and your CRP of 1.6.\nAdd 10g of soluble fibre daily from oats, flaxseed, chia seeds or psyllium husk. Anchor: stir into your first meal or a shake. Why: soluble fibre binds cholesterol in the gut and lowers LDL by 5 to 10%, which matters because the modifiable portion of your LDL is the only part you can influence given the Lp(a).\nKeep your three resistance sessions per week and consider adding a fourth if recovery allows. Post-menopause, resistance training is the single most effective tool for maintaining bone density, building muscle and improving insulin sensitivity. Why: your testosterone is at the floor of the range, so the training stimulus needs to be consistent and progressive to compensate.\nDiscuss your painkiller use with your GP or pharmacist. Ibuprofen taken frequently can affect kidney function over time and paracetamol loads the liver. Your kidney and liver markers are currently healthy, but alternatives or a structured pain management approach may be worth exploring, particularly given the joint stiffness.\nAim for a consistent bedtime and wake time seven days a week, and get outside within the first hour of waking for natural light. Why: cortisol and melatonin rhythms become more disrupted post-menopause, and anchoring the sleep-wake cycle supports energy, recovery and body composition.","flags":"Lp(a) 208 nmol/L (high risk, threshold 32 nmol/L). Genetically determined, cannot be modified by lifestyle. Significantly elevates cardiovascular risk independently of other lipid markers. Should be recorded permanently and first-degree relatives offered testing.\nApoB 1.25 g/L (above 0.9 target, classified as high). ApoB/A1 ratio 1.01 (above 0.6, higher risk). LDL 3.6 mmol/L (above 3.0 target). Lp(a)-corrected LDL 2.93 mmol/L. ApoA1 1.24 g/L (below 1.4 desirable). HDL 1.3 mmol/L (below 1.6 optimal for women). Cardiovascular risk score 90/100. Combined with the Lp(a), this lipid profile warrants GP review for consideration of lipid-lowering therapy.\nPTH 0.456 pmol/L (below range 0.98 to 4.73). Calcium 2.37, phosphate 1.2 and vitamin D 97 are all within range. Most likely physiological suppression from adequate calcium and vitamin D. Should be noted on record, particularly post-menopause when bone metabolism is a priority.\nRDW 15.9% (above range 11.6 to 14.0). Most likely driven by low folate of 4 ng/ml. No anaemia present (Hb 141). Recommend folate supplementation and repeat FBC in three to four months.\nFolate 4 ng/ml (within laboratory range 3 to 17 but below optimal of 8). Functionally low and the probable cause of the elevated RDW.\nTransferrin 2.48 g/L (marginally below range 2.5 to 3.8). Isolated and marginal. May reflect mild inflammation (CRP 1.6) or early iron metabolism shift. Ferritin, iron and saturation are all healthy.\nCRP 1.6 mg/L (within laboratory range but above optimal of 1.0). Mild background inflammation, consistent with BMI 34, joint symptoms or post-gallbladder inflammation.\nFSH 103.42 mIU/ml, LH 48.21 mIU/ml, oestradiol 53 pmol/L. Confirms postmenopausal status. Free testosterone 0.011 nmol/L at the floor of range. Relevant to her goals of building muscle, losing fat and balancing hormones. HRT discussion may be appropriate.\nFree testosterone 0.011 nmol/L (at the absolute floor of the range 0.01 to 0.25). Bioavailable testosterone 0.28 nmol/L, lower half of range. May contribute to difficulty building muscle and joint symptoms.\nUrea:creatinine ratio 109.2 (above upper limit of 100). Most likely reflects high-protein diet. No kidney concern with eGFR 89 and Cystatin C 0.99.\nReassuring negatives: thyroid function optimal with negative antibodies, liver function healthy with FIB-4 0.69 and NAFLD score well below threshold, pancreatic enzymes normal despite gallbladder disease, rheumatoid factor negative, coeliac screen negative, all tumour markers clear (CA125 13.4, CA15-3 11.73, CA19-9 3.56, CEA 0.53), blood sugar metabolism excellent (HbA1c 38, HOMA-IR 1.22), kidney function preserved, urinalysis clean, IgE within range, ESR 10.","recommendations":"Record Lp(a) of 208 nmol/L on her permanent medical record. This is a genetically fixed, high-risk result. Discuss whether lipid-lowering medication is warranted given the combined burden of Lp(a) 208, ApoB 1.25 and LDL 3.6. Offer Lp(a) testing to first-degree relatives including children, siblings and parents.\nDiscuss the confirmed menopausal status (FSH 103, oestradiol 53, free testosterone 0.011) and whether hormone replacement therapy is appropriate, particularly given her joint stiffness, goals of muscle building and fat loss, and the bone density implications of oestrogen loss.\nNote the suppressed PTH of 0.456 alongside normal calcium, phosphate and vitamin D. Request a DEXA bone density scan given her postmenopausal status and suppressed PTH to establish a baseline.\nReview her frequent painkiller use. If she is using ibuprofen regularly, discuss alternatives or a structured pain management approach, particularly as she approaches cholecystectomy and given the mild joint-related inflammation.\nRepeat full blood count including RDW in three to four months after folate supplementation to confirm the RDW normalises. Also repeat folate and B12 at that point.\nCalorie target 1,700 to 1,900 kcal per day, protein floor 130g per day (1.3g per kilogram), target weight range 70 to 80kg. Retest in six months with repeat lipid panel (ApoB, LDL, HDL, ApoA1, triglycerides), FBC, folate, B12, CRP, PTH and calcium to track progress.","supplementation":"Methylfolate (5-MTHF), 400 to 800 mcg daily, taken with food. Why: folate is 4 ng/ml, well below the optimal threshold of 8, and is the most likely cause of the raised RDW. Methylfolate is the active form and is better absorbed than folic acid, particularly if she carries an MTHFR variant.\nSublingual methylcobalamin (vitamin B12), 1,000 mcg daily, dissolved under the tongue. Why: B12 is 485, within the laboratory range but below the optimal threshold of 500. B12 and folate work together in red cell production, and correcting one without the other can mask a deficiency in the second.\nVitamin D3 (cholecalciferol), 2,000 IU daily, taken with a fat-containing meal. Why: vitamin D is 97, which is within the optimal range of 75 to 120. At BMI 34, fat tissue sequesters vitamin D, so a maintenance dose is needed to hold this level through winter. Always take with vitamin K2.\nVitamin K2 (MK-7), 100 to 200 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone and teeth rather than soft tissue and arteries. This is particularly important post-menopause when bone density is declining and given the suppressed PTH.\nOmega-3 fish oil, 2 to 3g of combined EPA and DHA daily, taken with food. Why: supports HDL and ApoA1 (both below optimal), has anti-inflammatory effects relevant to her CRP of 1.6 and joint stiffness, and is one of the few interventions shown to modestly lower Lp(a) in some individuals.\nMagnesium glycinate, 300 to 400mg before bed. Why: magnesium is 1.02, within the optimal range, but demand increases with resistance training, and glycinate supports sleep quality and muscle recovery.\nDo not take iron supplements. Ferritin is 183, serum iron is 18.8 and transferrin saturation is 30%. Iron stores are healthy and supplementation would risk pushing them too high.\nThe most important changes from this report are not supplements. They are getting the Lp(a) onto her medical record and discussing lipid-lowering therapy with her GP, having the menopause and HRT conversation, increasing folate-rich vegetables, maintaining the calorie deficit and protein target, and keeping the resistance training consistent.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 64; held to 59 by a system rated \"See your GP\". Weakest systems: lipids & cardiovascular 18%, thyroid 61%, hematology 64%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Red Cell Distribution Width.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"49.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4546","lower_normal":"","upper_normal":"54","lower_optimal":"","upper_optimal":"49","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4537","units":"years","description":"PhenoAge is calculated from your measured results. It sits outside the ideal range. It is being driven by Red Cell Distribution Width, which sits outside the ideal range.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built, not the ten-year chance of an event, and has no age term. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. Chantell's score of 90 is very high, driven overwhelmingly by her Lp(a) of 208 and her ApoB of 1.25. The metabolic inputs (triglycerides, HbA1c) are actually pulling the score down, which shows that her lifestyle is doing real work on the modifiable risk. The inherited Lp(a) burden is what pushes the score this high. This does not mean she is about to have a cardiac event, but it does mean the risk is accumulating and needs proactive management through both lifestyle and, likely, medical intervention.","low_causes":"Healthy lipids, low inflammation, good metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It is the most immediate snapshot of blood sugar control. Chantell's result of 4.4 is right in the middle of the optimal range, reflecting excellent blood sugar regulation. This is a genuinely impressive finding at a BMI of 34, where glucose often drifts toward the upper end of range.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, steroid use, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5600","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"HbA1c expressed as a percentage is an older unit for the same measurement as HbA1c in mmol/mol. It reflects average blood sugar over the previous two to three months. Chantell's result of 5.6% is within the normal range but sits just above the optimal ceiling. The mmol/mol result of 38 is the more precise figure and is discussed below.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it. Because red cells live for about three months, it gives an average of blood sugar control over that period. Chantell's result of 38 is within the normal range of below 42 but sits above the optimal threshold of 36. This is a very good result and does not suggest pre-diabetes, but there is a small margin of improvement available through continued dietary consistency.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"6.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3829","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3974","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. A low fasting insulin with a normal glucose means the body is highly sensitive to insulin, which is the ideal state. Chantell's result of 6.25 is within the optimal range, meaning her pancreas is doing its job efficiently without overworking. This is an excellent result at BMI 34 and reflects the metabolic benefits of her low-carb approach.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate intake, obesity, PCOS, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"532.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4719","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"800","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4732","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, but unlike insulin it is not cleared by the liver, so it gives a more stable measure of how much insulin the body is actually producing. Chantell's result of 532.91 pmol/L (converted from 1.61 ug/L) is within the normal range and indicates healthy pancreatic insulin output. It confirms that her pancreas is producing an appropriate amount of insulin for her glucose level.","low_causes":"Low carbohydrate intake, type 1 diabetes, advanced type 2 diabetes with beta cell failure","high_causes":"Insulin resistance, obesity, insulinoma, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4571","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_positio
