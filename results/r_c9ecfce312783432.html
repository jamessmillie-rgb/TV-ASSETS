s":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including muscle contraction, nerve function, blood sugar regulation and bone formation. Chantell's result of 1.02 is within the optimal range of 0.85 to 1.05. This is a genuinely good result, especially for someone who trains with resistance three times a week, as training depletes magnesium.","low_causes":"Poor dietary intake, alcohol, diuretics, diarrhoea, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4850","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. It is produced in the skin through sunlight exposure and obtained from food. Chantell's result of 97 is within the optimal range of 75 to 120. At BMI 34, fat tissue sequesters vitamin D, making this a particularly good result that suggests she is either supplementing or getting significant sun exposure. A maintenance dose of vitamin D through winter will help hold this level.","low_causes":"Insufficient sunlight, obesity (fat sequesters vitamin D), dark skin, poor dietary intake, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (Intact)","group":"THYROID","result":"0.456","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2120","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6009","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels in the blood. It is released when calcium drops, signalling the bones to release calcium, the kidneys to retain it and the gut to absorb more. Chantell's PTH is 0.456, below the lower limit of 0.98. However, her calcium and phosphate are both well within range and her vitamin D is optimal at 97. This pattern, where PTH is suppressed in the context of normal calcium and good vitamin D, most likely represents physiological suppression: the vitamin D is enhancing calcium absorption from food so effectively that the parathyroid glands have reduced their output. The lab notes that PTH samples should ideally be centrifuged and separated on the day of collection, so sample handling could also contribute. This finding should be noted on her medical record and discussed with her GP, particularly given her postmenopausal status when bone health becomes more important.","low_causes":"Adequate or high calcium levels, good vitamin D status, hypoparathyroidism, magnesium deficiency, sample handling","high_causes":"Low calcium, vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"485","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4567","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4555","upper_optimal_position":"0.6161","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. It is obtained from animal products. Chantell's result of 485 is within the laboratory range but below the optimal threshold of 500. On a high-protein diet that likely includes meat, this is slightly lower than expected and could be contributing to the raised RDW alongside the low folate. Sublingual methylcobalamin supplementation would help bring this into the optimal range.","low_causes":"Poor dietary intake (vegetarian/vegan), pernicious anaemia, malabsorption, metformin, proton pump inhibitors","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and cell division. It is found in green leafy vegetables, legumes and fortified foods. Chantell's result of 4 is within the laboratory range of 3 to 17 but is well below the optimal threshold of 8. This is the most likely explanation for her elevated RDW of 15.9, because when folate is marginal, the bone marrow produces red cells of uneven size. On a low-carb, high-protein diet, folate-rich vegetables may be underrepresented. Increasing dark green vegetables and supplementing with methylfolate will address this.","low_causes":"Low vegetable intake, alcohol, coeliac disease, medications (methotrexate), pregnancy, malabsorption","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5019","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. On its own, total cholesterol is a blunt tool; the breakdown into subtypes matters far more. Chantell's result of 5.2 is marginally above the desirable threshold of 5.18. The more important markers are her ApoB and LDL, which are discussed in detail below.","low_causes":"Hyperthyroidism, liver disease, malnutrition, genetic factors","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2118","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily influenced by carbohydrate and sugar intake rather than dietary fat. Chantell's result of 0.72 is well within the optimal range and reflects the metabolic benefit of her low-carb dietary approach. Low triglycerides are one of the strongest markers of metabolic health.","low_causes":"Low carbohydrate diet, hyperthyroidism, malnutrition","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2115","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. It is a precursor to LDL. Chantell's result of 0.33 is well within the optimal range, consistent with her excellent triglyceride level.","low_causes":"Low carbohydrate diet, hyperthyroidism","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4194","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is often called the 'good' cholesterol because it carries excess cholesterol away from artery walls back to the liver for disposal. Chantell's result of 1.3 is above the minimum threshold of 1.04 but below the optimal level of 1.6 for women. Raising HDL through regular exercise, omega-3 fatty acids and moderate weight loss would strengthen the protective side of her lipid profile.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, insulin resistance, genetics","high_causes":"Regular exercise, moderate alcohol intake, genetics, weight loss","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5067","units":"mmol/L","description":"LDL (low-density lipoprotein) is the primary carrier of cholesterol to the tissues. When levels are too high, LDL deposits cholesterol into artery walls, driving atherosclerosis over time. Chantell's result of 3.6 is above the target of 3.0 and well above the optimal level of 2.6. However, when her Lp(a) contribution is subtracted, the Lp(a)-corrected LDL comes down to 2.93, meaning the modifiable portion is much closer to target. Diet changes, soluble fibre and weight loss will help bring this down further, though the Lp(a)-driven portion cannot be reduced by lifestyle.","low_causes":"Hyperthyroidism, liver disease, malnutrition, genetic factors","high_causes":"High saturated fat diet, genetics, hypothyroidism, obesity, kidney disease, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick measure of cardiovascular risk. A lower number is better, meaning more of the total cholesterol is in the protective HDL form. Chantell's result of 4.0 is within the laboratory range of below 4.5 but above the optimal threshold of 3.5. Raising HDL and lowering LDL will improve this ratio.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the potentially harmful cholesterol fractions in one number, including LDL, VLDL and Lp(a). Chantell's result of 3.9 is within the laboratory range of below 4.0 but above the optimal threshold of 3.2. The Lp(a) contribution makes a significant portion of this non-modifiable.","low_causes":"Low LDL, low triglycerides, healthy diet","high_causes":"High LDL, high triglycerides, genetics, poor diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on the surface of HDL particles. It enables HDL to collect excess cholesterol from artery walls and return it to the liver. Higher levels are protective. Chantell's result of 1.24 is below the desirable threshold of 1.4, meaning the protective arm of her lipid profile is weaker than it should be. Exercise, omega-3 fatty acids and weight loss can all raise ApoA1.","low_causes":"Sedentary lifestyle, obesity, smoking, genetics, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetics, statins","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle. Each of these particles carries exactly one ApoB molecule, so measuring ApoB gives a direct count of the total number of atherogenic (artery-damaging) particles in the blood. It is increasingly regarded as the single best predictor of cardiovascular risk. Chantell's result of 1.25 is well above the 0.9 target, classified as 'high' by the laboratory. A significant portion of this ApoB count is being driven by her Lp(a) particles, which cannot be reduced by lifestyle. The modifiable portion, driven by LDL and VLDL particles, should be targeted through diet, weight loss and potentially medication.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"High LDL, high Lp(a), genetics, high saturated fat diet, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8417","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is one of the most powerful single measures of cardiovascular risk. It compares the number of harmful cholesterol particles (ApoB) to the number of protective ones (ApoA1). A ratio below 0.6 is lower risk; above 0.8 is higher risk. Chantell's result of 1.01 is well above the higher-risk threshold, driven by both a high ApoB (1.25) and a low ApoA1 (1.24). This ratio captures the full picture: too many harmful particles and not enough protective ones.","low_causes":"High HDL/ApoA1, low LDL/ApoB, healthy diet, exercise","high_causes":"High LDL, high Lp(a), low HDL, genetics, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"208.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8126","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle that resembles LDL cholesterol but carries an additional protein called apolipoprotein(a). It deposits cholesterol into artery walls, promotes blood clotting and drives inflammation, making it an independent and powerful risk factor for heart disease and stroke. Chantell's result of 208 places her in the 'high risk' category (200 to 400 nmol/L). Crucially, Lp(a) levels are set by genetics and cannot be changed by diet, exercise, weight loss or any currently available supplement. This result should be recorded on her permanent medical record because it will never change. Her first-degree relatives, including children, siblings and parents, should be offered Lp(a) testing. In the context of her elevated ApoB and LDL, the Lp(a) adds a significant inherited component to her cardiovascular risk that makes reducing the modifiable risk factors even more important.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"193","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5514","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5381","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged or under stress. It rises after resistance training, which is normal. Chantell's result of 193 is within the laboratory range for women (25 to 200) but above the optimal ceiling of 160. This is entirely consistent with her resistance training three times a week and is not a concern.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Resistance training, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4732","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. It circulates to tissues where it is converted to the more active T3. Chantell's result of 16.2 is within the optimal range, indicating healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3826","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4929","units":"mIU/L","description":"TSH is produced by the pituitary gland to tell the thyroid how much hormone to make. When thyroid function drops, TSH rises as the pituitary pushes harder. Chantell's result of 1.18 is within the optimal range of 1.0 to 2.5, sitting in the sweet spot where the thyroid is producing hormones efficiently without being pushed.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4481","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production and body temperature. Chantell's result of 4.6 is within the optimal range, confirming that her body is converting FT4 to FT3 efficiently.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, sick euthyroid syndrome, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3-secreting nodule","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence indicates autoimmune thyroid disease (Hashimoto's thyroiditis). Chantell's result of below 6.6 is negative, ruling out TPO-mediated autoimmune thyroid disease.","low_causes":"Normal, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, the protein the thyroid uses to produce its hormones. Elevated levels can indicate autoimmune thyroid disease. Chantell's result of below 1.3 is negative, consistent with more than 80% of the population. Both thyroid antibody tests being negative rules out autoimmune thyroid disease.","low_causes":"Normal, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.284","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio estimates how efficiently the body converts the inactive thyroid hormone T4 into the active form T3. Chantell's result of 0.284 is within the optimal range, confirming good thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"3.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0481","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"CA 19-9 is a tumour marker associated with pancreatic, biliary and gastrointestinal cancers. It can also be mildly elevated in benign gallbladder and bile duct disease. Chantell's result of 3.56 is very low and well within the normal limit of 37. This is reassuring, particularly given her gallbladder disease.","low_causes":"Not significant","high_causes":"Pancreatic cancer, biliary obstruction, gallbladder disease, other gastrointestinal cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA (Carcinoembryonic Antigen)","group":"TUMOR MARKERS","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1152","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"ng/mL","description":"CEA is a tumour marker most commonly associated with colorectal cancer, though it can also be elevated in other cancers and in smokers. Chantell's result of 0.53 is well within the normal limit for non-smokers of 2.3. This is a clear result.","low_causes":"Not significant","high_causes":"Colorectal cancer, lung cancer, pancreatic cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"13.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1914","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"CA-125 is a tumour marker most commonly associated with ovarian cancer, though it can be elevated by endometriosis, pelvic inflammatory disease and menstruation. Chantell's result of 13.4 is well within the normal limit of 35.","low_causes":"Not significant","high_causes":"Ovarian cancer, endometriosis, pelvic inflammatory disease, menstruation, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"11.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1955","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"CA 15-3 is a tumour marker associated with breast cancer. It is used for monitoring rather than screening. Chantell's result of 11.73 is well within the normal limit of 30.","low_causes":"Not significant","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"10.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5018","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immune protection against infections the body has encountered before. Chantell's result of 10.3 is within the laboratory range, indicating healthy immune memory function.","low_causes":"Immune deficiency, medications, chronic lymphocytic leukaemia","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced during an immune response. It is the initial line of defence against new infections. Chantell's result of 1.0 is within the laboratory range, indicating normal initial immune response capacity.","low_causes":"Immune deficiency, chronic lymphocytic leukaemia","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4613","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces: the gut, lungs and urinary tract. It is also important for validating coeliac screening, because the tissue transglutaminase test depends on IgA. Chantell's IgA of 1.6 confirms her coeliac screening is valid and her mucosal immunity is healthy.","low_causes":"Selective IgA deficiency (common, usually harmless), immune deficiency","high_causes":"Chronic infection, autoimmune disease, liver disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"50.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2530","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_pos function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
