<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Stuart Globe","dob":"07/01/1971","report_date":"2026-09-22","summary":"Stuart is a 55-year-old male presenting with a BMI of 28.7, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. He trains six times per week, split evenly between three cardio and three resistance sessions, with 7,500 to 10,000 daily steps. He is currently taking a statin. He drinks more than seven alcoholic drinks per week. He reports poor sleep and insomnia, low sex drive, and low mood with anxiety. His goals are to improve sleep quality, improve mood, and improve long-term health and longevity.\n\nThe finding that stands out most in this report is the ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube over one hour. A faster rate suggests inflammation somewhere in the body. Stuart's ESR is 36, three times the upper limit of 12 for a man. This is a significant elevation and it does not have an obvious explanation in the rest of the panel. His high-sensitivity CRP, the other main inflammation marker, is 0.8, which is within the ideal range of below 1.0. CRP and ESR measure overlapping but different things: CRP rises and falls quickly with acute inflammation, while ESR responds to longer-term changes in blood proteins, particularly immunoglobulins and fibrinogen. When ESR is raised but CRP is not, the most common explanations are elevated immunoglobulins, anaemia, increased age, or a chronic low-grade process that CRP has not picked up. Stuart's immunoglobulins are all within range, and his haemoglobin is healthy at 155, so neither of those explains it. His total protein and globulin are within range but globulin at 32 is in the upper half, which can nudge ESR upward. At 55, ESR does drift higher with age, but 36 is still well above what age alone would explain. We would recommend discussing this with his GP. A repeat ESR in six to eight weeks, alongside a plasma viscosity or fibrinogen level if available, would clarify whether this is a persistent finding or a transient one. If it persists, the GP may wish to check a serum protein electrophoresis to look at the pattern of proteins in the blood.\n\nWith that flagged, there is a great deal of good news in this report and it deserves proper attention. Stuart's cardiovascular profile is excellent, and for a man on a statin this is exactly the picture the medication is designed to produce. His total cholesterol is 4.3, his LDL is 2.23, and his ApoB, the protein that carries atherogenic cholesterol particles into artery walls, is 0.67, comfortably below the 0.9 threshold and even below the tighter 0.8 optimal target. His HDL, the protective cholesterol, is 1.7, which is outstanding for a man and well above the 1.4 optimal floor. His triglycerides are 0.86, below the 1.0 optimal ceiling, giving him a TG to HDL ratio of 0.51, which is a strong marker of metabolic health. His ApoB to ApoA1 ratio is 0.38, deep into the low-risk zone. His Lp(a), lipoprotein little-a, which is an inherited and unchangeable cholesterol particle that independently drives cardiovascular risk, is below 25, which is normal. This is genuinely useful information because it means his already-excellent lipid numbers are not being masked by a genetic risk factor underneath. His Cardiovascular Risk Score, a TrueVitals composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 0 out of 100, which is as good as this metric gets. His remnant cholesterol, the fraction left after subtracting HDL and LDL from total cholesterol, is 0.37, well within the optimal band of below 0.5. In short, the statin is doing its job and his underlying metabolic health is supporting it.\n\nHis blood sugar control is also very good. Fasting glucose is 4.5, right in the middle of the optimal range. HbA1c, which reflects average blood sugar over the previous two to three months, is 35 mmol per mol, below the 36 optimal ceiling. His fasting insulin is 2.71, just inside the lower end of the laboratory range of 2.6 to 24.9, and his HOMA-IR, a calculation that estimates insulin resistance from fasting glucose and insulin together, is 0.54, which indicates excellent insulin sensitivity. This tells us that his cells respond readily to insulin and his pancreas does not need to work hard to keep blood sugar controlled. His estimated average glucose, derived from HbA1c, is 5.9, within the optimal band.\n\nHis kidney function is healthy. Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of kidney filtration than creatinine alone, is 0.94, giving a cystatin C-based eGFR of 96 and a combined creatinine and cystatin C eGFR of 96, both comfortably above the 90 optimal floor. His creatinine-based eGFR is above 90. Urea is 4.5 and the urea to creatinine ratio is 56.3, both within ideal ranges. Uric acid at 302 sits within the optimal range of 200 to 380 for a man. His electrolytes are well balanced: sodium 145, potassium 4.8, chloride 102, bicarbonate 27.7, and magnesium 1.08, all within their respective ranges, with magnesium sitting in the upper portion of the optimal band of 0.85 to 1.05. Calcium is 2.48 with a corrected calcium of 2.46, and parathyroid hormone is 2.089, all within range and working together as they should. Phosphate is 1.2, within range.\n\nHis liver markers are largely reassuring. GGT at 12 is excellent, well below the 25 optimal ceiling, which is particularly noteworthy for someone drinking more than seven units per week because GGT is the enzyme most sensitive to alcohol. This tells us the liver is handling the current alcohol intake without visible metabolic strain. Alkaline phosphatase is 67, within range. Albumin is 43 and total protein is 75, both healthy. His APRI score, which estimates liver scarring from AST and platelets, is 0.424, within the optimal band of below 0.5. The De Ritis ratio, AST divided by ALT, is 1.17, within the optimal range of 0.8 to 1.3. His NAFLD fibrosis score is minus 1.764, within the normal range. However, there are two liver-adjacent markers that need context. His ALT is 35, which is within the laboratory range of below 56 but above the tighter optimal threshold of below 30 for a man. His AST is 41, within the laboratory range of 13 to 45 but sitting in the upper portion. His FIB-4 score, which combines age, AST, ALT and platelets to estimate liver fibrosis risk, is 1.58, marginally above the 1.45 threshold. At 55, age is a significant driver of FIB-4 because it sits in the numerator of the formula, and the slightly elevated AST pushes it further. Given that GGT is excellent, albumin is normal, and the APRI and NAFLD scores are both reassuring, this FIB-4 is being driven by the arithmetic of the calculation rather than by any sign of liver disease. It is still worth mentioning to his GP for context, and a repeat in twelve months would confirm stability.\n\nHis total bilirubin is 40, nearly double the upper limit of 21. This looks alarming on paper, but every other liver enzyme, GGT, ALP, ALT and AST, is within the laboratory range, and albumin is normal. This pattern is the hallmark of Gilbert's syndrome, a harmless inherited variation in the way the liver processes bilirubin, present in roughly five to ten percent of the population. It does not progress, does not need treatment, and does not indicate liver disease. It can cause mild yellowing of the eyes during illness or fasting. Stuart should mention it to his GP so it is recorded in his notes, because it will show up on every future blood test and a note on file prevents unnecessary investigation each time.\n\nHis lipase is 68, above the upper limit of 60. Lipase is an enzyme produced by the pancreas to digest fats. A mild elevation like this, just 13 percent above the upper limit, in the absence of abdominal pain, nausea or other symptoms, is most commonly a benign finding. His amylase, the other pancreatic enzyme, is 85, comfortably within its range of 30 to 118, which is reassuring. Alcohol intake above seven drinks per week can cause a mild, asymptomatic rise in lipase, and this is the most likely explanation here. It does not suggest pancreatitis, but it is worth being aware of because it reflects the pancreas registering the alcohol load. Reducing intake to under seven, ideally under four, drinks per week would be expected to bring this back into range.\n\nHis thyroid is working well. TSH, the hormone the pituitary gland uses to tell the thyroid how hard to work, is 1.07, within the tight optimal range of 1.0 to 2.5. Free T4, the main thyroid hormone, is 18.4, within the optimal range of 14 to 20. Free T3, the active form the body's cells actually use, is 4.6, within the laboratory range though marginally below the optimal floor of 4.5 to 6.5, essentially sitting right at the boundary. His FT3 to FT4 ratio is 0.25, just below the optimal range of 0.27 to 0.40, which suggests his conversion from T4 to T3 could be slightly more efficient. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. Overall, his thyroid is functioning well and is not contributing to his fatigue, low mood or sleep difficulties.\n\nHis hormone profile is reasonable for 55 but there are findings that connect to his symptoms. Testosterone is 18.8, which sits right at the lower edge of the optimal range of 18 to 30 for a man. Free testosterone, the fraction not bound to proteins and therefore available to tissues, is 0.311, within range. Bioavailable testosterone is 7.28, within the optimal band. Sex hormone binding globulin, the protein that binds testosterone and makes it unavailable, is 48.6, within range. Free androgen index is 38.68, within range. So his testosterone axis is functioning, but total testosterone at the floor of the optimal range at 55, combined with his symptoms of low libido and low mood, suggests that testosterone is doing just enough rather than providing a comfortable margin. DHEA-S, a precursor hormone produced by the adrenal glands that declines naturally with age, is 3.3 micromol per litre (roughly 1,216 micrograms per decilitre), which is within the broad laboratory range. Cortisol is 181, within the expected morning range. Oestradiol at 125 is within range for a man, and the balance between testosterone and oestradiol appears appropriate. Progesterone at 0.98 is within the male reference range, though at the very floor of it, which in men is of no clinical significance. LH and FSH are both within range, indicating the pituitary is signalling the testes appropriately. Prolactin at 77 is within range.\n\nHis C-Peptide is 0.836 micrograms per litre, which converts to approximately 277 picomoles per litre. C-Peptide is a byproduct released in equal amounts to insulin when the pancreas makes insulin, so it reflects how much insulin the pancreas is producing. The laboratory flags this as below the reference range of 1.1 to 4.4. However, in the context of a fasting glucose of 4.5, an HbA1c of 35, and a HOMA-IR of 0.54, this low C-Peptide is entirely consistent with a pancreas that simply does not need to produce much insulin because Stuart's cells are highly insulin-sensitive. This is a positive finding, not a sign of pancreatic insufficiency. HOMA-B, a calculation estimating beta-cell function from fasting insulin and glucose, is 54.2, which is below the laboratory range of 80 to 200. Again, this reflects low insulin demand rather than failing beta cells, because glucose control is excellent. No action is needed, but it is worth recording so that future tests can confirm stability.\n\nHis blood count is healthy overall. Haemoglobin at 155 is well within the male range, red blood cells at 4.82 are within range, and haematocrit at 0.453 is within range. Platelets at 242 are healthy. White blood cells at 4.53 are within range, with a normal differential: neutrophils 2.61, lymphocytes 1.41, monocytes 0.38, eosinophils 0.10, and basophils 0.03. His neutrophil to lymphocyte ratio is 1.85, within the optimal range of 1.0 to 2.0. His reticulocyte percentage is 0.98, within range, though his absolute reticulocyte count at 47.2 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A marginal shortfall like this, with haemoglobin perfectly healthy and no anaemia, is of no clinical significance and most likely reflects normal day-to-day variation in marrow output.\n\nHis iron studies show a healthy picture. Ferritin, which reflects iron stores, is 201, within the optimal range of 50 to 200 for a man, sitting right at the ceiling. Serum iron is 20.8, within range. Transferrin saturation is 39.44 percent, within the optimal range of 25 to 40 percent. TIBC is 50, within range. His transferrin is 2.1, marginally below the lower limit of 2.15. Transferrin is the protein that carries iron in the blood. When iron stores are adequate to high, the liver reduces transferrin production because less iron transport is needed. With ferritin at 201 and saturation at 39 percent, this mild reduction in transferrin is a physiological response to adequate stores rather than a sign of pathology. No action is needed, but it is worth noting that Stuart should not take iron supplements as his stores are already at the top of the optimal range.\n\nHis vitamin D is 93, within the optimal range of 75 to 120. This is a good level and suggests either sensible sun exposure, supplementation, or both. His folate at 20 is above the upper limit of 17. Folate, also known as vitamin B9, is a B vitamin essential for DNA synthesis and red blood cell production. A result above range is almost always explained by supplementation, fortified foods, or a diet rich in green vegetables. It is not harmful and does not need action, though if he is taking a supplement containing folic acid he could consider reducing the dose. His B12 at 284 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. At this level, B12 is adequate to prevent deficiency symptoms, but research suggests that levels above 500 are associated with better neurological function, energy and mood, all of which are relevant to Stuart's goals. A sublingual methylcobalamin supplement would bring this into the optimal range.\n\nHis total antioxidant activity is 1.83, marginally above the upper limit of 1.77. This is a composite measure of the blood's capacity to neutralise free radicals. An above-range result is not a concern, it simply reflects a good dietary or supplemental antioxidant intake. His creatine kinase at 291 is within the range of 40 to 320, consistent with his resistance training load.\n\nHis immunoglobulins are all within range: IgG 11.8, IgM 0.9, IgA 2.8, and IgE 10.6, ruling out allergic or immune-driven processes. His coeliac screen, tissue transglutaminase IgA, is negative at 0.578, ruling out coeliac disease. Rheumatoid factor is pending. His PSA is 0.28, very low and reassuring, with a free PSA ratio of 0.5, which is excellent. His tumour markers CA19-9 and CEA are both within range. His urinalysis is clean: no protein, glucose, ketones, blood, white cells or nitrites. Bacterial culture is pending.\n\nHis MCH at 32.1 is marginally above the upper limit of 32. MCH is the average amount of haemoglobin in each red blood cell. At this margin, 0.1 above the upper limit, this is laboratory variation and not clinically significant.\n\nStuart's PhenoAge, a biological age estimate calculated from blood markers including albumin, creatinine, glucose, CRP, lymphocytes, MCV, RDW and alkaline phosphatase, will be calculated from these results. His overall metabolic and cardiovascular health is strong, which should be reflected in a biological age at or below his chronological age of 55.\n\nTurning to his symptoms. Stuart reports poor sleep, low libido and low mood with anxiety. His bloods rule out several common causes: his thyroid is working well, his blood sugar and insulin are excellent, his iron stores are adequate, his B12 is not deficient, his testosterone is within range, and there is no significant inflammation on CRP. The ESR elevation does not typically cause these symptoms. The most likely drivers of his symptoms are therefore factors that blood tests cannot directly measure. Alcohol above seven drinks per week is a well-established disruptor of sleep architecture: it may help people fall asleep but it fragments the deeper restorative stages of sleep, leading to waking unrefreshed, which then feeds into low mood and reduced libido the following day. His testosterone sitting right at the floor of the optimal range means there is no comfortable buffer, and alcohol intake, poor sleep, and stress all independently suppress testosterone further on a night-by-night basis. His diet volume is rated 5 out of 10, which combined with six training sessions per week may mean his total calorie intake is not matching his expenditure, and under-fuelling is another driver of poor sleep, mood disturbance and reduced libido. His B12 at 284, while not deficient, is suboptimal, and B12 plays a role in neurotransmitter production and energy metabolism. Improving B12, reducing alcohol, and ensuring adequate caloric intake are the three most actionable levers for his symptoms that this report can identify.","links":"The central thread in this report is a man whose cardiovascular and metabolic health is excellent, whose statin is working precisely as intended, and whose symptoms of poor sleep, low libido and low mood are most likely driven by lifestyle factors that blood cannot measure directly, rather than by a hormonal or metabolic deficiency.\n\nHis lipid profile, blood sugar, insulin sensitivity and kidney function are all in the optimal range or very close to it. His cardiovascular risk score of zero reflects the combined effect of a well-managed statin, naturally high HDL, low triglycerides, and a normal Lp(a). The liver is metabolically healthy, with the elevated bilirubin almost certainly explained by Gilbert's syndrome and the marginal FIB-4 elevation driven by the age term in the formula rather than by any sign of fibrosis. The mildly raised lipase sits alongside a normal amylase and no symptoms, making alcohol the most likely explanation.\n\nThe symptom picture, poor sleep, low libido, and low mood, does not have a single blood-based explanation. Testosterone at 18.8 is technically within the optimal range but sits at its very floor, and at 55 this leaves no margin. The suboptimal B12 at 284 may be contributing modestly to energy and mood. But the strongest candidates are the things blood cannot see: alcohol disrupting sleep architecture, possible caloric under-fuelling given a diet volume of 5 out of 10 against six training sessions per week, and the downstream effect of poor sleep on mood and libido. Improving these three, alcohol, sleep hygiene, and calorie adequacy, would be expected to produce the most noticeable improvements in how Stuart feels day to day.\n\nThe ESR at 36 is the one finding that does not fit neatly into the rest of the picture. CRP is low, immunoglobulins are within range, and there is no anaemia, so the usual explanations for a discordant ESR are not present. It may be a transient finding, but it warrants a repeat and, if persistent, further investigation to exclude a protein-driven cause. This is the item for his GP.\n\nThe remaining minor findings, the marginally low transferrin, the marginally low absolute reticulocyte count, the above-range MCH, the above-range folate and total antioxidant activity, are all easily explained by adequate iron stores, normal marrow variation, and good dietary or supplement intake respectively. None requires action.","lifestyle":"Reduce alcohol to under seven drinks per week, ideally under four, starting this week by nominating at least three alcohol-free days. Anchor: choose your three days now and mark them on the calendar. Why: alcohol is the most likely driver of your disrupted sleep and the mildly raised lipase of 68, and it suppresses testosterone overnight, which connects directly to your low libido.\nSet a fixed wake time seven days a week, within a 30-minute window, and get outside into daylight within the first hour. Anchor: alarm goes off, shoes go on, walk around the block before coffee. Why: a consistent wake time is the single most effective tool for improving sleep quality, and morning light sets the circadian clock that governs melatonin release at night.\nCut caffeine by 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, and afternoon caffeine fragments the deep sleep stages you are already losing to alcohol.\nIncrease your total food volume to match your training load. You are training six times per week on a diet volume of 5 out of 10, which means your body may not be getting enough fuel. Add an extra meal or a substantial snack on training days, aiming for around 2,400 to 2,600 calories on training days and 2,100 to 2,300 on rest days. Anchor: pack a post-training meal before your session so it is ready when you finish. Why: under-fuelling drives poor sleep, low mood and hormonal suppression.\nHit at least 130 grams of protein per day, spread across at least three meals, aiming for a palm-sized portion at each. Anchor: protein goes on the plate first, everything else fills the gaps. Why: at 85kg with six training sessions per week, 1.5 to 1.8 grams per kilogram supports recovery, muscle maintenance, and satiety.\nKeep a wind-down routine in the final hour before bed: dim lights, no screens, cool room at 18 degrees or below. Anchor: set a phone alarm one hour before your intended bedtime labelled 'wind down'. Why: your body needs the drop in light and temperature to trigger melatonin, and your current sleep difficulties suggest this transition is not happening.\nMaintain your current training split of three cardio and three resistance sessions. This is a strong programme and your metabolic results reflect it. If anything, ensure the resistance sessions are progressive, adding small amounts of weight or volume over time, as this supports testosterone production and long-term bone and metabolic health.\nAim for 8,000 to 10,000 steps daily on top of your formal training. You are already in this range, so the goal is consistency rather than increase.","flags":"ESR 36, three times the upper limit of 12. CRP is only 0.8, so this is a discordant elevation. Immunoglobulins and haemoglobin are normal. A repeat ESR in six to eight weeks is recommended. If persistent, consider plasma viscosity, fibrinogen and serum protein electrophoresis to investigate the cause.\nTotal bilirubin 40, nearly double the upper limit of 21, with all liver enzymes within range and normal albumin. This pattern is consistent with Gilbert's syndrome, a benign inherited variant. Should be recorded in his GP notes.\nLipase 68, above the upper limit of 60, with amylase 85 within range and no abdominal symptoms. Most likely related to alcohol intake above seven drinks per week. Monitor on retest.\nFIB-4 1.58, marginally above the 1.45 threshold. At 55, the age term inflates this score. GGT, APRI, NAFLD fibrosis score and albumin are all normal. This is a calculation-driven result rather than a sign of liver fibrosis. Worth recording; repeat in twelve months.\nC-Peptide 0.836 ug/L (approximately 277 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. In the context of fasting glucose 4.5, HbA1c 35 and HOMA-IR 0.54, this reflects low insulin demand due to excellent insulin sensitivity, not pancreatic insufficiency.\nTransferrin 2.1, marginally below the lower limit of 2.15, with ferritin 201 and saturation 39%. The liver is reducing transferrin production in response to adequate iron stores. Physiological, not pathological.\nAbsolute reticulocyte count 47.2, marginally below the lower limit of 50, with haemoglobin 155 and reticulocyte percentage 0.98%. Normal day-to-day marrow variation; no clinical significance.\nMCH 32.1, marginally above the upper limit of 32. Laboratory variation at this margin.\nB12 284, within the laboratory range but below the optimal threshold of 500. Recommend sublingual methylcobalamin supplementation.\nALT 35, within the laboratory range of below 56 but above the optimal threshold of below 30 for a man. GGT and all other liver markers are reassuring.\nReassuring negatives: thyroid function normal with negative antibodies, testosterone within range, PSA 0.28 with excellent free ratio, coeliac screen negative, all immunoglobulins within range, urinalysis clean, kidney function excellent, fasting glucose and HbA1c optimal, CRP 0.8, Lp(a) below 25, cardiovascular risk score 0 out of 100.\nNot returned by the laboratory: rheumatoid factor (pending), bacterial count (pending), urine culture and sensitivities (pending).","recommendations":"Discuss the ESR of 36 with your GP. Ask for a repeat ESR in six to eight weeks. If it remains elevated, the next steps would be a plasma viscosity, fibrinogen level, and potentially a serum protein electrophoresis. Bring this report or mention that CRP was only 0.8 and immunoglobulins were all within range, so the usual causes of raised ESR have been excluded.\nAsk your GP to record Gilbert's syndrome in your notes based on the bilirubin of 40 with entirely normal liver enzymes. This prevents repeated investigation on future tests.\nMention the FIB-4 of 1.58 to your GP for context. All other liver markers are normal, and the score is driven by the age term in the calculation. A repeat in twelve months is sufficient.\nMention the lipase of 68 to your GP, noting that amylase is 85 and there are no symptoms. This is most likely alcohol-related and should normalise with reduced intake.\nDiscuss your sleep difficulties, low libido and low mood with your GP. Your bloods do not reveal a hormonal or metabolic cause, but your GP may wish to explore sleep hygiene in more detail, consider a sleep study if symptoms persist, or discuss mood support options.\nWhen the pending results return (rheumatoid factor, urine culture), review them with your GP if anything is flagged.\nRetest in four to six months with ESR, full blood count, liver function including lipase, B12, and a fasting lipid panel to confirm the ESR trajectory, check the lipase response to any alcohol reduction, and verify B12 has responded to supplementation. Calorie target: 2,100 to 2,600 per day depending on training day. Protein target: 130 to 150 grams per day.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 micrograms daily, taken in the morning. Why: B12 at 284 is below the optimal threshold of 500, and improving this supports energy, mood and neurological function, all relevant to Stuart's reported symptoms.\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with a meal containing fat. Why: vitamin D is 93, within the optimal range, and this maintenance dose will keep it there through the winter months. Take with vitamin K2.\nVitamin K2: MK-7 form, 100 micrograms daily, taken alongside vitamin D3. Why: K2 directs calcium into bones and teeth rather than arteries, and should always accompany vitamin D supplementation.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 supports cardiovascular health, reduces inflammation, and has evidence for mood support, which aligns with Stuart's goals of improving mood and long-term health.\nMagnesium glycinate: 300 to 400 milligrams daily, taken before bed. Why: magnesium at 1.08 is within range but glycinate is the form best evidenced for sleep quality, and Stuart reports poor sleep as his primary symptom.\nDO NOT take iron supplements. Ferritin is 201, at the ceiling of the optimal range, and transferrin saturation is 39%. Additional iron would risk pushing stores into the excess range.\nThe most important changes from this report are not supplements. They are reducing alcohol to under four drinks per week, fixing a consistent wake time with morning daylight, and increasing total food intake to match the training load of six sessions per week.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7917","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 95 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 94.5; no cap applied; final 95.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"47.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3983","lower_normal":"","upper_normal":"60","lower_optimal":"","upper_optimal":"55","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4583","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Scor produced albumin and immune-produced globulin.","low_causes":"Liver disease, chronic inflammation, immune overactivation","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. Stuart's result of 67 is within the optimal range, indicating no bile duct obstruction or bone turnover abnormality.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells break down, processed by the liver and excreted in bile. Stuart's result of 40 is nearly double the upper limit of 21. However, every other liver marker, GGT, ALP, ALT, AST and albumin, is within the laboratory range, and there are no signs of liver disease. This pattern is characteristic of Gilbert's syndrome, a harmless inherited variation affecting roughly 5 to 10% of the population. It causes the liver to process bilirubin more slowly, leading to a persistently elevated level. It does not progress, does not need treatment, and is important to record in medical notes to prevent unnecessary investigation in the future.","low_causes":"Normal variation","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3125","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. Stuart's result of 35 is within the laboratory range of below 56 but above the tighter optimal threshold of below 30 for a man. This mild elevation can be influenced by alcohol intake, intense exercise (particularly the day before testing), or simply sitting at the higher end of normal. With GGT at an excellent 12 and all other liver markers healthy, there is no suggestion of significant liver strain, but it is worth monitoring on retest.","low_causes":"Normal variation, B6 deficiency","high_causes":"Liver disease, alcohol, medication (including statins), obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. Unlike ALT, which is more specific to the liver, AST can be released during exercise-related muscle damage. Stuart's result of 41 is within the laboratory range of 13 to 45 but above the optimal ceiling of 35. Given his three resistance training sessions per week, muscle turnover is a likely contributor alongside the mild alcohol effect. His CK at 291 confirms muscle activity, which supports this interpretation.","low_causes":"Normal variation, B6 deficiency","high_causes":"Liver disease, muscle damage, intense exercise, alcohol, heart disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0822","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"GGT is the liver enzyme most sensitive to alcohol and metabolic strain. Stuart's result of 12 is well within the optimal range of below 25, which is particularly noteworthy for someone reporting more than seven alcoholic drinks per week. This tells us the liver is currently handling the alcohol load without visible metabolic stress, though this does not mean there is no effect on other systems such as sleep architecture and the pancreas.","low_causes":"Normal variation","high_causes":"Alcohol excess, liver disease, bile duct obstruction, metabolic syndrome, medication","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"1.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2959","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 combines age, AST, ALT and platelet count to estimate the risk of liver fibrosis (scarring). Stuart's result of 1.58 is marginally above the 1.45 threshold. However, at 55, the age term in the numerator significantly inflates this score. His GGT at 12, APRI at 0.424, NAFLD fibrosis score at minus 1.764, and normal albumin all argue strongly against liver fibrosis. The score is being driven by the calculation rather than by any sign of liver disease. It is worth mentioning to his GP for context, and a repeat in twelve months would confirm stability.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.424","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1413","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"APRI is calculated from AST and platelet count to estimate liver fibrosis risk. Stuart's result of 0.424 is within the optimal range of below 0.5, indicating a low probability of significant liver scarring. This is reassuring and, combined with the normal GGT and albumin, provides strong evidence against liver fibrosis despite the marginally elevated FIB-4.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-1.764","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4927","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD fibrosis score uses age, BMI, diabetes status, ALT, AST, platelets and albumin to estimate the risk of advanced fibrosis in people with fatty liver. Stuart's result of minus 1.764 is within the optimal range, firmly excluding advanced fibrosis. This provides additional reassurance alongside the APRI score and normal liver markers.","low_causes":"Healthy liver, younger age, normal BMI","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio compares AST to ALT. Stuart's result of 1.17 is within the optimal range of 0.8 to 1.3. A ratio above 2 can suggest alcoholic liver disease or advanced fibrosis, while a ratio below 1 is more common in non-alcoholic fatty liver. Stuart's ratio of 1.17 is in the healthy middle ground, consistent with the mild exercise-related AST elevation contributing.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amy","name":"Amylase","group":"DIGESTIVE","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5379","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands to break down starch. Stuart's result of 85 is within the optimal range, confirming healthy pancreatic function. This is reassuring alongside the mildly elevated lipase.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"DIGESTIVE","result":"68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. Stuart's result of 68 is above the upper limit of 60. However, a mild elevation like this, just 13% above range, in the absence of abdominal pain or nausea and with a normal amylase of 85, is most likely a benign finding. Regular alcohol intake above seven drinks per week is the most common explanation for a mild, asymptomatic lipase rise. Reducing alcohol to under seven, ideally under four, drinks per week would be expected to bring this back into range.","low_causes":"Normal variation","high_causes":"Pancreatitis, alcohol, gallstones, medication, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4151","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the combined amount of all cholesterol types in the blood. Stuart's result of 4.3 is within the desirable range of below 5.18, reflecting the positive effect of his statin therapy combined with good metabolic health. Total cholesterol alone is less informative than the breakdown into LDL, HDL and triglycerides, all of which are excellent.","low_causes":"Malnutrition, hyperthyroidism, liver disease, very low-fat diet","high_causes":"Diet, genetics, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2529","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, primarily influenced by recent food intake, alcohol, sugar and refined carbohydrates. Stuart's result of 0.86 is within the optimal range of below 1.0, indicating excellent fat metabolism. Low triglycerides alongside high HDL is a particularly strong metabolic signal.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism","high_causes":"High sugar/alcohol intake, obesity, insulin resistance, hypothyroidism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL is the cholesterol fraction that carries triglycerides from the liver to tissues. Stuart's result of 0.39 is within the optimal range, consistent with his low triglycerides and healthy metabolic profile.","low_causes":"Low-fat diet, very low triglycerides","high_causes":"High triglycerides, insulin resistance, obesity, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6071","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective cholesterol that removes excess cholesterol from artery walls and carries it back to the liver for disposal. Stuart's result of 1.7 is well above the optimal floor of 1.4 for a man. This is an outstanding HDL level and is one of the strongest cardiovascular protective factors in this report.","low_causes":"Smoking, obesity, sedentary lifestyle, poor diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetics, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3717","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5733","units":"mmol/L","description":"LDL is the cholesterol fraction that deposits in artery walls and drives atherosclerosis. Stuart's result of 2.23 is within the optimal range of below 2.6, well managed by his statin therapy. For a man on a statin with cardiovascular prevention as a goal, this is an excellent result.","low_causes":"Statin therapy, very low-fat diet, hyperthyroidism, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.53","within_normal":"TRUE", rol is calculated by subtracting HDL from total cholesterol and captures all the potentially harmful cholesterol fractions in one number. Stuart's result of 2.6 is within the optimal range, confirming that his atherogenic cholesterol load is well controlled by statin therapy and metabolic health.","low_causes":"Statin use, very low-fat diet","high_causes":"High LDL, high triglycerides, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7292","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and drives the protective reverse cholesterol transport process. Stuart's result of 1.75 is above the optimal floor of 1.4, reflecting excellent protective cholesterol function consistent with his high HDL.","low_causes":"Genetic factors, smoking, obesity, sedentary lifestyle","high_causes":"Exercise, moderate alcohol, genetics, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic (artery-damaging) lipoprotein particle, including LDL, VLDL and Lp(a). It is considered the single best measure of cardiovascular risk from lipoproteins because it counts the actual number of harmful particles rather than just the cholesterol they carry. Stuart's result of 0.67 is below the optimal target of 0.8 and well below the desirable limit of 0.9. This is an excellent result, reflecting the combined benefit of his statin therapy and healthy metabolic profile.","low_causes":"Statin therapy, low-fat diet, hyperthyroidism","high_causes":"Familial hypercholesterolaemia, obesity, insulin resistance, high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.382857","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2732","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful cholesterol particles (ApoB) to protective ones (ApoA1). Stuart's result of 0.38 is deep in the low-risk zone, below the optimal threshold of 0.5. This is one of the best composite lipid markers in the panel and confirms an excellent balance of harmful and protective cholesterol.","low_causes":"Statin therapy, high HDL, healthy lifestyle","high_causes":"High LDL, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often called Lp little-a, is a genetically determined cholesterol particle that independently increases cardiovascular risk by depositing cholesterol, promoting clotting and driving inflammation. Unlike LDL, Lp(a) cannot be changed by diet or exercise and is almost entirely inherited. Stuart's result of below 25 is within the normal range of below 32, which is genuinely useful information. It means his already-excellent lipid profile is not being masked by a hidden genetic risk factor, and that his LDL and ApoB levels reflect modifiable factors only. This result only needs to be tested once as it does not change over a lifetime.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited risk), cannot be changed by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1700","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful marker of insulin resistance and metabolic health. Stuart's result of 0.51 is well within the optimal range of below 0.87, indicating excellent metabolic function and very low insulin resistance. This aligns with his outstanding HOMA-IR of 0.54.","low_causes":"Excellent metabolic health, low triglycerides, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high triglycerides, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is what remains after subtracting HDL and LDL   if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
