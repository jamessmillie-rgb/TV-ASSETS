ually declining. The lab result of 3.9 umol/L converts to approximately 1,437 ug/dL, which is within the optimal range and reflects healthy adrenal output at age 25.","low_causes":"Adrenal insufficiency, chronic stress, ageing","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4786","lower_normal":"59","upper_normal":"619","lower_optimal":"80","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3708","upper_optimal_position":"0.6214","units":"uIU/ml","description":"Prolactin is produced by the pituitary gland and is best known for its role in breast milk production, but it also influences mood, immune function, and reproductive health. Bethany's prolactin at 140 is within the optimal range for a non-pregnant woman.","low_causes":"Pituitary hypofunction, dopamine agonist medications","high_causes":"Prolactinoma, medications (antipsychotics, antidepressants), stress, hypothyroidism, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"50.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4308","lower_normal":"27.8","upper_normal":"146","lower_optimal":"30","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6115","units":"nmol/l","description":"SHBG is a protein that binds to testosterone and oestradiol, controlling how much of each hormone is available for the body to use. Higher SHBG means less free hormone. Bethany's SHBG at 50.6 is within the optimal range, allowing an appropriate amount of free testosterone and oestradiol.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Oral contraceptives, hyperthyroidism, liver disease, ageing, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.011","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0.005","upper_normal":"0.035","lower_optimal":"0.008","upper_optimal":"0.030","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6111","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone not bound to proteins, making it biologically active. Bethany's calculated free testosterone at 0.011 is within the optimal range for women.","low_causes":"High SHBG, low total testosterone, oral contraceptives","high_causes":"PCOS, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"pmol/l","description":"FT4 is the inactive form of thyroid hormone that circulates in the blood. The thyroid releases T4, which is then converted to the active form T3 in the tissues. Bethany's FT4 at 17.2 is within the optimal range of 14 to 20, indicating adequate thyroid hormone production.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3458","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3773","upper_optimal_position":"0.4547","units":"mIU/l","description":"TSH is produced by the pituitary gland to signal the thyroid to produce hormones. When the thyroid is underactive, TSH rises to push it harder. When the thyroid is overactive, TSH falls. Bethany's TSH at 0.84 is within the laboratory range but below the optimal range of 1.0 to 2.5. However, with FT4 and FT3 both within range and both thyroid antibodies negative, this is a normal variant rather than a thyroid problem.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4593","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4704","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3 is the active thyroid hormone that drives metabolism, energy production, and body temperature. It is converted from T4 in the tissues. Bethany's FT3 at 4.3 is within the laboratory range but below the optimal threshold of 4.5. In someone training very heavily with a diet volume of only 5 out of 10, the body may reduce T4-to-T3 conversion as an energy-conserving mechanism. Increasing caloric intake would be expected to support better conversion.","low_causes":"Low energy availability, calorie restriction, chronic stress, illness, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as seen in Hashimoto's thyroiditis. Bethany's TPO antibodies below 6.6 are well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"Normal finding (no autoimmune thyroid activity)","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein produced by the thyroid gland. Elevated levels suggest autoimmune thyroid activity. Bethany's thyroglobulin antibodies below 1.3 are undetectable, which is normal and seen in over 80% of the population.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5611","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin in response to sunlight and is notoriously difficult to maintain through diet alone, especially in the UK. Bethany's vitamin D at 101 is within the optimal range of 75 to 120, which is an excellent result.","low_causes":"Insufficient sun exposure, dark skin, obesity, malabsorption, northern latitude","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"0.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2630","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3378","upper_optimal_position":"0.5556","units":"pmol/L","description":"PTH is produced by four small glands behind the thyroid and regulates calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. Bethany's PTH at 0.7 is below the lower limit of 0.98, but with corrected calcium at 2.36 (normal), vitamin D at 101 (optimal), and magnesium at 0.9 (optimal), the parathyroid glands simply do not need to produce much PTH. This is likely a physiologically appropriate suppression rather than a disease process. It should be noted on her GP record for future reference.","low_causes":"Adequate calcium and vitamin D suppressing PTH, hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"305","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3809","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5564","upper_optimal_position":"0.6228","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and mood regulation. It is found primarily in animal products. Bethany's B12 at 305 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Given her symptoms of hair thinning and her goal of improving mood, and given the suppressed reticulocyte count, optimising B12 with sublingual methylcobalamin supplementation would be worthwhile.","low_causes":"Vegetarian or vegan diet, malabsorption (coeliac, Crohn's), pernicious anaemia, low dietary intake","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in red blood cell production and DNA synthesis. It is found in leafy green vegetables, legumes, and fortified foods. Bethany's folate at 8 sits right at the lower edge of the optimal threshold. With her diet volume at 5 out of 10, increasing vegetable intake would naturally improve this. Folate is also important for women of childbearing age for neural tube prevention.","low_causes":"Low vegetable intake, malabsorption, coeliac disease, alcohol, certain medications","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"257","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7340","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6286","units":"U/L","description":"Creatine kinase is an enzyme found primarily in muscle tissue. It leaks into the bloodstream when muscle fibres are damaged, which happens naturally during resistance training. Bethany's CK at 257 is above the female upper limit of 200 but well within the expected range for someone doing five or more resistance sessions per week. If she trained within 48 hours of the blood draw, this result is entirely explained by her training. No action needed.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myositis, statin medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7107","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the overall antioxidant capacity of the blood, reflecting dietary antioxidant intake and the body's defence against oxidative stress. Bethany's TAA at 1.87 is above the upper limit of 1.77, which is typically driven by high intake of antioxidant-rich foods such as berries, green tea, dark chocolate, or antioxidant supplements. This is not a clinical concern.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"High antioxidant food intake, supplementation (vitamin C, E, polyphenols)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"14.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6211","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5789","units":"g/l","description":"IgG is the most abundant immunoglobulin in the blood and the backbone of the immune system's memory. It provides long-term protection against infections the body has previously encountered. Bethany's IgG at 14.7 is towards the upper end of its range of 6.5 to 16. This could reflect recent immune activation, which is consistent with her note about possible recent glandular fever. It is within range and not a concern.","low_causes":"Immune deficiency, certain medications, protein-losing conditions","high_causes":"Chronic infection, autoimmune disease, liver disease, recent infection recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/l","description":"IgM is the first antibody the immune system produces in response to a new infection. Elevated IgM suggests a recent or active infection. Bethany's IgM at 0.7 is at the lower end of the range, which is normal and does not suggest an active new infection.","low_causes":"Normal variation, immune deficiency","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Ig _position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Bethany's RF at 5 is well within the normal range of below 14, making rheumatoid arthritis unlikely.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, other autoimmune conditions, chronic infections","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1113","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the lining of the small intestine, causing bloating, malabsorption, and other digestive symptoms. Bethany's result at 1.6 is negative (below 7.19), which effectively rules out coeliac disease as a cause of her bloating, provided she has been eating gluten regularly in the weeks before the test. Her IgA at 2.1 confirms the test is reliable.","low_causes":"Normal finding (no coeliac disease)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"12.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1757","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer, function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
