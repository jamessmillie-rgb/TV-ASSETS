<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Bethany Dale","dob":"13/07/2001","report_date":"2026-08-14","summary":"Bethany is a 25-year-old female presenting with a BMI of 21.1, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. She trains eight or more times per week, with three cardio sessions and five or more resistance sessions, alongside 7,500 to 10,000 daily steps. She reports no medications and engages in very high-intensity exercise or bodybuilding. She reports bloating and digestive discomfort, hair thinning, and skin breakouts. Her goals are to build muscle, improve mood, and improve digestion and gut health. She notes that she may have had glandular fever recently, with inconclusive results, though she does not feel unwell.\n\nThere are two findings in this report that warrant a conversation with her GP. The first is her reticulocyte count, which measures how quickly the bone marrow is producing new red blood cells. Her reticulocyte percentage is 0.36, below the lower limit of 0.5, and her absolute reticulocyte count is 16.5, well below the lower limit of 50. This means her bone marrow is producing new red blood cells at a significantly reduced rate. Despite this, her actual red blood cell indices are excellent. Her haemoglobin is 144, her MCV (the size of each red cell) is 91.9, and her MCH (the amount of haemoglobin packed into each cell) is 31.5, all sitting comfortably within their ranges. So the body is not yet anaemic and the cells it has made are healthy, well-sized, and well-filled. The question is why the production line has slowed. In a 25-year-old woman training at this intensity on a diet volume of only 5 out of 10, the most likely explanation is that overall energy intake is too low to fully support all the body's demands, and red cell production is one of the functions that gets quietly downgraded. The recent possible glandular fever, caused by Epstein-Barr virus, could also be contributing, as viral infections can temporarily suppress bone marrow output. The GP should be aware of this finding, and a repeat full blood count and reticulocyte count in six to eight weeks would help determine whether it is resolving or persistent.\n\nThe second finding for the GP is her creatinine, which at 103 is above the upper limit of 90, giving a creatinine-based eGFR of 65. At face value this looks like reduced kidney function. However, creatinine is a breakdown product of muscle, and in a lean 25-year-old woman doing five or more resistance sessions per week with very high-intensity training, her muscle mass is almost certainly generating more creatinine than the standard equation expects. This is exactly the situation where Cystatin C, an alternative kidney marker that is not affected by muscle mass, becomes essential, and her Cystatin C is a reassuring 0.81, well within range, giving a Cystatin C-based eGFR of 89. This strongly suggests that her kidneys are functioning well and the raised creatinine is simply a reflection of her training. The GP should note this distinction so that the elevated creatinine is not misinterpreted in future blood tests. Her urea at 9.1, marginally above the upper limit of 8.2, fits the same picture. High protein intake from resistance training and the higher muscle turnover both raise urea. With the Cystatin C eGFR at 89, this is not a kidney concern.\n\nWith those findings addressed, there is a great deal of positive news in this report. Bethany's cardiovascular risk profile is outstanding. Her total cholesterol of 5.5 sits just above the desirable threshold of 5.18, but the composition underneath it is what matters, and the composition is excellent. Her HDL, the protective cholesterol that removes excess cholesterol from artery walls, is 2.5, which is exceptionally high and far above the desirable threshold of 1.55. Her triglycerides are 0.55, well below the ideal target of 1.0, reflecting excellent insulin sensitivity and metabolic health. Her LDL, the cholesterol particle most associated with arterial plaque, is 2.77, within the laboratory range of 0.5 to 3.0. Her ApoB, a direct count of the number of potentially harmful cholesterol particles in the blood, is 0.66, comfortably below the desirable threshold of 0.9 and also below the optimal threshold of 0.8. Her ApoB to ApoA1 ratio, the single best summary of cardiovascular lipid risk, is 0.36, well within the lower-risk category of below 0.6. Her Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk and cannot be changed through diet or lifestyle, is below 25, within the normal range. This is genuinely useful information because it means she has no inherited lipid risk factor to worry about. Her remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.23, well below the optimal threshold of 0.5, and her TG to HDL ratio is 0.22, which is exceptional. Her hs-CRP, the most sensitive marker of systemic inflammation in the body, is 0.2, about as low as this marker gets. This tells us there is no inflammatory process driving disease risk anywhere in the body, and it is also reassuring in the context of her possible recent glandular fever, suggesting that any viral activity is not producing a significant inflammatory response.\n\nHer liver is in excellent health. ALT at 30 is within the laboratory range and just at the female optimal threshold, AST at 35 is well within range, GGT at 22 is within the optimal range of below 25, and bilirubin, alkaline phosphatase, albumin, and total protein are all normal. Her FIB-4 score, a composite marker that screens for liver fibrosis, is a reassuring 0.83. Amylase and lipase, markers of pancreatic function, are both comfortably within range, which is relevant given her digestive symptoms, as it rules out pancreatic inflammation as a cause of her bloating.\n\nHer thyroid is working well. TSH at 0.84, FT4 at 17.2, and FT3 at 4.3 are all within their respective ranges, and both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. FT3 at 4.3 is below the optimal range of 4.5 to 6.5, and in a heavily training individual with a diet volume of only 5 out of 10, this may reflect the body's tendency to reduce the conversion of T4 to the active T3 form when energy availability is low. This is not a thyroid disease but rather a metabolic downregulation, and increasing caloric intake would be expected to improve it.\n\nHer immune system markers are all within range. IgG at 14.7 is towards the upper end of its range of 6.5 to 16, which could reflect recent immune activation consistent with the possible glandular fever. IgA, IgM, and IgE are all normal. Rheumatoid factor is negative, and tissue transglutaminase IgA is negative, effectively ruling out coeliac disease as a cause of her bloating and digestive symptoms, provided she has been eating gluten regularly. Her white cell count at 7.36 is healthy, and her differential, including neutrophils at 5.17 and lymphocytes at 1.81, is well balanced. Her ESR, a non-specific marker of inflammation, is a reassuring 4.\n\nHer iron studies are reassuring. Ferritin at 61 is within the optimal range of 40 to 150 for a woman, serum iron at 17.2 is healthy, and transferrin saturation at 25 percent sits right at the lower edge of the optimal range. This is a woman who is managing to maintain adequate iron stores despite heavy training and menstruation, which is genuinely positive. Her corrected calcium at 2.36 is normal, and her magnesium at 0.9 is within the optimal range of 0.85 to 1.05, which is impressive for someone training at this intensity. Her vitamin D at 101 is within the optimal range of 75 to 120, so whatever she is currently doing, whether sun exposure or supplementation, is working well.\n\nHer insulin at 1.82 is below the laboratory lower limit of 2.6, and her C-Peptide at 0.543, which converts to approximately 180 pmol/L, is below the lower limit of 1.1 ug/L (approximately 364 pmol/L). Her HOMA-IR, a calculated measure of insulin resistance, is 0.36, below the range floor of 0.5 but in the favourable direction. With a fasting glucose of 4.5 and an HbA1c of 36, both within their optimal ranges, this pattern does not suggest pancreatic failure. Instead, it reflects a body that requires very little insulin to manage its blood sugar, which is a sign of exceptional insulin sensitivity. In a lean, heavily training 25-year-old eating a moderate diet volume, the pancreas simply does not need to work hard. This is metabolically favourable, not a concern.\n\nHer PTH (parathyroid hormone, which regulates calcium and bone metabolism) at 0.7 is below the lower limit of 0.98. However, her corrected calcium at 2.36 is normal, her vitamin D at 101 is healthy, and her magnesium at 0.9 is within range. When calcium and vitamin D are both adequate, the parathyroid glands do not need to produce as much PTH, and the low reading likely reflects suppression in response to adequate calcium and good vitamin D status. This is physiologically appropriate rather than pathological, but it is worth noting for the GP record.\n\nHer hormones paint a clear picture. Oestradiol at 150, progesterone at 1.12, LH at 3.07, and FSH at 6.53 are all consistent with the follicular phase of her menstrual cycle, which is the phase before ovulation. Testosterone at 0.8 is within the female range of 0.5 to 2.6, and her free androgen index at 1.58 is healthy. DHEA-S at 3.9 umol/L (approximately 1,437 ug/dL) is within range. SHBG at 50.6 is within range, and prolactin at 140 is normal. Her cortisol at 421 is within the morning reference range, though towards the mid to upper portion. In someone training at very high intensity, cortisol can be chronically elevated, and while this reading is not abnormal, it is worth noting alongside the overall picture of a body under significant training stress.\n\nHer creatine kinase (CK), a marker of muscle breakdown, is 257, above the upper limit of 200. In someone doing five or more resistance sessions per week with very high-intensity training, this is expected and simply reflects the muscle damage and repair cycle that drives muscle growth. If she trained within 48 hours of the blood draw, this result is entirely explained by her training. It is not a concern.\n\nHer vitamin B12 at 305 is within the laboratory range but below the optimal threshold of 500. At this level, stores are adequate but not robust, and given her goals of improving mood and her symptoms of hair thinning, optimising B12 would be worthwhile. Her folate at 8 sits right at the optimal threshold, and given her diet volume of 5 out of 10, there is room to improve this through both dietary intake and supplementation.\n\nHer total antioxidant activity at 1.87 is above the upper limit of 1.77. This is typically driven by antioxidant-rich foods or supplements and is not a clinical concern.\n\nHer urine analysis is largely unremarkable. Protein, glucose, ketones, urobilinogen, casts, white cells, red cells, and nitrites are all negative. However, the culture has returned a moderate growth of Enterococcus faecalis. The lab has noted that the sample was received in a plain bottle without boric acid, which can allow bacterial overgrowth during transit, meaning the result may not reflect what was truly present in the bladder. With no white cells, no nitrites, and no urinary symptoms reported, this most likely represents contamination rather than a true urinary tract infection. If Bethany develops any urinary symptoms such as burning, frequency, or urgency, a repeat mid-stream urine in a boric acid bottle would be appropriate. The antibiotic sensitivities have been reported for completeness and show the organism is sensitive to ciprofloxacin, vancomycin, linezolid, teicoplanin, and tigecycline, but treatment is not indicated in the absence of symptoms.\n\nReturning to Bethany's symptoms and goals, there is an important thread running through this report. She is training at a very high level, eight or more sessions per week, but eating at a volume of only 5 out of 10. Her reticulocytes are suppressed. Her FT3 is below optimal. Her insulin and C-Peptide are below range, reflecting a body running on minimal fuel. Her CK is elevated from training load. Her B12 is below optimal. Taken together, these findings are consistent with a pattern sometimes called relative energy deficiency, where the body is not receiving enough total energy to support both its training demands and all its background maintenance functions. The body prioritises the immediate demands of exercise and allows other processes, such as red cell production and thyroid hormone conversion, to idle. This is the single most important finding in the context of her goals. Building muscle requires a caloric surplus, and her current intake appears to be insufficient even for maintenance at her training volume. Addressing this one factor, eating more, is likely to improve her energy, her mood, her hair quality, and her body's capacity to build and recover from training. Her digestive symptoms of bloating may be partly related to gut motility changes under high training stress and low energy availability, though food intolerances and fibre intake should also be explored. The negative coeliac screen is reassuring in this context. Her skin breakouts may relate to hormonal fluctuations during her cycle, training-induced cortisol, or dietary factors, and are worth discussing with a dermatologist if they persist despite dietary improvements.","links":"The single most impactful change Bethany can make is to increase her daily caloric intake. At 54 kg, 160 cm, and her current training volume of eight or more sessions per week plus 7,500 to 10,000 steps, her estimated maintenance calorie requirement is approximately 2,100 to 2,300 calories per day using a very active multiplier. To support muscle growth, she should aim for a modest surplus of 200 to 300 calories above maintenance, targeting approximately 2,300 to 2,600 calories per day. Her current diet volume of 5 out of 10 suggests she is likely eating significantly below maintenance, which explains the suppressed reticulocytes, below-optimal FT3, and low insulin and C-Peptide. Protein intake should be 86 to 108 grams per day, based on 1.6 to 2.0 grams per kilogram of body weight, to support the muscle-building goal. She should distribute this across at least four meals, with 20 to 30 grams per meal, to maximise muscle protein synthesis.\n\nFor her digestive symptoms, given that coeliac disease has been ruled out, she should consider keeping a brief food diary for two to three weeks to identify whether specific foods trigger her bloating. Common culprits include high-FODMAP foods such as onions, garlic, wheat, apples, and certain dairy products. Increasing dietary fibre gradually, rather than suddenly, can also help, as can ensuring adequate hydration, aiming for at least 2 litres of water per day. Fermented foods such as natural yoghurt, kefir, or sauerkraut may support gut health, though they should be introduced slowly.\n\nFor her hair thinning, the most likely contributors in this report are the relative energy deficiency and the below-optimal B12. Her ferritin at 61 is adequate for hair health, so iron is not the issue. Increasing overall calorie and protein intake is the first-line intervention. If hair thinning persists after three months of improved nutrition, a referral to a dermatologist for trichoscopy would be appropriate.\n\nFor her skin breakouts, her hormonal profile does not show elevated androgens or an abnormally high free androgen index, so hormonal acne in the classic sense is less likely. Training-induced cortisol spikes, sweat occlusion during long gym sessions, and dietary factors are worth considering. Showering promptly after training, using a gentle non-comedogenic cleanser, and reviewing dairy intake (which some evidence associates with acne) are practical steps.\n\nShe should bring the following to her GP: the suppressed reticulocyte count (0.36 percent, absolute 16.5) for review, with a repeat full blood count and reticulocytes in six to eight weeks. She should mention the raised creatinine (103) and explain that the Cystatin C eGFR of 89 suggests this is muscle-mass driven, so the GP can note this on her record for future reference. The low PTH (0.7) should also be recorded, with the context that calcium and vitamin D are both normal. The urine culture showing moderate Enterococcus faecalis growth in a plain bottle with no symptoms should be noted, with a repeat in a boric acid bottle only if urinary symptoms develop.\n\nA retest of the full blood count, reticulocytes, B12, and folate in eight to ten weeks would be appropriate to confirm the reticulocyte count is improving with increased nutrition. If it has not improved, further investigation of the bone marrow's output would be warranted. The possible glandular fever is worth mentioning to the GP, as an EBV antibody panel (VCA IgG, VCA IgM, and EBNA) could clarify whether she has had a recent or past infection, which would help explain the reticulocyte suppression and the elevated IgG.","flags":"GP FINDINGS:\n\n1. Reticulocyte count suppressed: 0.36% (range 0.5-2.5), absolute reticulocytes 16.5 (range 50-100). Red cell indices are all normal (Hb 144, MCV 91.9, MCH 31.5), so this is reticulocytopenia without anaemia. Most likely low energy availability or post-viral marrow suppression in the context of possible recent glandular fever. Recommend repeat FBC and reticulocytes in 6-8 weeks. If persistent, reticulocyte production index and further marrow assessment warranted.\n\n2. Creatinine 103 umol/L (range 49-90), creatinine-based eGFR 65. Cystatin C 0.81 (range <1.1), Cystatin C-based eGFR 89. Discrepancy is explained by high muscle mass from intensive resistance training. True renal function is likely reflected by the Cystatin C eGFR. Recommend noting on patient record to avoid future misinterpretation. Urea 9.1 (range 3.2-8.2) is consistent with high protein turnover from training.\n\n3. PTH 0.7 pmol/L (range 0.98-4.73) with corrected calcium 2.36 (normal), vitamin D 101 (optimal), and magnesium 0.9 (normal). Likely physiological suppression from adequate calcium and vitamin D status. No action needed unless calcium becomes elevated on future testing.\n\n4. Urine culture: moderate growth Enterococcus faecalis. Plain bottle (no boric acid). No WBCs, no nitrites, no symptoms. Likely contamination or overgrowth artefact. Repeat in boric acid bottle only if urinary symptoms develop. Sensitivities noted for reference.\n\nOTHER FLAGGED RESULTS:\n\n5. Insulin 1.82 mIU/L (range 2.6-24.9) and C-Peptide 0.543 ug/L (range 1.1-4.4), HOMA-IR 0.36 (range 0.5-1.5). Glucose 4.5 and HbA1c 36 are both optimal. Pattern reflects exceptional insulin sensitivity in a lean, active individual rather than pancreatic insufficiency.\n\n6. Basophils 0.01 (range 0.02-0.1). Isolated minimally low basophils are clinically insignificant.\n\n7. CK 257 U/L (range 25-200). Expected in the context of 5+ resistance sessions per week. Not rhabdomyolysis (no renal impairment on Cystatin C, no myoglobinuria).\n\n8. Total cholesterol 5.5 (desirable <5.18). Driven by exceptionally high HDL of 2.5. ApoB 0.66, LDL 2.77, TG 0.55, ApoB/A1 ratio 0.36. Cardiovascular risk profile is excellent.\n\n9. TAA 1.87 (range 1.3-1.77). Likely dietary or supplemental antioxidant intake. Not clinically significant.\n\nReassuring negatives: hs-CRP 0.2 (no systemic inflammation), Lp(a) <25 (no inherited lipid risk), coeliac screen negative, thyroid antibodies negative, all tumour markers within range (CA-125 12.3, CA 15-3 14.43, CA 19-9 5.65, CEA 0.65), liver function excellent (FIB-4 0.83, GGT 22, ALT 30, AST 35), pancreatic enzymes normal, iron stores adequate (ferritin 61), vitamin D optimal (101), ESR 4, urinalysis negative for protein, glucose, blood, and nitrites.","recommendations":"1. Increase daily caloric intake to 2,300 to 2,600 calories per day to support training demands and muscle-building goals. Current intake appears insufficient for the training volume, which is the most likely driver of the suppressed reticulocytes and below-optimal FT3.\n\n2. Ensure protein intake of 86 to 108 grams per day (1.6 to 2.0 g/kg), distributed across at least four meals with 20 to 30 grams per serving.\n\n3. Book a GP appointment to discuss the suppressed reticulocyte count and request a repeat full blood count with reticulocytes in six to eight weeks. Mention the possible glandular fever and consider an EBV antibody panel to clarify.\n\n4. Inform the GP that the raised creatinine is likely muscle-mass driven, supported by the normal Cystatin C eGFR of 89, so this can be documented for future reference.\n\n5. Begin sublingual methylcobalamin B12 supplementation at 1,000 mcg daily to bring B12 from 305 towards the optimal range of 500 to 900.\n\n6. Keep a food diary for two to three weeks to identify bloating triggers. Consider a low-FODMAP trial if no obvious culprit emerges. Introduce fermented foods gradually.\n\n7. Maintain current vitamin D intake, as the level of 101 is optimal. Continue whatever supplementation or sun exposure is achieving this.\n\n8. No action needed on the urine culture unless urinary symptoms develop. If symptoms occur, request a repeat mid-stream urine in a boric acid bottle.\n\n9. Retest full blood count, reticulocytes, B12, and folate in eight to ten weeks to confirm improvement with increased nutrition.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Bethany's B12 at 305 is within the laboratory range but below the optimal threshold of 500. B12 is essential for red blood cell production, nerve function, and mood regulation, all of which are relevant to her goals and symptoms. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets.\n\nVitamin D3: maintain current intake. Her vitamin D at 101 is within the optimal range of 75 to 120. If she is supplementing, she should continue at her current dose. If this level is from sun exposure alone, she should consider adding 1,000 to 2,000 IU of cholecalciferol daily through the autumn and winter months when UVB exposure drops. Vitamin D should always be taken with a meal containing fat.\n\nVitamin K2: MK-7 form, 100 mcg daily, taken with her vitamin D. K2 directs calcium into bones and teeth and away from arteries. It works synergistically with vitamin D and is a sensible companion supplement.\n\nMagnesium: magnesium glycinate, 300 mg before bed. Her magnesium at 0.9 is within the optimal range, but at her training volume, ongoing supplementation supports muscle recovery, sleep quality, and the hundreds of enzymatic reactions magnesium is involved in. Glycinate is the best-tolerated form and has a mild calming effect that supports sleep.\n\nOmega-3: high-quality fish oil providing 2 grams of combined EPA and DHA daily, taken with food. While her inflammatory markers are excellent, omega-3 supports recovery from high-intensity training, joint health, mood (relevant to her goal of improving mood), and skin health (relevant to her breakouts). EPA in particular has evidence for mood support.\n\nA daily probiotic containing Lactobacillus and Bifidobacterium strains may support her digestive symptoms. Evidence is mixed, but in the context of bloating without coeliac disease, a four to six week trial is reasonable.\n\nShe should NOT supplement iron. Her ferritin at 61 is within the optimal range for a woman, and unnecessary iron supplementation can cause gastrointestinal symptoms that would worsen her bloating.\n\nThe most important changes from this report are not supplements. They are eating significantly more food, particularly protein, to match her extraordinary training volume, and seeing her GP to discuss the suppressed reticulocyte count.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. It is the body's primary fuel source, and healthy levels indicate that the pancreas is producing the right amount of insulin and the cells are responding to it properly. Bethany's glucose at 4.5 is within the optimal range of 4.0 to 5.4, reflecting well-controlled blood sugar regulation.","low_causes":"Prolonged fasting, excessive exercise, reactive hypoglycaemia, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, high carbohydrate intake, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose permanently attached to it, providing a picture of average blood sugar over the past two to three months. A result below 6.0% is considered normal. Bethany's result of 5.4% confirms excellent long-term blood sugar control.","low_causes":"Low carbohydrate diet, high red cell turnover","high_causes":"Pre-diabetes, diabetes, high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in SI units. Below 42 is normal, 42 to 47 is pre-diabetes, and above 48 indicates diabetes. Bethany's result of 36 is within the optimal range, confirming excellent glucose control over the past two to three months.","low_causes":"Low carbohydrate diet, high red cell turnover","high_causes":"Pre-diabetes, diabetes, high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2426","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5749","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to absorb glucose from the blood. Fasting insulin reflects how hard the pancreas needs to work to keep blood sugar under control. Bethany's insulin at 1.82 is below the laboratory lower limit of 2.6, but with a perfectly normal fasting glucose of 4.5 and HbA1c of 36, this reflects a body that needs very little insulin to manage its blood sugar. In a lean, heavily training 25-year-old, this is a marker of exceptional insulin sensitivity rather than a sign of pancreatic dysfunction.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, heavy exercise","high_causes":"Insulin resistance, obesity, polycystic ovarian syndrome, excessive carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"179.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1738","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5283","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and provides a reliable measure of how much insulin the body is actually producing. The lab result of 0.543 ug/L converts to approximately 180 pmol/L, which is below the lower limit. As with her insulin, this reflects the very low demand her body places on the pancreas. With normal glucose and HbA1c, the pancreas is producing exactly what is needed, it simply does not need to produce much.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, fasting","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.36","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.24","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"","description":"HOMA-IR estimates insulin resistance by combining fasting glucose and fasting insulin. A lower number means greater insulin sensitivity, which is metabolically desirable. Bethany's HOMA-IR of 0.36 is below the range floor of 0.5, but this is in the favourable direction. Below 1.0 means she is highly insulin sensitive, which is confirmed by her excellent glucose and HbA1c results. This is one of the strongest metabolic findings in the report.","low_causes":"Exceptional insulin sensitivity, lean body composition, regular exercise, low carbohydrate intake","high_causes":"Insulin resistance, obesity, metabolic syndrome, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"36.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1517","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates beta-cell function, meaning how well the insulin-producing cells in the pancreas are working. Calculated as (20 x Insulin) / (Glucose - 3.5), Bethany's result of 36.4 is below the range of 80 to 200. However, in the context of normal glucose and HbA1c, this reflects low insulin demand rather than beta-cell failure. The pancreas is not being asked to produce much insulin because her body uses it so efficiently.","low_causes":"High insulin sensitivity with low insulin demand, lean body composition, low carbohydrate diet","high_causes":"Insulin resistance driving compensatory insulin production, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2679","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT is an enzyme found primarily in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Bethany's ALT at 30 is within the laboratory range of up to 56 but above the female optimal threshold of 25. In the context of very high-intensity resistance training, mild ALT elevations can come from muscle as well as liver. Her GGT, bilirubin, and other liver markers are all excellent, so this is not a liver concern.","low_causes":"Normal finding","high_causes":"Liver disease, fatty liver, alcohol, medications, intense exercise, muscle damage","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5469","lower_normal":"13","upper_normal":"45","lower_optimal":"10","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3020","upper_optimal_position":"0.6146","units":"IU/l","description":"AST is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT because muscle damage also releases AST. Bethany's AST at 35 is within range and, given her training intensity and elevated CK, a portion of this may be coming from muscle turnover rather than the liver.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, intense exercise, heart damage, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2895","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5292","units":"IU/l","description":"GGT is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems, and metabolic stress on the liver. It is often the first liver marker to rise when the liver is under strain. Bethany's GGT at 22 is within the female optimal range of below 25, indicating no metabolic stress on the liver.","low_causes":"Normal finding","high_causes":"Alcohol, fatty liver, bile duct disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5571","lower_normal":"46","upper_normal":"116","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3048","upper_optimal_position":"0.6381","units":"IU/l","description":"ALP is an enzyme found in the liver, bones, and bile ducts. In a 25-year-old, bone sources are less relevant than in adolescence, so ALP primarily reflects liver and biliary health. Bethany's ALP at 98 is within range.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, liver disease, bone disease, pregnancy, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"3","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2083","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when red blood cells break down. The liver processes and excretes it. Elevated bilirubin can indicate liver problems or excessive red cell breakdown. Bethany's bilirubin at 9 is well within range, confirming healthy liver clearance.","low_causes":"Normal finding","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood, reflecting nutritional status and immune function. Bethany's at 74 is well within range.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins, and medications, and helps maintain fluid balance. It is also a marker of nutritional status and liver synthetic function. Bethany's albumin at 44 is within the optimal range.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/l","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. They reflect immune system activity and liver function. Bethany's globulin at 30 is within range.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between liver synthetic function and immune activity. Bethany's A/G ratio of 1.47 is within the optimal range.","low_causes":"Overactive immune system, liver disease, autoimmune conditions","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2862","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a non-invasive calculation that estimates the likelihood of liver fibrosis (scarring) using age, AST, ALT, and platelet count. A score below 1.3 at her age indicates a very low probability of significant liver fibrosis. Bethany's score of 0.83 is reassuring.","low_causes":"Normal finding","high_causes":"Liver fibrosis, cirrhosis, age, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5606","lower_normal":"30" l), and VLDL. While Bethany's total at 5.5 is above the desirable threshold of 5.18, this is almost entirely driven by her exceptionally high HDL of 2.5. The components underneath, particularly ApoB at 0.66 and triglycerides at 0.55, show an excellent cardiovascular profile. Total cholesterol alone is a poor predictor of cardiovascular risk.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily influenced by carbohydrate and sugar intake, alcohol, and metabolic health. Low triglycerides are desirable. Bethany's at 0.55 is well below the optimal threshold of 1.0, reflecting excellent metabolic health and insulin sensitivity.","low_causes":"Low carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate or sugar diet, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1603","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL carries triglycerides from the liver to tissues. It is calculated from triglycerides and ion":"Chloride works alongside sodium and bicarbonate to maintain fluid balance and acid-base balance. Bethany's chloride at 100 is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4515","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is a buffer that helps maintain the blood's pH (acid-base balance). The kidneys and lungs work together to keep bicarbonate within a tight range. Bethany's at 23.9 is within the optimal range.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, intense exercise","high_causes":"Metabolic alkalosis, vomiting, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8708","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate. It reflects the balance of measured and unmeasured ions in the blood. Bethany's calculated anion gap is 24.3, which is above the range of 8 to 16. However, the anion gap is heavily influenced by albumin levels and laboratory measurement methods. Her metabolic markers, bicarbonate, and clinical picture are all normal, suggesting this is a calculation artefact ON","result":"9.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7067","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. Bethany's urea at 9.1 is marginally above the upper limit of 8.2. In someone doing five or more resistance sessions per week with likely high protein intake, elevated urea reflects increased protein turnover and muscle breakdown rather than kidney dysfunction. The normal Cystatin C eGFR of 89 confirms healthy kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, intense exercise, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"103","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7154","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"85","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3415","upper_optimal_position":"0.6260","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism. The kidneys filter it out, so blood levels reflect both muscle mass and kidney function. Bethany's creatinine at 103 is above the upper limit of 90, but in a lean woman doing heavy resistance training, this is almost certainly driven by higher-than-average muscle mass. The Cystatin C eGFR of 89, which is not affected by muscle mass, confirms that her kidneys are functioning well.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"High muscle mass, intense exercise, dehydration, kidney disease, high protein diet"
