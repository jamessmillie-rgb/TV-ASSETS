abundant protein in the blood, made by the liver, and it maintains fluid balance, carries hormones and nutrients, and reflects both liver function and nutritional status. At 40, this is within the healthy range and the ideal band, confirming good liver synthetic function and adequate protein intake.","low_causes":"Liver disease, kidney disease (protein loss), malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/L","description":"Globulin encompasses a group of proteins including antibodies and inflammatory proteins. At 33, this is within the laboratory range but above the optimal of 30. The slightly elevated globulin is consistent with her mildly raised IgA and her chronic inflammatory conditions (polymyalgia, psoriasis), which stimulate antibody and inflammatory protein production.","low_causes":"Immunodeficiency, malnutrition, liver disease","high_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4429","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver and bones. At 69, this is within the healthy range and the ideal band. In a postmenopausal woman, a normal ALP is reassuring because it suggests there is no excessive bone turnover or bile duct obstruction.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, Paget's disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 12, this is within the healthy range and the ideal band, confirming normal red cell turnover and liver clearance.","low_causes":"Not usually clinically significant","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that rises when liver cells are damaged or inflamed. At 14, this is well within the ideal range of below 25 for a woman. This confirms her liver is under no metabolic strain, which is a reassuring finding in someone with type 2 diabetes, where fatty liver is common.","low_causes":"Not usually clinically significant","high_causes":"Liver disease, fatty liver, medications, alcohol, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3854","lower_normal":"13","upper_normal":"45","lower_optimal":"14","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3438","upper_optimal_position":"0.5104","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. At 18, this is well within the healthy range and the ideal band. Together with a clean ALT and GGT, this confirms no liver cell damage.","low_causes":"Not usually clinically significant","high_causes":"Liver disease, heart damage, muscle damage, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4138","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis (scarring) using age, AST, ALT and platelet count. At 1.2, this is within the ideal range and below the threshold of 2.0 used for people over 65. Combined with her clean liver enzymes and normal albumin, this makes significant liver fibrosis very unlikely.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, older age, low platelets, raised liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4510","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol, medications, bile duct problems and metabolic stress. At 16, this is well within the ideal range of below 25, confirming the liver is handling its workload comfortably. In someone who does not drink alcohol, this is expected but still a positive finding.","low_causes":"Not usually clinically significant","high_causes":"Alcohol, medications, bile duct obstruction, fatty liver, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amy","name":"Amylase","group":"DIGESTIVE","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4129","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands to break down starch. At 51, this is within the healthy range and the ideal band, confirming normal pancreatic function. This is relevant to her bloating symptoms because it shows the pancreas is producing adequate digestive enzymes.","low_causes":"Chronic pancreatitis (burned-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"DIGESTIVE","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4965","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. At 36, this is within the healthy range and the ideal band, confirming normal pancreatic fat digestion. Together with the normal amylase, this makes pancreatic insufficiency very unlikely as a cause of her bloating.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5146","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.39, this is within the healthy range and the ideal band, confirming that despite the mildly raised PTH, calcium levels are being maintained properly.","low_causes":"Vitamin D deficiency, parathyroid underactivity, kidney disease, malabsorption","high_causes":"Parathyroid overactivity, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of true calcium status. At 2.44, this is within the healthy range and the ideal band. This confirms that her calcium is genuinely well maintained, not artificially normal due to albumin changes.","low_causes":"Vitamin D deficiency, parathyroid underactivity, kidney disease","high_causes":"Primary hyperparathyroidism, cancer, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5709","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and energy production. At 1.4, this is within the healthy range and the ideal band. Normal phosphate alongside mildly raised PTH is reassuring because one of the effects of excess PTH is to lower phosphate, and that has not happened here.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6034","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including muscle relaxation, nerve function, blood sugar regulation and sleep. At 1.0, this is within the optimal band of 0.85 to 1.05, which is reassuring and reflects her magnesium supplementation. Good magnesium levels support sleep quality, insulin sensitivity and joint comfort.","low_causes":"Poor dietary intake, alcohol, diuretics, diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"151","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5017","lower_normal":"50","upper_normal":"250","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.4500","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood. At 151, this is well above the sufficient threshold of 50 but above the optimal upper end of 120, meaning her level is higher than the ideal range of 75 to 120. This reflects her supplementation and supports bone health and immune function, which is particularly relevant given her autoimmune conditions (polymyalgia, psoriasis). With kidney function reduced to eGFR 35, the kidneys may not be converting this stored vitamin D into its active form (calcitriol) as efficiently, which is likely why her PTH is mildly raised despite the high circulating level. Continuing at the current dose maintains rather than builds the level, and no increase is needed.","low_causes":"Lack of sunlight, dark skin, obesity, malabsorption, kidney disease","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"4.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6818","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels by controlling how much calcium is released from bone, absorbed from the gut, and retained by the kidneys. At 4.9 against an upper limit of 4.73, this is marginally above range. With normal calcium, normal phosphate and vitamin D at 151 (above the optimal upper end of 120), the most likely explanation is secondary hyperparathyroidism related to her reduced kidney function: the kidneys are not converting vitamin D to its active form (calcitriol) as efficiently at eGFR 35, so the parathyroid glands compensate by producing slightly more PTH. This is worth monitoring alongside kidney function.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, parathyroid adenoma, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium level for the glucose concentration, which is important in diabetes because high glucose can dilute sodium. At 136 with a glucose of 4.6, no correction is needed, and the sodium reading of 136 is accurate. This is reported for context and is not applicable at present.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"284.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4950","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality reflects the concentration of dissolved particles in the blood, indicating fluid balance. At 284.7, this is within the ideal range, meaning her fluid balance is well maintained. This is a useful check given her kidney findings and confirms she is not dehydrated.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"318","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3861","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. At 318, this is within the laboratory range of 193 to 982 but below the optimal of 500. At 73, absorption of B12 from the gut naturally declines due to reduced stomach acid production. Low B12 can contribute to fatigue, brain fog, low mood and nerve symptoms. Sublingual methylcobalamin (dissolved under the tongue) is the most effective supplementation route because it bypasses the gut absorption issues that become more common with age.","low_causes":"Poor dietary intake (vegan/vegetarian), age-related malabsorption, pernicious anaemia, metformin, gastric surgery","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate is a B vitamin essential for cell division, DNA repair and red blood cell production. At 13, this is within the healthy range and the ideal band, indicating good dietary intake from her vegetables and mixed diet.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications (methotrexate), pregnancy","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures low-level inflammation in the body. At 1.4, this is within the laboratory range of below 5 but above the optimal of below 1.0. Below 1.0 is considered low cardiovascular risk, 1.0 to 3.0 is moderate, and above 3.0 is higher risk. At 1.4 with known polymyalgia and psoriasis, both of which are inflammatory conditions, this is actually fairly well controlled. It contributes modestly to her cardiovascular risk score and PhenoAge.","low_causes":"Healthy state, anti-inflammatory medications, statins","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca1","name":"CA-125","group":"TUMOR MARKERS","result":"10.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2100","lower_normal":"0","upper_normal":"25","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer but also rises with endometriosis, fibroids, inflammation and other benign conditions. At 10.5, this is well within the normal limit of 25, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, inflammation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15","name":"CA 15-3","group":"TUMOR MARKERS","result":"6.861","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1143","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA 15-3 is a tumour marker most commonly associated with breast cancer monitoring. At 6.861, this is well within the normal limit of 30, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Breast cancer, ovarian cancer, lung cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6853","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL (harmful), HDL (protective), and VLDL. At 7.1, this is significantly above the desirable level of below 5.18. However, total cholesterol alone is not the best measure of risk because it includes the protective HDL. The more important numbers are the ApoB and LDL, which are also elevated in her case.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6324","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood that come from dietary fat and from carbohydrates the liver converts to fat. At 2.15 against a fasting target of below 1.7 and an optimal of below 1.0, this is elevated. Raised triglycerides are associated with insulin resistance, high carbohydrate intake, and increased cardiovascular risk. In her case, with type 2 diabetes and an HbA1c of 53, the elevated triglycerides are likely driven by the metabolic pattern. Reducing refined carbohydrates, adding omega-3 fatty acids, and the post-meal walks recommended in this report are the most effective ways to bring triglycerides down.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"High carbohydrate diet, diabetes, obesity, alcohol, kidney disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6282","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. At 0.98 against an upper limit of 0.78, this is above range, reflecting her elevated triglycerides. VLDL particles are converted to LDL in the bloodstream, so elevated VLDL contributes to the elevated LDL.","low_causes":"Low triglyceride levels","high_causes":"High triglycerides, diabetes, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5161","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective form of cholesterol that carries excess cholesterol away from the artery walls back to the liver for disposal. At 1.5, this is below the desirable threshold of 1.55 for women and below the optimal of 1.6, placing it outside the reference range. Bringing HDL up through regular exercise, omega-3 fats, and the dietary changes in this report would improve the overall lipid balance. Her ApoA1 at 2.2 (the protein on HDL particles) is strong, which provides some counterbalance.","low_causes":"Sedentary lifestyle, smoking, obesity, high triglycerides, poor diet","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8907","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the form of cholesterol that deposits in artery walls and drives atherosclerosis. At 4.68 against an upper limit of 3.0, this is significantly above range. In someone with type 2 diabetes and reduced kidney function, both of which independently accelerate cardiovascular disease, bringing LDL down is particularly important. Dietary changes (increasing soluble fibre from oats, beans, lentils; reducing saturated fat from cheese, butter, fatty meat; adding oily fish twice a week) are the first step, and the GP may also consider statin therapy given the overall risk picture.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism, liver disease","high_causes":"High saturated fat diet, genetics, hypothyroidism, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5256","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to summarise the balance between total and protective cholesterol. At 4.73 against a target of below 4.5, this is marginally above range, reflecting the high total cholesterol and the slightly below-threshold HDL. Below 4.5 is the target; below 3.5 is ideal.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"21.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5282","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL. At 21.13%, this is just above the minimum of 20% but below the optimal of 25%, meaning her protective cholesterol makes up a relatively small share of the total. Bringing LDL down and HDL up would improve this ratio.","low_causes":"High LDL, low HDL, obesity, sedentary lifestyle","high_causes":"High HDL, regular exercise, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, and it captures all the atherogenic (artery-damaging) forms of cholesterol including LDL and VLDL. At 5.6 against a target of below 4.0, this is significantly elevated. It is a useful summary measure because it includes the triglyceride-rich particles that LDL alone misses.","low_causes":"Low LDL and triglycerides","high_causes":"High LDL, high triglycerides, diabetes, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7857","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles, and it drives their ability to remove cholesterol from artery walls. At 2.2, this is well above the normal threshold of 1.4 and the optimal of 1.6, which is a strong positive finding. It means her protective lipoprotein system is functioning well, even though the HDL cholesterol level itself is slightly below threshold. ApoA1 provides the counterbalance to the elevated ApoB.","low_causes":"Sedentary lifestyle, smoking, genetic factors","high_causes":"Regular exercise, genetics, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein carried by every LDL and VLDL particle, and it is what allows these particles to penetrate the artery wall and deposit cholesterol. Because each particle carries exactly one ApoB molecule, the ApoB level is the most accurate count of the total number of atherogenic particles in the blood. At 1.5 against a target of below 0.9, this is significantly elevated and classified as 'very high' by the laboratory. This is the single most important cardiovascular marker in this report. Each of these particles can enter an artery wall, and reducing the particle count through diet and potentially medication is the most effective way to reduce cardiovascular risk.","low_causes":"Low LDL, malnutrition, hyperthyroidism","high_causes":"High LDL, genetics, diabetes, high saturated fat diet, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio is the best single summary of the balance between harmful (ApoB) and protective (ApoA1) lipoproteins. At 0.68 against a lower-risk target of below 0.6, this places her in the average-risk band (0.6 to 0.8). While not in the higher-risk band, there is room for improvement. The strong ApoA1 of 2.2 is doing valuable work here, but the very high ApoB of 1.5 pushes the ratio above the target. Reducing ApoB through diet and potentially medication would bring this ratio into the lower-risk zone.","low_causes":"Low ApoB relative to ApoA1","high_causes":"High ApoB, low ApoA1","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"57.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9017","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that carries cholesterol and promotes clotting. At 57.71 against an ideal of below 32, this is in the mildly increased risk band (32 to 90). Lp(a) is entirely inherited: it cannot be changed by diet, exercise or most medications. It is above the ideal but below the level (about 125) at which it is generally considered to add meaningful independent risk. It is worth recording and mentioning to the GP alongside her other lipid findings, but it is not the main driver of her cardiovascular risk, which is the modifiable ApoB and LDL.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited trait)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3886","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3429","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged or working hard. At 54, this is well within the healthy range and the ideal band, meaning there is no significant muscle breakdown despite her training, polymyalgia and joint pain. This is reassuring.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin medications, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone the thyroid gland produces. At 16.4, this is within the healthy range and the ideal band of 14 to 20, confirming adequate thyroid output.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4846","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH is the signal the pituitary gland sends to the thyroid to tell it how much hormone to produce. At 2.47, this is within the ideal band of 1.0 to 2.5, meaning the pituitary is comfortable with the amount of thyroid hormone being produced and is not having to push hard. A well-placed TSH with good FT4 and FT3 and negative antibodies is a reassuring thyroid picture.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroid antibodies, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use. The body converts T4 into T3. At 4.4, this is within the laboratory range but just below the optimal of 4.5. At 73, a slightly lower T3 is not unusual, and with TSH in the ideal range the thyroid system as a whole is functioning well. T3 at the lower end of optimal can contribute to fatigue and feeling cold, but in this context it is not a major driver of her symptoms.","low_causes":"Hypothyroidism, calorie restriction, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies target an enzyme in the thyroid gland and, when elevated, indicate the immune system is attacking the thyroid, a condition called Hashimoto's thyroiditis. At below 6.6, well under the limit of 13.8, this is negative and makes autoimmune thyroid disease very unlikely.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target the protein the thyroid uses to make its hormones. At below 1.3, well under the limit of 4.4, this is negative and, together with the negative TPO antibodies, confirms no autoimmune thyroid disease. This is particularly relevant given her family history of autoimmune disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.268","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4240","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3:FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.268, this is within the reference range but just below the optimal of 0.27. The FT3 at 4.4 is just below optimal, so this ratio is being driven by the slightly lower FT3 rather than an excess of FT4. At 73, a mildly lower conversion rate is not unusual and does not indicate thyroid disease given the normal TSH.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c19","name":"CA 19-9","group":"TUMOR MARKERS","result":"< 1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA 19-9 is a tumour marker associated with pancreatic and gastrointestinal cancers. At below 1.2, this is well within the normal limit of 37, which is reassuring and helps exclude pancreatic pathology as a cause of her digestive symptoms.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"< 0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1087","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a tumour marker associated with colorectal and other cancers. At below 0.5, this is well within the normal limit of 2.3, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, lung cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G","group":"IMMUNOLOGY","result":"10.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4772","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections. At 10.6, this is within the healthy range, meaning her acquired immune system has normal antibody levels and she has adequate protection against previously encountered infections.","low_causes":"Immunodeficiency, medications (corticosteroids, immunosuppressants)","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M","group":"IMMUNOLOGY","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3867","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. At 0.9, this is within the healthy range, indicating normal early immune response capacity.","low_causes":"Immunodeficiency, selective IgM deficiency","high_causes":"Acute infection, autoimmune disease, liver disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A","group":"IMMUNOLOGY","result":"3.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6989","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the antibody that guards the mucosal surfaces of the body: the gut lining, respiratory tract and skin. At 3.8 against an upper limit of 3.5, this is mildly elevated. IgA rises when these surfaces are under immune stress, and in someone with psoriasis (a skin-based immune condition), bloating (suggesting gut mucosal activation), and a family history of autoimmune disease, a mildly raised IgA is not unexpected. It does not point to a specific new diagnosis but is worth the GP noting as part of her overall autoimmune and inflammatory picture.","low_causes":"Selective IgA deficiency, immunosuppression, coeliac disease","high_causes":"Mucosal inflammation, autoimmune disease, liver disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E","group":"IMMUNOLOGY","result":"7.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0356","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/ml","description":"IgE is the antibody responsible for allergic reactions and parasitic defence. At 7.12, this is very low and well within the limit of 100, making an allergic driver of her skin symptoms or digestive discomfort very unlikely from a blood perspective. Her psoriasis is an autoimmune condition rather than an allergic one, and this result supports that distinction.","low_causes":"Not usually clinically significant","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2500","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/ml","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and some other autoimmune conditions. At 7, well within the limit of 14, this is negative and makes rheumatoid arthritis unlikely as the cause of her joint pain. Her joint symptoms are more likely related to her polymyalgia, post-surgical knee changes, and the general inflammatory load.","low_causes":"Not clinically significant","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.653","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0454","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"This is the screening test for coeliac disease, measuring the antibody that attacks the gut lining when someone with coeliac disease eats gluten. At 0.653 against a negative threshold of below 7.19, this is clearly negative and makes coeliac disease very unlikely as a cause of her bloating. Importantly, this test is only valid if she has been eating gluten regularly, which a standard mixed diet would include.","low_causes":"No coeliac disease, gluten-free diet (test unreliable)","high_causes":"Coeliac disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8369","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall antioxidant capacity of the blood. At 2.01 against an upper limit of 1.77, this is above range. This is almost certainly driven by her supplementation with vitamin D, magnesium and zinc, and possibly dietary antioxidants from her vegetables and mixed diet. An elevated TAA from supplementation is not a concern and simply reflects that her antioxidant defences are well stocked.","low_causes":"Poor dietary antioxidant intake, chronic inflammation, oxidative stress","high_causes":"Supplementation with vitamins and minerals, high antioxidant diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"332","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4646","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's main stress hormone, following a natural rhythm: highest in the morning and falling through the day. At 332, this is within the healthy morning range and the ideal band, meaning her adrenal stress response is functioning normally. This is reassuring given her sleep difficulties and the stress she reports some weeks, because it suggests the morning cortisol surge that should wake her up and provide energy is intact.","low_causes":"Adrenal insufficiency, chronic fatigue, low stress","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medication, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"< 43","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the main form of oestrogen, the primary female sex hormone. At below 43, this is within the postmenopausal reference range of 0 to 118.2, confirming she is well past menopause. Low oestradiol is expected at 73 and contributes to bone loss, vaginal dryness, and joint stiffness, all of which are managed through other mechanisms.","low_causes":"Menopause, ovarian failure, pituitary disease","high_causes":"Premenopause, HRT, ovarian tumour, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"< 0.21","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone produced primarily by the ovaries after ovulation. At below 0.21, this is within the postmenopausal reference range of 0 to 2.32 and is entirely expected at 73. Progesterone naturally falls to very low levels after menopause.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Pregnancy, ovulation, certain ovarian cysts, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"29.4","within_normal":"TRUE","within_optimal":"","result_position":"0.4514","lower_normal":"15.9","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH is a pituitary hormone that stimulates the ovaries. At 29.4, this is within the postmenopausal reference range of 15.9 to 54, confirming the postmenopausal state. Elevated LH after menopause is the pituitary's response to the ovaries no longer producing oestrogen.","low_causes":"Pituitary disease, hypothalamic suppression, pregnancy","high_causes":"Menopause, ovarian failure, PCOS (when paired with low FSH)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"62.34","within_normal":"TRUE","within_optimal":"","result_position":"0.4739","lower_normal":"23","upper_normal":"116.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"FSH is a pituitary hormone that stimulates the ovaries to produce eggs and oestrogen. At 62.34, this is within the postmenopausal reference range of 23 to 116.3 and well above the threshold of 40 that confirms postmenopausal status. This is entirely expected at 73.","low_causes":"Pituitary disease, hypothalamic suppression, pregnancy, HRT","high_causes":"Menopause, ovarian failure, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4127","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women supports muscle maintenance, bone density, libido, mood and energy. At 1.0, this is within the laboratory range of 0.5 to 2.6 and within the optimal band of 0.8 to 2.0. While within range, a level closer to 0.8 or above would be more supportive of muscle maintenance, joint stability and energy, all of which are relevant to her goals and symptoms.","low_causes":"Aging, menopause, adrenal insufficiency, corticosteroid use","high_causes":"PCOS, adrenal hyperplasia, ovarian tumour, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3850","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active (not bound to SHBG). At 1.43, this is within the healthy range and the ideal band, meaning the balance between total testosterone and SHBG is appropriate.","low_causes":"Low testosterone, high SHBG, aging","high_causes":"PCOS, low SHBG, exogenous androgens","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA-Sulphate","group":"HORMONES","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3470","lower_normal":"0.26","upper_normal":"11","lower_optimal":"1.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3563","upper_optimal_position":"0.5425","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a building block for both testosterone and oestrogen. At 0.7 umol/L, this is within the laboratory range but below the optimal. DHEA-S naturally declines with age, and at 73 a lower level is expected. It contributes to the lower end testosterone and may play a role in her fatigue and reduced muscle recovery.","low_causes":"Aging, adrenal insufficiency, chronic stress","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"38","upper_normal":"430","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3435","upper_optimal_position":"0.5561","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for milk production but also involved in immune regulation and metabolism. At 94, this is within the postmenopausal reference range and the ideal band, confirming normal pituitary function.","low_causes":"Not usually clinically significant","high_causes":"Pituitary tumour (prolactinoma), medications, hypothyroidism, stress, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"69.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4521","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.5369","units":"nmol/L","description":"SHBG is a protein that binds testosterone and oestradiol, controlling how much of each is free and biologically active. At 69.9, this is within the healthy range and the ideal band. A normal SHBG with a testosterone of 1.0 means a reasonable proportion of her testosterone is available for use, confirmed by the free androgen index of 1.43.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen (HRT or contraceptives)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.011","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3347","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"nmol/L","description":"Free testosterone is the small fraction of testosterone not bound to any protein, and it is the form that cells can use directly. At 0.011, this is just inside the lower limit of 0.01 but well below the optimal of 0.02 to 0.15. Very low free testosterone in a postmenopausal woman can contribute to difficulty maintaining muscle mass, reduced energy, low libido, and slower recovery from exercise. While expected to be lower at 73, a level this close to the floor is worth mentioning to the GP if her symptoms of fatigue and joint stiffness are significantly affecting her quality of life.","low_causes":"Menopause, aging, high SHBG, adrenal insufficiency","high_causes":"PCOS, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4485","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone is the fraction of testosterone that is either free or loosely bound to albumin and available for the body to use. At 0.24, this is within the healthy range and the ideal band, which is a better picture than the very low free testosterone of 0.011 might suggest. The albumin-bound portion is making up for the low free fraction, meaning her tissues have access to a reasonable amount of active testosterone overall.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","r hin_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"The urine culture grew only scanty skin commensals, which are normal bacteria from the skin surface. This is not an infection and is a common finding. No treatment is needed.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"2.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4921","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.4812","units":"","description":"The NLR divides the neutrophil count by the lymphocyte count to give a simple measure of the balance between innate and adaptive immunity. At 2.09, this is within the laboratory range but just above the optimal of 2.0. A mildly elevated NLR is consistent with low-grade chronic inflammation from her polymyalgia and psoriasis. It is not a concern at this level.","low_causes":"Viral infection, autoimmune conditions with low neutrophils","high_causes":"Bacterial infection, chronic inflammation, physiological stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"156.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5482","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The PLR divides platelet count by lymphocyte count as another marker of inflammation and immune balance. At 156.7, this is within the ideal range, indicating well-controlled systemic inflammation despite her autoimmune conditions.","low_causes":"Thrombocytopenia, lymphocytosis","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"611","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6740","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets and lymphocytes into a single inflammation index. At 611 against an upper limit of 600, this is marginally above range. The neutrophil count of 3.9 and platelet count of 293 are both within range individually, and the slight elevation of this composite index is consistent with her chronic inflammatory conditions (polymyalgia, psoriasis) rather than a new process. At this margin, it is a finding to note rather than act on independently.","low_causes":"Low inflammatory load, immunosuppression","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tghdlratio","name":"Triglyceride:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4767","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"","description":"The TG/HDL ratio divides triglycerides by HDL cholesterol and is a useful marker of insulin resistance and small, dense LDL particles. At 1.43, this is within the laboratory range of below 1 l range of below 0.5, making significant liver fibrosis or cirrhosis very unlikely. Together with the clean FIB-4, ALT and GGT, this is a comprehensively healthy liver picture.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-0.589","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5148","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD Fibrosis Score estimates the likelihood of advanced fibrosis in people with non-alcoholic fatty liver disease, using age, BMI, diabetes status, albumin, platelets and the AST/ALT ratio. At -0.589, this is within the reference range but above the optimal of below -1.455. However, the score is being pushed up by her age (73) and diabetes status rather than by any actual sign of liver disease: her ALT, GGT, AST, FIB-4 and APRI are all clean. The score reflects the calculation's age weighting rather than liver pathology.","low_causes":"Young age, low BMI, no diabetes, healthy liver enzymes","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The De Ritis ratio divides AST by ALT. At 1.29, this is within the ideal range. When both AST and ALT are within normal limits, as they are here, the ratio is simp const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
