const REPORT_DATA = {"patient_name":"Susan Sanders","dob":"05/09/1953","report_date":"2026-11-10","summary":"Patient is a 73-year-old female presenting with a BMI of 25.9, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are slightly below average (volume 4 out of 10). She trains 4 times per week (2 cardio, 2 resistance) at moderate intensity with 2,000 to 5,000 daily steps. She sleeps under 6 hours, feeling tired most mornings, with an afternoon energy crash. Stress feels hard to manage some weeks. She does not drink alcohol. She has a diagnosis of type 2 diabetes and polymyalgia, and reports psoriasis on her arms, ears, legs and shoulders, alongside bilateral knee replacements that still cause pain. She supplements with vitamin D, magnesium and zinc. She has a family history of an autoimmune condition. She reports skin breakouts, bloating and digestive discomfort, poor sleep and insomnia, and joint pain and stiffness. Her sleep is significantly disrupted: she goes to bed exhausted but lies awake for prolonged periods despite taking magnesium and glycine, wakes after roughly two hours needing to urinate, and then struggles to return to sleep, sometimes twice a night. Her goals are to improve digestion and gut health, improve sleep quality, and lose body fat.\n\nThe finding that should go to her GP before anything else in this report is her kidney function. Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, is 1.98 against an upper limit of 1.1. The eGFR calculated from cystatin C is 35, and even the combined creatinine and cystatin C eGFR is 35, which places her in stage 3b chronic kidney disease. eGFR stands for estimated glomerular filtration rate, and it measures how many millilitres of blood the kidneys can filter per minute; above 90 is ideal, above 60 is the minimum considered normal, and 35 means the kidneys are working at roughly a third of full capacity. Creatinine itself is 114 against an upper limit of 90, and the creatinine-based eGFR the lab reported is 41, confirming this is not a single-marker anomaly. Her urea is 8.1, just within its upper limit of 8.2, which is consistent with reduced clearance. Importantly, the urinalysis is clean: no protein, no blood, no casts, no glucose spilling into the urine, which means there is no sign of active kidney damage or inflammation at this moment. The urine culture showed only scanty skin commensals, which is not an infection. This kidney finding needs a GP conversation promptly, with a repeat of creatinine, cystatin C and eGFR, a urine albumin-to-creatinine ratio to check for any protein leak, and a review of her diabetes management, because sustained high blood sugar is one of the most common drivers of kidney function decline. The fact that her fasting glucose today is a healthy 4.6 and her HOMA-IR (a measure of how well insulin is working) is 1.09 suggests her day-to-day glucose control may be better than the longer-term picture painted by her HbA1c, and tightening that longer-term average could help protect what kidney function remains.\n\nHer HbA1c is 53 mmol/mol (7.0%), which sits above the diabetes threshold of 48. HbA1c measures the average blood sugar over the previous two to three months by looking at how much sugar has attached to haemoglobin, the oxygen-carrying protein in red blood cells. At 53, her diabetes is not dramatically out of control, but it is above the target most guidelines set of 48 or below, and over years this level accelerates damage to small blood vessels, including those in the kidneys. Her estimated average glucose, derived from the HbA1c, is 8.5 mmol/L against a target of below 7, confirming that her blood sugar is running higher than it should across the day even though her fasting sample caught a good moment. One complication worth noting: her RDW (red cell distribution width, which measures how much variation there is in the size of her red blood cells) is 16.5% against an upper limit of 14%. RDW affects HbA1c accuracy because the test assumes a normal red cell lifespan; when red cells vary more in size, the reading can shift. This does not mean the HbA1c is wrong, but the GP may want to bear it in mind. Her TyG index, which combines triglycerides and glucose as a marker of metabolic stress, is 8.97 against a target of below 8.8, reinforcing that the metabolic picture has room for improvement.\n\nTurning to what is working well, and there is a good deal to feel positive about. Her liver is in excellent health. ALT at 14 and GGT at 16 are both well within the ideal range, and the AST of 18, FIB-4 score of 1.2, and APRI of 0.154 all point to a liver with no metabolic strain, no fat accumulation and no scarring whatsoever. At 73 with type 2 diabetes and a BMI that is only just into the overweight category, a liver this clean is a genuinely good result. Her fasting insulin at 5.35 and C-peptide at 1.65 are both within range, meaning her pancreas is still producing insulin adequately and her body is not massively resistant to it; the HOMA-IR of 1.09 confirms good day-to-day insulin sensitivity, which is an unusual and valuable finding in someone with type 2 diabetes and suggests the diabetes may be more about the pancreas not quite keeping up with demand over time than about the tissues blocking insulin. Her thyroid is functioning well: TSH at 2.47 is comfortably within the ideal band, free T4 at 16.4 and free T3 at 4.4 are both within range, and both thyroid antibodies are negative, making autoimmune thyroid disease very unlikely. Her cortisol at 332 is within the expected morning range, which is reassuring given her sleep difficulties and the polymyalgia. Her IgE at 7.12 is very low, making allergic drivers of her skin symptoms unlikely from a blood perspective. Rheumatoid factor is negative at 7, and the coeliac screen (tissue transglutaminase, which looks for the antibody produced in coeliac disease) is negative, which helps in the context of her bloating symptoms. Her tumour markers are all reassuringly low: CA125 at 10.5, CA15-3 at 6.9, CA19-9 below 1.2, and CEA below 0.5. Her white cell count, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all well placed, and the platelet count of 293 and MPV of 8.6 are unremarkable.\n\nHer lipid profile is the second area that needs attention. Total cholesterol is 7.1, LDL (low-density lipoprotein, the form of cholesterol that deposits in artery walls) is 4.68 against an upper limit of 3.0, and ApoB (apolipoprotein B, the protein carried by every LDL particle that allows it to enter the artery wall, and the single best measure of how many atherogenic particles are circulating) is 1.5 against a target of below 0.9. Her ApoB/A1 ratio, which summarises the balance between harmful and protective lipoproteins, is 0.68 against a target of below 0.6, placing her in the average-risk band. Her Lp(a) is 57.71 nmol/L, above the ideal of 32 but below the 125 level at which it is generally considered to add meaningful independent risk; Lp(a), or lipoprotein(a), is an inherited particle that carries cholesterol and promotes clotting, and it cannot be changed by diet or exercise. Her Lp(a)-corrected LDL, which removes the cholesterol carried by Lp(a) to show what is modifiable, is 4.49, still well above the 3.0 target, meaning there is plenty of room to improve through diet, and potentially medication if her GP thinks it appropriate given the kidney findings and the diabetes. Her triglycerides at 2.15 are above the fasting target of 1.7, and VLDL at 0.98 is above 0.78, both consistent with the metabolic pattern. Her remnant cholesterol (calculated as total cholesterol minus HDL minus LDL) will sit at 0.92, above the 0.8 target, reflecting triglyceride-rich remnants that add to vascular risk. On the positive side, her HDL at 1.5 is below the desirable threshold of 1.55, and her ApoA1 at 2.2 is strong, which gives her protective lipoproteins some weight against the harmful ones. Her cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 85 out of 100, which is high. The drivers are the ApoB of 1.5, the LDL of 4.68, the triglycerides of 2.15 and the HbA1c of 53. This score measures the risk being built in the arteries regardless of age, and with type 2 diabetes already present, bringing these lipids down is one of the most protective things she can do. Her atherogenic index of plasma at 0.156 is within range but above the optimal of 0.11, and her Castelli II ratio (LDL divided by HDL) at 3.12 is within range but above the optimal of 2.5, both reflecting the same imbalance.\n\nHer iron studies tell an important story in the context of the raised RDW and the low absolute reticulocyte count. Ferritin, the stored form of iron, is 35, which is within the laboratory range of 10 to 291 but below the optimal of 40 for a woman her age. Transferrin saturation, which shows how much of the iron-carrying protein is loaded with iron, is 24.85%, just below the optimal of 25%. Serum iron at 16.6 and transferrin at 2.66 are both within range. The reticulocyte percentage is 0.56%, just inside the lower limit, but the absolute reticulocyte count is 28.28 against a lower limit of 50, which means the bone marrow is producing fewer new red blood cells than expected. Her red blood cell count is actually high at 5.05 against an upper limit of 4.8, and her haemoglobin of 140 is healthy, so she is not anaemic, but the combination of a high red cell count, a low reticulocyte count, and a wide RDW suggests the marrow is releasing fewer new cells while older, more variable cells accumulate. At 73, some of this is age-related slowing of marrow turnover. However, the borderline iron stores could be contributing, because the marrow needs adequate iron to produce red cells efficiently. The raised ESR at 18 against a limit of 12 fits her polymyalgia, which is an inflammatory condition, and inflammation itself can suppress marrow activity and divert iron into storage. The GP should consider whether optimising her iron stores modestly and monitoring the reticulocyte count at her next blood test would be appropriate.\n\nHer parathyroid hormone (PTH) is 4.9 against an upper limit of 4.73, which is only marginally above range. PTH is the hormone that regulates calcium and phosphate; the parathyroid glands release it when calcium drops, and it pulls calcium from bone and increases its absorption from the gut. Her corrected calcium at 2.44, phosphate at 1.4 and vitamin D at 151 are all healthy, which makes the mildly raised PTH somewhat unexpected. At her age, a PTH just above range with normal calcium and excellent vitamin D is most commonly an early signal that the kidneys are not activating vitamin D as efficiently as they once did, because the final activation step of vitamin D happens in the kidneys, and with an eGFR of 35 that step is compromised. This is called secondary hyperparathyroidism of renal origin, and it is something the GP will want to monitor alongside the kidney function. It is not urgent at this margin, but it is a thread that connects the kidney finding to bone health.\n\nHer inflammatory markers show a mixed picture. The hsCRP (high-sensitivity C-reactive protein, a marker of systemic inflammation) at 1.4 is within the laboratory range of below 5 but above the optimal of below 1.0. Given her polymyalgia and psoriasis, both of which are inflammatory conditions, a CRP of 1.4 is actually fairly well controlled. The ESR at 18 is mildly raised, which fits the same picture. Her IgA at 3.8 is above the upper limit of 3.5. IgA is the antibody that lines the mucosal surfaces: the gut, the respiratory tract, the skin. A mildly raised IgA in someone with psoriasis, bloating and a family history of autoimmune disease is not unusual; psoriasis itself is associated with elevated IgA, and gut mucosal inflammation can contribute. It is worth the GP noting alongside her other autoimmune conditions, but at this margin it does not point to a new diagnosis. Her IgG and IgM are both comfortably within range.\n\nHer vitamin D at 151 is well above the sufficient threshold and reflects her supplementation; it sits above the optimal upper end of 120, so the current dose maintains rather than builds her level. Her B12 at 318 is within the laboratory range of 193 to 982 but below the optimal of 500; at 73, absorption of B12 from the gut naturally declines, and with her digestive symptoms this could be contributing to her fatigue and afternoon crash. Folate at 13 is healthy. Magnesium at 1.0 is within the optimal band of 0.85 to 1.05, which is reassuring given she supplements it.\n\nHer hormones are consistent with her postmenopausal status. FSH at 62.34 and LH at 29.4 confirm she is well past menopause. Oestradiol is below 43 and progesterone below 0.21, both expected. Her total testosterone at 1.0 is within the female range of 0.5 to 2.6, and her free testosterone at 0.011 is at the very bottom of the range. DHEA-S at 0.7 umol/L is within range. SHBG at 69.9 is within range. Prolactin at 94 is within the postmenopausal range. Her bioavailable testosterone at 0.24 is within range. The low free testosterone, while within the laboratory range, could be contributing to her difficulty building and maintaining muscle, her joint stiffness, and her fatigue. This is worth mentioning to the GP if the symptoms are significantly affecting her quality of life.\n\nHer total antioxidant activity at 2.01 is above the upper limit of 1.77, which reflects her supplementation with vitamin D, magnesium and zinc, and possibly dietary antioxidants. This is not a concern.\n\nHer PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 79.4 against her calendar age of 73, placing her biological age 6.4 years ahead. The main drivers are the raised creatinine (reflecting the reduced kidney function), the raised CRP (reflecting her inflammatory conditions), and the raised RDW. Bringing the CRP down, optimising her diabetes control, and protecting her kidney function are the three changes most likely to pull this number back toward her calendar age.\n\nHer urine is clean: no protein, glucose, blood, casts, nitrites or significant white cells. pH of 6 and specific gravity of 1.025 are both normal. The urine culture grew only scanty skin commensals, which is not an infection. Despite her nocturia (waking to urinate), there is no urinary tract infection and no protein leak from the kidneys on this sample, which is positive.\n\nHer creatine kinase at 54 is well within range, which is reassuring given her joint pain, polymyalgia and training load; it means there is no significant muscle breakdown occurring.\n\nThe sleep disruption she describes, going to bed exhausted, lying awake despite magnesium and glycine, waking after two hours to urinate and then being unable to return to sleep, is the thread that runs through many of her symptoms. Under 6 hours of sleep with multiple awakenings drives afternoon fatigue, worsens insulin resistance, raises inflammatory markers, impairs gut motility (contributing to bloating), and slows recovery from training. The nocturia itself, given the clean urine and the kidney findings, could be related to her kidney function: kidneys that filter less efficiently during the day may shift more work to the night, increasing urine production. It could also be related to her blood sugar management, as even mild overnight glucose fluctuations can increase urine output. Her GP should consider whether the nocturia is renal, metabolic, or bladder-related, and whether a bladder diary or a review of her evening fluid and medication timing might help.\n\nThe bloating she reports, with a negative coeliac screen, normal amylase and lipase (the pancreatic enzymes), and no alarming inflammatory markers, is most likely functional: related to gut motility, the composition of her diet, stress, sleep deprivation, or a combination. Increasing vegetable portions from 2 to 3 toward 4 to 5 a day, gradually, would increase fibre and feed the gut bacteria that produce short-chain fatty acids. If bloating worsens with specific foods, a symptom and food diary kept for two weeks would help identify triggers, and her GP could consider a hydrogen breath test for lactose intolerance or small intestinal bacterial overgrowth (SIBO) if the diary points that way.\n\nHer psoriasis breakouts are driven by her immune system and are unlikely to be explained by anything new in these bloods. The mildly raised IgA and CRP are consistent with her known conditions. Optimising her sleep, vitamin D (already excellent), and omega-3 intake may help at the margins, as omega-3 fatty acids have anti-inflammatory properties that can modestly reduce psoriatic flare frequency.","links":"The central thread in this report is the kidney function. A cystatin C of 1.98, a creatinine of 114, and an eGFR of 35 from both the cystatin C and the combined calculation all point to stage 3b chronic kidney disease. Type 2 diabetes is the most common cause of progressive kidney decline, and although her fasting glucose and insulin sensitivity today are encouraging, the HbA1c of 53 tells us that blood sugar has been running above target for the past two to three months, and it is the sustained exposure to elevated glucose over years that damages the kidney's filtering units. The clean urinalysis, with no protein, blood or casts, is a positive sign that the kidneys are not actively inflamed or leaking, but a formal urine albumin-to-creatinine ratio is needed to be certain.\n\nThe mildly raised PTH of 4.9 connects directly to the kidney finding rather than being a separate problem. The kidneys perform the final activation step of vitamin D, converting the storage form into the active hormone calcitriol that allows calcium absorption. With an eGFR of 35, this conversion is impaired, and the parathyroid glands compensate by producing slightly more PTH to maintain calcium levels. Her calcium and phosphate are still normal, which means the compensation is working, but this is a pattern that needs monitoring because over time it can lead to bone mineral loss.\n\nThe lipid profile sits alongside the diabetes and kidney findings as a second layer of cardiovascular risk. ApoB at 1.5, LDL at 4.68 and triglycerides at 2.15 are all elevated, and the cardiovascular risk score of 85 reflects the combined weight of these alongside the HbA1c. The Lp(a) of 57.71, while mildly raised and inherited, accounts for only a small portion of the LDL; the Lp(a)-corrected LDL of 4.49 confirms that the vast majority of the cholesterol burden is modifiable through diet and potentially medication. In someone with diabetes and reduced kidney function, cardiovascular protection becomes doubly important because these conditions accelerate vascular damage through independent pathways.\n\nThe inflammatory picture ties her polymyalgia and psoriasis to the blood results without introducing anything new. The CRP of 1.4, ESR of 18 and mildly raised IgA of 3.8 are all consistent with her known conditions rather than suggesting an undiagnosed process. The family history of autoimmune disease and her own polymyalgia and psoriasis cluster together, as autoimmune conditions tend to run in families and in individuals. The negative rheumatoid factor and negative coeliac screen are useful exclusions.\n\nThe haematology findings, specifically the raised RDW of 16.5, the low absolute reticulocyte count of 28.28, and the high red cell count of 5.05, form a pattern that may reflect a combination of borderline iron stores (ferritin 35), chronic inflammation suppressing marrow efficiency, and the reduced kidney function. The kidneys produce erythropoietin, the hormone that stimulates red cell production, and at an eGFR of 35 this production may be starting to fall. The fact that haemoglobin is still 140 means the body is compensating, but the low reticulocyte count suggests the margin is narrowing. This needs monitoring rather than immediate action.\n\nThe symptoms that trouble her most, the sleep disruption, the afternoon crash, the bloating and the joint pain, are not explained by a single abnormal marker but by the interaction of several factors. The nocturia that fragments her sleep could be renal (reduced daytime clearance shifting to the night), metabolic (overnight glucose fluctuations increasing urine volume), or simply age-related changes in bladder capacity. Sleep deprivation below six hours then worsens insulin resistance, raises inflammation, slows gut transit contributing to bloating, and impairs tissue repair making joint pain worse. Fixing sleep is therefore not just a comfort goal but a metabolic intervention.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast: eggs, Greek yoghurt, tinned fish or leftover chicken. Anchor: protein goes on the plate before anything else. Why: protein blunts the post-meal glucose spike that is driving your HbA1c of 53, protects muscle mass that supports your joints, and keeps you full on a smaller volume of food to support the fat-loss goal.\nSwap any white bread, pastry, cereal or white rice for oats, rye bread, sweet potato or quinoa, one meal at a time, starting this week with whichever meal is easiest. Why: slower-releasing carbohydrates lower the average blood sugar that your HbA1c is measuring, and reduce the triglycerides of 2.15 that are contributing to your cardiovascular risk score of 85.\nBuild vegetable portions from 2 to 3 a day toward 4 to 5, adding one extra portion per week. Anchor: add vegetables to the meal you already eat most reliably. Why: the soluble fibre in vegetables (oats, beans, lentils and broccoli especially) lowers LDL cholesterol, feeds the gut bacteria that reduce bloating over time, and slows glucose absorption.\nWalk for 15 minutes straight after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses both your HbA1c and your triglycerides, and the movement aids gut motility to reduce bloating.\nStop all fluids two hours before bed, and move your evening meal earlier if possible so you finish eating three hours before sleep. Why: reducing fluid and food volume before bed may reduce the nocturia that is fragmenting your sleep, which is the single biggest driver of your afternoon crash and may be worsening your blood sugar control.\nFix your wake time to the same time every day, including weekends, and get outside into daylight within 30 minutes of waking. Why: a fixed wake time is the strongest anchor for your circadian rhythm; morning light resets the cortisol and melatonin cycle that governs when you feel sleepy and when you feel alert, addressing the pattern of going to bed exhausted but being unable to sleep.\nMove your magnesium to 90 minutes before your target bedtime and cut caffeine entirely after midday if you are not already doing so. Why: magnesium glycinate supports sleep onset, but it needs a consistent window, and caffeine has a half-life of five to six hours, meaning an afternoon coffee is still active when you are trying to fall asleep.\nAim for 1,450 to 1,550 calories a day with at least 86 grams of protein (1.3 g per kg of body weight). Track loosely for two weeks to calibrate portion sizes, then rely on the plate method: half the plate vegetables, a quarter protein, a quarter slow carbohydrate. Why: a modest deficit of around 300 calories below your estimated maintenance of roughly 1,800 supports fat loss without compromising recovery, and the protein floor protects muscle mass that your joints depend on.","flags":"Kidney function is significantly reduced. Cystatin C 1.98 (limit below 1.1), creatinine 114 (limit 90), cystatin C eGFR 35 (limit above 60), combined eGFR 35, creatinine-based eGFR 41. This places her in stage 3b CKD. Urea 8.1 is at the top of range. Urinalysis is clean with no proteinuria. Needs prompt GP review with repeat bloods, a urine albumin-to-creatinine ratio, and a review of diabetes management in the context of renal function.\nHbA1c 53 mmol/mol (7.0%) is above the diabetes target of 48. Fasting glucose 4.6 and HOMA-IR 1.09 suggest good day-to-day insulin sensitivity, so the elevated average may reflect postprandial spikes. Estimated average glucose 8.5 and TyG index 8.97 (target below 8.8) support this. The GP should review whether current diabetes management is achieving adequate control, particularly given the kidney findings.\nLipid profile is significantly elevated. ApoB 1.5 (target below 0.9), LDL 4.68 (target below 3.0), Lp(a)-corrected LDL 4.49 (target below 3.0), total cholesterol 7.1, triglycerides 2.15 (target below 1.7), VLDL 0.98 (target below 0.78), non-HDL 5.6 (target below 4.0), TC/HDL ratio 4.73 (target below 4.5), ApoB/A1 ratio 0.68 (target below 0.6). HDL 1.5 is below the desirable threshold of 1.55 for women; ApoA1 2.2 provides some protective balance. Cardiovascular risk score 85 out of 100. In someone with type 2 diabetes and CKD, cardiovascular risk management is a priority. Statin therapy and dietary changes should be discussed with the GP.\nLp(a) 57.71 nmol/L (ideal below 32). This is inherited and cannot be changed by lifestyle. It sits in the mildly increased risk band (32 to 90) and is below the level (about 125) at which it is generally considered to add meaningful independent risk. Worth recording and mentioning to the GP alongside the other lipid findings.\nPTH 4.9 pmol/L, marginally above the upper limit of 4.73, with normal calcium (2.44), normal phosphate (1.4) and vitamin D at 151 (above the optimal upper end of 120). Most likely secondary to the reduced kidney function impairing the final activation of vitamin D. The GP should monitor this alongside kidney function and consider whether active vitamin D (calcitriol) is appropriate.\nESR 18 mm/hour (limit below 12). Consistent with her known polymyalgia and psoriasis rather than a new inflammatory process. CRP 1.4 supports low-grade chronic inflammation.\nIgA 3.8 g/L (upper limit 3.5). Mildly elevated, consistent with mucosal immune activation from psoriasis and possible gut inflammation. Not diagnostic on its own. Worth noting alongside her autoimmune history.\nRDW 16.5% (upper limit 14%), absolute reticulocytes 28.28 (lower limit 50), red blood cell count 5.05 (upper limit 4.8). Haemoglobin is healthy at 140 and there is no anaemia. The pattern may reflect borderline iron stores (ferritin 35), chronic inflammation, or early reduction in renal erythropoietin production. Monitor at next blood test.\nFerritin 35 ng/ml is within the laboratory range but below the optimal of 40 for a woman her age. Transferrin saturation 24.85% is just below the optimal of 25%. Not deficient, but borderline and potentially contributing to the low reticulocyte count.\nB12 318 pg/ml is within the laboratory range (193 to 982) but below the optimal of 500. At 73, gut absorption of B12 declines. Sublingual methylcobalamin supplementation would be appropriate.\nPhenoAge 79.4 against a calendar age of 73 (6.4 years older). Driven primarily by creatinine (kidney function), CRP (inflammation) and RDW. Improving diabetes control, managing inflammation and protecting kidney function are the levers to bring this closer to calendar age.\nReassuring negatives: liver function is excellent with no sign of fatty liver, fibrosis or metabolic strain (ALT 14, GGT 16, FIB-4 1.2, APRI 0.154). Thyroid is working well with negative antibodies. Coeliac screen negative. Rheumatoid factor negative. All tumour markers within normal limits. Urinalysis clean with no proteinuria, haematuria or infection. IgE very low, making allergic drivers unlikely. Cortisol and pancreatic enzymes within range. Creatine kinase normal.\nNot reported on this occasion: potassium.","recommendations":"Discuss the kidney function findings with your GP as a priority. Bring the cystatin C of 1.98, creatinine of 114 and combined eGFR of 35. Request a urine albumin-to-creatinine ratio to check for protein leak, and ask whether a referral to nephrology is appropriate given stage 3b CKD.\nReview diabetes management with the GP. The HbA1c of 53 is above the target of 48, and with kidney function at eGFR 35, tighter glucose control is important to slow further decline. Discuss whether current treatment is optimised and whether an SGLT2 inhibitor (which can protect both kidney and heart) would be suitable, noting this is a medication class the GP would assess for her.\nDiscuss the lipid profile. ApoB 1.5 and LDL 4.68 are significantly above target, and the cardiovascular risk score is 85. With diabetes and CKD, cardiovascular risk is compounded. The GP should consider whether statin therapy is appropriate alongside the dietary changes in this report.\nMention the mildly raised PTH of 4.9 alongside the kidney findings. Ask whether monitoring of PTH, calcium and phosphate should be added to routine bloods, and whether active vitamin D (calcitriol) is indicated given the reduced eGFR.\nDiscuss the nocturia. With clean urine and no infection, the GP should consider whether this is renal (reduced daytime clearance), metabolic (overnight glucose), or bladder-related. A bladder diary, review of evening fluid timing, and consideration of a sleep study (given the fragmented sleep pattern and BMI of 25.9) may be appropriate.\nAsk the GP to check iron studies and a reticulocyte count at the next routine blood test. Ferritin 35 and absolute reticulocytes 28.28 are borderline, and with reduced kidney function and chronic inflammation, monitoring is sensible.\nAim for 1,450 to 1,550 calories a day with at least 86 grams of protein (1.3 g/kg). Retest in 3 to 4 months with a focus on HbA1c, kidney function (creatinine, cystatin C, eGFR), urine albumin-to-creatinine ratio, lipid profile including ApoB, PTH, ferritin, reticulocytes and B12 to assess progress.","supplementation":"Vitamin D3 (cholecalciferol): continue at 2,000 IU daily with a fat-containing meal. Her level at 151 is above the optimal upper end of 120, so this dose maintains rather than builds. Take with vitamin K2 (MK-7, 100 mcg daily) to direct calcium into bone rather than soft tissue. Why: her PTH is mildly raised and kidney function is reduced, so supporting the vitamin D pathway and calcium routing is important for bone health.\nMagnesium glycinate: continue at 300 to 400 mg, taken 90 minutes before her target bedtime. Why: magnesium at 1.0 is within the optimal band, so she is absorbing it well; it supports sleep onset, muscle relaxation and insulin sensitivity.\nZinc: continue current supplementation. Her total antioxidant activity at 2.01 (above range) likely reflects her supplement stack. No need to increase the dose.\nOmega-3 fish oil: 2 g of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (hers are 2.15, above the 1.7 target), has a modest anti-inflammatory effect that may help her polymyalgia and psoriasis, and supports cardiovascular protection alongside the lipid management.\nSublingual methylcobalamin (vitamin B12): 1,000 mcg daily, dissolved under the tongue rather than swallowed. Why: her B12 at 318 is below the optimal of 500, and at 73 gut absorption of B12 declines. Sublingual delivery bypasses the gut. B12 supports energy, nerve function and red blood cell production.\nDO NOT take iron supplements without GP guidance. Her ferritin is borderline at 35 but not deficient, and with reduced kidney function the GP should direct any iron intervention, including the form and dose, based on the full clinical picture.\nThe most important changes from this report are not supplements. They are tightening blood sugar control through diet (slower carbohydrates, protein at every meal, a post-meal walk), addressing the sleep disruption that is worsening her glucose, inflammation and fatigue, and having the GP conversation about kidney function and cardiovascular risk management.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 40 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Needs medical attention. Raw 39.8. Weakest systems: lipids & cardiovascular 16%, glucose & insulin 21%, inflammation 29%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), HDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"79.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5090","lower_normal":"","upper_normal":"78","lower_optimal":"","upper_optimal":"73","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4679","units":"years","description":"PhenoAge is a biological age estimate calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 79.4 against her calendar age of 73, her biological age is 6.4 years older than her chronological age. The main drivers are the raised creatinine (reflecting reduced kidney function), the raised CRP (reflecting chronic inflammation from polymyalgia and psoriasis), and the raised RDW. The plan in this report, focused on tightening blood sugar control, protecting kidney function, and managing inflammation, is designed to pull this number closer to her calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 that combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the amount of risk being built in the arteries regardless of age. At 85, this is high. The main drivers are the ApoB of 1.5 (very high particle count), the LDL of 4.68, the triglycerides of 2.15, and the HbA1c of 53. In someone with type 2 diabetes and reduced kidney function, cardiovascular protection is critical. Dietary changes, omega-3 supplementation, and a GP discussion about statin therapy are the paths to bringing this score down.","low_causes":"Low ApoB, low LDL, high HDL, low triglycerides, low CRP, normal HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood at the moment the sample is taken. At 4.6, this is within the ideal fasting range of 4.0 to 5.4, meaning her blood sugar on the morning of the test was well controlled. This is a good result, particularly in someone with type 2 diabetes, and suggests her fasting insulin sensitivity is working as it should. However, fasting glucose captures only one moment; her HbA1c tells the longer-term story.","low_causes":"Fasting too long, excess insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, insulin resistance, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6310","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has sugar attached to it, giving an average blood sugar picture over the past two to three months. At 53 mmol/mol (7.0%), this is above the diabetes threshold of 48 and above the target most guidelines set for good diabetes control. It means her average blood sugar has been running higher than ideal over recent months. Tightening this toward 48 or below through diet, activity and medication review is one of the most important goals from this report, particularly for protecting her kidneys.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Diabetes, sustained high blood sugar, reduced red cell turnover","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"5.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3744","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone the pancreas releases to move glucose from the blood into cells for energy. At 5.35, this is within the ideal fasting range of 2 to 8, meaning her pancreas is not being forced to produce excessive insulin to control blood sugar. This is an encouraging finding in someone with type 2 diabetes and suggests her tissues are still reasonably sensitive to insulin at the fasting level. The contrast between this good fasting insulin and the elevated HbA1c suggests her blood sugar rises are happening after meals rather than through sustained fasting resistance.","low_causes":"Low-carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, high-carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747","units":"ug/L","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a reliable measure of how much insulin the body is actually producing, because unlike insulin itself it is not cleared by the liver. At 1.65, this is within the laboratory range and confirms the pancreas is producing insulin adequately. It is above the lower limit, which is reassuring in type 2 diabetes because it means the pancreas has not exhausted its capacity. This reading is consistent with the insulin level of 5.35 and supports the picture of reasonable pancreatic function.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, low-carbohydrate diet","high_causes":"Insulin resistance, insulinoma, kidney disease reducing clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6333","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin to estimate how resistant the tissues are to insulin's effects. At 1.09, this is within the ideal range, meaning her cells are responding to insulin efficiently at the fasting level. This is a genuinely encouraging finding in someone with type 2 diabetes, because it suggests her insulin resistance is not the primary driver of her elevated HbA1c. The elevated HbA1c is more likely driven by post-meal glucose spikes rather than a fundamental resistance to insulin.","low_causes":"High insulin sensitivity, very low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, obesity, high-carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"8.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6071","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an average blood sugar in the same units as a glucose meter. At 8.5 mmol/L against a target of below 7, this confirms her blood sugar has been averaging above the healthy range over the past two to three months. This is the number to aim to reduce through dietary changes and diabetes management review.","low_causes":"Low HbA1c, haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5097","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and fasting glucose as a surrogate marker of insulin resistance and metabolic risk. At 8.97 against a target of below 8.8, this is mildly above range. It is being driven by the elevated triglycerides rather than the glucose, which was a healthy 4.6. This confirms that while fasting insulin sensitivity is good (HOMA-IR 1.09), the metabolic picture is not fully optimal, primarily because of the triglyceride component.","low_causes":"Low triglycerides and glucose, good metabolic health","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 140, this is well within the healthy range for a woman and within the ideal band of 125 to 145, confirming she is not anaemic. Good oxygen-carrying capacity supports energy, exercise recovery and cognitive function.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, chronic lung disease, polycythaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"Red blood cell count measures the number of red cells per litre of blood. At 5.05, this is marginally above the upper limit of 4.8 for women. Her haemoglobin is normal and her haematocrit (the proportion of blood that is red cells) at 0.431 is within range, so this is not polycythaemia. The slightly elevated count combined with low reticulocytes and a wide RDW suggests that older red cells are persisting in the circulation while fewer new ones are being produced, leading to a higher count of cells with more variable sizes.","low_causes":"Anaemia, blood loss, bone marrow suppression, nutritional deficiency","high_causes":"Dehydration, chronic hypoxia, polycythaemia vera, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.431","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5700","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.431, this is within the healthy range and the ideal band, confirming her blood is neither too concentrated nor too dilute. A balanced haematocrit supports good blood flow and oxygen delivery.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"16.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. At 16.5%, this is above the upper limit of 14%, meaning her red cells vary more in size than expected. A raised RDW can reflect iron deficiency, B12 or folate deficiency, chronic inflammation, or mixed production issues. In her case, the combination of borderline ferritin at 35, chronic inflammation from polymyalgia and psoriasis, and reduced kidney function could all be contributing. RDW is also one of the inputs to PhenoAge, and her elevated reading is one of the factors pushing her biological age above her calendar age.","low_causes":"Usually not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, chronic inflammation, liver disease, mixed anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"85.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3778","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"fL","description":"MCV measures the average size of red blood cells. At 85.4, this is within the healthy range, meaning her red cells are a normal size. This is helpful because a very low MCV would suggest iron deficiency and a very high MCV would suggest B12 or folate deficiency. Neither pattern is present here.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"27.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3867","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 27.8, this is within the laboratory range but just below the optimal of 28. It is consistent with borderline iron stores: when iron is not fully optimal, each red cell carries slightly less haemoglobin. This is not a concern on its own but fits the broader picture of borderline iron.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"326","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. At 326, this is within the healthy range and the ideal band, meaning her red cells are packing haemoglobin at an appropriate density.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"293","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the small cell fragments responsible for blood clotting. At 293, this is well within the healthy range and the ideal band, meaning her clotting system has the right raw materials to function properly.","low_causes":"Bone marrow suppression, viral infection, autoimmune disease, medications","high_causes":"Infection, inflammation, iron deficiency, post-surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV measures the average size of platelets. At 8.6, this is within the healthy range and the ideal band, indicating normal platelet production by the bone marrow.","low_causes":"Inflammatory conditions suppressing production, bone marrow disorders","high_causes":"Rapid platelet turnover, immune thrombocytopenia, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4789","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's front line, fighting infection and monitoring for abnormal cells. At 6.62, this is within the healthy range and the ideal band, meaning her immune system is active but not overreacting.","low_causes":"Viral infection, bone marrow suppression, autoimmune disease, low energy availability","high_causes":"Infection, inflammation, stress, smoking, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"3.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and are the first responders to bacterial infection. At 3.9, this is within the healthy range and the ideal band, indicating a well-functioning innate immune response.","low_causes":"Viral infection, medications, autoimmune disease, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4783","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for targeted immune responses, including antibody production and fighting viral infections. At 1.87, this is within the healthy range and the ideal band, indicating a balanced adaptive immune system.","low_causes":"Viral infection, corticosteroids, autoimmune disease, chronic stress","high_causes":"Viral infection, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5417","units":"x10^9/L","description":"Monocytes are white blood cells that engulf debris and pathogens and play a role in tissue repair. At 0.42, this is within the healthy range and the ideal band.","low_causes":"Bone marrow suppression, corticosteroid use","high_causes":"Chronic infection, chronic inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5486","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasites and in allergic reactions. At 0.33, this is within the healthy range and the ideal band, and alongside her very low IgE confirms there is no significant allergic activation driving her skin symptoms.","low_causes":"Corticosteroid use, acute stress","high_causes":"Allergies, parasitic infection, asthma, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory responses. At 0.07, this is within the healthy range and the ideal band.","low_causes":"Acute allergic reaction, hyperthyroidism, corticosteroid use","high_causes":"Allergies, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube in one hour, which reflects the level of inflammation in the body. At 18 against an upper limit of 12, this is mildly raised. ESR is a non-specific marker, meaning it rises with any inflammation, and in her case the most likely explanation is her polymyalgia and psoriasis, both of which are chronic inflammatory conditions. It is consistent with her hsCRP of 1.4 and does not point to a new or separate inflammatory process.","low_causes":"Not usually clinically significant","high_causes":"Infection, autoimmune disease, chronic inflammation, malignancy, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ret","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"0.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3433","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.6","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are newly formed red blood cells released by the bone marrow. The percentage measures how much of the total red cell population is made up of these young cells. At 0.56%, this is just within the lower limit of 0.5% but below the optimal of 0.6%, suggesting the bone marrow is producing red cells at a relatively low rate. This is more significant when viewed alongside the low absolute reticulocyte count of 28.28, which falls below range.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, reduced erythropoietin (kidney disease), bone marrow suppression","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"28.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1885","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of new red blood cells being released per litre of blood, which is more reliable than the percentage alone. At 28.28 against a lower limit of 50, this is significantly below range, meaning the bone marrow is producing fewer new red cells than expected. Despite this, haemoglobin is healthy at 140, so the body is maintaining oxygen delivery. The likely contributors are her borderline iron stores (ferritin 35), chronic inflammation from polymyalgia and psoriasis, and possibly reduced erythropoietin production from the kidneys at eGFR 35. This should be monitored at her next blood test.","low_causes":"Iron deficiency, chronic disease, reduced erythropoietin (kidney disease), bone marrow suppression","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"16.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by the red blood cell count to help distinguish iron deficiency from thalassaemia trait when MCV is low. Her MCV is normal at 85.4, so this index does not apply and is reported for completeness only.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"24.85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3950","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying protein transferrin is loaded with iron. At 24.85%, this is within the laboratory range but just below the optimal of 25%, suggesting iron availability for red cell production is borderline. This is consistent with the borderline ferritin of 35 and may be contributing to the low reticulocyte count.","low_causes":"Iron deficiency, chronic inflammation, chronic disease","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"16.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4517","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3801","upper_optimal_position":"0.5826","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 16.6, this is within the healthy range and the ideal band, meaning there is adequate iron in circulation for the body's immediate needs.","low_causes":"Iron deficiency, chronic inflammation, poor dietary intake, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3744","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. At 2.66, this is within the laboratory range but just below the optimal of 2.7. Transferrin is also a negative acute-phase protein, meaning it can fall during inflammation, and her chronic inflammatory conditions may be keeping it slightly lower than it would otherwise be.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"61.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5151","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"TIBC measures the total capacity of transferrin to bind iron, reflecting how much room there is on the iron-transport system. At 61.5, this is within the healthy range and the ideal band, indicating normal iron-carrying capacity.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3630","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/ml","description":"Ferritin is the protein that stores iron in the body's tissues, and its blood level reflects total iron reserves. At 35, this is within the laboratory range of 10 to 291 but below the optimal of 40 for a woman of her age. While she is not iron deficient, her stores are on the low side, and this could be contributing to the reduced reticulocyte production and the raised RDW. Ferritin is also an acute-phase protein that can rise with inflammation, so in someone with polymyalgia and psoriasis, a reading of 35 may mean true iron stores are even lower than the number suggests.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"135","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance and blood pressure. At 136, this is within the healthy range and the ideal band, meaning her fluid and electrolyte balance is well maintained.","low_causes":"Excessive fluid intake, diuretics, kidney disease, heart failure, adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3846","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance and acid-base balance. At 97, this is within the laboratory range but just below the optimal of 98. This small margin is not clinically significant and likely reflects normal variation.","low_causes":"Vomiting, metabolic alkalosis, diuretics, excess fluid intake","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"25.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4909","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the main buffer the body uses to maintain the pH of the blood. At 25.2, this is within the healthy range and the ideal band, meaning her acid-base balance is well maintained. This is a particularly good finding in the context of reduced kidney function, because one of the roles of the kidneys is to regenerate bicarbonate.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product of protein metabolism that the kidneys filter from the blood. At 8.1, this is within the laboratory range but very close to the upper limit of 8.2, suggesting the kidneys are working hard to clear it. This is consistent with the reduced eGFR and creatinine findings, and together they point to the kidneys not filtering as efficiently as they should.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"114","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8618","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism that is filtered by the kidneys at a steady rate, making it a useful marker of kidney function. At 114 against an upper limit of 90, this is significantly above range. The raised creatinine reflects reduced kidney filtration, confirmed by the eGFR calculations. This is the most important finding in the report and needs GP review.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high protein intake, high muscle mass, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimates how much blood the kidneys filter per minute, calculated from creatinine, age and sex. At 41 against a minimum of 60, this confirms moderate to severe reduction in kidney function (stage 3b CKD). An eGFR above 90 is considered ideal, above 60 is the minimum considered normal, and at 41 the kidneys are working at less than half their expected capacity. This is confirmed by the cystatin C eGFR of 35 and the combined eGFR of 35.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, diabetes, hypertension","high_causes":"Pregnancy, very high cardiac output (rare in clinical practice)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"447","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6464","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/L","description":"Uric acid is a waste product of purine metabolism (purines come from certain foods and from the body's own cell turnover). The kidneys clear it, so levels rise when kidney function is reduced. At 447, this is within the laboratory range but well above the optimal of 320 for a woman, and it is likely elevated because her kidneys are not clearing it as efficiently. Elevated uric acid can contribute to joint pain and stiffness, which she reports, and to gout if it rises further. Keeping well hydrated and limiting high-purine foods (organ meats, shellfish, red meat in large amounts) can help.","low_causes":"Low purine diet, medications, liver disease","high_causes":"Kidney disease, high purine diet, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9000","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced by all cells at a constant rate and filtered by the kidneys, making it an excellent marker of kidney filtration that is not affected by muscle mass, diet or exercise. At 1.98 against an upper limit of 1.1, this is significantly above range and is the single most reliable indicator that kidney filtration is reduced. This drives the cystatin C eGFR of 35 and is the most important abnormal result in this report.","low_causes":"Not usually clinically significant","high_causes":"Reduced kidney function, acute kidney injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This is the combined eGFR calculated from both creatinine and cystatin C, which is considered the most accurate estimate of kidney function. At 35, this confirms stage 3b chronic kidney disease and is consistent with both the creatinine-based and cystatin C-based estimates. This is the figure to bring to the GP.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not usually clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"71.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5061",
