<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Amir Mughal","dob":"06/12/1986","report_date":"2026-10-13","summary":"Customer is a 39-year-old male of South Asian ethnicity presenting with a BMI of 17.3, which is significantly underweight, following a high-carb, low-fat diet, eating six or more portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). He does no structured cardio or resistance training, with 5,000 to 7,500 daily steps and an easy training intensity. He sleeps under six hours a night, feels tired most mornings, reports an afternoon energy crash, and says stress is rarely hard to manage. He does not drink alcohol. He vapes nicotine. He supplements with zinc and vitamin B12. He has no diagnosed conditions but reports a previous SIBO diagnosis that has since been cleared, and he is currently investigating potential liver and gallbladder issues alongside hormonal concerns related to previous testosterone replacement therapy (TRT), which he says caused excessive oestrogen levels. He is complementing this blood panel with a SIBO breath test, an organic acids test and MRI imaging. A previous blood test returned normal results. He reports low mood and anxiety, low energy and fatigue, bloating and digestive discomfort, and low sex drive, all lasting months. His goals are to balance hormones, improve digestion and gut health, and boost immune system.\n\nThe first finding that stands out is the full blood count. His white cell count is 3.42, below the lower limit of 4.0, and his neutrophils are 1.21, well below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the body's first-line defence against bacterial infection. At 1.21 he has what is formally classified as mild neutropenia, and while this can be a normal variant in people of South Asian ethnicity, sometimes called benign ethnic neutropenia, it needs to be confirmed as such rather than assumed. His eosinophils are 0.54, above the upper limit of 0.5. Eosinophils are white cells that rise in response to allergic conditions, parasitic infection, and sometimes gut inflammation. Given his history of SIBO and ongoing digestive symptoms, the raised eosinophils may reflect residual gut inflammation or an allergic or atopic process; his IgE at 489, nearly five times the upper limit of 100, strongly supports an allergic or atopic driver. IgE is the antibody the immune system produces in response to allergens, and a level this high suggests either an environmental allergy such as dust mite, pollen, pet dander or mould, a food allergy, or, less commonly, a parasitic infection. Given his digestive history, it would be worth discussing both environmental allergy testing and a stool parasitology screen with his GP. His reticulocytes (young red blood cells freshly released from the bone marrow) are 49.4 in absolute terms, just below the lower limit of 50, and his red blood cell count at 4.41 and haematocrit at 0.388 are both marginally below range. At a BMI of 17.3, this pattern is most likely driven by low energy availability: the bone marrow is producing blood cells slightly more slowly because the body simply does not have the caloric surplus to run every system at full capacity. His mean platelet volume (MPV) is 10.5, above the upper limit of 10.1, which at this margin is usually a normal variant but can reflect larger, younger platelets being released, sometimes seen alongside mild marrow underproduction. Taken together, the picture is of a mildly suppressed bone marrow that is most likely responding to undernutrition rather than to disease, but the neutropenia in particular should be raised with his GP so that benign ethnic neutropenia can be confirmed and other causes excluded.\n\nHis creatine kinase (CK) is 561, well above the upper limit of 320. CK is an enzyme released from muscle when muscle fibres are damaged or stressed. He does no resistance training and reports easy activity only, so the usual explanation of post-exercise muscle breakdown does not apply. Elevated CK in the absence of exercise can reflect a recent viral illness, a statin medication (which he is not on), a thyroid problem (his thyroid is working well), or, in lean individuals with very little muscle mass, sometimes a myopathy or muscle condition. At a BMI of 17.3 with very low body weight, the CK should be discussed with his GP. A repeat fasted sample after 72 hours of rest would help distinguish a transient spike from a persistent elevation, and if it remains above 500, further investigation would be appropriate.\n\nHis amylase is 139, above the upper limit of 118. Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Reassuringly, his lipase at 53 is within range (upper limit 60), and lipase is the more specific marker for pancreatic inflammation. When amylase is elevated but lipase is normal, the source is more likely the salivary glands than the pancreas, or it can reflect a normal variant called macroamylasaemia where amylase binds to a protein in the blood and is cleared more slowly. Given that he is already having an MRI to investigate liver and gallbladder concerns, this finding fits naturally into that investigation and should be mentioned to the team managing those imaging results.\n\nTurning to the positives, and there are many. His liver is in excellent health. ALT at 26, GGT at 16, AST at 29, bilirubin at 10, albumin at 44, and alkaline phosphatase at 55 are all comfortably within range. The FIB-4 score, a composite index that estimates liver scarring, is 1.24, well within the safe threshold of 1.45. The APRI score is 0.405, within the optimal band below 0.5. The NAFLD fibrosis score is negative at minus 2.734. For someone concerned about liver and gallbladder disease, this is genuinely reassuring: the blood gives no signal of liver inflammation, fatty change, or fibrosis. Whatever his symptoms are pointing to, the liver enzymes are clean.\n\nHis lipid profile is excellent across the board. Total cholesterol is 3.4, LDL is 1.74, ApoB (the protein that carries LDL particles and the single best predictor of cardiovascular risk from cholesterol) is 0.74, below both the desirable threshold of 0.9 and the optimal target of 0.8. His triglycerides are 1.06, his HDL is 1.2, and his Lp(a) at 25.99 is below the 32 threshold. Lp(a) is an inherited lipoprotein particle that deposits cholesterol and promotes clotting; it cannot be changed by diet or exercise, so a normal result is a permanent piece of good news. His cardiovascular risk score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 15 out of 100, which is ideal. His ApoB to ApoA1 ratio is 0.63, within the lower-risk band below 0.7. The only minor note is that his ApoA1 at 1.18 sits just below the desirable threshold of 1.20, and his HDL at 1.2 is adequate but below the optimal target of 1.4 for a male. Both would likely rise with the addition of regular exercise and a small increase in dietary fat from sources such as oily fish, nuts and olive oil.\n\nHis blood sugar control is exceptional. Fasting glucose is 4.0, HbA1c is 32 mmol/mol (5.0%), and his HOMA-IR (a measure of insulin resistance calculated from fasting glucose and insulin) is 0.42, which is below the lower limit of the reference range simply because he is very insulin-sensitive. This is a positive finding, not a concern. His fasting insulin at 2.37 is marginally below the reference range of 2.6 to 24.9, and his C-peptide (a molecule released in equal amounts to insulin by the pancreas, used to assess how much insulin the pancreas is producing) at 0.635 micrograms per litre, equivalent to approximately 210 pmol/L, is below the lower limit of 1.1. In isolation, low insulin and low C-peptide could suggest the pancreas is struggling to produce enough insulin, but his glucose and HbA1c are both excellent, which means insulin demand is low and the pancreas is meeting it comfortably. On a high-carb, low-fat diet with a BMI of 17.3, his cells are exquisitely sensitive to insulin and simply do not need much. The low HOMA-IR confirms this interpretation. This is healthy metabolic efficiency, not pancreatic failure.\n\nHis thyroid is working well. TSH at 1.18 is within the optimal band of 1.0 to 2.5, free T4 at 15.2 is mid-range, free T3 at 4.5 sits at the lower edge of the optimal band, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. The FT3 to FT4 ratio is 0.296, within the optimal range, showing good conversion from the storage hormone to the active one. For someone reporting fatigue and low energy, it is useful to know the thyroid is not the explanation.\n\nHis kidney function is sound. Cystatin C at 1.06, just inside the upper limit of 1.1, gives a cystatin C-based eGFR of 92 and a combined eGFR of 92, both above the optimal threshold of 90. Cystatin C is a more reliable measure of kidney filtration than creatinine in people who are very lean or have low muscle mass, because creatinine is produced by muscle and can underestimate kidney strain in someone with very little of it. At 92, his kidneys are filtering well. Uric acid at 268 is within range. Electrolytes are balanced: sodium 144, potassium 4.3, chloride 104, bicarbonate 29.9. His serum osmolality at 298.7 is marginally above the reference ceiling of 295, which at this small margin is most likely explained by mild dehydration at the time of the draw and is not clinically significant.\n\nHis iron studies are healthy. Ferritin at 195 is within the optimal band of 50 to 200 for a male, serum iron at 22.7, transferrin at 2.45, TIBC at 58.1 and transferrin saturation at 36.9% are all within range and within optimal. There is no iron deficiency and no iron overload.\n\nHis vitamin D at 132 is excellent, well within the optimal band of 75 to 120 and in fact slightly above it, suggesting his supplementation or sun exposure is generous. His B12 at 964 is near the top of range, which is expected given he supplements with B12. His folate is above the upper limit at greater than 24, which on a diet rich in six or more portions of vegetables and fruit daily, with no alcohol consumption, is entirely expected and is not a concern; folate is water-soluble and excess is excreted.\n\nHis inflammation markers are reassuring. hsCRP at 0.7 is below the optimal threshold of 1.0, meaning there is very little systemic inflammation. ESR at 4 is excellent.\n\nHis hormones tell an important story given his history of previous TRT and his current symptoms of low libido, low mood and fatigue. His testosterone at 16.3 is within the laboratory range of 8.4 to 28.7 and above the recommended minimum of 12, but it falls below the optimal band of 18 to 30. Free testosterone at 0.306 and bioavailable testosterone at 7.33 are both within range, and SHBG at 38.3 is mid-range, so the testosterone that is circulating is bioavailable. LH at 3.78 and FSH at 6.92 are both within range, confirming that the pituitary gland is communicating with the testes and that the hypothalamic-pituitary-gonadal axis has recovered from previous TRT. Oestradiol at 62 is well within range. Progesterone at 1.01 is within the male reference range. Cortisol at 372 is mid-range for a morning sample, and DHEA-S at 3.0 micromoles per litre (approximately 1,106 micrograms per decilitre) is within range. The testosterone is not low enough to explain his symptoms on its own, but at 16.3 in a 39-year-old it is below where it should ideally sit, and at his current BMI of 17.3 with no resistance training and under six hours of sleep, the most powerful levers to raise it are increasing caloric intake to gain lean mass, adding resistance training, and extending sleep to at least seven hours.\n\nHis prostate markers are clear: PSA at 0.88 with a free PSA ratio of 0.375, both well within safe limits. Tumour markers CA19-9 and CEA are both low and reassuring. His coeliac screen (tissue transglutaminase IgA) is negative at 0.683, with his total IgA at 3.0 confirming the test is valid (low IgA can produce a false-negative coeliac screen). Rheumatoid factor is negative.\n\nHis PhenoAge, a composite biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count, is 25.3 years against a calendar age of 39, placing him nearly fourteen years younger biologically. The low CRP, low glucose, healthy albumin and good kidney function are the main drivers of this favourable result. The low white cell count, while flagged clinically, actually pushes PhenoAge downward, so the score should be read alongside the clinical picture rather than in isolation.\n\nHis total antioxidant activity (TAA) at 1.92 is above the upper limit of 1.77, which is expected and welcome given his high vegetable and fruit intake and zinc supplementation. His urinalysis is clean: no white cells, no red cells, no nitrites, no glucose, no ketones, negative culture with no growth, and a trace of protein that at this level is not clinically significant.\n\nReturning to his symptoms: low energy, afternoon crash, low mood, low sex drive and bloating. The bloods have positively excluded thyroid disease, anaemia, iron deficiency, B12 and folate deficiency, significant inflammation, liver disease, kidney disease, and coeliac disease. Testosterone is below optimal but not below range. The most likely drivers of his symptoms are not in his blood but in his circumstances. He is significantly underweight at a BMI of 17.3, sleeping under six hours, doing no structured exercise, and vaping nicotine. Chronic sleep deprivation below seven hours is independently associated with low testosterone, impaired mood regulation, reduced immune function, afternoon fatigue, and impaired gut motility. A BMI of 17.3 at 180 centimetres means his body is running on minimal reserves, which explains the mildly suppressed bone marrow, the below-optimal testosterone, and likely contributes to the fatigue and low mood. Nicotine from vaping constricts blood vessels, disrupts sleep architecture even when total sleep time seems adequate, and can worsen anxiety. The bloating, given his cleared SIBO history, may reflect residual gut dysmotility, bile acid malabsorption (which would connect to the gallbladder investigation he is pursuing), or food intolerances that the breath test and organic acids test may clarify. His next steps should focus on the investigations already in progress, a GP review of the neutropenia and CK, extending sleep, and gradually increasing caloric intake to move his BMI toward at least 20.","links":"The thread that runs through this report is energy availability. At a BMI of 17.3, 56 kilograms on a 180-centimetre frame, the body is operating with very little reserve. The mildly suppressed white cell count, the low neutrophils, the borderline-low reticulocytes and red cell count, and the below-optimal testosterone all point in the same direction: the body is quietly economising on the functions it can survive without in the short term in order to protect the functions it cannot. Bone marrow output, reproductive hormone production, and immune cell turnover are all metabolically expensive, and all are running slightly below their ideal level.\n\nThe second thread is the immune and allergic picture. His IgE at 489 is nearly five times the upper limit, and his eosinophils are above range. These two findings are tightly linked: IgE drives eosinophil activation, and together they point to either an environmental allergen exposure (dust mite, mould, pet dander, pollen) or, given his gastrointestinal history, a food allergy or residual parasitic exposure. This does not explain all his symptoms, but it may contribute to the bloating and digestive discomfort if an allergic process is active in the gut mucosa. It also provides a clear and testable next step: allergen-specific IgE testing or skin-prick testing can identify the trigger.\n\nThe elevated CK is a loose end. Without recent exercise, a CK of 561 needs an explanation. Viral myositis (muscle inflammation from a recent virus), a subclinical myopathy, or even sustained muscle tension from anxiety and poor sleep are all possible. The thyroid is working well, so hypothyroid myopathy is excluded. A repeat CK after 72 hours of rest would determine whether this is a transient spike or a persistent finding.\n\nThe metabolic picture is reassuringly clean. Glucose, HbA1c, insulin sensitivity, liver enzymes, kidney function, lipids, and inflammation are all excellent. The low insulin and C-peptide reflect high insulin sensitivity on a high-carb diet in a very lean individual, not pancreatic insufficiency. The liver investigation he is pursuing is not supported by any enzyme or fibrosis marker in the blood, which is useful information for his clinicians: whatever his symptoms suggest, the liver is biochemically healthy.\n\nThe hormonal picture has recovered from previous TRT. LH and FSH are both within range, confirming the hypothalamic-pituitary-gonadal axis is intact. Testosterone at 16.3 is functional but below optimal, and the most effective way to raise it is through weight gain, resistance training, and sleep extension rather than through further hormonal intervention.","lifestyle":"Increase total caloric intake by 300 to 400 calories per day, focusing on calorie-dense whole foods: oats with nut butter and banana at breakfast, extra olive oil on vegetables, a handful of nuts mid-afternoon. Anchor: add one extra snack between lunch and dinner, same time each day. Why: at a BMI of 17.3 your body is running on minimal reserves, and the suppressed white cells, borderline red cells and below-optimal testosterone are all signs that more fuel is needed. Your calorie target is approximately 2,200 to 2,400 per day to begin gaining weight gradually toward a BMI of at least 20, which means reaching around 65 kilograms over the coming months.\nAdd a palm-sized portion of protein to every meal: eggs, lentils, chickpeas, tofu, chicken, fish or Greek yoghurt. Anchor: protein goes on the plate before anything else. Why: at 56 kilograms you need at least 73 to 90 grams of protein per day (1.3 to 1.6 grams per kilogram) to support lean mass gain, immune cell production and testosterone synthesis.\nBegin two resistance training sessions per week, even bodyweight exercises at home: press-ups, squats, lunges, rows with a band. Anchor: pick two fixed days and a fixed time that follows an existing routine. Why: resistance training is the single strongest stimulus for testosterone production, lean mass gain and bone density, all of which are below where they should be at 39.\nExtend sleep to at least seven hours per night. Set a fixed bedtime that allows seven and a half hours in bed, and keep the wake time consistent including weekends. Anchor: set a phone alarm 30 minutes before the target bedtime as a wind-down cue. Why: under six hours of sleep suppresses testosterone by up to 15 percent, impairs immune function (relevant with your low white cells and neutrophils), worsens mood and anxiety, and slows gut motility, which may be contributing to bloating.\nGet outside within the first hour of waking for at least 10 minutes of natural light. Anchor: step outside before or immediately after breakfast. Why: morning light resets the circadian clock, improves sleep quality at night, and helps shift the afternoon energy crash earlier.\nCut caffeine after midday. Anchor: the last caffeinated drink is with or before lunch. Why: caffeine has a half-life of five to six hours, and any consumed after midday is still active at bedtime, which is directly undermining your already short sleep window.\nConsider reducing or stopping nicotine vaping. Why: nicotine disrupts sleep architecture even when you feel you are sleeping, constricts blood vessels reducing nutrient delivery to the gut, and can worsen anxiety. If stopping feels difficult, discuss nicotine replacement options with your GP or pharmacist.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk improves gut motility, reduces bloating, and helps maintain the excellent blood sugar control you already have.","flags":"White cell count 3.42 (range 4.0 to 10.0) with neutrophils 1.21 (range 2.0 to 7.0): mild neutropenia. May represent benign ethnic neutropenia, which is a normal variant in people of South Asian descent, but should be confirmed by the GP with a repeat full blood count. If persistent, no action is needed beyond documentation. If new or worsening, further investigation is warranted.\nEosinophils 0.54 (range 0.02 to 0.5) with IgE 489 (range below 100): eosinophilia and markedly elevated IgE together point to an allergic or atopic process, or less commonly a parasitic infection. Given his gastrointestinal history, allergen-specific IgE panel and stool ova and parasites should be considered.\nCreatine kinase 561 (range 40 to 320) with no recent exercise and no statin use: unexplained elevation. Thyroid function is normal, excluding hypothyroid myopathy. Recommend repeat CK after 72 hours of rest; if persistently elevated above 500, consider further investigation including myopathy screen.\nAmylase 139 (range 30 to 118) with lipase 53 (range 13 to 60): isolated amylase elevation with normal lipase. More likely salivary origin or macroamylasaemia than pancreatic pathology. Should be mentioned alongside MRI findings to the investigating team.\nRed blood cell count 4.41 (range 4.5 to 5.5), haematocrit 0.388 (range 0.40 to 0.50), reticulocytes absolute 49.4 (range 50 to 100): mild erythropenia with borderline low reticulocyte production. At BMI 17.3, most likely reflects low energy availability suppressing bone marrow output. Haemoglobin at 134 is maintained within range.\nMPV 10.5 (range 7.1 to 10.1): marginally above range, likely a normal variant reflecting younger, larger platelets. Not clinically significant in isolation.\nInsulin 2.37 (range 2.6 to 24.9) and C-peptide 0.635 micrograms per litre (range 1.1 to 4.4) both below range, with HOMA-IR 0.42 (range 0.5 to 1.5) below range in the favourable direction: reflects high insulin sensitivity in a lean individual on a high-carb diet with excellent glucose of 4.0 and HbA1c of 32. Not pathological. No action required.\nTestosterone 16.3 (optimal 18 to 30): below optimal but within laboratory range at 39. Likely related to low BMI, no resistance training and chronic sleep deprivation. Axis intact with LH 3.78 and FSH 6.92 within range.\nFolate above 24 (range 3 to 17): expected on a high-vegetable diet with no alcohol consumption. Not a concern.\nReassuring negatives: liver enzymes, fibrosis scores and bilirubin all normal (no evidence of liver disease despite symptoms); thyroid function optimal with negative antibodies; coeliac screen negative with adequate IgA; prostate markers clear; tumour markers clear; lipid profile excellent with ApoB 0.74 and Lp(a) 25.99; hsCRP 0.7 with ESR 4 (minimal inflammation); iron studies optimal; kidney function adequate with cystatin C eGFR 92; urinalysis clean.","recommendations":"Discuss the low white cell count and neutrophils with your GP. Mention that you are of South Asian ethnicity, as benign ethnic neutropenia is a recognised normal variant in this population. A repeat full blood count in four to six weeks will confirm whether it is stable. Bring these numbers: WBC 3.42, neutrophils 1.21.\nAsk your GP about the elevated IgE of 489 and eosinophils of 0.54. Request allergen-specific IgE testing (a panel covering common environmental and food allergens) and consider a stool sample for ova, cysts and parasites given your SIBO history and ongoing gut symptoms.\nMention the elevated creatine kinase of 561 to your GP. Request a repeat CK after at least 72 hours of complete rest from any physical activity. If it remains above 500, further investigation may be warranted.\nShare the amylase result of 139 (with normal lipase of 53) with the team managing your MRI and gallbladder investigation. It adds a data point but is unlikely to represent pancreatic disease given the normal lipase.\nRaise the below-optimal testosterone of 16.3 with your GP in the context of your previous TRT use, noting that LH and FSH have recovered to normal, confirming axis recovery. The most effective interventions are weight gain, resistance training and sleep extension rather than further hormone therapy at this stage.\nYour calorie target is 2,200 to 2,400 calories per day with at least 73 to 90 grams of protein daily, aiming for gradual weight gain toward 65 kilograms. Retest in four to six months with a full blood count, CK, amylase, testosterone, IgE and eosinophils to track progress.","supplementation":"Continue vitamin D3 (cholecalciferol) at 1,000 to 2,000 IU daily, taken with a meal containing fat. Your level at 132 is slightly above the optimal ceiling of 120, so a maintenance dose rather than a loading dose is appropriate. Always pair with vitamin K2 (MK-7) at 100 micrograms daily to direct calcium into bones rather than arteries.\nContinue zinc at 15 to 25 milligrams daily (zinc bisglycinate or zinc picolinate), taken with food to avoid nausea. Your zinc supplementation supports immune function, which is relevant given your low white cells, and testosterone production.\nSwitch your B12 to sublingual methylcobalamin 1,000 micrograms daily if you are not already using this form. Your B12 at 964 is near the top of range, so you could reduce to every other day or continue daily and recheck at your next test; sublingual absorption bypasses the gut, which matters given your digestive history.\nAdd magnesium glycinate 300 to 400 milligrams before bed. Your magnesium at 0.97 is within range but sleep extension is a priority, and magnesium glycinate supports sleep quality and muscle relaxation.\nAdd omega-3 fish oil providing 2 grams of combined EPA and DHA daily, taken with food. Your HDL is adequate but below optimal at 1.2, and your ApoA1 at 1.18 is just below desirable; omega-3 supports both, as well as gut mucosal health.\nDo not take iron supplements. Your ferritin at 195 and transferrin saturation at 37% are both optimal, and additional iron would risk pushing stores above the ideal ceiling.\nThe most important changes from this report are not supplements. They are eating more food to gain weight, adding resistance training, and extending sleep to at least seven hours.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 70.1; held to 59 by a system rated \"See your GP\". Weakest systems: specialized tests 0%, immunology 19%, hematology 40%. Biggest drags: White Blood Cell Count, C-Peptide, Neutrophils, Creatine Kinase.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"25.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"","upper_normal":"44","lower_optimal":"","upper_optimal":"39","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4432","units":"years","description":"PhenoAge is a composite biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. At 25.3 years against a calendar age of 39, this places him nearly fourteen years younger biologically. The low CRP, low glucose, healthy albumin and good kidney function are the main drivers of this favourable result. The low white cell count, while flagged clinically, actually pulls PhenoAge downward, so this score should be read alongside the full clinical picture.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. At 15, within the ideal band of 20 or below, cardiovascular risk from modifiable blood markers is low. The score has no age term, so it measures the risk being built rather than the ten-year chance of an event. His excellent ApoB, LDL, Lp(a) and CRP are the main drivers of this low score. The only small detractor is HDL at 1.2, which sits below the optimal threshold.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result": ount. The pattern of low RBC, low haematocrit and borderline reticulocytes with normal iron, B12 and folate points to reduced marrow activity from insufficient caloric intake.","low_causes":"Anaemia, overhydration, blood loss, bone marrow suppression","high_causes":"Dehydration, polycythaemia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"12.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4476","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"%","description":"RDW (red cell distribution width) measures the variation in red blood cell size. A normal RDW means red cells are being produced uniformly. At 12.7, within the optimal band, this rules out mixed nutritional deficiencies and confirms consistent red cell production.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiencies, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. At 88, within the optimal band, the red cells are a normal size, ruling out iron deficiency (which shrinks them) and B12 or folate deficiency (which enlarges them).","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","r _optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells just released from the bone marrow. As a percentage at 1.12%, this is within range. However, the absolute count provides a more accurate picture.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"49.392","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3293","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells being released by the bone marrow. At 49.4, just below the lower limit of 50, this confirms that red cell production is marginally reduced. With iron, B12 and folate all adequate, the most likely explanation is low energy availability at a BMI of 17.3 rather than a nutritional deficiency. Increasing caloric intake should support improved marrow output.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease, aplastic anaemia","high_causes":"Blood loss, haemolysis, recovery from anaemia, erythropoietin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2233","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>

  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
