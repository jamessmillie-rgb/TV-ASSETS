<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Kayleigh Winship","dob":"11/12/1999","report_date":"2026-08-21","summary":"Kayleigh is a 26-year-old female presenting with a BMI of 21.7, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. She trains once per week with resistance exercise only, performs no dedicated cardio, and takes between 2,000 and 5,000 daily steps. She reports no medications, no relevant habits, and no medical conditions. Her symptoms are low energy and fatigue alongside low mood and anxiety. Her goals are to improve energy levels, improve mood, and reduce stress and anxiety. No additional context was provided.\n\nHer corrected calcium is 1.84, significantly below the lower limit of 2.2, and this is the finding that should go to her GP before anything else in this report. Calcium is the mineral the body uses for muscle contraction, nerve signalling, heart rhythm, and bone strength. The body guards its blood calcium level extremely tightly, using parathyroid hormone, or PTH, to pull calcium from bones and increase absorption from food whenever levels begin to drop. In Kayleigh's case, PTH is also suppressed at 0.3, well below the lower limit of 0.98. This combination, low calcium with low PTH, is unusual. Normally, when calcium drops, PTH rises to compensate. The fact that PTH has not risen suggests the parathyroid glands are not responding appropriately. This pattern is associated with a condition called hypoparathyroidism, where the parathyroid glands fail to produce enough PTH. However, the lab has flagged that calcium can be falsely reduced in older specimens, and PTH can also degrade if the sample was not centrifuged and separated promptly. It is therefore possible that these results reflect a sample handling issue rather than a true clinical finding. The GP should repeat both corrected calcium and PTH on a fresh sample that is processed immediately. If the results are confirmed on a fresh draw, further investigation into parathyroid function, including a full metabolic panel with phosphate and ionised calcium, would be appropriate. Both low energy and low mood can be features of low calcium, so if this result is genuine, correcting it could contribute meaningfully to how Kayleigh feels day to day.\n\nHer bicarbonate is 14.2, well below the lower limit of 20. Bicarbonate is the main buffer the blood uses to maintain its acid-base balance. A level this low suggests a metabolic acidosis, meaning the blood is more acidic than it should be. This could be connected to the low calcium finding, as certain causes of metabolic acidosis also affect calcium handling. It could also reflect dietary factors, dehydration at the time of the sample, or a renal tubular process. The GP should assess this alongside the calcium and PTH repeat, ideally with a venous blood gas and a full electrolyte panel including phosphate.\n\nHer vitamin B12 is 153, below the lower limit of 193 and well below the optimal range of 500 to 900. B12 is essential for nerve function, red blood cell production, DNA synthesis, and mood regulation. Deficiency is one of the most common and correctable causes of fatigue, low mood, brain fog, and poor concentration, which makes this finding directly relevant to both of her main symptoms. On a standard mixed diet rated 7 out of 10 for quality, B12 intake from food should be adequate, so the question is whether absorption is the issue. The low diet volume, rated 5 out of 10, may mean she is simply not eating enough B12-rich food, but if supplementation does not correct the level within three months, her GP may wish to check intrinsic factor antibodies to exclude pernicious anaemia, an autoimmune condition that prevents B12 absorption.\n\nHer white blood cell count is 3.82, just below the lower limit of 4.0, with neutrophils at 1.86, below the lower limit of 2.0, and monocytes at 0.07, below the lower limit of 0.2. Neutrophils are the immune cells that respond first to bacterial infections, while monocytes are the cells that clean up damaged tissue and coordinate longer-term immune responses. Taken together with her low reticulocyte count, which reflects how actively the bone marrow is producing new red blood cells, at 36 against a lower limit of 50, and her low B12, this pattern suggests the bone marrow is not receiving everything it needs to produce blood cells at full capacity. B12 deficiency directly impairs bone marrow function, and the low diet volume compounds this. The body, when it is not receiving enough raw materials, quietly economises by producing fewer immune cells and fewer new red blood cells. Her lymphocytes remain healthy at 1.85, and her ESR, a marker of inflammation, is excellent at 2, which is reassuring that this is a nutritional pattern rather than anything more sinister. Correcting the B12 deficiency and increasing overall food intake should be expected to bring these counts back toward normal, and they are worth repeating in three to four months to confirm improvement.\n\nTurning to what is working well, there is a great deal of positive news in this report. Her lipid profile is excellent. Total cholesterol is 4.8, LDL is 2.52, HDL is an impressive 1.9, and triglycerides are 0.92. Her ApoB, the protein that carries LDL cholesterol into artery walls, is 0.65, comfortably below the 0.9 threshold and even below the tighter 0.8 optimal target. Her ApoB to ApoA1 ratio, which is one of the best single measures of cardiovascular risk, is 0.45, well within the lower risk range. Her triglyceride to HDL ratio, calculated at 0.48, is outstanding, reflecting strong insulin sensitivity and minimal metabolic stress. Her Lp(a), a genetically inherited cardiovascular risk marker, is pending and noted as to follow below.\n\nHer glucose metabolism is in excellent shape. Fasting glucose is 4.4, HbA1c, which reflects average blood sugar over two to three months, is 33 mmol/mol, and her HOMA-IR, a calculated measure of insulin resistance, is 0.57, firmly in the insulin-sensitive range. At a BMI of 21.7 with low activity, this is a healthy and expected finding but still worth acknowledging. Her C-Peptide is 0.36 ug/L, which converts to approximately 119 pmol/L, below the laboratory lower limit of 1.1 ug/L (364 pmol/L). C-Peptide is released by the pancreas in equal measure to insulin and reflects how much insulin the pancreas is producing. However, with a fasting glucose of 4.4 and an HbA1c of 33, there is clearly no problem with blood sugar control. The low C-Peptide here simply reflects low insulin demand: the pancreas does not need to produce much insulin because the body is using it efficiently. This is not a concern.\n\nHer liver is in excellent health. ALT is 10, well below both the lab upper limit and the tighter optimal threshold of 25 for women. GGT, which is the liver enzyme most sensitive to metabolic strain, alcohol, and medication effects, is 16, comfortably within the optimal range. AST is 14, bilirubin is 9, albumin is 43, and her FIB-4 score, which estimates liver fibrosis risk, is 0.52, about as low as that calculation goes. The liver is under no strain at all.\n\nHer kidney function is strong. Creatinine-based eGFR is above 90, and her Cystatin C-based eGFR, which is a more precise measure that is not affected by muscle mass, is 98. Urea is 5.1, well within range. Uric acid is 240, within the laboratory range and within the optimal band for women.\n\nHer thyroid is functioning well. TSH, the hormone the pituitary gland uses to instruct the thyroid, is 0.68, within range. Free T4, the main thyroid hormone, is 15, and Free T3, the active form, is 4.5, which sits right at the lower edge of the optimal band. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. The thyroid is not contributing to her fatigue or low mood.\n\nHer hormonal profile is consistent with the follicular phase of her menstrual cycle. Oestradiol at 183, methylation, the biochemical process that influences mood, detoxification, and DNA repair. With her B12 already low, bringing folate into the optimal range would support the same pathways.\n\nHer magnesium is 1.07, within range but above the optimal upper limit of 1.05. This is a marginal finding and not clinically significant.\n\nHer immune markers, IgG, IgM, IgA, and IgE, are all within range. Rheumatoid factor is negative at 7, and her coeliac screen, tissue transglutaminase IgA, is negative. Her total antioxidant activity is 1.39, within range. Her tumour markers, CA-125, CA 15-3, CA 19-9, and CEA, are all within their respective ranges. Creatine kinase is 43, within range.\n\nHer MCHC, the mean corpuscular haemoglobin concentration, is 352, marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and storage, and at this margin, it is most likely a sample artefact rather than a genuine finding. Her RDW, red cell distribution width, is 11.4, fractionally below the lower limit of 11.6. RDW measures how uniform in size the red blood cells are, and a slightly low value simply means the cells are very uniform, which is not a clinical concern.\n\nHer urinalysis is largely unremarkable. WBCs in urine are 10, which the lab notes as not significant at this threshold. RBCs are less than 1. Nitrites are negative. Protein, glucose, ketones, urobilinogen, and casts are all negative. Bacterial count and urine culture are pending.\n\nIn summary, the two findings that matter most are the low corrected calcium with suppressed PTH, which needs urgent GP assessment and a repeat on a fresh sample, and the low B12, which is very likely contributing to her fatigue, low mood, and the mild bone marrow suppression seen in her white cell and reticulocyte counts. The low bicarbonate should be assessed alongside the calcium. Everything else in this report, from her cardiovascular risk profile to her liver, kidneys, thyroid, hormones, and inflammation, is in genuinely excellent health for a 26-year-old woman.","links":"The most important next step is a GP appointment to repeat the corrected calcium and intact PTH on a fresh sample that is centrifuged and separated promptly. Kayleigh should mention the bicarbonate of 14.2 at the same visit, as the GP may wish to add a venous blood gas and phosphate to the repeat panel. If the low calcium and suppressed PTH are confirmed, the GP will need to investigate parathyroid function further.\n\nThe second priority is correcting her B12 deficiency. A sublingual methylcobalamin supplement at 1,000 mcg daily is the recommended starting point. Sublingual delivery bypasses potential absorption issues in the gut and is more effective than standard oral tablets. She should also increase her dietary intake of B12-rich foods: eggs, dairy, fish, and meat are the primary sources. If her B12 has not risen above 500 on a retest in three to four months, her GP should consider checking intrinsic factor antibodies to exclude pernicious anaemia.\n\nHer folate at 7 would benefit from a modest increase. Leafy green vegetables, lentils, chickpeas, and fortified cereals are the best dietary sources. A methylfolate supplement at 400 to 800 mcg daily alongside the B12 would be appropriate, as the two vitamins work together in red blood cell production and methylation.\n\nHer vitamin D at 78 is just inside optimal but could be strengthened. A daily vitamin D3 supplement of 2,000 IU taken with a fat-containing meal, alongside 100 mcg of vitamin K2 in the MK-7 form, would help maintain and gently raise her level toward the middle of the optimal range of 75 to 120.\n\nRegarding diet volume, her current rating of 5 out of 10 is the single lifestyle factor most likely to be driving several findings in this report. At 59kg, 165cm, and her current activity level of one resistance session per week plus 2,000 to 5,000 steps, her estimated maintenance calorie requirement is approximately 1,700 to 1,850 calories per day, using a light activity multiplier of 1.45 applied to a basal metabolic rate of approximately 1,250 calories. She does not need to gain weight, but she does need to eat enough to fuel her bone marrow, immune system, and energy levels. A target of 1,700 to 1,850 calories per day with a protein intake of at least 77 to 94 grams per day (1.3 to 1.6g per kg of bodyweight, appropriate for her resistance training) would be a meaningful improvement. The diet quality at 7 out of 10 is good, so the issue is not what she is eating but how much.\n\nFor her energy and mood goals, increasing her daily step count would be one of the most effective interventions available. Walking is profoundly effective for mood regulation, stress reduction, and energy. A target of 7,000 to 8,000 steps per day, up from her current 2,000 to 5,000, would be a realistic first step. Getting outside within an hour of waking for a 15 to 20 minute walk exposes her to morning light, which sets the circadian clock, improves sleep quality, and supports cortisol and serotonin rhythms. Adding one to two sessions of cardiovascular exercise per week alongside her existing resistance session would further support her mood and energy goals.\n\nFor sleep quality, which is closely linked to both energy and mood, practical steps include keeping a fixed wake time seven days a week, avoiding caffeine after midday, keeping the bedroom cool at around 18 degrees, and limiting screen exposure in the hour before bed.\n\nThe following markers should be repeated in three to four months: corrected calcium, PTH, bicarbonate, vitamin B12, full blood count including reticulocytes, and folate. If the calcium and PTH are confirmed as abnormal by the GP on a fresh sample, the GP will direct further investigation and the timeframe may be shorter.","flags":"URGENT: Corrected calcium 1.84 mmol/L (range 2.2 to 2.6) with intact PTH 0.3 pmol/L (range 0.98 to 4.73). Low calcium with inappropriately suppressed PTH raises the possibility of hypoparathyroidism. However, the lab notes that calcium can be falsely reduced in older specimens and PTH degrades if not promptly separated. Recommend urgent repeat on a fresh, promptly processed sample. If confirmed, investigate parathyroid function including phosphate and ionised calcium.\n\nBicarbonate 14.2 mmol/L (range 20 to 31). Significantly below range, suggesting metabolic acidosis. Should be assessed alongside the calcium and PTH findings. Recommend venous blood gas and full electrolyte panel including phosphate.\n\nVitamin B12 153 pg/ml (range 193 to 982, optimal 500 to 900). Deficient. Likely contributing to fatigue, low mood, and the mild bone marrow suppression pattern seen below. Recommend sublingual methylcobalamin 1,000 mcg daily and retest in three to four months. If not corrected, check intrinsic factor antibodies.\n\nWhite cell count 3.82 x10^9/L (range 4.0 to 10.0), neutrophils 1.86 x10^9/L (range 2.0 to 7.0), monocytes 0.07 x10^9/L (range 0.2 to 1.0), absolute reticulocytes 36 x10^9/L (range 50 to 100). Mild pancytopenic pattern consistent with B12 deficiency and low dietary volume impairing bone marrow output. Lymphocytes preserved at 1.85. ESR normal at 2. Expect improvement with B12 correction and increased calorie intake. Recommend repeat FBC in three to four months.\n\nC-Peptide 0.36 ug/L (range 1.1 to 4.4), equivalent to approximately 119 pmol/L. Below range but in the context of fasting glucose 4.4, HbA1c 33, and HOMA-IR 0.57, this reflects low insulin demand rather than pancreatic insufficiency. Not clinically concerning.\n\nTransferrin 2.47 g/L (range 2.5 to 3.8). Marginally below range. Transferrin saturation 48.53% (range 18 to 55%). At the upper end but within range. Ferritin 55 ng/ml is normal. Pattern does not suggest iron overload. Monitor on repeat.\n\nFolate 7 ng/ml (range 3 to 17, optimal above 8). Suboptimal, particularly in context of B12 deficiency. Recommend dietary increase and supplementation.\n\nMCHC 352 g/L (range 315 to 345). Marginally above range. Lab notes MCHC can be affected by temperature and storage. Likely artefactual.\n\nRDW 11.4% (range 11.6 to 14). Fractionally below range. Indicates very uniform red cell size. Not clinically significant.\n\nLp(a): result pending (to follow). Should be reviewed when available as it is a one-time inherited cardiovascular risk marker.\n\nBacterial count and urine culture: pending (to follow).\n\nReassuring negatives: Liver function entirely normal (ALT 10, GGT 16, FIB-4 0.52). Kidney function strong (Cystatin C eGFR 98). Thyroid function normal with negative antibodies. Lipid profile excellent (ApoB 0.65, TG/HDL 0.48). Glucose metabolism excellent (HOMA-IR 0.57, HbA1c 33). CRP below 0.2. ESR 2. All tumour markers normal. Coeliac screen negative. Rheumatoid factor negative. Immunoglobulins all within range. Hormonal profile consistent with normal follicular phase.","recommendations":"1. Book a GP appointment within the next two weeks to repeat corrected calcium, intact PTH, and bicarbonate on a fresh sample processed immediately. Bring this report and the specific numbers: corrected calcium 1.84 (range 2.2 to 2.6), PTH 0.3 (range 0.98 to 4.73), bicarbonate 14.2 (range 20 to 31).\n\n2. Begin sublingual methylcobalamin 1,000 mcg daily immediately to correct the B12 deficiency of 153 (range 193 to 982).\n\n3. Begin a methylfolate supplement at 400 to 800 mcg daily to bring folate from 7 into the optimal range above 8.\n\n4. Continue or begin vitamin D3 at 2,000 IU daily with a fat-containing meal, paired with vitamin K2 (MK-7) 100 mcg daily.\n\n5. Increase daily calorie intake to 1,700 to 1,850 calories per day, focusing on protein-rich foods to reach 77 to 94 grams of protein per day.\n\n6. Increase daily step count to 7,000 to 8,000 steps, prioritising a morning walk outside within an hour of waking.\n\n7. Add one to two cardiovascular exercise sessions per week alongside the existing resistance session.\n\n8. Retest in three to four months: corrected calcium, PTH, bicarbonate, full blood count with reticulocytes, vitamin B12, and folate.\n\n9. Review the Lp(a) result when it arrives, as it is a one-time inherited marker that should be recorded permanently.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. This is the priority supplement from this report. Kayleigh's B12 at 153 is below the laboratory minimum of 193 and well below the optimal range of 500 to 900. B12 deficiency impairs red blood cell production, nerve function, and mood-regulating neurotransmitter pathways. Sublingual delivery is recommended over standard oral tablets because it is absorbed directly through the tissues under the tongue, bypassing any potential gut absorption issues.\n\nMethylfolate: 400 to 800 mcg daily, taken in the morning alongside B12. Folate at 7 is just below the optimal threshold of 8. Folate and B12 are metabolic partners, and correcting one without the other limits the benefit. Methylfolate is the active form and does not require conversion by the MTHFR enzyme.\n\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with the largest fat-containing meal of the day. Kayleigh's vitamin D at 78 is just inside the optimal range of 75 to 120 but would benefit from support to maintain and strengthen this level, particularly given her low mood symptoms and relatively low sun exposure implied by her step count.\n\nVitamin K2: MK-7 form, 100 mcg daily, taken alongside vitamin D3. K2 directs calcium into bones and teeth and away from soft tissues and arteries. It should always accompany vitamin D supplementation, and it is particularly relevant given the calcium findings in this report.\n\nDo not supplement with iron. Kayleigh's ferritin is 55 and her transferrin saturation is already at 48.53%, near the top of range. Additional iron would risk pushing saturation above the upper limit and is not needed.\n\nThe most important changes from this report are not supplements. They are seeing her GP to investigate the low calcium and PTH, eating more food to support her bone marrow and energy levels, and increasing her daily movement to support her mood and stress goals.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in the absence of food. Kayleigh's result of 4.4 is comfortably within both the laboratory range of 3.5 to 6.0 and the optimal range of 4.0 to 5.4, indicating excellent blood sugar regulation at rest.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress response, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.45","units":"%","description":"HbA1c, or glycated haemoglobin, measures the percentage of red blood cells that have sugar molecules attached to them, reflecting average blood sugar control over the previous two to three months. Kayleigh's result of 5.2% is well within the normal range of below 6.0% and confirms excellent long-term glucose management.","low_causes":"Very low carbohydrate intake, increased red blood cell turnover, blood loss","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard unit of mmol/mol. Kayleigh's result of 33 is well below the normal upper limit of 42 and below the optimal threshold of 36, confirming excellent blood sugar control over the past two to three months.","low_causes":"Very low carbohydrate intake, increased red blood cell turnover, blood loss","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3348","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5751","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to manage blood sugar. Lower levels in the context of normal blood sugar indicate strong insulin sensitivity, meaning the body needs very little insulin to keep glucose under control. Kayleigh's insulin at 2.9 is within both the lab range and the optimal range, and combined with her glucose of 4.4, confirms she is highly insulin-sensitive.","low_causes":"Low carbohydrate intake, very high insulin sensitivity, pancreatic insufficiency (if glucose also elevated)","high_causes":"Insulin resistance, high carbohydrate intake, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"119","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0909","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1456","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It serves as a reliable measure of how much insulin the pancreas is actually producing, because unlike insulin itself, C-Peptide is not cleared by the liver. Kayleigh's result of 119 pmol/L (converted from 0.36 ug/L) is below the laboratory lower limit of 364 pmol/L. However, in the context of a fasting glucose of 4.4, an HbA1c of 33, and a HOMA-IR of 0.57, this simply reflects very low insulin demand. The pancreas is producing only what is needed, and what is needed is very little. The lab also notes that delayed sample separation can reduce C-Peptide by up to 56%, which may have contributed. This is not a concern in the presence of normal blood sugar.","low_causes":"Low insulin demand due to high insulin sensitivity, low carbohydrate intake, delayed sample processing, type 1 diabetes (with elevated glucose)","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.38","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's effects. A lower score means the body responds very efficiently to insulin. Kayleigh's score of 0.57 is firmly in the insulin-sensitive range, meaning her cells are responding well to insulin with minimal effort from the pancreas. This is an excellent result.","low_causes":"High insulin sensitivity, low carbohydrate intake, lean body composition","high_causes":"Insulin resistance, obesity, metabolic syndrome, high carbohydrate diet, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"64.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2013","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates pancreatic beta-cell function, essentially how hard the pancreas is working to produce insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Kayleigh's score of 64.4 is below the reference range of 80 to 200. However, HOMA-B should always be interpreted alongside glucose and HbA1c. With both of those in excellent ranges, the low HOMA-B reflects that the pancreas is meeting demand comfortably with minimal effort, not that it is failing. This is consistent with a lean, insulin-sensitive individual.","low_causes":"Low insulin demand due to high insulin sensitivity, low carbohydrate intake, lean body composition","high_causes":"Insulin resistance requiring compensatory insulin production, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0893","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. It is one of the most sensitive markers of liver health. Kayleigh's ALT at 10 is well below both the laboratory upper limit of 56 and the tighter optimal threshold of 25 for women, indicating the liver cells are in excellent condition with no detectable strain.","low_causes":"Normal finding, very healthy liver","high_causes":"Fatty liver disease, alcohol, medications, viral hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5312","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It rises when any of these tissues are damaged. Kayleigh's AST at 14 is well within range and within the optimal band, confirming no tissue damage or metabolic strain.","low_causes":"Normal finding","high_causes":"Liver disease, muscle damage, intense exercise, heart damage, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2105","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2763","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is the liver enzyme most sensitive to alcohol, medications, and metabolic strain. It tends to rise before other liver markers when the liver is under pressure. Kayleigh's GGT at 16 is comfortably within both the lab range and the optimal threshold of below 25, indicating the liver is handling its workload without any detectable stress.","low_causes":"Normal finding","high_causes":"Alcohol consumption, fatty liver disease, medications, bile duct obstruction, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5952","units":"IU/L","description":"Alkaline phosphatase, or ALP, is an enzyme found in the liver, bones, and intestines. It is involved in bone turnover and bile duct function. Kayleigh's ALP at 73 is within the laboratory range of 46 to 116. At 26, bone turnover is still relatively active, and this level is entirely normal.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bone growth or healing, bile duct obstruction, liver disease, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. Mildly elevated bilirubin can indicate Gilbert's syndrome, a harmless genetic variant, while significantly elevated levels can indicate liver or bile duct problems. Kayleigh's bilirubin at 9 is comfortably within range, confirming normal red blood cell turnover and healthy bile flow.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis (red blood cell breakdown)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins carry hormones, fight infection, and maintain fluid balance. Kayleigh's total protein at 74 is within both the lab range and optimal range, indicating adequate protein status and healthy liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, chronic infection, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and maintains fluid balance. It is also a marker of nutritional status and liver synthetic function. Kayleigh's albumin at 43 is within both the lab and optimal ranges, confirming the liver is producing protein effectively.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. They play a key role in immune function and carrying substances through the blood. Kayleigh's globulin at 31 is within both the lab range and the optimal range.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between these two protein groups. Kayleigh's ratio of 1.39 is within both the laboratory and optimal ranges, indicating a healthy protein balance.","low_causes":"Overproduction of globulins (infection, inflammation, autoimmune disease), underproduction of albumin (liver disease)","high_causes":"Underproduction of globulins (immune deficiency)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1793","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated estimate of liver fibrosis risk, using age, ALT, AST, and platelet count. A score below 1.3 (or 2.0 in people over 65) suggests a very low risk of significant liver fibrosis. Kayleigh's score of 0.52 is about as low as this calculation gets, confirming there is no evidence of liver scarring or fibrosis.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, cirrhosis, age-related increase, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3712","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands. It breaks down starch into sugars during digestion. Elevated levels can indicate pancreatic inflammation. Kayleigh's amylase at 40 is within the laboratory range, indicating normal pancreatic function.","low_causes":"Chronic pancreatitis (late stage), pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4326","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5816","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is the more specific marker for pancreatic health compared to amylase. Kayleigh's lipase at 27 is within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3883","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL (protective), LDL (atherogenic), and VLDL. On its own it provides limited information, but in Kayleigh's case at 4.8 with an excellent breakdown between HDL and LDL, it confirms a healthy overall lipid picture.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2706","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, largely influenced by recent food intake, carbohydrate consumption, alcohol, and metabolic health. Lower levels indicate efficient fat metabolism. Kayleigh's triglycerides at 0.92 are within the optimal range of below 1.0, reflecting excellent fat metabolism and insulin sensitivity.","low_causes":"Low fat/carbohydrate diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate or alcohol intake, insulin resistance, obesity, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2692","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, or very low-density lipoprotein cholesterol, carries triglycerides from the liver to tissues. It is closely related to triglyceride levels and insulin sensitivity. Kayleigh's VLDL at 0.42 is within the optimal range, consistent with her excellent triglyceride and insulin sensitivity profile.","low_causes":"Low triglycerides, efficient fat metabolism","high_causes":"High triglycerides, insulin resistance, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5938","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is often called 'good' cholesterol because it carries cholesterol away from artery walls and back to the liver for recycling. Higher levels are protective against cardiovascular disease. Kayleigh's HDL at 1.9 is well above both the desirable threshold of 1.55 and the tighter optimal threshold of 1.6 for women. This is an excellent result and a strong cardiovascular protective factor.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high carbohydrate diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.336","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol from the liver to tissues and can deposit it in artery walls if levels are too high. It is the primary driver of atherosclerosis. Kayleigh's LDL at 2.52 is within the laboratory range and below the optimal upper limit of 2.6, which is a healthy result.","low_causes":"Hyperthyroidism, malabsorption, liver disease, statin therapy","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2811","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_posi
