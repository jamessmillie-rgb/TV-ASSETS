t cholesterol. Kayleigh's non-HDL at 2.9 is within both the lab range and the optimal range, confirming a low atherogenic burden.","low_causes":"Low LDL, low triglycerides, statin therapy","high_causes":"Elevated LDL, elevated triglycerides, metabolic syndrome, diet high in saturated fat","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5179","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein component of HDL cholesterol. It drives the reverse cholesterol transport process, carrying cholesterol away from arteries back to the liver. Higher levels are protective. Kayleigh's ApoA1 at 1.45 is above the desirable threshold of 1.4, consistent with her strong HDL level.","low_causes":"Genetic factors, smoking, sedentary lifestyle, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Each atherogenic particle carries exactly one ApoB molecule, so ApoB gives a direct count of how many particles are available to deposit cholesterol in artery walls. It is considered by many cardiologists to be the single best marker of cardiovascular risk. Kayleigh's ApoB at 0.65 is well below the desirable threshold of 0.9 and below the tighter optimal target of 0.8. This is an excellent result.","low_causes":"Genetic factors, very low LDL, malabsorption, hyperthyroidism","high_causes":"High LDL particle count, familial hypercholesterolaemia, insulin resistance, hypothyroidism, high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.375","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (artery-damaging) particles to protective particles. It is one of the best single summary measures of cardiovascular risk. A ratio below 0.6 for women indicates lower risk. Kayleigh's ratio of 0.45 is excellent, well within the lower risk range.","low_causes":"High ApoA1 (high HDL), low ApoB (low LDL), healthy lipid metabolism","high_causes":"High LDL particle count, low HDL, metabolic syndrome, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined cardiovascular risk marker. Unlike LDL and ApoB, Lp(a) levels are almost entirely inherited and cannot be changed by diet, exercise, or most medications. It only needs to be measured once in a lifetime. Kayleigh's Lp(a) result is pending and will be reviewed when available. If normal (below 32 nmol/L), it means any future cardiovascular risk is driven entirely by modifiable factors. If elevated, it becomes important permanent medical information that should be shared with her GP and first-degree relatives.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.16","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin sensitivity and metabolic health. A lower ratio indicates better insulin sensitivity and lower cardiovascular risk. Kayleigh's ratio of 0.48 is well within the optimal range of below 0.87, confirming excellent metabolic health and insulin sensitivity. This is calculated by dividing triglycerides (0.92) by HDL (1.9).","low_causes":"High insulin sensitivity, healthy metabolism, low carbohydrate intake, regular exercise","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2375","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich remnant particles. It is calculated as total cholesterol minus HDL minus LDL (4.8 - 1.9 - 2.52 = 0.38). Elevated remnant cholesterol is an independent cardiovascular risk factor. Kayleigh's remnant cholesterol at 0.38 is within the optimal range of below 0.5, reflecting healthy triglyceride metabolism.","low_causes":"Efficient triglyceride metabolism, low carbohydrate intake","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.02","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein, or hs-CRP, is the most reliable single marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Levels below 1.0 indicate low cardiovascular and systemic risk. Kayleigh's hs-CRP at below 0.2 is essentially undetectable, indicating an absence of systemic inflammation. This is an outstanding result.","low_causes":"Absence of inflammation, healthy metabolic state","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune disease, recent injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate, or ESR, measures how quickly red blood cells settle in a test tube over one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red blood cells to clump together. Kayleigh's ESR at 2 is excellent, confirming no systemic inflammatory process.","low_causes":"Absence of inflammation","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, pregnancy, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve and muscle function. Kayleigh's sodium at 141 is within both the laboratory and optimal ranges, indicating healthy fluid and electrolyte balance.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, vomiting, diarrhoea","high_causes":"Dehydration, excessive salt intake, kidney disease, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3487","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance and plays a key role in acid-base balance. Kayleigh's chloride at 97 is within the laboratory range. It is slightly below the optimal band, and in the context of her low bicarbonate, both findings may reflect the same acid-base disturbance that should be investigated by her GP.","low_causes":"Metabolic alkalosis, vomiting, diuretics, adrenal insufficiency","high_causes":"Metabolic acidosis (hyperchloraemic), dehydration, kidney disease, excessive saline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"14.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0967","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.6152","units":"mmol/L","description":"Bicarbonate is the main buffer in the blood, maintaining the acid-base balance that the body depends on for every cellular process. A low bicarbonate level suggests the blood is more acidic than it should be, a state called metabolic acidosis. Kayleigh's bicarbonate at 14.2 is significantly below the lower limit of 20. This is one of the findings that should be discussed with her GP, ideally alongside the calcium and PTH results. A venous blood gas would help clarify the cause and severity of this disturbance.","low_causes":"Metabolic acidosis (renal tubular acidosis, diabetic ketoacidosis, lactic acidosis, diarrhoea, toxins), sample handling","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product created when the liver breaks down protein, filtered out by the kidneys. It reflects both protein intake and kidney filtration capacity. Kayleigh's urea at 5.1 is within both the lab and optimal ranges, confirming healthy kidney filtration and adequate protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5041","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3545","upper_optimal_position":"0.6138","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a relatively constant rate. It is one of the main markers used to estimate kidney function. Kayleigh's creatinine at 70 is within both the lab and optimal ranges, consistent with healthy kidney function.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, high muscle mass, dehydration, high protein diet, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate, or eGFR, estimates how much blood the kidneys filter per minute. It is calculated from creatinine, age, and sex. A value above 90 indicates normal kidney function. Kayleigh's eGFR is reported as above 90, confirming healthy kidney filtration. The lab result states >90, so the exact value is above this threshold.","low_causes":"Kidney disease, dehydration, certain medications, ageing","high_causes":"High muscle mass (creatinine-based), pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"Cystatin C-based eGFR is an alternative measure of kidney filtration that uses a different protein, Cystatin C, instead of creatinine. It is more accurate in people with very high or very low muscle mass, as creatinine is influenced by muscle. Kayleigh's Cystatin C eGFR at 98 confirms excellent kidney function, consistent with the creatinine-based estimate.","low_causes":"Kidney disease, ageing","high_causes":"Normal finding in young healthy individuals","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"240","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3619","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5810","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, substances found in certain foods and produced by the body. The kidneys filter uric acid from the blood. Elevated levels can lead to gout and are associated with cardiovascular risk. Kayleigh's uric acid at 240 is within both the lab range and the optimal range for women, indicating normal purine metabolism and kidney clearance.","low_causes":"Low purine diet, certain medications, liver disease","high_causes":"High purine diet (red meat, organ meats, shellfish), alcohol, kidney disease, metabolic syndrome, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4227","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells in the body, filtered freely by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more precise marker of kidney function. Kayleigh's Cystatin C at 0.93 is within both the lab range and the optimal range, confirming excellent kidney filtration.","low_causes":"Normal finding","high_causes":"Kidney impairment, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"1.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3456","upper_optimal_position":"0.6158","units":"mmol/L","description":"Calcium is the most abundant mineral in the body, critical for bone strength, muscle contraction, nerve signalling, and heart rhythm. The body maintains blood calcium within a very tight range using parathyroid hormone (PTH) and vitamin D. Kayleigh's calcium at 1.86 is significantly below the laboratory lower limit of 2.08. The lab notes that calcium can be falsely reduced in older specimens, and this result should be repeated on a fresh, promptly processed sample. If confirmed, it requires further investigation by her GP.","low_ ns the red blood cells are very uniform in size. This is not a clinical concern and at this margin reflects normal variation.","low_causes":"Very uniform red blood cell size, normal finding at this margin","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"88.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"fL","description":"Mean corpuscular volume, or MCV, measures the average size of each red blood cell. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. Kayleigh's MCV at 88.4 is within the optimal range, indicating red blood cells of normal size. Notably, her B12 is low, but MCV has not yet risen, suggesting the deficiency has not been present long enough to enlarge the cells.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin, or MCH, measures the average amount of haemoglobin in each red blood cell. It reflects how well each cell is loaded with oxygen-carrying capacity. Kayleigh's MCH at 31.1 is within both the lab and optimal ranges.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"352","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, measures the average concentration of haemoglobin within each red blood cell. Kayleigh's MCHC at 352 is marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and storage. At this margin, this is most likely a sample artefact rather than a clinical finding. True MCHC elevation is very rare and usually associated with hereditary spherocytosis.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Sample artefact (temperature/storage), hereditary spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"221","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4233","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that help the blood clot when a vessel is damaged. They are produced by the bone marrow. Kayleigh's platelets at 221 are within both the lab and optimal ranges, confirming adequate clotting capacity and healthy bone marrow platelet production.","low_causes":"Viral infection, autoimmune conditions, bone marrow disorders, B12/folate deficiency, medications","high_causes":"I , and natural killer cells. Kayleigh's lymphocytes at 1.85 are within both the lab and optimal ranges, indicating a healthy adaptive immune system.","low_causes":"Viral infection (acute), corticosteroids, HIV, autoimmune conditions, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1542","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that play a role in cleaning up damaged tissue, fighting infections, and coordinating the immune response. They develop into macrophages in tissues. Kayleigh's monocytes at 0.07 are below the lower limit of 0.2. This is part of the same bone marrow pattern as the low neutrophils and reticulocytes, most likely driven by B12 deficiency and insufficient calorie intake. This should recover with nutritional correction.","low_causes":"B12 or folate deficiency, bone marrow suppression, hairy cell leukaemia (rare), low energy availability","high_causes":"Chronic infection, autoimmune disease, recovery from acute infection, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. Kayleigh's eosinophils at 0.02 are at the lower boundary of the lab range. This is a normal finding and indicates no active allergic or parasitic process.","low_causes":"Acute stress or infection, corticosteroids, Cushing's syndrome","high_causes":"Allergies, asthma, eczema, parasitic infection, drug reactions, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Basophils are the least common white blood cell type and play a role in allergic and inflammatory responses. Kayleigh's basophils at 0.02 are at the lower boundary of the range, which is a normal finding.","low_causes":"Acute allergic reaction, hyperthyroidism, corticosteroids","high_causes":"Chronic inflammation, hypothyroidism, myeloproliferative disorders, allergic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3852","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocyte percentage measures what proportion of red blood cells are newly produced (immature). It reflects bone marrow activity. Kayleigh's reticulocyte percentage at 0.87% is within the lab range, but the absolute count below is more informative.","low_causes":"B12 or folate or iron deficiency, bone marrow suppression, chronic disease, low energy availability","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia, response to supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"36.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0630","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Absolute reticulocyte count measures the actual number of immature red blood cells being released by the bone marrow into the blood. It is a direct measure of the bone marrow's red cell production rate. Kayleigh's absolute reticulocytes at 36.3 are below the lower limit of 50, indicating the bone marrow is producing fewer new red blood cells than expected. In the context of her B12 deficiency and low dietary volume, this reflects insufficient raw materials for blood cell production rather than a primary bone marrow disorder.","low_causes":"B12, folate, or iron deficiency, bone marrow suppression, chronic disease, low energy availability","high_causes":"Recovery from anaemia, haemolysis, blood loss, response to iron or B12 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3350","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio, or NLR, is calculated by dividing neutrophils by lymphocytes (1.86 / 1.85 = 1.01). It is a marker of systemic inflammation and immune balance. A lower ratio is generally favourable. Kayleigh's NLR at 1.01 is within the optimal range, indicating no systemic inflammatory shift. The ratio is at the lower end because both the numerator (neutrophils) and denominator (lymphocytes) are close in value, with neutrophils slightly suppressed.","low_causes":"Low neutrophils (nutritional deficiency, benign ethnic neutropenia), preserved lymphocytes","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"48.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5822","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5288","units":"%","description":"Transferrin saturation measures the percentage of iron-carrying capacity currently occupied by iron. It is calculated from serum iron and total iron binding capacity. Kayleigh's transferrin saturation at 48.53% is within the lab range of 18 to 55% but above the optimal upper limit of 40%. This means her iron carriers are more heavily loaded than ideal. With a ferritin of 55 (normal) and no other signs of iron overload, this is a minor finding that should be monitored on repeat testing rather than investigated further at this stage.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron supplementation, haemochromatosis, liver disease, B12 or folate deficiency (reduced erythropoiesis), excess iron intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"30.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6513","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3567","upper_optimal_position":"0.6167","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the sample. It fluctuates significantly throughout the day and with recent food intake, so it is best interpreted alongside transferrin saturation and ferritin. Kayleigh's serum iron at 30.1 is at the top of the lab range of 9 to 30.4 and above the optimal upper bound of 27. This is consistent with the high transferrin saturation and may reflect timing of the blood draw or recent iron-rich food. With normal ferritin and no clinical concern, this is a monitoring point.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss","high_causes":"Iron supplementation, haemochromatosis, liver disease, recent iron-rich meal, B12/folate deficiency (reduced utilisation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2949","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the main protein that transports iron through the blood. The body adjusts transferrin production based on iron status: when iron is low, transferrin rises to capture more; when iron is adequate or high, transferrin decreases. Kayleigh's transferrin at 2.47 is marginally below the lower limit of 2.5. In the context of adequate ferritin and high serum iron, this is a consistent pattern suggesting the body is downregulating iron transport because stores are sufficient. Transferrin is also a negative acute phase reactant, though her CRP is below 0.2, making inflammation an unlikely explanation.","low_causes":"Adequate iron stores, chronic disease, liver disease, protein malnutrition, haemochromatosis (investigate if significantly low)","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"56.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4672","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3365","upper_optimal_position":"0.6144","units":"umol/L","description":"Total iron binding capacity, or TIBC, measures the maximum amount of iron the blood can carry. It reflects the total amount of transferrin available. Kayleigh's TIBC at 56.9 is within both the lab and optimal ranges, indicating normal iron transport capacity.","low_causes":"Adequate iron stores, chronic disease, liver disease, haemochromatosis","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3871","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5163","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It is the most reliable single marker of iron stores and also acts as an acute phase reactant, rising during inflammation. Kayleigh's ferritin at 55 is within both the lab range and the optimal range for women of 40 to 150. This confirms healthy iron stores and, combined with her excellent CRP, means the ferritin is reflecting true storage rather than an inflammatory response.","low_causes":"Iron deficiency, blood loss, v adrenal tumour, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"302","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4768","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3577","upper_optimal_position":"0.6202","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production after childbirth. In non-pregnant, non-breastfeeding women, prolactin levels should remain within a moderate range. Elevated prolactin can suppress ovulation, affect menstrual regularity, and influence mood. Kayleigh's prolactin at 302 is within both the lab and optimal ranges for a non-pregnant female.","low_causes":"Dopamine agonist medications, pituitary insufficiency","high_causes":"Stress, pituitary adenoma (prolactinoma), hypothyroidism, medications (antipsychotics, metoclopramide), PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"39.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3527","lower_normal":"27.8","upper_normal":"146","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3352","upper_optimal_position":"0.5275","units":"nmol/L","description":"Sex hormone binding globulin, or SHBG, is a protein produced by the liver that binds testosterone and oestradiol, controlling how much of these hormones is freely available to tissues. Kayleigh's SHBG at 39.5 is within both the lab and optimal ranges, indicating a healthy balance that allows adequate free hormone availability.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism, anabolic steroid use","high_causes":"Oral contraceptives, hyperthyroidism, ageing, liver disease, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.019","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"0.005","upper_normal":"0.035","lower_optimal":"0.01","upper_optimal":"0.03","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"nmol/L","description":"Free testosterone is the portion of testosterone not bound to SHBG or albumin, and therefore available to act on tissues. It is calculated from total testosterone, SHBG, and albumin. Kayleigh's free testosterone at 0.019 is within both the lab and optimal ranges, indicating adequate bioavailable androgen levels.","low_causes":"High SHBG, low total testosterone, oral contraceptives","high_causes":"PCOS, low SHBG, exogenous testosterone, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3631","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4, or free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, T3, in tissues throughout the body. Kayleigh's FT4 at 15 is within both the lab range and the optimal range of 14 to 20, indicating adequate thyroid hormone output.","low_causes":"Hypothyroidism, iodine deficiency, pituitary disorder, sick euthyroid syndrome","high_causes":"Hyperthyroidism (Graves' disease, toxic nodule), excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3369","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4670","units":"mIU/L","description":"Thyroid stimulating hormone, or TSH, is produced by the pituitary gland to control the thyroid. When the thyroid produces enough hormone, TSH stays low; when it underperforms, TSH rises. Kayleigh's TSH at 0.68 is within the lab range of 0.55 to 4.78 but below the optimal band of 1.0 to 2.5. A TSH at the lower end of range with normal FT4 and FT3 is not concerning and can be a normal variant, particularly in younger individuals. It is not suggestive of hyperthyroidism when the free hormones are within range.","low_causes":"Mild thyroid overactivity, normal variant in young individuals, subclinical hyperthyroidism, excessive thyroid medication, early pregnancy","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the biologically active thyroid hormone. It is converted from T4 in tissues and drives metabolism, energy production, and body temperature regulation. Kayleigh's FT3 at 4.5 sits right at the lower edge of the optimal band of 4.5 to 6.5. It is within range and adequate, though it is at the lower boundary of optimal.","low_causes":"Non-thyroidal illness (sick euthyroid), calorie restriction, chronic stress, low T4, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"TPO Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/ml","description":"Thyroid peroxidase antibodies, or TPO antibodies, are immune proteins that target the thyroid gland. Their presence above the threshold indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Kayleigh's TPO antibodies at below 6.6 are well within the normal range of below 13.8, confirming no autoimmune thyroid attack.","low_causes":"Normal finding, absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Kayleigh's thyroglobulin antibodies at below 1.3 are within the normal range, and the lab notes that more than 80% of the population have undetectable levels at this threshold. This confirms no autoimmune thyroid disease.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.325","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone that the body produces from sunlight and obtains from certain foods. It is essential for calcium absorption, bone health, immune function, and mood regulation. Kayleigh's vitamin D at 78 is above the sufficiency threshold of 50 and just inside the optimal range of 75 to 120. Maintaining and gently increasing this level through supplementation would be beneficial for her mood and energy goals.","low_causes":"Limited sun exposure, dark skin, obesity, malabsorption, winter months, high latitude","high_causes":"Excessive supplementation, granulomatous disease (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Intact Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0634","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.6139","units":"pmol/L","description":"Parathyroid hormone, or PTH, is produced by the four small parathyroid glands behind the thyroid. Its primary role is to maintain blood calcium levels by increasing calcium absorption from food, reclaiming calcium from the kidneys, and releasing calcium from bones when needed. Kayleigh's PTH at 0.3 is significantly below the lower limit of 0.98. When calcium is low, UTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, works alongside B12 in red blood cell production, DNA synthesis, and methylation. It is abundant in leafy green vegetables, legumes, and fortified cereals. Kayleigh's folate at 7 is within the laboratory range of 3 to 17 but just below the optimal threshold of 8. With her B12 already low, ensuring folate is in the optimal range becomes more important, as the two vitamins are metabolic partners.","low_causes":"Low dietary intake of green vegetables and legumes, malabsorption, alcohol, certain medications (methotrexate, phenytoin), pregnancy","high_causes":"Supplementation, high intake of fortified foods, B12 deficiency (folate can accumulate when B12 is deficient)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3714","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase, or CK, is an enzyme found in muscle cells. It rises when muscles are damaged, whether from exercise, trauma, or disease. Kayleigh's CK at 43 is within both the lab and optimal ranges, indicating no muscle damage or significant recent muscle strain.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin therapy, hypothyroidism, muscular dystrophy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"12.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5263","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Immunoglobulin G, or IgG, is the most abundant antibody in the blood and plays a central role in long-term immune defence against bacteria and viruses. It reflects the body's acquired immunity from past infections and vaccinations. Kayleigh's IgG at 12.3 is within the laboratory range, indicating a healthy immune response capacity.","low_causes":"Primary immunodeficiency, certain medications, protein-losing conditions","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Immunoglobulin M, or IgM, is the first antibody produced in response to a new infection. It is the largest antibody and serves as an early warning system. Kayleigh's IgM at 1.7 is within the laboratory range, confirming a normal early immune response.","low_causes":"Primary immunodeficiency, certain medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5054","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Immunoglobulin A, or IgA, is the antibody found in mucosal surfaces including the gut, respiratory tract, and urinary tract. It is the body's first line of immune defence at mucosal barriers. Kayleigh's IgA at 2.3 is within the laboratory range. Adequate IgA is also important for the validity of the coeliac screen (TTG IgA), which relies on the body producing enough IgA to detect the antibodies.","low_causes":"Selective IgA deficiency (common, usually asymptomatic), immunosuppressive medications","high_causes":"Chronic mucosal infection, liver disease, IgA nephropathy, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"58.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.293","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Immunoglobulin E, or IgE, is the antibody associated with allergic responses and defence against parasites. Elevated levels can indicate allergies, asthma, eczema, or parasitic infection. Kayleigh's IgE at 58.6 is within the laboratory range of below 100, indicating no significant allergic or parasitic process.","low_causes":"Normal finding, some immunodeficiency states","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.25","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor, or RF, is an autoantibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. However, it can also be mildly positive in healthy individuals, particularly with age. Kayleigh's RF at 7 is within the normal range of below 14, confirming no evidence of rheumatoid arthritis or related autoimmune conditions.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, systemic lupus erythematosus, chronic infection, hepatitis C","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.745","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0518","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA, or TTG IgA, is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten. A negative result in a person eating a gluten-containing diet makes coeliac disease very unlikely. Kayleigh's result is negative at 0.745, well below the threshold of 7.19, and her IgA is adequate, meaning the test is reliable. Coeliac disease is effectively ruled out as a cause of her symptoms.","low_causes":"Normal finding, absence of coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis (if on gluten-containing diet)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3619","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.6","lower_normal_position":"0.3333","upper_nor function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}

      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){

  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');

  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);

  requestAnimationFrame(step);

  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
