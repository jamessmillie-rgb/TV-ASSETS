<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Joseph Kavvadias","dob":"13/07/1988","report_date":"2026-08-08","summary":"Joseph is a 38-year-old male presenting with a BMI of 39.5, at 128kg and 180cm. He follows a fully vegan diet rated 8 out of 10 for quality with a volume of 8 out of 10. He does 2 cardio and 2 resistance sessions per week with 7,500 to 10,000 daily steps. He sleeps fewer than 6 hours most nights. He reports poor sleep and insomnia, weight gain with difficulty losing weight, and low mood and anxiety. His goals are to lose body fat, prevent disease, and improve long-term health and longevity.\n\nThere is a genuine foundation to build from despite the challenges. His liver is in good shape, with Gamma GT at 23, which at BMI 39.5 is a genuinely positive finding since the enzyme most sensitive to metabolic strain is showing no concern. His FIB-4 at 1.03 shows no scarring. His kidney function is excellent, with a Cystatin C of 0.94 giving an eGFR of 106. His thyroid is working, with FT3 at 5.4 and both antibody tests negative, though his TSH at 3.38 is above ideal and may be partly BMI-driven. His testosterone at 21 is within the ideal range, which at BMI 39.5 is a strong result since excess fat typically suppresses production. His free testosterone at 0.493 is within ideal. His B12 at 463 is a good level on a vegan diet, showing he is supplementing or eating well-fortified foods. His folate at 17 is at the ceiling, reflecting the plant-rich diet. His immune cell counts and antibodies are all normal. His CRP at 1.3 is only mildly above ideal, which at BMI 39.5 is lower than expected since fat tissue is a source of chronic inflammation, suggesting the vegan diet may be providing some anti-inflammatory benefit. His ESR at 10 is within range. His pancreatic enzymes are within ideal. His prostate markers are reassuring. His coeliac screen is negative. His urinalysis is clear with no growth.\n\nHowever, the test has found two things that should go to the GP, and one metabolic finding that is the most actionable result in the report.\n\nHis rheumatoid factor is 90, more than six times the limit of 14. Rheumatoid factor is an antibody associated with rheumatoid arthritis, but it can also be raised in other autoimmune conditions, chronic infections, and occasionally in people without any disease. His CRP at 1.3 and ESR at 10 are both only mildly elevated, which is not the typical pattern of active inflammatory arthritis where both would usually be much higher. He has not listed joint symptoms. However, a result at more than six times the limit is significant and should not be left uninvestigated. The GP should check anti-CCP antibodies, which are a more specific test for rheumatoid arthritis. A raised RF with a negative anti-CCP would broaden the differential. A raised RF with a positive anti-CCP would warrant a rheumatology referral.\n\nHis parathyroid hormone is 9.3, nearly double the limit of 4.73, and this ties together several mineral findings into one picture. PTH is the hormone that controls calcium. When calcium falls or vitamin D is insufficient, the parathyroid glands raise PTH to compensate. His vitamin D is 48, below the laboratory range. His calcium at 2.18 is sitting at the floor of its range (corrected 2.21, just inside the limit). And his phosphate at 0.7 is below range. All of these are downstream consequences of inadequate vitamin D. The body is not absorbing enough calcium because there is not enough vitamin D to facilitate it, and the parathyroid glands are working overtime to prevent calcium from falling further.\n\nOn a vegan diet without dairy, calcium and vitamin D both need conscious attention because the usual dietary sources are absent. At BMI 39.5, the problem is compounded because fat tissue sequesters vitamin D, reducing how much reaches the blood. The concern with sustained high PTH is that it draws calcium from bone to maintain blood levels, which over time can reduce bone density. Supplementation with vitamin D3 from lichen at 4,000 IU daily with K2 MK-7 is recommended, alongside ensuring dietary calcium from fortified plant milks, tofu made with calcium sulphate, and leafy greens (kale, pak choi, broccoli rather than spinach, which binds calcium). The GP should be aware, and both vitamin D and PTH should be rechecked at 12 weeks. If PTH comes down as vitamin D rises, the matter is resolved. If it does not, further investigation would be needed.\n\nTurning to the metabolic picture and the symptoms he came to this test with.\n\nHis HOMA-IR is 2.7, well above the limit of 1.5, and this is the metabolic finding that matters most for his goals. HOMA-IR measures how well cells respond to insulin. At 2.7, the cells are significantly resistant, meaning the pancreas must produce roughly twice the normal amount of insulin to achieve the same blood sugar control. His glucose at 4.5 looks normal, and his HbA1c at 34 (5.3%) confirms it has been normal over the previous three months. But the cost of keeping it there is visible in his HOMA-B at 270, which shows the pancreas is working at roughly 1.5 times its normal capacity. The machinery is under strain. If the demand continues to rise, the pancreas will eventually be unable to keep up, and blood sugar will begin to rise. At BMI 39.5, the insulin resistance is expected and its driver is clear. The encouraging part is that insulin resistance reverses with weight loss, often quickly. A loss of 10 to 15kg would likely bring HOMA-IR substantially closer to the normal range.\n\nHis cholesterol picture reflects the insulin resistance. His ApoB at 0.99 is above the 0.9 target. His LDL at 3.09 is marginally above the limit. His HDL at 0.9 is below range, meaning the protective side is weak. His triglycerides at 1.72 are marginally above range. His TC:HDL ratio at 5.22 is above range and his ApoB/A-I ratio at 0.925 shows the harmful particles substantially outnumbering the protective ones. His TG:HDL ratio at 1.911, above the 1.5 nge. An iron supplement alongside iron-rich plant foods would help.\n\nHis vitamin D at 48 is below the laboratory range, as discussed in the PTH section above.\n\nHis creatinine at 62 is below the laboratory range, which at BMI 39.5 with no resistance training reflects lower muscle mass relative to total body weight rather than excellent kidney function. The Cystatin C is the reliable measure and confirms healthy kidneys.\n\nHis MCHC at 349 is marginally above range. His bicarbonate at 31.4 is marginally above range. His uric acid at 459 is above ideal, consistent with the BMI and insulin resistance. His potassium at 3.6 is just above the lower limit and below ideal. None of these are concerns, though adequate potassium intake through bananas, potatoes, avocados, beans and leafy greens is sensible.","links":"Three things for the GP.\n\nThe rheumatoid factor is 90, more than six times the limit of 14. Ask for anti-CCP antibodies, which are the more specific test. Take this report so the CRP (1.3) and ESR (10) are visible as context.\n\nThe PTH of 9.3 should be discussed alongside the vitamin D of 48, the calcium at 2.18, and the phosphate at 0.7. Vitamin D supplementation should bring the PTH down, but the GP should recheck both at 12 weeks.\n\nThe neutrophils at 1.57 should be flagged and repeated to see whether this is persistent.\n\nFor the weight loss goal, which would address the insulin resistance, the cholesterol, the oestradiol, the cortisol, and potentially the sleep and mood: at 128kg and 180cm with 4 training sessions and 7,500 to 10,000 steps, maintenance is roughly 3,200 to 3,600 calories. A target of 2,400 to 2,800 with at least 130 to 160g of protein daily (which requires particular attention on a vegan diet, drawing from tofu, tempeh, seitan, lentils, chickpeas, and supplementation if needed) would produce steady fat loss. Even a first-step loss of 10 to 15kg from 128kg would substantially improve the HOMA-IR and the downstream findings.\n\nAdding resistance training would accelerate the body composition change and improve insulin sensitivity directly. Even increasing from 2 to 3 or 4 sessions would make a meaningful difference.\n\nSleep should move from under 6 hours to 7 to 8. This would help the cortisol, the mood, the insulin sensitivity, and the weight loss. Fixed wake time, outside within an hour of waking, caffeine cut-off around midday, cool bedroom.\n\nVitamin D3 from lichen at 4,000 IU daily with K2 MK-7 at 100 to 200 micrograms, taken with a meal containing fat.\n\nAn iron supplement (ferrous bisglycinate at 25 to 50mg with vitamin C) to bring ferritin up from 31.\n\nEnsure dietary calcium from fortified plant milks, calcium-set tofu, kale, pak choi, broccoli, and fortified cereals.\n\nEnsure adequate potassium from bananas, potatoes, avocados, beans, leafy greens.\n\nContinue whatever is maintaining the B12 at 463. This is well managed.\n\nA follow-up in 12 weeks: vitamin D, PTH, calcium, phosphate, full blood count with neutrophils, HOMA-IR, HbA1c, full lipid panel with ApoB, ferritin, rheumatoid factor and anti-CCP, cortisol, oestradiol, and TSH.","flags":"FOR GP\n\nRheumatoid factor is 90, more than six times the limit of 14. CRP 1.3 and ESR 10 both only mildly elevated. No joint symptoms reported. Anti-CCP antibodies should be checked. Investigate.\n\nPTH 9.3, nearly double the limit of 4.73. Vitamin D 48, below range. Calcium 2.18, at the floor (corrected 2.21). Phosphate 0.7, below range. Pattern is consistent with secondary hyperparathyroidism from vitamin D deficiency, compounded by BMI 39.5 (fat sequesters vitamin D) and vegan diet (no dairy calcium). Supplement vitamin D aggressively and recheck vitamin D and PTH at 12 weeks.\n\nWBC 3.37 (below 4). Neutrophils 1.57 (below 2). Immunoglobulins all normal. Low ferritin (31) on a vegan diet may be contributing through reduced iron availability for immune cell production. Flag and repeat.\n\nMETABOLIC\n\nHOMA-IR 2.7 (above 1.5). Insulin resistance confirmed. Glucose 4.5 and HbA1c 34 (5.3%) both normal, but pancreas compensating hard: HOMA-B 270 (above 200), insulin 13.5, C-Peptide 916.9. Pre-prediabetes stage where weight loss produces the largest return.\n\nCARDIOVASCULAR\n\nApoB 0.99 (above 0.9). LDL 3.09 (above 3). HDL 0.9 (below 1.0). Triglycerides 1.72 (above 1.7). TC:HDL ratio 5.22 (above 4.5). ApoB/A-I ratio 0.925 (above 0.7). TG:HDL ratio 1.911 (above 1.5). ApoA-1 1.07, below ideal. VLDL 0.78 at limit. Lipoprotein(a) 25 normal, so no inherited component. Driven by insulin resistance and BMI.\n\nHORMONES\n\nOestradiol 148, above range (146.1). BMI 39.5 driving aromatase conversion. Testosterone 21 within ideal despite conversion (testes compensating well). Cortisol 412, above ideal (400). Chronic stress and sleep deprivation.\n\nNUTRITIONAL\n\nFerritin 31, within range but well below ideal 80. Vegan diet with poor iron absorption. RDW 14.4 above ideal. Retics absolute 49.92, marginally below range. Supplement iron.\n\nVitamin D 48, below range. Fat tissue sequesters vitamin D at BMI 39.5. Vegan diet lacks natural sources. Supplement 4,000 IU daily.\n\nOTHER\n\nCreatinine 62 (below 65). Low muscle mass relative to body weight at BMI 39.5. Cystatin C 0.94 confirms eGFR 106 (excellent kidneys).\n\nMCHC 349, marginally above range. Bicarbonate 31.4, marginally above range. Uric acid 459, above ideal (BMI, insulin resistance). Potassium 3.6, just above lower limit.\n\nReassuring: kidney function excellent (Cystatin C 0.94, eGFR 106). Liver clean (GGT 23, FIB-4 1.03). Testosterone 21 and free T 0.493 both ideal at BMI 39.5. B12 463 well maintained. Folate 17. Thyroid negative antibodies. PSA 0.64. Coeliac negative. Urine clear.","recommendations":"See the GP about the rheumatoid factor of 90. Ask for anti-CCP antibodies.\n\nDiscuss the PTH of 9.3 with the GP alongside the vitamin D of 48, the calcium at 2.18, and the phosphate at 0.7. Recheck vitamin D and PTH at 12 weeks after supplementation begins.\n\nFlag the neutrophils at 1.57 with the GP for repeat testing.\n\nRetest in 12 weeks: vitamin D, PTH, calcium, phosphate, full blood count with neutrophils, HOMA-IR, HbA1c, full lipid panel with ApoB, ferritin, rheumatoid factor and anti-CCP, cortisol, oestradiol, TSH.","supplementation":"Vitamin D3 from lichen (the vegan form) at 4,000 IU daily, taken with a meal containing fat, alongside vitamin K2 as MK-7 at 100 to 200 micrograms. His level of 48 is below the laboratory range, and at BMI 39.5 a higher dose is needed because fat tissue sequesters vitamin D. K2 helps direct calcium into bone rather than soft tissue, which is particularly important here given the raised PTH.\n\nIron as ferrous bisglycinate at 25 to 50mg daily, taken on an empty stomach with a source of vitamin C. The bisglycinate form is better tolerated than ferrous sulphate. His ferritin at 31 is running low on a vegan diet, and improving it would support red blood cell production, immune function (relevant to the low neutrophils), and energy.\n\nContinue whatever is maintaining B12 at 463. If supplementing, sublingual methylcobalamin at 1,000 micrograms daily is reliable.\n\nMagnesium glycinate at 300 to 400mg before bed. His level at 1.01 is within range. It supports sleep quality, directly relevant to the fewer than 6 hours he is getting.\n\nOmega-3 from algal oil providing 1 to 2g of combined EPA and DHA daily (the vegan alternative to fish oil). Supports cardiovascular health, relevant to the elevated ApoB and the insulin resistance picture.\n\nThe most important actions from this report are not supplements. They are the GP appointments for the rheumatoid factor and the PTH, losing weight, adding resistance training, and getting more sleep. Weight loss alone would improve the HOMA-IR, the cholesterol, the oestradiol, the cortisol, the vitamin D availability, and the load on the pancreas.","biomarkers":[{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","units":"g/l","description":"W 9184","upper_optimal_position":"0.6598639456","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","units":"g/L","description":"Above the target at 0.99. ApoB counts the cholesterol particles capable of depositing into artery walls. At 0.99, the count is modestly elevated. His Lipoprotein(a) at 25 is normal, confirming no inherited component. The insulin resistance at HOMA-IR 2.7 is the primary driver.","low_causes":"Rarely significant","high_causes":"Insulin resistance, BMI","padding":"1","one_sided":"0.5","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.55","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Well above the threshold at 0.925. This compares harmful particles against protective ones, and at 0.925 the harmful side substantially outnumbers the protective. This ratio would improve from both directions with weight loss (lowering ApoB) and exercise (raising ApoA-1).","low_causes":"High ApoA-1","high_causes":"Low HDL, insulin resistance","padding":"1","one_sided":"0.5","result":"0.925","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6607","lower_normal":"","upper_normal":"0.7","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3571428571","range_type":"no lower"},{"key":"tghdlratio","name":"TG:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Above the threshold at 1.911. This ratio is one of the better indicators of insulin resistance, and at this level it confirms the HOMA-IR finding.","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"1.911","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.637","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Within the laboratory range, above ideal.","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4437","lower_normal":"","upper_normal":"0.8","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3125","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","units":"nmol/l","description":"Within range at 25. No inherited cardiovascular risk. The cholesterol picture is driven entirely by insulin resistance and body composition, which means it would respond to weight loss.","low_causes":"Genetics","high_causes":"Genetics","padding":"1","one_sided":"0.5","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3906","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.21875","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"Within the ideal range at 4.5, and this number deserves context because it looks reassuring on its own.\n\nHis glucose is normal, but the amount of insulin required to keep it there is not. His insulin at 13.5 alongside a glucose of 4.5 gives a HOMA-IR of 2.7, which is well above the 1.5 limit. This means his cells are resistant to insulin, and his pancreas is working hard to compensate. His HOMA-B at 270, which estimates how hard the insulin-producing cells are working, is well above the normal range of 80 to 200, confirming the pancreas is producing a large amount of insulin to hold the line.\n\nThe good news is that the pancreas is succeeding. His HbA1c at 34 (5.3%) confirms average blood sugar has been healthy over the previous three months. But this is the stage where the machinery is under strain, and if the demand continues to rise with weight gain, there will come a point where the pancreas can no longer keep up. That is when blood sugar begins to rise and prediabetes develops. Weight loss is the single most effective way to reduce insulin resistance, and at this stage even a modest reduction in weight produces a disproportionately large improvement.","low_causes":"Excess insulin","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.2","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4266666667","upper_optimal_position":"0.5333333333","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","units":"mmol/mol","description":"At 34, which is 5.3%. Within the ideal range. Blood sugar control is being maintained, but the HOMA-IR and HOMA-B show it is costing the pancreas a great deal of effort.","low_causes":"Anaemia","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0. sue, particularly around the organs, interferes with insulin signalling. The encouraging part is that insulin resistance reverses with weight loss, often more quickly than people expect. A loss of 10 to 15kg would likely bring HOMA-IR substantially closer to the normal range.","low_causes":"Exceptional sensitivity","high_causes":"Insulin resistance, BMI","padding":"1","one_sided":"0.5","result":"2.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","range_type":"normal"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","units":"","description":"Above range at 270. HOMA-B estimates how hard the insulin-producing cells are working. At 270, the pancreas is working at roughly 1.5 times its normal capacity to keep blood sugar controlled. The pancreas is coping, but it is under sustained strain.","low_causes":"Low demand","high_causes":"Compensating for insulin resistance","padding":"1","one_sided":"0.5","result":"270","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8611","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity CRP","group":"INFLAMMATION","units":"mg/l","description":"Above the ideal level at 1.3, within the laboratory range. At BMI 39.5, a CRP of only 1.3 is actually lower than might be expected, since fat tissue is a source of chronic inflammation. It suggests the vegan diet may be providing some anti-inflammatory benefit.","low_causes":"Rarely significant","high_causes":"BMI, chronic inflammation","padding":"1","one_sided":"0.5 ":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","units":"nmol/L","description":"Below the laboratory range at 48, and this is one of the most important findings in the report because of what it is doing to the rest of the mineral picture.\n\nVitamin D is needed for the body to absorb calcium from food. At 48, there is not enough, and the result is visible in several other markers: the parathyroid hormone at 9.3 (nearly double the limit) is the body's emergency response to try to maintain calcium, the calcium itself is sitting at the floor of its range, and the phosphate at 0.7 is below range. All of these are downstream consequences of inadequate vitamin D.\n\nAt BMI 39.5, the problem is compounded because fat tissue sequesters vitamin D, reducing how much is available in the blood. On a vegan diet, the main natural source (oily fish) is absent, and fortified foods may not be providing enough. Supplementation at 4,000 IU daily is recommended, using vitamin D3 from lichen (the vegan form) with K2 MK-7 at 100 to 200 micrograms. This should be rechecked at 12 weeks to confirm the level is improving and the PTH is coming down.","low_causes":"Limited sun exposure, BMI sequesters it, vegan diet","high_causes":"Supplementation","padding":"1","one_sided":"0.5","result":"48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3289","lower_normal":"50","upper_normal":"200","lower_optimal":"100","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5555555556","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","units":"pg/ml","description":"Within the ideal range at 463. A good result on a vegan diet, which suggests he is supplementing or eating well-fortified foods. B12 is found naturally only in animal products, so maintaining this level on a vegan diet requires conscious effort, and he is doing it.","low_causes":"Low intake, vegan diet","high_causes":"Supplementation","padding":"1","one_sided":"0.5","result":"463","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4474","lower_normal":"193","upper_normal":"982","lower_optimal":"300","upper_optimal":"600","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3785382341","upper_optimal_position":"0.5052809463","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","units":"ng/ml","description":"At the upper limit of range. Folate is abundant in plant foods, and a level at the ceiling on a vegan diet is expected and healthy.","low_causes":"Poor intake","high_causes":"Vegan diet","padding":"1","one_sided":"0.5","result":"17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4523809524","upper_optimal_position":"0.5952380952","range_type":"normal"},{"key":"totalantioxidantstatus","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","units":"mmol/l","description":"Above the laboratory reference range at 2.2, and this is a positive finding. Total Antioxidant Activity measures the combined capacity of circulating antioxidants to neutralise free radicals. A higher level reflects a diet rich in antioxidant compounds, which his vegan diet, heavy in fruits, vegetables and whole grains, provides naturally. Higher is better.","low_causes":"Poor diet","high_causes":"Diet quality, supplementation (higher is better)","padding":"1","one_sided":"0.5","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7","lower_normal":"1.3","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"","lower_optimal_position":"0.5","upper_optimal_position":"","range_type":"no upper"},{"key":"parathyroidhormone","name":"Intact Parathormone Level","group":"SPECIALIZED TESTS","units":"pmol/L","description":"Significantly above range at 9.3, nearly double the limit of 4.73, and this is the finding that ties the mineral picture together.\n\nPTH is the hormone that controls calcium. When calcium falls or vitamin D is insufficient, the parathyroid glands raise PTH to compensate. PTH does three things: it releases calcium from bone, it tells the kidneys to retain calcium and excrete phosphate, and it converts vitamin D into its active form. At 9.3, the glands are working very hard.\n\nWith his vitamin D at 48 (below range), his calcium at the floor (2.18), and his phosphate below range (0.7), this is a pattern called secondary hyperparathyroidism, meaning the PTH is raised because of the vitamin D deficiency rather than because of a problem with the glands themselves. The body is struggling to maintain calcium levels because there is not enough vitamin D to absorb calcium from food.\n\nThe concern with sustained high PTH is that it draws calcium from bone to maintain blood levels, which over time can reduce bone density. At 38, bone density should be at or near its peak, and addressing this now matters.\n\nThe GP should be aware. The expected sequence is: supplement vitamin D aggressively, recheck vitamin D and PTH at 12 weeks, and if PTH comes down as vitamin D rises, the diagnosis is confirmed and resolved. If PTH remains elevated despite adequate vitamin D, the GP would investigate further.","low_causes":"Vitamin D deficiency causing secondary hyperparathyroidism","high_causes":"Primary hyperparathyroidism","padding":"1","one_sided":"0.5","result":"9.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":" bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
