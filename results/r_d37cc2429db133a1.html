<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"dob":"01/06/1989","flags":"Lipoprotein(a) 400.8 nmol/L, more than five times the 75 upper limit, with LDL 4.31 mmol/L (limit 3.0), ApoB 1.18 g/L (optimal below 0.8), HDL 1.33 (below 1.55 lower limit), and a strong paternal family history of stroke and early heart attack. Cardiovascular Risk Score 85 out of 100. This is the most significant finding and warrants referral to a lipid clinic to discuss treatment for the modifiable lipid fraction and to consider Lp(a)-specific therapies. First-degree relatives should be tested for Lp(a).\nVitamin D 318 nmol/L, far above the 75 to 120 optimal, with PTH suppressed at 0.7 pmol/L (lower limit 1.6) and adjusted calcium 2.45 mmol/L at the upper end of the 2.2 to 2.6 range. Indicates excess vitamin D supplementation. Stop all vitamin D supplements immediately. Recheck calcium and PTH in six to eight weeks.\nUrine dipstick: nitrite positive, white blood cells large, red blood cells moderate. Sample received outside its stability window; repeat on a fresh sample.\nMCV 100.7 fL (upper limit 100) and MCH 32.8 pg (upper limit 32). B12 and folate are above range from supplementation, excluding deficiency. The most likely cause is alcohol at more than seven drinks per week. The full blood count was received outside its stability window.\nTransferrin saturation 51.6% (upper limit 50%) with transferrin 2.06 g/L at the floor of range and TIBC 47.5 at the floor of range. Ferritin 127.61 is healthy. Marginally elevated saturation warrants monitoring on retest; if persistent, consider HFE gene test.\nCA 15-3 26.7 ku/L, marginally above the 26.2 upper limit. Non-specific marker. Laura has breast implants since 2013. Arrange the breast ultrasound she has been considering.\nSHBG 118 nmol/L, near the top of the 32.4 to 128 range, with calculated free testosterone 0.008 nmol/L at the very bottom of optimal. Low bioavailable testosterone may contribute to low mood, reduced motivation and hair thinning. Reducing alcohol and increasing resistance training may help lower SHBG.\nEGF 260 pg/mL (upper limit 240) and HB-EGF 225.79 pg/mL (upper limit 135.99). Growth factors that may be elevated by the pre-ovulatory hormonal surge. Note for retest comparison.\nASO 201.2 iu/mL, marginally above the 200 upper limit. Suggests a recent streptococcal infection. No action needed unless symptoms of post-streptococcal complications develop.\nBicarbonate 19.5 mmol/L, marginally below the 20 lower limit. Likely laboratory variation or mild dietary influence. Not clinically significant in isolation.\nIL-15 0.60 pg/mL, below the 0.89 lower limit. Mildly low immune signalling marker. Not clinically significant on its own.\nCopper 12.4 umol/L, marginally below the 12.6 lower limit. Borderline and may reflect normal variation. Recheck on next test.\nReassuring negatives: thyroid function normal with negative antibodies (TSH 1.91, FT4 20.7, anti-TPO 8.11, anti-Tg 17.40), coeliac excluded (tTG 0.5), autoimmune screen clear (ANA negative, RF below 6.72, anti-CCP below 8), kidney function excellent (cystatin C eGFR 108), liver healthy (ALT 14, GGT 23.1, FIB-4 0.59), no anaemia (Hb 149), HbA1c 31.04 confirming excellent glucose control, hsCRP below 0.30, all cardiac markers within range, all tumour markers within range except marginal CA 15-3, H. pylori negative, EBV past infection only.\nNot returned by the laboratory: Apolipoprotein CII, Apolipoprotein CIII, Leptin, Resistin, Interleukin-6, TNF-alpha, Cystatin C (urine), NGAL (urine), KIM-1, Pepsinogen I, Pepsinogen II, Gastrin-17, D-Dimer, Thyroxine-binding globulin, extended cytokine and adhesion-molecule panels, FABP-4 to FABP-9 panels, cytokine autoantibody panel. Reticulocyte count and RDW were also not returned; a typical RDW was assumed for the PhenoAge calculation. HOMA-IR and Intrinsic Factor Antibodies are pending.","links":"The dominant finding in Laura's results is the lipoprotein(a) at 400.8 nmol/L, and it reframes several other results. Her total cholesterol of 5.99, LDL of 4.31 and ApoB of 1.18 look like a straightforward lipid problem at first glance, but when the Lp(a) contribution is removed, her corrected LDL falls to 3.01, just touching the upper limit. This means that roughly 30% of what the standard lipid panel calls LDL is actually Lp(a) particles. The practical consequence is that dietary and lifestyle changes will improve the modifiable 70% but cannot touch the Lp(a)-driven 30%, which is why a lipid clinic referral rather than simply a diet plan is the right next step. The low HDL at 1.33 is a separate modifiable factor that compounds the risk: with fewer protective particles to remove cholesterol from artery walls and a very high number of atherogenic particles depositing it, the net direction of cholesterol traffic is unfavourable. The Cardiovascular Risk Score of 85 is driven almost entirely by the Lp(a) and the LDL and ApoB that sit on top of it, rather than by the metabolic markers, which are clean.\n\nThe vitamin D at 318, suppressed PTH at 0.7 and calcium at 2.45 form a second coherent thread. Vitamin D promotes calcium absorption from the gut, and when vitamin D is excessively high the body absorbs more calcium than it needs. PTH, the hormone that normally raises calcium when it drops, senses the high calcium and shuts down, which is exactly what has happened here. The PTH of 0.7 is the body's appropriate response to excess vitamin D, not a primary parathyroid problem. Once vitamin D supplementation is stopped and the level falls back toward the 75 to 120 optimal range, PTH should recover and calcium should settle in the middle of its range. This is a supplementation problem, not a disease.\n\nThe macrocytosis, the high SHBG, and probably a portion of Laura's mood and anxiety symptoms share a common contributor: alcohol at more than seven drinks per week. Alcohol causes macrocytosis by directly impairing DNA synthesis in red blood cell precursors, independently of B12 and folate. Alcohol raises SHBG by increasing hepatic SHBG production, which in turn lowers bioavailable testosterone. And alcohol disrupts sleep architecture, increases next-day anxiety through a rebound excitatory neurotransmitter effect, and is a known depressant. The liver is handling the load without visible enzyme strain, with GGT at 23.1 and ALT at 14, but the effects are showing up in the blood count and the hormone binding rather than in the liver markers. This is an important distinction: the absence of liver damage does not mean the absence of biological effect.\n\nThe iron picture is a loose end. The transferrin saturation at 51.6% with a very low transferrin of 2.06 and low TIBC of 47.5 does not fit neatly with the otherwise healthy ferritin of 127. In a woman who menstruates, haemochromatosis is less common because monthly blood loss offloads iron, but it is not impossible, and if the saturation remains above 50% on retest, an HFE gene test would settle the question. The alternative explanation is that transferrin, as a negative acute-phase reactant, is suppressed by something, but CRP is below 0.30, which makes an inflammatory explanation unlikely.\n\nThe urine dipstick findings, positive nitrite, large white blood cells and moderate red blood cells, stand alone from the rest of the picture. The sample was received outside its stability window and the dipstick should simply be repeated on a fresh sample.\n\nFinally, the symptoms Laura describes, feeling different, low mood, anxiety, hair thinning, irregular periods, loss of motivation, are genuine and distressing, but the bloods exclude many of the serious causes: thyroid disease is excluded with a normal TSH and negative antibodies, anaemia is excluded with a haemoglobin of 149, coeliac disease is excluded, autoimmune disease is excluded, and blood sugar control is excellent. The most likely contributors are the very low free testosterone from high SHBG, the hormonal shifts of the late thirties affecting her cycle, alcohol's effects on mood and sleep quality, and insufficient physical activity for its antidepressant effect. These are all modifiable.","summary":"Laura is a 37-year-old female presenting with a BMI of 20.8, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. She trains once per week with resistance exercise and no dedicated cardio, averaging 5,000 to 7,500 daily steps. She reports alcohol consumption of more than seven drinks per week and vapes nicotine. She takes IM8, glutathione, Biocomplete, magnesium, NMN, and microdoses of retatrutide and KLOW peptides. She reports low mood and anxiety, hair thinning, and irregular periods. Her goals are to improve mood, balance hormones, and reduce stress and anxiety. She describes feeling fundamentally different, with depressive feelings, loss of enthusiasm, night-time heat, and a significant change in her menstrual pattern from a regular four-day bleed on a 28-day cycle to a seven-to-eight-day bleed of varying heaviness. She has a history of an overactive thyroid and suspected Graves' disease five years ago which settled without treatment. Her paternal grandmother had a heart attack and dementia, her paternal uncle died young from a heart attack, and her father has had three strokes. She has breast implants since 2013 which have never been checked and has been considering a breast ultrasound. She has no family history of cancer and has not had Covid vaccination.\n\nThe most important finding in this report is Laura's lipoprotein(a), and it is the one that needs to go to her GP before anything else here. Lipoprotein(a), often written Lp(a), is a type of cholesterol particle that is entirely genetically determined. It cannot be changed by diet, exercise or lifestyle. Laura's Lp(a) is 400.8 nmol/L, more than five times the upper limit of 75, which places her in the highest risk category for this marker. Lp(a) accelerates cardiovascular disease through three mechanisms: it deposits cholesterol into artery walls in the same way LDL does, it promotes blood clotting by interfering with the body's clot-dissolving system, and it drives inflammation within artery walls. Set against Laura's strong paternal family history of stroke and early heart attack, this result almost certainly explains why her family has been affected. Her father's strokes, her uncle's early death, and her grandmother's heart attack are all consistent with inherited high Lp(a) running through the paternal line. Laura's LDL cholesterol is 4.31 mmol/L, well above the 3.0 target, and her ApoB, which is the protein that sits on every LDL and Lp(a) particle and is the best single measure of how many atherogenic particles are in the blood, is 1.18 g/L, above the 0.8 target we use for someone at elevated cardiovascular risk. However, when the contribution of Lp(a) is subtracted from LDL, her Lp(a)-corrected LDL is 3.01 mmol/L, which means that roughly 1.3 mmol/L of what the lab calls LDL is actually Lp(a). This is clinically important because it tells Laura and her GP that even if every modifiable lipid risk factor were optimised, a large atherogenic burden would remain from the Lp(a) alone. Her HDL cholesterol is 1.33, below the 1.55 lower limit and below the 1.6 optimal, which reduces the protective side of the equation. Her triglycerides at 0.76 are excellent, and her small dense LDL at 34.3 is well within range, which is genuinely positive. But taken together, the combination of very high Lp(a), elevated LDL, elevated ApoB and low HDL gives Laura a TrueVitals Cardiovascular Risk Score of 85 out of 100, where below 20 is ideal and below 40 is acceptable. This is high, and it is high predominantly because of the Lp(a). We would recommend that Laura is referred to a lipid clinic. Lp(a) at this level, combined with the family history, may meet criteria for early pharmacological treatment to lower the modifiable portion of her risk, and there are emerging therapies specifically targeting Lp(a) that a lipid specialist can discuss. Laura's first-degree relatives, particularly any siblings, should also be tested for Lp(a) because this is an inherited trait and early knowledge changes management.\n\nThe second finding that requires action is Laura's vitamin D. Her level is 318 nmol/L, which is far above the 75 to 120 optimal range. Vitamin D is a fat-soluble vitamin that accumulates in the body, and at this level it is suppressing her parathyroid hormone, or PTH, which is the hormone that regulates calcium. Her PTH is 0.7 pmol/L, well below the lower limit of 1.6, and her adjusted calcium is 2.45, sitting at the upper end of the 2.2 to 2.6 range. This pattern, very high vitamin D with suppressed PTH and calcium drifting toward the top of range, indicates excess vitamin D supplementation and the body is beginning to lose its ability to regulate calcium properly. If vitamin D continues to accumulate, calcium can rise above range and cause symptoms including nausea, confusion, kidney stones and, in sustained cases, kidney damage. Laura should stop all vitamin D supplementation immediately and have her calcium and PTH rechecked in six to eight weeks to confirm that PTH recovers and calcium does not climb further. This is not dangerous at present, but it does require action now to prevent it becoming so.\n\nThe urine dipstick was positive for nitrite, with large white blood cells and moderate red blood cells. Randox note that the urine sample was received outside its stability window, so these results are reported as found and should be repeated on a fresh sample. If she has no symptoms, it should still be repeated to confirm or exclude infection.\n\nTurning to what is working well, and there is a good deal to feel positive about here. Laura's kidney function is excellent. Her cystatin C, which is a more reliable measure of kidney filtration than creatinine alone, is 0.79, giving a cystatin C-derived eGFR of 108 and a combined eGFR of 104, both comfortably above the 90 optimal threshold. Her urea, uric acid and microalbumin-to-creatinine ratio are all within ideal ranges, and her beta-2-microglobulin at 1.30 shows no tubular stress. Her liver is in excellent health. ALT at 14 and AST at 19.2 are both well within range, her GGT at 23.1 is below the 25 optimal threshold for a woman, and every liver scoring index, her FIB-4 at 0.59, APRI at 0.148, NAFLD fibrosis score at minus 3.036, and R factor at 0.76, confirms no fibrosis and no fatty liver disease. Her bilirubin, bile acids, albumin and GLDH are all clean. This is a liver that is coping well despite the alcohol intake, but that does not mean the alcohol is without consequence elsewhere, and we will come to that. Her cardiac markers, troponin T, CK-MB, myoglobin and FABP-3, are all well within range, showing no cardiac muscle stress. Her inflammatory markers are broadly reassuring. Her high-sensitivity CRP, which is the most useful single marker of systemic inflammation, is below 0.30, which is as low as it gets and is genuinely excellent. Her complement proteins C3 and C4 are within range, and her haptoglobin at 0.43 is just above the lower limit, which excludes significant haemolysis. Her autoimmune screen is entirely clear: ANA negative, anti-CCP below 8, rheumatoid factor below 6.72, coeliac antibodies at 0.5, and gastric parietal cell antibodies at 0.5. Critically for Laura, given her history of suspected Graves' disease, both thyroid antibodies are negative: anti-TPO at 8.11 and anti-thyroglobulin at 17.40 are both well within their reference ranges. This is reassuring and suggests that whatever autoimmune thyroid process may have been present five years ago is not currently active. Her thyroid itself is functioning well. TSH at 1.91 is within the 1.0 to 2.5 optimal range, and her free T4 at 20.7 sits near the top of the reference range. Her free T3 at 4.29 is within range but below the 4.5 optimal, and her FT3-to-FT4 ratio at 0.207 is at the very bottom of the 0.2 to 0.45 range, which suggests conversion of T4 to the active T3 form is somewhat sluggish. This is not a thyroid problem requiring treatment, but it may contribute modestly to her fatigue and low mood, and it is worth monitoring. Her blood sugar control is good. The sample was drawn at 10:53 in a fed state, so the glucose of 6.40, insulin of 266 pmol/L and C-peptide of 5.23 ng/mL all reflect a recent meal and cannot be interpreted as fasting values. They do not indicate insulin resistance. Her HbA1c at 31.04 mmol/mol, which reflects average blood sugar over the previous two to three months, is well below 36 and confirms that glucose control over time is excellent. Her fructosamine at 249, which captures a shorter two-to-three-week window, supports the same conclusion. Her estimated average glucose is 5.3 mmol/L, which is ideal. The insulin-based indices (HOMA-IR, HOMA-B and the insulin ratios) have been left out of this report because they cannot be calculated from a non-fasting sample; the laboratory's own HOMA-IR, still pending, will carry the same caveat. They should be disregarded. Her immunoglobulins IgA, IgG and IgM are all within range, and IgE is low, showing no allergic drive. Her Epstein-Barr virus serology shows the pattern of past infection: both EBNA IgG and VCA IgG are strongly positive while VCA IgM is negative. This means Laura had glandular fever at some point in the past and her immune system retains memory of it, which is entirely expected and not a sign of active infection. Her H. pylori antibody is negative at 0.54, excluding current or recent stomach infection. Her gastrin is normal. Her tumour markers are broadly reassuring: AFP, CEA, CA 19-9, CA 125, hCG, mesothelin, calcitonin and NSE are all within range.\n\nHer CA 15-3 is 26.7, marginally above the 26.2 upper limit. CA 15-3 is a protein that can be elevated in breast cancer but is also raised by many benign conditions including breast implants, liver disease, ovarian cysts and even the menstrual cycle. At 0.5 above the limit, and with Laura having breast implants since 2013 that have never been checked, the most proportionate response is for Laura to arrange the breast ultrasound she has already been considering. This is not alarming, but it does give a practical reason to follow through on that plan, and her GP can arrange it.\n\nLaura's iron studies tell an interesting story. Her ferritin at 127.61 is healthy and within the 40 to 150 optimal range for a woman. Her serum iron at 24.5 is good. However, her transferrin saturation is 51.6%, above the 50% upper limit, and her transferrin itself at 2.06 is at the very bottom of the 2.0 to 3.8 range. Her TIBC at 47.5 is also at the floor of its range. This pattern, high saturation with low transferrin and low TIBC, can sometimes indicate iron overload or, less commonly, hereditary haemochromatosis. However, the ferritin at 127 is not in the territory that typically triggers concern for haemochromatosis in women, and the saturation at 51.6% is only marginally above range. It is worth mentioning to her GP so that it can be monitored on retest, and if the pattern persists or the saturation climbs, an HFE gene test could be considered.\n\nLaura's full blood count was received outside its stability window, so these results should be interpreted with that caveat. Her MCV at 100.7 fL is above the 100 upper limit, and her MCH at 32.8 pg is above the 32 upper limit. MCV measures the average size of red blood cells, and when red cells are larger than normal it is called macrocytosis. The two most common causes are vitamin B12 deficiency and folate deficiency, but Laura's B12 at 1,062 and her folate at 26.1 are both above range from supplementation, and her red cell folate at 1,684.90 confirms tissue stores are more than adequate. With B12 and folate excluded, the most likely explanation for the macrocytosis is alcohol. Alcohol directly interferes with red blood cell production in the bone marrow, causing cells to be released at a larger size even when all the raw materials are present. At more than seven drinks per week, this is a plausible and well-recognised mechanism. Her haemoglobin at 149, haematocrit at 45.7%, and red blood cell count at 4.54 are all within range, so the bone marrow is producing enough cells, they are just slightly too large. This is not dangerous in itself, but it is the blood telling Laura that alcohol is having a measurable biological effect.\n\nHer copper at 12.4 umol/L is marginally below the 12.6 lower limit. Copper is an essential trace element involved in iron metabolism, connective tissue formation and nervous system function. At 0.2 below range, this is borderline and could reflect genuine mild deficiency or simply normal variation. It is worth rechecking on the next test. Laura's zinc at 14.9 is within the optimal range, and her magnesium at 0.92 is within range though below the 0.85 to 1.05 optimal, which is adequate.\n\nLaura's bicarbonate at 19.5 is marginally below the 20 lower limit. Bicarbonate is part of the body's acid-base buffering system. At 0.5 below range, this is likely either laboratory variation or a mild metabolic acidosis that could relate to diet, alcohol or the timing of the sample. It is not clinically significant on its own but is noted for completeness.\n\nHer antistreptolysin O titre, or ASO, is 201.2, marginally above the 200 upper limit. ASO measures antibodies against streptococcal bacteria and indicates a recent or past streptococcal infection such as a throat infection. At 1.2 above the limit, this suggests Laura has had a streptococcal infection in the recent past, probably within the last few months. It does not mean active infection and does not require treatment unless she is having symptoms such as joint pain, rash or kidney problems. Her inflammatory markers are otherwise clean, so this is noted as a historical footprint rather than an active concern.\n\nLaura's hormonal picture is consistent with a sample taken around ovulation. Her LH at 15.3 with FSH at 3.75 gives an LH-to-FSH ratio of 4.08, which is above the 2.0 upper limit but is expected during the LH surge that triggers ovulation. Her oestradiol at 1,126 pmol/L is a pre-ovulatory peak level, entirely normal for this point in the cycle. Her progesterone at 0.83 is low, which is expected before ovulation because progesterone only rises significantly after the egg is released. This snapshot does not tell us what is happening in her luteal phase, which is the phase relevant to her symptoms of irregular bleeding. To properly assess her cycle, progesterone would need to be measured on day 21 of her cycle, roughly seven days after expected ovulation. Her testosterone at 1.20 nmol/L is within the 0.29 to 1.67 range, and her calculated free testosterone at 0.008 nmol/L sits at the very bottom of the optimal range. Her SHBG at 118 is near the top of the 32.4 to 128 range, which is the reason free testosterone is at the floor: SHBG is the protein that binds sex hormones and removes them from circulation, and when it is high, less testosterone is available to tissues. Elevated SHBG in women can be driven by the oral contraceptive pill, thyroid overactivity, low body weight or alcohol. Laura is not on the pill and her thyroid is now normal, but both her lean body composition and her alcohol intake could be contributing. The combination of low free testosterone with high SHBG may be relevant to her symptoms of low mood, reduced motivation and hair thinning, because even though her total testosterone is in range, the amount available to her brain and hair follicles is minimal. Her DHEA-S at 6.6 umol/L is within range, her cortisol at 189 nmol/L is within range for a late-morning draw, her prolactin at 235 is normal, and her IGF-1 at 23.3 is within range.\n\nTwo inflammatory markers from the extended panel are above range. EGF, or epidermal growth factor, is 260 pg/mL against an upper limit of 240, and HB-EGF, or heparin-binding EGF-like growth factor, is 225.79 against an upper limit of 135.99. Both of these are growth factors involved in tissue repair and cell proliferation. The HB-EGF elevation is the more notable of the two. These can be elevated in the context of inflammation, tissue repair or hormonal fluctuation, and with Laura's sample drawn around ovulation when oestradiol is at its peak, a hormonal contribution is plausible. Her IL-15 at 0.60 is below the 0.89 lower limit. IL-15 is an immune signalling molecule involved in maintaining certain white blood cell populations. A mildly low level is not clinically significant on its own but is noted. Her Platelet-to-Lymphocyte Ratio at 249.2 is above the 210 upper limit, and her Systemic Immune-Inflammation Index at 895 is above the 600 upper limit. Both of these are composite inflammatory indices. Given that the hsCRP is below 0.30, these elevations are more likely driven by the relatively low lymphocyte count of 1.30, which sits at the bottom of its range and inflates any ratio that uses lymphocytes as the denominator, rather than by genuine systemic inflammation. The blood count was received outside its stability window, which adds further uncertainty to these ratios.\n\nLaura's PhenoAge is 33.7 against a calendar age of 37, so her blood chemistry reads about three years younger than she is, helped by an undetectable CRP and healthy kidney and liver markers and held back by the large red cells. Randox does not report red cell distribution width, so a typical value was assumed for that input, and the glucose input was taken from her HbA1c-estimated average rather than the non-fasting value.\n\nPutting this all together, the story Laura describes, of feeling fundamentally different, losing motivation, experiencing anxiety and low mood, hair thinning and a disrupted menstrual cycle, is real and clearly affecting her quality of life. The bloods do not point to a single dramatic cause, but they do reveal several threads that may be weaving together. The very high SHBG is squeezing her free testosterone to the absolute floor, and free testosterone influences mood, motivation, energy and hair quality in women. The slightly sluggish T4-to-T3 conversion could be contributing a small amount to the picture. The menstrual changes she describes, longer and more irregular bleeding, are common in the late thirties and can reflect early perimenopausal hormonal shifts, though her FSH at 3.75 and oestradiol at 1,126 do not suggest she is perimenopausal at this point. The irregular bleeding pattern would be worth investigating with a day-21 progesterone to check that ovulation is being followed by adequate progesterone production, and a pelvic ultrasound could be considered to exclude structural causes such as polyps or fibroids. Alcohol at more than seven drinks per week is a measurable factor: it is the most likely cause of the macrocytosis, it raises SHBG, it disrupts sleep quality even when sleep quantity seems adequate, and it is a direct central nervous system depressant that worsens anxiety and low mood. Nicotine from vaping constricts blood vessels and stimulates cortisol, which can compound anxiety. Laura's diet quality at 5 out of 10 and volume at 5 out of 10 suggest room for improvement, and at 60 kg with only one resistance session per week and no cardio, she may not be getting enough of the physical activity that is one of the most effective interventions for mood and anxiety. The retatrutide and KLOW peptides she is microdosing are noted as context but are not something this report can evaluate or endorse.","is_retest":false,"lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon or leftover chicken. Anchor: protein goes on the plate first, before anything else. Why: at a diet quality of 5 out of 10 and a protein target of 96 grams per day, consistent protein supports muscle maintenance, hormone production and satiety, and Laura has noticed muscle loss since reducing her training.\nBuild back to two to three resistance training sessions per week, starting by adding one session this week. Anchor: pick a fixed day and time and treat it like an appointment. Why: resistance training is the most effective way to maintain the muscle Laura has noticed losing, it lowers SHBG which would free up more of her testosterone, and it has strong evidence for reducing anxiety and improving mood.\nAdd a 20-minute walk after your largest meal each day. Anchor: plate in the sink, shoes on. Why: a post-meal walk improves glucose handling, supports cardiovascular health given the Lp(a) risk, and regular walking is associated with measurable reductions in anxiety.\nReduce alcohol to four or fewer drinks per week, ideally with at least three consecutive alcohol-free days. Anchor: choose your drinking days at the start of the week rather than deciding in the moment. Why: alcohol is the most likely cause of the large red blood cells, it raises the SHBG that is suppressing free testosterone, it disrupts sleep quality, and it worsens anxiety through a rebound mechanism the morning after.\nEat two portions of oily fish per week, such as salmon, mackerel or sardines. Anchor: swap one of this week's evening meals for a fish-based dish. Why: omega-3 fatty acids raise HDL, lower triglycerides, reduce inflammation, and have evidence for improving mood and anxiety.\nAdd 30 grams of soluble fibre daily through oats, beans, lentils and vegetables, building up gradually over two weeks. Anchor: start with a bowl of porridge at breakfast this week. Why: soluble fibre binds cholesterol in the gut and lowers LDL, which is the modifiable portion of Laura's lipid risk.\nFix a consistent wake time seven days a week and get outside within 30 minutes of waking. Anchor: alarm goes off, curtains open, step outside with a glass of water. Why: morning light resets the circadian clock, which stabilises cortisol rhythm, improves sleep quality and has direct evidence for lifting mood and reducing anxiety.\nCut caffeine after 1pm and stop vaping nicotine in the two hours before bed. Anchor: set a phone reminder at 1pm for caffeine and at 9pm for nicotine. Why: both caffeine and nicotine disrupt deep sleep, and sleep quality is one of the most powerful levers for mood, anxiety and hormone balance that blood tests cannot measure.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","units":"/100","result":"61","padding":"1","one_sided":"0.5","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","range_type":"no upper","description":"Your TrueScore is 61 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. The insulin, C-peptide and glucose from this non-fasting sample, and the B12 and folate that are high only because of supplements, are excluded from the score because they do not describe her health. What holds the score down is real: lipoprotein(a) at 400.8 with LDL 4.31 and HDL 1.33, the excess vitamin D with a suppressed PTH, and the large red cells. Kidneys, liver, thyroid, glucose control and inflammation all score well.","high_causes":"","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5545","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","units":"/100","result":"85","padding":"1","one_sided":"0.5","low_causes":"Favourable lipid profile, low inflammation, good glucose control","range_type":"no lower","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the atherogenic risk being built in the arteries, not the ten-year probability of an event. Laura's score of 85 out of 100 is well above the 40 acceptable threshold and is driven almost entirely by her Lp(a) of 400.8, with contributions from her elevated LDL of 4.31, ApoB of 1.18 and low HDL of 1.33. At 37, Laura's ten-year absolute risk of a cardiovascular event is low because of her age, but the risk being built in her arteries is high, and the gap between those two numbers is the window for acting. A lipid clinic referral is the right response.","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","units":"g/l","result":"149.0","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, heavy menstrual bleeding","range_type":"normal","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. Laura's level of 149 g/L is within the ideal range for a woman, sitting comfortably between the 120 and 155 optimal bounds. This confirms she is not anaemic, which is important given her symptoms of fatigue and low mood, as anaemia is one of the common treatable causes of both.","high_causes":"Dehydration, polycythaemia, living at altitude, chronic lung disease","lower_normal":"115","upper_normal":"165","lower_optimal":"120","upper_optimal":"155","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5604","lower_normal_position":"0.3333","upper_normal_position":"0.6667   }
  let markers = [];

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail

  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;

  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">

      <span class="bc-tick tick-${col}"></span>

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
