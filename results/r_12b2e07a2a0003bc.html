<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Charles Shambrook","dob":"19/04/1994","report_date":"2026-11-06","summary":"Customer is a 32-year-old male presenting with a BMI of 34.4, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food daily; portions are larger than average (volume 7 out of 10). He does no cardio and no resistance training, with 2,000 to 5,000 daily steps. He sleeps eight or more hours but feels tired most mornings, with an afternoon energy crash and stress that feels hard to manage most days. He does not drink alcohol. He takes magnesium. He has no diagnosed conditions and takes no medications. This is his first blood test. He reports low energy and fatigue, low mood and anxiety, bloating and digestive discomfort, and difficulty losing weight. His goals are to lose body fat, improve his mood, and reduce stress and anxiety.\n\nThe most important story in this report is metabolic. His fasting insulin is 12.63, which by itself sits within the laboratory range of 2.6 to 24.9, but when combined with his fasting glucose of 5.4 the HOMA-IR, a measure of how hard the body has to work to keep blood sugar under control, comes back at 3.03 against an upper limit of 1.5. His result crosses the threshold that is widely recognised as significant insulin resistance. His TyG index, another insulin-resistance marker built from triglycerides and glucose, is 9.16 against a target of below 8.5, confirming the same picture from a different angle. His HbA1c, which reflects average blood sugar over three months, is 37, inside the normal range of below 42 but above the optimal threshold of 36. His C-peptide, the molecule released alongside every unit of insulin, is 2.28 ug/L (approximately 754 pmol/L), comfortably within range and consistent with a pancreas that is producing plenty of insulin. The problem is not production; the problem is that the tissues are requiring more and more insulin to do the same job. At 32 with a BMI of 34.4, daily sugary food, no structured exercise, and an afternoon energy crash, the mechanism is clear: excess body fat, particularly visceral fat around the organs, makes the cells less responsive to insulin, so the pancreas compensates by producing more. The afternoon crash he describes is a classic symptom: after a carbohydrate-rich meal the overshooting insulin drives blood sugar down, leaving fatigue, irritability and cravings. This is the single biggest lever in the report and the finding that, left unaddressed, can lead to pre-diabetes and then type 2 diabetes. Addressed now, at 32, it is entirely reversible.\n\nHis lipid panel reinforces the metabolic picture. Total cholesterol is 5.4, above the desirable threshold of 5.18. LDL cholesterol, the particles that deposit cholesterol in artery walls, is 3.49 against an upper limit of 3.0. ApoB, which counts every atherogenic particle in the blood and is a better predictor of cardiovascular risk than LDL alone, is 1.27 against a target of below 0.9, placing it in the laboratory's 'high' category. His triglycerides are 2.21, above the fasting target of 1.7 and well above the optimal of below 1.0. His HDL, the protective cholesterol that carries fat away from artery walls, is 1.0, sitting at the boundary of the undesirable zone. The ratio of ApoB to ApoA1, which captures the balance between harmful and protective particles in a single number, is 0.992, above the higher-risk threshold of 0.9. The TC/HDL ratio is 5.4 against a target of below 4.5, and Non-HDL cholesterol is 4.4 against a target of below 4.0. The atherogenic index of plasma is 0.344 against a target of below 0.21. His Lp(a)-corrected LDL, which removes the cholesterol carried by inherited Lp(a) particles to show the modifiable portion, is 3.38, still above 3.0, meaning the vast majority of his elevated LDL is driven by modifiable factors rather than genetics. His cardiovascular risk score, a TrueVitals index from 0 to 100 that captures the risk being built right now regardless of age, is 80 against an ideal of below 20. At 32 his ten-year risk of a heart attack remains low simply because of his age, but an 80 means the metabolic machinery driving risk is running hard and the gap between 80 and 20 is the window for acting. The combination of high triglycerides, low HDL and elevated ApoB alongside insulin resistance is a well-recognised pattern sometimes called the metabolic syndrome lipid triad: the liver, bathed in excess insulin, overproduces triglyceride-rich VLDL particles (his VLDL is 1.0 against a target of below 0.78), which flood the bloodstream, exchange their triglycerides for cholesterol with HDL, and leave behind small dense LDL particles. Fixing the insulin resistance, through weight loss, dietary change and movement, fixes the lipids. His Lp(a) is 32.97, marginally above the 32 threshold. Lp(a) is entirely inherited and does not change with diet or exercise. At this level, just above the ideal, it is within the slightly increased risk band (32 to 90) and is not a driver of his cardiovascular profile; the modifiable factors are doing the heavy lifting. It is worth recording for future reference.\n\nHis hs-CRP, a marker of systemic inflammation, is 2.6 against an optimal of below 1.0. It is within the laboratory range of below 5, but levels between 1 and 3 are associated with moderate cardiovascular risk and above 3 with higher risk. At a BMI of 34.4, the most likely source is adipose tissue itself: fat cells release inflammatory signals (cytokines) that raise CRP. His ESR, the erythrocyte sedimentation rate, another inflammatory marker that measures how quickly red blood cells settle in a tube, is 16 against an upper limit of 12, adding a second signal of low-grade inflammation. This chronic low-grade inflammatory state is associated with fatigue, low mood, and difficulty losing weight, all of which he reports. Losing body fat is the most effective anti-inflammatory intervention available.\n\nThere is genuine good news in this report. His liver is handling the metabolic load well. ALT is 48, above the optimal of below 30 but within the reference range of below 56, and with a GGT of only 20, an AST of 27, a clean bilirubin at 10 and a FIB-4 fibrosis score of 0.56 (well below the threshold of 1.45), the APRI score of 0.303 (well below 0.5), and a NAFLD fibrosis score of negative 2.567, there is no evidence of fibrotic liver disease. The slightly elevated ALT is consistent with fatty infiltration of the liver at this BMI rather than progressive damage, and it will come down with weight loss. His De Ritis ratio (AST to ALT) of 0.56 is below the lower reference of 0.6, but this is expected when ALT is mildly raised and AST is not, and in the absence of any other liver concern it does not suggest pathology. His kidneys are working well, with a cystatin C of 1.05 (below the 1.1 limit), a combined eGFR of 98, creatinine of 72, urea of 4.4, and a urea-to-creatinine ratio of 61.1, all within healthy ranges. Uric acid at 329 is within range and within the optimal band. His thyroid is functioning well: TSH at 2.24, free T4 at 17.2 and free T3 at 5.4 are all within their optimal ranges, the FT3-to-FT4 ratio is 0.314 which is ideal, and both thyroid antibodies are negative, making autoimmune thyroid disease very unlikely. His pancreatic enzymes, amylase at 42 and lipase at 32, are healthy. His immune system is broadly in good shape, with IgG at 11.9 and IgE at 49.2 both within range, and rheumatoid factor at 4, well below the 14 limit. His coeliac screen (tissue transglutaminase IgA) is negative, which is useful given his bloating symptoms because it makes coeliac disease very unlikely. His prostate markers are excellent at 32, with PSA at 0.29 and a healthy free PSA ratio of 0.552. His tumour markers CA19-9 and CEA are both well within range. His cortisol at 220 is within the expected morning range, and his reproductive hormones, LH at 2.1, FSH at 3.6, prolactin at 220 and oestradiol at 81, are all within their reference ranges. His calcium at 2.44, corrected calcium at 2.37, PTH at 1.8 and magnesium at 0.9 are all healthy. His vitamin D at 78 is sufficient and within the optimal band of 75 to 120. Creatine kinase at 118 is mid-range and healthy. His full blood count is largely clean: haemoglobin at 158, red cells at 5.14, haematocrit at 0.449, MCV at 87.5, MCH at 30.8, platelets at 223 and white cell count at 4.51 are all within range. His NLR (neutrophil-to-lymphocyte ratio, a marker of systemic stress) is 1.39, well within the ideal band. His platelet-to-lymphocyte ratio at 134.3 and systemic immune-inflammation index at 309 are both within optimal ranges. His serum osmolality at 287.8 is within range. His total antioxidant activity at 1.78 is marginally above the upper limit of 1.77, which with magnesium supplementation is the most likely explanation and is not a concern.\n\nHis PhenoAge, a biological ageing marker derived from nine blood values, is 27.6 against a calendar age of 32, meaning his blood chemistry currently reads about four and a half years younger than his age. That is a genuinely positive finding, and it means that despite the metabolic strain, his body has not yet accumulated the inflammatory and organ-level damage that accelerates biological ageing. The window is open.\n\nHis testosterone at 13.2 is within the laboratory range of 8.4 to 28.7 but below the optimal of 18. His SHBG (sex hormone binding globulin, the protein that binds testosterone and removes it from circulation) is 20.4, within range but at the lower end. His free testosterone at 0.3317 and bioavailable testosterone at 8.12 are both within range. At 32 with a BMI of 34.4, the below-optimal total testosterone is almost certainly weight-driven: adipose tissue contains the enzyme aromatase, which converts testosterone to oestradiol, and excess body fat suppresses the hypothalamic signal that drives testosterone production. His oestradiol at 81 is within range but on the higher side for a man, consistent with increased aromatase activity. Testosterone below optimal contributes to fatigue, low mood, difficulty building muscle and difficulty losing fat, creating a cycle where the weight suppresses the hormone and the low hormone makes the weight harder to shift. Losing 15 to 20 kg is likely to raise testosterone, often without any medical intervention.\n\nHis ferritin at 33 is within the laboratory range of 22 to 322 but below the optimal of 50. Ferritin reflects iron stores, and at this level the stores are not empty but they are lower than ideal, which can contribute to fatigue. His serum iron at 21, transferrin at 2.81, iron binding capacity at 64.2 and transferrin saturation at 29.76 percent (within the optimal of 25 to 40 percent) are all healthy, so the iron supply chain is working but the reserves could be deeper. His B12 at 402 is within range but below the optimal of 500 and could be contributing marginally to his fatigue and low mood. Folate at 8 sits at the lower edge of optimal. His IgA at 3.8 is above the upper limit of 3.5. IgA is the antibody that protects mucosal surfaces, including the gut lining. A mildly raised IgA can reflect chronic mucosal inflammation and is worth noting alongside his bloating symptoms. It is not high enough to suggest IgA nephropathy or other serious pathology, but it is consistent with gut irritation, and improving his diet, reducing sugar, and increasing fibre may bring it down.\n\nHis reticulocyte absolute count is 45.2 against a lower limit of 50, marginally below range. Reticulocytes are young red blood cells released from the bone marrow, and a slightly low count alongside healthy haemoglobin and a low-normal ferritin suggests the bone marrow is producing just enough red cells but not running with any surplus, likely reflecting the borderline iron stores. His MCHC at 352 is marginally above the upper limit of 345. At this margin it is usually a laboratory artefact related to sample temperature and red cell swelling rather than a clinical finding, and with a normal MCV and MCH it does not warrant further investigation. His phosphate at 0.7 is below the lower limit of 0.78. Phosphate is essential for energy production at the cellular level (it is part of ATP, the molecule every cell uses as fuel), for bone health, and for muscle function. A low phosphate can contribute to fatigue and muscle weakness. The most likely explanation at his BMI is a diet low in phosphate-rich foods (dairy, fish, nuts, legumes) and possibly high sugar intake, which can increase renal phosphate excretion. This is worth mentioning to his GP for a repeat, and increasing dietary phosphate sources is a straightforward fix.\n\nHis urine is clean: protein, glucose, ketones, urobilinogen and casts are all negative, nitrites negative, white cells less than 1 and red cells at 10 (below the significance threshold of 25).\n\nIn summary, the dominant story is early metabolic syndrome at 32: insulin resistance driving high triglycerides, low HDL, elevated ApoB and LDL, low-grade inflammation, borderline liver fat, below-optimal testosterone, and a cardiovascular risk score of 80. Every one of these findings is modifiable. The body has not yet tipped into pre-diabetes (HbA1c 37, glucose 5.4), the liver shows no scarring, the kidneys are healthy, the PhenoAge is favourable, and the thyroid is working well. The path from here to a dramatically different set of numbers runs through sustained weight loss, dietary change, and regular movement. At 32, the physiology responds quickly.","links":"The thread running through this report is insulin resistance and its downstream consequences. At a BMI of 34.4, the excess adipose tissue, particularly the visceral fat stored around the abdominal organs, has made the cells progressively less responsive to insulin. The pancreas compensates by producing more: his fasting insulin of 12.63, combined with a glucose of 5.4, gives a HOMA-IR of 3.03, which crosses the threshold for significant insulin resistance. His TyG index at 9.16 confirms the same picture independently. The body is keeping blood sugar in check, but only by flooding the system with insulin, and the HbA1c at 37, though still normal, is drifting upward toward the pre-diabetic zone.\n\nThe lipid profile is a direct consequence. Chronically elevated insulin drives the liver to overproduce VLDL particles, which are loaded with triglycerides. His VLDL is 1.0 against a target of 0.78, and his triglycerides are 2.21 against a target of 1.7. These triglyceride-rich particles exchange their cargo with HDL through a process called cholesteryl ester transfer, stripping HDL of its protective cholesterol and replacing it with triglycerides that are then broken down, shrinking the HDL particle. This is why his HDL is only 1.0. The same process generates small, dense LDL particles that penetrate artery walls more easily, reflected in his elevated ApoB of 1.27 and LDL of 3.49. His ApoB-to-ApoA1 ratio of 0.992 captures the imbalance: for every protective particle, there is almost one atherogenic one. The cardiovascular risk score of 80 is the composite summary. The Lp(a) at 32.97 adds a very small inherited contribution, but the Lp(a)-corrected LDL at 3.38 confirms that nearly all the excess is modifiable.\n\nThe inflammation fits the same story. Adipose tissue is not inert storage; it is an active endocrine organ that releases interleukin-6 and tumour necrosis factor alpha, both of which stimulate the liver to produce CRP. His hs-CRP of 2.6 and ESR of 16 both reflect this chronic, low-grade inflammatory state. This inflammation itself worsens insulin resistance, creating a feedback loop: more fat produces more inflammation, which worsens insulin sensitivity, which drives more fat storage.\n\nThe below-optimal testosterone at 13.2 is another consequence. Fat tissue contains aromatase, the enzyme that converts testosterone to oestradiol. More fat means more conversion, which suppresses the hypothalamic-pituitary signal (LH and FSH) that would otherwise drive higher testosterone production. His LH at 2.1 is at the low end of the range, consistent with mild suppression. The low testosterone in turn makes it harder to build lean muscle, reduces motivation and energy, and makes fat loss more difficult, another self-reinforcing cycle that weight loss can break.\n\nThe findings that do not fit the metabolic story are the low phosphate at 0.7, which is likely dietary (low intake of dairy, fish, legumes and nuts combined with high sugar intake, which can increase renal phosphate loss), the mildly raised IgA at 3.8, which may reflect gut mucosal irritation and connect to his bloating, and the borderline ferritin at 33, which reflects lower-than-ideal iron stores and could be contributing to his fatigue independently of the metabolic picture. The marginally low reticulocyte count at 45.2 is consistent with the borderline iron stores limiting the bone marrow's surplus capacity.\n\nThe positive exclusions are important: thyroid disease, coeliac disease, kidney dysfunction, liver fibrosis, autoimmune conditions, and prostate or other malignancies have all been made very unlikely by this panel. The bloating is not coeliac (negative tTG with adequate IgA), the fatigue is not thyroid (TSH, FT4, FT3 and antibodies all healthy), and the low mood is not driven by cortisol excess or deficiency (cortisol 220 is within the normal morning range). The symptoms, fatigue, afternoon crash, low mood, bloating and weight gain, are being driven primarily by the metabolic state and the lifestyle inputs feeding it: daily sugar, no exercise, high stress, and a diet that is large in volume but not dense enough in nutrients.","lifestyle":"Cut sugary food and drink to no more than twice a week, starting this week. Pick one daily habit to drop first, the easiest one. Anchor: the shopping list, because what is not bought is not eaten. Why: daily sugar is driving the insulin resistance behind your HOMA-IR of 3.03 and your triglycerides of 2.21, and reducing it is the single fastest way to lower both.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, tinned fish or beans. Anchor: protein goes on the plate before anything else. Why: protein blunts the post-meal insulin spike, keeps you full for longer, and protects lean muscle during fat loss. Your target is 165 to 200 grams of protein per day.\nSwap refined carbohydrates (white bread, white rice, pastry, cereal) for whole grains, oats, rye or sweet potato, one meal at a time. Anchor: start with whichever meal currently has the most white carbohydrate. Why: slower-digesting carbohydrates reduce the glucose and insulin surges behind your afternoon crash.\nWalk for 20 minutes immediately after your largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, directly improving the HOMA-IR and triglycerides.\nAdd two 30-minute resistance sessions per week. Bodyweight exercises at home count: squats, press-ups, lunges, rows with a bag. Anchor: pick two fixed days and treat them as appointments. Why: muscle is the largest glucose sink in the body; building it is the most powerful long-term fix for insulin resistance, and it raises testosterone, currently 13.2 against an optimal of 18.\nIncrease vegetable and fruit portions from 2 to 3 a day to 5 or more. Add one portion to lunch and one to dinner this week, then build. Why: fibre feeds the gut bacteria, reduces bloating over time, slows glucose absorption, and lowers the inflammation behind your CRP of 2.6.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking for 10 minutes of natural light. Why: despite sleeping eight or more hours, you wake tired. Morning light resets the cortisol rhythm, improves sleep quality, and shifts the energy pattern away from the afternoon crash.\nReduce screen time and stimulation for 60 minutes before bed. No phone in the bedroom. Why: stress is hard to manage most days and improving sleep quality is one of the most effective interventions for both mood and insulin sensitivity.\nCalorie target for fat loss: 2,200 to 2,400 kcal per day (your estimated maintenance at this activity level is approximately 2,850 kcal; a 450 to 650 deficit produces 0.5 to 0.7 kg of fat loss per week). Protein floor: 165 g per day (1.3 g per kg of current weight). Weight target range: 95 to 105 kg, which would bring BMI into the 26 to 29 range and is likely to normalise the insulin, lipids, CRP and testosterone.","flags":"Insulin resistance: HOMA-IR 3.03 (limit 1.5), fasting insulin 12.63 mIU/L within range but driving a HOMA-IR well above the upper limit of 1.5. TyG index 9.16 (limit 8.5) confirms. HbA1c 37 (optimal below 36) is above optimal but well below the pre-diabetes threshold of 42. Mechanism is excess adiposity at BMI 34.4 with daily sugar and no exercise. Reversible with weight loss and dietary change.\nLipid profile: ApoB 1.27 (target below 0.9), LDL 3.49 (limit 3.0), triglycerides 2.21 (target below 1.7), HDL 1.0 (desirable above 1.55), VLDL 1.0 (limit 0.78), TC/HDL ratio 5.4 (limit 4.5), ApoB/A1 ratio 0.992 (higher-risk threshold 0.9), Non-HDL 4.4 (limit 4.0), atherogenic index 0.344 (limit 0.21), Castelli II 3.49 (limit 3.5), Lp(a)-corrected LDL 3.38 (limit 3.0). Cardiovascular risk score 80/100 (ideal below 20). Pattern is metabolic-syndrome lipid triad driven by insulin resistance. Lp(a) 32.97 (limit 32) is marginally above ideal and adds a very small inherited component; worth recording but not a driver.\nInflammation: hs-CRP 2.6 (optimal below 1.0), ESR 16 (limit 12). Low-grade chronic inflammation consistent with excess adiposity.\nPhosphate 0.7 mmol/L (lower limit 0.78). Low phosphate can contribute to fatigue and muscle weakness. Likely dietary, possibly worsened by high sugar intake increasing renal phosphate excretion. Worth a repeat with the GP and dietary correction.\nIgA 3.8 g/L (upper limit 3.5). Mildly raised mucosal antibody, consistent with gut mucosal irritation alongside his bloating symptoms. Not high enough to suggest IgA nephropathy or systemic disease.\nTestosterone 13.2 nmol/L (optimal 18 to 28.7). Below optimal, driven by excess adiposity and aromatase activity. Expected to improve with weight loss.\nFerritin 33 ng/mL (optimal above 50). Iron stores lower than ideal, contributing to fatigue. Transferrin saturation 29.76% is healthy, so supply is adequate but reserves are thin.\nB12 402 pg/mL (optimal above 500). Below optimal, may contribute to fatigue and low mood.\nReticulocyte absolute count 45.2 (lower limit 50). Marginally below range, consistent with borderline iron stores limiting bone marrow surplus.\nALT 48 IU/L (optimal below 30). Within range but above optimal, consistent with early fatty liver infiltration at this BMI. No fibrosis (FIB-4 0.56, APRI 0.303).\nDe Ritis ratio 0.56 (lower reference 0.6). Below range because ALT is mildly raised relative to AST. In the absence of other liver concern, not pathological.\nMCHC 352 g/L (upper limit 345). Marginally above range at this margin and not clinically significant.\nTAA 1.78 mmol/L (upper limit 1.77). Marginally above range, likely from magnesium supplementation. Not a concern.\nReassuring negatives: thyroid disease very unlikely (TSH, FT4, FT3 all optimal, both antibodies negative), coeliac disease very unlikely (tTG negative with adequate IgA), liver fibrosis very unlikely (FIB-4, APRI, NAFLD score all well within range), kidney disease very unlikely (cystatin C 1.05, combined eGFR 98), autoimmune disease very unlikely (RF 4, both thyroid antibodies negative), prostate pathology very unlikely (PSA 0.29), malignancy markers all clear (CA19-9 and CEA within range).\nNot reported on this occasion: Potassium.","recommendations":"Discuss the insulin resistance with your GP. Bring these numbers: HOMA-IR 3.03, fasting insulin 12.63, fasting glucose 5.4, HbA1c 37, triglycerides 2.21. Ask whether a structured weight-management programme or referral is available, as reversing the insulin resistance now prevents progression to pre-diabetes and type 2 diabetes.\nDiscuss the lipid profile. Bring these numbers: ApoB 1.27 (target below 0.9), LDL 3.49 (limit 3.0), HDL 1.0, triglycerides 2.21. The GP may want to calculate a formal cardiovascular risk score (QRISK3) and discuss whether lifestyle intervention alone is the plan or whether a statin should be considered alongside it. At 32 with no family history and modifiable drivers, lifestyle change is the first line, but the GP should be aware of the numbers.\nAsk the GP to repeat the phosphate level to confirm the result of 0.7 (limit 0.78). If confirmed, the GP may check vitamin D and PTH together (both are normal in this panel) and advise dietary changes or a phosphate supplement.\nMention the raised IgA of 3.8 (limit 3.5) alongside the bloating symptoms. The GP may wish to check a urine albumin-to-creatinine ratio to exclude any renal involvement, and may consider a referral for further gut assessment if bloating persists after dietary changes.\nMention the raised ESR of 16 (limit 12) alongside the CRP of 2.6. Both are most likely adiposity-driven, but the GP should be aware and may wish to repeat them after weight loss to confirm they normalise.\nRetest in 4 to 6 months, after sustained dietary change and weight loss. Key markers to repeat: fasting insulin, glucose, HbA1c, HOMA-IR, full lipid panel with ApoB, hs-CRP, ESR, ALT, ferritin, phosphate, IgA, and testosterone. Calorie target: 2,200 to 2,400 kcal per day. Protein target: 165 to 200 g per day (1.3 to 1.6 g per kg). Weight target: 95 to 105 kg.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with a meal containing fat. His level at 78 is within the optimal band, and at a BMI of 34.4 a higher maintenance dose is needed because fat tissue sequesters vitamin D. Pair with vitamin K2 (MK-7) 100 mcg daily to direct the calcium to bone rather than arteries.\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with food. Why: his triglycerides are 2.21, ApoB is 1.27, and hs-CRP is 2.6. Omega-3 at this dose lowers triglycerides, reduces inflammation, and supports mood, addressing three of his main concerns.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. His B12 at 402 is below the optimal of 500. Sublingual delivery bypasses gut absorption, which is more reliable. This may support energy and mood.\nMagnesium (glycinate): continue his current magnesium supplement, ideally magnesium glycinate at 300 to 400 mg before bed. His serum magnesium at 0.9 is within the optimal band, and glycinate is the form best absorbed and most supportive of sleep quality and stress.\nDO NOT take iron supplements. His ferritin at 33 is below optimal, but his transferrin saturation is 29.76%, well within the healthy range. The priority is increasing iron-rich foods (red meat twice a week, dark poultry, lentils, spinach, paired with vitamin C) rather than supplementation. Supplemental iron at a healthy saturation can cause gut irritation and worsen his bloating.\nThe most important changes from this report are not supplements. They are reducing daily sugar, adding protein to every meal, walking after meals, starting resistance training, and sustaining a moderate calorie deficit to bring his weight from 125.6 kg toward the 95 to 105 kg range.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 60.3; held to 49 by two or more systems rated \"See your GP\". Weakest systems: lipids & cardiovascular 28%, inflammation 38%, glucose & insulin 53%. Biggest drags: Apolipoprotein B, LDL Cholesterol, Triglycerides, hs-CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3730","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4324","units":"years","description":"PhenoAge is a biological ageing marker derived from nine blood values (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count). His PhenoAge of 27.6 against a calendar age of 32 means his blood chemistry reads approximately four and a half years younger than his chronological age. This is a genuinely positive finding: despite the metabolic strain of insulin resistance and elevated body fat, the underlying organ function has not yet accumulated the damage that accelerates biological ageing. The main markers pulling his PhenoAge upward are CRP (2.6) and glucose (5.4). As these improve with weight loss and dietary change, PhenoAge will move further in the favourable direction.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built right now, regardless of age. His score of 80 against an ideal of below 20 is high. At 32, his ten-year risk of a cardiovascular event remains low simply because of his age, but the score of 80 means the metabolic machinery driving risk is running hard. The gap between 80 and 20 is the window for acting. The two main drivers are his ApoB of 1.27 and his triglyceride-to-HDL profile. Both are modifiable through weight loss, dietary change and exercise.","low_causes":"Excellent lipid profile, low inflammation, optimal blood sugar","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the concentration of sugar in the bloodstream after fasting. His result of 5.4 is at the upper boundary of the optimal range and within the normal range of 3.5 to 6.0. While not abnormal in isolation, combined with his insulin of 12.63 it reveals that the body is working hard to keep glucose in check. A reading like this alongside elevated insulin is the hallmark of early insulin resistance, where the sugar stays normal but only because the pancreas is compensating with extra output.","low_causes":"Fasting, excessive exercise, insulin overdose, reactive hypoglycaemia","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, high-sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c percentage is an alternative expression of glycated haemoglobin. His 5.6% is within the normal band of below 6.0% and below the pre-diabetic threshold. It is reported alongside the mmol/mol value below.","low_causes":"Low blood sugar states, haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, type 2 diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4405","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been coated with sugar over the past two to three months, giving an average blood-sugar picture rather than a single snapshot. His result of 37 is within the normal range of below 42 but above the optimal threshold of 36. This is not pre-diabetes, but it is drifting in that direction and is consistent with the insulin resistance shown by his HOMA-IR. Reducing sugar intake and losing weight will bring this back toward the low 30s.","low_causes":"Low blood sugar, haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, type 2 diabetes, chronically high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"12.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. His fasting level of 12.63 is within the laboratory range of 2.6 to 24.9, but it is well above the optimal of 2 to 8. A fasting insulin this high means the pancreas is having to produce significantly more insulin than normal to maintain a glucose of 5.4. This is the defining feature of insulin resistance: the tissues are not responding efficiently, so the pancreas compensates by increasing output. With dietary change and weight loss, this number can drop dramatically.","low_causes":"Very low carbohydrate diet, low calorie intake, high insulin sensitivity","high_causes":"Insulin resistance, excess body fat, high-sugar diet, metabolic syndrome, pre-diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4525","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4343","units":"ug/L","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin, and it is a more stable measure of how much insulin the body is producing because it is not cleared as quickly by the liver. His result of 2.28 ug/L is within the laboratory range and confirms the pancreas is producing substantial insulin. This is consistent with his insulin result and HOMA-IR, reflecting insulin resistance rather than any deficiency in production.","low_causes":"Type 1 diabetes, very low carbohydrate intake, low insulin demand","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"3.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting insulin and glucose and measures how resistant the body's cells are to insulin. A score below 1.0 indicates excellent insulin sensitivity. His result of 3.03 is more than double the upper limit of 1.5, crossing the threshold widely recognised as significant insulin resistance. This is the key metabolic finding in this report. The body is producing large amounts of insulin to maintain a barely normal glucose level. With sustained weight loss, reduced sugar intake, and regular exercise, this score can return to the ideal range.","low_causes":"High insulin sensitivity, low carbohydrate intake, athletic conditioning","high_causes":"Insulin resistance, excess body fat, high-sugar diet, physical inactivity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and represents the average blood sugar level over the past two to three months. His result of 6.2 is at the upper boundary of the optimal range and within the normal range of below 7. This is consistent with the HbA1c of 37 and confirms that average blood sugar is currently controlled but trending toward the upper end of healthy.","low_causes":"Very tight glucose control, low carbohydrate intake","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"9.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5205","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG (triglyceride-glucose) index is an alternative marker of insulin resistance calculated from fasting triglycerides and glucose. His result of 9.16 is above the upper limit of 8.8, confirming significant insulin resistance from a different angle to HOMA-IR. This index is driven by his elevated triglycerides (2.21) and upper-range glucose (5.4).","low_causes":"Excellent insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES", tion":"Ferritin is the protein that stores iron in the body, primarily in the liver. His result of 33 is within the laboratory range of 22 to 322 but below the optimal of 50 for a male. This means his daily iron supply is adequate but his reserves are thin. Low ferritin can contribute to fatigue, reduced exercise tolerance and poor concentration. Increasing iron-rich foods such as red meat, dark poultry, lentils and leafy greens, paired with vitamin C for absorption, is the best approach.","low_causes":"Low dietary iron, poor absorption, blood loss, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"158","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to the tissues. His level of 158 is well within the healthy range for a male and within the optimal band, confirming there is no anaemia and oxygen delivery is working efficiently.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, smoking, living at altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"5.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"Red blood cell count measures the total number of red cells in the blood. His result of 5.14 is within the optimal band, confirming healthy red cell production.","low_causes":"Anaemia, bone marrow disorders, chronic disease, nutritional deficiency","high_causes":"Dehydration, smoking, polycythaemia, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.449","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4967","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. His result of 0.449 is within the optimal band, confirming good hydration and healthy red cell mass.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"13.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5619","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"%","description":"Red cell distribution width measures how consistent the size of red blood cells is. A narrow RDW means the cells are uniform in size, which is healthy. His result of 13.9% is within the optimal band, confirming normal red cell production without signs of nutritional deficiency affecting cell size.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemias, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"m tions","high_causes":"Platelet destruction or consumption, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"4.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3617","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cell count measures the total number of immune cells in the blood. His result of 4.51 is within the normal range of 4 to 10 but below the optimal of 5. At this level the immune system is functioning, but the count is on the lower side. In someone who is not training heavily and has no infection, this is likely a constitutional finding. It is not a concern on its own.","low_causes":"Viral infection, bone marrow suppression, autoimmune conditions, low energy availability","high_causes":"Infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3533","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. His count of 2.3 is within the normal range but below the optimal of 2.5. This is consistent with his overall lower-end white cell count and is not clinically concerning at this level.","low_causes":"Viral infection, certain medications, autoimmune conditions, benign ethnic neutropenia","high_causes":"Bacterial infection, inflammation, stress,
