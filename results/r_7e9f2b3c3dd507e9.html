const REPORT_DATA = {"patient_name":"Yolande Bosman","dob":"29/10/1960","report_date":"2026-09-07","summary":"Yolande is a 65-year-old female presenting with a BMI of 23.2, following a low-carb, high-protein diet rated 9 out of 10 for quality with a volume of 6 out of 10. She trains twice per week, one cardio session and one resistance session, with 7,500 to 10,000 daily steps. She reports no medications, no conditions, and no notable habits. Her symptoms include low energy and fatigue, poor sleep and insomnia, and low mood and anxiety. Her goals are to improve mood, prevent disease, and reduce stress and anxiety.\n\nThe finding in this report that needs the most attention is her cholesterol. Her total cholesterol is 11.2 mmol/L, more than double the desirable upper limit of 5.18. Her LDL cholesterol, the form that deposits into artery walls, is 8.35 mmol/L against an upper limit of 3.0. Her ApoB, which is a protein that sits on the surface of every LDL particle and is considered the single best measure of how many atherogenic particles are circulating, is 1.77 g/L against a target of below 0.9, placing it in the lab's \"very high\" category. Her non-HDL cholesterol, which captures all the cholesterol fractions that contribute to cardiovascular risk, is 8.6 against an upper limit of 4.0. These are not borderline elevations. They are substantially raised and place her in a high cardiovascular risk category that warrants prompt discussion with her GP. Importantly, her Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk by depositing cholesterol, promoting clot formation, and encouraging inflammation in artery walls, is 103.85 nmol/L against a target of below 32. This is a moderate-risk level and, because Lp(a) is entirely genetically determined and cannot be changed by diet, exercise, or any currently available supplement, it represents a permanent piece of her medical record. The combination of very high LDL, very high ApoB, and raised Lp(a) means that the cardiovascular risk is being driven by two forces: one modifiable (LDL and ApoB) and one fixed (Lp(a)). This makes it even more important to bring the modifiable fraction down as far as possible, because the Lp(a) contribution cannot be offset. Her GP should be made aware of the full lipid picture, including the Lp(a) result, and a discussion about statin therapy or other lipid-lowering medication is strongly recommended. First-degree relatives, her children and siblings, should also be offered an Lp(a) test, because if Yolande carries this variant, each first-degree relative has a roughly 50% chance of inheriting it. The one genuine bright spot within this lipid panel is her HDL cholesterol at 2.6 mmol/L, which is excellent, and her ApoA1 at 1.9 g/L, which is also strong. Her triglycerides at 0.89 mmol/L are within the optimal range. These suggest that her body handles dietary fat efficiently and that the low-carb approach is doing its job for triglyceride management, but the LDL and ApoB elevations are too large to be offset by the HDL protection alone, as shown by an ApoB to ApoA1 ratio of 0.93, well into the higher-risk category above 0.8.\n\nThere is a great deal of good news in this report. Her glucose metabolism is in excellent shape. Fasting glucose at 5.2, HbA1c at 41 mmol/mol (just under the pre-diabetes threshold of 42), and a HOMA-IR of 0.74, which is a calculated index of insulin resistance, all confirm that she is insulin-sensitive and processing glucose efficiently. Her fasting insulin at 3.2 is at the lower end of the laboratory range but sits comfortably within the optimal window, reflecting a pancreas that does not need to work hard to control blood sugar. Her C-Peptide, a molecule released in equal amounts to insulin and used to confirm pancreatic output, came back at 0.768 ug/L (254.3 pmol/L), which is below the laboratory range of 1.1 to 4.4. However, in the context of a low-carb diet with excellent glucose, excellent HbA1c, and a healthy HOMA-IR, this simply reflects low insulin demand rather than pancreatic insufficiency. The pancreas is producing less insulin because it does not need to produce more, which is exactly what a successful low-carb approach looks like.\n\nHer liver is in superb health. ALT at 13 and GGT at 19 are both well within optimal ranges, and her AST at 22 and ALP at 49 are clean. Her bilirubin at 11, albumin at 38, and total protein at 68 are all within range. Her FIB-4 score, a calculation that estimates the likelihood of liver fibrosis using age, ALT, AST, and platelet count, came back at 1.52, marginally above the standard threshold of 1.45. However, the lab's own note states that for patients over 65, the threshold rises to 2.0, which places Yolande comfortably below it. At 65, the age component of the formula inflates the score even when all the actual liver markers are clean, and in her case every single liver marker is healthy. This is not a concern.\n\nHer kidney function is reassuring. Her creatinine-based eGFR is 84 and her Cystatin C-based eGFR, which is a more accurate measure that is not affected by muscle mass, is 79. Both are above 60, and for a 65-year-old, a Cystatin C eGFR in the upper 70s is consistent with normal age-related kidney function. Her urea, sodium, chloride, bicarbonate, and potassium are all within range. Her uric acid at 345 is within the laboratory range of 184 to 464 and also within the optimal range for women.\n\nHer inflammation markers are reassuring. Her hs-CRP, which is the most sensitive measure of systemic inflammation, is 0.5 mg/L, well below the optimal threshold of 1.0. Her ESR at 10 is within range. These suggest that there is no significant inflammatory process occurring.\n\nHer full blood count is healthy overall. Haemoglobin at 134 is well within the female range, red blood cells, haematocrit, platelets, and reticulocytes are all within range. Her white cell count at 4.02 is just at the lower boundary of the laboratory range of 4.0 to 10.0, with neutrophils at 2.32 and lymphocytes at 1.32 both within range. At 65 with a low-carb diet and a lean BMI of 23.2, a white cell count sitting at the boundary is not unusual and does not suggest immunodeficiency. Her MCH, which is the average amount of haemoglobin packed into each red blood cell, is 32.6 pg against an upper limit of 32. This is a trivial margin and typically reflects either a very slight macrocytic tendency or simple laboratory variation. Her MCV at 95.7 is within range, and her MCHC at 340 is within range, so this isolated MCH finding has no clinical significance.\n\nHer iron studies present a mixed but generally reassuring picture. Ferritin at 63 is within the optimal female range of 40 to 150, serum iron at 14.5 is healthy, and transferrin saturation at 25.78% is within the optimal band of 25 to 40%. Her transferrin, which is the protein that transports iron in the blood, is 2.24 g/L, marginally below the lower limit of 2.5. Transferrin is a negative acute phase protein, meaning it can fall during any inflammatory process, but her CRP is very low, so inflammation is unlikely to be the explanation. A marginally low transferrin with otherwise healthy iron markers is most commonly a benign finding at this age but is worth noting for longitudinal tracking.\n\nHer thyroid results deserve careful attention in the context of her symptoms. Her TSH, the signal the pituitary sends to tell the thyroid how hard to work, is 3.89 mIU/L. While this is within the laboratory range of 0.55 to 4.78, it sits above the optimal band of 1.0 to 2.5. A TSH in the upper portion of the range means the pituitary is having to push harder than ideal to maintain thyroid output. Her Free T4, the main circulating thyroid hormone, is 14.0 pmol/L, which is within the laboratory range of 11.5 to 22.7 but sits right at the lower boundary of the optimal range of 14 to 20. Her Free T3, the active form of thyroid hormone that cells actually use, is 4.2 pmol/L against a laboratory range of 2.6 to 7.1, but below the optimal floor of 4.5. Both thyroid antibodies, TPO and thyroglobulin, are negative, which means this is not an autoimmune pattern such as Hashimoto's thyroiditis. What this picture suggests is a thyroid gland that is working but being pushed to maintain output, and the output, particularly T3, is falling slightly short of the optimal zone. In a 65-year-old woman reporting fatigue, poor sleep, and low mood, suboptimal thyroid function could be a meaningful contributor to all three symptoms. A sluggish thyroid slows metabolic rate, which can cause fatigue and weight resistance, impairs neurotransmitter turnover, which can contribute to low mood and anxiety, and disrupts the temperature regulation that supports healthy sleep architecture. Additionally, an underperforming thyroid slows LDL clearance from the bloodstream, which could be one contributor to the very elevated LDL seen in this report. We would recommend discussing these thyroid results with her GP, who may wish to repeat TSH and Free T4 in six to eight weeks and consider whether a trial of low-dose levothyroxine is appropriate, particularly given the symptom overlap.\n\nHer hormone profile confirms post-menopausal status. FSH at 86.17 mIU/ml is well above the post-menopausal threshold of 23, and LH at 24.54 is consistent with this. Oestradiol is below 43 pmol/L, below the detection threshold, confirming that the ovaries are no longer producing significant oestrogen. Progesterone at 0.24 nmol/L is within the expected post-menopausal range. Her total testosterone at 0.3 nmol/L is below the female laboratory range of 0.5 to 2.6, and her Free Androgen Index at 0.34 is below the range of 0.5 to 6.5. Her SHBG, the protein that binds sex hormones and reduces their availability, is 88.3 nmol/L, which while within range is in the upper half, meaning that what little testosterone she produces is being largely bound and made unavailable. Low free testosterone in a post-menopausal woman is associated with reduced energy, lower motivation, difficulty maintaining or building muscle, reduced libido, and a general sense of flatness. Combined with the absent oestrogen, this hormonal picture could be contributing meaningfully to her fatigue, low mood, and anxiety. Yolande may wish to discuss with her GP whether hormone replacement therapy, including testosterone supplementation (which is increasingly recognised as beneficial for post-menopausal women with low testosterone and quality-of-life symptoms), would be appropriate. Her DHEA-S at 0.3 umol/L (110.6 ug/dL) is at the very bottom of the laboratory range, which is consistent with the age-related decline in adrenal androgen production and reinforces the low-androgen picture.\n\nHer cortisol at 402 nmol/L is within the morning reference range and does not suggest adrenal insufficiency or excess, though a single morning cortisol is a limited snapshot. Her prolactin at 165 uIU/ml is within the post-menopausal range.\n\nHer vitamin and mineral status is largely in good shape. Vitamin D at 112 nmol/L is within the optimal range of 75 to 120 and reflects either good sun exposure, supplementation, or both. Her calcium and corrected calcium are within range, and her PTH at 1.4 is within range, confirming healthy calcium-parathyroid regulation. Phosphate and magnesium are within range, though her magnesium at 0.84 is just below the optimal floor of 0.85, which is marginal but, given her sleep difficulties, worth addressing with supplementation. Her B12 at 420 pg/ml is within the laboratory range but below the optimal floor of 500, and given her low-carb, high-protein diet, this may reflect that she is obtaining some B12 from animal sources but could benefit from a small boost. Her folate at 12 ng/ml is within range and above the optimal floor of 8.\n\nHer immune markers show IgG and IgA within range, and IgE well within range. Her IgM, which is the immunoglobulin class that provides the first line of defence against new infections, is 0.3 g/L against a lower limit of 0.5. Isolated low IgM in a 65-year-old without recurrent infections is relatively common and often reflects the natural age-related decline in immune function rather than a primary immunodeficiency. However, if Yolande experiences frequent infections, this should be flagged to her GP. Her tissue transglutaminase IgA is negative, effectively ruling out coeliac disease. Her rheumatoid factor is pending.\n\nHer tumour markers are all reassuring. CA-125 at 4.5, CA 15-3 at 11, CA 19-9 below 1.2, and CEA at 1.16 are all well within range.\n\nHer total antioxidant activity at 1.81 is marginally above the upper limit of 1.77. This is typically driven by dietary antioxidant intake or supplementation and is not a concern; if anything, it reflects the quality of her diet. Her creatine kinase at 87 is within range, confirming no muscle damage from training.\n\nHer urinalysis shows white blood cells at 30 wbc/ul, which is above the significance threshold of 10. In the absence of nitrites (negative), this could reflect a low-grade urinary tract process, vaginal contamination, or early subclinical infection. Her bacterial count and urine culture are pending, and these results will clarify whether any organism is present. If she is experiencing any urinary symptoms such as frequency, urgency, or discomfort, she should mention this to her GP. Red blood cells are below 1, which is reassuring, and all other urinary markers are clean.\n\nIn summary, the two priorities from this report are the substantially elevated lipid profile, which should be discussed urgently with her GP given the combination of very high LDL, very high ApoB, and moderately raised Lp(a), and the suboptimal thyroid and hormonal picture, which together may be contributing significantly to her symptoms of fatigue, poor sleep, and low mood. The metabolic, liver, kidney, inflammatory, and haematological markers are all reassuring, and her diet quality appears to be serving her well in most domains.","links":"Yolande's report raises two main areas that require action and several areas where targeted adjustments could help with her symptoms and goals.\n\nThe most important conversation is with her GP about her lipid profile. She should bring the following numbers: total cholesterol 11.2, LDL 8.35, ApoB 1.77, Lp(a) 103.85, and the ApoB to ApoA1 ratio of 0.93. The Lp(a) result is particularly important because it is genetically fixed and should be recorded permanently in her medical file. Her GP will very likely recommend statin therapy given the scale of the LDL and ApoB elevation, and given that Lp(a) cannot be modified, bringing LDL down as far as possible with medication becomes more, not less, important. She should also ask her GP to offer Lp(a) testing to her children and siblings, as there is approximately a 50% chance that first-degree relatives share this genetic variant.\n\nThe second conversation with her GP should cover her thyroid. TSH at 3.89 with Free T4 at 14.0 and Free T3 at 4.2, both at or below the optimal floor, in the context of fatigue, poor sleep, and low mood warrants monitoring and possibly a trial of treatment. The GP may wish to repeat TSH and Free T4 in six to eight weeks. If the pattern persists, low-dose levothyroxine may be appropriate.\n\nThe third topic for her GP is her hormonal status. With total testosterone at 0.3 (below range), a Free Androgen Index of 0.34 (below range), absent oestradiol, and DHEA-S at the floor, Yolande has a very low androgen and oestrogen environment. Hormone replacement therapy, potentially including testosterone, could meaningfully improve her energy, mood, sleep, and long-term bone and cardiovascular health. This is a conversation worth having with a GP or specialist with experience in post-menopausal hormone management.\n\nFrom a dietary perspective, Yolande's low-carb, high-protein approach is delivering excellent metabolic results, but the very high LDL suggests that her specific response to dietary saturated fat may be pronounced. Some individuals on low-carb diets, sometimes called \"hyper-responders,\" see disproportionate LDL elevations. While awaiting the GP discussion about medication, she could trial some dietary modifications: increasing soluble fibre intake through oats, psyllium husk, flaxseed, and legumes (even modest amounts within a low-carb framework); increasing oily fish to three to four portions per week for the EPA and DHA content; and moderating saturated fat intake by shifting from butter and coconut oil toward olive oil, avocado, and nuts. These changes alone are unlikely to bring LDL from 8.35 to below 3.0, but they can contribute meaningfully alongside medication.\n\nFor calorie and protein targets, at 67 kg, 170 cm, age 65, with two training sessions per week and 7,500 to 10,000 steps, Yolande's estimated maintenance calories sit around 1,750 to 1,900 per day (using a light activity multiplier of approximately 1.45 on a BMR of around 1,250). Her BMI at 23.2 is healthy and does not require a deficit. Her diet volume is rated 6 out of 10, which suggests she may not always be eating enough. Given her symptoms of fatigue and low mood, ensuring she is eating to maintenance rather than inadvertently under-eating is important. Protein should be at least 87 to 107 grams per day (1.3 to 1.6 g/kg), which supports muscle maintenance, bone health, and neurotransmitter production. Given her already high-protein dietary approach, she may already be meeting this, but it is worth confirming.\n\nFor sleep, which is one of her key symptoms and connects directly to mood and energy, practical steps include fixing her wake time to the same time every day including weekends, getting outside into natural light within the first hour of waking (this sets the circadian clock more powerfully than any supplement), cutting caffeine by early afternoon at the latest, keeping the bedroom cool (around 18 degrees Celsius), and considering a magnesium glycinate supplement before bed, which can support both sleep onset and sleep quality. If sleep does not improve with these measures and thyroid and hormone optimisation, a formal sleep assessment may be worthwhile.\n\nFor training, her current two sessions per week is a reasonable foundation, but increasing resistance training to two to three sessions per week would be beneficial for bone density (critical post-menopause), metabolic health, mood (resistance training has strong evidence for reducing anxiety and improving mood), and muscle preservation. Even adding one additional 30 to 40 minute resistance session per week would make a meaningful difference.\n\nHer IgM at 0.3 should be noted. If she finds she catches infections more frequently than expected, or if infections take longer than usual to resolve, this should be raised with her GP. Otherwise, it can simply be monitored at her next blood test.\n\nThe pending urine culture will clarify the significance of the white blood cells in her urine. If the culture returns positive with a significant organism, her GP will advise on treatment. If it returns as no significant growth, the finding can be attributed to contamination and does not need further action unless she develops urinary symptoms.\n\nA retest in four to six months would be valuable, focusing on: a full lipid panel (to assess response to any medication or dietary changes), TSH, Free T4, and Free T3 (to track thyroid trajectory), testosterone and SHBG (if HRT is started, to assess response), IgM (to confirm whether the low level is stable), and a repeat urine culture if the current one returns positive.","flags":"LIPIDS (GP-URGENT): Total cholesterol 11.2 mmol/L (desirable below 5.18). LDL 8.35 mmol/L (upper limit 3.0). ApoB 1.77 g/L (target below 0.9, classified \"very high\" by lab). Non-HDL cholesterol 8.6 mmol/L (target below 4.0). ApoB/A1 ratio 0.93 (higher risk, above 0.8). Lp(a) 103.85 nmol/L (target below 32, moderate risk category). This combination of very high LDL, very high ApoB, and moderately raised Lp(a) places the patient at significantly elevated cardiovascular risk. The Lp(a) is genetically determined and should be recorded permanently. First-degree relative testing recommended. Statin therapy discussion recommended.\n\nTHYROID: TSH 3.89 mIU/L (lab range 0.55 to 4.78, optimal 1.0 to 2.5). Free T4 14.0 pmol/L (lab range 11.5 to 22.7, optimal 14 to 20, at the floor). Free T3 4.2 pmol/L (lab range 2.6 to 7.1, optimal 4.5 to 6.5, below optimal). Both TPO and thyroglobulin antibodies negative. Pattern suggests subclinical hypothyroidism of non-autoimmune aetiology. Symptomatic overlap with fatigue, poor sleep, and low mood. Suboptimal thyroid function may also be contributing to impaired LDL clearance. Recommend repeat TSH and Free T4 in six to eight weeks with consideration of levothyroxine trial.\n\nHORMONES: Total testosterone 0.3 nmol/L (below female range 0.5 to 2.6). Free Androgen Index 0.34 (below range 0.5 to 6.5). DHEA-S 0.3 umol/L (at the floor of range). Oestradiol below 43 pmol/L. FSH 86.17 confirming post-menopausal status. SHBG 88.3 nmol/L (upper half of range, further reducing free testosterone availability). Low androgen environment may be contributing to fatigue, low mood, and difficulty maintaining muscle mass. HRT discussion recommended.\n\nIMMUNOLOGY: IgM 0.3 g/L (below range 0.5 to 3.0). Isolated low IgM in a 65-year-old without recurrent infections is often age-related. Monitor for infection frequency. Repeat at next panel.\n\nIRON: Transferrin 2.24 g/L (below range 2.5 to 3.8). All other iron markers within range. Low CRP makes inflammatory suppression unlikely. Marginal finding, monitor longitudinally.\n\nGLUCOSE: C-Peptide 0.768 ug/L (below range 1.1 to 4.4, equivalent to 254.3 pmol/L). In context of normal glucose, normal HbA1c, and excellent HOMA-IR, this reflects low insulin demand on a low-carb diet rather than pancreatic insufficiency.\n\nURINALYSIS: WBC 30 wbc/ul (above significance threshold of 10). Nitrites negative. Bacterial count and culture pending. May represent subclinical UTI, contamination, or low-grade inflammatory process. Await culture results.\n\nHAEMATOLOGY: MCH 32.6 pg (marginally above upper limit of 32). Trivial margin with normal MCV and MCHC. No clinical significance.\n\nPENDING: Rheumatoid Factor, Bacterial Count, Urine Culture and Sensitivities. Results should be reviewed when available.\n\nReassuring negatives: Liver function entirely clean (ALT 13, GGT 19, AST 22, ALP 49, bilirubin 11, albumin 38). FIB-4 1.52 is below the age-adjusted threshold of 2.0 for over-65s. Kidney function adequate for age (Cystatin C eGFR 79). hs-CRP 0.5 confirms low systemic inflammation. HbA1c 41, glucose 5.2, HOMA-IR 0.74 confirm insulin sensitivity. Thyroid antibodies both negative. Tumour markers (CA-125, CA 15-3, CA 19-9, CEA) all within range. Coeliac screen negative. Vitamin D 112 nmol/L optimal. Ferritin 63 within optimal female range. Urine RBC below 1.","recommendations":"1. Arrange a GP appointment as a priority to discuss the lipid results. Bring this report and specifically highlight total cholesterol 11.2, LDL 8.35, ApoB 1.77, and Lp(a) 103.85. A discussion about statin therapy is strongly recommended given the scale of these elevations and the non-modifiable Lp(a) contribution.\n\n2. Request Lp(a) testing for first-degree relatives (children and siblings). This is a one-time test as the level does not change over a lifetime.\n\n3. Discuss thyroid results with the GP. TSH 3.89 with Free T4 at 14.0 and Free T3 at 4.2, in the context of fatigue, poor sleep, and low mood, warrants monitoring and possible treatment. Request repeat TSH and Free T4 in six to eight weeks.\n\n4. Discuss hormone replacement therapy with the GP. Post-menopausal status with below-range testosterone, absent oestradiol, and very low DHEA-S may be contributing significantly to fatigue, low mood, and anxiety. Both oestrogen replacement and testosterone supplementation are worth discussing.\n\n5. Increase soluble fibre intake: aim for 10 to 15 grams per day from oats, psyllium husk, flaxseed, and legumes. This can lower LDL by 5 to 10% and complements any medication.\n\n6. Increase oily fish consumption to three to four portions per week (salmon, mackerel, sardines) for omega-3 EPA and DHA.\n\n7. Shift cooking fats from saturated sources (butter, coconut oil) toward monounsaturated sources (extra virgin olive oil, avocado oil).\n\n8. Ensure calorie intake reaches maintenance of approximately 1,750 to 1,900 calories per day. Under-eating at this BMI and activity level can worsen fatigue and mood.\n\n9. Aim for at least 87 to 107 grams of protein per day to support muscle preservation and neurotransmitter production.\n\n10. Increase resistance training to two to three sessions per week. This supports bone density, metabolic health, and mood, all of which are priorities post-menopause.\n\n11. Prioritise sleep hygiene: fixed wake time daily, outdoor light exposure within the first hour of waking, no caffeine after early afternoon, cool bedroom around 18 degrees Celsius.\n\n12. Begin magnesium glycinate supplementation (300 to 400 mg elemental magnesium before bed) to support sleep and bring magnesium into the optimal range.\n\n13. Begin sublingual methylcobalamin B12 supplementation (1,000 mcg daily) to bring B12 from 420 toward the optimal range above 500.\n\n14. Continue current vitamin D maintenance. The level of 112 nmol/L is optimal, suggesting her current intake or sun exposure is appropriate.\n\n15. Review the pending urine culture result when available. If a significant organism is cultured, follow GP guidance on treatment. If no significant growth, no further action is needed.\n\n16. Retest in four to six months: full lipid panel, TSH, Free T4, Free T3, testosterone, SHBG, IgM, and repeat urine if culture is positive.","supplementation":"Based on Yolande's results, the following targeted supplements are recommended.\n\nMagnesium glycinate, 300 to 400 mg of elemental magnesium, taken in the evening approximately 30 to 60 minutes before bed. Her serum magnesium at 0.84 mmol/L sits just below the optimal floor of 0.85, and given her reported poor sleep and anxiety, magnesium glycinate is the preferred form because the glycinate component itself has calming properties. It supports GABA activity in the brain, which promotes sleep onset and reduces anxiety, and also supports healthy muscle and nerve function.\n\nSublingual methylcobalamin (vitamin B12), 1,000 mcg daily, dissolved under the tongue ideally in the morning. Her B12 at 420 pg/ml is within the laboratory range but below the optimal threshold of 500. Sublingual methylcobalamin is preferred over oral tablets because it bypasses the digestive system and is absorbed directly into the bloodstream, which becomes increasingly important with age as stomach acid production declines and oral absorption becomes less reliable. B12 supports energy production, nerve function, and mood regulation, all of which align with her goals.\n\nOmega-3 fish oil, providing 2 to 3 grams of combined EPA and DHA daily, taken with her largest meal. Given her very elevated LDL and ApoB, omega-3 supplementation supports cardiovascular health through multiple mechanisms: reducing triglycerides (hers are already good but this adds further protection), reducing inflammation, and supporting healthy endothelial function. It also has evidence for mood support, which is relevant to her low mood and anxiety symptoms. She should look for a product that specifies the EPA and DHA content per serving rather than just \"fish oil\" weight.\n\nVitamin K2 as MK-7, 100 to 200 mcg daily, taken with her vitamin D or with a fat-containing meal. She is already maintaining excellent vitamin D levels, and K2 works alongside vitamin D to direct calcium into bones rather than allowing it to deposit in artery walls. Given her cardiovascular risk profile, this is a prudent addition.\n\nShe should continue her current vitamin D regimen unchanged, as her level of 112 nmol/L is within the optimal range of 75 to 120.\n\nShe should not take iron supplements. Her ferritin at 63 and transferrin saturation at 25.78% are both within healthy ranges, and supplementing iron when stores are adequate risks pushing ferritin too high, which is associated with oxidative stress and cardiovascular harm.\n\nThe most important changes from this report are not supplements. They are the GP conversation about lipid-lowering medication and Lp(a), the discussion about thyroid monitoring and possible treatment, the exploration of hormone replacement therapy including testosterone, the dietary shifts toward more soluble fibre and oily fish, and the increase in resistance training. These will have a far greater impact on her energy, mood, sleep, and long-term disease prevention than any supplement can provide.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1161","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver health. Yolande's ALT at 13 IU/l is well within the optimal range for women of below 25 IU/l, indicating that her liver cells are healthy and not under any metabolic stress. This is an excellent result.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, hepatitis, alcohol excess, medication side effects, strenuous exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5313","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It is released into the blood when these tissues are damaged. Yolande's AST at 22 IU/l is comfortably within the normal and optimal ranges, confirming healthy liver function with no signs of tissue damage.","low_causes":"Vitamin B6 deficiency (rare)","high_causes":"Liver disease, heart damage, muscle injury, strenuous exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.25","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2763","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake, bile duct obstruction, and metabolic strain on the liver. It is often the first liver enzyme to rise when the liver is under stress. Yolande's GGT at 19 IU/l is well within both the laboratory and optimal ranges for women, indicating a healthy liver with no signs of metabolic strain, bile duct issues, or alcohol-related effects.","low_causes":"","high_causes":"Alcohol excess, bile duct obstruction, fatty liver disease, certain medications, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, kidneys, and digestive system. It is used to assess liver and bone health. Yolande's ALP at 49 IU/l is within the laboratory range but just below the optimal floor of 50. This is a trivially small margin and is entirely normal. ALP levels can fluctuate slightly between samples.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism (severe)","high_causes":"Bile duct obstruction, bone disorders, Paget's disease, vitamin D deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated levels can indicate liver dysfunction or excessive red blood cell breakdown. Yolande's total bilirubin at 11 umol/l is well within the normal and optimal ranges, confirming healthy liver processing and normal red blood cell turnover.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolytic anaemia, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6133","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects liver synthetic function and immune system activity. Yolande's total protein at 68 g/l is within both the laboratory and optimal ranges, suggesting healthy liver protein production and normal immune protein levels.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood and is made exclusively by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance between blood vessels and tissues. Yolande's albumin at 38 g/l is within the laboratory range but below the optimal floor of 40. This is a marginal finding and at 65 is often simply reflective of the age-related decline in liver protein synthesis. Ensuring adequate protein intake (at least 87 to 107 grams per day) can support albumin production.","low_causes":"Liver disease, malnutrition, chronic illness, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"33","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/l","description":"Globulins are a group of proteins in the blood that include immune antibodies and transport proteins. They are produced by the liver and the immune system. Yolande's globulin at 30 g/l is within both the laboratory and optimal ranges, indicating normal immune protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3881","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is a calculated marker derived by dividing albumin by globulin. It helps assess the balance between these two protein groups and can flag liver or immune issues when abnormal. Yolande's A/G ratio at 1.27 is within the laboratory range but just below the optimal floor of 1.3. This reflects her albumin sitting at 38 rather than above 40 and is a marginal finding without clinical significance.","low_causes":"Liver disease, autoimmune conditions, chronic infection, kidney disease","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.38","lower_normal":"0","upper_normal":"2","lower_optimal":"0","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis (scarring) using age, ALT, AST, and platelet count. The standard threshold is 1.45, but for patients over 65, the threshold rises to 2.0 to account for the effect of age on the calculation. Yolande's FIB-4 at 1.52 is above the standard threshold but comfortably below the age-adjusted threshold of 2.0 for her age group. With every individual liver marker (ALT, AST, GGT, ALP, bilirubin, albumin) within healthy ranges, the slightly elevated score is being driven entirely by the age component of the formula rather than by any sign of liver disease.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advanced age (inflates the calculation), low ALT (makes denominator smaller), low platelets","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5530","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatic inflammation (pancreatitis). Yolande's amylase at 98 IU/L is within the normal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5603","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"53","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6170","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is the most specific marker for pancreatic inflammation. Yolande's lipase at 45 U/L is within the normal and optimal ranges, confirming healthy pancreatic function.","low_causes":"","high_causes":"Acute pancreatitis, chronic pancreatitis, pancreatic cancer, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"11.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures the overall amount of cholesterol in the blood, including LDL (the form that deposits in artery walls), HDL (the protective form that removes cholesterol from arteries), and VLDL. Yolande's total cholesterol at 11.2 mmol/L is substantially above the desirable upper limit of 5.18 mmol/L. While total cholesterol alone is a blunt instrument, in her case it reflects a very high LDL component. This needs to be discussed with her GP as a priority.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Familial hypercholesterolaemia, hypothyroidism, high saturated fat diet, obesity, kidney disease, certain medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"8.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is often called \"bad\" cholesterol because it carries cholesterol into artery walls, where it can accumulate and form plaques that narrow the arteries (atherosclerosis). Yolande's LDL at 8.35 mmol/L is nearly three times the upper limit of 3.0 mmol/L and more than three times the optimal target of below 2.6. This is a substantially elevated result that places her at significantly increased cardiovascular risk and warrants prompt medical attention.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, hypothyroidism, obesity, diabetes, kidney disease, certain medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8333","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is known as \"good\" cholesterol because it carries cholesterol away from artery walls back to the liver for disposal. Higher HDL levels are associated with lower cardiovascular risk. Yolande's HDL at 2.6 mmol/L is excellent, well above the desirable threshold of 1.55 and above the optimal floor for women of 1.6. This is a genuine positive and provides some cardiovascular protection, though it cannot fully offset the very high LDL level.","low_causes":"Sedentary lifestyle, smoking, obesity, high refined carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are a type of fat in the blood that the body uses for energy. High levels are associated with increased cardiovascular risk, insulin resistance, and metabolic syndrome. Yolande's triglycerides at 0.89 mmol/L are well within the optimal range of below 1.0, reflecting excellent fat metabolism likely supported by her low-carb dietary approach and insulin sensitivity.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol excess, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues throughout the body. Elevated VLDL is associated with increased cardiovascular risk and often accompanies high triglycerides. Yolande's VLDL at 0.4 mmol/L is well within the normal and optimal ranges, consistent with her excellent triglyceride level.","low_causes":"","high_causes":"High triglycerides, obesity, insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"8.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol fractions in a single number, including LDL, VLDL, and remnant cholesterol. Yolande's non-HDL cholesterol at 8.6 mmol/L is more than double the upper limit of 4.0, driven primarily by her very elevated LDL. This confirms the need for medical intervention.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, hypothyroidism, insulin resistance, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4789","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL cholesterol. It is a useful measure of the balance between harmful and protective cholesterol. A lower ratio indicates relatively more protective HDL. Yolande's ratio at 4.31 is within the laboratory limit of 4.5, but only because her exceptionally high HDL at 2.6 partially offsets her very high total cholesterol. The ratio does not capture the absolute magnitude of LDL exposure, which is why ApoB and non-HDL are more informative in her case.","low_causes":"","high_causes":"High LDL, low HDL, metabolic syndrome, sedentary lifestyle, smoking","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"23.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5803","lower_normal":"20","upper_normal":"40","lower_optimal":"20","upper_optimal":"40","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol indicates how much of the total cholesterol is the protective HDL form. A higher percentage is better, with above 20% considered desirable. Yolande's HDL percentage at 23.21% is above the 20% threshold, reflecting the strength of her HDL production. However, in her case the total cholesterol is so elevated that even a reasonable percentage translates to a very high absolute LDL level.","low_causes":"Sedentary lifestyle, metabolic syndrome, obesity, smoking","high_causes":"Regular exercise, healthy diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6786","lower_normal":"1.4","upper_normal":"2.8","lower_optimal":"1.4","upper_optimal":"2.8","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA1 (apolipoprotein A1) is the main protein component of HDL cholesterol. Higher levels indicate more HDL particles available to carry cholesterol away from artery walls. Yolande's ApoA1 at 1.9 g/L is well above the desirable threshold of 1.4, confirming strong HDL particle production and function.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is a protein found on the surface of every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, the ApoB level is considered the single best measure of how many artery-damaging particles are circulating. Yolande's ApoB at 1.77 g/L is nearly double the desirable limit of 0.9 and classified as \"very high\" by the laboratory. This confirms a very large number of atherogenic particles and is consistent with her elevated LDL. This is a key number to bring to the GP discussion.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, hypothyroidism, insulin resistance, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.775","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective lipoprotein particles. It is considered one of the best single predictors of cardiovascular risk. A ratio below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Yolande's ratio at 0.93 is in the higher risk category, driven by her very high ApoB despite her strong ApoA1. This confirms that the volume of atherogenic particles substantially exceeds the protective capacity of her HDL system.","low_causes":"","high_causes":"High LDL particle count, low HDL particle count, familial hypercholesterolaemia, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"103.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It drives cardiovascular risk through three mechanisms: depositing cholesterol in artery walls like LDL, promoting blood clot formation, and encouraging inflammation. Unlike LDL, Lp(a) levels are almost entirely determined by genetics and cannot be meaningfully changed by diet, exercise, or any currently available supplement. Yolande's Lp(a) at 103.85 nmol/L is above the normal limit of 32 and falls in the moderate risk category (90 to 200 nmol/L). This is a permanent finding and should be recorded in her medical file. Because it is inherited, her children and siblings each have approximately a 50% chance of carrying the same variant and should be offered testing. Only one Lp(a) test is ever needed in a lifetime because the level does not change.","low_causes":"","high_causes":"Genetic inheritance (this is the only meaningful cause; Lp(a) levels are >90% genetically determined)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1133","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that serves as a proxy for insulin resistance and cardiovascular risk. A lower ratio indicates better metabolic health. Yolande's ratio at 0.34 is excellent, well within the optimal range of below 0.87, reflecting her strong insulin sensitivity and excellent triglyceride and HDL levels.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, obesity, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated by subtracting both HDL and LDL from total cholesterol (TC minus HDL minus LDL). It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Yolande's remnant cholesterol at 0.25 mmol/L is well within the optimal range of below 0.5, confirming that her triglyceride-rich particle metabolism is healthy.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome, obesity, type 2 diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the level of sugar in the blood after an overnight fast. It is a primary screening tool for diabetes and pre-diabetes. Yolande's glucose at 5.2 mmol/L is within both the laboratory and optimal ranges, indicating healthy blood sugar regulation.","low_causes":"Excessive insulin, prolonged fasting, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, infection, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose attached to it. Because red blood cells live for about three months, HbA1c gives an average picture of blood sugar control over the preceding 8 to 12 weeks. Yolande's HbA1c at 6.0% sits right at the boundary between normal (below 6.0%) and pre-diabetes (6.0 to 6.4%). This is worth monitoring, though in the context of excellent fasting glucose, excellent insulin sensitivity (HOMA-IR 0.74), and a low-carb diet, it may reflect the natural age-related increase in HbA1c rather than a deterioration in glucose control.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease (reduced red cell lifespan)","high_causes":"Pre-diabetes, type 2 diabetes, sustained high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c expressed in mmol/mol is the international standard unit for glycated haemoglobin. Normal is below 42, pre-diabetes is 42 to 47, and diabetes is 48 and above. Yolande's HbA1c at 41 mmol/mol is just within the normal range but approaching the pre-diabetes threshold. The optimal target is below 36 mmol/mol. As noted above, in the context of her otherwise excellent metabolic markers, this is likely an age-related finding rather than an early sign of metabolic deterioration, but it should be monitored longitudinally.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Pre-diabetes, type 2 diabetes, sustained high blood sugar, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3393","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3243","upper_optimal_position":"0.4034","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing to maintain blood sugar levels. Lower fasting insulin generally indicates better insulin sensitivity, as the body needs less insulin to keep glucose under control. Yolande's insulin at 3.2 mIU/L is at the lower end of the laboratory range but within the optimal range of 2 to 8. This reflects excellent insulin sensitivity and is consistent with her low-carb dietary approach.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes (pancreatic exhaustion)","high_causes":"Insulin resistance, obesity, metabolic syndrome, pre-diabetes, high carbohydrate diet, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.768","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2568","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is used to measure how much insulin the pancreas is actually producing, independent of any external insulin administration. Yolande's C-Peptide at 0.768 ug/L (equivalent to approximately 254 pmol/L) is below the laboratory range of 1.1 to 4.4. However, in the context of normal fasting glucose, normal HbA1c, and an excellent HOMA-IR of 0.74, this low C-Peptide simply reflects that her pancreas is producing less insulin because it does not need to produce more. On a low-carb diet with high insulin sensitivity, the demand for insulin is reduced, and the pancreas responds accordingly. This is a metabolically favourable finding rather than a sign of pancreatic insufficiency.","low_causes":"Low carbohydrate diet (reduced demand), type 1 diabetes, late-stage type 2 diabetes, fasting, very high insulin sensitivity","high_causes":"Insulin resistance, type 2 diabetes (early), insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated score derived from fasting glucose and fasting insulin. It estimates how resistant the body's cells are to the effects of insulin. A score below 1.0 indicates excellent insulin sensitivity, 1.0 to 1.9 is normal, above 1.9 suggests early insulin resistance, and above 2.9 indicates significant insulin resistance. Yolande's HOMA-IR at 0.74 confirms that she is insulin-sensitive, which is an excellent result and means her cells respond efficiently to insulin signals.","low_causes":"Very high insulin sensitivity, very low carbohydrate diet, fasting","high_causes":"Insulin resistance, obesity, metabolic syndrome, pre-diabetes, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"37.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2353","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the beta cells in the pancreas are producing insulin relative to the blood glucose level. It is calculated as (20 x Insulin) / (Glucose minus 3.5). Yolande's HOMA-B at 37.65 is below the laboratory range of 80 to 200. However, this must be interpreted in context. HOMA-B measures insulin output relative to glucose, and because Yolande's glucose is well controlled at 5.2 with very low insulin at 3.2, the formula produces a low score. This does not mean her pancreas is failing. It means her pancreas is efficiently producing just enough insulin to maintain excellent blood sugar control, which is the hallmark of a well-adapted low-carb metabolism. If glucose were rising alongside a low HOMA-B, that would suggest the pancreas was falling behind, but her glucose and HbA1c confirm that is not the case.","low_causes":"Low carbohydrate diet (reduced demand), type 1 diabetes, late-stage type 2 diabetes, high insulin sensitivity","high_causes":"Early insulin resistance (compensatory hyperinsulinaemia), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.05","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is the most sensitive routine marker of systemic inflammation and is also used as a cardiovascular risk marker. A level below 1.0 mg/L is considered optimal and associated with lower cardiovascular risk. Yolande's hs-CRP at 0.5 mg/L is well within the optimal range, indicating very low systemic inflammation. This is a genuinely positive finding.","low_causes":"","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular disease, smoking","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"12","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. Yolande's ESR at 10 mm/hour is within the normal range of below 12, confirming no significant inflammatory process.","low_causes":"","high_causes":"Infection, autoimmune disease, cancer, chronic kidney disease, anaemia, pregnancy, ageing","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/l","description":"Sodium is the main electrolyte in the blood and plays a critical role in fluid balance, nerve conduction, and muscle function. Yolande's sodium at 144 mmol/L is within both the laboratory and optimal ranges, indicating healthy fluid and electrolyte balance.","low_causes":"Excessive water intake, diuretics, heart failure, liver disease, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"4.1","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is an essential electrolyte that maintains heart rhythm, nerve function, and muscle contraction. Yolande's potassium at 4.0 mmol/L is within the laboratory range but marginally below the optimal floor of 4.1. This is a trivial margin and is within normal variation, though ensuring adequate dietary potassium from sources like avocados, leafy greens, and fish is always beneficial.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, poor dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, sample haemolysis, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/l","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance and acid-base balance in the body. Yolande's chloride at 99 mmol/L is within both the laboratory and optimal ranges.","low_causes":"Vomiting, diuretics, Addison's disease, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5152","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a key buffer in the blood that helps maintain the body's acid-base balance (pH). Yolande's bicarbonate at 26 mmol/L is within both the laboratory and optimal ranges, indicating healthy acid-base regulation.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone structure, nerve signalling, muscle contraction, and blood clotting. Most calcium is stored in bones, with a small fraction circulating in the blood. Yolande's calcium at 2.46 mmol/L is within both the laboratory and optimal ranges, indicating healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis, prolonged immobility","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate picture of the physiologically active calcium in the blood. This matters because calcium binds to albumin, so if albumin is low (as Yolande's is at 38), the total calcium may underrepresent the true calcium level. Her corrected calcium at 2.56 mmol/L is within the laboratory range but in the upper portion, just above the optimal ceiling of 2.5. Th EY FUNCTION","result":"66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4715","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3813","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism. The kidneys filter it out of the blood at a fairly constant rate, making it a useful marker of kidney function. Yolande's creatinine at 66 umol/L is within both the laboratory and optimal ranges.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, rhabdomyolysis, high meat intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how well the kidneys are filtering waste from the blood. It is calculated from the creatinine level, age, sex, and ethnicity. An eGFR above 90 is considered fully normal, 60 to 89 is mildly reduced, and below 60 warrants investigation. Yolande's creatinine-based eGFR at 84 is above 60 but below the optimal threshold of 90. At 65, mild reduction in eGFR is expected as part of normal ageing. Her Cystatin C-based eGFR at 79 provides a second estimate that is consistent with this age-appropriate picture.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, heart failure, urinary obstruction","high_causes":"Hyperfiltration (early diabetes, pregnancy), high cardiac output, high protein intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, its level is not affected by muscle mass, diet, or exercise, making it a more accurate marker of kidney function, particularly in people with low muscle mass or at extremes of body composition. Yolande's Cystatin C at 1.04 mg/L is within the laboratory range of below 1.1 but above the optimal ceiling of 0.9. This is consistent with the mild age-related decline in kidney function seen in her eGFR values and does not indicate kidney disease.","low_causes":"","high_causes":"Reduced kidney function, ageing, thyroid dysfunction, corticosteroid use, inflammation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatin_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR provides an alternative estimate of kidney filtration rate using Cystatin C instead of creatinine. It is considered more accurate in certain populations. Yolande's Cystatin C eGFR at 79 is above 60 but below the optimal threshold of 90, consistent with the mild, age-appropriate decline in kidney function expected at 65. Both eGFR values (creatinine-based at 84 and Cystatin C-based at 7
