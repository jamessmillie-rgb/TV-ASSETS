phil/Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4587","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is calculated by dividing the neutrophil count by the lymphocyte count. It is used as a marker of systemic inflammation and immune balance. A ratio of 1 to 3 is normal, with the optimal range being 1.0 to 2.0. Yolande's NLR at 1.76 is within both the normal and optimal ranges, confirming a healthy balance between innate and adaptive immune responses.","low_causes":"","high_causes":"Infection, inflammation, physiological stress, malignancy, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"14.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4220","lower_normal":"9","upper_normal":"30.4","lower_optimal":"10","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3411","upper_optimal_position":"0.5841","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. It fluctuates throughout the day and with meals. Yolande's serum iron at 14.5 umol/L is within both the laboratory and optimal ranges, indicating adequate circulating iron.","low_causes":"Iron deficiency, chronic disease, blood loss, malabsorption, vegetarian/vegan diet","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia, blood transfusions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3522","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.5171","units":"ng/ml","description":"Ferritin is a protein that stores iron inside cells. The blood level of ferritin reflects how much iron the body has in reserve. Yolande's ferritin at 63 ng/ml is within both the laboratory range and the optimal range for women of 40 to 150. This indicates healthy iron stores, sufficient to support red blood cell production and energy without being excessively high.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption, heavy menstruation","high_causes":"Haemochromatosis, inflammation (acute phase reactant), liver disease, infection, iron overload from transfusions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2785","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6103","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. The body produces more transferrin when iron stores are low (to scavenge more iron) and less when stores are adequate. Yolande's transferrin at 2.24 g/L is marginally below the lower limit of 2.5. With her ferritin at a healthy 63 and her CRP low at 0.5, neither iron deficiency nor inflammation is the likely explanation. A marginally low transferrin with otherwise healthy iron markers is most commonly a benign finding at this age. It should be monitored at the next blood test to confirm stability.","low_causes":"Iron overload, haemochromatosis, chronic disease, inflammation (negative acute phase protein), liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"53.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4680","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3374","upper_optimal_position":"0.6143","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the total capacity of the blood to bind and transport iron. It reflects the availability of transferrin binding sites. Yolande's TIBC at 53.7 umol/L is within both the laboratory and optimal ranges.","low_causes":"Iron overload, haemochromatosis, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"25.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures the percentage of transferrin that is currently loaded with iron. It is calculated by dividing serum iron by TIBC. Yolande's transferrin saturation at 25.78% is within both the laboratory and optimal ranges of 25 to 40%, indicating that the right proportion of her iron transport capacity is being utilised.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Haemochromatosis, iron overload, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"402","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5413","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5831","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling in the evening. Morning cortisol is used to screen for adrenal insufficiency (too low) or Cushing's syndrome (too high). Yolande's cortisol at 402 nmol/L is within both the morning reference range and the optimal range, indicating healthy adrenal function. A single morning cortisol provides a useful snapshot but does not capture the full daily rhythm.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, long-term steroid use (adrenal suppression)","high_causes":"Acute stress, Cushing's syndrome, steroid medication, chronic illness, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"<43","within_normal":"TRUE","within_optimal":"","result_position":"0.1818","lower_normal":"0","upper_normal":"118.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen and plays critical roles in bone health, cardiovascular protection, brain function, skin elasticity, and mood regulation. In post-menopausal women, oestradiol falls to very low levels as the ovaries cease production. Yolande's oestradiol is below 43 pmol/L, which is within the expected post-menopausal range of 0 to 118.2 pmol/L and confirms that her ovaries are no longer producing significant oestrogen. The absence of oestrogen contributes to bone density loss, cardiovascular risk, mood changes, and the symptoms she is experiencing. Hormone replacement therapy could address this if appropriate after discussion with her GP.","low_causes":"Menopause, ovarian insufficiency, excessive exercise, very low body fat, pituitary disease","high_causes":"Ovulation, pregnancy, oestrogen therapy, obesity, liver disease, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.24","within_normal":"TRUE","within_optimal":"","result_position":"0.0517","lower_normal":"0","upper_normal":"2.32","lower_optimal":"","upper_optimal":"","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone primarily produced by the ovaries after ovulation. In post-menopausal women, progesterone levels are very low because ovulation no longer occurs. Yolande's progesterone at 0.24 nmol/L is within the expected post-menopausal range of 0 to 2.32, confirming the cessation of ovulatory cycles.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Ovulation (luteal phase), pregnancy, congenital adrenal hyperplasia, ovarian tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"24.54","within_normal":"TRUE","within_optimal":"","result_position":"0.3218","lower_normal":"15.9","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the ovaries. In post-menopausal women, LH rises because the ovaries are no longer responding to the signal with oestrogen production, so the pituitary keeps increasing the signal. Yolande's LH at 24.54 mIU/ml is within the post-menopausal reference range of 15.9 to 54, confirming post-menopausal status.","low_causes":"Pituitary disease, anorexia, excessive exercise, certain medications","high_causes":"Menopause, primary ovarian failure, polycystic ovary syndrome (mid-cycle)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"86.17","within_normal":"TRUE","within_optimal":"","result_position":"0.5592","lower_normal":"23","upper_normal":"116.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and stimulates the ovaries to develop follicles and produce oestrogen. In post-menopausal women, FSH rises substantially because the ovaries no longer respond adequately, prompting the pituitary to increase the signal. Yolande's FSH at 86.17 mIU/ml is well within the post-menopausal range of 23 to 116.3, firmly confirming post-menopausal status.","low_causes":"Pituitary disease, anorexia, excessive exercise, pregnancy, certain medications","high_causes":"Menopause, primary ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1905","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays important roles in energy, mood, libido, muscle strength, bone density, and cognitive function. Yolande's total testosterone at 0.3 nmol/L is below the female laboratory range of 0.5 to 2.6. In a post-menopausal woman, testosterone production declines as both ovarian and adrenal output diminish. Low testosterone is associated with fatigue, low motivation, reduced libido, difficulty maintaining muscle mass, and low mood, all of which overlap with Yolande's reported symptoms. Testosterone supplementation for post-menopausal women is increasingly recognised as beneficial and is worth discussing with her GP.","low_causes":"Menopause, adrenal insufficiency, pituitary disease, ageing, oophorectomy, corticosteroid use","high_causes":"PCOS, congenital adrenal hyperplasia, ovarian or adrenal tumours, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1756","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5889","units":"","description":"The Free Androgen Index (FAI) estimates the proportion of testosterone that is biologically active and not bound to SHBG. It is calculated as (total testosterone / SHBG) x 100. A low FAI means that very little testosterone is available for the body to use. Yolande's FAI at 0.34 is below the female laboratory range of 0.5 to 6.5. This is partly because her total testosterone is already low at 0.3, and partly because her SHBG at 88.3 is in the upper half of range, binding a high proportion of what little testosterone she produces. The combination means very little biologically active testosterone is available, which could be contributing to her fatigue and low mood.","low_causes":"Low testosterone production, high SHBG, menopause, ageing, oral oestrogen therapy","high_causes":"PCOS, obesity (lowers SHBG), insulin resistance, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"88.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5118","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3616","upper_optimal_position":"0.5428","units":"nmol/l","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds to sex hormones (testosterone, oestrogen, DHT) and makes them inactive. Higher SHBG means less free hormone is available for tissues to use. Yolande's SHBG at 88.3 nmol/L is within the laboratory range but above the optimal ceiling of 80. This contributes to her very low Free Androgen Index by binding the already limited testosterone she produces. SHBG tends to rise with age and in low-oestrogen states, both of which apply in her case.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS, anabolic steroid use","high_causes":"Ageing, hyperthyroidism, liver disease, low body weight, oestrogen therapy, menopause","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"0.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3370","lower_normal":"0.26","upper_normal":"11","lower_optimal":"1.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3782","upper_optimal_position":"0.5575","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It peaks in the mid-20s and declines progressively with age. Yolande's DHEA-S at 0.3 umol/L (equivalent to approximately 110.6 ug/dL) is just above the laboratory floor of 0.26 and well below the optimal range. This age-related decline is expected at 65 and contributes to the overall low androgen environment seen in her testosterone and FAI results.","low_causes":"Ageing (normal decline), adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"165","within_normal":"TRUE","within_optimal":"","result_position":"0.4236","lower_normal":"38","upper_normal":"430","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for stimulating breast milk production but also involved in immune regulation and reproductive function. Yolande's prolactin at 165 uIU/ml is within the post-menopausal reference range of 38 to 430, indicating normal pituitary function.","low_causes":"Dopamine agonist medication, pituitary infarction","high_causes":"Pituitary adenoma (prolactinoma), certain medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.003","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Free testosterone is the fraction of testosterone that is not bound to proteins (SHBG or albumin) and is therefore biologically active and available for tissues to use. Yolande's calculated free testosterone at 0.003 nmol/L is very low, consistent with her below-range total testosterone and elevated SHBG. This confirms minimal biologically active testosterone and supports the clinical picture described in the testosterone and FAI sections.","low_causes":"Low total testosterone, high SHBG, menopause, ageing","high_causes":"Exogenous testosterone, PCOS, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5924","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3439","upper_optimal_position":"0.4610","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid gland how hard to work. When the thyroid is underperforming, the pituitary increases TSH to push it harder. Yolande's TSH at 3.89 mIU/L is within the laboratory range of 0.55 to 4.78 but significantly above the optimal range of 1.0 to 2.5. This means the pituitary is having to work harder than ideal to maintain thyroid hormone output. Combined with her FT4 at the lower optimal boundary and FT3 below the optimal floor, this pattern suggests the thyroid is not performing as efficiently as it could. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease (Hashimoto's). This should be discussed with her GP.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease, early pregnancy","high_causes":"Hypothyroidism, iodine deficiency, recovery from illness, thyroid gland damage, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3560","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3560","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues throughout the body. \"Free\" means the portion not bound to proteins and therefore available for use. Yolande's FT4 at 14.0 pmol/L is within the laboratory range of 11.5 to 22.7 but sits right at the lower boundary of the optimal range of 14 to 20. This means the thyroid is producing the minimum amount of T4 needed to stay within the healthy zone, consistent with the elevated TSH pushing it to maintain output.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, severe illness","high_causes":"Hyperthyroidism, thyroid nodules, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 (triiodothyronine) is the most active thyroid hormone and the form that cells actually use to regulate metabolism, energy production, and body temperature. Most T3 is produced by converting T4 in peripheral tissues rather than being made directly by the thyroid. Yolande's FT3 at 4.2 pmol/L is within the laboratory range of 2.6 to 7.1 but below the optimal floor of 4.5. This means that despite the pituitary pushing the thyroid harder (TSH 3.89), the body is not generating enough active thyroid hormone for optimal function. This suboptimal T3 level could be contributing to her fatigue, poor sleep, and low mood, as T3 directly influences energy metabolism and neurotransmitter activity.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, calorie restriction, ageing, selenium deficiency","high_causes":"Hyperthyroidism, thyroid nodules, excessive T3 medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies (thyroid peroxidase antibodies) are immune proteins that attack the thyroid gland. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Yolande's TPO antibodies are below 6.6 U/ml, which is well within the normal range of below 13.8 and confirms that her thyroid is not under autoimmune attack. This is reassuring and means that her elevated TSH and suboptimal T4/T3 are not being driven by Hashimoto's.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are immune proteins directed against thyroglobulin, a protein produced by the thyroid gland. Like TPO antibodies, their presence can indicate autoimmune thyroid disease. Yolande's thyroglobulin antibodies are below 1.3 U/ml, well below the threshold of 4.4 for autoimmune thyroid disease. More than 80% of the population have un   .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}

    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));

// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
