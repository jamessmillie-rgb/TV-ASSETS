0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5417","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, large cells that engulf pathogens, dead cells, and debris. They bridge the innate and adaptive immune systems. Yolande's monocytes at 0.28 are within both ranges.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, inflammation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3681","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. Elevated levels can indicate allergies, asthma, or parasitic infection. Yolande's eosinophils at 0.07 are low-normal and within both ranges, consistent with her very low IgE and no allergic process.","low_causes":"Corticosteroids, acute stress","high_causes":"Allergies, asthma, parasitic infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3792","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and play a role in allergic reactions and inflammation. They release histamine and other chemicals. Yolande's basophils at 0.03 are within both ranges.","low_causes":"Acute allergic reactions, corticosteroids","high_causes":"Allergies, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percentage","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4967","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. Their count indicates how actively the bone marrow is producing new red cells. Yolande's reticulocyte percentage at 1.48 is within both the laboratory and optimal ranges, confirming healthy red cell production.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, low energy availability","high_causes":"Recovery from blood loss or anaemia, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"60.976","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5532","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"85","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Absolute reticulocyte count gives the total number of immature red cells per litre of blood, providing a more precise measure of bone marrow output than the percentage alone. Yolande's absolute reticulocytes at 60.976 are within both ranges.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression","high_causes":"Recovery from anaemia, haemolytic anaemia, blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a simple but powerful marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, with lower values indicating a calm immune system. Ratios above 3 are associated with chronic inflammation and poorer outcomes in various conditions. Yolande's NLR at 1.76 is within both the laboratory and optimal ranges, indicating a well-balanced immune system with no active inflammation.","low_causes":"Autoimmune conditions","high_causes":"Bacterial infection, chronic inflammation, physiological stress, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"14.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4233","lower_normal":"9","upper_normal":"30.4","lower_optimal":"10","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3490","upper_optimal_position":"0.5817","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin and transferrin saturation. Yolande's serum iron at 14.5 is within both the laboratory and optimal ranges.","low_causes":"Iron deficiency, chronic disease, vegetarian/vegan diet, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4160","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3687","upper_optimal_position":"0.4979","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve in the liver, spleen, and bone marrow. Low ferritin is the earliest sign of iron depletion, even before haemoglobin drops. Yolande's ferritin at 63 is within both the laboratory range and the optimal range for women of 40 to 150, indicating adequate iron stores.","low_causes":"Iron deficiency, vegetarian/vegan diet, blood loss, malabsorption","high_causes":"Haemochromatosis, inflammation, infection, liver disease, iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2897","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the main protein that transports iron through the bloodstream from the gut to the bone marrow and other tissues. The liver produces it, and levels rise when iron stores are low (the body makes more transport protein to capture more iron) and fall when stores are adequate. Transferrin is also a negative acute phase reactant, meaning it can fall during inflammation. Yolande's transferrin at 2.24 is marginally below the lower limit of 2.5. With her CRP at 0.5, active inflammation is unlikely to be the cause. In isolation with adequate ferritin and normal saturation, this is a minor finding that should be monitored on future panels.","low_causes":"Iron overload, inflammation, liver disease, malnutrition, haemochromatosis","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"25.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3922","upper_optimal_position":"0.5183","units":"%","description":"Transferrin saturation is the percentage of transferrin that is carrying iron. It is calculated from serum iron and transferrin and indicates how much of the iron transport capacity is being used. Yolande's transferrin saturation at 25.78% is within both the laboratory and optimal ranges, confirming balanced iron transport.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron overload, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"53.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4362","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6037","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the blood's maximum capacity to bind and transport iron. It rises when iron stores are low and falls when they are adequate. Yolande's TIBC at 53.7 is within both the laboratory and optimal ranges, consistent with adequate iron stores.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"402","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5414","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3448","upper_optimal_position":"0.5818","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal rhythm, peaking in the morning and falling through the day. It regulates blood sugar, immune function, and the stress response. Yolande's cortisol at 402 is within both the laboratory range (morning collection) and the optimal band, indicating healthy adrenal function.","low_causes":"Adrenal insufficiency (Addison's disease), chronic fatigue, pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"<43","within_normal":"TRUE","within_optimal":"","result_position":"0.1819","lower_normal":"0","upper_normal":"118.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, produced mainly by the ovaries during reproductive years. After menopause, production drops dramatically. Yolande's oestradiol at below 43 is within the post-menopausal reference range of 0 to 118.2, confirming post-menopausal status as expected at 65.","low_causes":"Menopause, premature ovarian failure, low body fat, excessive exercise","high_causes":"HRT, ovarian cysts, obesity, certain medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.24","within_normal":"TRUE","within_optimal":"","result_position":"0.0517","lower_normal":"0","upper_normal":"2.32","lower_optimal":"","upper_optimal":"","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone produced primarily by the ovaries after ovulation. In post-menopausal women, levels are very low. Yolande's progesterone at 0.24 is within the post-menopausal reference range of 0 to 2.32, which is expected and normal.","low_causes":"Menopause, anovulation","high_causes":"Pregnancy, HRT, ovarian cysts","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"24.54","within_normal":"TRUE","within_optimal":"","result_position":"0.3218","lower_normal":"15.9","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and stimulates the ovaries to produce sex hormones. After menopause, LH rises because the ovaries no longer respond. Yolande's LH at 24.54 is within the post-menopausal range of 15.9 to 54, consistent with her menopausal status.","low_causes":"Pituitary dysfunction, extreme weight loss, excessive exercise","high_causes":"Menopause, premature ovarian failure, polycystic ovary syndrome (midcycle)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"86.17","within_normal":"TRUE","within_optimal":"","result_position":"0.5616","lower_normal":"23","upper_normal":"116.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"FSH is produced by the pituitary gland to stimulate the ovaries to develop follicles and produce eggs. After menopause, FSH rises significantly because the ovaries are no longer producing eggs or responding to the signal. Yolande's FSH at 86.17 is within the post-menopausal range of 23 to 116.3, clearly confirming post-menopausal status.","low_causes":"Pituitary dysfunction, pregnancy, HRT","high_causes":"Menopause, premature ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1905","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone is an androgen hormone essential in women for energy, mood, muscle maintenance, bone density, and libido. Women produce it in the ovaries and adrenal glands. Post-menopausal women rely primarily on adrenal production, which declines with age. Yolande's testosterone at 0.3 is below the female reference range of 0.5 to 2.6. This is a clinically relevant finding that may be contributing to her fatigue, low mood, and difficulty building muscle despite training. It is worth discussing with her GP.","low_causes":"Menopause, adrenal insufficiency, low DHEA-S, high SHBG, ageing","high_causes":"PCOS, adrenal hyperplasia, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index","group":"HORMONES","result":"0.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1900","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.8","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5500","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active (free) rather than bound to proteins. It is calculated from testosterone and SHBG. A low FAI means very little testosterone is available for the body to use. Yolande's FAI at 0.34 is below the reference range of 0.5 to 6.5, confirming that her already-low testosterone is further reduced by her relatively high SHBG, leaving very little free testosterone available.","low_causes":"Low testosterone, high SHBG, menopause, ageing","high_causes":"PCOS, insulin resistance, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"88.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5424","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3436","upper_optimal_position":"0.4850","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to sex hormones, particularly testosterone and oestradiol, and controls how much is available for the body to use. Higher SHBG means less free hormone. Yolande's SHBG at 88.3 is within the laboratory range but above the optimal ceiling of 80. This elevated SHBG is binding what little testosterone she produces, further reducing her free testosterone and contributing to her symptoms.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Ageing, low body weight, hyperthyroidism, liver disease, oral oestrogen","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.003","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Free testosterone is the fraction of testosterone that is not bound to proteins and is therefore biologically active. It is calculated from total testosterone, SHBG, and albumin. Yolande's free testosterone at 0.003 nmol/L is very low, consistent with her low total testosterone and high SHBG. This confirms minimal androgen activity and supports the recommendation to discuss testosterone replacement with her GP.","low_causes":"Low total testosterone, high SHBG, menopause","high_causes":"PCOS, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"0.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3370","lower_normal":"0.26","upper_normal":"11","lower_optimal":"1.5","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.3867","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It peaks in the mid-twenties and declines steadily with age. Yolande's DHEA-S at 0.3 umol/L (approximately 110.6 ug/dL) is within the laboratory range but sits at the very bottom, consistent with normal adrenal ageing at 65. With so little DHEA-S as raw material, the adrenals have limited capacity to produce testosterone, which partly explains her low testosterone level.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal hyperplasia, adrenal tumours, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"165","within_normal":"TRUE","within_optimal":"","result_position":"0.3239","lower_normal":"38","upper_normal":"430","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for stimulating milk production. Outside of pregnancy, elevated levels can indicate pituitary issues, stress, or medication effects. Yolande's prolactin at 165 is within the post-menopausal reference range of 38 to 430 and is not a concern.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, stress, certain medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5263","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3439","upper_optimal_position":"0.4687","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain. It is the signal that tells the thyroid to produce hormones. When the thyroid is underperforming, TSH rises as the brain sends a stronger signal. Yolande's TSH at 3.89 is within the laboratory range but above the optimal range of 1.0 to 2.5. This elevated TSH suggests the brain is working harder than ideal to get the thyroid to produce its hormones, which is consistent with her FT4 sitting at the floor of the optimal range.","low_causes":"Hyperthyroidism, pituitary dysfunction, excess thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3556","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5889","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to T3 (the active form) in tissues throughout the body. Yolande's FT4 at 14.0 is within the laboratory range but sits right at the floor of the optimal band. In the context of a TSH of 3.89, this suggests the thyroid is just meeting minimum expectations under increased stimulation from the brain.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use. It is produced partly by the thyroid directly and partly by conversion from T4 in tissues. Yolande's FT3 at 4.2 is within the laboratory range but below the optimal range of 4.5 to 6.5. This is the hormone that directly drives metabolism, energy, mood, and cognitive function, and its below-optimal level may be contributing to her symptoms of fatigue, poor sleep, and low mood.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, low calorie intake, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, excess T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies (TPO antibodies) are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence is the hallmark of autoimmune thyroid disease, particularly Hashimoto's thyroiditis. Yolande's TPO antibodies at below 6.6 are well within the negative range of below 13.8, which rules out autoimmune thyroid disease as the cause of her suboptimal thyroid function.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein produced by the thyroid that is essential for hormone production. Their presence, alongside TPO antibodies, can indicate autoimmune thyroid disease. Yolande's thyroglobulin antibodies at below 1.3 are well within the negative range, consistent with over 80% of the population who have undetectable levels. Combined with negative TPO antibodies, autoimmune thyroid disease is effectively ruled out.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"112","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. It is produced in the skin through sunlight exposure and obtained from certain foods and supplements. Yolande's vitamin D at 112 is excellent, sitting comfortably within the optimal range of 75 to 120. This is a genuine positive, especially at 65 when vitamin D supports bone density, immune function, and mood, all of which are relevant to her goals.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, limited dietary intake","high_causes":"Excess supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"420","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4282","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4560","upper_optimal_position":"0.6158","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy production. It is found in animal products such as meat, fish, eggs, and dairy. Yolande's B12 at 420 is within the laboratory range but below the optimal threshold of 500. Given her high-protein diet which should be providing adequate dietary B12, this may reflect declining absorption efficiency with age, which is common. Supplementation with sublingual methylcobalamin is recommended to bring levels into the optimal range, particularly given her symptoms of fatigue and low mood.","low_causes":"Poor dietary intake, pernicious anaemia, reduced stomach acid, metformin, ageing","high_causes":"Excess supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell formation, and cell division. It works closely with vitamin B12, and deficiency in either can cause similar symptoms. Yolande's folate at 12 is within both the laboratory and optimal ranges, reflecting her excellent diet quality.","low_causes":"Poor dietary intake, malabsorption, alcohol excess, certain medications","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3787","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3378","upper_optimal_position":"0.5067","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by four small glands behind the thyroid. It regulates calcium and phosphate levels in the blood by controlling calcium release from bone, calcium absorption from the gut (via vitamin D), and calcium retention by the kidneys. Yolande's PTH at 1.4 is within both the laboratory and optimal ranges. Combined with her excellent vitamin D and healthy calcium, this confirms that her calcium regulation system is working well, which is important for bone health at 65.","low_causes":"Excess vitamin D, excess calcium, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, chronic kidney disease, hyperparathyroidism, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4029","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3381","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle tissue, including the heart. It is released into the blood when muscles are damaged. Elevated levels can indicate muscle injury, intense exercise, or cardiac events. Yolande's CK at 87 is within both the laboratory and optimal ranges, indicating no significant muscle damage.","low_causes":"Sedentary lifestyle, low muscle mass","high_causes":"Intense exercise, muscle injury, myositis, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4807","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/l","description":"IgG (immunoglobulin G) is the most abundant antibody in the blood and provides long-term immunity against infections the body has previously encountered or been vaccinated against. Yolande's IgG at 10.7 is within the laboratory range, indicating healthy acquired immune function.","low_causes":"Immune deficiency, certain medications, chronic illness","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2400","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/l","description":"IgM (immunoglobulin M) is the first antibody the immune system produces in response to a new infection. It provides early defence before the more targeted IgG response develops. Yolande's IgM at 0.3 is below the lower limit of 0.5. Isolated low IgM with normal IgG and IgA is a relatively common finding and in most cases is benign. It does not typically cause a clinically significant immune deficit, but it should be noted on her medical record and rechecked in 6 months to confirm it is stable.","low_causes":"Normal variant, ageing, certain medications, Waldenstrom's macroglobulinaemia (treatment)","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4409","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.8","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.5513","units":"g/l","description":"IgA (immunoglobulin A) is the main antibody found in mucous membranes, saliva, tears, and the gut. It provides front-line defence at the body's entry points. Yolande's IgA at 1.4 is within the laboratory range. IgA is also used to validate the coeliac screen (tissue transglutaminase IgA), and with a normal IgA level, her negative coeliac result is reliable.","low_causes":"Selective IgA deficiency (common, usually harmless), medications","high_causes":"Chronic infection, liver disease, coeliac disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0255","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"IU/ml","description":"IgE (immunoglobulin E) is the antibody involved in allergic reactions and parasitic infections. Elevated levels suggest active allergy or parasitic exposure. Yolande's IgE at 5.1 is very low, indicating no active allergic or parasitic process.","low_causes":"","high_causes":"Allergies, asthma, eczema, parasitic infection","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7234","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total Antioxidant Activity measures the overall capacity of the blood to neutralise free radicals, which cause cellular damage and ageing. It reflects dietary antioxidant intake and the body's own antioxidant production. Yolande's TAA at 1.81 is marginally above the upper limit of 1.77. This is almost always driven by a diet rich in antioxidant foods or supplementation. In the context of a diet rated 9 out of 10 for quality, this is expected and is not a concern. It simply reflects excellent dietary quality.","low_causes":"Poor diet, oxidative stress, chronic illness","high_causes":"Antioxidant supplementation, diet rich in fruits, vegetables, and polyphenols","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","g function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';

  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');

    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
