const REPORT_DATA = {"patient_name":"Yolande Bosman","dob":"29/10/1960","report_date":"2026-09-07","summary":"Yolande is a 65-year-old female presenting with a BMI of 23.2, following a low-carb, high-protein diet rated 9 out of 10 for quality with a volume of 6 out of 10. She trains twice per week, one cardio session and one resistance session, with 7,500 to 10,000 daily steps. She takes no medications and reports no significant habits. She reports low energy and fatigue, poor sleep and insomnia, and low mood with anxiety. Her goals are to improve mood, prevent disease, and reduce stress and anxiety.\n\nThe finding in this report that warrants the most immediate attention is the urine culture. The laboratory grew a heavy growth of two organisms, Escherichia coli and Enterococcus faecalis, from her midstream urine sample, and her white blood cell count in the urine was 30, which is above the threshold of 10 that indicates significance. This pattern is consistent with a urinary tract infection. The laboratory has noted that the sample was received in a plain bottle without boric acid preservative, which can allow organisms to multiply after collection, so the bacterial count should be interpreted with some caution. However, the combination of elevated urinary white cells and heavy growth of two recognised urinary pathogens does suggest a genuine infection rather than simple contamination. Yolande should discuss this with her GP promptly. Both organisms showed broad antibiotic sensitivity, which means treatment options are straightforward. If she is experiencing any urinary symptoms such as frequency, urgency, burning or lower abdominal discomfort, these should be mentioned to the GP. Even without symptoms, the presence of significant bacteriuria with pyuria at 65 is worth investigating.\n\nThe second finding that should go to her GP is her cholesterol profile, which is markedly elevated across every metric. Her total cholesterol is 11.2, more than double the desirable upper limit of 5.18. Her LDL cholesterol, the fraction that deposits in artery walls, is 8.35, against an upper limit of 3.0. Her ApoB, which is a protein that sits on every atherogenic lipoprotein particle and is the single best measure of how many cholesterol-carrying particles are circulating, is 1.77, nearly double the desirable limit of 0.9. Her non-HDL cholesterol is 8.6 against a limit of 4.0. To put this in context, an LDL of 8.35 is not a dietary cholesterol elevation. Values this high, particularly in a lean woman eating a high-quality diet, raise the possibility of familial hypercholesterolaemia, an inherited condition in which the liver's ability to clear LDL from the bloodstream is impaired. This is not a diagnosis, but the magnitude of the elevation strongly suggests that her GP should investigate this possibility. A family history of early heart disease or elevated cholesterol in parents or siblings would support the suspicion further. What makes this especially important is her Lipoprotein(a), written Lp(a), which is 103.85 against a desirable level below 32. Lp(a) is entirely genetically determined. It cannot be changed by diet, exercise, or any currently available supplement. It is a particle that deposits cholesterol in artery walls, promotes blood clotting, and drives localised inflammation, and at 103.85 she sits in the moderate risk category. Lp(a) should be recorded permanently in her medical notes because it never needs retesting and it independently raises cardiovascular risk on top of the LDL elevation. The combination of very high LDL, very high ApoB, and elevated Lp(a) means her cumulative lifetime exposure to atherogenic particles is substantial, and this is the single most important finding in the report for long-term disease prevention. The one genuinely positive note within the lipid panel is her HDL cholesterol at 2.6, which is excellent and well above the desirable threshold of 1.55. Her ApoA1, the protein on protective HDL particles, is 1.9, also strong. Her triglycerides at 0.89 are below 1.0, which is optimal and reflects her low-carb diet and good insulin sensitivity. However, these protective factors do not offset the magnitude of the LDL and ApoB elevation. Her ApoB to ApoA1 ratio is 0.93, which places her in the higher risk category above 0.8, confirming that the balance between harmful and protective particles is unfavourable despite the excellent HDL.\n\nTurning to what is working well, and there is a great deal. Her glucose metabolism is in excellent shape. Her fasting glucose is 5.2, her HbA1c, which reflects average blood sugar over the previous three months, is 41 mmol/mol, just under the 42 threshold, and her HOMA-IR, a calculated measure of insulin resistance, is 0.74, which places her firmly in the insulin-sensitive category. Her fasting insulin at 3.2 is low but within range, and in the context of a low-carb diet with normal glucose, this reflects low insulin demand rather than any pancreatic problem. Her C-Peptide, which the lab flagged as low at 0.768 micrograms per litre (converting to approximately 254 pmol/L), follows the same pattern. C-Peptide is released alongside insulin and mirrors its production. On a low-carb diet with excellent glucose control, low C-Peptide simply means the pancreas does not need to work hard. This is not a concern.\n\nHer liver is in excellent health. ALT at 13 is well below the optimal threshold of 25 for women. AST at 22, GGT at 19, bilirubin at 11, and albumin at 38 are all within their respective ranges. Her FIB-4 score, a formula that estimates liver fibrosis risk using age, platelets, ALT and AST, comes out at 1.52, which technically sits above the general threshold of 1.45. However, the lab note itself states that for patients over 65, a score below 2.0 is the more appropriate cut-off, and at 1.52 with every individual liver marker looking healthy, this score is being driven entirely by the age component of the calculation rather than by any sign of liver disease. Her amylase and lipase, which assess pancreatic function, are both comfortably within range.\n\nHer kidney function is solid. Creatinine-based eGFR is 84 and Cystatin C-based eGFR is 79, both above 60 and appropriate for a 65-year-old woman. Cystatin C itself at 1.04 is just under the 1.1 upper limit. Urea, sodium, chloride, bicarbonate and uric acid are all within range. Her calcium and corrected calcium are healthy, and her PTH (parathyroid hormone, which regulates calcium and bone turnover) at 1.4 is appropriately low, confirming that calcium regulation is working as it should.\n\nHer inflammation markers are reassuring. High-sensitivity CRP, which measures systemic inflammation in the blood vessels, is 0.5, below the optimal threshold of 1.0. Her ESR (erythrocyte sedimentation rate, another inflammation marker) is 10, within the limit of 12. For a 65-year-old, these are genuinely good results and suggest that despite the elevated cholesterol, active arterial inflammation is currently low.\n\nHer full blood count is largely healthy. Haemoglobin at 134, red blood cells at 4.12, platelets at 261, and white cell count at 4.02 are all within range, though her white cells sit right at the lower boundary of 4.0. Her neutrophils at 2.32 are just above the lower limit of 2.0. At 65 with a lean build and moderate activity, this is most likely constitutional and not a concern, but it is worth noting for future reference. Her MCH (mean corpuscular haemoglobin, the average amount of haemoglobin packed into each red cell) at 32.6 is marginally above the upper limit of 32. This is a very small deviation and in isolation, with a normal MCV of 95.7 and normal MCHC of 340, it carries no clinical significance. It can be seen with mildly macrocytic red cells, which at this margin is a normal variant.\n\nHer iron studies show adequate stores. Ferritin at 63 sits within the optimal range of 40 to 150 for women. Serum iron and transferrin saturation are healthy. Her transferrin, the protein that carries iron in the blood, is 2.24, marginally below the lower limit of 2.5. Transferrin is a negative acute phase reactant, meaning it can fall during any inflammatory process, but her CRP is low, so that explanation is less likely here. A mildly low transferrin in isolation with adequate ferritin and normal saturation is not a clinical concern, but it should be noted for the GP and monitored on any future panel.\n\nHer thyroid function tells an important story that connects directly to her symptoms. Her TSH (thyroid stimulating hormone, the signal from the brain that tells the thyroid to produce hormones) is 3.89. While this falls within the laboratory range of 0.55 to 4.78, it sits above the optimal range of 1.0 to 2.5. Her FT4 (free thyroxine, the main hormone the thyroid produces) is 14.0, right at the bottom of the optimal band. Her FT3 (free triiodothyronine, the active form of thyroid hormone that cells actually use) is 4.2, which falls below the optimal range of 4.5 to 6.5. The pattern here is a brain sending a stronger-than-ideal signal to a thyroid that is producing a borderline amount of hormone, with conversion to the active form sitting below optimal. Both thyroid antibodies are negative, which means this is not autoimmune thyroid disease. However, the combination of above-optimal TSH, bottom-of-range FT4, and below-optimal FT3 could be contributing meaningfully to her fatigue, poor sleep, and low mood. Suboptimal thyroid function is well recognised as a driver of all three symptoms she reports. It may also be contributing to her cholesterol elevation, because thyroid hormone is directly involved in the liver's clearance of LDL from the bloodstream. When thyroid output is suboptimal, LDL clearance slows, and cholesterol rises. This does not explain an LDL of 8.35, which almost certainly has a genetic component, but it may be making it worse. This is worth discussing with her GP alongside the cholesterol findings.\n\nHer hormone profile confirms post-menopausal status, as expected at 65. FSH at 86.17 and LH at 24.54 are both in the post-menopausal range. Oestradiol is below 43, which is within the post-menopausal reference, and progesterone at 0.24 is appropriately low. Her testosterone at 0.3 is below the female reference range of 0.5 to 2.6, and her Free Androgen Index at 0.34 is also below range at 0.5 to 6.5. Her SHBG (sex hormone binding globulin, the protein that binds testosterone and reduces its availability) is 88.3, which is within range but towards the upper end, and this high SHBG is binding what little testosterone she produces, leaving very little free. Low testosterone in post-menopausal women is associated with reduced energy, lower mood, diminished motivation, difficulty building and maintaining muscle, and reduced libido. Given that she reports fatigue, low mood, and anxiety, and that she is training twice a week and wants to prevent disease, her low testosterone and very low free testosterone may be a meaningful contributor to how she is feeling. Her DHEA-S (dehydroepiandrosterone sulphate, an adrenal hormone that serves as a precursor to testosterone) is 0.3 micromoles per litre, which converts to approximately 110.6 micrograms per decilitre. This is at the very bottom of the reference range, consistent with normal adrenal ageing but leaving very little substrate for testosterone production. Her cortisol at 402 is within the morning reference range and does not suggest adrenal dysfunction.\n\nHer vitamin D at 112 is excellent, sitting comfortably within the optimal range of 75 to 120. This is a genuine positive and reflects either good supplementation or significant sun exposure. Her vitamin B12 at 420 is within the laboratory range but below the optimal threshold of 500. Given her low-carb, high-protein diet, which typically provides adequate B12 from animal sources, this may reflect absorption efficiency rather than dietary intake, and a small top-up would be worthwhile. Her folate at 12 is above the optimal threshold of 8 and in good shape. Her magnesium at 0.84 is within the laboratory range but just below the optimal band of 0.85 to 1.05. This is a very marginal miss, but magnesium is relevant to her sleep and mood complaints, and a small supplement could help.\n\nHer IgM (immunoglobulin M, the antibody class that provides the first line of immune defence against new infections) is 0.3, below the lower limit of 0.5. Isolated low IgM is relatively common and in most cases is a benign finding, particularly when IgG and IgA are both normal, which hers are. It does not typically cause clinical problems, but it should be noted on her record and mentioned to her GP for awareness. Her IgE at 5.1 is reassuringly low, suggesting no active allergic process. Her coeliac screen is negative.\n\nHer Total Antioxidant Activity at 1.81 is marginally above the upper limit of 1.77. This is almost always driven by supplementation or a diet very rich in antioxidant foods, and in the context of a high-quality diet rated 9 out of 10, it is expected and not a concern. Her creatine kinase at 87 is healthy. Her tumour markers, CA125 at 4.5, CA15-3 at 11, CA19-9 below 1.2, and CEA at 1.16, are all well within their respective limits, which is reassuring.\n\nIn summary, the three priorities from this report are: first, the urine culture suggesting a urinary tract infection that needs GP assessment and likely treatment; second, the markedly elevated cholesterol with an LDL of 8.35, ApoB of 1.77, and Lp(a) of 103.85, which together create a cardiovascular risk profile that her GP must be made aware of and which may warrant investigation for familial hypercholesterolaemia and consideration of statin therapy; and third, the suboptimal thyroid function and low testosterone, both of which are likely contributing to her fatigue, poor sleep, and low mood, and both of which are treatable if her GP agrees they warrant intervention.","links":"Yolande's report highlights several areas where specific action can make a meaningful difference to how she feels day to day and to her long-term health.\n\nThe most urgent step is a GP appointment to address three things. First, the urine culture results should be discussed. Heavy growth of E. coli and Enterococcus faecalis with elevated urinary white cells is consistent with a urinary tract infection, and the GP may wish to start antibiotic treatment or repeat the sample in a boric acid container for confirmation. Second, the cholesterol results need a dedicated conversation. The numbers to bring are: total cholesterol 11.2, LDL 8.35, ApoB 1.77, Lp(a) 103.85, HDL 2.6, and triglycerides 0.89. The LDL and ApoB are high enough to warrant investigation for familial hypercholesterolaemia, and the GP should consider referral to a lipid clinic. Lp(a) at 103.85 is genetically fixed and should be recorded permanently in her medical notes. First-degree relatives, her children and siblings, should be encouraged to have their own Lp(a) tested, as the trait is inherited and early detection allows earlier risk management. Third, her thyroid function should be reviewed: TSH 3.89, FT4 14.0, FT3 4.2, both antibodies negative. While technically within the laboratory range, the pattern of above-optimal TSH with bottom-of-range FT4 and below-optimal FT3 may be contributing to her fatigue, poor sleep, and mood symptoms, and the GP may wish to repeat thyroid function in 6 to 8 weeks or trial a low-dose thyroxine replacement if symptoms are significantly affecting quality of life. The suboptimal thyroid output may also be worsening LDL clearance. Her low testosterone at 0.3 and very low Free Androgen Index at 0.34 should also be raised with the GP, as testosterone replacement in post-menopausal women is increasingly recognised as beneficial for energy, mood, and musculoskeletal health when levels are genuinely below range.\n\nFor nutrition, Yolande's diet quality at 9 out of 10 is excellent, and her low-carb approach is clearly delivering outstanding glucose and insulin metrics. Her diet volume at 6 out of 10 is moderate. At 67 kilograms, 170 centimetres, 65 years old, and lightly active with two training sessions and good step count, her estimated maintenance calories sit around 1,750 to 1,850 per day. Given her healthy BMI of 23.2, she does not need to lose weight, and eating at or just below maintenance is appropriate. Her protein target should be 87 to 107 grams per day, calculated at 1.3 to 1.6 grams per kilogram of body weight, to support her resistance training, preserve lean mass, and support bone health at 65. With only one resistance session per week, she would benefit significantly from adding a second session. Resistance training is the single most effective intervention for maintaining bone density, muscle mass, metabolic rate, and functional independence as we age, and at her current training frequency she is not getting the full benefit.\n\nFor the cholesterol specifically, dietary changes alone are unlikely to bring an LDL of 8.35 into range, but they can contribute. Increasing soluble fibre intake through oats, lentils, beans, flaxseed, and psyllium husk can reduce LDL by 5 to 10 percent. Including oily fish such as salmon, mackerel, or sardines two to three times per week provides EPA and DHA omega-3 fatty acids, which lower triglycerides (already excellent) and have anti-inflammatory benefits that are particularly valuable alongside elevated Lp(a). Reducing saturated fat from butter, cheese, and fatty cuts of meat in favour of olive oil, avocado, and nuts may also help, though on a low-carb diet she should ensure she maintains adequate calorie intake from healthy fat sources. Plant stanols and sterols, available as fortified foods or supplements at 2 grams per day, can provide an additional 7 to 10 percent LDL reduction.\n\nFor sleep, which she identifies as a significant issue, a consistent fixed wake time regardless of how the night went is the single most powerful sleep intervention. Getting outside within an hour of waking for at least 10 to 15 minutes of natural daylight helps reset the circadian clock. Caffeine should be cut off by midday at the latest, as its half-life means afternoon coffee is still active at bedtime. The bedroom should be cool, around 18 degrees Celsius, and dark. Magnesium glycinate taken 30 to 60 minutes before bed can support both sleep onset and sleep quality. If her thyroid function is optimised, sleep may improve as a consequence.\n\nFor mood and anxiety, the combination of suboptimal thyroid function, low testosterone, and below-optimal B12 could all be contributing. Addressing the thyroid and testosterone through her GP, supplementing B12 and magnesium, maintaining her excellent diet, and potentially increasing training frequency are all likely to help. Regular resistance training has strong evidence for improving mood, reducing anxiety, and improving sleep quality, so adding that second resistance session serves multiple goals simultaneously.\n\nRetesting should include a repeat thyroid panel (TSH, FT4, FT3) in 8 to 12 weeks, ideally before any treatment decision. A repeat lipid panel including ApoB should be done 3 months after any dietary changes or medication initiation. The urine should be repeated in a boric acid container if the GP does not treat empirically. IgM should be rechecked in 6 months to confirm it is stable. Lp(a) does not need repeating as it is genetically fixed.","flags":"URGENT: Urine culture grew heavy growth of Escherichia coli and Enterococcus faecalis with urinary WBCs at 30 (significant above 10). Plain bottle received (no boric acid), so overgrowth is possible, but the combination of pyuria and heavy dual-organism growth is consistent with UTI. Both organisms show broad antibiotic sensitivity. GP assessment recommended for treatment or confirmatory repeat in boric acid container.\n\nLIPIDS (CRITICAL): Total cholesterol 11.2 (desirable below 5.18). LDL 8.35 (range 0.5 to 3.0). ApoB 1.77 (desirable below 0.9). Non-HDL cholesterol 8.6 (desirable below 4.0). ApoB/A1 ratio 0.93 (higher risk above 0.8). Lp(a) 103.85 nmol/L (desirable below 32, moderate risk 90 to 200). The magnitude of LDL elevation in a lean woman with an excellent diet raises the possibility of familial hypercholesterolaemia. GP referral to lipid clinic recommended. Lp(a) is genetically determined and should be recorded permanently. First-degree relatives should be tested. Protective factors: HDL 2.6 (excellent), triglycerides 0.89 (optimal), ApoA1 1.9 (excellent).\n\nTHYROID (SUBOPTIMAL): TSH 3.89 (range 0.55 to 4.78, optimal 1.0 to 2.5). FT4 14.0 (range 11.5 to 22.7, optimal 14 to 20, at floor of optimal). FT3 4.2 (range 2.6 to 7.1, optimal 4.5 to 6.5, below optimal). Both TPO and thyroglobulin antibodies negative. Pattern suggests suboptimal thyroid output without autoimmune aetiology. May be contributing to fatigue, poor sleep, low mood, and impaired LDL clearance. Recommend repeat in 8 to 12 weeks and clinical correlation with symptoms.\n\nHORMONES: Testosterone 0.3 nmol/L (range 0.5 to 2.6, below range). Free Androgen Index 0.34 (range 0.5 to 6.5, below range). Free testosterone calculated at 0.003 nmol/L. SHBG 88.3 (within range but upper end, reducing free testosterone availability). DHEA-S 0.3 umol/L (approximately 110.6 ug/dL, bottom of range). Post-menopausal status confirmed by FSH 86.17 and LH 24.54. Low testosterone may be contributing to fatigue, low mood, and difficulty with body composition.\n\nIMMUNOLOGY: IgM 0.3 g/L (range 0.5 to 3.0, below range). IgG 10.7 and IgA 1.4 both normal. Isolated low IgM is usually benign but should be noted on medical record and rechecked in 6 months.\n\nIRON: Transferrin 2.24 g/L (range 2.5 to 3.8, marginally below). Ferritin 63 (adequate), serum iron 14.5 (normal), transferrin saturation 25.78% (normal). CRP 0.5 makes acute phase suppression unlikely. Monitor on future panels.\n\nC-PEPTIDE: 0.768 ug/L (approximately 254 pmol/L, below lab range of 1.1 to 4.4 ug/L). In context of normal glucose 5.2, HbA1c 41, HOMA-IR 0.74, and low-carb diet, this reflects low insulin demand rather than pancreatic insufficiency. No action required.\n\nMINOR: MCH 32.6 (range 27 to 32, marginal). FIB-4 1.52 (above 1.45 general threshold but below 2.0 age-adjusted threshold for over-65s, with all liver markers normal). TAA 1.81 (marginally above 1.77, likely dietary). None require action.\n\nReassuring negatives: CRP 0.5 (excellent). HOMA-IR 0.74 (insulin sensitive). Glucose and HbA1c normal. Liver enzymes all clean. Kidney function appropriate for age. Thyroid antibodies negative. Coeliac screen negative. All tumour markers normal (CA125, CA15-3, CA19-9, CEA). Vitamin D 112 (optimal). Urinary RBCs below 1 (no haematuria). No urinary protein, glucose, or casts.","recommendations":"1. Book a GP appointment within the next one to two weeks to discuss three findings: the urine culture results suggesting possible UTI, the markedly elevated cholesterol profile with possible familial hypercholesterolaemia, and the suboptimal thyroid and low testosterone.\n\n2. Record Lp(a) at 103.85 nmol/L permanently in medical notes. Encourage first-degree relatives to have their Lp(a) tested.\n\n3. Increase soluble fibre intake: aim for a daily portion of oats, ground flaxseed, or psyllium husk, plus regular inclusion of lentils and beans. Consider plant stanol or sterol supplements or fortified foods at 2 grams per day.\n\n4. Eat oily fish two to three times per week for EPA and DHA omega-3 fatty acids.\n\n5. Add a second resistance training session per week. This is the single most effective intervention for bone density, muscle mass, mood, sleep quality, and metabolic health at 65.\n\n6. Begin magnesium glycinate 300 to 400 milligrams taken 30 to 60 minutes before bed to support sleep and mood.\n\n7. Begin sublingual methylcobalamin B12 at 1,000 micrograms daily to move B12 from 420 into the optimal range above 500.\n\n8. Maintain current vitamin D intake, as levels at 112 are optimal.\n\n9. Establish a fixed wake time every day regardless of sleep quality. Get outside for 10 to 15 minutes of natural daylight within an hour of waking. Cut caffeine by midday.\n\n10. Maintain protein intake at 87 to 107 grams per day to support muscle preservation and bone health.\n\n11. Retest thyroid function (TSH, FT4, FT3) in 8 to 12 weeks. Retest lipid panel including ApoB 3 months after any intervention. Recheck IgM in 6 months. Repeat urine culture in boric acid container if GP does not treat empirically.","supplementation":"Based on Yolande's results, the following supplements are recommended.\n\nMagnesium glycinate at 300 to 400 milligrams, taken 30 to 60 minutes before bed. Her magnesium at 0.84 sits just below the optimal band of 0.85 to 1.05, and magnesium glycinate is the preferred form for sleep support because glycine itself has calming properties. Given her reports of poor sleep and low mood, this is likely the supplement she will notice most.\n\nSublingual methylcobalamin (vitamin B12) at 1,000 micrograms daily. Her B12 at 420 is within the laboratory range but below the optimal threshold of 500. Sublingual delivery bypasses any absorption issues in the gut and is more reliable than oral tablets. B12 supports energy production, nervous system function, and mood regulation, all of which are relevant to her symptoms.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with a meal containing fat. This supports cardiovascular health through anti-inflammatory effects that are especially valuable alongside her elevated Lp(a), and omega-3 fatty acids also have evidence for mood support. She should look for a high-strength product where the EPA and DHA content per capsule is clearly stated, as many standard fish oil capsules contain only 300 milligrams of combined EPA and DHA per 1,000 milligram capsule.\n\nPlant stanols or sterols at 2 grams per day, either through fortified foods such as Benecol or Flora ProActiv, or as a standalone supplement. These work by blocking cholesterol absorption in the gut and can reduce LDL by 7 to 10 percent. They should be taken with a main meal.\n\nVitamin K2 in the MK-7 form at 100 to 200 micrograms daily. She is already maintaining excellent vitamin D levels, and K2 works alongside vitamin D to ensure calcium is directed into bone rather than depositing in arterial walls. At 65, this is an important consideration for both bone density and cardiovascular health.\n\nShe should continue whatever vitamin D supplementation she is currently taking, as her level of 112 is in the optimal sweet spot and should be maintained.\n\nThe most important changes from this report are not supplements. They are the GP conversation about her cholesterol, thyroid function, low testosterone, and the urine findings, adding a second resistance training session each week, and optimising her sleep routine. These will do more for her energy, mood, and long-term health than any supplement can.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1161","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver health. Yolande's ALT at 13 is well below the laboratory upper limit of 56 and comfortably below the optimal ceiling of 25 for women, indicating that her liver cells are healthy and under no metabolic strain.","low_causes":"","high_causes":"Liver disease, hepatitis, fatty liver, alcohol excess, medications, obesity, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It is released into the bloodstream when these tissues are damaged. Unlike ALT, which is fairly specific to the liver, AST can rise from muscle damage or intense exercise as well. Yolande's AST at 22 is comfortably within range and within the optimal band, confirming healthy liver and muscle tissue.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart disease, muscle damage, intense exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.25","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3088","units":"IU/l","description":"Gamma GT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol intake, bile duct obstruction, and metabolic stress on the liver. It is often the first enzyme to rise when the liver is under strain. Yolande's GGT at 19 is well within range and below the optimal ceiling of 25, indicating that her liver is handling its metabolic workload comfortably.","low_causes":"","high_causes":"Alcohol excess, bile duct obstruction, liver disease, metabolic syndrome, certain medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and intestines. In post-menopausal women, ALP can reflect bone turnover as well as liver health. Yolande's ALP at 49 is within the laboratory range but sits just below the optimal band, which is a normal finding and carries no clinical concern. In the context of clean liver enzymes, it simply reflects low-normal bone and liver activity.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone disease, liver disease, bile duct obstruction, vitamin D deficiency, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated levels can indicate liver dysfunction, bile duct problems, or excessive red cell breakdown. Yolande's bilirubin at 11 is comfortably within both the laboratory and optimal ranges, confirming healthy liver processing.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects liver synthetic function, immune status, and nutritional state. Yolande's total protein at 68 is within both the laboratory and optimal ranges, indicating balanced protein production.","low_causes":"Liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. Yolande's albumin at 38 is within the laboratory range but sits just below the optimal band of 40 to 48. At 65, albumin naturally trends lower, and at 38 it is not a clinical concern, but maintaining good protein intake helps support albumin levels.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin is a group of proteins that includes immunoglobulins (antibodies) and transport proteins. The level reflects immune system activity and liver function. Yolande's globulin at 30 is within both the laboratory and optimal ranges, suggesting balanced immune function.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3881","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio is calculated by dividing albumin by globulin. It provides a snapshot of the balance between the liver's synthetic output (albumin) and the immune system's protein production (globulin). Yolande's ratio of 1.27 is within the laboratory range but marginally below the optimal band, driven by her albumin sitting at 38 rather than by any globulin excess.","low_causes":"Liver disease, autoimmune conditions, chronic inflammation","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5241","lower_normal":"0","upper_normal":"2","lower_optimal":"0","upper_optimal":"1.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3625","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis (scarring) using age, platelet count, ALT, and AST. The general threshold is 1.45, but for patients over 65, the more appropriate cut-off is 2.0 as age naturally inflates the score. Yolande's FIB-4 at 1.52 sits above the general threshold but well below the age-adjusted threshold of 2.0. With every individual liver marker in excellent shape, this score is being driven by the age component of the formula rather than by any sign of liver disease.","low_causes":"","high_causes":"Liver fibrosis, age (over 65), low ALT, low platelets","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5189","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starch into sugar. Elevated levels can indicate pancreatic inflammation (pancreatitis) or other abdominal conditions. Yolande's amylase at 98 is comfortably within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5922","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down fats. It is more specific to the pancreas than amylase and is the preferred marker for pancreatitis. Yolande's lipase at 45 is within both the laboratory and optimal ranges, confirming healthy pancreatic function.","low_causes":"","high_causes":"Pancreatitis, pancreatic cancer, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"11.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL (harmful), HDL (protective), and VLDL. While total cholesterol alone is a crude measure, values above 5.18 are considered elevated. Yolande's total cholesterol at 11.2 is markedly elevated, more than double the desirable upper limit, and is driven predominantly by her very high LDL fraction. The significance of this result is best understood in the context of her LDL, ApoB, and Lp(a) results discussed below.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Familial hypercholesterolaemia, hypothyroidism, diet high in saturated fat, kidney disease, certain medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"8.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL cholesterol, often called 'bad cholesterol', is the fraction that deposits in artery walls and drives atherosclerosis (the buildup of fatty plaques that narrow and stiffen arteries). Yolande's LDL at 8.35 is nearly three times the upper limit of 3.0. A value this high in a lean woman with an excellent diet strongly suggests a genetic component, potentially familial hypercholesterolaemia, and warrants investigation by her GP or a lipid specialist.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Familial hypercholesterolaemia, diet high in saturated fat, hypothyroidism, kidney disease, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8387","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL cholesterol, often called 'good cholesterol', is the fraction that removes excess cholesterol from the artery walls and transports it back to the liver for disposal. Higher levels are protective against heart disease. Yolande's HDL at 2.6 is excellent, well above the desirable threshold of 1.55 and within the optimal range for women. This is one of the strongest protective factors in her lipid profile.","low_causes":"Sedentary lifestyle, obesity, smoking, high-carb diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetics, high-fat diet","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat stored in the body and transported in the blood. Elevated levels are associated with insulin resistance, metabolic syndrome, and cardiovascular risk. Fasting levels below 1.7 are desirable and below 1.0 are optimal. Yolande's triglycerides at 0.89 are excellent and reflect her low-carb diet and strong insulin sensitivity.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High-carb diet, obesity, insulin resistance, alcohol excess, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein cholesterol, is a triglyceride-rich particle produced by the liver. It is a precursor to LDL and contributes to atherosclerosis. Yolande's VLDL at 0.4 is well within range, consistent with her excellent triglyceride level and good metabolic health.","low_causes":"","high_causes":"High-carb diet, insulin resistance, obesity, alcohol excess","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4789","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL cholesterol. It provides a quick assessment of the balance between harmful and protective cholesterol. A ratio below 4.5 is desirable. Yolande's ratio at 4.31 is within the desirable range, kept in check by her exceptionally high HDL despite the very elevated total cholesterol. However, this ratio masks the absolute magnitude of her LDL and ApoB, which are the more important metrics.","low_causes":"","high_causes":"Elevated LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"23.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3868","lower_normal":"20","upper_normal":"60","lower_optimal":"28","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6667","units":"%","description":"HDL as a percentage of total cholesterol reflects how much of the circulating cholesterol is protective. A value above 20% is the minimum target. Yolande's 23.21% is above the minimum but below optimal, which is driven by the very high total cholesterol denominator rather than by any deficiency in HDL itself. Her absolute HDL at 2.6 is excellent.","low_causes":"High LDL, metabolic syndrome","high_causes":"Exercise, genetics, healthy diet","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"8.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol fractions in one number. It includes LDL, VLDL, and remnant particles. A value below 4.0 is desirable. Yolande's non-HDL at 8.6 is more than double the upper limit, driven by her markedly elevated LDL.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Familial hypercholesterolaemia, diet, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is a protein that sits on every LDL, VLDL, and Lp(a) particle. Because there is exactly one ApoB molecule per particle, it gives the most accurate count of the total number of atherogenic particles in the blood, making it a better predictor of cardiovascular risk than LDL cholesterol alone. Yolande's ApoB at 1.77 is classified as 'very high' (above 1.4) and confirms the severity of her lipid elevation. This is the single best number for her GP to focus on when assessing her cardiovascular risk.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Familial hypercholesterolaemia, diet, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6786","lower_normal":"1.4","upper_normal":"2.8","lower_optimal":"1.6","upper_optimal":"2.8","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles. It is responsible for HDL's ability to remove cholesterol from artery walls. Higher levels indicate more active reverse cholesterol transport. Yolande's ApoA1 at 1.9 is strong, well above the 1.4 minimum, reflecting her excellent HDL levels.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome","high_causes":"Exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.775","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is the single best summary metric for the balance between atherogenic (artery-damaging) and protective lipoproteins. A ratio below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Yolande's ratio at 0.93 falls in the higher risk category, confirming that despite her excellent HDL and ApoA1, the sheer volume of ApoB-carrying particles overwhelms the protective side.","low_causes":"","high_causes":"Elevated LDL and ApoB, familial hypercholesterolaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"103.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that deposits cholesterol in artery walls, promotes blood clotting, and drives localised inflammation. Unlike LDL, Lp(a) cannot be meaningfully changed by diet, exercise, or currently available supplements. It is tested once and recorded permanently. Yolande's Lp(a) at 103.85 places her in the moderate risk category (90 to 200). This is an inherited trait, and her first-degree relatives (children, siblings) should be tested. The combination of elevated Lp(a) alongside very high LDL and ApoB significantly increases cumulative cardiovascular risk.","low_causes":"","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1133","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride-to-HDL ratio is a calculated marker that reflects insulin resistance and metabolic health. A lower ratio indicates better insulin sensitivity and a more favourable metabolic state. Yolande's ratio at 0.34 is excellent, well within the optimal range, and is one of the strongest indicators of her metabolic health.","low_causes":"","high_causes":"Insulin resistance, high-carb diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried on triglyceride-rich remnant particles (VLDL and intermediate-density lipoproteins). These remnants are increasingly recognised as independently atherogenic. Yolande's remnant cholesterol at 0.25 is well within the optimal range, reflecting her excellent triglyceride metabolism.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It is the primary screening marker for diabetes and pre-diabetes. Yolande's glucose at 5.2 is within both the laboratory and optimal ranges, indicating healthy blood sugar regulation.","low_causes":"Fasting, excessive insulin, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percentage","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4615","lower_normal":"0","upper_normal":"6.4","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4375","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has been glycated, or coated with sugar, over the previous two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. Below 6.0% is normal, 6.0 to 6.4% is pre-diabetes, and above 6.5% is diabetes. Yolande's HbA1c at 6.0% sits right at the boundary between normal and pre-diabetes. In the context of a normal fasting glucose and excellent HOMA-IR, this is not alarming, but it is worth monitoring.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Diabetes, pre-diabetes, high sugar intake, reduced red cell turnover","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the international standard unit for glycated haemoglobin. Below 42 is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Yolande's HbA1c at 41 sits just below the 42 threshold, which is within the normal range. However, it is above the optimal ceiling of 36, suggesting that average blood sugar levels over the past three months have been slightly higher than ideal. On a low-carb diet with excellent insulin sensitivity, this may simply reflect her age, as HbA1c naturally trends upward with age due to slower red blood cell turnover.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Diabetes, pre-diabetes, high sugar intake, reduced red cell turnover","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3393","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3244","upper_optimal_position":"0.4048","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is releasing to maintain blood sugar during a fasted state. Lower levels indicate greater insulin sensitivity, meaning the body needs less insulin to do its job. Yolande's insulin at 3.2 is low but within both the laboratory and optimal ranges, reflecting excellent insulin sensitivity consistent with her low-carb diet.","low_causes":"Low-carb diet, high insulin sensitivity, type 1 diabetes (with high glucose)","high_causes":"Insulin resistance, metabolic syndrome, pre-diabetes, high-carb diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.768","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2327","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It provides an accurate measure of how much insulin the pancreas is actually producing, as it is not cleared by the liver like insulin is. Yolande's C-Peptide at 0.768 (approximately 254 pmol/L) is below the laboratory range of 1.1 to 4.4. However, in the context of a normal fasting glucose, normal HbA1c, and excellent HOMA-IR, this low value simply reflects that her pancreas does not need to work hard on a low-carb diet. The lab note highlights that delayed sample separation can reduce C-Peptide by up to 56%, which may also be contributing. This is not a clinical concern.","low_causes":"Low-carb diet, fasting, high insulin sensitivity, type 1 diabetes (with high glucose)","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3700","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin. It estimates how resistant the body's cells are to insulin. Below 1.0 indicates optimal insulin sensitivity. Yolande's HOMA-IR at 0.74 is excellent, confirming that her cells respond readily to insulin and that her metabolic health in this regard is very strong.","low_causes":"High insulin sensitivity, low-carb diet, very lean body composition","high_causes":"Insulin resistance, obesity, metabolic syndrome, high-carb diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"37.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2097","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates the functional capacity of the pancreatic beta cells that produce insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Yolande's HOMA-B at 37.65 is below the reference range of 80 to 200. However, the formula underestimates beta-cell function in people who are very insulin-sensitive and eating a low-carb diet, because the pancreas is simply not being asked to produce much insulin. With her glucose at 5.2 and HbA1c at 41, the pancreas is clearly meeting demand. This is not a concern.","low_causes":"Low-carb diet, high insulin sensitivity, beta-cell dysfunction (only with elevated glucose)","high_causes":"Insulin resistance (compensatory overproduction), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.05","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is an inflammation marker produced by the liver in response to inflammation anywhere in the body. In cardiovascular medicine, it is used to assess the level of low-grade inflammation in the blood vessels that contributes to atherosclerosis. A level below 1.0 is considered optimal and associated with lower cardiovascular risk. Yolande's hs-CRP at 0.5 is excellent, indicating minimal systemic inflammation. This is a genuinely reassuring result, particularly alongside her elevated cholesterol, as it suggests that active arterial inflammation is currently low.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, cardiovascular disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling suggests more inflammation, as inflammatory proteins cause red cells to clump together and fall faster. Yolande's ESR at 10 is within both the laboratory limit of 12 and at the boundary of the optimal ceiling. For a 65-year-old woman, this is a healthy result.","low_causes":"Polycythaemia, sickle cell disease","high_causes":"Infection, inflammation, autoimmune disease, anaemia, cancer","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/l","description":"Sodium is the main electrolyte responsible for fluid balance and nerve function. It is tightly regulated by the kidneys. Yolande's sodium at 144 is within both the laboratory and optimal ranges, confirming healthy fluid and electrolyte balance.","low_causes":"Excess water intake, kidney disease, heart failure, certain medications","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4259","upper_optimal_position":"0.5741","units":"mmol/l","description":"Potassium is an essential mineral for nerve and muscle function, including the heart. It works alongside sodium to maintain fluid balance and blood pressure. Yolande's potassium at 4.0 is within the laboratory range and sits right at the lower edge of the optimal band. The lab notes that delayed or stored samples can affect potassium results.","low_causes":"Diuretics, vomiting, diarrhoea, excess sweating","high_causes":"Kidney disease, ACE inhibitors, potassium supplements, haemolysis in sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works with sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Yolande's chloride at 99 is within both the laboratory and optimal ranges.","low_causes":"Vomiting, metabolic alkalosis, certain medications","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5152","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a buffer that helps regulate blood pH, keeping it within the narrow range the body requires. It is primarily regulated by the kidneys. Yolande's bicarbonate at 26 is within both the laboratory and optimal ranges, confirming healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. About 99% of the body's calcium is in bones and teeth, with the remaining 1% in the blood, tightly regulated by PTH and vitamin D. Yolande's calcium at 2.46 is within both the laboratory and optimal ranges.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, since about half of blood calcium is bound to albumin. When albumin is low, total calcium can appear falsely low. The corrected value gives a more accurate picture. Yolande's corrected calcium at 2.56 is within the laboratory range but marginally above the optimal ceiling of 2.55. This is a negligible difference and not a clinical concern, especially with a normal PTH.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5718","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3471","upper_optimal_position":"0.6161","units":"mmol/l","description":"Phosphate is a mineral that works alongside calcium to build and maintain bones and teeth. It also plays a key role in energy production in every cell. Yolande's phosphate at 1.4 is within both the laboratory and optimal ranges, confirming healthy mineral balance.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, certain medications","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5115","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5149","upper_optimal_position":"0.6218","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar regulation, and sleep quality. It is one of the most commonly deficient minerals because modern diets often fall short. Yolande's magnesium at 0.84 is within the laboratory range but just below the optimal band of 0.85 to 1.05. Given her reports of poor sleep and low mood, both of which magnesium supports, supplementation is recommended.","low_causes":"Poor dietary intake, alcohol, diuretics, stress, intense exercise","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"345","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5262","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3047","upper_optimal_position":"0.4952","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced by the body. The kidneys normally filter uric acid out. Elevated levels can lead to gout and are associated with cardiovascular risk. Yolande's uric acid at 345 is within the laboratory range but above the female optimal ceiling of 320. This is a mild elevation and not a clinical concern in isolation, but it is worth monitoring, particularly in the context of her cardiovascular risk profile.","low_causes":"Low purine diet, kidney disorders causing excess excretion","high_causes":"High purine diet (red meat, shellfish, beer), kidney dysfunction, dehydration, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7917","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is calculated as (Sodium + Potassium) minus (Chloride + Bicarbonate). It estimates the unmeasured anions in the blood and helps assess acid-base balance. Yolande's anion gap calculates at 23, above the standard range of 8 to 16. However, this calculation can be affected by the albumin level, and at albumin 38 (slightly below optimal), the corrected anion gap would be closer to normal. Additionally, on a low-carb diet, mild ketone production can raise the anion gap without clinical significance. In the context of normal bicarbonate and no other metabolic disturbance, this is likely benign but is noted for completeness.","low_causes":"Low albumin, laboratory error","high_causes":"Ketoacidosis, lactic acidosis, renal failure, toxic ingestion, low-carb diet (mild ketosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product from protein metabolism, produced by the liver and excreted by the kidneys. It reflects both protein intake and kidney filtering capacity. Yolande's urea at 6.6 is within both the laboratory and optimal ranges, consistent with her high-protein diet and healthy kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4715","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism. It is filtered by the kidneys at a relatively constant rate, making it a useful indicator of kidney filtration. Yolande's creatinine at 66 is within both the laboratory and optimal ranges, indicating healthy kidney filtration.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"60", pper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not influenced by muscle mass, diet, or exercise, making it a more reliable kidney marker in many populations. Yolande's Cystatin C at 1.04 is within the laboratory limit of 1.1 but above the optimal ceiling of 0.9. At 65, this is consistent with normal age-related kidney function changes.","low_causes":"","high_causes":"Kidney disease, ageing, inflammation, thyroid dysfunction","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"134","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. It picks up oxygen in the lungs and delivers it to every tissue in the body. Yolande's haemoglobin at 134 is within both the laboratory and optimal ranges for women, confirming healthy oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, living at high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10/12/l","description":"The red blood cell count measures the total number of red cells per litre of blood. Red cells carry haemoglobin, which transports oxygen. Yolande's RBC at 4.12 is within both the laboratory and optimal ranges.","low_causes":"Anaemia, blood loss, B12 or folate deficiency, chronic disease","high_causes":"Dehydration, polycythaemia, smoking, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.395","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"l/l","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. It provides a quick measure of blood thickness and oxygen-carrying capacity. Yolande's haematocrit at 0.395 is within both the laboratory and optimal ranges.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"95.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5704","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fl","description":"MCV, or mean corpuscular volume, measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) can indicate B12 or folate deficiency, or alcohol excess. Yolande's MCV at 95.7 is within both the laboratory and optimal ranges, indicating normally sized red blood cells.
