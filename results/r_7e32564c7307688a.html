to range. This is not a clinical concern given her normal bicarbonate, normal kidney function, and normal lactate-generating conditions.","low_causes":"Low albumin (corrected gap normalises), laboratory variation","high_causes":"Ketoacidosis, lactic acidosis, renal failure, toxic ingestion, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5374","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4211","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction, and blood clotting. At 2.43 mmol/L, Tiffinni's calcium is within both the laboratory and optimal ranges, confirming healthy calcium regulation alongside her normal parathyroid hormone.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium level for the albumin concentration, giving a more accurate picture of the biologically active calcium. At 2.53 mmol/L, within the optimal range, this confirms healthy calcium status.","low_causes":"Vitamin D deficiency, hypoparathyroidis _causes":"High purine diet, kidney disease, gout, metabolic syndrome, insulin resistance, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered out by the kidneys. At 4.4 mmol/L, Tiffinni's urea is comfortably within range, confirming healthy kidney filtration and protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6423","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a steady rate. At 87 umol/L, Tiffinni's creatinine sits within the laboratory range but toward the upper end and above the optimal band of 55 to 80. This has contributed to her eGFR reading of 76, which is discussed below. The Cystatin C-based eGFR at 78 provides a more accurate assessment of her kidney function because it is not influenced by muscle mass or diet.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Reduced kidney function, high muscle mass, high protein diet, dehydration, intense exercise","paddi FR reading and indicates that Tiffinni's kidneys are filtering adequately but not at the full capacity expected at 32. While this is above the level of concern (60), it is worth establishing as a baseline and monitoring at future tests. No specific action is needed at this stage.","low_causes":"Reduced kidney function, inflammation (CRP can mildly elevate Cystatin C), thyroid dysfunction","high_causes":"Not typically a concern","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4682","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein filtered by the kidneys and used as a more reliable marker of kidney function than creatinine. At 1.03 mg/L, below the upper limit of 1.1 but above the optimal ceiling of 0.9, Tiffinni's Cystatin C is slightly elevated for her age. Systemic inflammation (which her CRP and ESR confirm) can mildly raise Cystatin C, so this may partly explain the reading. It is consistent with the eGFR readings of 76 and 78 and reinforces the recommendation to monitor kidney function over time.","low_causes":"Generally not clinically significant; can be seen with corticosteroid use","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"131","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","uni onal factors","high_causes":"Blood loss, haemolysis, recovery from anaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_absolute","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"23.464","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1564","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells being released by the bone marrow. At 23.5, this is significantly below the lower limit of 50, indicating that the bone marrow is producing red cells at roughly half the expected rate. Despite this, Tiffinni's haemoglobin at 131 is adequate, meaning the reduced production is not yet causing anaemia. However, it may be contributing to her fatigue because red cell replenishment is slower than it should be. The combined oral contraceptive pill can suppress erythropoiesis, and very low free testosterone (which normally stimulates red cell production) likely compounds this effect. Suboptimal B12 and folate, both of which are essential for red cell synthesis, may also be contributing. This should be noted by her GP and monitored at the next blood test.","low_causes":"Bone marrow suppression, hormonal suppression (OCP, low testosterone), B12/folate deficiency, iron deficiency, chronic kidney disease","high_causes":"Blood loss, haemolysis, recovery from anaemia, response to erythropoietin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"24.45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3917","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3856","upper_optimal_position":"0.4966","units":"%","description":"Transferrin saturation measures the percentage of transferrin (the iron transport protein) that is loaded with iron. At 24.45%, Tiffinni's saturation is within the laboratory range but just below the optimal lower bound of 25%. This suggests her iron transport is adequate but not at peak efficiency. Her ferritin at 52 confirms good iron stores, so this is not a storage issue but rather reflects the proportion of iron currently in transit.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5068","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"27","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3738","upper_optimal_position":"0.6168","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. It fluctuates throughout the day and with meals. At 20.2 umol/L, Tiffinni's iron is comfortably within the optimal range, reflecting adequate dietary and supplemental iron intake.","low_causes":"Iron deficiency, chronic disease, blood loss, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that carries iron through the blood from the gut and storage sites to the bone marrow for red cell production. At 3.29 g/L, Tiffinni's transferrin is within the optimal range, indicating healthy iron transport capacity.","low_causes":"Liver disease, malnutrition, inflammation, iron overload","high_causes":"Iron deficiency (body makes more to compensate), pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"72.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6259","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3957","upper_optimal_position":"0.5765","units":"umol/L","description":"TIBC measures the total capacity of transferrin to bind iron. It reflects how much room there is for additional iron binding. At 72.1 umol/L, Tiffinni's TIBC is within the laboratory range but above the optimal band, which is a common finding in women taking oral contraceptives, as oestrogen stimulates transferrin production. This is not a concern.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3830","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.4840","units":"ng/mL","description":"Ferritin is the body's iron storage protein and the single best marker of long-term iron status. At 52 ng/mL, Tiffinni's ferritin sits within the optimal range for women of 40 to 150. This is a genuinely positive result, confirming that her daily iron supplementation is working well and her iron stores are healthy. Many women of her age, particularly those menstruating, have ferritin levels well below this.","low_causes":"Iron deficiency, blood loss, menstruation, malabsorption, vegetarian/vegan diet","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"690","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7272","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal pattern, peaking in the morning and declining through the day. At 690 nmol/L, Tiffinni's cortisol is above the morning reference ceiling of 619.4. The most likely explanation is the combined oral contraceptive pill, which raises cortisol binding globulin (CBG), a protein that binds cortisol in the blood. This increases the total measured cortisol without necessarily meaning more cortisol is reaching her tissues. However, in the context of her fatigue, it is worth discussing with her GP, who could order a salivary cortisol test (which measures unbound cortisol) to determine whether the elevation is simply a binding protein effect or reflects genuine cortisol overproduction.","low_causes":"Adrenal insufficiency, pituitary insufficiency, long-term steroid use (adrenal suppression)","high_causes":"Oral contraceptive use (raised CBG), stress (physical or psychological), Cushing's syndrome, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4585","lower_normal":"0","upper_normal":"529.2","lower_optimal":"71.6","upper_optimal":"400","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0676","upper_optimal_position":"0.3779","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone in premenopausal women, responsible for reproductive function, bone density, cardiovascular protection, and skin and hair health. At 65 pmol/L, Tiffinni's oestradiol sits below the follicular phase lower limit of 71.6, which is expected on the combined oral contraceptive pill. The pill suppresses ovarian oestradiol production and replaces it with synthetic oestrogen (ethinylestradiol), so a low measured oestradiol in the blood is a normal and expected finding. The measured level does not reflect the total oestrogenic activity she is receiving.","low_causes":"Oral contraceptive use, menopause, perimenopause, hypothalamic amenorrhoea, low body fat","high_causes":"Ovulation, PCOS, obesity, oestrogen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2506","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is the hormone produced after ovulation that prepares the uterine lining for pregnancy. At 2.23 nmol/L, Tiffinni's result falls within the follicular phase range of 0 to 4.45. On the combined contraceptive pill, ovulation is suppressed, so progesterone remains low throughout the cycle. This is an expected finding and not a concern.","low_causes":"Anovulation, oral contraceptive use, follicular phase of menstrual cycle, luteal phase deficiency","high_causes":"Ovulation (luteal phase), pregnancy, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"12.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4627","lower_normal":"1.9","upper_normal":"16.9","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5044","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and triggers ovulation in women. At 12.65 mIU/mL, Tiffinni's LH is within the wide follicular/luteal reference range but is notably above the contraceptive reference range of 0.7 to 5.6. In PCOS, LH is often elevated relative to FSH, and this pattern (LH 12.65, FSH 8.2) may reflect her underlying PCOS hormonal signature persisting through the pill's effects. Elevated LH can contribute to androgen production and is a recognised feature of PCOS.","low_causes":"Oral contraceptive use, pituitary insufficiency, hypothalamic amenorrhoea, stress","high_causes":"PCOS, menopause, perimenopause, midcycle surge, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"8.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5468","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3","upper_optimal":"9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3766","upper_optimal_position":"0.6169","units":"mIU/mL","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and stimulates the ovaries to develop follicles containing eggs. At 8.2 mIU/mL, Tiffinni's FSH is within the follicular phase range. The LH to FSH ratio of approximately 1.5:1 is mildly elevated and is a recognised pattern in PCOS, though the combined pill typically suppresses this ratio.","low_causes":"Oral contraceptive use, pituitary insufficiency, PCOS (relatively suppressed), pregnancy","high_causes":"Menopause, perimenopause, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5079","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"nmol/L","description":"Testosterone is essential in women for energy, libido, muscle maintenance, bone density, and mood, though in much smaller amounts than in men. At 1.6 nmol/L, Tiffinni's total testosterone is within the optimal range. However, total testosterone does not tell the full story because the vast majority of it is bound to SHBG and is inactive. With her SHBG above 180, most of this 1.6 nmol/L is bound up and unavailable, which is why her free testosterone (the portion actually available to tissues) is critically low at 0.008.","low_causes":"Oral contraceptive use, adrenal insufficiency, hypopituitarism, ageing","high_causes":"PCOS, congenital adrenal hyperplasia, androgen-secreting tumour, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index (FAI)","group":"HORMONES","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3983","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index is calculated as (total testosterone x 100) / SHBG and provides an estimate of how much testosterone is biologically available. At 0.89, Tiffinni's FAI is within the laboratory range but below the optimal lower bound of 1.0. This very low value is driven by her markedly elevated SHBG (above 180), which is binding up the majority of her circulating testosterone. While low FAI may be beneficial for controlling androgen-driven PCOS symptoms like acne or hirsutism, it may be contributing to her fatigue, hair thinning, and difficulty with energy. This balance between PCOS management and quality of life is worth discussing with her prescribing clinician.","low_causes":"Oral contraceptive use (elevated SHBG), low testosterone production","high_causes":"PCOS, insulin resistance, obesity, androgen-secreting tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_sulphate","name":"DHEA Sulphate","group":"HORMONES","result":"1400.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4644","lower_normal":"95.81","upper_normal":"4053.5","lower_optimal":"200","upper_optimal":"3000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3596","upper_optimal_position":"0.5684","units":"ug/dL","description":"DHEA-S (dehydroepiandrosterone sulphate) is an androgen precursor produced by the adrenal glands. It serves as a reservoir for the body to make other hormones including testosterone and oestrogen. At 1,400 ug/dL (converted from 3.8 umol/L), Tiffinni's DHEA-S is within the optimal range, indicating healthy adrenal function and a good hormonal reserve.","low_causes":"Adrenal insufficiency, ageing, chronic stress, corticosteroid use","high_causes":"PCOS, adrenal tumour, congenital adrenal hyperplasia, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"358","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4018","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5893","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, primarily associated with breastfeeding but also involved in immune regulation and reproductive function. At 358 uIU/mL, Tiffinni's prolactin is within the non-pregnant reference range and optimal band. This rules out prolactinoma (a benign pituitary tumour) as a cause of her hormonal symptoms.","low_causes":"Dopamine agonist medication, pituitary insufficiency","high_causes":"Pregnancy, breastfeeding, prolactinoma, medications (antipsychotics, metoclopramide), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"180","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7575","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4361","upper_optimal_position":"0.6123","units":"nmol/L","description":"Sex hormone binding globulin is a protein produced by the liver that binds to sex hormones, particularly testosterone and oestradiol, making them inactive. At above 180 nmol/L (reported as greater than 180), Tiffinni's SHBG is markedly above the upper limit of 146. The combined oral contraceptive pill is the most common cause of very high SHBG in premenopausal women because the synthetic oestrogen component stimulates the liver to produce it in large amounts. When SHBG is this elevated, it binds up almost all circulating testosterone, which directly explains her very low free testosterone of 0.008 and her free androgen index of 0.89. This is the key finding driving several of her symptoms, including fatigue, hair thinning, and potentially contributing to low mood and difficulty with energy. Discussing the contraceptive formulation with her prescribing clinician is recommended.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism, androgen excess","high_causes":"Oral contraceptive use (oestrogen-containing), hyperthyroidism, ageing, liver disease, anorexia nervosa","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.008","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2771","lower_normal":"0.013","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3626","upper_optimal_position":"0.6124","units":"nmol/L","description":"Free testosterone is the small fraction of total testosterone that is not bound to SHBG or albumin and is therefore biologically active, able to enter cells and exert its effects. At 0.008 nmol/L, Tiffinni's free testosterone is below the lower limit of 0.013, meaning the amount of testosterone actually available to her tissues is very low. This is driven by her markedly elevated SHBG binding up almost all of her circulating testosterone. Free testosterone is important for energy, libido, muscle maintenance, hair health, bone density, and motivation. Its suppression is directly relevant to her symptoms of fatigue and hair thinning. While the pill is prescribed in PCOS partly to reduce androgen effects, the degree of suppression here may have overshot the therapeutic target. This warrants a conversation with her prescribing clinician.","low_causes":"Elevated SHBG (oral contraceptive use), low testosterone production, adrenal insufficiency","high_causes":"PCOS, insulin resistance, obesity, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4115","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3692","upper_optimal_position":"0.4812","units":"mIU/L","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland to tell the thyroid how hard to work. A higher TSH means the pituitary is pushing the thyroid harder, which can indicate underactivity. At 1.65 mIU/L, Tiffinni's TSH is within the optimal range of 1.0 to 2.5, indicating that her pituitary is satisfied with the thyroid's output and not having to push for more. This rules out thyroid dysfunction as a contributor to her fatigue.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary insufficiency","high_causes":"Hypothyroidism (primary), Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"14.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in target tissues. At 14.7 pmol/L, Tiffinni's free T4 sits within the optimal range of 14 to 20. While it is at the lower end of optimal, with a TSH of 1.65 the pituitary is not concerned about the level, which is reassuring. The oral contraceptive pill can raise thyroid binding globulin, which may slightly affect measured free T4 levels.","low_causes":"Hypothyroidism, pituitary insufficiency, sick euthyroid syndrome","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4370","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the most biologically active thyroid hormone, produced mainly by conversion of T4 in target tissues. At 4.0 pmol/L, Tiffinni's free T3 is within the laboratory range but below the optimal band of 4.5 to 6.5. T3 is the hormone that directly drives metabolic rate, energy production, and body temperature regulation. A slightly lower T3 conversion rate could be contributing to her fatigue, though her TSH at 1.65 suggests the overall thyroid axis is functioning normally. Low T3 conversion can be affected by inflammation (her CRP is 3.1), stress, and low calorie intake (her diet volume is 5/10). Improving these factors may support better T3 conversion.","low_causes":"Low calorie intake, inflammation, chronic illness (sick euthyroid), selenium deficiency, stress","high_causes":"Hyperthyroidism, T3 supplementation, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it attacks the thyroid gland, as seen in autoimmune thyroid disease (Hashimoto's thyroiditis). At less than 6.6, Tiffinni's TPO antibodies are well below the upper limit of 13.8, ruling out Hashimoto's as a cause of any thyroid symptoms.","low_causes":"Normal; absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to make thyroid hormones. Elevated levels are associated with autoimmune thyroid disease. At less than 1.3, Tiffinni's level is undetectable, which is the case for more than 80% of the population. This, together with the negative TPO antibodies, comprehensively rules out autoimmune thyroid disease.","low_causes":"Normal; absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (monitoring)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2625","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5208","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune function, mood regulation, and muscle function. At 63 nmol/L, Tiffinni's vitamin D is sufficient (above 50) but below the optimal range of 75 to 120. This level may be contributing to her joint pain and stiffness, which are particularly relevant given her Ehlers-Danlos syndrome, and to her fatigue. Increasing to the optimal range through supplementation with 3,000 IU of vitamin D3 daily, alongside vitamin K2, would be beneficial. Her Forceval multivitamin likely contains some vitamin D but typically only 400 IU, which is insufficient to raise levels into the optimal zone.","low_causes":"Limited sun exposure, dark skin pigmentation, low dietary intake, malabsorption, obesity","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"1.018","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3370","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5370","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood by controlling calcium release from bones, calcium absorption from the gut, and calcium retention by the kidneys. At 1.018 pmol/L, Tiffinni's PTH sits right at the lower limit of 0.98. With her corrected calcium at a healthy 2.53 and vitamin D at 63, this low-normal PTH is a normal physiological response: the parathyroid glands sense adequate calcium and do not need to produce much PTH. No concern arises from this finding.","low_causes":"Adequate calcium levels (appropriate suppression), hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, chronic kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"320","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4559","upper_optimal_position":"0.5862","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation, and DNA synthesis. At 320 pg/mL, Tiffinni's B12 is within the laboratory range (193 to 982) but below the optimal level of 500. Given that she receives B12 injections every three months, this suggests the injections are maintaining her above deficiency but the level is dipping between doses. Suboptimal B12 can contribute to fatigue, brain fog, and low red cell production (consistent with her low reticulocyte count). She should discuss with her GP whether more frequent injections, or supplementation with sublingual methylcobalamin 1,000 mcg daily between injections, would help maintain a more consistent level.","low_causes":"Pernicious anaemia, vegan/vegetarian diet, malabsorption, metformin use, gastric conditions","high_causes":"Supplementation, B12 injections, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, cell division, and red blood cell formation. It works closely with B12, and deficiency in either can impair th function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const optFrac=assessable.length?optimalCount/assessable.length:0;

  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);

  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
