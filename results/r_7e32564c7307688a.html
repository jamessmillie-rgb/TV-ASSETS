<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Tiffinni Edwards","dob":"19/02/1994","report_date":"2026-09-12","summary":"Tiffinni is a 32-year-old female presenting with a BMI of 24.4, following a standard mixed diet rated 6 out of 10 for quality with a volume of 5 out of 10. She does three cardio sessions per week with no resistance training and takes between 5,000 and 7,500 daily steps. She takes combined oral contraceptives, Forceval multivitamin, iron supplements daily, and receives B12 injections every three months. She uses painkillers frequently, such as ibuprofen or paracetamol. She has a diagnosis of Polycystic Ovary Syndrome (PCOS), Hypermobile Ehlers-Danlos Syndrome (hEDS) and ADHD. She reports low energy and fatigue, hair thinning and hair loss, and joint pain and stiffness. Her goals are to balance her hormones, improve her energy levels, and support long-term health and longevity.\n\nThe finding that needs attention first is her SHBG, which stands for sex hormone binding globulin, the protein in the blood that binds to sex hormones and controls how much of them is available for the body to use. Tiffinni's SHBG has been returned as greater than 180 nmol/L, which is above the upper limit of 146 and likely considerably so. The combined oral contraceptive pill is the most common cause of very high SHBG in women of this age, because the synthetic oestrogen it contains stimulates the liver to produce large amounts of this binding protein. When SHBG is this elevated, it binds up almost all of the circulating testosterone, and her calculated free testosterone, the portion actually available to tissues, has come back at just 0.008 nmol/L, well below the lower limit of 0.013. This is directly relevant to several of her symptoms. Free testosterone is important for energy, hair quality, muscle maintenance, motivation and mood. It also connects to her PCOS diagnosis, because PCOS is often associated with higher androgens, yet the pill has suppressed her free androgen index to just 0.89. While controlling androgen-driven PCOS symptoms is one of the reasons the pill is prescribed, the degree of suppression here may have swung the balance too far in the other direction, contributing to her fatigue and hair thinning. Her oestradiol at 65 pmol/L sits below the follicular phase lower limit of 71.6, which is consistent with the pill suppressing her own ovarian oestrogen production. Her LH at 12.65 is at the upper end of follicular range and notably above the contraceptive reference range of 0.7 to 5.6, and her FSH at 8.2 is within follicular range. This hormonal picture is worth discussing with her GP or prescribing clinician to consider whether the current pill formulation is the best fit, whether a different preparation might achieve PCOS symptom control without suppressing free testosterone to this degree, and whether her fatigue and hair thinning might improve with a change.\n\nHer cortisol has come back at 690 nmol/L, above the morning reference ceiling of 619.4. Cortisol is the body's primary stress hormone, released by the adrenal glands. The combined pill is well recognised to raise cortisol binding globulin (CBG), which increases total measured cortisol without necessarily increasing the amount of active cortisol reaching tissues. This is the most likely explanation and it is not in itself dangerous, but it is worth noting in the context of her fatigue, because chronically elevated cortisol signalling, even if partly protein-bound, can contribute to feeling wired but tired, to disrupted sleep quality, and to difficulty recovering from exercise. If her GP wanted to investigate further, a salivary cortisol or a late-night cortisol would distinguish between a pill-driven elevation and a genuinely overactive stress axis.\n\nHer inflammation markers tell a story worth paying attention to. Her hs-CRP, a measure of systemic inflammation, is 3.1 mg/L. While this is within the laboratory limit of 5, the optimal level is below 1.0 and ideally ycerides at 1.0 are clean, and her remnant cholesterol is low. This means the mildly elevated Lp(a) is sitting in an otherwise very favourable cardiovascular environment, which substantially reduces any associated risk. Because Lp(a) is inherited, it should be recorded as a permanent part of her medical record, and it would be worth her first-degree relatives, parents and siblings, having theirs checked as well.\n\nHer HOMA-IR, which estimates insulin resistance by combining fasting glucose and insulin, is 1.56 against an upper optimal limit of 1.5. This is a marginal elevation and sits well below the 1.9 threshold where early insulin resistance is formally considered. Her fasting glucose at 5.2 and HbA1c at 39 mmol/mol (5.7%) are both within normal limits, and her insulin at 6.74 is within range. Her C-peptide, which reflects how much insulin the pancreas is actually producing, is 1.24 ug/L (approximately 410 pmol/L), sitting just above the lower limit. In the context of PCOS, which is strongly associated with insulin resistance as a core driver of the condition, a HOMA-IR of 1.56 is actually a reassuring result. It suggests that while there is a very mild degree of insulin resistance present, she is not in a concerning metabolic state. However, because insulin resistance in PCOS tends to worsen over time if left unmanaged, keeping this marker in the optimal zone through diet and exercise is one of the most important things she can do for her long-term health.\n\nHer lipase, an enzyme produced by the pancreas to digest fats, is 66 U/L against an upper limit of 60. This is a mild elevation of about 10% above range and, in isolation with a normal amylase of 83 and no abdominal symptoms reported, is unlikely to represent pancreatic disease. Mild lipase elevations can be seen with frequent NSAID use, and the ibuprofen she takes regularly is a recognised contributor. It is worth mentioning to her GP for awareness, but it does not require urgent investigation in the absence of symptoms.\n\nTurning to the many positives in this report, and there are a lot of them. Her liver is in excellent health. Her ALT at 10 and GGT at 18 are both well within optimal ranges, her FIB-4 score is a reassuring 0.6, and her bilirubin and albumin are both healthy. This is particularly good given her frequent painkiller use, which does place a demand on the liver. Her lipid profile is genuinely outstanding for a 32-year-old. An HDL of 2.1 is exceptionally high and protective, her LDL at 1.48 is well within the optimal range, her triglycerides at 1.0 give a TG to HDL ratio of 0.48, which is excellent, and her ApoB at 0.54 is comfortably below the 0.8 optimal target. Her full blood count is largely healthy, with haemoglobin at 131, red cells, white cells, and platelets all within range, and a normal differential with no signs of infection or immune suppression. Her iron studies show a well-managed picture, with ferritin at 52, which is within the optimal range for women and reflects her daily iron supplementation doing its job, serum iron at 20.2, transferrin at 3.29, and a transferrin saturation of 24.45%. Her thyroid is functioning well, with TSH at 1.65, free T4 at 14.7, and free T3 at 4.0, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. Her kidney function markers including urea, electrolytes, and uric acid are all within range, with cystatin C at 1.03 giving an eGFR of 78, which is acceptable but worth monitoring over time. Her immunoglobulins are all within range, rheumatoid factor is negative, and coeliac screening is negative. Her creatine kinase at 72 is healthy. Her urinalysis is clean with no protein, glucose, or blood, and nitrites are negative.\n\nHer reticulocyte absolute count at 23.5 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count suggests the bone marrow is producing red cells at a slower rate than expected. Her haemoglobin at 131 is adequate and her ferritin is healthy, so this is not causing anaemia at present, but it may be contributing to her fatigue. The combined pill can suppress erythropoiesis to a degree, and low free testosterone, which stimulates red cell production, may also be playing a role. This is worth noting for her GP.\n\nHer B12 at 320 pg/mL is within range but below the optimal level of 500. Given that she receives B12 injections every three months, this suggests the injections are maintaining her within laboratory range but the level is dipping between doses. Her folate at 5 ng/mL is within the laboratory range of 3 to 17 but below the optimal level of 8. Folate works alongside B12 in red cell production and DNA synthesis, and suboptimal levels of both may be contributing to the low reticulocyte count and to her fatigue. Her vitamin D at 63 nmol/L is sufficient but below the optimal range of 75 to 120. At this level, she is not deficient, but she is not in the zone associated with the best immune function, mood, and joint health, which is particularly relevant given her hEDS and joint symptoms.\n\nHer MCHC at 348 is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation, particularly as the lab notes that MCHC can be affected by temperature and storage. It is not a clinical concern.\n\nHer parathyroid hormone (PTH) at 1.018 pmol/L sits right at the lower limit of 0.98. PTH regulates calcium and phosphate balance. With her corrected calcium at a healthy 2.53 and vitamin D at 63, the low-normal PTH simply reflects that calcium is adequate and the parathyroid glands do not need to work hard. This is a normal physiological response.\n\nHer progesterone at 2.23 and oestradiol at 65 are both consistent with suppressed ovarian activity from the combined pill and are not independently concerning in that context. Her prolactin at 358 is within the non-pregnant reference range.","links":"The most impactful conversation Tiffinni can have following this report is with her GP or prescribing clinician about her contraceptive pill. Her SHBG is markedly elevated above 180 nmol/L, her free testosterone is suppressed to 0.008 nmol/L, and this hormonal picture is directly relevant to her fatigue, hair thinning, and possibly her joint symptoms. The question to bring to her clinician is whether an alternative contraceptive, perhaps a lower-oestrogen formulation, a progestogen-only option, or a non-hormonal method, could maintain her PCOS symptom control while allowing her free testosterone to recover to a more functional level. She should bring the specific numbers: SHBG above 180, free testosterone 0.008 against a lower limit of 0.013, free androgen index 0.89, and her symptom list.\n\nFor her inflammation, the two most effective changes are dietary and pharmaceutical. Her hs-CRP at 3.1 and ESR at 18 suggest a meaningful inflammatory load. She should discuss her frequent ibuprofen use with her GP. While ibuprofen helps her joint pain in the short term, chronic NSAID use can increase gut permeability and paradoxically raise systemic inflammation, and in the context of Ehlers-Danlos syndrome, the joints will always be hypermobile regardless of pain relief. Her GP may be able to help her find a more sustainable pain management strategy, possibly including physiotherapy focused on joint stabilisation, which is the cornerstone of hEDS management. Increasing anti-inflammatory foods, particularly oily fish two to three times per week (salmon, mackerel, sardines), a wide variety of colourful vegetables, berries, olive oil, nuts, and seeds, would support both her inflammation and her joint health.\n\nFor her metabolic health and PCOS management, keeping her HOMA-IR in the optimal zone is one of the most important long-term goals. Her current reading of 1.56 is only marginally above optimal, and small changes can bring this down. She should aim to include a source of protein and healthy fat with every meal to slow glucose absorption, reduce refined carbohydrates and added sugars, and increase fibre intake to at least 30g per day. Adding resistance training, even two sessions per week, would be transformative. Resistance training improves insulin sensitivity more effectively than cardio alone, builds lean muscle that acts as a glucose sink, supports joint stability in hEDS, and stimulates the testosterone production that her body is currently lacking. For a 32-year-old woman at 68kg doing three cardio sessions per week plus resistance training, her maintenance calories would be approximately 2,000 to 2,150 kcal per day. Her diet volume at 5 out of 10 suggests she may be under-eating, which can worsen fatigue and hormonal disruption. She should aim for a minimum of 88 to 109 grams of protein per day (1.3 to 1.6g per kilogram of bodyweight), spread across three to four meals.\n\nFor her vitamin D, increasing from 63 to the 75 to 120 optimal range requires supplementation at 3,000 IU of vitamin D3 (cholecalciferol) daily, taken with a meal containing fat, alongside 100 to 200 mcg of vitamin K2 in the MK-7 form, which ensures the calcium mobilised by vitamin D is directed to bones rather than soft tissues. This is particularly relevant for her joint and connective tissue health.\n\nFor her folate, increasing dietary folate through dark leafy greens, lentils, chickpeas, asparagus, and fortified foods is the first step. If levels do not improve, a methylfolate supplement at 400 to 800 mcg daily would be appropriate. Her B12 at 320 suggests the three-monthly injections are keeping her in range but not at optimal levels. She should discuss with her GP whether more frequent injections, or supplementation with sublingual methylcobalamin 1,000 mcg daily between injections, might help maintain levels closer to the 500 to 900 optimal range.\n\nFor her Lp(a) at 35.33, there is no lifestyle or dietary change that will lower this number because it is genetically fixed. The most important action is to record it permanently in her medical notes and to keep every modifiable cardiovascular risk factor as good as it currently is, which at present they are. Her first-degree relatives should have their Lp(a) tested.\n\nFor her energy levels specifically, the most likely contributors are the suppressed free testosterone, the suboptimal B12 and folate, the vitamin D below optimal, the low reticulocyte production, and the inflammatory load. Addressing the hormonal picture through her GP, improving her nutritional status through diet and targeted supplementation, adding resistance training, and working on sleep quality will collectively have the greatest impact. For sleep, she should aim for a fixed wake time, get outside within an hour of waking, set a caffeine cut-off by early afternoon, and keep her bedroom cool.\n\nFor her lipase at 66, she should mention this to her GP at her next appointment. It is a mild elevation that may relate to her NSAID use. No urgent action is needed.\n\nA retest of her key markers in 12 weeks would be ideal. The specific markers to repeat are: SHBG, free testosterone, free androgen index (particularly if her contraceptive is changed), hs-CRP, ESR, vitamin D, folate, B12, reticulocyte count, HOMA-IR, and lipase.","flags":"HORMONES: SHBG greater than 180 nmol/L (range 27.8 to 146). Markedly elevated, almost certainly driven by combined oral contraceptive pill. Resulting in suppressed free testosterone at 0.008 nmol/L (range 0.013 to 0.25). Clinically relevant to her presenting symptoms of fatigue and hair thinning. Recommend review of contraceptive formulation with prescribing clinician.\n\nCortisol: 690 nmol/L (morning range 145.4 to 619.4). Likely elevated by increased cortisol binding globulin from the combined pill. If clinical concern, salivary or late-night cortisol would help distinguish from pathological hypercortisolism.\n\nINFLAMMATION: hs-CRP 3.1 mg/L (optimal below 1.0). ESR 18 mm/hour (range below 12). Two independent markers confirming low-grade systemic inflammation. Possible contributors include Ehlers-Danlos syndrome, chronic NSAID use, and PCOS. Worth monitoring and addressing modifiable factors.\n\nLIPIDS: Lp(a) 35.33 nmol/L (desirable below 32). Mildly elevated, inherited, and unchangeable. All other lipid and cardiovascular markers are excellent. Should be recorded permanently. First-degree relatives should be tested.\n\nGLUCOSE AND INSULIN: HOMA-IR 1.56 (optimal 0.5 to 1.5). Marginal elevation, relevant in the context of PCOS. Glucose 5.2, HbA1c 39, and insulin 6.74 are all within range. Monitor and optimise through diet and resistance training.\n\nHEMATOLOGY: Reticulocyte absolute count 23.5 x10^9/L (range 50 to 100). Low reticulocyte production despite adequate haemoglobin and ferritin. May relate to pill-driven suppression, low free testosterone, or suboptimal B12/folate. MCHC 348 g/L (range 315 to 345). Marginal, likely laboratory artefact.\n\nLIVER AND METABOLIC: Lipase 66 U/L (range 13 to 60). Mild elevation, 10% above range. Normal amylase. May relate to chronic NSAID use. No urgent action but worth GP awareness.\n\nVITAMINS: Vitamin D 63 nmol/L (sufficient but below optimal 75 to 120). Folate 5 ng/mL (in range but below optimal 8). B12 320 pg/mL (in range but below optimal 500).\n\nReassuring negatives: Liver enzymes entirely clean despite regular NSAID use. Thyroid function normal with negative antibodies. Iron studies well managed with ferritin in optimal range. Full lipid panel (excluding Lp(a)) excellent. Kidney function adequate. Coeliac screen negative. Rheumatoid factor negative. Immunoglobulins normal. Urinalysis clean. No signs of diabetes. Tumour markers normal. No signs of autoimmune thyroid disease.","recommendations":"1. Discuss contraceptive pill formulation with GP or prescribing clinician, bringing SHBG, free testosterone, and free androgen index results. Explore whether an alternative could maintain PCOS control while allowing hormonal recovery.\n\n2. Discuss frequent ibuprofen and paracetamol use with GP. Explore alternative pain management strategies for hEDS, particularly physiotherapy focused on joint stabilisation and proprioception.\n\n3. Add two resistance training sessions per week. This is the single most impactful addition for insulin sensitivity, joint stability in hEDS, testosterone stimulation, bone density, and long-term metabolic health.\n\n4. Increase dietary protein to 88 to 109 grams per day. Ensure every meal contains a protein source.\n\n5. Increase dietary fibre to at least 30g per day and reduce refined carbohydrates and added sugars to support insulin sensitivity.\n\n6. Eat oily fish two to three times per week and increase colourful vegetables, berries, nuts, and olive oil to reduce systemic inflammation.\n\n7. Supplement vitamin D3 at 3,000 IU daily with vitamin K2 MK-7 at 100 to 200 mcg daily.\n\n8. Increase dietary folate through dark leafy greens, lentils, and chickpeas. Consider methylfolate 400 to 800 mcg daily if levels do not improve.\n\n9. Discuss B12 injection frequency with GP, or add sublingual methylcobalamin 1,000 mcg daily between injections.\n\n10. Record Lp(a) at 35.33 nmol/L permanently in medical notes. Recommend first-degree relatives have theirs tested.\n\n11. Ensure adequate calorie intake of approximately 2,000 to 2,150 kcal per day. Undereating worsens fatigue and hormonal disruption.\n\n12. Retest in 12 weeks: SHBG, free testosterone, FAI, hs-CRP, ESR, vitamin D, folate, B12, reticulocyte count, HOMA-IR, and lipase.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with her largest meal or any meal containing fat. Her current level of 63 nmol/L is sufficient but below the 75 to 120 optimal range associated with best immune function, mood, and joint health, all of which are particularly relevant given her Ehlers-Danlos syndrome and joint symptoms. Forceval contains some vitamin D but typically only 400 IU, which is insufficient to raise her level into the optimal zone.\n\nVitamin K2 (MK-7 form): 100 to 200 mcg daily, taken alongside the vitamin D3. Vitamin K2 directs the calcium mobilised by vitamin D into bones and teeth rather than soft tissues and arteries. This is especially important for connective tissue health.\n\nOmega-3 fish oil: 2g of combined EPA and DHA daily, taken with food. Her hs-CRP at 3.1 and ESR at 18 indicate systemic inflammation, and omega-3 fatty acids are one of the most evidence-based anti-inflammatory interventions available. They also support cardiovascular health alongside her mildly elevated Lp(a).\n\nMethylfolate: 400 to 800 mcg daily. Her folate at 5 ng/mL is below the optimal level of 8, and folate works alongside B12 in red cell production and DNA repair. Methylfolate is the active form and is better absorbed than folic acid, particularly for those with common MTHFR gene variants.\n\nSublingual methylcobalamin (vitamin B12): 1,000 mcg daily, dissolved under the tongue between her three-monthly B12 injections. Her level at 320 pg/mL suggests the injections maintain her in range but do not sustain optimal levels between doses. Sublingual delivery bypasses the gut and is the preferred supplemental form.\n\nMagnesium glycinate: 300 mg before bed. Her magnesium at 0.92 is within the optimal range, but glycinate is well tolerated, supports sleep quality, muscle relaxation, and nervous system function, and is particularly helpful for the joint stiffness and pain she experiences. It also supports insulin sensitivity.\n\nShe should continue her current Forceval multivitamin and iron supplementation as prescribed. Her ferritin at 52 is in the optimal range for women, confirming her iron supplementation is well calibrated.\n\nThe most important changes from this report are not supplements. They are the conversation with her GP about her contraceptive formulation and pain management strategy, adding resistance training twice a week, increasing her protein and calorie intake, and reducing processed carbohydrates.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5013","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. It is one of the primary tools for assessing how well the body manages blood sugar. At 5.2 mmol/L, Tiffinni's glucose sits within both the laboratory and optimal ranges, indicating that her body is regulating blood sugar effectively at this point in time. In the context of her PCOS diagnosis, which is closely linked to insulin resistance, this is a reassuring finding.","low_causes":"Prolonged fasting, excessive insulin, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, PCOS, type 2 diabetes, stress response, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.475","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c measures the average blood sugar level over the preceding two to three months by looking at the percentage of haemoglobin in red blood cells that has glucose attached to it. At 5.7%, Tiffinni's result sits within the normal range (below 6.0%). This three-month average confirms that her blood sugar regulation has been stable and is consistent with the healthy fasting glucose reading.","low_causes":"Blood loss, haemolytic anaemia, chronic kidney disease","high_causes":"Insulin resistance, PCOS, prediabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol units, the internationally standardised format. At 39 mmol/mol, Tiffinni is within the normal range of below 42. While this is above the tighter optimal threshold of 36, it sits comfortably within the normal pre-diabetes boundary and, combined with her healthy fasting glucose, does not indicate any blood sugar management problem. It does reinforce the value of the dietary and exercise changes recommended elsewhere in this report to keep this marker trending in the right direction.","low_causes":"Blood loss, haemolytic anaemia, chronic kidney disease","high_causes":"Insulin resistance, PCOS, prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3956","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3053","upper_optimal_position":"0.4099","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. Lower levels generally indicate better insulin sensitivity, meaning the body's cells respond efficiently to insulin's signal. At 6.74 mIU/L, Tiffinni's insulin is within both the laboratory and optimal ranges, which is a genuinely positive finding in the context of PCOS, a condition often characterised by elevated insulin levels. Her pancreas is not having to overwork to maintain normal blood sugar.","low_causes":"High insulin sensitivity, low carbohydrate diet, type 1 diabetes","high_causes":"Insulin resistance, PCOS, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"410.44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3640","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"500","upper_optimal":"1200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3744","upper_optimal_position":"0.5868","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and provides a reliable measure of how much insulin the body is actually making, because unlike insulin itself, C-Peptide is not cleared by the liver on first pass. At 410 pmol/L (converted from 1.24 ug/L), Tiffinni's level sits just above the lower limit of 364 pmol/L and below the optimal range. This reflects low insulin demand, which is consistent with her healthy fasting glucose and moderate insulin level. It is not a sign of pancreatic insufficiency but rather confirms that her body is not needing to produce large amounts of insulin, a positive sign for metabolic health.","low_causes":"High insulin sensitivity, low carbohydrate diet, type 1 diabetes","high_causes":"Insulin resistance, PCOS, metabolic syndrome, obesity, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6866","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR stands for Homeostatic Model Assessment of Insulin Resistance. It is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's signal. A lower number means better insulin sensitivity. At 1.56, Tiffinni's result is marginally above the upper limit of 1.5 but well below the 1.9 threshold where early insulin resistance is formally considered. In the context of PCOS, where insulin resistance is a core metabolic driver, this mild elevation is important to track but is not alarming. Adding resistance training and adjusting dietary carbohydrate quality are the most effective ways to bring this into the optimal range.","low_causes":"High insulin sensitivity, low carbohydrate diet, high physical activity","high_causes":"Insulin resistance, PCOS, metabolic syndrome, obesity, sedentary lifestyle, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"79.29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3274","lower_normal":"80","upper_normal":"200","lower_optimal":"100","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"","description":"HOMA-B estimates how well the beta cells of the pancreas are functioning by modelling how much insulin they produce relative to the blood sugar level. It is calculated as (20 x insulin) / (glucose - 3.5). At 79.3, Tiffinni's result is just below the lower limit of 80, which is a marginal finding. Because her glucose and HbA1c are both normal, this does not indicate pancreatic failure but rather reflects the relatively low insulin demand her body currently has. In the context of her normal glucose control, this is not a concern, but it is worth tracking over time alongside her HOMA-IR to ensure pancreatic output keeps pace with any changes in insulin demand.","low_causes":"Early beta cell decline, low carbohydrate diet, lean body composition with high insulin sensitivity","high_causes":"Insulin resistance (compensatory increase), PCOS, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting the liver's synthetic function and the immune system's protein production. At 74 g/L, Tiffinni's result is within the optimal range, confirming healthy liver protein production and adequate nutritional intake.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Chronic infection, inflammation, dehydration, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins, and medications around the body and helps maintain fluid balance. At 38 g/L, Tiffinni's albumin is within the laboratory range but sits below the optimal band of 40 to 48. Mild reductions can be seen with inflammation (her hs-CRP is elevated at 3.1), as the liver shifts its protein production priorities during inflammatory states. Ensuring adequate protein intake of 88 to 109g per day should support this.","low_causes":"Inflammation, liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins are a group of proteins that include immunoglobulins (antibodies) and transport proteins. At 36 g/L, Tiffinni's globulin sits right at the upper limit of the reference range. This is consistent with her immune system being active, likely in response to the low-grade inflammation seen in her CRP and ESR results. It is not a concern in isolation but adds to the inflammatory picture described elsewhere in this report.","low_causes":"Immune deficiency, malnutrition, liver disease","high_causes":"Chronic inflammation, infection, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3095","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It reflects the balance between these two major protein groups. At 1.06, Tiffinni's ratio is just below the lower limit of 1.1, driven by her globulin sitting at the top of its range while albumin sits slightly below its optimal band. In the context of raised inflammatory markers (CRP 3.1, ESR 18), this slight imbalance is consistent with a mild inflammatory state shifting the protein balance. It is not a standalone concern but reinforces the importance of addressing the underlying inflammation.","low_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","high_causes":"Immune deficiency, protein malnutrition","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3857","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver and bones. It helps assess whether there is any obstruction to bile flow in the liver or abnormal bone turnover. At 57 IU/L, Tiffinni's ALP is well within range, confirming healthy liver and bone metabolism.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 10 umol/L, Tiffinni's bilirubin is healthy, confirming normal red cell turnover and liver processing.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that rises when liver cells are damaged or inflamed. It is one of the most sensitive markers of liver health. At 10 IU/L, Tiffinni's ALT is well within the optimal range of below 25, indicating that her liver is in excellent condition. This is particularly reassuring given her frequent use of paracetamol and ibuprofen, both of which are processed by the liver.","low_causes":"Generally not clinically significant; can be seen with B6 deficiency","high_causes":"Liver inflammation, fatty liver, medication toxicity, alcohol, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. While less liver-specific than ALT, when viewed alongside ALT it helps build a complete picture of liver health. At 20 IU/L, Tiffinni's AST is well within range and consistent with the healthy liver picture seen across all her liver markers.","low_causes":"Generally not clinically significant","high_causes":"Liver damage, muscle injury, heart damage, medication toxicity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2069","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score estimates the likelihood of liver fibrosis (scarring) using age, ALT, AST, and platelet count. At 0.6, Tiffinni's score is well below the 1.3 threshold for concern, confirming that there is no evidence of liver fibrosis. Combined with her excellent ALT, GGT, and bilirubin, this gives a comprehensive picture of a healthy liver.","low_causes":"Not applicable; lower scores are favourable","high_causes":"Liver fibrosis, cirrhosis, age-related (particularly over 60), low platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT (GGT)","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2368","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5263","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol use, bile duct issues, and metabolic liver strain. At 18 IU/L, well within the female optimal range of below 25, Tiffinni's GGT confirms that her liver is not under metabolic strain. This is one of the most informative liver markers because it responds early to problems before other enzymes rise.","low_causes":"Generally not clinically significant","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, metabolic syndrome, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6439","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands. It breaks down starches into sugars for digestion. At 83 IU/L, Tiffinni's amylase is comfortably within range, confirming healthy pancreatic function. This is reassuring alongside the mildly elevated lipase.","low_causes":"Chronic pancreatitis, pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, intestinal obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.55","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase and is the preferred marker for pancreatic inflammation. At 66 U/L, Tiffinni's lipase is mildly elevated above the upper limit of 60, a rise of about 10%. In the absence of abdominal pain and with a normal amylase of 83, this is very unlikely to represent pancreatitis, which typically produces lipase levels three or more times the upper limit. Mild isolated lipase elevations can be associated with chronic NSAID use, which Tiffinni reports. This should be mentioned to her GP for awareness but does not require urgent investigation.","low_causes":"Chronic pancreatitis with fibrosis, pancreatic insufficiency","high_causes":"Pancreatitis, NSAID use, kidney disease, intestinal obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3868","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all cholesterol carried in the blood, including the protective HDL and the potentially harmful LDL fractions. At 4.0 mmol/L, Tiffinni's total cholesterol is well below the desirable limit of 5.18, reflecting an excellent overall cholesterol level. The total number matters less than the breakdown between HDL and LDL, both of which are in excellent shape for Tiffinni.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, hypothyroidism, familial hypercholesterolaemia, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2941","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units"  Higher levels are better. At 2.1 mmol/L, Tiffinni's HDL is exceptionally high, well above the female optimal level of 1.6, and represents one of the strongest positives in her panel. The combined pill can raise HDL, and in this case it is clearly doing so, providing genuine cardiovascular protection.","low_causes":"Sedentary lifestyle, obesity, insulin resistance, smoking, metabolic syndrome","high_causes":"Regular exercise, genetics, oral contraceptive use, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3920","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5733","units":"mmol/L","description":"LDL (low-density lipoprotein) is the form of cholesterol most associated with the buildup of plaque in artery walls. Lower levels are generally better for cardiovascular health. At 1.48 mmol/L, Tiffinni's LDL is well below both the laboratory limit of 3.0 and the optimal target of 2.6, representing excellent cardiovascular protection.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, genetic factors","high_causes":"High saturated fat diet, hypothyroidism, familial hypercholesterolaemia, PCOS, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2111","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio gives a quick snapshot of cardiovascular risk. Lower is better. At 1.9, Tiffinni's ratio is excellent, well below the upper limit of 4.5, reflecting the combination of her low total cholesterol and exceptionally high HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, elevated total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"52.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.525","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL fraction. Higher percentages are better. At 52.5%, over half of Tiffinni's total cholesterol is the protective HDL type, which is an outstanding result.","low_causes":"Low HDL relative to LDL, metabolic syndrome","high_causes":"High HDL, exercise, genetics, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol fractions, including LDL, VLDL, and remnant particles. At 1.9 mmol/L, well below the limit of 4.0, this confirms an excellent atherogenic profile.","low_causes":"Low total cholesterol, high HDL","high_causes":"Elevated LDL, elevated triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6286","lower_normal":"1.4","upper_normal":"100","lower_optimal":"1.5","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles and is a direct measure of how many protective HDL particles are circulating. At 1.76 g/L, well above the desirable level of 1.4, this confirms the strength of Tiffinni's HDL protection from a different angle than the cholesterol concentration alone.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Exercise, oral contraceptive use, genetics, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single best measure of atherogenic risk. Every LDL, VLDL, and Lp(a) particle carries exactly one ApoB molecule, so this number counts the total number of potentially harmful cholesterol particles in the blood. At 0.54 g/L, well below the optimal target of 0.8, Tiffinni has a very low atherogenic particle count, which is one of the most reassuring cardiovascular findings possible.","low_causes":"Hyperthyroidism, malnutrition, liver disease, genetic factors","high_causes":"High LDL, familial hypercholesterolaemia, insulin resistance, hypothyroidism, high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.307","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2558","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is considered one of the best single markers of cardiovascular risk, balancing harmful particles against protective ones. At 0.307, well within the lower risk category of below 0.6, Tiffinni's ratio indicates an excellent balance between atherogenic and protective lipoproteins.","low_causes":"High ApoA1, low ApoB, favourable lipid profile","high_causes":"Elevated LDL, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"35.33","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5521","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written as Lp(a), is a genetically determined lipoprotein particle that behaves like a stickier version of LDL cholesterol. It deposits cholesterol in artery walls, promotes blood clot formation, and drives local inflammation. Unlike LDL, its level is almost entirely inherited and cannot be changed through diet, exercise, or most medications. At 35.33 nmol/L, Tiffinni's Lp(a) is just above the desirable threshold of 32, placing her in the slightly increased risk category (32 to 90). Because this is genetically fixed and permanent, it should be recorded in her medical notes and her first-degree relatives should have their levels checked. The reassurance here is that every other cardiovascular marker in her panel is excellent, which substantially mitigates the risk associated with this mild elevation.","low_causes":"Genetic factors (favourable)","high_causes":"Inherited (genetic); not modifiable by lifestyle. Niacin may have a modest effect.","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2625","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. At 0.42 mmol/L, within the optimal range of below 0.5, Tiffinni's remnant cholesterol is healthy and consistent with her good triglyceride level.","low_causes":"Low triglycerides, healthy lipid metabolism","high_causes":"Elevated triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.16","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a powerful surrogate marker for insulin resistance and small dense LDL particles. Lower is better. At 0.48, well within the optimal range of below 0.87, this ratio confirms that Tiffinni's lipid metabolism is functioning healthily and that her LDL particles are likely the larger, less harmful type rather than the small dense variety associated with cardiovascular risk.","low_causes":"High insulin sensitivity, high HDL, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.31","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is the most widely used marker of systemic, low-grade inflammation. At 3.1 mg/L, Tiffinni's result is within the laboratory limit of 5 but significantly above the optimal level of below 1.0. This indicates a meaningful degree of low-grade inflammation. In a 32-year-old at a healthy BMI, possible contributors include her Ehlers-Danlos syndrome (connective tissue micro-damage), chronic NSAID use (gut permeability), and PCOS (which is itself associated with low-grade inflammation). Addressing this through dietary changes, reducing NSAID use where possible, and omega-3 supplementation may help bring this closer to optimal.","low_causes":"Low inflammation, healthy lifestyle, statin use","high_causes":"Infection, chronic inflammation, autoimmune conditions, obesity, PCOS, connective tissue disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.75","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. When inflammatory proteins are elevated in the blood, red cells clump together and settle faster. At 18 mm/hour, above the upper limit of 12, Tiffinni's ESR confirms the inflammatory signal seen in her hs-CRP from an independent angle. This dual elevation adds confidence that there is genuine low-grade systemic inflammation present, which may be contributing to her fatigue and joint symptoms.","low_causes":"Polycythaemia, sickle cell disease, low fibrinogen","high_causes":"Inflammation, infection, autoimmune conditions, connective tissue disorders, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"INFLAMMATION","result":"1.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is calculated by dividing the neutrophil count by the lymphocyte count. It is used as a marker of systemic inflammation and immune balance. At 1.46, Tiffinni's NLR is within the optimal range of 1.0 to 2.0, indicating a healthy balance between her innate (neutrophil-driven) and adaptive (lymphocyte-driven) immune responses.","low_causes":"Relatively higher lymphocyte count, viral infections","high_causes":"Stress, infection, systemic inflammation, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","r
