<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Test Patient","dob":"01/01/1990","report_date":"2026-08-06","summary":"Test Patient is a 36-year-old male presenting with a BMI of 26.2, following a balanced mixed diet rated 6 out of 10 for quality with a volume of 7 out of 10. He trains five times per week, with two cardio sessions and three resistance sessions, alongside 7,500 to 10,000 daily steps. He consumes more than seven alcoholic drinks per week. He reports fatigue and brain fog. His goal is to improve long-term health and longevity.\n\nThe most striking finding in this report, and the one that should be discussed with his GP as a matter of priority, is a hormonal pattern that is not physiologically normal and strongly suggests the use of exogenous testosterone or anabolic steroids. His testosterone is 89.7 nmol/L, more than three times the upper limit of the reference range of 28.7. His Sex Hormone Binding Globulin, the protein that carries testosterone in the blood, is profoundly suppressed at 5.6 against a lower limit of 17.3, which is a direct consequence of very high androgen levels pushing SHBG production down. His Free Androgen Index, a calculated measure of how much testosterone is biologically active, is 1,601 against an upper limit of 150. His Luteinising Hormone, the pituitary signal that tells the testes to produce testosterone, is below the detectable limit at less than 0.07 against a lower limit of 1.5. His Follicle Stimulating Hormone, the pituitary signal that drives sperm production, is similarly suppressed at 0.35 against a lower limit of 1.4. When testosterone floods the body from an external source, the pituitary gland recognises there is already far more than enough and shuts down its own signalling. This is called hypothalamic-pituitary-gonadal axis suppression, and it is the classic laboratory fingerprint of exogenous androgen use. His oestradiol, the primary female sex hormone that men also produce in small amounts, is 556 pmol/L against an upper limit of 146.1. This is because the enzyme aromatase converts excess testosterone into oestradiol, and at these testosterone levels aromatase activity is dramatically increased. Elevated oestradiol in men is associated with gynaecomastia (breast tissue development), water retention, mood changes, and cardiovascular risk. This entire hormonal profile carries significant health implications: supraphysiological testosterone increases haematocrit, raises cardiovascular risk, suppresses fertility, and places strain on the liver and cardiovascular system. We would strongly recommend discussing this with his GP openly and honestly so that monitoring can be put in place. If he is using testosterone or anabolic compounds, his GP needs to know in order to provide appropriate care.\n\nThe hormonal picture connects directly to several other abnormal findings. His haemoglobin is 185 g/L against an upper limit of 170, his red blood cell count is 5.84 against an upper limit of 5.5, and his haematocrit, the proportion of blood volume occupied by red cells, is 0.555 against an upper limit of 0.50. Testosterone is a potent stimulator of erythropoiesis, the process by which the bone marrow produces red blood cells. Supraphysiological testosterone levels drive the body to produce more red cells than it needs, thickening the blood. A haematocrit above 0.54 is considered a threshold at which the risk of blood clots, stroke, and cardiovascular events begins to rise meaningfully. At 0.555, this is a finding that requires monitoring and potentially intervention. His GP should be aware of this, and regular haematocrit checks should be part of any ongoing monitoring.\n\nThe second major concern in this report is a clear inflammatory state. His high-sensitivity C-reactive protein, a marker of systemic inflammation produced by the liver, is 36 mg/L against an upper limit of 5. This is not a marginal elevation; it is more than seven times the upper limit and sits firmly in the range associated with acute infection, tissue injury, or significant systemic inflammation. His ESR, the erythrocyte sedimentation rate, which measures how quickly red cells settle in a tube and rises with inflammation, is 30 mm/hour against an upper limit of 12. His D-dimers, a breakdown product of blood clots that the body produces whenever the clotting and clot-dissolving systems are active, are 582 ng/mL against an upper limit of 500. His white blood cell count is 11.8 against an upper limit of 10, his neutrophils, the white cells that respond first to infection and inflammation, are 8.51 against an upper limit of 7, and his monocytes, the white cells involved in chronic inflammation and tissue repair, are 1.25 against an upper limit of 1. Taken together, this is a coherent inflammatory picture: the CRP, ESR, white cell count, neutrophilia, monocytosis, and mildly elevated D-dimers all point in the same direction. The question is what is driving it. If he was unwell, had an infection, a recent injury, surgery, or even a very heavy training session in the 48 to 72 hours before the blood draw, that could explain much of this. Dental infection, skin infection, or a joint injury could also be responsible. However, the degree of CRP elevation is significant enough that if there is no obvious acute explanation, his GP should investigate further. Supraphysiological androgen use can itself contribute to a pro-inflammatory state and elevated haematocrit can increase D-dimers through increased blood viscosity. We would recommend discussing this with his GP, particularly if the fatigue and brain fog he reports have been persistent, as chronic low-grade or acute inflammation is one of the most common causes of both symptoms.\n\nHis lipid profile is unfavourable and represents a genuine long-term cardiovascular risk. His total cholesterol is 6.2 mmol/L against a desirable level below 5.18. His LDL cholesterol, the form that deposits into artery walls, is 4.7 against an upper limit of 3.0. His ApoB, the protein that sits on every atherogenic lipoprotein particle and is considered the single best measure of cardiovascular lipid risk, is 1.37 g/L against a target of below 0.9. His ApoB to ApoA-I ratio, which captures the balance between atherogenic and protective particles, is 1.37 against a target of below 0.7 for men. His non-HDL cholesterol is 5.0 against a target below 4.0. His HDL, the protective cholesterol that removes lipid from artery walls, is 1.2, which sits above the high-risk threshold of 1.04 but below the desirable level of 1.55. His ApoA-I, the protein on protective HDL particles, is 1.0 against a desirable level of 1.2 or above. On the positive side, his triglycerides are excellent at 0.78 and his VLDL is low at 0.35, which means the metabolic, insulin-driven component of lipid risk is not the problem here. The issue is predominantly LDL particle number. Supraphysiological androgen use is a well-recognised driver of adverse lipid changes: it suppresses HDL, raises LDL, and shifts the ApoB/A-I ratio unfavourably. This is likely a significant contributor to his lipid profile. His Lp(a), a genetically determined lipoprotein that independently drives cardiovascular risk and cannot be changed by lifestyle, is pending and should be reviewed when available, as it will clarify how much of his LDL burden is genetic versus modifiable. With an ApoB of 1.37 at age 36, the cumulative lifetime exposure of his arteries to atherogenic particles is a genuine concern for someone whose goal is longevity.\n\nTurning to the positives, and there are several meaningful ones. His kidney function is excellent. His Cystatin C, a more reliable marker of kidney filtration than creatinine because it is not affected by muscle mass, is 0.79 against an upper limit of 1.1, giving a Cystatin C-based eGFR of 111, which is outstanding at 36. His creatinine-based eGFR is above 90, his urea, sodium, chloride, bicarbonate, and uric acid are all comfortably within range. His liver is in good health despite the inflammatory and hormonal load. His GGT is 20 against an upper limit of 73, which is clean and suggests the liver is handling his alcohol intake without visible enzymatic strain at present. His AST is 25, well within range. His ALT is 52, within the laboratory range of below 56, though this is toward the upper end and worth noting. His FIB-4 fibrosis score is 0.52, well below the threshold, indicating no evidence of liver fibrosis. His bilirubin, albumin, total protein, alkaline phosphatase, amylase, and lipase are all within normal limits. His thyroid function is excellent: TSH at 1.13 sits comfortably in the middle of the range, free T4 at 16.7 and free T3 at 5.8 are both healthy, and both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His blood sugar control is very good, with glucose at 4.5 and HbA1c at 32 mmol/mol, well within the normal range. His C-peptide, a marker of how much insulin the pancreas is producing, is 1.2 ug/L (397 pmol/L), at the lower end of range but consistent with healthy insulin sensitivity at a normal glucose level. His insulin result is pending and will complete this picture. His vitamin D is 119 nmol/L, which is genuinely excellent and in the optimal range, suggesting he is either supplementing effectively or getting substantial sun exposure. His B12 at 772 is strong, his folate at 12 is healthy, his zinc at 16.5 is comfortably within range, and his calcium, corrected calcium, phosphate, magnesium, and parathyroid hormone are all within normal limits. His iron studies are balanced, with ferritin at 169, transferrin saturation at 24%, and serum iron at 13.8, none of which raise concern. His IGF-1, a growth factor driven by growth hormone, is 22.9, comfortably within the age-appropriate range. His creatine kinase at 149 is within range, suggesting he is recovering adequately from his resistance training. His prostate health looks reassuring, with PSA at 0.82, well below the age-appropriate threshold. His PSA ratio at 0.183 is marginally below the 0.19 threshold, but at a total PSA this low the ratio has no clinical significance. His tumour markers CA 19-9 and CEA are both within normal limits. His immunoglobulins IgG, IgM, and IgA are all within range, his rheumatoid factor is negative, and his tissue transglutaminase IgA is negative, ruling out coeliac disease. His cortisol at 476 is within the expected morning range of 145 to 619 and is not a concern. His progesterone at 2.94 is within the male reference range. His DHEA-S at 8.2 umol/L (3,022 ug/dL) is within range. His urinalysis is entirely clean, with no protein, glucose, ketones, blood, white cells, nitrites, or bacterial growth.\n\nHis total antioxidant activity at 1.91 is marginally above the upper limit of 1.77. This is a common finding in people who supplement with antioxidants or consume a diet rich in polyphenols and is not a concern.\n\nHis reticulocyte count at 0.96% and absolute reticulocytes at 56 are within range, which is notable because in the context of supraphysiological testosterone one might expect the bone marrow to be producing reticulocytes at a higher rate. The fact that reticulocytes are not elevated despite the high haemoglobin and haematocrit suggests the polycythaemia (excess red cell production) is established rather than acutely worsening, which is a small reassurance but does not diminish the need for monitoring.\n\nIn summary, the two priorities from this report are the hormonal profile, which needs open discussion with his GP so that appropriate cardiovascular, haematological, and fertility monitoring can be established, and the inflammatory state, which needs explanation and, if there is no acute cause, further investigation. The lipid profile represents a significant modifiable cardiovascular risk that should be addressed through both dietary changes and a frank conversation about the contribution of supraphysiological androgens. The fatigue and brain fog he reports could be driven by the inflammatory state, by the oestradiol elevation, or by both. Addressing these findings gives him the best chance of achieving his goal of long-term health and longevity.","links":"The most important conversation from this report is with his GP about his hormonal profile. He should bring the following numbers: testosterone 89.7 nmol/L (reference 8.4 to 28.7), LH less than 0.07 (reference 1.5 to 9.3), FSH 0.35 (reference 1.4 to 18.1), oestradiol 556 pmol/L (reference below 146.1), SHBG 5.6 (reference 17.3 to 65.8), haematocrit 0.555 (reference 0.40 to 0.50), and haemoglobin 185 (reference 130 to 170). He should be open with his GP about any testosterone or anabolic compound use so that monitoring can be tailored appropriately. Regular haematocrit monitoring is essential while testosterone remains supraphysiological; a haematocrit above 0.54 is the threshold at which many clinicians will recommend intervention such as dose reduction, therapeutic phlebotomy (blood donation or venesection), or both. The oestradiol level at 556 is high enough to warrant discussion about management, which his GP or an endocrinologist can advise on. Fertility should also be discussed, as suppressed LH and FSH mean spermatogenesis is likely significantly impaired.\n\nThe inflammatory markers need a separate GP conversation. If he was unwell, had an infection, injury, or very heavy training session within 48 to 72 hours of the blood draw, the CRP of 36, ESR of 30, raised white cells, neutrophils, monocytes, and marginally elevated D-dimers may all resolve on their own. If there was no obvious acute trigger, his GP should consider repeating CRP and a full blood count in four to six weeks, and if CRP remains elevated, further investigation including infection screen and potentially imaging may be warranted. The D-dimers at 582 against an upper limit of 500 are mildly elevated and most likely reactive to the inflammatory state or the raised haematocrit increasing blood viscosity, but if he has any symptoms of deep vein thrombosis (leg swelling, pain, warmth) or pulmonary embolism (sudden breathlessness, chest pain), he should seek immediate medical attention.\n\nFor his lipid profile, the approach should be twofold. First, the modifiable dietary component. He should increase soluble fibre intake, aiming for 10 to 15 grams per day from sources such as oats, barley, lentils, beans, apples, and psyllium husk. He should include two to three portions of oily fish per week (salmon, mackerel, sardines) for their omega-3 content, which supports HDL and reduces triglycerides, though his triglycerides are already excellent. He should reduce saturated fat intake by choosing leaner cuts of meat, reducing butter and cheese, and replacing some saturated fat with olive oil, avocado, and nuts. A small daily handful of almonds or walnuts (30 grams) has been shown to reduce LDL by 5 to 10%. Second, the hormonal contribution. Supraphysiological androgen levels reliably suppress HDL and raise LDL and ApoB. If androgen use is reduced or managed differently, the lipid profile may improve substantially. His GP may also consider statin therapy given his ApoB of 1.37 at age 36 with a goal of longevity, particularly once the Lp(a) result is available to complete the cardiovascular risk picture.\n\nFor his alcohol intake, reducing from more than seven drinks per week to under seven, and ideally under four, would support both his liver (which is coping well but ALT at 52 is at the top of range), his inflammatory markers, and his lipid profile. Alcohol contributes to oestradiol production through upregulation of aromatase, so reducing intake may also help bring oestradiol down.\n\nFor his fatigue and brain fog, the most likely explanations are the inflammatory state and the markedly elevated oestradiol. Addressing the inflammation and the hormonal imbalance are more likely to resolve these symptoms than any supplement or dietary change.\n\nHis calorie target for maintenance at 85 kg, 180 cm, age 36, training five times per week with 7,500 to 10,000 steps, is approximately 2,700 to 2,900 kcal per day. If he wishes to reduce body fat slightly (his BMI of 26.2 suggests he is carrying some extra weight, though at high muscle mass BMI is less reliable), a target of 2,300 to 2,500 kcal per day would create a moderate deficit. His protein target should be 1.6 to 2.0 g per kg of body weight given his resistance training, which equates to 136 to 170 grams of protein per day.\n\nHis diet quality rated at 6 out of 10 has room for improvement. Focusing on increasing vegetable intake, whole grains, and oily fish while reducing processed foods and alcohol would be the most impactful changes. His diet volume at 7 out of 10 appears adequate and does not suggest under-eating.\n\nWhen his Lp(a) and insulin results become available, they should be reviewed. If Lp(a) is elevated (above 32 nmol/L), this is a permanent inherited risk factor that should be recorded in his medical notes and discussed with his GP in the context of his already elevated ApoB. First-degree relatives should also be tested. If Lp(a) is normal, it confirms that his lipid burden is driven entirely by modifiable factors, which is actually encouraging.\n\nA retest of the following markers in eight to twelve weeks is recommended: CRP, full blood count with differential, haematocrit, oestradiol, liver function, and lipid panel including ApoB. This will show whether the inflammatory markers were acute or persistent, whether haematocrit is stable or rising, and will provide a baseline for tracking any changes he makes.","flags":"URGENT: GP discussion recommended.\n\nHormonal profile consistent with exogenous androgen use: Testosterone 89.7 nmol/L (reference 8.4 to 28.7), SHBG 5.6 nmol/L (reference 17.3 to 65.8), Free Androgen Index 1,601.79 (reference 30 to 150), LH <0.07 mIU/mL (reference 1.5 to 9.3), FSH 0.35 mIU/mL (reference 1.4 to 18.1), Oestradiol 556 pmol/L (reference <146.1). Complete hypothalamic-pituitary-gonadal axis suppression with markedly supraphysiological testosterone and secondary oestradiol elevation via aromatisation. Fertility implications. Requires open GP discussion and ongoing monitoring.\n\nPolycythaemia secondary to androgen excess: Haemoglobin 185 g/L (reference 130 to 170), RBC 5.84 (reference 4.5 to 5.5), Haematocrit 0.555 (reference 0.40 to 0.50). Haematocrit above 0.54 threshold. Risk of thrombotic events. Requires regular monitoring; therapeutic phlebotomy or dose reduction may be indicated.\n\nSignificant systemic inflammation: CRP 36 mg/L (reference <5), ESR 30 mm/hr (reference <12), WBC 11.8 (reference 4 to 10), Neutrophils 8.51 (reference 2 to 7), Monocytes 1.25 (reference 0.2 to 1.0), D-dimers 582 ng/mL (reference <500). If no acute infection, injury, or illness at time of sampling, repeat CRP and FBC in 4 to 6 weeks. If CRP remains elevated, further investigation warranted. D-dimers mildly elevated, likely reactive, but clinical correlation with VTE symptoms recommended.\n\nAdverse lipid profile: Total cholesterol 6.2 mmol/L (desirable <5.18), LDL 4.7 mmol/L (reference <3.0), ApoB 1.37 g/L (reference <0.9), ApoB/A-I ratio 1.37 (reference <0.7), Non-HDL 5.0 (reference <4.0), HDL 1.2 (desirable >1.55), ApoA-I 1.0 (desirable >1.20), TC/HDL ratio 5.17 (reference <4.5). Significant atherogenic burden at age 36. Supraphysiological androgens likely contributing. Lp(a) pending. Consider statin therapy discussion, particularly once Lp(a) available.\n\nALT 52 IU/L (reference <56): Within laboratory range but at the upper boundary. Monitor in context of androgen use and alcohol intake.\n\nPSA ratio 0.183 (reference >0.19): Marginally below threshold but total PSA 0.82 is very low. No clinical significance at this PSA level.\n\nPending results: Insulin, Lp(a), IgE. Review when available.\n\nReassuring negatives: Kidney function excellent (Cystatin C 0.79, eGFR 111). Thyroid function normal with negative antibodies. Blood sugar control excellent (HbA1c 32 mmol/mol). Liver enzymes largely normal with FIB-4 0.52 and GGT 20. Iron studies balanced. Vitamin D optimal at 119. PSA 0.82. Tumour markers CA 19-9 and CEA normal. Coeliac screen negative. Rheumatoid factor negative. Urinalysis clean.","recommendations":"1. Discuss the hormonal profile openly with his GP, bringing this report. The suppressed LH, FSH, and SHBG alongside testosterone of 89.7 and oestradiol of 556 require medical oversight, haematocrit monitoring, and fertility counselling if relevant.\n\n2. Request regular haematocrit monitoring (every 8 to 12 weeks minimum) while testosterone remains supraphysiological. If haematocrit exceeds 0.54 consistently, therapeutic phlebotomy or dose adjustment should be discussed.\n\n3. Discuss the CRP of 36 with his GP. If there was no acute illness or injury at the time of testing, repeat CRP and full blood count in 4 to 6 weeks. If persistent, further investigation is needed.\n\n4. Address the lipid profile through dietary changes: increase soluble fibre to 10 to 15 g per day, include 2 to 3 portions of oily fish per week, reduce saturated fat, add 30 g of nuts daily. Discuss statin therapy with GP given ApoB 1.37 at age 36.\n\n5. Reduce alcohol intake to under 7 drinks per week, ideally under 4. This supports liver health, reduces aromatase-driven oestradiol production, and improves the lipid profile.\n\n6. Review the Lp(a) and insulin results when available. If Lp(a) is elevated, record permanently and test first-degree relatives.\n\n7. Maintain protein intake at 136 to 170 g per day. If aiming for gradual fat loss, target 2,300 to 2,500 kcal per day; for maintenance, 2,700 to 2,900 kcal per day.\n\n8. Improve diet quality from 6 toward 8 out of 10 by increasing vegetables, whole grains, legumes, and oily fish while reducing processed foods.\n\n9. Retest in 8 to 12 weeks: CRP, full blood count, haematocrit, oestradiol, testosterone, liver function, and lipid panel including ApoB.","supplementation":"Given his current results, supplementation plays a relatively minor role compared to the medical and dietary priorities in this report. His vitamin D at 119 nmol/L is optimal, so he should continue whatever he is currently doing to maintain this, whether that is supplementation or sun exposure. If he is supplementing, a maintenance dose of 2,000 IU of vitamin D3 (cholecalciferol) daily with a fat-containing meal is appropriate, paired with 100 mcg of vitamin K2 in the MK-7 form to ensure calcium is directed to bone rather than arteries. His B12 and folate are both healthy, so no supplementation is needed there. His magnesium at 0.84 is within range, but given his training load and reports of fatigue, 300 to 400 mg of magnesium glycinate before bed may support sleep quality and recovery. Omega-3 fish oil at 2 to 3 g of combined EPA and DHA daily would support his lipid profile, helping to raise HDL and ApoA-I while providing anti-inflammatory benefit, which is relevant given his CRP of 36. He should choose a high-quality fish oil that provides at least 1,000 mg of EPA per daily dose. He does not need iron supplementation; his ferritin at 169 and transferrin saturation at 24% are well balanced, and additional iron would not be helpful.\n\nThe most important changes from this report are not supplements. They are an honest conversation with his GP about his hormonal profile and haematocrit, investigation of the inflammatory markers, dietary improvements to address his lipid profile, and a reduction in alcohol intake.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver health. At 52 IU/L, this sits within the laboratory reference range of below 56 but toward the upper boundary. In the context of regular alcohol consumption above seven drinks per week and supraphysiological androgen levels, both of which can place metabolic load on the liver, this is worth monitoring. The fact that GGT, AST, bilirubin, and albumin are all healthy is reassuring, suggesting no significant liver damage at present.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, medication effects, alcohol excess, intense exercise, viral hepatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, muscles, and kidneys. Unlike ALT, which is mostly liver-specific, AST can be released from muscle tissue after heavy training. At 25 IU/L, this is comfortably within both the reference range and the optimal range, indicating no significant liver or muscle cell damage. In a man training three times per week with resistance exercise, this is a healthy result.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2283","lower_normal":"4","upper_normal":"73","lower_optimal":"5","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3382","upper_optimal_position":"0.5072","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake and bile duct health. It is often the first liver enzyme to rise with regular alcohol consumption, making it a useful early warning marker. At 20 IU/L against an upper limit of 73, this is an excellent result, particularly given that he consumes more than seven alcoholic drinks per week. It indicates that the liver is currently handling the alcohol load without visible enzymatic strain.","low_causes":"","high_causes":"Alcohol excess, bile duct obstruction, fatty liver disease, medications, pancreatitis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and gut. In the liver, it is associated with the bile ducts, and elevation can indicate bile duct problems or bone disease. At 47 IU/L, just above the lower limit of 46, this is within both the reference and optimal ranges. It indicates healthy bile duct function and normal bone turnover.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes bilirubin and excretes it in bile. Elevated bilirubin can indicate liver disease, bile duct problems, or excessive red cell breakdown. At 12 umol/L, this is comfortably within range. Given his elevated haemoglobin and red cell count from increased erythropoiesis, a normal bilirubin is reassuring as it suggests the liver is clearing the increased red cell turnover products without difficulty.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins are essential for maintaining fluid balance, transporting substances, and supporting immune function. At 70 g/L, this is within both reference and optimal ranges, indicating the liver is producing proteins adequately and there is no protein loss through the kidneys or gut.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance by keeping water inside blood vessels and transports hormones, vitamins, and medications. At 40 g/L, this is within both the reference and optimal ranges, confirming good liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins including immunoglobulins (antibodies) and transport proteins. The level is calculated by subtracting albumin from total protein. At 30 g/L, this is within both reference and optimal ranges. Globulin can rise with chronic inflammation or infection, so a normal level here is noted alongside the elevated CRP, suggesting the inflammatory process is more likely acute than chronic.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. A balanced ratio indicates healthy liver function and a normal immune state. At 1.33, this is within both reference and optimal ranges.","low_causes":"Overproduction of globulins (inflammation, infection, autoimmune disease), underproduction of albumin (liver disease)","high_causes":"Underproduction of globulins (immune deficiency), genetic variations","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1793","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. A score below 1.45 indicates a low probability of significant liver fibrosis. At 0.52, this is well below the threshold, providing strong reassurance that there is no evidence of liver scarring despite regular alcohol intake.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4356","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that helps digest carbohydrates. Elevated levels can indicate pancreatitis or pancreatic duct obstruction. At 57 IU/L, this is well within range, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic duct obstruction, salivary gland inflammation, kidney failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4326","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase, making it a better marker for pancreatic disease. At 27 U/L, this is within range and confirms healthy pancreatic function. In the context of alcohol consumption above seven drinks per week, a normal lipase is reassuring as the pancreas is a common target of alcohol-related damage.","low_causes":"","high_causes":"Acute pancreatitis, chronic pancreatitis, pancreatic duct obstruction, kidney failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5988","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL (harmful), HDL (protective), and VLDL. At 6.2 mmol/L against a desirable level below 5.18, this is elevated. However, total cholesterol alone does not tell the full story; the breakdown into LDL, HDL, and the ApoB particle count is more informative. In this case, the elevation is driven primarily by a high LDL of 4.7, with HDL contributing only 1.2.","low_causes":"Malnutrition, hyperthyroidism, liver failure, malabsorption","high_causes":"Diet high in saturated fat, genetic predisposition (familial hypercholesterolaemia), hypothyroidism, kidney disease, anabolic steroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2294","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat stored in the body and circulating in the blood. They rise with excess carbohydrate and alcohol intake, insulin resistance, and metabolic syndrome. At 0.78 mmol/L, this is an excellent result, well within both the reference and optimal ranges. Low triglycerides alongside an otherwise elevated lipid profile suggest the problem is not metabolic or insulin-driven but rather related to LDL particle production and clearance.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"Excess carbohydrate or alcohol intake, insulin resistance, metabolic syndrome, obesity, hypothyroidism, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5769","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.55","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7452","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for disposal. Higher levels are protective against cardiovascular disease. At 1.2 mmol/L, this is above the high-risk threshold of 1.04 but below the desirable level of 1.55. Supraphysiological androgen levels are a well-established cause of HDL suppression, and this is likely contributing to his lower HDL. Increasing omega-3 fatty acid intake and reducing alcohol may help raise it.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, anabolic steroid use, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7840","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol carries cholesterol from the liver to the tissues. When present in excess, LDL particles penetrate the artery wall, oxidise, and initiate plaque formation, the process underlying heart attacks and strokes. At 4.7 mmol/L against an upper limit of 3.0, this is significantly elevated. In a 36-year-old whose goal is longevity, reducing LDL is one of the highest-impact interventions available. The causes here likely include dietary saturated fat intake and the direct effect of supraphysiological androgens on LDL metabolism.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, kidney disease, anabolic steroid use, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2244","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol is a triglyceride-rich lipoprotein produced by the liver. It is a precursor to LDL and contributes to atherosclerosis. At 0.35 mmol/L against an upper limit of 0.78, this is a healthy result that aligns with his excellent triglyceride level and suggests no metabolic or insulin-driven component to his lipid elevation.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate or alcohol intake, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol fractions in a single number: LDL, VLDL, IDL, and Lp(a). At 5.0 mmol/L against a target of below 4.0, this is elevated and consistent with the high LDL and ApoB levels seen in this report.","low_causes":"","high_causes":"Elevated LDL, elevated VLDL, diet high in saturated fat, genetic factors, anabolic steroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5744","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio reflects the balance between total circulating cholesterol and the protective HDL fraction. A lower ratio indicates a more favourable cardiovascular risk profile. At 5.17 against a target of below 4.5, this ratio is elevated, driven by both the high total cholesterol and the below-optimal HDL. An ideal ratio would be below 3.5.","low_causes":"","high_causes":"Elevated total cholesterol, low HDL, anabolic steroid use, sedentary lifestyle, poor diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"19.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4838","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows what proportion of circulating cholesterol is protective. At 19.35% against a desirable level above 20%, this is marginally below threshold, reflecting the combination of elevated total cholesterol and suppressed HDL. Ideally this would be above 28%.","low_causes":"Low HDL, high total cholesterol, anabolic steroid use, metabolic syndrome","high_causes":"Excellent HDL production, low total cholesterol, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein that sits on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, measuring ApoB gives a direct count of the number of particles that can penetrate and damage artery walls. It is considered the single best blood marker of cardiovascular risk. At 1.37 g/L against a target of below 0.9 (and an optimal target for longevity of below 0.8), this is significantly elevated. Each of these particles is capable of entering the artery wall and initiating plaque formation. At 36 with a longevity goal, reducing this number is a high priority.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic predisposition, anabolic steroid use, hypothyroidism, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It drives the protective function of HDL by enabling reverse cholesterol transport, the process of pulling cholesterol out of artery walls. At 1.0 g/L against a desirable level of 1.2 or above, this is below target. Low ApoA-I mirrors the low HDL and is consistent with the suppressive effect of supraphysiological androgens on HDL production.","low_causes":"Anabolic steroid use, smoking, sedentary lifestyle, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, oestrogen, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9786","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio is considered one of the most powerful predictors of cardiovascular risk, capturing the balance between atherogenic (artery-damaging) and anti-atherogenic (artery-protecting) particles in a single number. At 1.37 against a target of below 0.7 for men, this is approximately double the threshold and represents a significantly unfavourable balance. Both a high numerator (ApoB 1.37) and a low denominator (ApoA-I 1.0) are contributing.","low_causes":"","high_causes":"Elevated LDL particle count, suppressed HDL, anabolic steroid use, diet high in saturated fat, genetic factors","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_chol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant lipoproteins, which are increasingly recognised as independent drivers of cardiovascular risk. At 0.3 mmol/L against targets of below 0.8 (reference) and below 0.5 (optimal), this is an excellent result. It confirms that the metabolic, triglyceride-driven component of lipid risk is not a problem; the issue is squarely with LDL particle number.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate or alcohol intake, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2167","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"","description":"The triglyceride to HDL ratio is a proxy for insulin resistance and metabolic health. A low ratio indicates good insulin sensitivity and low metabolic risk. At 0.65 against an optimal target of below 0.9, this is an excellent result, confirming that insulin resistance is not driving his lipid abnormalities.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"Pending","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Lipoprotein(a) is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It independently drives cardiovascular risk through three mechanisms: depositing cholesterol in artery walls, promoting blood clot formation, and driving inflammation. Unlike LDL, Lp(a) levels are fixed by genetics and cannot be meaningfully changed by diet or lifestyle. This result is pending and should be reviewed when available. If elevated (above 32 nmol/L), it should be recorded as a permanent part of his medical record and first-degree relatives should be tested.","low_causes":"","high_causes":"Genetic inheritance (not modifiable by diet or lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5533","units":"mmol/l","description":"Blood glucose measures the level of sugar circulating in the bloodstream at the time of the test. It is regulated by insulin and provides a snapshot of current blood sugar control. At 4.5 mmol/L, this is comfortably within both the reference and optimal ranges, indicating healthy glucose regulation at the time of testing.","low_causes":"Fasting, excessive insulin, adrenal insufficiency, liver disease","high_causes":"Diabetes, pre-diabetes, stress response, corticosteroid use, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose attached to it. Because red cells live for about 90 to 120 days, HbA1c provides an average picture of blood sugar control over the preceding two to three months. At 5.1%, this is well within the normal range (below 6.0%) and confirms excellent long-term blood sugar control. However, it should be noted that his elevated haemoglobin and polycythaemia can theoretically affect HbA1c measurement, though the effect at this level is likely minimal.","low_causes":"Haemolytic anaemia, blood loss, red cell transfusion","high_causes":"Diabetes, pre-diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"38","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4524","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international (IFCC) units. At 32 mmol/mol, well below the normal threshold of 42 and the pre-diabetes threshold of 42 to 47, this confirms healthy long-term blood sugar control.","low_causes":"Haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"Pending","within_normal":"","within_optimal":"","result_position":"","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"3","upper_optimal":"12","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas needs to produce to keep blood glucose within range. Higher levels suggest the body is becoming resistant to insulin's effects and needs more of it to control blood sugar, a condition called insulin resistance. This result is pending and should be reviewed when available. Combined with glucose, it will allow calculation of HOMA-IR (a measure of insulin resistance) and HOMA-B (a measure of pancreatic function).","low_causes":"Excellent insulin sensitivity, low-carbohydrate diet, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, obesity, early type 2 diabetes, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3697","upper_optimal_position":"0.5515","units":"ug/l","description":"C-peptide is a protein released by the pancreas in equal amounts to insulin. It provides a reliable measure of how much insulin the pancreas is producing, unaffected by external insulin administration. At 1.2 ug/L (equivalent to 397 pmol/L), this sits at the lower end of the reference range of 1.1 to 4.4. In the context of a normal fasting glucose of 4.5 and excellent HbA1c of 32, a low C-peptide simply reflects that the pancreas does not need to produce much insulin to maintain blood sugar control, indicating good insulin sensitivity rather than pancreatic insufficiency.","low_causes":"Excellent insulin sensitivity, low-carbohydrate diet, type 1 diabetes, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, type 2 diabetes (early stage)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"HS-CRP","group":"INFLAMMATION","result":"36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is the most widely used blood marker of systemic inflammation and is also an independent predictor of cardiovascular risk. Levels below 1 mg/L are considered low cardiovascular risk, 1 to 3 moderate, and above 3 high. At 36 mg/L, this is more than seven times the upper limit and indicates a significant acute or subacute inflammatory process. This level is consistent with active infection, tissue injury, or a major inflammatory response. If there was no obvious illness, injury, or very heavy training session in the days before the blood draw, this should be investigated by his GP.","low_causes":"","high_causes":"Acute infection, chronic infection, tissue injury, autoimmune disease, obesity, heavy exercise, cardiovascular disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"dd","name":"D-Dimers","group":"INFLAMMATION","result":"582.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5822","lower_normal":"0","upper_normal":"500","lower_optimal":"0","upper_optimal":"400","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"ng/ml FEU","description":"D-dimers are protein fragments produced when the body breaks down blood clots. They indicate that the clotting and clot-dissolving systems are active. At 582 ng/mL against an upper limit of 500, this is mildly elevated. D-dimers can rise with infection, inflammation, recent injury, surgery, intense exercise, and increased blood viscosity from polycythaemia (excess red blood cells). Given his CRP of 36 and haematocrit of 0.555, the mildly elevated D-dimers are most likely a reactive finding. However, if he experiences any symptoms of deep vein thrombosis such as leg swelling, pain, or warmth, or pulmonary embolism such as sudden breathlessness or chest pain, he should seek immediate medica
