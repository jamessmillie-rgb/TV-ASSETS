l attention.","low_causes":"","high_causes":"Blood clot (DVT, PE), infection, inflammation, recent surgery or injury, intense exercise, pregnancy, elevated haematocrit","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"30","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube in one hour. When inflammation is present, proteins in the blood cause red cells to clump together and settle faster. At 30 mm/hour against an upper limit of 12, this is elevated and consistent with the raised CRP, white cell count, and neutrophils, all pointing to an active inflammatory process.","low_causes":"Polycythaemia, sickle cell disease, heart failure","high_causes":"Infection, inflammation, autoimmune disease, malignancy, anaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"INFLAMMATION","result":"4.70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8900","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"","description":"The neutrophil to lymphocyte ratio is a calculated marker of systemic inflammation and immune activation. It divides the neutrophil count (innate immune cells that respond first to infection and inflammation) by the lymphocyte count (adaptive immune cells). A ratio above 3 suggests active inflammation or physiological stress. At 4.70, this is elevated and consistent with the other inflammatory markers in this report. It is driven by the high neutrophil count of 8.51 rather than a low lymphocyte count, which at 1.81 is normal.","low_causes":"","high_causes":"Acute infection, systemic inflammation, physiological stress, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"135","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"133","upper_normal":"146","lower_optimal":"135","upper_optimal":"142","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5128","units":"mmol/l","description":"Sodium is the primary electrolyte in the blood and is essential for fluid balance, nerve function, and muscle contraction. At 135 mmol/L, this sits at the lower end of the optimal range. Adequate hydration and electrolyte intake are important, particularly with regular exercise.","low_causes":"Excessive water intake, heart failure, kidney disease, medications (diuretics), adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 101 mmol/L, this is within both reference and optimal ranges.","low_causes":"Vomiting, metabolic alkalosis, heart failure","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3576","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's main acid-base buffer, helping to maintain blood pH within the narrow range needed for cellular function. At 20.8 mmol/L, this is within the reference range but at the lower end, just above the lower limit of 20. A mildly low bicarbonate can reflect metabolic acidosis from intense exercise (lactic acid production), high protein intake, or the kidney compensating for other acid-base changes. This is not a concern in isolation but is noted for completeness.","low_causes":"Metabolic acidosis, intense exercise, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, dehydration, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5088","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6158","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. At 2.37 mmol/L, this is within both reference and optimal ranges, indicating healthy calcium homeostasis.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the calcium result for albumin levels, providing a more accurate picture of the biologically active calcium in the blood. At 2.42 mmol/L, this is within both reference and optimal ranges.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3793","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.97","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3552","upper_optimal_position":"0.6103","units":"mmol/l","description":"Phosphate works alongside calcium for bone health and is critical for energy production (as part of ATP, the body's energy currency). At 0.9 mmol/L, this is within the reference range though below the optimal range of 0.97 to 1.45. Phosphate levels can be affected by diet, insulin, and the timing of meals. This is not a clinical concern.","low_causes":"Insulin effect (after eating), vitamin D deficiency, hyperparathyroidism, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5115","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.75","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3713","upper_optimal_position":"0.5805","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle contraction, nerve function, and sleep regulation. At 0.84 mmol/L, this is within both reference and optimal ranges. However, blood magnesium only reflects about 1% of total body stores (the rest is in bones and cells), so even a normal blood level does not guarantee intracellular sufficiency. Given his training load, fatigue symptoms, and alcohol intake (which depletes magnesium), supplementation may still be beneficial.","low_causes":"Alcohol excess, diuretics, malabsorption, intense exercise, poor dietary intake","high_causes":"Kidney failure, excessive supplementation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.6193","units":"mmol/l","description":"Urea is a waste product formed when the liver breaks down protein. The kidneys filter it out of the blood. At 6.9 mmol/L, this is within both reference and optimal ranges. A mildly elevated urea can occur with high protein intake, but this level is unremarkable.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein intake, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4957","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6239","units":"umol/l","description":"Creatinine is a waste product of muscle metabolism filtered by the kidneys. Its level reflects both muscle mass and kidney function. At 88 umol/L, this is within range and consistent with a man who resistance trains three times per week. Creatinine is best interpreted alongside Cystatin C for a fuller picture of kidney function.","low_causes":"Low muscle mass, severe liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Estimated GFR (glomerular filtration rate) is a calculated measure of how well the kidneys are filtering waste from the blood. A value above 90 indicates normal kidney function. At greater than 90, this is within both the reference and optimal ranges, confirming healthy kidney filtration.","low_causes":"Kidney disease, dehydration, heart failure, urinary obstruction","high_causes":"Hyperfiltration (early diabetes, pregnancy)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3591","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells. Unlike creatinine, it is not influenced by muscle mass, making it a more accurate marker of kidney function in people who exercise regularly. At 0.79 mg/L against an upper limit of 1.1, this is an excellent result. The Cystatin C-based eGFR of 111 confirms outstanding kidney function at age 36.","low_causes":"","high_causes":"Kidney disease, inflammation, thyroid disorders","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"111","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9250","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"This is the eGFR calculated from Cystatin C rather than creatinine. At 111, this confirms excellent kidney filtration capacity. The Cystatin C-based calculation is preferred in individuals who exercise regularly or have higher-than-average muscle mass, as creatinine can overestimate kidney impairment in those situations.","low_causes":"Kidney disease","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"335","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4388","lower_normal":"220","upper_normal":"547","lower_optimal":"250","upper_optimal":"420","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3425","upper_optimal_position":"0.5242","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, substances found in certain foods and in the body's own cells. High levels can cause gout (painful joint inflammation) and are associated with kidney stones and cardiovascular risk. At 335 umol/L, this is within both reference and optimal ranges.","low_causes":"Low purine diet, liver disease, Fanconi syndrome","high_causes":"Gout, kidney disease, high purine diet (red meat, organ meats, beer), metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"185","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7917","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6458","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. At 185 g/L against an upper limit of 170 for men, this is elevated. Elevated haemoglobin (polycythaemia) thickens the blood, increasing the risk of blood clots, stroke, and cardiovascular events. The most common cause in this context is supraphysiological testosterone, which stimulates the bone marrow to produce more red blood cells than the body needs. This requires monitoring and may require intervention if it persists or rises further.","low_causes":"Iron deficiency, vitamin B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Testosterone/androgen use, dehydration, chronic lung disease, living at altitude, polycythaemia vera, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7800","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6133","units":"x10^12/L","description":"Red blood cell count measures the number of red cells in a given volume of blood. At 5.84 against an upper limit of 5.5, this is mildly elevated and consistent with the raised haemoglobin and haematocrit, forming part of the polycythaemia picture driven by supraphysiological testosterone levels.","low_causes":"Anaemia (iron, B12, folate deficiency), chronic disease, blood loss, bone marrow disorders","high_causes":"Testosterone/androgen use, dehydration, chronic lung disease, polycythaemia vera, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.555","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8917","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"l/l","description":"Haematocrit measures the percentage of blood volume occupied by red blood cells. At 0.555 (55.5%) against an upper limit of 0.50 (50%), this is elevated above the 0.54 threshold at which the risk of thrombotic events (blood clots, stroke) begins to rise meaningfully. This is driven by testosterone-stimulated erythropoiesis and requires regular monitoring. Therapeutic phlebotomy (having blood removed, similar to donating blood) is the standard intervention if haematocrit remains persistently above 0.54.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Testosterone/androgen use, dehydration, chronic lung disease, polycythaemia vera, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6111","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. At 95 fL, this is within both reference and optimal ranges, indicating normal-sized red cells. A normal MCV helps rule out nutritional deficiencies: low MCV suggests iron deficiency, while high MCV suggests B12 or folate deficiency.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"Vitamin B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin inside each red blood cell. At 31.8 pg, this is within range, indicating that each red cell is carrying an appropriate amount of haemoglobin.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"Vitamin B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"334","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures the average concentration of haemoglobin within each red blood cell. At 334 g/L, this is within both reference and optimal ranges.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"Hereditary spherocytosis, laboratory artefact from sample temperature","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6286","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"%","description":"RDW (red cell distribution width) measures how much variation there is in the size of red blood cells. At 14.6%, this is within the reference range though slightly above the optimal threshold of 14%. A mildly elevated RDW can suggest a mix of older and newer red cells of slightly different sizes, which can occur with increased red cell production. In the context of testosterone-driven erythropoiesis, this is an expected finding and not a concern.","low_causes":"","high_causes":"Iron deficiency, vitamin B12 or folate deficiency, mixed nutritional deficiency, liver disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"238","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4462","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6190","units":"x10^9/L","description":"Platelets are small cell fragments essential for blood clotting. At 238, this is within both reference and optimal ranges. A normal platelet count in the context of an inflammatory state is a neutral finding.","low_causes":"Viral infection, liver disease, bone marrow disorders, medications, autoimmune conditions","high_causes":"Infection, inflammation, iron deficiency, splenectomy, chronic inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6633","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets are younger and more reactive. At 9.9 fL, this is within range.","low_causes":"Bone marrow suppression, aplastic anaemia, chronic inflammation (late)","high_causes":"Immune thrombocytopenia, active platelet consumption, Bernard-Soulier syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"11.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7967","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5500","units":"x10^9/L","description":"White blood cells (leukocytes) are the immune system's main defence against infection and disease. At 11.8 against an upper limit of 10, this is mildly elevated. The elevation is driven by high neutrophils (8.51) and monocytes (1.25), with lymphocytes, eosinophils, and basophils all normal. This pattern is consistent with an acute inflammatory or infectious process rather than a chronic blood disorder. It aligns with the CRP of 36 and ESR of 30.","low_causes":"Viral infection, bone marrow disorders, autoimmune conditions, medications","high_causes":"Bacterial infection, inflammation, stress response, smoking, corticosteroids, leukaemia (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"8.51","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7768","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and are the first responders to bacterial infection and acute inflammation. At 8.51 against an upper limit of 7, this is elevated and represents the main driver of the overall white cell count elevation. Neutrophilia at this level is consistent with active infection, significant tissue inflammation, or a stress response. It contributes to the elevated neutrophil-to-lymphocyte ratio of 4.70.","low_causes":"Viral infection, vitamin B12 or folate deficiency, medications, autoimmune neutropenia, bone marrow disorders","high_causes":"Bacterial infection, acute inflammation, stress (physical or emotional), corticosteroids, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4683","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including T cells (which attack infected cells) and B cells (which produce antibodies). At 1.81, this is within both reference and optimal ranges, indicating a normally functioning adaptive immune system.","low_causes":"Viral infection (acute phase), corticosteroid use, HIV, autoimmune conditions","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"1.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, the cells that engulf pathogens and dead cells and play a key role in chronic inflammation and tissue repair. At 1.25 against an upper limit of 1.0, this is mildly elevated and consistent with the overall inflammatory picture. Monocytosis often accompanies neutrophilia during infection or significant inflammation.","low_causes":"Bone marrow suppression, corticosteroid use","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, recovery phase of acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3375","upper_optimal_position":"0.6125","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. At 0.17, this is within both reference and optimal ranges, indicating no allergic or parasitic activity.","low_causes":"Acute stress or infection (eosinophils are redistributed), corticosteroid use","high_causes":"Allergic conditions (asthma, hay fever, eczema), parasitic infection, drug reactions, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic responses and inflammation. At 0.02, this is within range.","low_causes":"Acute allergic reaction (basophils migrate to tissues), hyperthyroidism, corticosteroid use","high_causes":"Chronic allergic conditions, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3820","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.6","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3383","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, immature red blood cells recently released from the bone marrow. Their count reflects how actively the bone marrow is producing new red cells. At 0.96%, this is within range. In the context of elevated haemoglobin and haematocrit from androgen-driven erythropoiesis, a normal reticulocyte count suggests the polycythaemia is established and stable rather than acutely worsening.","low_causes":"Bone marrow suppression, iron deficiency, B12 or folate deficiency, aplastic anaemia, chronic kidney disease","high_causes":"Blood loss recovery, haemolytic anaemia, effective treatment of nutritional deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"56.064","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4538","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Absolute reticulocyte count gives the actual number of reticulocytes per litre of blood, providing a more direct measure of bone marrow red cell production than the percentage. At 56, this is within range.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic kidney disease","high_causes":"Blood loss recovery, haemolytic anaemia, effective erythropoietin response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"169","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4961","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5960","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. It reflects total iron reserves and is the first marker to change when iron stores are depleted or excessive. At 169 ng/mL, this is within both reference and optimal ranges. However, ferritin is also an acute phase reactant, meaning it rises with inflammation. Given the CRP of 36, the true baseline ferritin may be somewhat lower than this reading. Even accounting for this, ferritin at 169 is a healthy result.","low_causes":"Iron deficiency, chronic blood loss, vegetarian/vegan diet, malabsorption, heavy menstruation","high_causes":"Iron overload (haemochromatosis), chronic inflammation, liver disease, metabolic syndrome, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"13.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3706","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3354","upper_optimal_position":"0.5147","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to its transport protein transferrin. At 13.8 umol/L, this is within both reference and optimal ranges. Serum iron fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin, transferrin, and transferrin saturation for a complete picture.","low_causes":"Iron deficiency, chronic disease, vegetarian/vegan diet, malabsorption","high_causes":"Iron overload (haemochromatosis), liver disease, haemolytic anaemia, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3600","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.2","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3367","upper_optimal_position":"0.5700","units":"g/L","description":"Transferrin is the protein that carries iron in the blood from the gut and storage sites to where it is needed (primarily the bone marrow for red cell production). At 2.27 g/L, this is within both reference and optimal ranges. Transferrin is a negative acute phase protein, meaning it can fall during inflammation. Given the CRP of 36, the true baseline transferrin may be slightly higher, which remains reassuring.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"24.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3891","lower_normal":"18","upper_normal":"55","lower_optimal":"20","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5703","units":"%","description":"Transferrin saturation shows the percentage of transferrin that is loaded with iron. At 24.21%, this is within both reference and optimal ranges, indicating a healthy balance between iron supply and transport capacity.","low_causes":"Iron deficiency, chronic disease","high_causes":"Iron overload (haemochromatosis), liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"50.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4020","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3365","upper_optimal_position":"0.6144","units":"umol/l","description":"Total iron binding capacity (TIBC) measures how much iron the blood could potentially carry, reflecting the total capacity of transferrin. At 50.6 umol/L, this is within range. In iron deficiency the body upregulates transferrin production to catch more iron, raising TIBC. A normal TIBC confirms adequate iron stores.","low_causes":"Iron overload, chronic inflammation, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"89.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, libido, energy, red blood cell production, and mood. The reference range for men is 8.4 to 28.7 nmol/L. At 89.7 nmol/L, this is more than three times the upper limit of the reference range. This level is not achievable through natural physiological production and is consistent with exogenous testosterone or anabolic steroid use. Supraphysiological testosterone drives the pituitary gland to shut down its own signalling (suppressed LH and FSH), increases red blood cell production (explaining the elevated haemoglobin and haematocrit), suppresses SHBG, converts to oestradiol via the aromatase enzyme (explaining the elevated oestradiol), and adversely affects the lipid profile. This requires open discussion with his GP.","low_causes":"Ageing, obesity, pituitary disorders, chronic illness, medications, sleep deprivation, stress","high_causes":"Exogenous testosterone or anabolic steroid use, androgen-producing tumours (rare), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"3.8983","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0.2","upper_normal":"0.62","lower_optimal":"0.3","upper_optimal":"0.62","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4127","upper_optimal_position":"0.6667","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone that is not bound to proteins (SHBG or albumin) and is therefore biologically active, able to enter cells and exert its effects. At 3.8983 nmol/L, this is massively elevated, driven by both the very high total testosterone (89.7 nmol/L) and the profoundly suppressed SHBG (5.6 nmol/L), which means very little testosterone is being bound and inactivated. Typical free testosterone in men is 0.2 to 0.62 nmol/L.","low_causes":"Low total testosterone, elevated SHBG, ageing, obesity","high_causes":"Exogenous testosterone use, suppressed SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1153","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"20","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3389","upper_optimal_position":"0.5556","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to sex hormones, primarily testosterone and oestradiol, controlling how much is biologically active. At 5.6 nmol/L against a lower limit of 17.3, this is profoundly suppressed. Very high androgen levels are the most common cause of markedly low SHBG, as androgens directly suppress SHBG production by the liver. With less SHBG available to bind testosterone, a much larger proportion remains free and active, explaining the Free Androgen Index of 1,601.","low_causes":"Exogenous androgen use, obesity, insulin resistance, hypothyroidism, polycystic ovary syndrome (in women)","high_causes":"Ageing, hyperthyroidism, liver disease, oestrogen therapy, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1601.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) is calculated as (total testosterone / SHBG) x 100. It estimates the proportion of testosterone that is biologically active. At 1,601 against an upper limit of 150, this is more than ten times the upper limit, reflecting the combination of massively elevated total testosterone (89.7) and profoundly suppressed SHBG (5.6). This confirms overwhelming androgen exposure.","low_causes":"Low testosterone, high SHBG","high_causes":"Exogenous testosterone use, very low SHBG, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"556","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In men, it is produced primarily through the conversion of testosterone by the aromatase enzyme, which is found in fat tissue, the liver, and other organs. Small amounts are important for bone health, brain function, and cardiovascular protection. At 556 pmol/L against an upper limit of 146.1, this is nearly four times the upper limit. This extreme elevation is the direct consequence of aromatase converting the excess testosterone in his blood into oestradiol. Elevated oestradiol in men is associated with gynaecomastia (breast tissue development), water retention, mood disturbance, and increased cardiovascular risk. This should be discussed with his GP.","low_causes":"Low body fat, aromatase inhibitor medication, hypogonadism, menopause (in women)","high_causes":"Excess testosterone being aromatised, obesity (increased aromatase in fat tissue), liver disease, oestrogen therapy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"2.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5618","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3370","upper_optimal_position":"0.6204","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in modulating mood, supporting the nervous system, and acting as a precursor to other hormones. At 2.94 nmol/L, this is within both the reference and optimal ranges for men.","low_causes":"Adrenal insufficiency, low body weight","high_causes":"Congenital adrenal hyperplasia, adrenal tumours, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"<0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0016","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3397","upper_optimal_position":"0.6026","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and signals the testes to produce testosterone. At less than 0.07 mIU/mL against a lower limit of 1.5, LH is effectively undetectable. This is the classic finding when the pituitary gland detects supraphysiological testosterone levels and shuts down its own signalling, a process called negative feedback. The pituitary 'recognises' there is already far more testosterone than the body needs and stops asking the testes to make more. Suppressed LH also means the testes are not being stimulated, which has implications for testicular function and fertility.","low_causes":"Exogenous testosterone use, pituitary tumour or damage, anabolic steroid use, severe illness","high_causes":"Primary hypogonadism (testicular failure), Klinefelter syndrome, menopause (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0209","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5354","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and is essential for sperm production in men. At 0.35 mIU/mL against a lower limit of 1.4, FSH is profoundly suppressed, consistent with the same negative feedback mechanism suppressing LH. Without adequate FSH stimulation, the testes cannot maintain normal sperm production, meaning fertility is very likely significantly impaired. If fertility is or may become a goal, this should be discussed with his GP or a fertility specialist.","low_causes":"Exogenous testosterone use, pituitary tumour or damage, anabolic steroid use","high_causes":"Primary testicular failure, Klinefelter syndrome, menopause (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"336","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6182","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3349","upper_optimal_position":"0.6242","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone and cause symptoms such as reduced libido, erectile dysfunction, and breast tissue growth. At 336 uIU/mL against an upper limit of 375, this is within range, though at the higher end. Prolactin can be mildly elevated by stress, recent exercise, or medications. This does not require further investigation at present.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary tumour (prolactinoma), medications (antipsychotics, antidepressants), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"476","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5280","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.6024","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal rhythm, peaking in the morning and falling throughout the day. A morning cortisol between 145 and 619 is considered normal. At 476, this is within both the reference and optimal ranges, indicating normal adrenal function and an appropriate stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disorders","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medication, acute illness, pain","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"8.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5269","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3609","upper_optimal_position":"0.6228","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It is the most abundant steroid hormone in the body and declines with age. At 8.2 umol/L (equivalent to approximately 3,022 ug/dL), this is within range. DHEA-S levels are primarily determined by adrenal function and are less affected by exogenous testosterone use, so this reflects healthy adrenal output.","low_causes":"Adrenal insufficiency, ageing, chronic illness, corticosteroid use","high_causes":"Congenital adrenal hyperplasia, adrenal tumours, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3700","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"0.7","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.4604","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and regulates thyroid function. It works as a feedback signal: when thyroid hormones are low, TSH rises to stimulate the thyroid; when they are adequate, TSH stays low. At 1.13 mIU/L, this is comfortably within the optimal range of 0.7 to 2.5, indicating the pituitary is satisfied with the thyroid hormone levels.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disorders","high_causes":"Hypothyroidism (underactive thyroid), thyroid inflammation, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4881","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"13","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3464","upper_optimal_position":"0.5952","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. At 16.7 pmol/L, this is within both reference and optimal ranges, indicating healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disorders, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5711","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.0","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5933","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism in every cell. It is produced from T4 by conversion enzymes in the liver, kidneys, and other tissues. At 5.8 pmol/L, this is within both reference and optimal ranges, indicating excellent thyroid hormone conversion and cellular thyroid function.","low_causes":"Hypothyroidism, chronic illness (sick euthyroid syndrome), selenium deficiency, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3261","units":"U/ml","description":"TPO (thyroid peroxidase) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence is the hallmark of autoimmune thyroid disease (Hashimoto's thyroiditis). At less than 6.6 U/mL against an upper limit of 13.8, this is negative, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2273","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce thyroid hormones. Like TPO antibodies, their presence indicates autoimmune thyroid disease. At less than 1.3 U/mL against an upper limit of 4.4, this is negative, further confirming that the thyroid is not under autoimmune attack.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"119","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5950","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. It is produced in the skin from sunlight and obtained from a few foods and supplements. Levels below 30 nmol/L are deficient, 30 to 50 insufficient, and above 50 sufficient. The optimal range for health and longevity is considered to be 75 to 125 nmol/L. At 119 nmol/L, this is in the optimal range, suggesting he is either supplementing effectively or getting regular sun exposure. This is an excellent result.","low_causes":"Insufficient sun exposure, dark skin, obesity (fat sequesters vitamin D), malabsorption, northern latitude, winter months","high_causes":"Over-supplementation, excessive sun exposure (rare to cause very high levels)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3827","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3392","upper_optimal_position":"0.5059","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by four tiny glands behind the thyroid and regulates calcium levels. When calcium falls, PTH rises to increase calcium absorption from the gut, release calcium from bone, and reduce calcium loss through the kidneys. At 1.6 pmol/L, this is within both reference and optimal ranges, consistent with the healthy calcium levels in this report.","low_causes":"Hypoparathyroidism, excessive calcium or vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, primary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"772","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5754","lower_normal":"193","upper_normal":"982","lower_optimal":"400","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3596","upper_optimal_position":"0.6232","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. Deficiency causes fatigue, neurological symptoms, and a specific type of anaemia with large red blood cells. At 772 pg/mL, this is within both reference and optimal ranges, indicating excellent B12 status. This is consistent with adequate intake from animal products in his balanced diet.","low_causes":"Vegetarian/vegan diet, pernicious anaemia, malabsorption, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in cell division, DNA synthesis, and red blood cell production. At 12 ng/mL, this is within both reference and optimal ranges, indicating good intake from green vegetables, legumes, and fortified foods.","low_causes":"Poor diet, alcohol excess, malabsorption, medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Over-supplementation, B12 deficiency (folate can accumulate when B12 is deficient)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"zinc","name":"Zinc","group":"VITAMINS & NUTRIENTS","result":"16.518","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5416","lower_normal":"11","upper_normal":"19.5","lower_optimal":"13","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3569","upper_optimal_position":"0.6137","units":"umol/L","description":"Zinc is an essential mineral involved in immune function, wound healing, testosterone production, and over 300 enzyme reactions. At 16.518 umol/L, this is within both reference and optimal ranges, indicating adequate zinc intake and status.","low_causes":"Poor diet, vegetarian/vegan diet, malabsorption, chronic diarrhoea, alcohol excess","high_causes":"Over-supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igf","name":"IGF-1","group":"GROWTH FACTORS","result":"22.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5340","lower_normal":"8.24","upper_normal":"29.15","lower_optimal":"15","upper_optimal":"29.15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3323","upper_optimal_position":"0.6667","units":"nmol/l","description":"IGF-1 (insulin-like growth factor 1) is produced primarily by the liver in response to growth hormone. It drives cell growth and repair throughout the body. At 22.9 nmol/L, this is within the age-appropriate range for a 35 to 39-year-old (8.24 to 29.15). A healthy IGF-1 supports muscle recovery, bone density, and tissue repair. From a longevity perspective, there is an ongoing discussion about whether very high IGF-1 may accelerate ageing, so a level in the middle-to-upper range is generally considered favourable.","low_causes":"Malnutrition, growth hormone deficiency, liver disease, chronic illness","high_causes":"Growth hormone excess (acromegaly), high protein intake, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"149","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4627","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle tissue (skeletal muscle, heart, and brain). It is released into the blood when muscle cells are damaged or under stress, such as after intense exercise. At 149 U/L against a male range of 40 to 320, this is within range and suggests he is recovering adequately from his resistance training. A CK above 320 after heavy training is common and not necessarily concerning, but his level here is unremarkable.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury (rhabdomyolysis), heart attack, muscular dystrophy, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"9.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4702","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3386","upper_optimal_position":"0.6228","units":"g/l","description":"IgG is the most abundant immunoglobulin (antibody) in the blood and provides long-term immunity against infections. At 9.2 g/L, this is within both reference and optimal ranges, indicating a healthy adaptive immune system with normal antibody production.","low_causes":"Immune deficiency, medications (immunosuppressants), chronic kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6133","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. At 1.4 g/L, this is within both reference and optimal ranges.","low_causes":"Immune deficiency, chronic lymphocytic leukaemia","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macrogl bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

  setTimeout(()=>animateBarsIn(document), 200);
}
