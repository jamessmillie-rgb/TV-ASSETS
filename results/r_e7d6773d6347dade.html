<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Charles Spencer","dob":"03/07/1953","report_date":"2026-10-02","summary":"Charles is a 73-year-old male presenting with a BMI of 23.8, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. He trains five times per week, three cardio and two resistance sessions, with 5,000 to 7,500 daily steps. He consumes more than seven alcoholic drinks per week and reports sleeping less than six hours most nights. He reports low energy and fatigue. His goals are to lose body fat and improve energy levels.\n\nThe most important finding in this report is microscopic blood in Charles's urine. His urinary red blood cell count is 90, well above the threshold of 25 that is considered significant. There is no sign of infection: white cells are below 1, nitrites are negative, bacterial count is below 1, and culture shows no growth. At 73, painless microscopic haematuria, which means blood in the urine that is not visible to the naked eye, needs urological investigation to rule out bladder and kidney causes. This is not a reason to panic, as the majority of cases at this age turn out to be benign, but it is the finding that should go to his GP first. The GP will likely arrange an ultrasound of the urinary tract and a referral for cystoscopy, which is a camera examination of the bladder.\n\nThe second finding for the GP is Charles's thyroid. TSH, which is thyroid stimulating hormone, the signal the brain sends to the thyroid gland to produce more hormone, is 4.85 against an upper limit of 4.78. This is only marginally above range, but it matters because his free T4, the active thyroid hormone that drives metabolism, is 13.8 against a range of 11.5 to 22.7, sitting in the bottom quarter. That pattern, a TSH pushing upward while free T4 sits low, means the brain is having to shout louder to get the thyroid to produce adequate hormone. Importantly, both thyroid antibodies, TPO at below 6.6 and thyroglobulin at below 1.3, are clearly negative, which means this is not an autoimmune process such as Hashimoto's thyroiditis. It is subclinical hypothyroidism without an autoimmune driver. His free T3, the form of thyroid hormone the body actually uses in cells, is 4.8, which is within range and shows the thyroid is still converting adequately for now. Nevertheless, a sluggish thyroid is one of the most common causes of persistent fatigue at this age, and it also slows LDL cholesterol clearance, which is relevant to his lipid results below. The GP should repeat TSH and free T4 in six to eight weeks to confirm the pattern, and if it persists, a trial of levothyroxine may be appropriate.\n\nCharles's ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and acts as a broad marker of inflammation, is 36 against an upper limit of 12. This is a significant elevation. His hs-CRP, a more specific inflammation marker produced by the liver, is 2.1, which is above the ideal of below 1.0 but within the laboratory limit of 5. The two markers measure different things: CRP responds quickly to acute inflammation while ESR reflects a more chronic, ongoing process and is also influenced by age, anaemia, and the protein content of blood. At 73, ESR does tend to drift upward, and a commonly cited rule of thumb for males is that the upper normal is roughly half the age, which would put Charles's limit around 36 to 37. His result sits right on that boundary. His globulin at 35, near the top of its range of 18 to 36, may be contributing because higher globulin levels make red cells clump and settle faster. The combination of a raised ESR with a mildly raised CRP and globulin near the top of range is worth the GP noting. It does not point to a specific condition, but alongside the haematuria, it adds a reason to investigate rather than wait.\n\nCharles's cardiovascular risk score, a TrueVitals index built from his lipid markers, inflammation and blood sugar, is 65 out of 100, which is elevated. The main drivers are his ApoB and LDL cholesterol. ApoB, which stands for apolipoprotein B and represents the number of cholesterol-carrying particles in the blood, is 1.23 against a desirable level of below 0.9. Each ApoB particle can deposit cholesterol into artery walls, so this number is a direct measure of the traffic driving atherosclerosis. His LDL cholesterol, the so-called bad cholesterol, is 3.37 against an ideal of below 2.6, and his Lp(a)-corrected LDL, which strips out the portion contributed by inherited lipoprotein(a), is 3.29, showing that virtually all of his LDL is modifiable through diet and lifestyle. His total cholesterol is 5.7 against a desirable level of below 5.18, and his non-HDL cholesterol is 3.9 against a limit of 4.0. The good news within the lipid panel is substantial. His HDL cholesterol, the protective fraction that carries cholesterol away from artery walls, is 1.8, which is excellent and well above the desirable threshold of 1.55. His ApoA1, the protein that forms HDL particles, is 1.92, also excellent. His ApoB to ApoA1 ratio is 0.64, below the lower-risk threshold of 0.7, which means the balance between harmful and protective particles is still favourable. His triglycerides at 1.31 are within the fasting target of below 1.7, and his triglyceride-to-HDL ratio at 0.73 is well within the optimal range of below 0.87, which is a strong marker of metabolic health. His Lp(a), the inherited lipoprotein that independently drives cardiovascular risk and cannot be changed through lifestyle, is below 25, comfortably below the 32 threshold. This is genuinely useful information because it confirms that his elevated LDL and ApoB are driven entirely by modifiable factors, principally diet, and that there is no inherited Lp(a) contribution adding risk on top. The thyroid finding is relevant here: subclinical hypothyroidism slows the liver's clearance of LDL particles, so correcting the thyroid may itself improve the lipid picture.\n\nTurning to the positives, and there are many, Charles's blood sugar control is in excellent shape. His fasting glucose at 4.9 is comfortably within the ideal range. His HbA1c, which reflects average blood sugar over the preceding two to three months, is 41 mmol/mol, just below the pre-diabetes threshold of 42 and within the optimal range. His fasting insulin at 4.51 is low and healthy, and his HOMA-IR, which is a calculated index of insulin resistance derived from glucose and insulin, is 0.98, below 1.0 and therefore in the insulin-sensitive category. At 73 with a BMI of 23.8, this is an excellent metabolic profile. His C-peptide, a protein released alongside insulin that reflects how much insulin the pancreas is producing, is 1.01, marginally below the lower limit of 1.1. However, with a fasting glucose of 4.9 and an HbA1c of 41, this simply reflects low insulin demand rather than any pancreatic insufficiency. The pancreas is producing exactly as much insulin as it needs to, which is not much, and that is a positive.\n\nHis liver is healthy. ALT at 16 and AST at 29 are both within range, and his GGT at 54, while within the male range of 4 to 73, is above the optimal level of below 25. GGT is the liver enzyme most sensitive to alcohol, and at more than seven drinks per week, this is the most likely driver. The liver is handling the alcohol without frank damage, but GGT at this level is a signal that the liver is working harder than it needs to. His FIB-4 score, a calculated index of liver scarring built from age, AST, ALT and platelets, is 2.31 against a general threshold of 1.45. However, at 73, the age-adjusted threshold is 2.0, and the score is being pushed up primarily by age itself. His ALT at 16 is genuinely low, and a low ALT makes the denominator of the FIB-4 calculation small, which inflates the result. With GGT, ALT, AST, bilirubin and albumin all within normal limits, there is no clinical evidence of liver scarring. The APRI score at 0.317 and the NAFLD fibrosis score at minus 0.688 both support this: neither suggests significant fibrosis. His De Ritis ratio, AST divided by ALT, at 1.81 is above the normal upper limit of 1.6. In isolation this pattern can suggest alcohol-related liver effects, as alcohol tends to raise AST more than ALT. Again, with all other liver markers clean, this is a signal to moderate alcohol rather than a sign of established disease.\n\nHis kidney function shows mild reduction. Cystatin C, a small protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, especially at this age, is 1.22 against a limit of 1.1. The eGFR calculated from both creatinine and cystatin C is 65, which sits above the 60 threshold for chronic kidney disease but below the ideal of 90. At 73, some decline in kidney function is expected, and 65 is within the range commonly seen in healthy older adults. His urea, electrolytes, and urea-to-creatinine ratio are all well within range, and there is no protein in his urine, which is reassuring. This is a finding to monitor at his next blood test rather than one that needs action now, but it is worth the GP recording.\n\nCharles's iron studies are well balanced. His ferritin at 110 sits comfortably in the optimal range for a man, his serum iron is 20.4, transferrin saturation is 26.8 percent within the optimal band of 25 to 40 percent, and his TIBC and transferrin are both healthy. His haemoglobin at 167 is at the top of the male range, and his red cell count, haematocrit and reticulocyte count are all within range. His white cell count at 5.95, with a balanced differential, neutrophils at 2.85, lymphocytes at 2.4, and his NLR at 1.19, all suggest a normally functioning immune system. His immunoglobulins IgG, IgM, IgA and IgE are all within range, rheumatoid factor is negative, and coeliac screen is negative.\n\nHis prostate markers are reassuring. PSA at 0.38 is very low for a 73-year-old man, well below the age-adjusted threshold of 6.5, and the free-to-total PSA ratio at 31.6 percent is strongly in the reassuring range above 25 percent. His tumour markers CA19-9 and CEA are both within normal limits.\n\nHis vitamin D at 111 is excellent, sitting within the optimal range of 75 to 120. His B12 at 653 is healthy and within the optimal range of 500 to 900. His folate is above 24 against an upper limit of 17, which is above range. Folate at this level is almost always from dietary intake of leafy greens and fortified foods or a supplement, and excess folate is water-soluble and excreted, so this is not harmful. His calcium, corrected calcium, phosphate, PTH and magnesium are all within their optimal ranges. Creatine kinase at 61 is low and normal, reflecting no muscle damage.\n\nHis hormones are broadly acceptable for 73. Testosterone at 14.4 is above the lower limit of 8.4 but below the optimal level of 18. At 73, some decline in testosterone is physiological, and his free testosterone at 0.301 and bioavailable testosterone at 6.89 are both within range, which means his SHBG is not binding too much of it. His DHEA-S at 2.6 is within range. His cortisol at 605, a morning stress hormone, is at the top of the morning range of 145 to 619 and is flagged as above range. However, this is a single morning reading, and cortisol is highly variable depending on time of collection, stress, and sleep. Given that Charles sleeps less than six hours most nights, a cortisol at the top of range is expected: short sleep drives cortisol higher. LH and FSH are both low-normal, which is appropriate alongside a testosterone that, while not optimal, is not critically low. Oestradiol at 133 is within the male range. Prolactin at 216 is within range.\n\nHis progesterone at 0.88 is marginally below the lower limit of 0.89. In men, progesterone plays a minor role and this fractional difference has no clinical significance. His MCH at 32.7 is marginally above the upper limit of 32. MCH, which stands for mean corpuscular haemoglobin and represents the average amount of haemoglobin per red cell, is commonly slightly above range when MCV is at the higher end of normal, as his is at 95.1, and at this margin it is a laboratory variation rather than a clinical concern.\n\nHis total antioxidant activity at 2.11 is above the upper range of 1.77. This is typically elevated by dietary antioxidants, supplements, or moderate alcohol intake, and is not a negative finding.\n\nCharles's PhenoAge, a biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 69.5 against a calendar age of 73, placing him three and a half years younger biologically. The mildly raised CRP and the creatinine at the top of range are the markers pulling this score upward; improving CRP through the lifestyle changes below would push PhenoAge further in the favourable direction.\n\nReturning to Charles's main symptom of low energy and fatigue, several findings are relevant. The subclinical hypothyroidism, with TSH above range and free T4 sitting low, is the most likely blood-based contributor: even mild thyroid underactivity can cause persistent tiredness, difficulty concentrating and reduced exercise tolerance. Sleeping less than six hours most nights is the other major contributor that blood cannot measure but the evidence strongly supports. Chronic short sleep raises cortisol, which his result at the top of range confirms, impairs glucose metabolism, blunts testosterone production and reduces subjective energy independently of anything else. More than seven drinks per week will also impair sleep quality even when it does not prevent sleep onset, fragment deep sleep stages, and reduce morning energy. The combination of a mildly underactive thyroid, chronic sleep restriction and regular alcohol is more than sufficient to explain persistent fatigue at 73, and addressing all three together is the plan most likely to make a tangible difference.","links":"The thread that ties these results together begins with the thyroid. Charles's TSH is marginally above range and his free T4 is in the bottom quarter of its range, a pattern called subclinical hypothyroidism. Both thyroid antibodies are clearly negative, so this is not autoimmune in origin. Subclinical hypothyroidism does two things that are visible elsewhere in this report: it slows the liver's clearance of LDL particles, contributing to the elevated ApoB and LDL cholesterol, and it reduces metabolic rate, contributing to fatigue. Correcting the thyroid, if the GP confirms the pattern on a repeat test, may improve both the lipid picture and the energy levels without any other intervention.\n\nThe lipid results themselves tell a split story. The harmful side, ApoB at 1.23 and LDL at 3.37, is elevated and driving the cardiovascular risk score of 65. The protective side, HDL at 1.8, ApoA1 at 1.92, triglycerides at 1.31, and a TG-to-HDL ratio of 0.73, is genuinely excellent. The Lp(a) at below 25 is the finding that resolves the tension: because there is no inherited lipoprotein(a) contribution, the entire LDL and ApoB elevation is modifiable through diet, thyroid correction and, potentially, medication. The ApoB-to-ApoA1 ratio at 0.64 is still below the lower-risk threshold, but with ApoB this high, the ratio alone should not provide false reassurance.\n\nThe inflammation markers form a separate thread. ESR at 36 is high, CRP at 2.1 is above ideal, and globulin at the top of range may be contributing to the ESR. At 73, ESR does rise with age and his result sits on the commonly used age-adjusted boundary. Taken alone, these numbers might be age-related. Taken alongside urinary red blood cells at 90, they add weight to the need for investigation: the GP should be aware that there is both microscopic haematuria and a mildly raised inflammatory profile.\n\nThe urinary finding stands somewhat apart. Microscopic haematuria at this level, with no infection and no protein, is most likely benign, with causes ranging from an enlarged prostate to a small bladder polyp to vigorous exercise or even aspirin use. But at 73, the standard of care is to investigate it to rule out bladder or kidney pathology, and the raised ESR makes that investigation more pressing.\n\nWhat was excluded is as important as what was found. The metabolic panel is clean: glucose, HbA1c, insulin and HOMA-IR are all excellent. Iron stores and haemoglobin are healthy. Kidney function is mildly reduced but stable and without proteinuria. Liver enzymes are normal apart from the GGT signal. Prostate markers are very reassuring. Tumour markers are normal. Immune function and coeliac screen are clear. The two loose ends are the thyroid, which needs a confirmatory repeat, and the haematuria, which needs imaging and likely cystoscopy.","lifestyle":"Prioritise sleep above everything else in this report. Set a fixed wake time seven days a week and work backwards to create a seven-hour sleep window. Anchor: choose the time now and set an alarm for it, including weekends. Why: sleeping under six hours keeps cortisol elevated, which his result at 605 confirms, and drives fatigue more than any supplement or dietary change can fix.\n\nCut caffeine after midday. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, meaning an afternoon coffee at 3pm still has half its stimulant effect at 9pm, shortening the deep sleep that restores energy.\n\nReduce alcohol to no more than four drinks per week, ideally fewer, with at least three consecutive alcohol-free days. Anchor: designate Monday to Wednesday as alcohol-free and stick to that pattern. Why: alcohol above this level is the most likely driver of his GGT at 54 and De Ritis ratio at 1.81, it fragments deep sleep, and it raises CRP.\n\nAdd two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: replace two evening meals that currently include red or processed meat. Why: omega-3 fatty acids lower triglycerides and ApoB, reduce CRP, and improve the ApoB-to-ApoA1 ratio that is currently 0.64.\n\nAdd a daily portion of soluble fibre: oats at breakfast, a handful of almonds, or a tablespoon of ground flaxseed stirred into yoghurt. Anchor: breakfast, before anything else. Why: soluble fibre binds bile acids and pulls LDL cholesterol out of circulation, which is the most effective dietary lever for his ApoB of 1.23.\n\nWalk for fifteen to twenty minutes after the largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers glucose and insulin response and supports the excellent metabolic profile he already has, while also contributing to the fat-loss goal.\n\nCharles's calorie target for gradual fat loss at his current weight of 73 kg, height of 175 cm, age and activity level is approximately 1,850 to 1,950 calories per day, based on a maintenance estimate of around 2,200 to 2,300 calories. His protein target is 95 to 115 grams per day, or roughly 1.3 to 1.6 grams per kilogram of body weight, which supports muscle preservation during any weight loss and is important for maintaining testosterone and metabolic rate at 73.","flags":"Urinary RBCs 90 (significant above 25). No infection markers: WBC below 1, nitrites negative, culture no growth. At 73, painless isolated microscopic haematuria requires urological investigation including renal tract ultrasound and cystoscopy referral to exclude bladder and kidney pathology.\n\nTSH 4.85 (above upper limit 4.78) with FT4 13.8 (bottom quarter of 11.5 to 22.7 range). Both TPO and thyroglobulin antibodies negative. Non-autoimmune subclinical hypothyroidism. FT3 4.8 adequate. Recommend repeat TSH and FT4 in six to eight weeks to confirm; if persistent, consider levothyroxine trial. Thyroid underactivity may be contributing to LDL elevation and fatigue.\n\nESR 36 (limit 12). hs-CRP 2.1 (above ideal of 1.0, within lab limit of 5). Globulin 35, near top of range. ESR sits on the age-adjusted boundary for a 73-year-old male. The combination of raised ESR and CRP alongside haematuria adds weight to the need for investigation.\n\nApoB 1.23 (desirable below 0.9). LDL 3.37 (ideal below 2.6). Lp(a)-corrected LDL 3.29, confirming virtually all LDL is modifiable. Total cholesterol 5.7 (desirable below 5.18). Non-HDL 3.9. However, HDL 1.8 excellent, ApoA1 1.92 excellent, TG:HDL 0.73 optimal, ApoB:A1 ratio 0.64 below lower-risk threshold. Cardiovascular risk score 65 out of 100. Dietary modification first line; thyroid correction may independently lower LDL. Discuss statin consideration with GP if diet and thyroid correction do not bring ApoB below 0.9 in six months.\n\nCystatin C 1.22 (above limit 1.1). eGFR 65 (above CKD threshold of 60 but below ideal of 90). Age-appropriate mild decline. No proteinuria. Electrolytes normal. Monitor at next test.\n\nGGT 54 (within lab range 4 to 73 but above optimal 25). De Ritis ratio 1.81 (above 1.6). Pattern consistent with regular alcohol intake. ALT, AST, bilirubin, albumin all normal. FIB-4 2.31 driven by age and low ALT denominator; APRI 0.317 and NAFLD score minus 0.688 both reassure against fibrosis.\n\nCortisol 605 (top of morning range 145 to 619, marginally above). Single morning sample. Sleep restriction under six hours most likely driver. Not actionable in isolation but consistent with chronic sleep debt.\n\nC-Peptide 1.01 (below lower limit 1.1). With glucose 4.9, HbA1c 41 and HOMA-IR 0.98, this reflects low insulin demand rather than pancreatic insufficiency. Not a concern.\n\nFolate above 24 (upper limit 17). Likely dietary or supplemental. Water-soluble, excreted in excess. Not harmful.\n\nProgesterone 0.88 (lower limit 0.89). Clinically insignificant in men at this fractional margin. MCH 32.7 (upper limit 32). Marginal, consistent with MCV at 95.1. Neither requires action.\n\nReassuring negatives: PSA 0.38 with free ratio 31.6 percent, strongly reassuring for prostate. CA19-9 and CEA normal. Coeliac screen negative. Rheumatoid factor negative. IgE normal. Fasting glucose, HbA1c and insulin excellent. Iron studies well balanced. Haemoglobin and full blood count normal. Vitamin D 111 optimal. B12 653 optimal. Calcium, magnesium and phosphate all optimal. Amylase and lipase normal.","recommendations":"Discuss the urinary red blood cell count of 90 with the GP. At 73 with no infection markers, this needs renal tract ultrasound and likely cystoscopy referral. Bring this report showing the full urinalysis panel.\n\nDiscuss the thyroid result: TSH 4.85 above range with FT4 13.8 in the lower quarter, antibodies negative. Request a repeat TSH and FT4 in six to eight weeks. If the pattern persists, discuss a trial of levothyroxine, which may also improve the LDL cholesterol and fatigue.\n\nDiscuss the ESR of 36 alongside the haematuria. The GP should be aware of both the raised inflammatory marker and the urinary blood when planning investigations.\n\nDiscuss the lipid profile: ApoB 1.23 and LDL 3.37, with the context that Lp(a) is normal so the entire elevation is modifiable. Request a lipid review in six months after dietary changes and thyroid correction. If ApoB remains above 0.9, discuss statin therapy.\n\nNote the eGFR of 65 and Cystatin C of 1.22 for monitoring. No action needed now, but kidney function should be checked at the next annual blood test.\n\nRetest in six months with: TSH, FT4, lipid panel including ApoB, hs-CRP, ESR, Cystatin C, and a repeat urinalysis. Calorie target for gradual fat loss: 1,850 to 1,950 calories per day. Protein target: 95 to 115 grams per day.","supplementation":"Vitamin D3 (cholecalciferol): continue current intake at 2,000 IU daily with a fat-containing meal to maintain his excellent level of 111. Always take with vitamin K2 (MK-7) at 100 mcg daily, which directs calcium into bone rather than arteries.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: supports the reduction of ApoB from 1.23 toward 0.9, lowers CRP from 2.1 toward below 1.0, and complements the dietary oily fish recommendation.\n\nMagnesium glycinate: 300 mg before bed. Why: supports sleep quality, which is Charles's most important lifestyle change, and his magnesium at 0.93 is within range but has room to move toward the top of optimal.\n\nDo not take iron supplements. Charles's ferritin at 110 and transferrin saturation at 26.8 percent are healthy, and additional iron at these levels could push stores above the ideal range.\n\nThe most important changes from this report are not supplements. They are sleeping seven hours instead of under six, reducing alcohol to four or fewer drinks per week, and adding soluble fibre and oily fish to lower ApoB.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 59.5; held to 59 by a system rated \"See your GP\". Weakest systems: urinalysis 0%, lipids & cardiovascular 31%, inflammation 37%. Biggest drags: Apolipoprotein B, LDL Cholesterol, Cystatin C, Gamma GT.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"69.5","within_normal":"T py are the levers to bring this score down.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found mainly inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood and the level rises. Charles's ALT at 16 is well within range and below the optimal threshold of 30 for men, indicating the liver cells are healthy and under no metabolic strain.","low_causes":"","high_causes":"Fatty liver disease, alcohol excess, hepatitis, medication effects, obesity, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart and muscle. It is less liver-specific than ALT because exercise or muscle damage can also raise it. Charles's AST at 29 is within the optimal range and well within the laboratory limits, confirming healthy liver and muscle tissue.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, alcohol excess, muscle damage, intense exercise, heart damage, medication effects","padding":"1","one_sided":"0.5","range_type":" padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"2.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1872","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3745","units":"score","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis, or scarring, from age, AST, ALT and platelet count. Charles's score of 2.31 is above the general threshold of 1.45, but at 73 the age-adjusted threshold is 2.0. Importantly, his low ALT of 16 makes the denominator of the formula small, which mathematically inflates the score, and age itself is the largest contributor. With ALT, AST, GGT, bilirubin and albumin all within normal limits, and the APRI score at 0.317 and NAFLD fibrosis score at minus 0.688 both reassuring, there is no clinical evidence of liver scarring. The score is being driven by the calculation rather than by any sign of liver disease.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.317","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1057","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"The AST-to-Platelet Ratio Index estimates liver fibrosis from AST and platelet count. Charles's APRI at 0.317 is well within the optimal range, providing additional reassurance that there is no significant liver scarring despite the elevated FIB-4.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_typ const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
