<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

thyroid gland that characterises Hashimoto's thyroiditis. What this pattern suggests is mild, non-autoimmune subclinical hypothyroidism, a state where the pituitary is having to push a little harder to maintain thyroid output. At 73 this is common and often monitored rather than treated, but it is worth discussing with his GP because it could be contributing to his fatigue, and his FT4 sitting so low in the range means the thyroid is not responding to that extra push as fully as it could. A repeat TSH and FT4 in three months will show whether this is stable or progressing.\n\nHis ESR, or erythrocyte sedimentation rate, is 36, three times the upper limit of 12. ESR measures how quickly red blood cells settle in a tube and rises with inflammation, infection, tissue damage and a range of other causes. At 73, ESR drifts upward with age and is less specific than it is in younger people, but a reading of 36 is high enough to warrant attention. His CRP, a more precise inflammation marker, is 2.1, which is below the laboratory ceiling of 5 but above the ideal threshold of 1.0. The two together suggest a genuine low-grade inflammatory process. This could be driven by several things: the alcohol intake, the sleep restriction, visceral fat even at a healthy BMI, early joint wear, or an occult process that the haematuria might also be pointing toward. His GP should be aware of both the ESR and the CRP alongside the urine finding, because investigating the haematuria may also explain the inflammation.\n\nTurning to what is working well, and there is a good deal here. His blood sugar control is excellent. Fasting glucose is 4.9 and HbA1c is 41 mmol per mol, both comfortably within healthy limits. His fasting insulin is 4.51, which is low in the best possible sense: the pancreas is producing very little insulin because it does not need to, and his HOMA-IR of 0.98 confirms he is insulin-sensitive. This is a genuinely impressive metabolic picture at 73 and suggests his diet and activity levels are keeping glucose handling in excellent shape. His C-Peptide, a marker of how much insulin the pancreas is actually secreting, is 1.01, marginally below the laboratory range of 1.1 to 4.4. In the context of a perfectly healthy glucose, a perfectly healthy HbA1c and a low insulin, this is not a sign of pancreatic failure. It simply reflects low insulin demand. The pancreas is making exactly what it needs to, and it happens to be a small amount.\n\nHis kidney function deserves careful framing. His creatinine-based eGFR and his Cystatin C-based eGFR both come in at 65, which is above the threshold of 60 that defines chronic kidney disease but below the ideal of 90. Cystatin C is a protein filtered by the kidneys that is not affected by muscle mass, making it a more reliable measure than creatinine alone, especially in older adults. At 73, a gradual decline in kidney filtration is expected, and 65 is within the range that would be considered normal ageing rather than disease. However, it is worth having this recorded so the GP can track it over time, particularly since the urea at 5.8, the sodium at 139 and the urea-to-creatinine ratio at 58.6 are all healthy, suggesting the kidneys are handling their workload well and this is a filtration rate finding rather than a sign of kidney damage. His Cystatin C itself at 1.22 is above the reference limit of 1.1, but this is entirely consistent with the eGFR of 65 and does not add a separate concern.\n\nHis liver panel is reassuring in the ways that matter most. ALT is 16 and GGT is 54, both within their laboratory ranges. AST is 29, also within range. Bilirubin, albumin, alkaline phosphatase, amylase and lipase are all healthy. His FIB-4 score, a calculation that estimates liver scarring using age, platelets, AST and ALT, comes in at 2.31, which is above the general threshold of 1.45. However, the laboratory itself notes that in people over 65, the threshold rises to 2.0, and even then, in the absence of other clinical indicators, a score below 2 can be insignificant. At 73, the age term in the FIB-4 formula pushes the score up regardless of liver health. His actual liver enzymes are clean, his albumin is healthy at 42, and there is no sign of synthetic liver dysfunction. His APRI score of 0.317, another fibrosis estimate, is well within the safe zone below 0.5. The De Ritis ratio, AST divided by ALT, is 1.81, above the ideal range of 0.8 to 1.3. This ratio rises when AST is higher than ALT, which can be seen with alcohol use, cardiac muscle turnover or simply age. Given that his ALT is very low at 16, the ratio is being inflated by the denominator rather than by a genuinely high AST. His GGT at 54 is within the male range of 4 to 73, but it is above the ideal threshold of 25 and, combined with more than seven drinks per week, suggests the liver is working harder than it would without alcohol. The liver is coping, but it is not unstressed.\n\nHis lipid profile is the area where lifestyle change can make the most difference. His total cholesterol is 5.7, above the desirable threshold of 5.18. His LDL cholesterol, the particles that deposit cholesterol into artery walls, is 3.37, above the ideal ceiling of 3.0. His ApoB, which counts the actual number of atherogenic particles in the blood and is a more accurate measure of cardiovascular risk than LDL alone, is 1.23, well above the target of 0.9 and classified by the laboratory as high. Against this, his HDL cholesterol is an excellent 1.8, well above the desirable level of 1.55, and his ApoA1, the protein on HDL particles, is a strong 1.92. His triglycerides are 1.31, within the healthy range. His ApoB-to-ApoA1 ratio is 0.64, below the lower-risk threshold of 0.7, which is the single best summary of the balance between particles putting cholesterol in and particles taking it out, and it is favourable. His Lp(a), or lipoprotein little a, is below 25, which is normal. This is genuinely useful information because Lp(a) is entirely inherited and cannot be changed, so a normal result means his elevated LDL and ApoB are driven entirely by modifiable factors: diet, exercise and potentially alcohol. His Lp(a)-corrected LDL is 3.29, confirming that almost all of his LDL is the conventional, modifiable type. His cardiovascular risk score, a TrueVitals composite built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 65 out of 100. This is high. It is driven primarily by the ApoB of 1.23 and the LDL of 3.37, with the CRP of 2.1 adding to it. The score measures the risk being built in the arteries, not the ten-year probability of a heart attack, but at 73 the two are less far apart than they would be in a younger man, and bringing the ApoB below 0.9 is the single most important target for reducing it. His remnant cholesterol, the cholesterol carried on VLDL and intermediate particles, and his atherogenic index of plasma are both within ideal limits, which means the lipid problem is a straightforward LDL and ApoB story, not a triglyceride-driven one.\n\nHis iron studies are in good order. Ferritin at 110 is comfortably within the healthy range and sits inside the ideal window of 50 to 200. Serum iron, transferrin, transferrin saturation and iron binding capacity are all within range. His haemoglobin at 167 is within the male range of 130 to 170, his red cell count and haematocrit are healthy, and his reticulocyte count at 1.26 percent and reticulocyte absolute at 64 show normal red cell production. His MCH, or mean corpuscular haemoglobin, is 32.7, marginally above the upper limit of 32. This measures the average amount of haemoglobin packed into each red cell. At this margin, with a normal MCV of 95.1, a normal MCHC of 343 and no other haematological abnormality, it is a trivial overshoot that does not indicate disease. His white cell count, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within healthy ranges. His platelets at 229 and MPV at 8.5 are both normal.\n\nHis immune system is working well. IgG, IgM, IgA and IgE are all within their respective ranges, rheumatoid factor is negative, and his coeliac screen is negative. His total antioxidant activity at 2.11 is above the laboratory range of 1.3 to 1.77. This marker measures the total capacity of the blood to neutralise free radicals and is commonly elevated by dietary antioxidants, supplements, tea, coffee and red wine. It is not a concern.\n\nHis vitamin and mineral status is largely excellent. Vitamin D at 111 is well within the optimal range of 75 to 120, suggesting he is either supplementing or getting good sun exposure. Vitamin B12 at 653 is healthy. Folate is above 24, above the laboratory range of 3 to 17, which is common with supplementation or a folate-rich diet and is not harmful. Calcium, corrected calcium, phosphate and magnesium are all within healthy ranges, and his PTH at 2.1 confirms the calcium-regulating system is working properly.\n\nHis hormonal profile is reasonable for 73. Testosterone at 14.4 is within the laboratory range of 8.4 to 28.7, though below the optimal threshold of 18 that would be considered ideal. Free testosterone at 0.301 and bioavailable testosterone at 6.89 are both within range. SHBG at 32.5 is healthy. His free androgen index is 44.3, within range. At 73, a testosterone of 14.4 is expected and would not typically warrant replacement unless symptoms were significant and other causes had been excluded. His fatigue is more likely to be explained by the thyroid, the sleep restriction and the inflammation than by the testosterone level. His cortisol at 605 is at the very top of the morning reference range of 145 to 619. This is consistent with a stress response, chronic sleep deprivation, or simply a blood draw taken early in the morning when cortisol is naturally at its peak. It is not diagnostic of Cushing's syndrome, which would typically produce much higher values with additional clinical features, but it fits with his pattern of less than six hours of sleep most nights and the general picture of a body running on too little rest. LH at 1.83 and FSH at 2.64 are both within range, and prolactin at 216 is normal. Oestradiol at 133 is within the male range. Progesterone at 0.88 is marginally below the lower limit of 0.89. In men, progesterone levels are naturally very low and this fractional shortfall has no clinical significance. DHEA-S at 2.6 umol/L is within range.\n\nHis prostate markers are reassuring. PSA at 0.38 is very low, and the free PSA ratio of 0.316, which is well above the 0.19 threshold, adds further reassurance. His tumour markers CA19-9 at 23.58 and CEA at 1.68 are both within normal limits.\n\nHis PhenoAge, a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 71.7 years against a calendar age of 73, placing him 1.3 years younger biologically. The CRP of 2.1 and the eGFR of 65 are the two markers pulling the score upward, and addressing the inflammation and supporting kidney function through hydration and reducing alcohol could widen the gap further in his favour.\n\nHis creatine kinase at 61 is healthy and shows no unusual muscle damage from training. His NAFLD fibrosis score at minus 0.688 is within range and does not suggest non-alcoholic fatty liver disease.\n\nTo return to his main symptom: fatigue. The thyroid is the most plausible blood-based contributor. A TSH of 4.85 with an FT4 in the bottom quarter of range means the thyroid is underperforming slightly, and subclinical hypothyroidism is a well-recognised cause of tiredness, particularly in older adults. However, his sleep is almost certainly the larger driver. Less than six hours most nights is below the minimum that the body needs for recovery, hormone regulation and cognitive function at any age, and at 73 the consequences are amplified. Chronic short sleep raises cortisol, which his result of 605 at the ceiling of the morning range is consistent with, increases systemic inflammation, which his ESR of 36 and CRP of 2.1 may partly reflect, and directly causes daytime fatigue regardless of what the blood shows. The alcohol intake compounds this: more than seven drinks per week disrupts sleep architecture even when it does not prevent sleep onset, reducing the restorative deep sleep stages and worsening next-day energy. Addressing sleep and reducing alcohol are likely to improve his energy more than any supplement or medication could.","links":"The findings in this report cluster into three connected threads and one standalone concern.\n\nThe first thread is inflammation. His ESR at 36 and CRP at 2.1 are both elevated, and while neither is dramatically high, together they confirm a low-grade inflammatory process. The most likely contributors are chronic sleep restriction, alcohol intake above seven drinks per week, and possibly early subclinical thyroid dysfunction, which itself can raise inflammatory markers. The inflammation feeds into his cardiovascular risk: CRP is one of the inputs to his cardiovascular risk score of 65, and arterial inflammation accelerates the damage done by his elevated ApoB and LDL. It also contributes to fatigue directly. Reducing the inflammation through better sleep, less alcohol and addressing the thyroid could therefore improve both his energy and his long-term cardiovascular outlook simultaneously.\n\nThe second thread is cardiovascular risk. His ApoB at 1.23, LDL at 3.37, and total cholesterol at 5.7 are all above their respective targets, and his cardiovascular risk score of 65 reflects this. However, his HDL at 1.8, ApoA1 at 1.92, ApoB-to-ApoA1 ratio of 0.64, triglycerides at 1.31, and normal Lp(a) are all favourable. This means the risk is real but entirely modifiable: there is no inherited Lp(a) component, and the balance of protective to harmful particles is better than the LDL alone suggests. The strategy is to lower ApoB through dietary changes, specifically increasing soluble fibre, increasing oily fish to two to three portions per week, and reducing saturated fat, while the good HDL and triglyceride profile is preserved.\n\nThe third thread is the thyroid-fatigue-sleep axis. His TSH is marginally above range with a low-normal FT4 and negative antibodies, pointing to non-autoimmune subclinical hypothyroidism. This is contributing to his fatigue alongside, and possibly less than, his chronic sleep deprivation. The cortisol at the morning ceiling is consistent with a body that is not recovering overnight. These three elements, the underperforming thyroid, the short sleep and the elevated cortisol, reinforce each other: poor sleep raises cortisol, elevated cortisol disrupts thyroid axis signalling, and low thyroid function makes fatigue worse. Breaking the cycle at the sleep end is the most accessible intervention.\n\nThe standalone concern is the microscopic haematuria. The urine RBC count of 90 with no infection markers is a finding that requires urological investigation in its own right. It may turn out to be benign, perhaps a prostatic cause given his age, but at 73 it must be investigated to exclude bladder or renal tract pathology. If the investigation reveals a source of bleeding or tissue inflammation, it may also explain part of his elevated ESR.","lifestyle":"Set a fixed bedtime that gives you at least seven hours in bed, and keep the same wake time every day including weekends. Anchor: set a phone alarm ninety minutes before your target bedtime as a wind-down cue. Why: less than six hours is the single biggest driver of your fatigue, your cortisol sitting at 605 at the top of the morning range, and likely part of your ESR of 36.\nCut caffeine after midday completely. Anchor: your last coffee is with or before lunch. Why: caffeine has a half-life of five to six hours and at your current sleep duration you cannot afford any interference with sleep onset.\nReduce alcohol to no more than four drinks per week, with at least three alcohol-free days. Anchor: decide your drinking days at the start of each week and stick to them. Why: alcohol above seven drinks per week disrupts deep sleep, raises GGT (yours is 54, above the ideal of 25), inflames the liver and gut lining, and contributes to the CRP of 2.1 and ESR of 36.\nAdd a portion of oily fish (salmon, mackerel, sardines) at least twice per week, replacing a red meat or processed meat meal. Anchor: pick two fixed days as fish days. Why: omega-3 fats lower triglycerides, reduce inflammation, and help bring your ApoB of 1.23 toward the target of 0.9.\nAdd a daily source of soluble fibre: oats at breakfast, a handful of almonds as a snack, or a portion of beans or lentils with lunch or dinner. Anchor: start with oats at breakfast this week. Why: soluble fibre binds bile acids in the gut and forces the liver to pull LDL cholesterol from the blood to make more, directly lowering your LDL of 3.37.\nSwap butter, cheese and fatty cuts of meat for olive oil, avocado and leaner protein sources at least five days per week. Anchor: use olive oil as your default cooking fat. Why: reducing saturated fat intake is the most effective dietary lever for lowering ApoB.\nWalk for fifteen minutes after your evening meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers glucose and lipid responses and adds to your daily step count, supporting the metabolic health that is already excellent.\nAim for 2 litres of water per day, spread across the day. Anchor: fill a bottle each morning and finish it by dinner. Why: good hydration supports your kidneys, which at an eGFR of 65 are working adequately but benefit from consistent fluid intake.","flags":"Urine RBC 90, well above the significant threshold of 25, with no WBCs, no nitrites, no bacterial growth and a clean culture. At 73 this is isolated microscopic haematuria requiring urological referral to exclude bladder and renal tract pathology. GP should arrange urine cytology, imaging and likely cystoscopy.\nTSH 4.85, above the upper limit of 4.78, with FT4 13.8 in the lower quarter of range (11.5 to 22.7) and FT3 4.8 within range. Both TPO and thyroglobulin antibodies negative. Non-autoimmune subclinical hypothyroidism. Recommend repeat TSH and FT4 in three months. If TSH rises further or FT4 drops, levothyroxine trial may be warranted.\nESR 36, three times the upper limit of 12, alongside CRP 2.1 (below laboratory limit of 5 but above the ideal of 1.0). Low-grade inflammatory process at 73. Could be driven by alcohol, sleep deprivation, early thyroid dysfunction, or a process related to the haematuria. GP should note in the context of the urological referral.\nApoB 1.23 (target below 0.9), LDL 3.37 (target below 3.0), total cholesterol 5.7 (desirable below 5.18). HDL excellent at 1.8, ApoB/A1 ratio 0.64 (below 0.7), triglycerides 1.31, Lp(a) below 25 (normal). Cardiovascular risk score 65/100, driven by ApoB and LDL. Entirely modifiable. Dietary changes first, with consideration of statin therapy if lifestyle does not bring ApoB below 0.9 in six months.\nCystatin C 1.22 (above reference of 1.1), eGFR 65 by both creatinine and cystatin C methods. Above the CKD threshold of 60 but below ideal of 90. Age-appropriate decline but should be tracked annually.\nCortisol 605 (morning range 145 to 619). At the ceiling. Consistent with chronic sleep deprivation and stress rather than pathological hypercortisolism. No action required unless symptoms of Cushing's develop.\nFIB-4 2.31 (above 1.45 threshold, but lab notes threshold of 2.0 for over 65). Driven by age in the formula. ALT 16, AST 29, GGT 54, albumin 42, APRI 0.317 all indicate no significant liver fibrosis. De Ritis ratio 1.81 above ideal, driven by low ALT denominator.\nTestosterone 14.4 (range 8.4 to 28.7, optimal above 18). Below optimal but within range for 73. Not the primary driver of fatigue given thyroid and sleep findings.\nC-Peptide 1.01 ug/L (range 1.1 to 4.4), marginally below range. In the context of normal glucose 4.9, HbA1c 41, insulin 4.51 and HOMA-IR 0.98, this reflects low insulin demand, not pancreatic insufficiency.\nMCH 32.7 (range 27 to 32). Marginally above range. With normal MCV, MCHC and no other haematological abnormality, this is laboratory variation without clinical significance.\nProgesterone 0.88 (range 0.89 to 3.88). Fractionally below range. In men, progesterone levels are naturally very low and this has no clinical significance.\nFolate above 24 (range 3 to 17). Likely supplementation or folate-rich diet. Not harmful.\nTotal antioxidant activity 2.11 (range 1.3 to 1.77). Commonly elevated by dietary antioxidants, supplements or polyphenol-rich foods. Not a concern.\nReassuring negatives: glucose and HbA1c normal with excellent insulin sensitivity (HOMA-IR 0.98), PSA very low at 0.38 with excellent free ratio of 0.316, thyroid antibodies negative excluding autoimmune thyroid disease, coeliac screen negative, rheumatoid factor negative, immunoglobulins all normal, iron studies healthy, vitamin D optimal at 111, B12 healthy at 653, calcium and PTH normal, CK normal, tumour markers CA19-9 and CEA normal, urine protein and glucose negative, Lp(a) normal excluding inherited lipoprotein risk.","recommendations":"Arrange urological referral for investigation of microscopic haematuria: urine RBC 90, no infection markers. Urine cytology, renal tract ultrasound and likely cystoscopy are the standard pathway at 73.\nDiscuss the TSH of 4.85 with negative antibodies and FT4 at 13.8. Request repeat TSH and FT4 in three months to determine whether this is stable subclinical hypothyroidism or progressing. If TSH rises above 10 or FT4 drops below range, a trial of levothyroxine may be appropriate.\nNote the ESR of 36 and CRP of 2.1 in the context of the haematuria investigation. If urological workup is normal, consider further investigation of the inflammatory source.\nDiscuss lipid management: ApoB 1.23 (target below 0.9), LDL 3.37, cardiovascular risk score 65. Recommend dietary modification for six months as first-line. If ApoB remains above 0.9 at retest, consider statin therapy given age and cumulative arterial exposure.\nRecord the eGFR of 65 (creatinine and cystatin C concordant) for annual tracking. No action needed now, but a downward trend below 60 would warrant nephrology input.\nRetest in six months: lipid panel including ApoB, TSH, FT4, CRP, ESR, full blood count, kidney function with cystatin C. This will show whether dietary changes are moving the lipids, whether the thyroid is stable, and whether the inflammation has improved with better sleep and reduced alcohol.\nCalorie and protein targets: maintenance calories approximately 2,050 to 2,200 per day (BMR approximately 1,520 multiplied by a moderate activity factor of 1.45 given five training sessions and 5,000 to 7,500 steps). For modest fat loss, aim for 1,750 to 1,900 calories per day. Protein target: 95 to 115 grams per day (1.3 to 1.6 grams per kilogram of bodyweight given his training), prioritising leucine-rich sources such as eggs, fish, poultry, dairy and legumes to support muscle preservation during any calorie deficit.","supplementation":"Omega-3 fish oil: 2 to 3 grams of combined EPA and DHA per day, taken with a meal containing fat. Why: supports the reduction of ApoB from 1.23, lowers triglycerides, and has anti-inflammatory effects that may help bring CRP from 2.1 toward the ideal of below 1.0.\nMagnesium glycinate: 300 to 400 mg before bed. Why: his magnesium at 0.93 is within range but magnesium glycinate specifically supports sleep quality, which is his most pressing lifestyle issue at less than six hours per night, and supports muscle recovery from five weekly training sessions.\nVitamin D3 (cholecalciferol): maintain current intake at 1,000 to 2,000 IU per day through the winter months to hold his level at 111. No need to increase unless retesting shows a drop below 75.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with vitamin D. Why: K2 directs calcium into bone and away from arterial walls, complementing vitamin D and supporting cardiovascular health alongside the lipid-lowering plan.\nDo not take iron supplements. His ferritin at 110 and transferrin saturation at 26.8 percent show healthy iron stores. Additional iron at this level risks oxidative stress and is unnecessary.\nThe most important changes from this report are not supplements. They are getting at least seven hours of sleep per night, reducing alcohol to no more than four drinks per week, and making the dietary changes to bring ApoB below 0.9.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5273","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 58 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 57.8. Weakest systems: urinalysis 0%, inflammation 25%, lipids & cardiovascular 30%. Biggest drags: Apolipoprotein B, LDL Cholesterol, Cystatin C, Gamma GT.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"69.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4455","lower_normal":"","upper_normal":"78","lower_optimal":"","upper_optimal":"73","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4679","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Charles's PhenoAge of 71.7 against a calendar age of 73 places him 1.3 years younger biologically. Fasting glucose was not returned by the laboratory, so the estimated average glucose from HbA1c (5.9 mmol/L) was used in its place. The CRP of 2.1 and the slightly reduced eGFR are the markers pulling the score upward. Improving sleep, reducing alcohol and lowering inflammation could widen this favourable gap further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8125","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built in the arteries. Charles's score of 65 is high, driven primarily by his ApoB of 1.23 and LDL of 3.37, with the CRP of 2.1 adding to it. At 73, the risk being built and the ten-year probability of an event are closely aligned, making this a finding that warrants action. Bringing ApoB below 0.9 through dietary changes and potentially statin therapy is the most effective way to reduce this score.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a ":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2818","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5242","units":"ug/l","description":"C-Peptide is released by the pancreas in equal amounts to insulin and is a reliable measure of how much insulin the pancreas is actually producing. Charles's C-Peptide at 1.01 is marginally below the laboratory range of 1.1 to 4.4. However, with a fasting glucose of 4.9, an HbA1c of 41 and a fasting insulin of 4.51, this is not a sign of pancreatic failure. The pancreas is producing a small amount of insulin because that is all the body needs, reflecting excellent insulin sensitivity rather than a deficiency. The lab note that samples not separated within four hours can reduce C-Peptide to 44 percent of baseline adds further reassurance that this marginally low result may be partly a sample-handling artefact.","low_causes":"Low insulin demand, high insulin sensitivity, type 1 diabetes, fasting","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4857","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose is derived from the HbA1c and represents the average blood sugar level over the preceding two to three months. Charles's estimated average glucose of 6.8 mmol/L is within the laboratory range but above the optimal ceiling of 6.2, consistent with his HbA1c sitting at the upper edge of normal. It will improve with the dietary changes recommended in this report.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4852","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Triglycerides, which sits outside the ideal range.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"HS-CRP","group":"INFLAMMATION","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP, or C-reactive protein, is an inflammation marker produced by the liver in response to inflammatory signals throughout the body. It is also used in cardiovascular risk assessment: levels above 1.0 are associated with increased arterial inflammation and cardiovascular risk, and above 3.0 with high risk. Charles's CRP at 2.1 is below the laboratory ceiling of 5 but above the ideal of below 1.0. This places him in the moderate cardiovascular risk category for this marker and is consistent with his elevated ESR of 36. Sleep deprivation, alcohol intake, visceral fat, or the process behind his haematuria could all be contributing.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, smoking, autoimmune disease, cardiovascular risk, sleep deprivation, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. A faster rate indicates more inflammation in the body. Charles's ESR at 36 is three times the upper limit of 12. At 73, ESR naturally rises with age, but a reading of 36 exceeds what age alone would explain. Combined with his CRP of 2.1, this confirms a genuine low-grade inflammatory process. The sources could include chronic sleep restriction, regular alcohol use, early thyroid dysfunction, or a process related to his microscopic haematuria. His GP should be aware.","low_causes":"Polycythaemia, sickle cell disease","high_causes":"Infection, autoimmune disease, cancer, anaemia, ageing, chronic inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"NLR","group":"INFLAMMATION","result":"1.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3963","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The Neutrophil-to-Lymphocyte Ratio divides neutrophils (the immune cells that respond to bacterial threats) by lymphocytes (the cells that handle viral and longer-term immune responses). A higher ratio suggests acute inflammation or physiological stress unction, nerve signalling and sleep regulation. Charles's magnesium at 0.93 is within the optimal range of 0.85 to 1.05. This is reassuring given his training load and sleep issues.","low_causes":"Alcohol excess, diuretics, poor diet, malabsorption, diabetes","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"19.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6400","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"mmol/l","description":"The anion gap estimates unmeasured anions in the blood and helps detect metabolic disturbances. Charles's anion gap at 19.2 (calculated including potassium) is within the laboratory range of 10 to 20 but above the optimal ceiling of 18. This minor elevation does not indicate a metabolic disorder in the context of normal bicarbonate, normal sodium and normal kidney function.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Metabolic acidosis, ketoacidosis, lactic acidosis, toxins, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-Corrected Sodium is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolalit function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });

    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',

  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
