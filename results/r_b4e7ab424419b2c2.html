<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Raman Rebuar","dob":"11/09/1994","report_date":"2026-09-21","summary":"Raman is a 32-year-old male presenting with a BMI of 27.3, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. He trains five or more times per week, all resistance-based with no dedicated cardio, averaging 7,500 to 10,000 daily steps. He takes no medications. He reports very high-intensity exercise and bodybuilding as a habit. He reports low energy and fatigue, bloating and digestive discomfort, and low sex drive. His goals are to lose body fat, improve energy levels, and improve long-term health and longevity. Raman has a diagnosed history of chronic gastritis from endoscopy and colonoscopy two years ago with some clinical concern about possible Crohn's disease or inflammatory bowel disease, and he is particularly interested in inflammation, iron status, nutrient absorption, thyroid function and hormonal health.\n\nThe single finding that stands out above everything else in this report is Raman's total IgE, which is 1,422, more than fourteen times the upper limit of 100. IgE is the antibody the immune system produces in response to allergens, and to a lesser extent in response to parasitic infection. A level this high suggests a significant allergic process is active, and given Raman's gastrointestinal symptoms, bloating, fatigue and his history of gastritis with suspected inflammatory bowel disease, this warrants investigation with his GP or gastroenterologist. The two main possibilities are a systemic allergic condition such as allergic rhinitis, asthma or eczema that may not have been formally diagnosed, or an allergic component to his gut inflammation, including the possibility of eosinophilic gastrointestinal disease. A parasitic infection should also be excluded, particularly if Raman has travelled recently. The GP should arrange specific allergen testing, a total IgE repeat, and if not already done, review his eosinophil count in the context of his gut biopsies. His blood eosinophils at 0.1 are actually low, which makes a parasitic cause less likely and points more towards an allergic or atopic explanation, but this does not reduce the need for investigation.\n\nBefore moving to the areas that need attention, there is a great deal of good news in this report. Raman's cardiovascular profile is genuinely excellent. His ApoB, the protein that carries cholesterol into artery walls, is 0.70, which is below 0.8 and sits in the optimal range. His HDL cholesterol, the protective fraction, is 1.80, well above the 1.4 optimal threshold for men. His triglycerides are 0.81, which is low and healthy. His Lp(a), a genetically inherited lipoprotein that drives cardiovascular risk and cannot be changed by lifestyle, is below 25, confirming he does not carry that inherited burden. His ApoB to ApoA1 ratio is 0.38, which is about as good as that number gets. His Cardiovascular Risk Score, a TrueVitals composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 0 out of 100, which reflects the fact that every single input to that score is in the ideal range. His LDL at 2.86 is the only lipid marker sitting above optimal but it remains within the laboratory range, and with an ApoB already below 0.8, the particle count that actually matters is where it should be. His metabolic health is equally strong. Fasting glucose at 4.8, HbA1c at 35 mmol/mol, fasting insulin at 5.47 and a HOMA-IR of 1.17 together paint a picture of a body that is handling blood sugar efficiently with low insulin demand, exactly what healthy metabolic function looks like at 32. His kidney function is excellent, with a cystatin C of 0.91 giving a combined eGFR of 100, right where it should be. His liver is in good shape overall. GGT at 20 is well within the optimal range, the FIB-4 fibrosis score at 0.73 rules out any suggestion of liver scarring, and bilirubin, albumin and ALP are all healthy. His thyroid is working well, with both antibodies negative, ruling out autoimmune thyroid disease entirely. His prostate screening is clean, with a PSA of 0.75 and a free ratio of 0.56, both reassuring. His tumour markers CEA and CA19-9 are both within normal limits. His inflammatory markers are reassuring too: hsCRP at 0.5 is below the optimal threshold of 1.0, ESR at 10 is within range, and rheumatoid factor is negative. For a man with known gastritis and suspected IBD, seeing systemic inflammation this low is a genuine positive. His coeliac screen, tissue transglutaminase IgA, is negative, which rules out coeliac disease as a cause of his gut symptoms and nutrient concerns. His full blood count is healthy, with haemoglobin at 152 and all cell lines within range. His iron studies are reassuring: ferritin at 209 is comfortably within the optimal male range of 50 to 200, transferrin saturation at 39% sits in the ideal 25 to 40% window, and serum iron and transferrin are both healthy. For a man worried about iron deficiency from gut malabsorption, this is excellent news and suggests that iron absorption is not currently impaired.\n\nTurning to the areas that need attention beyond the IgE finding, there are a few results worth discussing. Raman's serum folate is 20, above the upper reference limit of 17. Folate is vitamin B9, essential for DNA synthesis and red blood cell production. A level above range is not harmful and is almost always explained by dietary intake or supplementation. If Raman is taking a multivitamin or B-complex supplement, this is the most likely explanation. It does not need treatment, but it is worth knowing that very high folate can mask a vitamin B12 deficiency, though his B12 at 651 is healthy and well within the optimal range above 500, so that is not a concern here.\n\nRaman's ALT is 37, which is within the laboratory reference range of less than 56 but above the tighter optimal threshold of less than 30 that is associated with best long-term liver health. ALT is an enzyme released when liver cells are under strain. At this level, in a man training five to six days per week with heavy resistance work, this is very likely explained by muscle turnover rather than liver pathology, and the clean GGT, normal AST, low FIB-4 and healthy bilirubin all confirm the liver itself is not in trouble. His creatine kinase at 78 is not especially elevated, but intense training can raise ALT independently of CK.\n\nRaman's testosterone at 20.1 is within the laboratory range and sits inside the optimal band of 18 to 30. His free testosterone, calculated at 0.53, is healthy. His bioavailable testosterone at 11.58 is actually above the upper reference of 9, which reflects his relatively low SHBG of 24.6. SHBG is sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues. At 24.6 it is within the laboratory range but below the optimal band of 25 to 55, sitting just at the lower boundary. Low SHBG means more of his testosterone is free and bioavailable, which is not a problem in itself, but SHBG below 25 can be associated with insulin resistance and metabolic strain. In Raman's case, his insulin and HOMA-IR are excellent, so this is more likely a constitutional finding. Despite these healthy hormone numbers, Raman reports low libido. This suggests the fatigue and low drive are unlikely to be driven by testosterone deficiency and may instead be related to the gut inflammation, the very high IgE allergic burden, training volume relative to food intake, or sleep quality, all of which are worth exploring.\n\nRaman's vitamin D is 54, which is classified as sufficient by the laboratory at above 50 but falls short of the optimal range of 75 to 120. Vitamin D plays a role in immune regulation, energy, mood and muscle recovery, and at 54 in a man of Middle Eastern ethnicity, who may have higher melanin reducing skin synthesis, and someone training intensely, bringing this into the 75 to 100 range could make a noticeable difference to how he feels.\n\nRaman's TSH at 2.78 is within the laboratory range but sits above the tighter optimal band of 1.0 to 2.5. His free T4 at 19.4 is in the upper part of the ideal range and his free T3 at 4.8 is within the laboratory range but just below the optimal of 4.5 to 6.5, sitting at the lower boundary of that band. His FT3 to FT4 ratio at 0.247 is just below the optimal range of 0.27 to 0.40, which may suggest that conversion of T4 to the active T3 is slightly less efficient than ideal. With both antibodies firmly negative, this is not autoimmune thyroid disease. However, the combination of a TSH at the higher end and a conversion ratio at the lower end, in a man reporting fatigue and low energy, is worth noting. Selenium and zinc support thyroid conversion, and optimising vitamin D may also help. This does not need GP intervention at present but should be rechecked at the next test.\n\nRaman's magnesium at 0.85 sits right at the lower boundary of the optimal range of 0.85 to 1.05. For a man training five to six days a week at high intensity, magnesium is lost through sweat and demand is higher than average. Supplementing to bring this comfortably into the middle of the range could help with recovery, sleep quality and energy.\n\nHis cortisol at 316 is within the normal morning range and does not suggest adrenal dysfunction. His C-peptide at 1.19, which converts to 394 pmol/L, is within range and consistent with his healthy insulin and glucose. His MCHC at 344 is at the very top of the reference range of 315 to 345, which at this margin is laboratory variation and not a concern. His IgM at 0.6 is at the lower end of the 0.5 to 3.0 range but within it, and in isolation this is not significant. His neutrophils at 2.01 are right at the lower boundary of the reference range but within it, and in a man of Middle Eastern ethnicity, benign ethnic neutropenia is common and entirely harmless.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 25.2, about 7 years younger than a calendar age of 32.\n\nRaman's urine is largely unremarkable. The white blood cell count in the urine is 10, which the laboratory notes as not significant at less than 10. Red blood cells are less than 1, which is clean. Nitrites are negative. The bacterial culture and sensitivities are pending and will be reviewed when available. All other urinary markers are negative.\n\nIn summary, Raman's cardiovascular and metabolic health are genuinely excellent, his iron stores and B12 are healthy, his inflammatory markers are low, coeliac disease has been excluded, and his testosterone is in the optimal range. The findings that need action are the markedly elevated IgE which should be investigated by his GP or gastroenterologist, the vitamin D which needs supplementing to reach the optimal range, and the dietary volume which at 5 out of 10 may not be sufficient to support the training load he is putting his body through. The thyroid conversion ratio and magnesium are worth optimising, and the gut symptoms should continue to be monitored in the context of his gastritis and suspected IBD history.\n\nLate-arriving results: the full blood count indices now available confirm what the summary indicated: Raman's red cell picture is entirely healthy, with an RBC of 4.91, MCV of 90 fL, MCH of 31 pg and RDW of 12.6 percent, together ruling out iron-deficiency, B12-deficiency and mixed-deficiency anaemias, which is particularly reassuring given his gastritis history and concerns about nutrient absorption. His reticulocyte count at 57.9 is within the optimal range, confirming active, healthy red cell production. The white cell count at 4.77 sits just below the optimal floor of 5 but within the reference range, consistent with the benign ethnic neutropenia pattern already noted. The urinalysis adds nothing new of concern: white cells at 10 are not accompanied by nitrites or red cells, making infection unlikely, and the pending bacterial culture remains the only outstanding result. Every other late-arriving marker, including the lipid fractions, liver indices, kidney measures, thyroid values, prostate markers, CEA and HOMA-IR, aligns precisely with the interpretation already given in the summary, and no revision to the overall clinical picture or recommendations is needed.","links":"The thread that connects many of Raman's findings runs through his gut. He has diagnosed chronic gastritis, possible inflammatory bowel disease, bloating, fatigue, and now a total IgE fourteen times the upper limit. While his systemic inflammatory markers are reassuringly low, suggesting that whatever is happening in the gut is not spilling over into widespread inflammation at this point, the IgE elevation suggests an allergic or atopic process is very active. This could be independent of his gastritis, reflecting environmental or food allergies, or it could be connected to it, pointing towards an allergic or eosinophilic component to his gastrointestinal inflammation.\n\nThe fatigue Raman describes is the symptom that brought him to this test, and it is worth considering what the blood is and is not telling us about it. Testosterone is healthy, so hormonal deficiency is not the explanation. Iron stores are excellent, so anaemia and iron deficiency are ruled out. B12 and folate are abundant. Thyroid is functioning but the conversion ratio is at the lower end, and vitamin D is below optimal, both of which can contribute to fatigue at the margins. The most likely explanations for his fatigue sit in three places: the gut, where chronic gastritis and a possible allergic process may be impairing nutrient absorption or driving immune activation that consumes energy; the training-to-nutrition ratio, where a diet volume of 5 out of 10 against five to six days of intense resistance training may leave the body underfuelled; and the IgE-driven immune activation itself, which at this level represents a significant burden on the immune system.\n\nWhat has been excluded is important. Coeliac disease is negative. Rheumatoid factor is negative. CRP and ESR are low. Liver and kidney function are strong. There is no diabetes or insulin resistance. There is no thyroid autoimmunity. There is no iron deficiency. These exclusions significantly narrow the field and make the IgE finding and the gut history the clear priorities for further investigation.","lifestyle":"Add a palm-sized portion of protein to every meal, aiming for at least 130 grams of protein across the day. At 77 kg training five to six days a week, your muscles need 1.6 to 2.0 grams per kilogram, which is 123 to 154 grams daily. Anchor: before you add anything else to the plate, the protein goes on first. Why: your diet volume is 5 out of 10 and you are training hard; undereating while training this intensely is a common cause of fatigue.\n\nIncrease your total daily food intake deliberately. Your estimated maintenance calories are around 2,500 to 2,700, and a modest fat loss target would be 2,100 to 2,300 with a protein floor of 130 grams per day. If you are currently eating less than this, the calorie deficit may be too aggressive for your training volume and could be contributing to your fatigue and low drive. Anchor: track intake for one week to see where you actually sit, then adjust. Why: a diet volume of 5 out of 10 against five to six sessions a week risks under-recovery.\n\nAdd two to three portions of oily fish per week, such as salmon, mackerel or sardines. Anchor: replace one existing protein source at dinner twice a week. Why: omega-3 supports the anti-inflammatory environment your gut needs, and your cardiovascular markers are already excellent, so this maintains them rather than fixes them.\n\nAdd one to two dedicated cardio sessions per week, even if just a 20 to 30 minute brisk walk or light cycling. Anchor: one on a rest day, one after a shorter lifting session. Why: you currently do zero dedicated cardio, and moderate aerobic work improves gut motility, which may help with your bloating, and supports energy levels through improved mitochondrial function.\n\nEat slowly and chew thoroughly, especially with your gastritis history. Anchor: put your fork down between bites for the first five minutes of each meal. Why: thorough chewing reduces the mechanical and chemical burden on an already inflamed stomach lining and may reduce your bloating.\n\nSet a fixed wake time seven days a week within a 30-minute window, get outside within an hour of waking, and cut caffeine by 1pm. Anchor: alarm at the same time every day, walk to the door before checking your phone. Why: consistent sleep architecture is one of the strongest levers for fatigue, hormone optimisation and gut repair, and caffeine after midday delays deep sleep even when you feel fine falling asleep.\n\nConsider a food diary for two to four weeks alongside the allergen testing your GP arranges, logging symptoms against meals. Anchor: a simple note on your phone after each meal with what you ate and how you felt two hours later. Why: with an IgE this high, identifying specific dietary triggers could reduce both your gut symptoms and your fatigue significantly.","flags":"Total IgE is 1,422 IU/ml, more than fourteen times the upper limit of 100. This indicates a significant allergic or atopic process. In the context of chronic gastritis and suspected IBD, eosinophilic gastrointestinal disease should be considered alongside standard atopic causes. Parasitic infection should be excluded. Specific allergen testing and clinical correlation are recommended.\n\nSerum folate is 20 ng/ml, above the upper reference limit of 17. Most likely dietary or supplement-driven. Not harmful, but the source should be identified. B12 at 651 is healthy, so masking of B12 deficiency is not a concern.\n\nALT is 37 IU/L, within the laboratory range but above the optimal threshold of 30 for men. In the context of heavy resistance training, clean GGT, normal AST, low FIB-4 and healthy bilirubin, this is most likely exercise-related rather than hepatic pathology.\n\nVitamin D is 54 nmol/L, sufficient by laboratory criteria but below the optimal range of 75 to 120. Supplementation recommended.\n\nTSH is 2.78 mIU/L, within range but above the optimal band of 1.0 to 2.5. FT3:FT4 ratio is 0.247, just below the optimal range of 0.27 to 0.40, suggesting mildly reduced T4 to T3 conversion. Both thyroid antibodies are firmly negative. Monitor at retest.\n\nSHBG is 24.6 nmol/L, within range but just below the optimal band of 25 to 55. Insulin sensitivity is excellent, so this is likely constitutional. No action needed.\n\nMagnesium is 0.85 mmol/L, at the lower boundary of the optimal range. Supplementation recommended given training volume.\n\nBioavailable testosterone is 11.58 nmol/L, above the upper reference of 9. This is driven by low SHBG increasing the free fraction and is not pathological.\n\nReassuring negatives: hsCRP 0.5, ESR 10, coeliac screen negative, thyroid antibodies negative, rheumatoid factor negative, iron studies all optimal, B12 healthy, metabolic markers all optimal, PSA and tumour markers clean, kidney function excellent, full blood count normal.\n\nNot returned by the laboratory: urine bacterial count and culture and sensitivities are pending.","recommendations":"Discuss the IgE result of 1,422 with your GP or gastroenterologist. Request specific allergen panel testing (environmental and food allergens), consider referral for skin prick testing, and ask whether eosinophilic gastrointestinal disease should be investigated in the context of your gastritis and suspected IBD. A stool sample for ova and parasites should be sent to exclude parasitic infection.\n\nAsk your GP whether the gastritis follow-up should include a repeat endoscopy with eosinophil counts on biopsies, given the IgE elevation and ongoing symptoms.\n\nMention the folate result of 20 and identify whether a supplement is the source. No treatment is needed but your GP should be aware.\n\nAsk your GP to note the vitamin D of 54 and the plan to supplement to the 75 to 100 range.\n\nRetest in six months with the following markers: total IgE, specific IgE panel if not done by GP, full blood count, vitamin D, folate, thyroid panel including TSH and FT3, ALT, GGT, hsCRP, ESR and a stool calprotectin if your gastroenterologist has not already arranged one. Calorie target for modest fat loss: 2,100 to 2,300 kcal per day. Protein floor: 130 grams per day, ideally 140 to 150 grams. Recheck in six months to assess whether the IgE has responded to any intervention and whether energy levels have improved.","supplementation":"Vitamin D3 (cholecalciferol), 3,000 IU daily taken with your largest meal that contains fat. Continue for three months then retest. Why: your level of 54 is below the optimal range of 75 to 120, and at your training intensity and with Middle Eastern skin pigmentation, a higher dose than the standard 2,000 IU is appropriate to move the needle.\n\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bone rather than into artery walls. Always pair with D3.\n\nMagnesium glycinate, 300 to 400 mg before bed. Why: your magnesium at 0.85 is at the floor of the optimal range, and at five to six sessions per week you are losing magnesium through sweat. Glycinate is the best-absorbed form and also supports sleep quality.\n\nOmega-3 fish oil, 2 grams of combined EPA and DHA daily with food. Why: omega-3 supports the anti-inflammatory environment your gut needs, and while your cardiovascular markers are excellent, maintaining them with omega-3 is a sensible long-term strategy. If you have any fish allergy identified through the allergen testing, switch to algal omega-3.\n\nSelenium, 100 to 200 mcg daily (selenomethionine form). Why: selenium supports the conversion of T4 to the active T3, and your FT3:FT4 ratio at 0.247 is at the lower edge of optimal. Two to three Brazil nuts daily is an alternative to a supplement.\n\nDo not take iron supplements. Your ferritin is 209 and your transferrin saturation is 39%, both well within the optimal range. Additional iron would risk pushing stores too high.\n\nDo not start a B12 supplement. Your B12 at 651 is comfortably within the optimal range above 500.\n\nThe most important changes from this report are not supplements. They are investigating the IgE finding with your GP, increasing your daily food intake to match your training load, and adding the food diary that may identify the triggers behind your gut symptoms and fatigue.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 88.5; held to 59 by a system rated \"See your GP\". Weakest systems: immunology 23%, vitamins & nutrients 76%, digestive 79%. Biggest drags: Vitamin D, Bicarbonate, LDL Cholesterol, Total IgE.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"25.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3405","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4324","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, so it measures the risk being built in the arteries right now, not the ten-year probability of an event. A score of 20 or below is ideal. Raman's score is 0, reflecting the fact that every single input to this score sits in the ideal range. His ApoB is below 0.8, his HDL is above 1.4, his triglycerides are below 1.0, his Lp(a) is low, his hsCRP is below 1.0, and his HbA1c is below 36. This is as good as cardiovascular risk gets.","low_causes":"Optimal lipid, inflammatory and metabolic markers","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5333","upper_optimal_position":"0.7600","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood at the moment the sample was taken. Raman's fasting glucose of 4.8 is within the optimal range of 4.0 to 5.4, indicating healthy blood sugar regulation. At 32, with a BMI of 27.3 and a standard mixed diet, this is exactly where it should be and rules out any suggestion of pre-diabetes or diabetes. Combined with his healthy insulin and HbA1c, this confirms excellent metabolic health.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin-producing tumours","high_causes":"Pre-diabetes, type 2 diabetes, stress, high carbohydrate intake, medications such as steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c reflects the average blood sugar level over the previous two to three months by measuring how much glucose has attached to haemoglobin in red blood cells. Raman's HbA1c of 5.3% is well within the normal range and below the 6.0% pre-diabetes threshold. This confirms that his blood sugar control has been consistently good over the past several months, not just at the moment of testing.","low_causes":"Haemolytic anaemia, chronic blood loss, certain haemoglobin variants","high_causes":"Pre-diabetes, type 2 diabetes, sustained high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in SI units. Raman's result of 35 mmol/mol is below the pre-diabetes threshold of 42 and within the optimal range of below 36. This confirms excellent long-term blood sugar control.","low_causes":"Haemolytic anaemia, chronic blood loss","high_causes":"Pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"5.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4597","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5757","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Lower is generally better, because it means the body's cells are responding efficiently to insulin without the pancreas having to work hard. Raman's insulin at 5.47 is within the optimal range of 2 to 8, confirming that his cells are insulin-sensitive and his pancreas is under minimal strain. This is one of the most important metabolic markers and his is excellent.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, obesity, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"394","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"364","upper_normal":"1456","lower_optimal":"400","upper_optimal":"1200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3662","upper_optimal_position":"0.6099","units":"pmol/L","description":"C-peptide is released by the pancreas in equal amounts to insulin and provides a more stable measure of how much insulin the body is actually producing. Raman's C-peptide of 394 pmol/L (converted from 1.19 ug/L) is within the laboratory range but just below the optimal band. In the context of his healthy fasting glucose and low insulin, this simply reflects that his pancreas does not need to produce much insulin because his cells are responding to it efficiently. This is consistent with good metabolic health, not pancreatic underperformance.","low_causes":"Low insulin demand from good insulin sensitivity, low carbohydrate intake, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"39.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5798","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5225","upper_optimal_position":"0.6279","units":"%","description":"Transferrin saturation shows what percentage of the body's iron-carrying protein (transferrin) is currently loaded with iron. Raman's saturation at 39.46% sits right in the optimal sweet spot of 25 to 40%. This means iron is being transported efficiently without overloading the system. For a man concerned about possible iron malabsorption from gastritis, this is very reassuring.","low_causes":"Iron deficiency, chronic disease, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"21.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4551","upper_optimal_position":"0.6164","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin and transferrin saturation. Raman's serum iron of 21.9 is within the optimal range, confirming adequate iron availability for red blood cell production and energy metabolism.","low_causes":"Iron deficiency, chronic inflammation, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.4","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5222","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. The body increases transferrin production when iron stores are low and decreases it when stores are adequate. Raman's transferrin at 2.21 is within the laboratory range but at the lower end, just below the optimal band. With ferritin at 209 and transferrin saturation at 39%, this low-end transferrin simply reflects that his body has plenty of iron and does no function in people who train heavily. Raman's cystatin C at 0.91 is within the optimal range and gives an eGFR of 100, confirming excellent kidney health independent of his muscle mass.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Kidney impairment, hypothyroidism, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein is a marker of systemic inflammation produced by the liver. It is used to assess both acute infection and chronic low-grade inflammation that drives cardiovascular disease. Raman's hsCRP at 0.5 is below 1.0, which is considered optimal. For a man with chronic gastritis and suspected IBD, this is reassuring, as it suggests that systemic inflammation is low even if there may be localised inflammation in the gut.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6533","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures all the protein in the blood, primarily albumin (made by the liver) and globulins (made by the immune system). Raman's total protein at 74 is within the optimal range, indicating healthy liver synthetic function and adequate protein status.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5833","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and drugs, and maintains fluid balance. Raman's albumin at 40 is within the optimal range, confirming that the liver is producing protein normally.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5556","upper_optimal_position":"0.6111","units":"g/L","description":"Globulins are a group of proteins including immunoglobulins (antibodies) and transport proteins. Raman's globulin at 34 is within the laboratory range but at the higher end, above the optimal ceiling of 32. This is consistent with an active immune system, which fits with his markedly elevated IgE. It does not indicate a problem in itself but reflects immune activation.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune conditions, er_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT is a liver enzyme released when liver cells are damaged or under strain. Raman's ALT at 37 is within the laboratory range of less than 56 but above the tighter optimal threshold of less than 30 for men. In the context of five to six days per week of heavy resistance training, mildly elevated ALT is very commonly driven by muscle turnover rather than liver damage. His GGT at 20 is clean, his AST is normal, his FIB-4 score is low, and his bilirubin and albumin are healthy, all of which confirm the liver itself is not in trouble.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, non-alcoholic fatty liver, alcohol, medications, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5104","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. It is released when these tissues are damaged. Raman's AST at 30 is within the optimal range. The AST to ALT ratio (De Ritis ratio) of 0.81 is within the optimal band, which is reassuring and consistent with the ALT being driven by muscle activity rather than progressive liver disease.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, heart attack, intense exercise, muscle damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1370","low
