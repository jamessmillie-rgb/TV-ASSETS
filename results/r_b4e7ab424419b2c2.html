nits":"mmol/L","description":"Corrected calcium adjusts the calcium result for the albumin level, since calcium binds to albumin in the blood. Raman's corrected calcium at 2.47 is within the optimal range, confirming true calcium levels are healthy.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4598","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4713","upper_optimal_position":"0.5517","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and is involved in energy production at the cellular level. Raman's phosphate at 1.1 is within the optimal range, indicating healthy mineral balance.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5172","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.8851","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including muscle contraction, nerve function, energy production and sleep regulation. Raman's magnesium at 0.85 sits right at the lower boundary of the optimal range of 0.85 to 1.05. For a man training five to six days per week, magnesium demand is higher than average due to losses through sweat, and supplementation is recommended to bring this into the middle of the optimal range. This could help with recovery, energy levels and sleep quality.","low_causes":"Heavy exercise, poor dietary intake, malabsorption, alcohol, medications","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5800","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin produced in the skin from sunlight and essential for bone health, immune function, mood, energy and muscle recovery. Raman's vitamin D at 54 is classified as sufficient by the laboratory at above 50 but falls below the optimal range of 75 to 120 that is associated with best long-term health. For a man of Middle Eastern ethnicity, where higher melanin levels reduce skin vitamin D production, and someone training intensely who needs good immune function and muscle recovery, supplementing to the 75 to 100 range is recommended. At 54, a dose of 3,000 IU daily should achieve this within three months.","low_causes":"Insufficient sunlight, dark skin pigmentation, indoor lifestyle, obesity, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"1.336","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3561","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5013","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium and phosphate levels in the blood. It rises when calcium is low and falls when calcium is adequate. Raman's PTH at 1.336 is in the lower part of the optimal range, which is appropriate given his healthy calcium levels. This confirms normal parathyroid function.","low_causes":"Hypoparathyroidism, high calcium, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"651","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5239","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.7222","upper_optimal_position":"0.5625","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. It is absorbed in the terminal ileum of the small intestine, which makes it relevant for anyone with gastrointestinal conditions. Raman's B12 at 651 is within the optimal range of 500 to 900, which is reassuring and confirms that B12 absorption through the gut is functioning well despite his gastritis. This is an important positive finding given his concern about malabsorption.","low_causes":"Pernicious anaemia, malabsorption, veganism, gastric surgery, metformin use","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7255","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6905","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, vitamin B9, is essential for DNA synthesis, red blood cell formation and cell division. It is found in leafy greens, fortified foods and supplements. Raman's folate at 20 is above the laboratory upper limit of 17. This is not harmful and is almost always explained by supplementation (a multivitamin or B-complex) or a diet very rich in fortified foods. Excess folate is water-soluble and the body excretes what it does not need. The only clinical consideration is that very high folate can theoretically mask a B12 deficiency by correcting the anaemia it causes while allowing neurological damage to continue, but Raman's B12 at 651 is healthy, so this is not a concern.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, alcohol, methotrexate, pregnancy","high_causes":"Supplementation, fortified food intake, folic acid-containing medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4826","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions: HDL (protective), LDL (atherogenic) and VLDL. On its own it has limited clinical value because a high number could mean lots of protective HDL rather than lots of damaging LDL. Raman's total cholesterol at 5.0 is within the desirable range. The breakdown shows his HDL is high and his LDL is within range, which is a favourable profile.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2382","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood that come from dietary fat and from the liver converting excess carbohydrates. Fasting triglycerides below 1.0 are optimal. Raman's triglycerides at 0.81 are in the optimal range, reflecting good metabolic health, low insulin resistance and a diet that is not overloaded with refined carbohydrates or excess calories.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2372","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL is the cholesterol fraction carried by very low-density lipoproteins. It is closely linked to triglyceride levels. Raman's VLDL at 0.37 is within the optimal range, consistent with his healthy triglyceride level.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"High triglycerides, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5806","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL cholesterol is the protective fraction that removes cholesterol from artery walls and returns it to the liver for disposal. Higher is better. Raman's HDL at 1.8 is well above the optimal threshold of 1.4 for men. This is an excellent result and a significant contributor to his low cardiovascular risk.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4767","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5067","units":"mmol/L","description":"LDL cholesterol is the fraction that deposits cholesterol into artery walls, driving atherosclerosis over time. Raman's LDL at 2.86 is within the laboratory range but above the tighter optimal target of below 2.6. However, LDL is a measure of cholesterol mass, not particle count. His ApoB at 0.70, which directly measures the number of atherogenic particles, is below 0.8 and in the optimal range. This means his LDL particles are fewer but slightly cholesterol-enriched (larger particles), which is a less atherogenic pattern. With no other cardiovascular risk factors, this LDL level does not require intervention.","low_causes":"Hyperthyroidism, very low fat diet, malnutrition, statin therapy","high_causes":"Diet, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3089","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick assessment of cardiovascular risk. Lower is better. Raman's ratio of 2.78 is well within the optimal range, reflecting his high HDL and moderate total cholesterol. A ratio below 3.5 is considered ideal.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the potentially atherogenic cholesterol fractions (LDL, VLDL and remnant cholesterol) in one number. Raman's non-HDL at 3.2 is within the optimal range of below 3.4, confirming a low burden of atherogenic cholesterol.","low_causes":"Low LDL and VLDL, statin therapy, hyperthyroidism","high_causes":"High LDL or triglycerides, diet, genetics, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7667","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. It drives reverse cholesterol transport, the process by which cholesterol is removed from artery walls. Higher levels mean more protective HDL particles. Raman's ApoA1 at 1.84 is well above the optimal threshold, consistent with his excellent HDL cholesterol.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic disorders","high_causes":"Regular exercise, healthy diet, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single most important cardiovascular risk marker in this report. Every atherogenic lipoprotein particle, whether LDL, VLDL or remnant, carries exactly one ApoB molecule, so ApoB directly counts the number of particles that can enter and damage artery walls. Raman's ApoB at 0.70 is below 0.8 and in the optimal range. This means that despite his LDL cholesterol of 2.86 being above the optimal target, the actual number of atherogenic particles is low. This is the number that matters most for long-term cardiovascular protection, and his is excellent.","low_causes":"Statin therapy, hyperthyroidism, very low fat diet, malnutrition","high_causes":"High LDL, genetics, hypothyroidism, diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2714","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective particles in one number. Lower is better. Below 0.7 is the laboratory target, below 0.5 is optimal. Raman's ratio at 0.38 is excellent, confirming that the balance between cholesterol deposition and removal is strongly in his favour.","low_causes":"High HDL, low LDL, exercise, healthy diet","high_causes":"High LDL, low HDL, metabolic syndrome, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a genetically determined lipoprotein that promotes atherosclerosis, clotting and inflammation. Unlike LDL, it cannot be meaningfully changed by diet, exercise or most medications. It is set by your genes, which is why it only needs to be tested once. Raman's Lp(a) is below 25, well under the 32 threshold. This is genuinely useful information because it means that any future cardiovascular risk is driven entirely by modifiable factors, which he can control. This result should be recorded permanently in his medical notes.","low_causes":"Genetic (favourable variant)","high_causes":"Genetic (inherited), cannot be changed by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme released from muscle tissue when it is damaged or under stress. It is commonly elevated in people who train with heavy resistance. Raman's CK at 78 is within the optimal range, which suggests he was not in the immediate recovery period from an intense session when the blood was drawn. The relatively low CK, combined with a slightly elevated ALT, confirms the ALT is likely from low-grade muscle turnover rather than acute muscle damage.","low_causes":"Muscle wasting, sedentary lifestyle, low muscle mass","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"19.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5702","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5565","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. It acts as a reservoir that is converted into the active hormone T3 in tissues throughout the body. Raman's free T4 at 19.4 is in the upper part of the optimal range of 14 to 20, showing the thyroid is producing plenty of hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5258","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4396","upper_optimal_position":"0.5438","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland to tell the thyroid how much hormone to make. Higher TSH means the pituitary is pushing the thyroid harder, which can indicate early underactivity. Raman's TSH at 2.78 is within the laboratory range but above the tighter optimal band of 1.0 to 2.5. In a man reporting fatigue, this is worth noting. However, with both antibodies negative and FT4 in the upper part of the range, this does not represent autoimmune thyroid disease and is more likely a mild conversion issue. Worth monitoring at the next test.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, iodine deficiency, recovery from illness, thyroid autoimmunity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4963","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.7556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production and body temperature. It is produced mainly by converting T4 in the liver, kidneys and other tissues. Raman's free T3 at 4.8 is within the laboratory range and just inside the optimal band of 4.5 to 6.5, sitting at the lower end. With FT4 at the upper end and FT3 at the lower end, the FT3:FT4 ratio of 0.247 is slightly below optimal, suggesting conversion could be improved. Selenium and zinc support this conversion process.","low_causes":"Hypothyroidism, low T4, poor conversion, calorie restriction, illness, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Positive results are associated with Hashimoto's thyroiditis, the most common cause of underactive thyroid. Raman's TPO antibodies are below 6.6, firmly negative, ruling out autoimmune thyroid disease.","low_causes":"Normal finding, no thyroid autoimmunity","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. More than 80% of people have undetectable levels. Raman's thyroglobulin antibodies are below 1.3, confirming no thyroid autoimmunity.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa","name":"PSA","group":"PROSTATE","result th. A ratio above 0.19 is considered normal, and higher ratios are more reassuring. Raman's ratio of 0.56 is excellent, well above the threshold, and combined with the low total PSA gives a very clean prostate screen.","low_causes":"Prostate cancer risk (lower ratio with elevated PSA)","high_causes":"Benign prostate, normal finding","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"3.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0464","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker primarily associated with pancreatic and gastrointestinal cancers. It is used as a screening tool and for monitoring known conditions. Raman's CA 19-9 at 3.43 is well within the normal range, providing reassurance. In the context of his gastrointestinal history, this is a useful negative finding.","low_causes":"Generally not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2935","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA, carcinoembryonic antigen, is a tumour marker used to monitor colorectal and other gastrointestinal cancers. Raman's CEA at 1.35 is well within the normal range for a non-smoker, providing reassurance.","low_causes":"Generally not clinically significant","high_causes":"Colorectal cancer, other gastrointestinal cancers, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"13.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5895","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"13","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860","upper_optimal_position":"0.5509","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against previously encountered infections and vaccines. Raman's IgG at 13.8 is within the laboratory range but in the upper third, above the optimal band. In the context of his elevated IgE and active immune system, this may reflect generalised immune activation but is not a concern in itself.","low_causes":"Immune deficiency, certain medications, protein loss","high_causes":"Chronic infection, autoimmune conditions, liver disease, immune activation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. It indicates recent or acute immune responses. Raman's IgM at 0.6 is within the laboratory range but at the lower end. In isolation this is not significant and does not indicate immune deficiency.","low_causes":"Normal variation, immune deficiency (rare)","high_causes":"Acute infection, autoimmune conditions, lymphoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.1","within_normal":" c fashion. A parasitic infection should also be excluded, though his low blood eosinophils at 0.1 make this less likely. Raman should discuss this with his GP or gastroenterologist, who should arrange specific allergen testing and consider whether his gut symptoms have an allergic component.","low_causes":"Normal finding, immune deficiency","high_causes":"Allergic conditions (rhinitis, asthma, eczema, food allergy), parasitic infection, eosinophilic disorders, allergic bronchopulmonary aspergillosis, hyper-IgE syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. Raman's RF at 4 is well within the normal range, helping to rule out rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, other autoimmune conditions, chronic infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.517","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0360","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition where the body reacts to gluten and damages the small intestine. Raman's result at 0.517 i const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
