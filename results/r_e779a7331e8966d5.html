<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Gareth Simeon Frankland","dob":"05/11/1974","report_date":"2026-11-10","summary":"Patient is a 52-year-old male presenting with a BMI of 29.4, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are slightly below average (volume 4 out of 10). He trains five times per week (three cardio, two resistance) at hard intensity with 7,500 to 10,000 daily steps. He sleeps 6 to 7 hours a night and wakes feeling exhausted or waking in the night, with an afternoon energy crash. Stress feels hard to manage some weeks. He drinks 10 to 14 alcoholic drinks per week. He takes no medications and reports no diagnosed conditions. He reports low energy and fatigue alongside bloating and digestive discomfort, both lasting months. A previous blood test was normal. His goals are to improve energy levels, build muscle and improve sleep quality.\n\nThe most important finding in this report is a positive Anti-Nuclear Antibody (ANA) test at a titre of 1:160 with a speckled pattern, combined with a significantly raised Anti-Thyroid Peroxidase (Anti-TPO) antibody at 104, more than five times the upper limit of 20. ANA is a marker that detects antibodies directed against the body's own cell nuclei, and when positive it suggests the immune system is, to some degree, attacking the body's own tissues. A speckled pattern at 1:160 is not rare in isolation and can occur in healthy people, but when it appears alongside a strongly positive TPO antibody, it paints a more coherent picture. TPO antibodies target an enzyme in the thyroid gland called thyroid peroxidase, which is essential for making thyroid hormones. When these antibodies are present at this level, the pattern is strongly associated with a condition called Hashimoto's thyroiditis, the commonest cause of underactive thyroid. The reassuring news is that, right now, the thyroid itself is still working well. TSH, the signal the brain sends to tell the thyroid to produce hormones, is 2.23, comfortably within the ideal range of 1.0 to 2.5. Free T4, the main hormone the thyroid releases, is 18.8, which is in the upper half of the ideal band, and Free T3, the active form the body converts T4 into, is 4.97, which is within the optimal range of 4.5 to 6.5. The thyroid is holding its ground, but the antibodies tell us the immune system is nibbling at it. Over months to years, this can gradually reduce thyroid output, and the symptoms it causes, fatigue, difficulty losing weight, poor sleep, low mood, brain fog, are exactly the ones he is reporting now. This does not mean the thyroid is the whole explanation for his fatigue today, but it does mean his GP should be aware so that TSH and antibodies can be monitored over time, and treatment options can be discussed with the GP if and when TSH begins to rise above range.\n\nThe second finding that needs a GP conversation is the lipid profile. His total cholesterol is 5.79, above the 5.0 limit. His LDL cholesterol, the form that deposits cholesterol inside artery walls, is 3.59, above the 3.0 limit. His ApoB, which counts the actual number of cholesterol-carrying particles in the blood (each potentially atherogenic particle carries one ApoB molecule), is 116 mg/dL, above the ideal target of 80 mg/dL. His HDL cholesterol, the protective form that carries cholesterol away from artery walls, is 1.05, below the 1.55 lower limit and well below the ideal of 1.4. His triglycerides, the fats carried in the blood after meals and released by the liver, are 2.53, above the 2.3 limit and considerably above the ideal of 1.0. His total cholesterol to HDL ratio is 5.51, above the 5.0 limit. Put together, this is a pattern of raised atherogenic lipids, low protective lipids and elevated triglycerides, and the TrueVitals Cardiovascular Risk Score, an index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes out at 55 out of 100, above the 40 threshold and well above the ideal of 20. The genuinely good news within this picture is his Lp(a), lipoprotein(a), which is an inherited and unchangeable form of LDL. His is less than 5.2, which is ideal and means that every bit of the elevated LDL and ApoB is driven by modifiable factors: diet, weight, alcohol and activity. That is the best possible news alongside a concerning lipid panel because it means the whole thing can move. The non-HDL cholesterol (total cholesterol minus HDL) is 4.74, above the 3.8 limit. The estimated VLDL cholesterol, which reflects triglyceride-rich particles, is 1.15, above the 1.0 limit. The small LDL fraction, the denser particles that penetrate artery walls more easily, makes up 39% of total LDL, above the 35% threshold, meaning a meaningful proportion of his LDL is the more dangerous type. The atherogenic index of plasma is 0.382, above the ideal of 0.11 and the upper limit of 0.21. These numbers are not catastrophic, but they represent a level of cardiovascular risk that, at 52, should not be left to drift. His alcohol intake of 10 to 14 drinks per week is likely contributing to the triglycerides in particular, as alcohol is processed by the liver into VLDL particles that carry triglycerides into the blood. His low vegetable intake and slightly below-average food volume, combined with a BMI just under 30, suggest that the quality of the diet rather than the quantity is the primary dietary lever. The GP should see this full lipid panel and discuss whether lifestyle changes alone are sufficient or whether a statin should be considered, particularly given the ApoB level.\n\nBefore moving on to the other findings, there is a lot of good news in this report that deserves attention. His hsCRP, a sensitive marker of systemic inflammation, is 0.37, well inside the ideal of less than 1.0. At a BMI of 29.4 with 10 to 14 drinks a week, that is a genuinely impressive number and means there is no detectable inflammatory burden driving his symptoms or his cardiovascular risk. His liver is in excellent health. ALT at 16 and GGT at 19 are both well within the ideal range, the GLDH is 2.0 against a limit of 7, bile acids are 6.2 against a limit of 10, bilirubin is clean, and the FIB-4 score, which estimates liver scarring from age, platelets, AST and ALT, is 1.04, well inside the ideal of less than 1.3. The APRI, another fibrosis estimate, is 0.199, and the NAFLD fibrosis score is minus 2.37. All three make significant liver disease very unlikely indeed, and the liver is handling his alcohol intake without any visible metabolic strain at present. His kidney function is solid. Cystatin C, a more reliable filtration marker than creatinine alone, gives an eGFR of 90, and the combined creatinine and cystatin C eGFR is 99. Urea, creatinine and uric acid are all within range, and his urine shows no protein and no blood. His blood sugar control is excellent for someone at this BMI. HbA1c, which reflects average blood sugar over the past two to three months, is 33.2, well below the 42 limit and inside the ideal of less than 36. Fasting glucose is 5.7, just at the upper edge of the ideal range of 5.4 but well within the laboratory range. His HOMA-IR, which estimates insulin resistance from fasting glucose and insulin, is 0.70, beautifully low and suggesting his muscle and liver cells are still very sensitive to insulin. At a BMI of 29.4, that is a genuinely positive finding because insulin resistance is the metabolic problem that drives most of the damage at this weight, and his body is not showing it. His cardiac markers are all reassuring. Troponin T at 12.1 is within the 14 limit, CK-MB at 1.47 is well within range, and myoglobin and FABP-3 are both clean. His full blood count is healthy across the board. Haemoglobin at 153 is solid, white cell count at 5.93 is well placed, and platelets at 292 are in the middle of the range. His D-dimer, which screens for blood clotting activity, is less than 0.050, essentially undetectable, which is reassuring. His tumour markers are all within their respective ranges: PSA is 0.37, AFP 3.1, CEA 2.9, CA 19-9 at 20.9, and the prostate cancer risk score shows decreased risk. His coeliac screen is negative at 1.1, and his rheumatoid factor and anti-CCP antibodies are both negative, making rheumatoid arthritis very unlikely. His intrinsic factor antibodies and gastric parietal cell antibodies are both negative, which is relevant because pernicious anaemia is an autoimmune condition that can accompany thyroid autoimmunity and his results make it unlikely. His B12 is 634, in the upper half of the range and well above the optimal floor of 500. Active B12 is 111, which is strong. His immunoglobulins IgG, IgA and IgM are all within range, complement C3 and C4 are healthy, and total IgE at 34.6 makes a significant allergic driver to his symptoms unlikely.\n\nHis Epstein-Barr virus (EBV) serology shows a past infection that has fully resolved. EBNA IgG at 183 and VCA IgG at 3428 are both strongly positive, which simply means his immune system encountered EBV at some point, probably decades ago, and retains memory antibodies. The VCA IgM is 0.29, well below the 1.0 cut-off, confirming there is no active or recent reactivation. This is a normal pattern seen in the vast majority of adults and does not contribute to his current symptoms.\n\nHis bicarbonate is 17.3, below the lower limit of 22, and this is a finding worth mentioning to his GP. Bicarbonate is one of the body's main acid buffers, and a low level can reflect a mild metabolic acidosis. Hard training produces lactic acid, and 10 to 14 alcoholic drinks a week generate acetic acid and ketoacids during metabolism; together these could push bicarbonate down, . His kidney function is normal and his anion gap, when corrected for albumin, is 21.7, which is mildly elevated and consistent with the bicarbonate finding. This is most likely a combination of his training load and alcohol intake, but it is worth a routine repeat with his GP to confirm it is not persistent.\n\nHis lipase is 80, above the upper limit of 65. Lipase is an enzyme released by the pancreas to digest fat, and a mild elevation can occur after alcohol, a fatty meal or simply as a normal variant. His pancreatic amylase at 32 is well within range, and he has no abdominal pain, which together make acute pancreatitis very unlikely. However, at 10 to 14 drinks a week, a mildly elevated lipase is worth noting because the pancreas is more sensitive to alcohol than the liver, and this may be the first organ to signal that the intake is at its tolerance threshold. If bloating persists, this is worth mentioning to his GP.\n\nHis non-esterified fatty acids (NEFA) are 1.37, above the 0.9 limit. NEFA measures the free fatty acids circulating in the blood, released from fat stores when the body needs fuel between meals. A raised level at a BMI of 29.4 is consistent with the body drawing heavily on its fat stores, which can happen when food volume is slightly below average and training volume is high. It is not dangerous in itself but it does reflect that the body is in a catabolic state between meals, and when combined with his afternoon energy crash it suggests that his eating pattern may not be providing enough sustained fuel through the day.\n\nHis HB-EGF, heparin-binding epidermal growth factor, is 142.2, marginally above the upper limit of 136. This is a growth factor involved in tissue repair and wound healing. A marginal elevation is not clinically significant in isolation and does not require action.\n\nHis IL-15 is 0.63, just below the lower limit of 0.89. IL-15 is an immune signalling molecule involved in maintaining natural killer cells and muscle tissue. A mildly low level at this margin is not clinically significant and likely reflects normal variation.\n\nHis folic acid is 6.5, within the laboratory range of 3 to 26.8 but below the optimal floor of 8. Folate is essential for DNA repair, red blood cell production and the metabolism of homocysteine, and his homocysteine at 12.5, while within the laboratory range of 5 to 20, is above the optimal of less than 9. These two findings connect directly: folate is one of the main nutrients the body uses to clear homocysteine, and his low vegetable intake of 0 to 1 portions a day is the most likely explanation for both numbers. Homocysteine above 9 is associated with increased cardiovascular risk, which compounds the lipid findings above. Increasing vegetable and leafy green intake would address both.\n\nHis vitamin D is 99, within the optimal range of 75 to 120 and in a very good position, particularly at a BMI of 29.4 where fat tissue sequesters vitamin D. Maintaining his current intake through the winter months will be important. His zinc is 12.2, just above the optimal floor of 12, adequate but not generous. His copper is 11.7, just at the lower limit of 11, which is worth watching. His total antioxidant status at 1.91 is well above the 1.3 lower limit, and glutathione reductase at 67 confirms adequate riboflavin status.\n\nHis testosterone is 15.3, within the laboratory range of 6.68 to 25.7 but below the optimal band of 18 to 30. Free testosterone is 0.334, within range, and bioavailable testosterone is 8.31, within the optimal band. SHBG at 27.9 is at the lower end of range but within it. At 52, a total testosterone of 15.3 is not alarming, but it is below the level associated with optimal muscle building, recovery and energy, which are three of his stated goals. The combination of slightly below-average food volume, 10 to 14 drinks per week (alcohol suppresses testosterone production), disrupted sleep (testosterone is primarily produced during deep sleep) and a BMI of 29.4 (excess body fat converts testosterone to oestradiol via the aromatase enzyme) creates four simultaneous headwinds for testosterone. His oestradiol at 101 is within range but in the upper half, consistent with some aromatase activity from body fat. His cortisol at 301 is within range, and the testosterone to cortisol ratio at 50.8 is healthy. Improving sleep, reducing alcohol and gradually losing body fat would be expected to lift testosterone meaningfully without any medical intervention.\n\nHis progesterone at 0.81 is above the 0.47 upper limit for men. In men, progesterone is produced in small amounts by the adrenal glands and testes, and a mildly elevated level is common, usually benign and does not require investigation unless it is substantially raised or accompanied by other hormonal abnormalities, which it is not here.\n\nHis PhenoAge, a composite biological ageing score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, red cell distribution width, alkaline phosphatase and white cell count, is 41 against a calendar age of 52, eleven years younger. This is a genuinely strong result and reflects the low inflammation, clean liver, good kidney function and healthy blood counts that characterise his results outside of the lipid and immune findings.\n\nHis bloating and digestive discomfort have lasted months and the bloods offer two possible contributors but do not fully explain the symptoms. His H. pylori antibody is 14.8, within the negative range, making active H. pylori infection unlikely. His coeliac screen is negative. His lipase is mildly raised, which could reflect a degree of pancreatic sensitivity to alcohol, and his very low vegetable intake means he is getting very little dietary fibre, which is one of the commonest causes of bloating and irregular digestion. His NEFA elevation suggests he may be going long stretches without eating, which can alter gut motility. A food and symptom diary kept for two weeks would help identify specific triggers, and if bloating persists despite increasing fibre and reducing alcohol, a hydrogen breath test for small intestinal bacterial overgrowth (SIBO) or lactose intolerance would be a reasonable next step through his GP.\n\nHis fatigue and afternoon crash are the symptoms he came to this test hoping to explain. The bloods exclude anaemia, iron deficiency, B12 deficiency, significant thyroid failure, diabetes, kidney disease, liver disease and active infection. What the bloods do suggest is that the positive TPO antibodies may be causing subclinical immune-mediated fatigue even though TSH has not yet risen, that his sleep of 6 to 7 hours with exhausted waking is almost certainly insufficient for recovery from hard training five days a week, that his food volume is below average for his training load which his raised NEFA confirms, that his folate is below optimal, and that his alcohol intake may be fragmenting his sleep architecture. His energy crash in the afternoon points strongly at a blood sugar dip driven by eating pattern: if breakfast is small or skipped and lunch is carbohydrate-heavy, the insulin response can overshoot and drop glucose below comfortable levels by mid-afternoon. The solution is not a single supplement but a combination of more food earlier in the day, more vegetables, better sleep and less alcohol, all of which are addressed in the lifestyle section below.","links":"The thread that ties the abnormal results together in this report runs through three systems: autoimmunity, lipids and energy availability.\n\nThe autoimmune finding, a positive ANA at 1:160 speckled alongside a strongly positive anti-TPO at 104, is the most clinically significant. The ANA pattern alone could be incidental in a healthy person, but the TPO antibody gives it context and direction. The immune system is targeting the thyroid. The thyroid is still functioning well, with TSH, FT4 and FT3 all in good positions, but this is the finding that needs monitoring because Hashimoto's thyroiditis is a progressive condition that can, over years, reduce thyroid output. It is also worth noting that the ANA speckled pattern can sometimes be associated with other connective tissue conditions, and while his negative anti-CCP, negative rheumatoid factor and normal complement levels make those unlikely, the GP should be aware of the full picture.\n\nThe lipid picture is a separate system but shares a common driver with the fatigue: lifestyle. His LDL is 3.59, ApoB is 116 mg/dL, HDL is 1.05, and triglycerides are 2.53. The triglycerides and low HDL are the parts most responsive to alcohol reduction and increased activity, while the LDL and ApoB respond to dietary changes, specifically increasing soluble fibre and reducing saturated fat. His Lp(a) being ideal means the entire lipid profile is modifiable, which is the single most important piece of information in the cardiovascular section. His homocysteine at 12.5 adds a small additional cardiovascular risk factor, and it connects directly to his folate at 6.5 and his extremely low vegetable intake, so one dietary change, eating more vegetables, addresses both the homocysteine and the folate.\n\nThe energy availability picture connects the raised NEFA, the below-average food volume, the below-optimal testosterone, the afternoon crash and the fatigue. He is training hard five times a week on slightly too little food and slightly too little sleep, and the body is telling him through elevated free fatty acids that it is relying heavily on fat breakdown for fuel between meals. This is not dangerous, but it is the metabolic equivalent of running on reserves rather than income, and it explains why energy dips in the afternoon and why recovery feels incomplete.\n\nThe bicarbonate at 17.3 is a loose end. It could be training-related, alcohol-related or a laboratory variation, and a single repeat with his GP will settle it. The mildly raised lipase connects to the alcohol intake and the bloating but does not, at this level, indicate pancreatic disease.\n\nWhat has been excluded is as valuable as what has been found. There is no anaemia, no iron deficiency, no B12 or folate deficiency severe enough to cause symptoms on its own, no diabetes or insulin resistance, no liver disease, no kidney disease, no active infection, no coeliac disease, no significant allergic process, no cardiac damage and no concerning tumour markers. The prostate is healthy. The bones and minerals are in good order. The immune system, aside from the autoimmune thyroid finding, is functioning normally.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon, or leftover meat. Anchor: before anything else touches the plate. Why: protein at breakfast steadies the blood sugar curve that is causing the afternoon crash, supports muscle building at the training load you are carrying, and helps close the gap between his current intake and his 104g daily target.\nEat at least three portions of vegetables or salad every day, building to five over the next month. One with lunch, two with dinner, starting this week. Anchor: the meal is not finished until the vegetables are gone. Why: his current 0 to 1 portions is the single biggest dietary gap in the report. Vegetables provide the folate that will bring his level above 8 and lower his homocysteine from 12.5, the soluble fibre that lowers LDL cholesterol, and the insoluble fibre that will likely improve his bloating.\nSwap sugary snacks for a handful of nuts, an apple with peanut butter, or oatcakes with cheese on the days he currently has sugary food. Anchor: when the craving hits, the alternative is already in the desk drawer or kitchen. Why: nuts provide magnesium and healthy fats that raise HDL, and the slower energy release prevents the insulin overshoot behind the afternoon crash.\nReduce alcohol to seven drinks per week maximum, with at least three alcohol-free days. Anchor: designate Monday to Wednesday as alcohol-free and do not negotiate. Why: 10 to 14 drinks is the most likely driver of his triglycerides at 2.53, contributes to the low HDL of 1.05 and the mildly raised lipase, fragments deep sleep where testosterone is produced, and may be suppressing his bicarbonate.\nEat a proper meal within 90 minutes of waking, every day, even if appetite is low. Anchor: alarm goes off, kettle on, food out. Why: his raised NEFA at 1.37 confirms the body is running on fat stores in the morning, which drives the catabolic state behind his fatigue and below-optimal testosterone.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking for at least 10 minutes of daylight. Anchor: shoes by the door the night before. Why: a fixed wake time is the single most powerful tool for improving sleep quality, and morning light resets the cortisol rhythm that governs the energy pattern through the day. His 6 to 7 hours with exhausted waking is not enough recovery for hard training five days a week.\nCut caffeine after 1pm. Anchor: the last coffee is with or just after lunch. Why: caffeine has a half-life of 5 to 6 hours, so a 3pm coffee is still half-active at 9pm and fragments the deep sleep stages he is missing.\nAim for 2,150 calories per day with at least 104g of protein. Track for two weeks to calibrate portions, then eat intuitively. A first weight target of 75kg, then 68kg where BMI reaches 24.9, at a rate of 0.5kg per week. Why: this is roughly 300 calories below his estimated expenditure of 2,443, enough for steady fat loss without compromising training recovery or suppressing testosterone further.","flags":"Positive ANA at 1:160 speckled with anti-TPO at 104, more than five times the upper limit of 20. This combination is strongly associated with Hashimoto's thyroiditis. Thyroid function is currently normal (TSH 2.23, FT4 18.8, FT3 4.97) but should be monitored at least annually, with treatment options discussed with the GP if TSH rises above range.\nLDL cholesterol 3.59 (limit 3.0), ApoB 116 mg/dL (ideal below 80 mg/dL), HDL 1.05 (limit 1.55), triglycerides 2.53 (limit 2.3), total cholesterol to HDL ratio 5.51 (limit 5.0). Cardiovascular Risk Score 55 out of 100 (ideal below 20). Lp(a) less than 5.2, which is ideal, confirming the entire lipid profile is modifiable. Small LDL percentage 39%, above the 35% threshold. Non-HDL cholesterol 4.74, above the 3.8 limit. VLDL cholesterol 1.15, above the 1.0 limit. Diet, alcohol reduction and weight loss are the primary levers; GP to assess whether a statin is indicated alongside lifestyle changes.\nHomocysteine 12.5 (ideal below 9) with folic acid 6.5 (ideal above 8). The two are directly linked: folate is required to metabolise homocysteine. Increasing vegetable intake and considering a methylfolate supplement should lower both.\nBicarbonate 17.3, below the lower limit of 22, with anion gap 21.7, above the upper limit of 20. Most likely driven by training load and alcohol. Worth a routine repeat with the GP to confirm it is not persistent.\nLipase 80, above the upper limit of 65, with pancreatic amylase normal at 32 and no abdominal pain. At 10 to 14 drinks per week, this may reflect early pancreatic sensitivity to alcohol. Worth monitoring if alcohol intake continues at this level.\nNon-esterified fatty acids 1.37, above the 0.9 limit. Reflects heavy reliance on fat stores for fuel between meals, consistent with below-average food volume against a high training load.\nTestosterone 15.3 (optimal 18 to 30). Below optimal but within laboratory range. Sleep, alcohol, body fat and food volume are all contributing. Lifestyle changes should improve this without medical intervention.\nHB-EGF 142.2, marginally above the upper limit of 136. Not clinically significant in isolation.\nIL-15 0.63, marginally below the lower limit of 0.89. Not clinically significant at this margin.\nProgesterone 0.81, above the 0.47 upper limit for men. Mildly elevated progesterone in men is common and benign at this level.\nReassuring negatives: hsCRP 0.37 makes significant systemic inflammation very unlikely. FIB-4 1.04, APRI 0.199 and NAFLD fibrosis score minus 2.37 make significant liver fibrosis very unlikely. HOMA-IR 0.70 and HbA1c 33.2 make insulin resistance and diabetes very unlikely. Cystatin C eGFR 90 and combined eGFR 99 make kidney disease very unlikely. Coeliac screen negative. Rheumatoid factor and anti-CCP negative. PSA 0.37 with decreased prostate cancer risk score. All tumour markers within range. D-dimer undetectable. Troponin T within range. EBV serology shows past infection only, no reactivation.\nNot reported on this occasion: Pan-ProBNP, Leptin, Resistin, IL-6, TNFa, Cystatin C (Urine), NGAL, KIM-1, Gastrin, Pepsinogen I, Pepsinogen II, PGI/II ratio, Gastrin-17, mCRP, IL-1a, IL-1b, IL-2, IL-4, IL-10, IL-23, TGF-a, VEGF, MIP-1a, E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1, PD-1, Nicked PSA, FABP-4, FABP-5, FABP-6, FABP-7, FABP-9, and multiple cytokine autoantibody panels.","recommendations":"Discuss the positive ANA (1:160 speckled) and anti-TPO (104, limit 20) with the GP. Request annual thyroid function monitoring. If fatigue worsens or TSH rises above range, discuss treatment options with the GP.\nBring the full lipid panel to the GP: LDL 3.59, ApoB 116 mg/dL, HDL 1.05, triglycerides 2.53, Lp(a) less than 5.2, Cardiovascular Risk Score 55. Discuss whether lifestyle modification alone is sufficient or whether a statin should be considered alongside dietary changes and alcohol reduction.\nMention the homocysteine of 12.5 alongside the folate of 6.5. If folate does not improve with dietary changes, the GP may wish to check methylation status.\nRequest a repeat bicarbonate on routine bloods. Mention the value of 17.3 alongside the corrected anion gap of 21.7 and ask for a venous blood gas if it remains low.\nMention the lipase of 80 (limit 65) in the context of 10 to 14 drinks per week. If bloating persists despite dietary changes, a hydrogen breath test for SIBO or lactose intolerance is worth requesting.\nAim for 2,150 calories per day, at least 104g of protein, a first weight target of 75kg and a final target of 68kg. Retest in four to six months with a lipid panel, thyroid function, homocysteine, folate, bicarbonate and testosterone to track the response to lifestyle changes.","supplementation":"Methylfolate (5-MTHF), 400 to 800 mcg daily, taken with breakfast. Why: folic acid is 6.5, below the optimal of 8, and homocysteine is 12.5, above the optimal of 9. Methylfolate is the active form and will help clear homocysteine while dietary folate builds up from increased vegetable intake.\nOmega-3 fish oil providing 2g of combined EPA and DHA daily, taken with the largest meal. Why: omega-3 lowers triglycerides (currently 2.53, above the 2.3 limit), supports HDL function, and has anti-inflammatory properties that may benefit the autoimmune thyroid picture.\nVitamin D3 (cholecalciferol) 2,000 IU daily with a fat-containing meal through the winter months, paired with vitamin K2 (MK-7) 100 mcg. Why: vitamin D is 99, just under the optimal of 100, and at a BMI of 29.4 fat tissue sequesters vitamin D, so levels will drop over winter without supplementation. K2 directs calcium to bone rather than arteries.\nMagnesium glycinate 300mg taken before bed. Why: magnesium is 0.92, within range but only just inside the optimal band, and glycinate is the form best absorbed and most supportive of sleep quality, which is his most pressing lifestyle issue.\nZinc bisglycinate 15mg daily with food, taken at least two hours apart from any magnesium dose. Why: zinc is 12.2, just at the optimal floor of 12, and supports testosterone production and immune function. His copper at 11.7 is at the lower limit of its range, so zinc supplementation should not exceed 15mg to avoid suppressing copper further.\nDo not take iron supplements. Ferritin is 105 and transferrin saturation is 24.4%; iron stores are adequate and supplementation would risk pushing them unnecessarily high.\nThe most important changes from this report are not supplements. They are eating more vegetables, eating enough food to fuel five TUDIES","result":"105.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4355","lower_normal":"19.999","upper_normal":"300","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5476","units":"ug/l","description":"Ferritin is the body's iron storage protein. His 105.8 sits comfortably in the optimal range of 50 to 200, meaning iron stores are healthy and there is no need for supplementation.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, poor absorption","high_causes":"Inflammation, haemochromatosis, liver disease, iron overload","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"60.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4804","lower_normal":"44.8","upper_normal":"80.6","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3818","upper_optimal_position":"0.5866","units":"umol/l","description":"TIBC measures the total capacity of the blood to carry iron. His 60.6 is within the optimal range, confirming that the body has a healthy level of transferrin available to transport iron and is not trying to compensate for deficiency.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4741","lower_normal":"2","upper_normal":"3.8","lower_optimal":"2.3","upper_optimal":"3.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5926","units":"g/l","description":"Transferrin is the protein that transports iron through the blood to the bone marrow and other tissues. His 2.76 is well within range and consistent with healthy iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"24.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3822","lower_normal":"20","upper_normal":"50","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying protein transferrin is currently loaded with iron. His 24.4% is within the laboratory range but just below the optimal floor of 25%. This is a marginal finding and does not indicate iron deficiency, particularly with ferritin at 105. It simply means that at the moment of the blood draw, slightly less iron than ideal was bound to transferrin.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uibc","name":"UIBC","group":"IRON STUDIES","result":"45.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5483","lower_normal":"20","upper_normal":"60","lower_optimal":"25","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"umol/l","description":"Unsaturated iron binding capacity measures the spare capacity of transferrin to carry more iron. His 45.8 is within the optimal range, indicating a healthy balance between iron supply and transport capacity.","low_causes":"Iron overload","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"irontibcratio","name":"Iron:TIBC Ratio","group":"IRON STUDIES","result":"0.244","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0.15","upper_normal":"0.5","lower_optimal":"0.25","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.5714","units":"ratio","description":"This ratio is equivalent to transferrin saturation expressed as a decimal. His 0.244 is within the reference range but just below the optimal floor of 0.25, consistent with his transferrin saturation of 24.4%. A marginal finding that does not indicate iron deficiency.","low_causes":"Iron deficiency","high_causes":"Iron overload","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5790","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"4.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. His 5.79 is above the 5.0 upper limit. On its own, total cholesterol is a blunt tool because it includes protective HDL, but at this level with a low HDL of 1.05, the excess is almost entirely driven by LDL and VLDL, which are the atherogenic fractions.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, obesity, hypothyroidism, familial hypercholesterolaemia, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5983","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL cholesterol is the form that deposits cholesterol inside artery walls, driving atherosclerosis over time. His 3.59 is above the 3.0 limit and well above the ideal of less than 2.6. Combined with his ApoB of 1.16 g/L and low HDL, this represents the central driver of his cardiovascular risk. The Lp(a)-corrected LDL is 3.57, almost identical, confirming that inherited Lp(a) is not contributing and the entire LDL burden is modifiable through diet, weight and alcohol changes.","low_causes":"Hyperthyroidism, malnutrition, liver disease, statin use","high_causes":"Diet high in saturated fat, obesity, hypothyroidism, familial hypercholesterolaemia, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3387","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.55","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5000","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL cholesterol is the protective form that carries excess cholesterol away from artery walls and back to the liver for disposal. His 1.05 is below the 1.55 lower limit for men and well below the optimal of 1.4. A low HDL means less cholesterol is being cleared, which amplifies the risk from his elevated LDL. The most effective ways to raise HDL are regular aerobic exercise (which he is doing), reducing alcohol, losing body fat and increasing healthy fat intake from oily fish, nuts and olive oil.","low_causes":"Obesity, sedentary lifestyle, smoking, high-carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.51","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5510","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"%","description":"This ratio divides total cholesterol by HDL and is a useful summary of how much of the cholesterol in the blood is protective versus harmful. His ratio of 5.51 is above the 5.0 limit, driven by both the elevated total cholesterol and the low HDL. A ratio below 4 is considered ideal.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, elevated total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats carried in the blood, released after meals and produced by the liver from excess carbohydrate and alcohol. His 2.53 is above the 2.3 limit and well above the ideal of less than 1.0. Alcohol is the most likely single driver: each drink the liver processes generates triglyceride-rich VLDL particles. Refined carbohydrates and sugary food some days are additional contributors. Reducing alcohol to under seven drinks per week and replacing sugary snacks with protein and healthy fat would be expected to lower triglycerides significantly.","low_causes":"Very low fat diet, hyperthyroidism, malnutrition","high_causes":"Alcohol, high carbohydrate or sugar diet, obesity, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"128.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4575","lower_normal":"95","upper_normal":"186","lower_optimal":"140","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4982","upper_optimal_position":"0.6447","units":"mg/dl","description":"Apolipoprotein A-I is the main structural protein of HDL cholesterol, the protective form. His 128.9 is within the laboratory range but below the optimal of 140, consistent with his low HDL of 1.05. It confirms that not only is HDL low in concentration, there are fewer HDL particles in the blood to perform the reverse cholesterol transport function.","low_causes":"Obesity, sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"116","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5134","lower_normal":"49","upper_normal":"173","lower_optimal":"49","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4167","units":"mg/dl","description":"ApoB counts the number of atherogenic particles in the blood. Each LDL, VLDL and intermediate-density lipoprotein particle carries exactly one ApoB molecule, so this is the best single measure of how many particles are available to penetrate artery walls. His 116 mg/dL is within the broad laboratory range but well above the ideal target of 80 mg/dL. This is the number the GP should focus on when deciding treatment, because it is a more accurate predictor of cardiovascular events than LDL cholesterol alone.","low_causes":"Hyperthyroidism, malnutrition, statin use","high_causes":"High saturated fat diet, obesity, insulin resistance, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.90","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"0.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3500","units":"","description":"This ratio compares the number of atherogenic particles (ApoB) to the number of protective HDL particles (ApoA-I). His 0.90 is approaching the 1.0 limit and well above the ideal male threshold of 0.7. A ratio above 0.7 in men indicates the balance between harmful and protective lipids is tilted in the wrong direction. This single ratio captures the combined problem of his elevated ApoB and low HDL.","low_causes":"High HDL, low LDL, healthy lifestyle","high_causes":"Low HDL, elevated LDL, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteincii","name":"Apolipoprotein CII","group":"LIPIDS & CARDIOVASCULAR","result":"8.42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"1.68","upper_normal":"9.17","lower_optimal":"2.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3698","upper_optimal_position":"0.5923","units":"mg/dl","description":"Apolipoprotein CII is a cofactor that activates the enzyme lipoprotein lipase, which breaks down triglycerides in the blood. His 8.42 is in the upper half of the laboratory range, which is consistent with his elevated triglycerides: the body is producing more ApoCII to try to clear the triglyceride-rich particles, but the supply is outpacing the clearance.","low_causes":"ApoCII deficiency (rare genetic cause of very high triglycerides)","high_causes":"Elevated triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinciii","name":"Apolipoprotein CIII","group":"LIPIDS & CARDIOVASCULAR","result":"16.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6188","lower_normal":"4.5","upper_normal":"18","lower_optimal":"4.5","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5185","units":"mg/dl","description":"Apolipoprotein CIII inhibits the clearance of triglyceride-rich particles from the blood. His 16.06 is in the upper portion of the range and above the optimal of 12, which means the body has more of this clearance-blocking protein than ideal. This is consistent with and contributes to his elevated triglycerides.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome, alcohol, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"5.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5281","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"3.0","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5817","units":"mg/dl","description":"Apolipoprotein E helps clear triglyceride-rich particles and cholesterol remnants from the blood. His 5.18 is within the optimal range, indicating this clearance mechanism is functioning adequately.","low_causes":"","high_causes":"Elevated triglycerides, type III hyperlipoproteinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"54.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4199","lower_normal":"0","upper_normal":"64.4","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2717","units":"mg/dl","description":"Small dense LDL particles are the most atherogenic subtype of LDL because their smaller size allows them to penetrate artery walls more easily. His 54.08 is within the laboratory range but well above the ideal of less than 35. This is consistent with his elevated triglycerides, which shift LDL particle production towards the smaller, denser type.","low_causes":"Low triglycerides, large buoyant LDL pattern","high_causes":"Elevated triglycerides, metabolic syndrome, insulin resistance, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"<5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0347","lower_normal":"0","upper_normal":"75","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lipoprotein(a) is an inherited form of LDL that cannot be changed by diet or lifestyle. It carries additional cardiovascular risk because it promotes clotting and inflammation as well as depositing cholesterol. His result of less than 5.2 is ideal, well below the 32 threshold. This is genuinely useful information because it confirms that his elevated LDL and ApoB are driven entirely by modifiable factors such as diet, weight and alcohol, not by an inherited lipid burden.","low_causes":"","high_causes":"Genetic inheritance (not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"12.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"5","upper_normal":"20","lower_optimal":"5","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4222","units":"umol/l","description":"Homocysteine is an amino acid produced during protein metabolism. The body clears it using folate, B12 and B6 as cofactors. When it accumulates above the optimal level of 9, it is associated with increased cardiovascular risk, damage to blood vessel walls and impaired cognitive function. His 12.5 is within the laboratory range but above optimal, and it connects directly to his folic acid of 6.5 (below optimal at 8). Increasing dietary folate from vegetables and leafy greens, or supplementing with methylfolate, should bring this down.","low_causes":"","high_causes":"Low folate, low B12, low B6, genetic MTHFR variants, kidney disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1850","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"mg/l","description":"hsCRP is the most sensitive blood marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. His 0.37 is well below the 1.0 ideal limit, which is genuinely impressive at a BMI of 29.4 with 10 to 14 drinks per week. It means there is no detectable systemic inflammatory process driving his symptoms or adding to his cardiovascular risk.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, smoking, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"193.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4842","lower_normal":"0","upper_normal":"200","lower_optimal":"0","upper_optimal":"200","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"iu/ml","description":"ASO measures antibodies against the streptococcal bacterium, which causes strep throat. A raised level would suggest a recent streptococcal infection. His 193.7 is within the normal range of less than 200, though near the upper end. This does not indicate active infection.","low_causes":"","high_causes":"Recent streptococcal infection, rheumatic fever, post-streptococcal glomerulonephritis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","result":"<0.050","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0564","lower_normal":"0","upper_normal":"0.443","lower_optimal":"0","upper_optimal":"0.443","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ug/ml","description":"D-Dimer is a fragment released when a blood clot breaks down. A raised level can indicate active clot formation or breakdown. His result of less than 0.050 is essentially undetectable, making a current blood clotting event very unlikely and reflecting a healthy clotting system.","low_causes":"","high_causes":"Deep vein thrombosis, pulmonary embolism, DIC, surgery, infection, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il3","name insulin, adrenal insufficiency","high_causes":"Pre-diabetes, diabetes, stress, dawn phenomenon, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"33.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3955","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin that has been coated with sugar over the past two to three months, giving a reliable picture of average blood sugar. His 33.2 is well within the ideal of less than 36, confirming excellent blood sugar control over time. Diabetes is defined at 48 and pre-diabetes at 42, so he is comfortably below both thresholds.","low_causes":"Recent blood loss, haemolytic anaemia","high_causes":"Pre-diabetes, diabetes, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"19.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3366","lower_normal":"17.8","upper_normal":"173","lower_optimal":"17.8","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4154","units":"pmol/l","description":"Insulin shows how much insulin the pancreas is producing. His 19.3 pmol/L is at the lower end of the laboratory range and well below the level that would suggest insulin resistance. This is consistent with his excellent HOMA-IR of 0.70 and confirms that his body is highly insulin-sensitive, which is a protective factor against metabolic disease.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","result":"1.370","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mmol/l","description":"Non-esterified fatty acids (NEFA) are free fatty acids released from fat stores when the body needs fuel between meals. His 1.37 is above the 0.9 limit and suggests the body is drawing more heavily on fat reserves than usual, which is consistent with his slightly below-average food volume against a high training load. Elevated NEFA can contribute to hepatic triglyceride production, which may partly explain his elevated triglycerides.","low_causes":"Recent meal, high insulin levels","high_causes":"Fasting, low food intake, insulin resistance, high training load, weight loss","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","result":"1.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3495","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ng/ml","description":"C-peptide is released in equal amounts to insulin and measures the pancreas's own insulin production. His 1.26 ng/ml is at the lower end of the range, consistent with his low insulin and high insulin sensitivity. The pancreas is producing exactly the amount of insulin needed, no more, which is the healthy response.","low_causes":"Type 1 diabetes, low carbohydrate intake, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"230","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5101","lower_normal":"151","upper_normal":"300","lower_optimal":"160","upper_optimal":"270","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3535","upper_optimal_position":"0.5996","units":"umol/l","description":"Fructosamine measures average blood sugar over the past two to three weeks, a shorter window than HbA1c. His 230 is within the optimal range, confirming that blood sugar has been well controlled not just over months but also recently.","low_causes":"Low protein, liver disease","high_causes":"Poorly controlled diabetes, high blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1750","lower_normal":"0","upper_normal":"2","lower_optimal":"0","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"","description":"HOMA-IR estimates insulin resistance from fasting glucose and insulin. A value below 1.0 indicates excellent insulin sensitivity. His 0.70 is genuinely impressive at a BMI of 29.4, because insulin resistance typically emerges at this weight. It means his muscle and liver cells are responding very well to insulin, which protects against type 2 diabetes and metabolic syndrome. This is one of the strongest positive findings in the report.","low_causes":"High insulin sensitivity, low carbohydrate diet, exercise","high_causes":"Insulin resistance, obesity, metabolic syndrome, PCOS","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"2.49","within_norm
