<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Christopher Hall","dob":"29/03/1974","report_date":"2026-09-21","summary":"Christopher is a 52-year-old male presenting with a BMI of 29.1, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. He trains four times per week, three cardio sessions and one resistance session, with 7,500 to 10,000 daily steps. He reports no medications, no diagnosed conditions, and no habits of note from the quiz. He reports weight gain and difficulty losing weight alongside brain fog. His goals are to improve long-term health and longevity, lose body fat, and build muscle.\n\nThe finding that stands out most in this report, and the one Christopher should discuss with his GP before anything else, is his lipid profile and specifically his Lipoprotein(a). Lipoprotein(a), often written Lp(a), is a particle in the blood that is entirely genetically determined. It cannot be changed by diet, exercise, or any currently available supplement. Christopher's Lp(a) is 169.87 nmol/L, well above the 32 nmol/L threshold for increased risk and sitting in what is classified as the moderate risk category (90 to 200). Lp(a) works in three ways that increase cardiovascular risk: it deposits cholesterol in artery walls just like LDL does, it encourages blood clotting by interfering with the body's natural clot-dissolving system, and it drives local inflammation at the vessel wall. Because it is inherited and permanent, this result should be recorded in Christopher's medical notes and his first-degree relatives, particularly any children, should be offered testing. This is not an emergency, but it is a lifelong piece of medical information that changes how aggressively his other lipid markers should be managed.\n\nAlongside the Lp(a), the rest of the lipid panel tells a clear story. His total cholesterol is 8.2, which is high. His LDL cholesterol, the main carrier of cholesterol into artery walls, is 5.88, nearly double the upper limit of 3.0. His ApoB, which is a direct count of the number of particles capable of entering the artery wall and is considered the single best marker of cardiovascular risk, is 1.44 g/L against a desirable target of below 0.9. His non-HDL cholesterol, which captures everything harmful, is 6.4 against a target of below 4.0. His ApoB to ApoA1 ratio, which summarises the balance between particles driving atherosclerosis and particles clearing it, is 0.84, above the lower risk threshold of 0.7. Now, some of this LDL is being carried by Lp(a) particles rather than standard LDL particles. When we subtract the Lp(a) contribution, the corrected LDL is 5.33, which is still well above the 3.0 target. This means that even after accounting for the genetic component, there is a large modifiable fraction of his LDL that diet, lifestyle, and if his GP agrees, medication can bring down. His Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 85 out of 100, where below 20 is ideal and below 40 is acceptable. That score is high, and it is high primarily because of the Lp(a), the ApoB, and the LDL. Christopher is 52, and while his absolute ten-year event risk is lower than someone of 70 with the same numbers, the gap between his current score and the ideal is the window he has to act in, and acting now is considerably more effective than acting at 62.\n\nThe genuinely encouraging counterpart to those lipid numbers is that several things within the same panel are working in his favour. His HDL cholesterol is 1.8, which is excellent and well above the 1.4 optimal threshold for a man. HDL particles carry cholesterol away from the artery wall back to the liver for disposal, and at 1.8 that clearance system is working hard. His ApoA1, the protein that drives HDL function, is 1.71, comfortably above the 1.20 threshold. His triglycerides are 1.3, within the acceptable range and not far from the optimal target of below 1.0. His TG to HDL ratio, a marker of insulin resistance and small dense LDL, is 0.72, which is excellent. His atherogenic index of plasma is negative at minus 0.141, which is ideal. These findings tell us that the metabolic environment around his lipids, the insulin sensitivity, the triglyceride handling, the HDL function, is in good shape. The problem is the sheer volume of LDL and ApoB particles, amplified by a genetic Lp(a) load.\n\nHis liver is in excellent health. ALT is 30, which is right at the optimal ceiling for a man but within it. AST is 27. Gamma GT is 15, which is very clean indeed and tells us the liver is under no metabolic or toxic strain. ALP is 47, bilirubin is 19, albumin is 45, and total protein is 73, all comfortably within range. His FIB-4 score, which estimates liver scarring using age, platelets, ALT and AST, is 1.28, below the 1.3 threshold that would prompt further investigation. The De Ritis ratio (AST divided by ALT) is 0.9, sitting in the optimal band. The APRI score is 0.336 and the NAFLD Fibrosis Score is minus 1.712, both well within the safe zone. Put together, these markers rule out significant liver inflammation, fatty liver disease, or fibrosis with a high degree of confidence.\n\nHis kidney function tells an important and slightly nuanced story. His creatinine is 113, which the laboratory has flagged as above their upper limit of 104. However, creatinine is produced by muscle and is influenced by body size, meat intake, and hydration. At 90 kg with some training, a creatinine of 113 is not alarming on its own. The more important measure is Cystatin C, a protein filtered by the kidneys that is not affected by muscle mass. His Cystatin C is 1.06, just within the laboratory limit of 1.1. The Cystatin C based eGFR is 73, and the combined creatinine and Cystatin C eGFR is also 73. An eGFR above 90 is considered fully optimal, and above 60 is the threshold for normal function. At 73, Christopher's kidneys are working adequately but not optimally for 52. This is not kidney disease, but it is below the level we would like to see, and it is worth monitoring. His urea is 5.7, his urea to creatinine ratio is 50.4, and his electrolytes, sodium at 141, potassium at 4.6, chloride at 101, and bicarbonate at 28.9, are all within range. Uric acid at 297 is well within the optimal band of 200 to 380. His kidneys are doing their job, but the eGFR of 73 is a number to track over time to ensure it does not drift further.\n\nHis blood sugar control is reassuring, with an important caveat. His fasting glucose was not returned by the laboratory because the required fluoride oxalate tube was not received. This is a gap, and we will come back to it. However, his HbA1c, which reflects average blood sugar over the preceding two to three months, is 34 mmol/mol, comfortably within the normal range of below 42 and below the optimal ceiling of 36. His insulin is 6.64 mIU/L, which is within the ideal band of 2 to 8, telling us his pancreas is not having to work excessively hard to control blood sugar. His C-Peptide, a molecule released in equal amounts to insulin and used to confirm true insulin production, is 1.8 ug/L (596 pmol/L), within range. His estimated average glucose is 5.8 mmol/L. Without a fasting glucose we cannot calculate HOMA-IR or HOMA-B, which would have given us a direct measure of insulin resistance and pancreatic output. The HbA1c and insulin together are reassuring, but we would recommend repeating a fasting glucose at the next test to complete this picture, particularly given his goal of losing body fat and his symptom of difficulty losing weight.\n\nHis thyroid is working well. TSH, the signal from the brain that tells the thyroid how hard to work, is 1.93, sitting neatly in the optimal band of 1.0 to 2.5. Free T4, the storage form of thyroid hormone, is 17.9, within the optimal range of 14 to 20. Free T3, the active form that drives metabolism, is 4.4, which is within the laboratory range but just below the optimal lower bound of 4.5. This is a marginal finding and not one that would explain significant symptoms on its own, but it is worth noting that T3 is the hormone that directly influences metabolic rate, energy, and mental clarity. His FT3 to FT4 ratio is 0.246, just below the optimal band of 0.27 to 0.40, which suggests the conversion from T4 to T3 could be slightly more efficient. Both thyroid antibodies are negative, firmly ruling out autoimmune thyroid disease. The thyroid is functioning, but the slightly below-optimal T3 and conversion ratio are consistent with someone who could benefit from ensuring adequate selenium, zinc, and overall calorie intake, all of which support T3 conversion.\n\nHis full blood count is largely healthy. Haemoglobin is 144, red cells 4.56, haematocrit 0.413, MCV 90.6, and MCH 31.6, all within range and telling us there is no anaemia, no B12 or folate deficiency affecting red cell production, and no iron deficiency anaemia. His MCHC is 349, marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin inside each red cell, and at this margin, especially given that MCHC can be affected by sample temperature and storage, this is almost certainly laboratory variation rather than a clinical finding. Platelets are 201, white cells 4.76, and the differential (neutrophils 2.81, lymphocytes 1.37, monocytes 0.44, eosinophils 0.12, basophils 0.02) is entirely normal. Reticulocytes, the young red cells that show how actively the bone marrow is producing, are 1.95%, healthy. ESR, a general marker of inflammation, is 12, right at the upper limit of 12 and not a concern in isolation.\n\nHis iron studies are in good shape overall. Serum iron is 27.9, transferrin is 2.42, iron binding capacity is 56.3, and ferritin, the body's iron store, is 50 ng/mL, right at the lower edge of the optimal range of 50 to 200. It is within range but not generous, and given he is training and wants to build muscle, keeping ferritin closer to 80 to 100 would better support oxygen transport and energy. His transferrin saturation is 45.91%, which is above the optimal upper bound of 40% though within the laboratory range of 18 to 55%. A transferrin saturation above 45% can be seen transiently after a recent iron-rich meal, but when it is consistently elevated alongside other markers it can suggest the body is absorbing more iron than it needs. His ferritin is not elevated, which is reassuring, but if the saturation remains above 45% on a repeat fasted sample, it would be worth his GP considering an HFE gene test to exclude hereditary haemochromatosis, a common genetic condition in people of European ancestry that causes excessive iron absorption. This is not urgent, but it is worth noting.\n\nhsCRP, the high-sensitivity measure of systemic inflammation, is 1.8 mg/L. The laboratory range is below 5, but the optimal target for cardiovascular risk is below 1.0. At 1.8, this is mildly elevated above optimal. CRP at this level is commonly driven by visceral body fat, particularly at a BMI of 29, and it contributes to the inflammatory environment that accelerates the damage done by high LDL and Lp(a). Reducing body fat is the single most effective way to bring this number below 1.0.\n\nHis hormones present an interesting picture. His testosterone is 33.2 nmol/L, above the laboratory upper limit of 28.7. This is a genuinely strong result for a 52-year-old man. His SHBG (sex hormone binding globulin), the protein that binds testosterone and makes it unavailable to tissues, is 65.8, sitting right at the top of the laboratory range. High SHBG means that despite a high total testosterone, less of it is free and available. His free testosterone is 0.482 nmol/L, within range (0.13 to 1.04) but not as high as the total number might suggest. His bioavailable testosterone, the fraction available to tissues, is 11.8 nmol/L, which is actually above the upper optimal limit of 9, so the effective testosterone reaching his tissues is healthy. His oestradiol is 169 pmol/L, above the upper limit of 146.1. In men, oestradiol is produced by the conversion of testosterone to oestrogen by an enzyme called aromatase, which is found in fat tissue. At a BMI of 29 with body fat Christopher wants to lose, increased aromatase activity is a plausible explanation. The elevated oestradiol is not dangerous at this level, but it can contribute to water retention, difficulty losing fat, and potentially breast tissue sensitivity. Losing body fat would reduce aromatase activity and bring oestradiol down. His LH is 5.87 and FSH is 8.8, both within range, confirming the pituitary is signalling normally. Cortisol is 276, within the morning range. Prolactin is 115, normal. DHEA-S is 3.1 umol/L (1142 ug/dL), healthy. Progesterone at 0.96 is within range for a male, where it has no major clinical significance.\n\nHis amylase is 120 IU/L, marginally above the upper limit of 118, and his lipase is 85 U/L, above the upper limit of 60. Amylase and lipase are enzymes produced by the pancreas to digest carbohydrates and fats respectively. When both are mildly elevated together, it can reflect low-grade pancreatic strain or simply be a normal variant in some individuals. At these levels, they are not in the range that would suggest acute pancreatitis, which typically produces values three to five times the upper limit. However, the combination of both being above range is worth mentioning to his GP, particularly as a baseline. If Christopher experiences any episodes of upper abdominal pain radiating to the back, nausea after fatty meals, or unexplained digestive discomfort, these numbers provide useful context.\n\nCreatine kinase is 412 U/L, above the upper limit of 320. CK is an enzyme released from muscle cells when they are damaged, and it rises reliably after resistance training, intense cardio, or any unaccustomed physical activity. If Christopher trained within 48 to 72 hours of the blood draw, this is almost certainly exercise-induced and not a concern. It is worth knowing the number so that if CK is ever tested in a medical context, the baseline is established.\n\nHis vitamins and minerals are generally well placed. Vitamin D is 104 nmol/L, sitting nicely within the optimal range of 75 to 120. This is an excellent level and suggests he is either supplementing or getting meaningful sun exposure. Calcium is 2.5, corrected calcium 2.43, both within range. Phosphate is 1.2 and magnesium is 0.96, the latter within the optimal band of 0.85 to 1.05. PTH is 2.089, normal, confirming calcium and vitamin D are in balance. Folate is 22 ng/mL, above the upper laboratory limit of 17, which typically reflects supplementation with folic acid or a diet very rich in leafy greens. Excess folate is water-soluble and excreted by the kidneys, so this is not harmful, but if Christopher is supplementing with folic acid he can reduce the dose. His B12 is 376 pg/mL, within the laboratory range of 193 to 982 but below the optimal threshold of 500. B12 is essential for nerve function, red cell production, and energy metabolism. At 376, it is not deficient, but raising it towards 500 to 700 would better support the energy and cognitive function he is looking for, particularly given his report of brain fog.\n\nHis immune markers, IgG, IgM, IgA, and IgE, are all within range, as is rheumatoid factor at 4. Coeliac screening via tissue transglutaminase IgA is negative, ruling out coeliac disease. His total antioxidant activity is 1.73, within range. His prostate markers are excellent: PSA is 0.22 with a free PSA ratio of 0.545, which is very reassuring. His tumour markers CA19-9 and CEA are both well within range.\n\nHis urinalysis shows no protein, no glucose, no ketones, no nitrites, no casts, no bacterial growth, and a clean urine culture. His urine WBCs are 30, which the laboratory notes as significant above 10. However, with no nitrites, no bacterial growth, no culture growth, and no reported urinary symptoms, this is most likely a sample collection artefact rather than infection. If Christopher develops any urinary symptoms, frequency, burning, or cloudiness, a repeat sample would be warranted, but in the absence of symptoms this does not require action.\n\nNow, to the symptoms Christopher reports. His brain fog and difficulty losing weight are the two things he would most like this report to explain. The bloods have positively excluded several common causes of these symptoms: his thyroid is working, his HbA1c and insulin are healthy, his B12 is not deficient, his iron stores are adequate, his testosterone is strong, his kidneys and liver are functioning, and there is no anaemia or inflammation severe enough to cause cognitive symptoms. However, there are several findings that may be contributing at the margins. His B12 at 376 is below optimal, and B12 is directly involved in nerve conduction and cognitive function. His free T3 at 4.4 is just below the optimal floor, and T3 is the hormone that drives metabolic rate and mental clarity. His hsCRP at 1.8 reflects a low-grade inflammatory state that is associated with fatigue and cognitive sluggishness in the literature. His oestradiol being elevated relative to range can contribute to water retention and a subjective sense of heaviness. And his diet, rated 5 out of 10 for quality and 5 out of 10 for volume, alongside only one resistance session per week, means the two most powerful levers for body composition and cognitive function, nutrition and strength training, have significant room to improve. The brain fog in particular is worth tracking: if improving B12, sleep quality, diet quality, and training does not resolve it, a conversation with his GP about further investigation would be appropriate.\n\nHis PhenoAge, an estimate of biological age derived from blood markers, will be calculated by the pipeline and added to this report. His Mentzer index of 19.9 is reported for context; it is a screening tool for thalassemia trait and at this value is not suggestive of it.\n\nIn summary, this is a report with one major finding, the lipid and Lp(a) profile, that needs medical attention and a GP conversation. The rest of the picture is of a 52-year-old man whose organs are functioning well, whose hormones are strong, and whose metabolic health is better than his BMI might suggest, but who has significant cardiovascular risk building silently and has substantial room to improve through diet, body composition, and increased resistance training.","links":"The dominant thread running through this report is cardiovascular risk, and it has two distinct components. The first is genetic: Christopher's Lp(a) at 169.87 nmol/L is an inherited trait that deposits cholesterol in artery walls, promotes clotting, and drives inflammation at the vessel surface. This cannot be changed by any lifestyle intervention. The second component is modifiable: his LDL at 5.88, ApoB at 1.44, and non-HDL cholesterol at 6.4 are all substantially above target, and even after subtracting the Lp(a) contribution, his corrected LDL is 5.33, still nearly double the optimal ceiling. His diet quality at 5 out of 10 and his BMI of 29 are the most likely drivers of this modifiable fraction. His hsCRP at 1.8, mildly elevated above the optimal 1.0, adds an inflammatory layer to the cardiovascular picture that body fat reduction would address.\n\nThe second thread is the interplay between body composition, oestradiol, and his symptoms. At a BMI of 29, Christopher is carrying excess body fat, and fat tissue contains the aromatase enzyme that converts testosterone to oestradiol. His testosterone is genuinely high at 33.2, but his oestradiol at 169 is above range, and this conversion is the most likely explanation. The excess oestradiol can contribute to water retention and difficulty shifting weight. Meanwhile, his SHBG at the top of the range is binding a proportion of that testosterone, though his bioavailable testosterone remains healthy. Reducing body fat would lower aromatase activity, bring oestradiol down, and likely free up more testosterone by reducing SHBG over time.\n\nThe third thread is the question of what is not explained. Christopher's brain fog is not accounted for by any single dramatic abnormality. His thyroid works, his HbA1c is excellent, his testosterone is strong. But three marginal findings may be contributing collectively: B12 at 376 (below the 500 optimal floor), free T3 at 4.4 (just below the 4.5 optimal floor and the conversion ratio slightly low), and hsCRP at 1.8 (reflecting low-grade systemic inflammation). None of these individually would cause noticeable brain fog, but together, alongside a diet rated 5 for quality and only one resistance session per week, they represent a metabolic environment that is not fully optimised for cognitive clarity.\n\nThe mildly elevated amylase and lipase sit as a loose end. They are not in the acute range and may simply be Christopher's normal variant, but they are both above range together, which means the pancreas deserves a mention in his GP conversation, particularly if any digestive symptoms develop. Similarly, the transferrin saturation at 45.9% with a ferritin of only 50 is an unusual combination that could reflect recent dietary iron intake or, less commonly, a genetic tendency to absorb excess iron. A repeat fasted measurement and potentially an HFE gene test would settle this.\n\nThe eGFR of 73 does not connect directly to the lipid story or the symptoms, but it sits as an independent finding worth tracking. At 52, an eGFR of 73 is adequate but below optimal, and maintaining good hydration, avoiding excessive protein supplementation, and controlling blood pressure (which has not been measured here) are the practical steps to protect kidney function going forward.\n\nFinally, it is worth noting what this report positively rules out. There is no diabetes or pre-diabetes. There is no liver disease. There is no thyroid autoimmunity. There is no coeliac disease. There is no prostate concern. There is no anaemia. There is no immune deficiency or excess. The tumour markers are clean. These are all genuine positives that narrow the clinical picture to the lipid and body composition story as the clear priority.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon, or leftover chicken. Anchor: protein goes on the plate before anything else. Why: at 90 kg aiming to lose fat and build muscle, Christopher needs 117 to 144 grams of protein per day, and front-loading it at breakfast supports satiety, preserves muscle, and helps manage the insulin response.\nSwap refined carbohydrates (white bread, pastries, sugary cereals, white rice) for whole grain and high-fibre alternatives (oats, rye bread, quinoa, sweet potato) one meal at a time, starting with whichever meal currently has the most processed carbohydrate. Why: soluble fibre directly lowers LDL cholesterol by binding bile acids in the gut, and Christopher's LDL at 5.88 and ApoB at 1.44 are the modifiable part of his cardiovascular risk.\nEat oily fish (salmon, mackerel, sardines) at least three times per week, or supplement with omega-3 if fish is not realistic. Anchor: plan two fish dinners and one fish lunch each week on a fixed day. Why: omega-3 fatty acids lower triglycerides, reduce hsCRP, and improve the HDL function that is already one of the strong points in this report.\nReduce saturated fat by switching from butter to olive oil, choosing leaner cuts of meat, and limiting cheese and processed meat to two to three portions per week rather than daily. Why: saturated fat is the primary dietary driver of LDL production in the liver, and reducing it is the most direct lever for bringing ApoB down.\nAdd two resistance training sessions per week to the current one, aiming for three total. Full body or upper-lower split, focusing on compound movements (squat, deadlift, press, row, pull). Anchor: fix the days in the diary now rather than deciding week to week. Why: resistance training builds the lean mass that raises metabolic rate, improves insulin sensitivity, lowers hsCRP, and is the most effective intervention for the body composition change Christopher wants. One session per week is not enough stimulus to build muscle.\nWalk for fifteen minutes immediately after the largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, supports the eGFR by improving blood flow to the kidneys, and adds to the daily step count without needing willpower.\nAim for seven to eight hours of sleep per night with a fixed wake time, even at weekends. Get outside within an hour of waking for ten minutes of natural light. Set a caffeine cut-off at 1pm. Why: sleep quality directly affects cortisol, testosterone, appetite hormones, and cognitive function. Brain fog in particular is strongly associated with poor or insufficient sleep, and fixing sleep is the highest-yield intervention for mental clarity that blood tests cannot measure.\nCalorie target for fat loss: approximately 2,000 to 2,200 kcal per day, based on an estimated TDEE of 2,600 kcal at his current weight and activity level, creating a moderate deficit of 400 to 600 kcal. Protein floor: 130 grams per day minimum. Target weight range: 78 to 83 kg, which would bring his BMI into the 25 to 27 range and meaningfully reduce aromatase activity, hsCRP, and LDL.","flags":"Lp(a) 169.87 nmol/L, above the 32 nmol/L threshold, placing Christopher in the moderate risk category. This is a genetically inherited and unchangeable cardiovascular risk factor that should be recorded permanently in his medical notes. First-degree relatives should be offered testing. Given the Lp(a), his GP should consider whether statin therapy or a PCSK9 inhibitor referral is appropriate to reduce the modifiable LDL fraction as aggressively as possible.\nTotal cholesterol 8.2, LDL 5.88 (limit 3.0), ApoB 1.44 (target below 0.9), non-HDL 6.4 (target below 4.0), TC/HDL ratio 4.56 (limit 4.5), ApoB/A1 ratio 0.84 (target below 0.7). Even after Lp(a) correction, LDL is 5.33, still well above target. Cardiovascular Risk Score 85/100. The modifiable fraction remains large and should be addressed through diet, body composition, and potentially pharmacotherapy given the Lp(a) amplification.\nhsCRP 1.8 mg/L, above the optimal cardiovascular target of below 1.0. Most likely driven by visceral adiposity at BMI 29. Contributes to the inflammatory component of cardiovascular risk alongside the elevated Lp(a).\nOestradiol 169 pmol/L, above the male upper limit of 146.1. Most likely driven by aromatase activity in adipose tissue given BMI 29 and high total testosterone. Expected to improve with fat loss.\nAmylase 120 IU/L (limit 118) and lipase 85 U/L (limit 60). Both mildly elevated. Not in the acute pancreatitis range but both above range together, warranting mention to the GP as a baseline. No action needed unless digestive symptoms develop.\nCreatinine 113 umol/L (limit 104) with Cystatin C 1.06 (limit 1.1). Combined eGFR 73, adequate but below the optimal threshold of 90. Not kidney disease at this level but worth tracking over time.\nTransferrin saturation 45.91%, above the optimal ceiling of 40%. Ferritin is not elevated at 50, which is reassuring, but if saturation remains above 45% on a repeat fasted sample, HFE gene testing should be considered to exclude hereditary haemochromatosis.\nTestosterone 33.2 nmol/L, above the laboratory upper limit of 28.7. Bioavailable testosterone 11.8 nmol/L, above the optimal upper limit of 9. Not clinically concerning in the absence of symptoms of excess, and LH and FSH are normal, confirming endogenous production.\nCK 412 U/L, above the limit of 320. Almost certainly exercise-induced if training occurred within 72 hours of the blood draw. Not a concern but establishes a baseline.\nFolate 22 ng/mL, above the upper limit of 17. Reflects supplementation or a high-folate diet. Water-soluble and excreted, not harmful, but supplementation dose can be reduced.\nMCHC 349, marginally above the limit of 345. At this margin, most likely laboratory variation, especially as MCV and MCH are both normal.\nUrine WBCs 30 wbc/ul (significant above 10), but with negative nitrites, no bacterial growth, no culture growth, and no urinary symptoms. Most likely a sample collection artefact. Repeat if urinary symptoms develop.\nFasting glucose not returned by the laboratory (fluoride oxalate tube not received). HOMA-IR and HOMA-B could not be calculated. Recommend repeating at next test.\nReassuring negatives: HbA1c 34 (no diabetes or pre-diabetes), liver function entirely clean with FIB-4 1.28 and NAFLD score minus 1.712, thyroid function normal with both antibodies negative, PSA 0.22 with excellent free ratio, coeliac screen negative, immunoglobulins all normal, tumour markers all normal, no anaemia, urinalysis otherwise clean.","recommendations":"Discuss the Lp(a) result of 169.87 nmol/L with your GP. This is a genetically inherited cardiovascular risk factor that should be recorded permanently in your medical notes. Ask whether referral to a lipid clinic is appropriate given the combination of Lp(a), LDL 5.88, and ApoB 1.44. First-degree relatives, particularly children, should be offered Lp(a) testing.\nDiscuss statin therapy or other lipid-lowering medication with your GP. With an Lp(a)-corrected LDL of 5.33 and ApoB of 1.44, the modifiable fraction of cardiovascular risk is large. Lifestyle changes should run in parallel with this conversation, not instead of it.\nMention the amylase of 120 and lipase of 85, both mildly above range, so they are on your GP record as a baseline. No action is needed now unless you develop upper abdominal pain, nausea after fatty meals, or digestive symptoms.\nMention the transferrin saturation of 45.91%. If this remains above 45% on a repeat fasted sample, an HFE gene test would be appropriate to exclude hereditary haemochromatosis.\nAsk your GP to check your blood pressure if it has not been measured recently. At BMI 29 with elevated lipids and an hsCRP of 1.8, blood pressure is an important part of the cardiovascular risk picture that this blood test cannot measure.\nRequest a fasting glucose on your next blood test to complete the metabolic picture. The fluoride oxalate sample was not received this time, which means HOMA-IR could not be calculated.\nRetest target: repeat the full panel in four to six months. Key markers to track: LDL, ApoB, hsCRP, oestradiol, eGFR (Cystatin C), fasting glucose, transferrin saturation, and ferritin. Calorie target 2,000 to 2,200 kcal per day, protein minimum 130g per day, target weight 78 to 83 kg.","supplementation":"Omega-3 fish oil: 2 to 3 grams of combined EPA and DHA per day, taken with a meal containing fat. Why: omega-3 supports triglyceride reduction, lowers hsCRP, and improves HDL function. With an ApoB of 1.44 and hsCRP of 1.8, this is one of the few supplements with meaningful evidence for cardiovascular benefit.\nVitamin B12 as sublingual methylcobalamin: 1,000 mcg daily, dissolved under the tongue. Why: Christopher's B12 is 376, within range but below the optimal floor of 500. B12 is essential for nerve function and cognitive clarity, and raising it towards 500 to 700 may help with the brain fog he reports.\nMagnesium glycinate: 300 to 400 mg before bed. Why: magnesium is 0.96, within the optimal band, but glycinate specifically supports sleep quality and muscle recovery, both of which matter given the goal of increasing resistance training to three sessions per week and the importance of sleep for cognitive function.\nVitamin D3 (cholecalciferol): 2,000 IU daily with a fat-containing meal, taken with vitamin K2 (MK-7) 100 mcg. Why: vitamin D is 104, in the optimal range of 75 to 120. A maintenance dose of 2,000 IU will keep it there through the winter months. K2 ensures the calcium mobilised by vitamin D is directed to bones rather than arteries, which is particularly relevant given the cardiovascular risk profile.\nDo not take iron supplements. Christopher's ferritin is adequate at 50 and his transferrin saturation is already at 45.9%, above the optimal ceiling. Adding supplemental iron could push saturation higher and, if there is any undiagnosed tendency to iron overload, could cause harm.\nReduce or stop folic acid supplementation if currently taking it. Folate at 22 is above the laboratory range and does not need further supplementation.\nThe most important changes from this report are not supplements. They are reducing saturated fat and increasing soluble fibre to bring LDL and ApoB down, adding two resistance training sessions per week to build muscle and lower body fat, and having the GP conversation about Lp(a) and lipid-lowering therapy.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 69 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 85; capped below 70 while a system is rated \"See your GP\"; final 69.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built rather than the ten-year probability of an event. Christopher's score of 85 is high, driven primarily by his Lp(a) at 169.87, ApoB at 1.44, and LDL at 5.88. At 52, his absolute ten-year event risk is lower than someone of 70 with the same numbers, but the gap between 85 and the ideal of below 20 is the window he has to act in, and acting now is considerably more effective than acting at 62.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5397","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the preceding two to three months. Christopher's result of 34 mmol/mol is well within the normal range of below 42 and below the optimal ceiling of 36, confirming that his blood sugar control over recent months has been excellent. This is a genuinely reassuring finding at BMI 29.","low_causes":"","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high sugar or refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4023","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5752","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas to move glucose from the blood into cells for energy. A high fasting insulin suggests the body is having to produce more than it should to keep blood sugar in check, which is an early sign of insulin resistance. Christopher's fasting insulin of 6.64 mIU/L sits within the ideal band of 2 to 8, meaning his pancreas is working efficiently and his cells are responding well to insulin. This is a strong result at BMI 29.","low_causes":"Low carbohydrate diet, high insulin sensitivity, fasting","high_causes":"Insulin resistance, excess body fat, high sugar or refined carbohydrate intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4040","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4242","units":"ug/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin, providing an independent measure of how much insulin the body is producing. Christopher's result of 1.8 ug/L (approximately 596 pmol/L) is within the laboratory range and confirms healthy pancreatic insulin output. It sits just below the optimal upper bound of 2.0, indicating the pancreas is not being overworked.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, excess body fat, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"Not returned","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Fasting blood glucose was not returned by the laboratory because the required fluoride oxalate tube was not received. This means HOMA-IR and HOMA-B, which quantify insulin resistance and pancreatic output, could not be calculated. His HbA1c of 34 and insulin of 6.64 are reassuring, but a fasting glucose should be included in the next blood test to complete the metabolic picture.","low_causes":"","high_causes":"","padding":"","one_sided":"","range_type":""},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c result and represents what Christopher's blood sugar has been averaging over the past two to three months. At 5.8 mmol/L, this is within both the laboratory and optimal ranges, confirming good glycaemic control.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"144","within_normal":"TRUE","within_optimal":"FALSE","result_pos
