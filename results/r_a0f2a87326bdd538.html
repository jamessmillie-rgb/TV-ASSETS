<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

her cardiovascular risk. It also means that any first-degree relatives, her children, siblings, or parents, should be tested, because approximately half of them will carry the same elevated level. While Lp(a) itself cannot be lowered, the fact that much of the rest of her lipid picture is driven by modifiable insulin resistance means there is genuine scope to improve her overall cardiovascular risk substantially. Reducing triglycerides through weight loss and dietary change, improving insulin sensitivity, and lowering ApoB through these same mechanisms would meaningfully offset the fixed risk from Lp(a). Her GP should be made aware of the Lp(a) result alongside the broader lipid profile, and given her smoking status, a formal cardiovascular risk assessment would be appropriate.\n\nHer liver shows a pattern worth noting. ALT at 29 is within the laboratory range of under 56 but sits above the tighter female optimal of under 25, and GGT (gamma-glutamyl transferase, an enzyme that rises with metabolic strain, alcohol use, or certain medications) is 63 against an upper limit of 38 for women. ALP, AST, bilirubin, and albumin are all healthy, and her FIB-4 score at 0.73 rules out any significant fibrosis. The GGT elevation in this context is most likely metabolic, driven by the same insulin resistance and elevated triglycerides that affect the rest of the picture. Smoking can also contribute to oxidative stress on the liver. If Melinda addresses the metabolic pattern through weight loss and dietary change, GGT would be expected to improve. This is worth mentioning to the GP but is not a cause for alarm in the context of otherwise healthy liver function.\n\nHer ESR (erythrocyte sedimentation rate, a measure of how quickly red blood cells settle in a tube, which rises with inflammation) is 28 against a limit of 12, which is notably elevated. Her hs-CRP (high-sensitivity C-reactive protein, a more specific marker of systemic inflammation) is 0.8, which is actually excellent and below the optimal threshold of 1.0. This discordance, high ESR with low CRP, is not uncommon and is most often explained by factors that affect ESR independently of acute inflammation. At age 56, the normal ESR threshold for women is often quoted as (age + 10) divided by 2, which gives an adjusted upper limit of 33, meaning Melinda's result of 28 falls within the age-adjusted range. Additionally, her haemoglobin is at the top of the female range at 150, and elevated haemoglobin can affect ESR. This is unlikely to represent an active inflammatory process given the reassuringly low CRP, but it is worth noting for the GP.\n\nHer corrected calcium at 2.64 is marginally above the upper limit of 2.6. Her PTH (parathyroid hormone, the hormone that regulates calcium levels) is 2.057, which is mid-range and appropriately normal. A single marginally elevated corrected calcium reading can occur with mild dehydration or sample handling, and with PTH behaving normally, this does not suggest primary hyperparathyroidism. However, it should be noted and repeated on a fresh fasting sample to confirm whether it is persistent. Phosphate at 1.2 is normal, which is reassuring.\n\nHer SHBG (sex hormone binding globulin, the protein that carries sex hormones in the blood) is 24.2 against a lower limit of 27.8. Low SHBG is strongly associated with insulin resistance and is in fact one of its earliest markers. In this context, it fits perfectly with the metabolic picture. Her total testosterone at 0.6 is at the floor of the female range, and her free testosterone at 0.0131 is at the absolute lower boundary of the reference range. In a post-menopausal woman (her FSH at 74.39 and LH at 44.29 confirm she is firmly post-menopausal, and her oestradiol below 43 and progesterone at 0.66 are consistent with this), low testosterone can contribute to difficulty building and maintaining muscle, reduced energy, and difficulty losing body fat, all of which are relevant to Melinda's symptoms and goals. This is worth discussing with her GP or a menopause-specialist clinician, as testosterone replacement in post-menopausal women is an established option when symptoms are present.\n\nHer transferrin at 2.39 is marginally below the lower limit of 2.5. Transferrin is the protein that carries iron in the blood, and it is also a negative acute-phase reactant, meaning it can drop with inflammation or metabolic stress. Her ferritin at 135 is healthy and within the optimal female range, her iron at 12.1 and saturation at 20.16% are within range though the saturation is at the lower end of optimal. This pattern does not suggest iron deficiency or overload, and the mildly low transferrin is most likely related to the metabolic and inflammatory milieu.\n\nThere is a great deal of positive news in this report. Her thyroid function is excellent, with TSH at 1.09, which is right in the optimal sweet spot, FT4 at 15.3 within the optimal band, and FT3 at 4.8 in the optimal range. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease entirely. Her kidney function is strong, with a Cystatin C-based eGFR of 99, creatinine of 58, and urea of 3.3, all healthy. Uric acid at 349 is within range and below the point where gout or kidney stone risk increases. Her vitamin D at 78 is in the sufficient range, though pushing it above 100 would be ideal. Her B12 at 518 is within the optimal range, and her folate at 16 is excellent. Her magnesium at 0.92 sits within the optimal band. Her calcium, phosphate, and PTH are functioning together appropriately. Her full blood count is reassuring overall: haemoglobin at 150 is at the top of the female range but not above it, platelets at 269 are healthy, and her white cell differential is well balanced with a neutrophil-to-lymphocyte ratio of 1.15, which is excellent. Her reticulocyte count at 1.82% shows healthy red cell production. Her red blood cell count at 4.82 is marginally above the upper limit of 4.8, which at this margin is not clinically significant and is consistent with her haemoglobin being at the top of range. Her MCHC at 348 is marginally above the upper limit of 345, a finding that at this margin is typically laboratory or temperature variation and is not a concern. Her cortisol at 289 is within the morning reference range. Her prolactin at 63 is within the post-menopausal range. Her creatine kinase at 126 is healthy and consistent with her training load. Her pancreatic enzymes, amylase at 101 and lipase at 49, are both well within range. Her immunoglobulins are all normal, rheumatoid factor is negative, IgE is low ruling out significant allergic activation, and her coeliac screen is negative. Her tumour markers, CA-125 at 11.5 and CEA at 1.08, are both reassuringly normal (CA 19-9 and CA 15-3 are pending). Her total antioxidant activity at 1.59 is healthy. Her urinalysis is clean, with no protein, glucose, ketones, blood, or white cells, and nitrites are negative. Bacterial culture is pending.\n\nHer C-Peptide at 3.74 ug/L (approximately 1,238 pmol/L) is within the laboratory range and is consistent with the elevated insulin output her pancreas is producing to manage blood sugar. Her HOMA-B, which estimates how hard the pancreatic beta cells are working, calculates to approximately 142.6, which is within range and confirms the pancreas is still capable of meeting the elevated demand, but the question is for how long if the insulin resistance is not addressed.\n\nIn summary, this report centres on a clear and developing metabolic pattern: insulin resistance driving pre-diabetes, elevated triglycerides, an atherogenic lipid profile, liver enzyme elevation, and low SHBG. This pattern is compounded by a significantly elevated inherited Lp(a), which adds a fixed cardiovascular risk that makes addressing the modifiable factors even more important. The encouraging news is that nearly every abnormal result in this report traces back to insulin resistance, and insulin resistance at this stage is fully reversible. Weight loss of 8 to 12 kilograms, combined with dietary changes to reduce refined carbohydrates and increase soluble fibre, continued resistance training, and smoking cessation would be expected to improve the HbA1c, HOMA-IR, triglycerides, LDL, ApoB, GGT, SHBG, and potentially free testosterone. The thyroid, kidneys, immune system, and bone marrow are all functioning well, giving Melinda a strong foundation to build on.\n\nLate-arriving results: The additional haematology markers confirm what the original report described. The haematocrit at 0.43 and white cell count at 5.47 are both comfortably within optimal ranges, and the absolute reticulocyte count at 87.7 x10⁹/L confirms healthy bone marrow activity. The red blood cell count at 4.82 is technically one point above the upper female limit of 4.8, consistent with the haemoglobin sitting at the top of range, and as noted in the original report this marginal excess is not clinically significant. The urine culture and sensitivity panel, which returns alongside an otherwise entirely clean urinalysis with fewer than 1 white cell and fewer than 1 red cell per microlitre and negative nitrites, most likely represents a skin commensal organism introduced during sample collection rather than a true urinary tract infection; however, the panel is clinically useful to hold on file, as it shows the organism is sensitive to the majority of antibiotics commonly used to treat urinary tract infections including Ciprofloxacin, Trimethoprim, Nitrofurantoin, and Fosfomycin, with resistance only to Gentamicin. Melinda should share this sensitivity profile with her GP so it is available in her notes if she develops urinary symptoms in future. The remaining late markers, ALT, AST, FIB-4, lipids, VLDL, insulin, PTH, FT4, TSH, TgAb, CA 15-3, and CEA, are all values already discussed in the main report and their addition here does not change any interpretation or recommendation previously made.","links":"Melinda's results point to a clear set of actions, all of which reinforce each other because they target the same underlying metabolic pattern.\n\nThe first and most impactful change is weight loss. At 142.5 cm and 67 kg, her BMI is 33.0. A target weight of 55 to 59 kg would bring her BMI into the 27 to 29 range, which is a realistic and meaningful first phase. To achieve this, she should aim for a calorie intake of approximately 1,350 to 1,500 calories per day, creating a moderate deficit from her estimated maintenance of around 1,750 calories (based on her height, weight, age, and activity level using a multiplier of 1.45 for light to moderate activity). Protein intake should be 87 to 107 grams per day (1.3 to 1.6 g/kg of current body weight), prioritising it at every meal to preserve muscle mass during weight loss and support her resistance training. Protein also has a greater effect on satiety than carbohydrate or fat, which will help with the reduced calorie intake.\n\nThe dietary focus should shift towards reducing refined carbohydrates and sugars, which directly drive the insulin resistance pattern seen in her results. Practical changes include replacing white bread, pasta, and rice with whole grain alternatives or legumes, increasing soluble fibre intake through oats, beans, lentils, and vegetables (targeting 30g of total fibre per day), and including oily fish such as salmon, mackerel, or sardines two to three times per week to support triglyceride reduction and provide omega-3 fatty acids. Reducing saturated fat intake by choosing leaner protein sources and limiting processed foods will also help lower LDL and ApoB. Given that her diet volume is currently rated 5 out of 10, the goal is not to eat less food overall but to eat the same volume of more nutrient-dense, lower-calorie, higher-fibre foods.\n\nHer training programme of two cardio and two resistance sessions per week is a good foundation. If possible, adding a third resistance session would be beneficial, as muscle tissue is the body's largest consumer of glucose and the most effective way to improve insulin sensitivity. Her step count of 7,500 to 10,000 is solid, and aiming for the upper end of that range consistently would add meaningful daily energy expenditure.\n\nSmoking cessation is the single most important lifestyle change for long-term health in this report. Smoking worsens insulin resistance, accelerates cardiovascular disease (which is particularly important given her elevated Lp(a)), damages blood vessel walls, raises inflammation, impairs lung function, and is the leading modifiable cause of cancer. Melinda should discuss cessation support with her GP, as combination approaches using nicotine replacement therapy or prescription medications like varenicline have the highest success rates.\n\nMelinda should bring this report to her GP and specifically discuss the following: her HbA1c of 43 mmol/mol placing her in the pre-diabetic range, her HOMA-IR of 2.8 indicating significant insulin resistance, her lipid profile including an ApoB of 1.18 and triglycerides of 2.9, her Lp(a) of 157.86 nmol/L which should be recorded permanently in her medical notes, a formal cardiovascular risk assessment given the combination of smoking, Lp(a), and lipid findings, the GGT of 63 in the context of the metabolic pattern, the corrected calcium of 2.64 marginally above range for repeat testing, the low SHBG and borderline testosterone in the context of post-menopausal symptoms, and smoking cessation support. Her GP may consider metformin if lifestyle changes do not bring HbA1c below 42 within six months, and should assess whether statin therapy is appropriate given the combination of elevated ApoB and high Lp(a).\n\nFirst-degree relatives, particularly children, should be offered Lp(a) testing, as approximately half will have inherited the same elevated level. This is a one-time test that provides lifelong information.\n\nA retest of the following markers is recommended in four to six months: HbA1c, fasting insulin, HOMA-IR, full lipid panel including ApoB, GGT, corrected calcium, SHBG, and free testosterone. This will show whether the lifestyle changes are shifting the metabolic picture.","flags":"PRE-DIABETES AND INSULIN RESISTANCE: HbA1c 43 mmol/mol (pre-diabetic threshold 42). Fasting insulin 12.12 mIU/L (above optimal ceiling of 8). HOMA-IR 2.8 (indicates early-to-significant insulin resistance, optimal below 1.0). Fasting glucose 5.2 remains within range. C-Peptide 3.74 ug/L (1,238 pmol/L) and HOMA-B approximately 142.6 confirm adequate pancreatic output under increased demand. Pattern is consistent with developing insulin resistance at BMI 33 and warrants GP monitoring. Consider six-monthly HbA1c surveillance and lifestyle intervention as first line.\n\nATHEROGENIC LIPID PROFILE: Total cholesterol 6.6 mmol/L. LDL 3.89 (target below 3.0). ApoB 1.18 g/L (target below 0.9, borderline high). Triglycerides 2.9 mmol/L (target below 1.7). VLDL 1.32 (above 0.78). Non-HDL 5.1 (target below 4.0). Remnant cholesterol 1.21 (target below 0.5). TG/HDL ratio 1.93 (target below 1.5). ApoB/A1 ratio 0.75 (average risk, target below 0.6). HDL 1.5 is close to desirable threshold of 1.55. ApoA1 1.57 is healthy. The elevated triglycerides and VLDL are consistent with insulin resistance driving hepatic overproduction of triglyceride-rich particles. Formal cardiovascular risk assessment recommended.\n\nLIPOPROTEIN(a): 157.86 nmol/L (moderate risk, range 90 to 200). Genetically determined, unchangeable. Should be recorded permanently in medical notes. First-degree relatives should be tested. Adds fixed cardiovascular risk that increases the importance of addressing all modifiable risk factors.\n\nELEVATED GGT: 63 IU/L (female upper limit 38). ALT 29 (within lab range but above female optimal of 25). AST 19, ALP 77, bilirubin 8, albumin 40, FIB-4 0.73 are all normal. Pattern is consistent with metabolic liver strain from insulin resistance and elevated triglycerides rather than primary liver disease. Smoking may contribute.\n\nELEVATED ESR: 28 mm/hour (lab limit 12). However, hs-CRP is 0.8, which is below the optimal threshold of 1.0. Age-adjusted ESR upper limit for a 56-year-old woman is approximately 33. Discordance suggests ESR is driven by non-inflammatory factors (age, haemoglobin at top of range). Low clinical concern but noted for completeness.\n\nMARGINALLY ELEVATED CORRECTED CALCIUM: 2.64 mmol/L (upper limit 2.6). PTH 2.057 pmol/L is mid-range and appropriately normal. Phosphate 1.2 is normal. Single marginal elevation may reflect hydration status or sample handling. Recommend repeat on fresh fasting sample to exclude persistent hypercalcaemia.\n\nLOW SHBG: 24.2 nmol/L (lower limit 27.8). Strongly associated with insulin resistance and is an early marker of the metabolic pattern seen throughout this report. Expected to improve with weight loss and improved insulin sensitivity.\n\nBORDERLINE LOW TESTOSTERONE: Total testosterone 0.6 nmol/L (lower limit 0.5). Free testosterone 0.0131 nmol/L (at the lower boundary of the range, 0.013). In the context of confirmed post-menopausal status (FSH 74.39, LH 44.29, oestradiol below 43), low testosterone may contribute to difficulty with body composition and energy. Discussion with GP or menopause specialist regarding testosterone replacement may be appropriate.\n\nLOW TRANSFERRIN: 2.39 g/L (lower limit 2.5). Iron 12.1, ferritin 135, saturation 20.16% are all within range. Mildly low transferrin is consistent with its role as a negative acute-phase reactant in the context of metabolic stress. No action needed but noted.\n\nMARGINAL RED CELL FINDINGS: RBC 4.82 (upper limit 4.8) and MCHC 348 (upper limit 345) are both marginally above range. At these margins, neither is clinically significant.\n\nPENDING RESULTS: CA 15-3, bacterial count, and urine culture and sensitivities are to follow.\n\nReassuring negatives: Thyroid function excellent with negative antibodies. Kidney function strong (Cystatin C eGFR 99). Fasting glucose within range. CRP 0.8 (below optimal threshold). FIB-4 0.73 rules out fibrosis. Tumour markers CA-125 and CEA normal. Coeliac screen negative. Immunoglobulins normal. Rheumatoid factor negative. Urinalysis clean. Vitamin D sufficient. B12 and folate optimal. Magnesium optimal.","recommendations":"1. Discuss HbA1c of 43 and HOMA-IR of 2.8 with GP as a priority. Request six-monthly HbA1c monitoring and discuss whether metformin should be considered if lifestyle changes do not bring HbA1c below 42 within six months.\n\n2. Record Lp(a) of 157.86 nmol/L permanently in medical notes and request a formal cardiovascular risk assessment. Discuss with GP whether statin therapy is appropriate given the combination of elevated ApoB, high Lp(a), and smoking.\n\n3. Arrange Lp(a) testing for first-degree relatives (children, siblings).\n\n4. Target a weight loss of 8 to 12 kg over the next 6 to 12 months, aiming for a body weight of 55 to 59 kg. Calorie target 1,350 to 1,500 per day. Protein target 87 to 107 grams per day.\n\n5. Reduce refined carbohydrates and sugars. Increase soluble fibre to 30g per day through oats, lentils, beans, and vegetables. Include oily fish two to three times per week. Reduce saturated fat by choosing leaner proteins.\n\n6. Continue resistance training and consider adding a third session per week. Aim for the upper end of the step range (10,000 daily).\n\n7. Pursue smoking cessation with GP support. Discuss nicotine replacement therapy or varenicline.\n\n8. Request repeat corrected calcium on a fresh fasting sample to confirm or exclude persistent mild hypercalcaemia.\n\n9. Discuss low SHBG and borderline testosterone with GP or menopause specialist. Testosterone replacement may be appropriate for a post-menopausal woman with symptoms affecting body composition and energy.\n\n10. Increase vitamin D supplementation to bring levels above 100 nmol/L (see supplementation section).\n\n11. Retest in four to six months: HbA1c, fasting insulin, HOMA-IR, full lipid panel with ApoB, GGT, corrected calcium, SHBG, free testosterone.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with the largest meal of the day that contains fat. Melinda's current level of 78 nmol/L is sufficient but below the optimal threshold of 100. At a BMI of 33, fat tissue sequesters vitamin D, so a higher dose is needed to push levels into the optimal range. This should always be paired with Vitamin K2 (MK-7) at 100 to 200 mcg daily, which ensures the calcium mobilised by vitamin D is directed into bones rather than artery walls, a consideration that is particularly relevant given her marginally elevated corrected calcium.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This directly supports triglyceride reduction, which at 2.9 is one of the key findings in this report. Omega-3 also has anti-inflammatory properties and supports cardiovascular health, which is important given the elevated Lp(a). Look for a product that specifies the EPA and DHA content per capsule rather than just total fish oil.\n\nMagnesium glycinate: 300 mg before bed. Melinda's magnesium at 0.92 is within the optimal band, but magnesium glycinate supports insulin sensitivity, sleep quality, and muscle recovery, all of which are relevant to her goals. The glycinate form is the best tolerated and the most bioavailable.\n\nNo iron supplementation is needed. Melinda's ferritin at 135 is healthy and within the optimal female range, and adding iron would risk pushing stores unnecessarily high.\n\nNo B12 supplementation is needed at present. Her level of 518 is within the optimal range.\n\nThe most important changes from this report are not supplements. They are losing 8 to 12 kg through a calorie-controlled, high-protein, high-fibre diet, continuing and expanding her resistance training, and stopping smoking. These three changes would be expected to improve the HbA1c, HOMA-IR, triglycerides, LDL, ApoB, GGT, SHBG, and free testosterone, addressing nearly every abnormal finding in this report.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 79 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 79; no cap applied; final 79.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"45.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3754","lower_normal":"","upper_normal":"61","lower_optimal":"","upper_optimal":"56","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4590","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"100","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":""
