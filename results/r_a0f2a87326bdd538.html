:"0.7167","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6333","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has become glycated, meaning sugar has attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Melinda's result of 6.1% falls in the pre-diabetic range (6.0 to 6.4%). This means that over the past three months, blood sugar levels have been running higher than they should. This is the earliest stage of metabolic change on the path toward type 2 diabetes, and critically, it is fully reversible with weight loss, dietary change, and exercise.","low_causes":"Blood loss, haemolytic anaemia, chronic kidney disease, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake, sedentary lifestyle, obesity, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in different units. At 43 mmol/mol, Melinda's result is one point above the pre-diabetic threshold of 42. The normal range is below 42, pre-diabetes is 42 to 47, and diabetes is diagnosed above 48. This single point above the threshold is significant because it confirms a trend of elevated average blood sugar, but it also means she is at the very earliest stage where intervention is most effective.","low_causes":"Blood loss, haemolytic anaemia, chronic kidney disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake, obesity, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"12.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4764","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5484","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to absorb glucose from the blood. Melinda's fasting insulin of 12.12 mIU/L is within the laboratory range but above the optimal ceiling of 8. This elevated fasting level means the pancreas is producing more insulin than it should need to keep blood sugar in check, a hallmark of insulin resistance. The cells have become less responsive to insulin's signal, so the pancreas compensates by producing more. This is a key driver of the metabolic pattern seen throughout this report.","low_causes":"Type 1 diabetes, very low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, obesity, high carbohydrate diet, polycystic ovarian syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"3.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5993","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5242","units":"ug/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and provides a reliable measure of how much insulin the body is actually producing. At 3.74 ug/L (approximately 1,238 pmol/L), Melinda's C-Peptide is in the upper portion of the laboratory range, confirming that her pancreas is working hard to produce the elevated insulin levels seen in her insulin result. This is consistent with the insulin resistance pattern and confirms that the pancreas is still capable of meeting the demand, which is a positive finding in the sense that pancreatic function has not yet begun to fail.","low_causes":"Type 1 diabetes, advanced type 2 diabetes with beta cell failure, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes (early stage), obesity, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8200","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells have become to insulin's signal. Melinda's score of 2.8 indicates early-to-significant insulin resistance. Optimal is below 1.0, above 1.9 indicates early insulin resistance, and above 2.9 indicates significant insulin resistance. At 2.8, she is just below the significant threshold. This is the single most important metabolic marker in the report because it quantifies the degree of insulin resistance that is driving multiple other findings including elevated triglycerides, elevated LDL, low SHBG, and the pre-diabetic HbA1c.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, regular exercise","high_causes":"Obesity, sedentary lifestyle, high refined carbohydrate intake, visceral fat accumulation, genetic predisposition, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"142.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5020","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates the function of the pancreatic beta cells, the cells responsible for producing insulin. Calculated as (20 x insulin) / (glucose - 3.5), Melinda's score of approximately 142.6 is within the normal range of 80 to 200. This confirms that her pancreas is still functioning adequately and is able to produce the increased insulin demanded by her insulin-resistant state. This is reassuring in the sense that pancreatic capacity has not yet declined, but it also reflects the compensatory overwork that defines the pre-diabetic state.","low_causes":"Beta cell failure, advanced type 2 diabetes, type 1 diabetes, pancreatic damage","high_causes":"Insulin resistance with compensatory overproduction, early type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3452","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or under metabolic stress, ALT leaks into the bloodstream. Melinda's result of 29 IU/L is within the laboratory range of under 56 but sits above the tighter female optimal threshold of under 25 IU/L. In the context of her insulin resistance and elevated triglycerides, this mild elevation likely reflects the metabolic strain the liver is under as it processes excess triglyceride-rich particles. It is not a sign of liver disease but is a sensitive early signal of metabolic liver stress.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Non-alcoholic fatty liver disease, alcohol consumption, medications, viral hepatitis, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5208","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. At 19 IU/L, Melinda's result is well within the optimal range and suggests the liver cells themselves are not under significant direct stress. The fact that AST is lower than ALT is the expected pattern in metabolic liver stress (as opposed to alcohol-related liver disease, where AST typically exceeds ALT).","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle injury, medications, alcohol consumption","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8289","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to metabolic stress, alcohol intake, and oxidative damage. Melinda's result of 63 IU/L is above the female upper limit of 38. In the context of this report, the elevation is most likely driven by the insulin resistance and elevated triglycerides that are placing metabolic demand on the liver, combined with oxidative stress from smoking. The remainder of the liver panel, including AST, bilirubin, albumin, and the FIB-4 score, is reassuringly normal, which means this elevation reflects functional metabolic strain rather than structural liver damage.","low_causes":"Normal finding","high_causes":"Alcohol consumption, non-alcoholic fatty liver disease, metabolic syndrome, medications, obesity, smoking, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"ALP (alkaline phosphatase) is an enzyme found in the liver and bones. At 77 IU/L, Melinda's result is comfortably within range. A normal ALP alongside the elevated GGT helps confirm that the GGT elevation is metabolic in origin rather than related to bile duct obstruction, which would elevate both.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. At 8 umol/L, Melinda's bilirubin is well within range, confirming that the liver is processing bilirubin normally and that there is no obstruction to bile flow.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"57","upper_normal":"82","lower_optimal":"57","upper_optimal":"82","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"Total protein measures albumin and globulin combined. At 74 g/L, Melinda's result is healthy, reflecting adequate protein synthesis by the liver and a normal immune globulin contribution.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"34","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It maintains fluid balance and transports hormones, vitamins, and medications. At 40 g/L, Melinda's albumin is healthy, confirming good liver synthetic function.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin includes a range of proteins produced by the liver and immune system. At 34 g/L, Melinda's result is within the laboratory range but in the upper portion. Globulin can rise with chronic low-grade inflammation or immune activation, though her individual immunoglobulin levels are all within range, suggesting this is simply her normal baseline.","low_causes":"Liver disease, immune deficiency, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3738","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio is calculated by dividing albumin by globulin (40 / 34 = 1.18). It provides a quick measure of the balance between these two protein groups. At 1.18, Melinda's ratio is within the laboratory range but below the optimal threshold of 1.3, reflecting the relatively high globulin level. This is not a concern in isolation but is consistent with low-grade metabolic inflammation.","low_causes":"Elevated globulin from chronic inflammation, autoimmune disease, low albumin from liver disease","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5227","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. At 101 IU/L, Melinda's result is well within range, confirming healthy pancreatic function with no signs of pancreatitis or pancreatic stress.","low_causes":"Chronic pancreatitis, cystic fibrosis, severe liver disease","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. At 49 U/L, this is within the healthy range and confirms that the pancreas is functioning normally in its digestive capacity.","low_causes":"Not typically clinically significant","high_causes":"Acute pancreatitis, chronic pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6375","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol carried in the blood, including LDL, HDL, and VLDL particles. At 6.6 mmol/L, Melinda's total cholesterol is above the desirable limit of 5.18. However, total cholesterol alone is a blunt instrument. The more important measures are LDL, ApoB, and the triglyceride-driven remnant particles, all of which are discussed separately. The elevated total cholesterol here is driven by a combination of high LDL, high VLDL, and high remnant cholesterol.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, obesity, insulin resistance, hypothyroidism, genetic factors, smoking, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8529","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily in VLDL particles produced by the liver. At 2.9 mmol/L, Melinda's level is significantly above the fasting target of under 1.7. Elevated triglycerides are one of the most characteristic features of insulin resistance. When insulin levels are high, the liver ramps up production of triglyceride-rich VLDL particles. These particles are then converted into small, dense LDL (the most atherogenic type) and leave behind remnant particles that independently damage artery walls. Reducing triglycerides through weight loss, reducing refined carbohydrates, and increasing omega-3 intake is one of the most impactful changes Melinda can make.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"Insulin resistance, high carbohydrate or sugar intake, obesity, alcohol, diabetes, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8462","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol is the cholesterol carried in triglyceride-rich particles produced by the liver. At 1.32 mmol/L, nearly double the upper limit of 0.78, this confirms the liver is overproducing these particles in response to insulin resistance. VLDL particles are broken down in the bloodstream into remnant particles and small dense LDL, both of which are independently atherogenic.","low_causes":"Very low fat diet, hyperthyroidism","high_causes":"Insulin resistance, high carbohydrate intake, obesity, diabetes, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is often called 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for disposal. Melinda's HDL at 1.5 mmol/L is close to but just below the desirable threshold of 1.55 for women, and below the optimal female level of 1.6. In the context of insulin resistance and elevated triglycerides, HDL is often suppressed because the same metabolic pathway that raises triglycerides tends to lower HDL. Improving insulin sensitivity through weight loss and exercise would be expected to raise HDL.","low_causes":"Insulin resistance, obesity, sedentary lifestyle, smoking, high carbohydrate diet, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.89","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7960","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits in artery walls and drives atherosclerosis. At 3.89 mmol/L, Melinda's LDL is above both the laboratory limit of 3.0 and the optimal target of 2.6. LDL is modifiable through diet (reducing saturated fat, increasing soluble fibre), weight loss, exercise, and if needed, medication. Given her elevated Lp(a), which adds a fixed layer of cardiovascular risk, reducing LDL through modifiable means becomes even more important.","low_causes":"Hyperthyroidism, malnutrition, very low fat diet, statins","high_causes":"Diet high in saturated fat, obesity, insulin resistance, hypothyroidism, genetic factors, sedentary lifestyle, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4889","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk. At 4.4, Melinda's ratio is just within the upper limit of 4.5 but above the optimal target of 3.5. This ratio is being driven by the combination of high total cholesterol and a HDL that, while reasonable, is not high enough to fully compensate.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"High LDL, high triglycerides, low HDL, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"22.73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3788","lower_normal":"20.0","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. At 22.73%, Melinda's result is above the minimum desirable threshold of 20% but below the optimal target of 28% or higher. A higher percentage indicates a better balance between protective and harmful cholesterol particles.","low_causes":"High total cholesterol, low HDL, insulin resistance, obesity","high_causes":"High HDL, low total cholesterol, healthy metabolism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6375","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol (6.6 minus 1.5 = 5.1). It captures all the atherogenic cholesterol particles, including LDL, VLDL, and remnants, in a single number. At 5.1 mmol/L against a target of under 4.0, this confirms the overall atherogenic burden is elevated. Non-HDL cholesterol is increasingly used by clinicians as a primary treatment target because it captures the full picture better than LDL alone.","low_causes":"Very low LDL, low triglycerides, statins","high_causes":"Elevated LDL, elevated triglycerides, insulin resistance, obesity, diet high in saturated fat","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5607","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA1 (apolipoprotein A1) is the main structural protein of HDL particles. It is the best measure of the protective side of the lipid picture. At 1.57 g/L, above the desirable threshold of 1.4, Melinda's ApoA1 is healthy. This means she has a reasonable number of protective HDL particles working to remove cholesterol from artery walls.","low_causes":"Insulin resistance, obesity, sedentary lifestyle, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is the single protein found on every atherogenic particle in the blood, including LDL, VLDL, and remnant particles. Because each particle carries exactly one ApoB molecule, this is effectively a direct count of atherogenic particles and is considered the single best predictor of cardiovascular risk. At 1.18 g/L against a target of under 0.9, Melinda has significantly more atherogenic particles than is desirable. This is the number that matters most in assessing and tracking cardiovascular risk, and it should be the primary lipid target for improvement.","low_causes":"Low LDL production, statins, hyperthyroidism, malnutrition","high_causes":"Insulin resistance, high saturated fat intake, obesity, genetic factors, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (harmful) and protective particles in a single number. At 0.75, Melinda's ratio falls in the average risk band (0.6 to 0.8 for women) but is above the lower risk target of under 0.6. The goal is to bring this below 0.6 by reducing ApoB (through weight loss, dietary change, and possibly medication) and ideally increasing ApoA1 (through exercise).","low_causes":"Low LDL, high HDL, statins, regular exercise","high_causes":"Elevated LDL, low HDL, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"157.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that resembles LDL but carries an additional protein called apolipoprotein(a). This extra protein makes the particle stickier to artery walls, promotes blood clotting, and drives local inflammation, all of which accelerate atherosclerosis. At 157.86 nmol/L, Melinda falls in the moderate risk category (90 to 200). Lp(a) is entirely inherited, cannot be changed by diet, exercise, or any currently available supplement, and should be measured only once because the result is fixed for life. This result should be recorded permanently in her medical notes. Approximately half of first-degree relatives (children, siblings, parents) will carry the same elevated level, so they should be tested. While Lp(a) itself cannot be lowered, its presence makes it more important than ever to address every modifiable cardiovascular risk factor, particularly ApoB, smoking, blood pressure, and insulin resistance.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL (6.6 minus 1.5 minus 3.89 = 1.21). It represents the cholesterol carried in triglyceride-rich remnant particles, which are produced when VLDL is broken down. At 1.21 mmol/L, well above the optimal target of 0.5, this confirms a significant contribution from remnant particles to Melinda's overall atherogenic burden. These remnant particles are increasingly recognised as independently atherogenic and are a direct consequence of the elevated triglycerides driven by insulin resistance.","low_causes":"Low triglycerides, healthy insulin sensitivity","high_causes":"Elevated triglycerides, insulin resistance, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6433","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a simple but powerful proxy for insulin resistance and small dense LDL particle number. It is calculated by dividing triglycerides by HDL (2.9 / 1.5 = 1.93). A ratio above 1.5 is associated with insulin resistance and a predominance of small, dense LDL particles, which are more atherogenic than large, buoyant LDL. At 1.93, this ratio confirms the insulin-resistant metabolic pattern and is one of the markers most responsive to improvement with weight loss and dietary change.","low_causes":"High insulin sensitivity, low triglycerides, high HDL, regular exercise","high_causes":"Insulin resistance, high carbohydrate diet, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.08","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP (C-reactive protein) is the most specific blood marker of systemic inflammation. Unlike ESR, it is not significantly affected by age, anaemia, or protein levels. At 0.8 mg/L, Melinda's hs-CRP is below the optimal threshold of 1.0 and well below the laboratory limit of 5.0. This is a genuinely positive finding, particularly at a BMI of 33, where CRP is often elevated due to visceral fat producing inflammatory cytokines. This suggests that despite the metabolic strain, Melinda's body is not producing a significant inflammatory response at this time.","low_causes":"Low systemic inflammation, healthy weight, regular exercise","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular disease, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube over one hour. A faster rate suggests inflammation, but ESR is influenced by many factors beyond inflammation including age, sex, anaemia, protein levels, and haemoglobin concentration. At 28 mm/hour against a laboratory limit of 12, this appears elevated. However, the age-adjusted upper limit for a 56-year-old woman is approximately 33 (calculated as age plus 10, divided by 2), which places Melinda's result within the age-appropriate range. Combined with her excellent hs-CRP of 0.8, this suggests the ESR is being driven by non-inflammatory factors rather than active inflammation.","low_causes":"Polycythaemia, sickle cell disease, very low fibrinogen","high_causes":"Age, infection, inflammation, autoimmune disease, anaemia, pregnancy, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"115.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4567","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"Platelet:Lymphocyte Ratio is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"309","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4727","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"Systemic Immune-Inflammation Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance and is essential for nerve and muscle function. At 141 mmol/L, Melinda's sodium is well within the optimal range, indicating healthy fluid balance and kidney regulation.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH, heart failure","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7889","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"4.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Melinda's result of 5.7 mmol/L is above the upper limit of 5.3. However, the laboratory note flags that potassium can be falsely elevated if the sample is delayed or has been sitting on the cells for a period of time, as potassium leaks out of red blood cells during storage. Given that all other kidney and electrolyte markers are normal, and there are no clinical indicators of true hyperkalaemia, this is very likely a sample artefact. A repeat on a fresh sample processed promptly would be expected to return within range.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low dietary intake, alkalosis","high_causes":"Sample haemolysis or delay (most common cause of elevated results), kidney disease, ACE inhibitors, potassium supplements, acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{ ,"result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3471","upper_optimal_position":"0.6046","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bones and teeth, and is essential for energy production at the cellular level (as part of ATP). At 1.2 mmol/L, Melinda's phosphate is well within the optimal range. A normal phosphate alongside the marginally elevated corrected calcium is reassuring and argues against significant parathyroid pathology.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, antacid use","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D supplementation, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5575","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle and nerve function, blood sugar regulation, and sleep. At 0.92 mmol/L, Melinda's magnesium sits within the optimal band. This is a positive finding, particularly given that magnesium plays a supportive role in insulin sensitivity.","low_causes":"Poor dietary intake, alcohol, diuretics, gastrointestinal losses, diabetes","high_causes":"Kidney disease, excessive supplementation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"349","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5298","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5325","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. At 349 umol/L, Melinda's result is within the laboratory range but above the optimal female ceiling of 320. Elevated uric acid is associated with insulin resistance and metabolic syndrome, and at this level there is no immediate risk of gout, but it is another marker that reflects the underlying metabolic pattern. It would be expected to improve with weight loss and reduced intake of fructose and alcohol.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"High purine diet, obesity, insulin resistance, kidney disease, gout, alcohol, fructose intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"14.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate), which gives (141 + 5.7) minus (106 + 25.8) = 14.9. It helps identify whether there are unmeasured acids or bases in the blood. At 14.9, this is within the normal range of 8 to 16, confirming normal acid-base balance. Note that this calculation uses the potassium result of 5.7 which may be artefactually elevated; if the true potassium is lower, the anion gap would be correspondingly lower and still within range.","low_causes":"Low albumin, multiple myeloma, laboratory error","high_causes":"Diabetic ketoacidosis, lactic acidosis, kidney failure, toxic ingestions (methanol, ethylene glycol)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5893","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. At 3.3 mmol/L, Melinda's urea is just within the laboratory range but at the lower end. Low urea can reflect a diet that is relatively low in protein, which is consistent with her diet volume score of 5 out of 10. It is not a concern but reinforces the recommendation to increase protein intake to support her goals.","low_causes":"Low protein diet, liver disease, overhydration, malnutrition","high_causes":"Kidney disease, dehydration, high protein diet, heart failure, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4065","lower_normal":"49","upper_normal":"90","lower_optimal":"49","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5821","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a constant rate. At 58 umol/L, Melinda's creatinine is well within range and consistent with normal kidney function.","low_causes":"Low muscle mass, cachexia, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, high protein diet, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how efficiently the kidneys filter waste from the blood. Reported as greater than 90, this indicates normal kidney function. The creatinine-based eGFR is confirmed by the Cystatin C-based eGFR of 99, providing a more accurate estimate that is not influenced by muscle mass.","low_causes":"Chronic kidney disease, acute kidney injury, ageing, dehydration","high_causes":"Pregnancy, high cardiac output states","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"Cystatin C is a protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate measure of kidney function, particularly in people with high or low BMI. At 99, Melinda's Cystatin C-based eGFR confirms excellent kidney function at age 56.","low_causes":"Chronic kidney disease, acute kidney injury","high_causes":"Hyperthyroidism, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KI y low body weight","high_causes":"Menopause, primary ovarian failure, polycystic ovarian syndrome (in combination with other markers)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"74.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5139","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"FSH (follicle stimulating hormone) stimulates the ovaries to produce eggs and oestrogen. Like LH, it rises in menopause as the pituitary tries harder to stimulate non-responsive ovaries. At 74.39 mIU/ml, well within the post-menopausal range of 23 to 116.3, this firmly confirms post-menopausal status.","low_causes":"Pituitary dysfunction, hypothalamic amenorrhoea, medications","high_causes":"Menopause, primary ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6190","units":"nmol/L","description":"Testosterone in women supports muscle mass, bone density, energy, mood, and libido. It is produced by the ovaries and adrenal glands. At 0.6 nmol/L, Melinda's testosterone is just above the lower limit of 0.5 but well below the optimal range of 0.8 to 2.0. In a post-menopausal woman, this decline is expected but can contribute to difficulty building and maintaining muscle, reduced energy, and difficulty losing body fat, all of which are directly relevant to Melinda's symptoms and goals.","low_causes":"Menopause, adrenal insufficiency, pituitary dysfunction, medications (oral oestrogen), ageing","high_causes":"Polycystic ovarian syndrome, congenital adrenal hyperplasia, androgen-secreting tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.0131","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3339","lower_normal":"0.013","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3363","upper_optimal_position":"0.5821","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone that is not bound to proteins and is therefore biologically active. At 0.0131 nmol/L, Melinda's free testosterone is at the absolute lower boundary of the reference range (0.013). This means that not only is her total testosterone low, but the tiny amount available to actually act on tissues is at its minimum. The low SHBG (24.2) would normally increase free testosterone by releasing more from its binding protein, but total testosterone is so low that even with reduced binding, the free fraction is still at the floor.","low_causes":"Low total testosterone, menopause, ageing, adrenal insufficiency","high_causes":"High total testosterone, low SHBG, polycystic ovarian syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4437","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3417","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is calculated from testosterone and SHBG to estimate the proportion of testosterone that is biologically active. At 2.48, this is within both the laboratory and optimal ranges. While this might seem reassuring, the FAI can appear normal when SHBG is low (as it is here at 24.2), because the low SHBG inflates the ratio even though the actual total and free testosterone levels are very low.","low_causes":"Low testosterone, high SHBG, menopause","high_causes":"Polycystic ovarian syndrome, insulin resistance, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3498","lower_normal":"0.26","upper_normal":"11","lower_optimal":"3.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3588","upper_optimal_position":"0.5179","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 2 umol/L (approximately 737 ug/dL), Melinda's level is within the laboratory range but below the optimal threshold. DHEA-S naturally declines with age, and at 56, some decline is expected. However, combined with the low testosterone, it suggests the adrenal contribution to sex hormone production is also on the lower side.","low_causes":"Ageing, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, polycystic ovarian syndrome, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3957","lower_normal":"38","upper_normal":"430","lower_optimal":"38","upper_optimal":"430","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"uIU/ml","description":"Prolactin is a hormone primarily associated with milk production but also involved in immune regulation and metabolism. At 63 uIU/ml, Melinda's prolactin is at the low end of the post-menopausal range of 38 to 430, which is normal.","low_causes":"Not typically clinically significant","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"24.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3060","lower_normal":"27.8","upper_normal":"146","lower_optimal":"30","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3352","upper_optimal_position":"0.5166","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds and carries sex hormones in the blood. At 24.2 nmol/L, Melinda's SHBG is below the lower limit of 27.8. Low SHBG is one of the earliest and most consistent markers of insulin resistance. It occurs because insulin directly suppresses SHBG production by the liver. This fits precisely with the metabolic pattern seen throughout this report. SHBG is expected to rise as insulin resistance improves with weight loss and dietary change.","low_causes":"Insulin resistance, obesity, type 2 diabetes, hypothyroidism, PCOS, anabolic steroids","high_causes":"Ageing, hyperthyroidism, liver disease, oral oestrogen (HRT or contraceptives), low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4788","lower_normal":"0.05","upper_no thyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid hormone resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4464","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3560","upper_optimal_position":"0.5893","units":"pmol/L","description":"FT4 (free thyroxine) is the main hormone produced by the thyroid gland. It is converted into the more active T3 in the tissues. At 15.3 pmol/L, Melinda's FT4 is within the optimal range of 14 to 20, confirming adequate thyroid hormone production.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4963","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5889","units":"pmol/L","description":"FT3 (free triiodothyronine) is the most active thyroid hormone, converted from FT4 in the tissues. At 4.8 pmol/L, Melinda's FT3 is within the optimal range. Good conversion of T4 to T3 indicates that the tissues are receiving adequate active thyroid hormone.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, severe illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies (thyroid peroxidase antibodies) are autoantibodies that attack the thyroid gland. Their presence above the threshold suggests autoimmune thyroid disease (Hashimoto's thyroiditis). At below 6.6 U/ml against a limit of 13.8, Melinda's result is negative, ruling out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another type of autoantibody directed against the thyroid gland. At below 1.3 U/ml against a threshold of 4.4, this is negative and, combined with the negative TPO antibodies, comprehensively rules out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1.0","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood, and muscle strength. It is primarily produced in the skin through sun exposure. At 78 nmol/L, Melinda's vitamin D is above the sufficiency threshold of 50 but below the optimal range of 75 to 120. The ideal target is above 100. At a BMI of 33, fat tissue sequesters vitamin D, meaning she needs a higher supplementation dose than a lean individual to achieve the same blood level. Vitamin D is particularly important for post-menopausal women for bone density preservation.","low_causes":"Insufficient sun exposure, dark skin, obesity (sequestration in fat), malabsorption, aging, northern latitude","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.057","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4811","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.6139","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. At 2.057 pmol/L, Melinda's PTH is mid-range and appropriately normal. This is important in the context of the marginally elevated corrected calcium, because a normal PTH makes primary hyperparathyroidism (where the gland overproduces PTH and drives calcium up) unlikely.","low_causes":"Hypoparathyroidism, excessive vitamin D, hypercalcaemia from other causes, magnesium deficiency","high_causes":"Primary hyperparathyroidism, vitamin D deficiency, chronic kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"518","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5071","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.6163","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 518 pg/ml, Melinda's B12 is within the optimal range of 500 to 900. This is a good level that supports healthy nerve function and energy production. No supplementation is needed at present.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, metformin use, aging","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and methylation (a critical process for detoxification and gene regulation). At 16 ng/ml, Melinda's folate is excellent and within the optimal range. Adequate folate alongside adequate B12 ensures healthy homocysteine metabolism.","low_causes":"Poor dietary intake, alcohol, malabsorption, certain medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, high dietary intake of leafy greens","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"126","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4886","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles that rises with muscle damage or intense exercise. At 126 U/L (within the female range of 25 to 200), Melinda's CK is healthy and consistent with her current training level of four sessions per week. There is no sign of excessive muscle damage or overtraining.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"12.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5474","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7.0","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3386","upper_optimal_position":"0.6123","units":"g/L","description":"IgG is the most abundant antibody in the blood, providing long-term immune protection against previously encountered infections. At 12.6 g/L, Melinda's IgG is within the laboratory range, reflecting a healthy adaptive immune system with a normal history of immune responses.","low_causes":"Primary immunodeficiency, medications (corticosteroids, immunosuppressants), protein loss","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","resu d parasitic infections. At 25.2 IU/ml, well below the upper limit of 100, this indicates no significant allergic activation or parasitic infection.","low_causes":"Not typically significant","high_causes":"Allergies, asthma, eczema, parasitic infections, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor (RF) is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. At 4 IU/ml, well below the upper limit of 14, this is negative and argues against rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"No autoimmune disease (normal)","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infections, other autoimmune diseases","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.274","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0190","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"TTG IgA (tissue transglutaminase IgA) is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten. At 0.274 CU against a limit of 7.19, this is strongly negative, effectively ruling out coeliac disease as a cause of any digestive or nutritional symptoms, provided Melinda has been eating a gluten-containing diet, which her standard mixed diet confirms.","low_causes":"No coeliac disease (normal)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the unstable molecules that cause oxidative damage to cells. At 1.59 mmol/L, Melinda's antioxidant capacity is within the healthy range. This is a positive finding, particularly given that smoking increases oxidative stress, suggesting her diet is providing reasonable antioxidant support.","low_causes":"Poor dietary intake of fruits and vegetables, chronic illness, oxidative stress","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"11.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1855","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer and other conditions including endometriosis, fibroids, and pelvic inflammation. At 11.5 U/ml, well below the limit of 31, Melinda's result is reassuringly normal.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, liver disease, menstruation","padding":"1","o function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
