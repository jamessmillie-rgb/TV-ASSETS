auses":"Infection, chronic inflammation, cardiovascular risk, obesity, autoimmune disease, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2083","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"Erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle in a test tube over one hour, which is an indirect marker of inflammation. A faster rate indicates more inflammation. Iain's ESR at 5 is well within the normal and optimal ranges, further confirming the absence of significant systemic inflammation.","low_causes":"Not clinically significant","high_causes":"Infection, chronic inflammation, autoimmune disease, anaemia, malignancy, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"142","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5026","units":"mmol/l","description":"Sodium is the main electrolyte in the blood, essential for nerve function, muscle contraction, and fluid balance. Iain's sodium at 140 is within the optimal range. Given that he takes amlodipine for hypertension, it is reassuring that sodium homeostasis is well maintained.","low_causes":"Diuretics, excess water intake, heart failure, liver disease, kidney disease, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is critical for heart rhythm, muscle contraction, and nerve signalling. Both too high and too low levels can be dangerous. Iain's potassium at 4.6 is within the optimal range. This is reassuring particularly given his amlodipine use, as blood pressure medications can sometimes affect potassium balance.","low_causes":"Diuretics, vomiting, diarrhoea, excess sweating, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, tissue damage, haemolysis, delayed sample processing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/l","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and acid-base balance. Iain's chloride at 101 is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis, Addison's disease","high_causes":"Dehydration, kidney disease, metabolic acidosis, excess saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3030","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's main acid buffer, helping to maintain the blood's pH within a very narrow range. Iain's bicarbonate at 19.7 is marginally below the lower limit of 20. At this margin, typically less than 2% below the boundary, this is unlikely to be clinically significant. It may reflect the timing of the blood draw, a mild metabolic compensation, or the body's response to exercise. The anion gap, calculated from his electrolytes, is 23.9 which is above the typical range of 8 to 16, though this can be affected by the mildly low bicarbonate. This does not warrant specific action but should be noted if it persists on recheck.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis, lactic acidosis, intense exercise","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product produced by the liver when protein is broken down. It is filtered by the kidneys and excreted in urine. Iain's urea at 7.5 is within the laboratory range but above the optimal ceiling. This may reflect his protein intake from resistance training, mild dehydration at the time of sampling, or a slight reduction in the kidneys' filtration efficiency consistent with his Cystatin C eGFR of 81. It is not a concern on its own.","low_causes":"Low protein diet, liver disease, over-hydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4274","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5470","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. It is used to estimate kidney function (eGFR). Iain's creatinine at 76 is well within range. Because creatinine is influenced by muscle mass, the Cystatin C-based eGFR provides a more accurate picture of his true kidney function.","low_causes":"Low muscle mass, vegetarian diet, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) based on creatinine estimates how well the kidneys are filtering waste. Above 90 is considered normal, and above 60 is the minimum acceptable threshold. Iain's creatinine-based eGFR is reported as above 90, which is within the optimal range. However, the Cystatin C-based eGFR at 81 provides a more accurate picture and is discussed in that marker's description.","low_causes":"Kidney disease, dehydration, heart failure, kidney obstruction, medication effects","high_causes":"Not typically clinically significant as a high value indicates good function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"Cystatin C eGFR uses a different protein, Cystatin C, to estimate kidney filtration rate. Unlike creatinine, Cystatin C is not affected by muscle mass, diet, or exercise, making it more accurate for many people. Iain's Cystatin C eGFR at 81 is mildly below the optimal threshold of 90 but comfortably above the clinical threshold of 60 that defines kidney disease. At 64, a mild reduction in filtration is a normal age-related change. This does not indicate kidney disease but should be monitored on future panels to ensure it remains stable.","low_causes":"Kidney disease, age-related decline, dehydration, heart failure, medication effects","high_causes":"Not typically significant as a high value indicates good kidney function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"230","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3639","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5467","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced naturally by the body. High levels can form crystals in joints (gout) and contribute to kidney stones. Iain's uric acid at 230 is near the lower end of the laboratory range and well within the optimal window. Given his joint symptoms, this is reassuring as it makes gout very unlikely as a contributor to his joint pain.","low_causes":"Low purine diet, kidney disease (increased excretion), medication effects","high_causes":"High purine diet (red meat, shellfish, beer), obesity, kidney disease (reduced excretion), gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and filtered freely by the kidneys. It is the most accurate blood marker of kidney function available in routine testing. Iain's Cystatin C at 1.12 is marginally above the reference limit of 1.1. This corresponds to his Cystatin C eGFR of 81, confirming a mild age-related reduction in kidney filtration. At 64 and on amlodipine for blood pressure, this is not unexpected and does not indicate kidney disease. It should be monitored over time.","low_causes":"Not clinically significant","high_causes":"Reduced kidney function, age-related decline, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"149","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4917","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":" indow. This is consistent with his healthy haemoglobin and red cell count.","low_causes":"Anaemia, blood loss, over-hydration, chronic disease","high_causes":"Dehydration, polycythaemia, smoking, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"15.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7619","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"Red cell distribution width (RDW) measures the variation in size among red blood cells. A higher RDW means more variation, which often indicates that the body is producing red cells of inconsistent sizes, a pattern commonly seen with iron deficiency, B12 or folate deficiency, or mixed nutritional deficiencies. Iain's RDW at 15.9 is above the upper limit of 15, consistent with the borderline iron picture (ferritin 47, transferrin saturation 21.7%) and the low MCV. This pattern suggests early iron-restricted red cell production is causing some variation in cell sizes.","low_causes":"Not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiencies, chronic disease, recent blood loss, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"81.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2278","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. Low MCV means smaller cells, which is the hallmark of iron deficiency. Iain's MCV at 81.1 is below the lower limit of 83, indicating that his red blood cells are smaller than ideal. Combined with his borderline ferritin, low transferrin saturation, elevated RDW, and low reticulocyte count, this confirms early iron-restricted erythropoiesis: the bone marrow does not have quite enough iron to produce full-sized red cells at a normal rate. He is not anaemic (haemoglobin is healthy), but the trend needs attention.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 deficiency, folate deficiency, alcohol excess, liver disease, hypothyroidism, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"28.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4200","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin per red blood cell. Iain's MCH at 28.3 is within range, meaning each cell is carrying an adequate amount of haemoglobin even though the cells are slightly smaller than ideal.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 deficiency, folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"349","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC (mean corpuscular haemog Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease, aplastic anaemia","high_causes":"Recovery from blood loss, haemolysis, recovery from nutritional deficiency treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4567","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is a marker of the balance between innate and adaptive immunity, and is increasingly recognised as a predictor of systemic inflammation and cardiovascular risk. A ratio between 1 and 3 is normal, and between 1 and 2 is optimal. Iain's NLR at 1.74 is within the optimal window, confirming a healthy immune balance and low systemic inflammation.","low_causes":"Not clinically significant unless very low","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cardiovascular risk, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"21.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3605","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of transferrin (the iron transport protein) that is loaded with iron. It reflects how much iron is available for the body to use right now. Iain's transferrin saturation at 21.74% is within the laboratory range but below the optimal g, consistent with the body upregulating transferrin production in response to borderline iron stores.","low_causes":"Iron overload, inflammation (negative acute phase protein), liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"73.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6222","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5902","units":"umol/l","description":"Total iron binding capacity (TIBC) measures how much iron the blood could carry if every transferrin molecule were fully loaded. A high TIBC typically indicates low iron stores, as the body is producing more transport capacity. Iain's TIBC at 73.9 is within the laboratory range but toward the upper end and above the optimal ceiling, consistent with the pattern of borderline iron stores.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3611","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. Iain's ferritin at 47 is within the laboratory range of 22 to 322 for men but below the optimal threshold of 50. For a 64-year-old man doing heavy resistance training, iron demand is higher than average, and this level does not provide a comfortable buffer. Combined with the low MCV, elevated RDW, and low reticulocytes, this confirms that iron stores are the limiting factor in his red cell production. Increasing dietary iron through red meat, dark leafy greens, and vitamin C pairing should be the first approach.","low_causes":"Iron deficiency, blood loss, heavy exercise, vegetarian/vegan diet, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"14.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4809","upper_optimal_position":"0.6892","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, fat distribution, energy, mood, and libido. Iain's testosterone at 14.2 is within the laboratory range of 8.4 to 28.7 and above the recommended minimum of 12, but below the optimal threshold of 18. At 64, some decline from peak levels is expected. This below-optimal level may be contributing to his difficulty building muscle and losing body fat, two of his stated goals. Improving sleep (the most potent non-pharmacological testosterone booster), maintaining training, reducing alcohol, and losing body fat can all support testosterone levels.","low_causes":"Aging, obesity, chronic illness, sleep deprivation, alcohol excess, opioid use, pituitary disorders, stress","high_causes":"Exogenous testosterone use, anabolic steroids, androgen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"37.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4744","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3851","upper_optimal_position":"0.5811","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to testosterone and oestradiol, controlling how much is free and biologically active. Iain's SHBG at 37.8 is within the optimal range, meaning it is not binding an excessive amount of his testosterone. His free androgen index confirms adequate bioavailability.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Aging, liver disease, hyperthyroidism, oral oestrogen, anticonvulsants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"37.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3962","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"","description":"The free androgen index (FAI) estimates how much testosterone is biologically available, accounting for the amount bound by SHBG. Iain's FAI at 37.57 is within the laboratory range but just below the optimal floor of 40, reflecting his below-optimal total testosterone rather than an SHBG problem.","low_causes":"Low testosterone, high SHBG, aging, liver disease","high_causes":"High testosterone, low SHBG, insulin resistance, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.276","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4527","lower_normal":"0.17","upper_normal":"0.67","lower_optimal":"0.3","upper_optimal":"0.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4200","upper_optimal_position":"0.6200","units":"nmol/l","description":"Calculated free testosterone estimates the amount of testosterone that is not bound to SHBG or albumin and is therefore available for use by the body. Iain's free testosterone at 0.276 is within the laboratory range but just below the optimal threshold of 0.3. This is consistent with his total testosterone being below optimal while SHBG is normal. Improving sleep, reducing alcohol, and losing body fat are the most effective strategies to support free testosterone levels.","low_causes":"Low total testosterone, high SHBG, aging, chronic illness","high_causes":"High total testosterone, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2910","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen, important in men for bone health, brain function, and cardiovascular protection. Too high can cause gynaecomastia; too low impairs bone density. Iain's oestradiol at 85 is within the optimal range, reflecting a healthy balance relative to his testosterone level.","low_causes":"Low testosterone (as oestradiol is converted from testosterone), low body fat, aromatase inhibitor use","high_causes":"Obesity (increased aromatase activity), liver disease, exogenous testosterone, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2500","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced by the adrenal glands and testes in small amounts. It plays a minor role in balancing other hormones and supporting neurological function. Iain's progesterone at 0.74 is below the male reference range of 0.89 to 3.88. In men, progesterone below range is rarely clinically significant as an isolated finding and does not require specific treatment. It may simply reflect his age-related hormonal changes.","low_causes":"Aging, adrenal insufficiency, low cholesterol","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3994","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5962","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and signals the testes to produce testosterone. Iain's LH at 2.92 is within the optimal range. The fact that LH is not elevated despite testosterone being below optimal suggests the pituitary is not detecting a significant enough shortfall to compensate, which is a common pattern with gradual age-related decline.","low_causes":"Pituitary disorders, severe illness, obesity, opioid use","high_causes":"Primary testicular failure, Klinefelter syndrome, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"19.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6994","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5688","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and in men stimulates sperm production in the testes. Iain's FSH at 19.6 is above the upper limit of 18.1. At 64, this is an expected age-related finding reflecting gradual decline in testicular function. The testes become less responsive to FSH with age, so the pituitary increases FSH output to compensate. This is not a pathological finding but confirms age-related reproductive hormonal change.","low_causes":"Pituitary disorders, testosterone supplementation, severe illness","high_causes":"Aging, primary testicular failure, Klinefelter syndrome, post-chemotherapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3788","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone and cause sexual dysfunction. Iain's prolactin at 84 is well within range, ruling out prolactin-related causes of low testosterone.","low_causes":"Dopamine agonist medications, pituitary damage","high_causes":"Pituitary tumour (prolactinoma), medications (antipsychotics, SNRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"368.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3831","lower_normal":"162","upper_normal":"4941","lower_optimal":"200","upper_optimal":"3500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3412","upper_optimal_position":"0.6300","units":"ug/dL","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. Iain's DHEA-S converts to approximately 368.5 ug/dL (from 1 umol/L), which is within the laboratory range for his age. While not at the higher end, it is adequate and reflects normal adrenal function.","low_causes":"Aging (expected decline), adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"461","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6177","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning and declining through the day. Iain's cortisol at 461 is within the morning reference range and within the optimal window, confirming healthy adrenal function and an appropriate stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disorders, chronic fatigue syndrome","high_causes":"Chronic stress, Cushing's syndrome, exogenous corticosteroids, depression, sleep deprivation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3873","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3680","upper_optimal_position":"0.4735","units":"mIU/l","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland to control the thyroid. When the thyroid underperforms, TSH rises to push it harder. When the thyroid overperforms, TSH drops. Iain's TSH at 1.23 is within the optimal window of 1.0 to 2.5, confirming that the pituitary is satisfied with the thyroid's output. This is reassuring and argues against hyperthyroidism despite the elevated Free T4.","low_causes":"Hyperthyroidism, thyroid hormone supplementation (over-replacement), pituitary disorders","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid hormone under-replacement","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"24.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7150","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the storage form of thyroid hormone, produced by the thyroid gland and converted into the active T3 in the tissues. Iain's Free T4 at 24.1 is above the upper reference limit of 22.7. In hyperthyroidism, elevated Free T4 would be accompanied by a suppressed TSH. Iain's TSH at 1.23 is normal, and his Free T3 is also normal, which makes true hyperthyroidism very unlikely. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. The most likely explanation is that this is a normal variant for Iain, or there is a binding protein effect. This should be mentioned to his GP for a note on file and a repeat test in six months.","low_causes":"Hypothyroidism, pituitary disorders, severe illness, iodine deficiency","high_causes":"Hyperthyroidism, early thyroiditis, excess thyroid medication, biotin supplementation interference","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy production, body temperature, and cognitive function. Iain's Free T3 at 5.6 is within the optimal window of 4.5 to 6.5, confirming that his body is converting T4 to T3 effectively and that thyroid-driven metabolism is functioning well.","low_causes":"Hypothyroidism, severe illness (sick euthyroid), calorie restriction, aging","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Elevated levels are the hallmark of Hashimoto's thyroiditis, the most common cause of hypothyroidism. Iain's TPO antibodies at below 6.6 are well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Elevated levels can indicate autoimmune thyroid disease. Iain's thyroglobulin antibodies at below 1.3 are well within range, with the laboratory noting that more than 80% of people have undetectable levels. This further confirms the absence of autoimmune thyroid disease.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (follow-up marker)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3684","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve function, and blood clotting. Iain's calcium at 2.44 is within the optimal range, confirming good calcium balance. This is supported by his normal PTH and excellent vitamin D.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of true calcium status. Because about half of blood calcium is bound to albumin, changes in albumin can make total calcium appear falsely high or low. Iain's corrected calcium at 2.49 is within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4598","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3580","upper_optimal_position":"0.5977","units":"mmol/l","description":"Phosphate works with calcium to build and maintain bones and teeth, and is essential for energy production (ATP). Iain's phosphate at 1.1 is within the optimal range.","low_causes":"Vitamin D deficiency, hyperparathyroidism, antacid use, refeeding syndrome, alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5977","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function, nerve signalling, and sleep regulation. Iain's magnesium at 0.99 is within the optimal window of 0.85 to 1.05. This is a positive finding given his heavy training load and poor sleep. Supplementing with magnesium glycinate before bed may further support sleep quality and muscle recovery.","low_causes":"Alcohol excess, diuretics, poor dietary intake, diabetes, malabsorption, intense exercise","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"152","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5067","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. Levels above 50 nmol/L are considered sufficient, and the optimal range is 75 to 120 nmol/L. Iain's vitamin D at 152 is above the optimal ceiling, suggesting he is supplementing at a dose higher than needed to maintain levels. This is not dangerous but he could reduce his supplementation dose to a maintenance level of 2,000 IU daily now that his stores are well established. He should continue to pair vitamin D with K2.","low_causes":"Insufficient sun exposure, low dietary intake, obesity (fat sequesters vitamin D), malabsorption, dark skin pigmentation, aging","high_causes":"Excessive supplementation, granulomatous diseases (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4240","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5600","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. Iain's PTH at 2 is within the optimal range, confirming that the calcium-regulating system is functioning well. His excellent vitamin D level supports this by enabling efficient calcium absorption.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency (severe)","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"340","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3852","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6110","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, and DNA synthesis. Iain's B12 at 340 is within the laboratory range but below the optimal threshold of const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleCard(el){

function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible

    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);

function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
