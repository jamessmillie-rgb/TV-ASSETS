<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Iain Maclellan","dob":"14/05/1962","report_date":"2026-08-29","summary":"Iain is a 64-year-old male presenting with a BMI of 27.7, following a standard mixed diet rated 6 out of 10 for quality with a volume of 7 out of 10. He trains five times per week, split between two cardio sessions and three resistance sessions described as very high intensity or bodybuilding, with a relatively low daily step count of 2,000 to 5,000. He takes an SNRI (likely Venlafaxine or Duloxetine), amlodipine for hypertension, and cialis for an enlarged prostate. He drinks more than seven alcoholic drinks per week and routinely sleeps fewer than six hours per night. He reports poor sleep, weight gain and difficulty losing weight, and joint pain and stiffness, noting arthritis in his knee and shoulder. His goals are to build muscle, lose body fat, and improve digestion and gut health. He notes that his GP has said his bloods are normal but that his gut feels out of sync.\n\nThe finding that should be discussed with his GP first is the PSA free ratio. His total PSA at 3.02 is within the laboratory reference range of under 4.5, which on its own would not cause concern. However, his free PSA is 0.3, giving a free-to-total ratio of just under 10%. The free-to-total ratio helps distinguish between benign prostatic hyperplasia, which is the enlargement he already knows about, and prostate cancer. A ratio above 25% is reassuring and favours benign disease. A ratio below 15% is considered less reassuring, and below 10% warrants further investigation. At 9.9%, this does not mean cancer is present, but it does mean his GP should be made aware so that the appropriate next steps, which would typically include urology referral and possibly an MRI, can be arranged. This is not an emergency, but it should not wait until his next routine appointment.\n\nThe second finding that needs GP attention is his HbA1c. HbA1c, which is glycated haemoglobin and reflects average blood sugar control over the preceding two to three months, has come back at 42 mmol/mol. The laboratory flags this as the upper boundary of normal, with 42 to 47 classified as pre-diabetes and above 48 as diabetes. His fasting glucose at 5.4 is within range but sitting at the upper end of the optimal window. His fasting insulin at 10.59 is within the laboratory range but above the optimal ceiling of 8. Taken together, these give a HOMA-IR of 2.54. HOMA-IR is a calculated marker that estimates insulin resistance, and the optimal level is below 1.0, with values above 1.9 suggesting early insulin resistance and above 2.9 indicating significant resistance. At 2.54, Iain's body is having to produce more insulin than it ideally should to keep his blood sugar within range. His C-Peptide, which is a direct measure of how much insulin the pancreas is producing, converts to 553 pmol/L, confirming that the pancreas is working hard rather than failing. His HOMA-B, a measure of beta-cell function, calculates to 111, which is within range and confirms the pancreas is coping. The picture here is not diabetes but a metabolic trajectory that, if left unchecked over the next few years, could become pre-diabetes. The good news is that this is entirely modifiable through the dietary and exercise changes outlined below.\n\nTurning to what is working well, and there is plenty to be reassured by. His liver panel is in good health. ALT at 17 and AST at 18 are both well within range, bilirubin is normal at 16, albumin is solid at 40, and his FIB-4 score at 1.1 is comfortably below the threshold, confirming no evidence of liver fibrosis. His GGT at 54 is within the male reference range of 4 to 73 but above the optimal ceiling of 25, and given that he drinks more than seven units per week this is worth noting. The liver is handling the alcohol without overt distress, but the GGT suggests it is not entirely unburdened either. Amylase and lipase, which reflect pancreatic health, are both comfortably within range, which is reassuring given his gut symptoms. His kidney function is adequate, with creatinine-based eGFR above 90, though his Cystatin C-based eGFR at 81 gives a more accurate picture at his age and body composition. Cystatin C is a protein filtered by the kidneys that is not affected by muscle mass the way creatinine is, so the 81 figure is the more reliable of the two. This is mildly below the optimal threshold of 90 and worth monitoring over time, though at 64 it is not unusual and does not indicate kidney disease. His Cystatin C itself at 1.12 is marginally above the 1.1 reference limit, consistent with this mild reduction in filtration. His uric acid at 230 is within range and well below levels associated with gout risk, which is reassuring given his joint symptoms. His electrolytes are well balanced, with sodium, chloride, and potassium all within range. His bicarbonate at 19.7 is marginally below the lower limit of 20, which is a trivial shortfall and most likely reflects the timing of the sample or mild metabolic compensation. His calcium, corrected calcium, phosphate, and magnesium are all within range, and his PTH at 2 confirms the calcium-regulating axis is functioning normally. His magnesium at 0.99 sits within the optimal window of 0.85 to 1.05, which is a genuine positive given his heavy training load and poor sleep.\n\nHis inflammatory markers are reassuring. CRP, which is a measure of systemic inflammation, is 0.9, sitting within the optimal window of under 1.0. For a 64-year-old with arthritis symptoms and a BMI approaching 28, this is a genuinely encouraging result and suggests his joint pain is more likely mechanical or osteoarthritic than driven by widespread systemic inflammation. His ESR at 5 is excellent and corroborates this. Rheumatoid factor at 6 is well within range, making rheumatoid arthritis very unlikely as a cause of his joint symptoms. His IgE at 5.56 is very low and makes allergic or eosinophilic gut pathology unlikely.\n\nHis thyroid picture is interesting. TSH at 1.23 is within the optimal window, and Free T3 at 5.6 is also optimal, meaning the thyroid is producing the active hormone his body needs at exactly the right level. However, his Free T4 at 24.1 is above the upper reference limit of 22.7. Free T4 is the storage form of thyroid hormone, which is converted into the active Free T3. An elevated Free T4 with a normal TSH and normal Free T3 is not a pattern that suggests hyperthyroidism, because in that situation TSH would be suppressed. The most likely explanation is that his body is producing slightly more T4 than average but converting it efficiently, or there is a binding protein effect. His thyroid antibodies are both firmly negative, ruling out autoimmune thyroid disease. This should be mentioned to his GP for a note on file and a recheck in six months, but it is not a concern that needs urgent action.\n\nHis lipid profile is the area that, alongside the metabolic findings, would benefit most from targeted intervention. His total cholesterol at 6.7 is above the desirable threshold of 5.18, and his LDL at 4.15 is significantly above the optimal target of under 2.6 and above the laboratory upper limit of 3.0. His ApoB, which is the best single marker of atherogenic particle number because every harmful lipoprotein particle carries exactly one ApoB molecule, is 1.14, above the 0.9 target and classified as borderline high. His non-HDL cholesterol at 4.6 is above the 4.0 threshold. Counterbalancing this, his HDL at 2.1 is excellent, well above the optimal threshold of 1.4 for men, and his ApoA1 at 1.67 is strong. His ApoB to ApoA1 ratio at 0.68 just scrapes under the lower risk threshold of 0.7, which means the balance between harmful and protective particles is acceptable but only just. His triglycerides at 1.14 are within range and his VLDL at 0.52 is normal. Critically, his Lp(a), which is lipoprotein little-a, a genetically inherited lipoprotein that independently drives cardiovascular risk and cannot be changed by diet or exercise, is under 25 nmol/L. This is genuinely useful information because it confirms that his elevated LDL and ApoB are driven entirely by modifiable factors: diet, body composition, and lifestyle. This means dietary changes can make a real and measurable difference to these numbers.\n\nHis full blood count is largely healthy. Haemoglobin at 149, red cell count at 5.27, and haematocrit at 0.428 are all within range. Platelets are healthy at 255. His white cell count at 4.55 is within range, and the differential, meaning the breakdown of white cell types, is balanced with a neutrophil-to-lymphocyte ratio of 1.74, which sits within the optimal window. His reticulocyte percentage at 0.5 sits on the very bottom of the range, and his absolute reticulocyte count at 26.35 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count suggests the bone marrow is producing red cells at a slower rate than ideal. Combined with his MCV at 81.1, which is marginally below the lower limit of 83, and his RDW at 15.9, which is above the upper limit of 15, this pattern can suggest early iron deficiency affecting red cell production before it shows up as full anaemia. His ferritin at 47 is within the laboratory range but below the optimal floor of 50 for men, and his transferrin saturation at 21.7% is within range but below the optimal window of 25 to 40%. His serum iron and transferrin are both fine, so the iron stores are not depleted but they are not replete either. At 64 with heavy resistance training, his iron demand is higher than average, and this borderline iron picture could be contributing to the low reticulocyte production and to his fatigue. This is worth addressing with diet before supplementation, given that his levels are not critically low.\n\nHis hormonal profile shows some age-related changes. Testosterone at 14.2 is within the laboratory range but below the optimal threshold of 18 for men. At 64, some decline is expected, and his is not critically low, but it may be contributing to his difficulty losing body fat and building muscle, which are two of his stated goals. His SHBG at 37.8 is well within range, and his free androgen index at 37.57 is within range, meaning the testosterone he has is reasonably bioavailable. His calculated free testosterone at 0.276 nmol/L is consistent with this. His FSH at 19.6 is above the upper limit of 18.1, which at 64 reflects age-related decline in testicular function and is the expected hormonal pattern for his age. LH at 2.92 is within range. Oestradiol at 85 and prolactin at 84 are both within range. DHEA-S converts to approximately 368.5 ug/dL, which is within range for his age. His cortisol at 461 is within the morning reference range and is not suggesting adrenal dysfunction.\n\nHis progesterone at 0.74 is below the male reference range of 0.89 to 3.88. In men, progesterone plays a minor role and this is rarely clinically significant as an isolated finding. It does not require any specific action.\n\nHis vitamin D at 152 nmol/L is excellent and well within the optimal window of 75 to 120, indeed above it, suggesting he is already supplementing effectively. His B12 at 340 is within the laboratory range but below the optimal threshold of 500. Given that he is 64 and absorption of B12 naturally declines with age, supplementation would be beneficial. His folate at 17 sits at the top of the reference range and is within the optimal window. His total antioxidant activity at 1.33 is within range.\n\nHis immune markers are largely normal. IgG at 11.2 and IgM at 0.6 are within range. His IgA at 3.6 is marginally above the upper limit of 3.5. IgA is an immunoglobulin that plays a key role in mucosal immunity, particularly in the gut lining. A marginal elevation like this can be associated with chronic mucosal irritation, which is interesting given his report that his gut feels  to 2,150 calories per day. A realistic target would be to move from 86kg toward 78 to 80kg over six to nine months, which would bring his BMI from 27.7 toward 25 to 26. His protein intake should be 1.6 to 2.0 grams per kilogram, which at his current weight is 138 to 172 grams per day. This is non-negotiable for muscle preservation during fat loss at 64. Protein should be spread across at least four meals, with 30 to 40 grams per sitting to optimise muscle protein synthesis, which becomes less efficient with age.\n\nFor his lipid profile, the dietary changes that will make the most difference are increasing soluble fibre to 10 to 15 grams per day from sources such as oats, barley, beans, lentils, flaxseed, and psyllium husk. Soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more. He should aim for oily fish (salmon, mackerel, sardines) at least three times per week for omega-3, and actively reduce saturated fat by switching from butter to olive oil, choosing leaner cuts of meat, and reducing cheese intake. These changes, combined with the weight loss, could meaningfully lower his ApoB and LDL over three to six months. His excellent HDL is a strong foundation to build on.\n\nFor his insulin resistance, the most powerful intervention is the weight loss itself. A reduction of even 5 to 8kg significantly improves insulin sensitivity. Beyond that, his diet quality at 6 out of 10 has room for improvement. Increasing vegetable intake, reducing refined carbohydrates and added sugars, and moving toward a more Mediterranean-style pattern would directly address the metabolic picture. His training is already strong, but increasing his daily steps from the current 2,000 to 5,000 toward 7,000 to 10,000 would add a layer of low-intensity movement that is particularly effective for glucose disposal and insulin sensitivity. Even a 15-minute walk after each main meal has been shown to significantly reduce post-meal blood sugar spikes.\n\nFor his sleep, which at under six hours per night is the single lifestyle factor most likely to be undermining his other efforts, practical steps include fixing a consistent wake time seven days a week, getting outside within an hour of waking for natural light exposure which resets the circadian clock, setting a caffeine cut-off of no later than 1pm, keeping the bedroom cool at 16 to 18 degrees, and limiting screens in the hour before bed. The SNRI he takes can affect sleep architecture, so if sleep remains poor despite these changes, it is worth discussing timing of the medication with his GP. Chronic sleep restriction below six hours is independently associated with increased insulin resistance, elevated cortisol, impaired recovery from training, increased appetite, and weight gain. Improving sleep may do more for his goals of fat loss and muscle gain than any other single change.\n\nFor his gut health, given the negative coeliac screen and the marginally elevated IgA suggesting possible mucosal irritation, practical steps include increasing dietary fibre gradually (which also helps the lipid profile), including fermented foods such as natural yoghurt, kefir, or sauerkraut, and considering whether alcohol may be contributing to gut irritation. Alcohol at more than seven drinks per week can disrupt the gut lining and alter the microbiome. Reducing to under seven, and ideally under four drinks per week, with at least three consecutive alcohol-free days, would benefit his gut, his liver (GGT currently at 54), his sleep, his insulin sensitivity, and his lipid profile simultaneously.\n\nFor his iron status, increasing dietary iron through red meat two to three times per week, dark leafy greens, and combining plant iron sources with vitamin C (such as peppers or citrus alongside spinach or lentils) should be the first approach. If ferritin has not improved above 50 on recheck in three months, a low-dose iron supplement could be considered.\n\nA retest of key markers in three to four months would be valuable: HbA1c, fasting glucose, fasting insulin, full lipid panel including ApoB, ferritin, reticulocyte count, Free T4, and a repeat PSA with free PSA ratio (though the GP may wish to investigate rather than simply retest this).","flags":"GP-URGENT: PSA free-to-total ratio 9.9% (threshold for concern below 15%, below 10% warrants investigation). Total PSA 3.02 within range, free PSA 0.3. Known enlarged prostate on cialis. Urology referral and imaging should be considered. This does not confirm malignancy but the ratio warrants further evaluation.\n\nGP-PRIORITY: HbA1c 42 mmol/mol, at the upper boundary of normal (pre-diabetes defined as 42 to 47). Fasting glucose 5.4 (upper end of optimal). Fasting insulin 10.59 mIU/L (above optimal ceiling of 8). HOMA-IR 2.54 (optimal below 1.0, early insulin resistance above 1.9). C-Peptide 553 pmol/L confirms adequate pancreatic output. Pattern consistent with early insulin resistance, not diabetes. Modifiable through weight loss, dietary change, and increased activity. Recommend repeat in three to four months.\n\nGP-NOTE: Free T4 24.1 pmol/L, above upper reference limit of 22.7. TSH 1.23 (normal), Free T3 5.6 (normal), both thyroid antibodies negative. Not consistent with hyperthyroidism. Likely normal variant or binding protein effect. Recommend repeat thyroid function in six months.\n\nLIPIDS: Total cholesterol 6.7 (desirable below 5.18). LDL 4.15 (range upper limit 3.0, optimal below 2.6). ApoB 1.14 (target below 0.9, borderline high). Non-HDL cholesterol 4.6 (target below 4.0). Lp(a) below 25 nmol/L (normal, confirming risk is modifiable). HDL 2.1 (excellent). ApoB/A1 ratio 0.68 (just under lower risk threshold of 0.7). Cardiovascular risk is modifiable through diet, weight loss, and lifestyle.\n\nHAEMATOLOGY: Reticulocytes absolute 26.35 (range 50 to 100), reticulocyte percentage 0.5 (bottom of range). MCV 81.1 (below range of 83 to 101). RDW 15.9 (above range of 11.5 to 15). MCHC 349 (marginally above 345, likely artefact per lab note). Pattern suggests early iron-restricted erythropoiesis. Ferritin 47 (below optimal 50). Transferrin saturation 21.7% (below optimal 25 to 40%). No anaemia present (Hb 149).\n\nKIDNEY: Cystatin C 1.12 (marginally above 1.1). Cystatin C eGFR 81 (mildly below optimal 90). Creatinine eGFR above 90. Mild age-related reduction in filtration, not kidney disease. Monitor.\n\nBICARBONATE: 19.7 mmol/L (marginally below range of 20 to 31). Clinically insignificant at this margin.\n\nHORMONES: FSH 19.6 (above range 18.1), age-appropriate testicular decline. Testosterone 14.2 (in range but below optimal 18). Progesterone 0.74 (below male range 0.89 to 3.88, not clinically significant in isolation).\n\nIMMUNOLOGY: IgA 3.6 (marginally above range 3.5). May reflect mucosal irritation. Coeliac screen negative.\n\nLIVER: GGT 54 (within range 4 to 73 but above optimal 25). Context of alcohol intake above 7 drinks per week. All other liver markers normal. FIB-4 1.1 (normal). No evidence of liver disease.\n\nPENDING: Bacterial count and urine culture results to follow.\n\nReassuring negatives: CRP 0.9 (optimal, no significant systemic inflammation). ESR 5 (excellent). Rheumatoid factor 6 (negative, RA unlikely). Coeliac screen negative. Lp(a) normal (cardiovascular risk modifiable). Thyroid antibodies negative (no autoimmune thyroid disease). PSA total within range. Urinalysis clean. Amylase and lipase normal. Liver enzymes (ALT, AST, bilirubin, albumin) all normal. Calcium, magnesium, phosphate normal. Creatine kinase normal.","recommendations":"1. See GP regarding PSA free-to-total ratio of 9.9%. Bring the specific numbers (total PSA 3.02, free PSA 0.3, ratio 9.9%) and discuss whether urology referral or imaging is appropriate given known prostatic enlargement.\n\n2. Discuss HbA1c of 42 and HOMA-IR of 2.54 with GP. Request repeat in three to four months to establish trajectory.\n\n3. Mention Free T4 of 24.1 above range to GP for a note on file and repeat thyroid function test in six months.\n\n4. Reduce calorie intake to 1,900 to 2,150 calories per day. Maintain protein at 138 to 172 grams per day (1.6 to 2.0g per kg). Target weight of 78 to 80kg over six to nine months.\n\n5. Increase daily steps to 7,000 to 10,000. Add a 15-minute walk after each main meal to improve glucose disposal.\n\n6. Increase soluble fibre to 10 to 15 grams per day from oats, barley, beans, lentils, flaxseed, and psyllium husk. Eat oily fish at least three times per week. Reduce saturated fat actively.\n\n7. Reduce alcohol to under seven drinks per week, ideally under four, with at least three consecutive alcohol-free days each week.\n\n8. Prioritise sleep. Fix a consistent wake time, get outside within an hour of waking, set a caffeine cut-off at 1pm, keep the bedroom at 16 to 18 degrees. Discuss medication timing with GP if sleep remains poor.\n\n9. Increase dietary iron through red meat two to three times per week and dark leafy greens paired with vitamin C sources. Recheck ferritin and reticulocytes in three months.\n\n10. Support gut health with increased fibre, fermented foods (natural yoghurt, kefir, sauerkraut), and reduced alcohol.\n\n11. Begin sublingual methylcobalamin B12 supplementation at 1,000 mcg daily.\n\n12. Retest in three to four months: HbA1c, fasting glucose, fasting insulin, full lipid panel with ApoB, ferritin, reticulocyte count, Free T4, and PSA with free ratio (unless GP has already initiated investigation).","supplementation":"Omega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with a meal containing fat. This directly supports his lipid profile by helping to lower LDL particle number and triglycerides, and also provides an anti-inflammatory benefit for his joint symptoms. A high-quality concentrated fish oil is preferable to standard capsules, as fewer capsules are needed to reach the therapeutic dose.\n\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue rather than swallowed. His B12 at 340 is within the laboratory range but below the optimal threshold of 500, and at 64 absorption from food naturally declines. Sublingual delivery bypasses the gut and is more reliably absorbed. This may also support energy levels.\n\nMagnesium glycinate: 300 to 400mg taken in the evening before bed. His magnesium at 0.99 is within the optimal range, but given his heavy training load, poor sleep, and the fact that magnesium glycinate specifically supports sleep quality and muscle recovery, this is a worthwhile addition. The glycinate form is the most gentle on the gut, which is relevant given his digestive concerns.\n\nVitamin D3: Iain's vitamin D at 152 is excellent and above the optimal ceiling of 120, so he is clearly already supplementing. He should continue his current regimen but does not need to increase the dose. If he is taking more than 4,000 IU daily, he could consider reducing to 2,000 IU as a maintenance dose now that his levels are well established. He should continue to pair this with Vitamin K2 (MK-7) at 100 to 200 mcg daily, which helps direct calcium into bones rather than arteries.\n\nPsyllium husk: 5 to 10 grams daily, mixed into water or a shake, taken before a meal. This is both a soluble fibre source to help lower LDL cholesterol and a gut health support. Start at 5 grams and increase gradually to avoid bloating. This directly addresses both his lipid goals and his gut symptoms.\n\nThe most important changes from this report are not supplements. They are reducing his calorie intake to a modest deficit while maintaining high protein, increasing his daily steps, improving his sleep duration, reducing his alcohol intake, and having the PSA ratio conversation with his GP. These changes will do more for his metabolic health, body composition, joint comfort, and long-term risk than any supplement can.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body is managing blood sugar at rest. Iain's result of 5.4 is within the laboratory range of 3.5 to 6.0 but sits at the very top of the optimal window of 4.0 to 5.4. While not abnormal, in the context of his elevated HOMA-IR and HbA1c at the pre-diabetes boundary, this upper-end glucose supports the picture of early insulin resistance. The body is maintaining blood sugar within range, but it is having to work harder than ideal to do so.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency, reactive hypoglycaemia","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, corticosteroid use, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4615","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4500","units":"%","description":"HbA1c expressed as a percentage measures the proportion of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it. This reflects average blood sugar over the preceding two to three months. Iain's result of 6.0% sits at the upper boundary of normal, with the laboratory defining pre-diabetes as 6.0 to 6.4%. This confirms that blood sugar control has been at the upper end of acceptable over recent months.","low_causes":"Low carbohydrate intake, very high insulin sensitivity, some haemoglobin variants, shortened red cell lifespan","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate diet, reduced physical activity, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c expressed in mmol/mol is the internationally standardised unit for glycated haemoglobin. Below 42 is classified as normal, 42 to 47 as pre-diabetes, and above 48 as diabetes. Iain's result of 42 sits exactly on the boundary between normal and pre-diabetes. While this is not diabetes, it represents the body's blood sugar control trending toward the upper limit of what is considered healthy. Combined with his elevated fasting insulin and HOMA-IR, this confirms a pattern of early insulin resistance that is modifiable through dietary change, weight loss, and increased activity.","low_causes":"Low carbohydrate intake, very high insulin sensitivity, some haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate diet, reduced physical activity, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"10.59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4530","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5751","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing at rest. When blood sugar is normal but insulin is on the higher side, it means the body needs more insulin than ideal to keep sugar in check, which is the hallmark of early insulin resistance. Iain's result of 10.59 is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8. The pancreas is working harder than it needs to, and this is the earliest detectable sign that metabolic efficiency is being compromised, typically well before blood sugar itself rises out of range.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, excess body fat, high carbohydrate diet, sedentary lifestyle, chronic stress, poor sleep","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"553","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4221","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5163","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and serves as a reliable measure of how much insulin the body is actually producing. Unlike insulin, which is partially cleared by the liver, C-Peptide gives a cleaner picture of pancreatic output. Iain's result converts to 553 pmol/L (from 1.67 ug/L), which is within the healthy range and confirms that his pancreas is functioning adequately. The elevated insulin is therefore a response to insulin resistance rather than a sign of pancreatic overproduction.","low_causes":"Type 1 diabetes, advanced pancreatic failure, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.54","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8467","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin, and estimates how resistant the body's cells are to insulin. Below 1.0 is considered optimal, meaning the body responds efficiently to insulin. Above 1.9 suggests early insulin resistance, and above 2.9 indicates significant resistance. Iain's HOMA-IR of 2.54 falls between early and significant insulin resistance. This is the most important metabolic finding in the report and the one most responsive to lifestyle change. Weight loss, increased daily movement, dietary improvement, better sleep, and reduced alcohol can all meaningfully improve this number.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, high activity level","high_causes":"Excess body fat, high carbohydrate diet, sedentary lifestyle, poor sleep, chronic stress, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"111","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4611","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the function of the pancreatic beta cells, the cells that produce insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Iain's HOMA-B of 111 is within the healthy range of 80 to 200, confirming that his pancreas is functioning well and producing insulin adequately. The issue is not that the pancreas is failing but that the body is requiring too much insulin to manage blood sugar, which is the insulin resistance reflected in his HOMA-IR.","low_causes":"Pancreatic beta cell exhaustion, type 1 diabetes, advanced type 2 diabetes, chronic pancreatitis","high_causes":"Compensatory response to insulin resistance, early type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined level of albumin and globulin in the blood. It reflects the liver's ability to produce proteins and the immune system's activity. Iain's result of 75 is well within the healthy range and confirms normal liver synthetic function and a balanced immune protein profile.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease (nephrotic syndrome)","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. Iain's albumin at 40 is within the optimal range, confirming good liver synthetic function and adequate nutritional status.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease, burns","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies) and transport proteins. It is calculated by subtracting albumin from total protein. Iain's globulin at 35 is within the laboratory range but toward the upper end, reflecting his slightly elevated IgA. This is not a concern but is consistent with a mildly active immune response, potentially at the mucosal level.","low_causes":"Immune deficiency, liver disease, nephrotic syndrome","high_causes":"Chronic infection, chronic inflammation, autoimmune conditions, liver disease, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein types in the blood. A ratio toward the lower end of range typically reflects relatively higher globulin, which can indicate immune activation or inflammation. Iain's ratio of 1.14 is within the laboratory range but below optimal, consistent with his globulin sitting at the upper end due to the mildly elevated IgA. This is not a concern requiring action.","low_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"112","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6476","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and gut. It can be elevated due to liver or bone activity. Iain's ALP at 112 is within the laboratory range but toward the upper end. At 64, this is most commonly driven by normal bone turnover. His other liver markers (ALT, AST, bilirubin, GGT) do not suggest a liver source for the elevation, and his calcium and PTH are normal, making this a likely incidental finding related to age-related bone remodelling.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bone remodelling, liver disease, bile duct obstruction, Paget's disease, vitamin D deficiency (when corrected), fracture healing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. It is processed by the liver and excreted in bile. Iain's bilirubin at 16 is within the healthy range, confirming normal red cell turnover and healthy liver processing.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1518","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in the liver. When liver cells are damaged or inflamed, ALT leaks into the blood. Iain's ALT at 17 is well within range and within the optimal threshold of under 30 for men, confirming that the liver is not under metabolic strain despite his alcohol intake and the elevated GGT.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, alcohol-related liver damage, viral hepatitis, medication effects, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5208","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT but is used alongside ALT to assess liver health. Iain's AST at 18 is well within range, corroborating the healthy ALT and confirming no liver cell damage.","low_causes":"Vitamin B6 deficiency (rare)","high_causes":"Liver disease, heart damage, muscle injury, intense exercise, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3793","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the degree of liver fibrosis (scarring) using age, AST, ALT, and platelet count. Below 1.45 (or below 2.0 for those over 65) is considered low risk. Iain's FIB-4 of 1.1 is comfortably in the low-risk zone, confirming no evidence of liver fibrosis. This is reassuring given his alcohol intake.","low_causes":"Not applicable","high_causes":"Liver fibrosis, cirrhosis, age (pushes score up), low platelets, low ALT denominator","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3699","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake and bile duct function. It is often the first liver marker to rise with regular alcohol consumption, even before ALT or AST are affected. Iain's GGT at 54 is within the male laboratory range of 4 to 73 but well above the optimal ceiling of 25. In the context of more than seven drinks per week, this likely reflects the metabolic burden of alcohol on the liver. His ALT and AST being clean means the liver is coping, but the GGT is a signal that it is being asked to work harder than ideal. Reducing alcohol intake would be expected to bring this number down.","low_causes":"Not clinically significant","high_causes":"Alcohol consumption, fatty liver disease, bile duct disease, obesity, medication effects, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5952","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatic inflammation or disease. Iain's amylase at 52 is comfortably within range, confirming no pancreatic stress. This is reassuring given his gut symptoms and alcohol intake.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5603","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase. Iain's lipase at 39 is within range, further confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6473","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL (protective), LDL (harmful), and VLDL. A level below 5.18 is considered desirable. Iain's total cholesterol at 6.7 is above this threshold. However, total cholesterol alone is a blunt tool because it includes the protective HDL. His very high HDL of 2.1 is inflating this number. The more meaningful markers are his LDL, ApoB, and non-HDL cholesterol, which are discussed below.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, insulin resistance, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3353","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily influenced by recent food intake, carbohydrate consumption, and alcohol. Fasting levels below 1.7 are considered normal, and below 1.0 is optimal. Iain's result of 1.14 is within the laboratory range and is a reasonable result, though above optimal. Triglycerides tend to respond well to reduced alcohol, reduced refined carbohydrates, increased omega-3 intake, and weight loss.","low_causes":"Low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, alcohol excess, obesity, insulin resistance, diabetes, kidney disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. It is a precursor to LDL and contributes to cardiovascular risk. Iain's VLDL at 0.52 is within range and within the optimal window, reflecting his reasonable triglyceride level.","low_causes":"Low fat diet, malnutrition","high_causes":"High triglycerides, obesity, insulin resistance, alcohol excess, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective form of cholesterol. It scavenges excess cholesterol from the arteries and returns it to the liver for disposal, a process called reverse cholesterol transport. Higher is better. Iain's HDL at 2.1 is excellent and well above both the minimum desirable level of 1.04 and the optimal threshold of 1.4 for men. This is a genuinely strong result and is one of the most protective factors in his lipid profile.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6917","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the form of cholesterol that deposits in artery walls, driving atherosclerosis (plaque build-up) and increasing cardiovascular risk. Below 3.0 is the laboratory target, and below 2.6 is optimal. Iain's LDL at 4.15 is significantly above both thresholds. With his Lp(a) being normal, this elevation is driven by modifiable factors: diet (particularly saturated fat intake), body composition, and metabolic health. Increasing soluble fibre, reducing saturated fat, eating more oily fish, losing body fat, and increasing daily movement can all lower LDL meaningfully.","low_causes":"Very low fat diet, hyperthyroidism, liver disease, malnutrition, genetic factors","high_causes":"Diet high in saturated fat, obesity, insulin resistance, hypothyroidism, genetic factors, sedentary lifestyle, chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3544","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides context to the total cholesterol number by accounting for the protective HDL. Below 4.5 is considered lower risk, and below 4.0 is optimal. Iain's ratio of 3.19 is well within the optimal range, entirely because his HDL is so high. This is a reassuring finding that moderates the concern about his elevated total cholesterol.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, cardiovascular risk factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3918","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the total cholesterol is the protective type. Above 20% is the minimum target, and above 25% is optimal. Iain's 31.34% is excellent and reflects the dominance of his strong HDL within his total cholesterol picture.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, lower total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all atherogenic (artery-damaging) cholesterol in a single number, including LDL and VLDL. Below 4.0 is the target. Iain's non-HDL at 4.6 is above this threshold and reflects the same LDL elevation seen in the individual markers. This is a modifiable finding.","low_causes":"Very low LDL, low triglycerides, malnutrition","high_causes":"High LDL, high triglycerides, high saturated fat diet, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6958","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein component of HDL particles. It drives the protective function of HDL by enabling reverse cholesterol transport. Higher is better. Iain's ApoA1 at 1.67 is well above the minimum of 1.2 and the optimal threshold of 1.4, consistent with his excellent HDL level.","low_causes":"Genetic factors, sedentary lifestyle, smoking, obesity, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the single best marker of cardiovascular risk from cholesterol. Every atherogenic lipoprotein particle, whether LDL, VLDL, or Lp(a), carries exactly one ApoB molecule. So ApoB directly counts the number of particles that can penetrate artery walls and deposit cholesterol. Below 0.9 is desirable, and below 0.8 is optimal. Iain's ApoB at 1.14 is classified as borderline high (1.0 to 1.19), confirming that he has too many atherogenic particles in his blood. Because his Lp(a) is normal, this is entirely modifiable through dietary change, weight loss, and lifestyle modification.","low_causes":"Very low LDL, hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, high saturated fat diet, obesity, insulin resistance, genetic hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is the best single summary of the balance between harmful and protective lipoproteins. Below 0.7 is classified as lower risk for men. Iain's ratio of 0.68 just scrapes under this threshold. His excellent HDL and ApoA1 are counterbalancing the elevated LDL and ApoB to keep this ratio in the acceptable zone, but only just. Improving the ApoB through dietary change would give this ratio more breathing room.","low_causes":"High ApoA1, low ApoB, excellent lipid balance","high_causes":"High ApoB, low ApoA1, cardiovascular risk factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a genetically inherited lipoprotein that independently increases cardiovascular risk. It is determined entirely by genetics, cannot be changed by diet, exercise, or lifestyle, and only needs to be measured once in a lifetime. Iain's Lp(a) at below 25 is well within the normal range of under 32. This is genuinely useful information because it confirms that his elevated LDL and ApoB are driven entirely by modifiable factors such as diet, body composition, and lifestyle. This means dietary and weight changes can make a real and measurable difference to his cardiovascular risk profile.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited, cannot be modified)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1800","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful marker of metabolic health and insulin resistance. It reflects the balance between triglyceride-rich lipoproteins and protective HDL particles. Below 1.5 is within range, and below 0.87 is optimal. Iain's ratio of 0.54 is excellent, driven by his strong HDL. This is a genuinely positive finding and suggests that despite the insulin resistance shown by HOMA-IR, his lipid metabolism retains significant protective features.","low_causes":"High HDL, low triglycerides, excellent metabolic health","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":
