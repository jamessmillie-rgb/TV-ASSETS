_position":"0.3892","upper_optimal_position":"0.5135","units":"%","description":"Transferrin saturation represents what percentage of the body's iron-carrying capacity is actually being used. Danish's transferrin saturation of 20.4% is within the laboratory range of 18 to 55% but below the optimal band of 25 to 40%. At 20.4%, his transferrin is not fully loaded, which suggests his iron intake could be higher even though his ferritin stores are adequate. This is consistent with a convenience-based diet that may not be rich in iron-containing whole foods.","low_causes":"Iron deficiency, chronic disease, poor dietary iron intake","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4156","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve in the liver, bone marrow, and spleen. Danish's ferritin of 96 is within both the male laboratory range and the optimal band of 50 to 200. This is a reassuring result and means his iron stores are healthy.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, coeliac disease","high_causes":"Haemochromatosis, inflammation (acute phase protein), liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"10.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4907","upper_optimal_position":"0.6880","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, fat distribution, mood, energy, libido, and sleep quality. Danish's testosterone of 10.3 nmol/L is technically within the laboratory range of 8.4 to 28.7 but is well below the optimal range of 18 to 30 and below the lab's own recommended minimum of 12. At 23 years old, when testosterone should be near its lifetime peak, this is a significant finding. His LH and FSH are both within normal range, indicating the pituitary gland is signalling the testes normally, which makes this more likely a lifestyle-driven pattern than primary testicular failure. Poor diet quality, no exercise, poor sleep, and insulin resistance all suppress testosterone. Addressing all four should produce a meaningful increase.","low_causes":"Sedentary lifestyle, poor diet, obesity, insulin resistance, poor sleep, stress, alcohol, opioid use, ageing, primary or secondary hypogonadism","high_causes":"Anabolic steroid use, testosterone replacement therapy, tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"14.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2713","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3492","upper_optimal_position":"0.5682","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds to sex hormones, particularly testosterone and oestradiol, controlling how much is freely available to the body's tissues. Danish's SHBG of 14.3 is below the lower limit of 17.3. Low SHBG is strongly associated with insulin resistance, which is consistent with his HOMA-IR of 2.05. When SHBG is low, more testosterone circulates in its free form, which is why his calculated free testosterone is slightly above range despite his total testosterone being low. Low SHBG is also associated with increased risk of type 2 diabetes and metabolic syndrome. Improving insulin sensitivity through diet and exercise should raise SHBG.","low_causes":"Insulin resistance, obesity, hypothyroidism, type 2 diabetes, androgen excess, metabolic syndrome","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.2851","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7810","lower_normal":"0.013","upper_normal":"0.25","lower_optimal":"0.1","upper_optimal":"0.25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3700","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone is the portion of total testosterone that is not bound to SHBG or albumin and is directly available to the body's tissues. Danish's calculated free testosterone of 0.285 nmol/L is slightly above the upper reference limit of 0.25. This is not because he has too much testosterone; his total testosterone is actually low at 10.3. The elevated free testosterone is entirely explained by his low SHBG of 14.3, which means less testosterone is being bound and more is circulating freely. As insulin resistance improves and SHBG rises, this will normalise.","low_causes":"Low total testosterone, high SHBG, ageing","high_causes":"Low SHBG (insulin resistance, obesity), androgen excess, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"72.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5613","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is calculated as (total testosterone / SHBG) x 100, providing another estimate of biologically active testosterone. Danish's FAI of 72 is within range, inflated by his low SHBG rather than reflecting genuinely high androgen activity.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"Low SHBG, polycystic ovary syndrome (females), androgen excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"112","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In men, it is produced through the conversion of testosterone by the enzyme aromatase, mainly in fat tissue. Danish's oestradiol of 112 is within the male limit of 146.1 and within the optimal range. This is a normal finding.","low_causes":"Low testosterone (less substrate for conversion), low body fat, aromatase inhibitors","high_causes":"Obesity (increased aromatase activity), liver disease, medications, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in males is produced in small amounts by the adrenal glands and testes, playing a role in supporting testosterone production and brain function. Danish's progesterone of 1.96 is within the male reference range.","low_causes":"Adrenal insufficiency, normal variation","high_causes":"Congenital adrenal hyperplasia, adrenal tumours, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"2.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3881","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6107","units":"mIU/ml","description":"LH, or luteinising hormone, is produced by the pituitary gland and signals the testes to produce testosterone. Danish's LH of 2.62 is within range. Importantly, in the context of low total testosterone, a normal LH suggests the pituitary is not detecting a deficiency, which can happen when free testosterone is maintained by low SHBG. If testosterone remains low after lifestyle changes, the relationship between LH and testosterone should be reassessed.","low_causes":"Pituitary dysfunction, hypothalamic dysfunction, steroid use, obesity","high_causes":"Primary hypogonadism (testicular failure), menopause (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"4.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3941","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5360","units":"mIU/ml","description":"FSH, or follicle-stimulating hormone, is produced by the pituitary gland and supports sperm production in men. Danish's FSH of 4.41 is within both the laboratory range and the optimal band, indicating normal pituitary-testicular signalling.","low_causes":"Pituitary dysfunction, steroid use, obesity","high_causes":"Primary hypogonadism, Klinefelter syndrome, testicular damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"205","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4848","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6424","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for stimulating milk production but also involved in immune regulation and reproductive function in men. Danish's prolactin of 205 is within range. Elevated prolactin can suppress testosterone, so it is reassuring that this is normal.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"381","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4975","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5817","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and declining through the day. Danish's morning cortisol of 381 is within both the laboratory range and the optimal band, indicating a normal stress response and healthy adrenal function.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction, chronic stress (adrenal fatigue is not a recognised medical diagnosis)","high_causes":"Acute or chronic stress, Cushing's syndrome, corticosteroid medications, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-Sulphate","group":"HORMONES","result":"2838","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5199","lower_normal":"162","upper_normal":"4940","lower_optimal":"200","upper_optimal":"4500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3413","upper_optimal_position":"0.6575","units":"ug/dL","description":"DHEA-S, or dehydroepiandrosterone sulphate, is the most abundant steroid hormone in the body, produced by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. Danish's DHEA-S of 7.7 umol/L, which converts to approximately 2,838 ug/dL, is within both the laboratory range and the optimal band. This confirms healthy adrenal function and adequate hormone precursor production.","low_causes":"Adrenal insufficiency, ageing, chronic illness","high_causes":"Adrenal hyperplasia, adrenal tumours, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4847","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4994","units":"mIU/L","description":"TSH, or thyroid-stimulating hormone, is produced by the pituitary gland and tells the thyroid how much thyroid hormone to make. When TSH is high, the pituitary is asking the thyroid to work harder; when low, it is telling it to slow down. Danish's TSH of 2.72 is within the laboratory range of 0.55 to 4.78 but marginally above the optimal range of 1.0 to 2.5. This is not a concern, especially given that his free T4 and free T3 are both within optimal ranges and both thyroid antibody tests are negative. It simply reflects normal variation.","low_causes":"Hyperthyroidism, pituitary dysfunction, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, recovery from illness, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5565","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3631","upper_optimal_position":"0.5714","units":"pmol/L","description":"Free T4, or free thyroxine, is the main thyroid hormone circulating in the blood. It is produced by the thyroid gland and must be converted to the more active T3 form to exert its effects. Danish's free T4 of 19 is within both the laboratory range and the optimal band of 14 to 20, indicating the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, pituitary dysfunction, iodine deficiency","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5704","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the biologically active form of thyroid hormone that directly drives metabolism, energy production, and body temperature regulation. Danish's free T3 of 6.2 is within both the laboratory range and the optimal band of 4.5 to 6.5. This confirms the thyroid is not only producing enough T4 but also converting it efficiently to the active T3 form. His thyroid is not contributing to his fatigue.","low_causes":"Hypothyroidism, poor T4 to T3 conversion (low selenium, low iron, stress), low calorie intake","high_causes":"Hyperthyroidism, Graves' disease, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies that attack thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Danish's TPO antibodies are below 6.6, well within the negative range of below 13.8. This rules out autoimmune thyroid disease.","low_causes":"Normal finding (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are autoantibodies that target thyroglobulin, a protein used by the thyroid to produce hormones. Danish's result of 1.3 is well within the negative range of below 4.4. More than 80% of the population have undetectable levels, and his is at the detection threshold. This confirms no autoimmune thyroid disease.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2583","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6786","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation, muscle function, and testosterone production. It is produced in the skin when exposed to sunlight and obtained from very few dietary sources. Danish's vitamin D of 31 nmol/L is classified as insufficient by the laboratory (30 to 50 range) and is well below the optimal range of 75 to 120. South Asian skin contains more melanin, which significantly reduces the skin's ability to produce vitamin D from sunlight, making people of this heritage particularly vulnerable to deficiency in northern latitudes. At 31, Danish's vitamin D insufficiency is very likely contributing to his fatigue and low mood, and may be suppressing his testosterone production. Supplementation at 4,000 IU daily is recommended, always taken with a fat-containing meal for absorption.","low_causes":"Insufficient sunlight exposure, dark skin pigmentation, indoor lifestyle, obesity, malabsorption, low dietary intake","high_causes":"Excessive supplementation, granulomatous disease (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"322","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3721","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4629","upper_optimal_position":"0.5986","units":"pg/ml","description":"Vitamin B12 is essential for red blood cell formation, DNA synthesis, nervous system function, and energy metabolism. Danish's B12 of 322 pg/ml is within the laboratory range of 193 to 982 but well below the optimal band of 500 to 900. At this level, he is unlikely to have obvious deficiency symptoms, but suboptimal B12 can contribute to fatigue, brain fog, and reduced energy. A convenience-based diet may not provide adequate B12-rich foods (meat, fish, eggs, dairy). Sublingual methylcobalamin supplementation at 1,000 mcg daily is recommended.","low_causes":"Poor dietary intake, vegetarian or vegan diet, pernicious anaemia, malabsorption, metformin use","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, red blood cell production, and the metabolism of homocysteine. The best dietary sources are leafy green vegetables, legumes, and fortified foods. Danish's folate of 6 ng/ml is within the laboratory range of 3 to 17 but below the optimal threshold of 8. This directly reflects his convenience-based diet, which is likely low in fresh vegetables and legumes. Improving dietary quality by including leafy greens with at least two meals per day should bring this up naturally.","low_causes":"Poor dietary intake (low vegetables), alcohol, malabsorption, coeliac disease, medications (methotrexate)","high_causes":"Supplementation, fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4147","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3378","upper_optimal_position":"0.5600","units":"pmol/L","description":"PTH, or parathyroid hormone, is produced by the parathyroid glands and regulates calcium levels in the blood. When calcium or vitamin D drops, PTH rises to compensate by pulling calcium from bones and increasing kidney reabsorption. Danish's PTH of 1.9 is within the optimal range, which is reassuring because despite his low vitamin D, the calcium-regulating system has not yet been forced to compensate. If vitamin D remains low, PTH would eventually rise, leading to bone calcium loss.","low_causes":"Hyperparathyroidism (post-surgical), high calcium, excessive vitamin D","high_causes":"Vitamin D deficiency (secondary hyperparathyroidism), chronic kidney disease, primary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4107","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles, including the heart. It is released into the blood when muscle cells are damaged. Danish's CK of 105 is within range, consistent with someone who does no structured exercise and therefore has no exercise-related muscle breakdown.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5018","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood, providing long-term immune protection against bacteria and viruses. Danish's IgG of 11.6 is within the laboratory range, indicating a healthy adaptive immune system.","low_causes":"Immune deficiency, certain medications, chronic lymphocytic leukaemia","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first immunoglobulin produced in response to a new infection, providing early-phase immune defence. Danish's IgM of 0.9 is within range.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_norm function groupStatus(names) {
  let markers = [];

  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);

}

  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;

    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
