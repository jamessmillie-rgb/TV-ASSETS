is easily reversible. The combination of a low-quality diet, no structured exercise, and ethnic predisposition is driving this pattern, and the good news is that all three of those factors are modifiable.\n\nHis testosterone is 10.3 nmol/L, which sits within the laboratory range of 8.4 to 28.7 but is well below the optimal range of 18 to 30 and below the lab's own recommended minimum of 12. At 23, testosterone should be near its lifetime peak. His SHBG, which is sex hormone binding globulin, a protein that binds testosterone and controls how much is freely available to the body, is low at 14.3 against a lower limit of 17.3. Low SHBG is strongly associated with insulin resistance, and the two findings reinforce each other. Because SHBG is low, more of his total testosterone is unbound, which is why his free testosterone calculation comes back at 0.285, slightly above the upper reference limit of 0.25, and his Free Androgen Index is 72, which is within range. So while the body is compensating by making more testosterone available in its free form, the total pool is still worryingly low for his age. This low testosterone may well be contributing to his fatigue, low mood, and poor sleep, all of which he reports. The path to improving testosterone at his age is not medication; it is improving diet quality, introducing resistance training, improving sleep, and addressing the early insulin resistance, all of which are interconnected.\n\nHis vitamin D is 31 nmol/L, which the laboratory classifies as insufficient. Anything below 50 is considered insufficient, and the optimal range is 75 to 120. Vitamin D is essential for energy, mood regulation, immune function, bone health, and testosterone production. At 31, it is likely contributing to his fatigue and low mood. South Asian skin produces less vitamin D from sunlight due to higher melanin content, making supplementation even more important. His parathyroid hormone (PTH), which rises when vitamin D drops too low in order to protect calcium levels, is 1.9, sitting comfortably within range, which tells us the deficiency has not yet begun to affect calcium metabolism. His calcium and corrected calcium are both within range at 2.6 and 2.5 respectively, confirming this.\n\nHis folate, also known as vitamin B9, is 6 ng/ml. The laboratory range starts at 3, but the optimal level is above 8. At 6, this is suboptimal and directly reflects his low-quality diet. Folate is critical for DNA synthesis, red blood cell production, and the metabolism of homocysteine, an amino acid that at elevated levels is associated with cardiovascular risk. His B12 at 322 pg/ml is within the laboratory range but below the optimal band of 500 to 900. Both of these B-vitamin findings are consistent with a diet that is low in leafy greens, legumes, and quality protein sources.\n\nHis IgE is markedly elevated at 375 IU/ml against an upper limit of 100. IgE is the immunoglobulin associated with allergic responses. A level nearly four times the upper limit suggests a significant allergic sensitisation, which could be environmental (dust mites, pollen, animal dander) or food-related. He has not reported allergy symptoms in his quiz, but this level is high enough to warrant investigation. We would recommend he discusses this with his GP, who may consider specific allergen testing to identify the trigger. Untreated allergic inflammation can contribute to poor sleep quality through nasal congestion and airway irritation, which may be relevant to his reported insomnia.\n\nHis lipase is 64 U/L, marginally above the upper limit of 60. Lipase is an enzyme produced by the pancreas to digest dietary fat. A marginal elevation like this, just 7% above the limit, is usually not clinically significant in the absence of abdominal pain, nausea, or other digestive symptoms. A convenience-based diet that is likely high in processed and fried foods can mildly elevate lipase. This does not suggest pancreatitis, but it is worth noting and would be expected to normalise with dietary improvement.\n\nHis hs-CRP, which is high-sensitivity C-reactive protein, a broad marker of systemic inflammation, is 2 mg/L. While this is within the laboratory limit of 5, the optimal level for long-term cardiovascular risk is below 1.0. At 2.0, there is low-grade inflammation present. In a 23-year-old with no exercise, a poor diet, early insulin resistance, and a significantly elevated IgE suggesting allergic inflammation, this level has a clear explanation and multiple drivers. Addressing diet, introducing exercise, and investigating the allergic component should all help bring this down.\n\nHis lipid profile is, on balance, reassuring for his age and is one of the genuine positives in this report. His total cholesterol is 4.5, his LDL is 2.57, his ApoB, which is apolipoprotein B and represents the actual number of atherogenic particles in the blood, is 0.75, which is below the desirable threshold of 0.9 and within the optimal band of below 0.8. His Lp(a), which is lipoprotein(a), an inherited and unchangeable cardiovascular risk particle, is below 25 nmol/L, comfortably within the safe zone of below 32. This is genuinely useful information because it means that any future cardiovascular risk will be driven entirely by modifiable lifestyle factors rather than genetics. His HDL at 1.4 is at the boundary; the laboratory flags it as desirable, but the optimal level for a male is above 1.4, so he is right on the line. His triglycerides at 1.3 are within the acceptable range but above the optimal level of below 1.0. His TG/HDL ratio calculates to 0.93, which is reasonable but above the optimal of below 0.87, and this ratio is itself a surrogate marker for insulin resistance, consistent with his HOMA-IR finding. His ApoB to ApoA1 ratio is 0.615, below the lower risk threshold of 0.7, which is positive. His remnant cholesterol calculates to 0.53, marginally above the optimal of 0.5 but within the acceptable range of below 0.8.\n\nHis liver is in reasonable health. His ALT at 34 is within the laboratory limit of 56 but above the male optimal of below 30. His GGT at 46 is within range but above the optimal of below 25. In someone with a convenience-based diet likely high in processed food and refined carbohydrates, these mildly elevated liver enzymes reflect the metabolic load of a poor diet rather than liver disease. His FIB-4 score, which estimates liver fibrosis, is 0.29, exceptionally low, confirming there is no structural liver concern. His bilirubin, albumin, total protein, AST, and ALP are all within healthy ranges.\n\nHis kidney function is excellent. His Cystatin C-based eGFR is 109, which is exactly where it should be at 23, and his creatinine-based eGFR is above 90. His uric acid at 261 is within range, and his electrolytes, including sodium, potassium, chloride, and bicarbonate, are all within normal limits. His magnesium at 0.95 is within the optimal range of 0.85 to 1.05, which is reassuring for sleep quality, as magnesium plays a role in nervous system relaxation.\n\nHis full blood count is broadly healthy. His haemoglobin at 142 is within range, his white cell count at 7.42 is healthy, and his neutrophil-to-lymphocyte ratio calculates to 1.78, within the optimal band of 1 to 2, suggesting no significant inflammatory or immune stress. His platelets at 338 and reticulocytes at 1.2% are both within range. His MCV at 82 is marginally below the lower limit of 83 by just one unit. MCV measures the average size of red blood cells, and a low MCV can indicate iron deficiency or thalassemia trait, the latter being more common in South Asian populations. His iron studies are all within range, with ferritin at 96, transferrin saturation at 20.4%, and serum iron at 15, so iron deficiency is not the explanation. Given his ethnicity, this marginal MCV finding may reflect alpha-thalassemia trait, which is a benign inherited condition that does not cause illness or require treatment but is worth confirming with his GP, particularly for future family planning. His MCHC at 350 is marginally above the upper limit of 345, and the lab notes that MCHC can be affected by temperature and storage. At this margin, it is very likely a pre-analytical artefact rather than a clinical finding.\n\nHis thyroid function is healthy. His TSH at 2.72 is within the optimal range of 1.0 to 2.5 only marginally above that band, his free T4 at 19 is within the optimal range of 14 to 20, and his free T3 at 6.2 is within the optimal range of 4.5 to 6.5. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His thyroid is not contributing to his fatigue.\n\nHis remaining hormone markers are within range. His cortisol at 381 is within the expected morning range, his LH and FSH are both within range suggesting normal pituitary signalling, and his oestradiol at 112 is within the male limit of below 146. His prolactin at 205 is within range, and his DHEA-S at 7.7 umol/L, which converts to approximately 2,838 ug/dL, is within range. His progesterone at 1.96 is within the male reference range.\n\nHis immunoglobulins IgG, IgM, and IgA are all within range, confirming a healthy baseline immune system aside from the IgE elevation. His PSA at 0.72 is well within the safe range for a 23-year-old, and his tumour markers CEA and CA 19-9 are both within normal limits. His tissue transglutaminase IgA is negative, effectively ruling out coeliac disease while he is on a gluten-containing diet. His creatine kinase at 105 is within range. His total antioxidant activity at 1.85 is marginally above the upper limit of 1.77, which is a favourable finding as it indicates adequate antioxidant capacity.\n\nHis urine analysis is largely unremarkable, with no protein, glucose, ketones, blood cells, or nitrites detected. However, the urine culture has grown a moderate amount of Streptococcus agalactiae, also known as Group B Streptococcus. The laboratory notes that the sample was received in a plain bottle without boric acid preservative, which can allow organisms to overgrow during transport, and the result should be interpreted with caution. There are no white blood cells or nitrites in the urine, and Danish reports no urinary symptoms, which together strongly suggest this is contamination or colonisation rather than active infection. No treatment is needed, but if he were to develop urinary symptoms in the future, this finding should be mentioned to his GP.\n\nHis Rheumatoid Factor result is noted as pending and will need to be reviewed when available.\n\nIn summary, Danish is a 23-year-old with a fundamentally healthy body that is showing early metabolic strain from a poor-quality diet and complete absence of structured exercise. The early insulin resistance, low testosterone for his age, low SHBG, insufficient vitamin D, suboptimal folate and B12, mildly elevated inflammatory markers, and the fatigue and poor sleep he reports are all connected by a common thread: the body is not receiving the nutritional and physical inputs it needs to function at its best. The significantly elevated IgE should be investigated by his GP. The marginal MCV finding is worth a conversation about thalassemia trait screening given his South Asian heritage. Every other finding in this report is addressable through diet, exercise, supplementation, and sleep improvement, and at 23, the response to these changes should be rapid and substantial.","links":"Danish's results paint a clear picture: a young, healthy body that is underperforming because of what it is being given to work with. The good news is that every significant finding in this report is modifiable, and at 23, the body responds quickly to the right changes.\n\nStarting with nutrition, which is the single most impactful change he can make. His current takeaway and convenience-based diet is rated 2 out of 10 for quality, and this is the root cause of his insulin resistance, his suboptimal liver enzymes, his low B-vitamin status, and likely a significant contributor to his fatigue and poor sleep. Based on his weight of 83kg, height of 190cm, age of 23, and his current sedentary activity level, his estimated maintenance calories sit around 2,490 per day using a multiplier of 1.3 for sedentary. If he introduces exercise, which we strongly recommend, this rises to approximately 2,780 at a moderate activity multiplier of 1.45. He does not need to lose weight; his BMI of 23 is healthy. The focus should be entirely on food quality. He should aim to build meals around lean protein sources such as chicken, turkey, fish, eggs, lentils, and Greek yoghurt, targeting a minimum of 108 to 133 grams of protein per day, which is 1.3 to 1.6 grams per kilogram of body weight. He should include vegetables and leafy greens with at least two meals per day, which will directly address his low folate. He should include oily fish such as salmon, mackerel, or sardines at least twice per week for omega-3 intake. He should replace refined carbohydrates with whole grains, sweet potatoes, and legumes, which provide sustained energy and soluble fibre. He does not need to eliminate takeaways entirely, but they should become the exception rather than the foundation. Even shifting from five or six takeaway meals per week to one or two, while building the rest around whole foods, would produce a measurable difference in his blood markers within three months.\n\nExercise is the second critical change. Danish currently does zero structured exercise and averages 5,000 to 7,500 steps per day. Introducing resistance training two to three times per week would directly improve his insulin sensitivity, which is the most important metabolic finding in this report. Resistance training forces muscles to take up glucose without needing as much insulin, which is the most effective non-pharmaceutical intervention for early insulin resistance. It will also support testosterone production, improve sleep quality through physical fatigue, and improve mood through endorphin release and the sense of progress. He should aim to build towards three resistance sessions per week focusing on compound movements such as squats, deadlifts, presses, and rows. Even bodyweight training at home is a meaningful starting point. Alongside this, increasing daily steps to 8,000 to 10,000 would improve baseline metabolic health and energy levels.\n\nSleep improvement is his third goal and is connected to the other two. Poor sleep worsens insulin resistance, lowers testosterone, increases inflammation, and reduces energy, creating a cycle that feeds itself. Practical steps include setting a fixed wake time seven days a week, getting outside within the first hour of waking for natural light exposure which helps set the circadian rhythm, cutting caffeine after midday, keeping the bedroom cool at around 16 to 18 degrees Celsius, and avoiding screens for at least 30 minutes before bed. The magnesium glycinate supplement recommended below will also support sleep quality. If his elevated IgE turns out to reflect an environmental allergen such as dust mites, addressing that exposure in the bedroom could significantly improve his sleep quality.\n\nRegarding the IgE elevation, Danish should discuss this with his GP. The specific points to bring are: total IgE is 375 IU/ml against an upper limit of 100, he is not reporting obvious allergy symptoms but this level warrants specific allergen panel testing (RAST or skin prick testing) to identify environmental or food triggers. If an allergen is identified, managing exposure could improve his sleep and reduce his background inflammation.\n\nRegarding the marginal MCV of 82 against a lower limit of 83, with normal iron studies, Danish should mention to his GP that given his South Asian heritage, a haemoglobin electrophoresis or HbH inclusion body test may be worth performing to screen for alpha-thalassemia trait. This is not urgent and does not cause illness, but it is useful information for his medical record and for future family planning.\n\nRegarding the Streptococcus agalactiae in the urine culture, no action is needed unless he develops urinary symptoms such as pain, frequency, or urgency. The absence of white blood cells and nitrites, combined with the plain bottle caveat, makes contamination the most likely explanation.\n\nFor retesting, we would recommend repeating a focused panel in approximately four months, around January 2027, after he has had time to implement dietary and exercise changes. The key markers to repeat would be fasting insulin, glucose, HbA1c, and HOMA-IR to assess insulin resistance improvement; testosterone, SHBG, and free testosterone to assess hormonal recovery; vitamin D to confirm supplementation is working; folate and B12 to confirm dietary improvement; hs-CRP to assess inflammation reduction; GGT and ALT to assess liver response; and IgE if the GP investigation identifies an allergen and management is underway.","flags":"INSULIN RESISTANCE: HOMA-IR 2.05, above the 1.9 threshold for early insulin resistance. Fasting insulin 9.8 mIU/L (range 2.6 to 24.9), fasting glucose 4.7 mmol/L, HbA1c 36 mmol/mol. C-Peptide 1.47 ug/L (approximately 487 pmol/L). Pattern consistent with early insulin resistance in a 23-year-old South Asian male with sedentary lifestyle and poor dietary quality. HOMA-B calculates to approximately 163, within the 80 to 200 range, confirming adequate pancreatic reserve.\n\nTESTOSTERONE AND SHBG: Total testosterone 10.3 nmol/L (range 8.4 to 28.7, lab recommended minimum 12, optimal 18 to 30). SHBG 14.3 nmol/L, below the lower limit of 17.3. Free testosterone calculated 0.285 nmol/L, marginally above the upper reference of 0.25, driven by the low SHBG. Free Androgen Index 72 (range 30 to 150). Low SHBG is associated with insulin resistance. Total testosterone is suboptimal for age 23 and likely reflects lifestyle factors rather than primary hypogonadism given normal LH (2.62) and FSH (4.41).\n\nVITAMIN D INSUFFICIENCY: 25(OH) vitamin D 31 nmol/L. Lab classifies as insufficient (30 to 50 range). Below the optimal range of 75 to 120. South Asian ethnicity increases supplementation requirements due to higher melanin reducing cutaneous synthesis. PTH 1.9 pmol/L (range 0.98 to 4.73), appropriately normal, indicating calcium metabolism is not yet affected.\n\nIgE MARKEDLY ELEVATED: Total IgE 375 IU/ml against upper limit of 100. Suggests significant allergic sensitisation. No specific allergen identified. Recommend specific allergen panel testing (environmental and food) via GP. May be contributing to sleep disturbance if allergen is environmental.\n\nLIPASE MARGINALLY ELEVATED: 64 U/L against upper limit of 60. Marginal elevation of 7%. No abdominal symptoms reported. Likely dietary in origin. Not consistent with pancreatitis. Monitor on retest.\n\nSUBOPTIMAL FOLATE: 6 ng/ml (range 3 to 17, optimal above 8). Reflects poor dietary quality. B12 322 pg/ml (range 193 to 982, optimal 500 to 900). Both suboptimal but not deficient.\n\nhs-CRP: 2.0 mg/L (range below 5, optimal below 1.0). Low-grade systemic inflammation with multiple identifiable drivers: poor diet, sedentary lifestyle, insulin resistance, elevated IgE/allergic inflammation.\n\nMCV MARGINALLY LOW: 82 fL (range 83 to 101). Iron studies normal (ferritin 96, transferrin saturation 20.4%). In a South Asian male, consider screening for alpha-thalassemia trait via haemoglobin electrophoresis. Clinically benign if confirmed but relevant for family planning.\n\nMCHC MARGINALLY ELEVATED: 350 g/L (range 315 to 345). Lab notes temperature and storage can affect this parameter. At this margin, likely pre-analytical artefact.\n\nURINE CULTURE: Moderate growth of Streptococcus agalactiae (Group B Streptococcus). Plain bottle received (no boric acid). No WBCs, no nitrites, no symptoms. Most consistent with contamination or asymptomatic colonisation. No treatment indicated. Repeat if urinary symptoms develop.\n\nRHEUMATOID FACTOR: Result pending (to follow).\n\nReassuring negatives: Kidney function excellent (Cystatin C eGFR 109). Liver structurally healthy (FIB-4 0.29). Thyroid function normal with negative antibodies. Lipid profile favourable with ApoB 0.75, Lp(a) below 25, ApoB/A1 ratio 0.615. PSA 0.72, tumour markers CEA and CA 19-9 within range. Coeliac screen negative. Immunoglobulins IgG, IgM, IgA within range. No haematuria or proteinuria.","recommendations":"1. Overhaul diet quality as the single highest-priority change. Shift from takeaway and convenience-based eating towards whole foods built around lean protein, vegetables, whole grains, and legumes. Target a minimum of 108 to 133 grams of protein per day. Include oily fish at least twice per week. Include leafy greens daily to address low folate.\n\n2. Begin resistance training two to three times per week to address insulin resistance, support testosterone production, and improve sleep quality. Start with compound movements and bodyweight exercises if gym access is limited. Aim to build to three structured sessions per week.\n\n3. Increase daily steps from the current 5,000 to 7,500 towards a target of 8,000 to 10,000.\n\n4. Discuss the IgE result of 375 with his GP and request specific allergen panel testing to identify the trigger. If environmental, address bedroom allergen exposure, which may significantly improve sleep.\n\n5. Discuss the marginal MCV of 82 with his GP and consider haemoglobin electrophoresis screening for alpha-thalassemia trait given South Asian heritage.\n\n6. Begin vitamin D supplementation at 4,000 IU daily (higher dose due to South Asian ethnicity and current insufficiency at 31 nmol/L). Always take with a fat-containing meal.\n\n7. Begin vitamin K2 (MK-7) at 100 mcg daily alongside vitamin D.\n\n8. Begin sublingual methylcobalamin (B12) at 1,000 mcg daily to bring B12 from 322 towards the optimal range of 500 to 900.\n\n9. Begin magnesium glycinate at 300 to 400mg before bed to support sleep quality.\n\n10. Implement sleep hygiene measures: fixed wake time, morning outdoor light exposure within one hour of waking, no caffeine after midday, cool bedroom at 16 to 18 degrees Celsius, screen-free wind-down for 30 minutes before bed.\n\n11. Retest in approximately four months (January 2027) focusing on: fasting insulin, glucose, HbA1c, HOMA-IR, testosterone, SHBG, free testosterone, vitamin D, folate, B12, hs-CRP, GGT, ALT, and IgE.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with the largest meal of the day or any meal containing fat. Danish's current level of 31 nmol/L is insufficient, and as someone of South Asian heritage, his skin produces less vitamin D from sunlight, so supplementation needs to be at the higher end of the dosing range. The target is to bring his level above 75 nmol/L, ideally into the 75 to 100 range. This will support energy, mood, immune function, and testosterone production.\n\nVitamin K2 (MK-7): 100 mcg daily, taken at the same time as vitamin D3. Vitamin K2 directs the calcium mobilised by vitamin D into bones and teeth rather than allowing it to deposit in blood vessel walls. It should always accompany vitamin D supplementation.\n\nMagnesium glycinate: 300 to 400mg elemental magnesium, taken 30 to 60 minutes before bed. The glycinate form is chosen specifically for its calming effect on the nervous system and its superior absorption compared to cheaper oxide forms. Danish's serum magnesium at 0.95 is within the optimal range, so this is being recommended specifically for sleep support rather than to correct a deficiency. Magnesium also supports insulin sensitivity and muscle function.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. The sublingual route bypasses the digestive system and provides better absorption than oral tablets. Danish's B12 at 322 is within the laboratory range but well below the optimal of 500 to 900. B12 supports energy production, nervous system function, and red blood cell formation.\n\nOmega-3 fish oil: 2 grams combined EPA and DHA daily, taken with food. This will support the reduction of his hs-CRP from 2.0 towards the optimal of below 1.0, support cardiovascular health, and may help improve mood. If he is eating oily fish twice per week as recommended, the dose can be reduced to 1 gram daily.\n\nHe does not need an iron supplement. His ferritin at 96 and iron studies are all healthy.\n\nHe does not need a folate supplement at this stage. His folate at 6 is suboptimal but not deficient, and the recommended dietary changes, particularly increasing leafy greens, legumes, and whole foods, should bring this up naturally. If his retest in four months shows folate has not improved despite dietary changes, a methylfolate supplement can be considered at that point.\n\nThe most important changes from this report are not supplements. They are transforming his diet from convenience-based to whole-food-based, introducing resistance training two to three times per week, and implementing consistent sleep hygiene practices. These three changes will address his insulin resistance, support his testosterone levels, reduce his inflammation, and directly target the fatigue, low mood, and poor sleep that brought him to this test. The supplements support the process, but the lifestyle changes drive it.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5893","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood at the time of the draw, reflecting immediate fuel availability. Danish's result of 4.7 mmol/L is within the optimal range of 4.0 to 5.4, which means his blood sugar at the time of testing was well controlled. However, this result needs to be interpreted alongside his insulin level, because the glucose can appear healthy while the insulin is working harder than it should to keep it there, which is exactly the pattern seen in his results.","low_causes":"Fasting too long before the test, very low carbohydrate diet, excessive exercise, reactive hypoglycaemia","high_causes":"Type 2 diabetes, pre-diabetes, insulin resistance, high sugar or refined carbohydrate diet, stress, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5133","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"3.5","upper_optimal":"5.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5800","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, providing an average picture of blood sugar control over the past two to three months. Danish's result of 5.4% is within the normal range of below 6.0%, but sits above the optimal threshold. This suggests his average blood sugar over recent months has been adequate but not ideal, consistent with a convenience-based diet that likely includes frequent refined carbohydrates and sugars.","low_causes":"Very low carbohydrate diet, high red blood cell turnover, blood loss","high_causes":"Pre-diabetes, diabetes, consistently elevated blood sugar, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in different units. Danish's result of 36 mmol/mol sits right at the top of the optimal band. The normal threshold for pre-diabetes begins at 42, so he has a comfortable margin, but the fact that his HOMA-IR indicates early insulin resistance means this number could drift upwards over the coming years if no changes are made.","low_causes":"Very low carbohydrate diet, high red blood cell turnover","high_causes":"Pre-diabetes, diabetes, consistently elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"9.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4417","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5356","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar under control. Danish's result of 9.8 is within the laboratory range of 2.6 to 24.9 but above the optimal band of 2 to 8. When fasting insulin is elevated while blood glucose is normal, it means the pancreas is having to produce more insulin than ideal to keep glucose in check. This is the hallmark of early insulin resistance, confirmed by his HOMA-IR calculation. At 23, this is an early warning signal that should motivate dietary and exercise changes.","low_causes":"Type 1 diabetes, low carbohydrate diet, very high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, obesity, high refined carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"487","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4543","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"800","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4669","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, providing an independent confirmation of how much insulin the body is producing. Danish's result of 487 pmol/L (converted from 1.47 ug/L) confirms moderate insulin production, consistent with his fasting insulin level and the early insulin resistance pattern identified by HOMA-IR.","low_causes":"Type 1 diabetes, advanced type 2 diabetes with pancreatic exhaustion, very low carbohydrate diet","high_causes":"Insulin resistance, insulinoma, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8500","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to the effects of insulin. Danish's HOMA-IR of 2.05 is above the 1.9 threshold that indicates early insulin resistance. The optimal level is below 1.0. This is the most clinically significant metabolic finding in this report. At 23 with a BMI of 23, this is being driven by his poor-quality diet and sedentary lifestyle rather than excess body fat, and it is highly reversible with dietary improvement and the introduction of exercise, particularly resistance training.","low_causes":"High insulin sensitivity, low carbohydrate diet, very active lifestyle","high_causes":"Insulin resistance, pre-diabetes, high refined carbohydrate diet, sedentary lifestyle, obesity, genetic predisposition (South Asian ethnicity)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"163.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5194","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates how well the beta cells in the pancreas are functioning in terms of insulin production. Calculated as (20 x insulin) / (glucose - 3.5), Danish's HOMA-B is approximately 163, which is well within the healthy range of 80 to 200. This confirms that his pancreas is producing insulin adequately. The problem is not with insulin production but with how efficiently the body's cells are responding to it.","low_causes":"Pancreatic beta cell dysfunction, advanced type 2 diabetes, type 1 diabetes","high_causes":"Insulin resistance with compensatory overproduction, very high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4036","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are under stress or damaged, ALT leaks into the bloodstream. Danish's ALT of 34 is within the laboratory limit of 56 but above the male optimal threshold of 30. In the context of a convenience-based diet likely high in processed foods, refined carbohydrates, and seed oils, this mild elevation reflects metabolic load on the liver rather than liver disease. Dietary improvement should bring this down.","low_causes":"Normal finding, B6 deficiency","high_causes":"Fatty liver disease, alcohol, medications, obesity, viral hepatitis, high processed food intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Danish's AST of 25 is well within both the laboratory range and the optimal range, indicating no significant liver cell stress from this marker's perspective.","low_causes":"Normal finding, B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, alcohol, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3151","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to metabolic stress, alcohol, and fatty liver. Danish's GGT of 46 is within the male laboratory range of 4 to 73 but well above the optimal threshold of 25. He does not report alcohol use, so this elevation is likely driven by his convenience-based diet. GGT is one of the earliest markers to respond to dietary improvement, and this number should drop meaningfully with the recommended changes.","low_causes":"Normal finding","high_causes":"Alcohol, fatty liver, metabolic syndrome, medications, obesity, high processed food intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver and bones. At 23, ALP can still be slightly influenced by residual bone growth. Danish's ALP of 84 is comfortably within range, indicating healthy liver and bone metabolism.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone disease, liver disease, bile duct obstruction, growing bones in young adults","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down and processed by the liver. Danish's bilirubin of 7 is comfortably within range, indicating normal red blood cell turnover and healthy liver processing.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"57","upper_optimal":"82","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Total protein measures the combined levels of albumin and globulin in the blood, reflecting liver synthetic function and immune status. Danish's total protein of 79 is within range.","low_causes":"Liver disease, malnutrition, kidney disease","high_causes":"Chronic inflammation, infection, dehydration, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"34","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, nutrients, and medications, and maintains fluid balance. Danish's albumin of 46 is healthy, confirming good liver synthetic function and adequate protein intake despite the poor overall diet quality.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"18","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Globulin encompasses a group of proteins including immunoglobulins (antibodies) and transport proteins. Danish's globulin of 33 is within range. The mildly higher position within range is consistent with his elevated IgE contributing to the globulin pool.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, infection, autoimmune disease, allergic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4024","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"The albumin-to-globulin ratio provides a quick snapshot of the balance between liver-produced albumin and immune-related globulin. Danish's A/G ratio of 1.39 (calculated from albumin 46 divided by globulin 33) is within the healthy range.","low_causes":"Chronic inflammation, liver disease, immune overactivation","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1000","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score uses age, ALT, AST, and platelet count in a formula to estimate the likelihood of liver fibrosis (scarring). Danish's score of 0.29 is very low, confirming no evidence of liver fibrosis. This is reassuring and means that while his liver enzymes show some dietary-related strain, there is no structural damage.","low_causes":"Normal finding indicating no fibrosis","high_causes":"Liver fibrosis, cirrhosis, age (age inflates the score), low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps break down starches. Danish's amylase of 68 is comfortably within range, indicating healthy pancreatic function from this marker's perspective.","low_causes":"Chronic pancreatitis with pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. Danish's lipase of 64 is marginally above the upper limit of 60. A meaningful elevation in lipase, typically three times the upper limit, would suggest pancreatitis, but at this margin the elevation is clinically insignificant. A convenience-based diet high in fried and fatty foods is the most likely explanation. His amylase being normal further confirms there is no pancreatic concern.","low_causes":"Chronic pancreatic insufficiency","high_causes":"Pancreatitis, high-fat diet, gallbladder disease, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4344","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the combined amount of all cholesterol types in the blood, including LDL, HDL, and VLDL. Danish's total cholesterol of 4.5 is within the desirable range of below 5.18 and within the optimal range, which is a positive finding.","low_causes":"Malnutrition, hyperthyroidism, liver disease, genetic factors","high_causes":"High saturated fat diet, genetic hypercholesterolaemia, hypothyroidism, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3824","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat storage in the body and are strongly influenced by diet, particularly refined carbohydrates, sugar, and alcohol. Danish's triglycerides of 1.3 are within the fasting limit of 1.7 but above the optimal level of below 1.0. In the context of a convenience-based diet and early insulin resistance, this is consistent with excess refined carbohydrate intake being converted to triglycerides by the liver. Dietary improvement should bring this down.","low_causes":"Very low fat or calorie diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, high sugar intake, alcohol, insulin resistance, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3782","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein cholesterol, is produced by the liver and carries triglycerides to tissues. Danish's VLDL of 0.59 is within range and within the optimal band, reflecting adequate triglyceride clearance.","low_causes":"Low fat diet, genetic factors","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is often called 'good' cholesterol because it carries excess cholesterol from blood vessel walls back to the liver for disposal. Danish's HDL of 1.4 is above the low-risk threshold of 1.04 but right at the boundary of the male optimal level of above 1.4. While not low, there is room for improvement. Exercise, particularly regular cardiovascular and resistance training, is one of the most effective ways to raise HDL.","low_causes":"Sedentary lifestyle, smoking, high refined carbohydrate diet, obesity, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4707","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein cholesterol, carries cholesterol to the body's tissues and can deposit it in artery walls if levels are elevated. Danish's LDL of 2.57 is within the laboratory range and just within the optimal band of below 2.6. At this level, there is no immediate cardiovascular concern, but maintaining this through dietary improvement is important given his South Asian heritage and higher baseline cardiovascular risk.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, liver disease","high_causes":"High saturated fat diet, genetic hypercholesterolaemia, hypothyroidism, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3567","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk by comparing total cholesterol to the protective HDL fraction. Danish's ratio of 3.21 is within the desirable range of below 4.5 and within the optimal band, indicating a favourable balance.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor cardiovascular risk profile","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This represents what proportion of total cholesterol is made up of the protective HDL fraction. Danish's HDL makes up 31.1% of his total cholesterol, which is above the desirable minimum of 20% and a positive indicator.","low_causes":"Low HDL, high LDL or triglycerides","high_causes":"High HDL, very low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3875","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4375","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all atherogenic (artery-damaging) cholesterol fractions in one number. Danish's non-HDL of 3.1 is within the target of below 4.0 and within the optimal range, which is a good result.","low_causes":"Very low fat diet, malabsorption","high_causes":"High saturated fat diet, insulin resistance, obesity, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.2","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein component of HDL particles. It reflects the functional capacity of HDL to remove cholesterol from artery walls. Danish's ApoA1 of 1.22 is just above the desirable minimum of 1.20, which is positive but near the threshold. Increasing exercise would be expected to raise this.","low_causes":"Sedentary lifestyle, smoking, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic lipoprotein particle, meaning each ApoB measurement effectively counts the number of particles that can deposit cholesterol in artery walls. It is considered a more accurate predictor of cardiovascular risk than LDL cholesterol alone. Danish's ApoB of 0.75 is below the desirable threshold of 0.9 and within the optimal range of below 0.8, which is an excellent result for cardiovascular risk.","low_causes":"Very low fat diet, malabsorption, genetic factors","high_causes":"High saturated fat diet, insulin resistance, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.615","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4393","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio summarises cardiovascular risk in a single number by comparing atherogenic particles (ApoB) to protective particles (ApoA1). Danish's ratio of 0.615 is below the lower-risk threshold of 0.7, which is favourable. It is marginally above the tighter optimal of 0.6 but this is a good result overall.","low_causes":"High HDL, low LDL, good cardiovascular health","high_causes":"High LDL, low HDL, insulin resistance, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined cardiovascular risk particle. Unlike LDL or triglycerides, Lp(a) cannot be meaningfully changed through diet or exercise; the level is almost entirely inherited. Danish's Lp(a) is below 25 nmol/L, comfortably within the normal range of below 32. This is genuinely useful information because it means that his cardiovascular risk profile is driven entirely by modifiable lifestyle factors rather than an inherited genetic burden. This only needs to be tested once in a lifetime.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (cannot be modified by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.93","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3100","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is calculated by dividing triglycerides by HDL cholesterol. It is a useful surrogate marker for insulin resistance and small dense LDL particles. Danish's ratio of 0.93 (1.3 divided by 1.4) is within the acceptable range of below 1.5 but above the optimal of below 0.87. This is consistent with his HOMA-IR finding and reflects the same underlying metabolic pattern of early insulin resistance driven by diet quality.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, high HDL","high_causes":"Insulin resistance, high carbohydrate diet, low HDL, high triglycerides","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, representing the cholesterol carried by triglyceride-rich remnant particles. These particles are increasingly recognised as an independent cardiovascular risk factor. Danish's remnant cholesterol of 0.53 (4.5 minus 1.4 minus 2.57) is within the acceptable range of below 0.8 but slightly above the optimal of below 0.5. This is consistent with his mildly elevated triglycerides.","low_causes":"Low triglycerides, excellent metabolic health","high_causes":"High triglycerides, insulin resistance, high refined carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a broad marker of systemic inflammation produced by the liver. It is also used as a cardiovascular risk marker, as chronic low-grade inflammation contributes to atherosclerosis. Danish's hs-CRP of 2.0 is within the laboratory limit of 5 but above the optimal level of below 1.0. At 2.0, this places him in what cardiology guidelines call 'average risk' for cardiovascular inflammation. In a 23-year-old, this is higher than ideal and has clear drivers: poor diet quality, sedentary lifestyle, insulin resistance, and the significant IgE elevation suggesting allergic inflammation.","low_causes":"Good metabolic health, low inflammation, regular exercise","high_causes":"Infection, chronic inflammation, obesity, insulin resistance, poor diet, allergic conditions, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, is another marker of inflammation that measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. Danish's ESR of 8 is within the male upper limit of 12 and within the optimal range, indicating that while his hs-CRP shows some low-grade inflammation, there is no significant systemic inflammatory process underway.","low_causes":"Normal finding, polycythaemia","high_causes":"Infection, autoimmune disease, cancer, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6410","units":"mmol/L","description":"Sodium is the main electrolyte controlling fluid balance and blood pressure. Danish's sodium of 144 is within both the laboratory range and the optimal band.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Danish's potassium of 4.0 is within the optimal range.","low_causes":"Diuretics, vomiting, diarrhoea, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, haemolysis in sample, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"96","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works with sodium and bicarbonate to maintain fluid balance and acid-base balance. Danish's chloride of 97 is within both the laboratory and optimal ranges.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4394","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, maintaining blood pH within a very narrow range. Danish's bicarbonate of 23.4 is within range, indicating normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"27.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9917","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate) and helps assess acid-base balance. Danish's calculated anion gap of 27.6 is above the typical range of 8 to 16. However, this calculation uses the potassium-inclusive formula, and many laboratories use a sodium-only formula which would give a lower result. Additionally, the anion gap can be influenced by albumin levels and the specific assay methods. Danish's albumin of 46, which is towards the upper end of range, can raise the anion gap. Given that his bicarbonate is normal, his kidney function is excellent, there are no ketones in the urine, and his glucose is normal, a true metabolic acidosis is very unlikely. This is most likely an artefact of the calculation method and his higher albumin, but it is included for completeness and can be mentioned to the GP for context.","low_causes":"Low albumin, laboratory error","high_causes":"Metabolic acidosis, ketoacidosis, lactic acidosis, renal failure, toxin ingestion, high albumin (artefactual)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5936","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6088","units":"mmol/L","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction, and heart rhythm. Danish's calcium of 2.6 is within range and within the optimal band. This is a positive finding.","low_causes":"Vitamin D deficiency, parathyroid dysfunction, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, providing a more accurate picture of true calcium status. Danish's corrected calcium of 2.5 is with
