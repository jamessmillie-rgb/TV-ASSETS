<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Zainab Mahomed","dob":"15/06/2001","report_date":"2026-09-30","summary":"Zainab is a 25-year-old female presenting with a BMI of 27.4, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are slightly below average (volume 4 out of 10). She trains twice a week with easy cardio and no resistance training, averaging 2,000 to 5,000 daily steps. She sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash. Stress feels hard to manage some weeks. She does not drink alcohol. She supplements vitamin D and iron. She has a diagnosis of hypothyroidism and prediabetes, and a family history of type 2 diabetes, thyroid disease, an autoimmune condition, and heart attack or stroke before 60. A previous blood test flagged something. She reports palpitations, dizziness that is regular and worsens a day or two before her period, twitching of the left eye, weight gain and difficulty losing weight, low energy, fatigue, brain fog, pins and needles mostly in the left leg, and hair thinning. She had alopecia a year ago with four spots that have not returned. Her weight fluctuates by around 5 kg within a month. She has heavy or painful periods. Her symptoms have been present for over a year. Her goals are to lose body fat, improve her energy levels, and build muscle.\n\nThe finding that should be discussed with her GP first is her iron status. Her serum iron is 6.5, well below the lower limit of 9. Her transferrin saturation is 10.19%, far below the 18% threshold and the 25% optimal floor. These numbers mean that although her ferritin (the storage form of iron) sits at 45, which looks adequate on paper, the iron circulating in her blood and available for use is genuinely depleted. Transferrin saturation is the proportion of her iron-carrying protein that is actually loaded with iron, and at 10% it means roughly nine out of every ten binding sites are travelling empty. This is the pattern of functional iron deficiency: the stores have not yet bottomed out, but the supply to the tissues is already insufficient. Her MCV (mean corpuscular volume, a measure of red blood cell size) is 78.7, below the normal floor of 83, and her RDW (red cell distribution width, which measures variation in cell size) is 15.1%, above the 14% ceiling. Together these confirm that her bone marrow is already producing smaller, more variable red cells because it does not have enough iron to build them properly. Her haematocrit, the proportion of blood made up of red cells, is also fractionally low at 0.356 against a lower limit of 0.36. Her MCHC at 348 is marginally above 345, which in this context is a compensatory response to microcytosis rather than a separate problem. Her ESR (erythrocyte sedimentation rate, a non-specific marker of inflammation) is 26, more than double the upper limit of 12. In a 25-year-old woman with heavy periods, iron deficiency is the most likely driver of a raised ESR because smaller, iron-depleted red cells sediment faster, but her CRP (C-reactive protein, a more specific inflammation marker) at 2.7 is also above the optimal threshold of 1.0, which raises the possibility that there is a mild inflammatory contribution as well. Given her history of alopecia areata, an autoimmune condition, and her family history of autoimmune disease, the combination of raised ESR and CRP above optimal is worth the GP noting. Iron deficiency at this level explains a great deal of what Zainab is experiencing. Iron is essential for oxygen transport in haemoglobin, for energy production in the mitochondria of every cell, and for neurotransmitter synthesis in the brain. When supply is this low, the body cannot deliver oxygen efficiently, the brain cannot produce dopamine and serotonin at normal rates, and peripheral nerves do not function optimally. Her fatigue, brain fog, afternoon crash, dizziness, palpitations, pins and needles in the left leg, eye twitching, and hair thinning are all recognised features of iron deficiency, and the fact that they have been present for over a year fits a slowly worsening picture. Heavy, painful periods are both a cause (blood loss depletes iron) and a consequence (iron deficiency can worsen menstrual bleeding), creating a cycle that will not break without intervention. The current iron supplement she is taking is clearly not keeping pace with her losses, and the GP should review the form, dose and timing, and consider investigating the heavy periods themselves.\n\nThe second finding for the GP is her cardiovascular risk profile, and specifically her lipoprotein(a). Lp(a) is a modified form of LDL cholesterol particle that is entirely genetically determined. It cannot be changed by diet, exercise, weight loss or any currently available supplement. Zainab's Lp(a) is 94.94 nmol/L, nearly three times the 32 nmol/L threshold above which risk begins to rise. This places her in the moderate risk category. Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls just as LDL does, it promotes blood clot formation, and it drives local inflammation at the vessel lining. Given her family history of heart attack or stroke before 60, this inherited marker is important information. It should be recorded permanently in her medical notes, and her first-degree relatives, particularly parents and siblings, should be offered Lp(a) testing. When the Lp(a) contribution is subtracted from her LDL, the corrected LDL is 2.71, which is above the optimal ceiling of 2.0 but within the laboratory limit of 3.0. This means that roughly 0.3 of her total LDL is carried by Lp(a) and is not modifiable. The remaining 2.71 is modifiable through diet and lifestyle. Her ApoB (apolipoprotein B, which counts the total number of cholesterol particles capable of entering artery walls) is 0.96, above the 0.9 desirable threshold and well above the 0.8 optimal target. Her ApoB to ApoA1 ratio is 0.8, at the boundary between average and higher risk. Her HDL at 1.1 is above the risk threshold of 1.04 but below the desirable level of 1.55 and well below the optimal of 1.6. Her Apolipoprotein A1 at 1.2 is below the 1.4 desirable threshold. HDL and ApoA1 are the protective side of the lipid equation, ferrying cholesterol away from artery walls, and both being below target means the protective counterbalance is weaker than it should be. The Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that measures the risk being built across ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 50 out of 100, above the 40 threshold. The two main drivers are the Lp(a) (which she cannot change) and the ApoB and HDL (which she can). The good news is that her triglycerides at 0.89 are excellent, well within the optimal range, and her VLDL (very low density lipoprotein, a triglyceride-rich particle) at 0.4 is clean. This tells us her liver is not overproducing the fat-rich particles that drive metabolic cardiovascular risk. The pattern here is not a metabolic lipid problem driven by diet and insulin resistance; it is an inherited Lp(a) burden sitting alongside a modifiable LDL and HDL profile that diet, exercise, and potentially medication in the future can improve.\n\nHer parathyroid hormone (PTH) at 0.9 is marginally below the lower limit of 0.98. PTH is the hormone that regulates calcium and phosphate balance, and a low reading usually means the parathyroid glands are being appropriately suppressed because calcium is adequate, which it is: her corrected calcium is 2.37, comfortably within range, and her phosphate at 1.1 is normal. Her vitamin D is 119, which is excellent and reflects good supplementation. Because vitamin D enhances calcium absorption from the gut, a high vitamin D level naturally suppresses PTH, and at 119 this is the most likely explanation for the marginally low reading. This is not a concern, but it is worth noting so the GP has the context.\n\nThere is a great deal to be reassured by in this report. Her thyroid, despite a diagnosis of hypothyroidism, is currently functioning well. Her TSH (thyroid stimulating hormone, the signal from the pituitary that tells the thyroid to produce more hormone) is 1.02, which is textbook optimal. Her free T4 at 18 and free T3 at 5.2 are both within their ideal ranges, and the FT3 to FT4 conversion ratio of 0.289 is healthy. Crucially, both thyroid antibodies are negative: TPO antibodies are below 6.6 against a threshold of 13.8, and thyroglobulin antibodies are below 1.3 against a threshold of 4.4. This is important because it means there is no autoimmune attack on the thyroid at present. If she was previously told she had Hashimoto's thyroiditis (the autoimmune form of hypothyroidism), these results suggest either that the condition has quietened or that the original diagnosis may have been subclinical and has resolved. If she is taking thyroid medication, these results suggest it is working well; if she is not, her thyroid is managing on its own. Either way, this is a positive finding.\n\nHer blood sugar control is genuinely good and does not support a current diagnosis of prediabetes. Her fasting glucose at 4.1 is ideal. Her HbA1c at 36 mmol/mol (5.5%) is within the optimal range, well below the 42 prediabetes threshold. Her fasting insulin at 8.18 is at the top of the optimal band of 2 to 8 but within it, and her HOMA-IR (a calculated index of insulin resistance, where lower is better) is 1.49, just inside the upper limit of 1.5. Her C-peptide, which measures how much insulin the pancreas is actually producing, converts to 678.6 pmol/L, which is healthy. So while insulin sensitivity is not perfect and there is room to improve it, this is far from prediabetes at present. Given her family history of type 2 diabetes and her South Asian ethnicity, which carries a higher lifetime risk of insulin resistance, keeping HOMA-IR at or below 1.5 is a meaningful achievement and one worth protecting.\n\nHer liver is in excellent health. ALT at 10 and GGT at 15 are both well within the optimal range. Her FIB-4 score (a fibrosis index that estimates liver scarring) is 0.44, about as low as that number gets. Her APRI score at 0.139 and NAFLD fibrosis score at minus 1.627 both rule out any liver scarring. Her amylase and lipase, which reflect pancreatic health, are both comfortably within range. Her kidneys are working well. Her Cystatin C, a more reliable marker of kidney filtration than creatinine alone at her size, gives an eGFR of 107, exactly where it should be at 25. Her creatinine at 47 is technically one point below the laboratory lower limit of 49, but this is entirely normal for a woman of her build and has no clinical significance. Her uric acid, sodium, potassium, chloride, bicarbonate and magnesium are all within range, with magnesium sitting at 0.91 in the optimal band.\n\nHer immune system looks balanced. IgG, IgM and IgA are all within their laboratory ranges. IgE at 50.6 is within range, suggesting no significant allergic activation. Rheumatoid factor is negative. Coeliac screening (tissue transglutaminase IgA) is negative, which is useful given her family history of autoimmune conditions. Her full blood count, aside from the iron-related changes already discussed, is healthy: white cell count, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all normal, and her platelets at 251 and MPV at 8.9 are both well placed. Her reticulocyte count at 1.31% and absolute reticulocytes at 59 are within range, suggesting her bone marrow is responding normally. The tumour markers CA125, CA15-3, CA19-9 and CEA are all within their normal ranges. Her urinalysis is entirely clean: no protein, glucose, ketones, blood, white cells, nitrites or bacterial growth.\n\nHer hormonal picture is consistent with the follicular phase of a normal menstrual cycle. Oestradiol at 193 falls within the follicular range. Progesterone at 1.13 is consistent with the follicular or early cycle phase. LH at 5.95 and FSH at 6.56 are both within follicular range, and the LH to FSH ratio is normal, which is reassuring because an elevated ratio can suggest polycystic ovary syndrome. Testosterone at 0.7 and free androgen index at 1.58 are both within the female reference range. DHEA-S at 3.4 umol/L (approximately 1,253 ug/dL) is within range. Prolactin at 148 is within the non-pregnant range. SHBG at 44.3 is normal. Cortisol at 228 is within the morning reference range. Her free testosterone, calculated at 0.011, sits at the very bottom of the range and is flagged as high by the laboratory, but this appears to be a laboratory classification quirk as 0.011 against a range of 0.01 to 0.25 is effectively at the floor, not elevated. Her bioavailable testosterone at 0.24 is within the optimal band.\n\nHer vitamin D at 119 is excellent and reflects consistent supplementation. Her B12 at 382 is within the laboratory range of 193 to 982 but sits below the optimal threshold of 500. At 382 it is not deficient, but given her symptoms of pins and needles, brain fog and fatigue, and the fact that B12 is essential for nerve myelin sheath maintenance and neurotransmitter production, bringing it above 500 would be worthwhile. Her folate at 9 is above the optimal floor of 8. Her total antioxidant activity at 1.68 is within range.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 22, about 3 years younger than a calendar age of 25. Her Mentzer index at 17.4 is well above 13, which helps distinguish iron deficiency from a genetic haemoglobin condition called thalassaemia trait. In a woman of South Asian heritage, where beta-thalassaemia trait is more common, this is a useful result: a Mentzer index above 13 favours iron deficiency as the explanation for the small red cells rather than thalassaemia, which is consistent with the very low transferrin saturation. However, the GP may still wish to confirm with a haemoglobin electrophoresis, particularly given the family background.\n\nPulling this together, the dominant story in Zainab's blood is functional iron deficiency driven by heavy menstrual losses that her current supplementation is not correcting, sitting alongside an inherited cardiovascular risk from Lp(a) that needs to go on her permanent medical record. The iron deficiency is very likely the single biggest driver of her fatigue, brain fog, dizziness, palpitations, pins and needles, eye twitching and hair changes. The cardiovascular profile needs attention through diet and exercise to bring the modifiable ApoB and HDL into better territory, which will also help her insulin sensitivity and weight goals. Her thyroid is currently well controlled, her blood sugar is good, her liver and kidneys are clean, and her immune markers are balanced.","links":"The central thread running through this report is iron deficiency. Zainab's serum iron at 6.5 and transferrin saturation at 10.19% show that iron delivery to the tissues is profoundly low, even though her ferritin has not yet collapsed. The downstream effects are visible across the full blood count: her MCV is small at 78.7, her RDW is widened at 15.1%, her haematocrit is fractionally low at 0.356, and her MCHC is marginally above range as a compensatory artefact. Her ESR at 26 is very likely amplified by these smaller, iron-depleted red cells sedimenting faster, though the CRP at 2.7 adds the possibility of a mild inflammatory component, which is worth watching given her autoimmune history. The cause is almost certainly her heavy, painful periods outstripping what her current iron supplement can replace. This single mechanism plausibly explains the majority of her symptoms: the fatigue, the afternoon energy crash, the brain fog, the palpitations, the dizziness that worsens premenstrually (when blood loss is imminent or ongoing), the pins and needles (iron is needed for peripheral nerve function and myelin maintenance), the eye twitching (which can reflect neuromuscular irritability from iron or magnesium depletion), and the hair thinning (the hair follicle is one of the most metabolically active structures in the body and is among the first to be rationed when iron is scarce).\n\nThe second thread is cardiovascular, and it is largely separate from the iron story. Her Lp(a) at 94.94 is inherited and permanent, and it increases the number of atherogenic particles in her blood independently of anything she eats or does. Her ApoB at 0.96 and LDL at 3.02 are both above optimal, and when the Lp(a) contribution is removed her corrected LDL is 2.71, still above the ideal ceiling of 2.0. Her HDL at 1.1 and ApoA1 at 1.2 are both below their desirable thresholds, meaning the protective arm of her lipid system is underperforming. At 25, her ten-year event risk is very low regardless of these numbers, but the Cardiovascular Risk Score of 50 reflects the risk being built, and her family history of premature cardiovascular disease makes this more urgent than it would be for someone without that background. The modifiable portion of this risk, the ApoB, LDL, HDL and ApoA1, will respond to dietary changes (more oily fish, more soluble fibre, more vegetables, less processed food) and to regular exercise, particularly resistance training, which raises HDL over time.\n\nThe third thread ties her metabolic and weight concerns together. Her HOMA-IR at 1.49 is just inside the upper boundary, and her fasting insulin at 8.18 is at the top of the optimal band. She is not insulin resistant, but she is not insulin sensitive either, and with her family history of type 2 diabetes and her South Asian ethnicity she sits in a higher-risk lane. Her weight fluctuations of 5 kg within a month are more likely fluid and hormonal than fat gain and loss, but her overall goal of losing body fat will be served by the same interventions that improve her insulin sensitivity: more protein, more vegetables, resistance training, and a modest calorie deficit.\n\nWhat has been positively excluded is important. Her thyroid is working well despite a previous diagnosis of hypothyroidism, with optimal TSH, FT4, FT3 and negative antibodies. Coeliac disease has been ruled out. There is no evidence of autoimmune thyroid attack. Her liver, kidneys, pancreas and immune markers are all clean. Her tumour markers are negative. Her urinalysis is clear. The alopecia areata she experienced a year ago has not left a detectable autoimmune footprint in these bloods, though the negative antibodies and normal immunoglobulins are reassuring rather than definitive, as alopecia areata is a T-cell mediated condition that does not always show in standard blood tests.","lifestyle":"Add a palm-sized portion of protein to every meal: eggs, Greek yoghurt, chicken, lentils, fish or tofu. Anchor: protein goes on the plate before anything else. Why: protein supports muscle building (one of your goals), stabilises blood sugar to prevent the afternoon crash, and keeps insulin from climbing above its current borderline level of 8.18.\nAdd at least three portions of vegetables or fruit a day, building to five over the next month. Start with one portion at lunch and one at dinner this week. Why: you are currently eating 0 to 1 portions a day, and vegetables provide the soluble fibre that lowers LDL cholesterol and ApoB, the potassium that supports blood pressure, and the micronutrients your diet is likely missing.\nEat oily fish (salmon, mackerel, sardines) twice a week, or add a daily omega-3 supplement. Anchor: pick two fixed days. Why: omega-3 raises HDL and ApoA1 (both below target) and lowers inflammation (CRP 2.7).\nSwap sugary snacks for whole fruit, nuts or yoghurt, starting with the most frequent one. Why: reducing sugar some days to rarely will lower the insulin demand on your pancreas, protect your HOMA-IR of 1.49 from drifting higher, and help with the weight goal.\nBegin two resistance training sessions a week, even 20 minutes of bodyweight exercises at home. Anchor: attach to two fixed days that are not your cardio days. Why: resistance training is the strongest lever for building muscle (your goal), raising HDL, improving insulin sensitivity, and increasing daily energy expenditure.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal and will help get your step count from the current 2,000 to 5,000 range towards 7,500.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking, even on cloudy days. Why: morning light resets the cortisol rhythm, which is the most effective intervention for the slow-to-get-going mornings and the afternoon crash you describe.\nCut caffeine after 1pm if you are using it to push through the afternoon. Why: caffeine after early afternoon delays sleep onset and reduces deep sleep quality, which feeds the fatigue cycle the next morning.","flags":"Serum iron 6.5 (lower limit 9) and transferrin saturation 10.19% (lower limit 18%). Functional iron deficiency with microcytic changes (MCV 78.7, RDW 15.1%, haematocrit 0.356). Heavy menstrual periods are the likely cause. Current iron supplement is not correcting the deficit. GP should review iron replacement (form, dose, timing), investigate the heavy periods, and consider haemoglobin electrophoresis to exclude thalassaemia trait given South Asian heritage, although the Mentzer index of 17.4 favours iron deficiency.\nESR 26 (upper limit 12). Most likely amplified by iron-deficient microcytic red cells sedimenting faster, but CRP at 2.7 (above optimal 1.0) adds a mild inflammatory signal. Worth monitoring given autoimmune history (alopecia areata). No active autoimmune markers detected: RF negative, coeliac negative, thyroid antibodies negative.\nLp(a) 94.94 nmol/L (upper limit 32). Moderate inherited cardiovascular risk. Cannot be modified by lifestyle. Should be recorded permanently in medical notes. First-degree relatives should be offered Lp(a) testing. Family history of premature cardiovascular disease increases the clinical significance.\nApoB 0.96 g/L (desirable below 0.9, optimal below 0.8), LDL 3.02 (optimal below 2.6), HDL 1.1 (desirable above 1.55), ApoA1 1.2 (desirable above 1.4), ApoB/A1 ratio 0.8 (desirable below 0.6). Lp(a)-corrected LDL is 2.71. Cardiovascular Risk Score 50/100 (threshold 40). The modifiable portion (ApoB, LDL, HDL, ApoA1) should be addressed through diet and exercise. Consider early discussion with GP about long-term lipid strategy given Lp(a) and family history.\nPTH 0.9 pmol/L (lower limit 0.98). Marginally below range, most likely physiologically suppressed by excellent vitamin D at 119 nmol/L and adequate calcium. Not a clinical concern but noted for GP context.\nB12 382 pg/ml. Within laboratory range but below optimal 500. Relevant given symptoms of pins and needles and brain fog. Supplementation recommended.\nHOMA-IR 1.49 (upper limit 1.5). Just inside range. Not insulin resistant, but at the boundary. Relevant given South Asian ethnicity and family history of type 2 diabetes. Lifestyle changes should aim to move this below 1.0.\nReassuring negatives: thyroid function optimal with negative antibodies (TSH 1.02, FT4 18, FT3 5.2, TPO and thyroglobulin antibodies negative), HbA1c 36 (no prediabetes), liver enzymes excellent (ALT 10, GGT 15, FIB-4 0.44), kidney function excellent (Cystatin C eGFR 107), coeliac screen negative, immunoglobulins normal, tumour markers CA125, CA15-3, CA19-9 and CEA all normal, urinalysis clean.","recommendations":"Discuss iron replacement with the GP. The current supplement is not keeping pace with menstrual losses. Bring these numbers: serum iron 6.5 (limit 9), transferrin saturation 10.19% (limit 18%), MCV 78.7 (limit 83), ferritin 45. The GP may switch to a higher-dose ferrous bisglycinate, add vitamin C for absorption, consider alternate-day dosing for better absorption, or investigate intravenous iron if oral supplementation continues to fail.\nAsk the GP to investigate the heavy, painful periods. They are the root cause of the iron deficiency. Options include ultrasound, gynaecology referral, and discussion of hormonal management if appropriate.\nAsk the GP to consider haemoglobin electrophoresis to exclude beta-thalassaemia trait, given South Asian heritage and microcytic indices. The Mentzer index at 17.4 favours iron deficiency but does not completely rule out co-existing trait.\nRecord Lp(a) at 94.94 nmol/L permanently in the medical notes. Ask about testing parents and siblings. Discuss long-term lipid strategy: at 25 the ten-year risk is low, but the lifetime risk is elevated by the combination of Lp(a), ApoB 0.96, family history of premature cardiovascular disease, and South Asian ethnicity.\nAsk the GP to recheck CRP and ESR once iron deficiency has been corrected, to confirm the raised ESR was iron-driven rather than inflammatory.\nRetest in four to six months with a focused panel: full blood count, iron studies (including transferrin saturation), CRP, ESR, lipid panel with ApoB and Lp(a), HbA1c, fasting insulin and HOMA-IR, and B12. Target: transferrin saturation above 25%, MCV above 83, ESR below 12, ApoB below 0.9, HOMA-IR below 1.0. Calorie target for modest fat loss: approximately 1,550 to 1,650 kcal per day (TDEE estimated at 1,850 kcal with current activity, minus a 200 to 300 deficit). Protein target: 85 to 105 g per day (1.3 to 1.6 g/kg). Weight target range: 57 to 62 kg.","supplementation":"Iron bisglycinate, 25 mg on alternate days, taken with 500 mg vitamin C (as ascorbic acid) on an empty stomach or with a light meal, at least two hours away from tea, coffee, dairy or calcium supplements. Why: her transferrin saturation at 10.19% and serum iron at 6.5 show the current supplement is not correcting the deficit. Alternate-day dosing improves absorption by reducing hepcidin suppression. She should discuss the dose with her GP as she may need more, or intravenous iron if oral fails.\nVitamin D3 (cholecalciferol), 2,000 IU daily with her largest meal (the meal containing the most fat). Why: her level at 119 is excellent and this maintains it. Continue the current supplement at its current dose; do not increase, as PTH is already suppressed.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone and away from arteries, which is especially important when vitamin D is optimising calcium absorption.\nSublingual methylcobalamin (vitamin B12), 1,000 mcg daily, dissolved under the tongue. Why: her B12 at 382 is below the optimal 500 threshold, and her symptoms of pins and needles and brain fog may partly reflect suboptimal B12. Sublingual bypasses any gut absorption issues.\nOmega-3 fish oil, 2 g combined EPA and DHA daily, taken with food. Why: her HDL at 1.1 and ApoA1 at 1.2 are both below target, and her CRP at 2.7 is above optimal. Omega-3 raises HDL, lowers triglycerides (already good, keeping them there), and reduces inflammation.\nMagnesium glycinate, 300 mg before bed. Why: her magnesium at 0.91 is within the optimal range but the glycinate form supports sleep quality (she is slow to get going), may help the eye twitching and muscle cramps, and supports the energy production pathways that iron deficiency is already straining.\nDo not take calcium supplements unless directed by the GP. Her corrected calcium is 2.37 and her vitamin D is driving excellent absorption. Additional calcium could suppress PTH further and is unnecessary.\nThe most important changes from this report are not supplements. They are correcting the iron deficiency through GP-guided replacement, investigating the heavy periods, adding protein and vegetables to every meal, and beginning resistance training.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 56 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 56. Weakest systems: inflammation 19%, lipids & cardiovascular 34%, iron studies 38%. Biggest drags: Lipoprotein(a), Apolipoprotein B, LDL Cholesterol, Red Cell Distribution Width.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"","upper_normal":"30","lower_optimal":"","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built rather than a ten-year event probability. Zainab's score of 50 is above the 40 threshold. The two main drivers are her Lp(a) at 94.94 (inherited, not modifiable) and her ApoB at 0.96 with HDL at 1.1 (both modifiable). At 25, her ten-year risk of a cardiovascular event is very low, but the gap between a low ten-year risk and a high lifetime risk is the window for acting. The modifiable components should be addressed through diet, exercise and, in discussion with her GP, consideration of long-term lipid-lowering strategy.","low_causes":"Optimal lipid profile, low Lp(a), low inflammation, excellent metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5533","units":"mmol/L","description":"Blood glucose is the amount of sugar circulating in the blood after fasting. Zainab's result at 4.1 is within the ideal range, sitting near the lower end of optimal. This is an excellent result, particularly given her family history of type 2 diabetes and her South Asian ethnicity, which carries a statistically higher risk of insulin resistance. It confirms that her blood sugar regulation is working well at present.","low_causes":"Fasting too long, excess insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, prediabetes, type 2 diabetes, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been coated with sugar over the preceding two to three months. It gives a longer-term picture of blood sugar control than a single fasting glucose. Zainab's result at 5.5% is within the normal range (below 6.0%) and well below the prediabetes threshold of 6.0 to 6.4%. This does not support a current diagnosis of prediabetes. However, iron deficiency can slightly lower HbA1c by increasing red cell turnover, so a recheck after iron correction would give a more definitive reading.","low_causes":"Iron deficiency (faster red cell turnover), haemolytic anaemia, blood loss","high_causes":"Prediabetes, type 2 diabetes, consistently high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Zainab's result at 36 mmol/mol sits at the optimal ceiling, well below the 42 mmol/mol prediabetes threshold. This confirms good blood sugar control over the past two to three months.","low_causes":"Iron deficiency, haemolytic conditions","high_causes":"Prediabetes, diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"8.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4173","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5754","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas to move sugar from the blood into cells for energy. Fasting insulin reflects how hard the pancreas has to work to keep blood sugar stable. Zainab's result at 8.18 is within the laboratory range but sits just above the optimal ceiling of 8. This means her pancreas is producing slightly more insulin than ideal to maintain her excellent fasting glucose of 4.1. It is not insulin resistance, but it is a signal that her cells are beginning to require a little more persuasion, and with her family history of type 2 diabetes this is worth improving through diet and exercise.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate diet, excess body fat, PCOS, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"678.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5188","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"400","upper_optimal":"1200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3662","upper_optimal_position":"0.6099","units":"pmol/L","description":"C-peptide is released in equal amounts to insulin when the pancreas produces it, making it a reliable measure of how much insulin the pancreas is actually manufacturing. Zainab's result at 678.6 pmol/L (converted from 2.05 ug/L) is comfortably within the healthy range. This confirms that her pancreas is producing an appropriate amount of insulin and is functioning well.","low_causes":"Type 1 diabetes, low insulin demand, very low carbohydrate diet","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4967","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated index that combines fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A lower number means the cells respond easily; a higher number means the pancreas must work harder. Zainab's result at 1.49 sits right at the upper boundary of the laboratory range. She is not insulin resistant, but she is at the edge. With her South Asian ethnicity and family history of type 2 diabetes, improving this to below 1.0 through dietary changes and resistance training is an important goal.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Excess body fat, high carbohydrate diet, sedentary lifestyle, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts HbA1c into an approximate average blood sugar over the preceding two to three months. Zainab's at 6.1 mmol/L is within the optimal range, consistent with her healthy HbA1c. This confirms good overall blood sugar regulation.","low_causes":"Excellent blood sugar control, low carbohydrate diet","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4534","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"124","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4778","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Zainab's result at 124 is within the female laboratory range of 120 to 150 but sits below the optimal floor of 125. Given her iron deficiency, this is not surprising: haemoglobin production requires iron, and when iron supply is restricted, haemoglobin is one of the outputs that suffers. This level is not anaemic, but it is suboptimal and will likely improve as iron stores are replenished.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5767","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures how many red blood cells are in each litre of blood. Zainab's at 4.53 is within the optimal range for a female. Despite her iron deficiency, her body is maintaining the number of red cells. The issue is their size (MCV low) and the variation in that size (RDW high), not the count itself.","low_causes":"Iron, B12 or folate deficiency, blood loss, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.356","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3293","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume made up by red blood cells. Zainab's at 0.356 is fractionally below the lower limit of 0.36. This is consistent with her iron deficiency: when iron is insufficient, each red cell is smaller than it should be, so the total volume they occupy is reduced even though the cell count itself is normal. This will improve as iron is corrected.","low_causes":"Iron deficiency, anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"15.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8097","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5972","units":"%","description":"RDW measures the variation in size among red blood cells. A higher number means some cells are noticeably larger or smaller than others. Zainab's at 15.1% is above the upper limit of 14%, confirming that her bone marrow is producing a mix of normal-sized and undersized cells. This is a hallmark of iron deficiency: as iron stores decline, newer cells are built smaller, while older cells from when iron was more adequate remain normal-sized, creating the variation.","low_causes":"Rarely clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiencies, thalassaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume","group":"HEMATOLOGY","result":"78.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3095","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV is the average size of each red blood cell, measured in femtolitres. Zainab's at 78.7 is below the lower limit of 83, confirming microcytosis (small red cells). The two main causes of microcytosis are iron deficiency and thalassaemia trait. Her very low transferrin saturation at 10.19% strongly points to iron deficiency, and her Mentzer index of 17.4 (above 13 favours iron deficiency over thalassaemia). However, given her South Asian heritage, where beta-thalassaemia trait is more common, a haemoglobin electrophoresis could be considered to confirm.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead exposure","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism, alcohol excess, reticulocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin","group":"HEMATOLOGY","result":"27.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3533","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH is the average amount of haemoglobin in each red blood cell. Zainab's at 27.3 is just inside the lower limit of 27, sitting below the optimal floor of 28. This is consistent with the microcytic picture: smaller cells contain less haemoglobin per cell, which reduces the oxygen-carrying efficiency of each cell. This will improve with iron repletion.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"348","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"g/L","description":"MCHC is the average concentration of haemoglobin within each red cell. Zainab's at 348 is marginally above the upper limit of 345. In the context of microcytosis (small cells), a slightly raised MCHC is a compensatory artefact: the cells are smaller but are packing haemoglobin more densely. At this margin it does not suggest a separate pathology and will normalise as the MCV improves with iron correction.","low_causes":"Iron deficiency (typically), thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, dehydration, compensatory mechanism in microcytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"251","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4628","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3628","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the small cell fragments that form blood clots to stop bleeding. Zainab's at 251 is comfortably within the optimal range. Iron deficiency can sometimes push platelets up as a reactive response, but hers remain well balanced.","low_causes":"Viral infections, medications, autoimmune conditions, liver disease, bone marrow disorders","high_causes":"Iron deficiency (reactive), infection, inflammation, post-surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6111","units":"fL","description":"MPV is the average size of platelets. Larger platelets tend to be younger and more active. Zainab's at 8.9 is within the optimal range, indicating normal platelet production and turnover.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Platelet destruction (immune), vitamin D or B12 deficiency, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"5.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4243","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's front-line defenders. Zainab's total count at 5.63 is within the optimal range, indicating a well-functioning immune system with no signs of infection or immune suppression.","low_causes":"Viral infections, autoimmune conditions, bone marrow suppression, medications","high_causes":"Bacterial infections, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"3.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4120","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and are the first responders to bacterial infection. Zainab's at 3.18 is within the optimal range, indicating healthy immune readiness.","low_causes":"Viral infections, medications, autoimmune conditions, nutritional deficiency","high_causes":"Bacterial infections, stress, inflammation, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"1","upper_normal":
