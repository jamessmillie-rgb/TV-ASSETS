tivity.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infections, eczema, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and are involved in allergic and inflammatory responses. Zainab's at 0.02 is at the lower boundary, which is entirely normal and expected.","low_causes":"Rarely clinically significant","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4687","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly released red blood cells. Their percentage reflects how actively the bone marrow is producing new cells. Zainab's at 1.31% is within the optimal range, showing that her bone marrow is responding appropriately. In iron deficiency, one might expect an elevated reticulocyte count as the marrow tries to compensate, but at this stage the production rate is normal.","low_causes":"Bone marrow suppression, severe iron or B12 deficiency, chronic kidney disease","high_causes":"Blood loss, haemolysis, recovery from anaemia, treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"59.343","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3956","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"This is the absolute number of reticulocytes (young red blood cells) in the blood. At 59.3, Zainab's result is within the normal range, confirming that her bone marrow is producing red cells at an appropriate rate.","low_causes":"Bone marrow failure, nutritional deficiency, chronic kidney disease","high_causes":"Active blood loss, haemolysis, response to iron or B12 treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"17.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3504","lower_normal":"13","upper_normal":"99","lower_optimal":"13","upper_optimal":"99","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"index","description":"The Mentzer index divides MCV by red blood cell count to help distinguish iron deficiency (index above 13) from thalassaemia trait (index below 13) as the cause of small red cells. Zainab's at 17.4 is above 13, favouring iron deficiency as the explanation for her microcytosis. This is clinically useful given her South Asian heritage, where beta-thalassaemia trait is more common. However, the Mentzer index is a screening tool, not definitive, and a haemoglobin electrophoresis could be considered for confirmation.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube in one hour. A faster rate suggests inflammation, infection, or changes in red cell shape or size. Zainab's at 26 is more than double the upper limit of 12. In her case, iron-deficient microcytic red cells (MCV 78.7, smaller than normal) tend to form stacks that sediment faster, which is the most likely explanation. However, her CRP at 2.7, which is a more specific inflammation marker, is also above optimal, which adds a possible mild inflammatory component. Given her history of alopecia areata, this is worth monitoring once iron is corrected.","low_causes":"Polycythaemia, sickle cell disease, high albumin","high_causes":"Iron deficiency, infection, inflammation, autoimmune disease, pregnancy, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is produced by the liver in response to inflammation anywhere in the body. It is one of the most useful markers for detecting low-grade chronic inflammation, and in cardiovascular risk assessment a level above 1.0 adds to the risk picture. Zainab's at 2.7 is within the laboratory range of under 5 but significantly above the optimal threshold of under 1.0. Possible contributors include her iron deficiency (the body mounts a mild inflammatory response), her BMI of 27.4 (adipose tissue produces inflammatory signalling molecules), and her history of autoimmune alopecia areata. This should be rechecked after iron correction to see whether it normalises.","low_causes":"No significant inflammation, excellent metabolic health","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, metabolic syndrome, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"10.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2438","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is actually loaded with iron. It is one of the most important markers for assessing functional iron availability. Zainab's at 10.19% is well below the lower limit of 18% and far below the optimal floor of 25%. This means that roughly nine out of ten binding sites on her transferrin are travelling empty. Even though her ferritin (stored iron) is not critically low, the iron in active circulation is severely depleted. This is driving her microcytosis, her symptoms of fatigue, brain fog, palpitations, dizziness, and likely contributing to her hair thinning. The GP should review her iron replacement urgently.","low_causes":"Iron deficiency, heavy menstrual periods, poor dietary intake, chronic blood loss, malabsorption","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"6.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2370","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5818","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. Zainab's at 6.5 is significantly below the lower limit of 9 and well below the optimal floor of 12. This confirms that the iron available for immediate use by tissues, bone marrow and the brain is genuinely depleted. Serum iron fluctuates with meals and time of day, but at this level, even accounting for variation, the deficiency is clear.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption, chronic disease","high_causes":"Iron overload, haemochromatosis, liver damage, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3436","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. In iron deficiency, transferrin usually rises as the body produces more carrier protein to try to scavenge whatever iron is available. Zainab's at 2.54 is just inside the lower boundary of the range, which is slightly lower than expected for iron deficiency. This could reflect the mild inflammatory signal (CRP 2.7) suppressing transferrin production, as transferrin is a negative acute phase reactant, meaning inflammation pushes it down.","low_causes":"Inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"62.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5228","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3748","upper_optimal_position":"0.6265","units":"umol/L","description":"TIBC represents the total capacity of transferrin in the blood to bind iron. A higher number typically indicates that there are many empty binding sites, which is a hallmark of iron deficiency. Zainab's at 62.2 is within range, though in classical iron deficiency TIBC tends to be elevated. The fact that hers is not elevated may again reflect the mild inflammatory suppression of transferrin production.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4571","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4394","upper_optimal_position":"0.5297","units":"ng/ml","description":"Ferritin is the main storage form of iron in the body. Zainab's at 45 sits just above the optimal floor of 40 for a female, which looks adequate on paper. However, ferritin can be falsely supported by inflammation (it is an acute phase reactant, meaning it rises when CRP rises), and with her CRP at 2.7 it is possible that her true stores are lower than 45 suggests. More importantly, ferritin tells us about stored iron, not about iron in circulation, and her transferrin saturation at 10.19% shows that the iron in active use is severely depleted regardless of what is in storage.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Inflammation, infection, liver disease, iron overload, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the primary electrolyte that regulates fluid balance and blood pressure. Zainab's at 142 is within the optimal range, indicating well-regulated fluid and electrolyte balance.","low_causes":"Excess water intake, heart failure, kidney disease, medications","high_causes":"Dehydration, excess salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":" re working well.","low_causes":"Kidney disease, dehydration, medications, aging","high_causes":"Pregnancy, hyperfiltration in early diabetes","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4455","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/L","description":"Cystatin C is a protein produced by all cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable measure of kidney function in women of smaller build. Zainab's at 0.98 is within the optimal range, and the eGFR calculated from it (107) confirms excellent kidney filtration.","low_causes":"Rarely clinically significant","high_causes":"Kidney disease, thyroid disorders, inflammation, corticosteroids","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"314","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines in food and cells. Zainab's at 314 is within the optimal female range, indicating healthy purine metabolism and kidney clearance.","low_causes":"Low purine diet, medications","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_ al":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. Zainab's at 0.4 is well within the optimal range, consistent with her excellent triglyceride level and indicating that the liver is not overproducing fat-rich particles.","low_causes":"Low triglyceride production, fasting","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3548","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. Zainab's at 1.1 is above the risk threshold of 1.04 but below the desirable level of 1.55 and well below the optimal female target of 1.6. A low HDL means the protective arm of the lipid system is weaker. The most effective ways to raise HDL are regular exercise (especially resistance training), increasing dietary omega-3, and maintaining a healthy weight.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5033","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits cholesterol in artery walls when present in excess. Zainab's at 3.02 is marginally above the upper limit of 3.0 and above the optimal ceiling of 2.6. Part of this is carried by her Lp(a), which is inherited and not modifiable. The Lp(a)-corrected LDL is 2.71, which represents the modifiable portion. Dietary changes (more soluble fibre from oats, beans, lentils, and vegetables; more oily fish; less saturated fat) and exercise will help reduce this.","low_causes":"Low fat diet, hyperthyroidism, liver disease, malabsorption","high_causes":"High saturated fat diet, genetics, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4544","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a single number reflecting cardiovascular risk. A lower ratio is better. Zainab's at 4.09 is within the laboratory limit of 4.5 but above the optimal threshold of 3.5. The ratio is being driven by her HDL being below target rather than her total cholesterol being excessively high.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"24.44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. A higher percentage means more of the cholesterol is protective. Zainab's at 24.44% is above the minimum of 20% but below the optimal of 28%, reflecting her suboptimal HDL level.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol, exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol particles (LDL, VLDL, Lp(a)). Zainab's at 3.4 is within the laboratory limit of 4 but above the optimal ceiling of 3.0. This is partly driven by her Lp(a), which adds to the non-HDL total and cannot be reduced by lifestyle changes.","low_causes":"Low LDL, statin therapy, low fat diet","high_causes":"High LDL, high Lp(a), high triglycerides, poor diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles and directly reflects the functional capacity of the protective cholesterol system. Zainab's at 1.2 is below the desirable threshold of 1.4, consistent with her suboptimal HDL. ApoA1 is the counterbalance to ApoB: it removes cholesterol from artery walls. A low ApoA1 means the removal system is underperforming. Exercise, particularly consistent moderate-to-vigorous activity, is the most effective way to raise it.","low_causes":"Sedentary lifestyle, smoking, obesity, genetics, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is the single best measure of cardiovascular risk from cholesterol. Each potentially harmful cholesterol particle (LDL, VLDL, Lp(a)) carries exactly one ApoB molecule, so ApoB directly counts the total number of particles that can enter and damage artery walls. Zainab's at 0.96 is above the desirable threshold of 0.9 and well above the optimal target of 0.8. Part of this is driven by her elevated Lp(a), but even after subtracting the Lp(a) contribution, the modifiable portion is above ideal. Dietary changes (increasing soluble fibre, reducing saturated fat, adding omega-3) and regular exercise are the first-line interventions.","low_causes":"Statin use, very low fat diet, hyperthyroidism, malnutrition","high_causes":"High saturated fat diet, genetics, insulin resistance, hypothyroidism, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio is the single most informative cardiovascular risk ratio. It compares the number of harmful particles (ApoB) against the number of protective particles (ApoA1). Zainab's at 0.8 sits at the boundary between average and higher risk, above the female desirable threshold of 0.6. Both sides need improvement: her ApoB is too high (0.96) and her ApoA1 is too low (1.2). Diet and exercise will address both simultaneously.","low_causes":"High ApoA1, low ApoB, excellent diet and exercise","high_causes":"High ApoB, low ApoA1, sedentary lifestyle, poor diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"94.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a modified form of LDL particle that is entirely genetically determined. It cannot be changed by diet, exercise, weight loss or any currently available supplement. Zainab's at 94.94 nmol/L is nearly three times the 32 nmol/L threshold, placing her in the moderate risk category. Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls, it promotes blood clot formation, and it drives inflammation at the vessel lining. Given her family history of heart attack or stroke before 60, this inherited marker is particularly important. It should be recorded permanently in her medical notes, and her first-degree relatives (parents and siblings) should be offered Lp(a) testing. This result cannot change, which means it only needs to be measured once in a lifetime.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, fixed, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5268","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4060","upper_optimal_position":"0.5595","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone circulating in the blood. The thyroid produces it and the body converts it to T3, the active form. Zainab's FT4 at 18 is within the ideal range, indicating that the thyroid is producing an appropriate amount of hormone. This is reassuring given her diagnosis of hypothyroidism.","low_causes":"Hypothyroidism, pituitary disease, medications, illness","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4443","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.4754","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is the signal sent from the pituitary gland in the brain to the thyroid gland, telling it how much hormone to produce. A high TSH means the brain is shouting at the thyroid to work harder. Zainab's at 1.02 is right at the lower edge of the optimal range, which is textbook. This means the pituitary is satisfied with the amount of thyroid hormone in the blood and does not need to push for more. Despite her hypothyroidism diagnosis, this is an excellent reading.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism in every cell. Zainab's FT3 at 5.2 is within the ideal range, confirming that her body is converting T4 to T3 efficiently. This is the hormone that directly affects energy, mood, weight and mental clarity.","low_causes":"Hypothyroidism, selenium deficiency, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, excess T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as happens in Hashimoto's thyroiditis. Zainab's at below 6.6 is well within the normal range and negative for autoimmune thyroid disease. This is important and reassuring: it means there is no current autoimmune attack on her thyroid. If she was previously diagnosed with Hashimoto's, either the antibodies have subsided or the original diagnosis may have been based on different criteria.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to make hormones. Like TPO antibodies, they are markers of autoimmune thyroid disease. Zainab's at below 1.3 is well within the normal range and confirms no autoimmune attack on the thyroid from this angle either. Both antibodies being negative is very reassuring.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.289","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio estimates how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Zainab's at 0.289 is within the optimal range, confirming healthy thyroid hormone conversion. This is driven by both FT4 and FT3 sitting in their ideal ranges.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"119","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation and muscle strength. Zainab's at 119 nmol/L is excellent, sitting at the top of the optimal range. This reflects consistent supplementation and is one of the standout positives in the report. Her vitamin D is likely contributing to the suppression of her PTH, which is marginally below range but appropriately so at this vitamin D level.","low_causes":"Limited sunlight, dark skin, indoor lifestyle, obesity, malabsorption, poor supplementation","high_causes":"Excess supplementation (above 150 can become concerning), granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5600","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels in the blood. When calcium is low, PTH rises to pull calcium from bones and increase absorption from the gut. When calcium is adequate and vitamin D is high, PTH is appropriately suppressed. Zainab's at 0.9 is marginally below the lower limit of 0.98, but in the context of her excellent vitamin D at 119 and her normal corrected calcium at 2.37, this is very likely a physiological suppression rather than a pathological finding. The parathyroid glands simply do not need to work hard when vitamin D is doing the job.","low_causes":"Excellent vitamin D and calcium status (appropriate suppression), hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"382","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4069","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4557","upper_optimal_position":"0.6158","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and brain health. Zainab's at 382 is within the laboratory range but below the optimal threshold of 500. At this level, symptoms of suboptimal B12 can include fatigue, brain fog, pins and needles and mood changes, all of which she reports. B12 is particularly important for the myelin sheath that insulates peripheral nerves, and her pins and needles in the left leg may partly reflect suboptimal levels. Supplementation with sublingual methylcobalamin is recommended to bring this above 500.","low_causes":"Vegetarian or vegan diet, malabsorption, pernicious anaemia, gut conditions, metformin, acid-suppressing medications","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6190","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and during early pregnancy for preventing neural tube defects. Zainab's at 9 is above the optimal floor of 8, indicating adequate folate status. Folate and B12 work together in many processes, so optimising both is important.","low_causes":"Poor vegetable intake, malabsorption, medications (methotrexate, certain anticonvulsants), alcohol, pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5745","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3809","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which cause cell damage and aging. Zainab's at 1.68 is within the optimal range, indicating good antioxidant defence. This may be partly supported by her vitamin D supplementation.","low_causes":"Poor fruit and vegetable intake, oxidative stress, chronic disease, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca1","name":"CA-125","group":"TUMOR MARKERS","result":"21.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3071","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"21","lower_normal_position":"0","upper_normal_position":"0 function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
