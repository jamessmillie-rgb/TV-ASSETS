<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Larissa Vieira de Jesus","dob":"25/01/1990","report_date":"2026-11-05","summary":"Patient is a 36-year-old female presenting with a BMI of 35.1, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are larger than average (volume 7 out of 10). She does no cardio or resistance training, with fewer than 2,000 daily steps. She sleeps under 6 hours a night, wakes tired most mornings, and feels tired on waking; stress feels hard to manage most days. She does not drink alcohol. She is currently breastfeeding and takes a progesterone-only pill (desogestrel). She supplements with a multivitamin and omega-3 fish oil. She has had a previous blood test where something was flagged. She reports low energy and fatigue, poor sleep and insomnia, weight gain and difficulty losing weight, and low sex drive. Her goals are to lose body fat, improve energy levels, and balance hormones.\n\nThe finding in this report that warrants a conversation with her GP is her Lipoprotein(a), which at 136.96 nmol/L sits in the moderate risk category. Lipoprotein(a), often written Lp(a), is a particle in the blood that carries cholesterol, encourages clotting, and drives inflammation in artery walls. Unlike LDL cholesterol, it is almost entirely determined by genetics and does not change meaningfully with diet, exercise, or weight loss. A level above 125 nmol/L is considered raised and adds meaningful cardiovascular risk independently of everything else in the lipid panel. Because it is genetic, it is worth recording permanently in her medical notes, and her GP may wish to offer testing to first-degree relatives, including her children as they grow older. It also means that managing every modifiable cardiovascular risk factor becomes more important, because the Lp(a) component cannot be reduced. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that measures how much risk is being built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes in at 40. That score is being driven almost entirely by the Lp(a) and the hsCRP, because the rest of her lipid panel is in excellent shape. Without the Lp(a), this score would be comfortably in the ideal range.\n\nThe good news is that a great deal of this report is reassuring, and the modifiable parts of her cardiovascular picture are genuinely strong. Her total cholesterol is 3.9, her LDL is 2.05, and her Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) and shows what is actually modifiable, is just 1.61. That is an excellent number. Her ApoB, the protein that sits on every atherogenic particle and is considered the single best measure of how many dangerous particles are circulating, is 0.79, below the 0.9 desirable threshold and below the stricter 0.8 optimal target. Her HDL is 1.6, which is in the desirable range for a woman. Her triglycerides are remarkably low at 0.48, a sign that her liver is handling fat metabolism efficiently and that insulin is not driving triglyceride production. Her ApoB to ApoA-I ratio is 0.52, within the lower risk category. The atherogenic index of plasma is negative at minus 0.523, which is ideal. In short, every part of her cardiovascular risk that she can influence through lifestyle is working in her favour.\n\nHer liver is healthy. ALT at 19 and GGT at 20 are both within the optimal range for a woman. AST is 20, the De Ritis ratio is 1.05, the APRI score is 0.19, and the FIB-4 is 0.63, all of which make significant liver fibrosis or fatty liver disease very unlikely. At a BMI of 35.1, a clean liver panel is a genuine positive and worth noting. Her amylase at 67 and lipase at 41 confirm the pancreas is working normally. Her thyroid is functioning well. TSH at 1.04 is in the ideal range, free T4 at 14.1 is within the laboratory range, free T3 at 5.2 is within the optimal range, and the FT3 to FT4 ratio of 0.369 confirms good conversion from the storage hormone to the active one. Both thyroid antibodies, TPO and thyroglobulin, are negative, making autoimmune thyroid disease very unlikely. Her kidney function is solid. Creatinine at 70 gives an eGFR above 90 by the standard calculation. Her Cystatin C, a protein filtered by the kidneys that gives a weight-independent measure of kidney function, is 1.01 with a Cystatin C eGFR of 88 and a combined eGFR of 88. That combined figure sits just below the optimal threshold of 90 but is well within the normal range and entirely appropriate for her age. Urea at 5.6, uric acid at 310, sodium, chloride and bicarbonate are all within range. Her calcium, corrected calcium, phosphate, magnesium and parathyroid hormone are all normal. Magnesium at 1.02 is within the optimal band, which is a positive given how common low magnesium is.\n\nHer blood sugar control is good overall. Fasting glucose at 4.3 is in the ideal range, and HbA1c at 37 mmol/mol (5.5%) is normal, meaning average blood sugar over the past three months has been well controlled. Her insulin at 8.13 is within the laboratory range of 2.6 to 24.9 but sits just above the optimal ceiling of 8 mIU/L. Her HOMA-IR, a calculated index that estimates how resistant the body's cells are to insulin (calculated by multiplying fasting insulin by fasting glucose and dividing by 22.5), is 1.55, which is above the upper limit of 1.5. This is a mild elevation, not yet in the range where it would be called insulin resistance (that begins around 1.9 to 2.0), but it tells us the body is having to produce a little more insulin than ideal to keep blood sugar in check. At a BMI of 35.1 with very low physical activity and fewer than 2,000 steps a day, this is the expected metabolic pattern: the weight and inactivity are creating a small amount of extra insulin demand. The TyG index at 7.41 and the estimated average glucose at 6.2 are both well within range. Her C-peptide at 1.97 ug/L confirms the pancreas is producing insulin normally. The positive message here is that the blood sugar system is coping well despite the metabolic load. The HOMA-IR is a signal to act now, while the numbers are still borderline, rather than waiting for them to climb further.\n\nHer hsCRP is 2.6 mg/L. CRP, or C-reactive protein, is a marker of systemic inflammation. The laboratory range runs to 5, but the cardiovascular literature draws the line at 1.0 for ideal and considers anything above 3.0 as higher risk. At 2.6 she is in the intermediate zone. In a 36-year-old who is breastfeeding, carrying extra weight, sleeping under six hours, and under daily stress, this level of low-grade inflammation has several plausible drivers. Adipose tissue, particularly visceral fat, produces inflammatory cytokines that raise CRP. Short sleep independently raises CRP. Chronic stress does the same. It is not possible to say which is contributing most, but all three are modifiable, and improving any one of them should bring this number down.\n\nHer full blood count shows a few findings worth discussing. Her red blood cell count at 5.0 is marginally above the upper limit of 4.8 for women. Her MCV, the mean corpuscular volume which measures the average size of each red blood cell, is 82.2, just below the lower limit of 83. These two findings go together: a slightly high red cell count with slightly small red cells is the classic early pattern of iron-restricted red cell production. The body is making plenty of red cells but they are a fraction smaller than ideal because iron supply is not quite keeping pace with demand. Her ferritin at 35 is within the laboratory range of 10 to 291 but is below the optimal floor of 40 for a woman. In a breastfeeding mother, iron demand is increased because iron is transferred into breast milk, and this is the most likely explanation for the pattern. Her haemoglobin at 142 is healthy, so she is not anaemic, and her serum iron at 17.1 and transferrin saturation at 30.26% are both within range. Her transferrin, the protein that carries iron in the blood, is 2.25, which is below the lower limit of 2.5. In iron deficiency, transferrin usually rises as the body tries to scavenge more iron, so a low transferrin alongside a low-normal ferritin is a slightly unusual combination. The most likely explanation is that the demands of breastfeeding are keeping iron stores low while the transferrin, which is also a negative acute phase reactant (meaning it falls when inflammation is present), is being suppressed by the CRP of 2.6. This is not a picture that needs urgent action, but it is worth keeping an eye on, and her GP should be aware given the breastfeeding context.\n\nHer lymphocytes at 3.19 are marginally above the upper limit of 3.0. In isolation, a marginal lymphocyte elevation in a young, breastfeeding woman who may have had a minor viral exposure in the weeks before the test is not clinically significant. Her total white cell count is 7.03, her neutrophils are 3.37, and the rest of the differential is normal. Her basophils at 0.01 are fractionally below the lower limit of 0.02, which at this margin is laboratory variation and carries no clinical meaning. Her ESR at 5 is low, which is reassuring.\n\nHer immunoglobulins are all within range. IgG at 7.7, IgA at 1.4, and IgE at 13 are unremarkable. Her IgM at 0.6 is within range but sits at the lower end; in the context of the rest of the immune panel being normal, this does not raise a concern. Rheumatoid factor is negative at 4, and tissue transglutaminase IgA is negative, making coeliac disease very unlikely.\n\nHer hormonal picture is consistent with breastfeeding and the progesterone-only pill. Oestradiol at 434 pmol/L is within the follicular range, LH at 4.87 and FSH at 4.04 are both consistent with contraceptive suppression and the hormonal milieu of breastfeeding. Progesterone at 0.6 nmol/L is low, which is expected on the progesterone-only pill (the exogenous progestogen is not measured by the blood test, so the low reading reflects suppressed ovarian progesterone rather than a true deficiency). Testosterone at 0.8 nmol/L is within the female range, free testosterone at 0.015 nmol/L is within range, and SHBG at 33.1 is at the lower end of the female range but within it. DHEA-S at 2.5 umol/L is within range. Prolactin at 372 uIU/mL is within the non-pregnant range and is entirely consistent with active breastfeeding, which physiologically elevates prolactin to maintain milk production. Her cortisol at 156 nmol/L is within the laboratory range. Given her reports of daily stress and poor sleep, cortisol within range is reassuring; it suggests the adrenal stress response is not chronically elevated.\n\nHer vitamin D at 86 nmol/L is within the sufficient range and within the optimal band of 75 to 120. This is a good level, particularly at a BMI of 35.1 where fat tissue sequesters vitamin D and makes it harder to maintain adequate levels. Her multivitamin is likely contributing. Her B12 at 385 pg/mL is within range but below the optimal floor of 500. In a breastfeeding mother, B12 status matters because the vitamin passes into breast milk and supports the infant's neurological development. Her serum folate at 20 ng/mL is above the upper limit of 17 but this is almost certainly driven by her multivitamin supplement, which typically contains folic acid or methylfolate. A folate above range from supplementation is not harmful and does not need action. Her total antioxidant activity at 1.91 is above the upper limit of 1.77, which again is likely the effect of her multivitamin and omega-3 supplementation. This is a positive finding.\n\nHer tumour markers are all clean. CA125 at 14.4, CA15-3 at 4, CA19-9 below 1.2, and CEA below 0.5 are all well within their respective limits. Creatine kinase at 108 is within range.\n\nHer urinalysis is unremarkable. Protein, glucose, ketones and nitrites are all negative. The urine culture shows insignificant growth. Her urine red blood cells are at 10, which is below the laboratory threshold of 25 for significance. In a young woman who is not menstruating (progesterone-only pill), this is within normal limits.\n\nHer PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes in at 24.5 years against a calendar age of 36, making her biological age eleven and a half years younger than her chronological age. This is an excellent result and reflects the strength of her underlying metabolic and immune health despite the weight and the sleep deficit. The markers that could push PhenoAge upward, glucose, CRP and lymphocyte percentage, are not far enough from ideal to do so significantly.\n\nPulling the picture together: the dominant story in this report is a young woman whose core health is strong but whose body is under strain from a combination of significant excess weight, very low physical activity, poor sleep, daily stress, and the metabolic demands of breastfeeding. The blood shows this in two places: the borderline HOMA-IR telling us insulin is having to work a little harder than it should, and the hsCRP telling us low-grade inflammation is present. The iron picture shows the early effects of breastfeeding demand on iron stores. The inherited Lp(a) is the one finding she cannot change, and it makes managing everything else more important. The symptoms she reports, the fatigue, the poor sleep, the difficulty losing weight and the low libido, are consistent with the combination of sleep deprivation, excess weight, breastfeeding-related hormonal suppression, and chronic stress rather than any single hormonal or metabolic failure. The thyroid is working, the adrenals are not overdriven, the blood sugar is controlled, and the ovarian hormones are doing exactly what they should be doing in a breastfeeding woman on the progesterone-only pill.","links":"The central thread running through this report is the interaction between weight, inactivity, and the metabolic demands of breastfeeding. At a BMI of 35.1 with fewer than 2,000 steps a day and no structured exercise, the body is carrying a significant metabolic load. Adipose tissue is metabolically active: it produces inflammatory cytokines that raise CRP, it reduces insulin sensitivity (visible in the borderline HOMA-IR of 1.55), and it sequesters fat-soluble vitamins. Despite this load, the body is coping remarkably well. The liver is clean, blood sugar is controlled, the thyroid is functioning, and the lipid panel, aside from the inherited Lp(a), is excellent.\n\nThe iron and red cell findings tell a second, related story. Breastfeeding increases iron demand, and at a ferritin of 35 with a slightly low transferrin and a marginally elevated red cell count with slightly small red cells, the picture is of iron stores that are adequate but not abundant. The low transferrin is likely being pulled down by the CRP of 2.6 rather than reflecting true iron overload (ferritin is only 35, and transferrin saturation is a healthy 30%). This is a pattern to monitor rather than treat aggressively, particularly while breastfeeding, because the demands will ease when breastfeeding stops.\n\nThe Lp(a) at 136.96 stands apart from the rest of the lipid panel. Every modifiable lipid marker is in excellent shape: LDL 2.05, ApoB 0.79, HDL 1.6, triglycerides 0.48. The Lp(a)-corrected LDL of 1.61 shows that once the cholesterol carried by Lp(a) is removed, the truly modifiable LDL burden is very low. This is important because it means the elevated Cardiovascular Risk Score of 40 is almost entirely driven by two things she cannot change (Lp(a)) and one she can (hsCRP). Bringing the CRP below 1.0 through improved sleep, gradual weight loss, and increased activity would lower the score meaningfully.\n\nThe symptoms she reports, fatigue, poor sleep, difficulty losing weight, and low libido, do not have a single hormonal or metabolic explanation in this blood panel. The thyroid is working, testosterone is within range, cortisol is not elevated, and blood sugar is controlled. The most likely drivers are the ones blood cannot measure directly: fewer than six hours of sleep, waking tired, daily stress, complete physical inactivity, and the hormonal milieu of breastfeeding (prolactin suppresses libido physiologically). These are all modifiable, and addressing them is likely to improve symptoms more than any supplement or medication.\n\nThe one loose end is the B12 at 385. It is within the laboratory range but below the optimal threshold of 500, and in a breastfeeding mother the infant depends on maternal B12 for neurological development. This is easily corrected with sublingual supplementation.","lifestyle":"Start with a fifteen-minute walk once a day, anchored to whatever you already do after your largest meal: plate in the sink, shoes on, out the door. Walking after eating blunts the blood sugar and insulin spike from that meal, which is the mechanism behind your borderline HOMA-IR of 1.55, and at fewer than 2,000 steps a day, this one habit will roughly double your daily movement.\nAdd a palm-sized portion of protein to every meal before anything else goes on the plate: eggs, Greek yoghurt, chicken, tinned fish, beans. Anchor: the protein goes on the plate first every time. Why: protein blunts the insulin response, supports muscle preservation while breastfeeding, and keeps you full for longer, which naturally reduces overall intake without calorie counting.\nBuild vegetables up to four or five portions a day, one portion at a time, starting with the meal where you currently eat the fewest. Add a handful of spinach to whatever you are already cooking, or a side of frozen peas or broccoli. Why: fibre slows glucose absorption (helping that HOMA-IR) and feeds gut bacteria that produce anti-inflammatory short-chain fatty acids (helping the CRP of 2.6).\nSet a fixed wake time seven days a week and get outside within thirty minutes of waking, even if it is just standing at the back door with a cup of tea. Morning light resets the circadian clock, which is the strongest single lever for improving both sleep quality and the pattern of waking tired. At under six hours a night, sleep is the biggest driver of your fatigue, your CRP, and your difficulty losing weight.\nSet a caffeine cut-off at noon. Caffeine has a half-life of five to six hours, so an afternoon coffee is still circulating at midnight. Anchor: after noon, switch to decaf or herbal. Why: protecting the second half of your sleep improves the deep sleep phase that lowers CRP and restores energy.\nWhen you feel ready, add one resistance session a week: bodyweight squats, press-ups against a wall, a short online follow-along. Anchor: a fixed day and time that works around feeding. Why: resistance training improves insulin sensitivity directly, builds lean mass that raises your basal metabolic rate, and is the most effective type of exercise for long-term body composition change.\nKeep a two-day food and symptom diary once a month. Not to count calories, but to spot patterns: which meals leave you most tired, which ones keep you full. This builds self-awareness without the pressure of daily tracking.\nCalorie and protein targets while breastfeeding should be agreed with your GP or health visitor. Breastfeeding increases energy needs by approximately 500 kcal per day, and any calorie reduction must protect milk supply and your own recovery. A protein target of 1.3 to 1.6 g per kg of body weight, which for you is 137 to 168 g per day, supports lean mass preservation and satiety. These figures are a starting point to discuss with your healthcare team rather than a prescription to follow independently.","flags":"Lipoprotein(a) 136.96 nmol/L, moderate risk category (ideal below 32, moderate risk 90 to 200). Lp(a) is almost entirely determined by genetics, does not respond meaningfully to lifestyle or most medications, and independently increases cardiovascular and clotting risk. Should be recorded permanently in her medical notes. First-degree relatives may benefit from testing. The GP should consider overall cardiovascular risk in the context of this result alongside the otherwise excellent modifiable lipid profile.\nHOMA-IR 1.55, above the upper limit of 1.5, with fasting insulin 8.13 mIU/L (optimal ceiling 8) and fasting glucose 4.3 mmol/L. This is a borderline elevation consistent with her BMI of 35.1 and very low physical activity. Not yet insulin resistance (threshold approximately 1.9 to 2.0) but a signal that metabolic load is building. HbA1c 37 and glucose 4.3 confirm blood sugar is still well controlled.\nhsCRP 2.6 mg/L, above the optimal cardiovascular threshold of 1.0 though within the laboratory range of less than 5. In a breastfeeding woman at BMI 35.1 with under six hours of sleep and daily stress, this level of low-grade inflammation has multiple contributors. Worth monitoring on retest.\nFerritin 35 ng/mL, within the laboratory range (10 to 291) but below the optimal floor of 40 for a woman, alongside a transferrin of 2.25 g/L (below the lower limit of 2.5) and a marginally elevated red blood cell count of 5.0 (upper limit 4.8) with a marginally low MCV of 82.2 (lower limit 83). This pattern suggests iron stores are being drawn down by breastfeeding demand. Haemoglobin 142, serum iron 17.1 and transferrin saturation 30% are all within range, so she is not anaemic.\nB12 385 pg/mL, within the laboratory range (193 to 982) but below the optimal floor of 500. In a breastfeeding mother, B12 passes into breast milk and is important for infant neurological development. Sublingual supplementation is appropriate.\nCardiovascular Risk Score 40 out of 100, at the upper boundary of the acceptable range. The score is being driven primarily by the inherited Lp(a) and the hsCRP of 2.6. The modifiable lipid markers (ApoB 0.79, LDL 2.05, HDL 1.6, triglycerides 0.48) are all in excellent shape.\nLymphocytes 3.19, marginally above the upper limit of 3.0. In a young breastfeeding woman, a marginal elevation is not clinically significant and most likely reflects a minor immune stimulus. Basophils 0.01, fractionally below the lower limit of 0.02, is laboratory variation with no clinical meaning.\nSerum folate 20 ng/mL, above the upper limit of 17, almost certainly from multivitamin supplementation. Not harmful and does not require action.\nTotal antioxidant activity 1.91, above the upper limit of 1.77, likely from supplementation. A positive finding.\nCalculated serum osmolality 297.9 mOsm/kg, marginally above the upper normal limit of 295. Sodium is 144 (within range) and glucose is normal. This is a very mild elevation that could reflect hydration status at the time of the sample and does not indicate a clinical problem.\nReassuring negatives: thyroid function is normal with negative antibodies, making autoimmune thyroid disease very unlikely. HbA1c 37 and glucose 4.3 make diabetes unlikely. Liver enzymes, FIB-4 and APRI make significant liver disease or fibrosis very unlikely. Kidney function is normal. All tumour markers are within range. Coeliac screen is negative. Rheumatoid factor is negative. Cortisol is within range. Urinalysis is unremarkable.\nNot reported on this occasion: potassium.","recommendations":"Discuss the Lp(a) of 136.96 nmol/L with your GP. Ask for it to be recorded permanently in your medical records. Your GP may wish to review your overall cardiovascular risk and may suggest testing first-degree relatives in due course. Bring the full lipid panel (LDL 2.05, ApoB 0.79, HDL 1.6, triglycerides 0.48) to show that every modifiable marker is in excellent shape.\nMention the borderline HOMA-IR of 1.55 and fasting insulin of 8.13. These are not at a level requiring medication, but your GP should be aware, particularly in the context of your BMI, so they can monitor over time.\nDiscuss the iron picture: ferritin 35 with transferrin 2.25 (below range), slightly high red cell count and slightly low MCV. Ask your GP whether a gentle iron supplement is appropriate while breastfeeding, and in what form and dose, as iron supplementation during breastfeeding should be guided by your healthcare team.\nMention the B12 of 385 and ask whether sublingual methylcobalamin supplementation is appropriate while breastfeeding, given the importance of maternal B12 for infant neurological development.\nAsk your GP or health visitor for guidance on calorie and protein targets while breastfeeding. A protein target of approximately 137 to 168 g per day (1.3 to 1.6 g per kg) is a reasonable starting point to discuss. Any calorie adjustment must protect milk supply and maternal recovery.\nRetest in four to six months with a focused panel: fasting insulin, glucose, HOMA-IR, hsCRP, full blood count, ferritin, transferrin, and B12. These markers will show whether the lifestyle changes and supplementation are working.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Her B12 at 385 is below the optimal threshold of 500, and as a breastfeeding mother, adequate B12 is important for infant neurological development. Sublingual delivery bypasses absorption issues and is safe during breastfeeding. Check with your GP or health visitor before starting.\nVitamin D3: continue via multivitamin or as a standalone cholecalciferol supplement at 2,000 IU daily, taken with a meal containing fat. Her level of 86 nmol/L is within the optimal range, and at a BMI of 35.1 fat tissue sequesters vitamin D, so ongoing supplementation is needed to maintain this level. Pair with vitamin K2 (MK-7) at 100 mcg daily to direct calcium into bone rather than soft tissue.\nOmega-3 fish oil: continue at a dose providing 2 to 3 g of combined EPA and DHA daily. This supports the anti-inflammatory response (relevant to her CRP of 2.6) and provides DHA for infant brain development through breast milk. Check with your GP or midwife before continuing at this dose while breastfeeding.\nMagnesium glycinate: 300 mg before bed. Her magnesium at 1.02 is within the optimal range, but glycinate before bed may support sleep quality, which at under six hours is the biggest lever in this report. Check with your GP or midwife before starting while breastfeeding.\nDO NOT begin iron supplementation without discussing with your GP first. Her ferritin is low-normal and the red cell picture suggests iron demand from breastfeeding, but the dose and form of iron during breastfeeding should be guided by her healthcare team.\nThe most important changes from this report are not supplements. They are more sleep, daily walking, protein at every meal, and a gradual increase in activity. These will do more for the HOMA-IR, the CRP, the energy levels, and the weight than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 67 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 66.8. Weakest systems: lipids & cardiovascular 39%, iron studies 42%, inflammation 46%. Biggest drags: Lipoprotein(a), hs-CRP, HOMA-IR, Transferrin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"24.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2988","lower_normal":"","upper_normal":"41","lower_optimal":"","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4390","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. Her PhenoAge of 24.5 against a calendar age of 36 means her biological age is eleven and a half years younger than her chronological age. This is an excellent result and reflects the underlying strength of her metabolic and immune health. The markers that could push PhenoAge upward, particularly CRP and lymphocyte percentage, are not far enough from ideal to offset the strong performance of the others.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP, and HbA1c. It has no age term and measures the risk being built rather than the ten-year chance of an event. Her score of 40 sits at the upper boundary of the acceptable range and is being driven almost entirely by two inputs: the inherited Lp(a) of 136.96 and the hsCRP of 2.6. The modifiable lipid markers (ApoB 0.79, LDL 2.05, HDL 1.6, triglycerides 0.48) are all excellent. Reducing the CRP through better sleep, increased activity, and gradual weight change would lower this score meaningfully, though the Lp(a) component will remain regardless.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1696","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found mainly inside liver cells. When liver cells are stressed or damaged, ALT leaks into the bloodstream, so a low level indicates the liver is under very little strain. Her ALT at 19 is well within the optimal ceiling of 25 for women and comfortably below the laboratory limit of 56. At a BMI of 35.1, a clean ALT is a genuinely positive finding, as excess weight commonly pushes this marker upward.","low_causes":"","high_causes":"Liver inflammation, fatty liver, alcohol, medications, viral hepatitis, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4063","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It rises when any of those tissues are under stress. Her AST at 20 is well within range and sits in the optimal band. Alongside a clean ALT, this confirms the liver is healthy.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver damage, muscle injury, heart damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4902","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to metabolic stress, alcohol, and medications. It is often the first liver marker to rise when the liver is under any burden. Her GGT at 20 is within the optimal ceiling of 25 for women and well below the laboratory limit of 38. In a non-drinker at BMI 35.1, a clean GGT is especially reassuring.","low_causes":"","high_causes":"Alcohol, fatty liver, metabolic syndrome, medications, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4429","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bile ducts, and bone. It rises when there is obstruction to bile flow or increased bone turnover. Her ALP at 69 is comfortably within range and within the optimal band, confirming healthy liver and bile duct function.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, pregnancy, icle Stimulating Hormone","group":"HORMONES","result":"4.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4307","lower_normal":"1.5","upper_normal":"10.2","lower_optimal":"2.5","upper_optimal":"9.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3716","upper_optimal_position":"0.6245","units":"mIU/ml","description":"FSH (Follicle Stimulating Hormone) drives the growth of ovarian follicles. Her FSH at 4.04 is within the follicular/luteal range and consistent with active reproductive function during breastfeeding. An FSH well below the post-menopausal range (23 to 116) confirms she is not approaching menopause.","low_causes":"Pituitary dysfunction, PCOS, contraceptives, breastfeeding","high_causes":"Menopause, premature ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"372","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5196","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5958","units":"uIU/ml","description":"Prolactin is a pituitary hormone that stimulates milk production. Her prolactin at 372 uIU/mL is within the non-pregnant reference range and entirely consistent with active breastfeeding. Prolactin physiologically suppresses ovulation and libido during breastfeeding, which contributes to the low sex drive she reports. This is a normal and expected hormonal pattern that will resolve when breastfeeding stops.","low_causes":"Dopamine agonists, pituitary damage","high_causes":"Breastfeeding, pregnancy, pituitary adenoma, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"156","within_normal":"TRUE","within_optimal":"FALSE","result_p ion":"0.5863","units":"pmol/l","description":"Free T4 (thyroxine) is the storage form of thyroid hormone. The thyroid produces it and the body converts it into the active form, T3, in tissues. Her free T4 at 14.1 is within the optimal band (14 to 20), sitting at the lower end. With a TSH of 1.04, this indicates the thyroid is producing adequate T4 without being pushed.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy, and body temperature. Her free T3 at 5.2 is within the optimal band of 4.5 to 6.5, confirming good conversion from T4 to the active form. This means her cells are receiving an adequate supply of active thyroid hormone.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, severe illness, low calorie diet","high_causes":"Hyperthyroidism, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies attack the thyroid peroxidase enzyme and are the hallmark of autoimmune thyroid disease (Hashimoto's thyroiditis). Her TPO antibodies are below 6.6, well within the negative range of less than 13.8, making autoimmune thyroid disease very unlikely.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. They are another marker of autoimmune thyroid disease. Her thyroglobulin antibodies are below 1.3, well below the 4.4 threshold, confirming negative autoimmune thyroid status.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (monitoring)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.369","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Her ratio of 0.369 is within the optimal band of 0.27 to 0.40, confirming good peripheral conversion. This is an important check because some people have adequate T4 but poor conversion to T3.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{" n issues.","low_causes":"Poor dietary intake (vegan/vegetarian), malabsorption, pernicious anaemia, metformin","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7381","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA synthesis, and red blood cell production. Her folate at 20 ng/mL is above the upper limit of 17. This is almost certainly driven by her multivitamin supplement, which typically contains folic acid or methylfolate. A folate above range from supplementation is not harmful and does not require any action. It is a positive finding, particularly in a breastfeeding mother where adequate folate supports both maternal and infant health.","low_causes":"Poor diet, alcohol, malabsorption, coeliac disease, medications","high_causes":"Supplementation (folic acid/methylfolate), excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4053","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3351","upper_optimal_position":"0.5573","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate levels. When calcium drops, PTH rises to release calcium from bone and increase absorption from the gut. Her PTH at 1.79 is within the optimal band, and alongside normal calcium and adequate vitamin D, confirms healthy calcium regulation. In a breastfeeding mother, normal PTH is reassuring because breastfeeding draws on bone calcium.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, low calcium, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"VITAMINS & NUTRIENTS","result":"108","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4914","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles that rises when muscles are damaged or under strain. Her CK at 108 is within the optimal band. With no exercise, this simply confirms there is no muscle damage or inflammation.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7660","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, reflecting the combined effect of dietary antioxidants, supplements, and the body's own antioxidant systems. Her TAA at 1.91 is above the upper limit of 1.77. This is almost certainly a positive effect of her multivitamin and omega-3 supplementation boosting her antioxidant defences. An above-range TAA from supplementation is not harmful.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA125","group":"TUMOR MARKERS","result":"14.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2057","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA125 is a protein that can be elevated in ovarian cancer but also rises with menstruation, endometriosis, pregnancy, and pelvic inflammation. Her CA125 at 14.4 is well within the normal range of less than 35. This is a reassuring result.","low_causes":"","high_causes":"Ovarian cancer, endometriosis, menstruation, pelvic inflammation, pregnancy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ca153","name":"CA15-3","group":"TUMOR MARKERS","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0667","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA15-3 is a tumour marker primarily associated with breast cancer monitoring. Her CA15-3 at 4 is well below the threshold of 30. This is a reassuring result.","low_causes":"","high_causes":"Breast cancer, liver disease, ovarian cancer","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ca199","name":"CA19-9","group":"TUMOR MARKERS","result":"< 1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_po   .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
