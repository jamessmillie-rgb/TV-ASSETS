<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Josephine Adeoye","dob":"03/12/1959","report_date":"2026-10-15","summary":"Customer is a 66-year-old female presenting with a BMI of 29.7, following a low-carb, high-protein diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She does no structured cardio or resistance training and takes 2,000 to 5,000 steps a day. She sleeps under 6 hours a night, is slow to get going on waking, feels wired at night, and her energy pattern reflects that wired-but-tired cycle. Stress feels hard to manage most days. She drinks no alcohol. She supplements with protein powder. She has a family history of heart attack or stroke before 60, thyroid disease, dementia, and bowel, breast, prostate or ovarian cancer. A previous blood test flagged something. She is postmenopausal and has a diagnosis of hypertension. Her surgical and medical history is significant: she had an endoscopic mucosal resection for high-grade dysplasia in the lesser curve of the stomach in 2025, with post-procedure complications including oesophago-gastric junction outflow obstruction, an 18mm scapulothoracic fluid collection, a torn rotator cuff, oedema at T4 to T5 and in the lumbar spine, bursitis in her hips and knees, and a previous history of meningitis. She reports bloating and digestive discomfort, low libido, poor sleep and insomnia, hair thinning and hair loss, excessive sweating even in cold months, tingling and sharp electric shocks in her legs, pain throughout her body, and a general feeling of not being in optimum health. These symptoms have persisted for over a year. Her goals are to prevent disease, improve long-term health and longevity, and reduce stress and anxiety.\n\nThe first finding that should go to her GP is a mildly elevated CEA at 4.53 ng/ml, above the 2.3 upper limit for a non-smoker. CEA, or carcinoembryonic antigen, is a protein that can be produced by cells in the gut, pancreas, breast and other tissues. A raised level does not mean cancer is present; it can be elevated by benign conditions including inflammation, polyps, diverticular disease and previous gastric procedures. However, given her history of high-grade dysplasia in the stomach and her family history of bowel, breast, prostate or ovarian cancer, this result should be discussed with her GP and tracked. The GP may wish to repeat the test in six to eight weeks to see whether it is stable, rising or falling, and to consider whether any further imaging or endoscopic surveillance is warranted in the context of her 2025 EMR.\n\nThe second finding for her GP is her haemoglobin at 113, below the female lower limit of 120, with a haematocrit of 0.332, also below the lower limit of 0.36. This means she is mildly anaemic. Her MCV at 86.6 is normal, so the red cells are the right size, which rules out iron deficiency and B12 or folate deficiency as the primary cause. Her iron studies support this: ferritin is 192, serum iron is 24.3, transferrin saturation is a healthy 39.8%, and iron binding capacity is 69, all within range. B12 at 784 and folate at 13 are both well within range. The anaemia, then, is normocytic, meaning the cells are the right size but there are slightly too few of them. In a 66-year-old postmenopausal woman with a history of gastric high-grade dysplasia and EMR, the most likely explanations are chronic disease or inflammation (her hs-CRP at 4.2 supports a degree of systemic inflammation), reduced absorption from the altered gastric anatomy, or early bone marrow underproduction. Her reticulocytes at 2.18% and absolute reticulocytes at 83.7 are within range, which means the bone marrow is responding appropriately but not aggressively, suggesting the stimulus to make new red cells is not overwhelming. Her neutrophils at 1.9, just below the lower limit of 2.0, fit this picture: in people of Black African or Caribbean ancestry, a neutrophil count between 1.0 and 2.0 is a well-recognised normal variant called benign ethnic neutropenia. It does not indicate immune compromise, does not increase infection risk, and does not need treatment. Her lymphocytes at 3.16, marginally above the upper limit of 3.0, are likely a compensatory shift and are not a concern at this margin. Her platelets at 182 are healthy, and her MPV at 13.3, above the upper limit of 10.1, suggests the platelets are larger than average. A high MPV can reflect the bone marrow releasing younger, larger platelets, or it can be a storage artefact; at this level, in the absence of any platelet disorder, it is noted but not acted upon.\n\nThe third finding for her GP is the hormone picture. Her testosterone is 0.2, below the female lower limit of 0.5. Her free testosterone is 0.002, below the lower limit of 0.01. Her DHEA-S is 0.1 umol/L (equivalent to roughly 37 ug/dL), below the lower limit of 0.26 umol/L. Her free androgen index is 0.33, below the lower limit of 0.5. Together, these show that her androgen levels are profoundly low, even for a postmenopausal woman. DHEA-S, or dehydroepiandrosterone sulphate, is produced mainly by the adrenal glands and is the reservoir from which the body makes both testosterone and oestradiol. At 66 it is expected to be lower than at 30, but 0.1 umol/L is at the very bottom of the range and leaves the body with almost no raw material for testosterone production. This pattern connects directly to several of her symptoms: low libido, hair thinning, fatigue, poor sleep, and difficulty building or maintaining muscle. It may also contribute to the joint pain and stiffness she describes, because testosterone plays a role in maintaining cartilage and connective tissue health. Her oestradiol at 139 pmol/L is above the postmenopausal upper limit of 118.2, which is mildly elevated and could reflect adrenal conversion, adipose tissue aromatisation at her BMI, or a residual ovarian contribution. Her FSH at 49.9 confirms she is firmly postmenopausal. Her LH at 16.85 is within the postmenopausal range. Her progesterone is below 0.21, which is expected and normal after menopause. Her SHBG at 60 is within range and is not excessively high, so the low free testosterone is driven by the very low total testosterone rather than by SHBG binding it all up. Her prolactin at 98 is within the postmenopausal range and is not contributing. This hormone picture should be discussed with her GP, and she may benefit from a referral to a menopause or endocrine specialist to discuss whether testosterone replacement or DHEA supplementation is appropriate.\n\nHer cortisol at 240 nmol/L is within the morning reference range, which is reassuring given her high stress levels and wired-at-night pattern. Cortisol is the body's main stress hormone, and a morning reading within range means the adrenal glands are producing an appropriate amount during the day. However, the wired-at-night, slow-to-get-going-in-the-morning pattern she describes is consistent with a shifted cortisol rhythm, where cortisol does not fall as steeply in the evening as it should. A single morning cortisol cannot confirm this, but the pattern is worth noting because it would explain both the insomnia and the morning sluggishness.\n\nTurning to the positives, and there are genuine ones worth understanding. Her blood sugar control is excellent. Fasting glucose at 4.6 and HbA1c at 30 mmol/mol (4.9%) are both comfortably within the ideal range, and her HOMA-IR at 0.47 confirms she is highly insulin-sensitive. HOMA-IR is a calculation that estimates how hard the pancreas has to work to keep blood sugar stable; below 1.0 is considered optimal, and 0.47 is exceptionally good. Her insulin at 2.31 and C-peptide at 0.82 ug/L (approximately 271 pmol/L) are both below their laboratory ranges, but in the context of a perfect fasting glucose, a perfect HbA1c, and a HOMA-IR of 0.47, this is a reflection of low insulin demand rather than pancreatic failure. Her low-carb diet means the pancreas simply does not need to produce much insulin, and it is doing its job with minimal effort. Given her family history of type 2 diabetes, this is a genuinely reassuring finding.\n\nHer thyroid is working well. TSH at 2.06 is within the optimal range of 1.0 to 2.5, free T4 at 17.2 is within the ideal band, and free T3 at 4.4 is within range. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. Given her family history of thyroid disease, the negative antibodies are useful information worth recording permanently.\n\nHer kidney function is adequate for her age. The creatinine-based eGFR is 70, and the cystatin C-based eGFR is 76, giving a combined eGFR of 76. Cystatin C is a more reliable marker of kidney filtration than creatinine because it is not affected by muscle mass, age or diet in the same way. An eGFR of 76 at 66 is mildly reduced but within the expected range for her age and is classified as CKD stage 2, which is common and does not in itself indicate kidney disease. Her urea at 8.6 is marginally above the upper limit of 8.2, and the urea-to-creatinine ratio at 113.2 is above the upper limit of 100, which together suggest mild dehydration or a higher protein intake rather than kidney impairment. On a high-protein diet, more urea is produced as a byproduct of protein metabolism, and with under 6 hours of sleep and a low fluid intake, mild concentration of the blood is expected. Her uric acid at 220 is within range, and her cystatin C at 1.0 is within range.\n\nHer liver markers are mostly reassuring. ALT at 13 is well within range and suggests no hepatocyte damage. AST at 26 is within range. Bilirubin at 13 is healthy. ALP at 89 is within range. Her FIB-4 score at 2.62 is flagged above the standard threshold of 1.45, but at 66, the age-adjusted threshold is 2.0, and FIB-4 is heavily influenced by age (it is part of the formula) and by lower platelet counts and lower ALT values, both of which she has. With a clean ALT, clean AST, clean bilirubin, clean albumin, and an APRI of 0.357 (well within the ideal range below 0.5), the FIB-4 score is being driven by the calculation rather than by any sign of liver disease. Her NAFLD fibrosis score at 0.271 is within range and below the upper threshold of 0.676, further supporting the absence of liver fibrosis. Her De Ritis ratio (AST divided by ALT) at 2.0 is above the upper limit of 1.6, but this is because her ALT is very low at 13 rather than because her AST is high; this ratio is only clinically meaningful when both enzymes are elevated, which they are not. Her GGT at 42 is mildly above the female upper limit of 38. GGT, or gamma-glutamyl transferase, is an enzyme that can be raised by medication (particularly antihypertensives), metabolic strain, or bile duct irritation. Given that she drinks no alcohol, the most likely explanation is her antihypertensive medication or the mild systemic inflammation reflected in her CRP. It is not a concern at this margin but is worth tracking on retest.\n\nHer amylase at 120 is marginally above the upper limit of 118. Amylase is an enzyme produced mainly by the pancreas and salivary glands, and levels fluctuate throughout the day. At one point above the limit, this is within normal variation and is not suggestive of pancreatic inflammation. Her lipase at 55 is within range at 13 to 60, which further confirms the pancreas is healthy. This is relevant context for her bloating symptoms: the pancreas is producing enzymes normally, so her digestive discomfort is unlikely to be pancreatic in origin.\n\nHer lipid profile tells an important and nuanced story, particularly given her family history of heart attack or stroke before 60. Her total cholesterol at 5.4 is mildly above the desirable threshold of 5.18, but total cholesterol on its own is a crude measure. Her HDL at 2.4 is excellent, well above the desirable threshold of 1.55, and her HDL percentage at 44.4% is outstanding. Her triglycerides at 0.55 are very low, which is a direct reflection of her low-carb diet and her insulin sensitivity. Her VLDL at 0.25 is low. Her LDL at 2.77 is within the laboratory range of 0.5 to 3.0 but above the optimal target of 2.6. Her ApoB at 0.98 is above the desirable threshold of 0.9. ApoB, or apolipoprotein B, is a protein carried by every LDL particle, and it is a more accurate measure of cardiovascular risk than LDL cholesterol alone because it counts the actual number of particles entering the artery wall. Her ApoB-to-ApoA1 ratio at 0.50 is within the lower-risk range below 0.6, her atherogenic index of plasma at negative 0.64 is excellent, and her Castelli II ratio at 1.15 is excellent. So the overall lipid picture is mixed: the protective markers (HDL, triglycerides, ratios) are exceptional, but ApoB is above the target, and Lp(a) changes the calculation significantly.\n\nHer Lp(a) at 118.65 nmol/L is above the ideal threshold of 32, placing her in the moderate-risk category (90 to 200 nmol/L). Lp(a), or lipoprotein little-a, is a genetically inherited lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls like LDL, it promotes blood clot formation by interfering with the clotting cascade, and it drives inflammation in the vessel wall. Lp(a) cannot be lowered by diet, exercise or any currently available supplement. It is fixed by genetics, it does not change over a lifetime, and it should be recorded permanently in her medical notes. Her Lp(a)-corrected LDL, which subtracts the cholesterol carried by Lp(a) particles to show the modifiable portion, is 2.39, which is within the laboratory range but above the optimal target of 2.0. This means that even after accounting for the Lp(a) contribution, there is still modifiable LDL cholesterol that can be reduced through diet and, if needed, medication. Given her family history of premature cardiovascular disease and her elevated Lp(a), her GP should be aware of this result. Current guidelines suggest that when Lp(a) is elevated, all other modifiable cardiovascular risk factors should be managed more aggressively: LDL and ApoB targets become lower, blood pressure control becomes more important, and any additional risk factors (smoking, inactivity, visceral fat) carry more weight. Her cardiovascular risk score, a TrueVitals index from 0 to 100 that measures the risk being built rather than a ten-year event probability, is 60, driven primarily by the Lp(a) and ApoB. This is above the ideal threshold of 20 and above the acceptable threshold of 40. The Lp(a) cannot be changed, but the ApoB can, and bringing it below 0.8 would meaningfully reduce the score.\n\nHer hs-CRP at 4.2 is within the laboratory range of less than 5 but above the optimal threshold of 1.0. hs-CRP, or high-sensitivity C-reactive protein, is a marker of systemic inflammation. At 4.2, this suggests a meaningful level of background inflammation. Given her history of bursitis in the hips and knees, oedema in the thoracic and lumbar spine, the torn rotator cuff, and the post-EMR complications, the most likely source is musculoskeletal and post-surgical inflammation rather than cardiovascular inflammation. However, in the context of her elevated Lp(a), even inflammation from non-cardiac sources contributes to cardiovascular risk because CRP itself promotes plaque instability. Reducing inflammation through better sleep, stress management, gentle movement and, if needed, medical review of her musculoskeletal pain would serve both her comfort and her cardiovascular risk profile.\n\nHer immune markers show one finding worth noting. Her IgM is below 0.2, which is below the lower limit of 0.5. IgM is the first antibody the immune system produces when it encounters a new infection, and low IgM can be seen as an isolated finding in older adults, as part of a broader immune deficiency, or secondary to chronic illness or medication. Her IgG at 14.7 and IgA at 3.2 are both within range, and her IgE at 88 is within range, so the other immunoglobulin classes are intact. Her rheumatoid factor is below 4, which is negative and helps rule out rheumatoid arthritis as the cause of her joint pain. The low IgM should be mentioned to her GP, who may wish to monitor it over time and check whether she has had any unusual or recurrent infections.\n\nHer tissue transglutaminase IgA, the coeliac screening test, was returned as sample unsuitable, so coeliac disease has not been screened on this panel. Given her bloating and digestive symptoms, this should be repeated on a future sample.\n\nHer calcium at 2.61 and corrected calcium at 2.56 are both within range, and her PTH at 2.5 is healthy, confirming normal calcium-parathyroid axis function. Her magnesium at 1.13 is marginally above the upper limit of 1.11. Mild magnesium elevation is rarely clinically significant and can reflect supplementation (some protein powders contain magnesium), mild dehydration, or simply the upper end of her personal normal. It does not need treatment. Her vitamin D at 71 nmol/L is sufficient (above 50) but below the optimal range of 75 to 120. At her BMI and with her family history and inflammatory burden, optimising vitamin D to above 75, ideally above 100, would be beneficial. Her B12 at 784 is excellent. Her folate at 13 is healthy.\n\nHer total antioxidant activity at 1.84 is above the upper limit of 1.77. This is a measure of the body's overall capacity to neutralise free radicals, and a mildly elevated level is typically driven by supplementation (her protein powder may contain antioxidant compounds) or by a diet rich in polyphenols. It is not a concern.\n\nHer tumour markers, apart from the CEA discussed above, are reassuring. CA125 at 5 is well within range, CA15-3 at 21.19 is within range, and CA19-9 is below 1.2, also well within range. Given her family history of cancer and her personal history of gastric high-grade dysplasia, these clean tumour markers are genuinely useful information.\n\nHer creatine kinase at 119 is within range at 25 to 200, suggesting no significant muscle damage or inflammation beyond what would be expected with her musculoskeletal conditions.\n\nHer urinalysis is clean. pH at 5 is acidic, which is typical on a low-carb diet. Protein, ketones, glucose, urobilinogen, casts, white cells, red cells and nitrites are all negative. The Bacterial Count result has now arrived: < 1.\n\nHer PhenoAge is 47.4 years against a calendar age of 66, a difference of nearly 19 years younger. This is a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. Despite her symptoms and her medical history, her blood is ageing remarkably slowly, driven primarily by her excellent glucose control, healthy albumin, and low ESR. Her serum osmolality at 303.2 is above the upper limit of 295, which, alongside the mildly elevated urea and sodium at the top of range at 145, further supports mild dehydration as a theme running through these results.\n\nHer globulin at 40 is above the upper limit of 36, making her total protein at 84 slightly above range at 82. Globulins include immunoglobulins, and her IgG at 14.7 is toward the upper end of its range, which likely accounts for the elevation. This is not a concern in isolation but fits with the picture of an immune system that is active, possibly in response to chronic inflammation. Her albumin-to-globulin ratio, calculated at 1.1, sits at the lower boundary of the normal range of 1.1 to 2.5, which is consistent with the globulin being mildly elevated rather than albumin being low.\n\nTo summarise the findings that need action: the CEA at 4.53 should go to her GP given her gastric and family history. Her mild anaemia should be investigated with a reticulocyte production index and possibly a blood film. Her profoundly low androgens (testosterone, free testosterone, DHEA-S) should be discussed with a menopause or endocrine specialist. Her elevated Lp(a) is a permanent finding that her GP should record and factor into cardiovascular risk management alongside her ApoB of 0.98. Her low IgM should be noted by her GP. And her coeliac screen should be repeated. Beyond these, the strongest levers she has are sleep, movement, stress and hydration, none of which require a prescription.\n\nLate-arriving results: Bacterial Count: < 1; Urine Culture and Sensitivities: No growth.","links":"The threads that connect these findings run through three main stories and two loose ends.\n\nThe first story is inflammation and its downstream effects. Her hs-CRP at 4.2 is the clearest marker, and the source is almost certainly her musculoskeletal burden: bursitis in the hips and knees, oedema in the thoracic and lumbar spine, a torn rotator cuff, and the post-EMR complications. Chronic inflammation drives the mild anaemia by suppressing red cell production through a mechanism called anaemia of chronic disease, where inflammatory cytokines reduce the bone marrow's responsiveness to erythropoietin. It also drives the elevated globulin, because the liver produces more acute-phase proteins and immunoglobulins in response to ongoing inflammation. And it adds cardiovascular risk on top of her already elevated Lp(a), because CRP itself promotes instability in arterial plaques. The GGT at 42, mildly above the female limit, may also reflect this systemic inflammatory load rather than any primary liver problem, particularly since every other liver marker is clean.\n\nThe second story is hormonal depletion. Her DHEA-S at 0.1 umol/L is at the floor. DHEA-S is the adrenal precursor from which the body manufactures testosterone and, to a lesser extent, oestradiol. With the raw material this low, testosterone at 0.2, free testosterone at 0.002, and the free androgen index at 0.33 all follow logically. This is not simply postmenopausal decline; many postmenopausal women maintain testosterone levels of 0.8 to 1.5 nmol/L. The degree of depletion here suggests either adrenal fatigue from prolonged stress and pain (she reports stress most days and pain throughout her body), age-related adrenal involution that has progressed further than average, or both. The consequences map directly onto her symptoms: low libido, hair thinning, fatigue, poor sleep quality, difficulty recovering from physical stress, and the general sense of not feeling well. Her oestradiol at 139, mildly above the postmenopausal range, could reflect peripheral conversion in adipose tissue at her BMI, which would be the body's attempt to maintain some oestrogen in the absence of ovarian production.\n\nThe third story is cardiovascular risk layering. Her Lp(a) at 118.65 is inherited and permanent, adding a baseline risk that cannot be modified. On top of that, her ApoB at 0.98 shows that the number of atherogenic particles in her blood is above the desirable threshold. Her CRP at 4.2 adds inflammatory risk. Her hypertension adds haemodynamic risk. And her family history of premature cardiovascular disease adds genetic susceptibility beyond the Lp(a). Against all of this, she has powerful protective factors: her HDL at 2.4 is outstanding, her triglycerides at 0.55 are excellent, her insulin sensitivity is exceptional, and she does not smoke or drink. The strategy is therefore to reduce every modifiable component as far as possible: bring ApoB below 0.8, reduce CRP through better sleep and pain management, optimise blood pressure, and begin gentle cardiovascular exercise.\n\nThe first loose end is the CEA at 4.53. It may be entirely benign, related to her previous gastric procedure and the chronic inflammation. But given her history of high-grade dysplasia and her family history, it cannot be dismissed without follow-up. A repeat in six to eight weeks will show whether it is stable or trending, and the GP can decide whether further investigation is needed.\n\nThe second loose end is the low IgM below 0.2. Her other immunoglobulins are intact, rheumatoid factor is negative, and she does not report recurrent infections, so this is most likely an isolated finding. However, it should be documented and tracked, because selective IgM deficiency, while usually benign, can occasionally predispose to encapsulated bacterial infections.","lifestyle":"Drink at least 2 litres of water a day, spread across the day, with a large glass first thing in the morning before anything else. Anchor: fill the glass the night before and leave it by the bed. Why: her sodium at the top of range, urea above range, and serum osmolality at 303 all point to chronic mild dehydration, which concentrates inflammatory markers and strains the kidneys.\nAdd one extra portion of vegetables to lunch and one to dinner, aiming for 4 to 5 portions a day within the next month. Start with spinach, broccoli, peppers or tomatoes added to whatever she is already eating. Anchor: when preparing any meal, the vegetables go on the plate first. Why: her current 2 to 3 portions are not enough to provide the fibre, potassium and polyphenols her cardiovascular system needs given her Lp(a) and ApoB, and more fibre will help the bloating by supporting gut motility.\nEat 90 to 110g of protein a day, spread across at least three meals. Her protein powder counts toward this. Add eggs, fish, chicken, Greek yoghurt, beans or lentils to every meal. Anchor: every plate has a palm-sized protein source before anything else is added. Why: protein protects lean mass, which she is at risk of losing with no resistance training at 66, and it supports the immune system given her low IgM and mild anaemia.\nWalk for 15 minutes after her largest meal, building to 30 minutes over four weeks. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers inflammation (CRP 4.2), supports blood pressure, and begins to rebuild cardiovascular fitness, which is her strongest lever against her Lp(a) risk. Walking is gentle enough for her hips, knees and shoulders.\nBegin two 20-minute resistance sessions per week using bodyweight or light resistance bands at home, starting with seated or supported exercises that do not load her painful joints. Anchor: fixed days (e.g. Tuesday and Saturday mornings). Why: resistance training preserves bone density, builds lean mass to support her low testosterone, and improves insulin sensitivity, which is already good but supports long-term metabolic health.\nSet a fixed wake time seven days a week and get outside or to a bright window within 30 minutes of waking. Anchor: alarm at the same time every day, then shoes on or window open. Why: this resets the cortisol rhythm that is currently shifted (wired at night, slow in the morning), and a consistent wake time is the single most effective intervention for insomnia.\nCut caffeine entirely after 12 noon and consider reducing total caffeine to one cup in the morning. Anchor: after midday, switch to herbal tea or water. Why: caffeine has a half-life of 5 to 7 hours, so afternoon caffeine is still active at bedtime and contributes to the wired-at-night pattern and the under-6-hours sleep.\nSpend 10 minutes before bed doing a calming activity with no screens: breathing exercises, gentle stretching, or reading a physical book. Anchor: set a phone alarm for 30 minutes before her intended sleep time; phone goes to another room. Why: this begins to lower evening cortisol and creates a wind-down signal that her body will learn to associate with sleep.","flags":"CEA at 4.53 ng/ml, above the non-smoker upper limit of 2.3. In the context of EMR for gastric high-grade dysplasia in 2025 and family history of bowel, breast, prostate or ovarian cancer, this requires GP review, repeat testing in 6 to 8 weeks, and consideration of whether further surveillance is indicated.\nHaemoglobin 113 g/L (lower limit 120), haematocrit 0.332 (lower limit 0.36): mild normocytic anaemia. Iron studies, B12 and folate are all normal, so this is most likely anaemia of chronic disease driven by her systemic inflammation (CRP 4.2) and/or reduced absorption post-EMR. GP should consider reticulocyte production index and blood film.\nTestosterone 0.2 nmol/L (lower limit 0.5), free testosterone 0.002 nmol/L (lower limit 0.01), DHEA-S 0.1 umol/L (lower limit 0.26), free androgen index 0.33 (lower limit 0.5): profoundly low androgens for a postmenopausal woman, likely driven by adrenal insufficiency of DHEA-S production. Connected to low libido, hair thinning, fatigue and poor sleep. Referral to menopause or endocrine specialist for consideration of testosterone or DHEA replacement.\nLp(a) 118.65 nmol/L (ideal below 32), moderate risk category. Genetically inherited, unchangeable, should be recorded permanently. Combined with ApoB 0.98 (above desirable 0.9), family history of premature cardiovascular disease, hypertension, and CRP 4.2, the overall cardiovascular risk is significantly elevated. Cardiovascular risk score 60 out of 100.\nApoB 0.98 g/L, above the desirable threshold of 0.9. The modifiable component of her cardiovascular risk. Target below 0.8 given her Lp(a) and family history.\nIgM below 0.2 g/L, below the lower limit of 0.5, with IgG and IgA within range. Most likely isolated selective IgM reduction. GP should document and monitor; check for history of recurrent or unusual infections.\nOestradiol 139 pmol/L, above the postmenopausal upper limit of 118.2. Likely reflects peripheral aromatisation in adipose tissue. Not urgent but should be noted in the context of her hormonal review.\nhs-CRP 4.2 mg/L, within the laboratory range of less than 5 but above the optimal threshold of 1.0. Source is most likely musculoskeletal inflammation (bursitis, rotator cuff tear, spinal oedema) rather than cardiovascular, but contributes to cardiovascular risk in the context of elevated Lp(a).\nGlobulin 40 g/L (upper limit 36), total protein 84 g/L (upper limit 82). Driven by immunoglobulin production, consistent with chronic inflammatory state. Not a primary concern but worth tracking.\nGGT 42 IU/L (female upper limit 38). All other liver markers clean. Most likely medication-related or inflammation-driven. Monitor on retest.\nUrea 8.6 mmol/L (upper limit 8.2), urea-to-creatinine ratio 113.2 (upper limit 100), serum osmolality 303.2 (upper limit 295): consistent pattern of mild chronic dehydration, compounded by high-protein diet. Increase fluid intake.\nNeutrophils 1.9 x10^9/L (lower limit 2.0): in a patient of Black African or Caribbean ancestry, this is consistent with benign ethnic neutropenia and does not indicate immune compromise.\nTissue transglutaminase IgA: sample unsuitable. Coeliac screening was not completed. Should be repeated given bloating symptoms.\nAmylase 120 IU/L (upper limit 118): one point above range, lipase 55 within range. No pancreatic concern.\nMPV 13.3 fL (upper limit 10.1): large platelets, likely a storage or bone marrow variant. Platelet count normal. No action needed.\nInsulin 2.31 mIU/L (below lower limit 2.6), C-peptide 0.82 ug/L (below lower limit 1.1), HOMA-IR 0.47 (below lower limit 0.5): all reflect low insulin demand on a low-carb diet with excellent glucose control. Not pathological.\nReassuring negatives: fasting glucose 4.6 and HbA1c 30 rule out diabetes and prediabetes; TSH 2.06 with negative antibodies rules out thyroid disease; CA125, CA15-3 and CA19-9 are all well within range; rheumatoid factor negative; urinalysis clean; ferritin 192 with transferrin saturation 39.8% rules out iron deficiency and iron overload; B12 784 and folate 13 are both healthy; kidney function is age-appropriate with cystatin C eGFR 76; liver fibrosis scores (APRI 0.357, NAFLD fibrosis score 0.271) rule out significant scarring.","recommendations":"Discuss the CEA result of 4.53 with her GP, given her history of gastric high-grade dysplasia and family history of cancer. Request a repeat CEA in 6 to 8 weeks and ask whether further endoscopic or imaging surveillance is warranted.\nDiscuss the mild normocytic anaemia (haemoglobin 113, haematocrit 0.332) with her GP. A reticulocyte production index and blood film may help clarify the cause; the most likely explanation is anaemia of chronic disease driven by her CRP of 4.2 and/or post-EMR malabsorption.\nRequest a referral to a menopause or endocrine specialist to discuss the profoundly low androgens: testosterone 0.2, free testosterone 0.002, DHEA-S 0.1. Testosterone replacement or DHEA supplementation may help her libido, hair thinning, energy and sleep.\nRequest that her GP permanently record her Lp(a) of 118.65 nmol/L. Given this, her ApoB of 0.98, her family history of premature cardiovascular disease, and her hypertension, ask whether a statin or other lipid-lowering therapy is appropriate to bring ApoB below 0.8. First-degree relatives should also be offered Lp(a) testing.\nMention the IgM below 0.2 to her GP and ask whether any monitoring is needed, particularly if she has experienced recurrent or unusual infections.\nRepeat the tissue transglutaminase IgA test on a fresh sample to complete the coeliac screen, given her bloating and digestive symptoms.\nAsk her GP to review her blood pressure medication and whether the GGT of 42 could be medication-related; no action needed unless it rises further.\nCalorie target: approximately 1,500 to 1,650 kcal per day for gradual weight loss toward a target weight of 68 to 72 kg (BMI 25.9 to 27.4). Protein target: 100 to 115g per day (1.3 to 1.5g per kg of target body weight) to preserve lean mass. Retest in 4 to 6 months, repeating: full blood count, iron studies, CEA, hs-CRP, lipid panel with ApoB, IgM, testosterone, DHEA-S, free testosterone, tTG-IgA, kidney function including cystatin C, and liver function including GGT.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with her largest meal that contains fat. Her level at 71 nmol/L is sufficient but below the optimal band of 75 to 120, and at her BMI fat sequesters vitamin D, so a higher dose is needed to reach and maintain 100 nmol/L. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D3. K2 directs calcium into bones and teeth and away from artery walls, which matters given her cardiovascular risk profile and her family history.\nOmega-3 fish oil: 2 to 3g of combined EPA and DHA daily, taken with food. This may help reduce her CRP of 4.2, support cardiovascular health given her ApoB of 0.98 and Lp(a) of 118.65, and has modest evidence for joint inflammation, which is relevant to her bursitis and pain.\nMagnesium glycinate: 300 to 400mg elemental magnesium, taken before bed. Although her serum magnesium is at the top of range, serum magnesium reflects only 1% of total body stores. Glycinate form supports sleep quality, which is her most urgent lifestyle issue at under 6 hours, and may help with the muscle pain, cramps and wired-at-night pattern. If her serum magnesium rises above 1.2 on retest, reduce to 200mg.\nDO NOT take iron supplements. Her ferritin is 192 with a transferrin saturation of 39.8%, which means her iron stores are adequate. Additional iron would risk overload and increase oxidative stress and inflammation.\nThe most important changes from this report are not supplements. They are sleeping more than 6 hours by fixing her wake time and evening routine, drinking enough water to resolve the chronic mild dehydration running through these results, walking daily to begin rebuilding cardiovascular fitness against her Lp(a) risk, and seeing her GP to discuss the CEA, the anaemia, and the profoundly low androgens.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 48 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 47.6. Weakest systems: inflammation 12%, tumor markers 13%, hematology 30%. Biggest drags: hs-CRP, Lipoprotein(a), Haemoglobin, Oestradiol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"47.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3338","lower_normal":"","upper_normal":"71","lower_optimal":"","upper_optimal":"66","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4648","units":"years","description":"PhenoAge is a biological ageing estimate calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. Her PhenoAge of 47.4 years against a calendar age of 66 means her blood is ageing nearly 19 years younger than her chronological age. This is an exceptional result, driven primarily by her excellent glucose control (glucose 4.6, HbA1c 30), healthy albumin (44), very low ESR and RDW, and adequate kidney function. Despite her symptoms and medical history, her fundamental biology is remarkably resilient. Improving sleep, reducing inflammation and increasing activity should maintain or further improve this.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 that measures the cardiovascular risk being built, based on ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term, so it measures accumulating risk rather than short-term event probability. Her score of 60 is above the ideal threshold of 20 and above the acceptable threshold of 40, driven primarily by her Lp(a) at 118.65 and ApoB at 0.98. The Lp(a) cannot be changed, but reducing her ApoB below 0.8, lowering CRP through lifestyle and pain management, and maintaining her excellent glucose control and HDL are the levers that will bring this score down.","low_causes":"Low LDL, low ApoB, high HDL, low Lp(a), low CRP, healthy glucose control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. Her result of 4.6 mmol/L is comfortably within the ideal range of 4.0 to 5.4 and well below the pre-diabetes threshold. This is excellent glucose control, particularly given her family history of type 2 diabetes, and shows that her low-carb diet is keeping blood sugar tightly regulated.","low_causes":"Fasting, excessive exercise, insulin overproduction, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, high-carbohydrate diet, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c reflects the average blood sugar over the past two to three months by measuring the percentage of haemoglobin that has glucose attached to it. Her result of 4.9% is well within the normal range (below 6.0%) and below the pre-diabetes threshold of 6.0 to 6.4%. This confirms excellent long-term blood sugar control.","low_causes":"Low blood sugar, anaemia, blood loss","high_causes":"Diabetes, pre-diabetes, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Her result of 30 mmol/mol is well within the ideal range of below 36 and comfortably below the pre-diabetes threshold of 42. Combined with her fasting glucose of 4.6, this confirms her blood sugar regulation is working very well.","low_causes":"Anaemia, blood loss, low average blood sugar","high_causes":"Diabetes, pre-diabetes, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3201","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5750","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas produces to keep blood sugar stable overnight. Her result of 2.31 mIU/L is just below the laboratory lower limit of 2.6 but falls within the optimal band of 2 to 8 mIU/L. In the context of a perfect fasting glucose of 4.6 and HbA1c of 30, this low insulin reflects very low insulin demand rather than pancreatic failure. Her low-carb diet means the pancreas simply does not need to produce much insulin. This is a positive finding.","low_causes":"Low-carbohydrate diet, high insulin sensitivity, fasting, type 1 diabetes","high_causes":"Insulin resistance, high-carbohydrate diet, obesity, PCOS, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2612","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a reliable measure of how much insulin the body is making. Her result of 0.82 ug/L (approximately 271 pmol/L) is below the laboratory lower limit of 1.1. As with her insulin, this reflects the very low insulin demand of a low-carb diet in a highly insulin-sensitive person, not a failing pancreas. Her glucose and HbA1c confirm this interpretation.","low_causes":"Low-carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3714","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is calculated from HbA1c and represents the average blood sugar level over the past two to three months. Her result of 5.2 mmol/L is well within the ideal range, confirming excellent long-term blood sugar control.","low_causes":"Low average blood sugar, anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4324","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines triglycerides and fasting glucose to estimate insulin resistance. Her result of 7.61 is well within the ideal range of below 8.5, confirming excellent insulin sensitivity. This index does not require insulin measurement and independently validates her HOMA-IR finding.","low_causes":"Low triglycerides, low glucose, healthy metabolism","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"113","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Her result of 113 g/L is below the female lower limit of 120, confirming mild anaemia. Her MCV is normal at 86.6, meaning the red cells are the correct size, and her iron, B12 and folate are all healthy, so the most likely cause is anaemia of chronic disease driven by her systemic inflammation (CRP 4.2) and/or reduced absorption after her gastric procedure. This should be discussed with her GP.","low_causes":"Iron deficiency, chronic disease, B12 or folate deficiency, blood loss, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic lung disease, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"3.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Her result of 3.84 is at the lower boundary of the normal range of 3.8 to 4.8, consistent with her mildly low haemoglobin. The cells that are present are the right size and contain the right amount of haemoglobin, so the issue is one of quantity rather than quality.","low_causes":"Anaemia, chronic disease, blood loss, bone marrow suppression, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.332","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2653","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Her result of 0.332 is below the lower limit of 0.36, consistent with the mild anaemia seen in her haemoglobin and red blood cell count. This means a smaller proportion of her blood is carrying oxygen, which may contribute to her fatigue and low energy.","low_causes":"Anaemia, overhydration, blood loss, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"11.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333333333","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6250","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. A low RDW means the cells are all a uniform size, which is ideal. Her result of 11.6% is at the lower boundary of the range, indicating very consistent red cell size. This is a positive finding and helps rule out mixed nutritional deficiencies as a cause of her anaemia.","low_causes":"Normal variation","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency anaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"86.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"96","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"fL","description":"MCV measures the average size of red blood cells. Her result of 86.6 fL is within the ideal range, confirming that her red cells are a normal size. This rules out iron deficiency (which causes small cells) and B12 or folate deficiency (which causes large cells) as the primary cause of her anaemia.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"29.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. Her result of 29.3 pg is within the ideal range, confirming that each red cell is carrying a healthy amount of oxygen-transporting protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"339","within_normal":"TRUE","within_optimal":"TRUE","r 33333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Her result of 13.3 fL is above the upper limit of 10.1. Larger platelets are typically younger and more active, and a high MPV can reflect the bone marrow compensating for lower platelet numbers by releasing larger, more functional platelets. It can also be affected by sample storage time. At this level, with a normal platelet count and no bleeding symptoms, it is noted but does not require action.","low_causes":"Bone marrow suppression, inflammatory bowel disease, chemotherapy","high_causes":"Platelet consumption, bone marrow compensation, storage artefact, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"5.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4450","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"The total white blood cell count measures the overall number of immune cells circulating in the blood. Her result of 5.67 is within the ideal range of 4.5 to 8.5 and indicates a normally functioning immune system. The individual white cell types are discussed separately below.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, medications","high_causes":"Bacterial infections, inflammation, stress, steroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2967","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6.0"
