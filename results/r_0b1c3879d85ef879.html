e liver is in good health.","low_causes":"B6 deficiency","high_causes":"Liver disease, heart damage, muscle damage, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5526","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4951","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to bile duct irritation, medication effects and metabolic stress. Her result of 42 IU/L is mildly above the female upper limit of 38. She does not drink alcohol, so the most likely explanations are her antihypertensive medication, the mild systemic inflammation reflected in her CRP, or the metabolic load on the liver. All other liver markers are clean, so this is not concerning in isolation but should be tracked on retest.","low_causes":"Normal health","high_causes":"Alcohol, medications, bile duct disease, fatty liver, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"120","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6818","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3523","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands that breaks down starches. Her result of 120 IU/L is one point above the upper limit of 118. Amylase levels fluctuate throughout the day and can be mildly elevated by salivary gland activity, medication or minor inflammatory stimuli. At one point above the limit, with lipase at 55 (well within range), this does not suggest pancreatitis or pancreatic disease and is within normal variation.","low_causes":"Chronic pancreatitis, pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6262","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. It is a more specific marker for pancreatic health than amylase. Her result of 55 U/L is within range at 13 to 60, confirming the pancreas is functioning normally. This is reassuring context for her bloating symptoms: the digestive enzymes are being produced adequately.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Acute pancreatitis, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6427","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/L","description":"Calcium is essential for bone health, nerve function, muscle contraction and blood clotting. Her total calcium of 2.61 mmol/L is within the laboratory range but near the top. The corrected calcium of 2.56 adjusts for albumin and is also within range. Her PTH at 2.5 is normal, confirming the calcium-parathyroid axis is functioning correctly.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, dehydration, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6200","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of how much calcium is physiologically available. Her result of 2.56 mmol/L is within the ideal range, confirming healthy calcium balance. Her PTH at 2.5 is appropriately mid-range, meaning the body is regulating calcium effectively.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7126","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar regulation and blood pressure control. Her result of 1.13 mmol/L is marginally above the upper limit of 1.11. Mild magnesium elevation is rarely significant and can reflect mild dehydration concentrating the sample, supplementation (some protein powders contain magnesium), or simply her personal upper range. It does not need treatment. If she begins magnesium glycinate supplementation for sleep, her serum level should be monitored on retest.","low_causes":"Alcohol, diuretics, malabsorption, diabetes, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, dehydration, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2958","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation and cardiovascular health. Her result of 71 nmol/L is above the sufficiency threshold of 50 but below the optimal band of 75 to 120. At her BMI of 29.7, fat tissue sequesters vitamin D, meaning she needs a higher supplementation dose to achieve optimal levels. Given her family history, her CRP of 4.2, and her postmenopausal status (vitamin D supports bone density), optimising to above 100 nmol/L is worthwhile.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption, ageing","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4693","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3719","upper_optimal_position":"0.6044","units":"pmol/L","description":"PTH is a hormone produced by the parathyroid glands that regulates calcium and phosphorus levels. Her result of 2.5 pmol/L is within the ideal range, confirming normal parathyroid function. This is reassuring alongside her calcium levels and rules out hyperparathyroidism.","low_causes":"Hypoparathyroidism, high calcium, high vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"145","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium for the diluting effect of high blood glucose. With her glucose at a normal 4.6 mmol/L, the corrected sodium is unchanged at 145, confirming that her sodium reading is accurate and not artefactually altered by glucose levels.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"303.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8033","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality measures the concentration of dissolved particles in the blood. Her calculated osmolality of 303.2 mOsm/kg is above the upper limit of 295, indicating that her blood is more concentrated than ideal. This is the clearest single marker of the mild chronic dehydration that runs through her results: elevated sodium, elevated urea, elevated urea-to-creatinine ratio, and concentrated urine (specific gravity 1.03) all tell the same story. Increasing daily fluid intake to at least 2 litres should resolve this.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"784","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5837","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4559","upper_optimal_position":"0.6161","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation and DNA synthesis. Her result of 784 pg/mL is within the optimal range of 500 to 900. This is particularly reassuring given her history of gastric EMR, which can affect B12 absorption from the stomach. Her current level suggests absorption is intact, but it should be monitored on future tests because gastric procedures can cause a gradual decline over months to years.","low_causes":"Pernicious anaemia, malabsorption, vegan diet, gastric surgery, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is critical for DNA synthesis, cell division and red blood cell production. Her result of 13 ng/mL is within the optimal range of 8 to 17, indicating healthy folate intake from her diet.","low_causes":"Poor diet, malabsorption, alcohol, pregnancy, medications","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.42","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP is one of the most important markers of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Her result of 4.2 mg/L is within the laboratory range of less than 5 but well above the optimal threshold of less than 1.0. A level above 3.0 is associated with increased cardiovascular risk. Given her bursitis in the hips and knees, torn rotator cuff, spinal oedema and post-EMR complications, the most likely source is musculoskeletal inflammation. However, whatever the source, CRP at this level contributes to cardiovascular risk by promoting plaque instability, and reducing it through sleep, gentle movement, stress management and pain treatment would benefit both her comfort and her heart.","low_causes":"Normal health, statin use","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA125","group":"TUMOR MARKERS","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1042","lower_normal":"0","upper_normal":"24","lower_optimal":"0","upper_optimal":"20","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"U/mL","description":"CA125 is a protein that can be elevated in ovarian cancer but is also raised by many benign conditions including endometriosis, fibroids and inflammation. Her result of 5 U/mL is well within range and is reassuring, particularly given her family history of cancer.","low_causes":"Normal health","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic infection, menstruation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA15-3","group":"TUMOR MARKERS","result":"21.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3532","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"U/mL","description":"CA15-3 is a protein most commonly associated with breast cancer monitoring. Her result of 21.19 U/mL is within range at less than 30. Given her family history, this is reassuring.","low_causes":"Normal health","high_causes":"Breast cancer, liver disease, ovarian cancer, benign breast conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5213","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL (protective), LDL (atherogenic), and VLDL. Her result of 5.4 mmol/L is mildly above the desirable threshold of 5.18. However, total cholesterol is a crude measure and does not distinguish between protective and harmful components. Her HDL of 2.4 accounts for 44% of the total, which means a large proportion of her cholesterol is in the protective form. The ApoB and LDL are more informative markers for risk assessment.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are a type of fat in the blood that comes from dietary fat and excess carbohydrates. Her result of 0.55 mmol/L is excellent, well within the ideal range of below 1.0. This very low level is a direct benefit of her low-carb diet and her exceptional insulin sensitivity. Low triglycerides are one of the strongest positive markers for metabolic health.","low_causes":"Low-carbohydrate diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High-carbohydrate diet, obesity, alcohol, diabetes, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1603","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. Her result of 0.25 mmol/L is well within the ideal range, reflecting her low triglyceride production.","low_causes":"Low-carbohydrate diet, fasting","high_causes":"High-carbohydrate diet, obesity, diabetes, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"1.55","upper_normal":"5","lower_optimal":"1.6","upper_optimal":"5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective form of cholesterol that removes cholesterol from artery walls and returns it to the liver for disposal. Her result of 2.4 mmol/L is excellent, well above the desirable threshold of 1.55 and above the female optimal threshold of 1.6. High HDL actively protects against cardiovascular disease and is one of the strongest positive findings in her lipid panel.","low_causes":"Smoking, obesity, inactivity, high-carbohydrate diet, metabolic syndrome","high_causes":"Exercise, genetics, moderate alcohol, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4856","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol from the liver to the tissues and can deposit it in artery walls, contributing to atherosclerosis. Her result of 2.77 mmol/L is within the laboratory range of 0.5 to 3.0 but above the optimal target of 2.6. Given her elevated Lp(a) and family history of premature cardiovascular disease, the target for LDL should be lower, ideally below 2.6 and preferably below 2.0. Her Lp(a)-corrected LDL of 2.39 shows the modifiable portion, which is the component that diet and, if needed, medication can reduce.","low_causes":"Low-fat diet, hyperthyroidism, liver disease, malabsorption","high_causes":"High saturated fat intake, genetics, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.25","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a simple measure of the balance between atherogenic and protective cholesterol. Her ratio of 2.25 is excellent, well below the threshold of 4.5 and within the ideal range. Her very high HDL drives this favourable ratio.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"44.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This shows the percentage of total cholesterol carried in the protective HDL form. At 44.44%, nearly half of her cholesterol is in the protective form, which is an excellent result. The higher this percentage, the better the balance between protective and harmful cholesterol.","low_causes":"Low HDL, high LDL, metabolic syndrome","high_causes":"High HDL, healthy lipid profile","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol, capturing all the potentially atherogenic cholesterol (LDL, VLDL and remnants). Her result of 3.0 mmol/L is within the laboratory range of less than 4 but above the optimal target of 2.5. Given her Lp(a), the modifiable portion is smaller than the headline number suggests.","low_causes":"Low LDL and VLDL, healthy metabolism","high_causes":"High LDL, high triglycerides, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6964","lower_normal":"1.4","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"3","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5313","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the number of protective HDL particles in circulation. Her result of 1.95 g/L is well above the desirable threshold of 1.4 and within the ideal range. This confirms that her high HDL cholesterol reading represents a large number of functional protective particles.","low_causes":"Smoking, obesity, inactivity, metabolic syndrome","high_causes":"Exercise, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is a protein carried by every LDL, VLDL and Lp(a) particle. It is the most accurate blood test for counting the number of atherogenic particles that can enter and damage artery walls. Her result of 0.98 g/L is above the desirable threshold of 0.9 and above the optimal target of 0.8. Given her elevated Lp(a) of 118.65 and family history of premature cardiovascular disease, this is the most important modifiable lipid marker. The target should be below 0.8, and ideally below 0.7 given her risk factors. Dietary changes (increasing soluble fibre, reducing saturated fat, adding oily fish) can help, and her GP should consider whether lipid-lowering medication is appropriate.","low_causes":"Healthy metabolism, statin use, low-fat diet","high_causes":"High LDL, genetics, high saturated fat intake, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.502564","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4188","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA1) and is one of the best summary measures of cardiovascular lipid risk. Her ratio of 0.50 is within the lower-risk range of below 0.6 and near the optimal threshold of 0.5. This favourable ratio is driven by her excellent ApoA1 of 1.95, which partially offsets her elevated ApoB.","low_causes":"High HDL particles, low LDL particles, healthy metabolism","high_causes":"High LDL particles, low HDL particles, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"118.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lp(a) is a genetically inherited lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It contributes to cardiovascular risk through three mechanisms: depositing cholesterol in artery walls, promoting blood clot formation, and driving inflammation in the vessel lining. Her result of 118.65 nmol/L places her in the moderate-risk category (90 to 200 nmol/L), well above the ideal threshold of below 32. Lp(a) cannot be lowered by diet, exercise or any currently available supplement. It is determined entirely by genetics and does not change over a lifetime. This result should be permanently recorded in her medical notes, and first-degree relatives should be offered testing. Because Lp(a) cannot be changed, the strategy is to reduce every other modifiable cardiovascular risk factor as aggressively as possible.","low_causes":"Genetics","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"119","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5371","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found mainly in the heart, brain and skeletal muscles. It is released into the blood when muscle tissue is damaged. Her result of 119 U/L is within the ideal range, indicating no significant muscle damage beyond normal daily activity. This is relevant context for her musculoskeletal complaints: the pain she experiences is inflammatory (joint-based) rather than from muscle breakdown.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3929","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in the tissues. Her result of 17.2 pmol/L is within the ideal range of 14 to 20, indicating the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4795","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how much hormone to make. A normal TSH means the pituitary is satisfied with the thyroid's output. Her result of 2.06 mIU/L is within the optimal range of 1.0 to 2.5, indicating the thyroid is working well. Given her family history of thyroid disease, this is reassuring.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy production and body temperature regulation. Her result of 4.4 pmol/L is within the laboratory range but just below the optimal band of 4.5 to 6.5. FT3 at the lower end of optimal can contribute to fatigue and feeling cold, and in a woman with under 6 hours of sleep and chronic pain, the body may be slightly downregulating T3 conversion as a protective response. Her TSH and FT4 are both ideal, so this is not a thyroid disorder but a finding worth monitoring.","low_causes":"Non-thyroidal illness, calorie restriction, chronic stress, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/mL","description":"TPO antibodies are produced by the immune system when it attacks the thyroid gland. Their presence suggests autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Her result of below 6.6 U/mL is well within the normal range of below 13.8, meaning there is no evidence of autoimmune attack on the thyroid. Given her family history of thyroid disease, these negative antibodies are useful information worth recording.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3409","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce thyroid hormones. Her result of below 1.3 U/mL is well within range and confirms there is no autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.256","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4080","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Her ratio of 0.256 is within the laboratory range of 0.2 to 0.45 but just below the optimal band of 0.27 to 0.4. This slight reduction in conversion efficiency can be driven by chronic stress, poor sleep, calorie restriction or chronic illness, and fits with the finding that her FT3 is also just below optimal. It is not a thyroid disorder, but improving sleep and reducing stress may improve conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA19-9","group":"TUMOR MARKERS","result":"< 1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4054","units":"U/mL","description":"CA19-9 is a protein most commonly associated with pancreatic and biliary tract cancers. Her result of below 1.2 U/mL is very well within range and is reassuring, particularly given her gastric history and family history of cancer.","low_causes":"Normal health","high_causes":"Pancreatic cancer, biliary tract cancer, cholecystitis, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"4.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9848","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4348","units":"ng/mL","description":"CEA, or carcinoembryonic antigen, is a protein that can be produced by cells in the gut, pancreas, breast, lung and other tissues. It is used as a monitoring marker for certain cancers, but it can also be elevated by benign conditions including inflammation, polyps, diverticular disease and previous gastrointestinal procedures. Her result of 4.53 ng/mL is above the non-smoker upper limit of 2.3. Given her history of high-grade dysplasia in the stomach requiring EMR in 2025 and her family history of bowel, breast, prostate or ovarian cancer, this result should be discussed with her GP. A repeat test in 6 to 8 weeks will establish whether the level is stable, rising or falling, which is clinically more important than the single value.","low_causes":"Normal health","high_causes":"Colorectal cancer, gastric cancer, pancreatic cancer, lung cancer, breast cancer, inflammation, polyps, smoking, benign GI conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"14.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6018","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/L","description":"IgG is the most abundant immunoglobulin and provides long-term immunity against infections the body has previously encountered. Her result of 14.7 g/L is within the laboratory range of 6.5 to 16 but toward the upper end, above the ideal band of 7 to 14. This likely contributes to her elevated globulin and is consistent with chronic immune activation from her inflammatory burden.","low_causes":"Immune deficiency, certain medications, nephrotic syndrome","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"< 0.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.16","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced by the immune system in response to a new infection. It is the body's early-warning defence. Her result of below 0.2 g/L is below the lower limit of 0.5. Low IgM can be an isolated finding, particularly in older adults, or it can be part of a broader immune deficiency. Her IgG and IgA are both within range, which means the other immunoglobulin classes are intact. This should be mentioned to her GP, who may wish to monitor it over time and check whether she has experienced any recurrent or unusual infections.","low_causes":"Selective IgM deficiency, ageing, chronic disease, medications","high_causes":"Acute infection, autoimmune disease, lymphoma, Waldenström's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"3.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6140","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3655","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody found in mucous membranes, including the gut, lungs and urinary tract. It is the body's first line of defence at these surfaces. Her result of 3.2 g/L is within the laboratory range of 0.4 to 3.5 and toward the upper end. Adequate IgA is important for the validity of the coeliac screen (tTG-IgA), which was unfortunately unsuitable on this sample.","low_causes":"Selective IgA deficiency, medications, certain genetic conditions","high_causes":"Chronic infection, liver disease, autoimmune conditions, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.44","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"IU/mL","description":"IgE is the antibody involved in allergic responses and defence against parasites. Her result of 88 IU/mL is within the laboratory range of below 100 but toward the upper end. This may reflect a mild allergic tendency or environmental exposure. It is not clinically concerning at this level.","low_causes":"Normal health, immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infections, certain immune disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"IU/mL","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and some other autoimmune conditions. Her result of below 4 IU/mL is well within range and is negative. This helps rule out rheumatoid arthritis as the cause of her joint pain, suggesting her bursitis and joint symptoms are more likely mechanical or degenerative in nature.","low_causes":"No autoimmune joint disease","high_causes":"Rheumatoid arthritis, Sjögren's syndrome, chronic infections, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"Sample unsuitable","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition where the immune system reacts to gluten and damages the small intestine. Unfortunately, this sample was returned as unsuitable by the laboratory, so the coeliac screen was not completed. Given her bloating and digestive symptoms, this test should be repeated on a future sample. Her IgA level is within range at 3.2, so the test would be valid if repeated.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7872","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3617","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals and protect cells from oxidative damage. Her result of 1.84 mmol/L is slightly above the upper limit of 1.77. A mildly elevated total antioxidant activity is typically driven by supplementation or a diet rich in polyphenols and is not a concern. Her protein powder may contain antioxidant compounds that contribute to this reading.","low_causes":"Oxidative stress, poor diet, chronic disease, ageing","high_causes":"Supplementation, polyphenol-rich diet, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"240","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5821","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm: highest in the morning and lowest at night. Her morning result of 240 nmol/L is within the morning reference range and within the ideal band. This confirms the adrenal glands are producing an appropriate amount of cortisol during the day. However, her wired-at-night, slow-to-get-going pattern suggests the cortisol rhythm may be shifted, with levels not falling as steeply in the evening as they should. A single morning cortisol cannot confirm this, but the pattern is clinically significant and connects to her insomnia.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid use, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"139","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5877","lower_normal":"0","upper_normal":"118.2","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4230","units":"pmol/L","description":"Oestradiol is the main form of oestrogen. In postmenopausal women, levels should be below 118.2 pmol/L as the ovaries have stopped producing it. Her result of 139 pmol/L is mildly above this threshold. The most likely explanation is peripheral aromatisation: the enzyme aromatase, which is found in fat tissue, converts adrenal androgens and other precursors into oestradiol. At her BMI of 29.7, there is sufficient adipose tissue for this conversion. This is not typically concerning at this level but should be noted in the context of her hormonal review with a specialist.","low_causes":"Menopause, low body fat, pituitary disease, Turner syndrome","high_causes":"Obesity, aromatase excess, ovarian tumours, liver disease, HRT","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"< 0.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0453","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone produced mainly by the ovaries after ovulation. In postmenopausal women, levels are expected to be very low, typically below 2.32 nmol/L. Her result of below 0.21 nmol/L is normal and expected for her postmenopausal status.","low_causes":"Menopause, anovulation, pituitary disease","high_causes":"Ovulation, pregnancy, adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"16.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3647","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5983","units":"mIU/mL","description":"LH is a pituitary hormone that in premenopausal women triggers ovulation and stimulates the ovaries. After menopause, LH rises because the pituitary is trying to stimulate ovaries that are no longer responding. Her result of 16.85 mIU/mL is within the postmenopausal range of 15.9 to 54.0, confirming her postmenopausal status.","low_causes":"Pituitary disease, contraceptive use, eating disorders","high_causes":"Menopause, premature ovarian failure, PCOS (in premenopausal women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"49.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4822","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5372","units":"mIU/mL","description":"FSH is a pituitary hormone that stimulates the ovaries to produce eggs and oestrogen. After menopause, FSH rises significantly because the pituitary gland increases its signal in an attempt to stimulate ovaries that no longer respond. Her result of 49.9 mIU/mL is firmly within the postmenopausal range of 23 to 116.3, confirming menopause.","low_causes":"Pituitary disease, pregnancy, contraceptive use","high_causes":"Menopause, premature ovarian failure, ovarian surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1905","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone is an androgen hormone that plays essential roles in women including maintaining libido, bone density, muscle mass, mood and energy. Her result of 0.2 nmol/L is well below the female lower limit of 0.5. This profoundly low level, combined with her very low DHEA-S and free testosterone, points to significant androgen depletion that goes beyond normal postmenopausal decline. This pattern connects directly to her reported low libido, hair thinning, fatigue, poor sleep and generalised pain. Referral to a menopause or endocrine specialist to discuss testosterone or DHEA replacement is recommended.","low_causes":"Menopause, adrenal insufficiency, pituitary disease, oophorectomy, chronic illness","high_causes":"PCOS, adrenal tumours, congenital adrenal hyperplasia, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{ // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
