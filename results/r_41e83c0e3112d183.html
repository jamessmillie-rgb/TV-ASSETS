type":"normal"},{"key":"hscrp","name":"High Sensitivity CRP","group":"INFLAMMATION","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.15","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.1","units":"mg/L","description":"At 1.5, within the laboratory range but marginally above the ideal level of 1. CRP is made by the liver in response to inflammation anywhere in the body.\n\nThis is a more interesting result than it looks. Severe periodontal disease often pushes CRP considerably higher than this, because inflammation in the gums spills into the bloodstream. At 1.5, with an ESR of 1, Andrew's systemic inflammatory response is mild. That is reassuring in the sense that his body is not in a state of widespread inflammation, and it also suggests that whatever is happening in his mouth is not producing a large systemic signal","low_causes":"Rarely significant","high_causes":"Body fat, infection, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"","upper_normal":"12","lower_optimal":"","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2083333333","units":"mm/hour","description":"At 1, which is very low and entirely healthy. ESR is a broad measure of inflammation that rises with infection, autoimmune disease and some blood disorders. A result this low argues strongly against any hidden inflammatory or autoimmune process, which is a useful negative given the joint pain reported","low_causes":"Not significant","high_causes":"Infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"INFLAMMATION","result":"1.685","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4475","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"Ratio","description":"Within the ideal range at 1.685. This compares the two main white cell types and rises with physical stress or inflammation. A normal result here supports the picture of an immune system that is functioning normally","low_causes":"Immune suppression","high_causes":"Inflammation, physical stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"147","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6923","lower_normal":"133","upper_normal":"146","lower_optimal":"138","upper_optimal":"142","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4615384615","upper_optimal_position":"0.5641025641","units":"mmol/L","description":"Marginally above range at 147. Sodium sits at the high end when fluid intake is low relative to salt intake. It is worth reading alongside the urea of 8.5, which is also marginally raised, since the two often move together when someone is running slightly dry. The urine specific gravity of 1.005 is dilute, which complicates that picture a little and may point instead toward the kidneys concentrating urine less efficiently, which is discussed under Cystatin C","low_causes":"Overhydration","high_causes":"Dietary salt, low fluid intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"104","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4102564103","upper_optimal_position":"0.5641025641","units":"mmol/L","description":"At the lower boundary of the range","low_causes":"Vomiting, fluid loss","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"21.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3788","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939393939","upper_optimal_position":"0.5757575758","units":"mmol/L","description":"Marginally below the ideal level at 21.5, within the laboratory range. Bicarbonate is the body's main acid buffer and it is partly maintained by the kidneys, so a result toward the lower end is consistent with the mildly reduced kidney function shown by the Cystatin C","low_causes":"Metabolic acid load, kidney function","high_causes":"Not significant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5497","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4619883041","upper_optimal_position":"0.5789473684","units":"mmol/L","description":"Within the ideal range at 2.45, though in the upper half. This is worth reading together with the parathyroid hormone result, which is below range","low_causes":"Vitamin D deficiency","high_causes":"Parathyroid conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","units":"mmol/L","description":"Within the ideal range at 2.48, in the upper half. Corrected calcium adjusts the raw figure for the albumin level, making it the more accurate of the two","low_causes":"Vitamin D deficiency","high_causes":"Parathyroid conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.592","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172413793","upper_optimal_position":"0.6034482759","units":"mmol/L","description":"Within the ideal range at 0.98. Magnesium supports sleep quality, muscle relaxation and insulin sensitivity, all three of which are relevant here","low_causes":"Poor intake, medication","high_causes":"Kidney function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3760683761","upper_optimal_position":"0.547008547","units":"umol/L","description":"Within the ideal range at 77. Creatinine is a waste product of muscle, and it is the traditional way of assessing kidney function. As explained under Cystatin C, it is not always the most reliable measure","low_causes":"Low muscle mass","high_causes":"Reduced kidney function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.725","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"","units":"mL/min/1.73m2","description":"At 87, marginally below the ideal level of 90. This estimate is calculated from creatinine. The Cystatin C based estimate, which is generally more accurate, comes out considerably lower at 65, and that difference is explained in the next result","low_causes":"Reduced kidney function","high_causes":"Higher is better","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6545","lower_normal":"","upper_normal":"1.1","lower_optimal":"","upper_optimal":"0.85","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3863636364","units":"mg/L","description":"Above range at 1.44, against a limit of 1.1, and this is a finding that should be taken to the GP.\n\nThere are two ways of estimating kidney function from a blood test. The traditional method uses creatinine, a waste product generated by muscle, and it is affected by how much muscle a person carries, by their age and by what they eat. The alternative uses Cystatin C, a protein produced at a steady rate by virtually every cell in the body, which makes it far less influenced by build or diet. Where the two disagree, Cystatin C is generally the more trustworthy.\n\nHere they disagree considerably. The creatinine estimate puts kidney function at 87, which looks close to normal. The Cystatin C estimate puts it at 65. A figure of 65 falls into the range that would usually prompt a GP to start monitoring kidney function at intervals rather than leaving it unchecked.\n\nSome decline with age is entirely normal, and at 70 nobody would expect the same numbers as at 40. There are also two genuinely reassuring findings alongside it. There is no protein leaking into the urine, which is the marker that signals active kidney damage rather than gradual decline. And the lercanidipine he takes for blood pressure is from a class that tends to protect kidney function rather than harm it.\n\nWhat this needs is monitoring rather than alarm, and the things that support kidney function are the same ones recommended elsewhere in this report, namely better blood sugar control, good hydration, less dietary salt and well-managed blood pressure. It is also worth the GP knowing, because reduced kidney function can affect the dosing of some medications","low_causes":"Not significant","high_causes":"Age, blood pressure, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533333333","upper_optimal_position":"0.52","units":"mmol/L","description":"Marginally above range at 8.5. Urea is a waste product from protein breakdown and it rises with dehydration, with higher protein intake and with reduced kidney clearance. Given the Cystatin C result, the kidney contribution is the most likely explanation, with fluid intake possibly playing a part","low_causes":"Low protein intake, liver disease","high_causes":"Dehydration, kidney function, protein intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"284","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3986","lower_normal":"220","upper_normal":"547","lower_optimal":"280","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3944954128","upper_optimal_position":"0.5168195719","units":"umol/L","description":"Within the ideal range at 284","low_causes":"Low purine intake","high_causes":"Kidney function, diet, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"159","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.575","lower_normal":"130","upper_normal":"170","lower_optimal":"145","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583333333","upper_optimal_position":"0.5833333333","units":"g/L","description":"Within the ideal range at 159. This is the protein in red blood cells that carries oxygen, and a healthy level here means the fatigue is not being caused by anaemia","low_causes":"Iron, B12 or folate deficiency","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.457","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.43","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333333333","upper_optimal_position":"0.6","units":"L/L","description":"Within the ideal range","low_causes":"Anaemia","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5933","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","units":"x 10^12/L","description":"Within the ideal range","low_causes":"Anaemia","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"86.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3981","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703703704","upper_optimal_position":"0.5555555556","units":"fL","description":"Within the ideal range at 86.5, though in the lower half. MCV measures the average size of red blood cells. B12 and folate shortages tend to make cells larger, while iron shortage makes them smaller. This result is normal, but it is worth reading alongside the raised RDW below","low_causes":"Iron deficiency","high_causes":"B12 or folate deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","units":"pg","description":"Within the ideal range","low_causes":"Iron deficiency","high_causes":"B12 or folate deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"347","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.6111111111","units":"g/L","description":"Marginally above range at 347. MCHC measures how concentrated the haemoglobin is inside each red cell. A result this close to the limit is often a laboratory artefact or a reflection of slightly concentrated blood, and taken alone it carries little weight. It sits alongside the sodium of 147 and the urea of 8.5, which point in the same direction","low_causes":"Iron deficiency","high_causes":"Slightly concentrated blood, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"15.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7048","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.380952381","upper_optimal_position":"0.5238095238","units":"%","description":"Above range at 15.4. RDW measures how much red blood cells vary in size from one another. When the bone marrow is short of a raw material it needs, some cells come out slightly different in size, and the variation widens before the average size or the haemoglobin change at all. It is often the earliest signal of a developing shortage.\n\nIron is not the explanation here, since ferritin at 118 and transferrin saturation at 38.67% are both healthy. Folate at 8 is adequate. That leaves vitamin B12, which at 241 is within range but sits well below where it should be, and this is discussed further under that result. This combination, a widened RDW with a low-normal B12 and an MCV in the lower half of normal, is a coherent picture of early B12 insufficiency rather than anything more serious. It is also directly relevant to the question about nutritional absorption","low_causes":"No deficiency","high_causes":"Early B12 insufficiency, mixed nutrient shortage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plateletcount","name":"Platelet Count","group":"HEMATOLOGY","result":"178","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3692","lower_normal":"150","upper_normal":"410","lower_optimal":"200","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974358974","upper_optimal_position":"0.5897435897","units":"x 10^9/L","description":"Within the laboratory range at 178, below the ideal level of 200. Platelets are the cells that form clots. This is not low enough to cause any bleeding tendency, but it is worth noting because the platelet count feeds into the FIB-4 liver score, and a lower count pushes that score upward","low_causes":"Bone marrow, liver conditions","high_causes":"Inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6556","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"8","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333333333","upper_optimal_position":"0.6555555556","units":"fL","description":"Within the ideal range","low_causes":"Bone marrow suppression","high_causes":"Increased platelet turnover","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"5.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4094","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5555555556","units":"x 10^9/L","description":"Within the ideal range at 5.37. This is the total count of immune cells in circulation, and a healthy figure is directly relevant to the question of whether an immune deficiency is contributing to the periodontal disease","low_causes":"Immune suppression","high_causes":"Infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophil Count","group":"HEMATOLOGY","result":"3.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4067","lower_normal":"2","upper_normal":"7","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","units":"x 10^9/L","description":"Within the ideal range at 3.1. Neutrophils are the immune system's main defence against bacterial infection, and they are the specific cell type that matters most in gum disease, because periodontal disease is fundamentally a bacterial problem. A shortage of neutrophils is one of the recognised causes of severe and unusual gum infections, so a normal count here is a genuinely important negative finding for Andrew's periodontist","low_causes":"Bone marrow, medication, immune conditions","high_causes":"Bacterial infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"1.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","units":"x 10^9/L","description":"Within the ideal range at 1.84. Lymphocytes handle viral defence and long-term immune memory. Another normal result supporting the absence of immune deficiency","low_causes":"Immune deficiency","high_causes":"Viral infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.375","upper_optimal_position":"0.5416666667","units":"x 10^9/L","description":"Within the ideal range","low_causes":"Bone marrow suppression","high_causes":"Chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophilcount","name":"Eosinophil Count","group":"HEMATOLOGY","result":"0.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3542","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.1","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5277777778","units":"x 10^9/L","description":"Within the laboratory range at 0.05, below the ideal level. Eosinophils rise with allergy and parasites and fall with physical stress. A low-normal count is of no clinical concern","low_causes":"Physical stress","high_causes":"Allergy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophilcount","name":"Basophil Count","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703703704","upper_optimal_position":"0.5925925926","units":"x 10^9/L","description":"Within the ideal range","low_causes":"Not significant","high_causes":"Allergy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytecount","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.44","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","units":"%","description":"Within the ideal range at 1.14","low_causes":"Bone marrow suppression","high_causes":"Blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocyte Absolute","group":"HEMATOLOGY","result":"60.192","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4013","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3666666667","upper_optimal_position":"0.5333333333","units":"x 10^9/L","description":"Within the ideal range at 60.192. Reticulocytes are newly made red blood cells, so this measures how quickly the bone marrow is producing replacements. A healthy figure here shows the marrow is working properly, which is reassuring alongside the raised RDW","low_causes":"Nutritional insufficiency","high_causes":"Blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"23.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"22","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3908629442","upper_optimal_position":"0.5093062606","units":"umol/L","description":"Marginally above the ideal ceiling at 23.6, comfortably within the laboratory range","low_causes":"Iron deficiency","high_causes":"Supplementation, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"118","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.44","lower_normal":"22","upper_normal":"322","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3977777778","upper_optimal_position":"0.5311111111","units":"ng/mL","description":"Within the ideal range at 118. Ferritin is the storage form of iron and it is the best single measure of iron reserves. A healthy result rules out iron deficiency as a cause of the fatigue and confirms iron absorption is working","low_causes":"Iron deficiency, blood loss","high_causes":"Iron overload, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"57.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4704","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"65","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3956386293","upper_optimal_position":"0.5514018692","units":"umol/L","description":"Within the ideal range","low_causes":"Iron overload","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"38.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5195","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963963964","upper_optimal_position":"0.5315315315","units":"%","description":"Within the ideal range at 38.67%. This shows what proportion of the iron transport system is actually carrying iron, and a healthy figure confirms iron is being absorbed and moved around properly","low_causes":"Iron deficiency","high_causes":"Iron overload","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3956","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3666666667","upper_optimal_position":"0.5222222222","units":"g/L","description":"Within the ideal range","low_causes":"Iron overload, malnutrition","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"18.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4975","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4909688013","upper_optimal_position":"0.6880131363","units":"nmol/L","description":"Within the ideal range at 18.4, having just cleared the threshold of 18. For a man of 70 this is a good total testosterone result. The more informative figure, however, is the free testosterone below","low_causes":"Age, body fat, poor sleep","high_causes":"Supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone","group":"HORMONES","result":"0.2679","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3899","lower_normal":"0.2","upper_normal":"0.6","lower_optimal":"0.3","upper_optimal":"0.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","units":"nmol/L","description":"Within the laboratory range at 0.2679 but below the ideal level of 0.3, and this is the more meaningful of the two testosterone results.\n\nMost testosterone circulating in the blood is bound to a carrier protein called SHBG and is unavailable to tissues while it is attached. Only the free fraction can actually do anything. Andrew's SHBG is 58.7, which is toward the high end, and SHBG rises naturally with age. The result is that although his total testosterone looks healthy at 18.4, rather less of it is available for use than that figure suggests.\n\nLow available testosterone contributes to fatigue, to loss of muscle, to joint stiffness and to difficulty losing body fat, which covers three of the things Andrew came to this test about. Resistance training is the most effective non-medical way to improve it, and it also lowers SHBG modestly, so it helps from both directions at once","low_causes":"High SHBG, age, body fat","high_causes":"Supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeandrogenindex","name":"Free Androgen Index","group":"HORMONES","result":"31.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3371","lower_normal":"30","upper_normal":"150","lower_optimal":"70","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5833333333","units":"Ratio","description":"Within the laboratory range at 31.35 but well below the ideal level, sitting just above the lower boundary. This index compares testosterone against SHBG, so it tells the same story as the free testosterone, that the raised SHBG is limiting how much testosterone is available","low_causes":"High SHBG","high_causes":"Low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"58.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6179","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"20","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3518900344","upper_optimal_position":"0.5580756014","units":"nmol/L","description":"Above the ideal ceiling at 58.7, within the laboratory range. SHBG is the protein that binds testosterone and holds it out of circulation. It rises naturally with age, and also rises with reduced liver processing capacity and with low body fat, though neither of those applies here. This is the reason the free testosterone sits below ideal despite a healthy total","low_causes":"Obesity, insulin resistance","high_causes":"Age, liver processing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"LH","group":"HORMONES","result":"3.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3983","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974358974","upper_optimal_position":"0.5683760684","units":"IU/L","description":"Within the ideal range. LH is the pituitary signal instructing the testes to produce testosterone. A normal level with a normal testosterone means the system is working as intended","low_causes":"Pituitary conditions","high_causes":"Testicular under-function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"FSH","group":"HORMONES","result":"4.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4026","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3453093812","upper_optimal_position":"0.4650698603","units":"IU/L","description":"Within the ideal range","low_causes":"Pituitary conditions","high_causes":"Testicular under-function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estradiol","name":"Oestradiol","group":"HORMONES","result":"163","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5582","lower_normal":"","upper_normal":"146","lower_optimal":"","upper_optimal":"110","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3767123288","units":"pmol/L","description":"Above range at 163, against an upper limit of 146. Oestradiol is a form of oestrogen, and men produce it too. It is made largely in fat tissue, where an enzyme called aromatase converts testosterone into oestradiol.\n\nAt a BMI of 27, that conversion is happening more than it would at a lower body weight, and it works against him twice over, because every unit converted both raises oestradiol and reduces the testosterone available. Raised oestradiol in men can contribute to fatigue, to fluid retention and to difficulty losing body fat. Reducing body fat is the direct fix, and it moves both hormones in the desired direction simultaneously","low_causes":"Low body fat","high_causes":"Body fat, aromatase conversion","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2988","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455964326","upper_optimal_position":"0.5685618729","units":"nmol/L","description":"Below range at 0.58. In men progesterone is a minor hormone, present as a building block in the pathway that produces other steroid hormones rather than doing much on its own. A low result in a man of this age carries little clinical weight and is not something that requires action. It is reported here for completeness","low_causes":"Age, reduced precursor activity","high_causes":"Not significant in men","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"209","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.499","lower_normal":"45","upper_normal":"375","lower_optimal":"100","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5909090909","units":"mIU/L","description":"Within the ideal range","low_causes":"Not significant","high_causes":"Stress, pituitary conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"266","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4297","lower_normal":"172","upper_normal":"497","lower_optimal":"250","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133333333","upper_optimal_position":"0.5671794872","units":"nmol/L","description":"Within the ideal range at 266. Cortisol is the body's main stress hormone. This is a good result, and a slightly surprising one given fewer than six hours of sleep most nights, since sleep restriction commonly pushes cortisol up. It suggests the stress response system is coping well","low_causes":"Adrenal insufficiency","high_causes":"Chronic stress, poor sleep","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-S","group":"HORMONES","result":"515.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.358","lower_normal":"162","upper_normal":"4938","lower_optimal":"800","upper_optimal":"3000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778615299","upper_optimal_position":"0.5314070352","units":"ug/L","description":"Within the laboratory range at 515.9 but below the ideal level for general vitality. DHEA-S is the other major adrenal hormone alongside cortisol and it supports energy and resilience. It declines steadily and substantially with age, falling by roughly 80% between the twenties and the seventies, so a result in this region at 70 is largely age-expected rather than a sign of anything wrong","low_causes":"Age-related decline","high_causes":"Adrenal overactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.398","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3687943262","upper_optimal_position":"0.4869976359","units":"mIU/L","description":"Within the ideal range at 1.37. TSH is the pituitary signal telling the thyroid how hard to work, and a level in this region indicates the thyroid is meeting demand comfortably","low_causes":"Overactive thyroid","high_causes":"Underactive thyroid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"FT4","group":"THYROID","result":"13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.378","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4077380952","upper_optimal_position":"0.5267857143","units":"pmol/L","description":"Within the laboratory range at 13, marginally below the ideal level of 14. FT4 is the storage form of thyroid hormone. Since the active form FT3 is comfortably in the ideal range at 5.1 and the TSH is normal, conversion is working well and this is not a concern","low_causes":"Underactive thyroid","high_causes":"Overactive thyroid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"FT3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4740740741","upper_optimal_position":"0.5481481481","units":"pmol/L","description":"Within the ideal range at 5.1. FT3 is the active form of thyroid hormone that drives metabolism in every cell, so this is the more important of the two thyroid hormone results and it is healthy","low_causes":"Underactive thyroid, illness","high_causes":"Overactive thyroid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"TPO Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2391","lower_normal":"","upper_normal":"13.8","lower_optimal":"","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2173913043","units":"IU/mL","description":"Negative. This rules out the most common autoimmune thyroid condition","low_causes":"Not applicable","high_causes":"Autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibody","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"","upper_normal":"4.4","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2272727273","units":"IU/mL","description":"Negative","low_causes":"Not applicable","high_causes":"Autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"50","upper_normal":"200","lower_optimal":"100","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5555555556","units":"nmol/L","description":"Within the laboratory range at 68 but below the ideal level of 100, and this is directly relevant to the periodontal question.\n\nVitamin D behaves more like a hormone than a vitamin. It regulates immune function, it is required for calcium handling and bone maintenance, and there is a well-recognised association between low vitamin D and periodontal disease, because the bone that holds teeth in place depends on it and because immune cells in the gums use it.\n\nIn the UK, sunlight between October and March is too weak for skin to produce any vitamin D at all, so most people drift downward through winter. Bringing this above 100 is straightforward with supplementation and is one of the more useful things Andrew can do for both his gums and his general health","low_causes":"Limited sun exposure, winter months","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"241","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3536","lower_normal":"193","upper_normal":"982","lower_optimal":"300","upper_optimal":"600","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3785382341","upper_optimal_position":"0.5052809463","units":"pg/mL","description":"Within the laboratory range at 241 but well below the ideal level of 300, and this is one of the findings his periodontist should see.\n\nB12 is needed for nerve function, for red blood cell production and for the rapid renewal of the cells lining the mouth and gut. Deficiency is a recognised cause of mouth ulceration and sore, inflamed oral tissue. At 241 Andrew is not deficient by laboratory standards, but he is low enough that it is worth correcting, particularly in the context of an unexplained oral problem.\n\nThe way B12 is absorbed makes it a reasonable candidate for the absorption question that was raised. It requires adequate stomach acid to release it from food, and a protein called intrinsic factor made by the stomach lining to carry it across the gut wall. Both decline with age. Given that Andrew also reports bloating and digestive discomfort, and that his RDW at 15.4 shows early signs of red cell production being affected, this is worth pursuing rather than ignoring.\n\nA sublingual supplement, meaning one dissolved under the tongue, bypasses the stomach entirely and is therefore the sensible starting point. If the level does not respond to that, it points toward absorption and gives the GP something concrete to investigate","low_causes":"Poor absorption, low intake, age","high_causes":"Supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Folate","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4523809524","upper_optimal_position":"0.5952380952","units":"ug/L","description":"At the lower boundary of the ideal range at 8. Folate works alongside B12 in red blood cell production and in the renewal of the cells lining the mouth. It is adequate but there is no margin, and increasing green vegetables, pulses and beans would build some in","low_causes":"Low intake, poor absorption","high_causes":"Supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"135","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4464","lower_normal":"40","upper_normal":"320","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.380952381","upper_optimal_position":"0.5238095238","units":"U/L","description":"Within the ideal range at 135. This is worth pointing out specifically because Andrew takes a statin. Creatine kinase is the enzyme released when muscle is damaged, and it is the marker used to check whether a statin is causing muscle problems, which is the most common reason people stop taking them. A normal result means the statin is not troubling his muscles","low_causes":"Low muscle mass","high_causes":"Exercise, muscle damage, statin intolerance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5379","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712121212","upper_optimal_position":"0.5227272727","units":"IU/L","description":"Marginally above the ideal ceiling at 84, comfortably within the laboratory range. Amylase is a digestive enzyme produced by the pancreas and salivary glands","low_causes":"Reduced pancreatic function","high_causes":"Pancreatic irritation, kidney clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8227","lower_normal":"13","upper_normal":"60","lower_optimal":"20","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3829787234","upper_optimal_position":"0.5602836879","units":"U/L","description":"Above range at 82, against an upper limit of 60. Lipase is the enzyme the pancreas produces to digest fat, and a raised level generally indicates the pancreas is irritated. Given the bloating and digestive discomfort Andrew reports, this is worth mentioning to his GP.\n\nThere is a second explanation that should be considered alongside the first, and it may well be the more likely one. Lipase is cleared from the blood by the kidneys. When kidney clearance falls, lipase accumulates and the level rises without the pancreas being inflamed at all. With a Cystatin C of 1.44 and a Cystatin C based kidney function estimate of 65, reduced clearance is a genuine possibility here.\n\nThe useful point is that these two explanations can be told apart easily. Repeating the lipase alongside kidney function in a few months will show whether it tracks the kidney figure, which would point to clearance, or moves independently, which would point to the pancreas. The normal amylase at 84 and the normal CA 19-9 at 22.2 both make significant pancreatic disease less likely","low_causes":"Reduced pancreatic function","high_causes":"Pancreatic irritation, reduced kidney clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"15.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6456","lower_normal":"6.5","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3859649123","upper_optimal_position":"0.5964912281","units":"g/L","description":"Above the ideal ceiling at 15.4, within the laboratory range. IgG is the main long-term antibody in blood and it rises when the immune system has been dealing with a persistent infection. In someone with active periodontal disease this is exactly what would be expected, and it is a sign of an immune system that is responding rather than one that has failed","low_causes":"Immune deficiency","high_causes":"Chronic infection, immune activity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3466666667","upper_optimal_position":"0.5333333333","units":"g/L","description":"Within the ideal range at 0.8. IgM is the first antibody produced in a new infection","low_causes":"Immune deficiency","high_causes":"Recent or acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4194","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3978494624","upper_optimal_position":"0.5591397849","units":"g/L","description":"Within the ideal range at 1.2, though toward the lower end of it, and this one deserves a comment given the circumstances.\n\nIgA is the antibody that defends mucous membranes specifically, meaning the linings of the mouth, the airways and the gut. It is the immune system's front line in exactly the tissue that is failing in Andrew's case, and it is also relevant to the digestive symptoms he describes. At 1.2 he is comfortably within normal limits and nowhere near the level that would count as a deficiency, so this is not an answer to the periodontist's question. It is simply the one immune marker sitting on the lower side in a man with an active mucosal infection, and worth her being aware of.\n\nA practical note follows from this. The coeliac screening test used here is IgA-based, which means it becomes unreliable in people who are genuinely IgA deficient. At 1.2 Andrew is not, so his negative coeliac result can be trusted","low_causes":"Mucosal immune deficiency","high_causes":"Mucosal inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.215","lower_normal":"","upper_normal":"100","lower_optimal":"","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.25","units":"IU/mL","description":"Within the ideal range at 43, indicating a minimal allergic burden","low_causes":"Not applicable","high_causes":"Allergy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"","upper_normal":"14","lower_optimal":"","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2857142857","units":"IU/mL","description":"Within the ideal range at 5. This is directly relevant to the joint pain and stiffness Andrew reports, because it argues strongly against rheumatoid arthritis. Read alongside the CRP of 1.5 and the ESR of 1, both low, there is no sign of an inflammatory or autoimmune joint condition. That points instead toward the wear-related type of joint pain, which is common at 70 and is managed very differently, generally through strength work, movement and weight management rather than medication","low_causes":"Not applicable","high_causes":"Rheumatoid arthritis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1769","lower_normal":"","upper_normal":"6.5","lower_optimal":"","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3076923077","units":"ng/mL","description":"Within the range for a man of 70 at 2.3. PSA is a protein made by the prostate, and the normal range widens with age because the prostate enlarges naturally over time. This is a reassuring result, and the free PSA ratio below strengthens that considerably","low_causes":"Not applicable","high_causes":"Prostate enlargement, inflammation, prostate conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psafree","name":"PSA Free","group":"PROSTATE","result":"1.33","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ug/L","description":"This figure is not interpreted on its own. What matters is the proportion it represents of the total PSA, which is given as the ratio below","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psaratio","name":"PSA Ratio","group":"PROSTATE","result":"0.578","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1","lower_normal":"0.25","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"","units":"Ratio","description":"At 0.578, meaning 57.8% of the PSA present is in the free form, and this is a genuinely reassuring number.\n\nPSA circulates in two forms, one bound to other proteins and one free. Prostate cancer tends to produce more of the bound form, so a low free proportion raises concern while a high one lowers it. A ratio above 25% is considered reassuring, and Andrew's is more than double that. Taken with the total PSA of 2.3, the prostate picture here is a good one","low_causes":"Prostate conditions","high_causes":"Higher is more reassuring","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"22.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2702702703","units":"kIU/L","description":"Within the laboratory range at 22.2, marginally above the ideal level of 20. CA 19-9 is a general marker that can rise with inflammation in the digestive system as well as with several benign conditions, and it is not a cancer test in isolation. Given the bloating and the raised lipase, it is worth repeating at the next test simply to confirm it is stable","low_causes":"Not applicable","high_causes":"Digestive inflammation, benign conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1737","lower_normal":"","upper_normal":"3.8","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2631578947","units":"ng/mL","description":"Within the ideal range at 1.32","low_causes":"Not applicable","high_causes":"Smoking, gut inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalantioxidantstatus","name":"Total Antioxidant Status","group":"SPECIALIZED TESTS","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.475177305","upper_optimal_position":"0.6170212766","units":"mmol/L","description":"Within the ideal range at 1.56. This measures the combined capacity of the antioxidants circulating in blood. It is a broad, general figure and it should not be read as a substitute for measuring any individual nutrient, vitamin C included","low_causes":"Poor diet","high_causes":"Supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"parathyroidhormone","name":"Parathyroid Hormone","group":"SPECIALIZED TESTS","result":"0.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3084","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3795555556","upper_optimal_position":"0.5573333333","units":"pmol/L","description":"Below range at 0.7, and this is worth a mention to the GP for clarification rather than concern.\n\nParathyroid hormone controls calcium levels in the blood. When calcium falls, the parathyroid glands release more of it, and when calcium rises they release less. The two are meant to move in opposite directions.\n\nUsually a low parathyroid hormone is explained by a high vitamin D level suppressing it, but Andrew's vitamin D is 68, which is not high. What makes this worth a second look is that his corrected calcium sits at 2.48, in the upper half of its range, at the same time as the parathyroid hormone is below range. That particular combination is one a GP would generally want to confirm with a repeat test, checking parathyroid hormone, calcium, vitamin D and phosphate together on the same sample. Single hormone readings vary, and a repeat may well show it back within range","low_causes":"Suppressed by high vitamin D, parathyroid conditions","high_causes":"Vitamin D deficiency, kidney conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"antittg","name":"Anti-tTG IgA","group":"AUTOIMMUNE & CELIAC","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0348","lower_normal":"","upper_normal":"7.19","lower_optimal":"","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2781641168","units":"CU","description":"Negative. This is the standard screening test for coeliac disease, an autoimmune reaction to gluten that damages the gut lining and impairs absorption of nutrients. Given the bloating, the digestive discomfort and the specific question about whether absorption might be impaired, this is an important negative result. It is also a trustworthy one, because the test relies on IgA antibodies and becomes unreliable in people who lack IgA, and Andrew's IgA at 1.2 is within normal limits. One caveat applies to everyone taking this test, which is that it only works if gluten is being eaten regularly at the time of the sample","low_causes":"Not applicable","high_causes":"Coeliac disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ph","name":"pH","group":"URINALYSIS","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"4.5","upper_normal":"8","lower_optimal":"6","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4761904762","upper_optimal_position":"0.5714285714","units":"pH units","description":"Within the ideal range","low_causes":"Acidic diet","high_causes":"Urinary infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"specificgravity","name":"Specific Gravity","group":"URINALYSIS","result":"1.005","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"1.005","upper_normal":"1.03","lower_optimal":"1.01","upper_optimal":"1.025","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","units":"-","description":"At the lower boundary at 1.005, meaning dilute urine. On its own this usually just reflects having drunk plenty of water beforehand. It is mentioned here only because it sits alongside a raised sodium and urea, which normally accompany the opposite, and reduced ability to concentrate urine is a recognised feature of gradually declining kidney function. Worth noting rather than acting on","low_causes":"Recent fluid intake, kidney concentrating ability","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinewbc","name":"White Cells (Urine)","group":"URINALYSIS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.05","lower_normal":"","upper_normal":"10","lower_optimal":"","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.25","units":"wbc/uL","description":"Within normal limits at 1, indicating no urinary inflammation or infection","low_causes":"Not applicable","high_causes":"Urinary infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urinerbc","name":"Red Cells (Urine)","group":"URINALYSIS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.05","lower_normal":"","upper_normal":"10","lower_optimal":"","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.25","units":"rbc/uL","description":"Within normal limits at 1","low_causes":"Not applicable","high_causes":"Infection, stones, kidney conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urineprotein","name":"Protein (Urine)","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"-","description":"Negative, and this is one of the more important negatives in the report. Protein leaking into urine is the marker that signals active kidney damage, as opposed to the gradual age-related decline suggested by the Cystatin C. Its absence is genuinely reassuring.","low_causes":"","high_causes":"","padding":"1","one function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

// ============================================================
//  COMPONENT BUILDERS
// ============================================================
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

//  INTERACTIONS
// ============================================================
function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{

}

// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
