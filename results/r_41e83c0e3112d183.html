<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%}
.mpill-green .mpill-dot{background:var(--green)}.mpill-amber .mpill-dot{background:var(--amber)}.mpill-red .mpill-dot{background:var(--red)}

/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard-green .scard-ic{background:var(--green-soft)}.scard-green .scard-ic svg{color:var(--green)}
.scard-amber .scard-ic{background:var(--amber-soft)}.scard-amber .scard-ic svg{color:var(--amber)}
.scard-red .scard-ic{background:var(--red-soft)}.scard-red .scard-ic svg{color:var(--red)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}
.sb-green{background:var(--green-soft);color:var(--green)}.sb-amber{background:var(--amber-soft);color:var(--amber)}.sb-red{background:var(--red-soft);color:var(--red)}

/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}

const REPORT_DATA = {"patient_name":"Andrew Lambert","dob":"28/07/1955","report_date":"2026-07-26","summary":"THE SHORT VERSION\n\nYour periodontist asked whether something in your body might be behind your gum disease. This test has answered a good part of her question.\n\nYou do not have diabetes, and your immune system is working normally. That rules out two of the three things she was concerned about. What the test has found is that your body is not handling blood sugar as well as it should, which is a well recognised contributor to gum disease and is reversible. It has also found two vitamin levels worth correcting, B12 and vitamin D. Vitamin C, which she mentioned specifically, was not included in this panel and needs requesting separately from your GP.\n\nTwo other things need a doctor's attention, neither of them urgent. Your kidney function is a little below where it should be for your age and should be monitored. And you carry an inherited cholesterol particle that your statin cannot lower, which is worth having recorded on your notes.\n\nThere is one more thing worth raising with both your GP and your periodontist. One of your blood pressure tablets belongs to a group of medicines known to affect gum tissue.\n\nIf you do only four things: take this report to your periodontist, ask your GP about the vitamin C test and your kidney result, get your sleep from under six hours up to seven or eight, and start lifting weights twice a week. The rest of this report explains why.\n\nYOUR PERIODONTIST'S QUESTION\n\nShe raised four possibilities. Here is where each one stands.\n\nDiabetes: ruled out. Your HbA1c is 40, and that is the test used to diagnose diabetes. It measures your average blood sugar over the previous three months. Anything under 42 is normal, so you are clear of both diabetes and the prediabetes stage before it. There is no glucose in your urine either, which points the same way.\n\nBut there is more to say, and this is the part she will want. Your fasting blood sugar was 6.5, which is above the normal limit of 6, and a calculation called HOMA-IR came out at 4.1 against a limit of 1.5. HOMA-IR compares your blood sugar against your insulin, the hormone that lets sugar into your cells for energy. When cells stop listening to insulin properly, the body produces more of it to get the same job done. Yours is having to work close to three times harder than it should. Your pancreas is coping well with that extra demand, which is exactly why you are not diabetic.\n\nThis matters for your gums more than it might sound. Raised blood sugar and raised insulin weaken the immune cells that fight bacteria in the gums, reduce blood flow through the tiny vessels feeding gum tissue, and slow down the production of collagen, which is the protein gums are largely built from. It also works the other way round, because inflamed gums worsen how the body handles sugar. Each problem makes the other harder to treat, which is why your periodontist was right to ask.\n\nSo the honest answer is: not diabetes, but a genuine blood sugar problem short of it, and one that can be reversed.\n\nImmune deficiency: not found. This was checked from several angles and everything came back normal. Most importantly your neutrophils, the white cells that specifically fight bacterial infection, are healthy. A shortage of these is one of the known causes of severe and unusual gum infections, so this is a meaningful result for her. Your other white cells and your antibody levels are all normal too.\n\nTwo small observations sit alongside that. Your IgG antibodies and your globulin protein are both at the top of their normal ranges, which is what an immune system dealing with a long-running infection looks like. That is a sign of a system working, not failing. Separately, your IgA is normal but sits toward the lower end. IgA is the antibody that defends the linings of the mouth, airways and gut, so it is the one working directly in the tissue that is failing. You are nowhere near deficient, but it is worth her knowing.\n\nNutritional deficiency: found, in two places. Your vitamin B12 is 241. That is inside the laboratory range, which starts at 193, but well below the 300 we would want to see. B12 is needed to renew the cells lining your mouth, and a shortage is a recognised cause of sore, inflamed oral tissue.\n\nSomething supports that finding. A measurement called RDW, which tracks how much your red blood cells vary in size from one another, came back slightly raised at 15.4. That variation widens when the bone marrow is running short of something it needs, and it does so early, before anything else changes. Your iron is good and your folate is adequate, which leaves B12 as the likely explanation.\n\nYour vitamin D is 68, below the 100 we would want. Vitamin D behaves more like a hormone than a vitamin, and it has a recognised link with gum disease, partly because the bone holding your teeth in place depends on it.\n\nAgainst that, there is no sign of general undernutrition. Your albumin and total protein, which are the markers that fall when someone is genuinely underfed, are both healthy, and your iron levels are good throughout.\n\nVitamin C was not measured. This panel does not include it. Since she asked about it specifically, please request it through your GP. It matters because your body cannot make collagen without it, gums are largely collagen, and sore bleeding gums are the classic early sign of a shortage. One caution: this report includes a Total Antioxidant Status result, which is normal. That is a broad general measure and it is not a substitute for measuring vitamin C.\n\nPoor absorption: cannot be ruled out, and one finding points toward it. Your coeliac screen is negative, which rules out the commonest cause of poor absorption, and that result can be trusted in your case. But B12 is a special case. Absorbing it needs decent stomach acid and a protein made by the stomach lining, and both decline with age. You are 70, you have bloating and digestive discomfort, and your B12 is low with that early RDW change alongside it. That is worth looking into rather than assuming.\n\nThere is a neat way to test it. A B12 supplement that dissolves under your tongue is absorbed straight through the lining of your mouth, bypassing the stomach entirely. If your level comes up on a retest, the problem was simply intake. If it does not, absorption is the issue, and your GP then has something specific to investigate.\n\nYOUR BLOOD PRESSURE TABLET\n\nYou take lercanidipine. It belongs to a family of blood pressure medicines that are known to cause gum tissue to overgrow in some people. It is reported more often with older members of that family, but it has been described with lercanidipine too.\n\nThis is worth understanding properly. Gum overgrowth is not the same thing as gum disease. It is extra tissue rather than an infection. The problem is what it creates, because thicker gum tissue makes deeper pockets between gum and tooth, and those pockets are harder to clean and shelter the bacteria that drive periodontal disease. So the tablet would not have caused your condition, but it could be making it harder to control.\n\nPlease raise this with your GP and your periodontist, and please do not stop or change the tablet yourself. Keeping your blood pressure controlled matters. But there are several other types of blood pressure medicine without this effect, so with a Stage III diagnosis it is a conversation worth having.\n\nYOUR KIDNEYS\n\nOne result here needs your GP's attention. It is not an emergency, but it should not be left.\n\nThere are two ways of measuring kidney function from blood. The older way uses creatinine, a waste product from muscle, which means how much muscle you carry affects the answer. The newer way uses a protein called Cystatin C, which nearly every cell in your body makes at a steady rate, so build and diet barely affect it. When the two disagree, Cystatin C is usually the one to trust.\n\nYours disagree. The creatinine measure puts your kidney function at 87, which looks close to normal. The Cystatin C measure, which came back at 1.44 against a limit of 1.1, puts it at 65. Sixty-five is the level at which a GP would normally start checking kidney function regularly rather than leaving it alone. Your urea, another waste product, is slightly raised at 8.5, which fits the same picture.\n\nSome decline is completely normal at 70 and nobody would expect the numbers of a much younger man. There is also genuinely good news here. There is no protein leaking into your urine, and that is the finding that would signal active damage rather than gradual age-related change. Your blood pressure tablet is also from a group that tends to protect the kidneys. This needs watching, not worrying about. It is also worth your GP knowing, because reduced kidney function can affect the dose of some medicines, and it may explain another result further down.\n\nYOUR CHOLESTEROL\n\nYour statin is doing its job well. Your total cholesterol, your LDL, your triglycerides and your cholesterol ratio are all good.\n\nTwo results sit outside that. The first is Lipoprotein(a), usually written Lp(a) and said as lipoprotein little a. Yours is 74.65, more than twice the limit of 32.\n\nLp(a) is a cholesterol particle much like LDL, but with an extra protein wrapped around it. That extra protein looks very similar to one your body uses to break down blood clots, and because it is similar without being the same, it gets in the way rather than helping. The upshot is that an Lp(a) particle does three things in an artery wall where ordinary cholesterol does one. It deposits cholesterol, it encourages clotting there, and it causes inflammation there.\n\nThe level you have is inherited. It was set before you were born, it does not change with diet, exercise or weight, and statins do not lower it. That last point explains the second result. Your ApoB came out at 0.91, just above the 0.9 target, which counts the total number of cholesterol particles capable of getting into an artery wall. Your LDL is well controlled, but every Lp(a) particle also counts toward ApoB, which is why the count stays marginally high. The balance between harmful and protective particles, at 0.746 against a 0.7 limit, is marginally out for the same reason.\n\nWhat this means in practice is that your heart risk is a little higher than your cholesterol results alone suggest, and the standard risk calculators GPs use do not include Lp(a). Ask for it to be added permanently to your notes and mentioned at your next medication review. It also runs in families, so your children and any brothers or sisters may want to ask about being tested.\n\nSLEEP\n\nYou sleep under six hours most nights, and improving that is one of your goals. It is also the thread running through several of the findings above, which is why it is worth more attention than it usually gets.\n\nSleep shortage measurably reduces how well the body handles insulin. Studies restricting healthy people to four or five hours a night for less than a week have produced drops in insulin sensitivity of roughly a quarter, in people with no blood sugar problems at all. You have been doing something similar for far longer. Sleep is unlikely to be the only reason behind your HOMA-IR result, but it is very likely part of it.\n\nShort sleep also weakens immune function, including the very cells that would be fighting the bacteria in your gums. It shifts appetite hormones toward eating more, which works against losing body fat. And it is the most obvious explanation for feeling tired.\n\nOne encouraging detail. Your cortisol, the main stress hormone, is comfortably normal. Short sleep usually pushes it up, and yours has held steady, which suggests your body is still coping and that improving your sleep should pay off fairly readily.\n\nWHY YOU FEEL TIRED, STIFF AND BLOATED\n\nThe tiredness has four contributors and all of them can be improved. Sleeping under six hours is the biggest. Your B12 is the second. The third is your available testosterone, which is worth explaining. Your total testosterone is good for 70, but most testosterone in the blood is stuck to a carrier protein and cannot be used while it is attached. Yours is more stuck than average, because that carrier protein rises naturally with age, so less is actually available to you than the headline number suggests. The fourth is the blood sugar handling, which makes producing energy less efficient.\n\nThe joint pain and stiffness has a clear answer, and it is a reassuring one. Your rheumatoid factor is normal and both of your inflammation markers are low. That argues strongly against rheumatoid arthritis or any similar inflammatory joint condition. It points instead toward the wear-related kind of joint pain, which is very common at 70 and is treated quite differently, mainly through strength work, movement and weight rather than medication. Low available testosterone and carrying a little extra weight both add to it.\n\nThe bloating and digestive discomfort has one finding attached. Your lipase, an enzyme your pancreas makes to digest fat, came back at 82 against a limit of 60, which usually means the pancreas is irritated. There is a second possible explanation that may well be the right one here. Lipase is cleared out of the blood by the kidneys, so when kidney clearance falls the level rises without the pancreas being inflamed at all, and your kidney result would fit that. These two are easy to tell apart by repeating the test alongside kidney function in a few months. Your other pancreas markers are essentially normal, which makes serious pancreatic disease unlikely, and your coeliac screen was negative.\n\nEVERYTHING ELSE WORTH A MENTION\n\nA liver screening score called FIB-4 came out at 2.19, above its 1.45 threshold, and it looks worse than it is. FIB-4 is not a measurement, it is a sum that includes your age, so it climbs automatically as people get older whatever their liver is doing. At 70 the age alone puts most people over the line, and your platelet count, which is normal but on the lower side, pushes it up further. Your actual liver results are all normal. Worth mentioning to your GP as context rather than as a worry.\n\nYour parathyroid hormone, which controls the calcium in your blood, came back slightly below range at 0.7, while your calcium sat in the upper half of normal. Those two would normally move in opposite directions, so it is worth your GP repeating parathyroid hormone, calcium, vitamin D and phosphate together on one sample. Single hormone readings vary and a repeat may well be normal.\n\nYour oestradiol, a form of oestrogen that men produce too, is slightly above range at 163. Men make it in fat tissue, which converts testosterone into it. That works against you twice over, because every bit converted both raises oestrogen and lowers the testosterone available to you. Losing some body fat improves both at once. Your progesterone came back below range at 0.58, but in men this is a minor hormone and a low reading at your age carries very little weight. It is reported for completeness rather than action.\n\nYour sodium at 147 is marginally above range, and a red cell measurement called MCHC is marginally above at 347. Together these usually just mean slightly concentrated blood from not drinking quite enough through the day.\n\nFinally, the good news worth naming. Your prostate results are reassuring, and the more detailed of the two prostate measures is particularly so. Your thyroid is working well with no sign of autoimmune disease. The muscle enzyme used to check whether a statin is causing problems is normal, so your statin is not troubling your muscles. Your iron levels are healthy throughout. Your urine sample showed no infection. And your coeliac screen was clear.","links":"There are five things to do, and the first two are appointments rather than changes at home.\n\nTAKE THIS TO YOUR PERIODONTIST\n\nThe findings she needs are the raised blood sugar and HOMA-IR showing insulin resistance without diabetes, the HbA1c confirming diabetes is not present, the low vitamin B12 and vitamin D, the normal white cell and antibody results ruling out immune deficiency, and the negative coeliac screen.\n\nTwo things to raise with her directly. Vitamin C was not measured by this panel even though she asked about it, so it needs requesting separately. And lercanidipine belongs to a family of blood pressure medicines associated with gum tissue overgrowth, which can deepen the pockets that harbour bacteria.\n\nSEE YOUR GP\n\nFour things to raise. The Cystatin C kidney result, which needs monitoring and may affect medicine doses. The Lp(a), which should be recorded permanently and taken into account when your heart risk is next assessed. The parathyroid hormone result, which needs repeating alongside calcium, vitamin D and phosphate on one sample. And a vitamin C level. It is also worth asking for the lipase to be repeated alongside kidney function in a few months, to sort out which of the two explanations applies.\n\nSLEEP\n\nThis is the most valuable change available to you, because it acts on your blood sugar, your immune function, your energy and your weight at the same time. Under six hours is well short of what your body needs. Seven to eight is the target.\n\nThe single most effective change is a fixed wake time, every day including weekends. Your body clock is set far more by when daylight reaches your eyes in the morning than by when you go to bed, so a consistent wake time gradually pulls the whole night earlier without you having to force sleep. Getting outside within an hour of waking, even on a grey day, strengthens that considerably.\n\nBeyond that: caffeine stays in the system around five to six hours, so half of a two o'clock coffee is still with you at eight in the evening, and a midday cut-off is sensible. Keep the bedroom cool, around 16 to 18 degrees, because your body temperature has to drop for sleep to start. Go easy on evening alcohol, which gets you to sleep faster but breaks up the second half of the night. Allow three quarters of an hour of winding down without screens. And if getting up in the night to pass water is the problem, shifting your drinking earlier in the day usually helps more than drinking less overall.\n\nLIFT WEIGHTS TWICE A WEEK\n\nYou already do two cardio sessions, which is good. Adding resistance training is the single change with the biggest return at your age.\n\nMuscle is where your body clears sugar out of the blood, so building some directly improves the insulin problem. It is also the most effective way to raise your available testosterone, and it lowers the carrier protein that is currently holding testosterone out of circulation, so it helps from both directions. Stronger muscle around a joint takes load off that joint, which is directly relevant to the stiffness. It protects your bones. And it raises the protective side of your cholesterol.\n\nTwo sessions a week is enough. Each one should include a push, a pull, a squat or leg press, and a hinge such as a deadlift variation, working until the last two or three repetitions are genuinely hard. Machines are perfectly good and often easier to learn safely. Beginners gain strength quickly at any age, and 70 is not too late to start.\n\nFOOD\n\nYour diet is already reasonable, so this is about targeted changes rather than an overhaul.\n\nProtein matters most. After 70 the body gets less efficient at turning food protein into muscle, so you need more of it rather than less. Aim for 96 to 128g a day, spread across your meals rather than saved for the evening, roughly 25 to 30g at each. Eggs, Greek yoghurt, fish, chicken, cottage cheese and beans all work. This supports the weight training, protects your muscle while you lose fat, and helps you feel full.\n\nFor blood sugar, cut back on refined carbohydrates and sugary foods, and try not to eat carbohydrate on its own. Pairing it with protein, fat or fibre slows the rise in blood sugar noticeably. Walking for ten or fifteen minutes after your largest meal has a measurable effect and is one of the simplest things you can do.\n\nFor the B12 and folate, eggs, fish, meat and dairy cover B12, and green vegetables, beans and lentils cover folate. Given the absorption question, the under-the-tongue supplement is the more reliable route for B12.\n\nFor your gums specifically, vitamin C is worth getting from food daily regardless of what the blood test shows, because collagen production depends on it. Peppers, berries, citrus, broccoli and tomatoes are the easy sources.\n\nFor the fluid balance, steady drinking through the day works better than a lot at once, and keeping most of it earlier avoids disturbing your sleep.\n\nAt your height and weight with your current activity, you need roughly 2,100 to 2,300 calories a day to stay the same. For steady fat loss, 1,700 to 1,900 should take off about half a kilo a week. Losing 5 to 6kg would improve the insulin problem, lower the oestrogen and increase your available testosterone.\n\nRETESTING\n\nA follow-up in twelve weeks would show whether this is working. Worth repeating: blood sugar, insulin and HbA1c, Cystatin C for the kidneys, lipase alongside it, vitamin B12 and vitamin D, RDW, ApoB, parathyroid hormone with calcium and phosphate, and free testosterone. The Lp(a) does not need repeating, because it does not change.","flags":"FOR THE PERIODONTIST\n\nBlood glucose 6.5, above the limit of 6. HOMA-IR 4.1, against a limit of 1.5, indicating significant insulin resistance. HbA1c 40, which is 5.8%, below the prediabetes threshold of 42, so diabetes is excluded. Insulin resistance impairs immune defence in the gums, reduces small vessel blood supply and slows collagen production, and periodontal inflammation worsens insulin resistance in return. Reversible.\n\nNo immune deficiency identified. White cell count 5.37, neutrophils 3.1, lymphocytes 1.84, monocytes 0.35, all normal. IgG 15.4 at the top of range and globulin 33 raised, both consistent with an immune system responding to persistent infection. IgA 1.2 is within normal limits but toward the lower end, and IgA is the antibody defending mucous membranes including the mouth.\n\nVitamin B12 241, within the laboratory range but below the ideal 300. Relevant to oral tissue renewal. RDW 15.4, above range, indicating variation in red cell size which often precedes a measurable deficiency. Iron and folate are adequate, leaving B12 as the likely cause.\n\nVitamin D 68, below the ideal 100. Associated with periodontal disease through both bone maintenance and immune function.\n\nCoeliac screen negative and reliable, since IgA at 1.2 is not deficient. No evidence of broad malabsorption, with albumin 41 and total protein 74 both healthy. B12 absorption specifically warrants investigation given age, digestive symptoms and the RDW.\n\nVITAMIN C WAS NOT MEASURED by this panel. It was specifically raised by the periodontist and should be requested through the GP. The Total Antioxidant Status of 1.56 is a broad measure and is not a substitute.\n\nMEDICATION: lercanidipine is a dihydropyridine calcium channel blocker, a class associated with gingival overgrowth, which deepens periodontal pockets and can make the disease harder to control. To be discussed with GP and periodontist. Not to be stopped independently.\n\nFOR THE GP\n\nCystatin C 1.44, above the limit of 1.1, with a Cystatin C based kidney function estimate of 65 against a creatinine based estimate of 87. Cystatin C is the more reliable measure. Monitoring recommended. Urea 8.5 above range and bicarbonate 21.5 toward the lower end are consistent. No protein in urine, which argues against active damage. May affect medication dosing.\n\nLipoprotein(a) 74.65, more than twice the limit of 32. Inherited, fixed, and not lowered by statins. Explains why ApoB remains marginally above target despite an LDL of 2.32. Should be recorded permanently and factored into cardiovascular risk, since standard calculators exclude it. Inherited, so first-degree relatives may wish to be tested.\n\nApoB 0.91, marginally above the 0.9 target. ApoB to ApoA-1 ratio 0.746, above the 0.7 male threshold. ApoA-1 1.22, on the low side.\n\nParathyroid hormone 0.7, below the range starting at 0.98, alongside corrected calcium 2.48 in the upper half of its range and vitamin D of only 68. Repeat of parathyroid hormone, calcium, vitamin D and phosphate together is suggested.\n\nLipase 82, above the limit of 60. Two possible explanations, pancreatic irritation or reduced renal clearance given the Cystatin C. Amylase 84 and CA 19-9 22.2 are essentially normal, making significant pancreatic disease less likely. Repeat alongside kidney function.\n\nNOT RETURNED BY THE LABORATORY: potassium and phosphate. Potassium is commonly rejected when red cells rupture slightly during collection, which makes the reading unreliable. Both are worth including at the next blood test, potassium because blood pressure medication can affect it, and phosphate because it should be read alongside the low parathyroid hormone.\n\nFIB-4 2.19, above the 1.45 threshold. Driven by age and by a platelet count of 178 rather than by liver disease. ALT 35, AST 33, Gamma GT 39, bilirubin 14 and albumin 41 are all normal.\n\nOTHER FINDINGS\n\nOestradiol 163, above the limit of 146. Produced by conversion of testosterone in fat tissue. Lowers with weight loss.\n\nFree testosterone 0.2679, below the ideal 0.3, despite a healthy total testosterone of 18.4, because SHBG at 58.7 is binding much of it. Contributes to fatigue, joint stiffness and difficulty losing fat.\n\nProgesterone 0.58, below range. Minor hormone in men, little clinical weight at this age. Reported for completeness.\n\nSodium 147, marginally above range, with urea 8.5 and MCHC 347 also marginally raised, suggesting slightly concentrated blood. Urine specific gravity of 1.005 is dilute, which may instead reflect reduced urine concentrating ability.\n\nFolate 8, at the very bottom of the ideal range.\n\nRheumatoid factor 5, CRP 1.5 and ESR 1 all low, arguing against rheumatoid arthritis or any inflammatory joint condition despite the joint pain reported.\n\nPSA 2.3 with a free ratio of 57.8%, a reassuring prostate picture. Creatine kinase 135, normal, indicating no statin-related muscle problem. Thyroid normal with negative antibodies. Iron studies healthy throughout. Urine culture showed no growth.","recommendations":"Take this report to your periodontist. The findings she needs are the insulin resistance with diabetes ruled out, the low vitamin B12 and vitamin D, the absence of any immune deficiency, and the negative coeliac screen.\n\nAsk your GP for a vitamin C level, which your periodontist raised and this panel does not include.\n\nDiscuss lercanidipine with your GP and periodontist, as it belongs to a family of blood pressure medicines linked to gum tissue overgrowth. Do not stop or change it yourself.\n\nAsk your GP about the Cystatin C kidney result, which needs monitoring.\n\nAsk for the Lp(a) to be recorded permanently in your notes and taken into account at your next medication review. Let close family know it is inherited.\n\nAsk for a repeat of parathyroid hormone with calcium, vitamin D and phosphate on one sample. Potassium and phosphate were not returned by the laboratory this time, so ask for both to be included.\n\nGet your sleep from under six hours to seven or eight, starting with a fixed wake time every day.\n\nAdd resistance training twice a week alongside your existing cardio.\n\nIncrease protein to 96 to 128g a day spread across meals, and walk for ten to fifteen minutes after your largest meal.\n\nRetest in twelve weeks.","supplementation":"Vitamin B12 as sublingual methylcobalamin at 1,000 micrograms daily, dissolved under the tongue rather than swallowed. This is the most important supplement here and the form matters. Dissolving it under the tongue allows absorption directly through the mouth lining, bypassing the stomach entirely, which is exactly what is needed given the question about whether absorption is impaired. It also doubles as a test. If the level rises on retest, intake was the problem. If it does not, absorption is, and that gives the GP something specific to investigate.\n\nVitamin D3 at 2,000 to 3,000 IU daily, taken with a meal containing some fat since it is fat soluble, alongside vitamin K2 as MK-7 at 100 micrograms. The current level of 68 should be above 100. K2 is paired with it because it helps direct calcium into bone rather than into artery walls, which is worth having in place given the Lipoprotein(a) and the raised calcium alongside a low parathyroid hormone.\n\nVitamin C at 500mg daily, taken with food. Given that the periodontist has specifically raised vitamin C, that the level has not been measured, and that vitamin C is required for collagen production while gums are largely collagen, supplementing at a modest dose while awaiting a test is sensible and carries essentially no risk. It also improves iron absorption from food.\n\nOmega-3 fish oil providing 2g of combined EPA and DHA daily, taken with food. It supports cardiovascular health, which matters given the Lipoprotein(a), and has a genuine anti-inflammatory effect. There is also reasonable evidence for benefit in periodontal disease alongside standard dental treatment.\n\nCoenzyme Q10 at 100 to 200mg daily is worth discussing with the GP. Statins reduce the body's own production of CoQ10 as a side effect of how they work, and there is a reasonable body of research on CoQ10 in gum health specifically. It is not essential and it is not a replacement for periodontal treatment, but given both a statin and a periodontal diagnosis, it is a reasonable conversation to have.\n\nCreatine monohydrate at 3 to 5g daily is worth adding once resistance training is established. It improves strength and recovery, and there is growing evidence it supports muscle retention in older adults, which is directly relevant at 70.\n\nNone of these are the main event. The most valuable changes in this report are the conversations with the periodontist and GP, getting sleep from under six hours to seven or eight, and starting resistance training twice a week. Those three would act on the insulin resistance, the immune function, the fatigue, the joint stiffness, the body fat and the hormone picture all at once, and they would do more than anything in a bottle.","biomarkers":[{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583333333","upper_optimal_position":"0.625","units":"g/L","description":"Within the ideal range at 41. Albumin is the main protein in blood and it falls when someone is genuinely undernourished or losing protein. At 41 it is healthy, which is a useful finding given the question about nutritional deficiency, because it argues against any broad shortage of protein in the diet","low_causes":"Malnutrition, liver disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5238","lower_normal":"7","upper_normal":"56","lower_optimal":"7","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4217687075","units":"U/L","description":"Within the laboratory range at 35, though above the ideal level of 20. ALT is an enzyme that leaks into the blood when liver cells are under strain. This is worth knowing specifically because Andrew takes a statin, and statins are occasionally stopped because of liver concerns. At 35, with AST at 33 and Gamma GT at 39, there is nothing here to suggest the statin is troubling his liver","low_causes":"Rarely significant","high_causes":"Metabolic load, medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alkalinephosphatase","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"46","upper_normal":"116","lower_optimal":"60","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.5904761905","units":"IU/L","description":"Within the ideal range","low_causes":"Nutritional insufficiency","high_causes":"Bone or bile duct conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4583333333","units":"U/L","description":"Within the laboratory range at 33, above the ideal level of 25. AST is found in both liver and muscle. Taken with the normal ALT, Gamma GT and creatine kinase, there is no sign of a liver or muscle problem","low_causes":"Rarely significant","high_causes":"Metabolic load","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gammagt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5024","lower_normal":"4","upper_normal":"73","lower_optimal":"10","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3623188406","upper_optimal_position":"0.4589371981","units":"IU/L","description":"Within range at 39, above the ideal level of 30. Gamma GT is the liver enzyme most sensitive to metabolic workload, rising with alcohol, with a diet high in refined fat and sugar, and with insulin resistance. Given the HOMA-IR of 4.1, the insulin resistance is the most likely contributor here","low_causes":"Rarely significant","high_causes":"Metabolic load, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Bilirubin","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5416666667","units":"umol/L","description":"Within the ideal range","low_causes":"Rarely significant","high_causes":"Liver or gallbladder conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.56","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"75","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.44","upper_optimal_position":"0.5733333333","units":"g/L","description":"Within the ideal range at 74. Another reassuring marker against significant malnutrition","low_causes":"Malnutrition, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"24","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444444444","upper_optimal_position":"0.5925925926","units":"g/L","description":"Marginally above the ideal ceiling at 33, within the laboratory range. Globulins are the antibody-containing fraction of blood protein and they rise modestly when the immune system is dealing with a persistent infection. With active periodontal disease present, a globulin at the upper end is expected and is a sign the immune system is engaged rather than absent","low_causes":"Immune deficiency","high_causes":"Chronic infection, immune activity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.242","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3671","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"Ratio","description":"Within range. Slightly toward the lower end, reflecting the raised globulin rather than any problem with albumin","low_causes":"Liver disease","high_causes":"Not significant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"2.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7552","lower_normal":"","upper_normal":"1.45","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3448275862","units":"","description":"Above the screening threshold at 2.19, and this needs putting in context because the number looks worse than the situation is. FIB-4 is not a measurement, it is a calculation that combines age, the liver enzymes ALT and AST, and the platelet count, to screen for liver scarring. Age sits in the top half of that equation, so the score rises automatically as someone gets older regardless of liver health. At 70, the age term alone pushes almost everyone above 1.45. The platelet count of 178, which is normal but toward the lower end, pushes it up further because platelets sit in the bottom half of the equation.\n\nWhat matters is what the actual liver markers say, and they are reassuring. ALT is 35, AST is 33, Gamma GT is 39, bilirubin is 14 and albumin is 41, all of them normal. A liver with meaningful scarring does not usually produce a set of results like that. This score is very likely age and platelet driven rather than an indication of liver disease, and it is worth mentioning to the GP for that reason rather than as a cause for alarm","low_causes":"Not applicable","high_causes":"Age, lower platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3846","lower_normal":"","upper_normal":"5.2","lower_optimal":"","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4326923077","units":"mmol/L","description":"Within the ideal range at 4.0. The statin is doing its job well on this measure","low_causes":"Rarely significant","high_causes":"Genetics, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3867","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333333333","units":"mmol/L","description":"Within range at 2.32, just above the ideal level of 2. LDL is the cholesterol that gets deposited into artery walls, and this is well controlled on the statin","low_causes":"Rarely significant","high_causes":"Genetics, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.65","lower_normal":"1.0","upper_normal":"","lower_optimal":"1.2","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6","upper_optimal_position":"","units":"mmol/L","description":"The protective cholesterol particle, which collects cholesterol back out of artery walls and returns it to the liver. Within the ideal range at 1.3, though not high. Cardiovascular exercise and resistance training both raise it","low_causes":"Sedentary lifestyle","high_causes":"Exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2559","lower_normal":"","upper_normal":"1.7","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2941176471","units":"mmol/L","description":"Within the ideal range at 0.87. Triglycerides are the form fat takes when travelling in the blood and they rise with refined carbohydrate and alcohol. This is a genuinely good result, and notable given the insulin resistance shown elsewhere","low_causes":"Rarely significant","high_causes":"Refined carbohydrate, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterolratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3422","lower_normal":"","upper_normal":"4.5","lower_optimal":"","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","units":"Ratio","description":"Within the ideal range at 3.08","low_causes":"Not significant","high_causes":"Low HDL or high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdloftotal","name":"HDL % of total","group":"LIPIDS & CARDIOVASCULAR","result":"32.5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"%","description":"Just under a third of total cholesterol is the protective type, which is a healthy proportion","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonhdlcholesterol","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3375","lower_normal":"","upper_normal":"4","lower_optimal":"","upper_optimal":"3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.375","units":"mmol/L","description":"Within the ideal range at 2.7. This is everything except the protective type","low_causes":"Rarely significant","high_causes":"Genetics, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"","upper_normal":"0.78","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3205128205","units":"mmol/L","description":"Within the ideal range","low_causes":"Rarely significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteina1","name":"Apolipoprotein A-1","group":"LIPIDS & CARDIOVASCULAR","result":"1.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3946","lower_normal":"1.04","upper_normal":"2.02","lower_optimal":"1.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4897959184","upper_optimal_position":"0.6598639456","units":"g/L","description":"Within range at 1.22 but below the ideal level of 1.5. ApoA-1 is the protein that sits on protective HDL particles, so this counts the protective particles in the same way ApoB counts the harmful ones. Raising it is one of the few things that reliably responds to exercise, and Andrew currently does no resistance training","low_causes":"Sedentary lifestyle","high_causes":"Exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5056","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","units":"g/L","description":"Marginally above the target at 0.91, against a threshold of 0.9. This deserves explaining because at first glance it looks inconsistent with the excellent LDL of 2.32.\n\nEvery particle capable of depositing cholesterol into an artery wall carries exactly one ApoB protein on its surface, so measuring ApoB counts the particles. LDL measures how much cholesterol those particles are carrying between them. The two usually track together, but they come apart when something other than ordinary LDL is contributing particles. In Andrew's case that something is the Lipoprotein(a) of 74.65, because every Lp(a) particle also carries an ApoB protein and is counted in this total.\n\nSo the statin has brought the LDL down very effectively, but the particle count remains marginally above target because of the inherited Lp(a) sitting behind it. This is worth raising with the GP, because it means the cardiovascular risk is slightly higher than the LDL figure alone would suggest","low_causes":"Rarely significant","high_causes":"Lp(a) contribution, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.746","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5329","lower_normal":"","upper_normal":"0.7","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3571428571","units":"Ratio","description":"Above the male threshold at 0.746, against a limit of 0.7. This compares harmful particles against protective ones. It is being pushed up from both directions, by the ApoB of 0.91 being marginally high and the ApoA-1 of 1.22 being on the low side. Raising the protective side through exercise would improve this ratio even without the ApoB changing","low_causes":"High ApoA-1","high_causes":"Elevated ApoB, low ApoA-1","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.669","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.223","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3","units":"Ratio","description":"Within the ideal range at 0.669. This ratio is often used as a marker of insulin resistance, and here it disagrees with the HOMA-IR of 4.1. That is not unusual. This ratio picks up insulin resistance once it has started to affect blood fats, whereas HOMA-IR detects it earlier, at the stage where insulin levels have risen but the fats have not yet followed. The good triglyceride result is genuinely good news, and it suggests the insulin resistance has not yet spread into the lipid system","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2375","lower_normal":"","upper_normal":"0.8","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3125","units":"mmol/L","description":"Within the ideal range","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"74.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.21875","units":"nmol/L","description":"Above range at 74.65, more than twice the upper limit of 32. This is an important finding and Andrew is unlikely to have been told about it before, because it is not part of a standard cholesterol test.\n\nLp(a), spoken as lipoprotein little a, is a cholesterol-carrying particle similar to LDL but with an additional protein wrapped around it. That extra protein closely resembles a molecule the body uses to break down blood clots, and because it is similar without being identical, it gets in the way of clot clearance rather than helping it. The consequence is that an Lp(a) particle does three things inside an artery wall where ordinary LDL does one. It deposits cholesterol, it encourages clotting at that spot, and it drives inflammation there.\n\nThe level is inherited and fixed. It does not respond to diet, to exercise, to weight loss, or to statins. That last point matters here, because Andrew's statin has controlled his LDL very well but will not have touched this. It explains why the ApoB particle count at 0.91 remains marginally above target despite an LDL of 2.32.\n\nThis should be recorded permanently in his medical notes, and it is worth mentioning to his GP when cardiovascular risk is next reviewed, because standard risk calculators do not include it. It is also inherited, so his children and siblings have a meaningful chance of carrying a raised level and may want to ask about being tested. Treatments that lower Lp(a) directly are in late-stage clinical trials","low_causes":"Genetics","high_causes":"Genetics, inherited and unchangeable","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"6.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.2","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4266666667","upper_optimal_position":"0.5333333333","units":"mmol/L","description":"Above range at 6.5, against an upper limit of 6. This is one of the two findings most relevant to the question Andrew's periodontist has asked, and it should be taken back to her and to his GP.\n\nA fasting glucose above 6 does not mean diabetes. The diagnostic thresholds sit higher, and his HbA1c at 40 confirms he is neither diabetic nor prediabetic. What a raised fasting glucose alongside a HOMA-IR of 4.1 does show is that his body is having to work considerably harder than it should to keep blood sugar where it belongs.\n\nOne practical note for interpretation. Statins are known to raise blood glucose and HbA1c modestly in some people. That does not mean the statin is the cause here, and it is certainly not a reason to stop it, but it is worth the GP being aware of when they look at these numbers","low_causes":"Excess insulin","high_causes":"Insulin resistance, statin effect, sleep restriction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4166666667","units":"mmol/mol","description":"At 40, which is 5.8%. HbA1c reflects average blood sugar across roughly the previous three months by measuring how much sugar has attached itself to red blood cells. The threshold for prediabetes is 42 and for diabetes it is 48, so at 40 Andrew is below both. He is not diabetic.\n\nThis is a genuinely useful answer to give his periodontist, who raised diabetes as a possible underlying cause. The honest version of that answer is that diabetes has been excluded, but that blood sugar regulation is not entirely normal either, and the detail is in the HOMA-IR below","low_causes":"Anaemia, blood loss","high_causes":"Insulin resistance, refined carbohydrate","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"14.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5067","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393124066","upper_optimal_position":"0.4439461883","units":"mIU/L","description":"Within the laboratory range at 14.2 but well above the ideal level of 10. Insulin is the hormone that unlocks cells so glucose can enter and be used for energy. A raised fasting insulin means the body is having to produce extra to get the same job done, which is the definition of insulin resistance","low_causes":"Low pancreatic output","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"473.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3951","lower_normal":"240","upper_normal":"1500","lower_optimal":"400","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3756613757","upper_optimal_position":"0.4814814815","units":"pmol/L","description":"Within the ideal range at 473.3. C-Peptide is released in equal amounts to insulin, so it measures how much insulin the pancreas is genuinely producing. This confirms the pancreas is working properly and keeping up with the extra demand, which is the reason blood sugar has not risen further","low_causes":"Reduced pancreatic function","high_causes":"High insulin demand","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","units":"Ratio","description":"Well above range at 4.1, against a limit of 1.5, so nearly three times the threshold. Alongside the raised fasting glucose, this is the most significant finding relating to his periodontist's question.\n\nHOMA-IR compares fasting glucose against fasting insulin to estimate how well cells are responding to insulin. At 4.1 the cells are responding poorly, and the pancreas is compensating by producing more insulin, which is why the insulin sits at 14.2 while the glucose has only risen to 6.5.\n\nThe connection to gum disease is well established and it runs in both directions. Raised blood sugar and raised insulin impair the immune cells that fight bacteria in the gums, reduce blood supply to the small vessels feeding the gum tissue, and slow the production of collagen that gums are largely made from. In the other direction, the chronic inflammation of periodontal disease itself worsens insulin resistance. Each one makes the other harder to treat, which is precisely why the periodontist was right to ask the question.\n\nThe encouraging part is what is driving it. At BMI 27 with no resistance training and fewer than six hours of sleep most nights, the causes are identifiable and changeable. Sleep restriction alone reduces insulin sensitivity measurably, and muscle is the body's largest site for clearing glucose from the blood","low_causes":"Very high insulin sensitivity","high_causes":"Insulin resistance, sleep restriction, low muscle mass","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"94.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3741","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"Within the ideal range at 94.67. This estimates how hard the insulin-producing cells in the pancreas are working. Combined with the healthy C-Peptide, it shows the pancreas is coping rather than failing, which is the difference between insulin resistance and diabetes","low_causes":"Reduced pancreatic function","high_causes":"Overcompensation","padding":"1","one_sided":"0.5","range_
