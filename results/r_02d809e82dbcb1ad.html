<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

ound 5 to 10% of the population. His FIB-4 score, which is a calculation that estimates liver fibrosis risk using age, platelets, ALT, and AST, is 1.7, above the 1.45 threshold. However, this score is being driven entirely by the calculation rather than by any sign of liver disease. At 57, age pushes the numerator up. His platelets at 161 are at the lower end of normal, which makes the denominator smaller and inflates the result. Every actual liver marker is clean, so the FIB-4 is a mathematical artefact rather than a clinical concern. His lipase, an enzyme produced by the pancreas, is 59, just inside the upper limit of 60, and his amylase is 105, both indicating a healthy pancreas.\n\nHis thyroid is functioning well. TSH, which is the signal from the pituitary gland telling the thyroid how hard to work, is 1.67, sitting comfortably within the optimal range of 1.0 to 2.5. Free T4 is 17.8, within the optimal band of 14 to 20. Free T3, the active thyroid hormone that cells actually use, is 5.0, within the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, ruling out autoimmune thyroid disease.\n\nHis kidney function tells an interesting story. His creatinine-based eGFR is 68, which would suggest mildly reduced function. However, creatinine is produced by muscle, and Lee Roy is a 93kg man training 8 times per week including resistance work and taking 5g of creatine daily. All three of those factors increase creatinine independent of kidney health. His Cystatin C, which is a protein filtered by the kidneys that is not affected by muscle mass, diet, or creatine supplementation, gives a much more accurate picture. His Cystatin C is 0.96, well within the range of below 1.1, and his Cystatin C-based eGFR is 81. This is the number to trust. At 57, this represents good kidney function. His urea at 8.1 is just inside the upper limit and likely reflects his high protein intake from training. Sodium, chloride, and bicarbonate are all within range. Uric acid is 225, just above the lower limit of 220 and well within the optimal range.\n\nHis iron studies are well balanced. Ferritin, which reflects iron stores, is 151, sitting within the optimal range of 50 to 200 for a male. Transferrin saturation at 43% is within range and within the optimal band of 25 to 40% only marginally exceeded. Serum iron at 26.4 and transferrin at 2.44 are both within their respective ranges. His iron binding capacity is healthy at 57. There is no suggestion of iron deficiency or overload.\n\nHis testosterone is 27.1 nmol/L, which is excellent for a 57-year-old male, sitting well within the optimal range of 18 to 30. This is a genuinely strong result. However, his Sex Hormone Binding Globulin, known as SHBG, which is a protein that binds testosterone and makes it unavailable for the body to use, is 70.8 nmol/L, above the upper limit of 65.8. This means that while total testosterone is high, a larger proportion is being bound up and rendered inactive. His calculated free testosterone, which measures what is actually available to tissues, is 0.362 nmol/L, which is within the laboratory range of 0.13 to 1.04 but sits in the lower third. His free androgen index at 38.28 confirms this picture. For a man reporting low libido, this binding pattern is very likely part of the explanation. The body is making plenty of testosterone, but SHBG is sequestering too much of it. SHBG tends to rise with age, with lower body fat (he is not carrying excessive fat at BMI 28.4), and with high training volumes. His elevated FSH at 29.23, above the 18.1 upper limit, and elevated LH at 11.42, above the 9.3 upper limit, are consistent with the testes being asked to work harder by the pituitary. FSH and LH are the signalling hormones from the brain that tell the testes to produce sperm and testosterone respectively. At 57, rising FSH and LH are a normal part of ageing as the testes become slightly less responsive to stimulation. The testosterone level itself is excellent, so the system is working, but it is working harder to maintain that output. His oestradiol at 78 pmol/L is within range, and his progesterone at 0.91 is just inside the lower limit of 0.89, both unremarkable for a male. DHEA-S, which is a precursor hormone produced by the adrenal glands, is 1.7 umol/L (approximately 627 ug/dL), within range. Cortisol at 331 nmol/L is within the expected morning range and does not suggest adrenal stress. Prolactin at 151 is within range.\n\nHis vitamin D is 150 nmol/L, which is excellent and reflects his consistent supplementation. This is well within the optimal range of 75 to 120, in fact slightly above the optimal ceiling, which is not harmful but means he could consider reducing his dose slightly to maintain rather than continue building levels. His magnesium at 0.91 is within the optimal range of 0.85 to 1.05, again reflecting his supplementation. His calcium is 2.49 and corrected calcium is 2.49, both within range. Parathyroid hormone at 1.676 is healthy. His B12 at 390 is within the laboratory range but below the 500 optimal threshold. Given that B12 is critical for nerve function, red blood cell production, and energy metabolism, bringing this into the optimal range would be worthwhile, particularly given his sleep and energy demands. His folate at 8 ng/mL sits right at the optimal threshold.\n\nHis inflammatory markers are mixed. ESR, the erythrocyte sedimentation rate, is an excellent 1, essentially as low as it gets. However, his hs-CRP, which is a more sensitive measure of systemic inflammation, is 1.7 mg/L. While this is well within the laboratory range of below 5, optimal is below 1.0, and at 1.7 there is a low level of background inflammation present. This could relate to his high training volume, his joint pain, his sleep restriction, or a combination of all three. Chronic sleep deprivation under 6 hours is one of the most potent drivers of low-grade inflammation, and this is worth noting.\n\nHis white blood cell count at 3.7 is below the lower limit of 4.0, and his absolute reticulocyte count, which measures the rate at which the bone marrow is producing new red blood cells, is 35.9, below the lower limit of 50. His neutrophils at 2.16 sit just inside the lower limit of 2.0. His lymphocytes at 1.18 are within range. This pattern of mildly suppressed white cells and reticulocyte production, taken together with his very high training volume of 8 sessions per week and sleep restriction of under 6 hours, is consistent with a body that is under significant physical stress with insufficient recovery. The immune system and red cell production are among the first systems the body quietly downregulates when recovery resources are limited. This does not represent a disease process, but it does represent a body running closer to the edge of its recovery capacity than is ideal, and it connects directly to his goals of building muscle and improving sleep.\n\nHis IgM, one of the five classes of immunoglobulin, is 0.3 g/L, below the lower limit of 0.5. IgM is the first antibody the immune system produces in response to a new infection. An isolated low IgM with normal IgG at 10.0 and normal IgA at 2.2 is most commonly a benign finding, but it should be flagged to his GP for awareness and repeated on a future test to confirm it is stable. It can occasionally be seen with heavy training loads and chronic sleep deprivation, consistent with his pattern.\n\nHis MCH, which measures the average amount of haemoglobin in each red blood cell, is 32.9 pg, marginally above the upper limit of 32. His MCV at 97.6 is within range but towards the upper end. Together these suggest slightly larger, haemoglobin-rich red cells, which can be associated with suboptimal B12 or folate status, and his B12 is indeed below optimal. This is another reason to optimise B12 intake. His total antioxidant activity at 1.87 is above the upper limit of 1.77, which is driven by his supplementation and is not a concern. Creatine kinase at 184 is within range and healthy for his training volume.\n\nHis urinalysis is clean. No protein, glucose, ketones, blood cells, or nitrites detected. Bacterial count and urine culture results are pending.\n\nIn summary, Lee Roy is a metabolically healthy, well-trained 57-year-old with excellent glucose control, strong testosterone production, a healthy liver, and good kidney function when measured by the appropriate marker for his body composition. The findings that need attention are, in order of importance: his very high Lp(a), which should be discussed with his cardiologist given his AF history and ablation; his mildly elevated ApoB and LDL, which in the context of that Lp(a) become more significant than they would be alone; his mildly elevated CEA, which his GP should be aware of; his low IgM, which should be monitored; and his elevated SHBG, which explains his low libido despite excellent testosterone. The thread connecting his suppressed white cells, low reticulocytes, joint pain, poor sleep, and raised CRP is his recovery deficit. He is training at a very high volume on less than 6 hours of sleep, and the body is showing early signs that it cannot fully keep up with that demand.","links":"The most impactful change Lee Roy can make is not a supplement or a dietary adjustment. It is sleep. At under 6 hours most nights with 8 training sessions per week, his body is in a recovery deficit that is visible across multiple markers: suppressed white cells, low reticulocyte production, elevated hs-CRP, and the joint pain and low libido he reports. Sleep is when testosterone is produced, when muscle is repaired, when the immune system rebuilds, and when inflammation is cleared. Extending sleep to 7 to 8 hours would likely improve every symptom he has listed. Practical steps include fixing a consistent wake time 7 days a week, getting outside within an hour of waking to anchor the circadian rhythm, cutting caffeine entirely after midday, keeping the bedroom cool at around 17 to 18 degrees, avoiding screens for at least 30 minutes before bed, and if his mind races at night, using a written to-do list before bed to offload the mental load. His magnesium glycinate supplementation before bed is already supporting this, and that should continue.\n\nFor his Lp(a) finding, Lee Roy should book an appointment with his cardiologist or GP to discuss this result. The key numbers to bring are Lp(a) above 212.5 nmol/L (high-risk category, threshold 32), ApoB 0.92 (above 0.9 target), and LDL 3.31 (above 3.0). He should explain that Lp(a) is genetically fixed and ask for it to be recorded permanently in his medical notes. Given his history of atrial fibrillation and pulsed field ablation, the cardiologist may wish to discuss whether statin therapy or PCSK9 inhibitor therapy is appropriate to bring his LDL and ApoB as low as possible, because with a fixed and very high Lp(a), the modifiable fraction of atherogenic particles (LDL) becomes the only lever available. He should also encourage his siblings and any children to have their Lp(a) tested.\n\nFor dietary changes to support his lipid profile, Lee Roy should increase his intake of soluble fibre, which binds cholesterol in the gut and removes it. Good sources include oats (a bowl of porridge daily provides around 3g of beta-glucan), beans, lentils, and ground flaxseed. He should aim for oily fish at least 3 times per week (salmon, mackerel, sardines) for the omega-3 content, which supports HDL function and reduces triglycerides. He should reduce saturated fat where practical, particularly from processed meats, cheese, and butter, replacing with olive oil, avocado, and nuts. Adding a handful of almonds or walnuts daily has evidence for reducing LDL by around 5 to 7%.\n\nFor his body composition goals, Lee Roy's maintenance calories at 93kg, 181cm, 57 years old, and his very active training schedule are approximately 2,700 to 2,900 kcal per day. To lose body fat while preserving muscle, a deficit of 300 to 500 kcal per day is appropriate, targeting 2,200 to 2,600 kcal daily. His protein intake should be at least 1.6g per kg of body weight given his resistance training, which gives a minimum of 149g of protein per day, ideally closer to 170 to 185g per day spread across 4 meals. A reasonable target would be to move from 93kg towards 85 to 88kg over the next 6 to 9 months, losing approximately 0.5kg per week. This pace preserves muscle and is sustainable. His diet quality at 5 out of 10 and volume at 5 out of 10 suggest there is room to improve the nutritional density of what he eats. Increasing vegetable intake, ensuring adequate fibre (30g per day minimum), and reducing ultra-processed foods would improve diet quality meaningfully.\n\nFor his training, 8 sessions per week is a very high volume, and with under 6 hours of sleep, this is likely exceeding his recovery capacity. Rather than training less, the first priority should be sleeping more. If sleep cannot be extended immediately, consider reducing to 6 sessions per week (3 resistance, 3 cardio) temporarily until sleep improves, then building back up. Quality of recovery is as important as quality of training for muscle growth.\n\nFor the elevated CEA, his GP should be informed. The number to bring is CEA 3.97 ng/mL against a non-smoker upper limit of 2.3. The GP may wish to repeat this in 6 to 8 weeks to confirm whether it is stable, rising, or was a transient elevation. No immediate investigation is typically triggered at this level, but it should be on record.\n\nFor his low IgM at 0.3, the GP should be made aware and this should be repeated on his next blood test to confirm it is stable.\n\nFor his B12 at 390, supplementation with sublingual methylcobalamin at 1,000 mcg daily would bring this into the optimal range of 500 to 900 and may help with the slightly elevated MCH and MCV, as well as supporting nerve function and energy levels.\n\nA retest in 4 to 6 months is recommended, focusing on: full lipid panel including ApoB to track the response to dietary changes, CEA to confirm stability, IgM to confirm it remains stable, full blood count to reassess white cells and reticulocytes after sleep improvement, and B12 to confirm supplementation is working.","flags":"CARDIOVASCULAR (GP/CARDIOLOGIST): Lp(a) above 212.5 nmol/L (threshold 32 nmol/L, high-risk category). Genetically fixed, permanently elevated. In the context of his 2025 cardiac ablation for atrial fibrillation, this adds significant inherited cardiovascular risk. Recommend permanent medical record entry, first-degree relative testing, and discussion with cardiologist regarding pharmacological LDL lowering. LDL 3.31 mmol/L (upper limit 3.0), ApoB 0.92 g/L (target below 0.9). Modest elevations in isolation but clinically more significant alongside very high Lp(a). ApoB/A-I ratio 0.59, below 0.7 threshold, which is reassuring. HDL 1.5, triglycerides 0.95, both favourable.\n\nTUMOUR MARKERS (GP): CEA 3.97 ng/mL (non-smoker upper limit 2.3). Mild elevation. Can be raised by exercise, age, and low-grade inflammation. Recommend repeat in 6 to 8 weeks to confirm stability. PSA 0.54 with free ratio 46.3%, CA 19-9 below 1.2: all reassuringly normal.\n\nIMMUNOLOGY (GP): IgM 0.3 g/L (lower limit 0.5). Isolated low IgM with normal IgG and IgA. Most likely benign but should be repeated to confirm stability. May relate to heavy training load and chronic sleep restriction.\n\nHAEMATOLOGY: WBC 3.7 (lower limit 4.0). Absolute reticulocytes 35.9 (lower limit 50). MCH 32.9 pg (upper limit 32). Pattern consistent with high training volume, sleep deprivation, and suboptimal B12 rather than primary haematological disease. Neutrophils 2.16, just within range. Recommend monitoring after sleep and B12 optimisation.\n\nHORMONES: SHBG 70.8 nmol/L (upper limit 65.8). FSH 29.23 (upper limit 18.1). LH 11.42 (upper limit 9.3). Elevated SHBG is reducing bioavailable testosterone despite excellent total testosterone of 27.1. Rising FSH and LH are consistent with age-related gonadal change. Free testosterone 0.362 is within range but in the lower third, likely contributing to reported low libido.\n\nKIDNEY: Creatinine 105 (upper limit 104) with creatinine-based eGFR 68. Explained by muscle mass, training, and creatine supplementation. Cystatin C 0.96 (below 1.1) with Cystatin C eGFR 81 is the reliable measure and indicates good kidney function.\n\nGLUCOSE: C-Peptide 0.657 ug/L (lower limit 1.1). Low in the context of very low insulin demand. Glucose 4.3 and HbA1c 33 are both optimal, confirming this reflects metabolic efficiency, not pancreatic insufficiency.\n\nLIVER: FIB-4 1.7 (threshold 1.45). Driven by age, lower-end platelets, and the calculation mechanics. All direct liver markers (ALT 23, AST 23, GGT 19, bilirubin 21, albumin 42) are within range. No clinical concern.\n\nReassuring negatives: Thyroid function optimal with negative antibodies. PSA excellent with high free ratio. Iron studies balanced. Glucose metabolism exceptional. Liver enzymes clean. ESR 1. Urinalysis clean. Rheumatoid factor negative. Coeliac screen negative. Calcium and PTH normal. No evidence of autoimmune disease.","recommendations":"1. Prioritise extending sleep to 7 to 8 hours per night. This is the single most impactful change for muscle building, fat loss, libido, joint recovery, immune function, and inflammation. Fix wake time, get morning light, cut caffeine after midday, cool bedroom to 17 to 18 degrees.\n\n2. Book an appointment with cardiologist or GP to discuss Lp(a) above 212.5 nmol/L in the context of AF history and ablation. Bring full lipid results. Ask for Lp(a) to be recorded permanently. Discuss whether pharmacological LDL lowering is appropriate.\n\n3. Encourage first-degree relatives to have Lp(a) tested.\n\n4. Increase soluble fibre intake: daily porridge, beans, lentils, ground flaxseed. Aim for 30g total fibre daily. Eat oily fish 3 times per week. Reduce saturated fat from processed meats, cheese, and butter. Add a handful of nuts daily.\n\n5. Target 2,200 to 2,600 kcal daily for gradual fat loss at 0.5kg per week. Protein minimum 149g per day, ideally 170 to 185g, spread across 4 meals. Target weight: 85 to 88kg over 6 to 9 months.\n\n6. Consider temporarily reducing training to 6 sessions per week until sleep is consistently 7 or more hours.\n\n7. Begin sublingual methylcobalamin 1,000 mcg daily for B12 optimisation.\n\n8. Reduce vitamin D dose to a maintenance level of 1,000 to 2,000 IU daily given current level of 150 nmol/L. Continue K2 alongside.\n\n9. Continue magnesium glycinate before bed and creatine monohydrate 5g daily.\n\n10. Add omega-3 fish oil 2 to 3g combined EPA and DHA daily to support cardiovascular health and reduce inflammation.\n\n11. Inform GP of CEA 3.97 and request repeat in 6 to 8 weeks.\n\n12. Inform GP of IgM 0.3 for monitoring.\n\n13. Retest in 4 to 6 months: full lipid panel with ApoB, CEA, IgM, full blood count, B12.","supplementation":"Vitamin D3 (cholecalciferol): Reduce to 1,000 to 2,000 IU daily, taken with a fat-containing meal. Lee Roy's current level of 150 nmol/L is above the optimal ceiling of 120 and shows his supplementation has been very effective. A maintenance dose will keep him in the 75 to 120 optimal range without continuing to build levels higher. Continue taking vitamin K2 (MK-7) at 100 to 200 mcg alongside vitamin D, as K2 directs calcium into bone rather than arteries, which is particularly relevant given his cardiovascular history.\n\nMagnesium glycinate: Continue at 300 to 400 mg before bed. His level at 0.91 is within the optimal range of 0.85 to 1.05. Glycinate is the ideal form for sleep support, and given his insomnia and high training load, this supplement is well chosen and should not be changed.\n\nCreatine monohydrate: Continue at 5g daily. This is well supported by evidence for muscle strength, recovery, and cognitive function. It does increase creatinine levels, which is why his creatinine-based eGFR appears low at 68, but his Cystatin C confirms his kidneys are healthy. No change needed.\n\nVitamin B12 (sublingual methylcobalamin): Begin 1,000 mcg daily, taken in the morning. His B12 at 390 is below the optimal threshold of 500, and his slightly elevated MCH at 32.9 suggests early red cell enlargement that can occur with suboptimal B12. Sublingual methylcobalamin bypasses the gut for better absorption and is the preferred form. This should be retested in 4 to 6 months.\n\nOmega-3 fish oil: Begin 2 to 3g of combined EPA and DHA daily, taken with food. This supports cardiovascular health by improving HDL function, reducing triglycerides, and has anti-inflammatory properties relevant to both his elevated hs-CRP and his joint pain. Given his very high Lp(a) and the inflammatory component of arterial disease, omega-3 provides a meaningful additional layer of cardiovascular support.\n\nThe most important changes from this report are not supplements. They are sleeping 7 to 8 hours per night, discussing his Lp(a) and lipid results with his cardiologist, increasing soluble fibre and oily fish in his diet, and ensuring his training volume matches his recovery capacity.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. Lee Roy's result of 4.3 mmol/L is within the optimal range of 4.0 to 5.4, indicating that his body is controlling blood sugar efficiently at rest. This is an excellent result for a 57-year-old male and reflects strong metabolic health.","low_causes":"Prolonged fasting, excessive exercise, insulin overproduction, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, medications such as corticosteroids, excessive carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the past two to three months. Lee Roy's result of 5.2% is well within the normal range of below 6.0% and below the pre-diabetes threshold of 6.0 to 6.4%. This confirms excellent long-term glucose control.","low_causes":"Haemolytic anaemia, recent blood loss, chronic kidney disease","high_causes":"Pre-diabetes, type 2 diabetes, iron deficiency, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the IFCC-standardised measurement of HbA1c, expressing the same information as the percentage value in different units. Lee Roy's result of 33 mmol/mol is below the optimal threshold of 36 and well below the pre-diabetes cutoff of 42. This is an excellent result.","low_causes":"Haemolytic anaemia, recent blood loss","high_causes":"Pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3348","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3253","upper_optimal_position":"0.4055","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas needs to release to keep blood sugar under control. Lee Roy's result of 2.9 mIU/L is at the lower end of the laboratory range and within the optimal band of 2 to 8. A low fasting insulin in the context of normal blood sugar and HbA1c indicates excellent insulin sensitivity, meaning his body needs very little insulin to manage glucose. This is a marker of strong metabolic health.","low_causes":"Very high insulin sensitivity, low carbohydrate diet, prolonged fasting, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"217","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1318","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1456","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It provides a reliable measure of how much insulin the body is actually producing. Lee Roy's result converts to approximately 217 pmol/L (from 0.657 ug/L), which falls below the laboratory reference range of 364 to 1456 pmol/L. However, this is entirely consistent with his very low insulin demand. When the body is as insulin-sensitive as Lee Roy's, the pancreas simply does not need to produce much insulin, and C-Peptide falls accordingly. With both fasting glucose and HbA1c in the optimal range, this reflects metabolic efficiency rather than pancreatic insufficiency.","low_causes":"Very high insulin sensitivity, low carbohydrate diet, type 1 diabetes, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and insulin to estimate how resistant the body's cells are to insulin. Lee Roy's result of 0.55 indicates excellent insulin sensitivity. A value below 1.0 is optimal, and his sits at the lower end of the range. For a 57-year-old male at BMI 28.4, this degree of insulin sensitivity is impressive and reflects the positive metabolic effects of his high training volume.","low_causes":"Very high insulin sensitivity, very low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"72.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2354","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the function of the pancreatic beta cells, which are responsible for producing insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Lee Roy's result of 72.5 falls just below the reference range of 80 to 200. However, with fasting glucose at 4.3 and HbA1c at 33, both in the optimal range, the low HOMA-B reflects that his pancreas is producing exactly the amount of insulin needed, which in his case is very little due to his excellent insulin sensitivity. This is not a sign of pancreatic failure.","low_causes":"Very high insulin sensitivity requiring minimal insulin production, type 1 diabetes, advanced type 2 diabetes with beta cell exhaustion","high_causes":"Insulin resistance requiring compensatory insulin production, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5067","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting the liver's synthetic capacity and the immune system's protein production. Lee Roy's result of 70 g/L is within the laboratory reference range of 57 to 82, indicating normal protein metabolism.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease with protein loss","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. Lee Roy's result of 42 g/L is within the optimal range, reflecting healthy liver synthetic function and adequate nutritional status.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"23","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4259","upper_optimal_position":"0.6481","units":"g/L","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies) and transport proteins. Lee Roy's result of 28 g/L is within the laboratory reference range, indicating normal immune protein levels and liver function.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides insight into the balance between the liver's protein production and immune system activity. Lee Roy's ratio of 1.50 is within the optimal range, reflecting a healthy balance.","low_causes":"Liver disease, autoimmune conditions, overproduction of immunoglobulins","high_causes":"Immune deficiency, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, and bile ducts. It is used to assess liver and bone health. Lee Roy's result of 60 IU/L is within the normal range, indicating healthy liver and bone metabolism.","low_causes":"Malnutrition, hypothyroidism, zinc deficiency","high_causes":"Liver disease, bile duct obstruction, bone disorders, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6458","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. Lee Roy's result of 21 umol/L sits at the upper boundary of the normal range. With every other liver marker in excellent health, this likely reflects a degree of Gilbert's syndrome, a harmless inherited variation in bilirubin processing that affects around 5 to 10% of the population. It does not indicate liver disease and does not require treatment.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2054","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme predominantly found in the liver. When liver cells are damaged, ALT leaks into the bloodstream. Lee Roy's result of 23 IU/L is within the optimal range of below 30 for a male, indicating that the liver is not under any metabolic strain.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, alcohol excess, medication effects, viral hepatitis, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It rises when any of these tissues are damaged. Lee Roy's result of 23 IU/L is within the normal range and consistent with healthy liver and muscle function despite his high training volume.","low_causes":"Not clinically significant","high_causes":"Liver disease, heart damage, intense exercise, muscle injury, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5862","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that uses age, platelet count, ALT, and AST to estimate the likelihood of liver fibrosis (scarring). Lee Roy's result of 1.7 is above the standard threshold of 1.45 but below 2.0. At 57, age contributes significantly to the numerator of this calculation, and his platelets at 161, while normal, are at the lower end, which makes the denominator smaller and inflates the score. Every direct liver marker, including ALT, AST, GGT, bilirubin, and albumin, is within normal range, indicating that the elevated FIB-4 is a mathematical artefact rather than a sign of liver disease. The lab note itself states that a score below 2 can be insignificant in the absence of other clinical indicators.","low_causes":"Young age, high platelet count","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelet count, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1301","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"Gamma GT, or gamma-glutamyl transferase, is an enzyme found in the liver and bile ducts. It is one of the most sensitive markers for liver stress, particularly from alcohol, medications, or metabolic overload. Lee Roy's result of 19 IU/L is well below the optimal threshold of 25 and indicates a liver under no metabolic strain whatsoever. This is an excellent result.","low_causes":"Not clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"105","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5284","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch into sugars. Lee Roy's result of 105 IU/L is within the normal range of 30 to 118, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis with pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic obstruction, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6454","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down fats. It is a more specific marker for pancreatic health than amylase. Lee Roy's result of 59 U/L is just inside the upper limit of 60, indicating normal pancreatic function. This does not represent a concern.","low_causes":"Chronic pancreatitis with loss of function","high_causes":"Acute pancreatitis, pancreatic obstruction, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol" .5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein cholesterol, is often called 'bad cholesterol' because it deposits cholesterol into artery walls, driving atherosclerosis. Lee Roy's result of 3.31 mmol/L is above the upper limit of 3.0 and above the optimal target of below 2.6. In isolation, this would represent a modest elevation manageable through dietary changes. However, in the context of his very high Lp(a) above 212.5, every additional LDL particle adds to an already elevated inherited atherogenic burden, making reduction of LDL particularly important.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, sedentary lifestyle, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3856","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a simple measure of the balance between harmful and protective cholesterol. Lee Roy's ratio of 3.47 is within the desirable range of below 4.5 and within the optimal band of below 4.0, which is a positive finding.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"28.85","within_normal":"TRUE","within_optimal":"TRUE","result_position" ption":"Apolipoprotein A1 is the main structural protein on HDL particles. It reflects the number and function of protective HDL particles. Lee Roy's result of 1.57 g/L is above the 1.20 desirable threshold and within the optimal range, indicating good protective lipoprotein function.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein present on every LDL, VLDL, and Lp(a) particle. It is considered the single best measure of atherogenic particle number because each harmful particle carries exactly one ApoB molecule. Lee Roy's result of 0.92 g/L is above the desirable threshold of 0.9 and above the optimal target of below 0.8. Given his very high Lp(a), some of his ApoB is coming from Lp(a) particles, which cannot be reduced by lifestyle changes, making LDL reduction through diet and potentially medication the key strategy.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Elevated LDL, elevated Lp(a), genetics, diet high in saturated fat, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.586","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4186","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful atherogenic particles to the number of protective HDL particles. It is one of the best summary metrics for cardiovascular risk. Lee Roy's ratio of 0.586 is below the 0.7 lower-risk threshold, which is genuinely reassuring and reflects strong protective lipoprotein function offsetting some of his atherogenic burden.","low_causes":"High HDL, low LDL, excellent lipid metabolism","high_causes":"High LDL, low HDL, metabolic syndrome, high Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It promotes atherosclerosis through three mechanisms: it deposits cholesterol into artery walls like LDL, it interferes with natural clot-dissolving processes (making blood more prone to clotting), and it drives inflammation within vessel walls. Lee Roy's result is above 212.5 nmol/L, which places him in the high-risk category. Lp(a) levels are entirely inherited and cannot be changed by diet, exercise, supplements, or any currently available lifestyle intervention. This result should be recorded permanently in his medical notes and never needs to be repeated because it does not change over a lifetime. First-degree relatives should be tested. Given his history of atrial fibrillation and cardiac ablation, this finding is particularly important context for his cardiologist.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited). Cannot be modified by lifestyle.","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2100","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin sensitivity and atherogenic particle pattern. A low ratio indicates a healthy pattern of large, buoyant LDL particles rather than small, dense, dangerous ones. Lee Roy's ratio of 0.63 is within the optimal range of below 0.87, which is an excellent result and consistent with his outstanding insulin sensitivity.","low_causes":"Excellent insulin sensitivity, healthy lipid metabolism","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2438","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as independent contributors to cardiovascular risk. Lee Roy's result of 0.39 mmol/L is within the optimal range of below 0.5, indicating a healthy remnant particle level.","low_causes":"Low triglycerides, excellent metabolic health","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver. It is used to assess both general inflammation and cardiovascular risk. Lee Roy's result of 1.7 mg/L is within the laboratory range of below 5 but above the optimal threshold of below 1.0. At this level, there is low-grade background inflammation present, which could relate to his high training volume, chronic sleep restriction of under 6 hours, joint pain, or a combination of these factors.","low_causes":"Low inflammation, healthy lifestyle, statin use","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, intense exercise, sleep deprivation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle in a test tube over one hour. A higher rate suggests inflammation. Lee Roy's result of 1 mm/hour is essentially as low as this marker gets, indicating minimal systemic inflammation from the ESR perspective. Combined with a negative rheumatoid factor, this makes inflammatory arthritis very unlikely as a cause of his joint pain.","low_causes":"Not clinically significant","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5179","units":"mmol/L","description":"Sodium is the primary electrolyte that regulates fluid balance and blood pressure. Lee Roy's result of 144 mmol/L is within the normal range and within the optimal band, indicating healthy fluid and electrolyte balance.","low_causes":"Excess fluid intake, diuretics, heart failure, kidney disease, adrenal insufficiency","high_causes":"Dehydration, excess sodium intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5179","units":"mmol/L","description":"Chloride is an electrolyte that works with sodium to maintain fluid balance and is a component of stomach acid. Lee Roy's result of 96 mmol/L is within the laboratory range but near the lower boundary. This is not clinically significant.","low_causes":"Vomiting, excess sweating, metabolic alkalosis, diuretics","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"21.3","within rom the breakdown of purines, which are found in many foods and in the body's own cells. Lee Roy's result of 225 umol/L is within the optimal range of 200 to 380 for a male. Elevated uric acid is associated with gout and kidney stones, so this healthy level is reassuring.","low_causes":"Low purine diet, certain medications, Wilson's disease","high_causes":"High purine diet (red meat, organ meats, shellfish), alcohol, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6400","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3393","upper_optimal_position":"0.6193","units":"mmol/L","description":"Urea is a waste product created when the liver breaks down protein. The kidneys filter urea out of the blood. Lee Roy's result of 8.1 mmol/L is just inside the upper limit of 8.2, which likely reflects his high protein intake from resistance training rather than any kidney dysfunction. His Cystatin C-based eGFR confirms healthy kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"105","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6752","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6496","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. Lee Roy's result of 105 umol/L is marginally
