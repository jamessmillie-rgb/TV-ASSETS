n":"0.5962","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the testes to produce testosterone. Lee Roy's result of 11.42 mIU/mL is above the upper limit of 9.3, indicating that the pituitary is sending a stronger than normal signal to the testes. At 57, this is a normal part of ageing as the testes become slightly less responsive, requiring more LH stimulation. The fact that his testosterone is an excellent 27.1 shows that the system is responding well despite needing to work harder.","low_causes":"Pituitary disorders, exogenous testosterone use, obesity","high_causes":"Primary hypogonadism, testicular dysfunction, ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"29.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8896","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5698","units":"mIU/mL","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and stimulates sperm production in the testes. Lee Roy's result of 29.23 mIU/mL is significantly above the upper limit of 18.1. In men, FSH rises with age as the testes become less responsive to stimulation. An elevated FSH alongside elevated LH is consistent with age-related gonadal change. His testosterone remains excellent, indicating that the hormonal axis is compensating effectively.","low_causes":"Pituitary disorders, exogenous testosterone use, obesity","high_causes":"Primary testicular insufficiency, ageing, Klinefelter syndrome, prior chemotherapy or radiation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"27.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5914","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, fat distribution, libido, mood, and energy. Lee Roy's result of 27.1 nmol/L is excellent for a 57-year-old male, sitting well within the optimal range of 18 to 30. This is a genuinely strong result that shows robust testosterone production. However, total testosterone does not tell the full story because SHBG (sex hormone binding globulin) binds much of it, and his SHBG is elevated.","low_causes":"Ageing, obesity, pituitary disorders, chronic illness, medications, sleep deprivation","high_causes":"Exogenous testosterone therapy, anabolic steroid use, tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"151","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4394","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6136","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland. In males, elevated prolactin can suppress libido and testosterone production. Lee Roy's result of 151 uIU/mL is within the normal range and does not explain his low libido symptoms. The SHBG-driven reduction in free testosterone is the more likely contributor.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"38.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3567","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"","description":"The free androgen index (FAI) is a calculation that estimates the proportion of testosterone that is biologically active, by dividing total testosterone by SHBG. Lee Roy's FAI of 38.28 is within the laboratory range of 30 to 150 but below the optimal threshold of 50. This reflects the impact of his elevated SHBG, which is binding a larger proportion of his testosterone and reducing the amount available to tissues. Despite excellent total testosterone, his FAI confirms that less testosterone is functionally available, which may contribute to his reported low libido.","low_causes":"Elevated SHBG, ageing, liver disease, hyperthyroidism","high_causes":"Low SHBG, obesity, insulin resistance, polycystic ovary syndrome (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"626.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4472","lower_normal":"162.1","upper_normal":"4940.1","lower_optimal":"300","upper_optimal":"3500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3622","upper_optimal_position":"0.6320","units":"ug/dL","description":"DHEA sulphate is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. Lee Roy's result of 1.7 umol/L (approximately 626.5 ug/dL) is within the laboratory range. DHEA-S naturally declines with age, and this level is within expected values for a 57-year-old male.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, polycystic ovary syndrome (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"70.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7024","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3822","upper_optimal_position":"0.5709","units":"nmol/L","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds testosterone and oestradiol, making them unavailable for the body to use. Lee Roy's result of 70.8 nmol/L is above the upper limit of 65.8. When SHBG is elevated, it binds a greater proportion of total testosterone, reducing the free (active) testosterone available to tissues. This is the most likely explanation for Lee Roy's reported low libido despite his excellent total testosterone. SHBG tends to rise with age, high training volumes, lower body fat, and hyperthyroidism. His thyroid function is normal, so age and training volume are the most probable drivers.","low_causes":"Obesity, insulin resistance, type 2 diabetes, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, low body fat, high training volume, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.362","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4212","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.35","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4088","upper_optimal_position":"0.5627","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone that is not bound to SHBG or albumin and is available for the body to use in tissues. Lee Roy's result of 0.362 nmol/L is within the laboratory range te, TSH drops. Lee Roy's TSH of 1.67 is within the optimal range of 1.0 to 2.5, indicating that the pituitary is satisfied with the thyroid's hormone output. This is an excellent result.","low_causes":"Hyperthyroidism, overmedication with thyroid hormone, pituitary insufficiency","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use for energy production and metabolism. Lee Roy's result of 5.0 pmol/L is within the optimal range of 4.5 to 6.5, confirming healthy thyroid hormone conversion and cellular availability.","low_causes":"Hypothyroidism, low T4, illness (sick euthyroid syndrome), calorie restriction","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence suggests autoimmune thyroid disease such as Hashimoto's thyroiditis. Lee Roy's result is below 6.6 U/mL, well within the normal range of below 13.8, aged, whether from exercise, injury, or disease. Lee Roy's result of 184 U/L is within the normal range of 40 to 320 and consistent with his active resistance training programme. This is a healthy result for someone training at his intensity.","low_causes":"Very low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0771","lower_normal":"0","upper_normal":"3.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"ng/mL","description":"Prostate-specific antigen (PSA) is a protein produced by the prostate gland. It is used as a screening marker for prostate health. Lee Roy's result of 0.54 ng/mL is well within the normal range of below 3.5 and well within the optimal range, indicating a healthy prostate. This is an excellent result for a 57-year-old male.","low_causes":"Not clinically significant","high_causes":"Benign prostatic hyperplasia (enlarged prostate), prostatitis, prostate cancer, recent ejaculation, vigorous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the unbound fraction of total PSA. The ratio of free to total PSA helps distinguish between benign and malignant prostate conditions. Lee Roy's free PSA of 0.25 ug/L is well within range.","low_causes":"Not applicable when total function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
