. Your calculated osmolality is 285.4, within the optimal range. Despite reporting frequent dehydration, the blood's overall concentration is normal, which is reassuring. The dehydration sensation may be driven more by the elevated blood sugar causing increased urination and thirst than by a true deficit in blood volume.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product produced when the liver breaks down protein. The kidneys filter it out. Your urea is 5.6, comfortably within the optimal range, confirming healthy kidney clearance and balanced protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3162","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. Your creatinine is 63, two points below the lower limit of 65. Creatinine reflects muscle mass as much as kidney function, and at 138 kg with no resistance training, a significant proportion of the body weight is fat rather than muscle, which reduces creatinine production. This is not a kidney concern; the Cystatin C eGFR of 107 confirms excellent kidney filtration.","low_causes":"Low muscle mass, very high BMI with low lean mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"ml/min/1.73m2","description":"The eGFR (estimated glomerular filtration rate) from creatinine estimates how well the kidneys are filtering. Your eGFR is above 90, in the normal range. However, at a very high BMI with low muscle mass, creatinine-based eGFR can overestimate kidney function. The Cystatin C eGFR of 107 confirms that the kidneys are genuinely healthy.","low_causes":"Kidney disease, dehydration, medication effects","high_causes":"","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4136","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a protein produced by all cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate measure of kidney function at high or very low body weights. Your Cystatin C is 0.91, within the optimal range, confirming that the kidneys are filtering well. This is the most reliable kidney marker in this report given your BMI.","low_causes":"","high_causes":"Kidney disease, inflammation, thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"107","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8917","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C for the most accurate estimate of kidney filtration. Your combined eGFR is 107, confirming excellent kidney function. This is the most reliable of the three eGFR values in this report.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"88.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6050","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal causes of raised urea (such as dehydration or high protein intake) and kidney disease itself. Your ratio is 88.9, within the optimal range. The slightly higher end reflects the low creatinine from low muscle mass rather than any kidney issue.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"H ncy, bleeding, post-surgery","padding":"1","one_sided":"0","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7667","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6667","units":"fL","description":"MPV (mean platelet volume) measures the average size of your platelets. Your MPV is 11, above the upper limit of 10.1. Larger platelets are often seen when the platelet count is at the lower end, because the bone marrow produces bigger, younger platelets to compensate. It can also be associated with metabolic syndrome and insulin resistance. In the context of a borderline-low count of 149, this is a compensatory finding rather than a concern in its own right.","low_causes":"Inflammatory conditions, bone marrow suppression","high_causes":"Low platelet count (compensatory), metabolic syndrome, diabetes, thrombocytopenia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4700","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The reticulocyte count shows how actively the marrow is producing new red cells. Your reticulocyte count is 1.32%, within the optimal range, confirming healthy and appropriate red cell production.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression, kidney disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia treatment g iron. Your saturation is 33.7%, within the optimal range of 25 to 40%. This confirms a healthy balance between iron supply and iron transport capacity.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron overload, haemolytic anaemia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4995","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the blood's total capacity to bind and transport iron. Your TIBC is 60, within the optimal range, confirming healthy iron transport.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"10.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3678","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"28.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4910","upper_optimal_position":"0.6667","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, mood, libido and fat distribution. Your testosterone is 10.5 nmol/L, within the laboratory range (8.4 to 28.7) but well below the recommended level of above 12 and far below the optimal range of 18 to 30. At 42, testosterone should be significantly higher than this. The most likely explanation is the BMI of 40.3: fat tissue contains the enzyme aromatase, which converts testosterone into oestradiol (oestrogen), depleting testosterone and suppressing the brain signals (LH and FSH) that stimulate its production. Weight loss is the most effective way to raise testosterone in this situation, and many men see substantial improvements with even modest weight loss of 10 to 15%.","low_causes":"Obesity, metabolic syndrome, ageing, sleep deprivation, chronic stress, medication effects, pituitary disorders","high_causes":"Anabolic steroid use, tumours","padding":"1","one_sided":"0","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5421","units":"nmol/l","description":"Free testosterone is the fraction of testosterone not bound to proteins and therefore available for the body to use. Your free testosterone is 0.26 nmol/L, within the laboratory range but below the optimal of 0.3. The low SHBG of 20 means more testosterone is technically 'free', but because total testosterone is low, the absolute amount of free testosterone is still below ideal. This will improve alongside total testosterone as weight comes down.","low_causes":"Low total testosterone, obesity, metabolic syndrome, ageing","high_causes":"Low SHBG, anabolic steroid use","padding":"1","one_sided":"0","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"20","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3519","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3863","upper_optimal_position":"0.5924","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein made by the liver that binds to testosterone, oestradiol and other hormones, controlling how much is free and available. Your SHBG is 20, within the laboratory range but below the optimal of 25 to 55. Low SHBG is strongly associated with insulin resistance and obesity, as insulin suppresses SHBG production. This is another marker that is expected to rise as insulin resistance improves with weight loss and dietary change.","low_causes":"Insulin resistance, obesity, metabolic syndrome, type 2 diabetes, hypothyroidism","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"52.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"30","upper_normal":"150","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) is a calculation of testosterone divided by SHBG, multiplied by 100. It estimates the proportion of testosterone that is biologically active. Your FAI is 52.5, within the optimal range. Despite the low total testosterone, the low SHBG keeps the FAI looking healthy. However, the FAI can be misleading when SHBG is very low because the ratio is artificially inflated. The absolute testosterone level is a better guide in this case.","low_causes":"High SHBG, low testosterone","high_causes":"Low SHBG, high testosterone, PCOS (in women)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"154","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5270","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the main form of oestrogen. In men, small amounts are produced naturally and play a role in bone health, brain function and libido, but excess oestradiol causes problems including gynaecomastia (breast tissue growth), water retention, fatigue and further suppression of testosterone production. Your oestradiol is 154, above the upper limit of 146. In men, the most common cause is excess aromatase activity in fat tissue converting testosterone into oestradiol. At a BMI of 40.3, this is the most likely explanation. Reducing body fat will lower aromatase activity and bring oestradiol back into range.","low_causes":"Very low body fat, aromatase inhibitor use","high_causes":"Obesity, high aromatase activity, liver disease, medication effects","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3222","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5686","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in mood and sleep. Your progesterone is 0.79, just below the lower limit of 0.89 for men. This is a common finding and is considered clinically insignificant in men. It does not require investigation or treatment.","low_causes":"Adrenal insufficiency, low LH","high_causes":"Adrenal hyperplasia, tumours","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3598","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6111","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland in the brain and signals the testes to produce testosterone. Your LH is 2.12, within the laboratory range but in the lower quarter. In the context of low testosterone and elevated oestradiol, a low-normal LH suggests the brain's signal to the testes is being suppressed, most likely by the excess oestradiol. This confirms the obesity-related hypogonadism pattern: the elevated oestradiol fools the pituitary into thinking there is enough sex hormone, so it reduces LH output, leading to lower testosterone. This is expected to normalise with weight loss.","low_causes":"Obesity, elevated oestrogen, pituitary disorders, medication effects","high_causes":"Primary testicular failure, ageing, Klinefelter syndrome","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3577","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3653","upper_optimal_position":"0.5050","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and supports sperm production in men. Your FSH is 2.62, within the laboratory range but in the lower quarter, consistent with the same suppression pattern as LH. The elevated oestradiol is suppressing both LH and FSH, reducing the drive to the testes. This will improve with weight loss.","low_causes":"Obesity, elevated oestrogen, pituitary disorders, steroid use","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"215","w // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
