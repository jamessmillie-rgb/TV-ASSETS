const REPORT_DATA = {"patient_name":"Ben Walker","dob":"26/01/1984","report_date":"2026-10-29","summary":"Customer is a 42-year-old male presenting with a BMI of 40.3, following a takeaway and convenience-based diet rated 3 out of 10 for quality with a volume of 8 out of 10. He does no structured exercise, no cardio and no resistance training, with 5,000 to 7,500 daily steps. He takes a statin and an ACE inhibitor (Ramipril) for diagnosed hypertension. He reports low energy, difficulty losing weight, hair thinning, frequent dehydration, occasional palpitations, and aching hip joints and back pain. His goals are to improve long-term health, balance his hormones and lose body fat.\n\nThe most important finding in this report is that Customer's blood sugar has crossed the threshold into the diabetic range, and this needs to go to his GP as soon as practical. His HbA1c, which is a measure of average blood sugar over the past two to three months, is 52 mmol/mol. The World Health Organisation threshold for a diagnosis of type 2 diabetes is 48 mmol/mol, and at 52 he is above it. His glucose is 7.8, well above the upper limit of 6.0. His insulin, a hormone the pancreas produces to move sugar out of the blood and into cells, is 20.23 mIU/L, which is within the laboratory range but well above the optimal of 2 to 8. His HOMA-IR, a calculation that combines glucose and insulin to estimate how resistant the body is to its own insulin, is 7.01 against an ideal of under 1.0. What this means in plain terms is that his pancreas is producing large amounts of insulin but his cells are no longer responding to it effectively, so sugar is building up in the blood. His C-Peptide, a molecule released in equal amounts to insulin and used to confirm how hard the pancreas is working, is 3.49 ug/L, sitting in the upper half of the range and confirming the pancreas is under real strain. The estimated average glucose derived from the HbA1c is 8.4 mmol/L, and the TyG index, which combines triglycerides and glucose to gauge metabolic stress, is 9.71 against an upper limit of 8.8. Every metabolic marker is pointing in the same direction. The good news is that at 42, with insulin still being produced in good quantities, this is very likely to be reversible. Type 2 diabetes caught at this stage responds powerfully to weight loss, dietary change and movement, and many people bring their HbA1c back below 42 within six to twelve months. The GP will want to discuss whether medication such as metformin is appropriate alongside those lifestyle changes, and a repeat HbA1c in three months will show the trajectory.\n\nThat metabolic picture also explains several of his symptoms. The dehydration he describes is a recognised feature of elevated blood sugar, because glucose spilling into the urine pulls water with it. The fatigue is very likely driven by the same mechanism: cells that cannot use glucose efficiently leave the body short of usable energy despite plenty of fuel in the blood. The difficulty losing weight is partly cause and partly effect, because insulin resistance promotes fat storage, especially around the abdomen, and abdominal fat deepens insulin resistance. His palpitations could have several explanations, including dehydration, electrolyte shifts, the weight itself loading the heart, or an effect of the Ramipril, and should be mentioned to the GP.\n\nThere are genuine positives in this report and they matter. His kidney function is in excellent shape. His Cystatin C, a more reliable measure of kidney filtration than creatinine at a high BMI because it is not affected by muscle mass, is 0.91, giving an eGFR of 107, which is exactly where it should be. Given the combination of hypertension, diabetes and a BMI above 40, all of which can damage the kidneys, this is genuinely reassuring and suggests his Ramipril is doing its job well. His urine is completely clean, with no protein, no glucose spilling, no blood, no infection, confirming that the kidneys are not yet showing any strain from the metabolic load. His liver is holding up better than one might expect. ALT, an enzyme released when liver cells are damaged, is 48, which is within the laboratory ceiling of 56 but above the ideal of under 30 for men. The FIB-4 score, which estimates liver scarring using age, platelets, ALT and AST, is 1.26, under the 1.3 threshold that would trigger further investigation. The APRI score is 0.52, just above the optimal ceiling of 0.5, and the NAFLD fibrosis score is 0.532, within the acceptable range. Taken together, the liver is working under some metabolic strain but there is no sign of significant fibrosis. His GGT, an enzyme sensitive to metabolic stress, alcohol and fatty liver, is 63 against a ceiling of 73, which is within range but well above the ideal of under 25. It is worth watching. His thyroid is working well. TSH at 1.55, free T4 at 18.6 and free T3 at 5.3 are all within the ideal range, the FT3 to FT4 ratio is 0.285 confirming good conversion, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. This is important because thyroid problems are a common and treatable cause of fatigue, weight gain and hair thinning, and in his case the thyroid is not the explanation. His inflammatory markers are encouraging. High-sensitivity CRP, which measures systemic inflammation, is 0.9, under the ideal threshold of 1.0. At a BMI of 40.3, this is a genuinely surprising and positive result, because obesity itself typically drives CRP well above 1.0. His ESR is 6. His immune system is balanced: IgG, IgA, IgM and IgE are all within range, rheumatoid factor is negative at 4, and coeliac screening with tissue transglutaminase IgA is negative. His prostate is healthy, with a PSA of 0.46 and a free-to-total ratio of 78%, both excellent. His tumour markers CA19-9 and CEA are well within range. His iron stores are in a good position, with ferritin at 149, serum iron at 22.1, transferrin saturation at 33.7% and transferrin at 2.61, all comfortably within ideal ranges.\n\nHis lipid profile tells an interesting story in the context of diabetes and a statin. His total cholesterol is 4.0 and his LDL is 2.0, both well controlled, and his ApoB, the best single measure of the number of harmful cholesterol particles circulating, is 0.81 against a desirable ceiling of 0.9, which means the statin is doing its job on particle count. His Lp(a), an inherited cholesterol particle that cannot be changed by diet or medication, is below 25 nmol/L, which is ideal and means his cardiovascular risk from cholesterol is entirely modifiable. However, his triglycerides are 2.64, well above the fasting target of 1.7, his HDL is 1.0, sitting right at the boundary of the undesirable range, and his VLDL is 1.2 against a ceiling of 0.78. The atherogenic index of plasma, which combines triglycerides and HDL into a single risk metric, is 0.422 against an ideal of under 0.11. This pattern, high triglycerides with low HDL despite controlled LDL, is the classic lipid signature of insulin resistance. The triglycerides are high because the liver is converting excess blood sugar into fat and packaging it as VLDL, and the HDL is low because triglyceride-rich particles exchange their cargo with HDL, shrinking it. This will not be fixed by the statin. It will be fixed by the same dietary and exercise changes that bring down the blood sugar. The cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 40, right at the upper boundary of the acceptable range. The HbA1c and triglycerides are the two inputs driving that number, and they are both modifiable.\n\nHis testosterone is 10.5 nmol/L. The laboratory floor is 8.4 but the recommended level is above 12, and the optimal range is 18 to 30. At 42, a testosterone of 10.5 is below where it should be. His SHBG, the protein that binds testosterone and makes it unavailable, is 20, at the lower end of the range, and his free testosterone is 0.26 with a bioavailable testosterone of 6.37, both within range but towards the lower end. His oestradiol is 154 pmol/L, above the upper limit of 146. In men, testosterone is converted to oestradiol by an enzyme called aromatase, which is concentrated in fat tissue. At a BMI of 40.3, there is a large volume of aromatase-active tissue, so testosterone is being converted to oestradiol faster than normal. This suppresses the signals from the brain (LH and FSH) that tell the testes to produce more testosterone, and his LH at 2.12 and FSH at 2.62, both sitting in the lower quarter of their ranges, confirm that suppression is happening. The result is a cycle: excess weight lowers testosterone, low testosterone makes it harder to maintain muscle and easier to gain fat, and the additional fat converts more testosterone to oestradiol. His hair thinning may be partly related to the low testosterone, though at 42 it is also commonly genetic. His progesterone at 0.79, just below the male range of 0.89, is a minor finding that does not need action on its own. The hormone picture will improve substantially with weight loss, because less fat tissue means less aromatase activity, which means more testosterone is preserved rather than converted.\n\nHis PhenoAge, a biological age estimate built from nine blood markers including albumin, glucose, CRP, lymphocytes, MCV, RDW, alkaline phosphatase, creatinine and white cell count, is 40 against his calendar age of 42, meaning his biological age is two years younger than his actual age. Given the metabolic findings, this is better than expected and reflects the fact that his inflammation, kidney function and most blood count markers are in good shape. As the metabolic changes take effect, this gap should widen further in his favour.\n\nHis blood count has a few findings to note. His red blood cell count is 5.76, marginally above the upper limit of 5.5. His MCV, which measures the size of each red cell, is 81.4 against a lower limit of 83, meaning the cells are slightly small. His MCHC, the concentration of haemoglobin within each cell, is 348 against an upper limit of 345. His platelets are 149, just one point below the lower limit of 150, and his MPV, which measures platelet size, is 11 against an upper limit of 10.1. This combination of mildly small red cells with slightly elevated red cell count and borderline-low platelets with large platelet size could reflect early iron-deficiency red cell production, though his iron stores are normal, or it could simply be the effect of the metabolic and inflammatory environment on bone marrow output. None of these are far enough from range to be a concern individually, but the GP should have them noted for comparison at the next test. His chloride is 94, one point below the lower limit of 95, and his creatinine is 63, two points below the lower limit of 65. Neither is clinically significant: the creatinine reflects low muscle mass relative to body weight, which is consistent with no resistance training, and the chloride is a marginal deviation.\n\nHis vitamin D is 53 nmol/L, which is technically sufficient but below the optimal range of 75 to 120. At a BMI of 40.3, vitamin D is sequestered in fat tissue and a higher supplementation dose is needed to achieve the same blood level. His B12 at 459 is within range but below the optimal of 500. His folate at 15 and magnesium at 0.91 are both in good positions. His creatine kinase is 386 against an upper limit of 320. CK is an enzyme released from muscle during damage or heavy use, and at this level without any exercise it could reflect the metabolic load on muscle tissue; a single raised reading is not a concern but should be rechecked if it persists, particularly because statins can occasionally cause muscle breakdown. His total antioxidant activity at 2.2 is above the upper limit of 1.77, which is a favourable finding reflecting adequate antioxidant reserves.\n\nHis cortisol is 215 nmol/L, within the morning reference range. His prolactin is 159 and his DHEA-S is 2.3 umol/L, both within range. His amylase and lipase, pancreatic enzymes, are both well within range, confirming no pancreatic strain despite the metabolic picture.\n\nIn summary, this report is dominated by a single, treatable, reversible condition: insulin resistance that has progressed to early type 2 diabetes. It is driving the blood sugar, the triglycerides, the low HDL, the low testosterone, the raised oestradiol, the fatigue, the difficulty losing weight and very likely the dehydration. The encouraging finding is that everything else, kidneys, liver architecture, inflammation, thyroid, prostate, immune system, and the biological age clock, is holding up well. The body is giving clear warning signals but has not yet sustained damage, and this is the window to act.","links":"The central thread running through this report is insulin resistance. Customer's pancreas is producing large quantities of insulin, confirmed by the insulin level of 20.23 and the C-Peptide of 3.49 ug/L, but his cells are not responding to it. The HOMA-IR of 7.01, nearly five times the ideal ceiling, quantifies the degree of resistance, and the HbA1c of 52 confirms that the resistance has been sustained long enough for average blood sugar to cross the diabetic threshold. The glucose of 7.8, the estimated average glucose of 8.4, and the TyG index of 9.71 all confirm the same picture from different angles.\n\nThat insulin resistance connects directly to the lipid pattern. The liver responds to persistently high insulin and glucose by converting excess fuel into triglycerides and packaging them into VLDL particles, which is why his triglycerides are 2.64 and his VLDL is 1.2. Those triglyceride-rich particles interact with HDL, effectively draining it, which explains his HDL of 1.0 sitting at the undesirable boundary. The statin has controlled the LDL and ApoB effectively, bringing them to 2.0 and 0.81 respectively, but it cannot fix the triglyceride-HDL axis because that axis is driven by insulin, not by cholesterol synthesis. The atherogenic index of 0.422 and the cardiovascular risk score of 40 reflect the combined load of the metabolic and lipid findings. Importantly, his Lp(a) is ideal at below 25, which means all of his cardiovascular risk is modifiable.\n\nThe hormone pattern is the third branch of the same tree. At a BMI of 40.3, the aromatase enzyme in adipose tissue is converting testosterone to oestradiol at an accelerated rate, giving an oestradiol of 154 above the limit of 146 and a testosterone of 10.5 below the recommended 12. The brain detects the oestradiol and responds by dialling down the signals that stimulate testosterone production, which is why LH and FSH are both in the lower quarter of their ranges. This is not primary testicular failure; it is the predictable hormonal consequence of excess weight, and it reverses with weight loss.\n\nWhat has been excluded matters too. His kidneys are healthy, with a Cystatin C eGFR of 107, no protein in the urine and no glucose spilling, which means the diabetes has not yet caused nephropathy. His liver shows metabolic strain (ALT 48, GGT 63) but no fibrosis (FIB-4 1.26, APRI 0.52, NAFLD fibrosis score 0.532). His thyroid is working well and is not contributing to his weight or fatigue. His inflammation is surprisingly low, with a CRP of 0.9 at a BMI of 40.3. Coeliac disease has been excluded. There is no autoimmune process. The prostate is clear.\n\nThe remaining loose ends are the blood count findings. The mildly raised red cell count, slightly small MCV, marginally raised MCHC, borderline-low platelets and raised MPV form a cluster that does not fit a single clear diagnosis. Iron stores are normal, so iron deficiency is unlikely to be the driver. These findings may reflect the effect of the metabolic environment on blood cell production, or they may simply be normal variation at the margins. They are worth tracking at the next test rather than investigating now. The raised CK at 386 on a statin with no exercise is worth noting; statins can rarely cause myopathy, and if he develops muscle pain or weakness, CK should be rechecked promptly.","lifestyle":"Add a palm-sized portion of protein to every meal before anything else goes on the plate: eggs, chicken, tinned fish, Greek yoghurt. Anchor: before you order or prepare anything else, the protein is chosen first. Why: protein blunts the insulin spike behind your HOMA-IR of 7.01 and keeps you full, which will reduce total intake naturally.\nReplace one takeaway meal a day with a home-cooked plate built around protein and vegetables, starting with whichever meal is easiest. Anchor: pick one meal this week, batch-cook if that helps. Why: convenience food is typically high in refined carbohydrate and seed oils, both of which drive the triglycerides of 2.64 and the insulin resistance behind your HbA1c of 52.\nCut sugary drinks entirely, including fruit juice and energy drinks, and replace with water, sparkling water or black coffee. Anchor: every time you reach for a drink, it is water first. Why: liquid sugar is the fastest route to a glucose spike, and removing it is the single easiest way to start bringing down your fasting glucose of 7.8.\nWalk for 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly targets your HOMA-IR of 7.01.\nAdd two 20 to 30 minute walks on top of your current steps, aiming for 8,000 to 10,000 steps a day within four weeks. Anchor: one in the morning, one in the evening, attached to something you already do (leaving the house, finishing work). Why: regular low-intensity movement improves insulin sensitivity and will help bring the triglycerides and HDL into a healthier range.\nBegin two resistance training sessions a week, even if that starts as bodyweight exercises at home: squats, press-ups, rows with a bag. Anchor: pick two fixed days and treat them like appointments. Why: muscle is the largest consumer of glucose in the body, and building it will directly improve your insulin resistance, raise your testosterone from 10.5, and protect your joints, which are under significant load at 138 kg.\nSet a fixed wake time seven days a week and get outside within an hour of waking for natural light. Anchor: alarm at the same time every day, step outside before you check your phone. Why: a consistent circadian rhythm improves insulin sensitivity, cortisol rhythm and energy levels, all of which are relevant to your fatigue and your metabolic results.\nDrink at least 2.5 litres of water a day, spread through the day rather than in large boluses. Anchor: a full glass with every meal and one between each meal. Why: your reported dehydration is likely driven by the elevated blood sugar pulling water into the urine, and adequate hydration will reduce the palpitations and improve how you feel day to day.","flags":"HbA1c 52 mmol/mol (7.0%), glucose 7.8 mmol/L, HOMA-IR 7.01, insulin 20.23, C-Peptide 3.49 ug/L, estimated average glucose 8.4, TyG index 9.71. These results cross the WHO diagnostic threshold for type 2 diabetes (HbA1c above 48). GP review is recommended for formal diagnosis, discussion of metformin, dietary intervention and a three-month repeat HbA1c.\nTriglycerides 2.64 mmol/L (target below 1.7), HDL 1.0 mmol/L (target above 1.55), VLDL 1.2 mmol/L (target below 0.78), atherogenic index of plasma 0.422 (ideal below 0.11). Classic insulin-resistance-driven dyslipidaemia despite well-controlled LDL and ApoB on the statin. Will respond to the same dietary and exercise changes that address the blood sugar.\nCardiovascular Risk Score 40 out of 100 (upper boundary of acceptable range). Driven primarily by HbA1c and triglycerides. Both are modifiable.\nTestosterone 10.5 nmol/L (recommended above 12, optimal 18 to 30), oestradiol 154 pmol/L (above limit of 146), LH 2.12, FSH 2.62 (both lower quarter of range), SHBG 20. Consistent with obesity-related hypogonadism driven by aromatase conversion of testosterone to oestradiol in adipose tissue. Expected to improve with weight loss. GP should be aware; if testosterone does not improve with weight loss, reassessment is warranted.\nCreatine kinase 386 U/L (upper limit 320) on a statin with no exercise. Mildly elevated. Not diagnostic of myopathy at this margin but should be rechecked, and any new muscle pain or weakness should be reported promptly to the GP.\nALT 48 IU/L (within lab range of under 56 but above ideal of under 30), GGT 63 IU/L (within range of under 73 but above the ideal of under 25). FIB-4 1.26, APRI 0.52, NAFLD fibrosis score 0.532: no evidence of significant fibrosis. Pattern is consistent with metabolic-associated fatty liver. Expected to improve with weight loss and dietary change.\nVitamin D 53 nmol/L (sufficient but below optimal of 75 to 120). At BMI 40.3, fat tissue sequesters vitamin D and a higher supplementation dose is needed.\nRed blood cell count 5.76 (above upper limit 5.5), MCV 81.4 (below lower limit 83), MCHC 348 (above upper limit 345), platelets 149 (below lower limit 150), MPV 11 (above upper limit 10.1). Marginal deviations in several directions. Iron stores are normal. Worth noting for comparison at next test rather than investigating in isolation.\nChloride 94 (one point below lower limit 95), creatinine 63 (two points below lower limit 65). Neither is clinically significant; creatinine reflects low muscle mass relative to body weight.\nProgesterone 0.79 nmol/L (below male range of 0.89). Minor finding in men, not requiring action.\nB12 459 pg/ml (within range but below optimal of 500). Consider sublingual supplementation.\nReassuring negatives: kidney function excellent (Cystatin C eGFR 107, no proteinuria, no glycosuria), CRP 0.9 at BMI 40.3, thyroid normal with negative antibodies, coeliac negative, rheumatoid factor negative, PSA 0.46 with 78% free ratio, CA19-9 and CEA normal, LDL 2.0 and ApoB 0.81 on statin, Lp(a) below 25, urine clean, PhenoAge 40 (two years younger than calendar age).\nNot reported on this occasion: potassium.","recommendations":"Book a GP appointment to discuss the HbA1c of 52 and glucose of 7.8, which cross the WHO threshold for type 2 diabetes. Bring this report. The GP will likely want to confirm with a repeat HbA1c, discuss whether metformin is appropriate, and set up diabetic monitoring including eye and foot checks.\nAsk the GP about the palpitations in the context of hypertension, dehydration from the elevated blood sugar, and Ramipril. An ECG may be appropriate.\nMention the creatine kinase of 386 on the statin. It is mildly above range and not urgent, but the GP should note it as a baseline. Report any new muscle pain, tenderness or weakness promptly.\nDiscuss the testosterone of 10.5 and oestradiol of 154 with the GP. The pattern is consistent with obesity-related suppression and is expected to improve with weight loss, but if it does not improve after six months of sustained weight loss, reassessment including a morning testosterone, LH and FSH is warranted.\nAsk whether the current statin dose is still appropriate given the well-controlled LDL and ApoB but elevated triglycerides and low HDL. The GP may consider adding or substituting a fibrate, or may prefer to see the effect of dietary change first.\nCalorie and protein targets: at 138 kg with no structured exercise, maintenance calories are approximately 2,870 (BMR around 2,210 multiplied by a sedentary factor of 1.3). A deficit of 500 to 750 calories per day, giving a target of 2,100 to 2,400 calories per day, will produce steady weight loss of 0.5 to 0.75 kg per week. Protein target: 180 to 220 g per day (1.3 to 1.6 g per kg) to preserve muscle during weight loss. An initial weight target of 120 kg, then reassess. Retest in four months with: HbA1c, fasting glucose, fasting insulin, HOMA-IR, full lipid panel including triglycerides and HDL, testosterone, oestradiol, LH, FSH, liver enzymes (ALT, GGT), CK, full blood count, vitamin D and B12.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. At BMI 40.3, the standard 2,000 IU dose is insufficient because vitamin D is stored in fat tissue and less reaches the bloodstream. Why: your vitamin D is 53 nmol/L and the optimal range is 75 to 120.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. K2 directs calcium into bones rather than arteries and should always accompany vitamin D supplementation.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Sublingual bypasses the gut and is more reliably absorbed. Why: your B12 is 459, within range but below the optimal of 500.\nMagnesium (glycinate): 400 mg before bed. Glycinate is well absorbed and the least likely form to cause digestive discomfort. Why: your magnesium at 0.91 is within range but may support sleep quality, blood pressure and insulin sensitivity, all of which are relevant to your results.\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with food. Why: omega-3 at this dose lowers triglycerides, which are 2.64, and supports HDL, which is 1.0. It also has a mild anti-inflammatory effect.\nDO NOT take iron supplements. Your ferritin is 149 and your iron stores are healthy. Additional iron at this level could cause harm.\nThe most important changes from this report are not supplements. They are the dietary shift away from convenience food towards protein and vegetable-based meals, the addition of daily walking and twice-weekly resistance training, and the sustained calorie deficit that will bring the weight down, reverse the insulin resistance, and restore the testosterone.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 48 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 48.1. Weakest systems: glucose & insulin 10%, cardiac markers 25%, lipids & cardiovascular 36%. Biggest drags: Blood Glucose, HbA1c (IFCC), Triglycerides, Remnant Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4255","lower_normal":"","upper_normal":"47","lower_optimal":"","upper_optimal":"42","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4468","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Your PhenoAge is 40 against a calendar age of 42, meaning your biological age is two years younger than your actual age. Given the diabetic-range glucose in this panel, this is a better-than-expected result, pulled down by the excellent CRP, healthy albumin, strong kidney function and balanced white cell count. As blood sugar and metabolic health improve, PhenoAge should move further below calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built rather than the ten-year chance of an event. Your score is 40, right at the upper boundary of the acceptable range. The two inputs driving the score are the HbA1c of 52 and the triglycerides of 2.64. Both are modifiable. Your well-controlled LDL and ApoB on the statin, ideal Lp(a) and low CRP are keeping the score from being higher. As blood sugar and triglycerides come down with dietary change and exercise, this score will fall substantially.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found mainly inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood, so a higher level suggests the liver is under strain. Your ALT is 48, which is within the laboratory ceiling of 56 but above the ideal of under 30 for men. At a BMI of 40.3 on a convenience-based diet, this level most likely reflects metabolic-associated fatty liver, where excess calories and insulin resistance cause fat to accumulate in liver cells. Reassuringly, your fibrosis scores are all within range, meaning there is no sign of scarring. This marker is expected to improve with weight loss and dietary change.","low_causes":"","high_causes":"Fatty liver disease, metabolic syndrome, excess alcohol, medication effects, viral hepatitis, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"13","upper_normal":"45","lower_optimal":"14","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3438","upper_optimal_position":"0.6146","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in liver cells but also in heart and muscle tissue. Your AST is 31, comfortably within both the laboratory range and the optimal range. The fact that your AST is lower than your ALT (giving a De Ritis ratio of 0.65) is a pattern consistent with fatty liver rather than more serious liver damage, which is a reassuring finding.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart injury, excess alcohol, medication effects","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6184","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to metabolic stress, alcohol, fatty liver and bile duct strain. Your GGT is 63 against a male upper limit of 73, which is within range but well above the ideal of under 25. At 42, this level suggests the liver is working harder than it should be, most likely driven by the insulin resistance and the metabolic load of a high-convenience diet. GGT often responds quickly to dietary improvement and weight loss, and it is a useful marker to track at your retest.","low_causes":"","high_causes":"Fatty liver, metabolic syndrome, alcohol, bile duct issues, medications, obesity","padding":"1","one_sided":"0","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3952","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones and bile ducts. Your ALP is 59, sitting comfortably in the optimal range. This confirms that the bile ducts are healthy and there is no bone turnover issue, both reassuring findings alongside the other liver markers.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it and excretes it in bile. Your bilirubin is 12, in the middle of the range, confirming healthy liver clearance and normal red cell turnover.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in your blood. Your total protein is 76, within both the laboratory range and the optimal range, indicating balanced protein synthesis by the liver and a healthy immune contribution from globulins.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, immune disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins and medications, and it maintains fluid balance. Your albumin is 45, solidly within the optimal range, confirming healthy liver synthetic function. Albumin is also one of the inputs to PhenoAge, and a strong albumin helps keep that biological age calculation favourable.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/l","description":"Globulin is a group of proteins in the blood that includes antibodies (immunoglobulins) and transport proteins. Your globulin is 31, within the laboratory range but just above the optimal ceiling of 30. This is a marginal deviation and not a concern, particularly as your individual immunoglobulins are all within range.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, immune disorders, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands to digest carbohydrates. Your amylase is 41, within the optimal range, confirming no pancreatic strain.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5461","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. Your lipase is 43, comfortably within range. Together with the normal amylase, this confirms your pancreas is functioning well.","low_causes":"","high_causes":"Pancreatitis, gallstones, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 (FIB-4) Score","group":"LIVER & METABOLIC","result":"1.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4345","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a score that estimates the degree of liver scarring (fibrosis) using your age, platelet count, ALT and AST. A score below 1.3 at your age suggests no significant fibrosis. Your FIB-4 is 1.26, under that threshold, which is reassuring given the metabolic strain your liver is under. The score is slightly elevated because your platelets at 149 are at the lower boundary, which inflates the calculation, rather than because of any sign of liver scarring.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, low platelets, advanced age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3861","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol types in the blood: LDL, HDL and VLDL. Your total cholesterol is 4.0, well within the desirable range and reflecting good statin control. However, total cholesterol on its own can be misleading because it does not tell you the balance between harmful (LDL, VLDL) and protective (HDL) cholesterol. In your case, the low HDL means a greater proportion of your total cholesterol is in the harmful fractions.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7765","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, largely reflecting recent dietary intake of carbohydrates and sugar. Your triglycerides are 2.64, well above the target of 1.7 and the optimal of below 1.0. Elevated triglycerides are a hallmark of insulin resistance: when the body cannot use glucose efficiently, the liver converts the excess into triglycerides and packages them into VLDL particles. This is not a cholesterol problem that the statin can fix; it is a metabolic problem that will respond to reduced carbohydrate and sugar intake, increased movement and weight loss.","low_causes":"Malnutrition, hyperthyroidism, very low fat diet","high_causes":"High carbohydrate or sugar diet, insulin resistance, obesity, alcohol, metabolic syndrome, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective form of cholesterol. It acts as a scavenger, picking up excess cholesterol from artery walls and returning it to the liver for disposal. Higher HDL is better, and below 1.04 is considered undesirable for men. Your HDL is 1.0, just below that threshold. Low HDL is driven by the same insulin resistance that raises the triglycerides: triglyceride-rich VLDL particles exchange their cargo with HDL, shrinking the HDL particles and accelerating their clearance. Exercise is the most potent lifestyle lever for raising HDL, and weight loss also helps. This is expected to improve with the changes in this report.","low_causes":"Insulin resistance, obesity, sedentary lifestyle, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the form of cholesterol that deposits in artery walls and drives atherosclerosis. Your LDL is 2.0, well within the ideal range and below the optimal ceiling of 2.6. This shows your statin is controlling LDL effectively. With your Lp(a) below 25, the Lp(a)-corrected LDL is 1.92, confirming that nearly all of this LDL is the modifiable type.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, diabetes, obesity","padding":"1","one_sided":"0","range_type":"normal"},{"key":"vldl","name":"Very Low-Density Lipoprotein (VLDL)","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7692","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) is a particle made by the liver to transport triglycerides through the blood. Your VLDL is 1.2, well above the upper limit of 0.78. This is a direct consequence of insulin resistance: the liver is converting excess blood glucose into triglycerides and packaging them into VLDL particles at a faster rate than normal. VLDL is the precursor to small, dense LDL, which is more harmful to arteries. Reducing carbohydrate intake and losing weight will lower VLDL by addressing the underlying insulin resistance.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet, obesity, diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol and is used as a quick cardiovascular risk gauge. Your ratio is 4.0, within the laboratory range of under 4.5 but above the ideal of under 3.5. The ratio is being pushed up by the low HDL of 1.0 rather than by high total cholesterol. As HDL improves with exercise and weight loss, this ratio will fall.","low_causes":"","high_causes":"Low HDL, high total cholesterol, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"HDL percentage tells you what proportion of your total cholesterol is made up of the protective HDL. Your HDL accounts for 25% of total cholesterol, which is above the minimum threshold of 20% but below the ideal of 30% or more. A higher percentage means a greater share of your cholesterol is in the protective fraction. This will improve as HDL rises with exercise and weight loss.","low_causes":"Low HDL, high total cholesterol, insulin resistance","high_causes":"Excellent HDL, exercise, healthy weight","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the potentially harmful cholesterol fractions (LDL + VLDL + remnants) in a single number. Your non-HDL is 3.0, within the laboratory range of under 4 but above the ideal. The LDL component is well controlled at 2.0; the excess is coming from the VLDL and remnant cholesterol driven by insulin resistance.","low_causes":"","high_causes":"High LDL, high triglycerides, insulin resistance, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"1.2","upper_normal":"2.0","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main protein on HDL particles. It is the functional component that picks up cholesterol from artery walls. Your ApoA1 is 1.36, above the minimum threshold of 1.20 but below the optimal of 1.4, consistent with the low HDL. ApoA1 rises with exercise, weight loss and improved metabolic health.","low_causes":"Sedentary lifestyle, obesity, insulin resistance, smoking","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL and VLDL particle. It is considered the single best measure of the number of atherogenic (artery-damaging) particles circulating in the blood. Your ApoB is 0.81, within the desirable range of under 0.9 but just above the optimal ceiling of 0.8. This confirms the statin is controlling particle count well. The small amount above optimal may be contributed by the elevated VLDL particles.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"High cholesterol, insulin resistance, obesity, genetics, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio is considered one of the best single predictors of cardiovascular risk because it captures the balance between harmful (ApoB-carrying) and protective (ApoA1-carrying) particles. Your ratio is 0.60, right at the optimal ceiling of 0.6 for men. This is a positive finding and reflects the statin doing its job on the ApoB side, though the ApoA1 could be higher to give more margin.","low_causes":"","high_causes":"High ApoB, low ApoA1, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a type of LDL particle with an extra protein attached that makes it stickier and more likely to cause clots and inflammation in arteries. Unlike standard LDL, Lp(a) is almost entirely genetically determined and cannot be changed by diet, exercise or statins. Your Lp(a) is below 25, which is ideal. This is genuinely useful information because it means all of your cardiovascular risk from cholesterol is driven by modifiable factors rather than by an inherited particle you cannot change.","low_causes":"","high_causes":"Genetics (inherited)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is what remains after you subtract HDL and LDL from total cholesterol. It represents the cholesterol carried in triglyceride-rich particles (VLDL and chylomicron remnants). Your remnant cholesterol is 1.0, above the upper limit of 0.8 and well above the ideal of under 0.5. Elevated remnant cholesterol is a strong independent risk factor for cardiovascular disease. In your case it is driven by the high triglycerides from insulin resistance, and it will fall as triglycerides come down.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"1.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3200","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL removes the contribution of Lp(a) from your total LDL number, leaving only the modifiable LDL. Your corrected LDL is 1.92, within the optimal range. This confirms that once you subtract the inherited component, which is very small in your case, the LDL that responds to diet and medication is well controlled.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.422","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7251","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma (AIP) is calculated from triglycerides and HDL and predicts the proportion of small, dense LDL particles, which are the most harmful type. Your AIP is 0.422, above the upper limit of 0.21, indicating an unfavourable balance. This is being driven entirely by the elevated triglycerides of 2.64 and the low HDL of 1.0, both of which are consequences of insulin resistance. As those markers improve with dietary change and exercise, AIP will fall.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2857","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The LDL to HDL ratio (Castelli II index) compares your harmful LDL cholesterol to your protective HDL cholesterol. Your ratio is 2.0, within the optimal range of under 2.5. Despite the low HDL, the well-controlled LDL on the statin keeps this ratio favourable.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"7.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Blood glucose measures the amount of sugar in the blood at the time of the test. The reference range is 3.5 to 6.0 mmol/L. Your glucose is 7.8, significantly above the upper limit and above the WHO diagnostic threshold of 7.0 for diabetes. Combined with your HbA1c of 52, this confirms that blood sugar has been persistently elevated. The body is producing plenty of insulin (20.23 mIU/L) but the cells are resistant to it, so glucose accumulates in the blood. This is the central finding of the report and the one that needs GP attention.","low_causes":"Fasting too long, medication effects, insulin-producing tumour","high_causes":"Type 2 diabetes, insulin resistance, metabolic syndrome, high carbohydrate diet, obesity, stress, medication effects","padding":"1","one_sided":"0","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4667","units":"%","description":"HbA1c (percentage) measures the proportion of haemoglobin in your red blood cells that has glucose attached to it, reflecting average blood sugar over the past two to three months. Your HbA1c is 7.0%, above both the pre-diabetes range (6.0 to 6.4%) and the diabetes threshold of 6.5%. This is the DCCT-aligned percentage; the IFCC value below gives the same information in mmol/mol units.","low_causes":"","high_causes":"Type 2 diabetes, insulin resistance, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (IFCC)","group":"GLUCOSE & INSULIN","result":"52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6190","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in IFCC units measures the same thing as the percentage above, using international standard units. Your HbA1c is 52 mmol/mol. The normal range is below 42, the pre-diabetes range is 42 to 47, and the diabetes threshold is 48. At 52, you are above the diabetes threshold, confirming that average blood sugar has been elevated for at least two to three months. This is the number to discuss with your GP, and a repeat in three to four months will show whether the dietary and lifestyle changes are taking effect.","low_causes":"","high_causes":"Type 2 diabetes, insulin resistance, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"20.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5969","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas to move glucose from the blood into cells for energy. Your insulin is 20.23 mIU/L, within the laboratory range but far above the optimal of 2 to 8. This high level tells us the pancreas is working extremely hard to try to control blood sugar, but despite producing large amounts of insulin, the cells are resisting it. This is the hallmark of insulin resistance and the mechanism behind the elevated glucose and HbA1c. The pancreas is still capable of producing insulin, which is the key to reversibility: weight loss and dietary change can restore insulin sensitivity, allowing less insulin to do a better job.","low_causes":"Low carbohydrate diet, fasting, insulin-sensitive physiology","high_causes":"Insulin resistance, obesity, metabolic syndrome, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"3.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5747","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is used to confirm how much insulin the pancreas is actually producing, independent of any external insulin. Your C-Peptide is 3.49 ug/L, sitting in the upper half of the range. This confirms the pancreas is working hard and producing plenty of insulin, which is consistent with type 2 diabetes driven by insulin resistance rather than the pancreas failing to produce insulin (as in type 1 diabetes). This distinction is important because it means the condition is driven by the body's resistance to insulin, not by a lack of it.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, fasting","high_causes":"Insulin resistance, type 2 diabetes, obesity, insulinoma","padding":"1","one_sided":"0","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"7.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using glucose and insulin to estimate how resistant the body is to its own insulin. An ideal HOMA-IR is under 1.0. Above 1.9 indicates early insulin resistance, and above 2.9 indicates significant insulin resistance. Your HOMA-IR is 7.01, nearly five times the significant resistance threshold. This is the clearest single number in the report for summarising the metabolic picture: the body is producing large amounts of insulin but the cells are barely responding. The encouraging fact is that HOMA-IR is one of the markers that responds most dramatically to weight loss, dietary change and exercise.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean physiology","high_causes":"Insulin resistance, obesity, metabolic syndrome, type 2 diabetes, sedentary lifestyle, high carbohydrate diet","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"GLUCOSE & INSULIN","result":"2.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8800","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"","description":"The triglyceride to HDL ratio is another marker of insulin resistance and atherogenic risk. A ratio below 0.87 is ideal, and above 1.5 is considered elevated. Your ratio is 2.64, well above range, driven by the high triglycerides of 2.64 and the low HDL of 1.0. This ratio is one of the strongest predictors of small, dense LDL particles and cardiovascular risk from the metabolic syndrome. It will improve as triglycerides fall and HDL rises with dietary change and exercise.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"8.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose (eAG) converts the HbA1c into an average blood sugar level over the past two to three months, making it easier to understand what HbA1c means in day-to-day terms. Your eAG is 8.4 mmol/L, meaning that on average your blood sugar has been sitting at about 8.4 throughout the day and night. The target is below 7, and the ideal is below 6.2. This confirms the HbA1c finding and gives you a clear number to aim for as the dietary changes take effect.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"9.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5517","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG (triglyceride-glucose) index combines triglycerides and glucose into a single number that estimates insulin resistance. Your TyG index is 9.71, well above the upper limit of 8.8. It confirms from a different angle what the HOMA-IR already shows: significant insulin resistance. The TyG index is considered a particularly good predictor of metabolic complications, and it will track downward as both triglycerides and glucose improve.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"HS-CRP","group":"INFLAMMATION","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP (C-reactive protein) is a marker of systemic inflammation produced by the liver. Levels below 1.0 mg/L indicate low cardiovascular and inflammatory risk, 1.0 to 3.0 indicates moderate risk, and above 3.0 indicates higher risk. Your hs-CRP is 0.9, within the ideal range. At a BMI of 40.3, this is a genuinely surprising and positive result. Obesity typically drives CRP well above 1.0 through chronic low-grade inflammation from fat tissue. The fact that yours is below 1.0 suggests your body is managing inflammation well despite the metabolic challenges.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over one hour. A faster rate suggests inflammation. Your ESR is 6, well within the optimal range, adding to the reassuring CRP and confirming that there is no significant systemic inflammation driving your symptoms.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"1.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.4812","units":"","description":"The neutrophil to lymphocyte ratio (NLR) divides the neutrophil count by the lymphocyte count and is used as a simple marker of the balance between innate inflammation (neutrophils) and adaptive immunity (lymphocytes). Your NLR is 1.44, within the optimal range of 1.0 to 2.0. This is a healthy balance and another indicator that systemic inflammation is well controlled.","low_causes":"Viral infection, autoimmune conditions","high_causes":"Bacterial infection, stress, systemic inflammation, cardiovascular disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"74.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3647","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet to lymphocyte ratio (PLR) divides the platelet count by the lymphocyte count. Your PLR is 74.1, within the normal range but below the optimal band of 80 to 160. This is being pulled down by the borderline-low platelets of 149 rather than by any inflammatory process. It is not a concern.","low_causes":"Low platelets, high lymphocytes","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"215","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4100","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII (Systemic Immune-Inflammation Index) combines platelet, neutrophil and lymphocyte counts into a single number reflecting overall immune-inflammatory status. Your SII is 215, within the optimal range. This adds to the picture of well-controlled inflammation despite the metabolic findings.","low_causes":"Immune suppression","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"137","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4359","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the main electrolyte that controls fluid balance and blood pressure. Your sodium is 136, within the laboratory range but just below the optimal of 137. The ACE inhibitor (Ramipril) can lower sodium slightly, and the elevated blood sugar can also dilute it by drawing water into the blood (pseudohyponatraemia). The glucose-corrected sodium is 136.6, which is a marginal improvement. Neither is a concern at this level.","low_causes":"ACE inhibitors, dehydration, heart failure, kidney disease, diabetes","high_causes":"Dehydration, high salt intake, diabetes insipidus","padding":"1","one_sided":"0","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3077","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works closely with sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Your chloride is 94, one point below the lower limit of 95. This is a very marginal deviation and is most likely related to the mildly raised bicarbonate of 29.3, which shifts the chloride-bicarbonate balance. It is not clinically significant at this margin.","low_causes":"Vomiting, metabolic alkalosis, medication effects, dehydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"29.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6152","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6364","units":"mmol/l","description":"Bicarbonate is a buffer that helps maintain the blood's pH balance. Your bicarbonate is 29.3, within the optimal range. The slightly higher end of normal is consistent with the marginally low chloride and is a normal compensatory balance.","low_causes":"Metabolic acidosis, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4912","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling and blood clotting. Your total calcium is 2.35, within the optimal range. Your corrected calcium, which adjusts for albumin levels, is 2.28, also within range. Both confirm healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for your albumin level, giving a more accurate picture of the calcium available for use by the body. Your corrected calcium is 2.28, within both the laboratory range and the optimal range. Combined with the normal PTH and adequate phosphate, calcium metabolism is healthy.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D","padding":"1","one_sided":"0","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4559","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5709","units":"mmol/l","description":"Phosphate works alongside calcium in bone metabolism and energy production. Your phosphate is 1.1, comfortably within the optimal range. No action needed.","low_causes":"Hyperparathyroidism, vitamin D deficiency, diabetic ketoacidosis, malnutrition","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D","padding":"1","one_sided":"0","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including muscle contraction, nerve function, blood sugar regulation and blood pressure control. Your magnesium is 0.91, within the optimal range. This is a positive finding given the hypertension and the metabolic picture, as magnesium depletion is common in insulin resistance. Supplementation is still worth considering because blood magnesium can appear normal while tissue stores are low, and additional magnesium supports insulin sensitivity and blood pressure.","low_causes":"Diabetes, diuretics, alcohol, malabsorption, inadequate intake","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"429","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5464","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in many foods and in the body's own cells. Your uric acid is 429, within the laboratory range but above the optimal ceiling of 380. Elevated uric acid is strongly associated with insulin resistance, obesity and metabolic syndrome, and it is also the cause of gout. Given your aching
