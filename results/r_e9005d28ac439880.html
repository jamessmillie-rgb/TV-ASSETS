<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Kunal Dhillon","dob":"22/01/1994","report_date":"2026-09-10","summary":"Kunal is a 32-year-old male presenting with a BMI of 24.5, following a low-carb, high-protein diet rated 8 out of 10 for quality with a volume of 6 out of 10. He trains four times per week, all cardio with no resistance training, and averages 5,000 to 7,500 daily steps. He reports no medications, no smoking, and no significant alcohol intake. His symptoms include low mood and anxiety, poor exercise recovery, and low energy and fatigue. His goals are to lose body fat, build muscle, and improve energy levels. His South Asian ethnicity is clinically relevant because it carries a higher baseline cardiovascular and metabolic risk, making several of his results even more reassuring than they would otherwise be.\n\nThere is a lot of good news in this report, and it is worth starting there. Kunal's metabolic health is excellent. His HbA1c, which is a measure of average blood sugar over the previous three months, is 34 mmol/mol, well inside the optimal zone below 36. His fasting glucose, reflected in the HbA1c, shows no sign of insulin resistance or pre-diabetes, which is particularly reassuring given his South Asian background where type 2 diabetes prevalence is significantly higher. His lipid profile is genuinely impressive. Total cholesterol is 4.4, LDL is 2.58, triglycerides are a very low 0.73, and his HDL, the protective cholesterol that removes excess lipid from artery walls, is 1.5. His ApoB, which counts the number of potentially harmful lipoprotein particles circulating in the blood, is 0.77, comfortably below both the general threshold of 0.9 and the optimal threshold of 0.8. His ApoB to ApoA1 ratio is 0.63, well within the lower risk bracket below 0.7. His triglyceride to HDL ratio, one of the best surrogate markers for insulin resistance, calculates to 0.49, which is outstanding. His remnant cholesterol, the cholesterol carried by triglyceride-rich particles and an independent cardiovascular risk factor, is 0.32, well within the optimal range. For a 32-year-old South Asian male, this cardiovascular profile is about as clean as it gets.\n\nHis liver is in excellent health. ALT is 33, which is within the laboratory reference range, and while it sits above the tighter optimal threshold of 30, GGT at 24 and AST at 31 are both well within range, bilirubin is 10, albumin is 44, and his FIB-4 score, a composite calculation that estimates liver fibrosis, is 0.66, comfortably below the threshold of 1.45. There is no sign of liver strain here. His kidney function is healthy, with creatinine at 78, an eGFR above 90, and uric acid at 300, all sitting comfortably within range. His thyroid is working well. TSH, the signal the pituitary gland sends to the thyroid to ask for more hormone, is 1.2, right in the middle of the optimal band between 1.0 and 2.5. Free T4, the inactive form of thyroid hormone, is 20.3, towards the upper end of range and within the optimal band. Free T3, the active form that cells actually use for energy and metabolism, is 5.2, solidly within the optimal range of 4.5 to 6.5. A well-functioning thyroid rules out one of the most common explanations for the fatigue and low mood Kunal is experiencing. His hs-CRP, which is a sensitive measure of systemic inflammation, is 0.8, below the optimal threshold of 1.0, meaning there is no meaningful inflammatory process running in the background. His testosterone is 26.4 nmol/L, firmly in the optimal range of 18 to 30, which is excellent for a 32-year-old male and effectively rules out hormonal insufficiency as a cause of his fatigue and low mood. His SHBG, the protein that binds testosterone and makes it unavailable to tissues, is 36.2, well within the optimal range. His free testosterone, the fraction that is biologically active, is 0.56, healthy and within range. DHEA-S, the adrenal hormone that serves as a precursor to testosterone, is 3.3 umol/L, within range. Cortisol at 357 nmol/L is within the expected morning window. His LH at 6.5 is within range, confirming the pituitary-gonadal axis is functioning normally.\n\nHis haemoglobin at 156, red blood cell count at 5.09, haematocrit at 0.449, MCV at 88.2, and MCH at 30.7 are all healthy, meaning the red cells are the right size, carry the right amount of haemoglobin, and are being produced in appropriate numbers. His RDW at 12.9, which measures variation in red cell size, is within range and argues against any evolving nutritional deficiency affecting red cell production. Platelets at 262 are healthy. His calcium is well within range at 2.52, with corrected calcium at 2.47. Magnesium is 1.01, within the optimal range of 0.85 to 1.05, which is reassuring given his training load. Vitamin D at 93 nmol/L is within the optimal band of 75 to 120, so his current intake or sun exposure is maintaining a good level. His Active B12 at 126.9 pmol/L is within the laboratory range of 25.1 to 165, but it sits below what we would consider optimal, which is above 150. B12 is essential for nerve function, red blood cell production, and energy metabolism. At 126.9, Kunal is not deficient, but he is not optimally stocked either, and on a low-carb, high-protein diet the main B12 sources are typically meat, fish, and eggs, so this may reflect either slightly lower intake than ideal or individual variation in absorption. Given his fatigue, it is worth optimising. His serum folate at 20 is flagged above the laboratory upper limit of 17. This is not a concern. Elevated folate is almost always a reflection of diet quality, particularly green vegetable intake or supplementation, and carries no clinical risk. It is actually a positive finding.\n\nThe area that does need attention is his iron stores. His ferritin is 26 ng/ml. While this sits just above the laboratory lower limit of 22, the optimal range for a male is 50 to 200, and at 26 he is meaningfully below that. Ferritin is the body's iron storage protein, and at this level the reserves are thin. His transferrin, the protein that transports iron in the blood, is 3.32, towards the upper end of its range. When iron stores are low, the body produces more transferrin to try to capture and deliver every available iron molecule, so a high-normal transferrin alongside low ferritin is a consistent pattern. His transferrin saturation, which measures how much of that transport protein is actually loaded with iron, is 19.55%, only just above the lower limit of 18 and well below the optimal range of 25 to 40%. His serum iron at 16.3 and total iron binding capacity at 71.7 are both within range, but the overall picture is one of early iron depletion without frank deficiency. This is one of the most common and most treatable causes of fatigue, poor exercise recovery, and even low mood, all three of the symptoms Kunal has reported. Iron is essential for oxygen transport in the blood, for mitochondrial energy production inside muscle cells, and for the synthesis of neurotransmitters including dopamine and serotonin. At a ferritin of 26, none of these systems are critically starved, but none are running at full capacity either. For a man doing four cardio sessions per week, the demand on red cell turnover and oxygen delivery is higher than average, and the stores are not deep enough to support that comfortably. This is very likely contributing to the poor recovery and fatigue he is experiencing.\n\nHis creatine kinase, an enzyme released from muscle when it is damaged or working hard, is 318 U/L, sitting right at the upper limit of 320. In isolation this would not be remarkable for someone who trains regularly, but Kunal is doing four cardio sessions per week with no resistance training. CK at this level from cardio alone, combined with poor recovery and fatigue, is another piece of the same picture: the body is working hard and not fully recovering between sessions. His cardiac markers are reassuring in this context. CK-MB at 2.92 and myoglobin at 38.15 are both well within range, confirming the CK elevation is skeletal muscle origin rather than cardiac.\n\nHis MCHC at 348 is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation, particularly as the lab themselves note that MCHC can be affected by temperature and storage. It is not clinically significant. His MPV, mean platelet volume, at 10.5 is slightly above the upper limit of 10.1. MPV reflects the average size of platelets, and a marginally elevated MPV in the context of a normal platelet count and no other haematological abnormality is not a concern. It can be seen with younger, more active platelets being released, which is physiologically normal.\n\nThe white blood cell count was not able to be processed due to the age of the sample and the lab has requested a repeat. This means we cannot assess his immune cell profile, including his neutrophil and lymphocyte counts and his neutrophil to lymphocyte ratio, which would have been useful given his fatigue and recovery complaints. This should be repeated on a fresh sample.\n\nHis urinalysis is clean. No protein, no glucose, no ketones, no significant white cells or red cells, and no casts. The urine culture returned a scanty mixed growth which the laboratory has called probable contamination, and given the absence of any white cells, red cells, or clinical symptoms, this is consistent with a sample artefact rather than any infection.\n\nPutting this together, Kunal has an excellent metabolic, cardiovascular, thyroid, and hormonal profile. The primary finding in this report is early iron depletion, with a ferritin of 26 and transferrin saturation of only 19.55%, which is very likely the main driver behind his fatigue, poor recovery, and potentially contributing to his low mood. The secondary finding is that his training programme, while commendable for cardiovascular health, includes no resistance training at all, which is directly relevant to his goal of building muscle and may be contributing to the elevated CK through inadequate recovery from the volume of cardio he is doing. His diet quality is excellent but the volume at 6 out of 10 may not be providing quite enough total fuel, and on a low-carb, high-protein diet, iron and B12 intake may be slightly below what he needs. These are all eminently fixable.","links":"Kunal's results point to a clear and actionable set of priorities. The single most impactful change he can make is to address his iron stores. A ferritin of 26 with a transferrin saturation of 19.55% means the body's reserves are running on fumes, and this is almost certainly behind a significant portion of his fatigue, poor recovery, and possibly his low mood. He should begin supplementing with ferrous bisglycinate, which is the best-tolerated form of iron, at 25mg per day taken alongside a source of vitamin C such as a small glass of orange juice or a vitamin C tablet, which roughly doubles iron absorption. He should take this on an empty stomach if tolerated, or with a light meal if it causes any stomach discomfort, but importantly not alongside tea, coffee, or calcium-rich foods which inhibit absorption. He should also increase dietary iron intake by including more red meat, dark poultry meat, and shellfish in his diet. On a low-carb, high-protein diet, he has good access to these foods, so it is a matter of making them a more regular feature. We would recommend he asks his GP to recheck ferritin, transferrin saturation, and a full blood count in three to four months to confirm the stores are rebuilding. The target is a ferritin above 80.\n\nHis Active B12 at 126.9 would benefit from a gentle push into the optimal zone above 150. Sublingual methylcobalamin at 1,000 mcg daily is the recommended form. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets. This is a simple, low-cost addition that supports nerve function, energy metabolism, and mood regulation.\n\nHis vitamin D at 93 is in a good place and he should continue whatever he is currently doing to maintain it, whether that is supplementation or sun exposure. If he is supplementing, 2,000 IU of cholecalciferol daily with a fat-containing meal is a good maintenance dose, and he should pair this with 100 mcg of vitamin K2 in the MK-7 form, which directs calcium into bones and away from arterial walls.\n\nRegarding his training and goals, Kunal wants to build muscle but is currently doing zero resistance training. No amount of dietary optimisation or supplementation will build meaningful muscle mass without progressive resistance training. He should aim to introduce two to three resistance sessions per week, focusing on compound movements such as squats, deadlifts, rows, presses, and pull-ups. These do not need to replace his cardio entirely, but some restructuring would help. A reasonable split would be three resistance sessions and two cardio sessions per week, rather than the current four cardio and zero resistance. This change alone will have a bigger impact on his body composition goal than anything else in this report.\n\nFor nutrition, at 75kg with a goal of losing body fat while building muscle, Kunal is in a position where he needs to eat enough to support muscle protein synthesis without creating a large surplus. His maintenance calories, based on his weight, height, age, and moderate activity level, are approximately 2,350 to 2,500 kcal per day. For a slow recomposition approach, which is realistic at his BMI of 24.5, he should aim for approximately 2,100 to 2,300 kcal per day with a protein intake of 120 to 140 grams per day, which equates to 1.6 to 1.9g per kg of bodyweight. This protein target is non-negotiable if he wants to build muscle. On a low-carb, high-protein diet this should be achievable, but he may need to be deliberate about hitting it every day. His diet volume at 6 out of 10 suggests he may sometimes be undereating, and while a mild deficit supports fat loss, chronic underfuelling will impair recovery and muscle building. He should track his intake for two to three weeks to establish whether he is consistently hitting these targets.\n\nFor his low mood and anxiety, the iron depletion is the most likely physiological contributor, and addressing it may noticeably improve his mood over the coming months. However, if the low mood and anxiety persist after iron stores are replenished and his energy improves, he should discuss this with his GP, as mood symptoms at 32 deserve attention regardless of blood results.\n\nHis white blood cell count should be repeated on a fresh blood sample, ideally within the next four to six weeks, to complete his immune profile. He should mention to the phlebotomist or clinic that the previous sample was flagged for age-related degradation so that the new sample is processed promptly.\n\nA retest of the full advanced panel in six months would be ideal to confirm the iron stores have recovered, the B12 has moved into the optimal zone, and the CK has normalised once his training programme is restructured.","flags":"1. Ferritin 26 ng/ml (lab range 22-322, optimal 50-200) with transferrin saturation 19.55% (lab range 18-55, optimal 25-40%). Early iron depletion. Stores are technically within the laboratory reference range but are functionally low, particularly for an active male. Likely contributing to reported fatigue, poor recovery, and low mood. Recommend supplementation and recheck in 3-4 months.\n\n2. White blood cell count not available due to sample age. Lab has requested repeat on fresh sample. This means neutrophil count, lymphocyte count, and neutrophil-to-lymphocyte ratio could not be assessed. Recommend repeat within 4-6 weeks.\n\n3. Active B12 126.9 pmol/L (lab range 25.1-165, optimal >150). Below optimal but not deficient. On a low-carb, high-protein diet, B12 intake is usually adequate from animal sources, so this may reflect individual absorption variation. Recommend sublingual methylcobalamin supplementation.\n\n4. MCHC 348 g/L (range 315-345). Marginally above range. Lab notes temperature and storage can affect this marker. Not clinically significant at this margin with all other red cell indices normal.\n\n5. MPV 10.5 fL (range 7.1-10.1). Marginally above range. Normal platelet count and no other haematological abnormality. Not clinically significant.\n\n6. Serum Folate 20 ng/ml (range 3-17). Above range. Reflects good dietary intake or supplementation. No clinical concern.\n\n7. Creatine Kinase 318 U/L (range 40-320). At the upper limit. Consistent with regular exercise but notable given that training is cardio-only. May reflect incomplete recovery between sessions. Cardiac markers CK-MB and myoglobin are normal, confirming skeletal muscle origin.\n\nReassuring negatives: HbA1c 34 confirms no diabetes or pre-diabetes, which is particularly reassuring in a South Asian male. Lipid profile is excellent with ApoB 0.77 and TG/HDL ratio 0.49. Liver function is clean across all markers. Kidney function is healthy. Thyroid function is optimal. Testosterone is in the optimal range at 26.4. hs-CRP 0.8 rules out significant systemic inflammation. Vitamin D is in the optimal range. Corrected calcium and magnesium are within range. Urinalysis is clean.","recommendations":"1. Begin iron supplementation: ferrous bisglycinate 25mg daily with vitamin C, taken away from tea, coffee, and calcium. Increase dietary iron from red meat, dark poultry, and shellfish.\n\n2. Begin sublingual methylcobalamin 1,000 mcg daily to optimise B12 from 126.9 to above 150 pmol/L.\n\n3. Continue vitamin D maintenance at 2,000 IU cholecalciferol daily with a fat-containing meal, paired with 100 mcg vitamin K2 (MK-7).\n\n4. Repeat the white blood cell count on a fresh blood sample within 4-6 weeks.\n\n5. Introduce 2-3 resistance training sessions per week built around compound movements. Restructure training from 4 cardio/0 resistance to 3 resistance/2 cardio to support the muscle-building goal.\n\n6. Aim for 2,100-2,300 kcal per day with a protein floor of 120-140g per day (1.6-1.9g/kg). Track intake for 2-3 weeks to confirm targets are being met.\n\n7. Increase daily step count towards 7,500-10,000 to support fat loss and general metabolic health.\n\n8. Recheck ferritin, transferrin saturation, and full blood count with GP in 3-4 months to confirm iron recovery.\n\n9. If low mood and anxiety persist after iron stores are replenished and energy improves, discuss with GP.\n\n10. Repeat the full advanced panel in approximately 6 months.","supplementation":"Iron: Ferrous bisglycinate, 25mg elemental iron per day. Take on an empty stomach if tolerated, otherwise with a light meal. Always take alongside vitamin C (a 250mg tablet or a glass of orange juice) to enhance absorption. Do not take within two hours of tea, coffee, dairy, or calcium supplements, as these significantly reduce iron absorption. The reason for this is his ferritin of 26 and transferrin saturation of 19.55%, both of which indicate depleted iron stores that are very likely contributing to his fatigue, poor recovery, and low mood. The target is a ferritin above 80 ng/ml.\n\nVitamin B12: Sublingual methylcobalamin, 1,000 mcg daily. Place under the tongue and allow to dissolve fully. Sublingual delivery is preferred over oral tablets because it is absorbed directly into the bloodstream, bypassing the gut where absorption can be variable. His Active B12 at 126.9 is within the laboratory range but below the optimal level of 150. B12 supports energy production, nerve health, and neurotransmitter synthesis, all relevant to his fatigue and mood symptoms.\n\nVitamin D3: Cholecalciferol, 2,000 IU daily, taken with a meal that contains fat (the fat is necessary for absorption as vitamin D is fat-soluble). His current level of 93 nmol/L is within the optimal range of 75 to 120, so this is a maintenance dose to sustain that level through the year, particularly through the autumn and winter months when UVB exposure in the UK drops significantly.\n\nVitamin K2: MK-7 form, 100 mcg daily, taken at the same time as vitamin D. K2 works alongside vitamin D to direct calcium into bones and teeth and away from soft tissues and arterial walls. Anyone supplementing vitamin D long-term should pair it with K2.\n\nMagnesium: Magnesium glycinate, 300mg before bed. His serum magnesium at 1.01 is within the optimal range, but magnesium is rapidly depleted by regular exercise and by stress, and glycinate in particular supports sleep quality and muscle relaxation. Given his training load and his report of fatigue and poor recovery, this is a worthwhile addition.\n\nThe most important changes from this report are not supplements. They are the introduction of resistance training to support his muscle-building goal, ensuring his daily protein intake consistently hits 120 to 140 grams, and allowing his body adequate recovery between training sessions. The iron supplementation will take three to four months to meaningfully rebuild his stores, and the benefits in energy, mood, and recovery should become noticeable within that timeframe.","biomarkers":[{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3378","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3426","upper_optimal_position":"0.5926","units":"ng/ml","description":"Ferritin is the body's iron storage protein. Each ferritin molecule can hold thousands of iron atoms and release them when the body needs them for oxygen transport, energy production, and immune function. At 26 ng/ml, Kunal's ferritin is technically within the laboratory range of 22 to 322, but it is well below the optimal level of 50 to 200 for an active male. At this level, the reserves are thin and the body may begin to economise on iron-dependent processes, including red blood cell production, mitochondrial energy generation in muscles, and neurotransmitter synthesis. This is one of the most common causes of unexplained fatigue, poor exercise recovery, and even low mood, all of which Kunal reports.","low_causes":"Low dietary iron intake, blood loss, intense exercise increasing iron turnover, poor absorption (coeliac disease, gut inflammation), vegetarian/vegan diet","high_causes":"Iron supplementation, haemochromatosis, liver disease, chronic inflammation, repeated blood transfusions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"19.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3473","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures what percentage of the iron-carrying protein transferrin is actually loaded with iron. At 19.55%, only about a fifth of Kunal's transferrin is carrying iron, which is just above the lower limit of 18% and well below the optimal range of 25 to 40%. This is consistent with his low ferritin and confirms that iron availability throughout the body is limited. The body is producing plenty of transport capacity but does not have enough iron to fill it.","low_causes":"Iron deficiency, chronic disease, low dietary iron intake","high_causes":"Iron overload, haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"16.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3572","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3506","upper_optimal_position":"0.5184","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the sample. At 16.3 umol/l, this is within the laboratory range of 11.6 to 31.3. Serum iron fluctuates throughout the day and with meals, so it is less reliable as a standalone marker than ferritin or transferrin saturation. In the context of Kunal's low ferritin and low transferrin saturation, a serum iron at the lower half of range is consistent with the overall picture of early iron depletion.","low_causes":"Iron deficiency, chronic inflammation, poor dietary intake","high_causes":"Iron supplementation, haemochromatosis, liver damage, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5933","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4111","upper_optimal_position":"0.6333","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the tissues that need it. The liver produces more transferrin when iron stores are low, essentially building more trucks to carry what little iron is available. At 3.32 g/L, Kunal's transferrin is towards the upper end of the range of 2.15 to 3.65, which is consistent with the body upregulating iron transport in response to his low ferritin. This is a normal physiological response to early iron depletion.","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron_binding_capacity","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"71.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5510","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6040","units":"umol/l","description":"Total iron binding capacity measures the maximum amount of iron that transferrin in the blood could carry if it were fully saturated. At 71.7 umol/l, this is towards the upper end of the range of 44 to 76.1, reflecting the higher transferrin levels the body has produced in response to lower iron stores. A high-normal TIBC alongside low ferritin and low transferrin saturation is a classic pattern of early iron depletion.","low_causes":"Iron overload, liver disease, chronic inflammation","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2946","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. At 33, Kunal's ALT is within the laboratory range of less than 56 but sits above the tighter optimal threshold of less than 30 for males. In isolation, this is not a concern, particularly as all other liver markers are healthy. Mild ALT elevations can occur with exercise, and his CK at the upper limit suggests recent muscular activity that may have contributed a small amount.","low_causes":"Normal finding, vitamin B6 deficiency (rare)","high_causes":"Liver disease, fatty liver, alcohol, medications, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5833","units":"IU/l","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is more specific to the liver, AST rises with both liver damage and muscle damage. At 31, this is well within range and, given his elevated CK, the small contribution from muscle activity is expected.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver disease, muscle damage, heart attack, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1644","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"GGT, gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol, bile duct obstruction, and metabolic stress on the liver. It is often the first liver marker to rise when the liver is under strain. At 24, this is well within the optimal range for males of less than 25, meaning the liver is handling its workload without any visible stress.","low_causes":"Normal finding","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alkaline_phosphatase","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP, alkaline phosphatase, is an enzyme found in the liver, bones, and bile ducts. Elevated levels can indicate bile duct obstruction, bone disorders, or liver disease. At 81, this is comfortably mid-range and healthy.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5104","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes bilirubin and excretes it in bile. At 10 umol/l, this is well within range and confirms the liver is processing bilirubin efficiently.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6666666667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains the fluid balance between blood vessels and tissues. At 44, this is within the optimal range and reflects good liver synthetic function and adequate protein intake.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 77, this is within the optimal range and reflects healthy liver function and an adequately functioning immune system.","low_causes":"Liver disease, kidney disease, malnutrition, immune deficiency","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6481","units":"g/l","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies) and transport proteins. At 33, this is within range and reflects normal immune function.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4190","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. At 1.33, this is within range and reflects a healthy balance between liver-produced albumin and immune-related globulins.","low_causes":"Overproduction of globulins (infection, inflammation, autoimmune disease), underproduction of albumin (liver disease)","high_causes":"Underproduction of globulins (immune deficiency)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"0.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2276","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. At 0.66, this is well below the threshold of 1.45, confirming there is no sign of liver fibrosis. This is a reassuring finding.","low_causes":"Normal, healthy liver","high_causes":"Liver fibrosis, cirrhosis, age (the score naturally rises with age), low platelet count, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4247","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL. At 4.4, this is well below the desirable threshold of 5.18. On its own, total cholesterol is a crude measure, but when broken down into its components as in this panel, Kunal's profile is excellent across the board.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldl_cholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5160","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5067","units":"mmol/l","description":"LDL, low-density lipoprotein cholesterol, is often called 'bad' cholesterol because elevated levels drive the formation of plaques in artery walls. At 2.58, this is within range and just inside the optimal threshold of 2.6. This is a good result, particularly for a South Asian male where cardiovascular risk tends to be higher at any given cholesterol level.","low_causes":"Hyperthyroidism, liver disease, malabsorption, malnutrition","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl_cholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, high-density lipoprotein cholesterol, is the protective cholesterol. It collects excess cholesterol from artery walls and transports it back to the liver for disposal. Higher is better. At 1.5, Kunal's HDL is good and approaching the desirable threshold of 1.55. The optimal level for males is above 1.4, which he meets. However, given the lab flags this as the desirable target being above 1.55, there is room to push this slightly higher through continued exercise and potentially increasing omega-3 rich fish intake.","low_causes":"Sedentary lifestyle, smoking, obesity, high refined carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, high omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary carbohydrate and fat intake and how well the body metabolises them. At 0.73, this is an excellent result, well within the optimal threshold of less than 1.0. Low triglycerides on a low-carb diet are expected and are a genuine positive, reflecting good insulin sensitivity and efficient fat metabolism.","low_causes":"Low-carb diet, fasting, malabsorption, hyperthyroidism","high_causes":"High carbohydrate/sugar diet, obesity, insulin resistance, alcohol excess, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2115","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, very low-density lipoprotein cholesterol, is a triglyceride-rich particle produced by the liver. At 0.33, this is well within range and reflects the same excellent triglyceride metabolism seen in the triglyceride result. Low VLDL is a positive marker for metabolic health.","low_causes":"Low-carb diet, fasting","high_causes":"High carbohydrate diet, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3256","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a simple way to express cardiovascular risk. Lower is better. At 2.93, this is well below the threshold of 4.5 and reflects an excellent balance between total and protective cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"34.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4261","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. Higher is better, and at 34.09%, more than a third of Kunal's total cholesterol is the protective HDL fraction. Anything above 20% is considered healthy, so this is an excellent result.","low_causes":"Low HDL relative to total cholesterol, metabolic syndrome","high_causes":"High HDL, good cardiovascular fitness","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apolipoprotein_a1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5125","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.2","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. It is effectively a count of the protective lipoprotein particles. At 1.23, this is above the minimum threshold of 1.20, confirming adequate HDL particle number.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apolipoprotein_b","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL, and Lp(a) par ning in the background. This is a genuinely positive finding.","low_causes":"Low systemic inflammation, healthy lifestyle","high_causes":"Chronic infection, obesity, smoking, autoimmune disease, cardiovascular disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5887","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product of protein metabolism, filtered by the kidneys and excreted in urine. At 7.1, this is within the laboratory range of 3.2 to 8.2 but just above the optimal ceiling of 7.0. On a high-protein diet, urea is expected to sit at the higher end of range because the kidneys are processing more protein waste. This is not a concern given his healthy creatinine and eGFR.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product of muscle metabolism, filtered by the kidneys at a steady rate. At 78, this is comfortably within the optimal range, confirming healthy kidney filtration.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate measures how effectively the kidneys filter waste from the blood. An eGFR above 90 is considered optimal kidney function. At above 90, Kunal's kidneys are working well, as expected for a healthy 32-year-old.","low_causes":"Kidney disease, dehydration, certain medications, aging","high_causes":"Hyperfiltration (early diabetes), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"300","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4114","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5470","units":"umol/l","description":"Uric acid is a waste product of purine metabolism, which comes from both dietary sources (red meat, shellfish, organ meats) and the body's own cell turnover. Elevated levels can lead to gout and are associated with cardiovascular risk. At 300, this is well within the optimal range of 200 to 380 for males.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","r cise, poor dietary intake, diabetes","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"156","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 156, this is within the optimal range for males (140-165) and confirms adequate oxygen-carrying capacity. Notably, despite his low ferritin, the haemoglobin has not yet been affected, meaning iron depletion is at the storage phase rather than having progressed to affect red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Dehydration, polycythaemia, living at altitude, smoking, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"red_blood_count","name":"Red Blood Count","group":"HEMATOLOGY","result":"5.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells in the blood. At 5.09, this is within the optimal range, confirming healthy red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking","padding":" position":"0.3333333333","upper_optimal_position":"0.5476","units":"%","description":"RDW measures the variation in red blood cell size. A wider distribution suggests that cells of different sizes are being produced, which can indicate evolving iron, B12, or folate deficiency. At 12.9, this is well within range, confirming that red cell production is consistent and uniform.","low_causes":"Normal finding","high_causes":"Iron deficiency, B12/folate deficiency, mixed deficiencies, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"262","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4769","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that are essential for blood clotting. At 262, this is well within the optimal range, confirming healthy platelet production and no indication of clotting or bleeding abnormalities.","low_causes":"Viral infections, liver disease, bone marrow disorders, medications, autoimmune conditions","high_causes":"Iron deficiency, infection, inflammation, post-surgery, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"10.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"8","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are generally younger and more active. At 10.5, this is marginally above the imal_position":"0.4258","upper_optimal_position":"0.5805","units":"umol/L","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It is the most abundant steroid hormone in the body and declines naturally with age. At 3.3 umol/L (equivalent to approximately 1,216 ug/dL), this is within the laboratory range but slightly below the optimal band starting at 4.0. Given that Kunal's testosterone is already excellent, a slightly lower DHEA-S is not contributing to any clinical issue. It may simply reflect individual variation in adrenal output.","low_causes":"Aging, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3820","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3695","upper_optimal_position":"0.4620","units":"mIU/l","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland to signal the thyroid to produce thyroid hormones. It is the most sensitive marker of thyroid function. At 1.2, this is right in the sweet spot of the optimal range between 1.0 and 2.5, meaning the pituitary is satisfied with the thyroid's output and does not need to push it harder.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary insufficiency","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_t4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5893","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5905","units":"pmol/l","description":"Free T4 is the inactive form of thyroid hormone that circulates in the blood and is converted into the active form, T3, by cells throughout the body. At 20.3, this is at the upper end of the optimal range, indicating robust thyroid hormone production. Combined with the optimal TSH, this confirms the thyroid is producing plenty of hormone without being pushed to do so.","low_causes":"Hypothyroidism, iodine deficiency, pituitary disorders","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_t3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells use for energy production, metabolism, and temperature regulation. At 5.2, this is within the optimal range of 4.5 to 6.5. Good T3 levels are important for energy, and this result helps rule out thyroid dysfunction as a contributor to Kunal's fatigue.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, low calorie intake, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3875","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","low
