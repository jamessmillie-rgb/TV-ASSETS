const REPORT_DATA = {"patient_name":"Meite Niamba","dob":"06/04/1988","report_date":"2026-10-09","summary":"Meite is a 38-year-old male presenting with a BMI of 28.4, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). He trains five times per week (two cardio, three resistance) at hard intensity with 7,500 to 10,000 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking, with steady energy through the day. Stress feels hard to manage some weeks. He does not drink alcohol. He reports using anabolic steroids or PEDs and supplements with creatine, protein powder and omega-3 fish oil. His previous blood test was normal. His goals are to build muscle, improve long-term health and longevity, and improve sleep quality. He has been open and pragmatic about his situation: he is a competitive bodybuilder using PEDs, he wants to monitor and manage the health consequences of that use, and if the results are seriously alarming he will consider stopping.\n\nThis report is honest about what the bloods show. There are genuine positives, there are consequences of PED use that are manageable, and there is one inherited cardiovascular finding that changes the risk picture permanently. The most important result in this report is the Lp(a).\n\nMeite's Lp(a), lipoprotein little-a, is 152 nmol/L, well above the 32 nmol/L threshold and sitting in the moderate-risk band (90 to 200). Lp(a) is a particle made by the liver that carries cholesterol into artery walls, encourages blood clots, and drives local inflammation. It is entirely inherited, it does not change with diet, exercise, weight loss, or any currently available supplement, and once measured it is a permanent entry in a medical record. The reason this matters so much here is that it sits alongside an already elevated ApoB of 1.25 g/L (target below 0.9), an LDL of 4.06 mmol/L (target below 3.0), and a total cholesterol of 6.2 mmol/L. ApoB, apolipoprotein B, is the protein coat on every LDL and VLDL particle, and it is the single best measure of how many atherogenic particles are circulating. At 1.25, there are roughly 40 percent more particles than there should be. Part of that is driven by the Lp(a) itself, because every Lp(a) particle carries one ApoB molecule. The Lp(a)-corrected LDL, which strips out the cholesterol carried on Lp(a) particles, is 3.57 mmol/L, still above the 3.0 target. That means even after accounting for the inherited load, there is modifiable LDL cholesterol that diet and lifestyle can bring down. The non-HDL cholesterol at 4.7 (target below 4.0), the ApoB/A1 ratio at 0.84 (target below 0.7, currently sitting at average risk), and the remnant cholesterol all point in the same direction. The cardiovascular risk score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 85 out of 100, which is high. At 38, Meite's ten-year risk of a cardiovascular event is statistically low because these models are weighted heavily by age, but the gap between that low ten-year risk and this high score is exactly the window in which acting aggressively makes the biggest difference. The longer these particle counts stay elevated, the more cholesterol is deposited in artery walls, and the process is cumulative. This is worth discussing with a GP, and specifically whether a referral to a lipid clinic is appropriate given the combination of elevated Lp(a) and elevated ApoB. First-degree relatives, parents and siblings, should also be offered Lp(a) testing because this is inherited and they may carry the same risk without knowing.\n\nAnabolic steroid use is a known driver of unfavourable lipid shifts: it typically suppresses HDL, raises LDL, and increases ApoB. Meite's HDL at 1.5 mmol/L is actually reasonable, not in the optimal band above 1.55 but not suppressed in the way PEDs often cause, and his ApoA1 at 1.48 is above the 1.20 floor. His triglycerides at 1.55 are within the acceptable range though above the optimal target of 1.0, and the TG/HDL ratio at 1.03 is below the 1.5 ceiling. So the lipid picture is a mix: genuine inherited risk from the Lp(a), a modifiable component in the LDL and ApoB that PED use and diet are both contributing to, and a metabolic profile (triglycerides, HDL) that is not as damaged as PED use often produces.\n\nThe hormonal panel tells the expected story of exogenous testosterone use. Testosterone is 35.4 nmol/L, above the laboratory ceiling of 28.7, and free testosterone calculated at 0.963 nmol/L is at the top of range. Bioavailable testosterone, the fraction not bound to sex hormone binding globulin (SHBG), is 22.06 nmol/L, well above the 2 to 9 reference range. These are supraphysiological levels consistent with exogenous administration. The downstream consequences are visible: LH (luteinising hormone, the pituitary signal that tells the testes to produce testosterone) is suppressed to below 0.07 mIU/mL, and FSH (follicle stimulating hormone, the signal that drives sperm production) is below 0.3 mIU/mL. Both are effectively undetectable. This confirms that the hypothalamic-pituitary-gonadal axis is fully suppressed, which is the expected pharmacological effect of exogenous testosterone. Oestradiol is markedly elevated at 499 pmol/L against a male upper limit of 146. This is aromatisation, the conversion of excess testosterone into oestrogen by the enzyme aromatase, which is found in fat tissue, muscle and liver. At this level, Meite should be aware of the risk of gynaecomastia (breast tissue growth), fluid retention and mood changes. Whether to use an aromatase inhibitor is a decision for whoever is supervising his PED protocol, but the number is high enough that it warrants attention. SHBG at 27.2 is within range but towards the lower end, which is typical with supraphysiological androgens because the liver reduces SHBG production when testosterone is high. The free androgen index at 130 is elevated but within the 30 to 150 range. Cortisol at 138 nmol/L is below the morning reference range of 145 to 619. If this sample was taken in the morning, this is a low cortisol reading that could reflect HPA axis suppression, possibly from exogenous corticosteroids if any are part of the protocol, or from chronic hard training with imperfect recovery. If it was taken in the afternoon, it falls within the 95 to 462 afternoon range and is less concerning. This is worth noting but not alarming in isolation.\n\nDHEA-sulphate at 5.0 umol/L (1,842 ug/dL) is within the broad laboratory range, and prolactin at 181 uIU/mL is comfortably within range, which is reassuring because some PED compounds can raise prolactin. Progesterone at 0.91 nmol/L is at the floor of the male range but within it, and is not clinically significant.\n\nThe liver panel is mixed. ALT at 33 is above the optimal target of 30 for a male but within the laboratory limit of 56. AST at 44 is at the upper edge of range (13 to 45). GGT at 45 is within the laboratory range of 4 to 73 but above the optimal threshold of 25. In a non-drinking bodybuilder on PEDs, the two most likely explanations are the direct hepatic effect of oral or injectable compounds, and intense resistance training itself, which releases AST from muscle as well as liver. The De Ritis ratio (AST divided by ALT) at 1.33 is marginally above the optimal ceiling of 1.3, and in the context of very high CK, this ratio is being pulled up by muscle-derived AST rather than liver disease. The FIB-4 score at 1.37 is marginally above the 1.3 threshold but well below 2.0, and with no other sign of fibrosis, this is the calculation responding to the AST rather than actual liver scarring. The APRI at 0.52 is just above the 0.5 optimal ceiling, again driven by the AST. The NAFLD fibrosis score at minus 1.81 is comfortably in the low-risk zone, ruling out significant fibrosis. Bilirubin at 12 is healthy. Albumin at 42 is solid. Total protein at 76 and globulin at 34 are both within range. The liver is working, it is under some strain, and it needs monitoring every three to six months while PED use continues.\n\nAmylase is elevated at 152 IU/L against an upper limit of 118. Amylase is an enzyme produced mainly by the pancreas and salivary glands that breaks down starch. An isolated elevation with a normal lipase (46, well within the 13 to 60 range) is reassuring because in acute pancreatitis both rise together. Isolated raised amylase can come from salivary sources (macro-amylase, a benign variant), from intense exercise, or occasionally from PED use. It is not a concern at this level with a normal lipase, but it should be noted and repeated at the next test to confirm it is stable.\n\nCreatine kinase (CK) is 968 U/L, three times the upper limit of 320. CK is an enzyme released from damaged muscle cells, and in a competitive bodybuilder training hard, this is expected. The clinical concern with persistently very high CK is the strain it places on the kidneys as they clear the breakdown products. This links directly to the kidney findings.\n\nCreatinine is 128 umol/L, above the laboratory range of 65 to 104. The creatinine-based eGFR is 61, just above the threshold of 60. In a muscular male of African ancestry taking creatine supplements, creatinine overestimates kidney impairment because creatinine is a breakdown product of creatine, which is present in greater quantities in larger muscle mass and is further increased by creatine supplementation. This is exactly why Cystatin C matters. Cystatin C is a small protein produced by all cells at a constant rate and filtered by the kidneys; it is not affected by muscle mass, diet or supplements. His Cystatin C is 1.03 mg/L against a ceiling of 1.1, giving a Cystatin C-based eGFR of 74 and a combined eGFR of 74. An eGFR of 74 at 38 is below the optimal threshold of 90 and sits in the mildly reduced category (G2, 60 to 89). This is not kidney failure, but it is not where it should be at his age. The most likely explanation is the chronic load from intense training, high CK, high-protein diet, creatine supplementation, and PED use all placing sustained demand on the kidneys. The urea at 6.6, sodium at 138, chloride at 98, bicarbonate at 26.3, uric acid at 318 and osmolality at 287 are all within range, which is reassuring. There is no protein in the urine and no red blood cells, which rules out glomerular damage at present. But an eGFR of 74 at 38 deserves monitoring. If it falls below 60 on repeat testing, that would be a firm indication to reassess PED use and supplementation.\n\nThe blood count is largely healthy but with two findings to note. Neutrophils at 1.79 are below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the first responder to bacterial infection. In people of African and Caribbean ancestry, benign ethnic neutropenia is very common, affecting up to 25 to 50 percent of the population. This is a normal variant, not a disease, and it does not increase infection risk. His total white cell count at 4.61 is within range, lymphocytes at 2.27 are healthy, and there is no sign of infection or immune suppression. The neutrophil count is almost certainly benign ethnic neutropenia and does not need treatment. MCH (mean corpuscular haemoglobin, the average weight of haemoglobin in each red blood cell) is 32.7 pg, marginally above the 32 upper limit. This is a trivial overshoot and clinically insignificant, especially with a normal MCV of 94.8 and a normal MCHC of 345. Haemoglobin at 167 is at the top of range (130 to 170) and haematocrit at 0.486 is towards the upper end of its range. In a PED user, these need watching because supraphysiological testosterone stimulates red blood cell production through erythropoietin, and a haematocrit above 0.50 increases the risk of blood clots, stroke and cardiovascular events. At present the numbers are within range, but they should be checked every three to six months.\n\nIron studies are well balanced. Ferritin at 96 is comfortably within the optimal band of 50 to 200. Transferrin saturation at 26 percent is within the ideal range. Serum iron, transferrin and iron binding capacity are all within range. There is no iron overload and no deficiency.\n\nBlood sugar control is excellent. Fasting glucose at 4.2 mmol/L is within the optimal range. HbA1c at 37 mmol/mol (5.5 percent) is well below the prediabetes threshold and narrowly above the optimal ceiling of 36. Fasting insulin at 3.45 mIU/L is within the optimal band of 2 to 8, and HOMA-IR at 0.64 confirms strong insulin sensitivity. C-peptide at 1.21 ug/L (400 pmol/L) is within range. The estimated average glucose at 6.2 mmol/L and TyG index at 8.56 are both within range. The pancreas is working efficiently and there is no metabolic syndrome.\n\nThe thyroid is working well. TSH at 1.64 is within the optimal band of 1.0 to 2.5. Free T4 at 16.6 and free T3 at 4.9 are both within their optimal ranges. The FT3 to FT4 ratio at 0.295 confirms good conversion. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease.\n\nhsCRP at 0.9 mg/L is below the optimal ceiling of 1.0, which is impressive for someone training at this intensity and on PEDs. ESR at 6 is well within range. The systemic immune-inflammation index at 167 and the platelet-to-lymphocyte ratio at 93 are both within their optimal bands. There is no systemic inflammation.\n\nImmunoglobulins are largely within range. IgG at 15.3 is within the 6.5 to 16 range, IgM at 1.2 and IgA at 2.6 are both healthy. IgE, however, is elevated at 242 IU/mL against a ceiling of 100. IgE is the antibody class associated with allergic responses, and a level this high suggests an active allergic sensitisation, possibly environmental allergens (dust mites, pollen, moulds) or less commonly a food allergy. It does not indicate anything dangerous, but if Meite experiences any nasal congestion, skin reactions, or respiratory symptoms, this result supports investigating with a specific allergen panel. Anabolic steroids can sometimes modulate immune function, but IgE at this level is more likely a genuine allergic tendency.\n\nTotal antioxidant activity at 2.18 is above the laboratory range of 1.3 to 1.77. This is almost certainly driven by his omega-3 supplementation and dietary antioxidant intake from 4 to 5 portions of vegetables and fruit daily. It is a positive finding and not a concern.\n\nVitamin D at 62 nmol/L is sufficient but below the optimal range of 75 to 120. At his skin pigmentation and in the UK, this is common and easily correctable with supplementation. B12 at 448 pg/mL is within range but below the optimal floor of 500. Folate at 13 is healthy. Calcium at 2.49, phosphate at 1.1, magnesium at 0.95 and PTH at 2.2 are all within their optimal ranges. Bone mineral metabolism is in good shape.\n\nThe prostate markers are reassuring. PSA at 1.35 is well within the age-appropriate limit, and the free PSA ratio at 0.34 (34 percent) is strongly reassuring. Tumour markers CA19-9 at 10.4 and CEA at 0.85 are both well within range. Coeliac screening (tissue transglutaminase) is negative. Rheumatoid factor is negative.\n\nThe urinalysis is clean. No protein, no glucose, no blood, no casts, no nitrites. Urine WBCs at 10 are at the threshold of significance and with no nitrites, no bacteria reported yet, and no symptoms, this is not a concern. The bacterial culture is pending.\n\nPhenoAge, a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 39.7 years against a calendar age of 38, a difference of 1.7 years. This is a modest gap and the main driver is the creatinine, which as discussed is inflated by muscle mass and creatine rather than true kidney ageing. If creatinine were at a typical level for his age, PhenoAge would likely sit at or below his calendar age.\n\nTo put this report in context for Meite's stated goal: the bloods are not seriously alarming in the sense that there is no organ failure, no dangerous haematocrit, no liver damage, and no immediate crisis. But they are not clean either. The combination of a high inherited Lp(a) with PED-driven lipid changes creates a cardiovascular risk profile that deserves medical attention. The kidney function is mildly reduced for his age. The oestradiol is high. These are the costs of the current approach, and they are measurable and monitorable. The path forward is to manage what is manageable, keep monitoring every three to six months, and have an honest conversation with a GP or sports medicine physician about the Lp(a) finding in particular.","links":"The central thread in this report is the interaction between inherited cardiovascular risk and the pharmacological effects of PED use. Meite carries an Lp(a) of 152, a genetic trait that deposits cholesterol into artery walls independently of lifestyle. On top of that, exogenous testosterone raises LDL and ApoB, and his ApoB at 1.25 confirms an elevated particle count even after correcting for the Lp(a) contribution (corrected LDL still 3.57, above target). The cardiovascular risk score of 85 out of 100 reflects this compounding effect. Neither risk factor alone would be as concerning as the two together: a modifiable lipid problem layered onto an unmodifiable genetic one.\n\nThe hormonal picture is internally consistent and tells a single story. Supraphysiological testosterone (35.4 nmol/L) has fully suppressed the pituitary signals LH and FSH, confirming the hypothalamic-pituitary-gonadal axis is shut down by exogenous supply. The excess testosterone is aromatising to oestradiol at 499 pmol/L, more than three times the upper male limit. SHBG is low-normal at 27.2, pushed down by the high androgen environment. This is the expected endocrine signature of testosterone-based PED use and is not surprising, but the oestradiol level is high enough to warrant management.\n\nThe kidney, liver and muscle findings are also connected. Hard resistance training produces a very high CK (968), which means the kidneys are filtering large quantities of muscle breakdown products. Add creatine supplementation (which raises creatinine independently of kidney function), a high-protein diet, and the direct renal effects of PED use, and the mildly reduced Cystatin C eGFR of 74 makes sense. It is not dangerous today, but it establishes a baseline that must be tracked. The liver enzymes are mildly elevated in the same direction, with AST at the ceiling and GGT above optimal, but the fibrosis scores rule out scarring and the pattern is consistent with muscle turnover and PED metabolism rather than liver disease.\n\nWhat was excluded matters. There is no systemic inflammation (hsCRP 0.9, ESR 6), no insulin resistance (HOMA-IR 0.64), no thyroid dysfunction, no anaemia, no iron overload, no liver fibrosis, no prostate concern, no coeliac disease, and no autoimmune markers. The blood sugar control is excellent. These are genuine positives that show the metabolic foundation is strong despite the pharmacological load.\n\nThe two loose ends are the elevated IgE at 242 and the amylase at 152. The IgE suggests an allergic sensitisation unrelated to PED use and worth investigating if symptoms are present. The amylase, with a normal lipase, is almost certainly benign (salivary or exercise-related) but should be confirmed stable on retest.","lifestyle":"Add a portion of oily fish (salmon, mackerel, sardines) twice a week, in addition to your omega-3 supplement. Anchor: replace one protein source at two meals per week. Why: oily fish provides EPA and DHA in a form that lowers ApoB and triglycerides more effectively than supplements alone, and your ApoB at 1.25 needs every lever available.\nAdd a daily portion of soluble fibre: oats at breakfast, a handful of almonds, or a tablespoon of ground flaxseed stirred into a shake. Anchor: add it to your first meal or your protein shake. Why: soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more, directly lowering the LDL of 4.06 and ApoB of 1.25.\nReduce sugary food from some days to once or twice a week. Anchor: when the craving hits, swap for Greek yoghurt with berries or dark chocolate (85 percent plus). Why: sugar drives triglyceride production in the liver, and your triglycerides at 1.55 are above the optimal 1.0 target.\nKeep your 7,500 to 10,000 daily steps and add one 20-minute zone-2 cardio session (brisk walk, easy cycling, heart rate around 130). Anchor: attach it to a rest day or after a resistance session. Why: steady-state cardio improves HDL function and endothelial health, both of which matter with an Lp(a) of 152 because you cannot change the Lp(a) but you can protect the artery walls it targets.\nSet a fixed wake time seven days a week, within 30 minutes. Get outside within the first hour for 10 minutes of natural light. Anchor: alarm goes off, feet on floor, shoes on. Why: you report being slow to get going, and morning light resets the cortisol awakening response, which was low at 138 in this test, sharpening the transition from sleep to wakefulness.\nCut caffeine by 2pm. Anchor: set a phone reminder. Why: caffeine has a half-life of five to six hours, and any consumed after 2pm will still be active at bedtime, reducing deep sleep quality even if you fall asleep easily. Better deep sleep supports muscle recovery and growth hormone release.\nAim for roughly 2,200 to 2,400 kcal on rest days and 2,600 to 2,800 kcal on training days, with a protein floor of 135 to 155 grams per day (1.6 to 1.85 g/kg). Your current TDEE at hard training five days a week is approximately 2,700 kcal. On a building phase, stay at or slightly above maintenance; on a cutting phase, do not drop below 2,000 kcal without monitoring kidney function and CK.","flags":"Lp(a) 152 nmol/L (target below 32, moderate risk band 90 to 200). Entirely inherited, permanently elevated, not modifiable by diet or lifestyle. Combined with ApoB 1.25 g/L (target below 0.9), LDL 4.06 mmol/L (target below 3.0), Lp(a)-corrected LDL 3.57, and non-HDL cholesterol 4.7 (target below 4.0), this creates a significant cumulative cardiovascular risk profile. Cardiovascular risk score 85/100. Recommend GP referral, consider lipid clinic, and test first-degree relatives for Lp(a).\nTestosterone 35.4 nmol/L (above range 8.4 to 28.7), LH below 0.07 (range 1.5 to 9.3), FSH below 0.3 (range 1.4 to 18.1). Consistent with exogenous testosterone use as disclosed. HPG axis fully suppressed. Fertility implications while on cycle.\nOestradiol 499 pmol/L (upper limit 146). Aromatisation of supraphysiological testosterone. Discuss management with PED supervisor or GP.\nCystatin C eGFR 74 mL/min/1.73m2 (optimal above 90). Mildly reduced kidney filtration at 38. Creatinine 128 (above range) is inflated by muscle mass and creatine supplementation, but Cystatin C confirms a genuine mild reduction. Monitor three to six monthly.\nHaemoglobin 167 g/L and haematocrit 0.486 (both at upper end of range). Not yet above range but need monitoring given PED-driven erythropoiesis. If haematocrit exceeds 0.50, clotting risk increases significantly.\nIgE 242 IU/mL (limit 100). Suggests allergic sensitisation. Consider allergen panel if symptomatic.\nAmylase 152 IU/L (limit 118) with normal lipase 46. Likely salivary or exercise-related. Repeat on next panel to confirm stability.\nNeutrophils 1.79 (range 2.0 to 7.0). In a male of African/Caribbean ancestry, this is almost certainly benign ethnic neutropenia, a normal variant affecting up to 25 to 50 percent of this population. No action needed.\nMCH 32.7 pg (range 27 to 32). Marginal overshoot, clinically insignificant with normal MCV and MCHC.\nCK 968 U/L (range 40 to 320). Expected in a competitive bodybuilder training hard. Contributes to renal load.\nCortisol 138 nmol/L (morning range 145 to 619). Below morning range if taken in the AM. May reflect HPA axis blunting from hard training, PED use, or afternoon sampling.\nVitamin D 62 nmol/L (optimal 75 to 120). Sufficient but below optimal.\nB12 448 pg/mL (optimal above 500). Within range but below optimal.\nReassuring negatives: blood sugar and insulin sensitivity excellent (glucose 4.2, HbA1c 37, HOMA-IR 0.64), no systemic inflammation (hsCRP 0.9, ESR 6), liver fibrosis scores all low risk (NAFLD minus 1.81, APRI 0.52, FIB-4 1.37), thyroid optimal with negative antibodies, iron stores balanced (ferritin 96, saturation 26 percent), prostate clear (PSA 1.35, free ratio 34 percent), coeliac negative, rheumatoid factor negative, urinalysis clean, no haematuria, tumour markers clear.","recommendations":"Discuss the Lp(a) result of 152 nmol/L with your GP. This is an inherited cardiovascular risk factor that, combined with your ApoB of 1.25 and LDL of 4.06, may warrant referral to a lipid clinic. Bring the cardiovascular risk score of 85/100 and explain that this index has no age adjustment. Ask whether statin or PCSK9 inhibitor therapy is appropriate given the Lp(a) level, and request that first-degree relatives (parents, siblings) are offered Lp(a) testing.\nDiscuss the oestradiol of 499 pmol/L with whoever supervises your PED protocol or with your GP. At more than three times the male upper limit, this warrants active management.\nAsk your GP to record the Cystatin C eGFR of 74 as your baseline kidney function. Request that Cystatin C is repeated in three to six months to track the trend. If it falls below 60, a reassessment of creatine supplementation and PED use would be strongly recommended.\nRequest a full lipid panel including Lp(a) for first-degree relatives given the inherited nature of this finding.\nIf you experience nasal congestion, skin reactions, itching or respiratory symptoms, ask your GP for a specific allergen panel given the IgE of 242.\nMonitor haemoglobin and haematocrit every three to six months. If haematocrit exceeds 0.50, discuss therapeutic phlebotomy or PED dose reduction with your GP.\nCalorie target: 2,200 to 2,800 kcal depending on training day, with a protein floor of 135 to 155 g per day (1.6 to 1.85 g/kg at 84 kg). Retest in three to six months with at minimum: full lipid panel including ApoB and Lp(a), Cystatin C, full blood count with haematocrit, liver panel, oestradiol, LH, FSH, and CK.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal containing fat. Your level is 62 nmol/L, below the optimal 75 to 120 range, and at darker skin pigmentation in the UK you will need a higher maintenance dose to reach and hold the optimal band.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. K2 directs calcium into bone and away from artery walls, which is particularly important given your elevated Lp(a) and the arterial risk it carries.\nOmega-3 fish oil: increase to 3 g combined EPA and DHA daily (check the label for the EPA and DHA content, not just the total fish oil). Your current supplement is a good start, but at an ApoB of 1.25 and triglycerides of 1.55, a higher dose will have a measurable effect on particle count and triglyceride clearance.\nMagnesium glycinate: 400 mg before bed. Your serum magnesium at 0.95 is within the optimal band, but magnesium supports sleep quality (your goal), muscle recovery, and cardiovascular rhythm. At hard training five days a week, demand is high.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily. Your B12 at 448 is within range but below the optimal floor of 500, and sublingual delivery bypasses any absorption variability.\nDo not take iron supplements. Your ferritin at 96 and transferrin saturation at 26 percent are well balanced. Additional iron with a haemoglobin of 167 and haematocrit of 0.486 could push red cell production further in the wrong direction.\nThe most important changes from this report are not supplements. They are the GP conversation about Lp(a) and lipid management, the dietary changes to lower ApoB (soluble fibre, oily fish, reduced sugar), the oestradiol management, and the ongoing monitoring of kidney function and haematocrit.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 45 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 45.4. Weakest systems: cardiac markers 0%, lipids & cardiovascular 17%, immunology 19%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Creatinine.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"39.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4616","lower_normal":"","upper_normal":"43","lower_optimal":"","upper_optimal":"38","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4419","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count). Meite's PhenoAge is 39.7 years against a calendar age of 38, a difference of 1.7 years. The main driver pushing PhenoAge above calendar age is the creatinine at 128, which is inflated by muscle mass and creatine supplementation rather than true kidney ageing. If creatinine were at a level typical for a 38-year-old of average build, PhenoAge would likely sit at or below his chronological age. The low CRP (0.9) and healthy glucose (4.2) are working in his favour.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an age-independent index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. At 85, well above the 40 flagging threshold, this is high. The main drivers are the Lp(a) at 152 (inherited, non-modifiable) and the ApoB at 1.25 (partially modifiable). At 38, Meite's ten-year risk of a cardiovascular event is statistically low because event-risk models are heavily weighted by age. But the gap between a low ten-year risk and a high score of 85 is exactly the window in which aggressive intervention, dietary change, possible pharmacological lipid lowering, and ongoing monitoring, will make the most difference over the coming decades.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5119","units":"IU/l","description":"ALT (alanine transaminase) is an enzyme found mainly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. Meite's ALT at 33 is within the laboratory range (below 56) but above the optimal target of 30 for a male. In a non-drinking bodybuilder on PEDs, mild ALT elevation is commonly seen from the direct hepatic metabolism of exogenous compounds and from intense training. This is not alarming but should be monitored at each retest.","low_causes":"","high_causes":"Liver inflammation, PED use, intense exercise, fatty liver, alcohol, medications, viral hepatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5104","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST (aspartate transaminase) is an enzyme found in the liver, heart and skeletal muscle. Unlike ALT, AST rises with muscle damage as well as liver injury. Meite's AST at 44 is at the upper edge of the laboratory range (13 to 45). With a CK of 968 confirming significant muscle breakdown from training, a substantial portion of this AST is coming from muscle rather than liver. This is consistent with his training intensity and does not indicate liver disease, but it contributes to the mildly elevated FIB-4 calculation.","low_causes":"Vitamin B6 deficiency","high_causes":"Muscle damage, intense exercise, liver inflammation, PED use, alcohol, heart disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4110","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4310","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that rises with bile duct stress, alcohol use, certain medications and metabolic strain. Meite does not drink alcohol, so that explanation is excluded. At 45, his GGT is within the laboratory range (4 to 73) but above the optimal target of 25. In a PED user, this likely reflects the hepatic processing of exogenous compounds. It is not alarming in isolation but adds to the overall picture of mild liver strain that warrants monitoring.","low_causes":"","high_causes":"PED use, medications, fatty liver, bile duct obstruction, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bile ducts and bone. It rises with bile duct obstruction, bone disorders or liver disease. Meite's ALP at 65 is comfortably within the optimal range, confirming that the bile ducts and bone are healthy.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disorders, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. It is processed by the liver and excreted in bile. Meite's bilirubin at 12 is comfortably mid-range, indicating healthy red cell turnover and good liver clearance.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood, reflecting liver synthetic function, immune status and hydration. At 76 g/L, Meite's total protein is within the optimal range, confirming adequate protein synthesis and hydration.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, drugs and nutrients, and maintains fluid balance. At 42 g/L, Meite's albumin is within the optimal range, confirming that the liver's synthetic capacity is intact.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5926","units":"g/l","description":"Globulins are a group of proteins that include antibodies and transport molecules. At 34 g/L, Meite's globulin is within the laboratory range but above the optimal ceiling of 32. This is being pulled up by his IgG at the top of range and his elevated IgE, both of which are immunoglobulin (globulin) fractions. It is not a concern in itself but reflects the immune activity seen elsewhere in the panel.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, allergic response, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"ratio","description":"The albumin-to-globulin ratio reflects the balance between the liver's production of albumin and the immune system's production of globulins. At 1.24, this ratio is within the optimal range, confirming a healthy balance.","low_causes":"Chronic inflammation, liver disease, immune overactivation","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"152","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7614","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6008","units":"IU/L","description":"Amylase is an enzyme that breaks down starch, produced primarily by the pancreas and salivary glands. When both amylase and lipase rise together, it can indicate pancreatitis. Meite's amylase is elevated at 152 (upper limit 118), but his lipase at 46 is comfortably within range (13 to 60). An isolated amylase elevation with a normal lipase is usually benign, often from salivary sources (a condition called macro-amylasaemia), intense exercise, or occasionally PED metabolism. This should be repeated at the next test to confirm it is stable, but it is not a concern at present.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, salivary gland inflammation, macro-amylasaemia, intense exercise, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4894","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6310","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is the most specific marker for pancreatitis. At 46, well within the range of 13 to 60, the pancreas is healthy and there is no sign of pancreatic inflammation. The normal lipase is what makes the elevated amylase reassuring.","low_causes":"","high_causes":"Pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"1.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2566","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 is a calculated score that estimates the degree of liver fibrosis (scarring) using age, AST, ALT and platelet count. At 1.37, above the 1.3 screening threshold but well below 2.0, this score is marginally elevated. The driver is the AST at 44 (at the ceiling of range), which in Meite's case is being pushed up by muscle-derived AST from intense training (CK 968) rather than liver disease. The NAFLD fibrosis score at minus 1.81, the APRI at 0.52, and the clean bilirubin and albumin all confirm there is no evidence of liver fibrosis. This is the calculation responding to the exercise, not the liver.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.519","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1730","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"The APRI (AST to Platelet Ratio Index) is a simple score for estimating liver fibrosis. At 0.52, within the normal range (below 1.5) but marginally above the optimal ceiling of 0.5, this is being driven by the AST at 44, which is largely muscle-derived. With a normal platelet count and all other liver markers healthy, there is no evidence of fibrosis.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-1.808","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4896","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD Fibrosis Score uses age, BMI, blood sugar, albumin, platelets and AST/ALT ratio to estimate the risk of liver fibrosis from non-alcoholic fatty liver disease. At minus 1.81, within the optimal range (below minus 1.455 is low risk), this rules out significant liver fibrosis with confidence.","low_causes":"","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5767","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio (AST divided by ALT) helps distinguish liver damage from muscle damage. A ratio above 1 can indicate either alcoholic liver disease or muscle-derived AST. At 1.33, marginally above the optimal ceiling of 1.3 and well within the normal range, this ratio is being pulled up by the muscle-derived AST from intense training (CK 968). In a non-drinking bodybuilder, this is the expected pattern and does not suggest liver disease.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5988","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood: LDL, HDL, VLDL and Lp(a). At 6.2 mmol/L, above the desirable target of 5.18, Meite's total cholesterol is elevated. However, total cholesterol is a blunt instrument because it includes protective HDL. The more useful measures are ApoB (particle count) and the breakdown into LDL, HDL and triglycerides, all of which are discussed individually in this report.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic factors, PED use, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6767","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is the main carrier of cholesterol into artery walls. At 4.06, significantly above the 3.0 target, Meite's LDL is elevated. Part of this is driven by his Lp(a) of 152 (every Lp(a) particle carries LDL cholesterol), and the Lp(a)-corrected LDL at 3.57 shows that even after stripping out the inherited contribution, modifiable LDL is still above target. The combination of PED use, dietary saturated fat, and the genetic Lp(a) load all contribute. Dietary changes (soluble fibre, reduced saturated fat, oily fish) and, if the GP recommends it, pharmacological intervention are the two levers.","low_causes":"Hyperthyroidism, malnutrition, very low-fat diet","high_causes":"Saturated fat intake, genetic hypercholesterolaemia, Lp(a), PED use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.04","upper_normal":"3.10","lower_optimal":"1.55","upper_optimal":"3.10","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5246","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. At 1.5, Meite's HDL is within the laboratory range but just below the optimal threshold of 1.55. In a PED user, HDL is often heavily suppressed (below 1.0), so maintaining an HDL of 1.5 is a relative positive. It suggests his diet and training are providing some protection against the HDL-lowering effect of exogenous testosterone. Increasing zone-2 cardio and oily fish intake may help push this above 1.55.","low_causes":"PED use, sedentary lifestyle, smoking, high-carb diet, obesity, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4559","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, mainly from dietary carbohydrates and sugars that the liver converts into fat for storage. At 1.55, within the fasting limit of 1.7 but above the optimal target of 1.0, Meite's triglycerides are in the zone where dietary change can make a meaningful difference. Reducing sugary foods (currently consumed some days) and increasing omega-3 intake are the most effective levers.","low_causes":"Very low-fat or low-carb diet, malnutrition, hyperthyroidism","high_causes":"High-sugar diet, excess carbohydrates, alcohol, obesity, insulin resistance, PED use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4487","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. At 0.7, within the laboratory range but above the optimal target of 0.6, this mirrors the slightly elevated triglycerides and is driven by the same dietary factors.","low_causes":"Very low-fat diet","high_causes":"High carbohydrate/sugar intake, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol in one number: LDL, VLDL, IDL and Lp(a)-carried cholesterol. At 4.7, above the 4.0 target, this confirms the elevated atherogenic burden seen in the LDL and ApoB results. It is a useful summary metric for tracking progress.","low_causes":"Very low-fat diet, hyperthyroidism","high_causes":"High saturated fat intake, genetic factors, Lp(a), PED use, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4589","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"ratio","description":"The total cholesterol to HDL ratio is a traditional cardiovascular risk metric. At 4.13, within the laboratory limit of 4.5 but above the optimal ceiling of 3.5, it reflects the elevated total cholesterol alongside an HDL that is good but not quite optimal. ApoB is a more precise measure and is the number to track.","low_causes":"","high_causes":"High LDL, low HDL, PED use, poor diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"24.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6048","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5063","upper_optimal_position":"1","units":"%","description":"This is the percentage of total cholesterol that is the protective HDL fraction. At 24.2 percent, above the 20 percent floor, a reasonable proportion of Meite's cholesterol is protective. However, this is marginally below the optimal 25 percent threshold, reflecting the fact that total cholesterol is elevated disproportionately by LDL rather than HDL.","low_causes":"Low HDL, very high LDL","high_causes":"Healthy lipid balance, exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein on the surface of every LDL, VLDL, IDL and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, the ApoB concentration is the most accurate measure of how many artery-damaging particles are circulating. At 1.25, classified as high (1.20 to 1.39 band), Meite has roughly 40 percent more atherogenic particles than the 0.9 target. Part of this is driven by his Lp(a) of 152 (each Lp(a) particle adds one ApoB), but even after accounting for that, the particle count remains elevated. This is the single most important lipid number to track and reduce.","low_causes":"Very low-fat diet, hyperthyroidism, malnutrition","high_causes":"Genetic factors, high saturated fat intake, Lp(a), PED use, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5397","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5167","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the concentration of protective cholesterol carriers. At 1.48, above the 1.20 floor, Meite's ApoA1 is reasonable. This is another result that PED use commonly suppresses, so maintaining it at this level is a genuine positive.","low_causes":"PED use, smoking, sedentary lifestyle, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6029","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"ratio","description":"The ApoB to ApoA1 ratio is the best single summary of cardiovascular lipid risk, balancing the atherogenic particle count (ApoB) against the protective particle count (ApoA1). At 0.84, above the 0.7 lower-risk threshold and sitting in the average risk band (0.7 to 0.9), this ratio confirms that the balance between damaging and protective particles is tilted in the wrong direction. Reducing ApoB through diet and potentially medication will bring this ratio down.","low_causes":"","high_causes":"High ApoB, low ApoA1, genetic factors, PED use, poor diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"152.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7618","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written Lp(a), is a specialised LDL-like particle with an extra protein called apolipoprotein(a) attached. It deposits cholesterol into artery walls, promotes blood clotting by interfering with the body's clot-dissolving system, and drives local inflammation. Lp(a) levels are almost entirely determined by genetics and do not respond to diet, exercise, weight loss or any currently available supplement. At 152 nmol/L, Meite sits in the moderate risk band (90 to 200). This is the most important finding in the report. It means there is an inherited, lifelong, non-modifiable driver of cardiovascular risk. Every first-degree relative (parents, siblings, and eventually children) should be offered Lp(a) testing because they have a 50 percent chance of carrying the same trait. This result should be recorded permanently in his medical notes and discussed with a GP, ideally with referral to a lipid clinic.","low_causes":"","high_causes":"Genetic (inherited), not modifiable by lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3433","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"ratio","description":"The triglyceride-to-HDL ratio is a proxy for insulin resistance and small dense LDL particles. At 1.03, within the 1.5 ceiling but above the optimal 0.87, this ratio reflects the slightly elevated triglycerides and slightly below-optimal HDL. It is not concerning but will improve as triglycerides come down with dietary changes.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance, high-sugar diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried on triglyceride-rich particles (VLDL and IDL), calculated as total cholesterol minus HDL minus LDL. At 0.64, within the 0.8 limit but above the optimal 0.5, it reflects the same triglyceride-driven elevation. Remnant cholesterol is increasingly recognised as an independent cardiovascular risk factor, and dietary changes to lower triglycerides will reduce it.","low_causes":"","high_causes":"High triglycerides, excess carbohydrates, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5950","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol carried on Lp(a) particles from the total LDL, showing how much of the LDL is modifiable through diet, lifestyle and medication. At 3.57, still above the 3.0 target, this confirms that even after removing the inherited Lp(a) contribution, there is a significant modifiable LDL component that can be reduced. This is the number that dietary changes and, if prescribed, statins or PCSK9 inhibitors will act on.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.014","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6127","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from triglycerides and HDL and reflects the balance between pro-atherogenic and anti-atherogenic lipid forces. At 0.014, within the optimal range (below 0.11), this indicates low atherogenic risk from the triglyceride-HDL axis. It is a positive finding that partially counterbalances the elevated ApoB and LDL.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The LDL to HDL ratio balances the atherogenic LDL against the protective HDL. At 2.71, within the 3.5 ceiling but above the optimal 2.5, this reflects the elevated LDL. ApoB is the more precise metric and is the primary number to track.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3933","upper_optimal_position":"0.5600","units":"mmol/l","description":"Fasting blood glucose measures the sugar circulating in the blood after an overnight fast. At 4.2, Meite's glucose is within the optimal range of 4.0 to 5.4, indicating excellent blood sugar regulation.","low_causes":"Prolonged fasting, excess insulin, liver disease","high_causes":"Insulin resistance, diabetes, stress, medications, high-carb meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar over the previous two to three months. At 5.5 percent, well below the prediabetes threshold of 6.0 percent, Meite's long-term blood sugar control is excellent.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Prediabetes, diabetes, high-sugar diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4405","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement in SI units. At 37 mmol/mol, Meite is within the normal range (below 42) but marginally above the optimal ceiling of 36. This very minor overshoot is not concerning and reflects normal variation rather than any metabolic issue.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Prediabetes, diabetes, high-sugar diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.45","within_normal":"TRUE","within_optim
