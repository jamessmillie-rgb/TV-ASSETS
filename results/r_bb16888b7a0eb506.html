en his training intensity and sleep goal, supplementation is still recommended to support demand.","low_causes":"Poor diet, intense exercise, alcohol, PPI medications, diabetes","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"318","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4663","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2724","upper_optimal_position":"0.5521","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines found in food and cells. At 318, within the optimal range for a male (200 to 380), uric acid metabolism is healthy. There is no gout risk and no concern.","low_causes":"Low-purine diet, medications","high_causes":"High-purine diet, kidney impairment, alcohol, fructose, metabolic syndrome, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product of protein metabolism, filtered by the kidneys. At 6.6, within the optimal range, this confirms the kidneys are clearing protein waste effectively despite a high-protein diet.","low_causes":"Low-protein diet, liver disease, overhydration","high_causes":"Dehydration, high-protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"128","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8376","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product of creatine breakdown in muscle. The kidneys filter it, so a rising creatinine can indicate reduced kidney function. At 128, above the 104 upper limit, Meite's creatinine is elevated. However, in a muscular male taking creatine supplements, creatinine is inflated by the larger muscle mass and the exogenous creatine, not necessarily by reduced kidney function. This is precisely why Cystatin C is the more reliable marker in this context, and that result is discussed separately.","low_causes":"Low muscle mass, malnutrition","high_causes":"High muscle mass, creatine supplementation, kidney disease, dehydration, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5083","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) from creatinine estimates how well the kidneys are filtering waste. At 61, just above the 60 threshold, this appears mildly reduced. However, in Meite's case this calculation is unreliable because it is built on the inflated creatinine from his muscle mass and creatine supplementation. The Cystatin C-based eGFR of 74 is the more accurate measure.","low_causes":"Kidney disease, dehydration, medications, obstruction","high_causes":"Hyperfiltration (early diabetes, pregnancy)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4682","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet or supplements, making it a more reliable measure of kidney function in someone like Meite. At 1.03, within the laboratory range (below 1.1) but above the optimal ceiling of 0.9, this confirms that kidney filtration is mildly reduced but not in the danger zone. The Cystatin C-based eGFR of 74 and the combined eGFR of 74 place him in the G2 category (mildly reduced, 60 to 89). At 38, this deserves monitoring.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Kidney impairment, inflammation, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"This eGFR is calculated from Cystatin C rather than creatinine and is the more reliable measure of kidney function for Meite. At 74, above 60 (the threshold for chronic kidney disease) but below the 90 optimal, this confirms a genuine mild reduction in kidney filtration. The most likely contributors are the combination of hard training, high CK, high-protein diet, creatine supplementation and PED use. This is not alarming but establishes a baseline that should be repeated in three to six months.","low_causes":"Kidney disease, dehydration, nephrotoxic drugs","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and Cystatin C to estimate kidney filtration, providing the most accurate assessment available in routine blood testing. At 74, above the 60 threshold for chronic kidney disease but below the 90 optimal, this confirms a genuine mild reduction in kidney filtration at age 38. The drivers are the combination of high muscle mass, creatine supplementation, intense training with high CK, a high-protein diet and PED use. This is the baseline to track going forward.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"51.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3978","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal (dehydration, poor blood flow) and intrinsic kidney causes of elevated creatinine. At 51.6, within the optimal range of 45 to 90, this suggests adequate hydration and that the elevated creatinine is not due to dehydration or reduced kidney blood flow.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"167","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6417","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein in red blood cells. At 167, within the male range of 130 to 170 but above the optimal ceiling of 165, this is at the high end. Supraphysiological testosterone stimulates the kidneys to produce erythropoietin, which drives red blood cell production. While still in range, this needs monitoring because if haemoglobin exceeds 170 or haematocrit exceeds 0.50, the blood becomes thicker and the risk of clotting, stroke and cardiovascular events rises. Regular monitoring every three to six months is essential.","low_causes":"Iron deficiency, chronic disease, blood loss, kidney disease","high_causes":"PED use, dehydration, polycythaemia, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"5.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5433","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures the number of red cells per litre of blood. At 5.13, within the optimal range, this is healthy. Combined with the haemoglobin and haematocrit, red cell production is robust but not yet in the concerning territory.","low_causes":"Iron deficiency, chronic disease, blood loss, bone marrow suppression","high_causes":"PED use, dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.486","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6200","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.486, within the laboratory range (0.40 to 0.50) but above the optimal ceiling of 0.48, this is at the upper end. This is the critical number to watch in a PED user: once it crosses 0.50, the blood viscosity increases significantly and the risk of thrombosis (blood clots) rises sharply. At 0.486, there is a margin of 0.014, which could be crossed with dehydration or further testosterone-driven erythropoiesis.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"PED use, dehydration, polycythaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6381","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"%","description":"RDW (red cell distribution width) measures the variation in size among red blood cells. A higher RDW means the cells are less uniform in size. At 14.7, within range (11.5 to 15) but above the optimal ceiling of 14.0, this mild elevation could reflect the stimulated erythropoiesis from PED use, with newer, larger red cells entering the circulation alongside older ones. It is not concerning in isolation.","low_causes":"","high_causes":"Iron deficiency, vitamin B12/folate deficiency, mixed anaemia, PED-driven erythropoiesis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"94.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5511","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fl","description":"MCV (mean corpuscular volume) is the average size of a red blood cell. At 94.8, within the optimal range, red cell size is normal, ruling out iron deficiency (which shrinks cells) and B12/folate deficiency (which enlarges them).","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"Vitamin B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"32.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7800","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH (mean corpuscular haemoglobin) is the average weight of haemoglobin in each red blood cell. At 32.7, marginally above the upper limit of 32, this is a trivial overshoot. With a normal MCV and a normal MCHC (345, at the top of its range), this very slight elevation is clinically insignificant and is most likely normal variation or a reflection of the slightly larger cells driven by PED-stimulated erythropoiesis.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12/folate deficiency, macrocytosis, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"345","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) is the average concentration of haemoglobin within each red blood cell. At 345, right at the upper limit of the range, this is within normal limits. It confirms that haemoglobin concentration within the cells is adequate.","low_causes":"Iron deficiency","high_causes":"Spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"212","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4128","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are cell fragments that help blood clot. At 212, within the optimal range, platelet count is healthy.","low_causes":"Viral infection, medications, bone marrow suppression, autoimmune disease","high_causes":"Iron deficiency, inflammation, infection, post-surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6333","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets are generally younger and more reactive. At 9.5, within the optimal range, this is healthy.","low_causes":"Bone marrow suppression, inflammatory conditions","high_causes":"Increased platelet turnover, cardiovascular risk, inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"4.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3683","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's defence against infection. At 4.61, within the laboratory range (4 to 10) but below the optimal floor of 5, the total count is at the lower end. This is driven almost entirely by the low neutrophil count (see below). In someone of African/Caribbean ancestry, this is most likely benign ethnic neutropenia and does not indicate immune suppression.","low_causes":"Benign ethnic neutropenia, viral infection, bone marrow suppression, medications, PED use","high_causes":"Infection, inflammation, stress, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2860","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell and the first line of defence against bacterial infection. At 1.79, below the laboratory range of 2.0 to 7.0, Meite's neutrophils are technically low. However, in people of African and Caribbean ancestry, benign ethnic neutropenia is extremely common (affecting 25 to 50 percent of the population). It is a normal genetic variant where the neutrophil pool is distributed differently between the blood and bone marrow, and it does not increase susceptibility to infection. With no infections, no symptoms and a healthy total white cell count, this is almost certainly benign ethnic neutropenia and needs no treatment.","low_causes":"Benign ethnic neutropenia, viral infection, medications, PED use, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5450","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are immune cells responsible for targeted immune responses, including antibody production (B-cells) and virus-killing (T-cells). At 2.27, within the optimal range, lymphocyte function is healthy.","low_causes":"Viral infection, immunodeficiency, corticosteroids, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf pathogens and dead cells and help coordinate the immune response. At 0.36, within the optimal range, this is healthy.","low_causes":"Bone marrow suppression","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasites and in allergic responses. At 0.16, within the optimal range, this is healthy. Interestingly, despite the elevated IgE suggesting allergic sensitisation, the eosinophils are not elevated, which means the allergic response is not currently driving tissue inflammation.","low_causes":"Corticosteroid use, acute stress","high_causes":"Allergies, parasitic infection, asthma, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the least common white blood cell, involved in allergic and inflammatory responses. At 0.03, within the optimal range, this is healthy.","low_causes":"Acute allergic reaction, corticosteroid use","high_causes":"Allergic conditions, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4617","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells just released from the bone marrow. Their percentage reflects how actively the marrow is producing new red cells. At 1.07 percent, within the optimal range, red cell production is normal and appropriately balanced.","low_causes":"Iron deficiency, chronic disease, bone marrow suppression, low erythropoietin","high_causes":"Haemolytic anaemia, blood loss, response to treatment, PED-driven erythropoiesis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"54.891","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4315","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the total number of young red blood cells in circulation. At 54.9, within the optimal range, the bone marrow is producing red cells at a healthy and appropriate rate.","low_causes":"Iron deficiency, chronic disease, bone marrow suppression","high_causes":"Blood loss recovery, haemolytic anaemia, PED use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR","group":"HEMATOLOGY","result":"0.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2633","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"ratio","description":"The neutrophil-to-lymphocyte ratio (NLR) is a marker of the balance between innate and adaptive immunity, and an indicator of systemic inflammation. At 0.79, below the 1.0 floor, this ratio is low because the neutrophil count is below range. In the context of benign ethnic neutropenia (the most likely explanation for the low neutrophils), a low NLR is expected and is not a sign of immune dysfunction or inflammation.","low_causes":"Benign ethnic neutropenia, low neutrophil count","high_causes":"Infection, systemic inflammation, stress, critical illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"18.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index (MCV divided by RBC count) is used to distinguish iron deficiency anaemia from thalassaemia trait. A value above 13 favours iron deficiency if anaemia is present; below 13 favours thalassaemia trait. At 18.5 with no anaemia present, this is reported for context and is not applicable.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"1.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression", "low_causes":"Iron deficiency, chronic disease","high_causes":"Iron overload, haemochromatosis, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"35.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7987","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4907","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, driving muscle growth, bone density, red blood cell production, mood and libido. At 35.4, above the laboratory ceiling of 28.7, Meite's testosterone is supraphysiological, consistent with the disclosed use of anabolic steroids or PEDs. This is not a pathological elevation but a pharmacological one.","low_causes":"Ageing, obesity, pituitary disease, hypogonadism, medications","high_causes":"Exogenous testosterone/PED use, adrenal tumours, testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.9627","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6397","lower_normal":"0.138","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3870","upper_optimal_position":"0.5522","units":"nmol/l","description":"Free testosterone is the unbound fraction that is biologically active and available to tissues. At 0.963, at the top of the laboratory range (0.138 to 1.04), this is high and consistent with the elevated total testosterone from PED use. Free testosterone is what actually drives muscle growth and the other androgenic effects.","low_causes":"High SHBG, ageing, obesity, liver disease","high_causes":"Exogenous testosterone, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"130.15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6113","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is a ratio of total testosterone to SHBG that estimates the proportion of testosterone available for use. At 130, within the laboratory range (30 to 150) but above the optimal ceiling of 120, this reflects the supraphysiological testosterone alongside a low-normal SHBG. It is elevated but consistent with PED use.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, low SHBG, PED use, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"27.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4013","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3866","upper_optimal_position":"0.5936","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein made by the liver that binds testosterone and oestradiol, controlling how much is free and biologically active. At 27.2, within the optimal range but towards the lower end, the liver has reduced SHBG production in response to the high androgen environment. This is a typical response to supraphysiological testosterone and means more testosterone is free and active.","low_causes":"PED use, high androgens, obesity, insulin resistance, hypothyroidism","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"499","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen, produced in males mainly by the aromatisation (enzymatic conversion) of testosterone in fat, muscle and liver tissue. At 499 pmol/L, more than three times the male upper limit of 146, this is significantly elevated. It is the direct consequence of supraphysiological testosterone: the more testosterone circulating, the more substrate is available for the aromatase enzyme to convert. At this level, Meite is at risk of gynaecomastia (breast tissue growth), fluid retention, mood changes and potential cardiovascular effects. Management options, typically an aromatase inhibitor, should be discussed with whoever supervises his PED protocol or with his GP.","low_causes":"Low testosterone, low body fat, aromatase inhibitor use","high_causes":"Aromatisation of high testosterone, PED use, obesity, liver disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"<0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0047","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6282","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and signals the testes to produce testosterone. At below 0.07, effectively undetectable, the pituitary has completely shut down LH production because it detects the supraphysiological testosterone from exogenous sources and sees no need to stimulate the testes. This is the expected pharmacological response to PED use. While on cycle, the testes are not being stimulated and will reduce in size and function. Fertility is significantly impaired while LH remains suppressed.","low_causes":"Exogenous testosterone/PED use, pituitary disease, severe stress","high_causes":"Primary hypogonadism, menopause, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"<0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0120","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5973","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and drives sperm production in the testes. At below 0.3, effectively undetectable, FSH is fully suppressed by the exogenous testosterone. This means sperm production is significantly impaired. If fertility is a concern in the future, this is an important consideration, and post-cycle recovery protocols (PCT) or assisted reproduction may be needed.","low_causes":"Exogenous testosterone/PED use, pituitary disease","high_causes":"Primary hypogonadism, testicular failure, menopause (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"181","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4879","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4394","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a pituitary hormone that in men can suppress testosterone production and libido when elevated. At 181, within the optimal range, prolactin is healthy. This is reassuring because some PED compounds, particularly 19-nortestosterone derivatives, can elevate prolactin.","low_causes":"Dopamine excess, medications","high_causes":"Pituitary adenoma, medications, 19-nor PED compounds, stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"138","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2353","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5826","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the early morning and falling through the day. At 138, below the morning reference range of 145 to 619, this is a low reading. If the sample was taken in the morning, this could suggest HPA (hypothalamic-pituitary-adrenal) axis blunting from chronic hard training, PED use, or both. If taken in the afternoon, it falls within the afternoon range (95 to 462) and is less significant. It may also relate to the difficulty getting going in the morning that Meite reports. This is worth noting rather than alarming, and a repeat morning sample would clarify.","low_causes":"Adrenal insufficiency, HPA axis suppression, chronic overtraining, PED use, afternoon sampling","high_causes":"Stress, Cushing's syndrome, early morning sampling, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3389","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3700","upper_optimal_position":"0.5700","units":"nmol/L","description":"Progesterone in males is produced in small amounts by the adrenal glands and testes. At 0.91, at the floor of the male range (0.89 to 3.88), this is technically within range. In the context of suppressed LH and FSH from PED use, the testes are contributing less progesterone. This is a minor finding and not clinically significant in a male.","low_causes":"PED-induced HPG axis suppression, adrenal insufficiency","high_causes":"Adrenal hyperplasia, some PED compounds","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5312","upper_optimal_position":"0.5706","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. At 5.0 umol/L (1,843 ug/dL), within the optimal range, adrenal function is healthy. DHEA-S is a useful marker of adrenal reserve and biological ageing.","low_causes":"Adrenal insufficiency, ageing, chronic illness","high_causes":"Adrenal tumour, PCOS (females), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"22.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone is the fraction not tightly bound to SHBG, including both free testosterone and the loosely albumin-bound fraction. At 22.06, far above the 2 to 9 reference range, this is supraphysiological and consistent with exogenous testosterone use. It represents the total biologically active testosterone driving muscle growth, red blood cell production and the other androgenic effects.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"18.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is unbound and biologically active. At 18.35, this is reported for context. With the oestradiol at 499 and SHBG at 27.2, a substantial proportion of the oestradiol is biologically active, which is consistent with the markedly elevated total oestradiol.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4192","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5488","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how much thyroid hormone to produce. A high TSH means the thyroid is underperforming and the pituitary is shouting louder; a low TSH means the thyroid is overproducing. At 1.64, within the optimal range of 1.0 to 2.5, the pituitary is sending a calm, steady signal, indicating the thyroid is working well.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"16.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4851","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in the tissues. At 16.6, within the optimal range of 14 to 20, thyroid hormone production is healthy.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excess thyroid medication, early Hashimoto's","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4704","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolic rate, energy production, and body temperature. At 4.9, within the optimal range of 4.5 to 6.5, the body is converting T4 into T3 effectively. The thyroid is functioning well across all three axes.","low_causes":"Hypothyroidism, low T4, chronic illness, selenium deficiency, caloric restriction","high_causes":"Hyperthyroidism, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as in Hashimoto's thyroiditis. At below 6.6, well within the normal range (below 13.8), there is no sign of autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0471","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. At below 1.3, within the normal range (below 4.4), this confirms no autoimmune thyroid disease. Both thyroid antibodies are negative, which is reassuring.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.295","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.295, within the optimal range of 0.27 to 0.40, conversion is healthy. Both inputs (FT3 4.9 and FT4 16.6) are within their optimal ranges, confirming excellent thyroid function.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2583","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6786","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, muscle strength and mood regulation. At 62 nmol/L, Meite is sufficient (above 50) but below the optimal range of 75 to 120. Darker skin pigmentation produces less vitamin D from sunlight, making supplementation especially important in the UK. A daily dose of 3,000 IU cholecalciferol with a fat-containing meal should bring this into the optimal range within two to three months.","low_causes":"Insufficient sun exposure, darker skin pigmentation, northern latitude, low dietary intake, obesity","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"448","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4329","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5226","upper_optimal_position":"0.6156","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 448, within the laboratory range (193 to 982) but below the optimal floor of 500, Meite's B12 is in the zone where a small boost would be beneficial. Sublingual methylcobalamin at 1,000 mcg daily is the recommended form because it is already in the active form and absorbs directly through the mouth lining.","low_causes":"Poor dietary intake (vegan/vegetarian), malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5714","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA synthesis and red blood cell production. At 13, within the optimal range, Meite's folate intake from his diet (4 to 5 portions of vegetables and fruit) is clearly adequate.","low_causes":"Poor diet, alcohol, malabsorption, pregnancy, methotrexate","high_causes":"Supplementation, excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4413","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6139","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels by controlling calcium release from bone, calcium absorption from the gut and calcium retention by the kidneys. At 2.2, within the optimal range, the parathyroid glands are working normally and calcium metabolism is balanced.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"968","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8986","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in skeletal muscle, heart muscle and brain. When muscle is damaged through exercise, CK leaks into the blood. At 968, three times the upper limit of 320, Meite's CK is significantly elevated. In a competitive bodybuilder training hard five days a week, this is expected and reflects the muscle breakdown and repair cycle that drives hypertrophy. It is not concerning in terms of heart damage (the clinical worry with CK) because it is clearly exercise-induced. However, the kidneys must filter the breakdown products, and this contributes to the renal load seen in the Cystatin C eGFR of 74.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myocarditis, medications, PED use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"15.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6228","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections. At 15.3, within the laboratory range (6.5 to 16) but at the upper end, this reflects a robust immune system. It is not a concern.","low_causes":"Immune deficiency, medications, chronic illness","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. At 1.2, within the laboratory range (0.5 to 3.0), this is healthy and indicates a normal early immune response capacity.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5548","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the antibody that protects mucous membranes (gut, lungs, airways). At 2.6, within the laboratory range (0.4 to 3.5), mucosal immunity is healthy. An adequate IgA also confirms that the coeliac screening (tissue transglutaminase IgA) is reliable.","low_causes":"IgA deficiency (genetic), medications","high_causes":"Chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"242", // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
