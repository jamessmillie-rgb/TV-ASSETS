<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Salvatore Stefanelli","dob":"30/08/1986","report_date":"2026-07-29","summary":"IMPORTANT: This report contains a finding that we recommend discussing with your GP urgently. It is explained first.\n\nSalvatore is a 39-year-old male presenting with a BMI of 28.7, following a Mediterranean diet rated 8 out of 10 for quality with a volume of 6 out of 10. He trains 5 times per week (2 cardio, 3 resistance) with 5,000 to 7,500 daily steps. He takes no medication and has no diagnosed conditions. He reports weight gain and difficulty losing weight, and joint pain and stiffness. His goals are to lose body fat and prevent disease.\n\nHis calcium is 1.93 (corrected 1.71), significantly below the lower limit of 2.2, and this is the finding that should go to his GP before anything else in this report.\n\nCalcium is essential for nerve signalling, muscle contraction, heart rhythm and bone strength. At this level, symptoms such as muscle cramps, tingling in the fingers or around the mouth, and in more severe cases disturbances to heart rhythm can occur. It should be repeated urgently.\n\nWhat makes this unusual is that his parathyroid hormone at 2.5 is normal. PTH is the hormone that controls calcium. When calcium falls, PTH should rise sharply to bring it back up by releasing calcium from bone, increasing absorption from food, and reducing kidney losses. A normal PTH alongside genuinely low calcium is called an inappropriately normal response, and it narrows the possible explanations to either hypoparathyroidism (where the parathyroid glands fail to respond) or, more commonly, a laboratory artefact. If the blood sample was contaminated with EDTA, the anticoagulant used in purple-topped collection tubes, it will falsely tank the calcium reading. The normal PTH and normal magnesium at 1.03 would both fit this explanation, because neither would have any reason to move if the calcium in the body were actually fine.\n\nEither way, this needs repeating. If it is genuine, the combination with his bicarbonate at 14.5 (significantly below the limit of 20) and his reduced kidney function (creatinine 122, eGFR 64 by creatinine and 69 by Cystatin C) forms a pattern that points toward the kidneys losing the ability to maintain the body's acid-base balance, which can draw calcium from bone to buffer the chronic acid load. If it is a lab artefact, a repeat will show a normal result and the matter is resolved.\n\nHis bicarbonate at 14.5 is concerning in its own right. Bicarbonate is the body's main acid buffer, maintained by the kidneys. At 14.5, against a lower limit of 20, the buffering system is significantly depleted. This should be investigated alongside the calcium and kidney function.\n\nHis kidney function is reduced for 39. His creatinine is 122, above the limit of 104, and his eGFR by creatinine is 64. His Cystatin C is 1.15, above the limit of 1.1, with a Cystatin C eGFR of 69. When both measures agree that function is reduced, it is not a reflection of build. His creatinine would be expected to run a little higher from resistance training (creatinine is a waste product of muscle), but the Cystatin C, which is unaffected by muscle mass, confirms the kidney function is genuinely below where it should be. The encouraging finding is that there is no protein in his urine, which is the marker that signals active damage rather than gradual decline.\n\nAn interesting detail supports the kidney picture. His sodium is 151, above the range that ends at 146, alongside concentrated blood (albumin 51, total protein 87, both above range). Yet his urine specific gravity is 1.005, meaning dilute. Normally, if someone is dehydrated the kidneys concentrate the urine to conserve water. Dilute urine alongside concentrated blood can occur when the kidneys lose some of their ability to concentrate urine, which is a recognised feature of reduced kidney function.\n\nHis raised amylase at 139 and lipase at 71 may also connect here. Both enzymes are cleared from the blood by the kidneys, so when kidney clearance falls they accumulate even without any pancreatic inflammation. His CA 19-9 at 1.2 is very low, which is reassuring against significant pancreatic disease.\n\nBeyond the calcium, kidney and acid-base findings, there is a great deal of good news.\n\nHis blood sugar control is genuinely excellent. His glucose is 4.8, his HbA1c is 32 (5.1%), and his HOMA-IR is 0.44, which is below range in the favourable direction, meaning his cells respond to insulin exceptionally well. At BMI 28.7, this is a surprisingly positive finding. Insulin resistance is usually one of the first metabolic consequences of excess weight, and his has not developed. The Mediterranean diet and resistance training are almost certainly the reason. His insulin at 2.05, C-Peptide at 90.7, and HOMA-B at 31.5 are all below range, but in the context of perfect blood sugar this reflects low demand rather than a failing pancreas. His CRP at 0.4 is within the ideal range, which at BMI 28.7 is another positive surprise, since excess body fat normally drives inflammation upward.\n\nHis liver is healthy. ALT at 14, Gamma GT at 22, bilirubin at 12, and albumin at 51 are all normal. His FIB-4 score at 1.45 sits right at the screening threshold, but with these liver markers all clean this is driven by the calculation rather than by any disease.\n\nHis thyroid is working well, with TSH at 1.54, FT4 at 14.7, FT3 at 4.9, and both antibody tests negative.\n\nHis cortisol at 351 is within the ideal range. His DHEA-S is within the ideal range. His prostate markers are reassuring, with PSA at 0.56 and a free ratio of 61%. His coeliac screen is negative.\n\nHis testosterone at 29.9 is marginally above the laboratory range. His SHBG at 69.4 is above range, which binds more of it, but his free testosterone at 0.385 is within the ideal range, so the available amount is healthy. The high SHBG is not currently causing a problem.\n\nHis cholesterol is elevated and this is relevant to his disease prevention goal. His LDL is 4.08, above the limit of 3. His ApoB, which counts the particles capable of depositing cholesterol into artery walls, is 1.39, more than 50% above the 0.9 target. His total cholesterol is 6.4, non-HDL is 4.6, and ApoB/A-I ratio is 0.755, above the 0.7 threshold. His HDL at 1.8 is within the ideal range, which is a strong protective finding, and his triglycerides at 1.29 are reasonable.\n\nCrucially, his Lipoprotein(a) at 25 is normal. Lp(a) is a cholesterol particle set entirely by genetics that cannot be changed by anything a person does. His is not raised, which means the elevated LDL and ApoB are being driven entirely by modifiable factors: diet, body composition and activity level. This is genuinely good news for his prevention goal, because it means everything he needs to do to bring the cholesterol down is within his control.\n\nHis immune picture shows suppression across several cell types. His white cell count at 3.59, neutrophils at 1.94 and monocytes at 0.17 are all below range. His reticulocyte absolute at 44 is below range, and his bone marrow appears to be under pressure on both the red and white cell sides. Whether this is related to the kidney and metabolic findings or is a separate issue from training demand and nutritional factors is something the GP can help clarify.\n\nHis MCV at 80.9 is below range, meaning his red blood cells are smaller than they should be. This is the hallmark of early iron deficiency, and his ferritin at 42 supports it. Ferritin is the storage form of iron, and while 42 is within the laboratory range, it is well below the ideal level of 80 for a man. His TIBC and transferrin are both at the top of their ranges, which is the body's way of trying to capture more iron when supplies are running low. His haemoglobin at 154 is currently healthy, so the shortage has not yet caused anaemia, but the bone marrow is already producing smaller cells because it is running short of iron to put in them.\n\nHis vitamin D at 56 is below the ideal level of 100. Given the low calcium finding, adequate vitamin D is particularly important since it is needed for the body to absorb calcium from food. Supplementation is recommended.\n\nHis joint pain has a clear negative. Rheumatoid factor at 8, CRP at 0.4, and ESR at 1 are all normal or low. There is no inflammatory or autoimmune joint condition. At BMI 28.7 with weight gain as a reported symptom, the excess load on weight-bearing joints is the most likely explanation. Losing body fat would help directly.\n\nHis Total Antioxidant Activity at 1.79 is marginally above range, reflecting diet quality. His CEA at 2.97 is within the laboratory range but approaching the limit. With a low CRP and ESR this is unlikely to be significant, but it is worth repeating at the next test.\n\nHis MCHC at 351 is marginally above range, consistent with the concentrated blood picture.\n\nPotassium and phosphate were not returned by the laboratory. The anion gap has been omitted because it cannot be calculated without potassium. Both should be included at the next blood test, and phosphate is particularly important to check alongside the calcium and PTH. His urinalysis is normal.","links":"The priority is the GP appointment. The findings to bring are the corrected calcium of 1.71, the bicarbonate of 14.5, the creatinine of 122 with Cystatin C 1.15, the parathyroid hormone of 2.5, and the sodium of 151. These should be repeated on a fresh sample, and the GP will want to check phosphate and potassium at the same time, since both were missing from this test. If the calcium is confirmed as genuinely low, the GP will investigate the kidney-acid-calcium pattern further. If it returns to normal, the matter is resolved and the original reading was most likely a collection artefact.\n\nThe cholesterol is the second priority and connects directly to the disease prevention goal. His LDL at 4.08 and ApoB at 1.39 are significantly above their targets, and at BMI 28.7, weight loss is the most direct lever. The encouraging finding is that the Lp(a) is normal at 25, so there is no inherited component. Everything here responds to what he does.\n\nThe two changes that would address both the cholesterol and the weight gain he came to this test about are the same ones. Reducing body fat by 7 to 10kg, taking him from 91kg to roughly 81 to 84kg and his BMI from 28.7 toward 25, would lower LDL and ApoB, improve the cholesterol ratios, and reduce the mechanical load on his joints. At 91kg and 178cm with 5 training sessions and 5,000 to 7,500 steps, his maintenance is approximately 2,600 to 2,900 calories. A target of 2,200 to 2,400 with at least 120 to 145g of protein daily (1.3 to 1.6g per kilogram) would produce steady fat loss of roughly half a kilogram a week while preserving muscle.\n\nThe Mediterranean diet at 8 out of 10 quality is already a strong base. The useful adjustments for cholesterol specifically are increasing soluble fibre from oats, beans, lentils and apples (which binds cholesterol in the gut and removes it), increasing oily fish to 2 to 3 portions per week, and reducing saturated fat from red meat and full-fat dairy.\n\nHis ferritin at 42 needs improving. Red meat, shellfish, dark leafy greens and pulses are the food sources. Iron from plant sources is absorbed better when eaten with vitamin C from peppers, citrus or tomatoes. Tea and coffee should be avoided within an hour either side of iron-rich meals. Whether a supplement is needed depends on the repeat test and what the GP finds regarding the kidney function, since reduced kidney function can affect iron handling.\n\nVitamin D supplementation at 2,000 to 3,000 IU daily with vitamin K2 MK-7 at 100 micrograms is recommended. His level of 56 is well below ideal, and given the calcium finding, ensuring adequate vitamin D is particularly important since it is needed for calcium absorption.\n\nA follow-up test after the GP has repeated the urgent markers and once any changes have had 12 weeks to take effect. Worth repeating: full lipid panel with ApoB, ferritin and full blood count with MCV and reticulocytes, kidney function including Cystatin C, calcium with PTH and vitamin D, bicarbonate, sodium, potassium and phosphate, CEA, and amylase and lipase.","flags":"URGENT FOR GP\n\nCorrected calcium 1.71, significantly below the limit of 2.2. Raw calcium 1.93, below the limit of 2.08. Parathyroid hormone 2.5, paradoxically normal when it should be elevated in response. Either genuine hypocalcaemia with an inappropriately normal PTH (hypoparathyroidism), or EDTA contamination from a purple-topped tube falsely lowering the reading. Repeat urgently. Magnesium normal at 1.03, which is mildly reassuring.\n\nBicarbonate 14.5, significantly below the limit of 20. The body's main acid buffer is severely depleted. Combined with the reduced kidney function and the low calcium, this forms a pattern suggesting the kidneys may be losing the ability to maintain acid-base balance.\n\nCreatinine 122 (above 104). eGFR 64 by creatinine. Cystatin C 1.15 (above 1.1), eGFR 69 by Cystatin C. Both measures agree kidney function is reduced at 39. No protein in urine, so no active damage. Sodium 151 (above 146) with dilute urine (specific gravity 1.005), which can indicate reduced concentrating ability.\n\nCHOLESTEROL\n\nApoB 1.39 (above 0.9). LDL 4.08 (above 3). Total cholesterol 6.4. Non-HDL 4.6 (above 4). ApoB/A-I ratio 0.755 (above 0.7). Lipoprotein(a) 25, normal, so no inherited component and the elevation is entirely modifiable. HDL 1.8 within ideal. Triglycerides 1.29 within range.\n\nBLOOD COUNT\n\nWhite cells 3.59 (below 4). Neutrophils 1.94 (below 2). Monocytes 0.17 (below 0.2). Bone marrow under pressure across both red and white cell lines. Reticulocyte absolute 44 (below 50).\n\nMCV 80.9 (below 83). MCHC 351 (above 345). Early iron deficiency with small, densely packed red cells. Ferritin 42, within laboratory range but below ideal 80 for a man. TIBC 74.8 and transferrin 3.59 both at top of range, confirming body is signalling for more iron. RDW 14.9 above ideal. Haemoglobin normal at 154.\n\nOTHER\n\nAmylase 139 (above 118) and lipase 71 (above 60). Both pancreatic enzymes raised. May reflect reduced kidney clearance rather than pancreatic inflammation. CA 19-9 1.2 is very low.\n\nInsulin 2.05 (below 2.6), C-Peptide 90.7 (below 240), HOMA-IR 0.44 (below 0.5), HOMA-B 31.54 (below 80). All reflect exceptional insulin sensitivity despite BMI 28.7. Glucose 4.8 and HbA1c 32 both excellent.\n\nTestosterone 29.9 (marginally above 28.7). SHBG 69.4 (above 65.8). Free testosterone 0.385 within ideal. Not a concern.\n\nAlbumin 51 (above 50) and total protein 87 (above 82). Concentrated blood from dehydration.\n\nFIB-4 1.45 at threshold. All liver markers normal. Driven by calculation rather than disease.\n\nVitamin D 56, below ideal 100. Supplementation recommended, particularly given calcium finding.\n\nCEA 2.97, approaching limit. Repeat at next test.\n\nTAA 1.79, marginally above range. Supplementation.\n\nPotassium and phosphate not returned by the laboratory. Both should be included at the next blood test. Phosphate is particularly important alongside the calcium and PTH. Anion gap omitted.\n\nReassuring negatives: rheumatoid factor 8, CRP 0.4, ESR 1, ruling out inflammatory joint disease. Coeliac negative. Thyroid normal with negative antibodies. Cortisol 351 within ideal. PSA 0.56 with free ratio 61%. Urine clear.","recommendations":"See your GP urgently to repeat the calcium, bicarbonate, kidney function, sodium, potassium and phosphate. Take this report with you.\n\nAsk the GP about the ApoB of 1.39 and LDL of 4.08. Your Lipoprotein(a) is normal at 25, so the elevation is modifiable.\n\nTarget a weight loss of 7 to 10kg over 3 to 6 months, from 91kg toward 81 to 84kg. Aim for 2,200 to 2,400 calories with 120 to 145g of protein daily.\n\nIncrease soluble fibre (oats, beans, lentils) and oily fish. Reduce saturated fat.\n\nImprove iron intake through food. Recheck ferritin alongside the GP repeat test.\n\nStart vitamin D3 at 2,000 to 3,000 IU daily with K2 MK-7 100 micrograms.\n\nRetest in 12 weeks after the GP markers are resolved: full lipid panel with ApoB, ferritin, full blood count, kidney function, calcium, PTH, vitamin D, bicarbonate, sodium, potassium, phosphate, CEA, amylase and lipase.","supplementation":"Vitamin D3 at 2,000 to 3,000 IU daily, taken with a meal containing fat, alongside vitamin K2 as MK-7 at 100 micrograms. At 56 he is well below the ideal level of 100, and vitamin D is needed for the body to absorb calcium, which is particularly relevant given the calcium finding. K2 helps direct calcium into bone rather than into soft tissue.\n\nMagnesium glycinate at 400mg before bed. Supports sleep quality, muscle recovery and, importantly, calcium metabolism. Magnesium and calcium work together, and ensuring adequate magnesium supports the calcium investigation.\n\nOmega-3 fish oil providing 2 to 3g of combined EPA and DHA daily. Supports cardiovascular health directly relevant to the elevated ApoB and LDL, and has a modest lowering effect on triglycerides.\n\nThe most important actions from this report are not supplements. They are the GP appointment for the calcium, bicarbonate and kidney findings, and the dietary and weight changes for the cholesterol. Both should happen before anything else.","biomarkers":[{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","units":"g/l","description":"Marginally above range at 51. Albumin is the main protein in blood. A level slightly above range is most commonly seen with dehydration, where less water in the blood makes everything dissolved in it read higher. The raised sodium (151) and total protein (87) point the same way. It also affects the corrected calcium calculation discussed below.","low_causes":"Undernutrition","high_causes":"Dehydration","padding":"1 ":"mIU/L","description":"Below range at 2.05. In most people a low insulin would raise questions, but Salvatore's blood sugar is 4.8, his HbA1c is 32, and his HOMA-IR is 0.44, all of which are excellent. His pancreas is simply producing very little because very little is being asked of it. At BMI 28.7, this is actually a surprisingly positive finding, since it shows his metabolic engine is running efficiently despite the excess weight. The Mediterranean diet and the resistance training are the likely reasons.","low_causes":"Very high insulin sensitivity","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"2.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3251","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393124066","upper_optimal_position":"0.4439461883","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","units":"pmol/L","description":"Below range at 90.7, mirroring the low insulin. C-Peptide is released in equal amounts to insulin and confirms the pancreas is producing very little. In the context of perfect blood sugar control, this is a reflection of low demand rather than pancreatic failure.","low_causes":"Low carbohydrate intake, high insulin sensitivity","high_causes":"High insulin demand","padding":"1","one_sided":"0.5","result":"90.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2938","lower_normal":"240","upper_normal":"1500","lower_optimal":"400","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3756613757","upper_optimal_position":"0.4814814815","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","units":"Ratio","description":"Below range at 0.44, and this is a favourable finding rather than a problem. HOMA-IR measures how well cells respond to insulin, and a result below range means they respond exceptionally well. This is notable at a BMI of 28.7, because insulin resistance is usually one of the first metabolic consequences of excess weight. His has not developed, which suggests the Mediterranean diet and resistance training are protecting him.","low_causes":"Exceptional insulin sensitivity","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","range_type":"normal"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","units":"","description":"Below range at 31.54. This estimates how hard the insulin-producing cells of the pancreas are working. A low figure alongside normal blood sugar means the pancreas is not being asked to work hard. In this context it reflects low demand.","low_causes":"Low demand, high insulin sensitivity","high_causes":"Overcompensation","padding":"1","one_sided":"0.5","result":"31.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1987","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity CRP","group":"INFLAMMATION","units":"mg/l","description":"Within the ideal range at 0.4. CRP is produced by the liver in response to inflammation anywhere in the body. A low level at BMI 28.7 is a genuinely positive finding, since excess body fat normally drives CRP upward. It suggests the fat he is carrying is metabolically less harmful  (dilute). The dilute urine complicates the straightforward dehydration explanation, because if he were simply short of fluid the urine would be concentrated rather than dilute. This combination can occur when the kidneys are losing the ability to concentrate urine properly, which connects to the kidney findings discussed below.","low_causes":"Overhydration","high_causes":"Dehydration, kidney concentrating ability","padding":"1","one_sided":"0.5","result":"151","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7949","lower_normal":"133","upper_normal":"146","lower_optimal":"138","upper_optimal":"142","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4615384615","upper_optimal_position":"0.5641025641","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Within the ideal range.","low_causes":"Fluid loss","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"104","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4102564103","upper_optimal_position":"0.5641025641","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Significantly below range at 14.5, against a lower limit of 20. This is one of the findings that requires urgent GP attention.\n\nBicarbonate is the body's main acid buffer. It neutralises the acids produced by normal metabolism, and the kidneys are responsible for regenerating it. When bicarbonate falls this low, it means either the body is producing far more acid than it can buffer, or the kidneys are not regenerating bicarbonate properly, or both.\n\nAt 14.5 alongside a creatinine of 122, an eGFR of 64 by creatinine and 69 by Cystatin C, and a corrected calcium of 1.71, this forms a pattern that a GP needs to investigate. The kidneys may be losing the ability to maintain the body's acid-base balance, which would also explain the low calcium if the chronic acid load is drawing calcium from bone to act as a buffer.","low_causes":"Kidney dysfunction, metabolic acidosis","high_causes":"Not significant","padding":"1","one_sided":"0.5","result":"14.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1667","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939393939","upper_optimal_position":"0.5757575758","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Significantly below range at 1.93, against a lower limit of 2.08. This is the finding that requires the most urgent GP attention in this report.\n\nCalcium is essential for nerve signalling, muscle contraction, heart rhythm and bone strength. At 1.93, it is meaningfully below the normal range. Symptoms of low calcium can include muscle cramps, tingling in the fingers or around the mouth, and in more severe cases disturbances to heart rhythm.\n\nWhat makes this finding unusual is the parathyroid hormone at 2.5, which is normal. PTH is the hormone that controls calcium. When calcium falls, PTH should rise sharply to bring it back up by releasing calcium from bone, increasing absorption from food, and reducing kidney losses. A normal PTH alongside a genuinely low calcium is called an inappropriately normal PTH response, and it narrows the possible explanations.\n\nThere is a second possibility that should be mentioned. If the blood sample was contaminated with EDTA, which is the anticoagulant used in purple-topped collection tubes, it will falsely lower the calcium reading. This is one of the most common causes of an unexpectedly low calcium on a blood test. The normal PTH would fit this explanation, because the calcium in the body would actually be fine and the PTH would have no reason to rise.\n\nEither way, this needs repeating urgently. If it is genuine, the combination with the low bicarbonate and the reduced kidney function points to a specific pattern that a GP will want to investigate. If it is a laboratory artefact, a repeat will show a normal result and the matter is resolved. Until it is repeated, it should not be ignored.","low_causes":"Vitamin D deficiency, hypoparathyroidism, EDTA contamination","high_causes":"Hyperparathyroidism","padding":"1","one_sided":"0.5","result":"1.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2456","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4619883041","upper_optimal_position":"0.5789473684","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","units":"mmol/L","description":"Significantly below range at 1.71. Corrected calcium adjusts the raw figure for the albumin level. Because Salvatore's albumin is above range at 51, the correction has moved the figure further below normal rather than closer to it. If the raw calcium is genuine, this confirms the problem. If the raw calcium is a laboratory artefact from EDTA contamination, the corrected figure is equally unreliable. Either way, a repeat is needed.","low_causes":"Vitamin D deficiency, hypoparathyroidism, EDTA contamination","high_causes":"Hyperparathyroidism","padding":"1","one_sided":"0.5","result":"1.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Within the ideal range, which is a positive finding given the other electrolyte disturbances. Magnesium and calcium usually fall together when a systemic problem is the cause, so a normal magnesium is mildly reassuring.","low_causes":"Sweat losses, poor intake","high_causes":"Supplementation","padding":"1","one_sided":"0.5","result":"1.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6207","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172413793","upper_optimal_position":"0.6034482759","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","units":"umol/l","description":"Above range at 122, and this is one of the findings the GP needs to see.\n\nCreatinine is a waste product of muscle. In a muscular man doing 3 resistance sessions a week, a higher creatinine is expected because he produces more of it. However, the Cystatin C at 1.15, which is not affected by muscle mass, also shows reduced kidney function with an eGFR of 69. When both measures agree that kidney function is below where it should be, the finding is real rather than a reflection of build.\n\nAt 39, both estimates (eGFR 64 by creatinine, 69 by Cystatin C) are below where kidney function should sit. Combined with the low bicarbonate and the low calcium, this is a pattern the GP will want to investigate.","low_causes":"Low muscle mass","high_causes":"Reduced kidney function, muscle mass","padding":"1","one_sided":"0.5","result":"122","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8205","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"90","lower_nor function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){

    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';

}
