<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Hector Gosselin","dob":"30/09/1997","report_date":"2026-09-14","summary":"Hector is a 28-year-old male presenting with a BMI of 27.7, following a low-carb, high-protein diet rated 8 out of 10 for quality with a volume of 7 out of 10. He trains six times per week, split evenly between three cardio and three resistance sessions, with 7,500 to 10,000 daily steps. He reports no medications, no significant habits, and his symptoms include joint pain and stiffness alongside difficulty losing weight. His goals are to build muscle, improve long-term health and longevity, and reduce stress and anxiety.\n\nThere is one finding in this report that deserves a permanent place in Hector's medical record. His Lipoprotein(a), a genetically inherited particle that accelerates cardiovascular disease, has come back at 43.21 nmol/L against a desirable threshold of below 32. Lipoprotein(a), often shortened to Lp(a), is a modified form of LDL cholesterol that the body produces in a quantity set almost entirely by genetics. It deposits cholesterol into artery walls, promotes clot formation, and drives localised inflammation. Crucially, it cannot be changed by diet, exercise, or any currently available supplement. The level of 43.21 places Hector in the slightly increased risk category, which sits between 32 and 90. While this is not in the moderate or high-risk bands, it is above the safe threshold and it means that every other modifiable cardiovascular risk factor in his profile matters more than it would for someone with an Lp(a) below 32. This result should be recorded permanently in his GP notes, and it would be worth recommending that first-degree relatives, parents and siblings, have their own Lp(a) tested because the trait is inherited.\n\nThere is a great deal of good news in this report. Hector's liver is in excellent condition. His ALT, the enzyme most sensitive to liver cell damage, is 18, comfortably below the optimal threshold of 30. His AST is 23, his Gamma GT, the enzyme that rises earliest with alcohol exposure or metabolic strain, is 24, and his FIB-4 fibrosis score is 0.64, well below the threshold of 1.45. The liver is under no measurable strain at all. His kidney function is equally strong. His Cystatin C, a protein filtered by the kidneys that gives a more accurate picture of filtration than creatinine alone, is 0.9, generating an estimated glomerular filtration rate of 99, which is excellent at any age. His creatinine-based eGFR confirms this at above 90. His thyroid is working well. TSH, the hormone the pituitary gland sends to stimulate the thyroid, is 1.43, sitting right in the optimal zone between 1.0 and 2.5. Free T4 at 16.5 and Free T3 at 4.9 both sit comfortably within their optimal ranges, and both thyroid antibody tests are negative, which rules out autoimmune thyroid disease. His full blood count is healthy across the board. Haemoglobin at 156, red cell count at 5.14, and haematocrit at 0.45 all sit cleanly within range, indicating good oxygen-carrying capacity and healthy red cell production. White blood cells at 5.09 with a balanced differential, neutrophils, lymphocytes, monocytes, eosinophils, and basophils all where they should be, indicate a well-functioning immune system with no signs of infection or suppression. Reticulocytes, the young red blood cells that indicate how actively the bone marrow is producing new cells, are at 56.54, within range and showing steady turnover. His ESR, a broad marker of inflammation, is just 2, which is about as low as it gets. His iron studies tell a reassuring story. Ferritin at 112 sits in the optimal zone for a man his age, transferrin saturation at 36.41% is right in the sweet spot of 25 to 40%, and serum iron, transferrin, and total iron binding capacity are all within range. Iron metabolism is well balanced. His testosterone is 22.4 nmol/L, sitting within the optimal range of 18 to 30 for a man of his age, and his free testosterone at 0.473 nmol/L is healthy, supported by an SHBG of 34.5 that is neither binding too much nor too little. His DHEA-S, cortisol, oestradiol, prolactin, LH, and progesterone are all within their expected ranges. His B12 at 560 is in the optimal zone of 500 to 900, and his folate at 10 is above the optimal threshold of 8. His calcium, phosphate, and parathyroid hormone are all normal. His creatine kinase at 149 is mid-range, suggesting his muscles are recovering well from training. His immunoglobulins, IgG, IgM, IgA, and IgE, are all within range, rheumatoid factor is negative, and his coeliac screen is negative. His PSA at 0.91 with a free PSA ratio of 38.5% is entirely normal. His tumour markers CA 19-9 and CEA are both well within range. His total antioxidant activity at 1.53 is healthy. Urine is clear of protein, glucose, ketones, blood, nitrites, and bacterial growth, with no casts and a clean culture.\n\nTurning to the areas that need attention. Hector's LDL cholesterol is 3.19 mmol/L, above the laboratory upper limit of 3.0 and meaningfully above the optimal target of below 2.6. His ApoB, the protein that represents the actual number of atherogenic particles circulating in his blood, is 0.84 g/L. While this sits below the laboratory threshold of 0.9, it is above the optimal target of below 0.8. This matters more now that we know his Lp(a) is elevated, because a portion of that ApoB count is being carried by Lp(a) particles which are more damaging than ordinary LDL. His total cholesterol at 5.1 and non-HDL cholesterol at 3.5 both sit at the upper end of their desirable ranges. However, the protective side of his lipid profile is genuinely strong. His HDL at 1.6 is above the optimal threshold of 1.4 for a man, his triglycerides at 0.74 are excellent, well below the optimal ceiling of 1.0, his triglyceride-to-HDL ratio calculates to 0.46 which is outstanding, and his remnant cholesterol at 0.31 is well below the 0.5 optimal target. His ApoB-to-ApoA1 ratio is 0.58, comfortably in the lower-risk zone. The picture is therefore one of a fundamentally healthy lipid metabolism with one inherited vulnerability, the Lp(a), and one modifiable target, the LDL and ApoB, that would benefit from dietary attention. On a low-carb, high-protein diet, the most common driver of elevated LDL is saturated fat intake from sources like red meat, butter, cheese, and coconut oil. Replacing some of those calories with monounsaturated fats such as olive oil, avocado, nuts, and increasing oily fish to three portions per week would be the most effective dietary lever. Adding 5 to 10 grams of soluble fibre daily from sources like oats, psyllium husk, or ground flaxseed can reduce LDL by 5 to 10%. Given the elevated Lp(a), keeping LDL as low as possible through modifiable means is genuinely important for his long-term cardiovascular health.\n\nHector's HOMA-IR, a calculation that estimates insulin resistance using fasting glucose and insulin, has come back at 1.76 against an optimal ceiling of 1.5. His fasting glucose at 4.8 and HbA1c at 31 mmol/mol are both excellent, so the driver here is his fasting insulin at 8.27 mIU/L, which sits just above the optimal ceiling of 8. This is not insulin resistance in any clinical sense, and his HbA1c confirms that blood sugar control over the past three months has been exemplary. However, at a BMI of 27.7 with a goal of losing body fat, it is worth noting that even mildly elevated fasting insulin can make fat loss more difficult because insulin is the primary signal that tells the body to store rather than release fat. Continued resistance training and maintaining the lower-carb dietary approach are the best ways to improve insulin sensitivity. Losing 5 to 7 kg would likely bring this into the optimal zone.\n\nHis C-Peptide, a molecule released by the pancreas in equal measure to insulin and used to gauge how much insulin the pancreas is producing, is 0.989 ug/L, which converts to approximately 327 pmol/L, against a lower ty, and stress regulation. Given that reducing stress and anxiety is one of Hector's stated goals, optimising magnesium is one of the simplest and most effective interventions available.\n\nHis uric acid at 222 umol/L sits right at the lower limit of the laboratory range and below the optimal range of 200 to 380. This is not a concern. On a high-protein diet, uric acid is a byproduct of purine metabolism, and a level at the lower boundary simply reflects efficient clearance by the kidneys.\n\nHis urine white blood cells are 20 per microlitre, above the significance threshold of 10. However, his nitrites are negative, there is no bacterial growth on culture, and there are no urinary symptoms reported. This is most likely a mild contaminant or transient finding and does not suggest infection. If he develops any urinary symptoms such as frequency, urgency, or discomfort, a repeat sample would be appropriate.\n\nHis MCHC at 347 g/L is marginally above the upper limit of 345. At this margin, this is almost always a laboratory artefact related to temperature and sample handling rather than a genuine abnormality, and the lab note confirms that MCHC can be affected by these factors. His amylase at 25 IU/L is marginally below the lower limit of 30, but his lipase, the more specific pancreatic enzyme, is 35 and well within range at 13 to 60. A mildly low amylase with a normal lipase is not clinically significant and does not suggest pancreatic insufficiency.","links":"Hector's priorities from this report fall into three categories: cardiovascular risk management, body composition, and recovery and wellbeing.\n\nFor cardiovascular health, the combination of an elevated Lp(a) at 43.21 and an LDL of 3.19 means that reducing modifiable lipid risk factors is more important for Hector than it would be for someone with a normal Lp(a). The dietary approach should focus on reducing saturated fat intake while maintaining the high-protein structure that supports his training. Practically, this means choosing leaner cuts of meat, replacing butter with olive oil for cooking, increasing oily fish to at least three portions per week for the omega-3 content, and adding 5 to 10 grams of soluble fibre per day. Good sources include psyllium husk, one tablespoon in water with a meal, porridge oats, ground flaxseed, or beans and lentils if tolerated on his lower-carb approach. These changes together can reduce LDL by 10 to 15% over three to six months. The Lp(a) result should be recorded permanently with his GP. First-degree relatives should be encouraged to test their own Lp(a) levels.\n\nFor body composition, Hector's BMI of 27.7 at 97 kg and 187 cm, combined with his report of difficulty losing weight, aligns with a fasting insulin that is just above optimal. His basal metabolic rate is approximately 2,050 kcal per day, and with his training load of six sessions per week plus 7,500 to 10,000 daily steps, his maintenance calories sit around 3,280 to 3,380 kcal. To lose body fat at a sustainable rate of 0.5 to 0.75 kg per week while preserving muscle, a daily intake of 2,500 to 2,800 kcal would be appropriate. Protein should remain high at 145 to 155 grams per day, which equates to roughly 1.5 to 1.6 grams per kilogram, to support muscle protein synthesis and satiety. A target weight range of 88 to 92 kg would bring his BMI into the 25 to 26 range and would very likely normalise his HOMA-IR and further improve his lipid profile. Resistance training three times per week is already excellent for this goal and should continue.\n\nFor recovery and wellbeing, Hector reports joint pain and stiffness alongside a desire to reduce stress and anxiety. His vitamin D at 62 is sufficient but not optimal. Supplementing with 3,000 IU of vitamin D3 daily taken with his largest meal containing fat would help bring this into the 75 to 100 range over two to three months. Vitamin D plays a direct role in regulating inflammatory pathways in joints and supporting immune function. His magnesium at 0.77 is below optimal and supplementing with 400 mg of magnesium glycinate before bed would support muscle relaxation, sleep quality, and stress resilience, all of which connect directly to his anxiety-reduction goal. For joint stiffness specifically, the omega-3 supplementation recommended for his lipid profile will also help, as EPA and DHA have well-documented anti-inflammatory effects in joint tissue. Ensuring adequate sleep, aiming for seven to nine hours with a consistent wake time, getting outside within an hour of waking for natural light exposure, cutting caffeine after 2pm, and keeping the bedroom cool, would compound the benefits of the magnesium and support both recovery from training and stress reduction.\n\nA retest of the lipid panel, specifically LDL, ApoB, and a fasting insulin, in four to six months would show whether the dietary changes are moving the needle. The Lp(a) does not need retesting as it does not change.","flags":"Lipoprotein(a) 43.21 nmol/L (desirable below 32): Genetically determined, slightly increased cardiovascular risk category. Should be recorded permanently in GP notes. First-degree relatives should be offered testing. Not modifiable by lifestyle.\n\nLDL cholesterol 3.19 mmol/L (lab upper limit 3.0, optimal below 2.6): Mildly elevated. Gains additional significance in the context of the raised Lp(a). Dietary modification recommended, retest in four to six months.\n\nApoB 0.84 g/L (lab limit 0.9, optimal below 0.8): Above optimal target. Represents total atherogenic particle count. Should be tracked alongside LDL.\n\nHOMA-IR 1.76 (optimal below 1.5, early resistance threshold 1.9): Mildly above optimal, driven by fasting insulin of 8.27. Glucose and HbA1c are excellent. Weight loss and continued exercise should normalise.\n\nC-Peptide 0.989 ug/L (range 1.1 to 4.4): Marginally below range. In the context of excellent glucose and HbA1c, this reflects efficient rather than insufficient insulin production. No action required.\n\nFSH 0.69 mIU/ml (range 1.4 to 18.1): Below range. LH, testosterone, and free testosterone are all normal. Likely a normal variant. If fertility is a concern, a semen analysis would be the appropriate next step.\n\nBicarbonate 19.4 mmol/L (range 20 to 31): Marginally below range. Consistent with a low-carbohydrate diet causing mild compensatory metabolic acidosis. No clinical concern.\n\nVitamin D 62 nmol/L (sufficient but below optimal 75 to 120): Supplementation recommended.\n\nMagnesium 0.77 mmol/L (lab range 0.53 to 1.11, optimal 0.85 to 1.05): Below optimal. Supplementation recommended.\n\nUrine WBC 20/ul (significant above 10): Nitrites negative, culture negative, no symptoms. Likely contaminant. Repeat if urinary symptoms develop.\n\nMCHC 347 g/L (range 315 to 345): Marginally above range. Likely temperature or storage artefact per lab note.\n\nAmylase 25 IU/L (range 30 to 118): Marginally below range. Lipase normal at 35. No clinical significance.\n\nReassuring negatives: Liver function entirely normal. Kidney function excellent with Cystatin C eGFR 99. Thyroid function optimal with negative antibodies. Full blood count healthy. Iron studies balanced. Testosterone optimal. B12 and folate optimal. PSA and tumour markers normal. Immunoglobulins normal. Rheumatoid factor negative. Coeliac screen negative. CRP low. ESR 2. Urine clean on culture.","recommendations":"1. Record the Lp(a) result of 43.21 nmol/L permanently in GP notes and recommend Lp(a) testing for parents and siblings.\n\n2. Reduce saturated fat intake by choosing leaner protein sources, replacing butter with olive oil, and limiting cheese. Increase oily fish to three portions per week.\n\n3. Add 5 to 10 grams of soluble fibre daily from psyllium husk, oats, or ground flaxseed to support LDL reduction.\n\n4. Target a calorie intake of 2,500 to 2,800 kcal per day with 145 to 155 grams of protein to achieve gradual fat loss toward a target weight of 88 to 92 kg.\n\n5. Supplement with 3,000 IU vitamin D3 daily with a fat-containing meal to bring levels into the 75 to 100 nmol/L optimal range.\n\n6. Supplement with 400 mg magnesium glycinate before bed to support sleep quality, stress resilience, and muscle recovery.\n\n7. Begin 2 to 3 grams of combined EPA and DHA omega-3 fish oil daily to support both cardiovascular health and joint comfort.\n\n8. Pair vitamin D3 with 100 to 200 mcg of vitamin K2 (MK-7) daily to ensure calcium is directed to bone rather than soft tissue.\n\n9. Prioritise sleep hygiene: consistent wake time, natural light exposure within an hour of waking, caffeine cut-off by 2pm, and a cool bedroom.\n\n10. Retest lipid panel (LDL, ApoB, triglycerides, HDL) and fasting insulin in four to six months to assess response to dietary changes.\n\n11. If fertility is or becomes a concern, discuss the low FSH with the GP and request a semen analysis.","supplementation":"Vitamin D3: 3,000 IU of cholecalciferol daily, taken with the largest meal that contains fat. Hector's level of 62 nmol/L is sufficient but below the optimal range of 75 to 120. Vitamin D supports immune regulation, bone mineralisation, and has anti-inflammatory effects in joint tissue, which is relevant to his reported joint stiffness. At his weight and body composition, 3,000 IU should bring him into the optimal range within two to three months.\n\nVitamin K2: 100 to 200 mcg of the MK-7 form daily, taken alongside the vitamin D3. Vitamin K2 directs calcium absorbed via vitamin D into bone and teeth rather than allowing it to deposit in arteries and soft tissue. This is particularly important when supplementing vitamin D.\n\nMagnesium glycinate: 400 mg before bed. Hector's serum magnesium at 0.77 is below the optimal range of 0.85 to 1.05. The glycinate form is well absorbed and has a calming effect that supports sleep onset and quality. Given his goal of reducing stress and anxiety, this is one of the most evidence-based and practical supplements he can take.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This serves a dual purpose. For his lipid profile, omega-3 can modestly reduce triglycerides, though his are already excellent, and support a favourable ApoB trajectory. For his joints, EPA and DHA reduce the production of pro-inflammatory prostaglandins and can meaningfully improve joint stiffness and comfort over six to twelve weeks of consistent use.\n\nSoluble fibre: 5 to 10 grams of psyllium husk daily, taken in water with a meal or stirred into food. This is not a traditional supplement but functions as one for LDL reduction. Soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more, reducing circulating LDL by 5 to 10%.\n\nThe most important changes from this report are not supplements. They are the shift in dietary fat sources away from saturated fat toward monounsaturated and omega-3 fats, the sustained calorie deficit to bring body weight toward 88 to 92 kg, and the sleep and stress management practices that will support both his training recovery and his goal of reducing anxiety.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Hector's result of 4.8 mmol/L sits right in the middle of the optimal range of 4.0 to 5.4, confirming that his body is managing blood sugar efficiently. This is a strong result, particularly on a low-carb diet where glucose regulation is typically well supported.","low_causes":"Prolonged fasting, excessive exercise, insulin overproduction, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c reflects average blood sugar control over the past two to three months by measuring what percentage of haemoglobin, the oxygen-carrying protein in red blood cells, has become coated with sugar. Hector's result of 5.0% is well within the normal range and below the pre-diabetes threshold of 6.0%, confirming excellent long-term blood sugar management.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Pre-diabetes, diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. Hector's result of 31 is well below the pre-diabetes threshold of 42 and below the optimal ceiling of 36, confirming that blood sugar has been well controlled over the preceding two to three months.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Pre-diabetes, diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"8.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4569","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3060","upper_optimal_position":"0.5749","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to release to keep blood sugar in check. Hector's result of 8.27 mIU/L is within the laboratory range but sits just above the optimal ceiling of 8. This suggests the pancreas is working slightly harder than ideal to maintain his excellent glucose levels. At a BMI of 27.7, modest fat loss is the most effective way to reduce insulin demand and improve insulin sensitivity.","low_causes":"Low carbohydrate intake, high insulin sensitivity, pancreatic insufficiency","high_causes":"Insulin resistance, excess body fat, high carbohydrate intake, stress, lack of exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.989","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2333","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5606","units":"ug/l","description":"C-Peptide is a fragment of the proinsulin molecule that is released by the pancreas in a one-to-one ratio with insulin. It provides a reliable measure of how much insulin the pancreas is actually producing, independent of external insulin administration. Hector's result of 0.989 ug/L (approximately 327 pmol/L) is marginally below the lower limit of 1.1. However, in the context of an excellent fasting glucose of 4.8 and an HbA1c of 31, this reflects efficient, demand-matched insulin production rather than pancreatic insufficiency. The pancreas is producing just enough insulin to keep glucose controlled, which is metabolically favourable.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7533","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index that estimates insulin resistance using fasting glucose and fasting insulin. A score below 1.0 indicates excellent insulin sensitivity, and below 1.5 is considered the optimal ceiling. Hector's result of 1.76 is above optimal but below the early insulin resistance threshold of 1.9. This is being driven by his fasting insulin of 8.27 rather than by any elevation in glucose. At his current BMI of 27.7, losing 5 to 7 kg through the calorie deficit and continued training would very likely bring this into the optimal zone.","low_causes":"High insulin sensitivity, low carbohydrate intake, lean body composition","high_causes":"Excess body fat, sedentary lifestyle, high carbohydrate intake, chronic stress, poor sleep","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"127.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5269","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, the cells responsible for producing insulin. It is calculated from fasting insulin and glucose. Hector's result of 127.2 sits comfortably within the healthy range of 80 to 200, confirming that his pancreatic beta cells are functioning well and producing an appropriate amount of insulin for his metabolic needs.","low_causes":"Beta cell exhaustion, type 1 diabetes, long-standing type 2 diabetes, very low carbohydrate intake","high_causes":"Early insulin resistance with compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1607","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver health. Hector's result of 18 IU/L is well below both the laboratory limit of 56 and the optimal ceiling of 30 for a man. This confirms the liver is healthy and free from metabolic strain.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Fatty liver disease, alcohol excess, medications, viral hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST is an enzyme found in the liver, heart, and muscles. Elevations can come from liver damage but also from intense exercise or muscle injury. Hector's result of 23 IU/L is well within range and consistent with a healthy liver. Combined with his normal CK of 149, this confirms the AST is reflecting liver health rather than muscle breakdown from training.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver damage, intense exercise, heart damage, muscle injury, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1644","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"Gamma GT is the liver enzyme most sensitive to alcohol exposure and biliary stress. It rises before other liver enzymes when the liver is under strain. Hector's result of 24 IU/L is below the optimal ceiling of 25 and well within the laboratory range, confirming the liver is metabolically clean and coping well.","low_causes":"Normal finding","high_causes":"Alcohol consumption, medications, bile duct obstruction, fatty liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP is an enzyme found in the liver and bones. In a 28-year-old male whose bones are fully mature, ALP primarily reflects biliary health. Hector's result of 62 IU/L is well within range and confirms healthy bile duct function.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disorders, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes it for excretion. Hector's result of 13 umol/L sits in the middle of the range, confirming normal red cell turnover and healthy liver clearance.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome, haemolytic anaemia, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6133","units":"g/l","description":"Total protein measures the combined level of albumin and globulin in the blood. It reflects liver synthetic function, immune activity, and nutritional status. Hector's result of 70 g/L is within the optimal range and consistent with adequate protein intake and healthy liver production.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and serves as a marker of both liver function and nutritional status. Hector's result of 44 g/L is within the optimal range, reflecting healthy liver synthesis and adequate protein nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulins are a group of proteins that include antibodies and transport proteins. They reflect immune function and inflammatory status. Hector's result of 26 g/L is within the optimal range, indicating a normally functioning immune system without chronic inflammation.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4738","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio reflects the balance between the liver's main transport protein and the immune system's protein output. Hector's ratio of 1.69 sits within the optimal range, confirming a healthy balance between liver function and immune activity.","low_causes":"Chronic inflammation, liver disease, autoimmune conditions, infections","high_causes":"Immune deficiency, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2207","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. Hector's score of 0.64 is well below the threshold of 1.3, confirming no evidence of liver fibrosis.","low_causes":"Normal healthy liver","high_causes":"Liver fibrosis, cirrhosis, chronic liver disease, age-related calculation effects","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2652","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6061","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Hector's result of 25 IU/L is marginally below the lower limit of 30. However, his lipase, the more specific pancreatic enzyme, is 35 and well within its range of 13 to 60. A mildly low amylase with a normal lipase does not suggest pancreatic insufficiency and can be a normal variant, particularly on a lower-carbohydrate diet where starch digestion demand is reduced.","low_causes":"Normal variant, low-carbohydrate diet, chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4894","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is the pancreatic enzyme most specific to fat digestion. It is the primary marker used to assess pancreatic health. Hector's result of 35 U/L sits comfortably within the range of 13 to 60, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4903","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures the combined amount of HDL, LDL, and VLDL cholesterol circulating in the blood. Hector's result of 5.1 mmol/L sits just above the desirable threshold of 5.18 used by the laboratory but this number alone has limited clinical value. The breakdown into HDL, LDL, and ApoB tells a much more useful story and is assessed separately below.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2176","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the form in which fat circulates in the blood, primarily influenced by recent carbohydrate and sugar intake. Hector's result of 0.74 mmol/L is excellent, well below the optimal ceiling of 1.0 and consistent with a low-carbohydrate dietary approach. Low triglycerides are one of the strongest individual markers of metabolic health.","low_causes":"Very low-fat diet, hyperthyroidism, malnutrition, malabsorption","high_causes":"High carbohydrate/sugar intake, excess alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL is the lipoprotein that carries triglycerides from the liver to the tissues. It is calculated from the triglyceride level. Hector's result of 0.34 mm ontext of his elevated Lp(a), reducing LDL through dietary modification becomes more important because the inherited Lp(a) risk cannot be changed. The most effective dietary levers are reducing saturated fat intake and adding soluble fibre.","low_causes":"Very low-fat diet, hyperthyroidism, malabsorption, genetic factors","high_causes":"High saturated fat intake, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3544","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a quick measure of cardiovascular risk that accounts for both harmful and protective cholesterol. Hector's ratio of 3.19 is well below the 4.5 threshold and below the optimal ceiling of 4.0, indicating a favourable overall balance.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, elevated total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7843","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol indicates how much of the circulating cholesterol is the protective type. Hector's HDL constitutes 31.4% of his total cholesterol, well above the minimum of 20% and above the optimal threshold of 25%, reflecting avourable overall.","low_causes":"High HDL, low LDL, regular exercise, healthy weight","high_causes":"Metabolic syndrome, high LDL, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"43.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6753","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL cholesterol that accelerates cardiovascular disease through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clot formation, and it drives localised inflammation. Unlike LDL, Lp(a) levels are set almost entirely by genetics and cannot be meaningfully changed by diet, exercise, or currently available supplements. Hector's result of 43.21 nmol/L places him in the slightly increased risk category (32 to 90). This is a result that should be recorded permanently in his medical record. It also means that reducing every modifiable cardiovascular risk factor, particularly LDL and ApoB, is more important for Hector than for someone with an Lp(a) below 32. First-degree relatives should be encouraged to test their own levels.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","descriptio function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);

}

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
