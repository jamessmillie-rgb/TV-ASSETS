<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Harinder Gill","dob":"12/12/1978","report_date":"2026-10-08","summary":"Harinder is a 47-year-old male of South Asian ethnicity presenting with a BMI of 22.5, following a vegetarian diet (including eggs and dairy) for the past three years, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are slightly below average (volume 4 out of 10). He trains five times per week (four resistance sessions and one cardio session at moderate intensity) with 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress feels hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week. He takes no medications. His supplements are omega-3 fish oil, a multivitamin, creatine and protein powder. He has no diagnosed conditions and no previous blood test on record. He reports low energy and fatigue and low sex drive and libido, both present for over a year. He describes sexual desire as still strong but erectile performance deteriorating over the past 12 to 18 months, with weak erections and absent morning erections. He also notices his energy dropping significantly in the late evening. He is concerned that becoming vegetarian three years ago may be causing nutritional deficiencies. His goals are to build muscle, improve energy levels and improve long-term health and longevity.\n\nThe single most important finding in this report is Harinder's lipoprotein(a), which at 118.72 nmol/L is nearly four times the upper limit of 32. Lipoprotein(a), often written Lp(a), is a particle the liver makes that carries cholesterol into artery walls, encourages blood clots and drives local inflammation. Unlike LDL cholesterol, Lp(a) is almost entirely genetically determined: no diet, exercise programme or lifestyle change will lower it meaningfully, and it will remain at roughly this level for life. It is elevated in around 20 percent of the general population and is more common in people of South Asian ancestry. This result should be recorded permanently in his medical notes, and he should ask his GP to test his first-degree relatives (parents, siblings, children) because they each have a roughly 50 percent chance of carrying the same trait. The practical consequence is that Harinder's cardiovascular risk is higher than his age and fitness would suggest, and the modifiable risk factors, LDL, ApoB, blood pressure, blood sugar and inflammation, need to be kept as low as possible to compensate for the fixed risk that Lp(a) adds. There is a class of drug called antisense oligonucleotides in late-stage clinical trials specifically targeting Lp(a), and his GP should be aware of these for future consideration.\n\nHis IgE is 557, more than five times the upper limit of 100. IgE is the immunoglobulin the immune system produces in response to allergens, and levels this high indicate a significant allergic burden. This could be environmental (house dust mite, pollen, pet dander, mould) or dietary (dairy and eggs are common triggers and are staples of a vegetarian diet), or both. He has not reported classic allergy symptoms such as hayfever, eczema or asthma, but elevated IgE can also contribute to fatigue and general malaise. His GP should arrange specific IgE allergen testing, sometimes called RAST testing, to identify what is driving this. His IgG is also elevated at 19.1 against an upper limit of 16. IgG is the most abundant antibody in the blood and a sustained elevation can reflect chronic low-grade immune stimulation, whether from an allergen, a chronic infection, or an autoimmune process. His rheumatoid factor is negative and his coeliac screen is negative, which rules out two common autoimmune explanations. The combination of very high IgE and raised IgG together suggests the immune system is chronically activated, most likely by an allergic mechanism, and this is worth investigating.\n\nHis ESR is 36, three times the upper limit of 12. ESR stands for erythrocyte sedimentation rate and measures how quickly red blood cells settle in a tube over one hour; faster settling means more inflammation. This is a non-specific marker, meaning it tells us something is driving inflammation but not what. His hsCRP, by contrast, is 0.9, which is below the ideal threshold of 1.0 and essentially rules out acute systemic inflammation. The discrepancy between a high ESR and a low CRP is a recognised pattern and usually points to chronic immune activation rather than acute infection or tissue damage. The elevated IgG is the most likely explanation here, as high immunoglobulin levels physically increase the sedimentation rate. His GP should be aware of the ESR result, but in the context of a normal CRP, negative rheumatoid factor and negative coeliac screen, it is the immune activation driving the number rather than a hidden inflammatory disease.\n\nTurning to the positives, and there are many. Harinder's thyroid is working very well. TSH at 1.58 sits within the ideal band of 1.0 to 2.5, free T4 at 18.6 is comfortably within the optimal range, and free T3 at 5.5 is excellent. Both thyroid antibodies are negative, so autoimmune thyroid disease has been excluded. His thyroid is not contributing to his fatigue or his erectile symptoms. His blood sugar control is exceptional: fasting glucose is 4.4, HbA1c is 36, and HOMA-IR is 0.48, which is below range in the favourable direction and means his cells are highly sensitive to insulin. This is particularly noteworthy given his South Asian ethnicity, which carries a higher baseline risk for type 2 diabetes; at 47, with these numbers, his metabolic health is excellent. His insulin is 2.45 and his C-peptide is 0.661 ug/L (approximately 219 pmol/L), both below their laboratory ranges, but in the context of a perfect fasting glucose and a perfect HbA1c, these simply reflect a pancreas that does not need to produce much insulin because the cells respond to it so efficiently. This is the metabolic signature of a lean, insulin-sensitive individual and is a positive finding, not a concern. His liver is in excellent health. ALT at 20 is well within the optimal range, GGT at 19 is clean, AST at 21 is healthy, and the FIB-4 score of 1.09 rules out any suggestion of liver fibrosis. The APRI score of 0.26 and the NAFLD Fibrosis Score of minus 2.31 both confirm this. His bilirubin at 21 sits exactly at the upper limit of the laboratory range, and with every liver enzyme clean, this is almost certainly Gilbert's syndrome, a harmless inherited variation in bilirubin metabolism that affects around 5 to 10 percent of people. It does not progress, does not cause disease and does not need treatment. His kidney function is solid: cystatin C at 0.94 gives a cystatin C eGFR of 90 and the combined eGFR is also 90, both above the optimal threshold. His iron studies are reassuring and directly address his concern about vegetarian deficiencies. Ferritin at 175 is comfortably within the ideal range of 50 to 200, transferrin saturation at 39 percent is within the optimal band of 25 to 40 percent, and serum iron and iron binding capacity are both healthy. His haemoglobin at 154 is strong. Three years of vegetarian eating has not depleted his iron stores. His B12 at 415 is within the laboratory range of 193 to 982 but sits below the optimal threshold of 500. For someone eating no meat or fish, this is a reasonable level but would benefit from being higher, and we will address this in supplementation. His folate at 20 is above the laboratory range of 3 to 17 and above the optimal floor of 8, which is a positive finding likely reflecting his multivitamin and good vegetable intake. His calcium, corrected calcium, phosphate and magnesium are all healthy, and his parathyroid hormone at 4.7 sits just within its upper limit, which with a normal calcium is not a concern.\n\nHis testosterone at 21.7 is within the laboratory range and within the optimal band of 18 to 30, which is genuinely good news for a man of 47 reporting erectile difficulty and low libido. His free testosterone at 0.399 and his SHBG at 42.6 are both healthy, and his free androgen index at 50.94 is within range. Bioavailable testosterone at 9.55 is at the top of the optimal band. His LH and FSH are normal, confirming the pituitary is signalling the testes appropriately. His oestradiol at 137 is within range but sitting close to the upper limit of 146, and his progesterone at 1.56 is within the male reference range. His prolactin at 136 is normal. Cortisol at 447 is within the morning reference range. DHEA-S at 5.4 umol/L (approximately 1,990 ug/dL) is within range. The hormone picture, taken as a whole, does not explain his erectile symptoms. Testosterone is healthy, oestradiol is not excessively high relative to testosterone, and the pituitary axis is intact. This is actually useful information: it means the cause of his erectile difficulty is unlikely to be hormonal and is more likely vascular, neurological, or related to the cardiovascular risk picture described above. Lp(a) and elevated ApoB accelerate endothelial dysfunction, which is the earliest stage of atherosclerosis and also the mechanism behind erectile difficulty, because the small arteries supplying the penis are among the first to be affected. Erectile dysfunction in a man with elevated Lp(a) and ApoB should be taken seriously as a potential early vascular signal, and this is a conversation worth having with his GP.\n\nHis lipid profile needs attention. Total cholesterol at 4.9 is acceptable, but his LDL at 3.21 is above the upper limit of 3.0, and his ApoB at 1.08 is above the 0.9 threshold and above the 0.8 optimal target. ApoB is the single best measure of atherogenic particle number because every LDL particle, every VLDL particle and every Lp(a) particle carries exactly one ApoB molecule, so the ApoB count tells us how many particles are available to enter artery walls. When we subtract the cholesterol carried by his Lp(a) particles, his Lp(a)-corrected LDL falls to 2.83, which is within the laboratory range of 3.0 and closer to ideal. This tells us that a meaningful portion of his measured LDL is actually Lp(a) cholesterol, which cannot be lowered by diet. The modifiable fraction, the true LDL, is close to target but still above the optimal level of 2.0, and with an Lp(a) this high, the clinical goal is to get every modifiable risk factor as low as possible. His HDL at 1.3 is above the minimum threshold but below the ideal of 1.4 for a male. His triglycerides at 0.93 are excellent, well within the optimal band below 1.0. His ApoA1 at 1.41 is healthy. The ApoB to ApoA1 ratio at 0.77 is in the average risk band of 0.7 to 0.9, above the lower risk threshold of 0.7. His Cardiovascular Risk Score, a TrueVitals composite index scored from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 50 out of 100 against a target of below 20 and an acceptable threshold of 40. This score has no age adjustment, and the reason it is elevated in a lean, metabolically healthy 47-year-old is almost entirely the Lp(a). That does not make it less important; it makes the modifiable components (LDL, ApoB, HDL) all the more important to optimise.\n\nHis PhenoAge is 38.1 against a calendar age of 47, meaning his blood markers suggest a biological age nearly nine years younger than his actual age. This is an excellent result driven by his low CRP, healthy glucose, strong albumin and good white cell and red cell indices. It confirms that his underlying metabolic health is very good.\n\nHis full blood count is largely healthy. White cells, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within range. His red cells, haemoglobin, haematocrit, MCV, MCH and MCHC are all normal. His reticulocyte percentage at 0.85 is within range, but the absolute reticulocyte count at 42.84 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a mildly low absolute count in the context of a completely normal haemoglobin and healthy iron stores simply means the bone marrow is not under pressure to produce extra red cells. This is not a concern. His MPV at 11.1 is above the upper limit of 10.1. MPV stands for mean platelet volume and measures the average size of platelets. Larger platelets are younger and more active, and a mildly elevated MPV in an otherwise normal blood count is usually a normal variant and not clinically significant.\n\nHis alkaline phosphatase at 43 is marginally below the lower limit of 46. ALP is an enzyme found in liver, bone and gut, and a mildly low level in isolation with all other liver and bone markers normal is not a concern. It can be seen with low zinc or low magnesium, but his magnesium is healthy at 0.92. His zinc was not directly measured on this panel, but his multivitamin should be providing some. His total antioxidant activity at 1.92 is above the upper range of 1.77, which is a positive finding and likely reflects his omega-3 and multivitamin supplementation. His prostate markers are reassuring: PSA at 0.96 is well within range, free PSA ratio at 0.57 is strongly reassuring, and tumour markers CA19-9 and CEA are both normal. His urinalysis is clean with no protein, no glucose, no blood, no white cells and no nitrites; bacterial culture and sensitivities are pending.\n\nReturning to Harinder's symptoms of fatigue, afternoon energy crash, evening energy drop and erectile difficulty, the bloods have excluded the most common causes. His thyroid is working well, his iron stores are full, his B12 is adequate (though could be higher), his testosterone is healthy, his blood sugar is excellent, his cortisol is normal and his kidney and liver function are fine. The findings that could be contributing are: first, the immune activation (IgE 557, IgG 19.1, ESR 36) which represents a chronic burden on the body and can cause fatigue even without obvious allergy symptoms; second, the cardiovascular risk profile (Lp(a) 118.72, ApoB 1.08) which may be causing early endothelial dysfunction and could explain the erectile changes; and third, his eating pattern, where a volume of 4 out of 10 with moderate-intensity resistance training four days a week may mean he is not eating enough total calories or protein to support recovery and energy. At 77 kg and 185 cm with a BMI of 22.5 and a goal of building muscle, he needs to be in a slight caloric surplus with high protein intake, and a volume of 4 out of 10 suggests he may be falling short. The afternoon crash and evening energy drop are consistent with insufficient fuel across the day, particularly if breakfast is light or skipped. His sleep of 7 to 8 hours is reasonable, but being slow to get going suggests sleep quality may not be optimal, and this is worth addressing.","links":"The central thread connecting Harinder's results is a cardiovascular risk profile that is far higher than his lean, metabolically healthy physique would suggest, driven almost entirely by an inherited factor he did not know about. His Lp(a) at 118.72 is nearly four times the upper limit, and because every Lp(a) particle carries one ApoB molecule, it is inflating his ApoB reading beyond what his diet and lifestyle would produce alone. When we subtract the Lp(a) contribution, his corrected LDL drops from 3.21 to 2.83, which tells us roughly a fifth of his measured LDL cholesterol is actually Lp(a) cholesterol that cannot be modified by diet or exercise. The remaining modifiable LDL and ApoB are still above optimal, and because the fixed Lp(a) risk cannot be changed, every modifiable gram per litre matters more for him than for someone with a normal Lp(a). This is why his Cardiovascular Risk Score sits at 50 despite excellent triglycerides, a healthy glucose and a low CRP.\n\nThe second thread is immune activation. An IgE of 557 with an IgG of 19.1 and an ESR of 36 paints a picture of a chronically stimulated immune system. The low CRP rules out acute systemic inflammation, and the negative rheumatoid factor and negative coeliac screen rule out two common autoimmune explanations. The most likely driver is allergy: an environmental or dietary allergen (or both) that is keeping IgE production high and sustaining the IgG response. For a vegetarian who relies heavily on dairy and eggs, dietary allergens are a real possibility, and targeted IgE allergen testing will clarify this. The immune activation may also be contributing to his fatigue, because a chronically stimulated immune system diverts energy and resources.\n\nThe third thread connects his erectile symptoms to the cardiovascular risk rather than to his hormones. His testosterone, free testosterone, SHBG, LH, FSH and oestradiol are all within healthy ranges. The pituitary-gonadal axis is intact. Yet his erections have weakened and morning erections have disappeared over 12 to 18 months. The penile arteries are among the smallest in the body and among the first to show the effects of endothelial dysfunction, the earliest stage of atherosclerosis. With an Lp(a) of 118.72 and an ApoB of 1.08, early endothelial dysfunction is a plausible explanation, and erectile difficulty in this context is a recognised early warning sign of cardiovascular disease. This does not mean he has blocked arteries; it means the lining of his blood vessels may not be relaxing and dilating as efficiently as it should, and addressing his lipid profile is the most important intervention.\n\nThe one loose end is whether his diet volume is adequate. At 77 kg with four resistance sessions a week and a goal of building muscle, he needs at least 100 to 120 grams of protein a day and enough total calories to support recovery. A volume score of 4 out of 10 with only 2 to 3 portions of vegetables and fruit suggests he may be under-eating, and this could contribute to the afternoon crash, the evening energy drop and the slower recovery that makes training feel harder. His B12 at 415 is adequate but below optimal for a vegetarian, and pushing it above 500 with targeted supplementation would support energy and nerve function.","lifestyle":"Add a palm-sized portion of protein to every meal: eggs, Greek yoghurt, paneer, lentils, beans, tofu or protein powder. Anchor: before anything else goes on the plate. Why: at 77 kg training four days a week, you need at least 120 grams of protein a day to build muscle, and a volume of 4 out of 10 suggests you are likely falling short.\nEat three proper meals a day rather than grazing or skipping. Anchor: set fixed meal times (within an hour of waking, midday, and early evening) and treat them as non-negotiable. Why: your afternoon crash and evening energy drop are consistent with not enough fuel spread across the day, and eating enough is the single biggest lever for your energy and your muscle-building goal.\nAdd two tablespoons of ground flaxseed or a bowl of oats to breakfast every day. Anchor: stir into yoghurt, porridge or a shake. Why: soluble fibre binds bile acids and lowers LDL cholesterol, which is the modifiable part of your cardiovascular risk profile and one of the few levers available to offset your Lp(a).\nReplace sugary snacks with whole-food alternatives (fruit with nut butter, dark chocolate above 70 percent, a handful of nuts). Anchor: when the sugary-food-some-days habit kicks in, swap rather than resist. Why: reducing refined sugar improves triglycerides and insulin sensitivity, both of which protect your cardiovascular system.\nIncrease vegetable and fruit portions from 2 to 3 a day to at least 5. Anchor: add one portion to lunch and one to dinner this week, then build. Why: more plant fibre supports cholesterol clearance, feeds gut bacteria, and provides the micronutrients a vegetarian diet sometimes misses.\nAdd 15 minutes of walking immediately after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk improves blood vessel function, lowers post-meal glucose and supports cardiovascular health, which matters more for you because of your Lp(a).\nFix your wake time to within 30 minutes every day, including weekends, and get outside within an hour of waking. Anchor: alarm goes, curtains open, step outside with a drink. Why: morning light resets your circadian clock, which governs cortisol rhythm and can shift your energy pattern away from the afternoon crash and the slow-to-start mornings you describe.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water, herbal tea or decaf. Why: caffeine after 1pm reduces deep sleep even if you fall asleep easily, and deep sleep is when testosterone is produced and when the immune system recovers, both of which matter for your energy and your erectile health.","flags":"Lp(a) 118.72 nmol/L, nearly four times the upper limit of 32. This is a genetically determined, lifelong cardiovascular risk factor that cannot be modified by diet or exercise. It should be recorded permanently in his medical notes. First-degree relatives should be tested. South Asian ethnicity carries a higher prevalence of elevated Lp(a). His GP should be aware of emerging Lp(a)-lowering therapies in clinical trials.\nApoB 1.08 g/L, above the desirable threshold of 0.9 and the optimal target of 0.8. LDL 3.21 mmol/L, above the upper limit of 3.0. ApoB:ApoA1 ratio 0.77, in the average-risk band. Lp(a)-corrected LDL 2.83, showing that approximately a fifth of the measured LDL is Lp(a)-carried cholesterol. Cardiovascular Risk Score 50 out of 100. The modifiable lipid fraction needs to be reduced as far as possible to compensate for the fixed Lp(a) risk. Erectile dysfunction in this context should be considered a potential early vascular signal.\nIgE 557 IU/mL, more than five times the upper limit of 100. Indicates a significant allergic burden. GP should arrange specific IgE allergen testing (RAST panel including common environmental and dietary allergens, particularly dairy and egg given his vegetarian diet).\nIgG 19.1 g/L, above the upper limit of 16. In combination with the IgE elevation and in the absence of autoimmune markers, this suggests chronic immune stimulation most likely driven by the allergic mechanism above.\nESR 36 mm/hour, three times the upper limit of 12, with hsCRP 0.9 (below the ideal threshold of 1.0). The discrepancy between a high ESR and a low CRP is most likely explained by the elevated immunoglobulins increasing the sedimentation rate. Not indicative of acute systemic inflammation, but the GP should be aware.\nErectile dysfunction with absent morning erections for 12 to 18 months, with normal testosterone (21.7), free testosterone (0.399), SHBG (42.6), LH (5.63) and FSH (4.93). The hormonal axis is intact. In the context of elevated Lp(a) and ApoB, early endothelial dysfunction should be considered and cardiovascular risk should be actively managed.\nInsulin 2.45 mIU/L (below range of 2.6 to 24.9), C-peptide 0.661 ug/L (below range of 1.1 to 4.4), HOMA-IR 0.48 (below range of 0.5 to 1.5). In the context of a fasting glucose of 4.4 and HbA1c of 36, these reflect high insulin sensitivity and low insulin demand. This is a positive metabolic finding, not pancreatic insufficiency.\nReticulocyte absolute count 42.84, marginally below the lower limit of 50, with normal haemoglobin and iron stores. Not clinically significant.\nMPV 11.1 fL, above the upper limit of 10.1. A normal variant in the context of an otherwise normal full blood count.\nFolate 20 ng/mL, above the upper limit of 17. A positive finding reflecting supplementation and diet.\nALP 43 IU/L, marginally below the lower limit of 46. Not clinically significant in isolation with normal liver and bone markers.\nTotal Antioxidant Activity 1.92 mmol/L, above the upper range of 1.77. A positive finding likely reflecting supplementation.\nBilirubin 21 umol/L, at the upper limit. Pattern consistent with Gilbert's syndrome given all liver enzymes are clean.\nB12 415 pg/mL, within range but below optimal of 500 for a vegetarian. Supplementation recommended.\nVitamin D 63 nmol/L, sufficient but below the optimal band of 75 to 120. Supplementation recommended.\nReassuring negatives: thyroid function optimal with negative antibodies, coeliac screen negative, rheumatoid factor negative, PSA and free PSA ratio strongly reassuring, tumour markers CA19-9 and CEA normal, fasting glucose and HbA1c excellent, liver function and fibrosis scores all normal, kidney function normal, iron stores healthy, urinalysis clean.","recommendations":"Discuss the Lp(a) result of 118.72 nmol/L with your GP. Ask for it to be recorded permanently in your medical notes. Request that your first-degree relatives (parents, siblings, any children) are tested for Lp(a). Ask about emerging Lp(a)-lowering therapies and whether a referral to a lipid clinic is appropriate given your South Asian ethnicity and symptom profile.\nDiscuss the erectile dysfunction in the context of your cardiovascular risk profile. With normal testosterone and a hormonal axis that is intact, the most likely mechanism is early endothelial dysfunction driven by your Lp(a) and ApoB. Ask your GP whether further cardiovascular assessment (blood pressure review, carotid intima-media thickness, or a cardiology referral) is warranted.\nAsk your GP to arrange specific IgE allergen testing (RAST panel) covering common environmental allergens (house dust mite, grass pollen, tree pollen, pet dander, mould) and common dietary allergens (dairy, egg, wheat, soy, nuts). Your IgE at 557 indicates a significant allergic burden that may also be contributing to your fatigue.\nDiscuss your ApoB of 1.08 and LDL of 3.21 with your GP. Given the Lp(a), the modifiable lipid fraction needs to be as low as possible. Dietary changes (soluble fibre, plant sterols, oily fish or algal omega-3) should be tried first, but if ApoB remains above 0.8 after three to six months, statin therapy should be discussed given the overall risk profile.\nDiscuss the ESR of 36 in the context of the IgE and IgG elevations. While CRP is reassuringly low at 0.9, the GP should be aware of the pattern and can consider further investigation if allergen testing does not explain it.\nAim for approximately 2,300 to 2,500 calories per day (maintenance to slight surplus for muscle building) with a minimum of 120 grams of protein per day (1.6 g/kg). Retest in four to six months, repeating the full lipid panel (including ApoB and Lp(a)), IgE, IgG, ESR, CRP, B12, vitamin D and a full blood count to track the immune markers and the response to dietary and supplement changes.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Why: your B12 at 415 is within range but below the optimal threshold of 500, and as a vegetarian of three years with no meat or fish intake, sublingual methylcobalamin is the most reliable way to keep levels in the optimal zone. This form bypasses gut absorption, which can be variable.\nVitamin D3: cholecalciferol, 3,000 IU daily, taken with your largest meal (it needs dietary fat to absorb). Why: your vitamin D at 63 is sufficient but below the optimal range of 75 to 120 nmol/L. Vitamin D supports immune regulation (relevant given your elevated IgE), bone health, testosterone production and cardiovascular function.\nVitamin K2: MK-7 form, 100 mcg daily, taken alongside your vitamin D. Why: K2 directs calcium into bones and teeth rather than into artery walls. Given your Lp(a) and cardiovascular risk profile, ensuring calcium is deposited in the right places is especially important.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: you are already taking omega-3, which is good. Ensure the dose provides at least 2 grams of combined EPA and DHA (not just 2 grams of fish oil, check the label). EPA supports endothelial function and has a modest LDL-lowering effect, both of which matter with your Lp(a) and ApoB.\nMagnesium glycinate: 300 mg elemental magnesium, taken before bed. Why: your magnesium at 0.92 is within range, but glycinate form specifically supports sleep quality, muscle recovery after resistance training, and may help with the slow-to-start mornings. It also supports cardiovascular function.\nDo not take iron supplements. Your ferritin at 175 and transferrin saturation at 39 percent show your iron stores are healthy. Supplemental iron when stores are already adequate can cause oxidative stress and is associated with cardiovascular harm.\nThe most important changes from this report are not supplements. They are eating enough food to fuel your training and recovery, increasing soluble fibre to lower your modifiable LDL and ApoB, and getting your Lp(a) recorded with your GP so your cardiovascular risk is properly managed for the decades ahead.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 60.5; held to 49 by two or more systems rated \"See your GP\". Weakest systems: inflammation 26%, immunology 26%, lipids & cardiovascular 28%. Biggest drags: Apolipoprotein B, Lipoprotein (a), C-Peptide, LDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"38.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3663","lower_normal":"","upper_normal":"52","lower_optimal":"","upper_optimal":"47","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4519","units":"years","description":"PhenoAge is a biological age estimate based on nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count). Harinder's PhenoAge of 38.1 against a calendar age of 47 means his blood markers suggest a biological age nearly nine years younger than his actual age. This is an excellent result, driven by his low CRP, healthy glucose, strong albumin, good lymphocyte count and normal MCV. It confirms that his underlying metabolic health is very good despite the specific concerns identified in this report.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk currently being built, not the ten-year probability of an event. Harinder's score of 50 exceeds both the acceptable threshold of 40 and the ideal target of 20. The primary driver is his Lp(a) at 118.72, which alone accounts for most of the elevated score. His excellent triglycerides, good CRP and healthy HbA1c are working in his favour, but the Lp(a) and the above-target ApoB push the score above the threshold. Because Lp(a) is fixed, the strategy is to push the modifiable inputs (ApoB, LDL, HDL) as far into the optimal range as possible.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme concentrated inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so the level acts as a sensitive marker of liver stress. Harinder's ALT at 20 is well within both the laboratory range and the tighter optimal range of below 30, confirming his liver is under no metabolic strain. This is reassuring for someone whose goal is long-term health and longevity.","low_causes":"","high_causes":"Alcohol, fatty liver, medications, viral hepatitis, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart and muscles. A rise can come from any of those tissues, but when read alongside a normal ALT and CK it points to liver health specifically. Harinder's AST at 21 is healthy, sitting comfortably within the optimal range.","low_causes":"Very low protein intake, vitamin B6 deficiency","high_causes":"Liver damage, muscle damage, heart damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1301","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"Gamma GT (GGT) is an enzyme that rises with alcohol use, bile duct issues, fatty liver and metabolic strain. It is one of the most sensitive early indicators of liver stress. Harinder's GGT at 19 is well below the optimal ceiling of 25, meaning his liver is handling his current diet and lifestyle without any detectable strain. A clean GGT alongside a clean ALT is a strong positive.","low_causes":"","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2905","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6048","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in liver, bone and the gut lining. In adults, mild elevations usually point to liver or bone issues, while low levels can be seen with zinc or magnesium deficiency. Harinder's ALP at 43 is marginally below the lower limit of 46. With all other liver and bone markers healthy, this small shortfall is not clinically significant and may reflect normal variation.","low_causes":"Zinc deficiency, magnesium deficiency, malnutrition, hypothyroidism","high_causes":"Liver disease, bile duct obstruction, bone disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. A raised bilirubin with raised liver enzymes suggests liver disease, but a raised bilirubin with completely clean liver enzymes, as in Harinder's case, is the signature of Gilbert's syndrome, a harmless inherited variation affecting 5 to 10 percent of people. His bilirubin at 21 sits exactly at the upper boundary. This does not progress, does not cause disease and does not need treatment.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein is the sum of albumin and globulins in the blood, reflecting liver synthetic function, immune activity and nutritional status. Harinder's total protein at 79 is within both the laboratory range and the optimal range. Although his globulin fraction is slightly on the higher side (reflecting the elevated immunoglobulins), the overall protein level is healthy.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and drugs, and maintains fluid balance. It is also a marker of nutritional status and liver synthetic function. Harinder's albumin at 44 is healthy and within the optimal range, indicating good liver function and adequate nutrition. Albumin is one of the inputs to PhenoAge, and a healthy level helps explain his excellent biological age result.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/l","description":"Globulin is the collective term for all non-albumin proteins in the blood, including immunoglobulins (antibodies). Harinder's globulin at 35 is within the laboratory range but at the upper end, sitting above the optimal ceiling of 32. This is consistent with his elevated IgG and IgE, which are immunoglobulins and therefore contribute to the globulin total. Once the immune activation is investigated and addressed, this number should settle.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, chronic inflammation, allergic conditions, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5379","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels suggest pancreatic inflammation. Harinder's amylase at 84 is within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that digests fats. It is a more specific marker of pancreatic health than amylase. Harinder's lipase at 41 is healthy and within range.","low_causes":"","high_causes":"Acute pancreatitis, pancreatic disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4731","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4344","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL and VLDL. Harinder's total cholesterol at 4.9 is below the desirable threshold of 5.18 but above the optimal ceiling of 4.5. The individual fractions (LDL, HDL, triglycerides) tell a more detailed story than the total.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5350","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6507","units":"mmol/l","description":"LDL cholesterol is the main cholesterol carrier that deposits cholesterol into artery walls, driving atherosclerosis over time. Harinder's LDL at 3.21 is above the laboratory upper limit of 3.0 and above the optimal target of 2.6. However, a meaningful proportion of this is carried by his Lp(a) particles, which cannot be reduced by diet. His Lp(a)-corrected LDL of 2.83 shows the modifiable fraction, which is closer to target but still above the ideal of 2.0. With an Lp(a) of 118.72, the goal should be to push the modifiable LDL as low as possible.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Saturated fat intake, genetics, hypothyroidism, sedentary lifestyle, Lp(a) elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4196","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"0.9615","units":"mmol/l","description":"HDL cholesterol is the protective fraction that carries cholesterol away from artery walls back to the liver for disposal. Higher is generally better. Harinder's HDL at 1.3 is above the minimum threshold of 1.04 but below the optimal level of 1.4 for a male. Increasing aerobic exercise (even brisk walking), eating more healthy fats (nuts, avocado, olive oil) and maintaining omega-3 supplementation can help raise HDL.","low_causes":"Sedentary lifestyle, smoking, poor diet, obesity, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2735","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main fat in the blood, derived from dietary fat and excess carbohydrates. They are a marker of metabolic health. Harinder's triglycerides at 0.93 are excellent, within the optimal range of below 1.0. This reflects good insulin sensitivity and a diet that is not overloaded with refined carbohydrates.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"Excess carbohydrates, alcohol, obesity, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2692","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to tissues. Harinder's VLDL at 0.42 is healthy, consistent with his excellent triglyceride level.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome, excess carbohydrates","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4189","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio gives a quick snapshot of cardiovascular risk by comparing total cholesterol against protective HDL. Harinder's ratio at 3.77 is within the laboratory target of below 4.5 but above the optimal ceiling of 3.5, driven by his LDL being above target and his HDL being slightly below optimal.","low_causes":"","high_causes":"High LDL, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"26.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4421","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5313","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the circulating cholesterol is the protective type. Harinder's 26.53 percent is above the desirable threshold of 20 percent, meaning roughly a quarter of his total cholesterol is protective HDL.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol, regular exercise","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the atherogenic (artery-damaging) cholesterol fractions in one number. Harinder's non-HDL at 3.6 is within the laboratory limit of 4.0 but above the optimal target of 3.2. This is being driven by the combination of LDL and Lp(a) cholesterol.","low_causes":"","high_causes":"High LDL, elevated Lp(a), high triglycerides, poor diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4539","lower_normal":"1.2","upper_normal":"2.0","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. Higher levels mean more protective HDL particles. Harinder's ApoA1 at 1.41 is above the desirable minimum of 1.20 and just within the optimal range.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Regular exercise, genetics, moderate alcohol","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single most important lipid marker for cardiovascular risk. Every LDL, VLDL and Lp(a) particle carries exactly one ApoB molecule, so the ApoB count tells us the total number of atherogenic particles available to penetrate artery walls. Harinder's ApoB at 1.08 is above the desirable threshold of 0.9 and above the optimal target of 0.8. Importantly, a portion of his ApoB count is carried by Lp(a) particles, which cannot be reduced by lifestyle. The modifiable ApoB from true LDL and VLDL is the fraction that dietary changes and, if needed, medication can address.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, elevated Lp(a), saturated fat intake, genetics, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective lipid particles. A ratio below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Harinder's ratio at 0.77 sits in the average risk band, driven by his elevated ApoB. Reducing LDL through diet and raising HDL through exercise would both improve this ratio.","low_causes":"","high_causes":"High ApoB, low ApoA1, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"118.72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle that deposits cholesterol into artery walls, promotes blood clotting and drives inflammation. Unlike LDL, it cannot be lowered by diet, exercise or standard cholesterol medications. Harinder's Lp(a) at 118.72 is nearly four times the upper limit of 32, placing him in the moderate-risk category (90 to 200 nmol/L). Elevated Lp(a) is more prevalent in people of South Asian ancestry. This result should be recorded permanently in his medical notes and his first-degree relatives should be tested. Emerging therapies targeting Lp(a) specifically are in late-stage clinical trials.","low_causes":"","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3933","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the sugar in the blood after an overnight fast. It is the simplest snapshot of blood sugar control. Harinder's glucose at 4.4 is within the optimal range of 4.0 to 5.4, confirming healthy blood sugar regulation.","low_causes":"Fasting too long, excess insulin production, intense exercise","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c reflects average blood sugar control over the past two to three months by measuring how much glucose has attached to haemoglobin. Harinder's HbA1c at 5.5 percent is within the normal range (below 6.0) and within the optimal range, confirming consistently healthy blood sugar levels.","low_causes":"Very low carbohydrate intake, haemolytic anaemia","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the SI unit equivalent of the percentage reading above. Harinder's 36 is at the optimal threshold, confirming excellent long-term blood sugar control. This is particularly reassuring given his South Asian ethnicity, which carries a higher baseline risk for type 2 diabetes.","low_causes":"Very low carbohydrate intake, haemolytic anaemia","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.45","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.2935","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5403","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas produces to maintain a normal blood glucose. Lower values in the context of a normal fasting glucose mean the cells are highly responsive to insulin and the pancreas does not need to work hard. Harinder's insulin at 2.45 is marginally below the laboratory lower limit of 2.6 but within the optimal range of 2 to 8. With a fasting glucose of 4.4 and an HbA1c of 36, this is the metabolic signature of a lean, insulin-sensitive individual and is a positive finding.","low_causes":"High insulin sensitivity, lean body composition, low carbohydrate intake","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.661","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1679","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a more stable measure of insulin production. Harinder's C-peptide at 0.661 ug/L (approximately 219 pmol/L) is below the laboratory range of 1.1 to 4.4. As with his insulin
