<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Richard Mark McCarthy","dob":"21/09/1971","report_date":"2026-10-05","summary":"Richard is a 55-year-old male presenting with a BMI of 33.0, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are slightly below average (volume 4 out of 10). He does not currently train and takes 2,000 to 5,000 daily steps. He sleeps under 6 hours, wakes exhausted or waking in the night, and his energy pattern is tired on waking. Stress feels hard to manage most days. He does not drink alcohol, having been abstinent for two years after a previous period of heavy drinking. He takes testosterone replacement therapy, simvastatin 20 mg, bempedoic acid 180 mg, ezetimibe 10 mg, bisoprolol 2.5 mg, flecainide 50 mg twice daily, sertraline 50 mg, zopiclone 7.5 mg at night, diazepam 5 mg as required, tadalafil 5 mg daily, and a daily antihistamine; he has previously used a GLP-1/GIP medication for weight management. His medical history includes atrial fibrillation and cardiac ectopy, a previous TIA approximately four years ago, high cholesterol, secondary erythrocytosis on testosterone therapy under haematology review with venesection in July 2026, diverticular disease and diverticulitis, previous bowel polyps removed with an all-clear approximately three years ago, haemorrhoids, Klippel-Feil syndrome, and autism with mild ADHD. Both parents have had bowel cancer. He reports poor sleep and insomnia, palpitations or dizziness, headaches, and low mood and anxiety, all lasting years. His goals are to improve long-term health and longevity, improve energy levels, and balance hormones. He notes that his main reasons for testing are monitoring testosterone therapy and its effect on haemoglobin and haematocrit, and PSA monitoring ahead of a urology appointment on 7 October 2026. He has recently been working very long days of 12 to 16 hours, stopped training 7 to 8 months ago having previously done strength training three times a week, and has lost approximately 14 kg. His DEXA scan shows body fat of approximately 15.2% and visceral fat of approximately 195 cm squared. He targets approximately 180 g of protein a day from mostly fresh food and drinks 2 to 3 coffees a day.\n\nThe finding that matters most in this report, and the one that should go straight to Richard's testosterone prescriber and haematology team, is his haemoglobin and haematocrit. Haemoglobin is the protein inside red blood cells that carries oxygen, and haematocrit is the proportion of blood that is made up of red cells rather than plasma. His haemoglobin is 186 g/L, above the upper limit of 170, and his haematocrit is 0.544, which is 54.4%, above the upper limit of 50%. Both are above range. However, and this is important context, they are lower than his recent readings. His haemoglobin was 196 on 4 to 7 July, 190 on 19 August, and is now 186. His haematocrit was 58.9% in early July, 56.9% on 19 August, and is now 54.4%. The direction of travel is the right one, and the venesection in July appears to have helped. That said, 54.4% is still above the 54% threshold at which most prescribers will review the testosterone dose or consider further venesection, so this result should be shared with his haematology team and testosterone prescriber promptly. His red cell distribution width, or RDW, which measures how much variation there is in the size of his red blood cells, is 15.4% against an upper limit of 15%, marginally above range. This is consistent with the venesection and subsequent red cell regeneration and is not a separate concern. His mean corpuscular haemoglobin, or MCH, which is the average amount of haemoglobin per red cell, is 33.3 pg against an upper limit of 32, again a reflection of the elevated haemoglobin concentration rather than a new finding. His red blood cell count at 5.59 is marginally above the upper limit of 5.5. All of these haematology findings share one explanation: the testosterone therapy is stimulating the bone marrow to produce more red cells and to pack them with more haemoglobin than usual. The rest of his full blood count is healthy. His white cell count at 5.4 is well within range, with a good balance across neutrophils, lymphocytes, monocytes, eosinophils and basophils. His platelets at 228 are healthy. His reticulocytes, which are young red blood cells freshly released from the bone marrow, are at 1.11%, showing normal red cell production. His ESR, the erythrocyte sedimentation rate, which is a broad marker of inflammation, is just 1, as low as it gets.\n\nTurning to the hormones, and these must all be read as on-treatment values rather than natural production. Richard's testosterone is 37.5 nmol/L, which is above the upper end of the laboratory range of 28.7 and notably higher than his recent readings of 17.5 on 31 July and 16.3 on 19 August. His calculated free testosterone, the fraction not bound to proteins and therefore active in the body, is 1.02 nmol/L, sitting right at the top of the reference range. These levels depend heavily on when the blood was drawn relative to his last testosterone dose, so the timing should be discussed with his prescriber. His sex hormone binding globulin, or SHBG, which is the protein that binds testosterone and makes it inactive, is 23.8, towards the lower end of the range, which is why so much of his testosterone is in the free, active form. His oestradiol is 244 pmol/L, above the male upper limit of 146. Oestradiol is made from testosterone by an enzyme called aromatase, and when testosterone levels are high, more of it is converted. His previous readings were 66.9 and 73.6 in July and August, so this is a meaningful rise that tracks with the higher testosterone level in this sample. Elevated oestradiol can contribute to fluid retention, mood changes, and, importantly in Richard's case, it can amplify the haematocrit rise driven by testosterone. This is worth raising with his prescriber, who may consider whether the testosterone dose needs adjusting or whether an aromatase discussion is appropriate. His LH and FSH are both suppressed, at less than 0.07 and 0.56 respectively, both below range. This is entirely expected on exogenous testosterone: the brain detects high testosterone and stops sending the signals, luteinising hormone and follicle-stimulating hormone, that would normally tell the testes to produce it. This is not a problem; it is how the system is supposed to behave on replacement therapy. His prolactin at 181 is within range. His DHEA-S, a precursor hormone made by the adrenal glands, is 2.1 umol/L, within range but towards the lower end, which is age-appropriate. His cortisol at 350 nmol/L is within the morning reference range, and given his high stress levels and long working hours, a mid-range cortisol is neither surprising nor concerning. His progesterone at 0.76 is marginally below the male reference range of 0.89 to 3.88. In men, progesterone plays a minor role and at this margin the finding is not clinically significant.\n\nHis prostate markers are reassuring and will be useful for his urology appointment on 7 October. His total PSA, or prostate-specific antigen, which is a protein produced by the prostate gland and used as a screening tool, is 2.04 ng/mL, within the age-appropriate range of under 3.5, and lower than his recent readings of 2.40 on 19 August and 2.65 to 3.09 in July. The direction is favourable. The laboratory reports a free-to-total PSA ratio of 0.162, which is below the laboratory's noted threshold of 0.19. The free-to-total ratio helps distinguish between causes of PSA elevation: a higher ratio generally favours benign prostatic conditions, while a lower ratio prompts closer investigation. At a total PSA of 2.04 within the normal range and with a downward trend, this ratio is best interpreted by his urologist in the context of his full clinical picture, examination, and imaging at his upcoming appointment.\n\nRichard's lipid profile, on triple lipid-lowering therapy of simvastatin, bempedoic acid and ezetimibe, shows good control. His total cholesterol is 4.2, his LDL is 2.36, his HDL, the protective cholesterol, is 1.3, and his triglycerides are 1.3. His apolipoprotein B, or ApoB, which is the protein that carries LDL particles and is considered the best single measure of atherogenic risk, is 1.01 g/L, which is above the ideal target of below 0.9 and above the desirable threshold. His ApoB-to-ApoA1 ratio at 0.67 is below the 0.7 lower-risk threshold, which is positive. Given his history of a previous TIA and atrial fibrillation, his cardiovascular risk profile warrants the tightest possible lipid control. An ApoB of 1.01 on triple therapy suggests there may be room for his prescriber to review the regimen, particularly as guidelines for people with established cerebrovascular disease often target an ApoB below 0.7 or even lower. His Lp(a), or lipoprotein little-a, which is an inherited lipoprotein that independently drives cardiovascular risk and cannot be changed by medication or lifestyle, is reported as to follow, and his urologist or GP will receive this result separately. His HDL at 1.3 is within range but below the optimal threshold of 1.4 for men. Two years of alcohol abstinence, which is an achievement worth acknowledging, removes one of the common suppressors of HDL, but the lack of exercise and the current weight are likely holding it back. His triglycerides at 1.3 are above the optimal threshold of 1.0 but within the acceptable fasting range. His remnant cholesterol, the cholesterol carried in VLDL and other triglyceride-rich particles, and his atherogenic index are both within range.\n\nHis iron studies show a pattern that needs attention. His serum iron is 48.6 umol/L, well above the upper limit of 31.3, and his transferrin saturation is 63.24%, above the upper limit of 55%. Transferrin is the protein that transports iron in the blood, and transferrin saturation measures what proportion of its carrying capacity is being used. A saturation above 55% raises the possibility of iron overload. His ferritin, the storage form of iron, is 58 ng/mL, which is within range and lower than one might expect with such high circulating iron, and this is almost certainly explained by the venesection in July, which depletes iron stores. His transferrin itself at 3.06 and his total iron binding capacity at 72 are both within range. The combination of very high serum iron and high transferrin saturation with a post-venesection ferritin warrants investigation. There are two main possibilities. The first is haemochromatosis, a common inherited condition in people of European ancestry where the body absorbs too much iron from food. With both parents having had bowel cancer and the elevated saturation, an HFE gene test would settle this. The second is that the elevated testosterone therapy is driving increased red cell production, which increases iron turnover and can elevate serum iron transiently, particularly if the sample was taken in the morning when iron levels are naturally higher. His haematology team should be made aware of these iron results.\n\nHis liver is in good shape. His ALT at 29 is within range, his AST at 22 is healthy, his GGT at 31 is within range for men, and his bilirubin at 15 is normal. His FIB-4 score, which estimates liver scarring from age, platelets, AST and ALT, is 1.06, well within the safe threshold. His APRI and NAFLD fibrosis scores both indicate no evidence of liver fibrosis. His albumin at 46 is strong, reflecting good liver synthetic function and adequate protein intake. His alkaline phosphatase, or ALP, at 40 is marginally below the laboratory's lower limit of 46. ALP is an enzyme found in the liver, bile ducts and bone. A low ALP is uncommon and can be associated with low zinc, low magnesium, or hypothyroidism, but his thyroid is healthy and his magnesium is actually elevated, so this is most likely a normal variant for him. It is not a concern but is worth noting for his GP's records.\n\nHis kidney function is adequate. His creatinine-based eGFR is reported as above 90, and his cystatin C-based eGFR, which is a more reliable estimate particularly in people who are not exercising regularly, is 89. Cystatin C is a small protein filtered by the kidneys whose level is less affected by muscle mass than creatinine. An eGFR of 89 to 90 at 55 is acceptable but sits just below the optimal threshold of 90. His urea at 7.7 is within range, and his urea-to-creatinine ratio at 106.9 is marginally above the upper limit of 100, which can reflect a high-protein diet, mild dehydration, or simply normal variation. His uric acid at 272 is within range and well placed. His calculated serum osmolality at 296.5 is marginally above the upper limit of 295, consistent with mild concentration of the blood, which can be related to the polycythaemia itself or to mild dehydration.\n\nHis chloride at 93 is below the lower limit of 95. Chloride is an electrolyte that helps maintain fluid balance and acid-base status. A mildly low chloride can be seen with metabolic alkalosis, with certain medications, or simply with variation in hydration. His bicarbonate at 25.9 is normal, and his sodium at 142 is healthy, so there is no acid-base disturbance. This is worth mentioning to his GP but is unlikely to be clinically significant in isolation.\n\nHis magnesium is 1.39 mmol/L, above the upper limit of 1.11. This is a notable elevation. Magnesium is an electrolyte critical for muscle and nerve function, heart rhythm, and over 300 enzymatic reactions. Elevated magnesium can be caused by supplementation, reduced kidney clearance, or certain medications. Richard reports no magnesium supplementation. His kidney function, while adequate, is at the lower end of optimal, which could contribute to slightly reduced magnesium clearance. Given his cardiac history, including atrial fibrillation and the use of flecainide and bisoprolol, elevated magnesium should be flagged to his GP and cardiologist. While magnesium is generally protective for the heart, significantly elevated levels can theoretically affect cardiac conduction, and this level should be confirmed on a repeat sample.\n\nHis glucose and insulin metabolism is excellent. His fasting glucose at 4.8, his HbA1c at 31 mmol/mol (5.0%), and his fasting insulin at 3.88 mIU/L are all within the ideal range. His HOMA-IR, which estimates insulin resistance by combining fasting glucose and insulin, is 0.83, firmly in the insulin-sensitive range. At a BMI of 33, this degree of insulin sensitivity is genuinely impressive and likely reflects his high-protein, low-processed-food diet and the metabolic benefit of having lost 14 kg. His C-peptide, which is a protein released alongside insulin and used to measure how much insulin the pancreas is producing, is 0.809 ug/L, below the laboratory range of 1.1 to 4.4. However, C-peptide tracks insulin, and his insulin is at the low end of range because his glucose is low and his body simply does not need much insulin. This is a sign of excellent metabolic health, not pancreatic insufficiency. His estimated average glucose and TyG index are both within ideal ranges.\n\nHis thyroid is working well. TSH, the hormone the pituitary gland sends to the thyroid to tell it how hard to work, is 1.82, within the ideal range of 1.0 to 2.5. Free T4 at 17 and free T3 at 5.0 are both within ideal ranges, and the FT3-to-FT4 ratio at 0.294 confirms good conversion. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. This is a clean result.\n\nHis vitamin D at 116 nmol/L is within the optimal range of 75 to 120 and in an excellent position. His vitamin B12 at 316 pg/mL is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell formation, DNA synthesis and energy metabolism. At 316, he is unlikely to be deficient, but given his fatigue and low mood, optimising B12 towards 500 or above is worthwhile. His folate at 13 is healthy. His calcium at 2.47 and corrected calcium at 2.37 are both within range. His parathyroid hormone, or PTH, which regulates calcium and phosphate balance, is 1.5, within range, and appropriate for his calcium level.\n\nHis inflammation markers are mixed. His hsCRP, the high-sensitivity C-reactive protein which measures low-grade systemic inflammation, is 2.1 mg/L. While this is within the laboratory range of under 5, a level above 1.0 is associated with increased cardiovascular risk, and at 2.1, with his history of TIA and atrial fibrillation, this is worth noting. CRP can be driven by visceral fat, poor sleep, chronic stress, and lack of exercise, all of which apply to Richard's current situation. His ESR at 1 is excellent, and his neutrophil-to-lymphocyte ratio, platelet-to-lymphocyte ratio, and systemic immune-inflammation index are all within ideal ranges, so there is no pattern of chronic systemic inflammation beyond what the CRP suggests.\n\nHis immune markers are all within range. IgG, IgA, IgM and IgE are healthy. Rheumatoid factor is negative. His coeliac screen, the tissue transglutaminase IgA test, is negative. His total antioxidant activity at 2.1 is above the upper limit of 1.77. This marker measures the blood's overall capacity to neutralise oxidative stress, and an elevated level is typically driven by dietary antioxidants, vitamin supplementation, or certain medications. It is not a concern.\n\nHis tumour markers are reassuring in the context of his family history. His CEA, or carcinoembryonic antigen, which is used in bowel cancer screening, is 2.33 ng/mL, marginally above the non-smoker reference of 2.3. At this margin, 0.03 above the cut-off, this is within the range of normal laboratory variation and is not in itself a concern. However, given that both parents have had bowel cancer, Richard should ensure he remains up to date with his bowel screening programme and discuss his CEA with his GP for baseline documentation. His CA19-9, another tumour marker used in pancreatic and gastrointestinal screening, is 6.97, well within range.\n\nHis creatine kinase at 79 is within range, consistent with his current lack of training. His amylase at 82 and lipase at 51 are both within range, indicating healthy pancreatic function. His urinalysis is completely clean: no protein, glucose, blood, white cells, bacteria or nitrites.\n\nRichard's PhenoAge, a biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 54.8 years against his calendar age of 55, a difference of minus 0.2 years. This means his blood markers suggest he is ageing at approximately the rate expected for his age, which, given his medical history and current stress and sleep burden, is a reassuring finding. The main markers holding his PhenoAge close to calendar age rather than pulling it younger are his CRP at 2.1 and his RDW at 15.4, both of which would improve with better sleep, resumed exercise, and stress management.\n\nBringing this together: Richard's metabolic health is excellent, his thyroid is optimal, his liver is clean, his kidney function is adequate, and his immune system is balanced. The areas that need attention are threefold. First, the haemoglobin, haematocrit and oestradiol are all being driven by his testosterone therapy levels, and these results should go to his prescriber and haematology team. Second, the iron studies showing very high serum iron and transferrin saturation need investigation, most likely an HFE gene test to exclude haemochromatosis. Third, his ApoB at 1.01 on triple lipid-lowering therapy, alongside a CRP of 2.1, means his residual cardiovascular risk is higher than ideal given his TIA history, and his prescriber may wish to review whether further optimisation is possible. Beyond these, the biggest levers available to Richard are sleep, movement and stress, the three areas where the quiz tells us his current situation is furthest from where it needs to be, and these are also the areas most likely to explain the symptoms of fatigue, low mood, headaches and palpitations that his otherwise reassuring blood results cannot account for.","links":"The central thread running through Richard's results is his testosterone replacement therapy and its downstream effects. When exogenous testosterone is given, the hypothalamic-pituitary-gonadal axis shuts down, which is why LH and FSH are suppressed. The testosterone itself stimulates erythropoietin production in the kidneys, which tells the bone marrow to make more red blood cells, producing the elevated haemoglobin, haematocrit, red blood cell count, MCH and RDW that dominate his full blood count. Simultaneously, the enzyme aromatase converts some of that testosterone into oestradiol, and with a testosterone level of 37.5, substantially higher than his recent readings of 16 to 17, the oestradiol has risen to 244, well above the male limit. This is not a coincidence: the two move together, and the timing of the sample relative to his testosterone dose almost certainly explains why both are higher than his July and August results. The elevated oestradiol may itself amplify the haematocrit rise. All three findings, the polycythaemia, the supratherapeutic testosterone and the elevated oestradiol, share one root cause: the current testosterone dose or timing.\n\nThe iron studies add a second thread that partially overlaps with the first. Very high serum iron at 48.6 and a transferrin saturation of 63% could be explained by the increased iron turnover that accompanies accelerated red cell production on testosterone, particularly in the morning when serum iron peaks. But the saturation is high enough, and Richard is of European ancestry, that hereditary haemochromatosis must be formally excluded. A single HFE gene test will settle it. His ferritin at 58 would normally argue against overload, but the July venesection depleted his stores, so ferritin alone cannot be used to rule it out.\n\nThe lipid profile tells a more encouraging story. Triple therapy has brought LDL to 2.36, total cholesterol to 4.2, and the ApoB-to-ApoA1 ratio below 0.7. But ApoB at 1.01 remains above the 0.9 desirable threshold and well above the below-0.7 target that is increasingly recommended for people with established cerebrovascular disease. The CRP at 2.1 adds residual inflammatory risk on top of the lipid risk. Both are modifiable: the lipid side through prescriber review, the CRP side through sleep, exercise, stress reduction and modest weight loss.\n\nWhat the bloods do not explain is equally important. Richard reports fatigue, poor sleep, headaches, palpitations, and low mood, all lasting years. His thyroid is optimal, his glucose and insulin metabolism is excellent, his B12, while not optimal, is not low enough to cause these symptoms, his iron stores are adequate, and his cortisol is mid-range. The most likely drivers are the combination of under 6 hours of broken sleep on zopiclone, chronic stress rated as hard to manage most days, 12 to 16 hour working days, zero exercise for 7 to 8 months, and the medications themselves. Bisoprolol, a beta-blocker, can cause fatigue and low mood. Sertraline can cause sleep disruption and fatigue in some people. Zopiclone impairs sleep architecture even while inducing sleep, meaning the hours he gets may not deliver the restorative deep sleep his body needs. The palpitations and dizziness have been previously investigated and are attributed to his atrial fibrillation and ectopy, managed with flecainide and bisoprolol. None of these explanations require blood abnormalities; they are structural and pharmacological, and the blood results' main value here is in ruling out the medical causes that would have needed different treatment.\n\nThe loose end is the Lp(a) result, which is pending. Once it arrives, it will complete the cardiovascular risk picture and determine whether Richard carries an inherited lipoprotein that independently drives plaque formation. If elevated, it changes nothing about treatment, since Lp(a) cannot yet be lowered by any approved medication, but it adds prognostic information and would strengthen the argument for the tightest possible ApoB control.","lifestyle":"Walk for 15 minutes after your largest meal, every day, starting today. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers CRP, improves insulin sensitivity (already good, worth protecting), and is the single easiest way to restart movement after 7 months off. Your blood is telling you that your body responds well to what you eat; now it needs to move.\nAdd a second 15-minute walk at a different time of day once the first is automatic, aiming for 5,000 steps minimum. Anchor: a break between work blocks. Why: your step count of 2,000 to 5,000 is below the threshold associated with cardiovascular protection, and with your TIA history and CRP of 2.1, every additional 1,000 steps matters.\nFix your wake time to the same time every day, including weekends, even if you slept badly. Anchor: set an alarm and get up regardless. Why: a fixed wake time is the strongest single input for resetting a disrupted circadian rhythm, and yours is clearly disrupted, with under 6 hours of broken sleep, exhaustion on waking and tiredness all day. This must come before any supplement.\nGet outside within 30 minutes of waking, even for 5 minutes, ideally without sunglasses. Why: morning light exposure suppresses melatonin and sets the cortisol awakening response, which drives the alertness you are currently missing. With stress most days and a pattern of being tired on waking, your cortisol rhythm may be flattened, and light is the most effective reset.\nCut caffeine after midday. Anchor: your second coffee is your last, and it is finished by noon. Why: caffeine has a half-life of 5 to 6 hours, meaning a 2pm coffee still has half its effect at 8pm. With under 6 hours of broken sleep and zopiclone use, anything that further fragments sleep architecture needs to go.\nWhen you are ready, restart resistance training once a week and build to twice. Anchor: a fixed day and time that cannot be displaced by work. Why: resistance training is the most effective intervention for maintaining muscle mass, bone density, insulin sensitivity and cardiovascular health at 55, and your DEXA shows you have good lean mass to build on. Start light, prioritise consistency over intensity, and build.\nCalorie target: approximately 2,000 to 2,200 kcal per day for gradual fat loss at your current activity level (BMR approximately 1,850 kcal, multiplied by 1.3 for sedentary). Protein target: 150 to 180 g per day (1.6 to 1.9 g per kg), which you are already achieving. If you resume training, calories can increase to 2,300 to 2,500 and protein should stay at 180 g.\nDiscuss your sleep with your GP, specifically whether a sleep study would be appropriate. At your BMI and with broken sleep, snoring and exhaustion on waking, obstructive sleep apnoea should be excluded. Zopiclone induces sleep but impairs its quality, and a sleep study would help determine whether the underlying problem is apnoea, circadian disruption, or medication-related.","flags":"Haemoglobin 186 g/L (limit 170), haematocrit 0.544 (limit 0.50), RBC 5.59 (limit 5.5), MCH 33.3 (limit 32), RDW 15.4% (limit 15%). All consistent with secondary erythrocytosis on testosterone therapy. Today's values are lower than his 4-7 July peak (Hb 196, Hct 58.9%) and 19 August (Hb 190, Hct 56.9%), showing improvement after venesection. However, haematocrit at 54.4% remains above the 54% threshold at which prescribers typically review the testosterone dose. Results should go to his testosterone prescriber and haematology team promptly.\nTestosterone 37.5 nmol/L (range 8.4-28.7), free testosterone 1.02 nmol/L (upper limit 1.04), bioavailable testosterone 25.49 nmol/L (upper limit 9), free androgen index 157.56 (upper limit 150). On-treatment values, substantially higher than his recent readings of 16.3-17.5 nmol/L. Timing relative to dose is critical. Should be reviewed with prescriber alongside the haematocrit and oestradiol.\nOestradiol 244 pmol/L (male upper limit 146.1). Elevated, likely from aromatisation of the high testosterone level. Previous readings were 66.9-73.6 pmol/L. This rise tracks with the higher testosterone and may be contributing to the haematocrit elevation. Prescriber should be informed.\nLH <0.07 mIU/mL (range 1.5-9.3) and FSH 0.56 mIU/mL (range 1.4-18.1). Suppressed as expected on exogenous testosterone therapy. Not a concern.\nSerum iron 48.6 umol/L (upper limit 31.3) and transferrin saturation 63.24% (upper limit 55%). Ferritin 58 ng/mL within range, likely low due to July venesection. The high saturation raises the possibility of hereditary haemochromatosis, which should be excluded with an HFE gene test, particularly given European ancestry. Alternative explanation is increased iron turnover from testosterone-driven erythropoiesis.\nApoB 1.01 g/L (desirable <0.9). On triple lipid-lowering therapy (simvastatin, bempedoic acid, ezetimibe). Given his previous TIA, tighter ApoB control (ideally below 0.7) is recommended. Prescriber review warranted.\nhsCRP 2.1 mg/L. Within lab range (<5) but above the cardiovascular risk threshold of 1.0. In the context of previous TIA and atrial fibrillation, this adds residual inflammatory risk. Most likely driven by sleep deprivation, chronic stress, deconditioning and visceral fat.\nC-Peptide 0.809 ug/L (267.7 pmol/L) below range (1.1-4.4 ug/L). Consistent with appropriately low insulin demand given excellent fasting glucose (4.8) and insulin (3.88). Not pancreatic insufficiency.\nChloride 93 mmol/L (lower limit 95). Mildly low, no acid-base disturbance (bicarbonate 25.9, sodium 142). May be a medication effect or hydration variation. Worth noting to GP.\nMagnesium 1.39 mmol/L (upper limit 1.11). Notably elevated without supplementation. Could reflect mildly reduced renal clearance (eGFR 89-90) or a medication effect. Given cardiac history and use of flecainide and bisoprolol, should be flagged to GP and cardiologist for review and repeat on a fresh sample.\nALP 40 IU/L (lower limit 46). Marginally below range. No clinical significance in isolation with a healthy thyroid and normal bone markers.\nPSA 2.04 ng/mL (within range <3.5), lower than 19 August (2.40) and July (2.65-3.09). Free:total PSA ratio 0.162 (lab notes >0.19 as typical). Best interpreted by his urologist at the 7 October appointment in the context of examination and imaging.\nCEA 2.33 ng/mL (non-smoker reference <2.3). Marginally above by 0.03, within normal laboratory variation. Given family history of bowel cancer in both parents, worth documenting as a baseline and ensuring bowel screening is up to date.\nProgesterone 0.76 nmol/L (range 0.89-3.88). Marginally below range in a male, not clinically significant.\nTotal antioxidant activity 2.1 mmol/L (upper limit 1.77). Elevated, typically from dietary antioxidants or medications. Not a concern.\nLp(a) result pending. Will complete the cardiovascular risk assessment when available.\nUrea:creatinine ratio 106.9 (upper limit 100). Marginally above, consistent with high-protein diet. Not a concern.\nSerum osmolality 296.5 mOsm/kg (upper limit 295). Marginally above, may reflect mild concentration of the blood related to polycythaemia or dehydration.\nReassuring negatives: thyroid function optimal with negative antibodies, HbA1c 31 with HOMA-IR 0.83, liver enzymes and fibrosis scores all clear, FIB-4 1.06, kidney function adequate, coeliac screen negative, rheumatoid factor negative, IgE normal, PSA within range and trending down, urinalysis completely clean, vitamin D optimal at 116, folate healthy, ESR 1, platelets healthy, cortisol mid-range.","recommendations":"Share the haemoglobin (186), haematocrit (54.4%), testosterone (37.5), free testosterone (1.02), oestradiol (244) and free androgen index (157.56) results with your testosterone prescriber and haematology team. Haematocrit at 54.4% is still above the threshold for dose review, and the testosterone and oestradiol levels are substantially higher than your recent readings, likely reflecting sample timing. Your prescriber can assess whether a dose adjustment is needed.\nRequest an HFE gene test through your GP or haematology team to exclude hereditary haemochromatosis. Your serum iron is 48.6 (limit 31.3) and transferrin saturation is 63.24% (limit 55%), and while the ferritin of 58 after venesection may be masking higher stores, the saturation alone warrants testing.\nDiscuss your ApoB of 1.01 with your prescriber. On triple lipid-lowering therapy with a previous TIA, guidelines increasingly recommend ApoB below 0.7. There may be room to optimise the regimen further, potentially with a PCSK9 inhibitor if appropriate.\nBring the PSA results (total 2.04, free:total ratio 0.162) and the trend data to your urology appointment on 7 October. The total PSA is within range and trending down, and the ratio is best interpreted alongside clinical examination.\nAsk your GP to repeat the magnesium (1.39, limit 1.11) on a fresh fasting sample. If confirmed elevated, your cardiologist should be informed given your use of flecainide and bisoprolol.\nMention the chloride of 93 (limit 95) and the CEA of 2.33 (limit 2.3) to your GP for documentation. Neither is likely clinically significant but both should be on record, the CEA particularly in the context of your family history of bowel cancer.\nDiscuss a sleep study with your GP. Under 6 hours of broken sleep with exhaustion on waking, at a BMI of 33, raises the possibility of obstructive sleep apnoea. This is the single most impactful investigation that could change your symptoms of fatigue, headaches, low mood and palpitations.\nRetest in 8 to 12 weeks: full blood count, iron studies, testosterone, oestradiol, SHBG, PSA, ApoB, hsCRP, B12, magnesium, chloride. Time the blood draw at a consistent point relative to your testosterone dose so the levels can be compared meaningfully.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Why: your B12 is 316 pg/mL, within the lab range but below the optimal threshold of 500. Sublingual bypasses any absorption variability and is the most reliable way to bring it up. B12 supports nerve function, red blood cell formation and energy metabolism.\nVitamin K2: MK-7 form, 100 mcg daily, taken with your main meal. Why: you are already well supplied with vitamin D at 116, and vitamin K2 ensures the calcium your vitamin D helps absorb is directed into bones rather than soft tissues and arterial walls. This is particularly relevant given your cardiovascular history.\nDO NOT take iron supplements. Your serum iron and transferrin saturation are already well above range, and iron supplementation could be harmful, particularly until haemochromatosis has been excluded.\nDO NOT take magnesium supplements. Your magnesium is already 1.39, above the upper limit, and additional magnesium could affect cardiac conduction in someone taking flecainide and bisoprolol.\nDO NOT take omega-3 fish oil at high doses (above 1 g EPA+DHA) without discussing with your cardiologist or prescriber first. High-dose omega-3 can increase the risk of atrial fibrillation recurrence, which is directly relevant to your cardiac history.\nDO NOT take St John's wort, 5-HTP, or any serotonin-active supplements. These interact with sertraline and can cause serotonin syndrome.\nThe most important changes from this report are not supplements. They are resuming daily movement, fixing a consistent wake time, getting morning light, cutting caffeine after midday, and discussing a sleep study and the testosterone and iron results with your medical team.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 56.2; held to 49 by two or more systems rated \"See your GP\". Weakest systems: hematology 18%, electrolytes & minerals 23%, hormones 31%. Biggest drags: Haemoglobin, Haematocrit, Magnesium, Oestradiol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"54.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4567","lower_normal":"","upper_normal":"60","lower_optimal":"","upper_optimal":"55","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4583","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Richard's PhenoAge of 54.8 years against his calendar age of 55 means his blood markers suggest he is ageing at approximately the expected rate, a difference of just -0.2 years. The markers holding his PhenoAge closest to calendar age rather than pulling it younger are his CRP at 2.1 and his RDW at 15.4. Improving sleep, resuming exercise and reducing stress would be expected to bring PhenoAge down.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. Richard's level of 4.8 mmol/L sits comfortably within the ideal range of 4.0 to 5.4, reflecting excellent blood sugar regulation. At a BMI of 33 with no current exercise, this is a genuinely positive finding and speaks to the quality of his diet.","low_causes":"Fasting, excessive insulin, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2778","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c expressed as a percentage. Richard's 5.0% is well within the normal range (under 6.0%) and below the pre-diabetes threshold. This confirms excellent long-term blood sugar control.","low_causes":"","high_causes":"Pre-diabetes, type 2 diabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin that has been glycated, meaning sugar has attached to it, over the past two to three months. It is the best single measure of long-term blood sugar control. Richard's level of 31 mmol/mol is excellent, well below the pre-diabetes threshold of 42 and within the optimal range of below 36. His previous results of 32 to 34 confirm a consistent pattern of excellent glucose metabolism.","low_causes":"","high_causes":"Pre-diabetes, type 2 diabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3243","upper_optimal_position":"0.4054","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar controlled. A low fasting insulin alongside a normal fasting glucose means the body is highly sensitive to insulin and does not need much of it. Richard's level of 3.88 mIU/L is within the ideal range of 2 to 8, confirming excellent insulin sensitivity. At a BMI of 33, this is a standout positive result.","low_causes":"Low-carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, metabolic syndrome, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.809","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2421","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin and is used to measure how much insulin the pancreas is genuinely producing. Richard's level of 0.809 ug/L (equivalent to approximately 268 pmol/L) is below the laboratory range of 1.1 to 4.4. However, C-peptide mirrors insulin, and his fasting insulin at 3.88 is appropriately low because his glucose is well controlled at 4.8 and his body simply does not need much insulin. This is a marker of excellent metabolic efficiency, not pancreatic failure.","low_causes":"Low insulin demand, fasting, exogenous insulin use, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3786","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose is derived from HbA1c and represents the average blood sugar over the past two to three months. Richard's estimated average glucose of 5.3 mmol/L is within the ideal range, confirming excellent long-term glucose control.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4835","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines triglycerides and fasting glucose to estimate insulin resistance. Richard's TyG index of 8.51 is within the laboratory range of under 8.8 but marginally above the optimal threshold of 8.5, driven by the triglycerides of 1.3. Reducing triglycerides through exercise would bring this into the optimal range.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"63.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7370","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures what percentage of the body's iron-carrying protein, transferrin, is currently loaded with iron. Richard's level of 63.24% is above the upper limit of 55%. A saturation above 55% raises the possibility of iron overload, with hereditary haemochromatosis being the most important condition to exclude, particularly in people of European ancestry. The alternative explanation is increased iron turnover driven by testosterone-stimulated red cell production. An HFE gene test is recommended.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis, increased erythropoiesis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"48.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8551","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3838","upper_optimal_position":"0.6162","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day, peaking in the morning. Richard's level of 48.6 umol/L is well above the upper limit of 31.3. Combined with the elevated transferrin saturation of 63.24%, this pattern warrants investigation for haemochromatosis. The timing of the sample and the increased iron demand from testosterone-driven red cell production may contribute, but the level is high enough to require formal exclusion of iron overload.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease, increased erythropoiesis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5353","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.4","upper_optimal":"3.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Transferrin is the main protein that transports iron through the blood. Richard's level of 3.06 g/L is well within range, indicating that the body's iron transport capacity is normal. In haemochromatosis, transferrin is typically normal or low, so a normal level here does not exclude it. The transferrin level is reassuring in that the body has adequate transport capacity.","low_causes":"Chronic inflammation, liver disease, haemochromatosis, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6244","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3954","upper_optimal_position":"0.6039","units":"umol/L","description":"Total iron binding capacity, or TIBC, measures how much iron the blood could carry if all the transferrin were fully loaded. Richard's level of 72 umol/L is within range but towards the upper end. A normal TIBC with very high serum iron and high transferrin saturation is a pattern that can be seen in haemochromatosis and should be interpreted alongside the HFE gene test result.","low_causes":"Chronic inflammation, liver disease, haemochromatosis","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3733","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/mL","description":"Ferritin is the storage form of iron and the best single marker of the body's iron reserves. Richard's level of 58 ng/mL is within the optimal range of 50 to 200. This is lower than might be expected given the very high serum iron and transferrin saturation, and the explanation is almost certainly the venesection he had in July, which depletes iron stores. Ferritin alone cannot be used to exclude haemochromatosis when stores have been recently depleted.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian diet","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"186","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8000","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Richard's level of 186 g/L is above the upper limit of 170, consistent with secondary erythrocytosis from his testosterone therapy. Importantly, this is lower than his recent readings: 196 in early July, 190 on 19 August, and now 186, showing a downward trend after venesection. However, this level still corresponds to a haematocrit above the threshold at which prescribers typically review testosterone dosing.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, kidney disease","high_causes":"Testosterone therapy, polycythaemia vera, dehydration, chronic hypoxia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6967","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Richard's count of 5.59 is marginally above the upper limit of 5.5, consistent with the testosterone-driven erythrocytosis. It is part of the same pattern as the elevated haemoglobin and haematocrit.","low_causes":"Anaemia, bone marrow failure, chronic disease, blood loss","high_causes":"Testosterone therapy, polycythaemia, dehydration, hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.544","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8133","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. Richard's haematocrit of 0.544 (54.4%) is above the upper limit of 0.50 (50%). On testosterone therapy, haematocrit above 54% is the threshold at which prescribers typically consider dose reduction or venesection. His trend is encouraging: 58.9% in early July, 56.9% on 19 August, and 54.4% now. The venesection is working, but the level remains at the action threshold. His prescriber and haematology team should see this result.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Testosterone therapy, polycythaemia vera, dehydration, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"15.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7048","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"%","description":"RDW measures the variation in size among red blood cells. A higher number means more variation. Richard's RDW of 15.4% is marginally above the upper limit of 15%. This is consistent with the recent venesection and subsequent regeneration of new red cells: the bone marrow releases young cells of slightly different sizes alongside the existing population, creating more variation. It is not a separate concern.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, recent blood loss or transfusion, venesection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume","group":"HEMATOLOGY","result":"97.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5926","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV is the average size of each red blood cell. Richard's MCV of 97.2 fL is within the ideal range, indicating that his red cells are a normal size. This rules out the small cells seen in iron deficiency and the large cells seen in B12 or folate deficiency.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol use, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin","group":"HEMATOLOGY","result":"33.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7933","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"pg","description":"MCH is the average amount of haemoglobin in each red blood cell. Richard's MCH of 33.3 pg is above the upper limit of 32. This is a direct consequence of the elevated haemoglobin concentration driven by testosterone therapy; each red cell is carrying more haemoglobin than usual. It is part of the same erythrocytosis pattern, not a separate finding.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, elevated haemoglobin, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Corpuscular Haemoglobin Concentration","group":"HEMATOLOGY","result":"342","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC is the average concentration of haemoglobin within each red blood cell. Richard's level of 342 g/L is within the normal range and confirms that each red cell is packed with haemoglobin at the expected density.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"228","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4231","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the cells responsible for blood clotting. Richard's platelet count of 228 is well within the ideal range, indicating healthy clotting capacity. This is reassuring in someone with a history of TIA and on medications that affect the cardiovascular system.","low_causes":"Viral infections, liver disease, autoimmune conditions, bone marrow disorders, medications","high_causes":"Infection, inflammation, iron deficiency, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mp
