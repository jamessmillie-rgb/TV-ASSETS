<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Joseph Rodwell","dob":"06/09/1995","report_date":"2026-09-30","summary":"Joseph is a 31-year-old male presenting with a BMI of 32.8, following a standard mixed diet rated 6 out of 10 for quality with a volume of 8 out of 10. He trains four times per week, split evenly between two cardio and two resistance sessions, with 2,000 to 5,000 daily steps. He takes tadalafil 5 mg daily when he remembers and reports experimenting with various supplements and di/tri-peptides. He uses cannabis and recreational drugs. He reports weight gain and difficulty losing weight, joint pain and stiffness, and hair thinning. His goals are to reduce stress and anxiety, improve digestion and gut health, and balance his hormones.\n\nThe finding that should go to his GP before anything else in this report is the pancreatic enzyme picture. Pancreatic amylase, an enzyme produced by the pancreas to break down starch, is 103, roughly double the upper limit of 53. Lipase, a second pancreatic enzyme that breaks down fats, is 118.3, again roughly double the upper limit of 65. When both of these enzymes are elevated together, it means the pancreas is releasing more enzyme into the bloodstream than it should be. The causes range from subclinical pancreatic irritation through to early pancreatitis, and certain medications, injectable peptides, weight-loss drugs, alcohol and recreational substances are all recognised triggers. His GP will need a full and honest list of everything he is currently taking, including any peptides, supplements and recreational substances, along with a repeat of both enzymes. If at any point he develops upper abdominal pain, pain radiating through to his back, nausea or vomiting, he should seek same-day medical advice rather than waiting for a routine appointment.\n\nWith that said, there is a great deal of good news in this report. His cardiovascular profile is genuinely excellent. Apolipoprotein B, the protein that carries LDL cholesterol particles into artery walls and the single best blood marker of cardiovascular risk, is 75, well below the 90 threshold where risk begins to climb. His LDL cholesterol is 2.42, comfortably below the 3.0 limit. His triglycerides are 0.49, which is outstandingly low and reflects good insulin sensitivity in the fat tissue. Lipoprotein(a), a genetically inherited particle that independently drives cardiovascular risk and cannot be changed by diet or exercise, is 8.3, well below the 32 threshold. This is genuinely useful information because it means his cardiovascular risk is almost entirely within his control. His Lp(a)-corrected LDL, which strips out the cholesterol carried on Lp(a) particles to show how much is truly modifiable, is 2.39, confirming this. His small dense LDL, the more dangerous subtype of LDL, is just 14.75, very low. His homocysteine, an amino acid linked to arterial damage when elevated, is 8.8, within the optimal range. High-sensitivity CRP, the most sensitive marker of systemic inflammation and an independent cardiovascular risk factor, is below 0.30, essentially undetectable, which at a BMI of 33 is a genuinely surprising and positive finding because body fat typically drives low-grade inflammation upward. His cardiac markers, including Troponin T at 7.88, CK-MB at 1.48 and myoglobin at 27.3, are all well within range, showing no cardiac muscle stress at all. His D-Dimer is below the detection threshold, ruling out any abnormal clotting activity. The laboratory flagged his HDL at 1.35 as below their reference of 1.55, but 1.35 in a man is a reasonable level, not a clinical concern, particularly when his triglyceride-to-HDL ratio is 0.36, which is outstanding. His ApoB-to-ApoA-I ratio of 0.61 is comfortably below the 0.7 male threshold, confirming that the balance between harmful and protective lipid particles is in his favour.\n\nHis liver is in good health where it matters. ALT, the enzyme most specific to liver cell damage, is 16.2, well below both the laboratory limit of 55 and the stricter optimal threshold of 30. AST is below 18.7. GGT, which rises with alcohol, metabolic strain and bile duct irritation, is 21.4, comfortably within the optimal range. ALP is 65, mid-range. Bile acids are below 3.2, normal. Albumin, the protein the liver manufactures and the best single marker of liver synthetic function, is 48.5, near the top of the range, which is a strong result. His FIB-4 score, a composite index that screens for liver scarring using age, platelets, AST and ALT, is 0.47, very low and effectively ruling out any significant liver fibrosis. His APRI is 0.151 and his NAFLD Fibrosis Score is minus 3.516, both well within the low-risk zone. So the liver itself is healthy. What is mildly raised is his total bilirubin at 23.94 against an upper limit of 21, and his direct bilirubin at 7.12 against an upper limit of 6. Bilirubin is the yellow pigment produced when red blood cells are broken down, and the liver processes it for excretion. When all the liver enzymes, bile acids and albumin are completely normal and bilirubin is only mildly raised, the most common explanation is a benign inherited variation in the enzyme that conjugates bilirubin, which affects roughly five to ten percent of people. This is not something to worry about, but it is worth mentioning to his GP for a fasting recheck to confirm the pattern.\n\nHis kidney function is normal. Creatinine is 107.8, marginally above the laboratory upper limit of 104, but creatinine is produced by muscle and scales with body size. Cystatin C, a marker that is independent of muscle mass and therefore more reliable in a large, muscular man, is 0.93, giving a cystatin C-based eGFR of 96, which is well within the optimal range. His combined eGFR is 90. Urea is 5.07, mid-range. Microalbumin was not detected, meaning the kidney filters are not leaking protein, and his urinalysis is entirely clear. The creatinine simply reflects his size and should not be interpreted as kidney impairment.\n\nHis iron studies are in excellent shape. Ferritin, the storage form of iron, is 228.5, well within the male range and sitting in a healthy zone that provides a good reserve without suggesting overload. Transferrin saturation is 39.3 percent, within the optimal band. Iron itself is 22.4, TIBC is 57, and transferrin is 2.6, all normal. This is a strong set of results.\n\nVitamin D is 98, within the optimal range of 75 to 120. At a BMI of 33 this is a good result because fat tissue sequesters vitamin D, making it harder to maintain levels. Whatever supplementation he is taking is working. Zinc is 16.0, within the optimal band. His total antioxidant status is 1.93, well above the lower limit. Folic acid is 5.7 and red cell folate is 807, both within range, though folic acid is below the optimal threshold of 8 and could be improved with more leafy greens or a methylfolate supplement. Vitamin B12 is 839, above the laboratory upper limit of 771, but his active B12, the fraction the body can actually use, is 133, within range. The high total B12 is entirely consistent with supplementation and is not a concern.\n\nHis coeliac screen is negative, with anti-tissue transglutaminase antibodies below 0.2. His rheumatoid factor is below 6.72 and his anti-CCP antibodies are below 8.0, both well within range. This is directly relevant to his joint pain and stiffness: these results effectively rule out coeliac disease and inflammatory arthritis as causes. His gastric parietal cell antibodies are 0.80, negative. His thyroid antibodies are both negative, with anti-TPO below 8.0 and anti-thyroglobulin at 28.1, both well within range.\n\nHis tumour markers are all normal. PSA is 0.52, very low, and his prostate cancer risk score is decreased. AFP, CEA, CA 19-9, NSE, hCG, mesothelin and calcitonin are all within their reference ranges. His Epstein-Barr virus antibodies are all negative, meaning he has not been infected with EBV. His H. pylori antibody is below 8.89, negative, which is relevant to his digestion goal: H. pylori infection is not contributing to any gut symptoms.\n\nHis immunoglobulins are all within range. IgE is 33.9, IgA 1.698, IgG 11.59, IgM 0.941, all normal. Complement C4 is 0.31, normal. Haptoglobin is 1.411, normal, confirming there is no haemolysis, no excessive breakdown of red blood cells.\n\nTurning now to the findings that need attention beyond the pancreatic enzymes. His hormonal picture has several threads that are connected. His oestradiol, the primary oestrogen, is 231, well above the male upper limit of 159. In men, oestradiol is produced primarily by an enzyme called aromatase, which converts testosterone into oestradiol, and aromatase activity increases with body fat. At a BMI of 33, with an estimated body fat of around 30 percent, increased aromatase activity is the most straightforward explanation. His progesterone is 1.33, above the male upper limit of 0.47. His FSH, follicle-stimulating hormone, which in men drives sperm production, is 1.18, just below the lower limit of 1.5. When the pituitary gland detects high oestradiol, it suppresses FSH secretion through negative feedback, so these three findings are connected. His LH at 3.2 is within range, and his testosterone at 21.9 is healthy, with a calculated free testosterone of 0.459 and a bioavailable testosterone of 12.08, both within range, so testosterone production itself is not being suppressed yet. His SHBG at 31.2 is within range. His DHEA-S is 17.4, near the top of range, and his IGF-1 is 29.6, also near the top. Both of these can be elevated by certain supplements and peptides. His LH-to-FSH ratio is 2.71, above the optimal upper limit of 1.5, which reflects the selective suppression of FSH. The elevated oestradiol is relevant to several of his symptoms: it can contribute to weight gain, particularly around the chest and abdomen, and to hair thinning when combined with higher aromatase activity. His GP should be made aware of this hormonal pattern, and Joseph should bring a complete list of every supplement, peptide and substance he is using so the GP can determine what is being driven by body fat and what may be driven by exogenous substances.\n\nHis cortisol is 178, which is within range but sits in the lower quarter. Cortisol follows a strong daily rhythm, peaking in the early morning and falling through the day. His blood was drawn at 10:00 am, when cortisol should still be relatively high, so 178 is on the low side for that time of day. This is not clinically abnormal, but combined with his stress and anxiety goal and his cannabis use, which can blunt the cortisol awakening response, it is worth noting. His testosterone-to-cortisol ratio is 123, well above the optimal range of 25 to 60, which is being driven by the low cortisol denominator rather than unusually high testosterone.\n\nHis free T4 at 22.70 is marginally above the upper limit of 21.6, with TSH at 0.84 and free T3 at 5.92 both within their optimal ranges, and both thyroid antibodies negative. This pattern, a slightly high free T4 with everything else normal, is usually not clinically significant. One common cause of a falsely elevated free T4 on immunoassay is biotin, also known as vitamin B7, which is present in many multivitamins, hair and skin supplements, and some pre-workout formulations. Given that Joseph takes multiple supplements, this is the most likely explanation. We would suggest pausing any biotin-containing supplement for three days and then repeating free T4 to confirm. His FT3-to-FT4 ratio of 0.261 is just below the optimal lower bound of 0.27, which is consistent with the free T4 being slightly inflated rather than reflecting a genuine conversion issue.\n\nHis HOMA-IR, a measure of insulin resistance calculated from fasting glucose and insulin, is 2.26, above the upper limit of 2. His glucose was 4.73 and his insulin was 74.8 pmol/L. The laboratory noted that the sample was received outside its stability time for glucose; glucose falls in the tube over time as red blood cells continue to metabolise it, which means the true fasting glucose was likely slightly higher than 4.73, and therefore the true HOMA-IR is likely higher than 2.26 as well. His HbA1c, which reflects average blood sugar over the preceding two to three months and is not affected by sample handling, is 37, within the healthy range. His fructosamine at 234 confirms the same over a shorter window. So his blood sugar control is currently adequate, but the insulin resistance signal suggests his pancreas is having to work harder than it should to maintain that control. At 31 with a BMI of 33, this is an early warning rather than a diagnosis, and it is entirely reversible with weight loss, dietary change and increased activity. His adiponectin-to-insulin ratio is 0.25, below the lower limit of 0.3, which reinforces this: adiponectin is a hormone from fat tissue that improves insulin sensitivity, and when the ratio to insulin drops, it suggests the fat tissue is becoming less metabolically healthy. His HOMA-B at 175, within range, shows the pancreas is compensating adequately for now. His TyG index at 7.52 is well within range.\n\nHis uric acid is 380.7, within the laboratory range of 200 to 430 but approaching the top. Uric acid is a waste product of purine metabolism that, when elevated, can crystallise in joints and contribute to joint pain and stiffness. At his current level it is not diagnostic of gout, but combined with his BMI and his joint symptoms, it is a marker worth tracking. Weight loss reliably lowers uric acid.\n\nHis Cardiovascular Risk Score, a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 45 against a target of 20 or below. This looks surprising given the excellent lipid profile described above, and the inputs driving the score upward are HbA1c at 37, which, while within the healthy range, sits above the optimal threshold of 36, and the HOMA-IR signal. This score measures the risk being built across all metabolic inputs, not just cholesterol, and the metabolic component is where his risk sits. The good news is that this is modifiable: weight loss, dietary improvement and more activity will bring it down.\n\nHis PhenoAge is 29.5 against a calendar age of 31, meaning his biological age as estimated from his blood markers is about one and a half years younger than his actual age. This is a positive finding, driven by his low CRP, healthy albumin and reasonable glucose. The markers that would pull PhenoAge in the wrong direction for him are the white cell count and the glucose, and improving those with weight loss would widen the gap further.\n\nRegarding the sample handling, several markers were flagged by the laboratory as received outside their stability time. Potassium is reported at 5.88, above the upper limit of 5.3, but when blood sits in a tube for longer than intended, potassium leaks out of red blood cells and into the serum, artificially raising the reading. This result is almost certainly a handling artefact and should not be interpreted as a kidney or cardiac problem. It should be repeated on a promptly separated sample, along with sodium, before drawing any conclusion. Sodium is 146.4, at the very top of the range, and should be rechecked at the same time. The white blood cell count at 10.54, marginally above the upper limit of 10, and basophils at 0.14, marginally above 0.1, carry the same caveat and should be rechecked rather than interpreted. The glucose caveat has been discussed above in relation to HOMA-IR.\n\nHis ASO titre, antistreptolysin O, is 471.3 against an upper limit of 200. ASO is an antibody the immune system produces in response to infection with Group A Streptococcus, the bacterium that causes strep throat, scarlet fever and some skin infections. An elevated titre means he has had a streptococcal infection in the recent past, typically within the last few weeks to months. It does not mean he has an active infection now. This does not require treatment unless he has ongoing symptoms such as sore throat, skin rash or joint swelling, but it is worth mentioning to his GP for the record.\n\nHis interleukin-22 is 8.29, marginally above the upper limit of 6.51. IL-22 is a cytokine involved in gut mucosal immunity and tissue repair. A marginal elevation in isolation is not clinically meaningful, but it is noted given his goal of improving digestion.\n\nCopper is 10.9, marginally below the lower limit of 11. This is a small deficit that can be addressed through diet: shellfish, liver, dark chocolate, nuts and seeds are all good sources. It is not a clinical concern at this margin.\n\nAddressing his symptoms directly: his joint pain and stiffness is not explained by inflammatory arthritis, as rheumatoid factor and anti-CCP are both convincingly negative, nor by coeliac disease. The most likely contributors at 31 with a BMI of 33 are mechanical load on the joints from excess weight, and his uric acid sitting towards the top of the range. Weight loss is the single most effective intervention for joint pain in this context. His hair thinning could be related to the elevated oestradiol and the hormonal milieu described above, and it is worth discussing with his GP alongside the full supplement and peptide review. His weight gain and difficulty losing weight has a clear metabolic context: early insulin resistance, a BMI of 33, relatively low daily step count, and a caloric intake that is likely above his expenditure given the volume of 8 out of 10 with moderate activity. His digestion goal is supported by the negative H. pylori, negative coeliac screen and normal bile acids, which rule out several structural causes of digestive symptoms. The marginally raised IL-22 may reflect low-grade gut mucosal activity, but the more impactful changes will come from increasing vegetable and fibre intake and reducing ultra-processed food.","links":"The central thread in this report is the relationship between body composition and the hormonal and metabolic findings. At 110 kg with an estimated 33 kg of fat mass, Joseph's fat tissue is metabolically active in ways that connect several of the abnormal results. Aromatase, the enzyme concentrated in fat tissue, converts testosterone to oestradiol, and the degree of conversion scales with fat mass. This explains the oestradiol of 231 in the presence of a healthy testosterone of 21.9: the raw material is adequate, but more of it is being diverted to oestrogen than is ideal. The elevated oestradiol then feeds back to the pituitary gland, selectively suppressing FSH to 1.18 while leaving LH relatively intact. Progesterone at 1.33 above the male range may be part of the same picture or may relate to one of his supplements or peptides; without knowing exactly what he is taking, the GP will need to tease that apart.\n\nThe second thread is early insulin resistance. HOMA-IR at 2.26, likely an underestimate given the glucose handling caveat, sits above the threshold of 2 and tells us the pancreas is producing more insulin than it should need to maintain a normal blood sugar. At 31 this is entirely reversible, but it will not reverse on its own. The adiponectin-to-insulin ratio below its lower limit reinforces the metabolic strain. The reassuring counterpoint is that his triglycerides are outstandingly low at 0.49, his HbA1c is 37, and his fructosamine is normal, so the blood sugar itself is still well controlled. The window for acting is now, before the compensatory mechanism begins to fail.\n\nThe pancreatic enzymes sit apart from both of those threads. Amylase at 103 and lipase at 118.3, both roughly double the upper limit, could be related to a substance he is taking, to a recent episode of heavy alcohol or recreational drug use, or to an intrinsic pancreatic process. The entirely normal liver enzymes, bile acids and bilirubin pattern make gallstone-related pancreatitis less likely, and the normal triglycerides rule out hypertriglyceridaemia as a cause. The GP conversation is essential here, and honesty about every substance is critical because the differential changes depending on what is being taken.\n\nThe cardiovascular profile is the clear positive that ties everything together in the other direction. Despite a BMI of 33 and early insulin resistance, his ApoB, LDL, triglycerides, Lp(a), hsCRP and homocysteine are all excellent. This tells us that the metabolic strain has not yet spilled over into vascular risk in the way it typically does, and that acting now, primarily through weight loss, will preserve this advantage rather than waiting for it to erode.\n\nThe loose ends are the ASO titre at 471, which reflects a past streptococcal infection and is unrelated to the other findings, and the free T4 at 22.70, which is most likely a biotin assay interference from his supplements and should resolve with a brief supplement pause before retesting.","lifestyle":"Add a palm-sized portion of protein to every meal before anything else goes on the plate: eggs, chicken, Greek yoghurt, fish, mince. Anchor: plate goes down, protein goes on first. Why: protein blunts the insulin response behind your HOMA-IR of 2.26, protects muscle while you lose fat, and keeps you full. Your target is at least 143 grams of protein per day.\nReduce portion sizes at your two largest meals by roughly a fist-sized amount each. Anchor: serve onto a slightly smaller plate and do not go back for seconds. Why: at a diet volume of 8 out of 10 with a step count under 5,000, you are almost certainly eating above your expenditure of around 2,700 calories. A target of roughly 2,400 calories a day will produce steady fat loss of around 0.5 kg per week.\nWalk for fifteen minutes immediately after your largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin spike from that meal, directly addressing the insulin resistance signal, and adds steps toward a target of at least 7,500 per day.\nSwap sugary drinks, fruit juice and ultra-processed snacks for water, sparkling water, or whole fruit. Anchor: one swap per day this week, every swap next week. Why: liquid sugar and refined carbohydrate drive the insulin your pancreas is already overproducing.\nAdd two to three extra portions of vegetables per day, starting with one at lunch and one at dinner. Anchor: add them to whatever you are already eating rather than replacing anything. Why: fibre slows glucose absorption, feeds gut bacteria relevant to your digestion goal, and adds volume without many calories.\nIncrease your resistance training from two to three sessions per week, and aim for compound movements: squats, deadlifts, presses, rows. Anchor: book a third session on a fixed day this week. Why: muscle tissue is the largest consumer of glucose in the body and directly improves insulin sensitivity; it also supports testosterone and counters the effects of elevated oestradiol.\nSet a fixed wake time seven days a week, get outside within thirty minutes of waking for natural light, and cut caffeine after 1 pm. Anchor: alarm at the same time every day, walk to the end of the street before checking your phone. Why: a consistent circadian rhythm lowers cortisol variability, supports the stress-reduction goal, and improves the quality of sleep that drives recovery and hormone balance.\nBring a full, honest list of every supplement, peptide, and substance you are currently taking to your GP appointment. Anchor: write the list before you book the appointment. Why: your GP cannot interpret the pancreatic enzymes, oestradiol, progesterone, FSH, IGF-1, DHEA-S or free T4 findings accurately without knowing exactly what is going into your body.","flags":"Pancreatic amylase 103 (upper limit 53) and lipase 118.3 (upper limit 65), both roughly double the reference range. Both pancreatic enzymes elevated together warrants prompt GP review to repeat and investigate. Same-day medical advice if upper abdominal pain, pain radiating to the back, nausea or vomiting develop. GP will need a complete list of all medications, supplements, peptides and recreational substances.\nOestradiol 231 (upper limit 159), progesterone 1.33 (upper limit 0.47), FSH 1.18 (lower limit 1.5), with testosterone 21.9, free testosterone 0.459 and SHBG 31.2 all normal. Pattern consistent with increased aromatase activity from adiposity and possibly exogenous peptide or supplement effect. LH:FSH ratio 2.71 (optimal below 1.5). Recommend GP review with a full supplement and peptide disclosure, and recheck in 8 to 12 weeks.\nFree T4 22.70 (upper limit 21.6) with TSH 0.84 and FT3 5.92 normal and thyroid antibodies negative. Most likely biotin assay interference from supplementation. Suggest pausing biotin-containing supplements for 3 days before repeating free T4.\nHOMA-IR 2.26 (upper limit 2), likely an underestimate due to glucose sample handling delay. Adiponectin:insulin ratio 0.25 (lower limit 0.3). Early insulin resistance signal at BMI 33. HbA1c 37 and fructosamine 234 confirm blood sugar control is currently adequate.\nTotal bilirubin 23.94 (upper limit 21) and direct bilirubin 7.12 (upper limit 6) with all liver enzymes, bile acids and albumin normal. Pattern consistent with benign inherited bilirubin conjugation variation. Recommend fasting recheck with GP to confirm.\nPotassium 5.88 (upper limit 5.3) is almost certainly a handling artefact from delayed sample separation and must not be interpreted as a kidney or cardiac problem. Sodium 146.4 at the top of range. Both should be repeated on a promptly processed sample before any conclusion is drawn.\nWhite blood cell count 10.54 (upper limit 10) and basophils 0.14 (upper limit 0.1) were received outside stability time and should be rechecked on a fresh sample rather than interpreted.\nASO 471.3 (upper limit 200) indicates a recent streptococcal infection. No action required unless ongoing symptoms such as sore throat, rash or joint swelling.\nCopper 10.9 (lower limit 11). Marginal deficit addressable through diet.\nInterleukin-22 8.29 (upper limit 6.51). Marginal elevation, not clinically meaningful in isolation.\nReassuring negatives: cardiovascular profile excellent (ApoB 75, LDL 2.42, triglycerides 0.49, Lp(a) 8.3, hsCRP below 0.30, homocysteine 8.8, troponin T 7.88, D-Dimer below 0.16); liver enzymes and fibrosis indices all normal (ALT 16.2, GGT 21.4, FIB-4 0.47); kidney function normal on cystatin C (eGFR 96); iron studies optimal; vitamin D 98; coeliac, rheumatoid factor and anti-CCP negative; tumour markers and PSA normal; EBV antibodies negative; H. pylori negative; thyroid antibodies negative; urinalysis clear.","recommendations":"See your GP soon to discuss the elevated pancreatic amylase (103, limit 53) and lipase (118.3, limit 65). Bring a complete written list of all supplements, peptides, medications and recreational substances. The GP will want to repeat both enzymes and examine you. Seek same-day medical advice if you develop upper abdominal pain, pain to the back, nausea or vomiting before the appointment.\nDiscuss the hormonal pattern with your GP: oestradiol 231 (limit 159), progesterone 1.33 (limit 0.47), FSH 1.18 (limit 1.5), IGF-1 29.6 and DHEA-S 17.4 both at the top of range. The GP will need to know exactly what peptides and supplements you are taking to determine what is driven by body fat versus exogenous substances. Request a recheck in 8 to 12 weeks.\nAsk your GP to repeat free T4 (currently 22.70, limit 21.6) after pausing any biotin-containing supplement for at least 3 days. TSH and FT3 are normal, antibodies negative, so this is likely assay interference.\nAsk your GP to repeat potassium and sodium on a promptly processed sample. The current potassium of 5.88 is almost certainly a sample handling artefact and should not be acted on until confirmed.\nMention the total bilirubin of 23.94 and direct bilirubin of 7.12, both mildly above range, with all liver enzymes normal. A fasting recheck will confirm whether this is a benign inherited pattern.\nMention the ASO of 471.3, indicating a recent streptococcal infection, for your GP's records. No action unless you have ongoing symptoms.\nYour calorie target for steady fat loss is approximately 2,400 kcal per day with at least 143 g of protein. Your first weight milestone is 100 kg, with an eventual target range around 83 kg (BMI 24.9). Retest in 12 weeks, repeating: pancreatic amylase, lipase, HOMA-IR (fasting glucose and insulin on a promptly processed sample), HbA1c, oestradiol, FSH, progesterone, free T4, potassium, sodium, bilirubin, and uric acid.","supplementation":"Magnesium glycinate, 300 mg elemental magnesium, taken before bed. Why: magnesium is 1.01, within range but near the top, and glycinate supports sleep quality and stress reduction, both stated goals. It also supports insulin sensitivity.\nOmega-3 fish oil providing 2 g combined EPA and DHA per day, taken with a meal containing fat. Why: omega-3 supports insulin sensitivity, joint comfort relevant to his joint pain, and anti-inflammatory balance.\nMethylfolate, 400 mcg daily, taken with food. Why: folic acid is 5.7, within the laboratory range but below the optimal threshold of 8. Methylfolate is the active form and does not require conversion.\nCopper, 1 to 2 mg daily as copper bisglycinate, taken with food but not at the same time as zinc. Why: copper is 10.9, marginally below the lower limit of 11. Alternatively, increase dietary copper from shellfish, nuts, seeds and dark chocolate.\nDO NOT start iron supplements. Ferritin is 228.5 and transferrin saturation is 39.3 percent; iron stores are healthy and additional iron could push them into overload.\nDO NOT start any new supplement or peptide until after the GP appointment. The pancreatic enzyme results and the hormonal pattern need to be interpreted with a full picture of what is currently being taken, and adding further substances before that conversation could complicate the picture.\nThe most important changes from this report are not supplements. They are reducing calorie intake to approximately 2,400 kcal with at least 143 g of protein, increasing daily steps to at least 7,500, adding a third resistance training session, and having an honest conversation with the GP about every substance being taken.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 60 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 59.6. Weakest systems: hormones 27%, inflammation 28%, electrolytes & minerals 29%. Biggest drags: Potassium, Oestradiol, Total Bilirubin, Free Thyroxine (FT4).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"29.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4097","lower_normal":"","upper_normal":"36","lower_optimal":"","upper_optimal":"31","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4306","units":"years","description":"PhenoAge is a biological age estimate calculated from a panel of blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, ALP and white cell count. At 29.5 against a calendar age of 31, Joseph's biological age is approximately one and a half years younger than his actual age. This is a positive finding, driven primarily by his very low CRP, healthy albumin and reasonable glucose. RDW is not measured on this panel, so a typical value of 13.0 percent was assumed; the effect on the estimate is small. Weight loss and the resulting improvement in glucose, insulin and inflammatory markers would widen this gap further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built across all metabolic inputs, not a ten-year probability of a heart attack. At 45, above the target of 40, Joseph's score is mildly elevated despite his excellent lipid profile. The inputs driving it upward are his HbA1c at 37 (above the optimal 36), HOMA-IR, and HDL sitting below the laboratory's conservative threshold. At 31, his ten-year absolute risk is very low, but the score highlights the metabolic window for acting. Weight loss, dietary change and more activity will bring this down.","low_causes":"Optimal lipids, low inflammation, healthy blood sugar","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_ le that independently increases cardiovascular risk. Unlike LDL, Lp(a) cannot be lowered by diet, exercise or most medications; it is fixed by your genes. At 8.3, well below the 32 nmol/L threshold, Joseph's Lp(a) is low. This is genuinely useful information because it means his entire cardiovascular risk profile is driven by modifiable factors rather than an inherited particle he cannot change.","low_causes":"Genetic variation (favourable)","high_causes":"Genetic variation (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"8.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2200","lower_normal":"0","upper_normal":"20","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2250","units":"µmol/l","description":"Homocysteine is an amino acid that, when elevated, damages artery walls and increases cardiovascular risk. It is kept low by adequate B12, folate and B6. At 8.8, Joseph's homocysteine is within the optimal range of below 9, reflecting the adequate B12 and folate in his system.","low_causes":"Adequate B12, folate and B6 intake","high_causes":"B12 or folate deficiency, genetic MTHFR variation, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"<0.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1500","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"mg/l","description":"High-sensitivity CRP is the most sensitive blood marker of systemic inflammation and is an independent predictor of cardiovascular risk. At below 0.30, Jos alled free fatty acids) are released from fat tissue between meals and used as fuel. Elevated levels suggest fat tissue is releasing too much fat, often due to insulin resistance. At 0.57, Joseph's level is within the optimal range, which is a positive finding alongside the HOMA-IR signal: it means his fat tissue is still responding to insulin's signal to stop releasing fat.","low_causes":"Fed state, effective insulin action","high_causes":"Fasting, insulin resistance, uncontrolled diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","result":"2.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4803","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5253","units":"ng/ml","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a reliable measure of how much insulin the pancreas is actually producing, because unlike insulin it is not cleared by the liver on first pass. At 2.08 ng/mL (equivalent to approximately 689 pmol/L), Joseph's C-peptide is within the optimal range, confirming the pancreas is producing insulin adequately.","low_causes":"Type 1 diabetes, advanced type 2 diabetes, low carbohydrate diet","high_causes":"Insulin resistance, insulinoma, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"234","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4699","lower_normal":"151","upper_normal":"300","lower_optimal":"170","upper_optimal":"270","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4608","upper_optimal_position":"0.5302","units":"µmol/l","description":"Fructosamine measures glycated protein in the blood and reflects average blood sugar control over the preceding two to three weeks, a shorter window than HbA1c. At 234, Joseph's fructosamine is within the optimal range, confirming his blood sugar has been well controlled over recent weeks. This marker is unaffected by sample handling delays.","low_causes":"Very low blood sugar, high protein turnover","high_causes":"Elevated blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"2.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3579","lower_normal":"1.44","upper_normal":"7.27","lower_optimal":"3.0","upper_optimal":"7.27","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4233","upper_optimal_position":"0.6666666667","units":"µg/ml","description":"Adiponectin is a hormone produced by fat cells that improves insulin sensitivity and has anti-inflammatory effects. Higher levels are protective. At 2.65, Joseph's adiponectin is within the laboratory range but below the optimal threshold of 3.0. Adiponectin tends to be lower in people with more body fat, particularly visceral fat, and this lower level contributes to the insulin resistance pattern seen in his HOMA-IR.","low_causes":"Obesity, visceral fat accumulation, insulin resistance","high_causes":"Lean body composition, high insulin sensitivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"107.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6983","lower_normal":"64","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6083","units":"µmol/l","description":"Creatinine is a waste product of muscle metabolism that the kidneys filter from the blood. It is used to estimate kidney function, but it also scales with muscle mass and body size. At 107.8, Joseph's creatinine is marginally above the laboratory upper limit of 104, but this reflects his body size at 110 kg rather than kidney impairment. His cystatin C, a marker independent of muscle mass, gives a normal eGFR of 96, confirming healthy kidneys.","low_causes":"Low muscle mass, liver disease","high_causes":"High muscle mass, large body size, kidney disease, dehydration, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"microalbumincreatininera","name":"Microalbumin / Creatinine Ratio","group":"KIDNEY FUNCTION","result":"Not detected","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"30","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/mmol","description":"This test looks for tiny amounts of albumin in the urine, which is the earliest sign of kidney damage, particularly from diabetes or high blood pressure. Not detected means the kidney filters are intact and not leaking protein. This is a reassuring finding alongside the insulin resistance signal.","low_causes":"","high_causes":"Diabetic kidney disease, hypertension, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfr","name":"Estimated Glomerular Filtration Rate (eGFR)","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m²","description":"eGFR estimates how efficiently the kidneys filter waste from the blood. This creatinine-based eGFR of 81 sits below the optimal threshold of 90, but this is because creatinine is elevated by Joseph's large body size and muscle mass, not because his kidneys are impaired. The cystatin C-based eGFR of 96, which is independent of muscle, is the more accurate measure here and is well within the optimal range.","low_causes":"Kidney disease, dehydration, certain medications","high_causes":"Hyperfiltration (early diabetes), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0.57","upper_normal":"1.05","lower_optimal":"0.6","upper_optimal":"0.95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5903","units":"mg/l","description":"Cystatin C is a small protein filtered by the kidneys at a constant rate, unaffected by muscle mass, diet or body size. This makes it a more reliable marker of kidney function than creatinine in larger or more muscular individuals. At 0.93, Joseph's cystatin C is within the optimal range, confirming that his kidneys are filtering normally despite the creatinine being marginally above the laboratory limit.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Kidney disease, hypothyroidism, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"beta2microglobulin","name":"Beta-2-Microglobulin","group":"KIDNEY FUNCTION","result":"0.98","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3460","lower_normal":"0.9","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3492","upper_optimal_position":"0.5079","units":"mg/l","description":"Beta-2-microglobulin is a protein found on the surface of most cells and filtered by the kidneys. It can rise in kidney disease, certain cancers and immune activation. At 0.98, Joseph's level is within the laboratory range, just below the optimal lower bound of 1.0. This is a normal result and does not indicate any kidney or immune abnormality.","low_causes":"Normal cell turnover","high_causes":"Kidney disease, lymphoma, multiple myeloma, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4942","lower_normal":"2.5","upper_normal":"7.8","lower_optimal":"3.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3962","upper_optimal_position":"0.5849","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced in the liver and excreted by the kidneys. At 5.07, Joseph's level is within the optimal range, reflecting normal protein intake and healthy kidney excretion.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"380.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5944","lower_normal":"200","upper_normal":"430","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5797","units":"µmol/l","description":"Uric acid is a waste product of purine metabolism. When levels rise, uric acid can crystallise in joints, causing gout, and is associated with insulin resistance and cardiovascular risk. At 380.7, Joseph's uric acid is within the laboratory range but above the optimal ceiling of 380 and approaching the upper limit. Given his joint pain and stiffness and his BMI, this is a marker to watch. Weight loss reliably lowers uric acid, and reducing high-purine foods (red meat, organ meats, shellfish, beer) can help.","low_causes":"Low purine diet, kidney excretion","high_causes":"High purine diet, obesity, alcohol (especially beer), insulin resistance, kidney impairment, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"ELECTROLYTES & MINERALS","result":"75.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5386","lower_normal":"64","upper_normal":"83","lower_optimal":"68","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3684","upper_optimal_position":"0.5789","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood, reflecting nutritional status, liver function and immune activity. At 75.7, Joseph's total protein is within the optimal range.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Dehydration, chronic infection, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"adjusted","name":"Calcium (adjusted)","group":"ELECTROLYTES & MINERALS","result":"2.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/l","description":"Adjusted calcium corrects for albumin levels to give a true picture of calcium in the blood. Calcium is essential for bones, muscle contraction, nerve function and blood clotting. At 2.37, Joseph's adjusted calcium is within the optimal range, with his PTH also normal at 1.8, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4821","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/l","description":"Chloride is an electrolyte that works with sodium and potassium to maintain fluid balance, blood pressure and acid-base balance. At 101.3, Joseph's chloride is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.010","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"0.7","upper_normal":"1.1","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle relaxation, nerve function and insulin signalling. At 1.01, Joseph's magnesium is within the optimal range. Adequate magnesium supports insulin sensitivity and sleep quality, both relevant to his goals.","low_causes":"Poor diet, alcohol, diuretics, intense exercise","high_causes":"Excessive supplementation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.260","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5524","lower_normal":"0.8","upper_normal":"1.5","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"mmol/l","description":"Phosphate is essential for bone formation, energy production (as ATP) and cellular signalling. At 1.26, Joseph's phosphate is within the optimal range, supporting healthy bone metabolism alongside his normal calcium and PTH.","low_causes":"Vitamin D deficiency, hyperparathyroidism, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive dairy intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8733","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is an electrolyte critical for heart rhythm, muscle contraction and nerve signalling. At 5.88, this result is above the upper limit of 5.3. However, when blood sits in a tube for longer than intended before being separated, potassium leaks out of red blood cells into the serum, artificially raising the reading. The laboratory confirmed this sample was received outside its stability time. This result is almost certainly a handling artefact and should not be interpreted as a kidney or cardiac problem. It should be repeated on a promptly processed sample, along with sodium, before any conclusion is drawn.","low_causes":"Diuretics, vomiting, diarrhoea, low intake","high_causes":"Sample handling artefact, kidney disease, ACE inhibitors, potassium-sparing diuretics, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"146.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6949","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the main electrolyte controlling fluid balance and blood pressure. At 146.4, Joseph's sodium is just above the upper limit of 146. This is a marginal elevation and may reflect mild dehydration at the time of the draw. It should be rechecked on a fresh sample alongside potassium to confirm. If consistently at this level, hydration habits should be reviewed.","low_causes":"Excessive fluid intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, high salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"ELECTROLYTES & MINERALS","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"1.6","upper_normal":"6.9","lower_optimal":"2.0","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3585","upper_optimal_position":"0.5786","units":"pmol/l","description":"PTH is a hormone produced by the parathyroid glands that regulates calcium and phosphate levels. It rises when calcium is low and falls when calcium is adequate. At 1.8, Joseph's PTH is within the laboratory range but below the optimal lower bound. With his calcium and vitamin D both in the optimal range, this low-normal PTH is appropriate and simply reflects that the parathyroids do not need to work hard to maintain calcium balance.","low_causes":"Adequate calcium and vitamin D, hypoparathyroidism","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dkk1","name":"Dickkopf-1 (DKK-1)","group":"ELECTROLYTES & MINERALS","result":"1287.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4081","lower_normal":"719.4","upper_normal":"3261.7","lower_optimal":"719.4","upper_optimal":"2000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5025","units":"pg/ml","description":"DKK-1 is a protein that inhibits the Wnt signalling pathway, which is involved in bone formation. Elevated levels can indicate increased bone turnover or certain cancers. At 1287.2, Joseph's level is within the optimal range, showing normal bone metabolism regulation.","low_causes":"Normal bone health","high_causes":"Bone metastases, multiple myeloma, osteoporosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"Alanine Aminotransferase (ALT)","group":"LIVER & METABOLIC","result":"16.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1473","lower_normal":"0","upper_normal":"55","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2727","units":"u/l","description":"ALT is an enzyme found predominantly in liver cells. When liver cells are damaged, ALT leaks into the blood. At 16.2, well below both the laboratory limit of 55 and the stricter optimal threshold of 30, Joseph's ALT shows the liver is under no metabolic strain at all. This is a particularly reassuring finding at a BMI of 33.","low_causes":"Normal liver health","high_causes":"Fatty liver disease, alcohol, medications, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"
