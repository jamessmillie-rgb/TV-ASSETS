s a genuinely positive finding given his BMI and reported recreational substance use.","low_causes":"Normal liver health","high_causes":"Alcohol, fatty liver, bile duct disease, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldh","name":"Lactate Dehydrogenase (LDH)","group":"LIVER & METABOLIC","result":"429","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6217","lower_normal":"230","upper_normal":"460","lower_optimal":"250","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3623","upper_optimal_position":"0.5725","units":"u/l","description":"LDH is an enzyme present in most tissues, released when cells are damaged. At 429, Joseph's LDH is within the laboratory range but above the optimal ceiling of 400. This is a minor finding and can reflect recent exercise, minor tissue turnover or the delayed sample handling. It does not indicate specific organ damage when all other markers are normal.","low_causes":"Normal cell turnover","high_causes":"Tissue damage, haemolysis, intense exercise, liver disease, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gldh","name":"Glutamate Dehydrogenase (GLDH)","group":"LIVER & METABOLIC","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2714","lower_normal":"0","upper_normal":"7","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"u/l","description":"GLDH is a liver-specific enzyme found in the mitochondria of liver cells. It rises when there is deeper liver cell damage. At 3.8, Joseph's level is within the optimal range, confirming no significant liver injury.","low_causes":"Normal liver health","high_causes":"Liver cell damage, toxic injury, hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalbilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"23.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5700","lower_normal":"0","upper_normal":"21","lower_optimal":"0","upper_optimal":"17","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4048","units":"µmol/l","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 23.94, Joseph's total bilirubin is mildly above the upper limit of 21. When all liver enzymes, bile acids and albumin are completely normal, as they are here, a mild bilirubin elevation most commonly reflects a benign inherited variation in the enzyme that conjugates bilirubin, affecting roughly five to ten percent of people. A fasting recheck with his GP will confirm the pattern.","low_causes":"Normal bilirubin processing","high_causes":"Benign inherited conjugation variation, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"directbilirubin","name":"Direct Bilirubin","group":"LIVER & METABOLIC","result":"7.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5933","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"µmol/l","description":"Direct (conjugated) bilirubin is the fraction that has been processed by the liver. At 7.12, marginally above the upper limit of 6, this rises alongside the total bilirubin. With all liver enzymes and bile acids normal, this is consistent with the same benign conjugation variation and does not suggest bile duct obstruction.","low_causes":"Normal bilirubin metabolism","high_causes":"Bile duct obstruction, hepatitis, inherited bilirubin conjugation variation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"bileacids","name":"Bile Acids","group":"LIVER & METABOLIC","result":"<3.20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1600","lower_normal":"0","upper_normal":"10","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"µmol/l","description":"Bile acids are produced by the liver to digest fats and are recycled through the gut. Elevated levels can indicate liver disease or bile duct problems. At below 3.2, Joseph's bile acids are well within the optimal range, confirming normal biliary function.","low_causes":"Normal liver and biliary function","high_causes":"Liver disease, bile duct obstruction, cholestasis of pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"48.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6333","lower_normal":"35","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It is the single best marker of liver synthetic function and nutritional status. At 48.5, near the top of the range, Joseph's albumin is excellent, confirming the liver is manufacturing proteins at full capacity.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"27.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4611","lower_normal":"23","upper_normal":"35","lower_optimal":"25","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"g/l","description":"Globulin is a group of proteins including immunoglobulins (antibodies). At 27.2, Joseph's level is within the optimal range, reflecting normal immune protein production.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aldolase","name":"Aldolase","group":"LIVER & METABOLIC","result":"7.20","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4737","lower_normal":"0","upper_normal":"7.6","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3618","units":"u/l","description":"Aldolase is an enzyme involved in glucose metabolism, found in muscle and liver. At 7.2, Joseph's level is within the laboratory range but above the optimal ceiling. This is a minor finding, likely reflecting normal muscle turnover in a man who trains four times per week.","low_causes":"Normal tissue health","high_causes":"Muscle disease, liver disease, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"pancreaticamylase","name":"Pancreatic Amylase","group":"LIVER & METABOLIC","result":"103","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"13","upper_normal":"53","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"u/l","description":"Pancreatic amylase is an enzyme produced by the pancreas to break down starch. At 103, roughly double the upper limit of 53, this is a significant elevation that warrants prompt GP investigation. When both pancreatic amylase and lipase are elevated together, it means the pancreas is releasing more enzyme into the bloodstream than it should. The causes range from subclinical pancreatic irritation to early pancreatitis. Certain injectable peptides, weight-loss medications, alcohol and recreational drugs can all raise these enzymes. Joseph's GP will need a full and honest list of everything he is currently taking, and the enzymes should be repeated. If he develops upper abdominal pain, pain radiating to the back, nausea or vomiting, he should seek same-day medical advice.","low_causes":"Chronic pancreatitis (burnout), cystic fibrosis","high_causes":"Pancreatitis, pancreatic duct obstruction, certain medications and peptides, alcohol, recreational drugs","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"118.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"5","upper_normal":"65","lower_optimal":"10","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"u/l","description":"Lipase is an enzyme produced by the pancreas to break down fats. At 118.3, roughly double the upper limit of 65, this is a significant elevation that mirrors the pancreatic amylase finding. Lipase is more specific to the pancreas than amylase. Both elevated together strengthens the signal that the pancreas needs investigation. The same GP conversation and the same safety-net advice about abdominal symptoms apply.","low_causes":"Normal pancreatic function","high_causes":"Pancreatitis, pancreatic duct obstruction, certain medications and peptides, alcohol, recreational drugs, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hpylori","name":"H. pylori","group":"DIGESTIVE","result":"<8.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0548","lower_normal":"0","upper_normal":"81.07","low .7423","lower_normal":"1.3","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6154","upper_optimal_position":"1","units":"mmol/l","description":"TAS measures the overall capacity of the blood to neutralise free radicals and prevent oxidative damage. At 1.93, well above the lower limit of 1.3 and the optimal threshold of 1.6, Joseph's antioxidant defence is strong.","low_causes":"Poor diet, smoking, chronic illness, low fruit and vegetable intake","high_causes":"Antioxidant-rich diet, supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"glutathionereductase","name":"Glutathione Reductase","group":"VITAMINS & NUTRIENTS","result":"57.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8636","lower_normal":"33","upper_normal":"","lower_optimal":"45","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6818","upper_optimal_position":"1","units":"u/l","description":"Glutathione reductase is an enzyme that regenerates glutathione, the body's most important intracellular antioxidant. It also serves as a functional marker of vitamin B2 (riboflavin) status. At 57, Joseph's level is well above the optimal threshold of 45, indicating good riboflavin status and effective antioxidant recycling.","low_causes":"Riboflavin (vitamin B2) deficiency","high_causes":"Adequate riboflavin status, supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"copper","name":"Copper","group":"VITAMINS & NUTRIENTS","result":"10.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3246","lower_normal":"11","upper_normal":"24","lower_optimal":"12","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"µmol/l","description":"Copper is an essential 667","lower_optimal_position":"0.4034","upper_optimal_position":"0.5714","units":"µg/l","description":"Folic acid (vitamin B9) is essential for DNA synthesis, red blood cell production and methylation, the biochemical process that regulates gene expression. At 5.7, Joseph's serum folate is within the laboratory range but below the optimal threshold of 8. This can be improved by eating more leafy green vegetables, legumes and fortified foods, or by adding a methylfolate supplement. His red cell folate at 807 confirms longer-term stores are adequate.","low_causes":"Low vegetable intake, alcohol, malabsorption, pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"839","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8928","lower_normal":"197","upper_normal":"771","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6097","upper_optimal_position":"0.7191","units":"ng/l","description":"Vitamin B12 is essential for nerve function, DNA synthesis and red blood cell production. At 839, Joseph's total B12 is above the laboratory upper limit of 771. However, his active B12 (holotranscobalamin), the fraction the body can actually use, is 133, within the normal range. The high total B12 is entirely consistent with his reported supplementation and is not a concern. No action is needed.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"activeb12","name":"Active B12","group":"VITAMINS & NUTRIENTS","result":"133.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5900","lower_normal":"25.1","upper_normal":"165","lower_optimal":"70","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4395","upper_optimal_position":"0.6190","units":"pmol/l","description":"Active B12 (holotranscobalamin) is the fraction of B12 that is bound to transcobalamin and available for cells to use. It is a more accurate marker of B12 status than total B12. At 133, Joseph's active B12 is within the optimal range, confirming his cells have adequate B12 for nerve function, DNA synthesis and red blood cell production.","low_causes":"B12 deficiency, pernicious anaemia, malabsorption","high_causes":"Supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6533","lower_normal":"50","upper_normal":"375","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5487","units":"nmol/l","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. At 98, Joseph's vitamin D is within the optimal range of 75 to 120. At a BMI of 33, this is a particularly good result because fat tissue sequesters vitamin D, making it harder to maintain adequate levels. Whatever supplementation he is taking is working. He should continue his current regimen to maintain this level.","low_causes":"Low sun exposure, dark skin, obesity, northern latitude, poor diet","high_causes":"Supplementation, excessive sun exposure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"redcellfolate","name":"Red Cell Folate","group":"VITAMINS & NUTRIENTS","result":"807.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4539","lower_normal":"523","upper_normal":"1257","lower_optimal":"600","upper_optimal":"1000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3738","upper_optimal_position":"0.5823","units":"µg/l","description":"Red cell folate measures folate stored inside red blood cells and reflects folate status over the preceding two to three months, a longer window than serum folic acid. At 807, Joseph's red cell folate is within the optimal range, confirming that his long-term folate stores are adequate even though his serum folic acid is below optimal.","low_causes":"Folate deficiency, poor diet, alcohol, malabsorption","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"33.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1695","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"60","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"ku/l","description":"IgE is the antibody class involved in allergic responses and defence against parasites. At 33.9, Joseph's IgE is within the optimal range, showing no evidence of significant allergic sensitisation or parasitic infection.","low_causes":"No allergic or parasitic disease","high_causes":"Allergies, asthma, eczema, parasitic infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"c4","name":"Complement Component 4 (C4)","group":"IMMUNOLOGY","result":"0.310","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.16","upper_normal":"0.46","lower_optimal":"0.2","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"g/l","description":"C4 is part of the complement system, a group of proteins that help the immune system fight infections. At 0.31, Joseph's C4 is withi ","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"The prostate cancer risk score combines PSA and other markers to estimate prostate cancer risk. Joseph's score is classified as decreased risk, consistent with his very low PSA of 0.52 at age 31.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"0.840","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3657","lower_normal":"0.35","upper_normal":"5.5","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.4582","units":"mIU/l","description":"TSH is the hormone produced by the pituitary gland that tells the thyroid how much thyroid hormone to make. It works as a thermostat: when thyroid hormone is low, TSH rises; when thyroid hormone is high, TSH falls. At 0.84, Joseph's TSH is within the laboratory range but slightly below the optimal lower bound of 1.0. This is consistent with the marginally elevated free T4, which may be pushing TSH down slightly. If the free T4 normalises after pausing biotin-containing supplements, TSH would be expected to settle into the optimal range.","low_causes":"Hyperthyroidism, excess thyroid hormone, biotin interference (on FT4 driving TSH down)","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"22.70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7030","lower_normal":"11.9","upper_normal":"21.6","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3838","upper_optimal_position":"0.6061","units":"pmol/l","description":"Free T4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. At 22.70, Joseph's FT4 is marginally above the upper limit of 21.6. However, TSH is normal at 0.84 and free T3 is 5.92, also within range, and both thyroid antibodies are negative. This pattern, where free T4 is slightly above range with everything else normal, is usually not clinically significant. One well-recognised cause is biotin (vitamin B7), which is present in many multivitamins, hair and skin supplements, and pre-workout formulations. Biotin interferes with the laboratory immunoassay used to measure free T4, producing a falsely high reading. Given Joseph's reported supplement use, this is the most likely explanation. Pausing any biotin-containing supplement for at least three days before repeating the test should confirm this.","low_causes":"Hypothyroidism, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, biotin assay interference, thyroiditis, excess thyroid hormone replacement","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free Tri-iodothyronine (FT3)","group":"THYROID","result":"5.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5892","lower_normal":"3.1","upper_normal":"6.8","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4459","upper_optimal_position":"0.6036","units":"pmol/l","description":"Free T3 is the active thyroid hormone that drives metabolism in every cell. At 5.92, within the optimal range of 4.5 to 6.5, Joseph's T3 is healthy. This means the thyroid is converting T4 to T3 effectively and cellular thyroid function is normal.","low_causes":"Hypothyroidism, low T4 to T3 conversion, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid hormone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igf1","name":"Insulin-like Growth Factor-1 (IGF-1)","group":"HORMONES","result":"29.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6130","lower_normal":"15.5","upper_normal":"33.1","lower_optimal":"18","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3807","upper_optimal_position":"0.5721","units":"nmol/l","description":"IGF-1 is a growth factor produced primarily by the liver in response to growth hormone. It drives tissue growth, muscle protein synthesis and cell repair. At 29.6, Joseph's IGF-1 is within the laboratory range but near the top and above the optimal ceiling of 28. Certain supplements and peptides, including growth-hormone-releasing peptides and similar compounds, can raise IGF-1. Given his reported experimentation with di/tri-peptides, this may be a relevant factor to discuss with his GP.","low_causes":"Malnutrition, liver disease, growth hormone deficiency, ageing","high_causes":"Growth hormone excess, certain peptides and supplements, acromegaly","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"178","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3395","lower_normal":"138","upper_normal":"690","lower_optimal":"250","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4013","upper_optimal_position":"0.5652","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, following a strong circadian rhythm: it peaks shortly after waking and falls through the day. At 178, from a 10 am blood draw when cortisol should still be relatively high, Joseph's level sits in the lower quarter of the range and below the optimal threshold of 250. This is not clinically abnormal, but it may be relevant to his goal of reducing stress and anxiety. Cannabis use can blunt the cortisol awakening response, potentially contributing to this lower reading.","low_causes":"Adrenal insufficiency, late-day sampling, cannabis use, chronic stress (adrenal fatigue is not a recognised diagnosis, but prolonged stress can flatten the curve)","high_causes":"Acute stress, Cushing's syndrome, early-morning sampling, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folliclestimulatinghormo","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"1.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3022","lower_normal":"1.5","upper_normal":"12.4","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3792","upper_optimal_position":"0.5299","units":"IU/l","description":"FSH (follicle-stimulating hormone) is produced by the pituitary gland and, in men, drives sperm production in the testes. At 1.18, Joseph's FSH is just below the lower limit of 1.5. The pituitary suppresses FSH when it detects high oestradiol through negative feedback, and his oestradiol is elevated at 231. This is the most likely explanation. Certain supplements and peptides can also suppress FSH. His GP should be aware of this and should recheck it alongside oestradiol after a full review of his supplement and peptide use.","low_causes":"High oestradiol negative feedback, exogenous hormones or peptides, pituitary disease","high_causes":"Testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"luteinisinghormone","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"3.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3968","lower_normal":"1.7","upper_normal":"8.6","lower_optimal":"3.0","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3913","upper_optimal_position":"0.5275","units":"IU/l","description":"LH (luteinising hormone) is produced by the pituitary and, in men, stimulates testosterone production in the testes. At 3.2, Joseph's LH is within the laboratory range and just above the optimal lower bound. The fact that LH is being maintained while FSH is suppressed suggests the oestradiol feedback is preferentially affecting FSH, which is a recognised pattern.","low_causes":"Exogenous testosterone or hormones, pituitary disease","high_causes":"Testicular failure, primary hypogonadism, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"92","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3445","lower_normal":"86","upper_normal":"324","lower_optimal":"100","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3529","upper_optimal_position":"0.5672","units":"mIU/l","description":"Prolactin is a pituitary hormone that, in men, is primarily important as a marker of pituitary function. Very high levels can suppress testosterone and libido. At 92, Joseph's prolactin is within the laboratory range and near the lower end, ruling out prolactin as a contributor to any hormonal symptoms.","low_causes":"Dopamine agonist medication","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, antidepressants), stress, cannabis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"Dehydroepiandrosterone Sulphate (DHEA-S)","group":"HORMONES","result":"17.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6606","lower_normal":"1.5","upper_normal":"17.7","lower_optimal":"5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3827","upper_optimal_position":"0.5802","units":"µmol/l","description":"DHEA-S is an adrenal hormone that serves as a precursor to testosterone and oestrogen. At 17.4 umol/L (equivalent to approximately 6,412 ug/dL), Joseph's level is within the laboratory range but near the top and above the optimal ceiling. DHEA-S at the top of range in a 31-year-old can reflect adrenal stimulation or supplementation. Certain peptides and supplements can stimulate adrenal output. This is another marker to discuss with his GP in the context of his full supplement list.","low_causes":"Adrenal insufficiency, ageing, chronic illness","high_causes":"Adrenal stimulation, supplementation, congenital adrenal hyperplasia, PCOS (females), adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"21.900","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5321","lower_normal":"8.64","upper_normal":"29","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4925","upper_optimal_position":"0.6829","units":"nmol/l","description":"Testosterone is the primary male sex hormone, driving muscle mass, bone density, libido, mood and energy. At 21.9, Joseph's testosterone is within the optimal range of 18 to 30, which at a BMI of 33 is a genuinely positive finding, as excess body fat typically suppresses testosterone production. His body is maintaining healthy testosterone output despite the increased aromatase conversion to oestradiol.","low_causes":"Obesity, ageing, pituitary disease, chronic illness, opioid use","high_causes":"Exogenous testosterone, anabolic steroids, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"231.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8696","lower_normal":"41.4","upper_normal":"159","lower_optimal":"60","upper_optimal":"140","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3825","upper_optimal_position":"0.6172","units":"pmol/l","description":"Oestradiol is the most potent form of oestrogen. In men it is produced by the enzyme aromatase, which converts testosterone to oestradiol, and aromatase is concentrated in fat tissue. At 231, Joseph's oestradiol is well above the male upper limit of 159. With a BMI of 33 and an estimated body fat of 30 percent, increased aromatase activity from adiposity is the most straightforward explanation. Certain supplements and peptides can also raise oestradiol. Elevated oestradiol in men can contribute to weight gain (particularly around the chest and abdomen), mood changes, and hair thinning. It is also driving the FSH suppression to 1.18 through negative feedback on the pituitary. This should be discussed with his GP alongside a full list of supplements and peptides, and rechecked in 8 to 12 weeks.","low_causes":"Very low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity (increased aromatase activity), exogenous hormones, supplements and peptides, liver disease, testicular tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.33","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"0.47","lower_optimal":"0","upper_optimal":"0.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4255","units":"nmol/l","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes, and normally sits at very low levels. At 1.33, well above the male upper limit of 0.47, Joseph's progesterone is elevated. This could be driven by increased adrenal output (consistent with his high DHEA-S), by certain supplements or peptides, or by the overall shift in his steroid hormone milieu. It is part of the same hormonal pattern as the elevated oestradiol and suppressed FSH and should be discussed with his GP.","low_causes":"Normal in men at low levels","high_causes":"Adrenal overproduction, supplements, peptides, congenital adrenal hyperplasia, ovarian or adrenal tumour","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sexhormonebindingglobuli","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"31.20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4527","lower_normal":"18.3","upper_normal":"54.1","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3854","upper_optimal_position":"0.6755","units":"nmol/l","description":"SHBG is a protein that binds testosterone and oestradiol in the blood, controlling how much is free and available to tissues. At 31.2, Joseph's SHBG is within the optimal range. SHBG tends to be lower with higher body fat and insulin resistance, so maintaining this level is a positive finding.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (calculated)","group":"HORMONES","result":"0.459","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5282","lower_normal":"0.168","upper_normal":"0.659","lower_optimal":"0.3","upper_optimal":"0.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4359","upper_optimal_position":"0.6120","units":"nmol/l","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, and therefore available to act on tissues. It is calculated from total testosterone, SHBG and albumin. At 0.459, Joseph's free testosterone is within the optimal range, confirming that enough testosterone is available at the tissue level despite the elevated oestradiol.","low_causes":"Low total testosterone, high SHBG, obesity, ageing","high_causes":"Exogenous testosterone, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinebilirubin","name":"Bilirubin (Urine)","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/dl","description":"Urine bilirubin is normally not present. A negative result confirms the liver is processing bilirubin normally via the gut rather than spilling it into the urine, which is consistent with the benign pattern of the mildly raised serum bilirubin.","low_causes":"","high_causes":"Liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineglucose","name":"Glucose (Urine)","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/dl","description":"Glucose should not be present in urine when blood sugar is normal. A negative result confirms the kidneys are not spilling glucose, which rules out significant hyperglycaemia.","low_causes":"","high_causes":"Uncontrolled diabetes, renal glycosuria, SGLT2 inhibitor medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineketones","name":"Ketones (Urine)","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/dl","description":"Ketones appear in urine when the body is burning fat for fuel instead of glucose, typically during fasting, low-carbohydrate diets or uncontrolled diabetes. A negative result is normal on a standard mixed diet.","low_causes":"","high_causes":"Fasting, low-carbohydrate diet, diabetic ketoacidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinenitrite","name":"Nitrite (Urine)","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/dl","description":"Nitrites in urine indicate the presence of bacteria that convert nitrate to nitrite, suggesting a urinary tract infection. A negative result rules out a bacterial UTI.","low_causes":"","high_causes":"Urinary tract infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineph","name":"pH (Urine)","group":"URINALYSIS","result":"7.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"5","upper_normal":"7.5","lower_optimal":"5.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"pH","description":"Urine pH reflects the acid-base balance of the body. At 7.0, Joseph's urine is neutral, within the normal range. Urine pH varies with diet, hydration and metabolic status.","low_causes":"High protein diet, metabolic acidosis, dehydration","high_causes":"Vegetarian diet, urinary tract infection, metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineprotein","name":"Protein (Urine)","group":"URINALYSIS","result":"Negative","within_normal" _position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"ratio","description":"The triglyceride-to-HDL ratio is one of the best simple markers of insulin resistance and cardiovascular risk. A lower ratio is better. At 0.36, well below the optimal ceiling of 0.9, Joseph's ratio is outstanding. This is driven by his very low triglycerides and confirms that, despite the HOMA-IR signal, his lipid metabolism is still functioning well.","low_causes":"Low triglycerides, high HDL, good insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1375","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried on triglyceride-rich lipoproteins (VLDL and IDL) after subtracting HDL and LDL from total cholesterol. It is an independent cardiovascular risk factor. At 0.22, well within the optimal range of below 0.5, Joseph's remnant cholesterol is very low, further confirming his excellent lipid profile.","low_causes":"Low triglycerides, good lipid metabolism","high_causes":"High triglycerides, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"agratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_positi ,"low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"118.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4631","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio is an inflammatory and immune marker. At 118.4, within the optimal range, this confirms no significant systemic inflammation from the platelet and lymphocyte perspective.","low_causes":"Low platelets, high lymphocytes","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"816","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8107","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines platelets, neutrophils and lymphocytes into a single inflammation score. At 816, above the upper limit of 600, Joseph's SII is elevated. However, this is driven by the neutrophil count of 6.89, which was received outside stability time and may not be reliable. This should be rechecked alongside the full blood count on a fresh sample. If the neutrophil count normalises, the SII would fall within range.","low_causes":"Low neutrophils, low platelets","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytehdlratio","name":"Monocyte:HDL Ratio","group":"INFLAMMATION","result":"0.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4417","lower_normal":"","upper_normal":"0.6","lower_optimal":"","upper_optimal":"0.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"The monocyte-to-HDL ratio is an emerging marker of cardiovascular inflammation. At 0.53, within the laboratory range but above the optimal ceiling of 0.4, this is driven by the monocyte count being in the upper part of range and HDL sitting slightly below the conservative threshold. It is a minor finding and not a concern in the context of Joseph's otherwise excellent cardiovascular profile.","low_causes":"Low monocytes, high HDL","high_causes":"Inflammation with low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"liverassessment","name":"Liver Assessment","group":"LIVER & METABOLIC","result":"Healthy","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Liver enzymes ALT 16.2, AST below 18.7, GGT 21.4 and ALP 65 are all within the optimal range. Albumin 48.5 is near the top of range. Fibrosis scores FIB-4 0.47 and APRI 0.151 effectively rule out scarring. Bilirubin mildly raised at 23.94 with a benign pattern. Pancreatic enzymes are the separate concern.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0880","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 is a composite score calculated from age, platelets, AST and ALT that screens for liver fibrosis (scarring). At 0.47, very low and well within the optimal range, this effectively rules out significant liver scarring. At a BMI of 33, where non-alcoholic fatty liver disease is more common, this is a particularly reassuring result.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.151","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0503","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"APRI (AST-to-Platelet Ratio Index) is another fibrosis screening score. At 0.151, well within the optimal range, this confirms the FIB-4 finding: there is no evidence of liver scarring.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-3.516","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3678","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD Fibrosis Score specifically screens for advanced fibrosis in people at risk of non-alcoholic fatty liver disease. It incorporates age, BMI, diabetes status, ALT, AST, platelets and albumin. At minus 3.516, Joseph's score is in the low-risk zone, confirming no evidence of advanced liver fibrosis despite his BMI of 33.","low_causes":"Healthy liver, young age, normal metabolic markers","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The De Ritis ratio compares AST to ALT and helps differentiate causes of liver enzyme elevation. At 1.15, Joseph's ratio is within the optimal range. A ratio above 2 can suggest alcoholic liver disease or cirrhosis; below 1 is more typical of fatty liver. His ratio is normal and does not suggest either pattern.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"rfactor","name":"R Factor","group":"LIVER & METABOLIC","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0540","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2000","units":"ratio","description":"The R factor helps distinguish between hepatocellular (liver cell) and cholestatic (bile duct) causes of liver enzyme elevation by comparing ALT to ALP. At 0.54, well within the optimal range, this confirms there is no significant hepatocellular or cholestatic pattern.","low_causes":"Normal liver function","high_causes":"Hepatocellular pattern of liver injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"kidneyassessment","name":"Kidney Assessment","group":"KIDNEY FUNCTION","result":"Working well","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Kidney function is normal. Cystatin C 0.93 gives an eGFR of 96. Creatinine 107.8 is mildly above range due to body size, not kidney impairment. Microalbumin not detected, urinalysis clear.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C, a marker that is independent of muscle mass, diet and body size. At 96, well above the optimal threshold of 90, this confirms that Joseph's kidneys are filtering normally. This is the more reliable eGFR estimate in a large man and is the reason the creatinine-based eGFR of 81 should not cause concern.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C for the most accurate estimate of kidney function. At 90, right at the optimal threshold, Joseph's combined eGFR confirms healthy kidney filtration.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio helps distinguish between causes of raised creatinine or urea. At 47, Joseph's ratio is within the optimal range, consistent with normal kidney function and no pre-renal causes of creatinine elevation.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"metabolicassessment","name":"Metabolic Assessment","group":"GLUCOSE & INSULIN","result":"Insulin resistance","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"HOMA-IR 2.26 (likely an underestimate) above the threshold of 2, with insulin 74.8 above optimal, adiponectin-to-insulin ratio 0.25 below range, and HOMA-B 175 showing pancreatic compensation. HbA1c 37 and fructosamine 234 confirm blood sugar is currently controlled, but the metabolic direction needs correction.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents what Joseph's blood sugar has averaged over the past two to three months. At 6.2, this is right at the optimal ceiling, confirming that blood sugar control has been adequate but not leaving much margin.","low_causes":"Low carbohydrate diet, high insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4273","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The triglyceride-glucose (TyG) index is a surrogate marker of insulin resistance calculated from fasting triglycerides and glucose. At 7.52, well within the optimal range, this adds another reassuring perspective to the metabolic picture: despite the HOMA-IR being above threshold, the TyG index is low because triglycerides are so low.","low_causes":"High insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4520","lower_normal":"","upper_normal":"2.5","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and insulin and estimates how resistant the body's cells are to insulin's action. A score above 2 suggests the cells are not responding efficiently to insulin, forcing the pancreas to produce more. At 2.26, Joseph's HOMA-IR is above the threshold of 2. Given that the glucose may have been artificially lowered by the sample handling delay, the true HOMA-IR is likely slightly higher still. This is an early insulin resistance signal at 31, entirely reversible with weight loss, dietary change and increased activity, but worth acting on now.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"175","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6071","lower_normal":"60","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"%","description":"HOMA-B estimates how hard the pancreatic beta cells are working to produce insulin. At 175, within the laboratory range but above the optimal ceiling of 150, this tells us the pancreas is compensating by producing more insulin than ideal to maintain blood sugar. The pancreas is currently coping, but this level of compensation is not sustainable indefinitely. Weight loss and dietary change will reduce the demand and bring this back toward the optimal range.","low_causes":"Beta cell exhaustion","high_causes":"Compensation for insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucoseinsulinratio","name":"Glucose:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"7.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8778","lower_normal":"4.5","upper_normal":"","lower_optimal":"7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7778","upper_optimal_position":"1.0000","units":"mg/dL per mIU/L","description":"The glucose-to-insulin ratio is another way to assess insulin sensitivity: a higher ratio means less insulin is needed per unit of glucose, which is better. At 7.9, just above the optimal threshold of 7, Joseph's ratio suggests insulin sensitivity is adequate but not far from the threshold below which the pancreas would be clearly overworking.","low_causes":"Insulin resistance","high_causes":"High insulin sensitivity, low insulin levels","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"adiponectininsulinratio","name":"Adiponectin:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"0.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"0.3","upper_normal":"","lower_optimal":"0.7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"1.0000","upper_optimal_position":"1.0000","units":"ratio","description":"The adiponectin-to-insulin ratio captures the balance between the protective adiponectin hormone and insulin demand. A higher ratio is better. At 0.25, below the lower limit of 0.3, Joseph's ratio is low, driven by his adiponectin of 2.65 being at the lower end and his insulin at 74.8 being above optimal. This reinforces the early insulin resistance signal. Adiponectin rises with weight loss and exercise, so this ratio is expected to improve with the lifestyle changes recommended in this report.","low_causes":"Low adiponectin with high insulin, metabolically unhealthy weight","high_causes":"Lean body composition, high insulin sensitivity","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"b12status","name":"B12 Status","group":"VITAMINS & NUTRIENTS","result":"Adequate","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_nor lements, this ratio would be expected to move into the optimal band.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tshft4ratio","name":"TSH:FT4 Ratio","group":"THYROID","result":"0.037","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0617","lower_normal":"","upper_normal":"0.3","lower_optimal":"","upper_optimal":"0.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"The TSH-to-FT4 ratio reflects the pituitary's response to circulating thyroid hormone. A very low ratio can suggest the pituitary is appropriately suppressing TSH because T4 is adequate or slightly high. At 0.037, this is low, consistent with the marginally elevated FT4 (likely from biotin interference) suppressing TSH appropriately. If FT4 normalises after pausing biotin, this ratio will increase.","low_causes":"High FT4, suppressed TSH, hyperthyroidism, biotin interference","high_causes":"Pituitary working harder to maintain thyroid output","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hormonalassessment","name":"Hormonal Assessment","group":"HORMONES","result":"Needs attention","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Testosterone 21.9 and free testosterone 0.459 are healthy. However, oestradiol 231 (limit 159), progesterone 1.33 (limit 0.47) and FSH 1.18 (limit 1.5) form a pattern of increased aromatase activity from adiposity and possible exogenous substance effect. GP review with full supplement and peptide disclosure recommended.","low_causes":"","high_causes":"","pad const data = REPORT_DATA;

  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  if(norm(dob.value)===norm(data.dob)){

    runIntro();

    gerr.style.display='block'; dob.classList.add('shake');

  }
}
