<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kim Thomson","dob":"16/01/1966","report_date":"2026-10-05","summary":"Kim is a 60-year-old female presenting with a BMI of 22.2, following a low-carb, high-protein diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). She trains four times per week (two cardio, two resistance) at moderate intensity, with 2,000 to 5,000 daily steps. She sleeps 7 to 8 hours but wakes tired most mornings, with an afternoon energy crash; stress feels hard to manage some weeks. She drinks 5 to 9 alcoholic drinks per week. She is on HRT and has a hormonal coil (IUS). Her cycle has stopped, consistent with perimenopause or menopause. She supplements with vitamin D, magnesium, omega-3 fish oil, protein powder and probiotics. She has had a previous blood test where everything was normal. She reports low energy and fatigue, brain fog, joint pain and stiffness, and palpitations or dizziness, and these symptoms have been present for as long as she can remember. Her goal is to improve long-term health and longevity.\n\nKim's PhenoAge is 45.7 years, which is 14.3 years younger than her calendar age of 60. This is an excellent result. PhenoAge is a composite score built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, and it estimates the biological age those markers collectively suggest. The gap here tells us that the body, at a cellular level, is ageing more slowly than the calendar would predict, and her low inflammatory markers, excellent blood sugar control and good kidney function are the main drivers of that favourable number.\n\nHer cardiovascular risk score, however, is 50 out of 100, which is above the 40 threshold and above the ideal target of 20 or below. This score is built from ApoB, LDL cholesterol, HDL cholesterol, triglycerides, Lp(a), high-sensitivity CRP and HbA1c, and it measures the cardiovascular risk being accumulated right now, not a ten-year event probability. In Kim's case, the score is being driven almost entirely by her Lp(a) and, to a lesser degree, by her ApoB and LDL cholesterol. The important context is that most of the modifiable components of this score are either excellent or close to it, and the single largest contributor, Lp(a), cannot be changed by lifestyle or conventional medication. This is explored further below.\n\nThere is a great deal to feel reassured about in this report. Kim's blood sugar control is genuinely impressive. Her fasting glucose is 4.4, comfortably inside the ideal range of 4.0 to 5.4, and her HbA1c, which is a measure of average blood sugar over the past three months, is 35 mmol/mol, below the optimal threshold of 36 and well clear of the pre-diabetic boundary of 42. Her fasting insulin is 2.72, which is at the very bottom of the laboratory range and reflects a pancreas that barely needs to produce any insulin to keep blood sugar controlled. Her HOMA-IR, which is a calculation combining fasting glucose and insulin to estimate insulin resistance, is 0.53, meaning she is highly insulin sensitive. For a 60-year-old, this metabolic profile is outstanding and suggests the low-carb, high-protein approach is working exceptionally well for blood sugar regulation.\n\nHer kidney function is excellent. Her cystatin C is 0.85, well within range, giving a cystatin C-based eGFR of 94 and a combined eGFR of 94, both above the optimal threshold of 90. Cystatin C is a more reliable measure of kidney filtration than creatinine alone because it is not affected by muscle mass, diet or body size, and at 94 the kidneys are filtering at exactly the rate expected for a healthy adult, with no decline for age. Her urea, creatinine and electrolytes are all within their ideal ranges, and her uric acid at 267 is comfortably within the female optimal range of 160 to 320.\n\nHer liver is in excellent health. ALT at 17 and AST at 17 are both well within optimal ranges, and her GGT at 24 is below the optimal threshold of 25, suggesting the liver is under no metabolic strain. Her FIB-4 score, which combines age, platelet count and liver enzymes to screen for liver scarring, is 1.07, comfortably below both the general threshold of 1.45 and the over-65 threshold of 2.0. Her APRI score is 0.183 and her NAFLD fibrosis score is minus 1.833, both of which confirm there is no evidence of fatty liver disease or fibrosis. The De Ritis ratio, the ratio of AST to ALT, is 1.0, right in the middle of the optimal band. Despite 5 to 9 alcoholic drinks per week, the liver is showing no visible strain at all, and the GGT just inside optimal is particularly reassuring because GGT is the marker most sensitive to alcohol exposure.\n\nHer thyroid is working well. TSH at 0.9 is within the optimal range of 1.0 to 2.5 (marginally below the lower optimal bound but perfectly within the laboratory range and not suppressed), FT4 at 16.8 is within the optimal range of 14 to 20, and FT3 at 4.5 sits exactly at the lower edge of the optimal range. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease as a cause of her fatigue or brain fog. The FT3 to FT4 ratio is 0.268, just at the lower edge of the optimal band of 0.27 to 0.40, which means the thyroid is converting its storage hormone (T4) into its active hormone (T3) adequately but not generously. This is not a clinical concern but it is worth noting: T3 is the hormone that directly drives energy, metabolism and mental clarity, and hers sits at the lower boundary of ideal rather than in the middle of it.\n\nHer inflammation is low. High-sensitivity CRP, a marker of systemic inflammation, is 0.5, which is below the optimal threshold of 1.0 and tells us there is very little inflammatory activity in the body. Her ESR, another measure of inflammation, is 6, well within its range of under 12. The systemic immune-inflammation index is 338, within the optimal band, and the platelet-to-lymphocyte ratio is 160, right at the upper edge of optimal. These are reassuring findings given her report of joint pain and stiffness, because they tell us the joints are not producing measurable systemic inflammation.\n\nHer tumour markers are all clear. CA125, which screens for ovarian pathology, is 8.1 against a limit of 24. CA15-3, which screens for breast pathology, is 7.59 against a limit of 30. CA19-9 is 22.38 against a limit of 37, and CEA is 0.82 against a limit of 2.3. None of these require any further investigation.\n\nHer immune system is well balanced. IgG, IgA and IgM are all within their respective ranges, and IgE at 97.5 is just inside its upper limit of 100. Rheumatoid factor is less than 4, negative, which combined with the low CRP and ESR makes an inflammatory arthritis unlikely as the explanation for her joint symptoms. Her coeliac screen, tissue transglutaminase IgA, is negative, ruling out coeliac disease.\n\nHer urinalysis is clean across the board. No protein, no glucose, no blood, no white cells, no nitrites, no casts, and the culture showed insignificant growth. This is exactly what a healthy result looks like.\n\nHer total antioxidant activity at 1.77 is right at the upper limit of its range, which is a genuinely good result and likely reflects her omega-3 supplementation and the antioxidant content of the vegetables and fruit she does eat.\n\nNow to the findings that need attention, starting with the most important.\n\nHer lipoprotein(a), written Lp(a), is 75.38 nmol/L, above the normal threshold of 32. Lp(a) is a specialised lipoprotein particle that carries cholesterol into artery walls, encourages blood clot formation, and drives local inflammation. What makes it different from LDL cholesterol is that it is almost entirely genetically determined: no amount of diet change, exercise or conventional cholesterol-lowering medication will move it. The level Kim has, 75.38, places her in the slightly increased risk category (32 to 90), and it is a permanent piece of her medical record. We would recommend that this result is recorded with her GP and that first-degree relatives, her children and siblings, are offered Lp(a) testing, because the trait is inherited and identifying it early allows for more aggressive management of the risk factors that can be changed.\n\nThe reason this matters is that Lp(a) changes the way we read the rest of her lipid panel. Her total cholesterol at 5.6 is above the desirable threshold of 5.18, her LDL cholesterol at 3.08 is marginally above the laboratory upper limit of 3.0, and her ApoB, which counts the number of cholesterol-carrying particles in the blood and is the best single predictor of cardiovascular risk, is 1.03, above the desirable threshold of 0.9. At first glance this looks like a straightforward lipid elevation. But when we correct for Lp(a), her Lp(a)-corrected LDL drops to 2.84, which is within the laboratory range of under 3.0, meaning a meaningful portion of her measured LDL is actually Lp(a) particles rather than conventional LDL. The modifiable LDL, the portion that diet, exercise and medication can reach, is lower than the headline number suggests.\n\nThe excellent news within her lipid panel is her HDL cholesterol. At 2.1, this is well above the desirable threshold of 1.55 and above the optimal threshold of 1.6 for a woman. HDL particles remove cholesterol from artery walls and transport it back to the liver for disposal, and 2.1 is an exceptionally strong result. Her apolipoprotein A1, the protein that builds HDL particles, is 1.98, also excellent. Her ApoB to ApoA1 ratio is 0.52, below the lower risk threshold of 0.6, which means the balance between particles depositing cholesterol and particles removing it is favourable. Her triglycerides at 1.05 are within the laboratory fasting range and within the optimal band of under 1.0 only marginally, and her TG to HDL ratio is 0.50, well within the optimal range of under 0.87. Her atherogenic index of plasma is minus 0.301, in the optimal zone, and her Castelli II ratio is 1.47, also well within optimal.\n\nSo the lipid picture is nuanced. The modifiable components, HDL, triglycerides, the ratios, are all excellent, and the low-carb approach is clearly contributing to that. The ApoB at 1.03 is the one modifiable marker that sits above target, and given the inherited Lp(a) burden, it would be worth discussing with her GP whether there is a role for targeted lipid-lowering alongside the lifestyle measures she is already taking. Even a modest reduction in ApoB towards 0.8 or below would bring her modifiable risk right down.\n\nHer hormonal picture reflects her HRT and hormonal coil. Her oestradiol is 445 pmol/L, which is well above the postmenopausal range of 0 to 118.2 and sits within the follicular phase range, confirming that her HRT is delivering oestrogen effectively. Her FSH at 15.19 is below the postmenopausal range of 23 to 116.3, and her LH at 16.21 sits right at the upper edge of the luteal range, both of which suggest the HRT is partially suppressing the gonadotropin feedback loop, which is expected when exogenous oestrogen is provided. Her progesterone at 0.49 is within the postmenopausal range, consistent with the hormonal coil providing local progestogen rather than systemic levels. Her testosterone at 0.9 is within the female range of 0.5 to 2.6, and her free testosterone at 0.01 nmol/L sits at the very bottom of the laboratory range of 0.01 to 0.25. Her bioavailable testosterone, which accounts for the portion not bound tightly to sex hormone binding globulin (SHBG), is 0.21, within the optimal range. Her SHBG at 67.7 is within range but on the higher side, which is common on HRT and with moderate alcohol intake, and is the reason her free testosterone is at the floor. Low free testosterone in a postmenopausal woman can contribute to reduced energy, reduced libido, difficulty building muscle, and brain fog, all of which Kim reports. This is worth discussing with her HRT prescriber, as some clinicians consider adding low-dose testosterone when free testosterone is at the bottom of range and symptoms persist despite adequate oestrogen replacement. Her DHEA-S at 1.7 umol/L (626.5 ug/dL) is within range and her cortisol at 270 is within the expected morning range, with no suggestion of adrenal dysfunction. Her prolactin at 179 is within the non-pregnant range.\n\nHer C-peptide is 0.652 ug/L, below the laboratory range of 1.1 to 4.4. C-peptide is produced by the pancreas in equal amounts to insulin and acts as a more stable measure of how much insulin the pancreas is making. In Kim's case, her fasting glucose and HbA1c are both excellent, and her fasting insulin is 2.72, at the bottom of range, meaning the pancreas is producing very little insulin because very little is needed. This is the hallmark of a highly insulin-sensitive person on a low-carbohydrate diet, and the low C-peptide is a consequence of low insulin demand rather than a sign of pancreatic failure. Her HOMA-B, which estimates beta cell function, would be calculated as (20 x 2.72) / (4.4 minus 3.5) = 60.4, below the laboratory range of 80 to 200, which reinforces the same story: the pancreas is idling because the diet does not challenge it. This is not a concern when glucose and HbA1c are both optimal.\n\nHer vitamin D at 68 nmol/L is sufficient by NHS standards (above 50) but below the optimal range of 75 to 120 that is associated with the best outcomes for bone health, immune function and energy. Given that she is already supplementing, this suggests her current dose may be too low or she may not be taking it consistently with a fat-containing meal, which is required for absorption. A modest increase in dose should bring this into the optimal zone over the winter months.\n\nHer folate at 7 ng/mL is within the laboratory range of 3 to 17 but below the optimal threshold of 8. Folate is a B vitamin essential for DNA repair, red blood cell production and the conversion of homocysteine, and at 7 it is doing its job but could be higher. This is likely a reflection of eating only 2 to 3 portions of vegetables and fruit per day, as leafy greens, legumes and cruciferous vegetables are the main dietary sources. Increasing vegetable portions to 4 or 5 per day would be the most natural way to raise this.\n\nHer B12 at 460 pg/mL is within the laboratory range but below the optimal band of 500 to 900. B12 is essential for nerve function, energy production and red blood cell formation, and given her symptoms of fatigue, brain fog and the low reticulocyte count discussed below, optimising B12 towards 500 or above would be worthwhile.\n\nHer white cell count at 3.98 is fractionally below the lower limit of 4.0. Her neutrophils at 2.11 are just above their lower limit of 2.0, and her lymphocytes, monocytes, eosinophils and basophils are all within range. A white cell count marginally below range in a lean, 60-year-old woman with no infections and no medications that suppress immunity is most commonly benign ethnic or constitutional neutropenia, a normal variant where the resting white cell count runs slightly below the laboratory threshold without any increased infection risk. The fact that her CRP and ESR are both low and she has no symptoms of recurrent infections is reassuring. This does not need GP referral but is worth noting on her record so that future tests are interpreted in context.\n\nHer absolute reticulocyte count is 39.52, below the range of 50 to 100. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count means the marrow is producing fewer new red cells than expected. Her haemoglobin at 122 is within range but at the lower end (range 120 to 150), her haematocrit at 0.359 is fractionally below the lower limit of 0.36, and her red blood cell count at 3.8 is at the very bottom of its range. Taken together, these suggest the bone marrow is producing red cells at a slightly reduced pace. Her iron studies do not explain this: ferritin is 89, well within optimal, transferrin saturation is 40.16%, right at the top of the optimal band, and serum iron is 23.6, healthy. The most likely explanations at 60 are a combination of age-related slowing of marrow output and the marginally suboptimal B12 and folate, both of which are essential raw materials for red cell production. Optimising both should gently lift the reticulocyte count and haemoglobin over the coming months.\n\nHer transferrin at 2.34 is marginally below the lower limit of 2.5. Transferrin is the protein that carries iron through the bloodstream to the bone marrow. When iron stores are adequate (ferritin 89) and saturation is good (40%), the liver reduces transferrin production because less transport capacity is needed. This is a physiological response to adequate iron stores rather than a sign of disease. However, transferrin is also a negative acute phase reactant, meaning inflammation can suppress it, but with a CRP of 0.5 and ESR of 6 there is no inflammation to drive that here. The most likely explanation is simply that the body has enough iron and is dialling down its transport machinery accordingly.\n\nHer alkaline phosphatase (ALP) at 41 is below the laboratory range of 46 to 116. ALP is an enzyme found in bone, liver and bile ducts, and mildly low levels are relatively common in postmenopausal women on HRT, because oestrogen replacement reduces bone turnover, which in turn reduces the bone fraction of ALP. With her corrected calcium at 2.38, phosphate at 1.6 and PTH at 3.1 all within their respective ranges, there is no suggestion of a bone or parathyroid disorder. This is a benign finding driven by her HRT.\n\nHer MCH at 32.1 is marginally above the upper limit of 32. MCH measures the average amount of haemoglobin packed into each red blood cell. When MCV (cell size) is at the upper end of normal at 94.6, as it is here, MCH tends to track with it because larger cells carry more haemoglobin. This is not a concern in isolation and fits with the mildly suboptimal B12 and folate picture, as both nutrients influence cell size.\n\nHer IgE at 97.5 is just within its upper limit of 100. IgE is the antibody class associated with allergic responses. At this level, right at the boundary, it does not indicate a specific allergy but does suggest the immune system has a mild allergic tendency. If Kim has hay fever, eczema or any unexplained skin reactions, this would be consistent. It does not need investigation unless symptoms develop.\n\nNow to the symptoms that brought Kim to testing: fatigue, brain fog, joint pain, and palpitations or dizziness, all of which she describes as having been present always. The bloods have positively excluded several important causes. Her thyroid is working well with negative antibodies. She is not anaemic, though her haemoglobin is at the lower end and her reticulocytes are low. Her blood sugar and insulin are excellent. Her inflammation is low, making an inflammatory cause of the joint pain and fatigue unlikely. Her liver and kidneys are healthy. Her iron stores are adequate. Her cortisol is normal. Her coeliac screen is negative.\n\nWhat the bloods do suggest is a combination of factors that, individually, are each only mildly suboptimal but together could contribute to the symptom picture. Her free testosterone at the floor may be contributing to the fatigue, brain fog and joint stiffness, as testosterone supports energy, cognitive sharpness and joint integrity in women as well as men. Her FT3 at the lower edge of optimal means the most metabolically active thyroid hormone is not generous, which can contribute to afternoon energy dips and mental slugginess. Her vitamin D below optimal, her folate below optimal and her B12 below optimal are three nutritional factors that each independently affect energy and cognitive function. And her reticulocytes being low means the blood is carrying slightly less oxygen capacity than it could, which at the margin contributes to fatigue.\n\nBeyond the blood results, her lifestyle quiz points to several contributors that blood cannot measure. She is sleeping 7 to 8 hours, which is adequate, but waking tired most mornings, which suggests the sleep quality may be poor even if the duration is reasonable. This could reflect the hormonal transition, alcohol's effect on sleep architecture (even moderate alcohol disrupts deep sleep and REM sleep), or a sleep environment issue such as room temperature, light or screen exposure before bed. Her afternoon crash pattern is classic for a cortisol rhythm that peaks in the morning and drops too steeply by mid-afternoon, and this can be worsened by a meal that is too light at lunch or by caffeine dependency wearing off. Her step count of 2,000 to 5,000 is below the threshold associated with the best energy and mood outcomes; even 7,000 to 8,000 steps per day has been shown to significantly reduce fatigue and improve afternoon energy in people over 50. The palpitations and dizziness she reports could relate to her relatively low blood pressure (which this panel does not measure), to the hormonal transition, or to dehydration, and would be worth mentioning to her GP to rule out a cardiac rhythm issue with a simple ECG if she has not had one recently.\n\nIn summary, Kim's metabolic health is exceptional for her age, her PhenoAge is 14 years younger than her calendar age, and the majority of her results are within or very close to their optimal ranges. The findings that need action are her Lp(a), which is inherited and should go on her permanent medical record; her ApoB, which is the one modifiable cardiovascular marker above target; her free testosterone at the floor, which her HRT prescriber should review; her vitamin D, B12 and folate, which are all just below optimal and should respond to targeted supplementation and increased vegetable intake; and her mildly low reticulocyte count and haematocrit, which are most likely to improve once the nutritional factors are optimised.","links":"The central thread in Kim's results is a woman whose metabolic engine is running efficiently but whose cardiovascular risk profile carries an inherited burden that cannot be changed, and whose symptoms appear to be driven more by the hormonal transition and marginal nutritional shortfalls than by any single disease process.\n\nHer outstanding insulin sensitivity, with a HOMA-IR of 0.53 and a fasting insulin of 2.72, explains why her C-peptide is below range and her HOMA-B would calculate below the standard threshold. These are not signs of pancreatic failure; they are signs of a pancreas that has very little work to do. The low-carb, high-protein diet is the likely driver, and this pattern is entirely benign when glucose and HbA1c are both optimal, as they are here.\n\nHer lipid profile tells two distinct stories. The modifiable components, HDL, triglycerides, the atherogenic ratios, are all excellent and suggest a woman whose diet and lifestyle are protecting her arteries well. But layered on top of that is an inherited Lp(a) of 75.38 that inflates her measured LDL, pushes her ApoB above target, and elevates her cardiovascular risk score to 50 out of 100. The Lp(a)-corrected LDL of 2.84 shows that once the Lp(a) contribution is removed, her conventional LDL is within the laboratory range. The ApoB at 1.03, however, still reflects real particle burden, because Lp(a) particles carry ApoB just as LDL particles do, and each one can deposit cholesterol in artery walls. The clinical question for her GP is whether the combination of an unchangeable Lp(a) and a mildly elevated ApoB, in a woman with otherwise excellent risk factors, warrants pharmacological intervention to bring modifiable ApoB as low as possible.\n\nHer symptom picture, fatigue, brain fog, afternoon crash, joint stiffness, and palpitations, is not explained by any single abnormal result. Instead, several sub-optimal findings converge. Free testosterone at the absolute floor (0.01 nmol/L) in a postmenopausal woman on HRT is associated with reduced energy, impaired concentration and joint discomfort. FT3 at 4.5, just at the lower edge of optimal, means the most metabolically active thyroid hormone is providing adequate but not generous drive. Vitamin D at 68, B12 at 460 and folate at 7 are all functional but below the levels associated with best energy and cognitive performance. And reticulocytes at 39.52 with a haemoglobin of 122 mean the oxygen-carrying capacity of the blood, while not anaemic, is not at its strongest.\n\nWhat the bloods have excluded is equally important. There is no autoimmune thyroid disease (both antibodies negative), no coeliac disease (tTG negative), no systemic inflammation (CRP 0.5, ESR 6), no iron deficiency (ferritin 89, saturation 40%), no liver or kidney dysfunction, no diabetes or insulin resistance, and no elevated tumour markers. The joint pain in the absence of rheumatoid factor, raised CRP or raised ESR is unlikely to be inflammatory arthritis and is more consistent with the mechanical and hormonal joint changes that accompany the menopausal transition, compounded by relatively low daily movement.\n\nThe loose end is the palpitations and dizziness. Nothing in this blood panel specifically explains either. In a lean 60-year-old on HRT, the most common causes would be ectopic beats (which are usually benign), low blood pressure, dehydration, or the hormonal fluctuations of the transition itself. An ECG and a lying-to-standing blood pressure check with her GP would be the proportionate next step to rule out anything structural.","lifestyle":"Add a fourth or fifth portion of vegetables to your day, ideally leafy greens like spinach, kale or broccoli with your evening meal. Anchor: when you plate up dinner, greens go on first before anything else. Why: your folate at 7 is just below optimal, and leafy greens are the richest dietary source of folate, which supports red blood cell production and energy.\n\nIncrease your daily steps to at least 7,000 by adding a 20-minute walk after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: post-meal walking improves afternoon energy (directly targeting your afternoon crash), supports cardiovascular health, and at your current 2,000 to 5,000 steps there is a large evidence-based gain from this single change.\n\nSet a caffeine cut-off at midday. Any coffee or tea after 12pm switches to decaf or herbal. Anchor: set an alarm on your phone at noon as a reminder. Why: caffeine has a half-life of 5 to 6 hours, meaning afternoon caffeine is still active at bedtime and disrupts the deep sleep stages that determine whether you wake refreshed or tired.\n\nKeep your two resistance sessions per week and aim to progressively increase the weight or difficulty every two to three weeks. Anchor: same days, same time, non-negotiable. Why: resistance training is the single most effective intervention for joint stiffness, bone density and maintaining muscle in postmenopausal women, and with testosterone at the floor your muscles need the stimulus more than ever.\n\nLimit alcohol to no more than 4 drinks per week, ideally with at least 3 alcohol-free days in a row. Anchor: decide at the start of each week which 2 evenings will include a drink. Why: even moderate alcohol suppresses deep sleep and REM sleep, which is the most likely reason you sleep 7 to 8 hours but still wake tired, and reducing intake is the most direct way to improve morning energy.\n\nTake your vitamin D supplement with your largest fat-containing meal rather than on an empty stomach. Anchor: keep the bottle next to your plate or in the kitchen where you eat. Why: vitamin D is fat-soluble and absorption roughly doubles when taken with dietary fat, and at 68 your current approach is not quite getting you into the optimal zone of 75 to 120.\n\nGet outside within the first hour of waking, even for 5 minutes, without sunglasses. Anchor: step outside when you boil the kettle for your first drink. Why: morning daylight resets the cortisol awakening response and the circadian clock, which directly addresses both the tired-on-waking feeling and the afternoon crash pattern you describe.\n\nCalorie and protein targets: at 65 kg, 171 cm, age 60, moderately active, your estimated maintenance is approximately 1,800 to 1,950 kcal per day. Your protein target should be at least 85 to 100 g per day (1.3 to 1.6 g/kg), spread across three meals. Your protein powder supplementation is a good tool to hit this, especially around training days. For your goal of long-term health and longevity at a healthy BMI of 22.2, there is no need for a calorie deficit; the focus is on nutrient density and hitting the protein floor consistently.","flags":"Lipoprotein(a) 75.38 nmol/L (limit under 32). Inherited, genetically fixed cardiovascular risk factor in the slightly increased risk category. Should be recorded permanently in her medical notes. First-degree relatives should be offered Lp(a) testing.\n\nApolipoprotein B 1.03 g/L (target under 0.9). The single best measure of atherogenic particle number. Mildly elevated and partially driven by Lp(a) particles. Lp(a)-corrected LDL is 2.84, within range. Discussion with GP regarding whether targeted lipid-lowering therapy is warranted given the inherited Lp(a) burden.\n\nLDL cholesterol 3.08 mmol/L (range upper limit 3.0), total cholesterol 5.6 mmol/L (desirable under 5.18). Marginally elevated, with a meaningful portion attributable to Lp(a). HDL 2.1 is excellent; all ratios are favourable. The modifiable fraction of LDL is close to target.\n\nCardiovascular Risk Score 50/100 (target under 40, ideal under 20). Driven primarily by Lp(a) and secondarily by ApoB. Modifiable components (HDL, triglycerides, HbA1c, CRP) are all excellent.\n\nFree testosterone (calculated) 0.01 nmol/L, at the absolute floor of the range 0.01 to 0.25. SHBG 67.7 is within range but on the higher side, binding most of the available testosterone. May be contributing to fatigue, brain fog and joint symptoms. Worth discussing with HRT prescriber regarding possible testosterone supplementation.\n\nC-Peptide 0.652 ug/L (range 1.1 to 4.4, below range). In context of fasting glucose 4.4, HbA1c 35 and insulin 2.72, this reflects very low insulin demand on a low-carb diet rather than pancreatic insufficiency. No action required but noted for record.\n\nVitamin D 68 nmol/L (sufficient but below optimal range of 75 to 120). Currently supplementing; dose increase recommended.\n\nFolate 7 ng/mL (range 3 to 17, below optimal threshold of 8). Likely related to low vegetable intake. May be contributing to the low reticulocyte count.\n\nVitamin B12 460 pg/mL (range 193 to 982, below optimal of 500 to 900). Supplementation recommended to support red cell production and energy.\n\nReticulocytes absolute 39.52 x10^9/L (range 50 to 100). Low output of new red blood cells, most likely driven by suboptimal B12 and folate rather than marrow pathology. Haemoglobin 122 (in range but lower end), haematocrit 0.359 (fractionally below 0.36), RBC 3.8 (at the floor of range).\n\nWhite cell count 3.98 x10^9/L (range 4 to 10), neutrophils 2.11 (range 2 to 7). Fractionally below range. Most likely benign constitutional variation in a lean 60-year-old with no infections and low CRP. Note on record for future reference.\n\nTransferrin 2.34 g/L (range 2.5 to 3.8). Marginally below range. Reflects adequate iron stores (ferritin 89, saturation 40%) reducing the need for iron transport protein. Not pathological.\n\nAlkaline phosphatase 41 IU/L (range 46 to 116). Mildly below range. Consistent with reduced bone turnover from HRT-mediated oestrogen replacement. Calcium, phosphate and PTH all normal.\n\nMCH 32.1 pg (range 27 to 32). Marginally above upper limit. Consistent with MCV at upper end of range. Not clinically significant in isolation.\n\nReassuring negatives: thyroid function normal with negative antibodies; coeliac screen negative; rheumatoid factor negative; CRP and ESR both low; fasting glucose and HbA1c optimal; HOMA-IR 0.53 (highly insulin sensitive); liver enzymes, FIB-4, APRI and NAFLD fibrosis score all normal; kidney function excellent (combined eGFR 94); ferritin and iron saturation optimal; all tumour markers (CA125, CA15-3, CA19-9, CEA) within range; urinalysis clean; immunoglobulins balanced; cortisol normal.","recommendations":"Record Lp(a) at 75.38 nmol/L permanently in her medical notes and discuss whether the combination of inherited Lp(a) and ApoB at 1.03 warrants pharmacological lipid-lowering to bring modifiable ApoB below 0.8, particularly given the cardiovascular risk score of 50.\n\nRefer first-degree relatives (children, siblings) for Lp(a) testing, as the trait is inherited and early identification allows proactive risk management.\n\nDiscuss with her HRT prescriber whether low-dose testosterone supplementation is appropriate, given free testosterone at 0.01 nmol/L (floor of range) alongside persistent fatigue, brain fog and joint stiffness despite adequate oestrogen replacement (oestradiol 445).\n\nConsider an ECG and lying-to-standing blood pressure check to investigate the palpitations and dizziness she reports, given that the blood panel does not explain these symptoms.\n\nRetest in 6 months with a focused panel: full blood count (to confirm reticulocyte count improves), vitamin D, B12, folate, and a lipid panel including ApoB. If lipid-lowering therapy is started, retest lipids at 3 months to assess response.\n\nCalorie target: approximately 1,800 to 1,950 kcal/day at maintenance. Protein target: 85 to 100 g per day (1.3 to 1.6 g/kg). No weight loss indicated at BMI 22.2; the priority is nutrient density and hitting the protein and micronutrient floors consistently.","supplementation":"Vitamin D3 (cholecalciferol): increase to 3,000 to 4,000 IU daily, taken with your largest fat-containing meal. Your current level of 68 nmol/L is below the optimal range of 75 to 120, and the increase should bring you into the optimal zone over the next three to four months, particularly through the winter.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken at the same time as your vitamin D. K2 directs calcium into bone and away from artery walls, and should always accompany vitamin D supplementation, especially in a postmenopausal woman where bone density is a priority.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Your B12 at 460 is below the optimal threshold of 500, and sublingual methylcobalamin bypasses any absorption issues in the gut and is the most effective form for raising levels.\n\nFolate (methylfolate): 400 to 800 mcg daily. Your folate at 7 is below the optimal threshold of 8, and while increasing vegetable intake is the primary strategy, a methylfolate supplement will provide a reliable baseline while dietary changes take effect. Methylfolate is the active form and does not require conversion.\n\nMagnesium (glycinate): continue at 300 to 400 mg before bed. Your magnesium at 0.87 is within the optimal range of 0.85 to 1.05, so the current supplementation is working. Magnesium glycinate also supports sleep quality, which is relevant given your tired-on-waking pattern.\n\nOmega-3 (fish oil): continue at 2 to 3 g of combined EPA and DHA daily with food. Your triglycerides are already good at 1.05, but omega-3 supports cardiovascular health and has anti-inflammatory benefits for joint stiffness, and given the inherited Lp(a) burden, maintaining optimal omega-3 status is a sensible long-term strategy.\n\nDo not take iron supplements. Your ferritin is 89 and your transferrin saturation is 40%, both in the optimal range. Additional iron is unnecessary and could push saturation above the desirable level.\n\nThe most important changes from this report are not supplements. They are increasing daily steps to at least 7,000, adding more vegetables for folate, reducing alcohol to improve sleep quality, and discussing testosterone and Lp(a) management with her medical team.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5909","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 65 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 64.9. Weakest systems: lipids & cardiovascular 28%, glucose & insulin 59%, hematology 61%. Biggest drags: Lipoprotein(a), Apolipoprotein B, C-Peptide, LDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"45.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3515","lower_normal":"","upper_normal":"65","lower_optimal":"","upper_optimal":"60","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4615","units":"years","description":"PhenoAge is a biological age estimate calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Kim's PhenoAge is 45.7, which is 14.3 years younger than her calendar age of 60. This is an excellent result and reflects her low inflammation (CRP 0.5), excellent blood sugar control (glucose 4.4), healthy kidney function (creatinine 67), and well-maintained blood cell parameters. The lifestyle changes recommended in this report, particularly increasing daily movement and optimising B12 and folate, should help maintain or even improve this favourable biological age gap.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL cholesterol, HDL cholesterol, triglycerides, Lp(a), high-sensitivity CRP and HbA1c. It measures the cardiovascular risk being accumulated right now, not a ten-year event probability, and has no age term. Kim's score of 50 is above the threshold of 40 and above the ideal target of 20. The score is driven primarily by her inherited Lp(a) at 75.38 and her ApoB at 1.03, while most of the modifiable components (HDL, triglycerides, CRP, HbA1c) are excellent. The gap between this score and the ideal reflects the Lp(a) burden, which cannot be changed by lifestyle, and the modest ApoB elevation, which can.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6093","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. Kim's result of 4.4 is comfortably within the optimal range of 4.0 to 5.4, indicating excellent blood sugar control. On a low-carb, high-protein diet, this is exactly what we would expect: the body is maintaining glucose in the ideal zone without needing to produce much insulin. This is one of the strongest results in the report and, alongside her HbA1c and insulin, confirms she has no insulin resistance or glucose dysregulation.","low_causes":"Fasting, excessive insulin, adrenal insufficiency, liver disease","high_causes":"Diabetes, insulin resistance, stress, infection, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c percentage is another way of expressing the same glycated haemoglobin measurement, where values below 6.0% are considered normal. Kim's 5.4% is well within the normal range and consistent with her excellent glucose control. This confirms there is no pre-diabetes or diabetes.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has become glycated, meaning sugar has attached to it, over the past two to three months. It gives a reliable picture of average blood sugar control over that period. Kim's result of 35 is below the optimal threshold of 36 and well clear of the pre-diabetic boundary of 42, confirming excellent long-term glucose management. This is an outstanding result at 60.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, iron deficiency, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3387","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3963","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Kim's result of 2.72 is at the very bottom of the laboratory range and well within the optimal range of 2 to 8, meaning her pancreas barely needs to work to maintain excellent glucose levels. This is the hallmark of high insulin sensitivity and is one of the most protective metabolic markers in the report. On a low-carb diet, the insulin demand is naturally very low, and this result confirms the dietary approach is working exceptionally well.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.652","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2325","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts to insulin. Because it is more stable in the blood than insulin, it gives a reliable measure of how much insulin the pancreas is actually producing. Kim's result of 0.652 is below the laboratory range of 1.1 to 4.4 (equivalent to approximately 216 pmol/L). In the context of a fasting glucose of 4.4, HbA1c of 35 and a fasting insulin of 2.72, this below-range result reflects the very low insulin demand of a highly insulin-sensitive person on a low-carbohydrate diet. The pancreas is producing little insulin because little is needed. This is not a sign of pancreatic failure and does not require investigation.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, fasting","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4214","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate daily average blood sugar. Kim's estimated average glucose of 5.9 mmol/L is within the optimal range, consistent with her excellent HbA1c of 35. This confirms her blood sugar has been well controlled over the past two to three months.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4665","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose to provide an alternative estimate of insulin resistance. Kim's TyG index of 8.21 is within the optimal range of under 8.5, consistent with her excellent insulin sensitivity as shown by HOMA-IR.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"122","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Kim's result of 122 is within the laboratory range of 120 to 150 but at the lower end, sitting just below the optimal band of 125 to 145. She is not anaemic, but the oxygen-carrying capacity of her blood is not at its strongest. Combined with the low reticulocyte count and the borderline haematocrit, this suggests the bone marrow is producing red cells at a slightly reduced pace, most likely due to the marginally suboptimal B12 and folate levels.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow suppression, blood loss","high_causes":"Dehydration, polycythaemia, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333333333","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"Red blood cell count measures the total number of red blood cells circulating in the blood. Kim's result of 3.8 is at the very bottom of the laboratory range. While technically within range, it is below the optimal band of 4.0 to 4.6 and is consistent with the low reticulocyte count and borderline haematocrit, suggesting the bone marrow is producing red cells at a slightly reduced rate. Optimising B12 and folate should support improved red cell production.","low_causes":"B12 or folate deficiency, iron deficiency, bone marrow suppression, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.359","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Kim's result of 0.359 is fractionally below the lower limit of 0.36, by a margin of 0.001. This is clinically insignificant in isolation and consistent with her red cell count being at the floor of its range and her reticulocytes being slightly low. It is not anaemia, and the most likely explanation is the mildly reduced bone marrow output discussed elsewhere in this report.","low_causes":"Anaemia, B12 or folate deficiency, overhydration, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"12.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6250","units":"%","description":"RDW measures the variation in size of red blood cells. A higher number means more variation, which can indicate nutritional deficiencies or bone marrow issues. Kim's result of 12.1 is within the optimal range, meaning her red blood cells are uniform in size, which is reassuring and argues against a significant B12 or folate deficiency causing marked changes to cell production.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"94.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5481","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of red blood cells. Kim's result of 94.6 is within the optimal range of 84 to 98, indicating her red blood cells are a normal size. This is reassuring, as B12 or folate deficiency typically causes cells to become larger (macrocytic). The fact that MCV is normal despite B12 and folate being marginally suboptimal suggests the deficiency is mild and has not yet affected red cell size.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism, reticulocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"32.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6753","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6567","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. Kim's result of 32.1 is marginally above the upper limit of 32 by just 0.1 pg. When MCV (cell size) is at the upper end of normal at 94.6, MCH tracks with it because larger cells carry slightly more haemoglobin. This is not clinically significant and does not require investigation.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"340","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6666666667","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. Kim's result of 340 is within the optimal range of 320 to 345, meaning the haemoglobin is packed at a healthy density within her red cells.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"232","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4385","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5949","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot when needed. Kim's result of 232 is within the optimal range, indicating healthy platelet production and no clotting or bleeding risk.","low_causes":"Bone marrow suppression, viral infections, autoimmune conditions, medications, liver disease","high_causes":"Infection, inflammation, iron deficiency, surgery, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6444","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Kim's result of 9.9 is within the optimal range, indicating normal platelet production. Larger platelets can sometimes indicate the bone marrow is working harder to produce them, but at 9.9 there is no concern.","low_causes":"Bone marrow suppression, inflammatory conditions","high_causes":"Platelet destruction, immune thrombocytopenia, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's defence force. Kim's total count of 3.98 is fractionally below the lower limit of 4.0, by a margin of just 0.02. In a lean, healthy 60-year-old woman with no symptoms of recurrent infections and with a CRP of 0.5 and ESR of 6, this is most likely a normal variant called benign constitutional leucopenia, where the resting white cell count sits just below the laboratory threshold. All of the individual white cell types (neutrophils, lymphocytes, monocytes, eosinophils and basophils) are within their own ranges. This should be noted on her records so that future tests are interpreted in context but does not need GP referral.","low_causes":"Benign constitutional variation, viral infections, bone marrow suppression, medications, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3553","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and are the first responders to bacterial infections. Kim's result of 2.11 is within the laboratory range of 2 to 7 but below the optimal band of 2.5 to 5, sitting near the lower end. This is consistent with her overal
