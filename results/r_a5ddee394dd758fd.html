g":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4533","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"0.8","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood and energy. Kim's result of 68 is sufficient by NHS standards (above 50) but below the optimal range of 75 to 120. Despite supplementing, she has not reached the optimal zone. This may be because her current dose is too low, or because she is not taking it with a fat-containing meal (vitamin D is fat-soluble and absorption is significantly improved when taken with dietary fat). As she enters the winter months with less sunlight, a dose increase to 3,000 to 4,000 IU daily with food should bring her into the optimal range.","low_causes":"Insufficient sunlight, low dietary intake, malabsorption, obesity, dark skin, aging","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"THYROID","result":"3.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5053","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5280","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate levels in the blood by controlling how much calcium is released from bone, absorbed from the gut and retained by the kidneys. Kim's result of 3.1 is within the optimal range, confirming the parathyroid glands are functioning normally and calcium regulation is healthy.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"460","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4498","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5878","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, energy production, DNA synthesis and red blood cell formation. Kim's result of 460 is within the laboratory range of 193 to 982 but below the optimal band of 500 to 900. Given her symptoms of fatigue and brain fog, and her low reticulocyte count, optimising B12 towards 500 and above is a worthwhile step. Sublingual methylcobalamin is the most effective form as it bypasses any absorption issues in the gut.","low_causes":"Low dietary intake, pernicious anaemia, malabsorption, medications (metformin, PPIs), aging","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6190","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA repair, red blood cell production and the conversion of homocysteine, an amino acid that at high levels is associated with cardiovascular risk. Kim's result of 7 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. The most likely explanation is that she eats only 2 to 3 portions of vegetables and fruit per day, and leafy greens and cruciferous vegetables are the richest dietary sources. Increasing vegetable portions and adding a methylfolate supplement should bring this into the optimal zone.","low_causes":"Low dietary intake of green vegetables, malabsorption, coeliac disease, alcohol, medications","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5405","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL (protective), LDL (atherogenic) and VLDL. Kim's result of 5.6 is above the desirable threshold of 5.18. However, total cholesterol alone is a poor measure of cardiovascular risk because it includes HDL, which is protective. Kim's HDL at 2.1 accounts for a large proportion of her total, meaning the atherogenic fraction (non-HDL cholesterol at 3.5, within the target of under 4.0) is more informative. The total cholesterol number looks higher than it should partly because her HDL is so good.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, familial hypercholesterolaemia, hypothyroidism, kidney disease, obesity, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3088","lo ","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective form of cholesterol. It removes cholesterol from artery walls and transports it back to the liver for disposal. Kim's result of 2.1 is well above both the desirable threshold of 1.55 and the optimal threshold of 1.6 for a woman. This is an excellent result and is one of the most protective cardiovascular markers in her report.","low_causes":"Smoking, obesity, inactivity, metabolic syndrome, high carbohydrate diet","high_causes":"Exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5133","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the form of cholesterol most associated with atherosclerosis, the build-up of plaque in artery walls. Kim's result of 3.08 is marginally above the laboratory upper limit of 3.0. However, a portion of this measured LDL is actually Lp(a) particles. When corrected for Lp(a), her conventional LDL drops to 2.84, within range. The modifiable fraction of LDL is close to target, though bringing ApoB below 0.9 remains the goal.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, menopause, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2967","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio summarises the balance between total cholesterol and protective HDL. Kim's ratio of 2.67 is well within the optimal range of under 3.5 and far below the risk threshold of 4.5. This favourable ratio is driven by her exceptionally high HDL of 2.1.","low_causes":"","high_causes":"High total cholesterol, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"37.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9375","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This measures what percentage of total cholesterol is the protective HDL. Kim's 37.5% is excellent, well above the 20% minimum and the 25% optimal threshold. It means over a third of her total cholesterol is the protective type, which is a very favourable profile.","low_causes":"Low HDL, metabolic syndrome, insulin resistance","high_causes":"High HDL, exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic cholesterol (LDL, VLDL and Lp(a)). Kim's result of 3.5 is within the laboratory range of under 4.0 but above the optimal target of under 3.0. A portion of this is driven by Lp(a) which cannot be modified. The modifiable non-HDL fraction is lower than the headline number suggests.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet, genetics, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7071","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein component of HDL particles. It is responsible for HDL's ability to remove cholesterol from artery walls. Kim's result of 1.98 is well above the desirable threshold of 1.4 and the optimal threshold of 1.6, consistent with her excellent HDL cholesterol of 2.1. This is a strong protective marker.","low_causes":"Smoking, obesity, inactivity, metabolic syndrome","high_causes":"Exercise, genetics, moderate alcohol, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL and Lp(a) particle. Because each of these particles carries exactly one ApoB molecule, the ApoB level effectively counts the total number of cholesterol-depositing particles in the blood, making it the single best predictor of cardiovascular risk from lipids. Kim's result of 1.03 is above the desirable threshold of 0.9 and above the optimal target of 0.8. A portion of this is driven by her inherited Lp(a) particles, which also carry ApoB. Even so, an ApoB of 1.03 represents real atherogenic particle burden, and bringing it below 0.9 through dietary changes and potentially pharmacological intervention is the key modifiable cardiovascular target.","low_causes":"Low fat diet, hyperthyroidism, malnutrition","high_causes":"High saturated fat diet, genetics, hypothyroidism, menopause, elevated Lp(a), kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio captures the balance between particles that deposit cholesterol in artery walls (ApoB) and particles that remove it (ApoA1). A ratio below 0.6 indicates lower risk. Kim's ratio of 0.52 is within the lower risk zone, just above the optimal target of 0.5. This reflects the protective effect of her exceptionally high ApoA1 (1.98) partially offsetting her elevated ApoB (1.03).","low_causes":"","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"75.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a specialised lipoprotein particle that is almost entirely genetically determined. It deposits cholesterol in artery walls, promotes blood clot formation and drives local inflammation, making it an independent and potent cardiovascular risk factor. Unlike LDL cholesterol, Lp(a) cannot be meaningfully lowered by diet, exercise or conventional cholesterol medications (statins do not reduce it). Kim's result of 75.38 is above the normal threshold of 32, placing her in the slightly increased risk category (32 to 90). This is a permanent piece of her medical record. We would recommend it is recorded with her GP and that her first-degree relatives are offered testing, as the trait is inherited. New therapies targeting Lp(a) are in advanced clinical trials, so this information may become actionable in the near future.","low_causes":"","high_causes":"Genetics (inherited, lifelong)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4571","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from muscle cells when they are damaged or stressed. It is commonly elevated after intense exercise. Kim's result of 73 is within the optimal range for a woman, indicating no significant muscle damage from her training, which is reassuring.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in the tissues. Kim's result of 16.8 is within the optimal range of 14 to 20, confirming healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3527","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3692","upper_optimal_position":"0.4748","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how much hormone to make. Kim's result of 0.9 is within the laboratory range of 0.55 to 4.78, sitting just below the optimal band of 1.0 to 2.5. A TSH at this level, while not suppressed, is on the lower side and means the pituitary does not need to push the thyroid hard to maintain adequate hormone output. Both FT4 and FT3 are within range, confirming the thyroid is working well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4741","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that directly drives metabolism, energy, mental clarity and body temperature regulation. Kim's result of 4.5 sits at the very bottom edge of the optimal range of 4.5 to 6.5. While technically optimal, it is at the lowest point of that band, meaning the most metabolically active thyroid hormone is providing adequate but not generous drive. This could be contributing to her afternoon energy crash and brain fog, as T3 directly influences both.","low_causes":"Low T4, poor T4 to T3 conversion, calorie restriction, illness, aging","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase antibodies (TPO) are markers of autoimmune thyroid disease. When elevated, they indicate the immune system is attacking the thyroid gland, as seen in Hashimoto's thyroiditis. Kim's result is less than 6.6, well below the threshold of 13.8, which rules out autoimmune thyroid disease as a cause of her symptoms.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1000","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Kim's result is less than 1.3, well below the threshold of 4.4 for autoimmune thyroid disease. More than 80% of the population have undetectable anti-thyroglobulin antibodies, and this negative result confirms no autoimmune thyroid process.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.268","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4240","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio indicates how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Kim's ratio of 0.268 is within the laboratory range of 0.2 to 0.45 but just below the optimal band of 0.27 to 0.40. This means conversion is adequate but not generous, which is consistent with her FT3 sitting at the very bottom of its optimal range. This is driven by the FT3 input and may contribute to her afternoon energy dips.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"Immunoglobulin G","group":"IMMUNOLOGY","result":"10.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4649","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgG is the most abundant antibody class in the blood, providing long-term immunity against bacteria and viruses encountered previously or through vaccination. Kim's result of 10.2 is within the laboratory range, indicating a healthy adaptive immune response.","low_causes":"Immune deficiency, medications, certain cancers","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M","group":"IMMUNOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5533","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgM is the first antibody produced by the immune system in response to a new infection. Kim's result of 2.1 is within the laboratory range, indicating a normal primary immune response capacity.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A","group":"IMMUNOLOGY","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4516","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgA is the main antibody protecting the mucosal surfaces of the gut, respiratory tract and urinary system. It is also essential for the coeliac screen to work properly. Kim's result of 1.5 is within the laboratory range, confirming healthy mucosal immunity and validating her negative coeliac screen.","low_causes":"Selective IgA deficiency, medications, immune deficiency","high_causes":"Chronic infection, liver disease, autoimmune disease, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E","group":"IMMUNOLOGY","result":"97.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4875","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"75","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"IU/mL","description":"IgE is the antibody class associated with allergic responses, including hay fever, asthma, eczema and food allergies. Kim's result of 97.5 is just within the laboratory limit of 100, sitting above the optimal threshold of 75. This suggests a mild allergic tendency in the immune system. It does not diagnose a specific allergy but would be consistent with hay fever, eczema, skin reactions or environmental sensitivities if any are present.","low_causes":"","high_causes":"Allergies, asthma, eczema, parasitic infection, atopic disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Kim's result is less than 4, well below the threshold of 14, which combined with her low CRP and ESR makes rheumatoid arthritis very unlikely as the cause of her joint pain and stiffness. The joint symptoms are more likely related to the menopausal transition and low testosterone.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, other autoimmune conditions, chronic infections","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.305","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0212","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA (tTG) is the primary screening marker for coeliac disease, an autoimmune condition triggered by gluten. Kim's result of 0.305 is negative, well below the threshold of 7.19. This rules out coeliac disease as a cause of her symptoms, provided she has been eating gluten regularly in the lead-up to the test.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6666666667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, which damage cells and accelerate ageing. Kim's result of 1.77 is at the upper limit of the range and right at the top of optimal, which is an excellent result. Her omega-3 supplementation and dietary antioxidants from vegetables are likely contributors.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"270","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4395","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5825","units":"nmol/L","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning to help you wake up and gradually declining through the day. Kim's result of 270 is within the optimal range for a morning sample. This rules out adrenal insufficiency or excess cortisol as causes of her fatigue. However, cortisol at a single time point does not capture the daily rhythm, and her pattern of waking tired with an afternoon crash could reflect a blunted morning peak or steeper-than-ideal afternoon decline, which this test cannot measure.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, steroid withdrawal","high_causes":"Stress, Cushing's syndrome, steroid use, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"445","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4443","upper_optimal_position":"0.5558","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In a postmenopausal woman whose cycle has stopped, natural oestradiol would typically be below 118.2. Kim's result of 445 is well above this, confirming that her HRT is delivering oestrogen effectively, bringing levels into the premenopausal follicular range of 71.6 to 529.2. This is a reassuring finding and indicates her oestrogen replacement is working as intended.","low_causes":"Menopause, ovarian failure, low body fat, excessive exercise","high_causes":"HRT, ovarian tumour, pregnancy, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.49","within_normal":"TRUE","within_optimal":"","result_position":"0.3527","lower_normal":"0","upper_normal":"2.32","lower_optimal":"","upper_optimal":"","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone that in premenopausal women rises in the second half of the menstrual cycle and supports pregnancy. In a postmenopausal woman, levels are naturally very low, typically below 2.32. Kim's result of 0.49 is within the postmenopausal range, which is expected because her hormonal coil (IUS) delivers progestogen locally to the uterus rather than systemically. Blood progesterone levels do not reflect the local uterine protection provided by the coil.","low_causes":"Menopause, anovulation, early pregnancy loss","high_causes":"Luteal phase, pregnancy, ovarian cysts, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"16.21","within_normal":"TRUE","within_optimal":"","result_position":"0.4500","lower_normal":"0.5","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the ovaries. In postmenopausal women not on HRT, LH is typically elevated above 15.9. Kim's result of 16.21 sits at the lower end of the postmenopausal range, consistent with partial suppression of the pituitary feedback loop by her HRT oestrogen. This is an expected finding.","low_causes":"HRT, pituitary disease, severe stress, anorexia","high_causes":"Menopause, ovarian failure, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"15.19","within_normal":"TRUE","within_optimal":"","result_position":"0.4500","lower_normal":"1.5","upper_normal":"116.3","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/mL","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and stimulates the ovaries. In postmenopausal women not on HRT, FSH is typically elevated above 23. Kim's result of 15.19 is below the postmenopausal range, indicating that her HRT oestrogen is partially suppressing the pituitary's demand signal. This confirms the HRT is being absorbed and is active in the body.","low_causes":"HRT, pregnancy, pituitary disease, severe stress","high_causes":"Menopause, ovarian failure, premature ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3905","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3762","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays an important role in energy, libido, muscle maintenance, bone density and cognitive function. Kim's total testosterone of 0.9 is within the laboratory range of 0.5 to 2.6 but in the lower portion. While the total is in range, the issue is in the free testosterone, which at 0.01 is at the absolute floor. This means most of her testosterone is bound to SHBG and not available to tissues.","low_causes":"Menopause, oophorectomy, adrenal insufficiency, pituitary disease, medications, aging","high_causes":"PCOS, adrenal tumours, congenital adrenal hyperplasia, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3793","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically active relative to SHBG. Kim's result of 1.33 is within the optimal range. However, this is a ratio and with both total testosterone and SHBG in range, the ratio appears adequate even though the absolute free testosterone is at the floor. The bioavailable testosterone (0.21 nmol/L) is a more precise measure and sits within the optimal range, though in the lower half.","low_causes":"High SHBG, low testosterone, menopause, HRT","high_causes":"PCOS, low SHBG, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3769","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3871","upper_optimal_position":"0.5605","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands and is a precursor to both testosterone and oestrogen. Kim's result of 1.7 umol/L (approximately 626.5 ug/dL) is within the laboratory range but below the optimal band of 2.0 to 8.0. DHEA-S declines naturally with age, and at 60 a lower level is expected. It is not low enough to suggest adrenal insufficiency, but it does contribute to the overall picture of lower androgen availability.","low_causes":"Aging, adrenal insufficiency, chronic illness, medications","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"179","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4241","lower_normal":"59","upper_normal":"619","lower_optimal":"80","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3708","upper_optimal_position":"0.5429","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production but also involved in immune function and reproductive regulation. Kim's result of 179 is within the optimal range for a non-pregnant woman, ruling out a prolactin-producing pituitary adenoma as a cause of any of her symptoms.","low_causes":"Dopamine agonist medications","high_causes":"Prolactinoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"67.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4701","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3436","upper_optimal_position":"0.5440","units":"nmol/L","description":"SHBG (sex hormon // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';

  // detail

    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;

    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
