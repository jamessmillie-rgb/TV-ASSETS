<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kim Thomson","dob":"16/01/1966","report_date":"2026-10-05","summary":"Kim is a 60-year-old female presenting with a BMI of 22.2, following a low-carb, high-protein diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). She trains four times a week, two cardio and two resistance sessions at moderate intensity, with 2,000 to 5,000 daily steps. She sleeps 7 to 8 hours but wakes tired most mornings, with an afternoon energy crash; stress feels hard to manage some weeks. She drinks 5 to 9 alcoholic drinks per week. She takes HRT and has a hormonal coil (IUS), and her cycle has stopped, placing her in perimenopause or menopause. Her current supplements are vitamin D, magnesium, omega-3 fish oil, protein powder and probiotics. She has had a previous blood test where everything was normal. She reports symptoms of low energy and fatigue, brain fog, joint pain and stiffness, and palpitations or dizziness, and these have been present for as long as she can remember. Her goal is to improve long-term health and longevity.\n\nThe standout positive in this report is Kim's metabolic health. Her fasting glucose is 4.4, comfortably inside the ideal range of 4.0 to 5.4, and her HbA1c, the marker that reflects average blood sugar over the previous three months, is 35 mmol/mol, below the ideal threshold of 36. Her fasting insulin is 2.72, which sits right at the bottom of the laboratory range and reflects a pancreas that barely needs to work to keep blood sugar in check. Her HOMA-IR, the index that combines glucose and insulin to estimate insulin resistance, is 0.53, which is excellent and means she is highly insulin-sensitive. On a low-carb diet at a healthy weight, this is exactly what should happen and it is a genuine strength. Her estimated average glucose, derived from her HbA1c, is 5.9 mmol/L, well within the ideal band.\n\nHer kidney function is strong. Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, is 0.85, comfortably below the 1.1 limit, giving a cystatin C-based eGFR of 94 and a combined eGFR of 94. Both are above the 90 threshold that marks optimal kidney performance at any age, and at 60 this is excellent. Uric acid at 267 is within the ideal range, sodium, potassium, chloride and bicarbonate are all exactly where they should be, and the urea-to-creatinine ratio at 89.6 is within the ideal band.\n\nHer liver is in very good health. ALT, the enzyme most specific to liver cell damage, is 17, well below the ideal threshold of 25 for women. AST is 17. GGT, the enzyme most sensitive to alcohol and metabolic strain, is 24, inside the ideal range of below 25, which means the liver is handling her current alcohol intake without measurable strain. Her FIB-4 score, a calculation that combines age, platelets, AST and ALT to screen for liver scarring (fibrosis), is 1.07, well below the threshold of 1.45 that would trigger further investigation. The APRI score at 0.183 and the NAFLD fibrosis score at minus 1.833 both confirm there is no sign of fibrosis or fatty liver disease. Bilirubin, albumin and total protein are all within their respective ranges. The De Ritis ratio, AST divided by ALT, is 1.0, sitting in the ideal band.\n\nHer thyroid is working well. TSH, the hormone from the pituitary gland that tells the thyroid how hard to work, is 0.9, inside the ideal range of 1.0 to 2.5 and slightly below it, which in a woman on HRT is a normal finding as oestrogen can mildly suppress TSH. Free T4, the inactive thyroid hormone, is 16.8, within the ideal range. Free T3, the active form that cells actually use, is 4.5, which is at the bottom edge of the ideal range of 4.5 to 6.5. The FT3-to-FT4 ratio is 0.268, fractionally below the ideal lower limit of 0.27, which suggests conversion from T4 to T3 is adequate but not generous. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, ruling out autoimmune thyroid disease entirely.\n\nHer immune markers are reassuring. IgG, IgA and IgM, the three main classes of antibody, are all within their laboratory ranges. IgE, the antibody associated with allergy, is 97.5 against a limit of 100, which is within range but high enough to suggest some degree of allergic sensitisation, whether environmental or dietary. Rheumatoid factor is negative at below 4, which is relevant given her joint pain and stiffness, because it makes rheumatoid arthritis very unlikely. Tissue transglutaminase IgA is negative, ruling out coeliac disease.\n\nHer tumour markers are all clear. CA125 at 8.1 is well below the 24 limit, CA15-3 at 7.59 is well below 30, CA19-9 at 22.38 is below 37, and CEA at 0.82 is well within the non-smoker range. These are screening markers and normal results are reassuring rather than definitive, but across four markers the picture is clean.\n\nHer bone health markers are reassuring. Corrected calcium at 2.38 is in the middle of the range. Phosphate at 1.6 and magnesium at 0.87 are both within range, with magnesium sitting inside the ideal band of 0.85 to 1.05, which is a credit to her supplementation. Parathyroid hormone (PTH), the hormone that regulates calcium by pulling it from bone when levels drop, is 3.1, within range. Alkaline phosphatase (ALP) at 41 is marginally below the laboratory lower limit of 46. In a postmenopausal woman on HRT, a low ALP is not a concern: ALP rises with bone turnover, and HRT suppresses bone turnover, so a lower ALP is the expected consequence of effective HRT rather than a sign of disease. It is worth knowing, not worth worrying about.\n\nHer cortisol at 270 sits within the morning reference range of 145 to 619. This is a single snapshot and cortisol fluctuates throughout the day, but the number is not low enough to suggest adrenal insufficiency and not high enough to suggest chronic stress-driven overproduction.\n\nHer urinalysis is entirely clean: no protein, no glucose, no blood, no white cells, no nitrites, no casts, insignificant bacterial growth. This rules out kidney inflammation, urinary infection and occult bleeding.\n\nTurning to the findings that need attention, the most important story in this report sits in the lipid panel, and it has two parts. The first is Lp(a), lipoprotein(a), a specialised cholesterol particle that is entirely genetically determined. Kim's Lp(a) is 75.38 nmol/L, above the 32 nmol/L threshold that marks increased cardiovascular risk. Lp(a) is inherited, cannot be changed by diet, exercise or any currently available medication, and it does three things that raise risk: it deposits cholesterol in artery walls, it encourages blood clot formation, and it drives local inflammation. This result should be recorded permanently in her medical notes because it will never change and it means her baseline cardiovascular risk is higher than someone with the same lipid profile but a normal Lp(a). First-degree relatives, her children and siblings, should be offered Lp(a) testing because the trait is inherited.\n\nThe second part of the lipid story is her conventional cholesterol. Total cholesterol is 5.6, above the desirable threshold of 5.18. LDL cholesterol, the particle that carries cholesterol into artery walls, is 3.08, marginally above the 3.0 upper limit. ApoB, which counts the actual number of atherogenic (artery-damaging) particles in the blood and is a more accurate measure of risk than LDL alone, is 1.03 g/L, above the 0.9 desirable threshold and classified as borderline high. However, when LDL is corrected for the cholesterol carried by Lp(a), the Lp(a)-corrected LDL comes down to 2.84, which is within the laboratory range. This is clinically important because it means a meaningful portion of her LDL reading is driven by her inherited Lp(a) rather than by modifiable factors. The modifiable fraction of her LDL is close to target.\n\nThe good news within the lipid panel is substantial. Her HDL cholesterol is 2.1, which is outstanding by any standard and well above the ideal threshold of 1.6 for women. Her triglycerides at 1.05 are within the ideal range of below 1.0, just fractionally above, and her TG-to-HDL ratio, a reliable surrogate for insulin resistance and small dense LDL, is 0.50, which is excellent. Remnant cholesterol at 0.48 is within the ideal band. Her ApoB-to-ApoA1 ratio, which is arguably the single best summary of lipid-driven cardiovascular risk, is 0.52, below the 0.6 lower-risk threshold. Her atherogenic index of plasma is minus 0.301, in the ideal zone, and her Castelli II ratio (LDL divided by HDL) is 1.47, comfortably below the 2.5 ideal threshold. So the overall lipid picture is one of a woman whose inherited Lp(a) pushes her ApoB and total LDL above the line, but whose metabolic lipid profile, the part she can control, is excellent. The cardiovascular risk score, a TrueVitals index that combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c on a scale of 0 to 100 with 20 or below being ideal and above 40 flagged, is 50. The elevated score is driven almost entirely by the Lp(a) and the ApoB it contributes to; without Lp(a), the score would be considerably lower. This is the number to discuss with her GP, because the inherited component cannot be modified by lifestyle and may, in future, be treatable with emerging therapies.\n\nHer inflammation markers are very good. High-sensitivity CRP (hsCRP), the most sensitive marker of systemic inflammation, is 0.5, within the ideal threshold of below 1.0. ESR at 6 is well within range. The platelet-to-lymphocyte ratio and the systemic immune-inflammation index are both within their ideal bands. This is reassuring because it means her joint pain is not being driven by a systemic inflammatory process.\n\nHer iron studies tell a nuanced story. Ferritin, the storage form of iron, is 89, within the ideal range for women of 40 to 150. Serum iron is 23.6, within range. Transferrin saturation is 40.16%, at the top of the ideal band of 25 to 40%, which is fine. However, transferrin itself, the transport protein that carries iron in the blood, is 2.34 g/L, marginally below the laboratory lower limit of 2.5. Transferrin is a negative acute phase reactant, meaning it falls during inflammation, but her CRP is only 0.5, so inflammation is not the explanation. In a postmenopausal woman who is no longer losing iron through menstruation and whose iron stores are healthy, a slightly low transferrin can simply reflect the body downregulating production because it does not need as much transport capacity. This is not a concern on its own, but it is worth noting for context.\n\nHer haematology panel has a few findings that sit together. Her white cell count is 3.98, fractionally below the lower limit of 4.0. Her neutrophils at 2.11 are just inside their range. At 60, a white cell count marginally below the laboratory cut-off is common and is often simply a reflection of constitutional variation, sometimes called benign ethnic neutropenia in certain populations, or physiological leucopenia. Her lymphocytes, monocytes, eosinophils and basophils are all within range. Her haemoglobin at 122 is within range but towards the lower end for women (range 120 to 150). Her haematocrit (HCT), the proportion of blood made up of red cells, is 0.359, fractionally below the lower limit of 0.36. Her red blood cell count is 3.8, sitting exactly on the lower boundary. Her absolute reticulocyte count, which measures newly produced red blood cells, is 39.52, below the lower limit of 50. Taken together, the picture is of a bone marrow that is producing red cells a little slowly. At a BMI of 22.2, on a low-carb diet with average portions and only 2 to 3 portions of vegetables and fruit a day, the most likely explanation is marginal nutritional input. Her B12 at 460 is within the laboratory range but below the ideal of 500 or above, and her folate at 7 ng/mL is below the ideal threshold of 8. Both B12 and folate are essential for red cell production, and when either is suboptimal the bone marrow can slow down. This is not anaemia, her haemoglobin is within range, but it is the earliest signal that the raw materials for blood production could be more generous. Her MCH at 32.1 is marginally above the upper limit of 32, and her MCV at 94.6, while within range, is in the upper half. A rising MCV and MCH together are the classic early signature of B12 or folate insufficiency, before haemoglobin itself drops. Improving both B12 and folate should correct the reticulocyte count and bring the haematocrit back into range.\n\nHer vitamin D at 68 nmol/L is sufficient (above 50) but below the ideal range of 75 to 120. She is already supplementing, so the dose may need a small increase to reach the 75 to 100 range where the evidence for bone health, immune function and mood is strongest.\n\nHer hormonal picture reflects her HRT. Oestradiol at 445 pmol/L is well above the postmenopausal range of 0 to 118, which confirms that her HRT is delivering oestrogen effectively. However, her FSH at 15.19 and LH at 16.21 are interesting: in a truly postmenopausal woman not on HRT, FSH would typically be above 23 and often much higher. Her FSH sitting at 15 suggests the HRT is partially suppressing her gonadotropins, which is the expected effect, but the fact that FSH is not fully suppressed raises the possibility that she is in the later stages of perimenopause rather than being fully postmenopausal, or that the HRT dose is adequate but not maximally suppressive. Progesterone at 0.49 is within the postmenopausal range and consistent with a hormonal coil providing local progestogen rather than systemic levels. Testosterone at 0.9 is within range. Her free androgen index at 1.33 and bioavailable testosterone at 0.21 nmol/L are both within their respective ranges, and her SHBG at 67.7 is within range, though oestrogen-containing HRT does tend to raise SHBG. DHEA-S at 1.7 umol/L (626 ug/dL) is within range. Prolactin at 179 is within the postmenopausal range of 38 to 430.\n\nHer C-peptide, the molecule released alongside insulin that measures how much insulin the pancreas is actually producing, is 0.652 ug/L, which converts to approximately 216 pmol/L, below the laboratory lower limit of 1.1 ug/L (364 pmol/L). In the context of a fasting glucose of 4.4, an HbA1c of 35 and a HOMA-IR of 0.53, this is not a sign of pancreatic failure. It is the signature of a woman eating a low-carbohydrate diet who demands very little insulin to maintain perfect blood sugar. The pancreas is producing exactly the small amount of insulin required. If glucose and HbA1c were high at the same time as C-peptide was low, that would be a different and more concerning story, but here all three glucose markers are ideal. This is physiology working efficiently rather than pathology.\n\nHer PhenoAge, a biological ageing score calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 47.8 years against her calendar age of 60, placing her biological age 12.2 years younger than her chronological age. This is an excellent result and reflects the combined effect of a healthy weight, good metabolic control, low inflammation and strong kidney function.\n\nHer total antioxidant activity at 1.77 sits right at the upper limit of the range, which likely reflects her omega-3 and vitamin D supplementation.\n\nHer creatine kinase at 73 is within range and suggests her training is not causing excessive muscle damage.\n\nNow to the symptoms she reports. Kim describes fatigue, brain fog, joint pain and stiffness, palpitations or dizziness, and says these have always been present. The bloods explain some of this but not all. The mildly suboptimal B12 and folate may contribute to fatigue and brain fog, and correcting them is worthwhile. The slightly low vitamin D could contribute to joint stiffness and fatigue. The FT3 at 4.5, while within range, is at the bottom edge of ideal, and FT3 is the thyroid hormone that cells actually use for energy; a slightly higher FT3 could make a noticeable difference to energy and mental clarity, and this is worth discussing with her HRT prescriber or GP as thyroid and oestrogen interact. However, the bloods have positively excluded several important causes: her thyroid antibodies are negative, her iron stores are healthy, her blood sugar is excellent, her inflammation is low, there is no coeliac disease, her kidney function is strong, and her cortisol is within range. For the symptoms that remain unexplained, the most likely contributors from her quiz answers are the afternoon energy crash pattern, which is common when daily steps are low and meals are spaced widely on a low-carb diet; the fact that she wakes tired despite 7 to 8 hours of sleep, which suggests poor sleep quality rather than insufficient quantity; and the 5 to 9 alcoholic drinks per week, which can fragment sleep architecture even when total hours look adequate. Her palpitations and dizziness could relate to the mild interaction between low-carb eating, HRT and hydration, or to perimenopause itself, but they are worth mentioning to her GP if they are frequent or worsening. A food and symptom diary tracking the afternoon crash against meal timing, composition and activity would help identify the trigger. If the palpitations are episodic, a 24-hour or 7-day ECG monitor (Holter monitor) through her GP would be a proportionate next step.","links":"The central thread in this report is the contrast between Kim's excellent metabolic health and the cardiovascular risk driven by her inherited Lp(a). Her fasting glucose, HbA1c, insulin, HOMA-IR and triglycerides are all ideal, her weight is healthy, and her HDL is exceptional. This metabolic profile is doing everything it can to protect her cardiovascular system. But her Lp(a) at 75.38 nmol/L adds a layer of risk that diet and exercise cannot remove. It pushes her ApoB above the 0.9 target and inflates her total LDL, so that what looks like a lipid problem is partly an inherited liability. The Lp(a)-corrected LDL of 2.84, inside the laboratory range, shows that the modifiable fraction of her LDL is close to where it should be. The cardiovascular risk score of 50 reflects this: remove Lp(a) from the calculation and her score would fall substantially.\n\nThe second thread connects B12, folate and the haematology findings. Her MCH is marginally above range, her MCV is in the upper half of normal, her absolute reticulocytes are below range, and her haematocrit and red cell count sit right on their lower boundaries. These are all early markers of B12 or folate insufficiency, the stage before anaemia develops. Her B12 at 460 is adequate but not ideal, and her folate at 7 is just below the ideal threshold of 8. On a low-carb diet with only 2 to 3 portions of vegetables and fruit a day, folate intake from food is likely limited. Correcting both should improve red cell production and may contribute to better energy and mental clarity.\n\nThe third thread is the hormonal picture and its relationship to her symptoms. Her HRT is clearly working: oestradiol at 445 confirms good oestrogen delivery, and the partially suppressed FSH and LH are consistent with effective replacement. But FT3 at 4.5, the bottom of the ideal range, means the active thyroid hormone available to cells is not generous. Oestrogen from HRT can increase thyroid-binding globulin, which binds more T3 and T4 and can reduce the free fractions available to tissues. This interaction is worth discussing with her prescriber, particularly in the context of fatigue, brain fog and afternoon crashes.\n\nThe white cell count at 3.98, just below the 4.0 cut-off, is most likely constitutional. Her neutrophils are within range, her CRP is low, her immunoglobulins are normal, and there is no sign of infection or immune suppression. At 60, a white cell count fractionally below the laboratory boundary is common and does not require investigation unless it is falling on serial testing. Her previous test was normal, so if the white cell count was also checked then, a comparison would be informative.\n\nThe findings that were excluded are as important as those that were found. Coeliac disease, rheumatoid arthritis, systemic inflammation, kidney disease, liver disease, thyroid autoimmunity, anaemia and diabetes have all been ruled out. The joint pain and stiffness, with a negative rheumatoid factor and low CRP, are more likely degenerative or mechanical than inflammatory, which is common at 60 and is best managed with the resistance training she is already doing.","lifestyle":"Add a portion of dark leafy greens (spinach, broccoli, kale) to lunch or dinner every day, building from your current 2 to 3 portions towards 4 to 5. Anchor: add it to whatever meal you are already making, before you plate up. Why: leafy greens are the richest food source of folate, which at 7 is just below ideal and is contributing to the slow reticulocyte production in your blood count.\nSwap one sugary snack day per week for a small handful of walnuts or almonds with a square of dark chocolate. Anchor: when the sugar craving hits, reach for the nuts first. Why: nuts provide magnesium, healthy fats and fibre without the glucose spike, and support the excellent insulin sensitivity your blood already shows.\nWalk for 15 to 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk blunts the afternoon energy crash you describe, improves glucose disposal (already good but this protects it), and adds 1,500 to 2,000 steps to your current 2,000 to 5,000 baseline. Aim to move your average towards 7,000 steps.\nAdd one extra resistance training session per week, making three in total. Anchor: choose a fixed day and time so it becomes non-negotiable. Why: resistance training is the single most effective intervention for joint stiffness, bone density in a postmenopausal woman, and long-term metabolic health. Your creatine kinase at 73 shows good recovery capacity.\nSet a fixed caffeine cut-off at 1pm. Anchor: after lunch, switch to herbal tea or water. Why: caffeine after early afternoon fragments sleep architecture and is a common driver of waking tired despite 7 to 8 hours in bed, which you describe.\nReduce alcohol to no more than 4 drinks per week from your current 5 to 9, ideally with at least 3 alcohol-free days in a row. Anchor: decide at the start of the week which days are alcohol-free. Why: alcohol disrupts deep sleep and REM sleep even when total sleep hours look adequate, and improving sleep quality is the most likely route to resolving your morning tiredness.\nEat two portions of oily fish per week (salmon, mackerel, sardines). Anchor: make it your default protein for two of your weekly meals. Why: oily fish provides omega-3 EPA and DHA alongside vitamin D and B12, all of which are either supplemented or suboptimal in this report, and the omega-3 supports the HDL and triglyceride profile that is already excellent.\nCalorie target: approximately 1,750 to 1,900 kcal per day to maintain your current healthy weight of 65 kg at your activity level (BMR approximately 1,310 kcal, multiplied by an activity factor of 1.45 for light activity, accounting for your step count and four moderate training sessions). Protein target: 85 to 105 grams per day (1.3 to 1.6 g per kg body weight for an active woman doing resistance training). Your protein powder supplementation helps here, but prioritise whole-food protein sources (eggs, fish, poultry, Greek yoghurt, legumes) at each meal.","flags":"Lp(a) 75.38 nmol/L, above the 32 nmol/L threshold. This is a genetically inherited lipoprotein that independently increases cardiovascular risk through cholesterol deposition, clot promotion and arterial inflammation. It cannot be modified by diet or exercise. It should be recorded permanently in her medical notes and first-degree relatives should be offered testing.\nApoB 1.03 g/L, above the 0.9 desirable threshold. However, the Lp(a)-corrected LDL is 2.84 mmol/L, within range, indicating that a meaningful portion of the ApoB elevation is driven by inherited Lp(a) rather than modifiable lipid metabolism. LDL at 3.08 is marginally above the 3.0 limit. Total cholesterol 5.6, above desirable. HDL 2.1 and triglycerides 1.05 are both excellent. Cardiovascular risk score 50 out of 100, driven predominantly by Lp(a) and ApoB.\nC-Peptide 0.652 ug/L (approximately 216 pmol/L), below the laboratory lower limit of 1.1 ug/L (364 pmol/L). In the context of fasting glucose 4.4, HbA1c 35 and HOMA-IR 0.53, this reflects low insulin demand on a low-carbohydrate diet rather than pancreatic insufficiency. No action required but noted for the record.\nWhite cell count 3.98 x10^9/L, marginally below the lower limit of 4.0. Neutrophils 2.11, within range. Most likely constitutional or physiological variation at 60. CRP 0.5, immunoglobulins normal. No sign of immune compromise.\nAbsolute reticulocytes 39.52 x10^9/L, below the lower limit of 50. Haematocrit 0.359, marginally below the lower limit of 0.36. Red blood cell count 3.8, on the lower boundary. MCH 32.1, marginally above the upper limit of 32. These findings together suggest mildly suboptimal B12 and folate input, the earliest stage of megaloblastic change before anaemia develops. B12 460 pg/mL (below ideal of 500), folate 7 ng/mL (below ideal of 8).\nTransferrin 2.34 g/L, marginally below the lower limit of 2.5. Ferritin 89 and transferrin saturation 40% are both healthy. In a postmenopausal woman with adequate iron stores and low CRP, this likely reflects reduced transport protein production rather than pathology.\nAlkaline phosphatase 41 IU/L, below the laboratory lower limit of 46. Consistent with HRT suppressing bone turnover. Calcium, phosphate and PTH are all within range. Not a concern.\nVitamin D 68 nmol/L, sufficient but below the ideal range of 75 to 120. Dose adjustment of current supplementation recommended.\nFolate 7 ng/mL, below the ideal threshold of 8. Contributing to the haematological findings above.\nOestradiol 445 pmol/L, well above the postmenopausal range, confirming effective HRT delivery. FSH 15.19, partially suppressed, consistent with HRT in late perimenopause or early postmenopause.\nFree testosterone (calculated) 0.01 nmol/L is reported at the lower limit of the reference range; bioavailable testosterone 0.21 nmol/L is within the optimal range. No clinical concern.\nReassuring negatives: thyroid function normal with both antibodies undetectable, coeliac screen negative, rheumatoid factor negative, CRP 0.5, ESR 6, all tumour markers within range (CA125, CA15-3, CA19-9, CEA), kidney function excellent (cystatin C eGFR 94), liver function excellent (FIB-4 1.07, APRI 0.183, NAFLD fibrosis score minus 1.833), fasting glucose and HbA1c ideal, urinalysis completely clear, cortisol within range, immunoglobulins normal.","recommendations":"Discuss Lp(a) result of 75.38 nmol/L with GP. This is a permanently elevated inherited risk factor. Request it be recorded in her medical notes. Ask whether first-degree relatives should be tested and whether any additional risk-reduction strategies (low-dose aspirin, statin consideration for overall ApoB reduction, or monitoring for future Lp(a)-lowering therapies) are appropriate given her overall cardiovascular risk score of 50.\nMention ApoB of 1.03 and LDL of 3.08. The Lp(a)-corrected LDL is 2.84, showing the modifiable fraction is near target. Discuss whether dietary modification alone is sufficient or whether lipid-lowering medication should be considered given the Lp(a) background.\nMention the palpitations and dizziness if they are frequent or worsening. A resting ECG or 24-hour Holter monitor would be a proportionate investigation to exclude arrhythmia, particularly in a perimenopausal woman on HRT.\nMention the white cell count of 3.98, fractionally below 4.0. If her previous test included a full blood count, ask the GP to compare. If it was also borderline low, this is constitutional and requires no action. If it is new, a repeat in three months would confirm stability.\nDiscuss the FT3 of 4.5 at the bottom of ideal and whether HRT-related increases in thyroid-binding globulin could be reducing free thyroid hormone availability. A thyroid function check six months after any HRT dose adjustment would be informative.\nRetest in six months with the following markers to track progress: full blood count with reticulocytes (to confirm B12 and folate correction), B12, folate, vitamin D, lipid panel with ApoB, and thyroid function. Calorie target 1,750 to 1,900 kcal per day, protein target 85 to 105 g per day.","supplementation":"Vitamin D3 (cholecalciferol): increase to 3,000 IU daily, taken with a meal containing fat. Her current level of 68 nmol/L is sufficient but below the ideal of 75 to 120. Continue year-round. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with the vitamin D3. K2 directs calcium into bone and away from arteries. This is particularly important for a postmenopausal woman and supports the excellent calcium and PTH results in this report.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Her B12 at 460 is adequate but below the ideal of 500 to 900, and the early haematological changes (raised MCH, low reticulocytes) suggest the body would benefit from a more generous supply. Sublingual delivery bypasses any absorption issues in the gut.\nFolate (methylfolate, 5-MTHF): 400 to 800 mcg daily. Her folate at 7 is below the ideal of 8 and is contributing to the reticulocyte and MCH findings. Methylfolate is the active form and is preferred over folic acid.\nMagnesium (glycinate): continue current supplementation at 300 to 400 mg elemental magnesium before bed. Her level of 0.87 is within the ideal range, which means the current dose is working. Magnesium glycinate also supports sleep quality, which is relevant given her morning tiredness.\nOmega-3 (fish oil): continue current supplementation at 2 to 3 g combined EPA and DHA daily, taken with food. This supports her already excellent HDL and triglyceride profile and provides anti-inflammatory benefit for her joint symptoms.\nDo not take iron supplements. Her ferritin at 89 and transferrin saturation at 40% show iron stores are healthy. Additional iron in this context could push saturation above the safe threshold.\nThe most important changes from this report are not supplements. They are increasing vegetable and fruit intake to boost folate from food, adding a daily post-meal walk to address the afternoon crash, improving sleep quality by cutting caffeine after 1pm and reducing alcohol to under 4 drinks per week, and discussing the Lp(a) result with her GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 62 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 62.3. Weakest systems: lipids & cardiovascular 28%, iron studies 42%, glucose & insulin 59%. Biggest drags: Lipoprotein(a), Apolipoprotein B, C-Peptide, LDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"45.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3515","lower_normal":"","upper_normal":"65","lower_optimal":"","upper_optimal":"60","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4615","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Kim's PhenoAge is 47.8 years against a calendar age of 60, placing her biological age 12.2 years younger than her chronological age. This is an excellent result driven by her low CRP, healthy kidney function, good glucose control and low white cell count. Because fasting glucose was not returned by the laboratory, the estimated average glucose from HbA1c (5.4 mmol/L) was used in the calculation. The plan in this report, particularly improving B12, folate, vitamin D and albumin through diet and supplementation, should maintain or further improve this score.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built by current blood markers, not a ten-year event probability. Kim's score of 50 is above the 40 threshold that triggers a flag. The score is driven predominantly by her Lp(a) at 75.38 and the ApoB of 1.03 it contributes to. Without the Lp(a) component, her score would be considerably lower given her excellent HDL, low triglycerides, ideal CRP and ideal HbA1c. This is the number to discuss with her GP: the inherited component cannot be modified by lifestyle, and the GP should assess whether additional interventions are appropriate.","low_causes":"Ideal lipids, low inflammation, good glucose control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. Kim's result of 4.4 mmol/L is well within the ideal range of 4.0 to 5.4, indicating excellent blood sugar control. On a low-carbohydrate diet at a healthy weight, this is the expected finding and reflects strong insulin sensitivity.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, steroid medications, excessive carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3600","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c reflects average blood sugar levels over the previous two to three months. Kim's result of 5.4% is within the normal range of below 6.0% and within the ideal zone. This confirms that her blood sugar control has been consistently good, not just on the morning of the test.","low_causes":"Low carbohydrate intake, hypoglycaemia, blood loss, haemolytic conditions","high_causes":"Pre-diabetes, type 2 diabetes, high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the international standard unit for the same measurement. Kim's result of 35 mmol/mol is below the ideal threshold of 36 and well below the pre-diabetes threshold of 42. This is an excellent result that confirms sustained, well-controlled blood sugar.","low_causes":"Low carbohydrate intake, hypoglycaemia, blood loss","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3369","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3975","units":"mIU/L","description":"Fasting insulin measures how ","result_position":"0.4214","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over the past two to three months. Kim's result of 5.9 mmol/L is within the ideal range, confirming sustained excellent blood sugar control.","low_causes":"Low carbohydrate diet, hypoglycaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4665","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"122","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Kim's result of 122 g/L is within the laboratory range of 120 to 150 for women but sits just above the lower boundary and below the ideal of 125. This is not anaemia, but it is consistent with the other findings in her blood count that suggest mildly suboptimal B12 and folate input for red cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells in a given volume of blood. Kim's result of 3.8 sits exactly on the lower boundary of the laboratory range. Combined with the marginally low haematocrit and reticulocytes, this suggests the bone marrow is producing red cells a little slowly, most likely due to suboptimal B12 and folate availability.","low_causes":"B12 or folate deficiency, iron deficiency, chronic disease, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.359","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Kim's result of 0.359 is marginally below the lower limit of 0.36. This is consistent with the other haematology findings, a slightly reduced red cell mass due to mildly suboptimal B12 and folate. At this margin, it is not clinically significant on its own but contributes to the overall picture.","low_causes":"Anaemia, B12 or folate deficiency, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"12.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5972","units":"%","description":"RDW measures the variation in size among red blood cells. A high RDW suggests a mix of old and new cells of different sizes, which can point to nutritional deficiency or bone marrow stress. Kim's result of 12.1% is within the ideal range, which is a reassuring finding and suggests that despite the marginally low reticulocytes, the red cells being produced are consistent in size.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, thalassaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"94.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5481","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of red blood cells. Larger cells can indicate B12 or folate deficiency, while smaller cells can point to iron deficiency. Kim's MCV of 94.6 fL is within range od cells. Kim's result of 340 g/L is within the ideal range, indicating that although individual cells are slightly larger than ideal, the haemoglobin concentration within them is normal.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"232","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4282","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4295","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that help blood to clot. Kim's platelet count of 232 is comfortably within the ideal range, indicating normal clotting function and no sign of bone marrow over- or under-production.","low_causes":"Viral infections, autoimmune conditions, medications, liver disease, bone marrow disorders","high_causes":"Iron deficiency, inflammation, infection, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6444","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets tend to be younger and more active. Kim's MPV of 9.9 fL is within the ideal range, indicating normal platelet turnover.","low_causes":"Bone marrow suppression, aplastic anaemia, chemotherapy","high_causes":"Platelet destruction, immune thrombocytopenia, inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's front line. Kim's total white cell count of 3.98 is fractionally below the lower limit of 4.0. Her neutrophils, the most abundant type and the first responders to infection, are 2.11 which is just within their range. At 60, with a CRP of 0.5 and normal immunoglobulins, this is most likely a constitutional finding, a reflection of her individual normal baseline rather than immune compromise. It is worth comparing with her previous test if a full blood count was included.","low_causes":"Constitutional variation, viral infection, medications, autoimmune conditions, bone marrow suppression","high_causes":"Infection, inflammation, stress, smoking, steroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3553","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first to respond to bacterial infection. Kim's count of 2.11 is just within the laboratory range but below the ideal of 2.5. In the context of a marginally low total white cell count and no signs of infection or inflammation, this is most likely constitutional variation.","low_causes":"Constitutional variation, viral infections, medications, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4083","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for immune memory and targeted defence. Kim's count of 1.45 is within the laboratory range of 1 to 3 but just below the ideal of 1.5. This is consistent with the overall picture of a mildly low white cell count.","low_causes":"Viral infections, stress, steroid use, autoimmune conditions","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest bacteria and dead cells, and help activate other parts of the immune system. Kim's result of 0.22 is within the laboratory range. No concern.","low_causes":"Bone marrow suppression, steroid use","high_causes":"Chronic infection, autoimmune disease, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophil re her ApoB and Lp(a)-corrected LDL, which give a clearer picture of the atherogenic particles.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, kidney disease, obesity, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3088","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat in the blood, rising after meals and with excess sugar, alcohol or carbohydrate intake. Kim's result of 1.05 mmol/L is within the laboratory fasting range of below 1.70 and just above the ideal threshold of 1.0. On a low-carb diet, this is a good result. The TG-to-HDL ratio of 0.50 is excellent and is a strong indicator of metabolic health.","low_causes":"Low carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3077","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. Kim's result of 0.48 mmol/L is within the ideal range, reflecting healthy triglyceride metabolism and consistent with her low-carb dietary pattern.","low_causes":"Low carbohydrate diet, malnutrition","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6774","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL cholesterol removes excess cholesterol from artery walls and returns it to the liver for disposal. It is considered protective against cardiovascular disease. Kim's HDL of 2.1 mmol/L is outstanding, well above the 1.6 ideal threshold for women. This is one of the strongest positives in the entire report and provides significant cardiovascular protection. Her HDL makes up 37.5% of her total cholesterol, which is excellent.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high carbohydrate diet","high_causes":"Exercise, moderate alcohol, genetics, oestrogen (HRT)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5133","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL cholesterol carries cholesterol from the liver to the arteries and is the primary driver of plaque formation. Kim's result of 3.08 mmol/L is marginally above the 3.0 upper limit. However, when corrected for the cholesterol carried by her inherited Lp(a), the Lp(a)-corrected LDL falls to 2.84, which is within range. This means a meaningful portion of her LDL elevation is genetic and not modifiable by diet or lifestyle.","low_caus wer_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a specialised cholesterol particle that is entirely genetically determined. It cannot be changed by diet, exercise, weight loss or any currently approved medication. Kim's result of 75.38 nmol/L is above the 32 nmol/L threshold, placing her in the slightly increased risk category (32 to 90 nmol/L). Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls like LDL, it promotes blood clot formation, and it drives local arterial inflammation. This result should be recorded permanently in her medical notes because it will never change. First-degree relatives should be offered testing because the trait is inherited. While there is currently no approved drug that specifically lowers Lp(a), clinical trials are underway and this may change in the coming years.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited trait, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4457","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4190","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged. It rises after intense exercise or injury. Kim's result of 73 U/L is within the ideal range, indicating her training programme is not causing excessive muscle breakdown and recovery is adequate.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the inactive form of thyroid hormone circulating in the blood. It is converted into the active form, T3, in tissues throughout the body. Kim's FT4 of 16.8 pmol/L is within the ideal range of 14 to 20, indicating adequate thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, early Hashimoto's, excessive thyroid medication, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3611","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4400","upper_optimal_position":"0.4755","units":"mIU/L","description":"TSH is the signal from the pituitary gland that tells the thyroid how hard to work. A high TSH means the thyroid is being pushed because output is low; a low TSH means the thyroid is producing enough or more than enough. Kim's TSH of 0.9 mIU/L is within the laboratory range but slightly below the ideal of 1.0 to 2.5. In a woman on oestrogen-containing HRT, this is a recognised finding as oestrogen can mildly suppress TSH. Her FT4 and FT3 are both within range, confirming the thyroid is functioning well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease, oestrogen (HRT), early pregnancy","high_causes":"Hypothyro // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;
