const REPORT_DATA = {"patient_name":"John Anthony Francis Bertenshaw","dob":"14/01/1967","report_date":"2026-10-14","summary":"Customer is a 59-year-old male presenting with a BMI of 32.4, following an ultra-processed and fast food heavy diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food daily and sugary food some days; portions are larger than average (volume 7 out of 10). He does no structured exercise, no cardio and no resistance training, with fewer than 2,000 daily steps. He sleeps 7 to 8 hours but wakes exhausted or during the night, with energy crashing in the afternoon and stress feeling hard to manage most days. He drinks 15 or more alcoholic drinks per week and uses cannabis. He takes an SSRI and a beta-blocker, and supplements with a multivitamin. He has a family history of an autoimmune condition. He has not had a previous blood test. He reports weight gain and difficulty losing weight, poor sleep and insomnia, low energy and fatigue, and low mood and anxiety. His goals are to lose body fat, improve long-term health and longevity, and prevent disease. He has stated that he intends to cut medication doses and come off them entirely by year end, to radically change his diet and exercise, and to eliminate alcohol entirely for three months following this test. That intention is genuinely encouraging, and the results below will give him a clear baseline to measure progress against.\n\nThe finding in this report that deserves the most immediate attention is the lipid panel. His ApoB is 1.66, nearly double the 0.9 threshold and classified by the laboratory as very high. ApoB is a direct count of the number of particles in the blood that can deposit cholesterol inside artery walls, and at 1.66 it means there are roughly twice as many of those particles circulating as there should be. His total cholesterol is 7.2, his LDL is 4.1 against a target below 3.0, his triglycerides are 3.96 against a fasting target below 1.7, his VLDL is 1.8, his non-HDL cholesterol is 5.8, and his HDL, the protective fraction, is 1.4, which is within the laboratory range but below the ideal of 1.55. His ApoB to ApoA1 ratio is 1.031 against a target below 0.7, placing him firmly in the higher-risk category. On top of that, his Lp(a), a genetically inherited lipoprotein that accelerates plaque formation, is 45.12 against a target below 32, sitting in the slightly increased risk band. Lp(a) cannot be changed by diet, exercise or any currently available medication. It is fixed by genetics, it is permanent, and it should be recorded in his medical notes for life. His first-degree relatives should be offered testing. When the Lp(a) contribution is removed from his LDL, the corrected LDL is still 3.95, meaning virtually all of his LDL elevation is driven by modifiable factors: diet, weight, alcohol and activity. The Atherogenic Index of Plasma, a ratio that captures how much of the lipid profile is tilted toward artery damage, is 0.452 against a target below 0.21, confirming significant atherogenic pressure. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 95 out of 100, where below 20 is ideal and below 40 is acceptable. That is a very high score, and it reflects real risk being built now. Because he is 59, his ten-year absolute risk of a cardiovascular event is also elevated; the gap between the score and the calendar that a younger person might have simply does not exist here. This is the single most important conversation to have with his GP, and the plan below is built around bringing these numbers down.\n\nHis hsCRP is 4.2. CRP, or C-reactive protein, is made by the liver in response to inflammation anywhere in the body. Below 1.0 is ideal, between 1.0 and 3.0 is moderate, and above 3.0 is high. At 4.2, there is significant systemic inflammation present. This could be driven by visceral fat, which at BMI 32.4 with no exercise is likely substantial, by alcohol at 15 or more drinks a week, by the ultra-processed diet, or by a combination of all three. CRP at this level independently increases cardiovascular risk and amplifies the damage done by the lipid profile above. His ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and rises with inflammation, infection or tissue damage, is 40 against a limit of 12. That is more than three times the upper boundary. ESR and CRP rising together confirms a genuine inflammatory process rather than a laboratory artefact. At 59 with no diagnosed inflammatory condition, the most likely drivers are the same metabolic and lifestyle factors, but an ESR this high should be mentioned to his GP so they can consider whether any further investigation is warranted, particularly given the family history of an autoimmune condition.\n\nHis IgE is 216 against a limit of 100. IgE is the immunoglobulin the immune system produces in response to allergens and, less commonly, parasitic infections. At more than double the upper limit, this suggests a significant allergic sensitisation. Common causes are environmental allergens such as dust mites, moulds, pet dander, pollens, or food allergens. Cannabis smoke can also drive IgE elevation. This does not identify what the allergen is, but it confirms the immune system is reacting to something, and if he has any symptoms such as nasal congestion, skin irritation, breathlessness or digestive upset, an allergy panel through his GP could identify the trigger.\n\nHis oestradiol is 172 against an upper limit of 146.1 for men. Oestradiol is the primary oestrogen, and in men it is produced by an enzyme called aromatase that converts testosterone into oestradiol. Aromatase lives predominantly in fat tissue, so at BMI 32.4 there is more aromatase activity, which means more testosterone is being converted to oestradiol than it should be. This is significant because it explains two things at once: the elevated oestradiol itself, which at this level can contribute to fatigue, low mood, fluid retention and difficulty losing weight, and the testosterone, which at 13.8 is within the laboratory range of 8.4 to 28.7 but sits in the lower third and well below the optimal band of 18 to 30. His SHBG, sex hormone binding globulin, which is a protein that binds testosterone and makes it unavailable, is 19.9, just above the lower limit of 17.3 and well below the optimal range of 25 to 55. Low SHBG is commonly driven by insulin resistance, high BMI and alcohol, and while it technically means a higher proportion of his testosterone is free and bioavailable, the total pool it is drawing from is modest. His free testosterone is 0.3684 and his bioavailable testosterone is 8.44, both within range but reflecting the low total. His progesterone is 0.86 against a lower limit of 0.89, marginally below range. In men, progesterone plays a modest role in mood regulation and sleep quality, and while this is a very small shortfall, it is worth noting alongside his reported poor sleep and low mood. His DHEA-S is 1.6 umol/L, which converts to approximately 590 ug/dL. DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestradiol, and at 59 this level is within range. His cortisol at 303 is within the morning reference band, and his LH and FSH are both in the lower half of range, suggesting the pituitary is not signalling the testes to produce more testosterone, which at this age and weight is a common pattern rather than a pituitary problem.\n\nTurning to what is working well. His thyroid is in good health. TSH, the signal from the pituitary that tells the thyroid how hard to work, is 1.66, sitting comfortably within the optimal range of 1.0 to 2.5. Free T4, the storage hormone the thyroid produces, is 15.8, within the optimal band, and free T3, the active hormone that cells actually use, is 4.9, also within the optimal range. The FT3 to FT4 ratio is 0.31, confirming healthy conversion. Both thyroid antibodies are negative, which, given the family history of autoimmune disease, is genuinely reassuring: there is no sign of the immune system attacking the thyroid. His fasting glucose is 4.5, within the optimal range of 4.0 to 5.4, and his fasting insulin is 6.07, within the optimal band of 2 to 8. His HOMA-IR, a calculation that estimates insulin resistance from fasting glucose and insulin, is 1.21, within the healthy range. At BMI 32.4 with an ultra-processed diet, daily fast food and no exercise, having clean insulin sensitivity is a genuine positive that many people with this profile would not show. His HbA1c is 40 mmol/mol, which is within the normal range of below 42 and within the optimal band of below 36... actually, 40 is above the optimal of 36, so while it is normal and not pre-diabetic, it is drifting upward and sits in the space between optimal and the pre-diabetic threshold. Given the diet and weight, this is a marker to watch. His C-peptide is 1.94 ug/L, which converts to approximately 642 pmol/L, a normal level confirming healthy pancreatic insulin production. His kidney function is acceptable. His creatinine-based eGFR is above 90, but his Cystatin C, a more reliable marker of kidney filtration that is not affected by muscle mass, gives an eGFR of 86, which is below the optimal threshold of 90. The combined eGFR is 86. At 59, this is not alarming, but it is worth monitoring, particularly because the combination of high blood pressure risk factors, high uric acid, and the medications he takes all put the kidneys under additional load. His uric acid is 531 against an upper limit of 547, within range but very close to the top. Uric acid at this level is associated with gout risk, kidney stone risk, and cardiovascular risk. It is driven by alcohol, red meat, processed food, fructose from sugary drinks, and by the kidneys not clearing it efficiently. As his diet changes and alcohol stops, this should fall.\n\nHis liver panel tells a mixed story. His GGT is 55. GGT, or gamma-glutamyl transferase, is an enzyme that rises with alcohol consumption, fatty liver, and metabolic stress. The laboratory range goes to 73, so it is within range, but the optimal threshold is below 25, and at 55 it is more than double that. At 15 or more drinks per week, this is the liver showing it is working hard to process alcohol. His ALT is 36. ALT is a liver cell enzyme, and while the laboratory allows up to 56, the optimal threshold for men is below 30, so at 36 it is mildly above ideal. His AST is 31, within range, and the De Ritis ratio of AST to ALT is 0.86, within the optimal band, which is reassuring because an inverted ratio would suggest more significant liver cell damage. His FIB-4 score, a calculation that estimates liver scarring using age, platelets, AST and ALT, is 0.96, well below the 1.45 threshold, meaning there is no sign of liver fibrosis. His APRI score is 0.243, also reassuring. The NAFLD Fibrosis Score is -2.512, within the low-risk band. His albumin is 42, within range, and his bilirubin is 9, healthy. So the liver is under metabolic strain from alcohol and diet, but it has not yet developed scarring or significant damage. The three-month alcohol break he is planning should bring the GGT down substantially, and that will be one of the clearest markers of progress on a retest. His amylase is 115 against an upper limit of 118, very close to the top. Amylase is a pancreatic enzyme that helps digest carbohydrates, and at this level it is not diagnostic of pancreatitis, but alcohol is one of the main drivers of elevated amylase, and this is another reason the alcohol elimination is important.\n\nHis full blood count is largely healthy. Haemoglobin is 150, mid-range and healthy. Red blood cells, haematocrit, MCV, MCH and MCHC are all within range. His MCHC at 344 is one point below the upper limit of 345, so entirely normal. Platelets are 319, healthy. White cell count is 5.94, mid-range. The differential is clean: neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within range. His reticulocyte percentage is 2.11, within range, and the absolute reticulocyte count is 99.381 against an upper limit of 100, just inside. His iron studies are within range: ferritin is 283, which is within the laboratory range of 22 to 322 but above the optimal band of 50 to 200. At this level, ferritin could reflect genuine iron stores or it could be acting as an acute-phase reactant, rising alongside the inflammation shown by the CRP of 4.2 and the ESR of 40. His serum iron is 22.7, transferrin is 2.67, iron binding capacity is 60.4, and transferrin saturation is 33.85%, all within both laboratory and optimal ranges. The iron picture is adequate and does not need supplementation.\n\nHis vitamin D is 54, which crosses the sufficiency threshold of 50 but sits well below the optimal range of 75 to 120. At BMI 32.4, vitamin D is sequestered in fat tissue, meaning the blood level underestimates how much the body actually needs. A higher supplementation dose is required to reach optimal. His B12 is 359, within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, energy production and red blood cell formation, and at 359 it may be contributing to his fatigue. His folate is above 24, flagged as high by the laboratory, which is almost certainly driven by the multivitamin he takes. This is not harmful.\n\nHis prostate markers are reassuring. PSA is 0.89, well below the 3.5 threshold. The free PSA ratio is 0.18, which is marginally below the 0.19 threshold the laboratory uses, but with a total PSA this low, the ratio is clinically irrelevant. There is no prostate concern here. His tumour markers CA19-9 at 30.51 and CEA at 1.34 are both within range. His immunoglobulins IgG, IgM and IgA are all within range. Rheumatoid factor is negative at below 4. Tissue transglutaminase IgA is negative, ruling out coeliac disease. His creatine kinase at 126 is mid-range and healthy.\n\nHis Total Antioxidant Activity is 2.33 against an upper limit of 1.77. This is above range, but TAA measures the total antioxidant capacity of the blood, and elevations are commonly driven by supplementation, particularly multivitamins containing vitamins C and E, and by dietary polyphenols. At his current intake, this is likely supplement-driven. His serum osmolality is 289.5, within the optimal band, confirming adequate hydration. His Mentzer Index is 19.7, an informational marker that helps distinguish iron-deficiency anaemia from thalassaemia trait, and at this level it is consistent with normal red cell production.\n\nHis PhenoAge is 56.7 against a calendar age of 59, meaning his biological age by this algorithm is 2.3 years younger than his chronological age. This is a modestly positive finding, and it is being held back principally by the elevated CRP and the white cell count, which, while normal, sits in the upper half. If the inflammation comes down with the lifestyle changes he is planning, his PhenoAge should improve further.\n\nHis urinalysis is clean. pH, protein, ketones, glucose, specific gravity and urobilinogen are all normal. No white cells, no red blood cells, no nitrites, no casts. The bacterial count and urine culture are pending.\n\nConnecting his symptoms to the results: his fatigue and afternoon energy crash have multiple contributors visible here. The inflammatory burden shown by CRP 4.2 and ESR 40 creates a constant low-grade immune activation that drains energy. The suboptimal testosterone with elevated oestradiol reduces drive and vitality. The vitamin D at 54 and B12 at 359, both below optimal, are co-factors for energy production. His beta-blocker will lower heart rate and blood pressure, which can cause fatigue independently. His SSRI can contribute to fatigue, weight gain and sleep disruption. And the alcohol at 15 or more drinks per week fragments sleep architecture, explaining why he sleeps 7 to 8 hours but wakes exhausted. The poor sleep itself then drives afternoon cortisol dips, worsening the crash. His difficulty losing weight is driven by a reinforcing loop: the ultra-processed diet and high alcohol intake drive insulin and triglycerides, the excess body fat increases aromatase activity converting testosterone to oestradiol, the low testosterone and high oestradiol make it harder to build or maintain muscle, and the low activity means his total daily energy expenditure is very low despite being a large man. His low mood and anxiety are contributed to by the low testosterone, the elevated oestradiol, the poor sleep, the high alcohol intake, the inflammatory state, and the low vitamin D and B12. The SSRI and beta-blocker are presumably addressing these symptoms, but the underlying drivers are all modifiable.","links":"The dominant story in this report is metabolic and cardiovascular risk driven by a combination of diet quality, alcohol volume, excess body fat and very low physical activity. The lipid panel is the clearest expression of this: ApoB at 1.66 with LDL at 4.1, triglycerides at 3.96 and HDL at 1.4 creates a profile with heavy atherogenic pressure, confirmed by the Atherogenic Index at 0.452 and the Cardiovascular Risk Score at 95. The triglycerides are particularly telling because they respond rapidly to carbohydrate quality, alcohol and visceral fat, and at nearly four times the ideal level they confirm that the combination of ultra-processed food and heavy alcohol intake is flooding the liver with substrate it converts to VLDL particles. The Lp(a) at 45.12 adds a fixed, inherited layer of risk on top of the modifiable factors, but because the Lp(a)-corrected LDL is still 3.95, nearly all of the LDL elevation is within his control.\n\nThe second thread is systemic inflammation. CRP at 4.2 and ESR at 40 are both elevated, and they confirm each other. At BMI 32.4 with no exercise, visceral fat is the most likely primary driver, because visceral adipose tissue is metabolically active and secretes inflammatory cytokines. Alcohol adds to this directly through gut permeability and liver-mediated inflammatory pathways. The ultra-processed diet adds a third source through oxidised fats, excess omega-6, and refined carbohydrate. The inflammation is not just a number: it accelerates the arterial damage from the lipid profile, it drives fatigue, and it may be contributing to the elevated ferritin at 283, which could be partly an acute-phase response rather than pure iron storage.\n\nThe third thread is the hormonal picture. Elevated oestradiol at 172 with testosterone at 13.8 and low SHBG at 19.9 is a pattern commonly seen in men with excess body fat and high alcohol intake. Aromatase in fat tissue converts testosterone to oestradiol, lowering one and raising the other. Alcohol independently suppresses testosterone production and raises oestradiol. The result is a hormonal environment that promotes further fat storage, makes muscle maintenance harder, contributes to fatigue and low mood, and creates a cycle that is difficult to break without addressing the root causes. The progesterone marginally below range at 0.86 fits the same picture, though its clinical significance in men is modest.\n\nWhat has been excluded is important. The thyroid is working well with negative antibodies, ruling out autoimmune thyroid disease despite the family history. Insulin sensitivity is preserved, which is a significant finding at this BMI and means the metabolic window for change is still wide open. There is no liver fibrosis. There is no kidney disease, though the Cystatin C eGFR at 86 is worth watching. There is no prostate concern. There is no coeliac disease. There is no sign of the autoimmune conditions that the family history raises as a possibility, with rheumatoid factor negative and no clinical markers pointing to systemic autoimmunity.\n\nThe loose ends are the IgE at 216, which does not connect to the metabolic story and suggests a separate allergic process that could be environmental or related to cannabis smoke, and the ESR at 40, which while likely metabolic in origin, is high enough that the GP should be aware and can decide whether any further workup is needed. The amylase at 115, borderline high, is a marker to watch as alcohol is eliminated.","lifestyle":"Eliminate alcohol completely for the three months you have planned, then reassess. Anchor: the decision is already made, commit to a specific start date and tell someone. Why: alcohol is driving your triglycerides at 3.96, your GGT at 55, your inflammation at CRP 4.2, and is suppressing your testosterone at 13.8. This single change will move more markers than anything else in this report.\nAdd a palm-sized portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, tinned tuna, or beans. Anchor: protein goes on the plate before anything else. Why: protein at 137 to 168 grams per day supports muscle maintenance, keeps you full, and blunts the insulin and glucose response to meals. At your current weight, this is the foundation of the fat-loss plan.\nReplace one ultra-processed meal per day with a home-cooked alternative built around protein and vegetables. Start with whichever meal is easiest to control. Anchor: pick the same meal each day so it becomes automatic. Why: ultra-processed food is driving your triglycerides, your inflammation, and your calorie surplus.\nBuild vegetable intake from your current 0 to 1 portions to at least 4 per day, adding one portion per week. Frozen vegetables count. Anchor: add vegetables to whatever you are already eating rather than replacing foods. Why: fibre lowers LDL cholesterol, feeds gut bacteria that reduce inflammation, and slows glucose absorption.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and triglyceride response to that meal and begins rebuilding daily energy expenditure from your current sub-2,000 steps.\nAdd a second daily walk of 15 to 20 minutes, ideally in the morning within an hour of waking and outside. Anchor: before your first coffee. Why: morning daylight resets your circadian rhythm, which directly addresses your exhausted waking and afternoon crash, and builds toward a step target of 7,000 to 10,000 per day.\nSet a fixed wake time seven days a week and a caffeine cut-off at 1pm. Keep the bedroom cool and dark. Anchor: the alarm does not move, even on weekends. Why: your sleep architecture is fragmented, shown by waking exhausted despite 7 to 8 hours, and consistency is the single most effective intervention for sleep quality.\nAim for a calorie intake of approximately 2,000 to 2,200 kcal per day with at least 137g of protein. Your estimated maintenance is around 2,600 kcal, so a 400 to 600 kcal daily deficit targets steady fat loss of 0.5 to 0.75 kg per week, aiming for a weight of 88 to 92 kg over the next 12 months. Track roughly for the first four weeks to calibrate portion sizes, then let habit take over.","flags":"ApoB 1.66 (target below 0.9), LDL 4.1 (target below 3.0), triglycerides 3.96 (target below 1.7), VLDL 1.80 (target below 0.78), non-HDL 5.80 (target below 4.0), total cholesterol 7.2, TC/HDL ratio 5.14, ApoB/A1 ratio 1.031, Atherogenic Index 0.452, HDL 1.40 below ideal of 1.55: severely atherogenic lipid profile. Cardiovascular Risk Score 95 out of 100. Lp(a) 45.12 (target below 32) adds fixed inherited risk. The modifiable component (Lp(a)-corrected LDL 3.95) is almost entirely diet, alcohol and weight driven. GP should assess total cardiovascular risk and consider whether lipid-lowering therapy is indicated alongside the lifestyle plan.\nESR 40 (limit 12), hsCRP 4.2 (optimal below 1.0): dual inflammatory markers significantly elevated. Most likely driven by visceral adiposity, alcohol and ultra-processed diet. ESR this high at 59 with a family history of autoimmune disease warrants GP awareness and possible further investigation if it does not normalise with lifestyle change.\nIgE 216 (limit 100): more than double the upper limit, suggesting significant allergic sensitisation. Consider environmental allergens, food allergens or cannabis smoke as triggers. GP can arrange specific allergen testing if symptomatic.\nOestradiol 172 (upper limit 146.1) with testosterone 13.8 (optimal above 18) and SHBG 19.9 (optimal above 25): aromatase-driven oestrogen excess from excess body fat and alcohol. This pattern contributes to fatigue, low mood, weight gain and difficulty losing fat. Should improve with weight loss and alcohol cessation; if testosterone does not rise above 18 on retest, GP review is warranted.\nGGT 55 (optimal below 25), ALT 36 (optimal below 30): liver under metabolic strain from alcohol and diet. No fibrosis (FIB-4 0.96, APRI 0.24). Should normalise with alcohol cessation.\nAmylase 115 (upper limit 118): borderline high. Not diagnostic of pancreatitis but alcohol is a common driver. Monitor on retest after alcohol elimination.\nVitamin D 54 (optimal 75 to 120): insufficient at BMI 32.4 where fat tissue sequesters vitamin D. Requires supplementation at a higher dose.\nB12 359 (optimal above 500): suboptimal and may be contributing to fatigue. Sublingual methylcobalamin recommended.\nHbA1c 40 (optimal below 36, pre-diabetic threshold 42): within normal range but above optimal, drifting toward pre-diabetes territory. Insulin sensitivity is currently preserved (HOMA-IR 1.21) which is a positive, but the trajectory needs correcting with diet and weight loss.\nFerritin 283 (optimal 50 to 200): above optimal. May reflect genuine high iron stores or may be partly an acute-phase elevation driven by CRP 4.2 and ESR 40. Do not supplement with iron.\nUric acid 531 (upper limit 547): within range but close to the top. Driven by alcohol, processed food and reduced renal clearance. Risk factor for gout and kidney stones.\nCystatin C eGFR 86, combined eGFR 86 (optimal above 90): mildly below optimal kidney filtration. Not alarming at 59 but worth monitoring, especially given the uric acid load and cardiovascular risk factors.\nProgesterone 0.86 (lower limit 0.89): marginally below range. Minimal clinical significance in men but noted for completeness.\nFolate above 24 (range 3 to 17): elevated, almost certainly driven by multivitamin supplementation. Not harmful.\nTotal Antioxidant Activity 2.33 (upper limit 1.77): above range, likely driven by multivitamin supplementation.\nPSA ratio 0.18 (laboratory threshold 0.19): marginally below threshold but clinically irrelevant with a total PSA of 0.89, well below the 3.5 limit. No prostate concern.\nTyG Index 9.56 (target below 8.8): elevated, driven primarily by the triglycerides at 3.96. This index combines glucose and triglycerides to estimate metabolic risk and confirms the lipid-driven metabolic pressure despite preserved insulin sensitivity.\nReassuring negatives: thyroid function optimal with negative antibodies, insulin sensitivity preserved (HOMA-IR 1.21), no liver fibrosis (FIB-4 0.96), kidney function acceptable, no coeliac disease (tTG negative), no prostate concern (PSA 0.89), rheumatoid factor negative, immunoglobulins IgG IgM IgA within range, full blood count normal, PhenoAge 56.7 (2.3 years younger than calendar age).","recommendations":"Discuss the lipid panel with your GP as a priority. Bring these numbers: ApoB 1.66, LDL 4.1, triglycerides 3.96, Lp(a) 45.12, hsCRP 4.2, and Cardiovascular Risk Score 95. Ask for a formal cardiovascular risk assessment and discuss whether statin therapy or other lipid-lowering medication is appropriate alongside the lifestyle changes you are making.\nMention the ESR of 40 and CRP of 4.2 to your GP. These confirm significant systemic inflammation. If they do not normalise substantially after the three-month alcohol elimination and dietary changes, further investigation may be warranted, particularly given the family history of autoimmune disease.\nAsk your GP about the IgE of 216. If you have symptoms such as nasal congestion, skin irritation, breathlessness or digestive upset, a specific allergen panel could identify the trigger.\nDiscuss the oestradiol of 172 and testosterone of 13.8 at your next GP visit. The expectation is that weight loss and alcohol elimination will improve both, but if testosterone remains below 18 on retest, further hormonal assessment may be needed.\nRecord your Lp(a) of 45.12 in your permanent medical notes. This is inherited, cannot be changed, and your first-degree relatives should be offered testing.\nDiscuss with your GP your plan to taper and stop the SSRI and beta-blocker. Any changes to these medications should be made under medical supervision, not independently.\nRetest in 16 weeks with a focused panel: full lipid panel including ApoB and Lp(a), hsCRP, ESR, liver panel including GGT, HbA1c, fasting insulin, testosterone, oestradiol, SHBG, vitamin D, B12, uric acid, Cystatin C and a full blood count. The target markers: ApoB below 1.2 (below 0.9 long-term), triglycerides below 2.0, GGT below 30, CRP below 2.0, HbA1c below 38, testosterone above 15, vitamin D above 75. Calorie target: 2,000 to 2,200 kcal per day. Protein target: 137 to 168 grams per day. Weight target: 97 to 99 kg at the 16-week mark, 88 to 92 kg at 12 months.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. Why: your level is 54 and the target is 75 to 120. At BMI 32.4, fat tissue sequesters vitamin D, so a higher dose is needed. Always take with vitamin K2 below.\nVitamin K2 (MK-7): 200 mcg daily, taken alongside vitamin D3. Why: K2 directs calcium into bones and away from arteries, which is important given the cardiovascular risk profile in this report.\nOmega-3 fish oil: 3g combined EPA and DHA daily, split across two meals. Why: omega-3 lowers triglycerides (yours are 3.96, more than double the ideal), reduces inflammation (CRP 4.2), and supports cardiovascular health. Choose a product that states the EPA and DHA content per capsule, not just total fish oil.\nMagnesium glycinate: 400mg before bed. Why: your magnesium at 0.98 is within range but glycinate specifically supports sleep quality, which is your most immediate quality-of-life issue. It also supports cardiovascular health and glucose metabolism.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 359 is below the optimal threshold of 500 and may be contributing to your fatigue. Sublingual delivery bypasses the gut and is more reliable than oral tablets.\nDO NOT take iron supplements. Your ferritin is 283, well above optimal, and may be further elevated by inflammation. Additional iron could push stores into the harmful range.\nThe most important changes from this report are not supplements. They are eliminating alcohol, replacing ultra-processed food with real food built around protein and vegetables, and building daily walking into your routine. Supplements support these changes but cannot replace them.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4273","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 47 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 46.6. Weakest systems: inflammation 7%, lipids & cardiovascular 7%, immunology 19%. Biggest drags: LDL Cholesterol, Triglycerides, Apolipoprotein B, Remnant Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"56.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4430","lower_normal":"","upper_normal":"64","lower_optimal":"","upper_optimal":"59","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4609","units":"years","description":"PhenoAge is a biological age estimate calculated from clinical blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. At 56.7 against a calendar age of 59, his biological age is 2.3 years younger than his chronological age. This is a modestly positive finding. The main markers holding this score back are the elevated CRP at 4.2 and the RDW at 14.4. As inflammation decreases with the lifestyle changes planned, particularly alcohol elimination and dietary improvement, PhenoAge should improve further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, not a ten-year event probability. At 95, this is very high. The primary drivers are the ApoB at 1.66, triglycerides at 3.96, LDL at 4.1, CRP at 4.2 and Lp(a) at 45.12. At 59, there is no buffer between the score and the absolute risk, making this the most actionable finding in the report. The lifestyle changes planned, combined with a GP review for possible lipid-lowering medication, are aimed squarely at reducing this number.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4423","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. At 36, this is within the laboratory range but above the optimal threshold of 30 for men. The most likely drivers at this level are the combination of alcohol intake and the metabolic load from an ultra-processed diet. This is not a worrying elevation, but it confirms the liver is doing more work than it ideally should be. It should come down with the dietary changes and alcohol elimination planned.","low_causes":"","high_causes":"Alcohol, fatty liver, obesity, hepatitis, medications, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.6146","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart and muscles. Unlike ALT, it is not specific to the liver. At 31, this is within both the laboratory and optimal ranges, confirming that the mild ALT elevation is not part of a more significant liver injury pattern.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, alcohol, heart damage, muscle injury, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3767","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol and metabolic stress. At 55, this is within the laboratory range of 4 to 73 but more than double the optimal threshold of 25. GGT is one of the most responsive markers to alcohol intake, and at 15 or more drinks per week this elevation is expected. It is also influenced by excess body fat and processed food. This will be one of the clearest markers to track on retest after the three-month alcohol elimination.","low_causes":"","high_causes":"Alcohol, fatty liver, obesity, bile duct disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bones and bile ducts. At 71, it sits comfortably within both the laboratory and optimal ranges, confirming there is no bile duct obstruction or significant bone turnover issue.","low_causes":"Malnutrition, zinc deficiency","high_causes":"Bile duct disease, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. At 9, this is healthy and confirms normal red cell turnover and liver clearance.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood. At 77, this is within both the laboratory and optimal ranges, confirming adequate protein synthesis by the liver and a normal immune protein contribution.","low_causes":"Liver disease, malnutrition, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and medications, and maintains fluid balance. At 42, it is within the optimal range, confirming the liver's synthetic function is healthy.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is the collective name for the immune and transport proteins in the blood. At 35, it is within the laboratory range but at the upper end and above the optimal band of 20 to 32. Mildly elevated globulin can reflect chronic inflammation or immune activation, consistent with the elevated CRP and ESR in this report. It is not a concern on its own.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"115","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5852","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas that breaks down carbohydrates. At 115 against an upper limit of 118, it is within range but very close to the top. Significantly elevated amylase suggests pancreatitis, but at this marginal level it does not reach that threshold. Alcohol is one of the main drivers of amylase elevation, and this is worth monitoring on retest after the alcohol elimination period.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Pancreatitis, alcohol, gallstones, salivary gland disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4219","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3567","upper_optimal_position":"0.5833","units":"U/L","description":"Lipase is another pancreatic enzyme, this one specific to breaking down fats. At 35, it is comfortably within range and confirms that the borderline amylase is not part of a pancreatic inflammation picture.","low_causes":"","high_causes":"Pancreatitis, gallstones, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6950","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL, VLDL and others. At 7.2, this is well above the desirable limit of 5.18. The individual fractions below tell a more detailed story, but the headline is clear: there is significantly more cholesterol in the blood than there should be, driven by both LDL and triglyceride-rich particles.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, obesity, alcohol, hypothyroidism, genetics, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7200","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL, or low-density lipoprotein cholesterol, is the primary carrier of cholesterol into artery walls. At 4.1 against a target below 3.0 and an optimal target below 2.6, this is significantly elevated. LDL is driven by diet, particularly saturated fat and trans fats found in processed foods, by excess body weight, by alcohol, and by genetics. The Lp(a)-corrected LDL of 3.95 shows that his inherited Lp(a) contributes only a small fraction, meaning the vast majority of this elevation is modifiable.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, obesity, sedentary lifestyle, genetics, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.55","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7452","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein cholesterol, removes cholesterol from artery walls and returns it to the liver for disposal. It is the protective fraction. At 1.4, this is above the low-risk threshold of 1.04 but below the desirable level of 1.55. HDL is raised by regular exercise, moderate alcohol intake and weight loss, and lowered by sedentary behaviour, smoking and excess body fat. With no current exercise and a high BMI, there is clear room to improve this.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"3.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, produced by the liver from excess carbohydrates, sugar and alcohol. At 3.96, this is more than double the fasting target of 1.7 and nearly four times the optimal target of 1.0. This is one of the most actionable markers in the report because triglycerides respond rapidly to dietary change, alcohol elimination and increased activity. The ultra-processed diet, sugary food and heavy alcohol intake are all driving this number, and it should fall substantially within weeks of the planned changes.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism","high_causes":"Alcohol, refined carbohydrates, sugar, obesity, sedentary lifestyle, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, is a triglyceride-rich particle produced by the liver. At 1.8, more than double the upper limit of 0.78, this is heavily elevated and tracks directly with the triglyceride level. VLDL particles are atherogenic and contribute to plaque formation. This will fall in lockstep with triglycerides as diet and alcohol change.","low_causes":"","high_causes":"High triglycerides, alcohol, refined carbohydrates, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic fractions in a single number. At 5.8 against a target below 4.0, this is significantly elevated and reflects the combined burden of LDL, VLDL and other harmful particles.","low_causes":"","high_causes":"Elevated LDL, elevated triglycerides, obesity, poor diet, alcohol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5711","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. At 5.14 against a target below 4.5, this is elevated. It reflects both the high total cholesterol and the below-ideal HDL, and it is a well-established predictor of cardiovascular risk.","low_causes":"","high_causes":"High total cholesterol, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9222","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB, or apolipoprotein B, is a protein carried by every LDL, VLDL and Lp(a) particle. Because there is exactly one ApoB molecule per particle, it is the most accurate count of the number of atherogenic particles circulating in the blood. At 1.66 against a target below 0.9, this is nearly double the threshold and classified as very high. This is the single most important cardiovascular risk marker in this report. Every one of these particles can cross into the artery wall and begin forming plaque. The dietary changes, weight loss and alcohol elimination planned should reduce this significantly, and if they do not bring it below 0.9, lipid-lowering medication should be discussed with the GP.","low_causes":"","high_causes":"Diet high in saturated fat, obesity, genetics, sedentary lifestyle, alcohol, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6708","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. It drives the protective function of HDL, removing cholesterol from artery walls. At 1.61, this is above both the laboratory threshold of 1.2 and the optimal of 1.4, which is a positive finding. However, its protective effect is overwhelmed by the ApoB of 1.66 on the other side of the ratio.","low_causes":"Sedentary lifestyle, obesity, smoking, genetics","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.031","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5728","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered the best single summary of cardiovascular lipid risk. It balances the count of harmful particles (ApoB) against the count of protective particles (ApoA1). At 1.031, well above the 0.7 threshold and into the higher-risk category, the balance is heavily tilted toward arterial damage. The target is to bring ApoB down while maintaining or increasing ApoA1.","low_causes":"","high_causes":"High ApoB, low ApoA1, obesity, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"45.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7050","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a), or lipoprotein(a), is a genetically inherited lipoprotein that accelerates plaque formation in arteries through three mechanisms: it deposits cholesterol like LDL, it promotes clotting, and it drives inflammation. At 45.12 against a target below 32, this sits in the slightly increased risk band. Crucially, Lp(a) cannot be lowered by diet, exercise or any currently available medication. It is fixed by genetics and will not change. It should be recorded permanently in medical notes, and first-degree relatives should be offered testing. The practical implication is that this adds a fixed layer of risk on top of the modifiable lipid factors, making aggressive management of those modifiable factors even more important.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. At 4.5, this is within the optimal range of 4.0 to 5.4, confirming the body is controlling blood sugar effectively right now. This is a positive finding at BMI 32.4 with an ultra-processed diet.","low_causes":"Fasting, insulin excess, liver disease","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5238","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the previous two to three months. It gives a longer-term picture of blood sugar control than a single glucose reading. At 40, this is within the normal range of below 42 but above the optimal threshold of 36. The pre-diabetic range begins at 42, so there is a narrow buffer. This number is being pushed up by the ultra-processed diet and sugary food, and should come down with the dietary changes planned.","low_causes":"Iron deficiency anaemia, haemolysis, blood loss","high_causes":"Pre-diabetes, diabetes, high sugar diet, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"%","description":"This is the same HbA1c measurement expressed as a percentage rather than mmol/mol. At 5.8%, it is within the normal range of below 6.0% but above optimal, consistent with the mmol/mol reading of 40.","low_causes":"Iron deficiency anaemia, haemolysis","high_causes":"Pre-diabetes, diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4115","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3244","upper_optimal_position":"0.4133","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. At 6.07, this is within the optimal range of 2 to 8, meaning the pancreas is not working overtime and the body's cells are responding normally to insulin. At BMI 32.4 with no exercise and an ultra-processed diet, this level of insulin sensitivity is a genuine positive and suggests the metabolic window for change is still wide open.","low_causes":"Low carb diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, obesity, high carbohydrate diet, PCOS, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"642","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4609","lower_normal":"364","upper_normal":"1456","lower_optimal":"400","upper_optimal":"1200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3663","upper_optimal_position":"0.6099","units":"pmol/L","description":"C-peptide is released by the pancreas in equal amounts to insulin. It confirms how much insulin the pancreas is producing. At 642 pmol/L (converted from 1.94 ug/L), this is within the optimal range and confirms healthy pancreatic function. The lab result was reported as 1.94 ug/L.","low_causes":"Type 1 diabetes, low insulin production","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4714","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and gives an approximation of the average blood sugar level over the past two to three months. At 6.6, this is within the normal range of below 7 but above the optimal of 6.2, consistent with the HbA1c of 40. It reflects the impact of the ultra-processed diet and sugary food on average blood sugar control.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"9.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5432","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose into a single metabolic risk score. At 9.56, it is above the 8.8 threshold, driven almost entirely by the very high triglycerides at 3.96 rather than by the glucose, which is normal. This index highlights the metabolic risk from the lipid side even though insulin sensitivity is preserved, and it should normalise as triglycerides fall.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"hs-CRP, or high-sensitivity C-reactive protein, is produced by the liver in response to inflammation anywhere in the body. It is one of the most important markers for cardiovascular risk beyond the lipid panel. Below 1.0 is ideal, 1.0 to 3.0 is moderate risk, and above 3.0 is high risk. At 4.2, there is significant systemic inflammation. At BMI 32.4, visceral fat is the most likely primary driver, because fat tissue, particularly around the organs, is metabolically active and secretes inflammatory molecules called cytokines. Heavy alcohol intake and an ultra-processed diet both add to the inflammatory load. This level of inflammation independently increases cardiovascular risk and amplifies the damage from the elevated lipid profile.","low_causes":"","high_causes":"Visceral obesity, infection, chronic inflammation, autoimmune disease, smoking, alcohol, poor diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. It rises with inflammation, infection, tissue damage and certain blood disorders. At 40, more than three times the upper limit of 12, this is significantly elevated. When ESR and CRP are both raised, it confirms a genuine inflammatory process. At 59 with no diagnosed inflammatory condition, the most likely drivers are visceral adiposity, alcohol and poor diet. However, with a family history of autoimmune disease, this should be mentioned to the GP so they can assess whether further investigation is warranted.","low_causes":"Polycythaemia, sickle cell disease","high_causes":"Infection, inflammation, autoimmune disease, obesity, malignancy, anaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"164.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The PLR divides platelets by lymphocytes and is used as an additional inflammatory marker. At 164.4, it is within the laboratory range but marginally above the optimal band of 80 to 160. The mild elevation is consistent with the overall inflammatory picture shown by CRP and ESR, driven primarily by the platelet count being in the upper half of range.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"538","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets and lymphocytes into a single inflammation index. At 538, it is within the laboratory range but above the optimal band of 150 to 450. This is consistent with the elevated CRP and ESR, providing another angle confirming systemic inflammation.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the primary electrolyte that maintains fluid balance and blood pressure. At 140, it is within the optimal range, confirming healthy fluid and electrolyte balance.","low_causes":"Excess water intake, diuretics, SIADH, vomiting, diarrhoea","high_causes":"Dehydration, excess salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works with sodium to maintain fluid balance and acid-base equilibrium. At 101, it is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4758","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's primary acid buffer, maintaining blood pH within a very narrow range. At 24.7, it is within the optimal range, confirming normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.42, it is within the optimal range, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts for albumin levels, giving a more accurate picture when albumin is not mid-range. At 2.42, it is within the optimal range, consistent with the uncorrected calcium.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4559","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5714","units":"mmol/l","description":"Phosphate works alongside calcium in bone formation and energy metabolism. At 1.1, it is within the optimal range.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, alcohol","high_causes":"Kidney disease, hypoparathyroidism, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including muscle function, nerve signalling, blood sugar control and sleep regulation. At 0.98, it is within the optimal range of 0.85 to 1.05. However, blood magnesium only reflects about 1% of total body stores and can remain normal even when intracellular levels are low, particularly with heavy alcohol intake which depletes magnesium. Supplementation with magnesium glycinate is still recommended for its sleep and cardiovascular benefits.","low_causes":"Alcohol, poor diet, diuretics, malabsorption","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"531","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6279","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4823","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in red meat, organ meats, shellfish, alcohol (especially beer) and fructose. At 531 against an upper limit of 547, this is within range but close to the top and well above the optimal band of 200 to 380. Elevated uric acid is a risk factor for gout, kidney stones and cardiovascular disease. It is driven by the combination of heavy alcohol intake, processed food, probable high purine intake and reduced renal clearance. As alcohol is eliminated and diet improves, this should fall.","low_causes":"Low purine diet, medication","high_causes":"Alcohol, red meat, processed food, fructose, kidney disease, obesity, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. At 5, it is within the optimal range, confirming normal protein metabolism and kidney clearance.","low_causes":"Low protein diet, liver disease, over-hydration","high_causes":"Kidney disease, dehydration, high protein diet, GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a fairly constant rate. At 77, it is within the optimal range. However, creatinine can be misleadingly low when muscle mass is low, which is why the Cystatin C measurement is more informative in this case.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high meat intake, intense exercise, supplements","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR from creatinine estimates how well the kidneys are filtering waste. At above 90, this is within the optimal range by this measure. However, the Cystatin C-based eGFR gives a more accurate picture at this BMI with no resistance training.","low_causes":"Kidney disease, dehydration, medications","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.07","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4864","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function in people who are overweight or undertrained. At 1.07 against a limit of 1.1, this is within range but near the top and above the optimal threshold of 0.9. It gives a Cystatin C eGFR of 86, which is the more accurate measure of kidney filtration for this individual.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction, corticosteroids","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatincegfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR uses the Cystatin C level to estimate kidney filtration rate. At 86, this is above the 60 threshold for kidney disease but below the 90 target for optimal function. At 59 with a BMI of 32.4 and the cardiovascular risk factors present, this is not alarming but it is worth monitoring. Weight loss, blood pressure management and reducing the uric acid load will all support kidney function.","low_causes":"Kidney disease, dehydration, cardiovascular disease","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C for the most accurate estimate of kidney filtration. At 86, it confirms the Cystatin C eGFR and places kidney function below the optimal threshold of 90 but well above the 60 threshold for kidney disease. This is the number to track on retest.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"64.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4717","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish whether kidney changes are pre-renal (dehydration, blood loss) or intrinsic. At 64.9, this is within the optimal range, confirming normal kidney perfusion.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"150","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen. At 150, mid-range and within the optimal band, oxygen delivery to tissues is healthy.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, smoking, altitude, testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4033","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures the number of red blood cells per litre of blood. At 4.71, within the optimal range, red cell production is healthy.","low_causes":"Anaemia, blood loss, B12/folate deficiency, chronic disease","high_causes":"Dehydration, polycythaemia, smoking, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.436","within_normal":"TRUE","within_optima
