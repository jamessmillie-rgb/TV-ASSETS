 measures the average size of red blood cells. At 92.6, it is within the optimal range. Very large red cells can indicate B12 or folate deficiency; very small ones indicate iron deficiency or thalassaemia. At 92.6, neither is suggested.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12/folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6300","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH, or mean corpuscular haemoglobin, measures the average amount of haemoglobin per red blood cell. At 31.9, it is within the optimal range, confirming adequate haemoglobin loading.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12/folate deficiency, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"344","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, measures how concentrated haemoglobin is within each red blood cell. At 344, it is one point below the upper limit of 345, within range but just above the optimal band of 320 to 340. At this margin, this is a normal laboratory variation and has no clinical significance.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Spherocytosis, severe dehydration, laboratory artefact","padding":"1","one_sided": une cells in the blood. At 5.94, it is within the optimal range, confirming a healthy immune cell count overall.","low_causes":"Viral infection, bone marrow disorders, autoimmune disease, medications","high_causes":"Infection, inflammation, stress, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4180","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first line of defence against bacterial infection. At 3.27, within the optimal range, bacterial infection-fighting capacity is healthy.","low_causes":"Viral infection, medications, autoimmune disease, alcohol, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4900","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including fighting viruses, producing antibodies and immune memory. At 1.94, within the optimal range, the adaptive immune system is functioning well.","low_causes":"Viral infection (acute), HIV, corticosteroids, stress","high_causes":"Viral infection (chronic), lymphoma, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes", d cells, involved in allergic and inflammatory responses. At 0.02, within range and healthy.","low_causes":"Acute allergic reaction, corticosteroids","high_causes":"Allergy, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"2.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. Their percentage reflects how actively the marrow is producing new red cells. At 2.11%, within the optimal range, red cell production is active and healthy.","low_causes":"Iron/B12/folate deficiency, bone marrow disorders, chronic disease, low energy availability","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabs","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"99.381","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6627","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells rather than the percentage. At 99.381, it is within the laboratory range but just above the optimal band of 55 to 90. This is marginally above ideal but not a concern, and simply reflects active red cell production.","low_causes":"Iron/B12/folate deficiency, bone marrow disorders","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR","group":"HEMATOLOGY","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4483","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a simple marker of systemic inflammation derived from the white cell differential. At 1.69, calculated from neutrophils 3.27 divided by lymphocytes 1.94, it is within the optimal range of 1.0 to 2.0. Despite the elevated CRP and ESR, the NLR is clean, which suggests the inflammation is more likely from metabolic sources such as visceral fat rather than from an acute infection or active autoimmune flare.","low_causes":"","high_causes":"Infection, inflammation, stress, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"19.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by red blood cell count and helps distinguish iron-deficiency anaemia (above 13) from thalassaemia trait (below 13). At 19.7, it is consistent with normal red cell production and not suggestive of thalassaemia trait. Reported for context and not applicable at present.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"2.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"22.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5225","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5947","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. At 22.7, it is within the optimal range, confirming adequate iron availability for red blood cell production and energy metabolism.","low_causes":"Iron deficiency, chronic disease, blood loss, poor absorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"283","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6230","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's iron storage protein. At 283, it is within the laboratory range of 22 to 322 but above the optimal band of 50 to 200. Ferritin is also an acute-phase reactant, meaning it rises during inflammation. With CRP at 4.2 and ESR at 40, some of this elevation may be an inflammatory response rather than reflecting true iron overload. The transferrin saturation at 33.85% is within the optimal range of 25 to 40%, which is reassuring and makes haemochromatosis unlikely. Iron supplementation should be avoided.","low_causes":"Iron deficiency, blood loss, poor diet, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4822","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron in the blood. At 2.67, it is within the optimal range. Transferrin is a negative acute-phase reactant, meaning it can fall during inflammation. The fact that it remains mid-range despite the elevated CRP and ESR is reassuring.","low_causes":"Iron overload, chronic disease, inflammation, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"60.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5037","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3745","upper_optimal_position":"0.6030","units":"umol/l","description":"TIBC, or total iron binding capacity, measures how much iron the blood could carry if all transferrin were fully loaded. At 60.4, within the optimal range, iron transport capacity is healthy.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"33.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4764","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3892","upper_optimal_position":"0.5135","units":"%","description":"Transferrin saturation shows what percentage of transferrin is carrying iron. At 33.85%, within the optimal range of 25 to 40%, iron delivery to tissues is balanced. This normal saturation alongside the elevated ferritin makes haemochromatosis unlikely and supports the interpretation that the ferritin is partly an inflammatory response.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron supplementation, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"13.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4222","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, energy, libido, mood and body composition. At 13.8, it is within the laboratory range of 8.4 to 28.7 but well below the optimal band of 18 to 30. At 59, testosterone naturally declines with age, but the combination of BMI 32.4, heavy alcohol intake and no exercise is pushing it lower than it needs to be. Excess body fat increases aromatase enzyme activity, which converts testosterone to oestradiol, and alcohol suppresses testicular testosterone production. Both factors are modifiable, and testosterone should rise with weight loss and alcohol elimination.","low_causes":"Aging, obesity, alcohol, chronic illness, medications, sleep deprivation, opioids","high_causes":"Anabolic steroids, testosterone replacement, tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.3684","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4226","lower_normal":"0.138","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3869","upper_optimal_position":"0.5194","units":"nmol/l","description":"Free testosterone is the fraction not bound to SHBG or albumin and therefore available to enter cells and exert its effects. At 0.3684, it is within range and just inside the lower end of the optimal band. The low SHBG of 19.9 means a higher proportion than usual is free, but because the total pool is modest at 13.8, the absolute amount available is still in the lower portion of optimal.","low_causes":"Low total testosterone, high SHBG, aging","high_causes":"Low SHBG, anabolic steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"19.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3534","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3822","upper_optimal_position":"0.5780","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, controlling how much of each is free and active. At 19.9, just above the lower limit of 17.3 and well below the optimal range of 25 to 55, SHBG is low. Low SHBG is commonly driven by insulin resistance, high BMI, alcohol intake and metabolic syndrome. While it means a higher proportion of testosterone is technically free, it also reflects metabolic dysfunction and is associated with increased cardiovascular and metabolic risk. As weight falls and metabolic health improves, SHBG should rise.","low_causes":"Obesity, insulin resistance, type 2 diabetes, hypothyroidism, anabolic steroids","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen, anticonvulsants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"69.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4946","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index is calculated as (testosterone / SHBG) x 100 and provides a ratio that estimates how much testosterone is available relative to binding capacity. At 69.35, within the optimal range, this is normal and is buoyed by the low SHBG rather than by high testosterone.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, low SHBG, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"172","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5887","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. In men, it is produced by the aromatase enzyme converting testosterone into oestradiol, and this conversion happens predominantly in fat tissue. At 172, above the male upper limit of 146.1, oestradiol is elevated. At BMI 32.4, there is more fat tissue and therefore more aromatase activity. Alcohol further stimulates aromatase. Elevated oestradiol in men can contribute to fatigue, low mood, water retention, breast tissue changes and difficulty losing body fat. It also pulls testosterone down because the body is converting too much of it. Weight loss and alcohol elimination should reduce aromatase activity and bring oestradiol back into range.","low_causes":"Low body fat, aromatase inhibitors, menopause","high_causes":"Obesity, alcohol, liver disease, aromatase excess, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2860","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3700","upper_optimal_position":"0.6040","units":"nmol/L","description":"Progesterone in men plays a modest role in mood regulation, sleep quality and acts as a precursor to other hormones. At 0.86, marginally below the lower limit of 0.89, it is fractionally out of range. In men, progesterone levels are low by nature, and at this margin the shortfall is minimal. It is noted for completeness alongside the reported poor sleep and low mood, but it is not a primary driver of those symptoms.","low_causes":"Adrenal insufficiency, low body fat","high_causes":"Adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3781","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3859","upper_optimal_position":"0.6154","units":"mIU/ml","description":"LH, or luteinising hormone, is released by the pituitary gland and signals the testes to produce testosterone. At 2.31, it is within the laboratory range but in the lower portion and below the optimal band. In the context of a low testosterone, a low-normal LH suggests the pituitary is not sending a strong enough signal to drive more testosterone production. This is a common pattern with obesity and alcohol, where the hypothalamic-pituitary axis is suppressed by excess oestradiol and by the metabolic environment rather than by pituitary disease.","low_causes":"Obesity, oestrogen excess, medications, pituitary dysfunction","high_causes":"Primary hypogonadism, menopause, ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3624","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"3","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3429","upper_optimal_position":"0.5683","units":"mIU/ml","description":"FSH, or follicle stimulating hormone, is produced by the pituitary and, in men, supports sperm production. At 2.95, it is within range but in the lower portion, consistent with the low-normal LH and the suppressed pituitary signalling pattern described above.","low_causes":"Obesity, oestrogen excess, medications, pituitary dysfunction","high_causes":"Primary hypogonadism, aging, testicular damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"115","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4606","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for its role in milk production in women, but in men it helps regulate the immune system and reproductive function. At 115, within the optimal range, there is no suggestion of a prolactin-secreting pituitary tumour, which would suppress testosterone through a different mechanism.","low_causes":"Dopamine agonists","high_causes":"Pituitary tumour, medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"303","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4660","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3849","upper_optimal_position":"0.5834","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. A morning level reflects the natural cortisol peak that helps wake the body. At 303, this is within the optimal range. Despite reporting high stress most days, the morning cortisol is not elevated, which is reassuring. However, a single morning cortisol does not capture the full daily rhythm; the afternoon crash and wired-at-night pattern he reports could reflect a shifted cortisol curve that a morning blood draw does not detect.","low_causes":"Adrenal insufficiency, chronic fatigue, overtraining","high_causes":"Chronic stress, Cushing's syndrome, medications (prednisolone), depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"590","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4475","lower_normal":"162","upper_normal":"4941","lower_optimal":"300","upper_optimal":"3500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3622","upper_optimal_position":"0.6313","units":"ug/dL","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It declines with age. At 590 ug/dL (converted from 1.6 umol/L), this is within the optimal range for age, confirming healthy adrenal function. The lab result was reported as 1.6 umol/L.","low_causes":"Aging, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"8.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6400","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and the loosely albumin-bound fraction that can enter cells. At 8.44, it is within the optimal range. The low SHBG means more testosterone is bioavailable than the total of 13.8 might suggest, but a higher total would still be preferable for energy, mood, muscle maintenance and body composition.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"8.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Free Oestradiol Index estimates the proportion of oestradiol that is unbound and biologically active. At 8.64, this is reported for context. With low SHBG at 19.9, a greater proportion of the already elevated oestradiol is free and active, amplifying its effects.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4118","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.4721","units":"mIU/l","description":"TSH, or thyroid stimulating hormone, is the pituitary's signal to the thyroid gland. When the thyroid is underactive, TSH rises to try to stimulate it; when overactive, TSH falls. At 1.66, comfortably within the optimal range of 1.0 to 2.5, the pituitary is satisfied with thyroid output. This is particularly reassuring given the family history of autoimmune disease.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"15.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3899","upper_optimal_position":"0.5491","units":"pmol/l","description":"Free T4, or free thyroxine, is the thyroid's storage hormone. It circulates in the blood and is converted to the active form, T3, in the tissues. At 15.8, within the optimal range of 14 to 20, the thyroid is producing adequate T4.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5037","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the active thyroid hormone that cells use for metabolism, energy production and temperature regulation. At 4.9, within the optimal range of 4.5 to 6.5, the body is converting T4 to T3 effectively.","low_causes":"Hypothyroidism, severe illness, low calorie intake, selenium deficiency","high_causes":"Hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoab","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies target the thyroid peroxidase enzyme, which the thyroid needs to produce its hormones. Elevated levels indicate the immune system is attacking the thyroid, a pattern seen in Hashimoto's thyroiditis. At below 6.6, well within the negative range, there is no autoimmune thyroid attack. This is particularly reassuring given the family history of autoimmune disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tgab","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. At below 1.3, well below the 4.4 threshold, there is no autoimmune thyroid activity. Both thyroid antibodies are negative, confirming the thyroid is healthy and not under autoimmune attack.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the storage hormone T4 into the active hormone T3. At 0.31, within the optimal range, conversion is healthy and efficient.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune function, mood regulation and muscle strength. At 54, this crosses the sufficiency threshold of 50 but sits well below the optimal range of 75 to 120. At BMI 32.4, vitamin D is sequestered in fat tissue, meaning the blood level underestimates the body's actual need and a higher supplementation dose is required to reach optimal levels. Low vitamin D is associated with fatigue, low mood, poor sleep quality and increased inflammation, all of which he reports. He takes a multivitamin, but the vitamin D dose in most multivitamins (typically 400 to 800 IU) is insufficient to correct this shortfall.","low_causes":"Insufficient sunlight, obesity (fat sequesters vitamin D), dark skin, aging, malabsorption, indoor lifestyle","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"359","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4433","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4555","upper_optimal_position":"0.6267","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis and energy production. At 359, it is within the laboratory range but below the optimal threshold of 500. Suboptimal B12 can contribute to fatigue, brain fog, low mood and nerve tingling. He takes a multivitamin, but B12 in standard multivitamins is often in the cyanocobalamin form and at too low a dose to correct a shortfall. Sublingual methylcobalamin at 1,000 mcg daily is the most effective way to raise it.","low_causes":"Poor diet, malabsorption, vegan/vegetarian diet, age, metformin, alcohol, gastric acid reduction","high_causes":"Supplementation, liver disease, blood cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"> 24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7059","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for cell division, DNA repair and red blood cell formation. At above 24, it is elevated above the laboratory range of 3 to 17. This is almost certainly driven by the multivitamin supplementation, which typically contains 400 to 800 mcg of folic acid. Elevated folate from supplementation is not harmful, though very high folate can mask a B12 deficiency, which is relevant here given his B12 of 359 is suboptimal. The B12 supplementation recommended below will address this balance.","low_causes":"Poor diet, alcohol, malabsorption, medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"2.33","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6571","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total Antioxidant Activity measures the overall antioxidant capacity of the blood. At 2.33, above the upper limit of 1.77, this is elevated. TAA above range is commonly driven by antioxidant supplementation, particularly vitamins C and E in multivitamins, and by dietary polyphenols or alcohol metabolites. It is not harmful and does not require action.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Supplementation (vitamins C, E), polyphenol-rich diet, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"4.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6016","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3815","upper_optimal_position":"0.5693","units":"pmol/L","description":"PTH, or parathyroid hormone, regulates calcium levels in the blood. When calcium or vitamin D is low, PTH rises to pull calcium from bones. At 4.5, it is within the laboratory range but near the top and above the optimal band of 1.5 to 4.0. This is likely a compensatory response to the suboptimal vitamin D of 54. As vitamin D rises with supplementation, PTH should fall toward the middle of the range.","low_causes":"Excess vitamin D, high calcium, autoimmune hypoparathyroidism","high_causes":"Vitamin D deficiency, hyperparathyroidism, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"VITAMINS & NUTRIENTS","result":"126","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4595","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found in muscle, heart and brain. It rises after muscle damage from exercise, injury or disease. At 126, within the optimal range, there is no sign of muscle damage. With no exercise, this is expected.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1271","lower_normal":"0","upper_normal":"3.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"ng/ml","description":"PSA, or prostate-specific antigen, is a protein produced by the prostate gland. It is used as a screening marker for prostate disease, including benign enlargement and prostate cancer. At 0.89, well below the 3.5 threshold, this is a reassuring result with no suggestion of prostate concern.","low_causes":"","high_causes":"Prostate cancer, benign prostatic hyperplasia, prostatitis, recent ejaculation, cycling","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA is the unbound fraction of PSA. The ratio of free to total PSA helps distinguish benign conditions from potential malignancy. At 0.16, this is within range.","low_causes":"","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"psaratio","name":"PSA Ratio","group":"PROSTATE","result":"0.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4737","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps assess prostate cancer risk. A ratio above 0.25 is reassuring; below 0.15 is more concerning. At 0.18, this is marginally below the laboratory's 0.19 threshold but, with a total PSA of only 0.89, the ratio is clinically irrelevant. PSA ratios are most meaningful when total PSA is in the grey zone of 4 to 10, not at 0.89. There is no prostate concern.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"30.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4124","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4054","units":"U/ml","description":"CA 19-9 is a tumour marker associated with pancreatic, gastrointestinal and bile duct cancers. It is not a screening test and can be elevated by benign conditions such as pancreatitis, gallstones and liver disease. At 30.51, within the laboratory range of below 37 but above the optimal threshold of 30, it is marginally elevated. In the context of the borderline amylase and heavy alcohol intake, this is not surprising and does not suggest malignancy, but it is worth monitoring on retest.","low_causes":"","high_causes":"Pancreatic cancer, gallstones, pancreatitis, liver disease, inflammatory bowel disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2913","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4348","units":"ng/ml","description":"CEA, or carcinoembryonic antigen, is a tumour marker associated with colorectal and other gastrointestinal cancers. At 1.34, well within the non-smoker range of below 2.3 and within the optimal band, this is reassuring.","low_causes":"","high_causes":"Colorectal cancer, smoking, inflammatory bowel disease, pancreatitis, liver disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5088","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant immunoglobulin in the blood and provides long-term immunity against infections. At 11.5, within range, the immune system's long-term memory and protection are functioning normally.","low_causes":"Immune deficiency, medications, chronic disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first immunoglobulin produced during an immune response. At 1.4, within range, acute immune responses are functioning normally.","low_causes":"Immune deficiency","high_causes":"Acute infection, autoimmune disease, lymphoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5484","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the immunoglobulin that protects mucosal surfaces such as the gut, lungs and urinary tract. At 2.6, within range, mucosal immunity is healthy. Adequate IgA also confirms that the coeliac screening (tTG IgA) is reliable, since IgA deficiency can produce false negative results.","low_causes":"Selective IgA deficiency (genetic), medications","high_causes":"IgA nephropathy, liver disease, autoimmune disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"216","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"IU/ml","description":"IgE is the immunoglobulin produced during allergic reactions and, less commonly, in response to parasitic infections. At 216, more than double the upper limit of 100, this indicates significant allergic sensitisation. The immune system is reacting to one or more allergens. Common triggers include dust mites, moulds, pet dander, pollen, certain foods and, relevant here, cannabis smoke. The eosinophil count is normal at 0.21, making a parasitic cause less likely. If there are symptoms such as nasal congestion, skin irritation, breathlessness, watery eyes or digestive upset, the GP can arrange specific allergen testing to identify the trigger.","low_causes":"Immune deficiency","high_causes":"Allergy, atopy, parasitic infection, eczema, asthma, drug reactions","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. At below 4, well within the negative range, there is no serological evidence of rheumatoid arthritis. This is reassuring given the family history of autoimmune disease.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease, aging","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.568","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0395","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"tTG IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the lining of the small intestine. At 0.568, well within the negative range of below 7.19, coeliac disease is ruled out. This test is only reliable when the person is eating a gluten-containing diet, which he is.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"agratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio divides albumin (42) by globulin (35). At 1.2, it is at the lower end of the optimal band. A low A/G ratio can indicate chronic inflammation or liver disease. At 1.2 with albumin at 42 and globulin at 35, the ratio is being pulled down by the relatively high globulin, consistent with the inflammatory state rather than liver disease.","low_cause // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
