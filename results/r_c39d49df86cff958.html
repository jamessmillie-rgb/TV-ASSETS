500", "units": "/100", "description": "Cardiovascular Risk Score is calculated from your measured results. It sits outside the ideal range. It is being driven by Total Cholesterol, which sits outside the ideal range.", "low_causes": "", "high_causes": "Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "glucose", "name": "Blood Glucose", "group": "GLUCOSE & INSULIN", "result": "5", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5333", "lower_normal": "3.5", "upper_normal": "6", "lower_optimal": "4", "upper_optimal": "5.4", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3667", "upper_optimal_position": "0.5933", "units": "mmol/L", "description": "Blood glucose measures the concentration of sugar circulating in Marina's blood after fasting. It is the body's primary fuel source, and keeping fasting levels within a tight range is essential for sustained energy and long-term metabolic health. Her result of 5.0 mmol/L sits within the optimal range of 4.0 to 5.4, indicating that her body is managing blood sugar effectively at the time of the test.", "low_causes": "Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency", "high_causes": "Insulin resistance, prediabetes, type 2 diabetes, stress response, corticosteroid use", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "hba1c_pct", "name": "HbA1c (%)", "group": "GLUCOSE & INSULIN", "result": "5.6", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4667", "lower_normal": "4", "upper_normal": "6", "lower_optimal": "4", "upper_optimal": "5.7", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.6167", "units": "%", "description": "HbA1c reflects Marina's average blood sugar levels over the past two to three months. It measures the percentage of haemoglobin molecules in the blood that have glucose attached to them. Unlike a single fasting glucose reading, HbA1c provides a longer-term picture. Her result of 5.6% is within the normal range and well below the pre-diabetes threshold of 6.0%.", "low_causes": "Iron deficiency (can falsely lower), haemolytic anaemia, chronic blood loss", "high_causes": "Sustained elevated blood sugar, prediabetes, type 2 diabetes", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "hba1c_mmol", "name": "HbA1c (mmol/mol)", "group": "GLUCOSE & INSULIN", "result": "37", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4861", "lower_normal": "20", "upper_normal": "42", "lower_optimal": "20", "upper_optimal": "36", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5758", "units": "mmol/mol", "description": "This is the same HbA1c measurement expressed in mmol/mol, the internationally standardised unit. Marina's result of 37 is within the normal range and below the pre-diabetes threshold of 42. It is worth noting that iron deficiency, which Marina has, can sometimes cause HbA1c to read slightly higher than the true value because iron-deficient red blood cells live longer and accumulate more glucose on their haemoglobin. Her true average blood sugar may therefore be slightly lower than this reading suggests.", "low_causes": "Iron deficiency (can affect reading), haemolytic anaemia", "high_causes": "Prediabetes, type 2 diabetes, sustained hyperglycaemia", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "insulin", "name": "Insulin", "group": "GLUCOSE & INSULIN", "result": "7.74", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4106", "lower_normal": "2.6", "upper_normal": "24.9", "lower_optimal": "2", "upper_optimal": "8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3253", "upper_optimal_position": "0.3973", "units": "mIU/L", "description": "Insulin is the hormone produced by the pancreas that allows cells to absorb glucose from the blood. Measuring fasting insulin alongside glucose provides a much more sensitive picture of metabolic health than glucose alone, because insulin can rise years before glucose becomes abnormal. Marina's fasting insulin of 7.74 is within both the laboratory range and the optimal range of 2 to 8 mIU/L, indicating that her pancreas is not having to overwork to keep her blood sugar controlled.", "low_causes": "Low carbohydrate diet, very lean body composition, type 1 diabetes", "high_causes": "Insulin resistance, excess carbohydrate intake, obesity, polycystic ovary syndrome", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "c_peptide", "name": "C-Peptide", "group": "GLUCOSE & INSULIN", "result": "1.04", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2726", "lower_normal": "1.1", "upper_normal": "4.4", "lower_optimal": "1.1", "upper_optimal": "3.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5758", "units": "ug/L", "description": "C-peptide is a molecule released by the pancreas in equal amounts to insulin. Because it is not cleared by the liver the way insulin is, it provides a more accurate measure of how much insulin the pancreas is actually producing. Marina's result of 1.04 ug/L (approximately 344 pmol/L) is marginally below the lower limit of 1.1. In the context of a normal fasting glucose and normal HbA1c, this does not suggest pancreatic insufficiency. It simply reflects that her pancreas does not need to produce large amounts of insulin to keep her blood sugar controlled, which at her low BMI is expected.", "low_causes": "Low insulin demand, low carbohydrate intake, lean body composition, sample degradation", "high_causes": "Insulin resistance, obesity, insulinoma, type 2 diabetes", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "homa_ir", "name": "HOMA-IR", "group": "GLUCOSE & INSULIN", "result": "1.72", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.7393", "lower_normal": "0.5", "upper_normal": "1.5", "lower_optimal": "0.5", "upper_optimal": "1", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5000", "units": "", "description": "HOMA-IR is a calculated index that estimates insulin resistance by combining fasting glucose and fasting insulin. A lower score means the body needs less insulin to manage blood sugar, which is desirable. Marina's result of 1.72 is above the upper limit of 1.5, indicating mild insulin resistance. At her low BMI of 18.9, this is somewhat unexpected and is most likely explained by her very low level of physical activity. Skeletal muscle is the body's largest glucose sink, and without regular contraction through exercise, muscle tissue becomes less responsive to insulin.", "low_causes": "High insulin sensitivity, low carbohydrate diet, lean active individuals", "high_causes": "Physical inactivity, excess calorie intake, obesity, metabolic syndrome", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "homa_b", "name": "HOMA-B (Calculated)", "group": "GLUCOSE & INSULIN", "result": "103.2", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4600", "lower_normal": "80", "upper_normal": "200", "lower_optimal": "100", "upper_optimal": "180", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3889", "upper_optimal_position": "0.6111", "units": "", "description": "HOMA-B estimates the functional capacity of the pancreatic beta cells, the cells that produce insulin. It is calculated from fasting insulin and glucose. Marina's result of 103.2 is within the normal range of 80 to 200, indicating that her pancreas is functioning adequately. This is consistent with the overall picture of a healthy glucose metabolism despite the mild insulin resistance driven by physical inactivity.", "low_causes": "Beta cell dysfunction, progressing type 2 diabetes, late-stage insulin resistance", "high_causes": "Compensatory insulin overproduction, early insulin resistance", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "alt", "name": "ALT/GPT", "group": "LIVER & METABOLIC", "result": "18", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.3214", "lower_normal": "0", "upper_normal": "56", "lower_optimal": "0", "upper_optimal": "25", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.2232", "units": "IU/L", "description": "ALT (alanine aminotransferase) is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Marina's ALT of 18 is well within the optimal range for women of below 25 IU/L, indicating that her liver cells are healthy and free from metabolic strain.", "low_causes": "Normal finding", "high_causes": "Fatty liver disease, alcohol, medications, hepatitis, intense exercise", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "ast", "name": "AST/GOT", "group": "LIVER & METABOLIC", "result": "22", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4531", "lower_normal": "13", "upper_normal": "45", "lower_optimal": "13", "upper_optimal": "30", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5208", "units": "IU/L", "description": "AST (aspartate aminotransferase) is found in the liver, heart, and muscles. It is less liver-specific than ALT but provides useful context when interpreted alongside it. Marina's AST of 22 is within the optimal range, and the AST-to-ALT ratio of 1.2 is normal and not suggestive of any liver pathology.", "low_causes": "Vitamin B6 deficiency", "high_causes": "Liver disease, muscle damage, heart disease, intense exercise, alcohol", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ggt", "name": "Gamma GT", "group": "LIVER & METABOLIC", "result": "10", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.1316", "lower_normal": "4", "upper_normal": "38", "lower_optimal": "4", "upper_optimal": "25", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5278", "units": "IU/L", "description": "Gamma GT (gamma-glutamyltransferase) is the most sensitive liver enzyme for detecting bile duct problems, alcohol-related liver stress, and metabolic overload. Marina's GGT of 10 is excellent, well within the optimal range of below 25 IU/L. This indicates her liver is under no metabolic strain at all.", "low_causes": "Normal finding", "high_causes": "Alcohol, medications, bile duct obstruction, fatty liver, metabolic syndrome", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "alp", "name": "Alkaline Phosphatase", "group": "LIVER & METABOLIC", "result": "49", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.3476", "lower_normal": "46", "upper_normal": "116", "lower_optimal": "50", "upper_optimal": "100", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3524", "upper_optimal_position": "0.5905", "units": "IU/L", "description": "Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, and bile ducts. It helps assess bile flow and bone turnover. Marina's ALP of 49 is within the laboratory range and near the lower end, which is normal and reassuring. It falls just below the optimal lower boundary of 50, which is not clinically meaningful.", "low_causes": "Zinc deficiency, hypothyroidism, anaemia", "high_causes": "Bile duct obstruction, bone disorders, liver disease, pregnancy, vitamin D deficiency", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "bilirubin", "name": "Total Bilirubin", "group": "LIVER & METABOLIC", "result": "30", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.8229", "lower_normal": "5", "upper_normal": "21", "lower_optimal": "5", "upper_optimal": "17", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5833", "units": "umol/L", "description": "Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes it for excretion. Marina's bilirubin of 30 is above the upper limit of 21, but every one of her liver enzymes (ALT, AST, GGT, ALP) is completely clean. This pattern of isolated elevated bilirubin with no other liver abnormality is characteristic of Gilbert's syndrome, a harmless inherited variation in the liver's ability to conjugate bilirubin. It affects approximately 5 to 10% of the population, does not progress, and does not require treatment.", "low_causes": "Normal finding, some medications", "high_causes": "Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "total_protein", "name": "Total Protein", "group": "LIVER & METABOLIC", "result": "84", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.6933", "lower_normal": "57", "upper_normal": "82", "lower_optimal": "63", "upper_optimal": "78", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3733", "upper_optimal_position": "0.6067", "units": "g/L", "description": "Total protein measures the combined amount of albumin and globulin in the blood. Marina's result of 84 is slightly above the upper limit of 82. This is being driven by her elevated globulin fraction (37 g/L), which in turn reflects her elevated immunoglobulin levels, most likely related to her active autoimmune thyroid disease. It is not an independent concern.", "low_causes": "Malnutrition, liver disease, kidney disease, malabsorption", "high_causes": "Chronic inflammation, autoimmune disease, chronic infection, dehydration", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "albumin", "name": "Albumin", "group": "LIVER & METABOLIC", "result": "47", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5833", "lower_normal": "34", "upper_normal": "50", "lower_optimal": "40", "upper_optimal": "50", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4583", "upper_optimal_position": "0.6667", "units": "g/L", "description": "Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and serves as a marker of both liver synthetic function and nutritional status. Marina's albumin of 47 is within the optimal range, confirming that her liver is producing protein well and that her nutritional status, despite the modest diet quality and volume, is adequate for albumin synthesis.", "low_causes": "Liver disease, malnutrition, kidney disease, chronic inflammation", "high_causes": "Dehydration", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "globulin", "name": "Globulin", "group": "LIVER & METABOLIC", "result": "37", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.7037", "lower_normal": "18", "upper_normal": "36", "lower_optimal": "22", "upper_optimal": "34", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3889", "upper_optimal_position": "0.6296", "units": "g/L", "description": "Globulin encompasses the immune proteins (immunoglobulins) and transport proteins in the blood. Marina's globulin of 37 is slightly above the upper limit of 36, which is consistent with her elevated IgM and her active autoimmune thyroid disease. The immune system's ongoing response to the thyroid gland produces more immunoglobulins, pushing the globulin fraction up. This is not an independent finding requiring separate investigation.", "low_causes": "Immune deficiency, liver disease, malnutrition", "high_causes": "Autoimmune disease, chronic infection, chronic inflammation, liver disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ag_ratio", "name": "A/G Ratio (Calculated)", "group": "LIVER & METABOLIC", "result": "1.27", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4524", "lower_normal": "1.1", "upper_normal": "2.5", "lower_optimal": "1.3", "upper_optimal": "2.2", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3810", "upper_optimal_position": "0.5952", "units": "", "description": "The albumin-to-globulin ratio provides a quick assessment of the balance between these two protein groups. Marina's A/G ratio of 1.27 is within the laboratory range but marginally below the optimal floor of 1.3, reflecting the slightly elevated globulin from her autoimmune activity. The albumin side is healthy, so the ratio is being pulled down by the globulin numerator rather than a deficiency in albumin production.", "low_causes": "Elevated globulins from autoimmune disease or infection, low albumin", "high_causes": "Immune deficiency, certain genetic conditions", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "amylase", "name": "Amylase", "group": "LIVER & METABOLIC", "result": "74", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5000", "lower_normal": "30", "upper_normal": "118", "lower_optimal": "40", "upper_optimal": "100", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3712", "upper_optimal_position": "0.5985", "units": "IU/L", "description": "Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starches. Marina's amylase of 74 is within the optimal range, indicating normal pancreatic function with no sign of inflammation or blockage.", "low_causes": "Chronic pancreatitis (late-stage), cystic fibrosis", "high_causes": "Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "lipase", "name": "Lipase", "group": "LIVER & METABOLIC", "result": "55", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.6312", "lower_normal": "13", "upper_normal": "60", "lower_optimal": "13", "upper_optimal": "50", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5886", "units": "U/L", "description": "Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase. Marina's lipase of 55 is within the laboratory range of 13 to 60, though toward the upper end. This is still a normal result and does not indicate pancreatic inflammation.", "low_causes": "Normal finding", "high_causes": "Pancreatitis, gallstones, kidney disease, bowel obstruction", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "fib4", "name": "FIB-4 Index", "group": "LIVER & METABOLIC", "result": "0.73", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.1367", "lower_normal": "", "upper_normal": "2.67", "lower_optimal": "", "upper_optimal": "1.3", "lower_normal_position": "0.0000", "upper_normal_position": "0.5000", "lower_optimal_position": "0.0000", "upper_optimal_position": "0.2434", "units": "score", "description": "The FIB-4 score is a calculated index that uses age, ALT, AST, and platelet count to estimate the likelihood of liver fibrosis (scarring). Marina's score of 0.73 is comfortably below the threshold of 1.3 that would prompt further investigation, confirming that there is no sign of liver scarring.", "low_causes": "Normal healthy liver", "high_causes": "Liver fibrosis, cirrhosis, age", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "apri", "name": "APRI", "group": "LIVER & METABOLIC", "result": "0.193", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.0643", "lower_normal": "", "upper_normal": "1.5", "lower_optimal": "", "upper_optimal": "0.5", "lower_normal_position": "0.0000", "upper_normal_position": "0.5000", "lower_optimal_position": "0.0000", "upper_optimal_position": "0.1667", "units": "score", "description": "APRI is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.", "low_causes": "", "high_causes": "Liver fibrosis, cirrhosis", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "nafldfibrosisscore", "name": "NAFLD Fibrosis Score", "group": "LIVER & METABOLIC", "result": "-4.015", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "", "lower_normal": "", "upper_normal": "", "lower_optimal": "", "upper_optimal": "", "lower_normal_position": "", "upper_normal_position": "", "lower_optimal_position": "", "upper_optimal_position": "", "units": "score", "description": "NAFLD Fibrosis Score is reported for context only and is not applicable at present, so it is not flagged.", "low_causes": "", "high_causes": "Advanced fibrosis in fatty liver disease", "padding": "1", "one_sided": "0.5", "range_type": "informational"}, {"key": "deritisratio", "name": "AST:ALT Ratio (De Ritis)", "group": "LIVER & METABOLIC", "result": "1.22", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "", "lower_normal": "", "upper_normal": "", "lower_optimal": "", "upper_optimal": "", "lower_normal_position": "", "upper_normal_position": "", "lower_optimal_position": "", "upper_optimal_position": "", "units": "ratio", "description": "AST:ALT Ratio (De Ritis) is reported for context only and is not applicable at present, so it is not flagged.", "low_causes": "Fatty liver, viral hepatitis", "high_causes": "Alcohol-related liver disease, cirrhosis, muscle injury", "padding": "1", "one_sided": "0.5", "range_type": "informational"}, {"key": "cholesterol", "name": "Total Cholesterol", "group": "LIPIDS & CARDIOVASCULAR", "result": "6", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.5792", "lower_normal": "0", "upper_normal": "5.18", "lower_optimal": "0", "upper_optimal": "5", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.4826", "units": "mmol/L", "description": "Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL (harmful), HDL (protective), and VLDL. Marina's total cholesterol of 6.0 is above the desirable threshold of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk because it does not distinguish between harmful and protective fractions. In Marina's case, a significant proportion of her total cholesterol is driven by her excellent HDL of 2.1, so the picture is more nuanced than the headline number suggests.", "low_causes": "Hyperthyroidism, malnutrition, liver disease, malabsorption", "high_causes": "Diet high in saturated fat, hypothyroidism, genetic predisposition, liver disease, obesity", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "triglycerides", "name": "Triglycerides", "group": "LIPIDS & CARDIOVASCULAR", "result": "0.74", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.2176", "lower_normal": "0", "upper_normal": "1.7", "lower_optimal": "0", "upper_optimal": "1", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.2941", "units": "mmol/L", "description": "Triglycerides are the main form of stored fat in the body, carried in the blood primarily within VLDL particles. Elevated triglycerides are associated with insulin resistance and increased cardiovascular risk. Marina's triglycerides of 0.74 are excellent, well within the optimal range of below 1.0 mmol/L, reflecting good metabolic handling of dietary fats.", "low_causes": "Low-fat diet, hyperthyroidism, malabsorption, malnutrition", "high_causes": "Excess carbohydrates and sugar, alcohol, obesity, insulin resistance, hypothyroidism", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "vldl", "name": "VLDL Cholesterol", "group": "LIPIDS & CARDIOVASCULAR", "result": "0.34", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.2179", "lower_normal": "0", "upper_normal": "0.78", "lower_optimal": "0", "upper_optimal": "0.5", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.3205", "units": "mmol/L", "description": "VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues around the body. It is considered an atherogenic particle, meaning it contributes to plaque formation. Marina's VLDL of 0.34 is well within the optimal range, consistent with her excellent triglyceride level.", "low_causes": "Low-fat diet, hyperthyroidism", "high_causes": "Excess carbohydrates, obesity, insulin resistance, alcohol", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "hdl", "name": "HDL Cholesterol", "group": "LIPIDS & CARDIOVASCULAR", "result": "2.1", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.6774", "lower_normal": "1.04", "upper_normal": "3.1", "lower_optimal": "1.6", "upper_optimal": "3.1", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4247", "upper_optimal_position": "0.6667", "units": "mmol/L", "description": "HDL (high-density lipoprotein) is the protective cholesterol fraction. It removes excess cholesterol from the arterial walls and transports it back to the liver for disposal, a process called reverse cholesterol transport. Marina's HDL of 2.1 is excellent, well above the optimal threshold of 1.6 for women. This is one of the strongest protective factors in her lipid profile.", "low_causes": "Physical inactivity, smoking, obesity, insulin resistance, poor diet", "high_causes": "Regular exercise, genetics, moderate alcohol consumption, healthy diet", "padding": "1", "one_sided": "0.5", "range_type": "no upper"}, {"key": "ldl", "name": "LDL Cholesterol", "group": "LIPIDS & CARDIOVASCULAR", "result": "3.61", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.5773", "lower_normal": "0.5", "upper_normal": "3", "lower_optimal": "0.5", "upper_optimal": "2.6", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.6133", "units": "mmol/L", "description": "LDL (low-density lipoprotein) is the primary carrier of cholesterol into the arterial walls, where it can accumulate and contribute to plaque formation over decades. Marina's LDL of 3.61 is above the upper limit of 3.0. However, this needs to be interpreted alongside her excellent HDL and triglycerides, and the important context that undertreated hypothyroidism (her TSH remains elevated at 6.41) is a well-established cause of elevated LDL because thyroid hormone is needed for the liver to clear LDL from the blood. Optimising her levothyroxine dose may bring this down.", "low_causes": "Hyperthyroidism, malnutrition, malabsorption, liver disease", "high_causes": "Hypothyroidism, diet high in saturated fat, genetic predisposition, obesity, physical inactivity", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "tc_hdl_ratio", "name": "TC/HDL Ratio", "group": "LIPIDS & CARDIOVASCULAR", "result": "2.86", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.3178", "lower_normal": "0", "upper_normal": "4.5", "lower_optimal": "0", "upper_optimal": "3.5", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.3889", "units": "", "description": "The ratio of total cholesterol to HDL provides a better assessment of cardiovascular risk than total cholesterol alone because it accounts for the protective effect of HDL. Marina's ratio of 2.86 is well within the desirable range of below 4.5, reflecting the protective influence of her high HDL. This ratio is more reassuring than her total cholesterol number alone would suggest.", "low_causes": "Very high HDL, low total cholesterol", "high_causes": "Low HDL, high total cholesterol, metabolic syndrome", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "hdl_pct", "name": "HDL % of Total", "group": "LIPIDS & CARDIOVASCULAR", "result": "35", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5833", "lower_normal": "20", "upper_normal": "60", "lower_optimal": "28", "upper_optimal": "60", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4333", "upper_optimal_position": "0.6667", "units": "%", "description": "This represents the proportion of total cholesterol that is made up of the protective HDL fraction. Marina's HDL accounts for 35% of her total cholesterol, which is excellent and well above the desirable minimum of 20%. The higher this proportion, the more of her total cholesterol is working to protect her arteries rather than contribute to plaque.", "low_causes": "Low HDL relative to LDL and VLDL", "high_causes": "High HDL, very low LDL", "padding": "1", "one_sided": "0.5", "range_type": "no upper"}, {"key": "non_hdl", "name": "Non-HDL Cholesterol", "group": "LIPIDS & CARDIOVASCULAR", "result": "3.9", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4875", "lower_normal": "0", "upper_normal": "4", "lower_optimal": "0", "upper_optimal": "3.4", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.4250", "units": "mmol/L", "description": "Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic fractions (LDL, VLDL, and remnant cholesterol) in a single number. Marina's non-HDL of 3.9 is within the laboratory range of below 4.0 but above the optimal threshold of 3.4. This is consistent with her modestly elevated LDL.", "low_causes": "Low LDL and VLDL, hyperthyroidism", "high_causes": "Elevated LDL, elevated triglycerides, hypothyroidism, diet", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "apoa1", "name": "Apolipoprotein A1", "group": "LIPIDS & CARDIOVASCULAR", "result": "1.71", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.6107", "lower_normal": "1.4", "upper_normal": "2.8", "lower_optimal": "1.6", "upper_optimal": "2.8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3810", "upper_optimal_position": "0.6667", "units": "g/L", "description": "ApoA1 is the main structural protein of HDL particles. It drives reverse cholesterol transport, pulling cholesterol out of arterial walls. Marina's ApoA1 of 1.71 is above the desirable threshold of 1.4 and within the optimal range, consistent with her excellent HDL level. It confirms that she has a good number of functional protective particles.", "low_causes": "Genetic factors, smoking, obesity, physical inactivity", "high_causes": "Exercise, genetics, moderate alcohol intake", "padding": "1", "one_sided": "0.5", "range_type": "no upper"}, {"key": "apob", "name": "Apolipoprotein B", "group": "LIPIDS & CARDIOVASCULAR", "result": "0.92", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.5111", "lower_normal": "0", "upper_normal": "0.9", "lower_optimal": "0", "upper_optimal": "0.8", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.4444", "units": "g/L", "description": "ApoB is the single most important lipid marker for cardiovascular risk. Every atherogenic particle (LDL, VLDL, remnant) carries exactly one ApoB molecule, so this number represents the actual count of particles capable of entering the arterial wall and depositing cholesterol. Marina's ApoB of 0.92 is marginally above the desirable threshold of 0.9 and above the optimal target of 0.8. This confirms a modestly elevated particle count, though the degree is mild. Thyroid optimisation and dietary modification should improve this.", "low_causes": "Hyperthyroidism, malnutrition, liver disease", "high_causes": "Hypothyroidism, diet high in saturated fat, genetic predisposition, insulin resistance", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "apob_a1_ratio", "name": "ApoB/A1 Ratio", "group": "LIPIDS & CARDIOVASCULAR", "result": "0.54", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4500", "lower_normal": "0", "upper_normal": "0.6", "lower_optimal": "0", "upper_optimal": "0.5", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.4167", "units": "", "description": "The ApoB-to-ApoA1 ratio is considered the best single summary metric for cardiovascular lipid risk because it balances the number of harmful particles (ApoB) against the number of protective particles (ApoA1). Marina's ratio of 0.54 falls within the lower risk category of below 0.6, which is reassuring. Despite her LDL and ApoB being modestly elevated, her strong HDL and ApoA1 provide a meaningful counterbalance.", "low_causes": "Strong HDL production, low LDL", "high_causes": "Elevated LDL with low HDL, metabolic syndrome", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "lpa", "name": "Lipoprotein(a)", "group": "LIPIDS & CARDIOVASCULAR", "result": "25", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.3906", "lower_normal": "0", "upper_normal": "32", "lower_optimal": "0", "upper_optimal": "32", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "nmol/L", "description": "Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL that carries an additional protein called apolipoprotein(a). Unlike other lipid markers, Lp(a) is almost entirely inherited and cannot be changed through diet, exercise, or most medications. It is a permanent part of a person's cardiovascular risk profile. Marina's Lp(a) is below 25 nmol/L, which is normal and falls below the 32 nmol/L threshold. This is genuinely useful information because it means her elevated LDL and ApoB are driven entirely by modifiable factors such as diet and her undertreated thyroid, not by an inherited particle type that cannot be changed.", "low_causes": "Genetic (favourable)", "high_causes": "Genetic (inherited, unchangeable)", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "tg_hdl_ratio", "name": "TG/HDL Ratio (Calculated)", "group": "LIPIDS & CARDIOVASCULAR", "result": "0.35", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.1176", "lower_normal": "0", "upper_normal": "1.5", "lower_optimal": "0", "upper_optimal": "0.87", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.2900", "units": "", "description": "The triglyceride-to-HDL ratio is a powerful surrogate marker for insulin resistance and small dense LDL particles. A low ratio, as Marina has, suggests that her LDL particles are likely the larger, more buoyant type rather than the small, dense particles that are most damaging to arteries. Her ratio of 0.35 is excellent, well within the optimal range of below 0.87.", "low_causes": "High insulin sensitivity, low triglycerides, high HDL", "high_causes": "Insulin resistance, high triglycerides, low HDL, metabolic syndrome", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "remnant_cholesterol", "name": "Remnant Cholesterol (Calculated)", "group": "LIPIDS & CARDIOVASCULAR", "result": "0.29", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.0967", "lower_normal": "0", "upper_normal": "0.8", "lower_optimal": "0", "upper_optimal": "0.5", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.3125", "units": "mmol/L", "description": "Remnant cholesterol represents the cholesterol content of triglyceride-rich remnant particles (the leftovers after VLDL particles deliver their triglyceride cargo). It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent cardiovascular risk factor. Marina's remnant cholesterol of 0.29 is within the optimal range of below 0.5, indicating excellent clearance of these particles.", "low_causes": "Efficient lipoprotein metabolism, low triglycerides", "high_causes": "Elevated triglycerides, insulin resistance, obesity, type 2 diabetes", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "hscrp", "name": "hs-CRP", "group": "INFLAMMATION", "result": "1.3", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.1300", "lower_normal": "0", "upper_normal": "5", "lower_optimal": "0", "upper_optimal": "1", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.1000", "units": "mg/L", "description": "High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver in response to inflammatory signals anywhere in the body. Marina's hs-CRP of 1.3 is within the laboratory range of below 5 but above the optimal threshold of 1.0 mg/L. This mild elevation most likely reflects the low-grade inflammation associated with her active autoimmune thyroid disease.", "low_causes": "Absence of significant inflammation", "high_causes": "Infection, autoimmune disease, obesity, cardiovascular disease, chronic inflammation", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "esr", "name": "ESR", "group": "INFLAMMATION", "result": "20", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.8333", "lower_normal": "0", "upper_normal": "12", "lower_optimal": "0", "upper_optimal": "10", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.4167", "units": "mm/hour", "description": "The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation in the body, because inflammatory proteins cause red cells to clump together and fall faster. Marina's ESR of 20 is above the upper limit of 12 for women. In her case, this is most likely driven by a combination of her active autoimmune thyroid disease and iron deficiency anaemia, both of which are recognised causes of an elevated ESR.", "low_causes": "Normal finding, polycythaemia", "high_causes": "Autoimmune disease, infection, anaemia, chronic inflammation, malignancy", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "nlr", "name": "NLR (Calculated)", "group": "INFLAMMATION", "result": "0.79", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.1467", "lower_normal": "1", "upper_normal": "3", "lower_optimal": "1", "upper_optimal": "2", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5000", "units": "", "description": "The neutrophil-to-lymphocyte ratio (NLR) is a simple calculated marker of the balance between the innate immune system (neutrophils) and the adaptive immune system (lymphocytes). Marina's NLR of 0.79 is below the lower limit of 1.0, driven by her low neutrophil count. In her case, this reflects the mild neutropenia rather than any pathological process. A low NLR in the context of benign ethnic neutropenia is expected and is not a concern.", "low_causes": "Low neutrophils (benign ethnic neutropenia, medications, viral infection)", "high_causes": "Acute infection, chronic stress, systemic inflammation, smoking", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "plr", "name": "Platelet:Lymphocyte Ratio", "group": "INFLAMMATION", "result": "130.1", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4891", "lower_normal": "60", "upper_normal": "210", "lower_optimal": "80", "upper_optimal": "160", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3778", "upper_optimal_position": "0.5556", "units": "ratio", "description": "Platelet:Lymphocyte Ratio is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.", "low_causes": "", "high_causes": "Chronic inflammation, infection", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "sii", "name": "Systemic Immune-Inflammation Index", "group": "INFLAMMATION", "result": "226", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4173", "lower_normal": "100", "upper_normal": "600", "lower_optimal": "150", "upper_optimal": "450", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3667", "upper_optimal_position": "0.5667", "units": "index", "description": "Systemic Immune-Inflammation Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.", "low_causes": "", "high_causes": "Chronic inflammation, infection, malignancy", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "sodium", "name": "Sodium", "group": "ELECTROLYTES & MINERALS", "result": "141", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5128", "lower_normal": "133", "upper_normal": "146", "lower_optimal": "136", "upper_optimal": "143", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3564", "upper_optimal_position": "0.5897", "units": "mmol/L", "description": "Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve function. Marina's sodium of 141 is within the optimal range of 136 to 143, indicating normal fluid and electrolyte balance.", "low_causes": "Excess fluid intake, diuretics, adrenal insufficiency, SIADH", "high_causes": "Dehydration, excess salt intake, diabetes insipidus", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "potassium", "name": "Potassium", "group": "ELECTROLYTES & MINERALS", "result": "4.2", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4630", "lower_normal": "3.5", "upper_normal": "5.3", "lower_optimal": "3.8", "upper_optimal": "4.8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3519", "upper_optimal_position": "0.5741", "units": "mmol/L", "description": "Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Marina's potassium of 4.2 is within the optimal range, indicating normal potassium balance.", "low_causes": "Diuretics, vomiting, diarrhoea, poor dietary intake", "high_causes": "Kidney disease, ACE inhibitors, potassium-sparing diuretics, sample haemolysis", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "chloride", "name": "Chloride", "group": "ELECTROLYTES & MINERALS", "result": "100", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4615", "lower_normal": "95", "upper_normal": "108", "lower_optimal": "98", "upper_optimal": "106", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3590", "upper_optimal_position": "0.5897", "units": "mmol/L", "description": "Chloride works alongside sodium to maintain fluid balance and is a key component of stomach acid. Marina's chloride of 100 is within the optimal range.", "low_causes": "Vomiting, diuretics, metabolic alkalosis", "high_causes": "Dehydration, kidney disease, metabolic acidosis", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "bicarbonate", "name": "Bicarbonate", "group": "ELECTROLYTES & MINERALS", "result": "16.5", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2121", "lower_normal": "20", "upper_normal": "31", "lower_optimal": "22", "upper_optimal": "28", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3515", "upper_optimal_position": "0.5758", "units": "mmol/L", "description": "Bicarbonate is the body's main acid buffer, helping to maintain blood pH within a very narrow range. Marina's bicarbonate of 16.5 is below the lower limit of 20, indicating that her blood may be more acidic than it should be (metabolic acidosis). Her kidney function is excellent (Cystatin C eGFR 107), so this is unlikely to be caused by kidney disease. Possible explanations include inadequate caloric intake, chronic low-grade inflammation, or an early renal tubular acidosis that does not yet affect the overall filtration rate. This finding should be discussed with her GP.", "low_causes": "Metabolic acidosis, diarrhoea, renal tubular acidosis, diabetic ketoacidosis, starvation", "high_causes": "Metabolic alkalosis, vomiting, diuretics, antacid overuse", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "anion_gap", "name": "Anion Gap (Calculated)", "group": "ELECTROLYTES & MINERALS", "result": "28.7", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.9208", "lower_normal": "8", "upper_normal": "16", "lower_optimal": "10", "upper_optimal": "14", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4167", "upper_optimal_position": "0.5833", "units": "mmol/L", "description": "The anion gap is calculated from sodium, potassium, chloride, and bicarbonate, and represents the unmeasured negatively charged particles in the blood. Marina's anion gap of 28.7 is elevated above the upper limit of 16, driven primarily by her low bicarbonate of 16.5. An elevated anion gap alongside low bicarbonate suggests a high anion gap metabolic acidosis, which can result from ketosis, lactic acid accumulation, or other metabolic processes. This finding adds weight to the recommendation for her GP to assess her acid-base status further.", "low_causes": "Laboratory error, hypoalbuminaemia", "high_causes": "Ketoacidosis, lactic acidosis, renal failure, toxic ingestion, starvation ketosis", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "uric_acid", "name": "Uric Acid", "group": "ELECTROLYTES & MINERALS", "result": "208", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.3619", "lower_normal": "184", "upper_normal": "464", "lower_optimal": "160", "upper_optimal": "320", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3248", "upper_optimal_position": "0.5524", "units": "umol/L", "description": "Uric acid is a waste product of purine metabolism, cleared by the kidneys. Elevated levels can cause gout and are associated with cardiovascular risk. Marina's uric acid of 208 is within the optimal range for women of 160 to 320, indicating normal purine metabolism and good renal clearance.", "low_causes": "Low purine diet, liver disease, some medications", "high_causes": "High purine diet, kidney disease, gout, metabolic syndrome, alcohol", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "calcium", "name": "Calcium", "group": "ELECTROLYTES & MINERALS", "result": "2.41", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5263", "lower_normal": "2.08", "upper_normal": "2.65", "lower_optimal": "2.2", "upper_optimal": "2.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3544", "upper_optimal_position": "0.5789", "units": "mmol/L", "description": "Calcium is the most abundant mineral in the body, essential for bone strength, muscle contraction, nerve function, and blood clotting. Marina's calcium of 2.41 is within the optimal range.", "low_causes": "Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease", "high_causes": "Hyperparathyroidism, malignancy, excess vitamin D, dehydration", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "corrected_calcium", "name": "Corrected Calcium", "group": "ELECTROLYTES & MINERALS", "result": "2.29", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4083", "lower_normal": "2.2", "upper_normal": "2.6", "lower_optimal": "2.2", "upper_optimal": "2.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5833", "units": "mmol/L", "description": "Corrected calcium adjusts the total calcium measurement for the albumin level, giving a more accurate picture of the physiologically active calcium in the blood. Marina's corrected calcium of 2.29 is within the optimal range, confirming normal calcium balance.", "low_causes": "Vitamin D deficiency, hypoparathyroidism, malabsorption", "high_causes": "Hyperparathyroidism, malignancy, excess vitamin D", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "magnesium", "name": "Magnesium", "group": "ELECTROLYTES & MINERALS", "result": "0.99", "within_normal": "TRUE", "within_optimal":
