hyroxine replaces, is 19.9, which sits comfortably within the optimal range of 14 to 20. Her free T3, the more potent form that T4 converts into, is 4.5, which is at the lower boundary of the optimal range. This pattern, where TSH is elevated but T4 is adequate, suggests that the pituitary is having to push harder than it should to maintain that T4 level, and a modest dose increase may bring everything into better balance. Underactive thyroid function is itself associated with fatigue, hair thinning, and difficulty building muscle, so optimising her levothyroxine dose could make a meaningful difference to all three of her goals. We would recommend she discusses a dose review with her GP.\n\nThere are several areas where Marina's results are reassuring. Her kidney function is excellent, with a Cystatin C of 0.86 giving a calculated eGFR of 107, exactly where it should be at her age. Her liver is in very good health. ALT at 18 and Gamma GT at 10 are both well within optimal ranges, and her FIB-4 fibrosis score of 0.73 is comfortably low. Her amylase and lipase, which reflect pancreatic health, are both within range. Her magnesium at 0.99 sits squarely within the optimal range of 0.85 to 1.05, which is important for energy production and muscle function. Her calcium and corrected calcium are both within range, and her parathyroid hormone is appropriately normal. Her folate at 18 is actually marginally above the upper limit of 17, which simply reflects good dietary or supplemental intake and is not a concern. Her vitamin B12 at 427 is within the laboratory range though below the optimal floor of 500, which is worth addressing with supplementation. Her cortisol at 297 is within normal morning limits. Her reproductive hormones, with oestradiol at 228 and progesterone at 2.16, are consistent with the follicular phase of her menstrual cycle, and her FSH of 13.09 and LH of 8.72 do not suggest perimenopause. Her testosterone at 0.9, free androgen index at 1.98, and SHBG at 45.5 are all within their respective ranges. Her DHEA-S at 4.7 is healthy. Her prolactin at 130 is within the normal non-pregnant range.\n\nHer lipid profile shows a mixed picture. Her total cholesterol is 6.0, above the desirable threshold of 5.18. Her LDL cholesterol, the primary driver of arterial plaque, is 3.61 against an upper limit of 3.0. Her ApoB, which counts the actual number of atherogenic particles in the blood, is 0.92 against a target of below 0.9. These are modestly elevated. However, her HDL cholesterol at 2.1 is excellent, well above the optimal threshold of 1.6, and her triglycerides at 0.74 are very good, well below the optimal ceiling of 1.0. Her ApoB to ApoA1 ratio at 0.54 falls within the lower risk category of below 0.6, and her TC to HDL ratio at 2.86 is also healthy. Her Lp(a), which is a genetically determined and unchangeable cardiovascular risk factor, is below 25, which is reassuringly normal. This means the elevated LDL and ApoB are driven entirely by modifiable factors, primarily diet. It is worth noting that undertreated hypothyroidism slows the clearance of LDL cholesterol from the bloodstream, so optimising her levothyroxine dose may itself bring some improvement. Beyond that, dietary modifications focusing on soluble fibre intake, oily fish, and modestly reducing saturated fat should help.\n\nHer vitamin D at 71 is sufficient but below the optimal floor of 75. At her low BMI this should respond readily to supplementation.\n\nHer glucose metabolism shows a mixed signal. Her fasting glucose at 5.0 is within the optimal range. Her HbA1c at 37 mmol/mol is within the optimal range of below 42, indicating good average blood sugar control. Her fasting insulin at 7.74 is within range. However, her HOMA-IR, which estimates insulin resistance by combining fasting glucose and insulin, is 1.72 against an upper limit of 1.5. This is mildly elevated and somewhat unexpected at her low BMI, though the very low physical activity level is a likely contributor because skeletal muscle is the largest consumer of glucose and without regular contraction it becomes less insulin-sensitive. Her C-peptide, which is a byproduct of insulin production and reflects how much insulin the pancreas is actually making, is 1.04 ug/L (344 pmol/L) against a lower limit of 1.1 ug/L (364 pmol/L), marginally below range. In the context of a normal glucose and normal HbA1c, this does not suggest pancreatic insufficiency but rather reflects low overall insulin demand.\n\nHer inflammatory markers show some activity. Her hs-CRP, a general marker of systemic inflammation, is 1.3, which is within the laboratory range of below 5 but above the optimal threshold of below 1.0. Her ESR, the erythrocyte sedimentation rate which measures how quickly red blood cells settle and is another gauge of inflammation, is 20 against an upper limit of 12. Together, these suggest a low-grade inflammatory process. The most likely explanation in Marina's case is the active autoimmune thyroid disease, though iron deficiency anaemia itself can raise the ESR. Her neutrophils are low at 1.74 against a lower limit of 2.0. Mild neutropenia in the context of a total white cell count at the lower end of range (4.33) and an otherwise well person of Eastern European ancestry is most commonly benign ethnic neutropenia, a harmless normal variant that is well documented in people of certain ethnic backgrounds. It is worth the GP being aware of this baseline value.\n\nHer immunoglobulins show IgM elevated at 3.5 against an upper limit of 3.0. IgM is the first antibody the immune system produces in response to a new challenge, and a modest elevation can reflect recent infection, the autoimmune thyroid activity, or simply normal individual variation. Her IgG at 15.7 is within range though near the upper limit of 16, and her IgA at 1.9 is comfortably within range. Her total protein at 84 and globulin at 37 are both marginally above their upper limits, which is consistent with the elevated immunoglobulin levels rather than indicating a separate problem.\n\nHer total bilirubin at 30 is elevated above the upper limit of 21, but all of her liver enzymes are completely clean. This pattern, where bilirubin is raised in isolation with no other sign of liver strain, is characteristic of Gilbert's syndrome, a harmless inherited variation in bilirubin processing that affects roughly 5 to 10% of the population. It does not progress, does not cause liver damage, and does not need treatment. It may cause mild yellowing of the eyes during periods of fasting, illness, or dehydration.\n\nHer bicarbonate is low at 16.5 against a lower limit of 20. This is a notable finding and should be mentioned to her GP. Low bicarbonate can reflect a mild metabolic acidosis, and possible contributors include the very low caloric intake relative to her needs, chronic low-grade inflammatory states, or renal tubular handling. Her kidney function is otherwise excellent, so this is unlikely to reflect kidney disease, but the GP should assess her acid-base status and consider repeating this alongside a venous blood gas if clinically indicated.\n\nHer CA-125 at 31.4 is within range, and her CA 15-3 at 11.13 and CA 19-9 at 22.22 are both within range. Her CEA is below 0.5, which is normal. Her rheumatoid factor at 6 is within range, and her coeliac screen (tissue transglutaminase IgA) is negative. Her antioxidant activity at 1.51 is within range. Her creatine kinase at 64 is within range. Her urinalysis is clean, with no protein, glucose, blood, or white cells detected. The bacterial count and urine culture are pending and will be reviewed when available.\n\nHer uric acid at 208 is within the laboratory range but within the optimal range for women of 160 to 320.","links":"Marina's results point to three clear priorities, and addressing them in the right order will give her the best chance of reaching her goals of building muscle, improving energy, and improving cardiovascular fitness.\n\nThe first and most urgent priority is correcting her iron deficiency. At a ferritin of 5 with a transferrin saturation of just 7.1% and changes already visible in her red blood cells, this is beyond the point where dietary changes alone will be sufficient in any reasonable timeframe. She should see her GP as soon as possible and bring these specific numbers: ferritin 5, serum iron 6.1, transferrin saturation 7.1%, MCV 76.6, MCH 25.9, RDW 17.7%, reticulocytes 36.9, haemoglobin 121. Her GP may wish to investigate potential sources of iron loss, particularly menstrual blood loss, and may consider intravenous iron replacement given the severity of depletion. If oral iron is the chosen route, ferrous bisglycinate at 25 to 50mg taken with vitamin C on an empty stomach is the best-tolerated form, but at this level of depletion it may take three to six months to replenish stores and her GP should guide the approach. She should avoid taking iron within four hours of her levothyroxine as iron impairs its absorption. A full blood count and iron studies should be repeated in six to eight weeks to confirm the trajectory.\n\nThe second priority is optimising her thyroid medication. Her TSH at 6.41 with strongly positive TPO antibodies (greater than 400) suggests her current levothyroxine dose needs increasing. She should discuss a dose adjustment with her GP, bringing these numbers: TSH 6.41, FT4 19.9, FT3 4.5, TPO antibodies greater than 400, thyroglobulin antibodies 5.1. A typical adjustment would be an increase of 12.5 to 25 micrograms, with TSH rechecked six to eight weeks later. Optimising thyroid function could improve her energy levels, support hair regrowth, improve her cholesterol clearance, and make it easier to build muscle and tolerate exercise.\n\nThe third priority, and the one that will transform her trajectory more than any supplement, is introducing physical activity. At fewer than 2,000 steps per day with no structured exercise, Marina's body is not receiving the mechanical stimulus it needs to build muscle, maintain insulin sensitivity, support bone density, or improve cardiovascular fitness. The approach should be gradual. She should aim to increase her daily step count to 5,000 within the first month and to 7,500 within two months. She should introduce two sessions of resistance training per week, starting with bodyweight or light resistance and progressing gradually. Even one session of brisk walking for 20 to 30 minutes three times per week would begin to improve her cardiovascular fitness and insulin sensitivity. Her mildly elevated HOMA-IR of 1.72 is very likely driven primarily by the absence of physical activity, and this is the most effective intervention to bring it down.\n\nHer caloric intake needs attention. At 49kg, 161cm, and sedentary, her basal metabolic rate is approximately 1,250 calories. With a sedentary multiplier of 1.3, her current maintenance is roughly 1,625 calories per day, but as she introduces activity this will rise to approximately 1,800 to 1,950 calories. Her diet volume of 5 out of 10 and quality of 5 out of 10 suggest she may be undereating, which at her low BMI and with the degree of iron depletion she is showing is a concern. She should aim for at least 1,700 to 1,900 calories per day as she introduces exercise, ensuring she is not in a caloric deficit. Her protein intake should be at least 65 to 80 grams per day (1.3 to 1.6g per kg of bodyweight) to support the muscle-building goal, spread across three to four meals. Good protein sources that also provide iron include red meat two to three times per week, poultry, fish, eggs, and legumes.\n\nFor her cholesterol, the elevated LDL of 3.61 and ApoB of 0.92 should respond to a combination of thyroid optimisation and dietary changes. She should aim for two portions of oily fish per week (salmon, mackerel, sardines), increase soluble fibre intake through oats, beans, lentils, and vegetables, and modestly reduce saturated fat from processed and fried foods. Her Lp(a) being normal is genuinely useful information because it confirms these lipid findings are entirely modifiable.\n\nHer vitamin D at 71 should be brought above 75 with 2,000 IU of vitamin D3 daily taken with a fat-containing meal, paired with 100mcg of vitamin K2 (MK-7). Her B12 at 427 would benefit from 1,000mcg of sublingual methylcobalamin daily to bring it above the optimal threshold of 500.\n\nHer bicarbonate of 16.5 should be mentioned to her GP at the same appointment. The GP should assess whether this reflects a true metabolic acidosis or whether it is an isolated finding that resolves with better nutrition and hydration.\n\nHer ESR of 20, hs-CRP of 1.3, elevated IgM of 3.5, and marginally elevated globulin of 37 and total protein of 84 should be noted by the GP as background context. These are most likely related to her active autoimmune thyroid disease. They do not require separate investigation unless other symptoms develop.\n\nA retest of the following markers in 10 to 12 weeks would be ideal: full blood count, iron studies (ferritin, serum iron, transferrin saturation, TIBC), TSH, FT4, FT3, hs-CRP, ESR, lipid profile, HbA1c, HOMA-IR, bicarbonate, and vitamin D.","flags":"IRON DEFICIENCY (SEVERE, GP URGENT): Ferritin 5 ng/ml (range 10-291), serum iron 6.1 umol/L (range 9-30.4), transferrin saturation 7.1% (range 18-55%), TIBC 77.4 umol/L (range 44-76.1). Iron depletion has progressed to affect erythropoiesis: MCV 76.6 fL (range 83-101), MCH 25.9 pg (range 27-32), RDW 17.7% (range 11.6-14%), HCT 0.358 (range 0.36-0.46), absolute reticulocytes 36.9 (range 50-100), haemoglobin 121 g/L (range 120-150, at the boundary of anaemia). Investigate source of iron loss. Consider IV iron given severity. Recheck FBC and iron studies in 6-8 weeks.\n\nTHYROID (SUBOPTIMAL REPLACEMENT, GP): TSH 6.41 mIU/L (range 0.55-4.78) on levothyroxine. TPO antibodies >400 U/ml (range <13.8). Thyroglobulin antibodies 5.1 U/ml (range <4.4). Confirms autoimmune (Hashimoto's) aetiology. FT4 19.9 pmol/L (range 11.5-22.7), FT3 4.5 pmol/L (range 2.6-7.1). Current dose insufficient to normalise TSH. Consider 12.5-25mcg dose increase. Recheck TSH/FT4 in 6-8 weeks post-adjustment.\n\nBICARBONATE LOW (GP): 16.5 mmol/L (range 20-31). Low bicarbonate may indicate mild metabolic acidosis. Kidney function is normal (Cystatin C eGFR 107). Consider venous blood gas and repeat electrolytes.\n\nLIPIDS (MODESTLY ELEVATED, MODIFIABLE): Total cholesterol 6.0 (desirable <5.18), LDL 3.61 (range 0.5-3.0), ApoB 0.92 (target <0.9). Mitigated by excellent HDL 2.1, triglycerides 0.74, ApoB/A1 ratio 0.54 (<0.6 lower risk), Lp(a) <25 (normal). Undertreated hypothyroidism may be contributing to impaired LDL clearance. Reassess after thyroid optimisation and dietary modification.\n\nINSULIN RESISTANCE (MILD): HOMA-IR 1.72 (range 0.5-1.5). Fasting glucose 5.0 and HbA1c 37 are normal. Most likely driven by very low physical activity. C-peptide 1.04 ug/L marginally below range (1.1-4.4), not clinically significant in context of normal glucose.\n\nINFLAMMATION (LOW-GRADE): ESR 20 mm/hr (range <12), hs-CRP 1.3 mg/L (optimal <1.0). Most likely reflects active autoimmune thyroiditis and/or iron deficiency anaemia.\n\nNEUTROPENIA (MILD): Neutrophils 1.74 (range 2.0-7.0) with WBC 4.33 (within range). In an otherwise well person of Eastern European ancestry, most likely benign ethnic neutropenia. Worth noting as baseline.\n\nIMMUNOGLOBULINS: IgM 3.5 g/L (range 0.5-3.0), IgG 15.7 g/L (range 6.5-16.0, near upper limit). Total protein 84 g/L (range 57-82), globulin 37 g/L (range 18-36). Consistent with immune activation from autoimmune thyroid disease.\n\nBILIRUBIN (GILBERT'S PATTERN): Total bilirubin 30 umol/L (range 5-21) with all liver enzymes normal. Consistent with Gilbert's syndrome. Benign, no action needed.\n\nFOLATE: 18 ng/ml (range 3-17). Marginally above range. Reflects good intake, not a concern.\n\nReassuring negatives: Kidney function excellent (Cystatin C eGFR 107). Liver enzymes all clean (ALT 18, GGT 10, FIB-4 0.73). HbA1c 37 (normal). Lp(a) <25 (normal, inherited cardiovascular risk excluded). CA-125 31.4 (within range), CA 15-3 11.13, CA 19-9 22.22, CEA <0.5 (all normal). Coeliac screen negative. Rheumatoid factor negative. Calcium, magnesium, PTH all normal. Reproductive hormones consistent with follicular phase, no evidence of perimenopause. Urinalysis clean.","recommendations":"1. See GP promptly for iron deficiency: bring ferritin 5, transferrin saturation 7.1%, MCV 76.6, haemoglobin 121. Discuss IV iron vs oral replacement and investigation of iron loss source.\n\n2. Request levothyroxine dose review with GP: bring TSH 6.41, FT4 19.9, FT3 4.5, TPO >400. A modest dose increase is likely needed. Recheck thyroid function 6-8 weeks after any change.\n\n3. Mention bicarbonate of 16.5 to GP at the same appointment for assessment.\n\n4. Begin increasing daily steps gradually: target 5,000 within month one, 7,500 within month two. Introduce two resistance training sessions per week, starting light.\n\n5. Increase calorie intake to at least 1,700-1,900 calories per day as activity increases. Ensure at least 65-80g protein per day across 3-4 meals.\n\n6. Include red meat 2-3 times per week, oily fish twice per week, and increase soluble fibre from oats, beans, lentils, and vegetables to support both iron intake and cholesterol management.\n\n7. Start vitamin D3 2,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 100mcg.\n\n8. Start sublingual methylcobalamin B12 1,000mcg daily.\n\n9. If GP prescribes oral iron: take ferrous bisglycinate 25-50mg with vitamin C, at least 4 hours away from levothyroxine. Do not self-prescribe iron without GP guidance given the severity.\n\n10. Retest in 10-12 weeks: full blood count, iron studies, TSH, FT4, FT3, lipid profile, hs-CRP, ESR, HbA1c, HOMA-IR, bicarbonate, vitamin D.","supplementation":"Vitamin D3: 2,000 IU (50mcg) of cholecalciferol daily, taken with a fat-containing meal. Marina's level of 71 is sufficient but below the optimal threshold of 75 nmol/L. At her low BMI, this dose should bring her comfortably into the optimal range within eight to twelve weeks.\n\nVitamin K2: 100mcg of MK-7 daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bone rather than arteries, and should always accompany vitamin D supplementation.\n\nVitamin B12: 1,000mcg of sublingual methylcobalamin daily. Her B12 at 427 is within the laboratory range but below the optimal floor of 500. Sublingual delivery bypasses any absorption issues and is the preferred form. This may support her energy levels and is important for red blood cell production alongside iron.\n\nMagnesium: Her magnesium at 0.99 is already within the optimal range. If she introduces resistance training and finds she has difficulty sleeping or muscle cramps, 200 to 300mg of magnesium glycinate before bed would be a reasonable addition, but it is not currently necessary.\n\nOmega-3 fish oil: 2g of combined EPA and DHA daily, taken with food. This will support her modestly elevated LDL and ApoB through a modest triglyceride-lowering and anti-inflammatory effect, and may support hair health.\n\nIron: Marina's iron stores are severely depleted, but given the degree of deficiency, iron supplementation should be guided by her GP rather than started independently. If her GP prescribes oral iron, the best-tolerated form is ferrous bisglycinate at 25 to 50mg, taken with a source of vitamin C (such as a glass of orange juice) to enhance absorption, on an empty stomach. It must be taken at least four hours apart from her levothyroxine, as iron significantly impairs thyroid hormone absorption. Her GP may determine that intravenous iron is more appropriate given how low her stores are.\n\nThe most important changes from this report are not supplements. They are correcting the iron deficiency under GP supervision, optimising her levothyroxine dose, introducing regular physical activity, and eating enough food with enough protein to support the body she is asking to build muscle and produce energy.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Blood glucose measures the concentration of sugar circulating in Marina's blood after fasting. It is the body's primary fuel source, and keeping fasting levels within a tight range is essential for sustained energy and long-term metabolic health. Her result of 5.0 mmol/L sits within the optimal range of 4.0 to 5.4, indicating that her body is managing blood sugar effectively at the time of the test.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, prediabetes, type 2 diabetes, stress response, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c reflects Marina's average blood sugar levels over the past two to three months. It measures the percentage of haemoglobin molecules in the blood that have glucose attached to them. Unlike a single fasting glucose reading, HbA1c provides a longer-term picture. Her result of 5.6% is within the normal range and well below the pre-diabetes threshold of 6.0%.","low_causes":"Iron deficiency (can falsely lower), haemolytic anaemia, chronic blood loss","high_causes":"Sustained elevated blood sugar, prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the internationally standardised unit. Marina's result of 37 is within the normal range and below the pre-diabetes threshold of 42. It is worth noting that iron deficiency, which Marina has, can sometimes cause HbA1c to read slightly higher than the true value because iron-deficient red blood cells live longer and accumulate more glucose on their haemoglobin. Her true average blood sugar may therefore be slightly lower than this reading suggests.","low_causes":"Iron deficiency (can affect reading), haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes, sustained hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4106","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3973","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to absorb glucose from the blood. Measuring fasting insulin alongside glucose provides a much more sensitive picture of metabolic health than glucose alone, because insulin can rise years before glucose becomes abnormal. Marina's fasting insulin of 7.74 is within both the laboratory range and the optimal range of 2 to 8 mIU/L, indicating that her pancreas is not having to overwork to keep her blood sugar controlled.","low_causes":"Low carbohydrate diet, very lean body composition, type 1 diabetes","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2726","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin. Because it is not cleared by the liver the way insulin is, it provides a more accurate measure of how much insulin the pancreas is actually producing. Marina's result of 1.04 ug/L (approximately 344 pmol/L) is marginally below the lower limit of 1.1. In the context of a normal fasting glucose and normal HbA1c, this does not suggest pancreatic insufficiency. It simply reflects that her pancreas does not need to produce large amounts of insulin to keep her blood sugar controlled, which at her low BMI is expected.","low_causes":"Low insulin demand, low carbohydrate intake, lean body composition, sample degradation","high_causes":"Insulin resistance, obesity, insulinoma, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7393","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index that estimates insulin resistance by combining fasting glucose and fasting insulin. A lower score means the body needs less insulin to manage blood sugar, which is desirable. Marina's result of 1.72 is above the upper limit of 1.5, indicating mild insulin resistance. At her low BMI of 18.9, this is somewhat unexpected and is most likely explained by her very low level of physical activity. Skeletal muscle is the body's largest glucose sink, and without regular contraction through exercise, muscle tissue becomes less responsive to insulin.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean active individuals","high_causes":"Physical inactivity, excess calorie intake, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B (Calculated)","group":"GLUCOSE & INSULIN","result":"103.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4600","lower_normal":"80","upper_normal":"200","lower_optimal":"100","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"","description":"HOMA-B estimates the functional capacity of the pancreatic beta cells, the cells that produce insulin. It is calculated from fasting insulin and glucose. Marina's result of 103.2 is within the normal range of 80 to 200, indicating that her pancreas is functioning adequately. This is consistent with the overall picture of a healthy glucose metabolism despite the mild insulin resistance driven by physical inactivity.","low_causes":"Beta cell dysfunction, progressing type 2 diabetes, late-stage insulin resistance","high_causes":"Compensatory insulin overproduction, early insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3214","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Marina's ALT of 18 is well within the optimal range for women of below 25 IU/L, indicating that her liver cells are healthy and free from metabolic strain.","low_causes":"Normal finding","high_causes":"Fatty liver disease, alcohol, medications, hepatitis, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4531","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5208","units":"IU/L","description":"AST (aspartate aminotransferase) is found in the liver, heart, and muscles. It is less liver-specific than ALT but provides useful context when interpreted alongside it. Marina's AST of 22 is within the optimal range, and the AST-to-ALT ratio of 1.2 is normal and not suggestive of any liver pathology.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart disease, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1316","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"IU/L","description":"Gamma GT (gamma-glutamyltransferase) is the most sensitive liver enzyme for detecting bile duct problems, alcohol-related liver stress, and metabolic overload. Marina's GGT of 10 is excellent, well within the optimal range of below 25 IU/L. This indicates her liver is under no metabolic strain at all.","low_causes":"Normal finding","high_causes":"Alcohol, medications, bile duct obstruction, fatty liver, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3476","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, and bile ducts. It helps assess bile flow and bone turnover. Marina's ALP of 49 is within the laboratory range and near the lower end, which is normal and reassuring. It falls just below the optimal lower boundary of 50, which is not clinically meaningful.","low_causes":"Zinc deficiency, hypothyroidism, anaemia","high_causes":"Bile duct obstruction, bone disorders, liver disease, pregnancy, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"30","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8229","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes it for excretion. Marina's bilirubin of 30 is above the upper limit of 21, but every one of her liver enzymes (ALT, AST, GGT, ALP) is completely clean. This pattern of isolated elevated bilirubin with no other liver abnormality is characteristic of Gilbert's syndrome, a harmless inherited variation in the liver's ability to conjugate bilirubin. It affects approximately 5 to 10% of the population, does not progress, and does not require treatment.","low_causes":"Normal finding, some medications","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6933","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6067","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. Marina's result of 84 is slightly above the upper limit of 82. This is being driven by her elevated globulin fraction (37 g/L), which in turn reflects her elevated immunoglobulin levels, most likely related to her active autoimmune thyroid disease. It is not an independent concern.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, autoimmune disease, chronic infection, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and serves as a marker of both liver synthetic function and nutritional status. Marina's albumin of 47 is within the optimal range, confirming that her liver is producing protein well and that her nutritional status, despite the modest diet quality and volume, is adequate for albumin synthesis.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7037","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin encompasses the immune proteins (immunoglobulins) and transport proteins in the blood. Marina's globulin of 37 is slightly above the upper limit of 36, which is consistent with her elevated IgM and her active autoimmune thyroid disease. The immune system's ongoing response to the thyroid gland produces more immunoglobulins, pushing the globulin fraction up. This is not an independent finding requiring separate investigation.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Autoimmune disease, chronic infection, chronic inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio (Calculated)","group":"LIVER & METABOLIC","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio provides a quick assessment of the balance between these two protein groups. Marina's A/G ratio of 1.27 is within the laboratory range but marginally below the optimal floor of 1.3, reflecting the slightly elevated globulin from her autoimmune activity. The albumin side is healthy, so the ratio is being pulled down by the globulin numerator rather than a deficiency in albumin production.","low_causes":"Elevated globulins from autoimmune disease or infection, low albumin","high_causes":"Immune deficiency, certain genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2517","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that uses age, ALT, AST, and platelet count to estimate the likelihood of liver fibrosis (scarring). Marina's score of 0.73 is comfortably below the threshold of 1.3 that would prompt further investigation, confirming that there is no sign of liver scarring.","low_causes":"Normal healthy liver","high_causes":"Liver fibrosis, age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starches. Marina's amylase of 74 is within the optimal range, indicating normal pancreatic function with no sign of inflammation or blockage.","low_causes":"Chronic pancreatitis (late-stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6312","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5886","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase. Marina's lipase of 55 is within the laboratory range of 13 to 60, though toward the upper end. This is still a normal result and does not indicate pancreatic inflammation.","low_causes":"Normal finding","high_causes":"Pancreatitis, gallstones, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5792","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL (harmful), HDL (protective), and VLDL. Marina's total cholesterol of 6.0 is above the desirable threshold of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk because it does not distinguish between harmful and protective fractions. In Marina's case, a significant proportion of her total cholesterol is driven by her excellent HDL of 2.1, so the picture is more nuanced than the headline number suggests.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, hypothyroidism, genetic predisposition, liver disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2176","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of stored fat in the body, carried in the blood primarily within VLDL particles. Elevated triglycerides are associated with insulin resistance and increased cardiovascular risk. Marina's triglycerides of 0.74 are excellent, well within the optimal range of below 1.0 mmol/L, reflecting good metabolic handling of dietary fats.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"Excess carbohydrates and sugar, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues around the body. It is considered an atherogenic particle, meaning it contributes to plaque formation. Marina's VLDL of 0.34 is well within the optimal range, consistent with her excellent triglyceride level.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"Excess carbohydrates, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6774","lower_normal":"1.04","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4247","upper_optimal_position":"0.6667","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol fraction. It removes excess cholesterol from the arterial walls and transports it back to the liver for disposal, a process called reverse cholesterol transport. Marina's HDL of 2.1 is excellent, well above the optimal threshold of 1.6 for women. This is one of the strongest protective factors in her lipid profile.","low_causes":"Physical inactivity, smoking, obesity, insulin resistance, poor diet","high_causes":"Regular exercise, genetics, moderate alcohol consumption, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.61","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5773","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the primary carrier of cholesterol into the arterial walls, where it can accumulate and contribute to plaque formation over decades. Marina's LDL of 3.61 is above the upper limit of 3.0. However, this needs to be interpreted alongside her excellent HDL and triglycerides, and the important context that undertreated hypothyroidism (her TSH remains elevated at 6.41) is a well-established cause of elevated LDL because thyroid hormone is needed for the liver to clear LDL from the blood. Optimising her levothyroxine dose may bring this down.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Hypothyroidism, diet high in saturated fat, genetic predisposition, obesity, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3178","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The ratio of total cholesterol to HDL provides a better assessment of cardiovascular risk than total cholesterol alone because it accounts for the protective effect of HDL. Marina's ratio of 2.86 is well within the desirable range of below 4.5, reflecting the protective influence of her high HDL. This ratio is more reassuring than her total cholesterol number alone would suggest.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"20","upper_normal":"60","lower_optimal":"28","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6667","units":"%","description":"This represents the proportion of total cholesterol that is made up of the protective HDL fraction. Marina's HDL accounts for 35% of her total cholesterol, which is excellent and well above the desirable minimum of 20%. The higher this proportion, the more of her total cholesterol is working to protect her arteries rather than contribute to plaque.","low_causes":"Low HDL relative to LDL and VLDL","high_causes":"High HDL, very low LDL","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic fractions (LDL, VLDL, and remnant cholesterol) in a single number. Marina's non-HDL of 3.9 is within the laboratory range of below 4.0 but above the optimal threshold of 3.4. This is consistent with her modestly elevated LDL.","low_causes":"Low LDL and VLDL, hyperthyroidism","high_causes":"Elevated LDL, elevated triglycerides, hypothyroidism, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6107","lower_normal":"1.4","upper_normal":"2.8","lower_optimal":"1.6","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6667","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. It drives reverse cholesterol transport, pulling cholesterol out of arterial walls. Marina's ApoA1 of 1.71 is above the desirable threshold of 1.4 and within the optimal range, consistent with her excellent HDL level. It confirms that she has a good number of functional protective particles.","low_causes":"Genetic factors, smoking, obesity, physical inactivity","high_causes":"Exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single most important lipid marker for cardiovascular risk. Every atherogenic particle (LDL, VLDL, remnant) carries exactly one ApoB molecule, so this number represents the actual count of particles capable of entering the arterial wall and depositing cholesterol. Marina's ApoB of 0.92 is marginally above the desirable threshold of 0.9 and above the optimal target of 0.8. This confirms a modestly elevated particle count, though the degree is mild. Thyroid optimisation and dietary modification should improve this.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Hypothyroidism, diet high in saturated fat, genetic predisposition, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB-to-ApoA1 ratio is considered the best single summary metric for cardiovascular lipid risk because it balances the number of harmful particles (ApoB) against the number of protective particles (ApoA1). Marina's ratio of 0.54 falls within the lower risk category of below 0.6, which is reassuring. Despite her LDL and ApoB being modestly elevated, her strong HDL and ApoA1 provide a meaningful counterbalance.","low_causes":"Strong HDL production, low LDL","high_causes":"Elevated LDL with low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL that carries an additional protein called apolipoprotein(a). Unlike other lipid markers, Lp(a) is almost entirely inherited and cannot be changed through diet, exercise, or most medications. It is a permanent part of a person's cardiovascular risk profile. Marina's Lp(a) is below 25 nmol/L, which is normal and falls below the 32 nmol/L threshold. This is genuinely useful information because it means her elevated LDL and ApoB are driven entirely by modifiable factors such as diet and her undertreated thyroid, not by an inherited particle type that cannot be changed.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1176","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a powerful surrogate marker for insulin resistance and small dense LDL particles. A low ratio, as Marina has, suggests that her LDL particles are likely the larger, more buoyant type rather than the small, dense particles that are most damaging to arteries. Her ratio of 0.35 is excellent, well within the optimal range of below 0.87.","low_causes":"High insulin sensitivity, low triglycerides, high HDL","high_causes":"Insulin resistance, high triglycerides, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0967","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol content of triglyceride-rich remnant particles (the leftovers after VLDL particles deliver their triglyceride cargo). It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent cardiovascular risk factor. Marina's remnant cholesterol of 0.29 is within the optimal range of below 0.5, indicating excellent clearance of these particles.","low_causes":"Efficient lipoprotein metabolism, low triglycerides","high_causes":"Elevated triglycerides, insulin resistance, obesity, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver in response to inflammatory signals anywhere in the body. Marina's hs-CRP of 1.3 is within the laboratory range of below 5 but above the optimal threshold of 1.0 mg/L. This mild elevation most likely reflects the low-grade inflammation associated with her active autoimmune thyroid disease.","low_causes":"Absence of significant inflammation","high_causes":"Infection, autoimmune disease, obesity, cardiovascular disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation in the body, because inflammatory proteins cause red cells to clump together and fall faster. Marina's ESR of 20 is above the upper limit of 12 for women. In her case, this is most likely driven by a combination of her active autoimmune thyroid disease and iron deficiency anaemia, both of which are recognised causes of an elevated ESR.","low_causes":"Normal finding, polycythaemia","high_causes":"Autoimmune disease, infection, anaemia, chronic inflammation, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"NLR (Calculated)","group":"INFLAMMATION","result":"0.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1467","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is a simple calculated marker of the balance between the innate immune system (neutrophils) and the adaptive immune system (lymphocytes). Marina's NLR of 0.79 is below the lower limit of 1.0, driven by her low neutrophil count. In her case, this reflects the mild neutropenia rather than any pathological process. A low NLR in the context of benign ethnic neutropenia is expected and is not a concern.","low_causes":"Low neutrophils (benign ethnic neutropenia, medications, viral infection)","high_causes":"Acute infection, chronic stress, systemic inflammation, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve function. Marina's sodium of 141 is within the optimal range of 136 to 143, indicating normal fluid and electrolyte balance.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Marina's potassium of 4.2 is within the optimal range, indicating normal potassium balance.","low_causes":"Diuretics, vomiting, diarrhoea, poor dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and is a key component of stomach acid. Marina's chloride of 100 is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"16.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2121","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, helping to maintain blood pH within a very narrow range. Marina's bicarbonate of 16.5 is below the lower limit of 20, indicating that her blood may be more acidic than it should be (metabolic acidosis). Her kidney function is excellent (Cystatin C eGFR 107), so this is unlikely to be caused by kidney disease. Possible explanations include inadequate caloric intake, chronic low-grade inflammation, or an early renal tubular acidosis that does not yet affect the overall filtration rate. This finding should be discussed with her GP.","low_causes":"Metabolic acidosis, diarrhoea, renal tubular acidosis, diabetic ketoacidosis, starvation","high_causes":"Metabolic alkalosis, vomiting, diuretics, antacid overuse","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap (Calculated)","group":"ELECTROLYTES & MINERALS","result":"28.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9208","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate, and represents the unmeasured negatively charged particles in the blood. Marina's anion gap of 28.7 is elevated above the upper limit of 16, driven primarily by her low bicarbonate of 16.5. An elevated anion gap alongside low bicarbonate suggests a high anion gap metabolic acidosis, which can result from ketosis, lactic acid accumulation, or other metabolic processes. This finding adds weight to the recommendation for her GP to assess her acid-base status further.","low_causes":"Laboratory error, hypoalbuminaemia","high_causes":"Ketoacidosis, lactic acidosis, renal failure, toxic ingestion, starvation ketosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"208","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3619","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5524","units":"umol/L","description":"Uric acid is a waste product of purine metabolism, cleared by the kidneys. Elevated levels can cause gout and are associated with cardiovascular risk. Marina's uric acid of 208 is within the optimal range for women of 160 to 320, indicating normal purine metabolism and good renal clearance.","low_causes":"Low purine diet, liver disease, some medications","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is the most abundant mineral in the body, essential for bone strength, muscle contraction, nerve function, and blood clotting. Marina's calcium of 2.41 is within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement for the albumin level, giving a more accurate picture of the physiologically active calcium in the blood. Marina's corrected calcium of 2.29 is within the optimal range, confirming normal calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5287","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4885","upper_optimal_position":"0.5862","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, protein synthesis, muscle and nerve function, and blood sugar control. Marina's magnesium of 0.99 sits squarely within the optimal range of 0.85 to 1.05, which is a positive finding especially relevant to her energy and muscle-building goals.","low_causes":"Poor dietary intake, alcohol, diuretics, proton pump inhibitors, chronic diarrhoea","high_causes":"Kidney disease, excess supplementation, magnesium-containing antacids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product of protein metabolism, filtered by the kidneys. It can reflect both kidney function and protein intake. Marina's urea of 4.4 is within the optimal range, suggesting adequate kidney clearance and a moderate level of protein intake.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4065","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3414","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product of muscle metabolism, filtered by the kidneys at a relatively constant rate. It is the standard marker used to estimate kidney filtration. Marina's creatinine of 58 is within the optimal range, consistent with her small frame and low muscle mass.","low_causes":"Low muscle mass, malnutrition, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) is calculated from creatinine and represents how well the kidneys filter waste from the blood. Marina's eGFR is reported as greater than 90, which is the normal threshold. Her Cystatin C-based eGFR of 107 provides a more accurate measurement and confirms excellent kidney function.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration","high_causes":"Hyperfiltration (early diabetes), pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3909"," lungs to every tissue in the body. Marina's haemoglobin of 121 is just barely within the normal range, sitting one point above the lower limit of 120. At this level she is at the boundary of clinical anaemia. Given her severely depleted iron stores (ferritin 5, transferrin saturation 7.1%), her haemoglobin is likely to fall further without intervention, which would explain her ongoing fatigue and low energy.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the number of red cells per litre of blood. Marina's RBC of 4.67 is within the optimal range. Interestingly, despite her severe iron deficiency, her bone marrow is maintaining a high number of red cells, but each cell is smaller (low MCV) and carries less haemoglobin (low MCH) than it should. This is the classic pattern of iron deficiency: the body tries to maintain the number of cells but cannot fill them properly.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.358","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3267","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5767","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Marina's haematocrit of 0.358 is marginally below the lower limit of 0.36. This is consistent with her iron deficiency: although she has a good number of red cells, each one is smaller than normal, so they collectively take up slightly less of the blood volume than they should.","low_causes":"Anaemia, iron deficiency, blood loss, overhydration","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"76.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2978","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"MCV (mean corpuscular volume) measures the average size of each red blood cell. Marina's MCV of 76.6 is below the lower limit of 83, confirming microcytic (small) red cells. This is the hallmark of iron deficiency: without enough iron to build haemoglobin, the bone marrow produces smaller cells. This finding, together with low MCH and high RDW, forms a classic iron deficiency picture.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol, hypothyroidism, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"25.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2867","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin in each red blood cell. Marina's MCH of 25.9 is below the lower limit of 27, meaning each red cell is carrying less oxygen-transporting haemoglobin than it should. This is directly caused by insufficient iron to build haemoglobin molecules, and is another component of the iron deficiency anaemia picture.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"338","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5222","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures the average concentration of haemoglobin within each red cell. Marina's MCHC of 338 is within the normal and optimal range, meaning that although each cell is smaller and carries less total haemoglobin, the concentration of haemoglobin within each cell is maintained. This is typical of early to moderate iron deficiency before MCHC itself begins to fall.","low_causes":"Severe iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, sample artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"17.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8222","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"RDW (red cell distribution width) measures the variation in size among red blood cells. A high RDW means there is a wide spread between the smallest and largest cells. Marina's RDW of 17.7% is significantly above the upper limit of 14%, indicating a mixed population of older normal-sized red cells and newer smaller iron-starved cells. This is a sensitive early marker of iron deficiency and confirms that the iron depletion has been developing over time.","low_causes":"Normal finding","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, thalassaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"285","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5064","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3487","upper_optimal_position":"0.5962","units":"x10^9/L","description":"Platelets are the blood cells responsible for clotting. Marina's platelet count of 285 is within the optimal range, indicating normal clotting capacity. Iron deficiency can sometimes cause reactive thrombocytosis (elevated platelets), but her count remains within a healthy range.","low_causes":"Viral infections, bone marrow disorders, medications, liver disease, autoimmune","high_causes":"Iron deficiency (reactive), infection, inflammation, post-splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5889","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6556","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets tend to be younger and more reactive. Marina's MPV of 9.4 is within the optimal range, indicating normal platelet production by the bone marrow.","low_causes":"Chronic inflammation, bone marrow suppression","high_causes":"Platelet destruction, immune thrombocytopenia, hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"4.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3883","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The total white blood cell count reflects the overall activity of the immune system. Marina's WBC of 4.33 is within the laboratory range but near the lower end and below the optimal floor of 4.5. This is being driven by her low neutrophil count rather than any deficiency across all white cell types. Her lymphocytes, monocytes, eosinophils, and basophils are all within range.","low_causes":"Benign ethnic neutropenia, viral infection, medications, autoimmune disease, bone marrow suppression","high_causes":"Infection, inflammation, stress, corticosteroids, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2813","lower_normal":"2","upper_normal":"7","lower_optimal":"2","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and form the first line of defence against bacterial and fungal infections. Marina's neutrophils at 1.74 are below the lower limit of 2.0. Mild neutropenia (low neutrophil count) in an otherwise well person of Eastern European ancestry is most commonly due to benign ethnic neutropenia, a harmless normal variant that is well documented in people from this background. It does not increase infection risk and does not require treatment, but it is worth her GP being aware of as a baseline value for future reference.","low_causes":"Benign ethnic neutropenia, viral infection, autoimmune disease, medications, B12/folate deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5317","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including T-cells that fight viruses and B-cells that produce antibodies. Marina's lymphocytes at 2.19 are within the optimal range, indicating a healthy adaptive immune system.","low_causes":"HIV, immunosuppressive drugs, severe infection, corticosteroids","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that develop into macrophages in tissues, where they engulf pathogens and cellular debris. Marina's
