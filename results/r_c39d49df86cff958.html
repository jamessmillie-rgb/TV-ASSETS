<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name": "Marina Vasilevskaya", "dob": "16/10/1985", "report_date": "2026-09-17", "summary": "Marina is a 40-year-old female presenting with a BMI of 18.9, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. She does not currently engage in any structured exercise and takes fewer than 2,000 steps per day. She takes levothyroxine for diagnosed hypothyroidism. She reports hair thinning and low energy, and her goals are to build muscle, improve energy levels, and improve cardiovascular fitness.\n\nThe most important finding in this report is a severe iron deficiency that is already affecting her red blood cells and is very likely contributing to both of her main symptoms. Her ferritin, which is the body's stored iron, has dropped to just 5, well below the lower limit of 10 and far below the optimal floor of 40. Her serum iron is 6.1 against a lower limit of 9. Her transferrin saturation, which measures how much of the iron-carrying protein in the blood is actually loaded with iron, is just 7.1% against a lower limit of 18%. Her total iron binding capacity (TIBC), which is a measure of how eagerly the body is searching for iron, has risen to 77.4, above the upper limit of 76.1, which is exactly what happens when stores are depleted and the body increases production of iron transport proteins to scavenge every available molecule. This is textbook iron deficiency, and it has progressed far enough to change the shape and content of her red blood cells. Her MCV, which measures the size of each red cell, is 76.6 against a lower limit of 83, meaning her red cells have become smaller than they should be. Her MCH, which measures how much haemoglobin each cell carries, is 25.9 against a lower limit of 27. Her RDW, which measures the variation in red cell size, has risen to 17.7% against an upper limit of 14%, indicating a mixed population of older normal-sized cells and newer smaller iron-starved cells. Her haem t levothyroxine replaces, is 19.9, which sits comfortably within the optimal range of 14 to 20. Her free T3, the more potent form that T4 converts into, is 4.5, which is at the lower boundary of the optimal range. This pattern, where TSH is elevated but T4 is adequate, suggests that the pituitary is having to push harder than it should to maintain that T4 level, and a modest dose increase may bring everything into better balance. Underactive thyroid function is itself associated with fatigue, hair thinning, and difficulty building muscle, so optimising her levothyroxine dose could make a meaningful difference to all three of her goals. We would recommend she discusses a dose review with her GP.\n\nThere are several areas where Marina's results are reassuring. Her kidney function is excellent, with a Cystatin C of 0.86 giving a calculated eGFR of 107, exactly where it should be at her age. Her liver is in very good health. ALT at 18 and Gamma GT at 10 are both well within optimal ranges, and her FIB-4 fibrosis score of 0.73 is comfortably low. Her amylase and lipase, which reflect pancreatic health, are both within range. Her magnesium at 0.99 sits squarely within the optimal range of 0.85 to 1.05, which is important for energy production and muscle function. Her calcium and corrected calcium are both within range, and her parathyroid hormone is appropriately normal. Her folate at 18 is actually marginally above the upper limit of 17, which simply reflects good dietary or supplemental intake and is not a concern. Her vitamin B12 at 427 is within the laboratory range though below the optimal floor of 500, which is worth addressing with supplementation. Her cortisol at 297 is within normal morning limits. Her reproductive hormones, with oestradiol at 228 and progesterone at 2.16, are consistent with the follicular phase of her menstrual cycle, and her FSH of 13.09 and LH of 8.72 do not suggest perimenopause. Her testosterone at 0.9, free androgen index at 1.98, and SHBG at 45.5 are all within their respective ranges. Her DHEA-S at 4.7 is healthy. Her prolactin at 130 is within the normal non-pregnant range.\n\nHer lipid profile shows a mixed picture. Her total cholesterol is 6.0, above the desirable threshold of 5.18. Her LDL cholesterol, the primary driver of arterial plaque, is 3.61 against an upper limit of 3.0. Her ApoB, which counts the actual number of atherogenic particles in the blood, is 0.92 against a target of below 0.9. These are modestly elevated. However, her HDL cholesterol at 2.1 is excellent, well above the optimal threshold of 1.6, and her triglycerides at 0.74 are very good, well below the optimal ceiling of 1.0. Her ApoB to ApoA1 ratio at 0.54 falls within the lower risk category of below 0.6, and her TC to HDL ratio at 2.86 is also healthy. Her Lp(a), which is a genetically determined and unchangeable cardiovascular risk factor, is below 25, which is reassuringly normal. This means the elevated LDL and ApoB are driven entirely by modifiable factors, primarily diet. It is worth noting that undertreated hypothyroidism slows the clearance of LDL cholesterol from the bloodstream, so optimising her levothyroxine dose may itself bring some improvement. Beyond that, dietary modifications focusing on soluble fibre intake, oily fish, and modestly reducing saturated fat should help.\n\nHer vitamin D at 71 is sufficient but below the optimal floor of 75. At her low BMI this should respond readily to supplementation.\n\nHer glucose metabolism shows a mixed signal. Her fasting glucose at 5.0 is within the optimal range. Her HbA1c at 37 mmol/mol is within the optimal range of below 42, indicating good average blood sugar control. Her fasting insulin at 7.74 is within range. However, her HOMA-IR, which estimates insulin resistance by combining fasting glucose and insulin, is 1.72 against an upper limit of 1.5. This is mildly elevated and somewhat unexpected at her low BMI, though the very low physical activity level is a likely contributor because skeletal muscle is the largest consumer of glucose and without regular contraction it becomes less insulin-sensitive. Her C-peptide, which is a byproduct of insulin production and reflects how much insulin the pancreas is actually making, is 1.04 ug/L (344 pmol/L) against a lower limit of 1.1 ug/L (364 pmol/L), marginally below range. In the context of a normal glucose and normal HbA1c, this does not suggest pancreatic insufficiency but rather reflects low overall insulin demand.\n\nHer inflammatory markers show some activity. Her hs-CRP, a general marker of systemic inflammation, is 1.3, which is within the laboratory range of below 5 but above the optimal threshold of below 1.0. Her ESR, the erythrocyte sedimentation rate which measures how quickly red blood cells settle and is another gauge of inflammation, is 20 against an upper limit of 12. Together, these suggest a low-grade inflammatory process. The most likely explanation in Marina's case is the active autoimmune thyroid disease, though iron deficiency anaemia itself can raise the ESR. Her neutrophils are low at 1.74 against a lower limit of 2.0. Mild neutropenia in the context of a total white cell count at the lower end of range (4.33) and an otherwise well person of Eastern European ancestry is most commonly benign ethnic neutropenia, a harmless normal variant that is well documented in people of certain ethnic backgrounds. It is worth the GP being aware of this baseline value.\n\nHer immunoglobulins show IgM elevated at 3.5 against an upper limit of 3.0. IgM is the first antibody the immune system produces in response to a new challenge, and a modest elevation can reflect recent infection, the autoimmune thyroid activity, or simply normal individual variation. Her IgG at 15.7 is within range though near the upper limit of 16, and her IgA at 1.9 is comfortably within range. Her total protein at 84 and globulin at 37 are both marginally above their upper limits, which is consistent with the elevated immunoglobulin levels rather than indicating a separate problem.\n\nHer total bilirubin at 30 is elevated above the upper limit of 21, but all of her liver enzymes are completely clean. This pattern, where bilirubin is raised in isolation with no other sign of liver strain, is characteristic of Gilbert's syndrome, a harmless inherited variation in bilirubin processing that affects roughly 5 to 10% of the population. It does not progress, does not cause liver damage, and does not need treatment. It may cause mild yellowing of the eyes during periods of fasting, illness, or dehydration.\n\nHer bicarbonate is low at 16.5 against a lower limit of 20. This is a notable finding and should be mentioned to her GP. Low bicarbonate can reflect a mild metabolic acidosis, and possible contributors include the very low caloric intake relative to her needs, chronic low-grade inflammatory states, or renal tubular handling. Her kidney function is otherwise excellent, so this is unlikely to reflect kidney disease, but the GP should assess her acid-base status and consider repeating this alongside a venous blood gas if clinically indicated.\n\nHer CA-125 at 31.4 is within range, and her CA 15-3 at 11.13 and CA 19-9 at 22.22 are both within range. Her CEA is below 0.5, which is normal. Her rheumatoid factor at 6 is within range, and her coeliac screen (tissue transglutaminase IgA) is negative. Her antioxidant activity at 1.51 is within range. Her creatine kinase at 64 is within range. Her urinalysis is clean, with no protein, glucose, blood, or white cells detected. The bacterial count and urine culture are pending and will be reviewed when available.\n\nHer uric acid at 208 is within the laboratory range but within the optimal range for women of 160 to 320.\n\nLate-arriving results: the urine culture has now returned with a full antibiogram, adding important clinical context to the urinalysis section of this report. The microscopy previously showed no white cells, no red cells, and negative nitrites, which together argue against active infection or significant urinary tract inflammation. The organism identified in the culture is sensitive to nitrofurantoin, mecillinam, fosfomycin, and ciprofloxacin, and resistant to ampicillin, co-amoxiclav, and trimethoprim. In the absence of symptoms such as dysuria, frequency, or loin pain, and with a clean microscopy, this culture most likely represents a colonising organism rather than a true infection, and the GP is best placed to decide whether treatment is needed based on Marina's clinical presentation. The remaining late results confirm and extend findings already described: haematocrit at 0.358 and absolute reticulocyte count at 36.9 are both below range and sit squarely within the iron deficiency picture already identified as the primary finding in this report; the FIB-4 score of 0.73, VLDL of 0.34, and cystatin C eGFR of 107 are all reassuring and consistent with the clean kidney and liver picture described; TSH at 6.41 with TPO antibodies greater than 400 and thyroglobulin antibody at 5.1 remain the key thyroid findings requiring a levothyroxine dose review with her GP; and free T4 at 19.9, SHBG at 45.5, fasting insulin at 7.74, PTH at 2.831, CA 15-3 at 11.13, CEA below 0.5, triglycerides at 0.74, and calculated free testosterone at 0.013 are all consistent with the interpretations already provided, with no new concerns arising from these results.", "links": "Marina's results point to three clear priorities, and addressing them in the right order will give her the best chance of reaching her goals of building muscle, improving energy, and improving cardiovascular fitness.\n\nThe first and most urgent priority is correcting her iron deficiency. At a ferritin of 5 with a transferrin saturation of just 7.1% and changes already visible in her red blood cells, this is beyond the point where dietary changes alone will be sufficient in any reasonable timeframe. She should see her GP as soon as possible and bring these specific numbers: ferritin 5, serum iron 6.1, transferrin saturation 7.1%, MCV 76.6, MCH 25.9, RDW 17.7%, reticulocytes 36.9, haemoglobin 121. Her GP may wish to investigate potential sources of iron loss, particularly menstrual blood loss, and may consider intravenous iron replacement given the severity of depletion. If oral iron is the chosen route, ferrous bisglycinate at 25 to 50mg taken with vitamin C on an empty stomach is the best-tolerated form, but at this level of depletion it may take three to six months to replenish stores and her GP should guide the approach. She should avoid taking iron within four hours of her levothyroxine as iron impairs its absorption. A full blood count and iron studies should be repeated in six to eight weeks to confirm the trajectory.\n\nThe second priority is optimising her thyroid medication. Her TSH at 6.41 with strongly positive TPO antibodies (greater than 400) suggests her current levothyroxine dose needs increasing. She should discuss a dose adjustment with her GP, bringing these numbers: TSH 6.41, FT4 19.9, FT3 4.5, TPO antibodies greater than 400, thyroglobulin antibodies 5.1. A typical adjustment would be an increase of 12.5 to 25 micrograms, with TSH rechecked six to eight weeks later. Optimising thyroid function could improve her energy levels, support hair regrowth, improve her cholesterol clearance, and make it easier to build muscle and tolerate exercise.\n\nThe third priority, and the one that will transform her trajectory more than any supplement, is introducing physical activity. At fewer than 2,000 steps per day with no structured exercise, Marina's body is not receiving the mechanical stimulus it needs to build muscle, maintain insulin sensitivity, support bone density, or improve cardiovascular fitness. The approach should be gradual. She should aim to increase her daily step count to 5,000 within the first month and to 7,500 within two months. She should introduce two sessions of resistance training per week, starting with bodyweight or light resistance and progressing gradually. Even one session of brisk walking for 20 to 30 minutes three times per week would begin to improve her cardiovascular fitness and insulin sensitivity. Her mildly elevated HOMA-IR of 1.72 is very likely driven primarily by the absence of physical activity, and this is the most effective intervention to bring it down.\n\nHer caloric intake needs attention. At 49kg, 161cm, and sedentary, her basal metabolic rate is approximately 1,250 calories. With a sedentary multiplier of 1.3, her current maintenance is roughly 1,625 calories per day, but as she introduces activity this will rise to approximately 1,800 to 1,950 calories. Her diet volume of 5 out of 10 and quality of 5 out of 10 suggest she may be undereating, which at her low BMI and with the degree of iron depletion she is showing is a concern. She should aim for at least 1,700 to 1,900 calories per day as she introduces exercise, ensuring she is not in a caloric deficit. Her protein intake should be at least 65 to 80 grams per day (1.3 to 1.6g per kg of bodyweight) to support the muscle-building goal, spread across three to four meals. Good protein sources that also provide iron include red meat two to three times per week, poultry, fish, eggs, and legumes.\n\nFor her cholesterol, the elevated LDL of 3.61 and ApoB of 0.92 should respond to a combination of thyroid optimisation and dietary changes. She should aim for two portions of oily fish per week (salmon, mackerel, sardines), increase soluble fibre intake through oats, beans, lentils, and vegetables, and modestly reduce saturated fat from processed and fried foods. Her Lp(a) being normal is genuinely useful information because it confirms these lipid findings are entirely modifiable.\n\nHer vitamin D at 71 should be brought above 75 with 2,000 IU of vitamin D3 daily taken with a fat-containing meal, paired with 100mcg of vitamin K2 (MK-7). Her B12 at 427 would benefit from 1,000mcg of sublingual methylcobalamin daily to bring it above the optimal threshold of 500.\n\nHer bicarbonate of 16.5 should be mentioned to her GP at the same appointment. The GP should assess whether this reflects a true metabolic acidosis or whether it is an isolated finding that resolves with better nutrition and hydration.\n\nHer ESR of 20, hs-CRP of 1.3, elevated IgM of 3.5, and marginally elevated globulin of 37 and total protein of 84 should be noted by the GP as background context. These are most likely related to her active autoimmune thyroid disease. They do not require separate investigation unless other symptoms develop.\n\nA retest of the following markers in 10 to 12 weeks would be ideal: full blood count, iron studies (ferritin, serum iron, transferrin saturation, TIBC), TSH, FT4, FT3, hs-CRP, ESR, lipid profile, HbA1c, HOMA-IR, bicarbonate, and vitamin D.", "flags": "IRON DEFICIENCY (SEVERE, GP URGENT): Ferritin 5 ng/ml (range 10-291), serum iron 6.1 umol/L (range 9-30.4), transferrin saturation 7.1% (range 18-55%), TIBC 77.4 umol/L (range 44-76.1). Iron depletion has progressed to affect erythropoiesis: MCV 76.6 fL (range 83-101), MCH 25.9 pg (range 27-32), RDW 17.7% (range 11.6-14%), HCT 0.358 (range 0.36-0.46), absolute reticulocytes 36.9 (range 50-100), haemoglobin 121 g/L (range 120-150, at the boundary of anaemia). Investigate source of iron loss. Consider IV iron given severity. Recheck FBC and iron studies in 6-8 weeks.\n\nTHYROID (SUBOPTIMAL REPLACEMENT, GP): TSH 6.41 mIU/L (range 0.55-4.78) on levothyroxine. TPO antibodies >400 U/ml (range <13.8). Thyroglobulin antibodies 5.1 U/ml (range <4.4). Confirms autoimmune (Hashimoto's) aetiology. FT4 19.9 pmol/L (range 11.5-22.7), FT3 4.5 pmol/L (range 2.6-7.1). Current dose insufficient to normalise TSH. Consider 12.5-25mcg dose increase. Recheck TSH/FT4 in 6-8 weeks post-adjustment.\n\nBICARBONATE LOW (GP): 16.5 mmol/L (range 20-31). Low bicarbonate may indicate mild metabolic acidosis. Kidney function is normal (Cystatin C eGFR 107). Consider venous blood gas and repeat electrolytes.\n\nLIPIDS (MODESTLY ELEVATED, MODIFIABLE): Total cholesterol 6.0 (desirable <5.18), LDL 3.61 (range 0.5-3.0), ApoB 0.92 (target <0.9). Mitigated by excellent HDL 2.1, triglycerides 0.74, ApoB/A1 ratio 0.54 (<0.6 lower risk), Lp(a) <25 (normal). Undertreated hypothyroidism may be contributing to impaired LDL clearance. Reassess after thyroid optimisation and dietary modification.\n\nINSULIN RESISTANCE (MILD): HOMA-IR 1.72 (range 0.5-1.5). Fasting glucose 5.0 and HbA1c 37 are normal. Most likely driven by very low physical activity. C-peptide 1.04 ug/L marginally below range (1.1-4.4), not clinically significant in context of normal glucose.\n\nINFLAMMATION (LOW-GRADE): ESR 20 mm/hr (range <12), hs-CRP 1.3 mg/L (optimal <1.0). Most likely reflects active autoimmune thyroiditis and/or iron deficiency anaemia.\n\nNEUTROPENIA (MILD): Neutrophils 1.74 (range 2.0-7.0) with WBC 4.33 (within range). In an otherwise well person of Eastern European ancestry, most likely benign ethnic neutropenia. Worth noting as baseline.\n\nIMMUNOGLOBULINS: IgM 3.5 g/L (range 0.5-3.0), IgG 15.7 g/L (range 6.5-16.0, near upper limit). Total protein 84 g/L (range 57-82), globulin 37 g/L (range 18-36). Consistent with immune activation from autoimmune thyroid disease.\n\nBILIRUBIN (GILBERT'S PATTERN): Total bilirubin 30 umol/L (range 5-21) with all liver enzymes normal. Consistent with Gilbert's syndrome. Benign, no action needed.\n\nFOLATE: 18 ng/ml (range 3-17). Marginally above range. Reflects good intake, not a concern.\n\nReassuring negatives: Kidney function excellent (Cystatin C eGFR 107). Liver enzymes all clean (ALT 18, GGT 10, FIB-4 0.73). HbA1c 37 (normal). Lp(a) <25 (normal, inherited cardiovascular risk excluded). CA-125 31.4 (within range), CA 15-3 11.13, CA 19-9 22.22, CEA <0.5 (all normal). Coeliac screen negative. Rheumatoid factor negative. Calcium, magnesium, PTH all normal. Reproductive hormones consistent with follicular phase, no evidence of perimenopause. Urinalysis clean.", "recommendations": "1. See GP promptly for iron deficiency: bring ferritin 5, transferrin saturation 7.1%, MCV 76.6, haemoglobin 121. Discuss IV iron vs oral replacement and investigation of iron loss source.\n\n2. Request levothyroxine dose review with GP: bring TSH 6.41, FT4 19.9, FT3 4.5, TPO >400. A modest dose increase is likely needed. Recheck thyroid function 6-8 weeks after any change.\n\n3. Mention bicarbonate of 16.5 to GP at the same appointment for assessment.\n\n4. Begin increasing daily steps gradually: target 5,000 within month one, 7,500 within month two. Introduce two resistance training sessions per week, starting light.\n\n5. Increase calorie intake to at least 1,700-1,900 calories per day as activity increases. Ensure at least 65-80g protein per day across 3-4 meals.\n\n6. Include red meat 2-3 times per week, oily fish twice per week, and increase soluble fibre from oats, beans, lentils, and vegetables to support both iron intake and cholesterol management.\n\n7. Start vitamin D3 2,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 100mcg.\n\n8. Start sublingual methylcobalamin B12 1,000mcg daily.\n\n9. If GP prescribes oral iron: take ferrous bisglycinate 25-50mg with vitamin C, at least 4 hours away from levothyroxine. Do not self-prescribe iron without GP guidance given the severity.\n\n10. Retest in 10-12 weeks: full blood count, iron studies, TSH, FT4, FT3, lipid profile, hs-CRP, ESR, HbA1c, HOMA-IR, bicarbonate, vitamin D.", "supplementation": "Vitamin D3: 2,000 IU (50mcg) of cholecalciferol daily, taken with a fat-containing meal. Marina's level of 71 is sufficient but below the optimal threshold of 75 nmol/L. At her low BMI, this dose should bring her comfortably into the optimal range within eight to twelve weeks.\n\nVitamin K2: 100mcg of MK-7 daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bone rather than arteries, and should always accompany vitamin D supplementation.\n\nVitamin B12: 1,000mcg of sublingual methylcobalamin daily. Her B12 at 427 is within the laboratory range but below the optimal floor of 500. Sublingual delivery bypasses any absorption issues and is the preferred form. This may support her energy levels and is important for red blood cell production alongside iron.\n\nMagnesium: Her magnesium at 0.99 is already within the optimal range. If she introduces resistance training and finds she has difficulty sleeping or muscle cramps, 200 to 300mg of magnesium glycinate before bed would be a reasonable addition, but it is not currently necessary.\n\nOmega-3 fish oil: 2g of combined EPA and DHA daily, taken with food. This will support her modestly elevated LDL and ApoB through a modest triglyceride-lowering and anti-inflammatory effect, and may support hair health.\n\nIron: Marina's iron stores are severely depleted, but given the degree of deficiency, iron supplementation should be guided by her GP rather than started independently. If her GP prescribes oral iron, the best-tolerated form is ferrous bisglycinate at 25 to 50mg, taken with a source of vitamin C (such as a glass of orange juice) to enhance absorption, on an empty stomach. It must be taken at least four hours apart from her levothyroxine, as iron significantly impairs thyroid hormone absorption. Her GP may determine that intravenous iron is more appropriate given how low her stores are.\n\nThe most important changes from this report are not supplements. They are correcting the iron deficiency under GP supervision, optimising her levothyroxine dose, introducing regular physical activity, and eating enough food with enough protein to support the body she is asking to build muscle and produce energy.", "biomarkers": [{"key": "truescore", "name": "TrueScore", "group": "OVERALL HEALTH", "result": "85", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position":
