up":"HEMATOLOGY","result":"0.79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4820","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage reflects how actively the marrow is producing new red cells. Marina's reticulocyte percentage of 0.79% is within the laboratory range but below the optimal floor of 0.8%. In the context of her iron deficiency, the marrow does not have sufficient iron to ramp up production as it normally would in response to anaemia.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Active bleeding, haemolysis, response to iron/B12 treatment, bone marrow recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_abs","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"36.893","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2463","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red cells being released into the blood per litre. Marina's absolute reticulocyte count of 36.9 is below the lower limit of 50, confirming that her bone marrow output is suppressed. This is an inappropriately low reticulocyte response for someone whose haemoglobin is at the lower boundary of normal, meaning the marrow should be producing more new cells but cannot because it lacks the iron to do so.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, aplastic anaemia","high_causes":"Haemolysis, acute blood loss, response to treatment, bone marrow recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2745","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.5333","units":"ng/ml","description":"Ferritin is the body's storage form of iron. It reflects how much iron is held in reserve in the liver, spleen, and bone marrow. Marina's ferritin of 5 is critically low, well below the laboratory lower limit of 10 and far below the optimal floor of 40. At this level, iron stores are essentially depleted. This is the central finding driving her microcytic red cell changes (low MCV, low MCH, high RDW), her suppressed reticulocyte production, and almost certainly contributing significantly to her fatigue and hair thinning.","low_causes":"Iron deficiency from blood loss (menstrual, gastrointestinal), inadequate dietary intake, malabsorption, pregnancy","high_causes":"Iron overload, haemochromatosis, inflammation (acute phase reactant), liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1967","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3800","upper_optimal_position":"0.5822","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. Marina's serum iron of 6.1 is well below the lower limit of 9, confirming that there is insufficient iron in circulation to support normal red blood cell production. Serum iron can fluctuate during the day and with meals, but at this level the finding is unequivocal.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5692","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the main iron transport protein in the blood. The liver produces more transferrin when iron stores are low, essentially building more 'trucks' to search for and carry any available iron. Marina's transferrin of 3.42 is within the upper portion of the range, which is a physiologically appropriate response to her depleted iron stores.","low_causes":"Iron overload, chronic inflammation, malnutrition, liver disease, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oestrogen use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1303","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3522","upper_optimal_position":"0.4928","units":"%","description":"Transferrin saturation measures what percentage of the available transferrin molecules are actually carrying iron. Marina's transferrin saturation of just 7.1% is far below the lower limit of 18%, meaning the vast majority of her iron transport protein is circulating empty, unable to find iron to carry. This is one of the most definitive markers of true iron deficiency and confirms that the supply of iron to the bone marrow is severely compromised.","low_causes":"Iron deficiency, chronic disease, malabsorption","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"77.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6943","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3521","upper_optimal_position":"0.5521","units":"umol/L","description":"TIBC (total iron binding capacity) measures the maximum amount of iron that the blood could carry if every transferrin molecule were fully loaded. When iron stores are depleted, the body increases transferrin production, which raises TIBC. Marina's TIBC of 77.4 is above the upper limit of 76.1, confirming the body's compensatory attempt to scavenge more iron from the limited supply available.","low_causes":"Iron overload, chronic inflammation, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"6.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7943","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4997","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how much hormone to produce. When thyroid hormone levels are insufficient, the pituitary releases more TSH to try to stimulate the thyroid. Marina's TSH of 6.41 is above the upper limit of 4.78, indicating that despite taking levothyroxine, her thyroid hormone replacement is not fully optimised. Her pituitary gland is still having to push harder than it should to maintain adequate thyroid hormone levels.","low_causes":"Excess thyroid medication, hyperthyroidism, pituitary disease","high_causes":"Hypothyroidism, insufficient replacement dose, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"19.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5827","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3899","upper_optimal_position":"0.5595","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland and replaced by levothyroxine medication. It is the circulating reservoir that gets converted to the active form, T3. Marina's FT4 of 19.9 is within the optimal range of 14 to 20, which is reassuring and shows that her levothyroxine is providing adequate T4 levels. The issue is that the pituitary (TSH 6.41) is having to work harder than it should to maintain this level, suggesting that a modest dose increase would bring TSH into the optimal range without pushing FT4 too high.","low_causes":"Hypothyroidism, insufficient levothyroxine dose, pituitary disease","high_causes":"Excess thyroid medication, hyperthyroidism, early pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4741","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the most active thyroid hormone. It is produced by conversion from T4 in tissues throughout the body and drives metabolic rate, energy production, and cellular function. Marina's FT3 of 4.5 sits at the lower boundary of the optimal range of 4.5 to 6.5. She is converting T4 to T3 adequately but at the lower end of ideal. Optimising her TSH with a dose increase may improve T3 production.","low_causes":"Hypothyroidism, illness (sick euthyroid), selenium deficiency, caloric restriction","high_causes":"Hyperthyroidism, excess thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"TPO Antibodies","group":"THYROID","result":"400","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3261","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are autoantibodies that target an enzyme in the thyroid gland essential for thyroid hormone production. Their presence confirms an autoimmune process attacking the thyroid. Marina's TPO antibodies are greater than 400, far above the upper limit of 13.8, confirming that her hypothyroidism is autoimmune in nature, consistent with Hashimoto's thyroiditis. This is not a new finding given her existing diagnosis, but the very high level confirms ongoing active immune attack against the thyroid, which is why her medication dose may need periodic adjustment as thyroid function gradually declines.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"5.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5543","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1477","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, the protein precursor to thyroid hormones. Marina's result of 5.1 is above the upper limit of 4.4, confirming the autoimmune thyroid picture alongside her strongly positive TPO antibodies. More than 80% of the population have undetectable levels of this antibody, so its presence further supports the Hashimoto's diagnosis.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"297","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4402","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5819","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning to help wake the body and declining through the day. Marina's cortisol of 297 is within the optimal morning range, suggesting her adrenal function and stress response are normal.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid use, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"228","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4973","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"150","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3839","upper_optimal_position":"0.5481","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone, essential for reproductive function, bone density, cardiovascular protection, and brain health. Marina's oestradiol of 228 is within the follicular phase range of 71.6 to 529.2, suggesting she is in the follicular phase of her menstrual cycle. This is a healthy level and shows no sign of premature ovarian decline.","low_causes":"Menopause, premature ovarian failure, extreme exercise or low body weight, medications","high_causes":"Ovarian cysts, oestrogen-producing tumours, obesity, hormone replacement therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4854","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is the hormone produced primarily after ovulation by the corpus luteum. It supports the second half of the menstrual cycle and is essential for pregnancy. Marina's progesterone of 2.16 is within the follicular phase range of 0 to 4.45, which is expected given that progesterone is naturally low during the first half of the cycle before ovulation.","low_causes":"Follicular phase of cycle (normal), anovulation, premature ovarian failure","high_causes":"Luteal phase, pregnancy, congenital adrenal hyperplasia, ovarian cysts","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"8.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5482","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"2.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3522","upper_optimal_position":"0.5870","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and triggers ovulation in women. Marina's LH of 8.72 is within the follicular phase range, consistent with normal reproductive function. An LH level in the follicular range at age 40 is reassuring and does not suggest perimenopause.","low_causes":"Pituitary disease, stress, eating disorders, hypothalamic amenorrhoea","high_causes":"Menopause, perimenopause, PCOS, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"13.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6955","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3398","upper_optimal_position":"0.5190","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) drives the development of egg-containing follicles in the ovaries. Marina's FSH of 13.09 is above the follicular phase upper limit of 10.2 but well below the postmenopausal threshold of 23. A mildly elevated FSH at age 40 may reflect early ovarian reserve changes, which are a normal part of reproductive ageing. It could also represent a mid-cycle surge if her sample was taken near ovulation. This does not indicate menopause or perimenopause on its own, particularly as her LH is within range and her oestradiol is healthy.","low_causes":"Pituitary disease, stress, eating disorders, hypothalamic amenorrhoea","high_causes":"Perimenopause, menopause, premature ovarian failure, midcycle surge","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4238","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3651","upper_optimal_position":"0.5556","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands. While present in much smaller amounts than in men, it is important for muscle maintenance, bone density, libido, energy, and mood. Marina's testosterone of 0.9 is within the laboratory range but below the optimal floor of 1.0. Given her goal of building muscle and her low energy, optimising testosterone into the upper half of the range would be supportive. Physical activity, particularly resistance training, is one of the most effective ways to naturally support testosterone levels in women.","low_causes":"Ageing, hypothyroidism, low physical activity, adrenal insufficiency, oral contraceptives","high_causes":"PCOS, adrenal hyperplasia, ovarian or adrenal tumours, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone","group":"HORMONES","result":"0.013","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3458","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.015","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5167","units":"nmol/L","description":"Free testosterone is the fraction not bound to proteins (SHBG or albumin) and is the biologically active portion available to enter cells. Marina's free testosterone of 0.013 is within the laboratory range but below the optimal floor of 0.015. This is consistent with her total testosterone being below optimal and reflects low overall androgenic activity.","low_causes":"High SHBG, low total testosterone, ageing, hypothyroidism","high_causes":"PCOS, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.98","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4153","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1","upper_optimal":"4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) is a ratio of total testosterone to SHBG, providing another estimate of biologically available testosterone. Marina's FAI of 1.98 is within the laboratory range. For a woman, a mid-range FAI is normal and does not suggest androgen excess.","low_causes":"High SHBG, low testosterone, oral contraceptives","high_causes":"PCOS, low SHBG, exogenous androgens","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"45.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3612","upper_optimal_position":"0.4964","units":"nmol/L","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds to sex hormones, including testosterone and oestradiol, regulating how much is freely available to tissues. Marina's SHBG of 45.5 is within the optimal range. This is a healthy level that is neither excessively binding her testosterone nor leaving too much free.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Hyperthyroidism, liver disease, oestrogen use, ageing, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4711","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3829","upper_optimal_position":"0.5643","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is the most abundant steroid hormone in the body, produced primarily by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. Marina's DHEA-S of 4.7 umol/L (approximately 1,732 ug/dL) is within the optimal range, indicating healthy adrenal function. DHEA-S naturally declines with age, so a solid mid-range level at 40 is a positive finding.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"130","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4018","lower_normal":"59","upper_normal":"619","lower_optimal":"80","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3708","upper_optimal_position":"0.5571","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, primarily known for its role in milk production but also involved in immune regulation and reproductive function. Marina's prolactin of 130 is within the optimal non-pregnant range, ruling out prolactinoma (a benign pituitary tumour) and confirming normal pituitary function.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary tumour, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2958","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, muscle strength, and mood regulation. It is produced in the skin in response to sunlight and is difficult to obtain in sufficient quantities from diet alone. Marina's vitamin D of 71 is sufficient (above 50) but below the optimal threshold of 75 nmol/L. Given her symptoms of fatigue and hair thinning, and her goal of building muscle, bringing this into the optimal range of 75 to 120 would be beneficial. At her low BMI, 2,000 IU daily should be sufficient.","low_causes":"Insufficient sunlight exposure, inadequate dietary intake, malabsorption, dark skin, obesity","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.831","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4937","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5689","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the four small parathyroid glands behind the thyroid. It regulates calcium levels in the blood by increasing calcium absorption from the gut, releasing calcium from bones, and reducing calcium excretion by the kidneys. Marina's PTH of 2.831 is within the optimal range, confirming that her calcium regulation is working properly and that her vitamin D level, while suboptimal, is not low enough to trigger a compensatory PTH rise.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, hyperparathyroidism, chronic kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"427","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4300","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6116","units":"pg/ml","description":"Vitamin B12 is essential for red blood cell formation, nerve function, DNA synthesis, and energy metabolism. Marina's B12 of 427 is within the laboratory range but below the optimal floor of 500. Given her existing iron deficiency and its impact on red blood cell production, ensuring B12 is optimal would support recovery once iron is replaced. Sublingual methylcobalamin at 1,000mcg daily is the recommended form.","low_causes":"Dietary insufficiency (especially vegan/vegetarian), pernicious anaemia, malabsorption, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, cell division, and red blood cell formation. It works closely with B12. Marina's folate of 18 is marginally above the upper limit of 17, which simply reflects good dietary intake or supplementation and is not a concern. High folate alongside adequate B12 supports healthy red blood cell production, which will be important as her iron stores are replenished.","low_causes":"Poor dietary intake, alcohol, malabsorption, pregnancy, certain medications","high_causes":"Supplementation, high vegetable intake, B12 deficiency masking (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4114","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3381","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles (skeletal and cardiac) and the brain. It leaks into the blood when muscle tissue is damaged. Marina's CK of 64 is within the optimal range, confirming no significant muscle damage or inflammation. Given that she is not currently exercising, this low level is expected.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, myositis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"15.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6561","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood, providing long-term immunity against previously encountered infections. Marina's IgG of 15.7 is within the laboratory range but near the upper limit of 16. In the context of her active autoimmune thyroid disease, a mildly elevated IgG is expected and reflects chronic immune activation rather than a separate immunological problem.","low_causes":"I function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {

    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
