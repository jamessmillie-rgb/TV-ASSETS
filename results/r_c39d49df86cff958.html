transferrin saturation 7.1%), her haemoglobin is likely to fall further without intervention, which would explain her ongoing fatigue and low energy.", "low_causes": "Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders", "high_causes": "Dehydration, polycythaemia, chronic hypoxia, smoking", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "rbc", "name": "Red Blood Count", "group": "HEMATOLOGY", "result": "4.67", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5567", "lower_normal": "3.8", "upper_normal": "4.8", "lower_optimal": "4", "upper_optimal": "4.8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3667", "upper_optimal_position": "0.6667", "units": "x10^12/L", "description": "The red blood cell count measures the number of red cells per litre of blood. Marina's RBC of 4.67 is within the optimal range. Interestingly, despite her severe iron deficiency, her bone marrow is maintaining a high number of red cells, but each cell is smaller (low MCV) and carries less haemoglobin (low MCH) than it should. This is the classic pattern of iron deficiency: the body tries to maintain the number of cells but cannot fill them properly.", "low_causes": "Iron deficiency, B12/folate deficiency, chronic disease, blood loss", "high_causes": "Dehydration, polycythaemia, chronic hypoxia, smoking", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "hct", "name": "Haematocrit", "group": "HEMATOLOGY", "result": "0.358", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.3267", "lower_normal": "0.36", "upper_normal": "0.46", "lower_optimal": "0.37", "upper_optimal": "0.44", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3433", "upper_optimal_position": "0.5767", "units": "L/L", "description": "Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Marina's haematocrit of 0.358 is marginally below the lower limit of 0.36. This is consistent with her iron deficiency: although she has a good number of red cells, each one is smaller than normal, so they collectively take up slightly less of the blood volume than they should.", "low_causes": "Anaemia, iron deficiency, blood loss, overhydration", "high_causes": "Dehydration, polycythaemia, chronic hypoxia", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "mcv", "name": "MCV", "group": "HEMATOLOGY", "result": "76.6", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2978", "lower_normal": "83", "upper_normal": "101", "lower_optimal": "85", "upper_optimal": "95", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3704", "upper_optimal_position": "0.5556", "units": "fL", "description": "MCV (mean corpuscular volume) measures the average size of each red blood cell. Marina's MCV of 76.6 is below the lower limit of 83, confirming microcytic (small) red cells. This is the hallmark of iron deficiency: without enough iron to build haemoglobin, the bone marrow produces smaller cells. This finding, together with low MCH and high RDW, forms a classic iron deficiency picture.", "low_causes": "Iron deficiency, thalassaemia trait, chronic disease, lead poisoning", "high_causes": "B12 or folate deficiency, alcohol, hypothyroidism, liver disease, medications", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "mch", "name": "MCH", "group": "HEMATOLOGY", "result": "25.9", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2867", "lower_normal": "27", "upper_normal": "32", "lower_optimal": "28", "upper_optimal": "31", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3667", "upper_optimal_position": "0.5667", "units": "pg", "description": "MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin in each red blood cell. Marina's MCH of 25.9 is below the lower limit of 27, meaning each red cell is carrying less oxygen-transporting haemoglobin than it should. This is directly caused by insufficient iron to build haemoglobin molecules, and is another component of the iron deficiency anaemia picture.", "low_causes": "Iron deficiency, thalassaemia", "high_causes": "B12 or folate deficiency, hypothyroidism", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "mchc", "name": "MCHC", "group": "HEMATOLOGY", "result": "338", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5222", "lower_normal": "315", "upper_normal": "345", "lower_optimal": "320", "upper_optimal": "345", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3500", "upper_optimal_position": "0.6667", "units": "g/L", "description": "MCHC (mean corpuscular haemoglobin concentration) measures the average concentration of haemoglobin within each red cell. Marina's MCHC of 338 is within the normal and optimal range, meaning that although each cell is smaller and carries less total haemoglobin, the concentration of haemoglobin within each cell is maintained. This is typical of early to moderate iron deficiency before MCHC itself begins to fall.", "low_causes": "Severe iron deficiency, thalassaemia", "high_causes": "Hereditary spherocytosis, sample artefact", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "rdw", "name": "RDW", "group": "HEMATOLOGY", "result": "17.7", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.8222", "lower_normal": "11.6", "upper_normal": "14", "lower_optimal": "11.6", "upper_optimal": "13.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5833", "units": "%", "description": "RDW (red cell distribution width) measures the variation in size among red blood cells. A high RDW means there is a wide spread between the smallest and largest cells. Marina's RDW of 17.7% is significantly above the upper limit of 14%, indicating a mixed population of older normal-sized red cells and newer smaller iron-starved cells. This is a sensitive early marker of iron deficiency and confirms that the iron depletion has been developing over time.", "low_causes": "Normal finding", "high_causes": "Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, thalassaemia, chronic disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "platelets", "name": "Platelets", "group": "HEMATOLOGY", "result": "285", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5064", "lower_normal": "150", "upper_normal": "410", "lower_optimal": "180", "upper_optimal": "350", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3487", "upper_optimal_position": "0.5962", "units": "x10^9/L", "description": "Platelets are the blood cells responsible for clotting. Marina's platelet count of 285 is within the optimal range, indicating normal clotting capacity. Iron deficiency can sometimes cause reactive thrombocytosis (elevated platelets), but her count remains within a healthy range.", "low_causes": "Viral infections, bone marrow disorders, medications, liver disease, autoimmune", "high_causes": "Iron deficiency (reactive), infection, inflammation, post-splenectomy", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "mpv", "name": "MPV", "group": "HEMATOLOGY", "result": "9.4", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5889", "lower_normal": "7.1", "upper_normal": "10.1", "lower_optimal": "7.5", "upper_optimal": "10", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3444", "upper_optimal_position": "0.6556", "units": "fL", "description": "MPV (mean platelet volume) measures the average size of platelets. Larger platelets tend to be younger and more reactive. Marina's MPV of 9.4 is within the optimal range, indicating normal platelet production by the bone marrow.", "low_causes": "Chronic inflammation, bone marrow suppression", "high_causes": "Platelet destruction, immune thrombocytopenia, hyperthyroidism", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "wbc", "name": "White Cell Count", "group": "HEMATOLOGY", "result": "4.33", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.3883", "lower_normal": "4", "upper_normal": "10", "lower_optimal": "4.5", "upper_optimal": "8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3611", "upper_optimal_position": "0.5556", "units": "x10^9/L", "description": "The total white blood cell count reflects the overall activity of the immune system. Marina's WBC of 4.33 is within the laboratory range but near the lower end and below the optimal floor of 4.5. This is being driven by her low neutrophil count rather than any deficiency across all white cell types. Her lymphocytes, monocytes, eosinophils, and basophils are all within range.", "low_causes": "Benign ethnic neutropenia, viral infection, medications, autoimmune disease, bone marrow suppression", "high_causes": "Infection, inflammation, stress, corticosteroids, smoking, leukaemia", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "neutrophils", "name": "Neutrophils", "group": "HEMATOLOGY", "result": "1.74", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2813", "lower_normal": "2", "upper_normal": "7", "lower_optimal": "2", "upper_optimal": "5.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5667", "units": "x10^9/L", "description": "Neutrophils are the most abundant white blood cells and form the first line of defence against bacterial and fungal infections. Marina's neutrophils at 1.74 are below the lower limit of 2.0. Mild neutropenia (low neutrophil count) in an otherwise well person of Eastern European ancestry is most commonly due to benign ethnic neutropenia, a harmless normal variant that is well documented in people from this background. It does not increase infection risk and does not require treatment, but it is worth her GP being aware of as a baseline value for future reference.", "low_causes": "Benign ethnic neutropenia, viral infection, autoimmune disease, medications, B12/folate deficiency", "high_causes": "Bacterial infection, inflammation, stress, smoking, corticosteroids", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "lymphocytes", "name": "Lymphocytes", "group": "HEMATOLOGY", "result": "2.19", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5317", "lower_normal": "1", "upper_normal": "3", "lower_optimal": "1.2", "upper_optimal": "2.8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3667", "upper_optimal_position": "0.6333", "units": "x10^9/L", "description": "Lymphocytes are the white blood cells responsible for adaptive immunity, including T-cells that fight viruses and B-cells that produce antibodies. Marina's lymphocytes at 2.19 are within the optimal range, indicating a healthy adaptive immune system.", "low_causes": "HIV, immunosuppressive drugs, severe infection, corticosteroids", "high_causes": "Viral infection, chronic lymphocytic leukaemia, autoimmune disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "monocytes", "name": "Monocytes", "group": "HEMATOLOGY", "result": "0.33", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4500", "lower_normal": "0.2", "upper_normal": "1", "lower_optimal": "0.2", "upper_optimal": "0.8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5833", "units": "x10^9/L", "description": "Monocytes are white blood cells that develop into macrophages in tissues, where they engulf pathogens and cellular debris. Marina's monocytes at 0.33 are within the optimal range.", "low_causes": "Bone marrow suppression, medications", "high_causes": "Chronic infection, autoimmune disease, chronic inflammation", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "eosinophils", "name": "Eosinophils", "group": "HEMATOLOGY", "result": "0.05", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.3958", "lower_normal": "0.02", "upper_normal": "0.5", "lower_optimal": "0.02", "upper_optimal": "0.35", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5521", "units": "x10^9/L", "description": "Eosinophils are white blood cells involved in fighting parasites and mediating allergic responses. Marina's eosinophils at 0.05 are within the optimal range, with no sign of allergic activity or parasitic infection.", "low_causes": "Corticosteroid use, acute stress", "high_causes": "Allergies, asthma, parasitic infection, drug reactions, autoimmune disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "basophils", "name": "Basophils", "group": "HEMATOLOGY", "result": "0.02", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.3333", "lower_normal": "0.02", "upper_normal": "0.1", "lower_optimal": "0.02", "upper_optimal": "0.08", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5833", "units": "x10^9/L", "description": "Basophils are the least common white blood cells, involved in allergic reactions and inflammation. Marina's basophils at 0.02 are at the lower boundary of the normal range, which is a normal finding as basophils are always present in very small numbers.", "low_causes": "Normal finding, corticosteroid use, hyperthyroidism", "high_causes": "Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "reticulocytes_pct", "name": "Reticulocyte Count (%)", "group": "HEMATOLOGY", "result": "0.79", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4820", "lower_normal": "0.5", "upper_normal": "2.5", "lower_optimal": "0.8", "upper_optimal": "2", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3500", "upper_optimal_position": "0.5833", "units": "%", "description": "Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage reflects how actively the marrow is producing new red cells. Marina's reticulocyte percentage of 0.79% is within the laboratory range but below the optimal floor of 0.8%. In the context of her iron deficiency, the marrow does not have sufficient iron to ramp up production as it normally would in response to anaemia.", "low_causes": "Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic kidney disease", "high_causes": "Active bleeding, haemolysis, response to iron/B12 treatment, bone marrow recovery", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "reticulocytes_abs", "name": "Reticulocytes Absolute", "group": "HEMATOLOGY", "result": "36.893", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2463", "lower_normal": "50", "upper_normal": "100", "lower_optimal": "55", "upper_optimal": "90", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3500", "upper_optimal_position": "0.6000", "units": "x10^9/L", "description": "The absolute reticulocyte count gives the actual number of young red cells being released into the blood per litre. Marina's absolute reticulocyte count of 36.9 is below the lower limit of 50, confirming that her bone marrow output is suppressed. This is an inappropriately low reticulocyte response for someone whose haemoglobin is at the lower boundary of normal, meaning the marrow should be producing more new cells but cannot because it lacks the iron to do so.", "low_causes": "Iron deficiency, B12/folate deficiency, bone marrow suppression, aplastic anaemia", "high_causes": "Haemolysis, acute blood loss, response to treatment, bone marrow recovery", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ferritin", "name": "Ferritin", "group": "IRON STUDIES", "result": "5", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.2745", "lower_normal": "10", "upper_normal": "291", "lower_optimal": "40", "upper_optimal": "150", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3440", "upper_optimal_position": "0.5333", "units": "ng/ml", "description": "Ferritin is the body's storage form of iron. It reflects how much iron is held in reserve in the liver, spleen, and bone marrow. Marina's ferritin of 5 is critically low, well below the laboratory lower limit of 10 and far below the optimal floor of 40. At this level, iron stores are essentially depleted. This is the central finding driving her microcytic red cell changes (low MCV, low MCH, high RDW), her suppressed reticulocyte production, and almost certainly contributing significantly to her fatigue and hair thinning.", "low_causes": "Iron deficiency from blood loss (menstrual, gastrointestinal), inadequate dietary intake, malabsorption, pregnancy", "high_causes": "Iron overload, haemochromatosis, inflammation (acute phase reactant), liver disease, infection", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "serum_iron", "name": "Serum Iron", "group": "IRON STUDIES", "result": "6.1", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.1967", "lower_normal": "9", "upper_normal": "30.4", "lower_optimal": "12", "upper_optimal": "25", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3800", "upper_optimal_position": "0.5822", "units": "umol/L", "description": "Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. Marina's serum iron of 6.1 is well below the lower limit of 9, confirming that there is insufficient iron in circulation to support normal red blood cell production. Serum iron can fluctuate during the day and with meals, but at this level the finding is unequivocal.", "low_causes": "Iron deficiency, chronic disease, malabsorption, blood loss", "high_causes": "Haemochromatosis, iron supplementation, haemolysis, liver disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "transferrin", "name": "Transferrin", "group": "IRON STUDIES", "result": "3.42", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5692", "lower_normal": "2.5", "upper_normal": "3.8", "lower_optimal": "2.5", "upper_optimal": "3.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.5897", "units": "g/L", "description": "Transferrin is the main iron transport protein in the blood. The liver produces more transferrin when iron stores are low, essentially building more 'trucks' to search for and carry any available iron. Marina's transferrin of 3.42 is within the upper portion of the range, which is a physiologically appropriate response to her depleted iron stores.", "low_causes": "Iron overload, chronic inflammation, malnutrition, liver disease, nephrotic syndrome", "high_causes": "Iron deficiency, pregnancy, oestrogen use", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "transferrin_saturation", "name": "Transferrin Saturation", "group": "IRON STUDIES", "result": "7.1", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.1303", "lower_normal": "18", "upper_normal": "55", "lower_optimal": "25", "upper_optimal": "40", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3522", "upper_optimal_position": "0.4928", "units": "%", "description": "Transferrin saturation measures what percentage of the available transferrin molecules are actually carrying iron. Marina's transferrin saturation of just 7.1% is far below the lower limit of 18%, meaning the vast majority of her iron transport protein is circulating empty, unable to find iron to carry. This is one of the most definitive markers of true iron deficiency and confirms that the supply of iron to the bone marrow is severely compromised.", "low_causes": "Iron deficiency, chronic disease, malabsorption", "high_causes": "Haemochromatosis, iron supplementation, haemolysis, liver disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "tibc", "name": "Total Iron Binding Capacity", "group": "IRON STUDIES", "result": "77.4", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.6943", "lower_normal": "44", "upper_normal": "76.1", "lower_optimal": "50", "upper_optimal": "70", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3521", "upper_optimal_position": "0.5521", "units": "umol/L", "description": "TIBC (total iron binding capacity) measures the maximum amount of iron that the blood could carry if every transferrin molecule were fully loaded. When iron stores are depleted, the body increases transferrin production, which raises TIBC. Marina's TIBC of 77.4 is above the upper limit of 76.1, confirming the body's compensatory attempt to scavenge more iron from the limited supply available.", "low_causes": "Iron overload, chronic inflammation, malnutrition, liver disease", "high_causes": "Iron deficiency, pregnancy", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "tsh", "name": "TSH", "group": "THYROID", "result": "6.41", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.7943", "lower_normal": "0.55", "upper_normal": "4.78", "lower_optimal": "1", "upper_optimal": "2.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3440", "upper_optimal_position": "0.4997", "units": "mIU/L", "description": "TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how much hormone to produce. When thyroid hormone levels are insufficient, the pituitary releases more TSH to try to stimulate the thyroid. Marina's TSH of 6.41 is above the upper limit of 4.78, indicating that despite taking levothyroxine, her thyroid hormone replacement is not fully optimised. Her pituitary gland is still having to push harder than it should to maintain adequate thyroid hormone levels.", "low_causes": "Excess thyroid medication, hyperthyroidism, pituitary disease", "high_causes": "Hypothyroidism, insufficient replacement dose, Hashimoto's thyroiditis, iodine deficiency", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ft4", "name": "Free T4", "group": "THYROID", "result": "19.9", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5827", "lower_normal": "11.5", "upper_normal": "22.7", "lower_optimal": "14", "upper_optimal": "20", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3899", "upper_optimal_position": "0.5595", "units": "pmol/L", "description": "Free T4 (thyroxine) is the main hormone produced by the thyroid gland and replaced by levothyroxine medication. It is the circulating reservoir that gets converted to the active form, T3. Marina's FT4 of 19.9 is within the optimal range of 14 to 20, which is reassuring and shows that her levothyroxine is providing adequate T4 levels. The issue is that the pituitary (TSH 6.41) is having to work harder than it should to maintain this level, suggesting that a modest dose increase would bring TSH into the optimal range without pushing FT4 too high.", "low_causes": "Hypothyroidism, insufficient levothyroxine dose, pituitary disease", "high_causes": "Excess thyroid medication, hyperthyroidism, early pregnancy", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ft3", "name": "Free T3", "group": "THYROID", "result": "4.5", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4741", "lower_normal": "2.6", "upper_normal": "7.1", "lower_optimal": "4.5", "upper_optimal": "6.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4741", "upper_optimal_position": "0.5926", "units": "pmol/L", "description": "Free T3 (triiodothyronine) is the most active thyroid hormone. It is produced by conversion from T4 in tissues throughout the body and drives metabolic rate, energy production, and cellular function. Marina's FT3 of 4.5 sits at the lower boundary of the optimal range of 4.5 to 6.5. She is converting T4 to T3 adequately but at the lower end of ideal. Optimising her TSH with a dose increase may improve T3 production.", "low_causes": "Hypothyroidism, illness (sick euthyroid), selenium deficiency, caloric restriction", "high_causes": "Hyperthyroidism, excess thyroid medication, T3 supplementation", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "tpo_antibodies", "name": "TPO Antibodies", "group": "THYROID", "result": "400", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "1", "lower_normal": "0", "upper_normal": "13.8", "lower_optimal": "0", "upper_optimal": "9", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.3261", "units": "U/ml", "description": "Thyroid peroxidase (TPO) antibodies are autoantibodies that target an enzyme in the thyroid gland essential for thyroid hormone production. Their presence confirms an autoimmune process attacking the thyroid. Marina's TPO antibodies are greater than 400, far above the upper limit of 13.8, confirming that her hypothyroidism is autoimmune in nature, consistent with Hashimoto's thyroiditis. This is not a new finding given her existing diagnosis, but the very high level confirms ongoing active immune attack against the thyroid, which is why her medication dose may need periodic adjustment as thyroid function gradually declines.", "low_causes": "Absence of autoimmune thyroid disease", "high_causes": "Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "thyroglobulin_antibodies", "name": "Thyroglobulin Antibodies", "group": "THYROID", "result": "5.1", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.5543", "lower_normal": "0", "upper_normal": "4.4", "lower_optimal": "0", "upper_optimal": "1.3", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.1477", "units": "U/ml", "description": "Thyroglobulin antibodies target thyroglobulin, the protein precursor to thyroid hormones. Marina's result of 5.1 is above the upper limit of 4.4, confirming the autoimmune thyroid picture alongside her strongly positive TPO antibodies. More than 80% of the population have undetectable levels of this antibody, so its presence further supports the Hashimoto's diagnosis.", "low_causes": "Absence of autoimmune thyroid disease", "high_causes": "Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring interference", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "cortisol", "name": "Cortisol", "group": "HORMONES", "result": "297", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4402", "lower_normal": "145.4", "upper_normal": "619.4", "lower_optimal": "200", "upper_optimal": "500", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3718", "upper_optimal_position": "0.5819", "units": "nmol/L", "description": "Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning to help wake the body and declining through the day. Marina's cortisol of 297 is within the optimal morning range, suggesting her adrenal function and stress response are normal.", "low_causes": "Adrenal insufficiency, Addison's disease, pituitary disease", "high_causes": "Chronic stress, Cushing's syndrome, corticosteroid use, acute illness", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "oestradiol", "name": "Oestradiol", "group": "HORMONES", "result": "228", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4973", "lower_normal": "71.6", "upper_normal": "529.2", "lower_optimal": "150", "upper_optimal": "400", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3839", "upper_optimal_position": "0.5481", "units": "pmol/L", "description": "Oestradiol is the primary oestrogen hormone, essential for reproductive function, bone density, cardiovascular protection, and brain health. Marina's oestradiol of 228 is within the follicular phase range of 71.6 to 529.2, suggesting she is in the follicular phase of her menstrual cycle. This is a healthy level and shows no sign of premature ovarian decline.", "low_causes": "Menopause, premature ovarian failure, extreme exercise or low body weight, medications", "high_causes": "Ovarian cysts, oestrogen-producing tumours, obesity, hormone replacement therapy", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "progesterone", "name": "Progesterone", "group": "HORMONES", "result": "2.16", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4854", "lower_normal": "0", "upper_normal": "4.45", "lower_optimal": "0", "upper_optimal": "4.45", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.6667", "units": "nmol/L", "description": "Progesterone is the hormone produced primarily after ovulation by the corpus luteum. It supports the second half of the menstrual cycle and is essential for pregnancy. Marina's progesterone of 2.16 is within the follicular phase range of 0 to 4.45, which is expected given that progesterone is naturally low during the first half of the cycle before ovulation.", "low_causes": "Follicular phase of cycle (normal), anovulation, premature ovarian failure", "high_causes": "Luteal phase, pregnancy, congenital adrenal hyperplasia, ovarian cysts", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "lh", "name": "Luteinising Hormone", "group": "HORMONES", "result": "8.72", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.5482", "lower_normal": "1.9", "upper_normal": "12.5", "lower_optimal": "2.5", "upper_optimal": "10", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3522", "upper_optimal_position": "0.5870", "units": "mIU/ml", "description": "Luteinising hormone (LH) is produced by the pituitary gland and triggers ovulation in women. Marina's LH of 8.72 is within the follicular phase range, consistent with normal reproductive function. An LH level in the follicular range at age 40 is reassuring and does not suggest perimenopause.", "low_causes": "Pituitary disease, stress, eating disorders, hypothalamic amenorrhoea", "high_causes": "Menopause, perimenopause, PCOS, pituitary tumour", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "fsh", "name": "Follicle Stimulating Hormone", "group": "HORMONES", "result": "13.09", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.6955", "lower_normal": "2.5", "upper_normal": "10.2", "lower_optimal": "3", "upper_optimal": "8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3398", "upper_optimal_position": "0.5190", "units": "mIU/ml", "description": "Follicle stimulating hormone (FSH) drives the development of egg-containing follicles in the ovaries. Marina's FSH of 13.09 is above the follicular phase upper limit of 10.2 but well below the postmenopausal threshold of 23. A mildly elevated FSH at age 40 may reflect early ovarian reserve changes, which are a normal part of reproductive ageing. It could also represent a mid-cycle surge if her sample was taken near ovulation. This does not indicate menopause or perimenopause on its own, particularly as her LH is within range and her oestradiol is healthy.", "low_causes": "Pituitary disease, stress, eating disorders, hypothalamic amenorrhoea", "high_causes": "Perimenopause, menopause, premature ovarian failure, midcycle surge", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "testosterone", "name": "Testosterone", "group": "HORMONES", "result": "0.9", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4238", "lower_normal": "0.5", "upper_normal": "2.6", "lower_optimal": "1", "upper_optimal": "2", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3651", "upper_optimal_position": "0.5556", "units": "nmol/L", "description": "Testosterone in women is produced by the ovaries and adrenal glands. While present in much smaller amounts than in men, it is important for muscle maintenance, bone density, libido, energy, and mood. Marina's testosterone of 0.9 is within the laboratory range but below the optimal floor of 1.0. Given her goal of building muscle and her low energy, optimising testosterone into the upper half of the range would be supportive. Physical activity, particularly resistance training, is one of the most effective ways to naturally support testosterone levels in women.", "low_causes": "Ageing, hypothyroidism, low physical activity, adrenal insufficiency, oral contraceptives", "high_causes": "PCOS, adrenal hyperplasia, ovarian or adrenal tumours, exogenous testosterone", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "free_testosterone", "name": "Free Testosterone", "group": "HORMONES", "result": "0.013", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.3458", "lower_normal": "0.01", "upper_normal": "0.25", "lower_optimal": "0.015", "upper_optimal": "0.15", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3542", "upper_optimal_position": "0.5167", "units": "nmol/L", "description": "Free testosterone is the fraction not bound to proteins (SHBG or albumin) and is the biologically active portion available to enter cells. Marina's free testosterone of 0.013 is within the laboratory range but below the optimal floor of 0.015. This is consistent with her total testosterone being below optimal and reflects low overall androgenic activity.", "low_causes": "High SHBG, low total testosterone, ageing, hypothyroidism", "high_causes": "PCOS, low SHBG, exogenous testosterone", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "fai", "name": "Free Androgen Index", "group": "HORMONES", "result": "1.98", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4153", "lower_normal": "0.5", "upper_normal": "6.5", "lower_optimal": "1", "upper_optimal": "4", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3611", "upper_optimal_position": "0.5278", "units": "", "description": "The Free Androgen Index (FAI) is a ratio of total testosterone to SHBG, providing another estimate of biologically available testosterone. Marina's FAI of 1.98 is within the laboratory range. For a woman, a mid-range FAI is normal and does not suggest androgen excess.", "low_causes": "High SHBG, low testosterone, oral contraceptives", "high_causes": "PCOS, low SHBG, exogenous androgens", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "shbg", "name": "SHBG", "group": "HORMONES", "result": "45.5", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4383", "lower_normal": "27.8", "upper_normal": "146", "lower_optimal": "40", "upper_optimal": "80", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3612", "upper_optimal_position": "0.4964", "units": "nmol/L", "description": "Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds to sex hormones, including testosterone and oestradiol, regulating how much is freely available to tissues. Marina's SHBG of 45.5 is within the optimal range. This is a healthy level that is neither excessively binding her testosterone nor leaving too much free.", "low_causes": "Obesity, insulin resistance, hypothyroidism, PCOS", "high_causes": "Hyperthyroidism, liver disease, oestrogen use, ageing, low BMI", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "dheas", "name": "DHEA Sulphate", "group": "HORMONES", "result": "4.7", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4711", "lower_normal": "0.26", "upper_normal": "11", "lower_optimal": "2", "upper_optimal": "8", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3829", "upper_optimal_position": "0.5643", "units": "umol/L", "description": "DHEA-S (dehydroepiandrosterone sulphate) is the most abundant steroid hormone in the body, produced primarily by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. Marina's DHEA-S of 4.7 umol/L (approximately 1,732 ug/dL) is within the optimal range, indicating healthy adrenal function. DHEA-S naturally declines with age, so a solid mid-range level at 40 is a positive finding.", "low_causes": "Ageing, adrenal insufficiency, chronic illness", "high_causes": "Adrenal hyperplasia, PCOS, adrenal tumour", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "prolactin", "name": "Prolactin", "group": "HORMONES", "result": "130", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4018", "lower_normal": "59", "upper_normal": "619", "lower_optimal": "80", "upper_optimal": "400", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3708", "upper_optimal_position": "0.5571", "units": "uIU/ml", "description": "Prolactin is a hormone produced by the pituitary gland, primarily known for its role in milk production but also involved in immune regulation and reproductive function. Marina's prolactin of 130 is within the optimal non-pregnant range, ruling out prolactinoma (a benign pituitary tumour) and confirming normal pituitary function.", "low_causes": "Dopamine agonist medications", "high_causes": "Pituitary tumour, medications (antipsychotics, antidepressants), hypothyroidism, stress", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "vitamin_d", "name": "Vitamin D 25(OH)", "group": "VITAMINS & NUTRIENTS", "result": "71", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.2958", "lower_normal": "50", "upper_normal": "120", "lower_optimal": "75", "upper_optimal": "120", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4167", "upper_optimal_position": "0.6667", "units": "nmol/L", "description": "Vitamin D is essential for calcium absorption, bone health, immune function, muscle strength, and mood regulation. It is produced in the skin in response to sunlight and is difficult to obtain in sufficient quantities from diet alone. Marina's vitamin D of 71 is sufficient (above 50) but below the optimal threshold of 75 nmol/L. Given her symptoms of fatigue and hair thinning, and her goal of building muscle, bringing this into the optimal range of 75 to 120 would be beneficial. At her low BMI, 2,000 IU daily should be sufficient.", "low_causes": "Insufficient sunlight exposure, inadequate dietary intake, malabsorption, dark skin, obesity", "high_causes": "Excess supplementation, granulomatous disease", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "pth", "name": "Parathyroid Hormone", "group": "VITAMINS & NUTRIENTS", "result": "2.831", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4937", "lower_normal": "0.98", "upper_normal": "4.73", "lower_optimal": "1.5", "upper_optimal": "4", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3805", "upper_optimal_position": "0.5689", "units": "pmol/L", "description": "Parathyroid hormone (PTH) is produced by the four small parathyroid glands behind the thyroid. It regulates calcium levels in the blood by increasing calcium absorption from the gut, releasing calcium from bones, and reducing calcium excretion by the kidneys. Marina's PTH of 2.831 is within the optimal range, confirming that her calcium regulation is working properly and that her vitamin D level, while suboptimal, is not low enough to trigger a compensatory PTH rise.", "low_causes": "Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency", "high_causes": "Vitamin D deficiency, hyperparathyroidism, chronic kidney disease, calcium deficiency", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "vitamin_b12", "name": "Vitamin B12", "group": "VITAMINS & NUTRIENTS", "result": "427", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4300", "lower_normal": "193", "upper_normal": "982", "lower_optimal": "500", "upper_optimal": "900", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4556", "upper_optimal_position": "0.6116", "units": "pg/ml", "description": "Vitamin B12 is essential for red blood cell formation, nerve function, DNA synthesis, and energy metabolism. Marina's B12 of 427 is within the laboratory range but below the optimal floor of 500. Given her existing iron deficiency and its impact on red blood cell production, ensuring B12 is optimal would support recovery once iron is replaced. Sublingual methylcobalamin at 1,000mcg daily is the recommended form.", "low_causes": "Dietary insufficiency (especially vegan/vegetarian), pernicious anaemia, malabsorption, metformin use", "high_causes": "Supplementation, liver disease, myeloproliferative disorders", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "folate", "name": "Serum Folate (Vitamin B9)", "group": "VITAMINS & NUTRIENTS", "result": "18", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.6952", "lower_normal": "3", "upper_normal": "17", "lower_optimal": "8", "upper_optimal": "17", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.4524", "upper_optimal_position": "0.6667", "units": "ng/ml", "description": "Folate (vitamin B9) is essential for DNA synthesis, cell division, and red blood cell formation. It works closely with B12. Marina's folate of 18 is marginally above the upper limit of 17, which simply reflects good dietary intake or supplementation and is not a concern. High folate alongside adequate B12 supports healthy red blood cell production, which will be important as her iron stores are replenished.", "low_causes": "Poor dietary intake, alcohol, malabsorption, pregnancy, certain medications", "high_causes": "Supplementation, high vegetable intake, B12 deficiency masking (rare)", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "creatine_kinase", "name": "Creatine Kinase", "group": "CARDIAC MARKERS", "result": "64", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4114", "lower_normal": "25", "upper_normal": "200", "lower_optimal": "30", "upper_optimal": "150", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3381", "upper_optimal_position": "0.5714", "units": "U/L", "description": "Creatine kinase (CK) is an enzyme found in muscles (skeletal and cardiac) and the brain. It leaks into the blood when muscle tissue is damaged. Marina's CK of 64 is within the optimal range, confirming no significant muscle damage or inflammation. Given that she is not currently exercising, this low level is expected.", "low_causes": "Low muscle mass, sedentary lifestyle", "high_causes": "Intense exercise, muscle injury, myositis, statin use, hypothyroidism", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "igg", "name": "IgG", "group": "IMMUNOLOGY", "result": "15.7", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.6561", "lower_normal": "6.5", "upper_normal": "16", "lower_optimal": "6.5", "upper_optimal": "16", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.6667", "units": "g/L", "description": "IgG is the most abundant immunoglobulin in the blood, providing long-term immunity against previously encountered infections. Marina's IgG of 15.7 is within the laboratory range but near the upper limit of 16. In the context of her active autoimmune thyroid disease, a mildly elevated IgG is expected and reflects chronic immune activation rather than a separate immunological problem.", "low_causes": "Immunodeficiency, medications, protein-losing conditions", "high_causes": "Chronic infection, autoimmune disease, liver disease, myeloma", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "igm", "name": "IgM", "group": "IMMUNOLOGY", "result": "3.5", "within_normal": "FALSE", "within_optimal": "FALSE", "result_position": "0.7333", "lower_normal": "0.5", "upper_normal": "3", "lower_optimal": "0.5", "upper_optimal": "3", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.6667", "units": "g/L", "description": "IgM is the first antibody produced in response to a new infection or immune challenge. It is the largest antibody and is particularly effective at activating the complement system. Marina's IgM of 3.5 is above the upper limit of 3.0. A modest IgM elevation can be seen in autoimmune disease, recent or recurrent infection, or as a normal individual variant. In Marina's case, the most likely explanation is her ongoing autoimmune thyroid disease. If this remains persistently elevated on future testing, her GP may wish to exclude other causes.", "low_causes": "Immunodeficiency, medications", "high_causes": "Acute or chronic infection, autoimmune disease, primary biliary cholangitis, Waldenstrom's macroglobulinaemia", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "iga", "name": "IgA", "group": "IMMUNOLOGY", "result": "1.9", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4839", "lower_normal": "0.4", "upper_normal": "3.5", "lower_optimal": "0.4", "upper_optimal": "3.5", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3333", "upper_optimal_position": "0.6667", "units": "g/L", "description": "IgA is the immunoglobulin that protects mucosal surfaces including the gut, lungs, and urinary tract. Marina's IgA of 1.9 is comfortably within the normal range, confirming adequate mucosal immunity. Importantly, her IgA being within range means that her coeliac screen (tissue transglutaminase IgA) is reliable, as IgA deficiency can cause false negative coeliac results.", "low_causes": "Selective IgA deficiency (genetic), immunodeficiency", "high_causes": "Chronic infection, liver disease, coeliac disease, IgA nephropathy", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ige", "name": "IgE", "group": "IMMUNOLOGY", "result": "12", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.0600", "lower_normal": "0", "upper_normal": "100", "lower_optimal": "0", "upper_optimal": "50", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.2500", "units": "IU/ml", "description": "IgE is the immunoglobulin associated with allergic responses and parasitic infections. Marina's IgE of 12 is well within range and low, indicating no significant allergic sensitisation or parasitic burden.", "low_causes": "Normal finding, immunodeficiency", "high_causes": "Allergies, asthma, eczema, parasitic infection, drug reactions", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "rheumatoid_factor", "name": "Rheumatoid Factor", "group": "IMMUNOLOGY", "result": "6", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.2143", "lower_normal": "0", "upper_normal": "14", "lower_optimal": "0", "upper_optimal": "14", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "IU/ml", "description": "Rheumatoid factor (RF) is an autoantibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Marina's RF of 6 is within the normal range of below 14, providing reassurance that there is no serological evidence of rheumatoid arthritis.", "low_causes": "Normal finding", "high_causes": "Rheumatoid arthritis, Sjogren's syndrome, chronic infection, other autoimmune disease", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "ttg_iga", "name": "Tissue Transglutaminase IgA", "group": "AUTOIMMUNE & CELIAC", "result": "0.38", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.0264", "lower_normal": "0", "upper_normal": "7.19", "lower_optimal": "0", "upper_optimal": "7.19", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "CU", "description": "Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the lining of the small intestine. Marina's result of 0.38 is well within the negative range, and her IgA level is normal, so the test is reliable. This effectively rules out coeliac disease as a cause of her fatigue, hair thinning, or any malabsorption (though iron absorption could be affected by other factors).", "low_causes": "Normal finding (no coeliac disease)", "high_causes": "Coeliac disease, dermatitis herpetiformis", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "taa", "name": "Total Antioxidant Activity", "group": "SPECIALIZED TESTS", "result": "1.51", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.4830", "lower_normal": "1.3", "upper_normal": "1.77", "lower_optimal": "1.4", "upper_optimal": "1.7", "lower_normal_position": "0.3333", "upper_normal_position": "0.6667", "lower_optimal_position": "0.3810", "upper_optimal_position": "0.6190", "units": "mmol/L", "description": "Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, the unstable molecules that damage cells and accelerate ageing. Marina's TAA of 1.51 is within the optimal range, indicating adequate antioxidant protection.", "low_causes": "Poor diet, oxidative stress, chronic disease, smoking", "high_causes": "Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation", "padding": "1", "one_sided": "0.5", "range_type": "normal"}, {"key": "ca125", "name": "CA-125", "group": "TUMOR MARKERS", "result": "31.4", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.4486", "lower_normal": "0", "upper_normal": "35", "lower_optimal": "0", "upper_optimal": "35", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "U/ml", "description": "CA-125 is a protein that can be elevated in ovarian cancer but is also raised by many benign conditions including endometriosis, fibroids, pelvic inflammatory disease, and even during menstruation. Marina's CA-125 of 31.4 is within the normal range of below 35. It is at the upper end of range, which can be influenced by the menstrual cycle phase. In a 40-year-old premenopausal woman, this level is not concerning.", "low_causes": "Normal finding", "high_causes": "Ovarian cancer, endometriosis, fibroids, pelvic infection, menstruation, pregnancy", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "ca153", "name": "CA 15-3", "group": "TUMOR MARKERS", "result": "11.13", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.1855", "lower_normal": "0", "upper_normal": "30", "lower_optimal": "0", "upper_optimal": "30", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "U/ml", "description": "CA 15-3 is a tumour marker primarily used in monitoring breast cancer. It is not a screening test and can be elevated by benign conditions. Marina's CA 15-3 of 11.13 is well within the normal range, which is reassuring.", "low_causes": "Normal finding", "high_causes": "Breast cancer, ovarian cancer, liver disease, benign breast conditions", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "ca199", "name": "CA 19-9", "group": "TUMOR MARKERS", "result": "22.22", "within_normal": "TRUE", "within_optimal": "FALSE", "result_position": "0.3003", "lower_normal": "0", "upper_normal": "37", "lower_optimal": "0", "upper_optimal": "37", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "U/ml", "description": "CA 19-9 is a tumour marker most commonly associated with pancreatic and biliary cancers. It can also be elevated by benign conditions such as gallstones, pancreatitis, and liver disease. Marina's CA 19-9 of 22.22 is within the normal range.", "low_causes": "Normal finding", "high_causes": "Pancreatic cancer, biliary cancer, pancreatitis, gallstones, liver disease", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "cea", "name": "CEA", "group": "TUMOR MARKERS", "result": "0.5", "within_normal": "TRUE", "within_optimal": "TRUE", "result_position": "0.1087", "lower_normal": "0", "upper_normal": "2.3", "lower_optimal": "0", "upper_optimal": "2.3", "lower_normal_position": "0", "upper_normal_position": "0.5", "lower_optimal_position": "0", "upper_optimal_position": "0.5", "units": "ng/ml", "description": "CEA (carcinoembryonic antigen) is a protein that can be elevated in colorectal and other cancers, as well as in smokers and some benign conditions. Marina's CEA of below 0.5 is very low and well within the normal non-smoker range, which is reassuring.", "low_causes": "Normal finding", "high_causes": "Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease", "padding": "1", "one_sided": "0.5", "range_type": "no lower"}, {"key": "urine_ph", "name": "Urine pH", "group": "URINALYSIS", "result": "6", "within_normal": "", "within_optimal": "", "result_position": "", "lower_normal": "", "upper_normal": "", "lower_optimal": "", "upper_optimal": "", "lower_normal_position": "", "upper_normal_position": "", "lower_optimal_position": "", "upper_optimal_position": "", "units": "", "description": "Urine pH reflects the acidity or alkalinity of the urine. A pH of 6 is mildly acidic, which is within the normal physiological range of 4.5 to 8.0. This is a normal finding.", "low_causes": "High protein diet, metabolic acidosis, dehydration", "high_causes": "Vegetarian diet, urinary tract infection, renal tubular acidosis, alkalosis", "padding function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });

    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){

    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
      if (lo == null && hi == null) return;
      n++; if (dist(b, useBase ? pv : cv) === 0) ok++;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 116); svg += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by the share of its markers in the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
