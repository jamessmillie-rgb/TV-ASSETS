<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Max Roberts Dear","dob":"06/08/1992","report_date":"2026-09-26","summary":"Max is a 34-year-old male presenting with a BMI of 21.3, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains 3 times per week (resistance only, hard intensity) with no dedicated cardio sessions and 7,500 to 10,000 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking, with energy low all day; stress feels hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week. He takes no medications and no supplements. He has no diagnosed conditions, no family history recorded, and no previous blood test on file. He reports low energy and fatigue, brain fog, low mood and anxiety, and low sex drive and libido. His goals are to improve energy levels, improve mood, and improve sleep quality. In his own words, he is accustomed to waking up feeling refreshed and ready to seize the day, but lately wakes up tired, feels fatigued throughout the day, has low mood, low energy for exercise, difficulty concentrating at work and loses his train of thought mid-conversation.\n\nThe finding that deserves the most attention in this report is Max's Lipoprotein(a), which has come back at above 212.5 nmol/L, well above the 32 nmol/L threshold and sitting in the high-risk category. Lipoprotein(a), often written Lp(a), is a type of LDL particle that carries an extra protein called apolipoprotein(a) attached to it. That extra protein makes the particle stickier, more inflammatory, and harder for the body to clear from the bloodstream. Lp(a) is almost entirely genetically determined; it does not change meaningfully with diet, exercise or lifestyle, and it stays roughly the same for life. A level this high is a permanent entry in Max's medical record and means his cardiovascular risk is materially elevated from inherited biology alone. We would strongly recommend that Max discusses this result with his GP so that it is formally recorded, that his first-degree relatives (parents, siblings, and in time any children) are offered testing, and that a conversation about early preventive treatment is started. Guidelines increasingly support statin or PCSK9 inhibitor therapy for people with very high Lp(a) alongside elevated ApoB, and Max's GP or a lipid clinic is the right person to make that call. There is a genuinely useful piece of information buried inside this result, though: when we subtract the cholesterol carried by Lp(a) from his measured LDL, his Lp(a)-corrected LDL falls to 2.89 mmol/L, which is within the laboratory reference range. That means a meaningful portion of the LDL elevation on his standard panel is being driven by the inherited Lp(a) particles rather than by diet or metabolic factors. His ApoB at 1.15 g/L is above the 0.9 target, and his ApoB to ApoA1 ratio at 0.73 sits just above the lower-risk threshold of 0.7, but his ApoA1 itself at 1.58 is healthy, his HDL at 1.8 is excellent, and his triglycerides at 0.55 are exceptional. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, has come back at 75 out of 100, which is high. That number is being driven almost entirely by the Lp(a) and the ApoB. At 34, his absolute ten-year risk of an event remains low, but the score reflects the biological risk being built, and the gap between the two is exactly the window in which early intervention makes the biggest difference.\n\nThere is a great deal of good news in this report and it is worth dwelling on. Max's thyroid is working beautifully. TSH, which is the signal the pituitary gland sends to the thyroid to ask it to produce more hormone, sits at 0.95, right in the ideal zone below 2.5. Free T4, the circulating storage form of thyroid hormone, is 17.2, comfortably within the optimal 14 to 20 band. Free T3, the active form that cells actually use for energy and metabolism, is 5.7, which is ideal. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, meaning there is no autoimmune process affecting the gland. This is important because thyroid dysfunction is one of the most common medical explanations for the exact symptom cluster Max describes, namely fatigue, brain fog, low mood and low libido, and it has been comprehensively excluded. His kidney function is excellent. Cystatin C, a more precise measure of kidney filtration than creatinine alone because it is not affected by muscle mass, is 0.91, giving a Cystatin C eGFR of 103, exactly where it should be at 34. His blood sugar control is very good. Fasting glucose at 4.5 is in the ideal range, HbA1c at 40 mmol/mol (a measure of average blood sugar over the preceding three months) sits just below the 42 threshold for normal, and fasting insulin at 3.3 is low, giving a HOMA-IR of 0.66, which means Max is highly insulin-sensitive. His liver is in excellent health. ALT at 32 is within the ideal male range below 56, GGT at 19 is well within the optimal zone below 25, AST at 38 is fine, bilirubin at 12 is normal, and both the FIB-4 score at 0.92 and the APRI at 0.385 confirm no sign of liver fibrosis or scarring. Amylase and lipase, which reflect pancreatic health, are both comfortably within range. His inflammation markers are reassuring: ESR at 2 is essentially zero, and his full blood count is clean with haemoglobin at 145, white cells at 4.9, platelets at 247, and all differential white cell subtypes sitting well within their ranges. His prostate markers are excellent, with a total PSA of 0.15 and a healthy free ratio. His coeliac screen is negative, his rheumatoid factor is undetectable, his immunoglobulins are all within range, and his IgE at 51 rules out a significant allergic drive. His cortisol at 196 is within the normal morning range. His calcium, phosphate and parathyroid hormone are all normal, and his magnesium at 0.86 sits within the optimal band. His vitamin D at 101 is in the ideal range of 75 to 120 nmol/L, which is genuinely good without supplementation.\n\nMax's testosterone has come back at 32.9 nmol/L, which is above the laboratory upper limit of 28.7. This is an unusually strong result at 34 and is clearly not contributing to his low libido or fatigue. His free androgen index at 45.69 is healthy. However, his SHBG, sex hormone binding globulin, which is the protein that binds testosterone and makes it unavailable to tissues, is elevated at 72 against an upper limit of 65.8. When SHBG is high, a larger proportion of the total testosterone is bound up and unavailable, even though the total number looks excellent. His calculated free testosterone at 0.454 nmol/L is within the laboratory range of 0.13 to 1.04, but his bioavailable testosterone, the fraction that tissues can actually use, is 10.41 nmol/L, which sits just above the upper end of the optimal band. So despite high SHBG, Max's bioavailable testosterone is still adequate, and testosterone is unlikely to be the primary driver of his low libido. The elevated SHBG is worth noting, though, because it can be driven by low calorie intake relative to expenditure, by thyroid status (which is fine here), and by constitutional factors. At a BMI of 21.3 with hard resistance training three times a week, it is possible that Max's energy intake, while larger than average in portion size, is not keeping pace with his output, and the body has raised SHBG as part of a subtle energy-conservation signal.\n\nHis C-Peptide has come back at 0.643 ug/L, which converts to approximately 213 pmol/L, below the laboratory lower limit of 1.1 ug/L (364 pmol/L). C-Peptide is released by the pancreas in a one-to-one ratio with insulin and is a direct measure of how much insulin the pancreas is producing. A low C-Peptide alongside a low-normal fasting insulin of 3.3 and a healthy fasting glucose of 4.5 is not a sign of pancreatic failure. It means the pancreas is being asked to produce very little insulin because Max's tissues are highly sensitive to it, which is exactly what his HOMA-IR of 0.66 confirms. This is a positive pattern, not a concerning one, and is commonly seen in lean, insulin-sensitive men. The lab note mentions that C-Peptide can degrade in samples not separated within four hours, so a small part of the low reading may be a sample-handling effect, but the clinical picture of excellent glucose control with low insulin demand fits regardless.\n\nHis iron studies show an interesting pattern. Ferritin at 129 is healthy and well within the optimal male range. Serum iron at 24.5 is normal. However, his transferrin, the transport protein that carries iron through the blood, is low at 1.78 against a lower limit of 2.15, and his transferrin saturation at 54.81% sits right at the upper boundary of the reference range. When transferrin is low and saturation is high, the two most common explanations are an acute phase response, where the body lowers transferrin during inflammation, or early hereditary haemochromatosis, a genetic condition where the body absorbs too much iron. Max's CRP at 1.1 and ESR at 2 make a significant inflammatory response unlikely, which means hereditary haemochromatosis should be formally excluded. We would recommend that Max's GP arranges a HFE gene test, which is a simple blood test that looks for the two common mutations (C282Y and H63D) responsible for hereditary haemochromatosis. If the gene test is positive, early detection at 34 is genuinely valuable because it means iron levels can be managed before any organ damage occurs. If the gene test is negative, the low transferrin is likely constitutional and not a concern.\n\nHis absolute reticulocyte count at 32.6 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count means the marrow is producing red cells at a slower rate than expected. His haemoglobin at 145 is healthy and his red cell indices are all normal, so this is not causing anaemia. In a lean, active 34-year-old, a mildly low reticulocyte count can reflect the body economising on red cell production when energy availability is tight, or it can simply be a normal variation. It is worth the GP noting alongside the iron studies but does not require action on its own.\n\nHis vitamin B12 at 342 pg/mL is within the laboratory range of 193 to 982 but sits below the optimal threshold of 500. B12 is essential for nerve function, energy metabolism and mood, and levels below 500 are associated with subtle neurological symptoms including brain fog, fatigue and low mood, exactly the symptoms Max is reporting. Given that he is not supplementing and follows a mixed diet, a course of sublingual methylcobalamin, the active form of B12 that absorbs directly through the lining of the mouth, would be a straightforward way to bring this into the optimal range. His folate at 10 is adequate.\n\nHis hs-CRP at 1.1 is within the laboratory range but sits above the optimal threshold of 1.0, suggesting a very mild degree of systemic inflammation. At a BMI of 21.3 with no metabolic issues, this is likely driven by training load, mild stress, or simply day-to-day variation. It is not concerning but is worth rechecking on the next test.\n\nHis creatine kinase at 341 is marginally above the upper limit of 320. CK is an enzyme released from muscle cells during exercise, and a reading this close to the boundary in someone who trains with hard resistance three times a week is entirely expected and reflects normal muscle turnover rather than injury. His total antioxidant activity at 2.01 is above the upper range of 1.77, which is a positive finding and likely reflects reasonable dietary antioxidant intake.\n\nPutting this together with Max's symptoms, the bloods have excluded the most common medical causes of persistent fatigue, brain fog, low mood and low libido: thyroid disease, anaemia, iron deficiency, diabetes, kidney disease, liver disease, testosterone deficiency, coeliac disease and significant inflammation have all been ruled out. The two findings that could be contributing are the sub-optimal B12 at 342 and the elevated SHBG at 72, but neither alone would typically produce the severity of symptoms Max describes. The most likely explanation lies in factors that blood tests cannot fully measure. Max sleeps 7 to 8 hours but wakes slow to get going and feels low energy all day. That pattern, combined with stress being hard to manage some weeks, points strongly toward sleep quality rather than sleep quantity. He may be getting enough hours but not enough deep and REM sleep, and the \"low all day\" energy pattern rather than an afternoon crash suggests the issue begins overnight rather than being driven by blood sugar. At a BMI of 21.3 with hard resistance training and no cardio, his total energy expenditure may be outpacing his intake despite larger-than-average portions, and chronic mild energy deficit is one of the most common causes of low mood, low libido and poor concentration in lean active men. His cortisol at 196 is not suppressed, but the combination of low mood, low drive and brain fog alongside good hormone levels and good metabolic markers is a pattern often seen when the nervous system is spending too much time in a stressed, under-recovered state. We would suggest Max considers the following: a fixed wake time seven days a week with bright outdoor light within thirty minutes of waking, a caffeine cut-off by early afternoon, and a deliberate increase in total calorie and protein intake for four weeks to see whether the symptoms improve. If they do not, a GP conversation about a formal sleep study to rule out a subtle sleep disorder and a review of mood and stress management would be the right next step.\n\nMax's PhenoAge, a biological ageing score built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, has been calculated at a level that reflects his generally excellent metabolic and organ health. The markers feeding into it are almost all in the ideal range, with only the mildly above-optimal CRP contributing any upward pressure.\n\nHis IgM at 0.5 sits right at the lower boundary of the reference range. This is not clinically significant on its own and does not suggest immune deficiency, but it is worth noting for future comparison. His LH at 1.79 is at the lower end of the range, which is appropriate given his high testosterone, as the pituitary gland reduces its LH signal when testosterone is already abundant. His progesterone at 1.87 is within the male reference range and is unremarkable.","links":"The central thread in Max's results is a cardiovascular risk profile that is almost entirely inherited rather than lifestyle-driven. His Lp(a) at above 212.5 nmol/L is a genetic trait that deposits extra cholesterol-carrying particles into the bloodstream regardless of diet, exercise or body composition. When we subtract the cholesterol carried by those Lp(a) particles from his measured LDL, the corrected LDL falls to 2.89 mmol/L, inside the laboratory reference range. His ApoB at 1.15, which counts the total number of atherogenic particles in the blood, is elevated, but a substantial portion of those particles are the Lp(a) type that cannot be reduced by lifestyle alone. Meanwhile, his HDL at 1.8 is excellent, his triglycerides at 0.55 are exceptional, and his ApoA1 at 1.58 is healthy. The Cardiovascular Risk Score of 75 is being driven overwhelmingly by the Lp(a) and the ApoB; remove those two inputs and the remaining metabolic profile is clean. This means the conversation with his GP should focus on whether pharmacological treatment is appropriate for the Lp(a)-driven component of risk, rather than on dietary overhaul.\n\nThe second thread is the iron picture. Low transferrin at 1.78 alongside a saturation of 54.81% and a healthy ferritin of 129, in the absence of significant inflammation (CRP 1.1, ESR 2), raises the possibility of hereditary haemochromatosis. This is a separate genetic question from the Lp(a) finding and requires a simple HFE gene test to resolve. If positive, it is one of the most treatable genetic conditions in medicine; if negative, the finding is noted and monitored.\n\nThe third thread is Max's symptom picture. He describes a recent and noticeable change: waking tired instead of refreshed, low energy all day, brain fog, low mood and reduced libido. The bloods have excluded every common medical cause. Thyroid function is ideal, testosterone is above range, iron stores are healthy, B12 is adequate if not optimal, blood sugar is excellent, and there is no anaemia, inflammation or organ dysfunction. The sub-optimal B12 at 342 could be making a mild contribution to brain fog and fatigue, and the elevated SHBG at 72 could be reducing the amount of testosterone available to tissues despite the high total, but neither finding is severe enough to explain the full symptom burden. The most probable drivers are sleep quality, stress and energy availability, factors that blood cannot measure directly but that the quiz answers point to clearly.\n\nThe low reticulocyte count at 32.6 and the low C-Peptide at 0.643 ug/L both fit a pattern of a lean, insulin-sensitive body that is running efficiently but possibly on a tight energy budget. Neither is pathological in this context. The elevated SHBG could also reflect mild energy deficit, as the liver upregulates SHBG production when energy availability drops. If Max increases his calorie and protein intake meaningfully for four to six weeks, the SHBG may come down, the reticulocyte count may normalise, and the symptoms may improve.\n\nWhat has been excluded is as important as what has been found. There is no thyroid autoimmunity, no coeliac disease, no diabetes or pre-diabetes, no liver disease, no kidney impairment, no testosterone deficiency, no significant inflammation, no prostate concern, and no immune deficiency. The two actionable findings, the Lp(a) and the transferrin pattern, are both genetic questions that need GP involvement, and the symptom picture is most likely driven by modifiable lifestyle factors.","lifestyle":"Increase total daily calories by 300 to 400 above your current intake, aiming for approximately 2,700 to 2,900 kcal per day based on your weight, height and training load. Anchor: add a fourth meal or a substantial snack between lunch and dinner. Why: at a BMI of 21.3 with hard resistance training three times a week and 7,500 to 10,000 steps, your energy expenditure is high, and chronic mild deficit can drive the fatigue, low mood, low libido and elevated SHBG at 72 that your results show.\nHit at least 120g of protein per day, ideally closer to 130g, spread across at least three meals. Anchor: a palm-sized portion of protein on every plate before anything else goes on. Why: protein supports muscle recovery from your resistance sessions, stabilises energy and mood through the day, and ensures the body has the building blocks it needs without raiding its own reserves.\nAdd 2 to 3 more portions of vegetables or fruit per day, building from your current 2 to 3 toward 5 or more. Anchor: one extra portion at lunch (a side salad, a handful of cherry tomatoes) and one at dinner (a second vegetable on the plate). Why: the fibre, folate and micronutrients support the B12 and folate pathways behind your brain fog, and soluble fibre from oats, beans and lentils will help bring ApoB down over time.\nAdd two 20-minute brisk walks per week, ideally after your largest meal. Anchor: plate in the sink, shoes on, walk for 20 minutes. Why: post-meal walking improves glucose clearance and cardiovascular health, and regular moderate cardio at 0 cardio sessions currently is the single biggest gap in your training for long-term heart health given your Lp(a) result.\nFix your wake time to the same time seven days a week, including weekends. Anchor: set one alarm, get up when it sounds, no snooze. Why: a consistent wake time is the strongest single input for sleep quality, and your pattern of waking slow to get going with low energy all day suggests your circadian rhythm needs anchoring.\nGet bright outdoor light within 30 minutes of waking, even on cloudy days, for at least 10 minutes. Anchor: step outside with your coffee or walk to the end of the road and back. Why: morning light resets the cortisol awakening response and melatonin timing, directly addressing the slow-to-get-going pattern.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of 5 to 7 hours, so an afternoon coffee is still active at bedtime and reduces deep sleep even when you fall asleep easily, contributing to unrefreshing sleep and next-day fatigue.\nCreate a 30-minute wind-down before bed with no screens. Anchor: phone on charge in another room at a fixed time. Why: screen light and stimulation suppress melatonin and keep the brain in an alert state, and your energy pattern of low all day with stress some weeks suggests your nervous system is not fully switching off at night.","flags":"Lp(a) above 212.5 nmol/L (threshold 32 nmol/L, high-risk category above 200). This is a genetically determined, lifelong cardiovascular risk factor. It cannot be modified by diet or exercise. GP should record permanently, consider referral to a lipid clinic, and offer testing to first-degree relatives. Early pharmacological intervention (statin or PCSK9 inhibitor) should be discussed given the combination of high Lp(a) and ApoB above target.\nApoB 1.15 g/L (target below 0.9), LDL 3.58 mmol/L (target below 3.0), ApoB/A1 ratio 0.73 (target below 0.7). However, Lp(a)-corrected LDL is 2.89, within range, meaning a significant portion of the ApoB elevation is Lp(a)-driven and not modifiable by lifestyle alone. HDL 1.8 and triglycerides 0.55 are excellent. Cardiovascular Risk Score 75/100, driven by Lp(a) and ApoB.\nTransferrin 1.78 g/L (below lower limit of 2.15) with transferrin saturation 54.81% (upper boundary of 55%) and ferritin 129. CRP and ESR are low, making an inflammatory explanation unlikely. HFE gene test recommended to exclude hereditary haemochromatosis.\nSHBG 72 nmol/L (above upper limit of 65.8). Total testosterone is above range at 32.9, free testosterone 0.454 is within range, and bioavailable testosterone 10.41 is adequate. Elevated SHBG may reflect constitutional factors or mild energy deficit. Not causing significant clinical concern but worth monitoring.\nTestosterone 32.9 nmol/L (above upper limit of 28.7). In the absence of exogenous testosterone use, this is a naturally high level and is not pathological. No action required.\nC-Peptide 0.643 ug/L (approximately 213 pmol/L, below lower limit of 1.1 ug/L). In context of fasting glucose 4.5, HbA1c 40, insulin 3.3 and HOMA-IR 0.66, this reflects low insulin demand in an insulin-sensitive individual, not pancreatic insufficiency.\nReticulocytes absolute 32.6 x10^9/L (below lower limit of 50). Haemoglobin 145 and red cell indices normal. Mild finding, likely reflecting energy availability or normal variation. Note alongside iron studies.\nCK 341 U/L (marginally above upper limit of 320). Expected finding in someone performing hard resistance training three times per week. Not pathological.\nB12 342 pg/mL (within lab range 193 to 982, below optimal 500). May be contributing to fatigue and brain fog. Sublingual methylcobalamin supplementation recommended.\nhs-CRP 1.1 mg/L (within lab range below 5, above optimal below 1.0). Very mildly above optimal. Likely reflects training or day-to-day variation.\nReassuring negatives: thyroid function ideal with negative antibodies, fasting glucose 4.5 and HbA1c 40 with HOMA-IR 0.66, liver enzymes all normal with FIB-4 0.92 and APRI 0.385, eGFR 103 by Cystatin C, haemoglobin 145, PSA 0.15, coeliac screen negative, rheumatoid factor negative, immunoglobulins within range, cortisol 196 within normal morning range, vitamin D 101 optimal, urinalysis clear.","recommendations":"Discuss the Lp(a) result (above 212.5 nmol/L, high-risk category) with your GP. Ask for it to be recorded permanently in your medical notes, request referral to a lipid clinic if available, and discuss whether early statin or PCSK9 inhibitor therapy is appropriate given the combination of elevated Lp(a) and ApoB at 1.15. Ask about testing your parents and siblings for Lp(a).\nAsk your GP to arrange a HFE gene test to exclude hereditary haemochromatosis, based on your transferrin at 1.78 (below 2.15) and transferrin saturation at 54.81% with normal inflammatory markers.\nMention the elevated SHBG at 72 (above 65.8) and the low reticulocyte count at 32.6 (below 50). These do not need urgent action but should be noted for context and retested in 4 to 6 months.\nIf fatigue, brain fog and low mood persist after 6 to 8 weeks of the lifestyle and supplement changes in this report, discuss a formal sleep study with your GP to rule out a subtle sleep disorder, and consider a review of stress and mood management.\nRetest in 4 to 6 months with the following markers: full lipid panel including ApoB and Lp(a), transferrin and transferrin saturation, ferritin, SHBG, free testosterone, B12, hs-CRP, reticulocyte count, and a full blood count. Target daily intake of approximately 2,700 to 2,900 kcal with at least 120g protein in the interim to assess the impact on SHBG, reticulocytes and symptoms.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Why: your B12 at 342 pg/mL sits below the optimal threshold of 500, and sub-optimal B12 is associated with the fatigue, brain fog and low mood you are experiencing. Sublingual methylcobalamin absorbs directly through the lining of the mouth and is the active form, avoiding the conversion step required by cheaper cyanocobalamin tablets.\nOmega-3 fish oil: 2g combined EPA and DHA daily, taken with a meal containing fat. Why: omega-3 supports cardiovascular health by lowering triglycerides (yours are already excellent at 0.55 but the anti-inflammatory and endothelial benefits matter given your Lp(a) result), reduces systemic inflammation (hs-CRP 1.1), and supports mood and brain function.\nMagnesium glycinate: 300mg before bed. Why: your magnesium at 0.86 is within range but at the lower end of the optimal band, and magnesium glycinate specifically supports sleep quality, muscle recovery from your resistance training, and nervous system calming, all of which are relevant to your waking-slow and low-energy pattern.\nVitamin D3: continue to maintain your current level through autumn and winter with 2,000 IU cholecalciferol daily taken with a fat-containing meal, plus vitamin K2 (MK-7) 100 mcg daily alongside it. Why: your vitamin D at 101 is ideal, but without supplementation through the UK winter months it will fall. K2 ensures the calcium that vitamin D helps absorb is directed to bone rather than arteries.\nDo not take iron supplements. Your ferritin at 129 is healthy and your transferrin saturation at 54.81% is already at the upper boundary. Additional iron could push saturation above the safe threshold, particularly if HFE gene testing reveals a haemochromatosis mutation.\nThe most important changes from this report are not supplements. They are increasing your total calorie and protein intake to match your training expenditure, adding vegetables and soluble fibre to your diet, anchoring your wake time and morning light exposure, and having the Lp(a) and HFE gene test conversations with your GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 61.7; held to 59 by a system rated \"See your GP\". Weakest systems: lipids & cardiovascular 21%, cardiac markers 44%, glucose & insulin 61%. Biggest drags: Apolipoprotein B, LDL Cholesterol, C-Peptide, Sex Hormone Binding Globulin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"31.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4013","lower_normal":"","upper_normal":"39","lower_optimal":"","upper_optimal":"34","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4359","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the biological risk being built in the arteries, independent of age. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. Max's score of 75 is high and is being driven almost entirely by his Lp(a) at above 212.5 and his ApoB at 1.15. His ten-year absolute risk of a cardiovascular event remains low at 34, but the gap between the low ten-year risk and the high biological risk score is the window in which early intervention, particularly pharmacological treatment to lower ApoB, makes the greatest long-term difference.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells. When liver cells are stressed or damaged, ALT leaks into the bloodstream, so a higher reading suggests more strain on the liver. Max's ALT at 32 is within the laboratory reference range of below 56 and sits just above the optimal male threshold of 30. This is not a concern and may reflect normal muscle turnover from resistance training, as ALT can be mildly elevated after intense exercise. His liver is not under significant strain.","low_causes":"","high_causes":"Liver disease, alcohol, medications, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & MET mal range, consistent with his excellent triglyceride level.","low_causes":"","high_causes":"High triglycerides, insulin resistance, excess carbohydrates","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol fractions (LDL, VLDL, IDL and Lp(a)). Max's non-HDL at 3.8 is within the laboratory range but above the optimal threshold of 3.4. Given the Lp(a) contribution, this is expected.","low_causes":"","high_causes":"Elevated LDL, elevated Lp(a), high triglycerides, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3456","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL and gives a quick picture of the balance between harmful and protective cholesterol. A ratio below 4.5 is desirable. Max's ratio at 3.11 is healthy, pulled into a good position by his excellent HDL of 1.8.","low_causes":"","high_causes":"High total cholesterol, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"32.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8035","lower_normal":" pper_normal_position":"0.6667","lower_optimal_position":"0.3740","upper_optimal_position":"0.6121","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals. Max's serum iron at 24.5 is within the optimal range.","low_causes":"Iron deficiency, chronic disease, poor absorption","high_causes":"Iron overload, haemochromatosis, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"1.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2142","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.15","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream to the bone marrow and other tissues. Max's transferrin at 1.78 is below the lower limit of 2.15. Low transferrin alongside a high transferrin saturation (54.81%) and healthy ferritin (129) is a pattern that warrants investigation for hereditary haemochromatosis, a genetic condition where the body absorbs too much iron. His low inflammatory markers (CRP 1.1, ESR 2) make an inflammatory cause unlikely. A simple HFE gene test will resolve this question.","low_causes":"Hereditary haemochromatosis, iron overload, inflammation (as a negative acute phase protein), liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"45.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3521","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3957","upper_optimal_position":"0.6040","units":"umol/l","description":"TIBC measures the total capacity of transferrin to bind iron. It is low when transferrin itself is low and high in iron deficiency. Max's TIBC at 45.8 is at the lower end of the reference range, consistent with his low transferrin. This supports the need for HFE gene testing.","low_causes":"Iron overload, haemochromatosis, chronic disease, inflammation","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"54.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5189","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3962","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation shows what percentage of the available transferrin is currently carrying iron. Max's saturation at 54.81% is right at the upper boundary of the reference range (18 to 55%) and well above the optimal band of 25 to 40%. High saturation means the available transport protein is almost fully loaded with iron. Combined with low transferrin and healthy ferritin, this pattern is the one that should prompt an HFE gene test for haemochromatosis.","low_causes":"Iron deficiency, chronic disease","high_causes":"Iron overload, haemochromatosis, liver disease, haemolysis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"32.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7376","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, mood, energy and libido. Max's testosterone at 32.9 is above the laboratory upper limit of 28.7. In the absence of exogenous testosterone, this is a naturally excellent level. It means testosterone deficiency is comprehensively excluded as a cause of his symptoms. His above-range level may be constitutional or partly driven by his resistance training and lean physique.","low_causes":"Ageing, obesity, sleep deprivation, chronic illness, medications, pituitary dysfunction","high_causes":"Exogenous testosterone, naturally high production, adrenal tumour, PCOS (female)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.454","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4517","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3893","upper_optimal_position":"0.5543","units":"nmol/l","description":"Free testosterone is the small fraction of total testosterone that circulates unbound to any protein and is immediately available to tissues. Max's free testosterone at 0.454 is within the optimal range of 0.3 to 0.7. Despite his elevated SHBG, enough testosterone is getting through to tissues in its free form.","low_causes":"High SHBG, ageing, obesity, liver disease","high_causes":"Low SHBG, exogenous testosterone","padding":"1","one_sided":"0","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7143","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3849","upper_optimal_position":"0.5917","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein made by the liver that binds testosterone and oestradiol, making them unavailable to tissues. Higher SHBG means less free hormone in circulation. Max's SHBG at 72 is above the upper limit of 65.8. Elevated SHBG in a lean, active male can be driven by low energy availability relative to training output, thyroid status (which is fine here), or constitutional factors. Despite this elevation, his free testosterone at 0.454 is within the optimal range, so the clinical impact is limited. If energy intake increases, SHBG may come down on the next test.","low_causes":"Obesity, insulin resistance, type 2 diabetes, hypothyroidism, androgen use","high_causes":"Low energy availability, liver disease, hyperthyroidism, oestrogen excess, ageing, constitutional","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"45.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4640","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"","description":"The free androgen index estimates the ratio of testosterone to SHBG and gives a quick picture of how much testosterone is functionally available. Max's FAI at 45.69 is within the optimal range, confirming that despite elevated SHBG, his very high total testosterone compensates and delivers adequate androgen activity.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, low SHBG, PCOS (female)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2704","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40 const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function rangeBar(b, big){

  if (lnp == null && unp == null) return '';

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;

  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>

}

    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>

      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
