<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Christopher Stott","dob":"27/05/1982","report_date":"2026-09-04","summary":"Christopher is a 44-year-old male presenting with a BMI of 28.7, following a standard mixed diet rated 3 out of 10 for quality with a volume of 7 out of 10. He trains intensively, with five or more cardio sessions and five or more resistance sessions per week, alongside 10,000 to 15,000 daily steps. He reports no medications, no significant habits, and his symptoms include joint pain and stiffness alongside low energy and fatigue. His goals are to improve energy levels, improve digestion and gut health, and improve cardiovascular fitness. He has specifically asked for further insight into his lipid profile, noting that his previous blood work has shown elevated LDL but he believes his lifestyle should protect him, and he wonders whether his LDL particle type or ApoB might tell a more nuanced story.\n\nThe most important finding in this report is Lipoprotein(a), and it changes the way the rest of the lipid panel needs to be read. Lipoprotein(a), often written as Lp(a), is a genetically inherited lipoprotein particle that carries cholesterol in the bloodstream in a way that is particularly damaging to artery walls. Unlike LDL cholesterol, which can be lowered through diet, exercise, and medication, Lp(a) is determined almost entirely by genetics and cannot be meaningfully changed by lifestyle. Christopher's Lp(a) is 116.38 nmol/L, which places it in the moderately increased risk category (the threshold for concern is 32 nmol/L, and moderate risk begins at 90). This is a permanent finding. It will not change with diet or exercise, and it should be recorded on his medical notes for life. It also means that first-degree relatives, parents, siblings, and children, should be tested, because Lp(a) is inherited and half of them may carry the same elevation. What Lp(a) does is threefold: it deposits cholesterol into artery walls more aggressively than standard LDL,  aggressively. The ApoB of 0.96, while only marginally above the general population threshold, is a level that most cardiovascular specialists would want to bring below 0.7 in someone with elevated Lp(a), because the combination of high particle count and high Lp(a) compounds risk in a way that neither would alone. We would strongly recommend Christopher discusses this Lp(a) result with his GP, and ideally requests referral to a lipid clinic where the combination of elevated Lp(a) and elevated ApoB can be assessed together. The GP should be aware that lifestyle optimisation alone is unlikely to bring ApoB below the tighter target that elevated Lp(a) warrants, and pharmacological intervention may need to be considered.\n\nTurning to what is working well, and there is a great deal. Christopher's inflammation is essentially undetectable. His high-sensitivity CRP (hs-CRP), the most useful marker of chronic systemic inflammation and an independent cardiovascular risk factor, is below 0.2 mg/L. For a man training at this intensity with joint pain, this is a remarkably clean result and suggests his joint symptoms are more likely mechanical or age-related wear rather than driven by systemic inflammation. His ESR (erythrocyte sedimentation rate, another inflammation marker) is just 1 mm/hour, confirming the same picture. His glucose metabolism is excellent. Fasting glucose at 5.0 mmol/L, HbA1c (a measure of average blood sugar over the past three months) at 36 mmol/mol, and fasting insulin at 4.35 mIU/L paint a picture of strong insulin sensitivity. His HOMA-IR (a calculation that estimates insulin resistance using fasting glucose and insulin together) is 0.97, comfortably below the 1.0 threshold that defines optimal insulin sensitivity. For a 44-year-old man at BMI 28.7, this is a genuinely positive result and reflects the enormous volume of exercise he is doing. His thyroid is functioning well. TSH (thyroid stimulating hormone, the brain's signal telling the thyroid how hard to work) is 1.58 mIU/L, sitting in the optimal zone between 1.0 and 2.5. Free T4 at 15.1 pmol/L and Free T3 at 5.1 pmol/L are both comfortably within range, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His kidney function is solid. Cystatin C, which is a more reliable marker of kidney filtration than creatinine because it is unaffected by muscle mass, is 0.88 mg/L, giving an estimated GFR of 98, which is exactly where it should be at 44. His prostate health is reassuring. PSA at 0.73 ng/mL is very low, and the free PSA ratio of 0.26 (26%) is well within the reassuring range. His creatine kinase (CK), an enzyme released from muscle during intense training, is 196 U/L, within the 40 to 320 range, suggesting he is recovering adequately from his training load. His immune system is functioning normally, with IgG, IgM, and IgA all within range, and IgE at 90.8 IU/mL, just under the 100 threshold. His coeliac screen (tissue transglutaminase IgA) is negative. His urinalysis is entirely clean, with no protein, no glucose, no blood, no white cells, no bacteria, and no growth on culture.\n\nHis testosterone is 31.3 nmol/L, which is above the laboratory upper limit of 28.7 and well above the optimal floor of 18. This is an excellent result for a 44-year-old male and likely reflects his very high training volume and good body composition. His SHBG (sex hormone binding globulin, the protein that binds testosterone and determines how much is free and active) is 50.9 nmol/L, within range, and his free androgen index is 61.49, also within range. His free testosterone is calculated at 0.545 nmol/L. His DHEA-S, a precursor hormone produced by the adrenal glands, is 4.4 umol/L (equivalent to approximately 1,622 ug/dL), which is well within range. Oestradiol at 129 pmol/L is within range, and progesterone at 1.82 nmol/L is within the male reference range. His cortisol at 306 nmol/L is within the expected morning range, suggesting normal adrenal function.\n\nHis vitamin D is 134 nmol/L, which is excellent and suggests he is either supplementing or getting significant sun exposure. This is comfortably within the optimal band of 75 to 120 and even slightly above it, though levels up to 150 are considered safe. His vitamin B12 at 404 pg/ml is within the laboratory range but below the optimal threshold of 500. Given that he is eating a standard mixed diet rated only 3 out of 10 for quality, this likely reflects a dietary pattern that is not consistently rich in B12 sources such as red meat, eggs, dairy, and oily fish. His folate at 16 ng/ml is good, sitting within the optimal range above 8. His magnesium at 1.06 mmol/L is within range and just above the upper optimal threshold of 1.05, which is reassuring given his heavy training load. His corrected calcium is 2.21 mmol/L, just inside the lower boundary of 2.2, and his parathyroid hormone (PTH), which is the hormone that regulates calcium levels by telling the kidneys to retain calcium and the bones to release it, is suppressed at 0.6 pmol/L, below the lower limit of 0.98. The most likely explanation for this combination is his strong vitamin D level. Vitamin D drives calcium absorption from the gut, and when calcium is being absorbed efficiently, the body suppresses PTH because it does not need PTH to maintain calcium levels. This is a physiological response rather than a pathological one, and at a corrected calcium of 2.21, which is within range, this is reassuring. However, because PTH is formally below range, it is worth mentioning to his GP for context, particularly if calcium were to drift upward on future testing.\n\nHis liver panel warrants attention. His ALT (alanine aminotransferase, an enzyme released when liver cells are stressed or damaged) is 60 IU/L, above the laboratory upper limit of 56 and above the optimal ceiling of 30 that reflects genuinely healthy liver metabolism. His GGT (gamma-glutamyl transferase, an enzyme particularly sensitive to alco months.\n\nHis C-Peptide is 0.686 ug/L (approximately 227 pmol/L), below the laboratory lower limit of 1.1 ug/L. C-Peptide is released by the pancreas in equal amounts to insulin and is a reliable marker of how much insulin the body is producing. However, with a fasting glucose of 5.0, an HbA1c of 36, and a HOMA-IR of 0.97, the low C-Peptide simply reflects very low insulin demand. His pancreas is producing exactly what his body needs, and because he is highly insulin-sensitive, that amount is small. The lab note also flags that samples not separated within four hours can show degradation of C-Peptide to 44% of baseline, which may have contributed. This is not a concern.\n\nHis total antioxidant activity (TAA) is 1.87 mmol/L, above the upper limit of 1.77. This is almost always driven by supplementation with antioxidants such as vitamin C, vitamin E, or polyphenol-rich supplements, or by a diet very high in berries, green tea, or dark chocolate. It is not a concern.\n\nAmong the full blood count, his white cell count at 4.02 and neutrophils at 2.01 are both sitting right at their lower boundaries. In a heavily training individual, this is a recognised pattern. Intense exercise redistributes white blood cells and can suppress the resting count, and this is compounded when calorie quality is low. His reticulocytes (young red blood cells freshly released from the bone marrow) are at 49.5, marginally below the lower limit of 50. This is a trivial margin and reflects normal red cell turnover. His RDW at 11.3% is marginally below the lower limit of 11.5%, which simply means his red blood cells are very uniform in size, a finding that has no clinical consequence. His MCH at 32.5 pg is marginally above the upper limit of 32, and his MCHC at 350 g/L is marginally above the upper limit of 345. These minor red cell indices, at these margins, are usually laboratory variation influenced by sample temperature and storage as the lab note acknowledges. His MPV (mean platelet volume, the average size of his platelets) at 11.2 fL is above the upper limit of 10.1. Larger platelets are younger and more active, and MPV can be mildly elevated with intense exercise. His platelet count at 171 is within range but toward the lower end, which is consistent with larger, more active platelets replacing themselves efficiently. None of these haematological findings require action.\n\nHis urea at 8.6 mmol/L is marginally above the upper limit of 8.2. In a man consuming a high-protein diet with heavy training, this is the expected finding. Urea is the breakdown product of protein metabolism, and more protein in means more urea out. With normal creatinine, normal Cystatin C, and an eGFR of 98, kidney function is clearly not impaired, and the urea elevation is dietary.\n\nConnecting these findings back to Christopher's symptoms, his fatigue and low energy are unlikely to have a single hormonal or metabolic explanation. His thyroid, testosterone, cortisol, glucose metabolism, and iron stores are all healthy. The most plausible contributors are his diet quality at 3 out of 10 combined with an extremely high training volume. Training five or more cardio sessions and five or more resistance sessions per week represents an enormous energy and recovery demand, and fuelling that with low-quality food is like running premium-grade machinery on poor fuel. The joint pain and stiffness, in the context of undetectable inflammation, are most likely related to training volume and mechanical load rather than any systemic inflammatory or autoimmune process. His Rheumatoid Factor result is pending and will provide additional confirmation when available.\n\nIn summary, Christopher is a fit, metabolically healthy 44-year-old whose blood work reveals two findings that need attention. The first and most important is his elevated Lp(a) at 116 nmol/L, which is inherited, permanent, and changes the way his lipid risk should be managed. This should be discussed with his GP and ideally a lipid specialist, and his first-degree relatives should be tested. The second is his liver enzymes, where a mildly elevated ALT and a higher-than-optimal GGT are most likely being driven by his diet quality. The rest of his profile is strong, and his cardiovascular fitness markers, insulin sensitivity, inflammation, thyroid, testosterone, kidney function, and prostate are all in excellent shape.","links":"Christopher's most impactful change will be improving his diet quality from its current 3 out of 10. At 84 kg, 171 cm, and his extraordinary training volume, his estimated maintenance calories are approximately 2,900 to 3,200 per day. If fat loss is a secondary goal, a modest deficit to 2,500 to 2,700 would be appropriate, but given his training load, going lower than this risks compounding the fatigue he is already experiencing. His protein target should be 1.6 to 2.0 grams per kilogram, which translates to 134 to 168 grams per day, spread across at least three meals. The quality improvement should focus on replacing processed and convenience foods with whole food sources: oily fish at least three times per week (salmon, mackerel, sardines), which will also contribute EPA and DHA for cardiovascular protection; a variety of vegetables at every meal; whole grains, legumes, and pulses as carbohydrate sources rather than refined alternatives; and nuts, seeds, avocado, and olive oil as primary fat sources. Reducing saturated fat intake and increasing soluble fibre (oats, beans, lentils, flaxseed, apples) will directly support the LDL and ApoB reduction that his Lp(a) status makes more urgent.\n\nFor the lipid findings, Christopher should book an appointment with his GP specifically to discuss the Lp(a) result of 116 nmol/L and the ApoB of 0.96 g/L. The key points to bring to that conversation are: Lp(a) is inherited and unchangeable by lifestyle; the combination of elevated Lp(a) and elevated ApoB compounds cardiovascular risk; most lipid specialists would target an ApoB below 0.7 g/L in the context of elevated Lp(a); and referral to a lipid clinic would be appropriate. He should also ask the GP to record Lp(a) permanently on his medical notes and recommend testing for his parents, siblings, and any children. The dietary changes above, particularly increasing soluble fibre and oily fish while reducing saturated fat, can reduce ApoB by 10 to 15%, but this alone may not reach the tighter target.\n\nFor the liver findings, the single most effective intervention is the dietary quality improvement described above. Reducing processed food, refined sugar, and excess saturated fat will reduce the metabolic load on the liver. Alcohol intake was not reported as a habit, but if Christopher does drink, keeping intake below seven units per week and ideally below four would support liver enzyme normalisation. ALT and GGT should be rechecked in three to four months after dietary changes have been implemented.\n\nFor his B12 at 404, increasing dietary intake of B12-rich foods (red meat, eggs, dairy, shellfish) alongside sublingual methylcobalamin supplementation at 1,000 mcg daily will bring this into the optimal range above 500. B12 is essential for energy production, nerve function, and red blood cell formation, so optimising it may contribute to improving his fatigue.\n\nFor his fatigue and joint symptoms, the combination of improved diet quality and potentially a slight reduction in training volume or an increase in structured recovery (rest days, sleep optimisation, deload weeks) is likely to be more impactful than any supplement. His current training load of ten or more sessions per week is very high, and his white cell count sitting at the lower boundary suggests his immune system is being stretched. A fixed wake time, exposure to outdoor light within the first hour of waking, a caffeine cut-off by early afternoon, and a cool bedroom (16 to 18 degrees) will all support sleep quality and recovery.\n\nChristopher should request a retest in three to four months focusing on: ALT, GGT, AST (liver response to dietary changes), ApoB (response to dietary and any pharmacological intervention), a full lipid panel, serum iron and transferrin saturation (to confirm the mild iron elevation was transient), B12 (response to supplementation), and C-Peptide (to confirm the low value was sample-related). The Rheumatoid Factor result is pending and should be reviewed when available.","flags":"LIPIDS: Lp(a) 116.38 nmol/L (limit below 32). Moderately increased inherited cardiovascular risk. Permanent finding, cannot be modified by lifestyle. ApoB 0.96 g/L (desirable below 0.9). In the context of elevated Lp(a), most lipid specialists would target ApoB below 0.7. LDL 3.65 mmol/L (limit 3.0). Total cholesterol 6.3 mmol/L (desirable below 5.18). Non-HDL cholesterol 4.0 mmol/L (limit 4.0). Recommend GP referral and consideration of lipid clinic assessment. First-degree relatives should be tested for Lp(a). Protective factors: HDL 2.3 mmol/L (excellent), triglycerides 0.91 (excellent), ApoB/A1 ratio 0.57 (lower risk), TG/HDL ratio 0.40 (excellent).\n\nLIVER: ALT 60 IU/L (limit 56). GGT 63 IU/L (within range but above optimal of 25). FIB-4 1.16 (below 1.45 threshold). AST 35 (normal), bilirubin 17 (normal), albumin 45 (normal). Pattern suggests metabolic strain, most likely dietary. No evidence of fibrosis. Recheck in 3 to 4 months.\n\nIRON: Serum iron 32.7 umol/L (limit 31.3). Transferrin saturation 48.23% (within lab range, above optimal of 40%). Ferritin 121 (normal), transferrin 2.7 (normal), TIBC 60.3 (normal). Mild elevation likely transient. No iron supplementation recommended. Recheck in 3 to 4 months.\n\nENDOCRINE: PTH 0.6 pmol/L (limit 0.98) with corrected calcium 2.21 (just within range at 2.2 lower limit). Most likely physiological suppression from strong vitamin D at 134 nmol/L. Monitor on future testing.\n\nGLUCOSE: C-Peptide 0.686 ug/L (limit 1.1). Glucose 5.0, HbA1c 36, HOMA-IR 0.97 all normal. Low C-Peptide reflects low insulin demand in an insulin-sensitive individual. Sample degradation may have contributed per lab note.\n\nHORMONES: Testosterone 31.3 nmol/L (limit 28.7). Mildly above range. Clinically appropriate for a heavily training male. No concern.\n\nHAEMATOLOGY: MCH 32.5 pg (limit 32), MCHC 350 g/L (limit 345), MPV 11.2 fL (limit 10.1), RDW 11.3% (limit 11.5), reticulocytes 49.5 (limit 50). All marginal. No clinical significance.\n\nKIDNEY: Urea 8.6 mmol/L (limit 8.2). Dietary protein-driven. eGFR 98 (Cystatin C), creatinine 91, both normal.\n\nOTHER: TAA 1.87 (limit 1.77). Supplementation or dietary antioxidant-driven. Rheumatoid Factor pending.\n\nReassuring negatives: hs-CRP below 0.2 (undetectable inflammation), ESR 1, thyroid function normal with negative antibodies, PSA 0.73 with free ratio 26% (prostate health excellent), coeliac screen negative, HOMA-IR 0.97 (insulin-sensitive), Cystatin C eGFR 98 (kidney function excellent), CK 196 (adequate recovery), immunoglobulins normal, urinalysis completely clean, cortisol normal, FIB-4 below threshold.","recommendations":"1. Book a GP appointment to discuss Lp(a) at 116 nmol/L and ApoB at 0.96 g/L. Request that Lp(a) is recorded permanently on medical notes and ask about referral to a lipid clinic for combined risk assessment.\n\n2. Arrange Lp(a) testing for first-degree relatives (parents, siblings, children), as this is an inherited marker and half may carry the same elevation.\n\n3. Overhaul diet quality from 3 out of 10 toward 7 or above. Focus on whole foods, oily fish three or more times per week, abundant vegetables, whole grains, legumes, nuts, seeds, and olive oil. Reduce processed foods, refined carbohydrates, and saturated fat. Add soluble fibre sources daily (oats, beans, lentils, flaxseed).\n\n4. Maintain calorie intake at 2,500 to 2,700 kcal per day if targeting gradual fat loss, or 2,900 to 3,200 for maintenance. Protein target: 134 to 168 grams per day.\n\n5. Consider introducing structured recovery into the training programme. At ten or more sessions per week, include planned deload weeks every four to six weeks and ensure at least one full rest day per week. This will support immune function, joint recovery, and energy levels.\n\n6. Optimise sleep: fixed wake time, outdoor light exposure within the first hour of waking, caffeine cut-off by 1pm, bedroom temperature 16 to 18 degrees.\n\n7. Begin sublingual methylcobalamin B12 at 1,000 mcg daily to bring B12 from 404 into the optimal range above 500.\n\n8. Recheck in three to four months: ALT, GGT, AST, full lipid panel with ApoB, serum iron, transferrin saturation, B12, and C-Peptide.\n\n9. Review Rheumatoid Factor result when available.\n\n10. Avoid iron supplementation given serum iron and transferrin saturation are already at the upper end of range.","supplementation":"Christopher should not take iron supplements. His serum iron is already above the upper limit at 32.7 umol/L and his transferrin saturation at 48% is above optimal. Additional iron would risk pushing these further and could contribute to oxidative stress and liver strain.\n\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. His B12 at 404 pg/ml is within the laboratory range but below the optimal threshold of 500. B12 is essential for mitochondrial energy production, nerve myelination, and red blood cell formation, and optimising it may contribute to reducing his fatigue. The sublingual form bypasses the gut and is more reliably absorbed than oral tablets.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with a meal containing fat. This supports cardiovascular health through multiple mechanisms: reducing triglycerides (though his are already excellent), improving endothelial function, and providing an anti-inflammatory effect that may help with his joint symptoms. In the context of elevated Lp(a) and ApoB, omega-3 provides additional arterial protection that diet alone may not fully achieve.\n\nVitamin D3: Christopher's vitamin D at 134 nmol/L is excellent, so he should continue whatever he is currently doing, whether that is supplementation or sun exposure. If he is supplementing, a maintenance dose of 2,000 IU daily through the winter months with 100 to 200 mcg of vitamin K2 (MK-7 form) is appropriate. K2 directs calcium into bones and teeth rather than soft tissues, and is a sensible companion to vitamin D supplementation, particularly given his PTH is suppressed and calcium is at the lower boundary.\n\nMagnesium glycinate: 300 to 400 mg taken before bed. His magnesium at 1.06 is within range but given his extraordinarily high training volume, magnesium is rapidly depleted through sweat and muscle contraction. Glycinate is the best-absorbed form and has a calming effect that supports sleep quality, which in turn supports recovery and energy.\n\nThe most important changes from this report are not supplements. They are the overhaul of his diet quality from 3 out of 10 toward 7 or above, the GP conversation about his Lp(a) and ApoB, and the introduction of structured recovery into his training programme.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5333","upper_optimal_position":"0.6267","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar circulating in the bloodstream after an overnight fast. It reflects how well the body is managing blood sugar in the absence of recent food intake. A healthy fasting glucose indicates that insulin is doing its job, moving sugar out of the blood and into cells for energy. Christopher's result of 5.0 mmol/L is within the optimal range of 4.0 to 5.4, confirming that his blood sugar regulation is working efficiently. Combined with his excellent HbA1c and HOMA-IR, this paints a picture of strong metabolic health.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress, infection, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it. Because red blood cells live for approximately three months, this result provides an average picture of blood sugar control over that period, rather than a single snapshot. A result below 6.0% is considered normal, with pre-diabetes beginning at 6.0%. Christopher's result of 5.4% confirms excellent long-term blood sugar management.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high-sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised mmol/mol units. A result below 42 mmol/mol is normal, with pre-diabetes defined as 42 to 47 and diabetes above 48. Christopher's result of 36 mmol/mol is at the upper boundary of the optimal range, confirming excellent glycaemic control over the preceding three months.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3580","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3244","upper_optimal_position":"0.4055","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas needs to release to keep blood sugar within range after an overnight fast. A low fasting insulin with a normal blood glucose indicates excellent insulin sensitivity, meaning the body's cells respond efficiently to insulin's signal. A high fasting insulin, even with normal glucose, suggests the pancreas is having to work harder to maintain control, an early sign of insulin resistance. Christopher's result of 4.35 mIU/L is within the optimal range of 2 to 8, confirming that his cells are highly responsive to insulin.","low_causes":"Type 1 diabetes, advanced beta-cell failure, very low carbohydrate diet","high_causes":"Insulin resistance, obesity, metabolic syndrome, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"227","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0829","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1456","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"pmol/L","description":"C-Peptide is a small protein released by the pancreas in equal amounts to insulin. It is a reliable measure of how much insulin the body is actually producing, because unlike insulin itself, C-Peptide is not cleared by the liver and has a longer half-life in the blood. Christopher's result of 227 pmol/L (0.686 ug/L) is below the laboratory lower limit of 364 pmol/L (1.1 ug/L). However, in the context of a normal fasting glucose of 5.0, an HbA1c of 36, and a HOMA-IR of 0.97, this low C-Peptide simply reflects that his pancreas does not need to produce much insulin because his cells are highly insulin-sensitive. The lab also notes that samples not separated within four hours can degrade C-Peptide to 44% of baseline, which may have contributed to the low reading. This is not a concern.","low_causes":"High insulin sensitivity with low insulin demand, sample degradation, type 1 diabetes, advanced beta-cell failure","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4700","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation that uses fasting glucose and fasting insulin together to estimate how resistant the body's cells are to insulin's effects. A score below 1.0 indicates optimal insulin sensitivity, meaning the body needs very little insulin to manage blood sugar effectively. Scores above 1.9 suggest early insulin resistance, and above 2.9 indicate significant resistance. Christopher's HOMA-IR of 0.97 places him in the optimal category, confirming excellent insulin sensitivity. For a 44-year-old man at BMI 28.7, this is a strong result and reflects the metabolic benefits of his high training volume.","low_causes":"Very high insulin sensitivity, low carbohydrate diet, high physical activity","high_causes":"Insulin resistance, obesity, metabolic syndrome, sedentary lifestyle, high-sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1500","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the insulin-producing beta cells in the pancreas are functioning. It is calculated from fasting insulin and glucose. Christopher's HOMA-B calculates to approximately 58, which is below the reference range of 80 to 200. However, this calculation assumes a standard insulin demand. In a highly insulin-sensitive individual like Christopher, the pancreas simply does not need to produce much insulin, so the HOMA-B score underestimates beta-cell capacity. With normal glucose, normal HbA1c, and a HOMA-IR of 0.97, this low HOMA-B reflects efficient economy rather than pancreatic insufficiency.","low_causes":"High insulin sensitivity with low demand, beta-cell dysfunction, type 1 diabetes","high_causes":"Insulin resistance driving compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform a wide range of functions including transporting hormones and nutrients, fighting infection, and maintaining fluid balance. Christopher's result of 73 g/L is within the optimal range, confirming adequate protein synthesis by the liver and a healthy immune protein contribution.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease with protein loss","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and minerals, and maintains the fluid balance between blood vessels and tissues. Albumin is also a marker of liver synthetic function and nutritional status. Christopher's result of 45 g/L is within the optimal range, confirming that his liver is producing albumin effectively and his nutritional protein intake is adequate.","low_causes":"Liver disease, kidney disease with protein loss, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin is a group of proteins that includes immunoglobulins (antibodies) and transport proteins. It is calculated by subtracting albumin from total protein. Globulin levels reflect immune function and the body's inflammatory state. Christopher's result of 28 g/L is within the optimal range, indicating balanced immune protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between liver synthetic function (albumin) and immune/inflammatory protein production (globulin). A ratio within range suggests a healthy balance. Christopher's A/G ratio of 1.61 is well within the optimal range.","low_causes":"Liver disease, chronic inflammation, autoimmune disease, overproduction of globulins","high_causes":"Underproduction of globulins, immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and digestive system. In adults, elevations most commonly reflect either liver or bone pathology. Christopher's result of 80 IU/L is within both the laboratory and optimal ranges, confirming no significant biliary obstruction or bone turnover abnormality.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Liver disease, bile duct obstruction, bone disease, Paget's disease, fracture healing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. It is processed by the liver and excreted in bile. Elevated bilirubin can indicate liver disease, bile duct obstruction, or increased red blood cell breakdown. Christopher's result of 17 umol/L is within the laboratory range but at the upper end. Mild elevations in bilirubin, particularly when all other liver markers are normal, can be a sign of Gilbert's syndrome, a harmless inherited condition affecting 5 to 10% of people. However, given that his ALT is elevated, the bilirubin should be monitored alongside the liver panel on retest.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5357","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver cell stress. Christopher's ALT at 60 IU/L is above the laboratory upper limit of 56 and well above the optimal ceiling of 30 that reflects genuinely unstressed liver metabolism. In the context of a diet rated 3 out of 10 for quality, this elevation is most likely being driven by dietary factors such as processed foods, refined carbohydrates, and excess saturated or trans fats, which place metabolic strain on the liver. At BMI 28.7, early non-alcoholic fatty liver is also a possibility. The mild elevation warrants dietary improvement and a recheck in three to four months.","low_causes":"Generally not clinically significant, vitamin B6 deficiency","high_causes":"Fatty liver disease, hepatitis, alcohol, medications, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4583","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5208","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is fairly specific to the liver, AST can be elevated by muscle damage from intense exercise as well as liver stress. Christopher's AST at 35 IU/L is within the laboratory range but above the optimal ceiling of 30. Given his very high training volume, some of this may reflect muscle turnover rather than liver strain. The AST being lower than the ALT (AST/ALT ratio below 1) is consistent with non-alcoholic fatty liver as the primary driver rather than alcoholic liver disease.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, intense exercise, heart damage, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that uses age, ALT, AST, and platelet count to estimate the likelihood of liver fibrosis (scarring). A score below 1.3 in people under 65 suggests fibrosis is unlikely and the liver can be managed in primary care. Christopher's FIB-4 of 1.16 is below this threshold, which is reassuring and suggests that despite the mildly elevated ALT, there is no evidence of significant liver scarring.","low_causes":"Young age, high platelet count, low liver enzymes","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4315","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.3812","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake, medications, bile duct issues, and metabolic strain on the liver. It is often one of the first liver enzymes to rise when the liver is under stress. Christopher's GGT at 63 IU/L is within the laboratory range of 4 to 73 but is well above the optimal threshold of 25 IU/L. In the absence of reported alcohol consumption or medication use, the most likely driver is the metabolic load placed on the liver by a low-quality diet. GGT at this level, combined with the elevated ALT, reinforces the importance of dietary improvement. This marker should respond well to improved diet quality and should be rechecked in three to four months.","low_causes":"Generally not clinically significant","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4318","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5909","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that breaks down starch into sugars during digestion. Elevated amylase can indicate pancreatic inflammation (pancreatitis). Christopher's result of 56 IU/L is well within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis with burnout, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4681","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5886","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down dietary fats. It is a more specific marker of pancreatic health than amylase. Christopher's result of 32 U/L is within the optimal range, confirming that the pancreas is functioning well and digesting fats efficiently.","low_causes":"Chronic pancreatitis with loss of function","high_causes":"Acute pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6081","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures the combined amount of all cholesterol in the blood, including LDL (often called 'bad' cholesterol), HDL (protective cholesterol), and other lipoprotein fractions. While a useful screening number, total cholesterol on its own is a blunt instrument because it does not distinguish between protective and harmful fractions. Christopher's total cholesterol of 6.3 mmol/L is above the desirable threshold of 5.18, but this number is significantly influenced by his exceptionally high HDL of 2.3, which inflates the total while actually being protective. The more meaningful metrics are his LDL, ApoB, and the various ratios discussed in the summary.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Genetics, high saturated fat diet, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2676","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat circulating in the blood, derived from dietary fat and also manufactured by the liver from excess carbohydrates. Elevated triglycerides are associated with insulin resistance, metabolic syndrome, and increased cardiovascular risk. Christopher's fasting triglycerides at 0.91 mmol/L are excellent, sitting within the optimal range below 1.0. This reflects his strong insulin sensitivity and is consistent with his low HOMA-IR.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High-carbohydrate diet, insulin resistance, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2628","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues around the body. It is a precursor to LDL and is associated with cardiovascular risk when elevated. Christopher's VLDL at 0.41 mmol/L is within the optimal range, consistent with his excellent triglyceride level and strong metabolic health.","low_causes":"Very low fat diet, hyperthyroidism","high_causes":"High-carbohydrate diet, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7667","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because it performs reverse cholesterol transport, carrying cholesterol away from artery walls back to the liver for disposal. Higher HDL is protective against cardiovascular disease. Christopher's HDL at 2.3 mmol/L is exceptionally high, well above the optimal floor of 1.4 for men, and is one of the strongest protective findings in this report. This level likely reflects a combination of genetics and his very high exercise volume.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, high-carbohydrate diet","high_causes":"Regular exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6083","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is the primary carrier of cholesterol into artery walls, where it can oxidise and contribute to plaque formation. It is the most commonly referenced 'bad' cholesterol marker. Christopher's LDL at 3.65 mmol/L is above the 3.0 upper limit. However, LDL cholesterol is a calculated value that measures the cholesterol content of LDL particles, not the number of particles themselves. ApoB (see below) is a more accurate measure of particle number and therefore cardiovascular risk. In the context of his excellent triglycerides and high HDL, his LDL particles are likely predominantly the larger, less atherogenic pattern A type. Nevertheless, with an Lp(a) of 116, the absolute LDL level still contributes meaningfully to risk.","low_causes":"Hyperthyroidism, malnutrition, liver disease, chronic illness","high_causes":"High saturated fat diet, genetics, hypothyroidism, familial hypercholesterolaemia, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3044","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a simple way of assessing whether the balance of cholesterol is favourable. A ratio below 4.5 is considered low risk, and below 4 is optimal. Christopher's ratio of 2.74 is excellent, driven by his very high HDL. This ratio is more useful than total cholesterol alone because it accounts for the protective effect of HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"36.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3651","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol indicates how much of the total cholesterol is protective. A value above 20% is desirable, and above 30% is excellent. Christopher's HDL makes up 36.5% of his total cholesterol, which is outstanding and confirms that a substantial proportion of his circulating cholesterol is in the protective HDL fraction.","low_causes":"Sedentary lifestyle, obesity, metabolic syndrome","high_causes":"Regular exercise, genetics, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol, including LDL, VLDL, and remnant particles. It is considered a better predictor of cardiovascular risk than LDL alone because it includes all harmful fractions. Christopher's non-HDL at 4.0 mmol/L is right at the upper boundary of the laboratory range and above the optimal threshold of 3.4. In the context of his elevated Lp(a), bringing this number down is a priority.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, genetics, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5633","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein on HDL particles and is responsible for driving reverse cholesterol transport, the process by which cholesterol is removed from artery walls and returned to the liver. Higher ApoA1 indicates more functional HDL particles. Christopher's ApoA1 at 1.69 g/L is well above the 1.20 threshold, consistent with his exceptionally high HDL and confirming strong cardioprotective capacity.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Regular exercise, genetics, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the single most important lipid marker for cardiovascular risk assessment. Every atherogenic lipoprotein particle, whether LDL, VLDL, or Lp(a), carries exactly one ApoB molecule, making it a direct count of the number of particles that can deposit cholesterol into artery walls. ApoB is considered superior to LDL cholesterol for risk prediction because it counts particles rather than measuring cholesterol content. Christopher's ApoB at 0.96 g/L is above the 0.9 desirable threshold. In the context of his elevated Lp(a) at 116 nmol/L, most cardiovascular specialists would aim for an ApoB below 0.7 g/L, making this a finding that should be discussed with his GP and potentially a lipid clinic.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, genetics, familial hypercholesterolaemia, hypothyroidism, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.568","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4057","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the best single-number summaries of cardiovascular lipid risk. It balances the number of atherogenic particles (ApoB) against the number of protective particles (ApoA1). A ratio below 0.7 is lower risk, 0.7 to 0.9 is average, and above 0.9 is higher risk. Christopher's ratio of 0.57 is within the lower risk category, reflecting the protective effect of his very high ApoA1 offsetting his elevated ApoB. While this is reassuring, in the context of elevated Lp(a), the absolute ApoB level remains important regardless of the ratio.","low_causes":"High HDL, low LDL, exercise, genetics","high_causes":"High LDL, low HDL, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"116.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a genetically inherited lipoprotein particle that is structurally similar to LDL but with an additional protein called apolipoprotein(a) attached. Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls more aggressively than standard LDL, it promotes blood clot formation by interfering with plasminogen (a protein the body uses to dissolve clots), and it drives localised inflammation within the artery wall. U
