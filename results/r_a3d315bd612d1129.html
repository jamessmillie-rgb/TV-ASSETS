nlike LDL, Lp(a) levels are determined almost entirely by genetics and cannot be meaningfully changed by diet, exercise, or most medications. Christopher's Lp(a) at 116.38 nmol/L is in the moderately increased risk category (the normal threshold is below 32, and moderate risk is defined as 90 to 200). This is a permanent finding that should be recorded on his medical notes for life. First-degree relatives should be tested, as Lp(a) is inherited and approximately half of them may carry the same elevation. This result also changes the management target for his ApoB, with most lipid specialists recommending a tighter target below 0.7 g/L in the presence of elevated Lp(a).","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1324","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is one of the best surrogate markers for insulin resistance and LDL particle size. A low ratio strongly suggests that LDL particles are predominantly the larger, more buoyant pattern A type, which are less atherogenic than the small dense pattern B particles. A ratio below 0.87 is considered optimal, and below 1.5 is within the normal range. Christopher's ratio of 0.40 is outstanding, confirming excellent metabolic health and strongly suggesting his LDL particles are the less harmful large buoyant type.","low_causes":"High insulin sensitivity, high HDL, low triglycerides, exercise","high_causes":"Insulin resistance, metabolic syndrome, high-carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2188","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. These remnant particles are atherogenic and are increasingly recognised as an independent cardiovascular risk factor. Christopher's remnant cholesterol of 0.35 mmol/L is well within the optimal range below 0.5, confirming that triglyceride-rich particles are not contributing significantly to his cardiovascular risk.","low_causes":"Low triglycerides, high insulin sensitivity","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is the most useful single marker of chronic systemic inflammation and is an independent risk factor for cardiovascular disease. A result below 1.0 mg/L indicates low cardiovascular inflammatory risk. Christopher's hs-CRP is reported as below 0.2 mg/L, which is essentially undetectable and represents the lowest possible inflammatory state. For a man reporting joint pain and stiffness, this is a very reassuring finding, as it strongly suggests the joint symptoms are mechanical or wear-related rather than driven by systemic inflammation.","low_causes":"Low inflammation, good metabolic health","high_causes":"Infection, chronic inflammation, cardiovascular risk, autoimmune disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. It is a non-specific marker of inflammation, meaning it rises with many different conditions but does not pinpoint the cause. Christopher's ESR of 1 mm/hour is extremely low, confirming the absence of any significant systemic inflammation, consistent with his undetectable hs-CRP.","low_causes":"Low inflammation, polycythaemia","high_causes":"Infection, autoimmune disease, malignancy, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/l","description":"Sodium is the primary electrolyte that regulates fluid balance, blood pressure, and nerve and muscle function. It is tightly controlled by the kidneys and adrenal hormones. Christopher's sodium at 143 mmol/L is within the optimal range, confirming normal fluid balance and kidney regulatory function.","low_causes":"Excessive fluid intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5795","units":"mmol/l","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance, acid-base equilibrium, and electrical neutrality in the body. It is the most abundant anion in extracellular fluid. Christopher's chloride at 95 mmol/L is at the lower boundary of the laboratory range. This is within normal limits but below the optimal range of 98 to 106. At this margin, it is not clinically significant and may reflect timing, hydration status, or the body's acid-base balance at the time of the sample.","low_causes":"Vomiting, metabolic alkalosis, diuretics, excessive sweating","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3606","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's primary acid-base buffer, working to maintain blood pH within a very narrow range. It is regulated by the kidneys and lungs. Christopher's bicarbonate at 20.9 mmol/L is within the laboratory range but near the lower boundary and below the optimal range of 22 to 28. A slightly lower bicarbonate can reflect the metabolic acid load from very high training volume, as intense exercise produces lactic acid and other metabolic acids that consume bicarbonate. This is a physiological response rather than a concern.","low_causes":"Metabolic acidosis, intense exercise, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7067","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product produced by the liver when it breaks down protein. It is filtered from the blood by the kidneys and excreted in urine. Elevated urea can indicate kidney impairment but is also commonly elevated in people with high dietary protein intake, after intense exercise, or with mild dehydration. Christopher's urea at 8.6 mmol/L is marginally above the upper limit of 8.2. With a normal creatinine, a Cystatin C eGFR of 98, and his heavy training and protein demands, this elevation is almost certainly dietary and exercise-related rather than reflecting any kidney concern.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, intense exercise, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/l","description":"Creatinine is a waste product produced by muscles during normal metabolism. It is filtered by the kidneys at a relatively constant rate, making it a useful marker of kidney filtration function. Christopher's creatinine at 91 umol/L is within the optimal range, consistent with a muscular, heavily training male.","low_causes":"Low muscle mass, liver disease, very high fluid intake","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how efficiently the kidneys are filtering waste from the blood. A value above 90 is considered normal, 60 to 89 is mildly reduced, and below 60 requires further investigation. Christopher's creatinine-based eGFR of 88 is technically in the mildly reduced category, but this is a limitation of creatinine-based eGFR in muscular, heavily training men. Creatinine is produced by muscles, so more muscle mass means higher creatinine and a lower calculated eGFR. His Cystatin C-based eGFR of 98, which is not affected by muscle mass, gives a more accurate picture and confirms normal kidney function.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"High cardiac output, early diabetes (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8167","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR is calculated from Cystatin C, a small protein produced by all nucleated cells at a constant rate. Unlike creatinine, Cystatin C production is not affected by muscle mass, diet, or exercise, making it a more reliable marker of kidney function in muscular, active individuals. Christopher's Cystatin C eGFR of 98 confirms that his kidneys are filtering efficiently and at a normal rate for his age. This is the more accurate of the two eGFR values in his case.","low_causes":"Kidney disease, ageing, medications","high_causes":"Hyperfiltration, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"229","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3610","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5776","units":"umol/l","description":"Uric acid is produced when the body breaks down purines, substances found naturally in the body and in certain foods such as red meat, organ meats, and shellfish. The kidneys filter uric acid from the blood and excrete it in urine. Elevated uric acid can crystallise in joints causing gout and is associated with cardiovascular disease and kidney stones. Christopher's uric acid at 229 umol/L is within the optimal range of 200 to 380, which is reassuring given his joint symptoms, as it makes uric acid crystal deposition an unlikely explanation for his joint pain.","low_causes":"Low purine diet, certain medications, Fanconi syndrome","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Because its production is not affected by muscle mass, age, or sex to the same degree as creatinine, it provides a more accurate assessment of kidney filtration. Christopher's Cystatin C at 0.88 mg/L is within the optimal range, confirming healthy kidney function.","low_causes":"Generally not clinically significant, corticosteroid use","high_causes":"Kidney disease, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"161","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the iron-containing protein in red blood cells that carries oxygen from the lungs to every tissue in the body. It is the most fundamental marker of oxygen-carrying capacity. Christopher's haemoglobin at 161 g/L is within the optimal range for a male (140 to 165), confirming excellent oxygen delivery to his muscles and organs. This is consistent with his high training volume and adequate iron stores.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red blood cells in a given volume of blood. These cells are responsible for carrying oxygen via haemoglobin. Christopher's RBC at 4.95 is within the optimal range, confirming adequate red cell production by the bone marrow.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.459","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. It reflects both red cell production and hydration status. Christopher's haematocrit at 0.459 is within the optimal range, consistent with his healthy haemoglobin and red cell count.","low_causes":"Anaemia, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"11.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2762","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"%","description":"RDW (red cell distribution width) measures the variation in size among red blood cells. A higher RDW indicates more variation, which can suggest iron deficiency, B12 or folate deficiency, or mixed nutritional deficiencies. A lower RDW, as in Christopher's case at 11.3%, marginally below the lower limit of 11.5%, simply means his red blood cells are very uniform in size. This is a positive finding with no clinical consequence.","low_causes":"Very uniform red cell production (normal variant)","high_causes":"Iron deficiency, B12 or folate deficiency, thalassaemia, mixed nutritional deficiencies","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"92.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5131","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"97","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. Small red cells (low MCV) can indicate iron deficiency or thalassaemia, while large red cells (high MCV) can indicate B12 or folate deficiency, alcohol excess, or thyroid disease. Christopher's MCV at 92.7 fL is within the optimal range, confirming normal red cell size and adequate iron, B12, and folate availability for red blood cell production.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"32.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6667","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin in each red blood cell. Christopher's MCH at 32.5 pg is marginally above the upper limit of 32. At this margin, this is not clinically significant and often reflects sample handling, as the lab note acknowledges that MCV and MCHC can be affected by temperature and storage. His haemoglobin, RBC, and iron studies are all normal.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, alcohol excess, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"350","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures the average concentration of haemoglobin within each red blood cell. Christopher's MCHC at 350 g/L is marginally above the upper limit of 345. As with MCH, at this margin this is typically laboratory variation related to sample temperature and storage conditions, as noted by the laboratory. It does not require any follow-up action.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, sample handling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"171","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3603","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that play a critical role in blood clotting. They rush to the site of any blood vessel damage and clump together to form a plug. Christopher's platelet count at 171 is within the laboratory range but below the optimal lower boundary of 180. In combination with his elevated MPV (larger platelets), this pattern is common and reflects the bone marrow producing fewer but larger, more active platelets. This is a normal variant and not a concern.","low_causes":"Viral infections, bone marrow disorders, alcohol, autoimmune conditions, medications","high_causes":"Infection, inflammation, iron deficiency, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"11.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7887","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.1","upper_optimal":"10.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets are younger, more metabolically active, and more effective at clotting. An elevated MPV alongside a platelet count at the lower end of range is a common and generally benign finding, indicating that the bone marrow is producing fewer but larger, more functional platelets. Christopher's MPV at 11.2 fL is above the upper limit of 10.1, but in the context of his overall haematology profile, this is not a concern.","low_causes":"Bone marrow suppression, medications, aplastic anaemia","high_causes":"Platelet regeneration, intense exercise, immune thrombocytopenia, normal variant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.02","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3378","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells (WBCs) are the immune system's frontline defence. They identify and destroy bacteria, viruses, and other pathogens. The total WBC count reflects the combined activity of all white cell types. Christopher's WBC at 4.02 is just above the lower boundary of 4.0, placing it within the laboratory range but below the optimal floor of 4.5. In heavily training individuals, resting white cell counts are often suppressed because the immune system adapts to the chronic mild inflammation from exercise. This is a recognised pattern and does not indicate immune deficiency, but it does suggest his immune system is being stretched by his training load.","low_causes":"Intense exercise, viral infections, bone marrow disorders, medications, autoimmune conditions","high_causes":"Infection, inflammation, stress, corticosteroids, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3389","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. They engulf and destroy invading bacteria. Christopher's neutrophils at 2.01 are just above the lower boundary of 2.0, consistent with the overall pattern of exercise-related immune suppression seen in his total white cell count. This does not indicate a problem but reinforces the importance of adequate recovery and nutrition to support immune function.","low_causes":"Intense exercise, viral infections, medications, bone marrow disorders, benign ethnic neutropenia","high_causes":"Bacterial infection, inflammation, stress, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including recognising and remembering specific pathogens and producing antibodies. Christopher's lymphocytes at 1.64 are within the optimal range, confirming that his adaptive immune system is functioning well.","low_causes":"HIV, autoimmune disorders, corticosteroids, chemotherapy","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4042","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5417","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, engulfing dead cells, debris, and pathogens. They also play a role in presenting antigens to the adaptive immune system. Christopher's monocytes at 0.31 are within the optimal range.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, autoimmune disease, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the immune response to parasites and in allergic reactions. Christopher's eosinophils at 0.04 are within the optimal range, with no suggestion of allergic activation or parasitic infection.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, eczema, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and are involved in allergic and inflammatory responses. They release histamine and other mediators. Christopher's basophils at 0.02 are within the optimal range.","low_causes":"Acute allergic reactions (transient), corticosteroids","high_causes":"Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The reticulocyte percentage indicates the proportion of circulating red blood cells that are immature. Christopher's reticulocyte percentage at 1% is within the optimal range, confirming a normal rate of red blood cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"49.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3222","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in circulation, rather than the percentage. Christopher's absolute reticulocytes at 49.5 are marginally below the lower limit of 50. At this trivial margin (a difference of 0.5), this is not clinically meaningful. His haemoglobin, red cell count, and haematocrit are all optimal, confirming that red blood cell production is keeping pace with demand.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is a simple calculated marker of the balance between innate immunity (neutrophils) and adaptive immunity (lymphocytes). It has emerged as a useful indicator of systemic inflammation and immune stress. A ratio between 1 and 2 is considered optimal. Christopher's NLR of 1.23 is within the optimal range, confirming a well-balanced immune response with no evidence of chronic immune stress.","low_causes":"Neutropenia, lymphocytosis","high_causes":"Infection, inflammation, physiological stress, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"48.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5479","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of transferrin (the body's main iron transport protein) that is loaded with iron. It reflects how much iron is actively being transported in the blood. Christopher's transferrin saturation at 48.23% is within the laboratory range of 18 to 55% but above the optimal upper boundary of 40%. This is consistent with his mildly elevated serum iron. At this level, it does not indicate iron overload, but it does mean Christopher should avoid iron supplementation and have this rechecked in three to four months.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, recent iron supplementation, recent red meat intake, sample timing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"32.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7361","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6111","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates significantly throughout the day and is affected by recent food intake, particularly red meat, and the timing of the blood draw. Christopher's serum iron at 32.7 umol/L is marginally above the upper limit of 31.3. In the context of a normal ferritin, normal transferrin, and normal total iron binding capacity, this mild elevation is most likely transient and related to dietary iron intake or sample timing rather than indicating a pathological iron overload. However, iron supplementation should be avoided, and this should be rechecked.","low_causes":"Iron deficiency, chronic disease, inflammation, malabsorption","high_causes":"Haemochromatosis, iron supplementation, recent red meat intake, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4556","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the main transport protein for iron in the blood. The liver produces more transferrin when iron stores are low (to capture more iron) and less when stores are adequate. Christopher's transferrin at 2.7 g/L is within the optimal range, confirming normal iron transport physiology. A normal transferrin in the presence of mildly elevated serum iron is reassuring, as it argues against a chronic iron overload state.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"60.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5036","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3745","upper_optimal_position":"0.6040","units":"umol/l","description":"TIBC (total iron binding capacity) measures the total capacity of transferrin in the blood to bind iron. It is essentially another way of measuring transferrin. A high TIBC indicates iron deficiency (the body is making more transferrin to scavenge iron), while a low TIBC can indicate iron overload or inflammation. Christopher's TIBC at 60.3 umol/L is within the optimal range, confirming balanced iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"121","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's main iron storage protein. Each ferritin molecule can hold thousands of iron atoms, and blood ferritin levels reflect total body iron stores. It is also an acute phase reactant, meaning it can rise with inflammation regardless of iron status. Christopher's ferritin at 121 ng/mL is well within the optimal range of 50 to 200 for a male, confirming adequate iron reserves to support his heavy training load and red blood cell production.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian/vegan diet","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"306","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4536","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5830","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal rhythm, peaking in the early morning to wake the body and declining throughout the day. Morning cortisol reflects adrenal function and the body's stress response capacity. Christopher's morning cortisol at 306 nmol/L is within the optimal range, confirming healthy adrenal function and an appropriate stress response. This rules out adrenal insufficiency as a contributor to his fatigue.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic stress with adrenal exhaustion","high_causes":"Acute or chronic stress, Cushing's syndrome, corticosteroid medications, overtraining","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"129","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4452","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen. In men, it is produced primarily through the conversion of testosterone by an enzyme called aromatase, particularly in fat tissue. Oestradiol plays important roles in bone density, brain function, and cardiovascular health in men, but excessively high levels can cause problems. Christopher's oestradiol at 129 pmol/L is within the normal range and near the upper end of the optimal band, consistent with his high testosterone level providing more substrate for aromatase conversion. This is a normal finding.","low_causes":"Low testosterone, low body fat, aromatase inhibitor use","high_causes":"Obesity (increased aromatase activity), liver disease, medications, high testosterone","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4369","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5707","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in the production of cortisol and testosterone and has some neuroprotective effects. Christopher's progesterone at 1.82 nmol/L is within the male reference range and within the optimal band.","low_causes":"Adrenal insufficiency, ageing","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4731","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3641","upper_optimal_position":"0.5705","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland in the brain and signals the testes to produce testosterone. In men, LH levels reflect the brain's assessment of whether testosterone production is adequate. Christopher's LH at 4.65 mIU/mL is within the optimal range, confirming that the hypothalamic-pituitary-gonadal axis is functioning normally.","low_causes":"Pituitary disease, anabolic steroid use, severe illness, obesity","high_causes":"Primary hypogonadism (testicular failure), ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4156","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5149","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and in men stimulates the Sertoli cells in the testes to support sperm production. Christopher's FSH at 3.96 mIU/mL is within the optimal range, indicating normal pituitary signalling and testicular function.","low_causes":"Pituitary disease, anabolic steroid use, severe illness","high_causes":"Primary testicular failure, ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"31.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7215","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, red blood cell production, libido, mood, and energy. It is produced primarily by the testes under the control of LH from the pituitary gland. Christopher's testosterone at 31.3 nmol/L is above the laboratory upper limit of 28.7 and above the optimal ceiling of 30. This is an excellent result for a 44-year-old male and likely reflects his very high training volume, healthy body composition, and good sleep and recovery. His LH is normal, ruling out exogenous testosterone use as a cause. A mildly supra-physiological testosterone level driven by natural production is not a concern.","low_causes":"Ageing, obesity, chronic illness, medications, pituitary disease, sleep deprivation, overtraining","high_causes":"Genetics, high training volume, exogenous testosterone, adrenal or testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"104","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4152","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5455","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production in women but also present in men. In men, elevated prolactin can suppress testosterone production and cause symptoms such as low libido and erectile dysfunction. Christopher's prolactin at 104 uIU/mL is within the optimal range, confirming normal pituitary function and no suppressive effect on his testosterone axis.","low_causes":"Dopamine agonist medications, pituitary damage","high_causes":"Pituitary adenoma (prolactinoma), medications, hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"61.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5291","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) is a calculation that estimates the proportion of testosterone that is free and biologically active, rather than bound to SHBG. It is calculated as (total testosterone / SHBG) x 100. A higher FAI indicates more bioavailable testosterone. Christopher's FAI at 61.49 is within the optimal range, confirming that despite his SHBG being in the upper half of its range, he still has excellent free testosterone availability.","low_causes":"Low testosterone, high SHBG, ageing, liver disease","high_causes":"High testosterone, low SHBG, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-Sulphate","group":"HORMONES","result":"1621.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4464","lower_normal":"162.14","upper_normal":"4939.9","lower_optimal":"300","upper_optimal":"3500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3624","upper_optimal_position":"0.5957","units":"ug/dL","description":"DHEA-Sulphate (DHEA-S) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is the most abundant steroid hormone in the body and declines with age. DHEA-S levels reflect adrenal function and the body's hormonal reserve. Christopher's DHEA-S at approximately 1,621 ug/dL (4.4 umol/L converted) is well within the optimal range, confirming healthy adrenal function and adequate hormonal precursor availability for his age.","low_causes":"Ageing, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"50.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5624","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3922","upper_optimal_position":"0.6109","units":"nmol/l","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds testosterone and oestradiol, making them biologically inactive. The balance between total testosterone and SHBG determines how much free, active testosterone is available. Christopher's SHBG at 50.9 nmol/L is within the optimal range of 25 to 55. While in the upper half of optimal, his very high total testosterone of 31.3 means that even with this SHBG level, his free testosterone availability (reflected by the FAI of 61.49) remains excellent.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Ageing, liver disease, hyperthyroidism, low body weight, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.545","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5450","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"nmol/l","description":"Free testosterone is the portion of total testosterone that is not bound to SHBG or albumin and is therefore biologically active, able to enter cells and exert its effects. It is the most physiologically relevant measure of testosterone status. Christopher's calculated free testosterone at 0.545 nmol/L is within the optimal range, confirming excellent bioavailable testosterone. This supports muscle recovery, energy production, bone density, and cognitive function.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"High total testosterone, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues throughout the body. FT4 reflects the thyroid's output capacity. Christopher's FT4 at 15.1 pmol/L is within the optimal range of 14 to 20, confirming adequate thyroid hormone production.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4145","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5545","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and acts as the brain's thermostat for the thyroid. When thyroid hormone levels drop, TSH rises to tell the thyroid to produce more; when levels are adequate, TSH falls. A TSH within the optimal range of 1.0 to 2.5 indicates that the brain is satisfied with thyroid hormone output. Christopher's TSH at 1.58 mIU/L is within this optimal zone, confirming balanced thyroid regulation.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 (triiodothyronine) is the most metabolically active thyroid hormone. It is produced primarily by the conversion of T4 in tissues such as the liver and kidneys. FT3 drives metabolic rate, energy production, and body temperature regulation. Christopher's FT3 at 5.1 pmol/L is within the optimal range of 4.5 to 6.5, confirming efficient conversion of T4 to T3 and adequate metabolic drive. This rules out thyroid-related causes of his fatigue.","low_causes":"Hypothyroidism, chronic illness (sick euthyroid syndrome), low calorie intake, selenium deficiency","high_causes":"Hyperthyroidism, early thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a process called autoimmune thyroiditis or Hashimoto's disease. Positive TPO antibodies indicate autoimmune thyroid disease, even if thyroid function is currently normal. Christopher's TPO antibodies are below 6.6 U/mL, well under the 13.8 threshold, ruling out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid gland to produce thyroid hormones. Elevated levels indicate autoimmune thyroid disease. Christopher's result is below 1.3 U/mL, well under the 4.4 threshold, confirming no autoimmune thyroid process. Over 80% of the population have undetectable anti-thyroglobulin antibodies, and Christopher falls into this normal majority.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4503","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3743","upper_optimal_position":"0.6082","units":"mmol/l","description":"Calcium is the most abundant mineral in the body, essential for bone strength, muscle contraction, nerve signalling, and blood clotting. Blood calcium is tightly regulated, and even small deviations can have significant effects. Christopher's total calcium at 2.28 mmol/L is within the optimal range, confirming adequate calcium availability for his bones and cellular functions.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result for the albumin level in the blood. This is necessary because about 40% of blood calcium is bound to albumin, so variations in albumin can make calcium appear falsely high or low. The corrected value gives a more accurate picture of physiologically active calcium. Christopher's corrected calcium at 2.21 mmol/L is just inside the lower boundary of the reference range at 2.2 but below the optimal floor of 2.25. In the context of his strong vitamin D at 134 nmol/L and suppressed PTH at 0.6 pmol/L, this pattern is most consistent with the body maintaining calcium at the lower end of normal because vitamin D is driving efficient gut absorption and the PTH has been physiologically suppressed in response.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6379","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, protein synthesis, and blood sugar regulation. It is also critical for bone health and sleep quality. Blood magnesium represents only about 1% of total body magnesium (the rest is in bones and cells), so blood levels can appear normal even when tissue stores are depleted. Christopher's magnesium at 1.06 mmol/L is within the laboratory range but marginally above the optimal ceiling of 1.05. Given his extraordinarily high training volume, which depletes magnesium through sweat and muscle contraction, maintaining magnesium through supplementation is a sensible strategy.","low_causes":"Inadequate dietary intake, intense exercise, alcohol, diuretics, proton pump inhibitors, chronic diarrhoea","high_causes":"Excessive supplementation, kidney disease, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"134","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4467","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"0.850","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone that plays a critical role in calcium absorption, bone health, immune function, mood regulation, and muscle performance. It is produced in the skin through sun exposure and obtained from dietary sources and supplements. The optimal range is 75 to 120 nmol/L. Christopher's vitamin D at 134 nmol/L is excellent, well above the sufficiency threshold and slightly above the optimal ceiling of 120 but well below the safety limit of 150. This suggests he is supplementing effectively or getting consistent sun exposure. This strong vitamin D level explains his suppressed PTH, as vitamin D drives calcium absorption so efficiently that PTH is not needed.","low_causes":"Insufficient sun exposure, dark skin, northern latitude, obesity (sequestration in fat), malabsorption","high_causes":"Supplementation, excessive sun exposure","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1273","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5400","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by four small glands behind the thyroid and is the body's main regulator of calcium levels. When blood calcium drops, PTH rises to increase calcium absorption from the gut (via vitamin D activation), reduce calcium loss in the urine, and release calcium from bones. When blood calcium is adequate, PTH falls. Christopher's PTH at 0.6 pmol/L is below the lower limit of 0.98. The most likely explanation is his strong vitamin D level of 134 nmol/L. High vitamin D drives calcium absorption so efficiently from the gut that the body does not need PTH to maintain calcium levels, so it is physiologically suppressed. His corrected calcium at 2.21 is within range, which is reassuring. However, the lab notes that PTH results should be viewed with caution if not centrifuged and separated on the day of sampling. This finding should be mentioned to his GP for documentation, and monitored on future testing.","low_causes":"High vitamin D, high calcium intake, hypoparathyroidism, magnesium deficiency, sample handling","high_causes":"Vitamin D deficiency, low calcium, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"404","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4451","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6157","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy production in the mitochondria. It is obtained primarily from animal sources including meat, fish, eggs, and dairy. Christopher's B12 at 404 pg/mL is within the laboratory range but below the optimal threshold of 500. Given his diet quality rating of 3 out of 10, this likely reflects inconsistent intake of B12-rich foods. Suboptimal B12 can contribute to fatigue, poor concentration, and reduced exercise recovery, all of which are relevant to Christopher's reported symptoms. Sublingual methylcobalamin supplementation at 1,000 mcg daily alongside dietary improvement should bring this into the optimal range.","low_causes":"Vegetarian/vegan diet, poor dietary quality, malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in DNA synthesis, red blood cell production, and the methylation cycle, which is critical for detoxification, neurotransmitter production, and gene expression. Good folate sources include green leafy vegetables, legumes, and fortified foods. Christopher's folate at 16 ng/mL is excellent, within the optimal range above 8, and suggests he is either eating good sources or supplementing. Adequate folate alongside his borderline B12 helps maintain red cell production and methylation function.","low_causes":"Poor diet, malabsorption, alcohol, medications (methotrexate, trimethoprim), pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"196","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5190","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles, including the heart, skeletal muscles, and brain. It is released into the blood when muscle cells are damaged, making it a useful marker of muscle stress and recovery. In people who train intensively, CK is often elevated after hard sessions. Christopher's CK at 196 U/L is within the optimal range, suggesting he is recovering adequately from his very high training volume. This is a reassuring finding for someone training ten or more sessions per week.","low_causes":"Sedentary lifestyle, low muscle mass, bed rest","high_causes":"Intense exercise, rhabdomyolysis, myocardial infarction, muscular dystrophy, medications (statins)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7564","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mmol/l","description":"Total antioxidant activity (TAA) measures the overall capacity of the blood to neutralise free radicals, which are reactive molecules that can damage cells and DNA. Christopher's TAA at 1.87 mmol/L is above the upper limit of 1.77. An elevated TAA is almost always driven by supplementation with antioxidants such as vitamin C, vitamin E, or polyphenol-rich supplements, or by a diet very high in antioxidant-rich foods like berries, dark chocolate, or green tea. This is not a concern and reflects a strong antioxidant defence system.","low_causes":"Poor diet, oxidative stress, chronic disease, smoking","h   .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';

function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
