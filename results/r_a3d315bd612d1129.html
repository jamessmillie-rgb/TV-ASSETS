<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Christopher Stott","dob":"27/05/1982","report_date":"2026-09-04","summary":"Christopher is a 44-year-old male presenting with a BMI of 28.7, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He trains ten or more times per week, split across five or more cardio sessions and five or more resistance sessions, with 10,000 to 15,000 daily steps. He self-administers testosterone enanthate at approximately 0.5 ml per week. He reports no alcohol, no smoking, and uses anabolic steroids or PEDs. He reports joint pain and stiffness and low energy and fatigue. His goals are to improve energy levels, improve digestion and gut health, and improve cardiovascular fitness. He has a cardiologist appointment arranged regarding his Lp(a) to pursue a coronary artery calcium score or CT coronary angiography, and he has noted that he believes his elevated LDL may represent a less risky particle profile.\n\nThe finding in this report that carries the most long-term weight is the combination of a significantly raised lipoprotein(a) alongside elevated LDL cholesterol, elevated ApoB, and a cardiovascular risk score of 50 out of 100. Lipoprotein(a), often written Lp(a), is a modified LDL particle that is almost entirely genetically determined. It deposits cholesterol into the artery wall more aggressively than standard LDL, encourages blood clot formation, and drives low-grade inflammation at the vessel lining. Christopher's Lp(a) is 116.38 nmol/L, placing it in the moderate risk category (90 to 200 nmol/L), well above the desirable threshold of 32. Because Lp(a) is inherited and cannot be meaningfully changed by diet, exercise or any currently available supplement, this result should be recorded permanently in his medical notes, and first-degree relatives, parents, siblings and children, should be offered testing. The fact that Christopher has already arranged a cardiologist appointment for imaging is exactly the right next step, and this report supports that decision strongly.\n\nChristopher's question about whether his elevated LDL might represent a less risky particle profile deserves a detailed answer. His LDL is 3.65 mmol/L against a target of below 3.0, and his ApoB, which is a direct count of the number of atherogenic particles in the blood, is 0.96 g/L against a target of below 0.9. ApoB is widely regarded as the single best blood marker of cardiovascular risk because each ApoB-carrying particle can enter the artery wall and deposit cholesterol there. At 0.96, this is not dramatically high, but it is above the threshold, and with an Lp(a) of 116, the total atherogenic burden matters more than it would in someone with a normal Lp(a). When we subtract the cholesterol carried by Lp(a) from his total LDL, his Lp(a)-corrected LDL is 3.27 mmol/L. This tells us that most of his LDL elevation is from conventional, modifiable LDL particles rather than Lp(a) particles, which is actually useful information because it means diet, fibre intake, and if needed medication, can bring the modifiable portion down. His remnant cholesterol, which is the cholesterol carried by partially broken-down triglyceride-rich particles, will be discussed in the calculated markers but at 0.59 mmol/L it is mildly above the ideal of 0.5, consistent with the overall picture.\n\nThe genuinely encouraging counterbalance is his HDL cholesterol at 2.3 mmol/L, which is exceptional, well above the 1.55 considered protective and far above the 1.4 optimal threshold for men. His ApoA1, the protein on HDL particles that drives reverse cholesterol transport (the process of pulling cholesterol back out of artery walls), is 1.69 g/L, comfortably above 1.20. His ApoB to ApoA1 ratio is 0.57, which is in the lower risk category (below 0.7), and his triglycerides at 0.91 mmol/L are excellent, below the ideal threshold of 1.0. His TG/HDL ratio is 0.40, which is outstanding and suggests excellent insulin sensitivity from the lipid perspective. The atherogenic index of plasma at minus 0.40 is also well within the ideal range. So the lipid picture is genuinely split: the protective side is as good as it gets, but the atherogenic side, driven substantially by genetics through Lp(a), needs attention. The cardiovascular risk score of 50 out of 100, which is a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, reflects this tension. The score has no age term; it measures the risk being accumulated rather than the ten-year probability of an event. At 44 with excellent fitness, his ten-year event risk is low, but the score of 50 tells him the window for acting is now, before cumulative exposure narrows it. The cardiologist appointment is the right forum for discussing whether a statin or PCSK9 inhibitor is warranted given the Lp(a) burden.\n\nTurning to the positives, and there are many. His inflammation is essentially undetectable. High-sensitivity CRP is below 0.2 mg/L, the lowest the assay can report, which at a BMI of nearly 29 with extremely high training volume is a strong signal that there is no systemic inflammatory process and that the training load is being well recovered from. His ESR is 1, reinforcing that picture. His thyroid is working well. TSH at 1.58 sits in the ideal range of 1.0 to 2.5, free T4 at 15.1 is comfortably within range, free T3 at 5.1 is within the ideal band, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His FT3 to FT4 ratio of 0.34 confirms good conversion of the storage hormone to the active hormone. His kidney function is in excellent shape, with cystatin C at 0.88 giving an eGFR of 98, right where it should be at 44. The combined creatinine and cystatin C eGFR also comes to 98. Uric acid at 229 is within range and well controlled. His blood sugar control is textbook: fasting glucose 5.0 mmol/L, HbA1c 36 mmol/mol (5.4%), fasting insulin 4.35 mIU/L, and a HOMA-IR of 0.97, all sitting within the ideal range. HOMA-IR, which estimates insulin resistance from fasting glucose and insulin, below 1.0 indicates excellent insulin sensitivity, and at a BMI of 28.7 with this training volume that is entirely expected but still worth acknowledging. His prostate is clear. PSA at 0.73 is very low, free PSA ratio at 0.26 (26%) is reassuring, and there is nothing here to act on. His tumour markers CA19-9 and CEA are both well within range. His immune system is balanced, with IgG, IgM and IgA all within their reference ranges, IgE at 90.8 sitting just below the 100 threshold, and rheumatoid factor at 7 well below the 14 cutoff, which is relevant given his joint symptoms. Coeliac screening is negative. His urinalysis is completely clean: no protein, no glucose, no blood, no white cells, no nitrites, no bacteria, no casts, and the culture shows no growth. Cortisol at 306 nmol/L is mid-range for a morning sample. Prolactin at 104 is normal. DHEA-S at 4.4 umol/L (1,621 ug/dL) is healthy. His creatine kinase at 196 is within range despite the heavy training schedule, suggesting adequate recovery between sessions. His vitamin D at 134 nmol/L is excellent, comfortably within the optimal range of 75 to 120, perhaps slightly above it, but this is not a concern and simply reflects good supplementation or sun exposure. Folate at 16 is strong.\n\nThe testosterone picture needs careful framing because Christopher is injecting exogenous testosterone. His total testosterone at 31.3 nmol/L is above the upper reference limit of 28.7, and his calculated free testosterone at 0.545 nmol/L is above the upper reference limit of 0.25. His SHBG at 50.9 is within the ideal range, so the elevation is not being masked by binding protein. His bioavailable testosterone, the fraction available to tissues, is 13.34 nmol/L against an upper reference of 9.0. His oestradiol at 129 pmol/L is within range but sitting at the higher end (limit 146.1), which is expected because a proportion of exogenous testosterone is converted to oestradiol by the aromatase enzyme, particularly in the presence of body fat. His LH at 4.65 and FSH at 3.96 are both within range, which is somewhat unusual on exogenous testosterone because the pituitary normally suppresses LH and FSH when it detects high circulating testosterone. This could reflect the relatively modest dose (0.5 ml per week, likely 100 to 125 mg depending on concentration), partial suppression that has not driven them below range, or timing of the blood draw relative to injection. The GP or prescribing clinician should be aware of this picture. The supraphysiological testosterone and free testosterone are consistent with the injection rather than with endogenous overproduction, but the unsuppressed gonadotropins are a point worth discussing.\n\nHis liver enzymes tell a mixed but not alarming story. ALT at 60 is above the upper limit of 56, and above the stricter optimal threshold of 30. AST at 35 is within range. GGT at 63 is within the laboratory range of 4 to 73 but above the optimal threshold of 25. Elevated ALT with a relatively normal AST and an AST to ALT ratio (De Ritis ratio) of 0.58, which is below the lower reference of 0.6, is a pattern that points toward a metabolic or hepatocellular cause rather than alcohol or advanced liver disease. The most likely contributors here are the exogenous testosterone, which is processed through the liver, the high training volume generating muscle turnover that can spill into ALT, and the BMI of 28.7 placing mild metabolic load on the liver. The FIB-4 score at 1.16 is reassuringly below 1.45, meaning there is no evidence of liver fibrosis. The APRI score at 0.512 is just above the ideal of 0.5, and the NAFLD fibrosis score at minus 1.96 rules out significant fibrosis. Albumin, bilirubin, total protein and alkaline phosphatase are all normal. This is a liver under some strain but not in danger. Reducing the strain means addressing the modifiable causes, and the testosterone dose discussion with his clinician is part of that.\n\nHis iron studies show serum iron at 32.7 umol/L, mildly above the upper limit of 31.3, with a transferrin saturation of 48.2%, within range but at the higher end (range 18 to 55%). His ferritin at 121 is healthy and within the optimal male range of 50 to 200. His transferrin at 2.7 and total iron binding capacity at 60.3 are both normal. This is not an iron overload pattern. Ferritin is not grossly elevated, transferrin is not suppressed, and the mildly high serum iron likely reflects timing of the blood draw relative to an iron-rich meal or supplement. That said, he should not be supplementing iron, and if his transferrin saturation creeps above 55% on a future test it would be worth running an HFE gene test to exclude hereditary haemochromatosis.\n\nHis C-peptide at 0.686 ug/L (227 pmol/L) is below the lower reference of 1.1 ug/L (364 pmol/L). C-peptide is released by the pancreas in a one-to-one ratio with insulin, so it is a direct measure of how much insulin the pancreas is producing. A low C-peptide alongside a low-normal fasting insulin of 4.35, a perfect fasting glucose of 5.0, and an HbA1c of 36 simply means the pancreas does not need to produce much insulin because the tissues are highly sensitive to it. In a lean, extremely active man eating a reasonable diet, this is a reflection of metabolic efficiency, not pancreatic insufficiency. His HOMA-B, which estimates beta cell function, will calculate from these inputs and should be interpreted in the same light.\n\nHis parathyroid hormone (PTH) at 0.6 pmol/L is below the lower reference of 0.98. PTH is released by the parathyroid glands to regulate calcium, and it is suppressed when calcium or vitamin D levels are high. His vitamin D at 134 is above the optimal ceiling of 120, and this is the most likely explanation: the high vitamin D is increasing intestinal calcium absorption, keeping corrected calcium at 2.21 (just inside the lower limit of 2.2), and the parathyroid glands have responded by reducing PTH output because they do not need to mobilise calcium from bone. This is a physiological suppression, not a disease state, but if his vitamin D intake can be reduced slightly to bring the level into the 75 to 100 range, PTH should normalise on the next test.\n\nHis vitamin B12 at 404 pg/mL is within the laboratory range but below the optimal threshold of 500. Given his training volume and metabolic demand, supplementing with sublingual methylcobalamin at 1,000 mcg daily would be a sensible step to move this toward the 500 to 900 optimal band.\n\nHis full blood count is largely normal with a few marginal findings. Haemoglobin at 161, red cell count at 4.95, and haematocrit at 0.459 are all within range, and the haematocrit is worth watching on exogenous testosterone because testosterone stimulates red cell production and a haematocrit above 0.50 requires dose reduction. His is comfortably below that at present. His white cell count at 4.02 and neutrophils at 2.01 are both sitting exactly on their lower limits. In someone training at this intensity, this pattern is common and reflects the redistribution of white cells into tissues during recovery rather than true immunodeficiency. His reticulocyte percentage is 1.0%, normal, but the absolute reticulocyte count at 49.5 is just below the lower reference of 50, which is a marginal finding. His RDW at 11.3% is fractionally below the lower reference of 11.5%, which indicates very uniform red cell size and is not clinically meaningful. His MCH at 32.5 is marginally above the upper limit of 32, and his MCHC at 350 is marginally above the upper limit of 345. At these margins, both are most likely explained by mild sample dehydration or temperature effects during transport, as the lab note acknowledges, and neither is a concern. His MPV at 11.2 is above the upper limit of 10.1. Mean platelet volume reflects platelet size, and larger platelets are younger and more active. With a platelet count of 171, which is within range but toward the lower end, the bone marrow is producing fewer but larger, more functional platelets, which is a normal compensatory pattern and not a concern at this level. His total antioxidant activity at 1.87 is above the upper reference of 1.77, which typically reflects supplementation with antioxidant-containing compounds and is not harmful.\n\nRegarding his symptoms, the joint pain and stiffness and low energy deserve a direct comment. His bloods have excluded several important causes: rheumatoid factor is negative, CRP is undetectable, ESR is 1, uric acid is normal, thyroid function is optimal, testosterone is more than adequate, iron stores are healthy, B12 is reasonable, and there is no anaemia or inflammation. The joint symptoms in a 44-year-old man training ten or more times per week are most likely mechanical: accumulated wear, tendon load, and insufficient recovery time between sessions. The very high training frequency is the most obvious lever. Five-plus resistance sessions and five-plus cardio sessions per week is an extraordinary volume, and even with excellent recovery markers in the blood, the connective tissues, cartilage, tendons and joint capsules, do not recover as quickly as muscle. The fatigue may share the same root. Overtraining does not always show up as elevated CRP or suppressed testosterone; it can present as persistent low-grade tiredness, poor sleep quality, and stiff joints despite objectively normal blood markers. A structured deload week every four to six weeks, and an honest assessment of whether the current session count is sustainable long term, would be the first steps. His PhenoAge is 33.5 against a calendar age of 44, which is ten and a half years younger and reflects the excellent metabolic, inflammatory and haematological profile his lifestyle has built.\n\nIn summary, the dominant finding is the genetically elevated Lp(a) at 116 combined with modestly elevated ApoB and LDL, producing a cardiovascular risk score of 50 that warrants the cardiologist review he has already arranged. The liver enzymes are mildly elevated, likely from the exogenous testosterone and high training volume. The testosterone and free testosterone are above range as expected from the injection, and the oestradiol is tracking at the upper end as a consequence. The PTH is low because of high vitamin D, and the corrected calcium is sitting at the floor of its range. Everything else, metabolic health, kidney function, thyroid, prostate, immune system, coeliac screen and urinalysis, is in excellent shape.","links":"The central thread in Christopher's results is the collision between an exceptionally healthy metabolic and inflammatory profile and a genetic cardiovascular risk factor that lifestyle alone cannot fix. His fasting glucose, HbA1c, insulin, HOMA-IR, triglycerides, HDL, CRP and body composition are all in the ideal range or close to it. These are the modifiable inputs to cardiovascular risk, and he has optimised nearly every one of them through diet, training and daily movement. Despite this, his Lp(a) at 116 nmol/L ensures that a steady stream of particularly sticky, pro-inflammatory LDL particles is being deposited into his artery walls regardless of what he eats or how much he trains. His ApoB at 0.96 sits just above the 0.9 threshold, and the Lp(a)-corrected LDL of 3.27 shows that even after removing the Lp(a) contribution, conventional LDL remains above the 3.0 target. This is why his cardiovascular risk score reaches 50 despite near-perfect metabolic markers everywhere else: the Lp(a) alone carries enough weight to push the score into the flagged range.\n\nThe second thread connects the exogenous testosterone to several findings. His total testosterone at 31.3 and free testosterone at 0.545 are above range, which is expected on an injected dose. The oestradiol at 129, while within range, is tracking toward the upper limit because aromatase in adipose tissue converts a proportion of circulating testosterone to oestradiol. The ALT at 60 is the most likely hepatic consequence: all anabolic androgens are processed through the liver, and even bioidentical testosterone enanthate at a moderate dose can push transaminases up. The GGT at 63, while within the laboratory range, adds mild supporting evidence of hepatic workload. The reassuring context is that the FIB-4, APRI, NAFLD fibrosis score, albumin and bilirubin all confirm there is no structural liver damage, so the enzyme elevation reflects current metabolic strain rather than accumulated injury.\n\nThe third thread is the PTH and calcium axis. The suppressed PTH at 0.6 is almost certainly driven by the high vitamin D at 134 nmol/L, which sits above the optimal ceiling of 120. High vitamin D increases calcium absorption from the gut, reducing the need for PTH to mobilise calcium from bone. The corrected calcium at 2.21 is just inside the lower limit of 2.2, which is consistent with this explanation: calcium is being maintained at the floor of the range by dietary absorption rather than by PTH-driven bone resorption. Reducing vitamin D supplementation slightly should allow PTH to recover on the next test.\n\nThe fourth thread addresses the symptoms that the bloods do not explain. Joint pain and fatigue in the context of ten-plus training sessions per week, undetectable inflammation, negative rheumatoid factor, normal uric acid, optimal thyroid function and supraphysiological testosterone point toward mechanical overload and inadequate connective tissue recovery rather than a systemic process. The blood has ruled out the inflammatory, autoimmune, metabolic and endocrine causes of these symptoms, which is genuinely useful because it narrows the explanation to training load, recovery structure and sleep quality, all of which are modifiable without medical intervention.\n\nFinally, the iron picture is worth a brief note. The mildly elevated serum iron at 32.7 with a saturation of 48% is not accompanied by elevated ferritin or suppressed transferrin, so it does not constitute an iron overload pattern. However, in a man on exogenous testosterone, which stimulates erythropoiesis and therefore iron utilisation, the saturation should be monitored. If it rises above 55% on a future test, an HFE gene test would be prudent to exclude hereditary haemochromatosis.","lifestyle":"Introduce a structured deload week every four to six weeks where training volume drops to 60% of normal. Anchor: set it in the calendar now for every fifth week. Why: your joint pain and fatigue with clean inflammatory markers point to connective tissue overload, and the blood cannot recover cartilage and tendons the way it recovers muscle.\nAdd 10 to 15 g of soluble fibre daily from oats, flaxseed, beans or psyllium husk, building up gradually over two weeks to avoid bloating. Anchor: add a tablespoon of ground flaxseed to your first meal. Why: soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make new ones, and it is the single most effective dietary tool for lowering your ApoB of 0.96 and LDL of 3.65.\nEat two to three portions of oily fish per week: salmon, mackerel, sardines or anchovies. Anchor: replace one existing protein source at two meals per week. Why: omega-3 fatty acids lower triglycerides (yours are already excellent at 0.91, so this is about maintaining that) and provide anti-inflammatory support for joint recovery.\nReduce saturated fat intake by swapping butter, cheese and fatty cuts for olive oil, avocado and leaner protein sources where practical. Anchor: when cooking, default to olive oil. Why: saturated fat is the primary dietary driver of LDL particle number, and with your Lp(a) at 116 adding genetic risk, minimising the modifiable LDL component is the lever you can control.\nAim for a fixed wake time seven days a week within a 30-minute window, and get outside within an hour of waking for ten minutes. Anchor: alarm set to the same time on weekends. Why: circadian consistency improves sleep quality, recovery between sessions, and is the most underrated tool for fatigue that blood tests cannot diagnose.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, and afternoon caffeine fragments deep sleep, which is when growth hormone peaks and connective tissue repairs, directly relevant to your joint symptoms.\nCalorie target: approximately 2,700 to 2,900 kcal per day to maintain your current weight at this training volume (BMR estimated at 1,820 kcal multiplied by an activity factor of 1.75 for very active, giving a TDEE of roughly 3,185, with a modest deficit if fat loss is a secondary goal). Protein target: 135 to 150 g per day (1.6 to 1.8 g per kg of bodyweight), prioritising protein at every meal to support the extraordinary training volume and recovery demand.\nHydrate with at least 2.5 to 3 litres of water daily, more on heavy training days. Anchor: carry a bottle and finish one litre before lunch. Why: your urea at 8.6, mildly above range, may partly reflect mild dehydration at the time of the blood draw, and consistent hydration supports kidney function and joint lubrication.","flags":"Lp(a) 116.38 nmol/L, significantly above the 32 nmol/L threshold, placing him in the moderate genetic cardiovascular risk category. This is inherited, permanent, and cannot be changed by lifestyle. First-degree relatives should be tested. The cardiologist appointment for CAC or CCTA imaging is strongly supported.\nApoB 0.96 g/L, above the 0.9 target, alongside LDL 3.65 mmol/L above the 3.0 target, total cholesterol 6.3 mmol/L, and Lp(a)-corrected LDL 3.27 mmol/L. The modifiable LDL fraction remains above target, and with Lp(a) adding genetic burden, the cardiologist should discuss whether pharmacological intervention (statin, ezetimibe or PCSK9 inhibitor) is appropriate.\nCardiovascular Risk Score 50 out of 100, above the 40 threshold, driven primarily by Lp(a) and ApoB. This measures cumulative risk being built, not ten-year event probability.\nTestosterone 31.3 nmol/L above the upper limit of 28.7, free testosterone 0.545 nmol/L above the upper limit of 0.25, and bioavailable testosterone 13.34 nmol/L above the upper limit of 9.0, all consistent with exogenous testosterone enanthate administration. Oestradiol 129 pmol/L within range but at the upper end (limit 146.1). LH 4.65 and FSH 3.96 are not suppressed, which is unusual on exogenous testosterone and should be discussed with the prescribing clinician.\nALT 60 IU/L above the upper limit of 56. GGT 63 IU/L within the laboratory range (4 to 73) but above the optimal of 25. De Ritis ratio 0.58, below the lower reference of 0.6, suggesting hepatocellular rather than cholestatic or alcoholic cause. FIB-4 1.16 and APRI 0.512 both rule out fibrosis. Most likely contributors are exogenous testosterone and high training volume.\nPTH 0.6 pmol/L below the lower reference of 0.98, likely suppressed by high vitamin D at 134 nmol/L. Corrected calcium 2.21 at the floor of the range (2.2 to 2.6). Physiological suppression rather than parathyroid disease, but vitamin D dose should be reduced and PTH rechecked.\nC-Peptide 0.686 ug/L (227 pmol/L) below the lower reference of 1.1 ug/L (364 pmol/L). In the context of normal glucose, normal HbA1c, low-normal insulin and HOMA-IR 0.97, this reflects low insulin demand from high insulin sensitivity rather than pancreatic insufficiency.\nSerum iron 32.7 umol/L mildly above the upper limit of 31.3. Transferrin saturation 48.2% within range but upper half. Ferritin 121, transferrin 2.7 and TIBC 60.3 are all normal. Not an overload pattern, but saturation should be monitored on exogenous testosterone. If saturation exceeds 55%, an HFE gene test should be considered.\nUrea 8.6 mmol/L mildly above the upper limit of 8.2. Most likely reflects high protein intake and mild dehydration at the time of the draw. Creatinine 91 and eGFR 98 confirm normal kidney function.\nMCH 32.5 pg marginally above the 32 limit, MCHC 350 g/L marginally above the 345 limit, RDW 11.3% marginally below the 11.5 lower limit, and MPV 11.2 fL above the 10.1 limit. Absolute reticulocyte count 49.5 marginally below 50. None of these are clinically significant at these margins.\nReassuring negatives: hs-CRP below 0.2, ESR 1, thyroid function optimal with negative antibodies, PSA 0.73, rheumatoid factor 7, coeliac screen negative, urinalysis clean, kidney function excellent (eGFR 98), HbA1c 36, HOMA-IR 0.97, immunoglobulins balanced, cortisol mid-range, prolactin normal, FIB-4 1.16 ruling out fibrosis, haematocrit 0.459 safely below the 0.50 threshold on testosterone therapy.","recommendations":"Attend the cardiologist appointment already arranged. Bring these numbers: Lp(a) 116.38 nmol/L, ApoB 0.96 g/L, LDL 3.65 mmol/L, Lp(a)-corrected LDL 3.27 mmol/L, HDL 2.3 mmol/L, triglycerides 0.91 mmol/L, hs-CRP below 0.2, cardiovascular risk score 50 out of 100. Discuss whether a CAC score, CCTA or both are appropriate, and whether pharmacological intervention (statin, ezetimibe or PCSK9 inhibitor) is warranted given the Lp(a) burden that cannot be modified by lifestyle.\nDiscuss the testosterone and hormone picture with the prescribing clinician. Total testosterone 31.3 (above 28.7 limit), free testosterone 0.545 (above 0.25 limit), oestradiol 129 approaching the 146.1 limit, and LH and FSH not suppressed. The dose may need review, and the unsuppressed gonadotropins are worth exploring.\nAsk the GP to note the Lp(a) result of 116.38 nmol/L permanently in the medical record and to consider offering testing to first-degree relatives.\nMention the ALT of 60 and GGT of 63 to the GP. The fibrosis scores are reassuring, but the liver enzymes should be rechecked after any dose adjustment to testosterone to confirm they respond.\nReduce vitamin D supplementation to bring the level from 134 into the 75 to 100 range. This should allow PTH to recover from 0.6 toward the normal range and keep corrected calcium above the 2.2 floor.\nRetest in four to six months with a focused panel: lipid profile including ApoB and Lp(a), ALT, GGT, AST, full blood count with haematocrit, testosterone, oestradiol, LH, FSH, PTH, corrected calcium, vitamin D, serum iron and transferrin saturation. This will show whether the dietary changes have moved ApoB, whether the liver enzymes have settled, and whether PTH has recovered.","supplementation":"Omega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with a fat-containing meal. Why: supports the dietary strategy to lower ApoB and LDL alongside the soluble fibre increase, and provides anti-inflammatory support for joint recovery.\nVitamin D3 (cholecalciferol): reduce current dose. His level at 134 nmol/L is above the optimal ceiling of 120 and is suppressing PTH. Reduce to 1,000 IU daily or take 2,000 IU every other day, and recheck in four to six months. Continue taking with a fat-containing meal.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. Why: K2 directs calcium into bone and away from arterial walls, which is particularly relevant given his suppressed PTH and the cardiovascular risk profile.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: his B12 at 404 pg/mL is within the laboratory range but below the optimal threshold of 500, and his training volume increases metabolic demand for B12.\nMagnesium glycinate: 300 to 400 mg before bed. Why: his magnesium at 1.06 is within range but at the upper end, and supplementation at this dose supports sleep quality, muscle recovery, and joint comfort given his training volume and symptom profile.\nDO NOT supplement iron. His serum iron is already mildly above range at 32.7, ferritin is healthy at 121, and transferrin saturation at 48% is in the upper half of the range. Additional iron could push saturation above the safe threshold.\nThe most important changes from this report are not supplements. They are the cardiologist review for the Lp(a) and ApoB findings, the soluble fibre and saturated fat dietary changes to lower the modifiable LDL fraction, the structured deload weeks to address joint pain and fatigue, and the testosterone dose discussion with his clinician.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 60 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 60.5. Weakest systems: lipids & cardiovascular 23%, vitamins & nutrients 51%, hormones 58%. Biggest drags: LDL Cholesterol, Lipoprotein(a), Apolipoprotein B, Urea.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3061","lower_normal":"","upper_normal":"49","lower_optimal":"","upper_optimal":"44","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4490","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term and measures the cumulative cardiovascular risk being built rather than the ten-year probability of an event. Christopher's score of 50 is above the 40 threshold, driven primarily by his Lp(a) of 116 and ApoB of 0.96. His ten-year event risk at 44 with this fitness level is low, but the gap between that low short-term risk and the high cumulative score is the window for intervention. The cardiologist appointment is the right setting for that discussion.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7381","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found mainly in liver cells. When the liver is under strain, ALT leaks into the bloodstream, making it a sensitive early marker of hepatocellular stress. Christopher's ALT at 60 is above the upper laboratory limit of function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
      if (lo == null && hi == null) return;
      n++; if (dist(b, useBase ? pv : cv) === 0) ok++;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 116); svg += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by the share of its markers in the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
