<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Guy Spencer Hughes","dob":"16/02/1952","report_date":"2026-10-01","summary":"Guy is a 74-year-old male presenting with a BMI of 26.7, following a standard mixed diet rated 7 out of 10 for quality with a volume of 8 out of 10. He trains once per week with one cardio session and no resistance training, averaging 5,000 to 7,500 daily steps. He takes a proton pump inhibitor (omeprazole or similar) and drinks more than seven alcoholic drinks per week. He reports bloating and digestive discomfort, low energy and fatigue, and difficulty losing weight. His goals are to lose body fat, improve digestion and gut health, and improve long-term health and longevity. He notes that his LDL has sat between 4.5 and 5.5 for the past twenty years with no cardiovascular disease in the family.\n\nThere are several findings in this report that warrant a conversation with his GP, and we will work through them in order of importance.\n\nThe most significant cluster of results sits across the lipid panel, the inflammatory markers and the blood sugar markers, because together they tell a single, connected story. His LDL cholesterol is 5.07, well above the 3.0 upper limit, and his ApoB, which is the protein that carries LDL particles into the artery wall and is the single best blood marker of cardiovascular risk, is 1.68, almost twice the 0.9 target. His HDL cholesterol, the protective fraction that removes cholesterol from the arteries, is 1.1, which sits in the undesirable zone below 1.55. His triglycerides are 1.71, marginally above the 1.70 fasting threshold. His ApoB to ApoA1 ratio, which summarises the balance between harmful and protective lipoproteins, is 1.14 against a target below 0.7, placing him in the higher-risk category. His non-HDL cholesterol, which captures all the cholesterol carried in particles that can enter the artery wall, is 5.8 against a target below 4.0. His Lp(a)-corrected LDL, which removes the small inherited contribution from lipoprotein(a), is 4.99, confirming that almost all of his LDL is modifiable through diet, medication and lifestyle rather than locked in by genetics. His Lp(a) itself is below 25, which is genuinely good news: it means the genetic dice have not loaded his risk, and the elevated LDL and ApoB are driven entirely by factors he and his GP can change. His TrueVitals Cardiovascular Risk Score, an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 100 out of 100. That number reflects the amount of risk being accumulated right now across those markers; it is not a prediction of an imminent event, but it means that every modifiable input to cardiovascular risk in his blood is working against him simultaneously, and that is the finding that should frame his GP conversation.\n\nGuy has noted that his LDL has been between 4.5 and 5.5 for twenty years with no family history of cardiovascular disease, and he may reasonably feel that the number has not caused a problem. The difficulty is that atherosclerosis, the build-up of cholesterol-rich plaque inside artery walls, is cumulative: it is driven by the total exposure of the arteries to ApoB-carrying particles over a lifetime, often described as the ApoB-years model. Twenty years of LDL above 4.5 represents a very large cumulative exposure, and the absence of a clinical event does not mean the absence of plaque. It means the plaque has not yet become unstable enough to cause a blockage. At 74, with an ApoB of 1.68 and an hsCRP of 7.1 (which we will come to), the combination of high particle count and active inflammation is the pattern most associated with plaque instability. This is the strongest reason to revisit lipid management with his GP, even though statin therapy may have been discussed and declined previously.\n\nHis high-sensitivity C-reactive protein, hsCRP, is 7.1 against a target below 5.0 and an optimal below 1.0. CRP is made by the liver in response to inflammation anywhere in the body. At 7.1, this is a significant inflammatory signal. It could reflect low-grade systemic inflammation driven by visceral fat, by the metabolic picture we are about to describe, by alcohol, or by an acute process such as a recent infection, dental problem or joint flare. If Guy was well and without any acute illness at the time of the blood draw, this level suggests chronic inflammation, and that matters because inflammation is the mechanism that turns stable arterial plaque into unstable plaque. Combined with the ApoB of 1.68, this is the combination his GP should be aware of. His ESR, the erythrocyte sedimentation rate, which is another marker of inflammation that measures how quickly red blood cells settle in a tube, is 35 against an upper limit of 12. At 74, ESR naturally drifts upward, and a rough age-adjusted ceiling for men is half the age, which would be 37, so 35 sits just inside that adjusted limit. However, the fact that both CRP and ESR are elevated together adds weight to the inflammatory signal rather than dismissing it as age alone.\n\nHis blood sugar markers show early insulin resistance. His HbA1c, which reflects average blood sugar over the preceding two to three months by measuring the percentage of haemoglobin molecules that have glucose attached, is 44 mmol/mol, which places him in the pre-diabetic range of 42 to 47. His fasting glucose at 5.2 is within range but not optimal, sitting above the 5.0 threshold where risk begins to climb. His fasting insulin is 9.34, within the laboratory range but above the optimal ceiling of 8.0 for metabolic health. His HOMA-IR, a calculation that combines glucose and insulin to estimate how resistant the cells are to insulin's signal, is 2.16 against an upper limit of 1.5, confirming early insulin resistance. His C-peptide, which is released in equal amounts to insulin and provides a more stable measure of pancreatic output, is 3.22 micrograms per litre, equivalent to roughly 1,066 pmol/L, sitting in the upper half of its range and consistent with a pancreas that is working harder than it should need to. His estimated average glucose, derived from the HbA1c, is 7.2 mmol/L, above the 7.0 threshold. This metabolic picture, where the pancreas is producing extra insulin to keep glucose only just within range, is the early stage of type 2 diabetes, and at this stage it is reversible. Losing body fat, particularly visceral fat around the organs, is the single most effective intervention.\n\nHis GGT, gamma-glutamyl transferase, is 212 against an upper limit of 73. GGT is an enzyme produced in the bile ducts and liver cells, and it is the liver marker most sensitive to alcohol intake, to bile duct congestion, and to metabolic stress from insulin resistance and fatty liver. At nearly three times the upper limit, this is a significant elevation. His other liver enzymes are reassuring: ALT at 25 is within range, AST at 19 is within range, bilirubin at 9 is healthy, albumin at 38 is within range though at the lower end, and his FIB-4 score, which estimates liver scarring, is 0.84, well within the safe zone. The APRI score is 0.141 and the NAFLD Fibrosis Score is minus 1.419, both indicating no significant fibrosis. The isolated GGT elevation with clean ALT and AST is a pattern most commonly seen with regular alcohol intake above seven drinks per week and with metabolic syndrome. Given that Guy reports more than seven drinks per week and has early insulin resistance with a BMI of 26.7, both are likely contributing. An ultrasound of the liver would be useful to check for fatty infiltration, and reducing alcohol to below seven drinks per week, ideally below four, would be the most direct way to bring this marker down.\n\nHis amylase is 28 against a lower limit of 30, marginally below range. Amylase is an enzyme produced by the pancreas and the salivary glands to digest starch. Mildly low amylase can be associated with long-term PPI use, which suppresses acid and can alter pancreatic enzyme output over time. His lipase at 46 is healthy, which is reassuring because lipase is the more specific pancreatic marker. The low amylase is worth noting to his GP in the context of PPI use and his bloating symptoms, because reduced digestive enzyme output may be contributing to the digestive discomfort he reports.\n\nHis lymphocyte count is 4.02 against an upper limit of 3.0. Lymphocytes are the white blood cells responsible for immune memory and targeted immune responses. A persistent lymphocyte count above 3.0 at 74 should be noted by his GP. The most common cause of a sustained mild lymphocytosis in this age group is a condition called monoclonal B-cell lymphocytosis, which is usually benign and monitored rather than treated, but it should be confirmed with a blood film and, if his GP considers it appropriate, flow cytometry. It may also be reactive, driven by the chronic inflammation suggested by the CRP and ESR, by a recent viral infection, or by smoking status, though Guy has not reported smoking. A repeat full blood count in three months would help clarify whether this is persistent or transient.\n\nHis eosinophils are 0.51 against an upper limit of 0.50, which is only marginally above range. Eosinophils are the white blood cells involved in allergic responses and parasitic defence. At this margin, the most likely explanations are a mild allergic tendency, hay fever, eczema, or a food sensitivity. His IgE, the antibody most associated with allergy, is 6.1, which is very low and argues against a significant allergic driver. This is not a concern on its own but is worth mentioning alongside the digestive symptoms in case a food intolerance is contributing to both.\n\nHis LH, luteinising hormone, is 14.08 against an upper limit of 9.3, and his FSH, follicle-stimulating hormone, is 33.96 against an upper limit of 18.1. Both are elevated. These are the pituitary hormones that signal the testes to produce testosterone and sperm. When they are elevated alongside a testosterone that is low in range, it means the pituitary is sending a stronger signal because the testes are not responding as well as they used to. His testosterone is 9.7, within the laboratory range of 8.4 to 28.7 but below the recommended level of 12.0 and well below the optimal range of 18 to 30. His free androgen index, which estimates the proportion of testosterone that is biologically active, is 25 against a lower limit of 30. His bioavailable testosterone is 3.76, just below the optimal threshold of 4.0. This pattern, elevated gonadotropins with low-normal testosterone, is called primary hypogonadism and is a normal consequence of aging in men, sometimes called the andropause. It may be contributing to his fatigue, difficulty losing weight, and reduced energy. It is worth discussing with his GP, who may consider repeating the testosterone as a morning sample if this one was taken later in the day, since testosterone peaks in the early morning and can be 20 to 30 percent lower by afternoon.\n\nHis kidney function requires attention. His cystatin C, a protein filtered by the kidneys that provides a more accurate measure of kidney function than creatinine especially in older adults and those with lower muscle mass, is 1.51 against an upper limit of 1.1. His cystatin C-based eGFR is 62, and the combined creatinine-cystatin C eGFR is also 62, both sitting just above the 60 threshold that defines stage 3 chronic kidney disease. His creatinine-based eGFR is 86, which looks better but is likely overestimating function because creatinine depends on muscle mass, and with no resistance training and a BMI of 26.7 at 74, muscle mass may be lower than average. The cystatin C result is the more reliable measure here. An eGFR of 62 at 74 is not unusual and does not mean kidney failure, but it does mean kidney function is mildly reduced and should be monitored. His GP should be made aware, and a repeat in three to six months with a urine albumin-to-creatinine ratio would help determine whether this is stable age-related decline or progressive. His uric acid at 387 is within the laboratory range but above the optimal ceiling of 380 for men. Elevated uric acid is associated with reduced kidney function, insulin resistance and alcohol intake, all of which are present here.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 71.9, about 2 years younger than a calendar age of 74.\n\nTurning to the positives, and there are important ones. His thyroid is working well. TSH at 1.48 sits in the optimal zone between 1.0 and 2.5, free T4 at 17.4 is mid-range, and free T3 at 5.4 is in the ideal zone. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His FT3 to FT4 ratio at 0.31 confirms good conversion. This means the thyroid is not contributing to his fatigue or weight difficulty, which is genuinely useful information to have at 74. His iron studies are balanced: ferritin at 117 is in the optimal range for men, serum iron at 16.3 is healthy, and transferrin saturation at 32 percent is ideal. His transferrin is 2.03, marginally below the 2.15 lower limit, but transferrin is a negative acute-phase protein, meaning it falls when inflammation is present, and with a CRP of 7.1 and ESR of 35, this is almost certainly an inflammatory suppression rather than an iron problem. His full blood count is largely healthy: haemoglobin at 147 is solid, red cell count at 4.7, haematocrit at 0.425, MCV at 90.3, MCH at 31.4 and platelets at 336 are all within their optimal zones. His calcium and corrected calcium are healthy, magnesium at 0.93 is in the optimal range, and phosphate is normal. His parathyroid hormone at 2.6 is mid-range and appropriate. His cortisol at 392 is within the morning range. Oestradiol at 119 and progesterone at 1.27 are both within range. Prolactin and SHBG are normal. His DHEA-S at 1.0 micromol per litre, equivalent to about 369 micrograms per decilitre, is within range though towards the lower end, consistent with age. His creatine kinase at 102 is healthy. His prostate markers are reassuring: total PSA at 2.3 is well within the age-appropriate limit, though his free PSA ratio at 0.187 is marginally below the 0.19 threshold. At a total PSA of 2.3, a free ratio just below the cutoff is not concerning on its own, but it should be noted for future tracking. His CEA tumour marker is 1.88, within the non-smoker limit, which is reassuring. His immunoglobulins, IgG, IgM and IgA, are all within range, his IgE is very low, rheumatoid factor is negative, and coeliac screening is negative. His vitamin D at 69 is sufficient but below the optimal range of 75 to 120. His B12 at 267 is within the laboratory range but below the optimal threshold of 500, and this is a finding that connects to his PPI use, because proton pump inhibitors reduce stomach acid, and stomach acid is required to release B12 from food. Long-term PPI use is one of the most common causes of gradually declining B12, and at 267 he is not deficient but is drifting in the wrong direction. Low B12 can contribute to fatigue, and supplementation is straightforward. His folate at 8.0 is at the lower boundary of the optimal range.\n\nHis Ca19-9 tumour marker is 46.67 against an upper limit of 37. Ca19-9 is a protein that can be elevated in cancers of the pancreas, bile ducts and bowel, but it is also raised by benign conditions including bile duct inflammation, pancreatitis, liver disease, and even benign ovarian cysts. With his GGT at 212 suggesting biliary or hepatic strain, the most likely explanation is that the Ca19-9 is being driven by the same biliary inflammation or metabolic liver stress rather than by a malignancy. His CEA, another tumour marker that would be elevated in bowel and pancreatic cancer, is normal at 1.88, which is reassuring. However, a Ca19-9 above the upper limit should be flagged to his GP, who may wish to arrange a liver and pancreas ultrasound, which would also address the GGT and the amylase findings.\n\nHis urine is largely unremarkable. There is a trace of protein, which at this level is usually not significant but should be noted alongside the reduced eGFR. No growth on culture, no red cells, no nitrites, and no glucose. The trace protein may warrant a formal albumin-to-creatinine ratio to quantify it properly.\n\nHis reticulocyte percentage at 0.96 is healthy, but the absolute reticulocyte count at 45.12 is marginally below the 50 lower limit. At 74, this is most likely a mild age-related slowing of red cell production by the bone marrow and is not concerning given his healthy haemoglobin and red cell indices. His MCHC at 347 is marginally above the 345 upper limit, which at this margin is usually a laboratory or temperature artefact as the lab themselves note, and is not clinically significant. His total antioxidant activity at 1.83 is marginally above the 1.77 upper limit, which may reflect dietary antioxidant intake or supplement use and is not a concern.\n\nHis De Ritis ratio at 0.76 is marginally below the optimal range of 0.8 to 1.3 but within the normal range, reflecting the relatively low AST compared to ALT, which is a benign pattern. His atherogenic index of plasma at 0.192 is within the normal range but above optimal, consistent with the lipid picture. The Castelli II ratio at 4.61 is above the 3.5 limit, driven by the high LDL and low HDL. The systemic immune-inflammation index at 269 and platelet-to-lymphocyte ratio at 83.6 are both within normal ranges.","links":"The findings in this report are not separate problems sitting in isolation. They connect through two central themes: metabolic strain and cumulative cardiovascular exposure.\n\nThe first theme ties together the HbA1c of 44, the fasting insulin of 9.34, the HOMA-IR of 2.16, the GGT of 212, the CRP of 7.1, the ESR of 35, the triglycerides of 1.71, the low HDL of 1.1, and the visceral fat implied by his difficulty losing weight at a BMI of 26.7. This is the cluster often described as metabolic syndrome: insulin resistance drives the liver to produce more triglyceride-rich particles, which lowers HDL, inflames the liver (elevating GGT), and generates systemic inflammation (elevating CRP). The PPI may be compounding the digestive component by reducing stomach acid, which impairs protein digestion and nutrient absorption, potentially contributing to the low B12 and the bloating. Alcohol above seven drinks per week feeds directly into this cycle: it adds calories that promote visceral fat, it stresses the liver independently of the metabolic load, and it raises GGT through a direct toxic effect on bile duct cells.\n\nThe second theme is the cumulative lipid exposure. An LDL above 4.5 for twenty years, combined with an ApoB of 1.68, means the total number of atherogenic particles that have passed through Guy's arterial walls over two decades is very high. The absence of cardiovascular events is encouraging but does not mean the absence of plaque. The CRP of 7.1 is the additional concern here, because inflammation is what converts stable plaque into the kind that ruptures and causes a heart attack or stroke. The Lp(a) below 25 is an important exclusion: it confirms that this lipid picture is not genetically fixed and is amenable to intervention, whether through diet, exercise, alcohol reduction, or statin therapy.\n\nThe lymphocyte count of 4.02 does not fit neatly into either theme. It may be reactive, driven by the chronic inflammatory state, or it may represent an age-related monoclonal expansion that is unrelated. A blood film and, if needed, flow cytometry will resolve this. The elevated LH and FSH with low testosterone are a separate age-related finding, but the low testosterone may be worsening the metabolic picture by reducing muscle mass and increasing fat deposition, creating a feedback loop.\n\nThe kidney function at eGFR 62 is the loose end that needs monitoring. It may be stable age-related decline, it may be partly driven by the metabolic and inflammatory load, or it may reflect early hypertensive or metabolic kidney damage. The trace urine protein adds a small reason to investigate further. If the metabolic picture improves with weight loss and alcohol reduction, the kidney function may stabilise or even improve.\n\nWhat was excluded is worth noting. His thyroid is not contributing to his symptoms. Coeliac disease has been ruled out. There is no iron deficiency. There is no evidence of autoimmune disease. His prostate markers are reassuring. His liver shows no evidence of scarring despite the elevated GGT. These exclusions narrow the focus to the metabolic and lipid findings as the drivers of his symptoms and risk.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon, or leftover chicken. Anchor: before anything else goes on the plate. Why: protein at each meal reduces the insulin spikes behind your HOMA-IR of 2.16 and helps preserve muscle mass, which your low testosterone and absent resistance training are quietly eroding.\nSwap white bread, pastry, biscuits and sugary snacks for oats, rye bread and wholegrain alternatives, one meal at a time, starting with breakfast this week. Why: slower-releasing carbohydrates will lower the average blood sugar driving your HbA1c of 44 back towards the normal range of below 42.\nAdd two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: designate two fixed evenings as fish nights. Why: omega-3 fatty acids lower triglycerides, raise HDL and reduce the inflammation behind your CRP of 7.1.\nAdd a portion of soluble fibre to one meal a day: a handful of oats at breakfast, a portion of beans or lentils at lunch, or a tablespoon of ground flaxseed stirred into yoghurt. Why: soluble fibre binds cholesterol in the gut and removes it, directly lowering the LDL of 5.07.\nReduce alcohol to a maximum of seven drinks per week, spread across no more than four days, with at least three alcohol-free days. A drink is 125ml wine, half a pint of beer, or a single spirit measure. Why: alcohol above this level is the most likely driver of your GGT of 212 and is compounding the insulin resistance and triglyceride picture.\nWalk for twenty minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, which is the direct mechanism behind your HOMA-IR of 2.16 and HbA1c of 44.\nBegin two resistance training sessions per week, even if they are bodyweight only: squats to a chair, press-ups against a wall, and standing rows with a band. Anchor: fixed days, same time, before your walk. Why: resistance training is the most effective way to improve insulin sensitivity, raise HDL, maintain kidney function, and support the testosterone production that your pituitary is trying to stimulate with elevated LH and FSH.\nAim for a calorie intake of approximately 1,800 to 2,000 kcal per day to create a moderate deficit. Your estimated maintenance is around 2,200 kcal based on your weight of 84.5 kg, height of 177.8 cm, age and activity level. Protein target: 110 to 130 g per day (1.3 to 1.5 g per kg). Weight target: aim to reach 78 to 80 kg over the next six to nine months, which would bring your BMI to around 24.5 to 25.3 and meaningfully improve the insulin resistance, GGT, triglycerides and CRP.","flags":"Cardiovascular Risk Score 100/100 with ApoB 1.68 (target below 0.9), LDL 5.07 (limit 3.0), HDL 1.1 (desirable above 1.55), triglycerides 1.71 (limit 1.70), non-HDL 5.8 (limit 4.0), ApoB/A1 ratio 1.14 (limit 0.7), TC/HDL ratio 6.27 (limit 4.5), Castelli II 4.61 (limit 3.5). All modifiable: Lp(a) below 25 confirms no genetic fixation. Twenty-year cumulative exposure at LDL above 4.5 represents significant lifetime atherogenic burden.\nhs-CRP 7.1 (limit 5.0, optimal below 1.0) and ESR 35 (limit 12, age-adjusted ceiling approximately 37). Dual inflammatory markers elevated. If no acute illness at time of draw, suggests chronic systemic inflammation compounding the cardiovascular risk.\nHbA1c 44 mmol/mol (pre-diabetic range 42 to 47), fasting insulin 9.34 (optimal below 8), HOMA-IR 2.16 (limit 1.5, early insulin resistance). Estimated average glucose 7.2 (limit 7.0). Pre-diabetic metabolic picture, reversible with weight loss and dietary change.\nGGT 212 (limit 73), nearly three times the upper limit, with ALT 25, AST 19, bilirubin 9 and FIB-4 0.84 all normal. Isolated GGT elevation consistent with alcohol intake above 7 drinks per week and metabolic liver strain. No evidence of fibrosis. Liver ultrasound recommended.\nCa19-9 46.67 (limit 37) with normal CEA 1.88. Most likely driven by biliary or hepatic inflammation given the GGT elevation, but should be repeated after addressing alcohol and GGT. Pancreatic and liver ultrasound would provide reassurance.\nLymphocytes 4.02 (limit 3.0). Persistent mild lymphocytosis at 74 should be investigated with a blood film and, if indicated, flow cytometry to exclude monoclonal B-cell lymphocytosis. May be reactive to chronic inflammation.\nCystatin C 1.51 (limit 1.1), cystatin C eGFR 62, combined eGFR 62. Mildly reduced kidney function. Creatinine eGFR of 86 likely overestimates. Repeat in three to six months with urine albumin-to-creatinine ratio. Trace urine protein noted.\nTestosterone 9.7 (recommended above 12, optimal 18 to 30), free androgen index 25 (limit 30), with elevated LH 14.08 (limit 9.3) and FSH 33.96 (limit 18.1). Primary hypogonadism pattern consistent with age. Morning repeat recommended if sample was taken later in the day.\nVitamin B12 267 (optimal above 500) on long-term PPI. Gradual depletion likely. Supplement with sublingual methylcobalamin.\nVitamin D 69 (sufficient but below optimal of 75 to 120). Supplement recommended.\nTransferrin 2.03 (limit 2.15), marginally below range. Almost certainly suppressed by inflammation given CRP 7.1 rather than representing an iron disorder.\nAmylase 28 (limit 30), marginally below range. May relate to long-term PPI use. Lipase 46 is normal.\nEosinophils 0.51 (limit 0.50), marginal. IgE 6.1 argues against significant allergy. Not clinically significant.\nPSA ratio 0.187 (cutoff 0.19), marginally below threshold at a total PSA of 2.3. At this low total PSA, not concerning but should be tracked at annual review.\nReticulocytes absolute 45.12 (limit 50), marginally below range. Age-related, haemoglobin healthy.\nMCHC 347 (limit 345), marginal, likely temperature or storage artefact as lab notes.\nReassuring negatives: thyroid function optimal with negative antibodies, coeliac screen negative, rheumatoid factor negative, ferritin and iron studies balanced, liver fibrosis scores all normal, PSA well within age-appropriate limit, CEA normal, immunoglobulins within range, IgE very low, cortisol normal, calcium and magnesium optimal, urine culture no growth, no haematuria.","recommendations":"Discuss the lipid profile with your GP, bringing the ApoB of 1.68, LDL of 5.07 and the cardiovascular risk score of 100. Even with no family history of cardiovascular disease, the cumulative twenty-year LDL exposure combined with a CRP of 7.1 makes a strong case for statin therapy alongside lifestyle changes. Ask about the appropriateness of a high-intensity statin and whether an ApoB target below 0.9 is achievable.\nAsk your GP to arrange a liver and pancreas ultrasound. This will address three findings at once: the GGT of 212, the Ca19-9 of 46.67, and the low amylase of 28. The ultrasound will check for fatty liver disease and exclude any biliary or pancreatic pathology.\nDiscuss the HbA1c of 44 and HOMA-IR of 2.16 with your GP. This is pre-diabetes, reversible with weight loss and dietary change, but your GP should record it and monitor it. A repeat HbA1c in three to four months after dietary changes will show whether the trend is improving.\nAsk your GP about the lymphocyte count of 4.02. A blood film should be reviewed, and if lymphocytosis persists on repeat, flow cytometry may be appropriate to characterise the cells.\nDiscuss the cystatin C eGFR of 62 and trace urine protein. Your GP should arrange a urine albumin-to-creatinine ratio and repeat kidney function in three to six months to determine whether this is stable.\nMention the testosterone of 9.7 and the elevated LH and FSH. If the sample was taken after 10am, a repeat morning sample would give a more accurate reading. If confirmed low, your GP may discuss whether testosterone replacement is appropriate.\nReview the ongoing need for the PPI with your GP. Long-term PPI use is associated with reduced B12 absorption (yours is 267, below optimal), reduced magnesium, reduced calcium absorption, and potentially reduced digestive enzyme output (amylase 28). If the original indication has resolved, a trial of stepping down may be appropriate.\nRepeat the Ca19-9 in three months after reducing alcohol and reassessing the GGT.\nCalorie target: 1,800 to 2,000 kcal per day. Protein target: 110 to 130 g per day. Weight target: 78 to 80 kg over six to nine months. Retest in four months, repeating: HbA1c, fasting insulin, HOMA-IR, full lipid panel with ApoB, GGT, full blood count (checking lymphocytes), cystatin C, Ca19-9, vitamin B12 and vitamin D.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal that contains fat. Why: your level of 69 is sufficient but below the optimal range of 75 to 120, and at your age adequate vitamin D supports bone density, immune function and insulin sensitivity.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with the vitamin D. Why: K2 ensures the calcium mobilised by vitamin D is directed into bone rather than into artery walls, which matters given your cardiovascular risk profile.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue, taken in the morning. Why: your B12 of 267 is below the optimal threshold of 500, and long-term PPI use impairs absorption from food and from swallowed tablets. Sublingual delivery bypasses the stomach entirely.\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides from 1.71 towards the ideal below 1.0, raises HDL, and has an anti-inflammatory effect that may help lower the CRP of 7.1.\nMagnesium glycinate: 300 to 400 mg before bed. Why: your magnesium at 0.93 is within the optimal range, but supplementation supports insulin sensitivity, sleep quality and blood pressure, all of which are relevant to your metabolic and cardiovascular picture. Glycinate is the best-absorbed form and has a mild calming effect.\nDo not take iron supplements. Your ferritin at 117 and transferrin saturation at 32 percent are well balanced, and additional iron would risk overload.\nThe most important changes from this report are not supplements. They are reducing alcohol to below seven drinks per week, adding resistance training twice a week, increasing protein to 110 to 130 g per day, replacing refined carbohydrates with whole grains, and creating a moderate calorie deficit to reach 78 to 80 kg. These changes will move the HbA1c, the GGT, the triglycerides, the HDL and the CRP more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 39 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Needs medical attention. Raw 39. Weakest systems: inflammation 9%, lipids & cardiovascular 18%, liver & metabolic 26%. Biggest drags: Gamma GT, LDL Cholesterol, Apolipoprotein B, Lymphocytes.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"71.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4551","lower_normal":"","upper_normal":"79","lower_optimal":"","upper_optimal":"74","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4684","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"100","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the amount of cardiovascular risk being accumulated right now. At 100, every modifiable input to cardiovascular risk in Guy's blood is contributing simultaneously: ApoB 1.68, LDL 5.07, HDL 1.1, triglycerides 1.71, CRP 7.1 and HbA1c 44. This does not predict an imminent event, but it means the gap between what these markers are and what they should be is as wide as it gets. The positive is that with Lp(a) below 25, the entire score is modifiable through diet, exercise, alcohol reduction and, if his GP recommends, statin therapy.","low_causes":"Low ApoB, low LDL, high HDL, low triglycerides, low CRP, normal HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting glucose measures the amount of sugar circulating in the blood after an overnight fast. At 5.2, Guy's result is within the laboratory range of 3.5 to 6.0 but above the optimal ceiling of 5.4. While not diabetic, it sits in a zone where the body is beginning to work harder to keep blood sugar in check, consistent with the insulin resistance shown by his HOMA-IR of 2.16. Reducing refined carbohydrates and losing visceral fat are the most effective ways to bring this down.","low_causes":"Fasting, excessive insulin, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, medications, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7778","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin molecules in the blood that have glucose permanently attached. Because red blood cells live for about three months, this marker reflects average blood sugar control over that period. At 6.2%, Guy's result falls in the pre-diabetic range of 6.0 to 6.4%, indicating that blood sugar has been running above optimal for several months. This is an early warning that is entirely reversible with dietary change, weight loss and increased physical activity.","low_causes":"Iron deficiency (can falsely lower), haemolytic anaemia, blood loss","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7619","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol. At 44, it falls in the pre-diabetic range of 42 to 47. Below 42 is normal, 42 to 47 is pre-diabetic, and above 48 is diagnostic of diabetes. Guy's result is at the lower end of the pre-diabetic zone, meaning he has the greatest opportunity to reverse it before it progresses.","low_causes":"Iron deficiency (can falsely lower), haemolytic anaemia, blood loss","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ins","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"9.34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4351","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5484","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar in check after an overnight fast. Insulin is the hormone that tells cells to take up glucose. At 9.34, Guy's result is within the broad laboratory range but above the optimal ceiling of 8.0. When insulin is higher than it needs to be, it usually means the cells are partially resistant to its signal and the pancreas is compensating by producing more. This is consistent with the early insulin resistance confirmed by his HOMA-IR of 2.16.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, high carbohydrate diet, excess body fat, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"3.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5479","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5242","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts to insulin. Because it is more stable in blood than insulin itself, it provides a reliable measure of how much insulin the pancreas is producing. At 3.22 micrograms per litre (approximately 1,066 pmol/L), Guy's result sits in the upper half of its range, consistent with a pancreas that is working harder than optimal to manage blood sugar. This aligns with his HOMA-IR of 2.16 and HbA1c of 44.","low_causes":"Type 1 diabetes, low insulin demand, low carbohydrate diet","high_causes":"Insulin resistance, type 2 diabetes, excess body fat, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8873","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculation that combines fasting glucose and fasting insulin to estimate insulin resistance. A score below 1.0 indicates excellent insulin sensitivity. Between 1.0 and 1.5, the cells are beginning to resist insulin's signal. Above 1.9 indicates early insulin resistance, and above 2.9 significant resistance. At 2.16, Guy is in the early insulin resistance zone. His pancreas is producing extra insulin to keep glucose within range, but the cells are not responding as efficiently as they should. This is the mechanism behind the elevated HbA1c of 44 and is driven primarily by excess body fat, refined carbohydrate intake, and insufficient physical activity. It is fully reversible.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, fasting","high_causes":"Excess body fat, high carbohydrate diet, sedentary lifestyle, ageing, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"7.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5143","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is calculated from the HbA1c and represents the average blood sugar level over the preceding two to three months. At 7.2, Guy's result is above the 7.0 upper limit and well above the optimal ceiling of 6.2. This confirms that blood sugar has been running above ideal and is consistent with the pre-diabetic HbA1c of 44. As the HbA1c improves with dietary change and weight loss, this number will come down in parallel.","low_causes":"Iron deficiency affecting HbA1c calculation, haemolytic conditions","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5040","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Triglycerides, which sits outside the ideal range.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"31.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4595","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3973","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures what percentage of the iron-carrying protein transferrin is loaded with iron. At 31.97%, Guy's result sits squarely in the optimal range of 25 to 40%, indicating a well-balanced supply of iron to the tissues. Neither deficiency nor overload is present.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, excessive supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"16.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4908","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5608","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. At 16.3, Guy's result is within range and within the optimal band. Iron is essential for oxygen transport, energy production and immune function. This is a healthy result.","low_causes":"Iron deficiency, chronic disease, poor dietary intake, blood loss","high_causes":"Iron overload, haemochromatosis, excessive supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2533","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the blood to the bone marrow and other tissues. At 2.03, Guy's result is marginally below the lower limit of 2.15. Transferrin is a negative acute-phase protein, meaning the liver reduces its production during inflammation. With Guy's CRP at 7.1 and ESR at 35, the low transferrin is almost certainly an inflammatory suppression rather than a sign of iron overload. His ferritin, iron and saturation are all balanced, supporting this interpretation.","low_causes":"Chronic inflammation (negative acute-phase response), liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"46.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3635","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"umol/L","description":"Total iron binding capacity measures the total amount of iron that transferrin could carry if fully saturated. At 46.9, it is just within the laboratory range but below optimal, reflecting the slightly low transferrin. This is consistent with the inflammatory suppression of transferrin production and is not a concern in isolation.","low_causes":"Chronic inflammation, liver disease, iron overload","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"117","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/mL","description":"Ferritin is the protein that stores iron inside cells, and the blood level reflects total body iron reserves. At 117, Guy's result is in the optimal range of 50 to 200 for men, indicating well-balanced iron stores. It is worth noting that ferritin also rises during inflammation, so the true iron stores may be slightly lower than 117 suggests, but the balanced transferrin saturation of 32% confirms there is no deficiency.","low_causes":"Iron deficiency, blood loss, poor dietary intake, coeliac disease","high_causes":"Inflammation, infection, liver disease, haemochromatosis, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"147","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. At 147, Guy's result is within the optimal range for men, confirming healthy oxygen-carrying capacity. There is no anaemia.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Dehydration, smoking, chronic lung disease, polycythaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"x10^12/L","description":"Red blood cell count measures the total number of red cells in circulation. At 4.7, this is within the optimal range, confirming adequate red cell production by the bone marrow.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow disorders, chronic disease, blood loss","high_causes":"Dehydration, smoking, chronic lung disease, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.425","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167"," ses":"Laboratory artefact (temperature, storage), hereditary spherocytosis (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelet Count","group":"HEMATOLOGY","result":"336","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5487","lower_normal":"150","upper_normal":"410","lower_optimal":"200","upper_optimal":"370","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"x10^9/L","description":"Platelets are the small cell fragments that form clots to stop bleeding. At 336, Guy's count is within the optimal range, confirming healthy platelet production and no risk of abnormal bleeding or clotting from this marker.","low_causes":"Bone marrow suppression, viral infections, liver disease, medications, autoimmune conditions","high_causes":"Inflammation, infection, iron deficiency, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6111","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active, while smaller ones are older. At 8.3, Guy's MPV is within the optimal range, indicating normal platelet turnover.","low_causes":"Bone marrow suppression, inflammatory conditions reducing production","high_causes":"Increased platelet destruction, immune thrombocytopenia, inflammation, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"8.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0. 0.3333","upper_optimal_position":"0.5500","units":"%","description":"Reticulocyte percentage measures the proportion of young, newly released red blood cells in the circulation. It reflects how actively the bone marrow is producing new red cells. At 0.96%, Guy's result is within the optimal range, indicating steady red cell production.","low_causes":"Bone marrow suppression, iron or B12 deficiency, chronic kidney disease, aplastic anaemia","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia or bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"45.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2688","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells rather than the percentage. At 45.12, Guy's result is marginally below the 50 lower limit. At 74, a mild reduction in absolute reticulocyte production is a common age-related finding and reflects a gradual slowing of bone marrow activity. His haemoglobin at 147 and red cell count at 4.7 are both healthy, confirming that this is not causing any functional impact.","low_causes":"Age-related bone marrow decline, iron or B12 deficiency, chronic kidney disease, bone marrow suppression","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"19.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by red blood cell count and helps distinguish between iron deficiency anaemia and thalassaemia trait when MCV is low. At 19.2, with a normal MCV of 90.3, the index is reported for context and is not applicable at present. A value above 13 favours iron deficiency over thalassaemia, but neither is present here.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates the presence of inflammatory proteins in the blood that cause red cells to clump together. At 35, Guy's ESR is above the standard upper limit of 12. However, ESR rises naturally with age, and a commonly used age-adjusted limit for men is half the age, giving approximately 37 at 74. His result sits just inside this adjusted limit. Taken alongside the CRP of 7.1, the combination suggests genuine chronic inflammation rather than age alone.","low_causes":"Generally not clinically significant, polycythaemia, sickle cell","high_causes":"Inflammation, infection, autoimmune disease, malignancy, anaemia, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is produced by the liver in response to inflammation anywhere in the body. It is one of the most important markers for cardiovascular risk because it reflects the level of vascular inflammation that destabilises arterial plaque. Below 1.0 is optimal, 1.0 to 3.0 is average risk, and above 3.0 is higher risk. At 7.1, Guy's result is significantly elevated and suggests active systemic inflammation. This could be driven by visceral fat, insulin resistance, alcohol intake, or an acute process such as a recent infection or joint flare. If he was well at the time of the blood draw, chronic metabolic inflammation is the most likely explanation, and the combination with his ApoB of 1.68 is the highest-priority cardiovascular finding in this report.","low_causes":"Low inflammation, healthy lifestyle, statin use","high_causes":"Infection, chronic inflammation, obesity, insulin resistance, cardiovascular disease, autoimmune conditions, smoking, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":
