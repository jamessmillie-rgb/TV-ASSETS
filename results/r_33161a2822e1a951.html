rmal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5632","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions including energy production, muscle function, nerve signalling and blood sugar regulation. At 0.93, Guy's result is within the optimal range of 0.85 to 1.05. This is reassuring given his PPI use, as long-term proton pump inhibitors can deplete magnesium over time. Continued monitoring is worthwhile.","low_causes":"PPI use, alcohol, diuretics, poor dietary intake, diarrhoea","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5533","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered and excreted by the kidneys. At 4.3, Guy's result is within the optimal range, indicating that the kidneys are effectively clearing protein waste despite the reduced eGFR seen on the cystatin C measure.","low_causes":"Low protein diet, severe liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5470","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a steady rate. At 74, Guy's creatinine is within the optimal range. However, creatinine depends on muscle mass, and in someone with no resistance training at 74, a low creatinine can make kidney function appear better than it is. This is why the cystatin C-based eGFR of 62 is the more reliable measure of his true kidney function.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"Estimated glomerular filtration rate based on creatinine estimates how well the kidneys filter waste from the blood. Above 90 is considered optimal, 60 to 89 is mildly reduced. At 86, Guy's creatinine-based eGFR suggests mildly reduced function. However, this estimate likely overestimates his true function because his creatinine is kept low by reduced muscle mass. The cystatin C-based eGFR of 62 is the more accurate figure here.","low_causes":"Kidney disease, ageing, diabetes, hypertension, dehydration, medications","high_causes":"Not typically clinically significant; can occur with high cardiac output or pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.51","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6864","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all cells in the body and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate measure of kidney function in older adults and those with lower muscle mass. At 1.51, Guy's result is above the 1.1 upper limit, indicating that the kidneys are filtering less efficiently than they should. This is the result that drives his cystatin C eGFR of 62 and the combined eGFR of 62. It should be monitored with a repeat in three to six months.","low_causes":"Not typically significant","high_causes":"Reduced kidney function, ageing, inflammation, thyroid dysfunction, high BMI","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cgfr","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This is the eGFR calculated from cystatin C rather than creatinine. At 62, it indicates mildly reduced kidney function, sitting just above the 60 threshold for stage 3 chronic kidney disease. Because cystatin C is not influenced by muscle mass, this is a more reliable estimate of Guy's true filtration rate than the creatinine-based eGFR of 86. At 74, mild kidney decline is common, but the gap between the two eGFR estimates suggests the creatinine-based result is overestimating function. Monitoring with a repeat and a urine albumin-to-creatinine ratio is recommended.","low_causes":"Kidney disease, ageing, diabetes, hypertension, chronic inflammation","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"387","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5402","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5217","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in food and in the body's own cells. At 387, Guy's result is within the laboratory range but marginally above the optimal ceiling of 380. Elevated uric acid is associated with insulin resistance, reduced kidney function and alcohol intake, all of which are present in this report. Keeping hydration up and reducing alcohol will help keep uric acid in check.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"Alcohol, high purine diet (red meat, shellfish, organ meats), kidney disease, insulin resistance, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to give the most accurate single estimate of kidney filtration. At 62, it confirms mildly reduced kidney function, just above the stage 3 CKD threshold. This is the figure to use for clinical decision-making and is the most reliable of the three eGFR values in this report.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"58.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4339","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between causes of kidney function changes. A high ratio can suggest dehydration or upper gastrointestinal bleeding, while a low ratio may indicate liver disease or low protein intake. At 58.1, Guy's ratio is within the optimal range, suggesting that the reduced eGFR is a true kidney filtration finding rather than being caused by dehydration or other pre-renal factors.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6133","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood, reflecting nutritional status and immune function. At 69, Guy's result is within the optimal range.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Dehydration, chronic inflammation, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It maintains fluid balance, transports hormones and nutrients, and is a marker of nutritional status and liver synthetic function. At 38, Guy's result is within the laboratory range but below the optimal threshold of 40. Albumin falls with age, with chronic inflammation, and with inadequate protein intake. Given the CRP of 7.1, inflammation is likely suppressing albumin production. Increasing protein intake to 110 to 130 g per day and reducing the inflammatory load should help improve this.","low_causes":"Inflammation, liver disease, malnutrition, kidney disease (protein loss), ageing","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/L","description":"Globulin includes all the non-albumin proteins in the blood, primarily immunoglobulins (antibodies) and transport proteins. At 31, Guy's result is within the laboratory range but slightly above the optimal ceiling of 30. This is consistent with the chronic inflammatory and immune activation suggested by the CRP, ESR and lymphocyte count.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic inflammation, infection, immune disorders, liver disease, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5429","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bile ducts and bones. At 95, Guy's result is within the laboratory range but above the optimal ceiling of 90. In the context of the very elevated GGT, this suggests some biliary strain. It is not concerning in isolation but adds to the picture of hepatobiliary stress from alcohol and metabolic factors.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, liver disease, bone disease, Paget's disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down. The liver processes it for excretion in bile. At 9, Guy's bilirubin is within the optimal range, confirming that the liver's processing of bilirubin is working normally despite the elevated GGT.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2232","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT is an enzyme found predominantly in liver cells. When liver cells are damaged, ALT leaks into the blood, making it a sensitive marker of liver cell injury. At 25, Guy's ALT is within the optimal range for men (below 30), indicating that despite the very elevated GGT, there is no active liver cell damage. This is a reassuring finding that suggests the GGT elevation is coming from biliary or metabolic stress rather than from hepatocyte destruction.","low_causes":"Generally not significant; very low ALT can indicate low B6","high_causes":"Liver disease, fatty liver, hepatitis, alcohol, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5208","units":"IU/L","description":"AST is an enzyme found in the liver, heart, muscle and other tissues. At 19, Guy's result is within the optimal range, confirming no significant cell damage in any of these tissues. Combined with the normal ALT, this rules out active liver injury.","low_causes":"Generally not significant","high_causes":"Liver disease, muscle damage, heart disease, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"212","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"Gamma GT is an enzyme found in the bile ducts and liver cells. It is the most sensitive liver enzyme to alcohol intake, bile duct inflammation and metabolic stress. At 212, Guy's result is nearly three times the upper limit of 73 and more than eight times the optimal ceiling of 25. This is a significant elevation. The most likely drivers are regular alcohol intake above seven drinks per week and the metabolic stress associated with insulin resistance and visceral fat. The reassuring finding is that ALT and AST are both normal, and the FIB-4 score is low, meaning there is no evidence of liver cell damage or scarring at present. However, a sustained GGT at this level is not benign: it is associated with increased cardiovascular risk independently of other markers, and it suggests the liver is under significant metabolic and toxic strain. Reducing alcohol and losing body fat are the most effective ways to bring this down.","low_causes":"Generally not significant","high_causes":"Alcohol, fatty liver, bile duct disease, medications, diabetes, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"DIGESTIVE","result":"28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2903","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6045","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands to break down starch into smaller sugars. At 28, Guy's result is marginally below the lower limit of 30. Mildly low amylase can be associated with long-term PPI use, which alters the acid environment and can reduce pancreatic enzyme output over time. It may also be seen in chronic pancreatic insufficiency, though this is less likely given that lipase at 46 is healthy. The low amylase may be contributing to his bloating and digestive discomfort, as reduced starch digestion can lead to fermentation in the bowel.","low_causes":"Chronic pancreatitis, long-term PPI use, severe liver disease","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"DIGESTIVE","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"13","upper_normal":"60","lower_optimal":"20","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3830","upper_optimal_position":"0.6170","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. It is a more specific marker of pancreatic health than amylase. At 46, Guy's lipase is within the optimal range, confirming that the pancreas is producing adequate amounts of fat-digesting enzyme and ruling out acute pancreatitis.","low_causes":"Chronic pancreatic insufficiency (rare to be clinically low)","high_causes":"Acute pancreatitis, gallstones, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6660","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"4.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4344","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including the protective HDL and the harmful LDL fractions. At 6.9, Guy's total cholesterol is well above the desirable limit of 5.18. However, total cholesterol alone is a blunt tool. The more useful measures are ApoB (which counts the harmful particles) and the HDL/LDL breakdown. In Guy's case, both the ApoB and the LDL confirm that the elevation is driven by harmful particles rather than by high protective HDL.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet (saturated fat, trans fat), genetics, obesity, hypothyroidism, diabetes, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5029","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, packaged inside VLDL particles produced by the liver. They are used for energy storage and transport. At 1.71, Guy's result is marginally above the fasting limit of 1.70. Elevated triglycerides are driven by excess carbohydrate intake, alcohol, insulin resistance and excess body fat. All of these are present in Guy's profile. Triglycerides respond well to dietary change: reducing refined carbohydrates, adding omega-3 from oily fish, reducing alcohol and losing body fat typically bring them down within weeks.","low_causes":"Low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, alcohol, insulin resistance, obesity, diabetes, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL cholesterol carries triglycerides from the liver to the tissues. At 0.78, Guy's result is at the upper boundary of the laboratory range. Elevated VLDL is a direct reflection of the triglyceride level and is driven by the same factors: insulin resistance, alcohol and excess carbohydrate.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, insulin resistance, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3548","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL cholesterol is the protective fraction that removes excess cholesterol from the artery walls and returns it to the liver for disposal. Higher is better. At 1.1, Guy's HDL is above the low-risk floor of 1.04 but well below the desirable level of 1.55 and the optimal level of 1.4 for men. Low HDL is strongly associated with insulin resistance, physical inactivity, excess body fat and alcohol (paradoxically, moderate alcohol can raise HDL, but the metabolic effects of excess alcohol suppress it). Regular aerobic exercise is the single most effective way to raise HDL.","low_causes":"Insulin resistance, physical inactivity, smoking, obesity, very low fat diet, medications","high_causes":"Regular exercise, moderate alcohol, genetics, weight loss","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8450","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL cholesterol carries cholesterol to the tissues, including into the artery walls where it can form plaque. It is the main target for reducing cardiovascular risk. At 5.07, Guy's LDL is well above the 3.0 upper limit and far above the optimal ceiling of 2.6. This is the cholesterol fraction that has been running between 4.5 and 5.5 for two decades. While no event has occurred, the cumulative exposure of the arteries to this level of LDL over twenty years represents a significant atherogenic burden. With an Lp(a) below 25, virtually all of this LDL is modifiable through diet, exercise and, if his GP recommends, statin therapy.","low_causes":"Statin therapy, hyperthyroidism, malnutrition, malabsorption","high_causes":"Saturated fat intake, genetics, hypothyroidism, diabetes, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlrat","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6.27","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6967","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio summarises the balance between all cholesterol and the protective HDL fraction. Below 4.5 is desirable, and below 3.5 is optimal. At 6.27, Guy's ratio is significantly above both thresholds, driven by the high total cholesterol and the low HDL. This ratio improves when HDL rises (through exercise and weight loss) and when LDL falls (through diet, exercise and medication).","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high LDL, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"15.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3985","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.6250","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. Above 20% is desirable, and above 25% is optimal. At 15.94%, Guy's HDL makes up a smaller proportion of his total cholesterol than it should, reflecting both the low absolute HDL and the high total cholesterol.","low_causes":"Low HDL, high total cholesterol, metabolic syndrome","high_causes":"High HDL, low total cholesterol, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic cholesterol fractions, including LDL, VLDL and remnants. At 5.8 against a limit of 4.0, this confirms a high burden of cholesterol in particles that can penetrate the artery wall.","low_causes":"Statin therapy, low fat diet, hyperthyroidism","high_causes":"High LDL, high triglycerides, insulin resistance, diet, obesity, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6125","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and reflects how well the body's cholesterol removal system is functioning. At 1.47, Guy's result is above the 1.2 threshold and within the optimal zone above 1.4. This is one of the few positive findings in the lipid panel and suggests that the HDL particles he has are functioning normally, even though there are not enough of them.","low_causes":"Insulin resistance, physical inactivity, smoking, genetic factors","high_causes":"Exercise, moderate alcohol, genetics, weight loss","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL and remnant particle. Because each particle carries exactly one ApoB molecule, the ApoB level counts the total number of atherogenic particles in the blood. It is widely regarded as the single best blood marker of cardiovascular risk. At 1.68, Guy's ApoB is almost twice the 0.9 desirable limit and more than twice the 0.8 optimal target. This means there are a very large number of cholesterol-carrying particles circulating that can penetrate and damage the artery walls. This is the most important number in the lipid panel and the one to discuss with his GP.","low_causes":"Statin therapy, low fat diet, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, genetics, insulin resistance, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8143","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio is the single best summary of the balance between harmful and protective lipoproteins. Below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. At 1.14, Guy's ratio is firmly in the higher-risk category. It is driven by the very high ApoB of 1.68. Even though his ApoA1 is healthy at 1.47, the sheer number of harmful particles overwhelms the protective capacity.","low_causes":"Low ApoB, high ApoA1, statin therapy, exercise","high_causes":"High ApoB, low ApoA1, insulin resistance, diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined particle that carries cholesterol into the artery wall and promotes clotting and inflammation. Unlike LDL, it cannot be meaningfully changed by diet, exercise or most medications. It only needs to be measured once in a lifetime because it is fixed. At below 25, Guy's Lp(a) is within the normal and optimal range, which is genuinely good news. It means that the elevated LDL and ApoB in this report are not driven by an inherited, unchangeable factor but are entirely modifiable through lifestyle and medication. This is one of the most important exclusions in the report.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a simple measure of insulin resistance and atherogenic risk. Below 0.87 is optimal, below 1.5 is acceptable, and above 1.5 is elevated. At 1.55, Guy's ratio is marginally above the 1.5 limit, driven by the borderline triglycerides and the low HDL. This ratio is a reliable surrogate for insulin resistance and is consistent with his HOMA-IR of 2.16.","low_causes":"Low triglycerides, high HDL, exercise, insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich particles (VLDL and intermediate-density lipoproteins). It is calculated as total cholesterol minus HDL minus LDL. At 0.73, Guy's remnant cholesterol is within the laboratory range but above the optimal ceiling of 0.5. Remnant particles are particularly atherogenic because they are small enough to enter the artery wall easily. The elevation is driven by the triglycerides and insulin resistance.","low_causes":"Low triglycerides, low VLDL, healthy metabolism","high_causes":"High triglycerides, insulin resistance, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"4.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8317","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This calculation removes the small cholesterol contribution from lipoprotein(a) to show how much of the LDL is truly modifiable. At 4.99, almost all of Guy's LDL of 5.07 is modifiable, confirming that the Lp(a) contribution is negligible and that diet, exercise and medication can address the full extent of the elevation.","low_causes":"Statin therapy, low fat diet","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.192","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6617","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from triglycerides and HDL and reflects the balance between pro-atherogenic triglyceride-rich particles and protective HDL. At 0.192, Guy's result is within the normal range but above the optimal ceiling of 0.11, driven by the combination of borderline triglycerides and low HDL. Improving both through diet, exercise and alcohol reduction will bring this into the optimal zone.","low_causes":"High HDL, low triglycerides, exercise, healthy weight","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"4.61","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6586","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II ratio divides LDL by HDL to express the balance between harmful and protective cholesterol. At 4.61 against a limit of 3.5, it is elevated, driven by the high LDL and the low HDL working in opposite directions.","low_causes":"Low LDL, high HDL, statin therapy, exercise","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4600","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and insulin sensitivity. It is produced in the skin in response to sunlight and is difficult to obtain in sufficient quantities from food alone. At 69, Guy's result is sufficient (above 50) but below the optimal range of 75 to 120. At 74, adequate vitamin D is particularly important for bone density and fall prevention. Supplementing with 3,000 IU of vitamin D3 daily, taken with a meal containing fat, will bring this into the optimal range.","low_causes":"Limited sun exposure, dark skin, obesity, malabsorption, ageing, winter months","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4640","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5733","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to pull calcium from bone and increase absorption from the gut. At 2.6, Guy's PTH is within the optimal range, confirming normal calcium regulation. Combined with his healthy corrected calcium of 2.46 and vitamin D of 69, there is no sign of parathyroid overactivity.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"267","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3605","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5222","upper_optimal_position":"0.5729","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. It is absorbed in the gut with the help of stomach acid and a protein called intrinsic factor. At 267, Guy's B12 is within the laboratory range but well below the optimal threshold of 500. Long-term PPI use reduces stomach acid production, which impairs the release of B12 from food. This is the most likely explanation for his below-optimal level. Low B12 can contribute to fatigue, brain fog and tingling in the hands and feet. Sublingual methylcobalamin bypasses the stomach acid problem because it is absorbed directly through the mouth lining.","low_causes":"PPI use, inadequate dietary intake, pernicious anaemia, malabsorption, ageing, metformin","high_causes":"Excessive supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.5952","units":"ng/mL","description":"Folate is a B vitamin essential for DNA synthesis, red blood cell production and methylation, a process that regulates gene expression and detoxification. At 8.0, Guy's result sits at the lower edge of the optimal range. Folate works closely with B12, and with B12 below optimal, ensuring adequate folate intake through green leafy vegetables, legumes and fortified foods is important.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications (methotrexate), coeliac disease","high_causes":"Excessive supplementation, B12 deficiency (folate can accumulate when B12 is low)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7798","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4893","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall antioxidant capacity of the blood. It reflects dietary antioxidant intake from fruits, vegetables, tea, coffee and supplements. At 1.83, Guy's result is marginally above the upper limit of 1.77. This is not a concern and may reflect dietary antioxidant intake or the uric acid level, which contributes to the measurement. It does not require any action.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"High dietary antioxidant intake, supplementation, elevated uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5089","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. The body converts T4 into the active form, T3, in the tissues. At 17.4, Guy's FT4 is within the optimal range, confirming healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, severe illness, medications","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4040","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5449","units":"mIU/L","description":"Thyroid-stimulating hormone is produced by the pituitary gland to tell the thyroid how much hormone to make. A high TSH means the thyroid is underperforming and the pituitary is shouting louder. A low TSH means the thyroid is overproducing and the pituitary is backing off. At 1.48, Guy's TSH is within the optimal zone of 1.0 to 2.5, indicating that the thyroid and pituitary are communicating normally.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroid autoimmunity, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolic rate, energy production and body temperature. At 5.4, Guy's FT3 is within the optimal range of 4.5 to 6.5, confirming that the body is converting T4 into the active form efficiently. This is a strong positive at 74.","low_causes":"Hypothyroidism, severe illness, low calorie intake, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies target the thyroid peroxidase enzyme involved in thyroid hormone production. Elevated levels indicate autoimmune thyroid disease (Hashimoto's thyroiditis). At below 6.6, Guy's result is negative, ruling out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, the protein the thyroid uses to make its hormones. Elevated levels suggest autoimmune thyroid disease. At below 1.3, Guy's result is negative, confirming no autoimmune thyroid activity. Combined with the negative TPO antibodies, autoimmune thyroid disease is excluded.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.31, Guy's conversion ratio is within the optimal range of 0.27 to 0.40, confirming healthy thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"Total PSA","group":"PROSTATE","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1769","lower_normal":"0","upper_normal":"6.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3077","units":"ng/mL","description":"Prostate-specific antigen is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement (BPH), inflammation or, less commonly, prostate cancer. At 2.3, Guy's PSA is well within the age-appropriate limit of 6.5 and within the optimal zone below 4.0. This is a reassuring result for prostate health.","low_causes":"Generally not significant; finasteride can lower PSA","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, vigorous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fpsa","name":"Free PSA","group":"PROSTATE","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"ug/L","description":"Free PSA is the unbound fraction of total PSA. The ratio of free to total PSA helps distinguish between benign prostate conditions and prostate cancer. A higher free PSA ratio favours a benign cause. Guy's free PSA ratio of 18.7% is discussed in the next marker.","low_causes":"Generally assessed as part of the ratio rather than independently","high_causes":"Benign prostatic hyperplasia (favourable when expressed as ratio)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prat","name":"PSA Ratio (Free/Total)","group":"PROSTATE","result":"0.187","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4921","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio divides free PSA by total PSA. A ratio above 0.25 (25%) strongly favours a benign cause. A ratio below 0.15 (15%) raises the possibility of malignancy. At 0.187 (18.7%), Guy's ratio is marginally below the 0.19 normal threshold. However, at a total PSA of only 2.3, this marginal ratio does not carry the same weight as it would at a PSA of 6 or 10. It should be recorded for future tracking, and annual PSA monitoring is appropriate, but it does not require urgent investigation at this PSA level.","low_causes":"May indicate prostate cancer (lower ratio less favourable), though many other factors affect this","high_causes":"Benign prostatic hyperplasia (higher ratio more favourable)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"c19","name":"CA 19-9","group":"TUMOR MARKERS","result":"46.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6306","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3378","units":"U/mL","description":"CA 19-9 is a protein that can be elevated in cancers of the pancreas, bile ducts and bowel, but it is not specific to cancer. It is also raised by benign conditions including bile duct inflammation, liver disease, pancreatitis and cholestasis. At 46.67 against an upper limit of 37, Guy's result is mildly elevated. Given his GGT of 212 indicating significant biliary and hepatic strain, the most likely explanation is that the CA 19-9 is being driven by biliary inflammation rather than by a malignancy. His CEA at 1.88 is normal, which is reassuring. However, this should be flagged to his GP, and a liver and pancreas ultrasound would provide further reassurance. The CA 19-9 should be repeated in three months after addressing alcohol and the GGT.","low_causes":"Generally not significant (some individuals cannot produce CA 19-9 due to Lewis blood group status)","high_causes":"Pancreatic cancer, bile duct cancer, cholangitis, liver disease, pancreatitis, bowel cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4087","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"ng/mL","description":"Carcinoembryonic antigen is a tumour marker most commonly associated with bowel cancer but also found in cancers of the lung, breast, pancreas and liver. It can also be mildly elevated in smokers and in benign conditions. At 1.88, Guy's CEA is within the normal non-smoker range of below 2.3. This is a reassuring result and adds weight to the interpretation that the elevated CA 19-9 is benign in origin.","low_causes":"Generally not significant","high_causes":"Bowel cancer, lung cancer, pancreatic cancer, liver disease, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4982","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.6140","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immune memory against infections. At 11.2, Guy's IgG is within the laboratory range and sits in the middle of the range, indicating a healthy and functional adaptive immune system.","low_causes":"Immune deficiency, immunosuppressive medications, chronic illness","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. At 0.6, Guy's result is within the laboratory range but at the lower boundary of the optimal zone. This is within normal limits and not a concern.","low_causes":"Immune deficiency, immunosuppressive treatment","high_causes":"Acute infection, autoimmune disease, lymphoma, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5054","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, lungs and urinary tract. At 2.0, Guy's IgA is within the laboratory range. A normal IgA also validates the coeliac screen (TTG IgA), which requires adequate IgA to be reliable. The negative coeliac screen is therefore trustworthy.","low_causes":"Selective IgA deficiency (most common immune deficiency), immunosuppression","high_causes":"Liver disease, chronic infection, autoimmune disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0305","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2500","units":"IU/mL","description":"IgE is the antibody involved in allergic responses and parasitic defence. At 6.1, Guy's IgE is very low, indicating no significant allergic tendency. This argues against allergy as the explanation for the marginally elevated eosinophils.","low_causes":"Generally not significant","high_causes":"Allergies, asthma, eczema, parasitic infections, drug reactions, some immune disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"<4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1449","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"IU/mL","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. At below 4, Guy's result is negative, ruling out rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"No autoimmune rheumatic disease","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the small intestine lining. Guy's result is negative at 0.272, well below the positive threshold of 8.8. Combined with a normal IgA level, this reliably excludes coeliac disease as a cause of his bloating and digestive symptoms.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4071","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found in muscle cells. When muscle is damaged, CK leaks into the blood. At 102, Guy's CK is within the optimal range, confirming no significant muscle damage from exercise or other causes.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin use, hypothyroidism, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"392","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5202","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5822","units":"nmol/L","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. At 392, Guy's cortisol is within the optimal range for a morning sample, indicating normal adrenal function and an appropriate stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid medication, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"119","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4073","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0.1369","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, produced in men by the conversion of testosterone in fat tissue and the adrenal glands. At 119, Guy's oestradiol is within range. In men, oestradiol levels that are too high relative to testosterone can contribute to fat deposition and reduced muscle mass. His oestradiol is within a reasonable range but is notably high relative to his low testosterone of 9.7, which could be contributing to his difficulty losing weight.","low_causes":"Low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity, excess body fat, liver disease, medications, aromatase activity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"1.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4575","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"nmol/L","description":"Progesterone in men plays a minor role in modulating mood, sleep and brain function. At 1.27, Guy's progesterone is within the optimal range. This is a normal finding.","low_causes":"Generally not significant in men","high_causes":"Adrenal tumours, congenital adrenal hyperplasia (rare in this context)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"14.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7846","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6090","units":"mIU/mL","description":"Luteinising hormone is produced by the pituitary gland and signals the testes to produce testosterone. At 14.08, Guy's LH is well above the upper limit of 9.3. When LH is elevated alongside a low-normal testosterone, it means the pituitary is sending a louder signal because the testes are not responding as effectively. This pattern, known as primary hypogonadism, is a normal age-related finding and reflects gradual testicular decline. It may be contributing to his fatigue and difficulty losing weight.","low_causes":"Pituitary disease, steroid use, severe illness, obesity","high_causes":"Primary hypogonadism (testicular failure), ageing, Klinefelter syndrome, chemotherapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"33.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5345","units":"mIU/mL","description":"FSH is produced by the pituitary gland and in men supports sperm production. At 33.96, Guy's FSH is significantly above the upper limit of 18.1. Elevated FSH alongside elevated LH and low testosterone confirms the primary hypogonadism pattern. The very high FSH in particular indicates that the testes are significantly underperforming relative to the pituitary's demand, which is expected at 61","units":"uIU/mL","description":"Prolactin is a pituitary hormone primarily associated with milk production in women but also plays a role in immune function and reproductive health in men. At 149, Guy's prolactin is within the optimal range, ruling out a prolactin-secreting pituitary tumour (prolactinoma) as a cause of the low testosterone.","low_causes":"Dopamine agonist medications, pituitary damage","high_causes":"Prolactinoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically available by dividing total testosterone by SHBG. At 25, Guy's FAI is below the lower limit of 30, indicating that a low proportion of his already-low testosterone is available for use by the tissues. This compounds the effect of the low total testosterone and is consistent with the primary hypogonadism pattern.","low_causes":"Low testosterone, high SHBG, ageing, liver disease","high_causes":"Steroid use, low SHBG, polycystic conditions (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3466","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4537","upper_optimal_position":"0.5170","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. At 1.0 umol/L (approximately 369 ug/dL), Guy's result is within the laboratory range but below the optimal zone of 2 to 8. The low DHEA-S is consistent with his age of 74 and the broader picture of declining androgen production.","low_causes":"Ageing (most common cause), adrenal insufficiency, chronic illness, medications","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, polycystic ovarian syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"38.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3852","upper_optimal_position":"0.5785","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, controlling how much of each is free and biologically active. At 38.8, Guy's SHBG is within the optimal range of 25 to 55. A mid-range SHBG with low testosterone means the problem is production rather than excessive binding.","low_causes":"Insulin resistance, obesity, hypothyroidism, steroid use","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.181","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3519","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3959","upper_optimal_position":"0.5788","units":"nmol/L","description":"Calculated free testosterone estimates the amount of testosterone that is not bound function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>

      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
