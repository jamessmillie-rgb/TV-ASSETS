<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Jake James Wood","dob":"11/08/1992","report_date":"2026-09-30","summary":"Jake is a 34-year-old male presenting with a BMI of 24.0, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are larger than average (volume 7 out of 10). He trains twice a week with cardio at moderate intensity and does no resistance training, averaging 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but wakes tired most mornings and feels wired at night, with stress feeling hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week. He takes no medications and supplements vitamin D and vitamin B12. His family history includes bowel, breast, prostate or ovarian cancer and osteoporosis. He has not had a previous blood test. He reports low mood and anxiety, bloating and digestive discomfort, poor sleep and insomnia, and palpitations or dizziness. His goals are to improve mood, prevent disease and improve sleep quality. He also describes continually producing and swallowing excessive saliva, to the point of nausea, with occasional regurgitation, and believes the frequent swallowing is causing chest pain from trapped air. He has seen his GP about both the excessive saliva and the chest pain and been told there is nothing to be done.\n\nThe single most important finding in this report is Jake's lipoprotein(a), and it needs to go on his permanent medical record. Lipoprotein(a), written Lp(a), is a particle in the blood that carries cholesterol into artery walls and encourages both plaque formation and clotting. It is entirely inherited, set by genetics, and no diet, exercise or lifestyle change will move it. Jake's Lp(a) is 170 nmol/L, well above the 32 nmol/L threshold and sitting in the moderate-to-high risk band. This is not something that has gone wrong with his health; it is something he was born with, and the reason it matters is that it has been quietly adding to his cardiovascular risk since birth. Because it is genetic, his first-degree relatives, parents, siblings, and eventually children, should also be tested. His GP should record this permanently and factor it into every future cardiovascular risk assessment. The good news is that knowing about it at 34 is genuinely valuable, because it means every modifiable risk factor can be optimised now, and the next few decades of prevention become far more powerful than they would be if this were discovered at 55.\n\nThat Lp(a) finding also changes how we read the rest of the lipid panel. Jake's ApoB is 1.04 g/L, above the 0.9 threshold, and his LDL cholesterol is 2.64 mmol/L, which is within the laboratory range but above the ideal of 2.0. ApoB, apolipoprotein B, is a direct count of the number of cholesterol-carrying particles in the blood, and it is the single best predictor of plaque formation because each ApoB particle can enter an artery wall. However, Lp(a) itself is an ApoB-containing particle, so a chunk of Jake's ApoB count is coming from lipoprotein(a) rather than from ordinary LDL. His Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a), comes down to 2.09 mmol/L, much closer to the ideal target of under 2.0. This is genuinely useful information: it means the modifiable part of his LDL is only marginally above optimal, and a relatively small dietary shift could bring it under 2.0. The non-modifiable portion, carried by Lp(a), is the part his GP may eventually want to address with medication, particularly as Lp(a)-lowering therapies are now in late-stage trials. His TrueVitals Cardiovascular Risk Score is 75 out of 100, which is high, and the two inputs driving it are the Lp(a) and the ApoB. This score has no age term, so it measures the risk being built in the arteries right now rather than predicting a ten-year event probability. At 34, Jake's ten-year risk of a cardiovascular event is still low, but the gap between a low ten-year risk and a high building-risk score is exactly the window he has to act in.\n\nBalancing that, there is a great deal to feel positive about. Jake's total cholesterol is 4.5 mmol/L, comfortably within the desirable range. His triglycerides are 0.84 mmol/L, which is excellent, sitting below the optimal threshold of 1.0. His HDL cholesterol is 1.5 mmol/L, just below the optimal threshold of 1.55 for a male but a perfectly healthy level, and his apolipoprotein A1 is 1.53 g/L, above the 1.20 minimum, meaning his protective cholesterol pathway is working well. His ApoB to A1 ratio is 0.68, just inside the lower-risk threshold of 0.7, which, given the Lp(a) load, is a reassuring sign that the balance between harmful and protective particles is being held. His TG to HDL ratio is 0.56, well inside the optimal band, and his remnant cholesterol is 0.36, also optimal. These numbers tell us that Jake's metabolism is handling fats efficiently; the problem is not metabolic, it is genetic.\n\nHis blood sugar control is excellent. Fasting glucose is 4.4 mmol/L, right in the ideal range, and HbA1c is 39 mmol/mol, which represents the average blood sugar over the last three months and is comfortably within the normal band though just above the optimal threshold of 36. Fasting insulin is 3.21 mIU/L, which is low-normal and reflects good insulin sensitivity. His HOMA-IR, a calculated index of insulin resistance, is 0.63, which is optimal and means his cells are responding efficiently to insulin with very little needed to clear glucose from the blood. His C-peptide, a marker produced by the pancreas in equal amounts to insulin and used to confirm how much insulin the body is actually making, came back at 0.418 ug/L, which converts to approximately 138 pmol/L, below the laboratory range of 1.1 to 4.4 ug/L. However, C-peptide degrades in blood samples that are not separated quickly, and the lab has flagged that samples not centrifuged within four hours can lose up to 56 percent of their C-peptide concentration. Given that Jake's fasting glucose, HbA1c and HOMA-IR are all healthy, the most likely explanation is sample degradation rather than genuine pancreatic underperformance. This does not need action, but if a future test were to show C-peptide low again with all other sugar markers normal, the sample handling should be confirmed.\n\nJake's liver is in excellent health. ALT is 29 IU/L, just under the optimal male threshold of 30. AST is 28 IU/L, GGT is 23 IU/L, which is well inside the optimal band of under 25, and alkaline phosphatase is 55 IU/L. Bilirubin is 10 umol/L, perfectly mid-range. His FIB-4 score, a fibrosis screening index that combines age, platelets, ALT and AST, is 0.43, well below the 1.45 threshold, meaning there is no sign of liver scarring. His APRI and NAFLD fibrosis scores confirm the same picture. Amylase and lipase, which measure pancreatic function, are both mid-range and healthy. For someone reporting bloating and digestive discomfort, it is reassuring that the pancreas and liver are not contributing.\n\nKidney function is good. His creatinine is 80 umol/L and his cystatin C is 1.08 mg/L, just inside the upper limit of 1.1. Cystatin C is a protein filtered by the kidneys that is less affected by muscle mass than creatinine, making it a more reliable marker in some people. His combined eGFR, which uses both creatinine and cystatin C, is 93 mL/min, above the optimal threshold of 90, meaning the kidneys are filtering well. Urea is 5.9 mmol/L, mid-range, and uric acid is 382 umol/L, which is within the laboratory range but above the optimal male upper limit of 380. At this margin the finding is trivial, but uric acid is worth keeping an eye on because it is associated with gout risk and cardiovascular inflammation when it rises further. Electrolytes are balanced: sodium 141, chloride 96, bicarbonate 24.2, all within range.\n\nHis thyroid is working very well. TSH, thyroid stimulating hormone, the signal from the brain that tells the thyroid how hard to work, is 1.04 mIU/L, right in the ideal range of 1.0 to 2.5. Free T4, the main hormone the thyroid produces, is 17.3 pmol/L, and free T3, the active form that cells actually use, is 5.8 pmol/L, both comfortably within their optimal bands. His FT3 to FT4 ratio is 0.335, indicating efficient conversion. Both thyroid antibodies, TPO and thyroglobulin, are negative, which, given his family history of thyroid disease, is a genuinely reassuring finding worth noting.\n\nHis full blood count is healthy. Haemoglobin is 155 g/L, right in the middle of the male range. Red cells, haematocrit, MCV, MCH and MCHC are all within range, with MCHC at 344 sitting just one point below the upper limit, which is normal variation. His white cell count is 6.97, with a healthy differential: neutrophils 3.87, lymphocytes 2.68, monocytes 0.33, eosinophils 0.04 and basophils 0.05, all within range. His NLR, the neutrophil to lymphocyte ratio which reflects immune balance and inflammation, is 1.44, sitting in the optimal band of 1.0 to 2.0. Platelets are 409, right at the top of the laboratory range of 150 to 410 but within it. MPV, the average size of platelets, is 9.6, also within range. ESR, erythrocyte sedimentation rate, a broad inflammation marker, is 4 mm/hour, well within the limit of under 12. His reticulocyte percentage is 0.93, healthy, but the absolute reticulocyte count is 46.5, marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and at this margin the finding is clinically insignificant, particularly as haemoglobin and all other red cell indices are perfectly normal; the marrow is producing enough red cells to maintain a healthy blood count.\n\nIron studies are balanced. Ferritin is 41 ng/mL, within the laboratory range but below the optimal male threshold of 50. Ferritin is the body's iron storage protein, and at 41 Jake is not iron-deficient but his stores are on the lower side, which can contribute to fatigue and reduced exercise recovery. Serum iron is 26.3 umol/L, transferrin is 2.96 g/L, iron binding capacity is 67.5 umol/L, and transferrin saturation is 35.4 percent, all healthy and within optimal ranges. The pattern suggests adequate iron intake and transport but slightly lean stores, likely because dietary iron is being used efficiently without building a large reserve.\n\nInflammation markers show a mixed picture. ESR at 4 is excellent. However, hs-CRP, high-sensitivity C-reactive protein, a marker of low-grade systemic inflammation, is 3.3 mg/L, above the optimal threshold of 1.0. The laboratory range runs to 5.0 and Jake is within it, but for cardiovascular risk assessment, levels above 1.0 are considered elevated and levels above 3.0 are in the higher-risk category. In a 34-year-old with a healthy BMI of 24, a CRP of 3.3 is higher than expected and could reflect a minor infection or illness at the time of the blood draw, ongoing digestive inflammation (which would connect to his bloating symptoms), dental issues, or genuine low-grade systemic inflammation. Given his Lp(a) finding, CRP becomes more clinically relevant because inflammation accelerates the damage that Lp(a) does to artery walls. This is worth repeating on a fresh sample in three months to see whether it is a one-off or a persistent elevation.\n\nHis parathyroid hormone, PTH, is 0.2 pmol/L, well below the lower limit of 0.98. PTH is produced by the four small parathyroid glands behind the thyroid and its job is to regulate calcium and phosphate levels in the blood. When calcium drops, PTH rises to pull calcium from bones, increase absorption from the gut and reduce loss through the kidneys. Jake's corrected calcium is 2.36 mmol/L, perfectly mid-range, so the most likely explanation for the low PTH is that his calcium is comfortably maintained and the parathyroid glands have simply dialled down production because there is no need. His vitamin D is 82 nmol/L, which is sufficient and within the optimal band, and adequate vitamin D enhances calcium absorption from the gut, which further reduces the demand on PTH. The lab has noted that PTH results should be viewed with caution if not centrifuged and separated on the day of sampling, and PTH is known to degrade in unseparated samples. Given the normal calcium and healthy vitamin D, this is most likely a combination of genuinely low demand and some sample degradation. It does not need urgent action, but it would be worth mentioning to the GP so it can be repeated on a fresh, promptly processed sample if there is any concern, particularly given Jake's family history of osteoporosis, since PTH and calcium regulation are central to bone health.\n\nHis hormones are in good shape. Testosterone is 20.5 nmol/L, within the optimal band of 18 to 30, and free testosterone is 0.453 nmol/L, also within range. SHBG, sex hormone binding globulin, is 28.7 nmol/L, within range but towards the lower end, which is actually favourable because it means more testosterone is available to tissues rather than being bound up. His bioavailable testosterone is 11.56 nmol/L, above the upper limit of the reference range, confirming that a good proportion of his testosterone is reaching the cells that use it. Free androgen index is 71.4, healthy. Oestradiol is 77 pmol/L, within the male range of under 146. LH and FSH are both within range, confirming the pituitary-gonadal axis is functioning normally. DHEA-S is 7 umol/L (approximately 2,580 ug/dL), within range for his age. Prolactin is 101 uIU/mL, healthy. Cortisol is 141 nmol/L, which sits just below the morning reference range of 145 to 619, though the exact timing of the blood draw matters for cortisol and a marginally low reading is not significant on its own. However, the pattern of feeling wired at night and tired most mornings is consistent with a shifted cortisol rhythm, where cortisol that should peak on waking is instead peaking later in the day. This is a functional pattern driven by light exposure, screen time, irregular sleep-wake timing, and stress, and it is very likely contributing to Jake's sleep and mood complaints.\n\nVitamin D at 82 nmol/L is in the sufficient-to-optimal range, which is good, and his supplementation is clearly working. Vitamin B12 at 382 pg/mL is within the laboratory range but below the optimal threshold of 500. He is supplementing B12, so the form and dose may need reviewing; sublingual methylcobalamin at 1,000 mcg daily is better absorbed than standard oral tablets and should bring this into the optimal band. Folate is 17 ng/mL, right at the top of the laboratory range, which is excellent. Magnesium is 0.97 mmol/L, within the optimal band, which is a genuine positive given his sleep complaints because magnesium is involved in GABA production and nervous system relaxation.\n\nHis immune markers are healthy. IgG is 10.8 g/L, IgA is 2.6 g/L, and IgM is 0.5 g/L, right at the lower limit of the range but within it. IgE is 52 IU/mL, within the limit of 100, suggesting no significant allergic drive. Rheumatoid factor is below 4, negative, and tissue transglutaminase IgA is negative, which rules out coeliac disease as a cause of his bloating. This is useful information given his digestive symptoms.\n\nTotal antioxidant activity is 1.92 mmol/L, above the upper limit of 1.77. This marker measures the overall antioxidant capacity of the blood and can be pushed up by vitamin supplementation, dietary polyphenols, and high fruit and vegetable intake. Given Jake's 4 to 5 portions of fruit and vegetables daily and his vitamin D and B12 supplementation, this is the most likely explanation and is not a concern.\n\nProstate screening is excellent. PSA is 0.42 ng/mL, very low, with a free PSA ratio of 0.45, which is highly reassuring. Tumour markers CA19-9 and CEA are both below the detection limit, which is the best possible result. Given his family history of bowel and prostate cancer, these clean baselines are valuable reference points for future screening.\n\nCreatine kinase is 171 U/L, mid-range, reflecting normal muscle turnover. The urinalysis is entirely clean: no protein, no glucose, no blood, no white cells, no nitrites, no bacteria, no casts, and no growth on culture.\n\nTurning to Jake's symptoms, his bloating and digestive discomfort are not explained by the blood panel. Coeliac disease has been excluded by a negative tTG-IgA with a confirmed adequate IgA level. His pancreatic enzymes are normal. His liver is clean. The hs-CRP of 3.3 could reflect some digestive inflammation, but it is a non-specific marker. The most likely causes of his bloating sit outside what blood can measure: the excessive saliva production and air swallowing he describes, known medically as aerophagia, is itself a recognised cause of bloating, distension and chest discomfort from trapped gas. Food intolerances, particularly lactose or fructose, are common and would not show on any of these markers. A hydrogen breath test for lactose and fructose intolerance, or a trial elimination of common triggers such as dairy, onions, garlic, wheat and carbonated drinks, would be the next step. His GP could also consider whether the excessive saliva production, technically sialorrhoea, has a treatable cause such as gastro-oesophageal reflux, which itself drives both excess saliva (as a protective mechanism called water brash) and chest discomfort from oesophageal spasm or acid irritation. If his GP has not specifically investigated reflux as the underlying driver of both symptoms, that would be worth raising.\n\nHis low mood, anxiety, poor sleep and palpitations are similarly not explained by the blood results in a direct biochemical sense. His thyroid is optimal, his testosterone is healthy, his B12, folate, ferritin and vitamin D are adequate (though B12 and ferritin could both be higher), and there is no anaemia or blood sugar dysregulation. The pattern of feeling wired at night, tired on waking, and experiencing intermittent anxiety and palpitations is very consistent with a dysregulated cortisol rhythm and sympathetic nervous system activation, which is functional rather than pathological. The chest pain and palpitations he describes could be connected to the air swallowing (gastric distension can trigger vagal reflexes that cause palpitations), to anxiety-driven hyperventilation, or to both. The fact that his GP has found nothing structurally wrong with the heart is reassuring, and these results support that: his cardiac risk markers from a structural perspective are clean.\n\nJake's PhenoAge is a biological ageing estimate calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge should be interpreted in the context of his calendar age of 34. The markers feeding into it are largely healthy, with the CRP of 3.3 being the main input pulling the estimate in an unfavourable direction. Bringing CRP down with the lifestyle changes below and repeating the test would give a clearer baseline.\n\nProgesterone at 1.24 nmol/L is within the male range of 0.89 to 3.88 and is not clinically significant in men. His IgM at 0.5 sits right on the lower boundary of the range, which on its own does not indicate immune deficiency but is worth noting as a baseline.","links":"The thread that ties this report together is the lipoprotein(a) finding and what it means for every other cardiovascular marker Jake carries. Lp(a) is an inherited particle that deposits cholesterol in artery walls independently of LDL, and at 170 nmol/L it has been doing so since birth. It explains why his ApoB, at 1.04, is above the 0.9 target despite a total cholesterol of only 4.5 and triglycerides of 0.84: a significant portion of his ApoB-containing particles are Lp(a) rather than conventional LDL. When Lp(a)'s contribution is stripped out, his corrected LDL drops to 2.09, only marginally above the optimal 2.0 target, which means the modifiable portion of his cardiovascular risk is small and very achievable to address with dietary changes. The non-modifiable portion, the Lp(a) itself, is the reason his Cardiovascular Risk Score sits at 75 out of 100 despite otherwise excellent metabolic health.\n\nThe hs-CRP of 3.3 amplifies the Lp(a) risk because inflammation accelerates every stage of the atherosclerotic process, from initial endothelial damage to plaque instability. In isolation, a CRP of 3.3 at BMI 24 could be a transient finding, perhaps a mild infection at the time of the draw, but if it persists on retest, it becomes an additional modifiable target. Omega-3 fatty acids, regular exercise, sleep optimisation and weight maintenance all reduce CRP, and lowering it would reduce the speed at which Lp(a) contributes to arterial damage.\n\nSeparately, Jake's symptom cluster of bloating, excessive saliva, chest pain, palpitations, anxiety, wired-at-night insomnia, and morning fatigue forms its own coherent story, and the blood results largely exclude the serious causes. Coeliac disease is ruled out. Thyroid disease is excluded by an optimal TSH, healthy free hormones and negative antibodies, which is particularly reassuring given his family history. Anaemia and iron deficiency are excluded. Blood sugar is excellent. Testosterone is healthy. The symptoms point instead to a functional pattern: a likely gastro-oesophageal reflux or motility issue driving the saliva production, air swallowing, bloating and chest discomfort, combined with a shifted cortisol rhythm and sympathetic overdrive producing the wired-at-night, tired-on-waking, anxious, palpitating pattern. These two streams may even feed each other, since anxiety increases swallowing frequency and gut sensitivity, while gut discomfort and chest pain increase anxiety.\n\nThe low PTH with normal calcium is a loose end. The most probable explanation is low demand (calcium is healthy, vitamin D is adequate) compounded by sample degradation, but it should be confirmed on a fresh sample given the family history of osteoporosis. If PTH is genuinely suppressed with normal calcium, the causes are few and usually benign (excess calcium or vitamin D intake, or idiopathic), but it would need to be on record.\n\nFinally, ferritin at 41 and B12 at 382, while not deficient, are both below their optimal thresholds. Neither alone would cause noticeable symptoms, but suboptimal iron stores and suboptimal B12 together can contribute to fatigue, reduced exercise tolerance and mood, and both are easy to optimise with targeted supplementation and a small dietary adjustment.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, or tinned fish. Anchor: protein goes on the plate before anything else. Why: protein supports iron stores (ferritin at 41 is below the optimal 50), preserves muscle mass without resistance training, and blunts blood sugar spikes that feed the wired-at-night pattern.\nAdd two to three portions of oily fish per week: salmon, mackerel, sardines or anchovies, ideally replacing a red-meat or processed-meat meal. Anchor: a fish night on the same two or three days each week. Why: omega-3 fatty acids lower ApoB, reduce hs-CRP (currently 3.3), lower triglycerides (already good but the anti-inflammatory effect is the priority here), and directly reduce Lp(a)-driven arterial inflammation.\nAdd a source of soluble fibre to one meal a day: oats at breakfast, a handful of almonds, an apple, or a portion of beans or lentils at dinner. Anchor: whichever meal currently has the least fibre. Why: soluble fibre binds cholesterol in the gut and lowers LDL by 5 to 10 percent, which would bring Jake's modifiable LDL below the optimal 2.0 threshold.\nReduce sugary food from some days to once a week or less. Start by swapping the most frequent sugary item for a protein-based snack or a piece of fruit with nut butter. Why: frequent sugar spikes raise CRP and drive the insulin and cortisol swings behind the wired-at-night and afternoon energy patterns.\nBegin two sessions of resistance training per week, even 20 to 30 minutes of bodyweight exercises or dumbbells at home. Anchor: attach it to something already fixed in the week, such as before the two existing cardio sessions. Why: resistance training improves insulin sensitivity, raises HDL, lowers CRP, supports bone density (relevant given the family history of osteoporosis), and at zero current sessions, even two a week produces a large return.\nSet a fixed wake time seven days a week, within 30 minutes. Get outside or stand by a bright window within 30 minutes of waking. Anchor: alarm goes off, feet on floor, front door or window. Why: morning light resets the cortisol rhythm, which is the mechanism behind the wired-at-night and tired-on-waking pattern Jake describes. This single habit may do more for his sleep, mood and anxiety than anything else.\nCut all screens and bright overhead lights 60 to 90 minutes before bed. Replace with dim lighting, a book, or a podcast. Anchor: set a phone alarm 90 minutes before target bedtime and treat it as a firm boundary. Why: evening light suppresses melatonin and keeps cortisol elevated, maintaining the wired-at-night pattern.\nCalorie target: approximately 2,400 to 2,600 kcal per day (BMR of approximately 1,780 multiplied by an activity factor of 1.45 for light-to-moderate activity, adjusted slightly upward if resistance training is added). Protein target: 100 to 120 grams per day (1.3 to 1.6 g/kg at 76 kg). These targets maintain Jake's current healthy weight while supporting training, iron stores and B12 levels.","flags":"Lipoprotein(a) 170 nmol/L, well above the 32 nmol/L threshold, placing Jake in the moderate-to-high inherited cardiovascular risk category. This is genetic, permanent, and should be recorded on his medical record. First-degree relatives should be tested. The GP should factor this into every future cardiovascular risk assessment and discuss whether early lipid-lowering therapy is warranted given the combined Lp(a) and ApoB burden.\nApolipoprotein B 1.04 g/L, above the 0.9 threshold (borderline high by laboratory classification). However, a significant portion of the ApoB is carried by Lp(a) particles rather than conventional LDL. Lp(a)-corrected LDL is 2.09 mmol/L, close to the 2.0 optimal target. Dietary changes (soluble fibre, oily fish, reduced saturated fat) should bring the modifiable portion below target. If ApoB remains above 0.9 after three to six months of lifestyle optimisation, the GP may consider statin therapy, particularly in the context of the Lp(a).\nCardiovascular Risk Score 75 out of 100, driven primarily by Lp(a) and ApoB. This measures risk being built, not ten-year event probability. At 34 the ten-year risk remains low, but the building-risk score indicates the need for aggressive modifiable risk factor management.\nhs-CRP 3.3 mg/L, above the optimal threshold of 1.0 and above the higher-risk cardiovascular threshold of 3.0. At BMI 24, this is higher than expected and could be transient (minor infection at the time of the draw) or persistent. Should be repeated in three months. If persistent, investigate sources of chronic inflammation including dental health, gut inflammation, and sleep quality.\nPTH 0.2 pmol/L, below the lower limit of 0.98. Corrected calcium is 2.36 (normal) and vitamin D is 82 (sufficient). Most likely reflects low physiological demand and possible sample degradation, but should be confirmed on a fresh, promptly processed sample given the family history of osteoporosis.\nC-peptide 0.418 ug/L (approximately 138 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. Fasting glucose 4.4, HbA1c 39, and HOMA-IR 0.63 are all healthy, making genuine pancreatic underperformance very unlikely. The lab has flagged that delayed sample separation can degrade C-peptide by up to 56 percent. No action needed unless repeated on a confirmed fresh sample.\nFerritin 41 ng/mL, within the laboratory range but below the optimal male threshold of 50. Not deficient, but stores are lean and could contribute to fatigue and reduced exercise recovery. Dietary iron from red meat, dark leafy greens and pulses should be increased before considering supplementation.\nVitamin B12 382 pg/mL, within the laboratory range but below the optimal threshold of 500. Despite current supplementation, the level suggests the form or dose may need adjusting. Sublingual methylcobalamin 1,000 mcg daily is recommended.\nReticulocytes (absolute) 46.5 x10^9/L, marginally below the lower limit of 50. Haemoglobin and all red cell indices are normal. At this margin, the finding is not clinically significant and does not suggest a bone marrow problem.\nTotal Antioxidant Activity 1.92 mmol/L, above the upper limit of 1.77. Most likely driven by supplementation and high fruit and vegetable intake. Not a concern.\nReassuring negatives: thyroid function optimal with negative antibodies (particularly relevant given family history of thyroid disease), coeliac disease excluded (negative tTG-IgA with adequate IgA), PSA 0.42 with excellent free ratio (relevant given family history of cancer), CA19-9 and CEA undetectable, liver function excellent with FIB-4 0.43, kidney function healthy with combined eGFR 93, no anaemia, no diabetes or insulin resistance, testosterone optimal, urinalysis entirely clean, rheumatoid factor negative, IgE within range.","recommendations":"Record the Lp(a) of 170 nmol/L on Jake's permanent medical record and discuss whether early lipid-lowering therapy (statin or emerging Lp(a)-specific agents) is warranted given the combined Lp(a) and ApoB burden at age 34. Recommend Lp(a) testing for first-degree relatives.\nRepeat hs-CRP in three months on a day when Jake is otherwise well, to determine whether 3.3 mg/L is a transient or persistent elevation. If persistent, consider sources of chronic low-grade inflammation.\nRepeat PTH on a fresh, promptly centrifuged sample to confirm whether the 0.2 pmol/L reading is genuine or a sample artefact. If confirmed low with normal calcium, investigate for hypoparathyroidism, particularly given the family history of osteoporosis.\nDiscuss the excessive saliva production and chest pain with the GP specifically in the context of possible gastro-oesophageal reflux or a motility disorder. Water brash (reflex salivation in response to acid) is a recognised reflux symptom and could explain both the sialorrhoea and the chest discomfort. If not previously investigated, a trial of proton pump inhibitor therapy or referral for upper GI investigation may be appropriate.\nConsider a hydrogen breath test for lactose and fructose intolerance to investigate the bloating, given that coeliac disease has been excluded and pancreatic function is normal.\nIf the wired-at-night and tired-on-waking pattern does not improve with the sleep hygiene changes in this report within six to eight weeks, discuss with the GP whether a formal sleep study or cortisol day-curve would be appropriate.\nRetest in four to six months with: ApoB, LDL, hs-CRP, ferritin, B12, PTH, and C-peptide (on a confirmed promptly separated sample). Target: ApoB below 0.9, hs-CRP below 1.0, ferritin above 50, B12 above 500. Calorie target 2,400 to 2,600 kcal/day, protein target 100 to 120 g/day (1.3 to 1.6 g/kg).","supplementation":"Vitamin D3 (cholecalciferol): continue current supplementation at 2,000 IU daily, taken with a meal containing fat. His level of 82 nmol/L is in the sufficient range and supplementation is maintaining it well. Pair with vitamin K2 (MK-7) at 100 mcg daily to direct calcium into bones rather than arteries, which is particularly relevant given the family history of osteoporosis.\nVitamin K2 (MK-7): 100 mcg daily, taken at the same time as vitamin D3. Supports bone mineralisation and reduces arterial calcification.\nVitamin B12 (sublingual methylcobalamin): switch to 1,000 mcg daily, dissolved under the tongue. His current B12 of 382 pg/mL is below the optimal 500 despite supplementation, suggesting the current form or dose is not being well absorbed. Sublingual methylcobalamin bypasses the gut and is the most effective form.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 reduces hs-CRP (currently 3.3), lowers ApoB, reduces Lp(a)-driven arterial inflammation, and supports mood. Look for a product listing EPA and DHA content separately, aiming for at least 1,000 mg EPA and 500 mg DHA.\nMagnesium glycinate: 300 to 400 mg taken 30 to 60 minutes before bed. His magnesium at 0.97 is within the optimal range, but supplemental magnesium before bed supports GABA activity, nervous system relaxation and sleep onset, which directly addresses the wired-at-night pattern. Glycinate is the form least likely to cause digestive discomfort.\nDo not take iron supplements. Jake's ferritin at 41 is below optimal but not deficient, and his transferrin saturation is 35 percent, meaning iron transport is working efficiently. Increasing dietary iron from red meat, dark leafy greens and pulses twice a week is preferable to supplementation at this level. If ferritin has not risen above 50 on retest in four to six months, supplementation can be reconsidered.\nThe most important changes from this report are not supplements. They are recording the Lp(a) finding with his GP, adding oily fish and soluble fibre to lower the modifiable ApoB, and fixing the cortisol rhythm through consistent wake times, morning light and evening screen restriction to address the sleep, mood and anxiety symptoms that brought Jake to this test.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 56 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 56.3. Weakest systems: lipids & cardiovascular 26%, inflammation 29%, vitamins & nutrients 38%. Biggest drags: Lipoprotein(a), Apolipoprotein B, Parathyroid Hormone, C-Peptide.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"28.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3628","lower_normal":"","upper_normal":"39","lower_optimal":"","upper_optimal":"34","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4359","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the risk being built in the arteries, not a ten-year event probability. Jake's score of 75 is high, driven primarily by his Lp(a) of 170 nmol/L and ApoB of 1.04. At 34, his ten-year event risk remains low, but the building-risk score identifies the need for aggressive management of every modifiable factor. The gap between a low ten-year risk and a high building-risk score is the window for acting.","low_causes":"Optimal lipids, low inflammation, low Lp(a)","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. Jake's result of 4.4 mmol/L is right in the ideal range, confirming that his body is clearing sugar efficiently overnight. This is an excellent result and means diabetes and pre-diabetes are not present.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, steroid use, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3800","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c expressed as a percentage. Jake's 5.7% is within the normal range of under 6.0%, confirming healthy average blood sugar control over the past two to three months.","low_causes":"Low average blood sugar, anaemia variants","high_causes":"Pre-diabetes, diabetes, high sugar intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c (IFCC)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4861","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar over the past two to three months. Jake's result of 39 mmol/mol is within the normal range of under 42 but above the optimal threshold of 36. This is not pre-diabetes, but it suggests his average blood sugar is slightly higher than ideal, likely reflecting the sugary foods consumed on some days. Reducing sugar frequency and adding protein and fibre to meals should bring this into the optimal band.","low_causes":"Low average blood sugar, haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, diabetes, consistently high sugar intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3424","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3153","upper_optimal_position":"0.4131","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. Jake's result of 3.21 mIU/L is low-normal, meaning his pancreas barely needs to work to manage his blood sugar. This is a sign of excellent insulin sensitivity. It is within the optimal band for metabolic health.","low_causes":"Low carbohydrate diet, very high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, obesity, high sugar and refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.418","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1207","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is produced by the pancreas in equal amounts to insulin and is used to confirm how much insulin the body is actually making. Jake's result of 0.418 ug/L is below the laboratory range of 1.1 to 4.4. However, the laboratory has flagged that C-peptide degrades significantly in samples not separated within four hours, losing up to 56% of its concentration. Given that Jake's fasting glucose, HbA1c and HOMA-IR are all healthy, this low result is most likely a sample handling artefact rather than genuine pancreatic underperformance.","low_causes":"Sample degradation, low insulin demand, type 1 diabetes, very low carbohydrate diet","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3767","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index of insulin resistance derived from fasting glucose and fasting insulin. A lower score means better insulin sensitivity. Jake's result of 0.63 is optimal, confirming that his cells respond efficiently to insulin with very little needed to clear glucose from the blood. This is one of the strongest metabolic findings in the report.","low_causes":"Very high insulin sensitivity, low carbohydrate intake","high_causes":"Insulin resistance, obesity, high sugar intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is calculated from HbA1c and represents the average blood sugar level over the past two to three months. Jake's result of 6.5 mmol/L is within the normal range of under 7 but above the optimal threshold of 6.2, reflecting the same slightly above-ideal average blood sugar as his HbA1c of 39. This is not a concern but supports the recommendation to reduce sugary food frequency.","low_causes":"Low average blood sugar, very low carbohydrate diet","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4540","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4340","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol types in the blood. Jake's result of 4.5 mmol/L is within the desirable range of under 5.18 and within the optimal range. This overall number is healthy, but the breakdown of what makes up that total is more important than the total itself, and that is explored in the LDL, HDL and ApoB results below.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet, genetics, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2471","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary intake of sugar, alcohol and refined carbohydrates. Jake's result of 0.84 mmol/L is excellent, sitting well below the optimal threshold of 1.0. This confirms that his body is handling dietary fats efficiently and is not overproducing triglycerides from excess sugar or carbohydrate.","low_causes":"Very low fat diet, hyperthyroidism, malnutrition","high_causes":"High sugar intake, excess alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2436","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL is the cholesterol carried by very low-density lipoprotein particles, which transport triglycerides from the liver to tissues. Jake's result of 0.38 mmol/L is well within the healthy range and optimal band, consistent with his excellent triglyceride level.","low_causes":"Very low fat diet","high_causes":"High sugar intake, insulin resistance, excess alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5058","upper_optimal_position":"1","units":"mmol/L","description":"HDL is high-density lipoprotein, the 'protective' cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. Jake's result of 1.5 mmol/L is above the minimum healthy level of 1.04 but just below the optimal threshold of 1.4 for males (ideally above 1.55 for the desirable high-risk reduction category). This is a good level but could be improved. Regular exercise, particularly resistance training, and omega-3 intake are the most effective ways to raise HDL.","low_causes":"Sedentary lifestyle, obesity, smoking, high sugar diet, low fat diet","high_causes":"Regular exercise, moderate alcohol, genetics, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4413","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL is low-density lipoprotein, the primary carrier of cholesterol into artery walls. Jake's result of 2.64 mmol/L is within the laboratory range of under 3.0 but above the optimal target of under 2.6. In the context of his Lp(a) of 170, a portion of this LDL figure is carried by Lp(a) particles, which is why the Lp(a)-corrected LDL (2.09 mmol/L) is a better reflection of the modifiable risk. The dietary changes in this report should bring the modifiable portion below 2.0.","low_causes":"Low fat diet, hyperthyroidism, liver disease","high_causes":"High saturated fat intake, genetics, hypothyroidism, obesity, Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple measure of the balance between total and protective cholesterol. Jake's ratio of 3.0 is well within the ideal range of under 4.5 and within the optimal band, indicating a healthy balance.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"33.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"20","upper_normal":"100","lower_optimal":"28","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5100","upper_optimal_position":"1","units":"%","description":"This shows what percentage of total cholesterol is made up of the protective HDL. Jake's 33.3% is well above the 20% minimum, meaning a healthy proportion of his cholesterol is the protective type.","low_causes":"Low HDL, very high LDL","high_causes":"Very high HDL relative to total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is everything except the protective HDL: it includes LDL, VLDL and Lp(a)-carried cholesterol. Jake's result of 3.0 mmol/L is within the laboratory range of under 4.0 but above the optimal target of 2.6. The Lp(a) is contributing to this figure, and the modifiable portion is smaller than the headline number suggests.","low_causes":"Very low cholesterol diet, hyperthyroidism","high_causes":"High saturated fat intake, genetics, Lp(a), obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5102","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5033","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and reflects the functional capacity of the protective cholesterol system. Jake's result of 1.53 g/L is above the 1.20 minimum and within the optimal range, confirming his HDL particles are plentiful and functional.","low_causes":"Sedentary lifestyle, smoking, obesity, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is a direct count of atherogenic (artery-damaging) particles in the blood. Each LDL particle, each VLDL particle and each Lp(a) particle carries one ApoB molecule, so this number tells you how many particles are available to enter artery walls. Jake's result of 1.04 g/L is above the 0.9 threshold and classified as borderline high. However, a meaningful portion of his ApoB count comes from Lp(a) particles (170 nmol/L), which are inherited and not modifiable by diet. The dietary changes in this report, particularly soluble fibre and oily fish, target the conventional LDL-ApoB portion. If ApoB remains above 0.9 after lifestyle optimisation, medication may be appropriate given the Lp(a) context.","low_causes":"Low fat diet, hyperthyroidism, statin use","high_causes":"High saturated fat intake, genetics, Lp(a), hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3778","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to A1 ratio compares the number of harmful cholesterol particles to protective ones. Jake's result of 0.68 is just inside the lower-risk threshold of under 0.7. Given the Lp(a) burden inflating his ApoB, the fact that the ratio remains in the lower-risk category is a positive sign that his protective ApoA1 is providing meaningful balance.","low_causes":"High HDL, low LDL, exercise","high_causes":"High LDL, low HDL, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"170.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"2.6631","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined particle that carries cholesterol into artery walls and promotes both plaque formation and blood clotting. It is entirely inherited, cannot be changed by diet, exercise or lifestyle, and remains essentially constant throughout life. Jake's result of 170.44 nmol/L is well above the 32 nmol/L threshold, placing him in the moderate-to-high risk category. This is the most important finding in the report. It should be recorded permanently on his medical records and factored into every future cardiovascular risk assessment. First-degree relatives (parents, siblings) should also be tested. While no approved medication specifically lowers Lp(a) at present, therapies are in advanced clinical trials, and knowing this number at 34 gives Jake decades to optimise every modifiable risk factor.","low_causes":"Gen // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
