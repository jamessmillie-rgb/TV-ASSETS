e months, this gives a rolling average of blood sugar control over that period. Lee's HbA1c at 5.6% is within the normal range of under 6.0% and within the optimal zone. This confirms good blood sugar management over the past three months.","low_causes":"Low blood sugar, shortened red cell lifespan, blood loss","high_causes":"Pre-diabetes, diabetes, iron deficiency, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol rather than percentage. Lee's result of 38 mmol/mol is within the normal range of under 42 but above the optimal threshold of 36. On a carnivore or very low-carb diet, this mild elevation can reflect physiological insulin resistance, a normal adaptation where muscles preferentially burn fat and become temporarily less responsive to insulin to preserve glucose for the brain. This is distinct from pathological insulin resistance and, in the context of his excellent triglycerides, low insulin, and lean body composition, is not a concern.","low_causes":"Low blood sugar, shortened red cell lifespan","high_causes":"Pre-diabetes, diabetes, iron deficiency, physiological insulin resistance on low-carb diets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2531","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5757","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is releasing in the fasted state. It is one of the earliest markers of metabolic health because insulin rises long before blood sugar goes out of range. Lower fasting insulin indicates better insulin sensitivity. Lee's insulin at 1.82 mIU/L is below the laboratory range of 2.6 to 24.9, but this is expected and indeed positive on a carnivore diet with minimal carbohydrate intake. The pancreas simply does not need to produce much insulin when carbohydrate intake is very low. This is not a sign of pancreatic insufficiency; it is a sign of low insulin demand.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, lean body composition, prolonged fasting","high_causes":"Insulin resistance, metabolic syndrome, obesity, excess carbohydrate intake, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.605","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2590","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-peptide is released by the pancreas in equal amounts to insulin. Because it is not cleared by the liver (unlike insulin), it gives a more accurate picture of how much insulin the pancreas is actually producing. Lee's C-peptide at 0.605 ug/L (approximately 200 pmol/L) is below the laboratory range of 1.1 to 4.4 ug/L. Like his low insulin, this reflects low demand rather than failing supply. The pancreas is producing exactly as much insulin as is needed for his very low carbohydrate intake. His normal HbA1c confirms that blood sugar control is not being compromised.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, metabolic syndrome, insulinoma, type 2 diabetes (early)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"36.40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2400","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6111","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) is a calculated index that estimates how well the insulin-producing beta cells in the pancreas are working. The formula uses fasting insulin and fasting glucose. Lee's HOMA-B of 36.4 is below the reference range of 80 to 200, but this is a mathematical inevitability of his very low fasting insulin on a carnivore diet. The calculation assumes a standard mixed diet. When carbohydrate intake is minimal, insulin output drops by design and the HOMA-B formula interprets this as reduced beta-cell function when it is actually reduced beta-cell demand. His normal HbA1c confirms the pancreas is meeting its reduced workload comfortably.","low_causes":"Very low carbohydrate diet, very high insulin sensitivity, late-stage type 1 diabetes","high_causes":"Insulin resistance (compensatory overproduction), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1600","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is one of the most important cardiovascular risk markers because chronic low-grade inflammation drives atherosclerosis. A level below 1.0 mg/L is considered optimal for cardiovascular risk. Lee's hs-CRP at 1.6 mg/L is within the laboratory range of under 5 but above the optimal threshold of 1.0. In someone training at ultra-running volumes with five or more cardio sessions per week, a mildly elevated CRP most likely reflects the chronic low-grade inflammatory response to repeated intense exercise rather than any metabolic or cardiovascular concern. It may also be mildly influenced by his high Lp(a), which itself drives inflammation. Ensuring adequate recovery between sessions could help bring this down.","low_causes":"Low systemic inflammation, excellent recovery, anti-inflammatory diet","high_causes":"Intense exercise, infection, chronic disease, obesity, cardiovascular risk, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation, because inflammatory proteins cause red cells to clump together and fall more quickly. Lee's ESR at 12 mm/hour sits right at the upper limit of the laboratory range. Like his hs-CRP, this likely reflects the chronic low-grade inflammation associated with his very high training volume rather than any specific disease process.","low_causes":"Low inflammation, polycythaemia","high_causes":"Infection, inflammation, intense exercise, anaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"INFLAMMATION","result":"0.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3233","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is calculated by dividing the neutrophil count by the lymphocyte count. It is a simple but powerful marker of systemic inflammation and immune balance. A higher ratio suggests more active inflammation or physiological stress. Lee's NLR at 0.98 is just below the lower boundary of the reference range but effectively within the optimal zone of 1 to 2. This low ratio indicates minimal systemic inflammation and a well-balanced immune response.","low_causes":"Low neutrophils, high lymphocytes, excellent anti-inflammatory state","high_causes":"Infection, stress, chronic inflammation, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Sodium is the body's primary electrolyte for regulating fluid balance and blood pressure. The kidneys tightly control sodium levels. Lee's sodium at 143 mmol/L is within range and within the optimal band, indicating healthy fluid balance and kidney regulation.","low_causes":"Overhydration, heart failure, kidney disease, adrenal insufficiency, diuretics","high_causes":"Dehydration, excessive sodium intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is critical for nerve signalling, muscle contraction, and heart rhythm. Both high and low levels can be dangerous. Lee's potassium at 4.5 mmol/L is within range and within the optimal band, indicating healthy potassium balance.","low_causes":"Diuretics, vomiting, diarrhoea, low dietary intake, intense sweating","high_causes":"Kidney disease, ACE inhibitors, sample haemolysis, excessive intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. Lee's chloride at 101 mmol/L is within range and within the optimal band.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3970","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's main acid buffer, maintaining blood pH within a very narrow range. It is regulated by the kidneys. Lee's bicarbonate at 20.7 mmol/L is within the laboratory range but at the lower end, just below the optimal band of 22 to 28. On a carnivore or high-protein diet, the body generates more acid from protein metabolism, and bicarbonate is consumed in buffering this acid load. This is a common finding on high-protein diets and is not a concern at this level.","low_causes":"Metabolic acidosis, high-protein diet, intense exercise, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"25.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8917","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is calculated from the major electrolytes: (sodium + potassium) minus (chloride + bicarbonate). It estimates the unmeasured anions in the blood and is used to investigate metabolic acidosis. Lee's anion gap of 25.8 is above the reference range of 8 to 16. However, this calculation is influenced by albumin (unmeasured anions include albumin) and by the low bicarbonate seen on high-protein diets. On a carnivore diet, the combination of lower bicarbonate (used for acid buffering) and normal to high albumin commonly produces an elevated calculated anion gap without any pathological significance. His kidney function is excellent and his electrolytes are otherwise balanced, so this is most likely a dietary artefact rather than a clinical concern.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Metabolic acidosis, ketoacidosis, lactic acidosis, renal failure, high-protein diet, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5836","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4211","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone health, nerve function, muscle contraction, and blood clotting. About 99% of the body's calcium is in bones, with the blood level tightly regulated by PTH and vitamin D. Lee's calcium at 2.51 mmol/L is within range and within the optimal band.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate picture of the physiologically active calcium in the blood. Lee's corrected calcium at 2.46 mmol/L is within range and within the optimal band, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3816","upper_optimal_position":"0.6034","units":"mmol/l","description":"Phosphate works alongside calcium in bone mineralisation and is critical for energy production (as part of ATP). Lee's phosphate at 1.2 mmol/L is within range and within the optimal band.","low_causes":"Vitamin D deficiency, hyperparathyroidism, refeeding syndrome, alcohol","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5690","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6264","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle function, nerve signalling, protein synthesis, and blood sugar control. It also plays a key role in sleep quality through its interaction with GABA receptors. Lee's serum magnesium at 0.94 mmol/L is within both the laboratory and optimal ranges. However, serum levels only reflect about 1% of total body magnesium (most is in bones and cells), so a normal blood level does not guarantee adequate intracellular stores, particularly in someone training at his volume. Supplementation is still recommended for its sleep and recovery benefits.","low_causes":"Intense exercise, sweating, alcohol, diuretics, poor dietary intake, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"305","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4206","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3211","upper_optimal_position":"0.5215","units":"umol/l","description":"Uric acid is the end product of purine metabolism. Purines come from dietary sources (especially red meat, organ meats, and shellfish) and from the body's own cell turnover. Lee's uric acid at 305 umol/L is within range and within the optimal band of 200 to 380. This is a reassuring result on a carnivore diet, as the high purine intake from red meat could be expected to push uric acid higher. His kidneys are clearly handling the purine load efficiently.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"High purine diet (red meat, organ meats), kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product produced by the liver when it breaks down protein. The kidneys filter it out of the blood and excrete it in urine. Lee's urea at 8.3 mmol/L is marginally above the upper limit of 8.2. On a carnivore diet with very high protein intake, this is entirely expected. Urea production is directly proportional to protein consumption: the more protein eaten, the more urea the liver produces. His kidney function markers (creatinine, Cystatin C, eGFR) are all healthy, confirming the kidneys are filtering well. This marginal elevation is dietary, not pathological.","low_causes":"Low-protein diet, liver disease, overhydration","high_causes":"High-protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism. The kidneys filter it out, and the blood level reflects kidney filtration efficiency. Lee's creatinine at 78 umol/L is within range and within the optimal band, indicating healthy kidney filtration.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) calculates how well the kidneys are filtering blood, based on the creatinine level adjusted for age, sex, and ethnicity. A value above 90 indicates normal kidney function. Lee's eGFR above 90 confirms healthy kidney filtration.","low_causes":"Chronic kidney disease, dehydration, medications, ageing","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4591","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/l","description":"Cystatin C is an alternative kidney function marker that is produced at a constant rate by all nucleated cells. Unlike creatinine, it is not affected by muscle mass, diet, or exercise, making it a more reliable measure of kidney function in athletes and those on high-protein diets. Lee's Cystatin C at 1.01 mg/L is within the laboratory range of under 1.1 and just above the optimal threshold. His calculated Cystatin C eGFR of 98 confirms excellent kidney function.","low_causes":"Very efficient kidney filtration","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR uses the Cystatin C level instead of creatinine to estimate kidney filtration rate. It is particularly valuable in athletes and those on high-protein diets where creatinine may not be reliable. Lee's Cystatin C eGFR of 98 confirms excellent kidney function, consistent with his creatinine-based eGFR of above 90.","low_causes":"Chronic kidney disease, ageing, medications","high_causes":"Excellent kidney function, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"159","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. It is one of the most important markers in the blood count. Lee's haemoglobin at 159 g/L is within both the laboratory range and the optimal band. For someone on TRT, which stimulates red blood cell production (erythropoiesis), this is a healthy level that confirms adequate oxygen-carrying capacity without the polycythaemia (excessive red cell production) that can sometimes occur with testosterone therapy.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, TRT/anabolic steroids, polycythaemia vera, altitude, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures the total number of red cells in the blood. Lee's count at 4.93 is within both the laboratory and optimal ranges, confirming healthy red cell production.","low_causes":"Anaemia (iron, B12, folate), blood loss, bone marrow disorders","high_causes":"Dehydration, TRT, polycythaemia, altitude, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.465","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"l/l","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. It is a key monitoring marker for men on TRT, as testosterone stimulates red cell production and can push haematocrit above 0.50, which increases blood viscosity and cardiovascular risk. Lee's haematocrit at 0.465 is within both the laboratory and optimal ranges, indicating his TRT dose is not causing excessive red cell production. This should continue to be monitored at each blood test.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, TRT, polycythaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"Red cell distribution width measures the variation in size of red blood cells. A wider spread can indicate mixed populations of cells, such as during iron deficiency or B12/folate deficiency. Lee's RDW at 14.3% is within both the laboratory and optimal ranges, confirming uniform red cell production.","low_causes":"Normal finding","high_causes":"Iron deficiency, B12/folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"94.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5204","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fl","description":"Mean corpuscular volume (MCV) measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. Lee's MCV at 94.2 fL is within both the laboratory and optimal ranges, confirming normal-sized red cells.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12/folate deficiency, alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"32.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6800","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin (MCH) measures the average amount of haemoglobin packed into each red blood cell. Lee's MCH at 32.2 pg is marginally above the upper limit of 32. This is a very minor finding that can be influenced by temperature and sample storage, as noted by the laboratory. It does not indicate any pathology at this margin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12/folate deficiency, macrocytosis, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"341","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6222","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"Mean corpuscular haemoglobin concentration (MCHC) measures the average concentration of haemoglobin within red blood cells. Lee's MCHC at 341 g/L is within both the laboratory and optimal ranges.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"195","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3910","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3962","upper_optimal_position":"0.5641","units":"x10^9/L","description":"Platelets are small cell fragments that are essential for blood clotting. Lee's platelet count at 195 is within both the laboratory and optimal ranges, indicating healthy clotting capacity.","low_causes":"Viral infections, bone marrow disorders, alcohol, autoimmune conditions, medications","high_causes":"Inflammation, infection, iron deficiency, surgery, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7600","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5778","units":"fL","description":"Mean platelet volume (MPV) measures the average size of platelets. Larger platelets are younger and more active. Lee's MPV at 10.9 fL is above the upper limit of 10.1. Mildly elevated MPV is commonly seen with intense physical training and is generally not clinically significant when the platelet count itself is normal. It indicates active platelet turnover, which is expected in someone with Lee's training volume.","low_causes":"Bone marrow suppression, aplastic anaemia, chemotherapy","high_causes":"Intense exercise, platelet activation, chronic inflammation, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Count","group":"HEMATOLOGY","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. Lee's WBC at 4.9 is within both the laboratory and optimal ranges, indicating a functional immune system. It sits in the lower half of range, which is common in lean, heavily training endurance athletes.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, intense training, caloric restriction","high_causes":"Infection, inflammation, stress, smoking, medications (steroids)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3533","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. Lee's neutrophils at 2.1 sit just above the lower limit of 2.0, within the laboratory range but below the optimal band of 2.5 to 5.5. In a 37-year-old ultra runner training at very high volume with a diet volume of only 5 out of 10, borderline neutrophils are commonly seen. The combination of intense exercise and potentially insufficient caloric intake can suppress neutrophil production as the body conserves resources. This is not dangerous at this level but fits a pattern worth addressing through increased food intake and better training periodisation.","low_causes":"Intense training, caloric restriction, viral infections, benign ethnic neutropenia, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes include T cells, B cells, and natural killer cells, which are responsible for adaptive immunity (targeted immune responses and memory). Lee's lymphocytes at 2.15 are within both the laboratory and optimal ranges, indicating healthy adaptive immune function.","low_causes":"HIV, immunosuppressive drugs, severe stress, intense training","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are large white blood cells that migrate into tissues and become macrophages, engulfing and destroying pathogens and debris. Lee's monocytes at 0.45 are within both the laboratory and optimal ranges.","low_causes":"Bone marrow disorders, severe infections","high_causes":"Chronic infection, inflammation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells that respond to parasitic infections and allergic reactions. Lee's eosinophils at 0.19 are within both the laboratory and optimal ranges, indicating no allergic or parasitic activity.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infections, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic and inflammatory responses. Lee's basophils at 0.01 are at the lower limit of range, which is a normal finding as basophils are typically present in very small numbers.","low_causes":"Normal finding, steroid use, acute allergic reaction (consumed into tissues)","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage reflects the proportion of circulating red cells that are immature. Lee's reticulocyte percentage of 0.75% is within range, though the absolute count (see below) is low, suggesting that while the proportion is normal, the actual number of new cells being produced is below expected.","low_causes":"Iron/B12/folate deficiency, chronic disease, bone marrow suppression, low energy availability","high_causes":"Blood loss, haemolysis, recovery from anaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"36.975","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2465","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells in the blood, rather than just the percentage. Lee's absolute reticulocyte count at 36.975 is below the laboratory range of 50 to 100. This means the bone marrow is producing fewer new red cells than expected. In the context of adequate haemoglobin (159 g/L), this is not an urgent concern as the body does not need to urgently replace red cells. However, combined with his borderline neutrophils and diet volume of only 5 out of 10, it may reflect a pattern of chronic low energy availability where the body is conserving resources. Suboptimal B12 (462, below the optimal of 500) and marginal folate could also be contributing factors, as both are essential cofactors for red cell production in the bone marrow.","low_causes":"Low energy availability, B12/folate deficiency, iron deficiency, chronic disease, bone marrow suppression","high_causes":"Blood loss, haemolysis, recovery from anaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"16.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4382","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6958","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, red blood cell production, mood, energy, and libido. Lee's testosterone at 16.7 nmol/L is within the laboratory range of 8.4 to 28.7 and above the recommended minimum of 12, but below the optimal band of 18 to 30. For someone on TRT whose goal is hormone optimisation, this suggests there may be room for his TRT prescriber to consider a modest dose adjustment. The suboptimal level may also be partly related to the chronic energy deficit suggested by his other markers; under-fuelling can blunt the response to exogenous testosterone.","low_causes":"Ageing, obesity, chronic illness, opioids, low energy availability, pituitary disorders","high_causes":"TRT, anabolic steroids, tumours, adrenal disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone","group":"HORMONES","result":"0.313","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4003","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.35","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4069","upper_optimal_position":"0.5253","units":"nmol/l","description":"Free testosterone is the small fraction (typically 2 to 3%) of total testosterone that is not bound to proteins and is therefore available to enter cells and exert its effects. Lee's free testosterone at 0.313 nmol/L is within the laboratory range but just below the optimal band of 0.35 to 0.70. This is consistent with his total testosterone sitting below optimal. His SHBG at 38.7 is healthy and not excessively binding testosterone, so the free level simply reflects the total level.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"TRT, anabolic steroids, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"38.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3848","upper_optimal_position":"0.6104","units":"nmol/l","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds testosterone and oestradiol, regulating how much of each hormone is available to tissues. Too-high SHBG reduces free testosterone, while too-low SHBG can indicate insulin resistance. Lee's SHBG at 38.7 nmol/L is within both the laboratory and optimal ranges, indicating healthy hormonal regulation.","low_causes":"Insulin resistance, obesity, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"43.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4430","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5000","units":"","description":"The free androgen index (FAI) is calculated as (total testosterone / SHBG) x 100. It provides a ratio-based estimate of free testosterone availability. Lee's FAI at 43.15 is within both the laboratory and optimal ranges.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, low SHBG, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2019","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4106","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen. In men, it is produced from testosterone via the aromatase enzyme and plays important roles in bone health, brain function, and cardiovascular protection. Too much can cause water retention and gynaecomastia; too little can impair bone density and mood. Lee's oestradiol at 59 pmol/L is within range and within the optimal band. For someone on TRT, this is a healthy level that confirms the aromatase conversion is proportionate and not excessive.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"High testosterone, obesity (more aromatase in fat tissue), liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4799","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3700","upper_optimal_position":"0.5700","units":"nmol/L","description":"Progesterone in men is produced by the adrenal glands and testes and plays a role in brain function, sleep, and as a precursor to other hormones. Lee's progesterone at 1.43 nmol/L is within both the laboratory and optimal ranges.","low_causes":"Adrenal fatigue, TRT-related suppression of testicular function","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"0.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0277","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4615","upper_optimal_position":"0.6154","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland in the brain and signals the testes to produce testosterone. Lee's LH at 0.26 mIU/ml is well below the laboratory range of 1.5 to 9.3. This is entirely expected and in fact confirms that his TRT is being properly absorbed. When the brain detects adequate testosterone from an external source, it shuts down its own signalling (LH and FSH) because stimulating the testes to make more would be redundant. Suppressed LH is a normal and expected finding on TRT and is not a concern.","low_causes":"TRT, anabolic steroids, pituitary disorders, hypothalamic suppression","high_causes":"Primary hypogonadism (testicular failure), post-menopause (women), PCOS (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0258","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5693","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and in men primarily stimulates sperm production in the testes. Lee's FSH at 0.43 mIU/ml is well below the laboratory range of 1.4 to 18.1. Like LH, this suppression is entirely expected on TRT. The pituitary has shut down FSH production because the external testosterone has removed the need for testicular stimulation. This means that sperm production will be significantly reduced while on TRT. If fertility is a future consideration, Lee should be aware that TRT suppresses spermatogenesis and discuss this with his prescriber.","low_causes":"TRT, anabolic steroids, pituitary disorders, hypothalamic suppression","high_causes":"Primary hypogonadism, testicular failure, ageing (men)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"254","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5448","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for its role in lactation, but in men it also influences immune function, mood, and reproductive health. Markedly elevated prolactin in men can suppress testosterone and libido. Lee's prolactin at 254 uIU/ml is within the laboratory range of 45 to 375 and within the normal zone. This is a healthy level.","low_causes":"Dopamine agonists, pituitary insufficiency","high_causes":"Pituitary adenoma, medications (antipsychotics, SSRIs), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"544","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4213","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4034","upper_optimal_position":"0.5703","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. In the morning, cortisol should peak (the cortisol awakening response) to provide energy and alertness, then decline through the day, reaching its lowest at bedtime to allow sleep. Lee's cortisol at 544 nmol/L is within the morning laboratory range of 145 to 619 but above the optimal band of 250 to 500. In someone reporting poor sleep and anxiety who is training at ultra-running volumes with five or more intense cardio sessions per week, an upper-range cortisol is significant. Chronic high-volume endurance training is one of the strongest drivers of sustained cortisol elevation. When cortisol stays elevated into the evening, it directly suppresses melatonin production and blocks the parasympathetic nervous system shift needed for sleep. This may be the most important modifiable contributor to Lee's sleep difficulties and mood symptoms.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disorders, chronic fatigue","high_causes":"Intense training, chronic stress, Cushing's syndrome, sleep deprivation, caloric restriction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4102","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4244","upper_optimal_position":"0.5688","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is the most abundant steroid hormone in the body, produced by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. Lee's DHEA-S at 3.5 umol/L (approximately 1,290 ug/dL) is within the laboratory range but just below the optimal band of 4.0 to 10.0. Given his adrenal glands are clearly producing cortisol robustly, a slightly lower DHEA-S may reflect the adrenal prioritisation of cortisol over DHEA-S that occurs under chronic stress or high training loads.","low_causes":"Ageing, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4602","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3773","upper_optimal_position":"0.4901","units":"mIU/l","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland and tells the thyroid how much hormone to make. A high TSH means the pituitary is working harder to stimulate an underperforming thyroid; a low TSH means the thyroid is producing too much. Lee's TSH at 2.5 mIU/L sits right at the upper edge of the optimal band of 1.0 to 2.5. His FT4 and FT3 are both comfortably within optimal ranges, and both thyroid antibodies are negative, so the thyroid is functioning well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disorders","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"19.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5607","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. Lee's FT4 at 19.1 pmol/L is comfortably within both the laboratory and optimal ranges, indicating healthy thyroid output.","low_causes":"Hypothyroidism, pituitary disorders, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5704","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that directly regulates metabolism, energy production, and body temperature. It is converted from T4 in tissues. Lee's FT3 at 5.8 pmol/L is within both the laboratory and optimal ranges, confirming excellent thyroid conversion and active hormone availability. This is one of the strongest positives in the hormone panel.","low_causes":"Hypothyroidism, low T4-to-T3 conversion, caloric restriction, chronic illness","high_causes":"Hyperthyroidism, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies target an enzyme involved in thyroid hormone production. Their presence indicates the immune system is attacking the thyroid, which is the hallmark of Hashimoto's thyroiditis. Lee's TPO antibodies at below 6.6 U/ml are well within the normal range of under 13.8, confirming no autoimmune thyroid activity.","low_causes":"Normal finding (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, their presence suggests autoimmune thyroid disease. Lee's result at below 1.3 U/ml is well within the normal range of under 4.4, which is the undetectable range that over 80% of the population falls into. This confirms no autoimmune thyroid activity.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"129","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. Lee's vitamin D at 129 nmol/L is excellent, well within the sufficient range and above the optimal band of 75 to 120. This level reflects good supplementation or significant sun exposure. Vitamin D at this level supports the strong calcium and phosphate levels seen elsewhere in his results.","low_causes":"Lack of sun exposure, low dietary intake, dark skin, obesity, malabsorption","high_causes":"Supplementation, sun exposure, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.304","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4194","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5593","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by four small glands behind the thyroid. It regulates calcium levels by signalling the bones to release calcium and the kidneys to retain it. Lee's PTH at 1.304 pmol/L is in the lower portion of the range, which is appropriate given his excellent vitamin D (129) and healthy calcium levels. When vitamin D and calcium are replete, the body does not need to produce much PTH.","low_causes":"Excellent vitamin D and calcium status, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"462","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4506","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4560","upper_optimal_position":"0.5956","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, DNA synthesis, and red blood cell production. Deficiency causes a range of symptoms including fatigue, tingling, brain fog, and anaemia. Lee's B12 at 462 pg/ml is within the laboratory range of 193 to 982 but below the optimal band of 500 to 900. On a carnivore diet rich in animal products (the best dietary source of B12), this level is lower than expected, which may suggest that absorption is not optimal. Supplementation with sublingual methylcobalamin (which bypasses gut absorption) is recommended to bring this into the optimal range.","low_causes":"Vegetarian/vegan diet, pernicious anaemia, low stomach acid, medications (metformin, PPIs), malabsorption","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in DNA synthesis and red blood cell production. It is essential for preventing neural tube defects in pregnancy and plays a role in homocysteine metabolism. Lee's folate at 9 ng/ml is within range and just inside the optimal band of 8 and above. However, on a carnivore diet that excludes the main dietary folate sources (leafy greens, legumes, fortified grains), this level is worth monitoring as it may decline over time. Supplementation with methylfolate is recommended as insurance.","low_causes":"Poor dietary intake (low vegetable/grain intake), alcohol, malabsorption, pregnancy, medications (methotrexate)","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles that leaks into the blood when muscle fibres are damaged. It rises after intense exercise, injury, or in muscle diseases. Lee's CK at 63 U/L is well within range and within the optimal band. For someone training at ultra-running volumes with two resistance sessions per week, this is an excellent result that indicates good muscular recovery and no excessive tissue breakdown.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statins, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_antioxidant","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5570","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3809","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals. Lee's result at 1.64 mmol/L is within both the laboratory and optimal ranges, indicating adequate antioxidant defence. For someone with a high training volume that generates significant oxidative stress, this is a reassuring finding.","low_causes":"Oxidative stress, poor dietary antioxidant intake, chronic inflammation, intense exercise","high_causes":"High antioxidant intake, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"14.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6035","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant antibody in the blood, providing long-term immunity against previously encountered infections. Lee's IgG at 14.2 g/L is within the laboratory range of 6.5 to 16, indicating a healthy adaptive immune memory.","low_causes":"Immunodeficiency, chronic lymphocytic leukaemia, medications","high_causes":"Chronic infection, autoimmune conditions, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody produced during an initial immune response to a new infection. Lee's IgM at 1.5 g/L is within the laboratory range, indicating a healthy initial immune response capacity.","low_causes":"Immunodeficiency, chronic lymphocytic leukaemia","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5914","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

  if(norm(dob.value)===norm(data.dob)){

    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
