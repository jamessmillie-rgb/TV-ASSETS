<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Lee Ivison","dob":"05/03/1989","report_date":"2026-09-14","summary":"Lee is a 37-year-old male presenting with a BMI of 23.3, following a carnivore diet rated 7 out of 10 for quality with a volume of 5 out of 10. He trains seven or more times per week, comprising five or more cardio sessions and two resistance sessions, with 10,000 to 15,000 daily steps. He is on testosterone replacement therapy (TRT), which he has used for two years. He describes very high-intensity exercise and ultra running as his primary training modality. He reports poor sleep and insomnia alongside low mood and anxiety. His goals are to improve long-term health and longevity, improve sleep quality, and balance hormones. He notes that he generally feels good, does not struggle with energy, and his main aim is to optimise his overall health.\n\nThe single most important finding in this report is Lee's lipoprotein(a), which at 198.56 nmol/L sits just below the high-risk threshold of 200 and well above the normal cut-off of 32. Lipoprotein(a), often written Lp(a), is a modified form of LDL cholesterol particle that is entirely genetically determined. It cannot be changed through diet, exercise, or any currently available supplement. It behaves like a particularly sticky LDL particle: it deposits cholesterol into artery walls, it encourages blood clot formation by interfering with fibrinolysis (the body's clot-dissolving system), and it drives local inflammation. This result is permanent information about Lee's cardiovascular biology and should be recorded in his medical notes for life. It also means that his first-degree relatives, parents, siblings, and any children, should be offered Lp(a) testing because it is inherited. Combined with his LDL of 3.48 (above the 3.0 upper limit) and his ApoB of 0.92 g/L (above the 0.9 desirable threshold), this creates a lipid profile that warrants a proper conversation with his GP about long-term cardiovascular risk management. The good news within the lipid panel is substantial. His HDL at 2.1 is excellent, his ApoA1 at 1.88 is strong, his triglycerides at 0.81 are very good, and his ApoB to ApoA1 ratio at 0.49 is well within the lower-risk zone below 0.7. His TC to HDL ratio of 2.81 is also favourable. This is the keto or carnivore paradox in action: the diet is producing an outstanding HDL and triglyceride profile but is lifting LDL and ApoB at the same time. With a normal Lp(a), this trade-off might be more debatable, but with an Lp(a) this high, the additional ApoB-carrying particles matter more because they compound a risk factor Lee cannot modify.\n\nHis CEA (carcinoembryonic antigen, a tumour marker used primarily to screen for bowel and other cancers) is 2.61 ng/ml, above the non-smoker upper limit of 2.3. This is a very marginal elevation and CEA can be raised by intense exercise, mild inflammation, and dietary factors. At this level it is not alarming, but it should be noted and repeated at next testing. If it trends upward, the GP should investigate further.\n\nTurning to the positives, and there are many. Lee's liver is in excellent health. His ALT at 18, AST at 22, and Gamma GT at 10 are all comfortably within range, and that GGT of 10 is about as clean as it gets. His FIB-4 score of 0.98 confirms no sign of fibrosis. His bilirubin, albumin, and total protein are all healthy. His kidney function is solid: Cystatin C of 1.01 gives a calculated eGFR of 98, and his creatinine-based eGFR is above 90. His urea at 8.3 is marginally above the 8.2 upper limit, which on a high-protein carnivore diet is entirely expected because urea is the end product of protein metabolism. This is not a kidney concern. His uric acid at 305 is well within range and within the optimal zone, which is reassuring on a meat-heavy diet as purines from animal protein can push uric acid up. His electrolytes are balanced, with sodium, potassium, chloride, and bicarbonate all within range. His calcium, corrected calcium, phosphate, and magnesium are all healthy, and his PTH (parathyroid hormone, the hormone that regulates calcium balance) at 1.304 is appropriately low given his strong calcium and excellent vitamin D. His vitamin D at 129 nmol/L is excellent, well within the optimal range of 75 to 120 and above. His thyroid panel is reassuring: TSH at 2.5 is at the top of the optimal band, FT4 at 19.1 is comfortably within the optimal range, FT3 at 5.8 is firmly in the optimal zone, and both thyroid antibodies are negative. His thyroid is converting well and working efficiently. His creatine kinase at 63 is well within range despite his heavy training load, suggesting good muscular recovery. His inflammatory marker hs-CRP at 1.6 is within the laboratory range of under 5 but above the optimal threshold of 1.0, which at his training volume likely reflects the chronic low-grade inflammation that comes with ultra-distance running rather than any metabolic concern. His ESR at 12 sits right at the upper limit of the range, which fits the same picture. His immune system markers, IgG, IgM, IgA, and IgE, are all healthy. His rheumatoid factor is negative and his tissue transglutaminase is negative, ruling out coeliac disease. His PSA at 1.02 is healthy and his free PSA ratio at 49% is very reassuring. His CA 19-9 at 13.81 is well within range. His total antioxidant activity at 1.64 is within range.\n\nLee's hormone panel tells the story of exogenous testosterone. His LH (luteinising hormone) at 0.26 and FSH (follicle stimulating hormone) at 0.43 are both well below range, which is entirely expected and in fact confirms that the TRT is being absorbed. When testosterone enters the bloodstream from an external source, the pituitary gland recognises the adequate testosterone level and stops sending the signals (LH and FSH) that would normally tell the testes to produce it. This is not a concern but rather confirmation that the therapy is working as intended. His total testosterone at 16.7 is within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30. For someone on TRT whose goal is to optimise hormone balance, there may be room to discuss a modest dose adjustment with his prescribing clinician. His free testosterone at 0.313 and free androgen index at 43.15 are both within range. His SHBG (sex hormone binding globulin, the protein that binds testosterone and reduces the amount available to tissues) at 38.7 is healthy and within the optimal band. His oestradiol at 59 is within range, and his progesterone at 1.43 is within range. His DHEA-S at 3.5 umol/L (equivalent to approximately 1,290 ug/dL) is within range. His prolactin at 254 is within range. His cortisol at 544 is within the morning reference range of 145 to 619 but sits in the upper portion. In the context of someone reporting poor sleep, anxiety, and low mood who is also training at very high intensity with ultra running, an elevated cortisol pattern is worth noting. Chronic high-volume endurance training is one of the most potent drivers of sustained cortisol elevation, and cortisol that stays elevated through the evening will directly impair sleep onset and sleep quality, which in turn worsens mood and anxiety. This may be the single most important modifiable factor behind Lee's two main symptoms.\n\nHis insulin at 1.82 mIU/L is below the laboratory range of 2.6 to 24.9 and his C-peptide at 0.605 ug/L (approximately 200 pmol/L) is below the range of 1.1 to 4.4 ug/L. On a carnivore diet with very low carbohydrate intake, this is expected physiology rather than pathology. The pancreas produces insulin in proportion to the glucose it needs to manage. When carbohydrate intake is minimal, insulin demand drops, and both insulin and C-peptide (a byproduct released in equal amounts when the pancreas makes insulin) fall accordingly. His fasting glucose is not separately reported but his HbA1c at 38 mmol/mol (5.6%) is within the normal range below 42, confirming adequate blood sugar control over the past three months. It sits just above the optimal threshold of 36, which on a carnivore diet can reflect physiological insulin resistance, a well-described adaptation where muscles preferentially burn fat and become temporarily less responsive to insulin to spare glucose for the brain. This is not the same as pathological insulin resistance and is not a concern in the context of his excellent triglycerides, low insulin, and lean body composition.\n\nHis full blood count is largely healthy. Haemoglobin at 159, red cell count at 4.93, and haematocrit at 0.465 are all within range and appropriate for someone on TRT, which stimulates red cell production. His white cell count at 4.9 is within range. His neutrophils at 2.1 sit right at the lower boundary, which combined with his very high training volume and diet volume of only 5 out of 10 may suggest the body is running on slightly lean fuel for the workload being asked of it. His absolute reticulocytes at 36.975 are below the range of 50 to 100. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count can indicate that the marrow is not being pushed hard to produce new cells, which in the context of adequate haemoglobin is not alarming, but alongside a borderline neutrophil count and a diet volume that may be insufficient for an ultra runner, it fits a pattern of the body conserving resources. His B12 at 462 is within the laboratory range but below the optimal band of 500 to 900. On a carnivore diet rich in animal products, B12 intake should be plentiful, so absorption rather than intake may be worth monitoring. His folate at 9 is within range and just above the optimal threshold of 8, but a carnivore diet is inherently low in folate because the main dietary sources are leafy greens, legumes, and fortified grains, none of which feature. Both B12 and folate feed into red cell production, and suboptimal levels of either could contribute to the low reticulocyte count.\n\nHis MCH (mean corpuscular haemoglobin, the average amount of haemoglobin packed into each red cell) at 32.2 is marginally above the upper limit of 32. His MPV (mean platelet volume, a measure of platelet size) at 10.9 is above the upper limit of 10.1. Both are marginal findings. A mildly elevated MPV can be seen with high training loads and is generally not clinically significant in isolation. His lipase at 70 is above the upper limit of 60. Lipase is a pancreatic enzyme that digests fat, and on a very high-fat carnivore diet the pancreas will upregulate its production. A result of 70 against a limit of 60 is a mild elevation that is most likely dietary in origin. If he experiences any upper abdominal pain, nausea, or discomfort after eating, this should be mentioned to his GP, but in the absence of symptoms it is likely benign.\n\nHis urinalysis is largely unremarkable. Protein, glucose, ketones, urobilinogen, and casts are all negative. Red blood cells are below 1, and nitrites are negative. White cells at 10 sit at the threshold of significance. The urine culture showed mixed growth reported as probable contamination. This does not require any action.","links":"Lee's results paint a picture of a lean, fit, and metabolically healthy 37-year-old whose main areas for attention are his inherited cardiovascular risk from Lp(a), the possibility that his training volume is outrunning his fuel intake, and a cortisol pattern that may be driving his sleep and mood symptoms.\n\nThe most important conversation to have is with his GP about his Lp(a) result of 198.56 nmol/L. He should bring this report and ask for the result to be recorded permanently in his medical notes. The GP should be aware that his LDL is 3.48 and ApoB is 0.92, both mildly above target, and that the combination of elevated Lp(a) with elevated ApoB creates a compounded cardiovascular risk that may warrant earlier intervention than the standard cholesterol guidelines would suggest. Lee should also ask the GP to facilitate Lp(a) testing for his parents, siblings, and any children, as this is a directly inherited trait. The European Atherosclerosis Society recommends that individuals with Lp(a) above 120 nmol/L be treated as having an additional major cardiovascular risk factor. At 198.56, Lee is well above that threshold.\n\nFrom a dietary perspective, the carnivore diet is producing excellent metabolic markers, outstanding triglycerides, strong HDL, excellent insulin sensitivity, and a clean liver, but it is also lifting LDL and ApoB. Given the Lp(a) result, it would be worth exploring whether Lee can modify the fat composition of his diet without abandoning the approach entirely. Prioritising fatty fish (salmon, mackerel, sardines) as a protein source at least three to four times per week would increase EPA and DHA intake, which helps reduce ApoB particle number and triglycerides and provides anti-inflammatory benefit for his training. Reducing intake of saturated fat from dairy fat, fatty cuts of beef, and processed meats in favour of leaner cuts supplemented with olive oil or avocado would be a pragmatic modification. Adding 5 to 10 grams of soluble fibre daily through psyllium husk supplementation could reduce LDL by 5 to 10% without requiring any plant foods in the diet itself.\n\nLee's diet volume of 5 out of 10 is a concern for someone training at his intensity. At 78 kg, 183 cm, and with his training load, his estimated maintenance calorie requirement is approximately 2,800 to 3,100 calories per day. For an ultra runner doing five or more cardio sessions plus two resistance sessions per week, this may even be conservative on heavy training days. A diet volume of 5 suggests he may be eating closer to 2,000 to 2,200 calories, which would create a chronic energy deficit. This deficit would explain the borderline neutrophil count, the low reticulocyte count, and potentially the suboptimal testosterone level despite being on TRT. The body responds to chronic under-fuelling by quietly downgrading functions it can survive without in the short term: immune surveillance, red cell turnover, and hormone optimisation. His protein target on a carnivore diet is likely being met easily, but he should aim for 125 to 155 grams per day (1.6 to 2.0 g per kg) and ensure total calories reach at least 2,800 on rest days and 3,000 to 3,200 on heavy training days.\n\nFor his sleep and mood concerns, the cortisol pattern is the most likely driver. Cortisol at 544 nmol/L in the morning is within the reference range but sits high, and chronic high-volume endurance training is one of the strongest stimuli for sustained cortisol output. When cortisol remains elevated into the evening, it directly antagonises melatonin production and prevents the nervous system from downshifting into parasympathetic (rest and digest) mode. Practical steps that could help: fix a consistent wake time seven days a week and get outside into natural light within 30 to 60 minutes of waking, as this anchors the cortisol rhythm and helps it drop appropriately in the evening. Cut all caffeine by 1pm at the latest. Keep the bedroom cool, ideally 16 to 18 degrees. Consider whether the total training volume can be periodised more deliberately, with genuine low-intensity recovery weeks built in every three to four weeks, rather than running at high volume continuously. Magnesium glycinate at 300 to 400 mg taken 30 to 60 minutes before bed may help with both sleep onset and the low mood, as magnesium supports GABA receptor function.\n\nFor the CEA result of 2.61, this should be repeated at next testing in six months. If it remains above 2.3 or rises further, the GP should consider further investigation. At this margin, it is most likely a benign finding related to training or diet.\n\nFor his B12 of 462, on a carnivore diet this is lower than expected given the high dietary intake, and supplementing with sublingual methylcobalamin at 1,000 mcg daily would be a simple way to optimise it. Folate at 9 is adequate but worth monitoring given the dietary pattern, and a methylfolate supplement at 400 to 800 mcg daily would provide insurance against the limited dietary folate on a carnivore approach.\n\nFor the testosterone level of 16.7, which is within the laboratory range but below the optimal band of 18 to 30, Lee should discuss this with his TRT prescriber. There may be room for a modest dose adjustment, though the prescriber will want to balance this against his haematocrit (currently 0.465, healthy but worth watching as TRT doses increase) and oestradiol levels.\n\nA retest in six months should include a full lipid panel with Lp(a) (to confirm the Lp(a) level, as this only needs confirming once), ApoB, a full blood count with reticulocytes, B12, folate, CEA, and cortisol. If dietary changes are made to address the lipid findings, the retest will show whether they are having an effect on ApoB.","flags":"CARDIOVASCULAR (GP DISCUSSION RECOMMENDED): Lp(a) 198.56 nmol/L (limit under 32). This is a genetically determined, non-modifiable cardiovascular risk factor sitting just below the high-risk threshold of 200. Should be recorded permanently in medical notes. First-degree relatives should be offered testing. LDL 3.48 mmol/L (limit 3.0) and ApoB 0.92 g/L (limit 0.9) are mildly elevated, and the combination with high Lp(a) compounds risk. The ApoB/A1 ratio of 0.49 and TC/HDL ratio of 2.81 are both favourable. GP should assess overall cardiovascular risk and consider whether early pharmacological intervention is appropriate given the Lp(a) level.\n\nTUMOUR MARKERS: CEA 2.61 ng/ml (non-smoker limit 2.3). Marginal elevation likely related to training or diet. Recommend repeat at next testing in six months. If trending upward, further investigation warranted.\n\nHORMONES (EXPECTED ON TRT): LH 0.26 mIU/ml (range 1.5 to 9.3) and FSH 0.43 mIU/ml (range 1.4 to 18.1) are both suppressed, which is the expected pituitary response to exogenous testosterone. Total testosterone 16.7 nmol/L is within range but below optimal (18 to 30); may warrant dose review with TRT prescriber.\n\nGLUCOSE AND INSULIN: Insulin 1.82 mIU/L (range 2.6 to 24.9) and C-peptide 0.605 ug/L (range 1.1 to 4.4) are both below range. In the context of a carnivore diet with minimal carbohydrate intake and a normal HbA1c of 38 mmol/mol, this reflects low insulin demand rather than pancreatic insufficiency.\n\nHAEMATOLOGY: Absolute reticulocytes 36.975 (range 50 to 100). Low in the context of adequate haemoglobin. May reflect chronic low energy availability or suboptimal B12/folate. MCH 32.2 pg (limit 32), marginal. MPV 10.9 fL (limit 10.1), mildly elevated, likely training-related.\n\nKIDNEY: Urea 8.3 mmol/L (limit 8.2). Marginal elevation consistent with high protein intake on a carnivore diet. Kidney function otherwise excellent (Cystatin C eGFR 98, creatinine eGFR above 90).\n\nPANCREATIC: Lipase 70 U/L (limit 60). Mild elevation likely reflecting high dietary fat intake on carnivore diet. No symptoms reported. Monitor at retest.\n\nReassuring negatives: Liver function entirely clean (ALT 18, GGT 10, FIB-4 0.98). Thyroid healthy with negative antibodies. PSA 1.02 with excellent free ratio of 49%. CA 19-9 within range. Rheumatoid factor negative. Coeliac screen negative. Kidney function excellent. Haemoglobin, haematocrit, and red cell count all healthy. Calcium, magnesium, phosphate, and vitamin D all optimal. No urinary abnormalities of concern.","recommendations":"1. Book a GP appointment to discuss the Lp(a) result of 198.56 nmol/L and have it recorded permanently in medical records. Bring this report.\n\n2. Arrange Lp(a) testing for first-degree relatives (parents, siblings, children) as this is an inherited trait.\n\n3. Increase total calorie intake to at least 2,800 calories on rest days and 3,000 to 3,200 on heavy training days to address potential chronic energy deficit.\n\n4. Maintain protein at 125 to 155 grams per day (1.6 to 2.0 g/kg).\n\n5. Shift dietary fat sources toward oily fish (salmon, mackerel, sardines) at least three to four times per week and reduce saturated fat from dairy and fatty red meat.\n\n6. Add 5 to 10 grams of psyllium husk daily for soluble fibre to help reduce LDL.\n\n7. Implement sleep optimisation: fixed wake time daily, outside light exposure within 60 minutes of waking, caffeine cut-off at 1pm, bedroom temperature 16 to 18 degrees.\n\n8. Build genuine recovery weeks into training every three to four weeks with reduced volume and intensity.\n\n9. Discuss testosterone dose optimisation with TRT prescriber given total testosterone of 16.7 (below optimal of 18 to 30).\n\n10. Supplement with sublingual methylcobalamin 1,000 mcg daily for B12 optimisation.\n\n11. Supplement with methylfolate 400 to 800 mcg daily to compensate for low dietary folate on carnivore diet.\n\n12. Supplement with magnesium glycinate 300 to 400 mg before bed for sleep and recovery.\n\n13. Supplement with omega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily.\n\n14. Retest in six months: full lipid panel with ApoB, Lp(a) (one-time confirmation), full blood count with reticulocytes, B12, folate, CEA, cortisol, and HbA1c.","supplementation":"Omega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with his largest meal. This directly supports ApoB reduction, provides anti-inflammatory benefit for his training recovery, and is one of the few interventions that has a modest effect on Lp(a)-associated risk through its impact on triglyceride metabolism and endothelial function.\n\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. His B12 at 462 is below the optimal range of 500 to 900 despite a meat-heavy diet, suggesting absorption may not be maximal. Sublingual delivery bypasses the gut and goes directly into the bloodstream.\n\nMethylfolate: 400 to 800 mcg daily (the active L-methylfolate form, not folic acid), taken in the morning with B12. Folate at 9 is adequate but marginal, and the carnivore diet provides almost no dietary folate. Folate works in partnership with B12 in red cell production, and optimising both may help bring his reticulocyte count back into range.\n\nMagnesium glycinate: 300 to 400 mg elemental magnesium, taken 30 to 60 minutes before bed. His serum magnesium at 0.94 is within the optimal range, but serum levels do not reflect intracellular stores and at his training volume magnesium turnover will be high. The glycinate form has the added benefit of supporting GABA activity in the brain, which promotes sleep onset and may help with his reported anxiety and low mood.\n\nVitamin D3: Lee's vitamin D at 129 nmol/L is excellent. He should continue whatever he is currently doing, whether that is supplementation or sun exposure. If he is supplementing, a maintenance dose of 2,000 IU daily with a fat-containing meal is appropriate. He should pair this with vitamin K2 (MK-7 form), 100 to 200 mcg daily, which directs calcium into bones rather than arteries, an important consideration given his cardiovascular risk profile.\n\nPsyllium husk: 5 to 10 grams daily, mixed into water and taken before a meal. This provides soluble fibre that binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more. It is one of the most evidence-based non-pharmacological interventions for LDL reduction, capable of a 5 to 10% decrease. Start at 5 grams and increase gradually to avoid digestive discomfort.\n\nDO NOT supplement with iron. Lee's ferritin at 262 and transferrin saturation at 45% are both in the upper portion of range. Additional iron would risk pushing him toward overload.\n\nThe most important changes from this report are not supplements. They are increasing total calorie intake to match his extraordinary training volume, shifting his fat sources toward oily fish and away from saturated fat to address ApoB in the context of his Lp(a), implementing deliberate recovery periods in his training to bring cortisol down, and having the GP conversation about long-term cardiovascular risk management.","biomarkers":[{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"45.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5651","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is currently loaded with iron. It gives a real-time snapshot of how much of the body's iron transport capacity is in use. Lee's result of 45.12% is within the laboratory range of 18 to 55% but above the optimal band of 25 to 40%. On a carnivore diet rich in haem iron, a transferrin saturation in the upper portion of range is expected. Combined with his ferritin of 262, this indicates robust iron stores. It does not currently suggest iron overload, but both markers should be monitored at future testing and Lee should avoid iron supplements.","low_causes":"Iron deficiency, chronic disease, poor dietary iron intake, blood loss","high_causes":"Iron overload, haemochromatosis, excessive iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"24.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5559","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6146","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside transferrin saturation and ferritin rather than in isolation. Lee's result of 24.7 umol/L is well within range and within the optimal band, reflecting healthy iron availability from his meat-rich diet.","low_causes":"Iron deficiency, chronic inflammation, poor absorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver damage, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. The body produces more transferrin when iron stores are low (to scavenge more efficiently) and less when stores are ample. Lee's transferrin at 2.18 g/L sits just above the lower limit of the range at 2.15, which makes sense given his high ferritin and high transferrin saturation. The body has plenty of iron and does not need to produce much transport protein. This is a physiologically appropriate response to iron-replete stores rather than a concern.","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron_binding_capacity","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3955","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.6040","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the maximum amount of iron the blood could carry if every transferrin molecule were fully loaded. It moves in the opposite direction to iron stores: when the body needs more iron, TIBC rises; when stores are full, it falls. Lee's TIBC of 50 umol/L is within range and within the optimal band, consistent with his healthy iron status.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"262","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. Each molecule of ferritin can hold thousands of iron atoms, and the blood level reflects how much iron is warehoused in the liver, spleen, and bone marrow. Lee's ferritin at 262 ng/ml is within the male laboratory range of 22 to 322 but above the optimal band of 50 to 200. On a carnivore diet rich in haem iron (the highly absorbable form found in red meat), elevated ferritin is expected. Combined with his transferrin saturation of 45%, this does not meet the threshold for iron overload investigation but does mean Lee should avoid any iron-containing supplements and monitor these markers at each future test.","low_causes":"Iron deficiency, blood loss, poor dietary intake, coeliac disease","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1607","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream and the level rises. It is one of the most sensitive markers of liver health. Lee's ALT at 18 IU/L is well within the laboratory range and comfortably within the optimal zone of under 30, indicating his liver cells are healthy and under no metabolic strain.","low_causes":"Normal finding, vitamin B6 deficiency (rare)","high_causes":"Fatty liver disease, alcohol, medications, viral hepatitis, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2444","lower_normal":"13","upper_normal":"45","lower_optimal":"14","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3646","upper_optimal_position":"0.5833","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is fairly specific to the liver, AST can rise from muscle damage as well. Lee's AST at 22 IU/L is well within range and within the optimal band. Given his high training volume, a clean AST alongside a clean ALT is a good sign that neither his liver nor his muscles are under excessive strain.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, intense exercise, heart damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0685","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol, medications, and bile duct stress. It is often the first liver marker to rise when the liver is under strain. Lee's GGT at 10 IU/L is excellent, well within the optimal zone of under 25 and about as low as this marker gets. This confirms his liver is in very good health.","low_causes":"Normal finding","high_causes":"Alcohol, medications, bile duct obstruction, fatty liver, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4190","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3905","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and gut. In the liver it relates to bile duct function, while in bones it reflects bone turnover. Lee's ALP at 64 IU/L is comfortably within both the laboratory and optimal ranges, indicating healthy bile duct and bone metabolism.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disorders, vitamin D deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it and excretes it in bile. A raised level can indicate liver disease, bile duct problems, or increased red cell breakdown, though mild elevations are often due to the harmless inherited condition Gilbert's syndrome. Lee's bilirubin at 8 umol/L is healthy and within the optimal band.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4533","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined level of albumin and globulin in the blood. It reflects liver synthetic function (albumin) and immune activity (globulin). Lee's total protein at 78 g/L is within range and within the optimal band, confirming healthy liver production and balanced immune protein levels.","low_causes":"Liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Chronic inflammation, infection, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and maintains fluid balance by keeping water inside blood vessels. It is also one of the best markers of overall nutritional status and liver synthetic function. Lee's albumin at 44 g/L is healthy and within the optimal band.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) and transport proteins. The level reflects immune system activity and liver function. Lee's globulin at 34 g/L is within the laboratory range but above the optimal band of 20 to 32, sitting in the upper portion of range. This is not a concern and likely reflects his active immune system, but it is noted as above optimal.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic inflammation, infection, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3379","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis (scarring) using age, ALT, AST, and platelet count. A score below 1.3 (or below 2.0 in those over 65) is reassuring and suggests no significant fibrosis. Lee's score of 0.98 is well within the safe zone, confirming a healthy liver with no sign of scarring.","low_causes":"Normal finding","high_causes":"Liver fibrosis, cirrhosis, age, low platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"106","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5720","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch and carbohydrates. Elevated levels can indicate pancreatic inflammation. Lee's amylase at 106 IU/L is within range and within the optimal band, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. It is the more specific of the two pancreatic enzymes tested (alongside amylase) for detecting pancreatic stress. Lee's lipase at 70 U/L is above the upper limit of 60 but only mildly so. On a carnivore diet with a very high fat intake, the pancreas upregulates lipase production to handle the increased fat load, and mild elevations are commonly seen. His amylase is normal, which makes acute pancreatitis very unlikely. If Lee experiences any upper abdominal pain or nausea, this should be mentioned to his GP, but in the absence of symptoms this is most likely a dietary adaptation.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Pancreatitis, high-fat diet, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4738","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between liver synthetic function (albumin) and immune or inflammatory activity (globulin). Lee's ratio of 1.29 is within range and within the optimal band, reflecting a healthy balance.","low_causes":"Liver disease, chronic inflammation, autoimmune conditions, overproduction of globulins","high_causes":"Immune deficiency (underproduction of globulins)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5703","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL (protective), LDL (atherogenic), and VLDL. On its own, it is a blunt tool because a high total cholesterol can be driven by a very high HDL, which is actually protective. Lee's total cholesterol of 5.9 mmol/L is above the desirable limit of 5.18, but a significant portion of this is his excellent HDL of 2.1. The more meaningful markers are his LDL, ApoB, and Lp(a), which are discussed separately.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2382","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat in the blood, carried in VLDL particles. They rise after meals and are chronically elevated by excess carbohydrate intake, insulin resistance, and alcohol. Low triglycerides are one of the strongest indicators of metabolic health. Lee's triglycerides at 0.81 mmol/L are excellent, well within the optimal zone of under 1.0. This is a hallmark benefit of his carnivore diet and reflects outstanding insulin sensitivity and metabolic efficiency.","low_causes":"Very low-carb diet, malnutrition, hyperthyroidism","high_causes":"Excess carbohydrates, insulin resistance, alcohol, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2372","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues. It is a precursor to LDL and reflects how much fat the liver is exporting. Lee's VLDL at 0.37 mmol/L is low and within the optimal zone, consistent with his excellent triglyceride level and lean metabolic profile.","low_causes":"Low-carb diet, very low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6774","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is often called 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is protective against cardiovascular disease. Lee's HDL at 2.1 mmol/L is excellent, well above the optimal male threshold of 1.4 and above the high desirable level of 1.55. This is one of the strongest positives in his lipid panel and reflects the combined effect of his carnivore diet, high training volume, and lean body composition.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, high-carb diet","high_causes":"Regular exercise, moderate alcohol, genetic factors, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5960","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the primary carrier of cholesterol to tissues and is the main driver of atherosclerosis (cholesterol plaque build-up in arteries). Each LDL particle can cross into the artery wall and deposit its cholesterol cargo. Lee's LDL at 3.48 mmol/L is above the upper limit of 3.0 and above the optimal target of 2.6. On a carnivore diet high in saturated fat, elevated LDL is a well-recognised finding. In isolation, with his excellent HDL and triglycerides, this might be considered a manageable trade-off, but in the context of his very high Lp(a), reducing LDL and ApoB becomes more important because the Lp(a) particles are already contributing significant atherogenic particle burden that Lee cannot modify.","low_causes":"Hyperthyroidism, malnutrition, very low-fat diet","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, familial hypercholesterolaemia, carnivore/keto diets","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3122","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio gives a quick picture of the balance between total cholesterol burden and the protective HDL fraction. A lower ratio is better. Lee's ratio of 2.81 is well within the desirable range of under 4.5 and within the optimal zone, reflecting his very strong HDL. This is a reassuring ratio despite his elevated total cholesterol.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"35.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3559","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL fraction. A higher percentage is better. Lee's HDL accounts for 35.59% of his total cholesterol, which is excellent and well above the minimum desirable threshold of 20%. This reflects the strong protective cholesterol fraction in his blood.","low_causes":"Low HDL, high LDL or triglycerides","high_causes":"Excellent HDL production, very low LDL","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol fractions including LDL and VLDL, making it a broader measure of cardiovascular risk than LDL alone. Lee's non-HDL at 3.8 mmol/L is within the laboratory limit of under 4 but above the optimal threshold of 3.4. This is consistent with his elevated LDL and mildly raised ApoB.","low_causes":"Very low LDL, low-fat diet, hyperthyroidism","high_causes":"High LDL, high triglycerides, saturated fat intake, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5424","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein of HDL particles. Each HDL particle carries one or more ApoA1 molecules, and the level reflects the number and function of HDL particles in the blood. It is the counterpart to ApoB. Lee's ApoA1 at 1.88 g/L is excellent, well above the minimum desirable threshold of 1.2 and above the optimal threshold of 1.4. This confirms his HDL particles are abundant and functional.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, genetic factors, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the single most important number in the lipid panel for cardiovascular risk. Every atherogenic lipoprotein particle, whether it is LDL, VLDL, IDL, or Lp(a), carries exactly one ApoB molecule. So the ApoB level tells you the total number of artery-damaging particles in the blood, regardless of how much cholesterol each one carries. Lee's ApoB at 0.92 g/L is above the desirable limit of 0.9 and above the optimal target of 0.8. In the context of his very high Lp(a), some of these ApoB-carrying particles are Lp(a) particles that cannot be reduced through lifestyle changes, making it even more important to reduce the modifiable LDL-carried ApoB through dietary changes and potentially medication.","low_causes":"Hyperthyroidism, malnutrition, very low-fat diet","high_causes":"High LDL, high saturated fat diet, genetics, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the best single summary measures of cardiovascular risk because it captures the balance between atherogenic particles (ApoB) and protective particles (ApoA1). A lower ratio is better. Lee's ratio of 0.49 is well within the lower-risk zone of under 0.7 and within the optimal band of under 0.6. This reflects his excellent HDL and ApoA1 levels partially offsetting his elevated ApoB. However, this ratio does not account for the Lp(a) risk, which operates through additional mechanisms beyond simple particle number.","low_causes":"Excellent HDL, low LDL","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"198.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a modified LDL particle with an additional protein called apolipoprotein(a) attached to it. It is entirely genetically determined: diet, exercise, and almost all current medications do not change it. Lp(a) is harmful in three distinct ways. First, like LDL, it deposits cholesterol into artery walls. Second, its structure resembles plasminogen, one of the body's clot-dissolving proteins, so it interferes with the body's ability to break down blood clots. Third, it drives local inflammation in the artery wall. Lee's Lp(a) at 198.56 nmol/L is significantly above the normal threshold of 32 and sits at the boundary between moderate and high risk. This is permanent information about his cardiovascular biology. It should be recorded in his medical notes for life, and his first-degree relatives (parents, siblings, any children) should be tested because it is directly inherited. The European Atherosclerosis Society considers Lp(a) above 120 nmol/L to be an independent major cardiovascular risk factor equivalent in impact to familial hypercholesterolaemia. This finding makes reducing his modifiable risk factors, particularly ApoB, even more important.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1300","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful surrogate marker for insulin resistance and metabolic health. A lower ratio indicates better insulin sensitivity and a more favourable metabolic profile. Lee's ratio of 0.39 is excellent, well within the optimal zone of under 0.87. This is one of the strongest indicators that his metabolic health is outstanding despite the elevated LDL.","low_causes":"Excellent insulin sensitivity, very low carbohydrate diet, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2000","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried in triglyceride-rich remnant particles (what is left of VLDL after triglycerides have been delivered). Calculated as total cholesterol minus HDL minus LDL. These remnant particles are highly atherogenic because they are small enough to enter artery walls. Lee's remnant cholesterol at 0.32 mmol/L is within the optimal zone of under 0.5, confirming that his triglyceride metabolism is efficient and not contributing significant atherogenic risk.","low_causes":"Efficient triglyceride metabolism, low-carb diet","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for about thre
