<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Naomi Robertson-Smith","dob":"08/02/1976","report_date":"2026-10-21","summary":"Patient is a 50-year-old female presenting with a BMI of 30.0, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). She trains six times per week (two cardio sessions and four resistance sessions at hard intensity) with 5,000 to 7,500 daily steps. She sleeps 8 or more hours but feels tired most mornings, with energy low all day and stress hard to manage some weeks. She drinks 1 to 4 alcoholic drinks per week. She takes Ramipril for hypertension and an SSRI (sertraline or fluoxetine), and supplements with a multivitamin. Her family history includes thyroid disease. She has not had a previous blood test through TrueVitals. She reports low energy and fatigue alongside brain fog, present for weeks, and notes she is still post-viral following Covid-like symptoms throughout September 2026 that tested negative. Her goals are to improve energy levels, balance hormones, and improve long-term health and longevity.\n\nThe most important finding in this report is her Lp(a), which stands for lipoprotein little a. Lp(a) is a type of cholesterol particle that is entirely genetically determined; it cannot be changed by diet, exercise, or any currently available supplement. Her level is 172.23 nmol/L, well above the 32 nmol/L threshold that defines normal, placing her in the moderate-to-high inherited risk category. Lp(a) particles deposit cholesterol into artery walls in the same way that LDL does, but they also carry a protein that encourages blood clotting and drives inflammation at the vessel surface. This is a permanent piece of medical information. It should be recorded in her GP notes, and her first-degree relatives, particularly any children and siblings, should be offered testing because it is inherited. The practical consequence is that her modifiable cardiovascular risk factors, meaning her LDL, ApoB, blood pressure, blood sugar, and inflammation, need to be kept as clean as possible, because her Lp(a) is adding risk that she cannot remove. This context makes her lipid results more important than they would be in someone with a normal Lp(a).\n\nHer LDL cholesterol, the main cholesterol particle that carries fat into artery walls, is 3.77 mmol/L against an ideal target below 2.6, and ideally below 2.0 for someone with elevated Lp(a). Her ApoB, which counts the actual number of atherogenic particles in the blood (each LDL and Lp(a) particle carries one ApoB molecule), is 1.03 g/L against a target below 0.9 and ideally below 0.8. Her non-HDL cholesterol, which captures everything that is not the protective HDL fraction, is 4.3 against a target below 4. When the Lp(a) contribution is stripped out using the corrected LDL calculation, her modifiable LDL falls to approximately 3.21, which means roughly 0.56 mmol/L of her measured LDL is coming from the Lp(a) particles she inherited and the rest is driven by diet, weight, and metabolism. Both the inherited and the modifiable portions matter, but only the modifiable portion responds to lifestyle change. These results, combined with her Lp(a), give her a Cardiovascular Risk Score of 75 out of 100. This score is not a ten-year event probability; it measures the amount of risk being built across her lipid, inflammatory, and metabolic markers right now. Hers is high because of the Lp(a) combined with the elevated LDL and ApoB. The encouraging part is that her protective markers are excellent: her HDL is 2.1, which is outstanding and well above the 1.6 ideal threshold for women, her ApoA1, the protein on those protective HDL particles, is 1.9, and her ApoB-to-ApoA1 ratio at 0.54 is below the 0.6 lower-risk threshold. Her triglycerides at 1.34 are within the laboratory range and her TG-to-HDL ratio at 0.64 is well within the ideal band, which reflects good insulin sensitivity and a metabolically healthy lipid pattern. In other words, the modifiable side of her cardiovascular profile is not catastrophic, it is skewed by a genuinely elevated LDL and ApoB, but the HDL and triglyceride picture is strong, and there is clear room to bring the LDL down further with dietary adjustment.\n\nHer ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and acts as a broad marker of inflammation in the body, is 36 mm/hour against an upper limit of 12. This is a significant elevation. Her high-sensitivity CRP, a more specific inflammation marker produced by the liver, is just 0.2 mg/L, which is excellent. The divergence between a very high ESR and a very low CRP is a recognised pattern. CRP responds rapidly to acute bacterial infection and tissue injury and tends to normalise quickly. ESR is slower to rise and slower to fall, and it is influenced by factors beyond acute inflammation: elevated immunoglobulins, anaemia, high fibrinogen, and the aftermath of viral illness all push ESR up independently of CRP. Given that she has been unwell with a prolonged viral illness throughout September, the most likely explanation is a post-viral acute phase response that has not yet fully settled. Her immunoglobulins are all within range, with IgG at 11.4, IgM at 1.2, and IgA at 3.1, so a paraprotein or myeloma-driven ESR is not suggested. Her albumin at 37 is at the lower end of the laboratory range (34 to 50), which can also raise ESR because albumin normally slows red cell sedimentation. The combination of post-viral inflammation and lower albumin is the most plausible explanation, but an ESR of 36 warrants a repeat in six to eight weeks to confirm it is falling. If it remains elevated or rises, her GP should investigate further.\n\nHer parathyroid hormone, PTH, is 6 pmol/L against an upper limit of 4.73. PTH is released by four small glands behind the thyroid and its job is to maintain blood calcium levels by pulling calcium from bone, increasing calcium absorption from the gut, and reducing calcium loss through the kidneys. Her corrected calcium at 2.37 is comfortably within range, and her phosphate at 1.0 is also normal, so this is not the pattern of primary hyperparathyroidism where calcium is pushed above range by overactive glands. The most likely explanation is secondary hyperparathyroidism driven by her vitamin D level. Her vitamin D is 52 nmol/L, which the laboratory classifies as just sufficient, but it is below the 75 nmol/L level at which PTH typically suppresses fully. When vitamin D is low, calcium absorption from the gut falls, and the parathyroid glands compensate by producing more PTH to maintain calcium from other sources, principally bone. At a BMI of 30, vitamin D is also sequestered in fat tissue, meaning her true vitamin D availability is lower than the number suggests. The solution is straightforward: adequate vitamin D supplementation should bring the PTH back into range within three to four months. This is worth mentioning to her GP because if PTH remains elevated after vitamin D is replete, the glands themselves may need investigation, but the vitamin D explanation is by far the most common.\n\nHer absolute reticulocyte count is 39.4 against a lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count means the marrow is producing red cells at a slightly reduced rate. Her haemoglobin at 126 is within range but towards the lower end for a woman (range 120 to 150), and her ferritin at 35 is within the laboratory range but below the optimal threshold of 40 for women. Ferritin is the body's iron store, and at 35 the store is not empty but it is not generous either, particularly for someone training six days a week at hard intensity. Iron is the raw material the bone marrow needs to build haemoglobin, and a borderline store may be just enough to keep haemoglobin in range while slightly limiting the rate of new red cell production. Her serum iron at 24.2 and transferrin saturation at 35.6% are both healthy, which means iron is moving through the blood adequately, but the storage depot is running lower than ideal. A post-viral state can also transiently suppress marrow output. The combination of borderline ferritin and recent viral illness is the most likely explanation for the low reticulocyte count.\n\nHer urea is 2.7 against a lower limit of 3.2. Urea is a waste product of protein metabolism made by the liver and cleared by the kidneys. A low level in a woman with a BMI of 30 on a standard mixed diet most commonly reflects a protein intake that is on the low side relative to her needs. It can also be diluted by higher fluid intake or reduced by the liver prioritising other functions during a post-viral recovery. Her kidney function is otherwise healthy: creatinine at 64, cystatin C at 0.96, and eGFR at 91 by the combined creatinine and cystatin C calculation all confirm the kidneys are filtering well. The urea-to-creatinine ratio at 42.2 is just at the lower edge of the reference band (40 to 100), consistent with the low urea being the driver. This finding reinforces the importance of ensuring her protein intake is adequate, particularly with her training volume.\n\nHer IgE, immunoglobulin E, is 116 IU/mL against an upper limit of 100. IgE is the antibody class associated with allergic responses and parasitic infection. A mild elevation like this most commonly reflects an allergic tendency, whether that is seasonal hay fever, dust mite sensitivity, pet dander, or a food sensitivity. It can also be transiently raised in the aftermath of a viral infection as the immune system recalibrates. It does not require urgent action, but if she experiences unexplained skin reactions, nasal congestion, or digestive symptoms that come and go, the elevated IgE would support pursuing allergy testing.\n\nTurning to the many things that are working well: her thyroid function is reassuring, particularly given her family history of thyroid disease. TSH at 2.08, which is the signal the pituitary sends to the thyroid to produce hormone, sits comfortably within the optimal range of 1.0 to 2.5. Free T4, the main thyroid hormone, is 15.2, and free T3, the active form that cells actually use, is 4.9, giving an FT3-to-FT4 ratio of 0.322, which shows she is converting T4 to T3 efficiently. Both thyroid antibodies, TPO and thyroglobulin, are negative, which means there is no autoimmune thyroid process despite the family history. This is genuinely useful information to have confirmed.\n\nHer blood sugar control is excellent. Fasting glucose at 4.3 is well within the optimal band, HbA1c at 39 mmol/mol (5.8%) is within the normal range and below the 42 mmol/mol pre-diabetes threshold, and fasting insulin at 7.8 gives her a HOMA-IR of 1.49. HOMA-IR estimates how hard the pancreas is working to control blood sugar, and at 1.49 she sits right at the upper edge of the reference range but still within it. At a BMI of 30, this level of insulin sensitivity is a genuine positive. Her C-peptide at 1.22 ug/L (approximately 404 pmol/L) confirms appropriate insulin production. The TyG index, another insulin resistance estimate, is 8.43, within the optimal band.\n\nHer liver is in excellent health. ALT at 14 and GGT at 11 are both well within their optimal ranges, the AST-to-ALT ratio (De Ritis ratio) at 1.29 is normal, and the FIB-4 fibrosis score at 0.93 and APRI at 0.174 both confirm no evidence of liver scarring. The NAFLD fibrosis score at minus 1.525 sits within the optimal band. Amylase at 57 and lipase at 31 confirm the pancreas is healthy. Her total antioxidant activity at 1.68 is within range.\n\nHer immune markers are largely reassuring. White cell count at 6.09, neutrophils at 3.04, lymphocytes at 2.08, monocytes, eosinophils, and basophils are all within range. The neutrophil-to-lymphocyte ratio at 1.46 and platelet-to-lymphocyte ratio at 124 are both within their optimal bands, and the systemic immune-inflammation index at 377 is also optimal. IgG, IgM, and IgA are all within range. Rheumatoid factor is negative, and coeliac screening (tissue transglutaminase IgA) is negative.\n\nHer hormonal picture is consistent with an active menstrual cycle. She reports irregular periods, and her oestradiol at 316 pmol/L combined with progesterone at 4.6 nmol/L, LH at 4.12, and FSH at 6.23 suggest this sample was taken in the follicular or early luteal phase, or possibly a cycle where ovulation was weak or absent. In the follicular phase, oestradiol of 316 is towards the upper end, and progesterone of 4.6 would be expected before ovulation. In the luteal phase, progesterone would normally be above 10, so if this sample was taken after expected ovulation, the low progesterone may indicate an anovulatory cycle, which becomes more common in the perimenopausal transition. At 50 with irregular cycles, she is likely in perimenopause even though her FSH at 6.23 has not yet risen to the post-menopausal range. FSH and LH can fluctuate significantly cycle to cycle during this transition. Her total testosterone at 1.4 nmol/L is within the female reference range, free androgen index at 1.41 is within range, and bioavailable testosterone at 0.24 nmol/L is within the optimal band. DHEA-S at 2 umol/L (737 ug/dL) is within range. SHBG at 99.5 is towards the higher end of the reference range, which is typical with SSRI use and adequate oestrogen levels. Prolactin at 230 uIU/mL is within the non-pregnant reference range. Cortisol at 428 nmol/L is within the morning reference range.\n\nHer tumour markers are all within range: CA125 at 12.4, CA15-3 at 23.61, CA19-9 at 2.65, and CEA at 2.12. Creatine kinase at 87 is within range, appropriate for her training load. Her mineral balance is healthy: corrected calcium at 2.37, phosphate at 1.0, magnesium at 0.87 (within the optimal band), and serum osmolality at 283 are all where they should be. B12 at 512 is within the optimal range, and folate at 17 is at the top of the reference range.\n\nHer PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count, is 39.7 years against her calendar age of 50, a difference of more than ten years in the favourable direction. This is an excellent result and reflects her low CRP, good kidney function, healthy blood sugar, and well-balanced blood counts.\n\nNow, to her symptoms. She reports low energy that lasts all day and brain fog that has been present for weeks, and she notes a prolonged post-viral illness throughout September. Her bloods rule out the most common medical causes of persistent fatigue: her thyroid is working well, she is not anaemic, her B12 and folate are healthy, her blood sugar and insulin sensitivity are good, her liver and kidney function are normal, and her cortisol is within range. The borderline ferritin at 35 is unlikely to be the sole driver of her fatigue but it is not helping, particularly with her training load, and optimising it to above 50 would be a reasonable step. The elevated ESR confirms her body is still in a post-viral recovery state, and post-viral fatigue is the most likely explanation for her current symptoms. The pattern of sleeping 8 or more hours yet waking tired, with low energy all day, is characteristic of post-viral fatigue where sleep quality is disrupted even when quantity is adequate. Her SSRI may also contribute to morning grogginess. The most important things she can do are to allow genuine recovery by reducing training intensity temporarily (not stopping, but pulling back from hard to moderate for four to six weeks), ensuring protein and calorie intake match her needs, optimising vitamin D and iron stores, and prioritising sleep quality over quantity: a fixed wake time, bright light within the first hour of waking, and no screens in the last hour before bed. If the fatigue has not improved meaningfully by eight weeks, a repeat of the ESR and a GP review would be warranted.\n\nHer free testosterone calculated result shows 0.012 nmol/L and is flagged as above range against a reference of 0.01 to 0.25. This is at the very bottom of the range and is not genuinely elevated despite the laboratory flag. At 0.012, her free testosterone is very low within the reference band and is not a clinical concern.\n\nLate-arriving results: Bacterial Count: 10^4; Urine Culture and Sensitivities: Moderate growth of commensals. Your urine culture showed moderate growth of commensals. This is worth showing to your GP, who can decide whether any treatment is needed, particularly if you have urinary symptoms.","links":"The central thread in this report is the cardiovascular risk profile. Her Lp(a) at 172.23 nmol/L is the fixed, inherited component that she cannot change. On top of that, her LDL at 3.77 and ApoB at 1.03 add modifiable risk. The Lp(a)-corrected LDL of 3.21 shows that even after removing the Lp(a) contribution, her diet-driven LDL remains above the ideal target of 2.0. The Cardiovascular Risk Score of 75 is high primarily because of the Lp(a), but the LDL and ApoB are the parts she can act on. The strong HDL at 2.1, excellent triglycerides, and low ApoB-to-ApoA1 ratio are genuine protective factors, and this is not a uniformly bad lipid picture. It is one where inherited risk demands that the modifiable elements be kept as tight as possible.\n\nThe second thread is the post-viral inflammatory state. Her ESR is elevated at 36 while her CRP is just 0.2, a pattern consistent with a viral illness that has resolved at the acute level but left behind a slower inflammatory process. Her albumin at 37, while within range, is on the lower side and may itself be a reflection of the body redirecting protein synthesis during recovery. The low reticulocyte count fits here too: viral infections can transiently suppress bone marrow output, and when combined with borderline ferritin, the marrow does not have the stores or the stimulus to produce red cells at full capacity. The fatigue and brain fog she describes are most plausibly explained by this post-viral recovery rather than by any single biochemical deficiency.\n\nThe third thread is the vitamin D and PTH axis. Her vitamin D at 52 is technically sufficient but functionally low, as evidenced by the PTH rising to 6 to compensate. At a BMI of 30, fat tissue sequesters vitamin D, making the circulating level an overestimate of what is truly available. The solution is adequate supplementation to bring vitamin D above 75, which should suppress PTH back into range and remove the low-grade stimulus to draw calcium from bone. This matters particularly at 50 in the perimenopausal transition, when oestrogen's protective effect on bone density is beginning to wane.\n\nThe hormonal picture tells a fourth, quieter story. At 50 with irregular cycles, oestradiol at 316 with a progesterone of only 4.6 and an FSH that has not yet risen above 10 suggests she is in the earlier stages of perimenopause. She may still be cycling, but cycles may be anovulatory or have a shortened luteal phase. This is not pathological, it is physiological, but it is worth discussing with her GP in the context of her goals around hormone balance, particularly as the transition progresses and oestrogen eventually falls.\n\nThe loose end is the IgE at 116. It does not connect to the other findings and most likely reflects an allergic tendency or a transient post-viral immune shift. It does not require action unless she has symptoms suggestive of allergy.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, or leftover chicken. Anchor: protein goes on the plate before anything else. Why: your urea at 2.7 suggests protein intake is below what your body needs, and at 79.8 kg training six days a week you need at least 104 to 128 grams of protein a day to support muscle repair and immune recovery.\nSwap sugary snacks for whole food alternatives on the days you currently have them. A piece of fruit with nut butter, dark chocolate above 70%, or a handful of nuts. Anchor: same time of day, just a different choice. Why: reducing refined sugar helps lower LDL and ApoB, which at 3.77 and 1.03 need to come down, especially with your inherited Lp(a) risk.\nAdd two portions of oily fish per week: salmon, mackerel, sardines, or trout. Anchor: pick two fixed days. Why: omega-3 from oily fish lowers triglycerides, supports the anti-inflammatory HDL particles you already produce so well, and provides the EPA and DHA that support brain function and may help with your brain fog.\nAdd one to two portions of soluble fibre daily: oats, beans, lentils, or barley. Anchor: porridge at breakfast or beans added to an evening meal. Why: soluble fibre binds cholesterol in the gut and lowers LDL by 5 to 10% over two to three months, which matters when your Lp(a) cannot be changed.\nReduce training intensity from hard to moderate for the next four to six weeks while you recover from the post-viral period. Keep the sessions, reduce the load and the effort. Anchor: rate each session 6 out of 10 effort instead of 8. Why: your ESR at 36 shows your body is still dealing with inflammation from the viral illness, and pushing through hard training while inflamed delays recovery and deepens fatigue.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal and adds steps towards the 7,500 to 10,000 range that supports cardiovascular health.\nFix your wake time to the same time every day, including weekends, and get outside into bright light within the first hour. Anchor: alarm, then straight to the window or the door. Why: you sleep 8 or more hours but wake tired, and a fixed light exposure in the morning resets the cortisol rhythm that governs morning alertness and evening sleepiness.\nCut caffeine after 1pm. Anchor: set a phone reminder. Why: caffeine has a half-life of five to six hours, and any consumed after early afternoon can fragment sleep architecture even when you fall asleep easily, contributing to the unrefreshing sleep and low-all-day energy pattern you describe.","flags":"Lp(a) 172.23 nmol/L (limit below 32). Entirely genetically determined, placing her in the moderate-to-high inherited cardiovascular risk category. Should be recorded permanently in her GP notes. First-degree relatives should be offered testing. Modifiable risk factors (LDL, ApoB, blood pressure, inflammation) must be managed aggressively.\nLDL 3.77 mmol/L (ideal below 2.6), ApoB 1.03 g/L (ideal below 0.9), non-HDL 4.3 (ideal below 4.0). All elevated. Lp(a)-corrected LDL is 3.21, confirming a substantial modifiable component. Combined with the Lp(a) above, the Cardiovascular Risk Score is 75/100. HDL 2.1 and triglycerides 1.34 are strong protective factors, and the ApoB/A1 ratio at 0.54 remains below the 0.6 lower-risk threshold.\nESR 36 mm/hour (limit below 12). Significantly elevated in the context of a CRP of just 0.2, consistent with a post-viral acute phase response following her September illness. Albumin at 37 (lower end of range) may be contributing. Recommend repeat in 6 to 8 weeks to confirm it is falling.\nPTH 6 pmol/L (limit 4.73). Elevated in the context of a vitamin D of 52 nmol/L, consistent with secondary hyperparathyroidism driven by suboptimal vitamin D. Expected to normalise with adequate vitamin D supplementation. If PTH remains elevated after vitamin D is above 75, the glands should be investigated.\nVitamin D 52 nmol/L. Technically sufficient but below the 75 nmol/L optimal threshold. At BMI 30, fat tissue sequesters vitamin D, making the true availability lower than the number suggests. Driving the elevated PTH above.\nFerritin 35 ng/mL. Within the laboratory range (10 to 291) but below the optimal threshold of 40 for women. Borderline iron stores in a woman training six days a week at hard intensity, likely contributing to the low reticulocyte count.\nAbsolute reticulocytes 39.4 x10^9/L (lower limit 50). Low marrow output, most likely explained by the combination of borderline ferritin and post-viral marrow suppression. Haemoglobin at 126 is within range but at the lower end.\nUrea 2.7 mmol/L (lower limit 3.2). Low, most likely reflecting protein intake below optimal for her body weight and training load. Kidney function otherwise excellent.\nIgE 116 IU/mL (limit below 100). Mildly elevated, most commonly reflecting an allergic tendency or transient post-viral immune activation. Not urgent but supports allergy investigation if she has relevant symptoms.\nFree testosterone calculated 0.012 nmol/L flagged as above range (0.01 to 0.25). This is at the very floor of the reference range and is not genuinely elevated. The laboratory flag is an artefact of rounding.\nReassuring negatives: thyroid function normal with both antibodies negative despite family history of thyroid disease; CRP 0.2 (excellent); HbA1c 39 and HOMA-IR 1.49 (no insulin resistance); liver enzymes, fibrosis scores and pancreatic enzymes all clean; kidney function excellent (eGFR 91 combined); B12 and folate optimal; all tumour markers within range; coeliac screen negative; rheumatoid factor negative; cortisol, prolactin, DHEA-S all within range; urinalysis clear.","recommendations":"Record her Lp(a) of 172.23 nmol/L permanently in her medical notes and discuss the implications for long-term cardiovascular risk management. Her first-degree relatives should be offered Lp(a) testing. With her elevated Lp(a), discuss whether her current LDL of 3.77 and ApoB of 1.03 warrant pharmacological intervention (statin or PCSK9 inhibitor) in addition to dietary changes, given that lifestyle alone may not bring ApoB below 0.8.\nRepeat ESR in 6 to 8 weeks to confirm it is falling from 36 as the post-viral state resolves. If it remains elevated or rises, investigate further (protein electrophoresis, repeat inflammatory markers, clinical review).\nReview her vitamin D and PTH: PTH is 6 against an upper limit of 4.73, driven by vitamin D at 52. Adequate supplementation (3,000 to 4,000 IU daily at her BMI) should suppress PTH within 3 to 4 months. Recheck both vitamin D and PTH at that point. If PTH remains elevated with vitamin D above 75, the parathyroid glands should be investigated.\nDiscuss her perimenopausal status in the context of her goals around hormone balance. Irregular cycles at 50, oestradiol 316 with progesterone 4.6, and FSH 6.23 suggest early perimenopause. If symptoms progress (worsening fatigue, brain fog, mood changes, vasomotor symptoms), HRT may be worth discussing.\nIf fatigue and brain fog persist beyond 8 weeks despite the lifestyle adjustments in this report, review for post-viral fatigue syndrome and consider a structured rehabilitation approach. Repeat the full blood count, ESR, ferritin, and thyroid function at that point.\nCalorie and protein targets: at 79.8 kg, 163 cm, age 50, training six days a week at hard intensity, her estimated maintenance calories are approximately 2,200 (BMR around 1,450 multiplied by an activity factor of 1.5 to account for training plus daily movement). For gradual fat loss towards a target weight of 68 to 72 kg (BMI 25.6 to 27.1), a calorie intake of 1,800 to 2,000 per day with a protein floor of 104 to 128 grams per day (1.3 to 1.6 g/kg) is appropriate. Retest in 12 weeks: repeat lipid panel (LDL, ApoB, HDL, triglycerides), ESR, vitamin D, PTH, ferritin, and reticulocytes to assess the response to the plan.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 to 4,000 IU daily, taken with her largest meal that contains fat. Why: her vitamin D at 52 is below the 75 nmol/L optimal threshold, and at BMI 30 she needs a higher dose because fat tissue sequesters vitamin D. This is also driving her elevated PTH of 6.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. Why: K2 directs the calcium mobilised by vitamin D and PTH into bone rather than into artery walls, which matters particularly at 50 during the perimenopausal transition and with her cardiovascular risk profile.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: supports the reduction of her LDL and ApoB, complements her already strong HDL, and provides anti-inflammatory support during post-viral recovery. EPA also supports mood and cognitive function, relevant to her brain fog and SSRI use.\nMagnesium glycinate: 300 to 400 mg taken before bed. Why: her magnesium at 0.87 is within the optimal band but at the lower end, and glycinate is the form best supported for sleep quality, muscle recovery from her six weekly sessions, and stress resilience.\nIron (ferrous bisglycinate): 25 mg every other day, taken with vitamin C (a glass of orange juice or a vitamin C tablet) on an empty stomach or with a light meal, away from her Ramipril. Why: her ferritin at 35 is below the optimal 40 to 50 threshold for women, her reticulocytes are low, and she is training hard six days a week. Every other day dosing improves absorption compared to daily. Stop once ferritin reaches 70 to 80 and recheck in 12 weeks.\nShe may wish to discontinue her current multivitamin once these targeted supplements are in place, as a multivitamin typically contains inadequate doses of the specific nutrients she needs and may contain iron or calcium at times that interfere with absorption of other supplements.\nThe most important changes from this report are not supplements. They are reducing her LDL through dietary changes (oily fish, soluble fibre, reduced sugar), allowing genuine recovery from her post-viral illness by pulling back training intensity, and ensuring her protein intake reaches 104 to 128 grams per day.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 49.4. Weakest systems: lipids & cardiovascular 19%, inflammation 24%, kidney function 25%. Biggest drags: LDL Cholesterol, Lipoprotein(a), Urea, Apolipoprotein B.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"39.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3609","lower_normal":"","upper_normal":"55","lower_optimal":"","upper_optimal":"50","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4545","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. Her PhenoAge of 39.7 years against a calendar age of 50 means her blood markers suggest a biological age more than ten years younger than her actual age. This is an excellent result, driven primarily by her very low CRP (0.2), healthy glucose (4.3), strong kidney function, and well-balanced blood counts. Note: RDW was available in this panel and used directly in the calculation.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It measures the amount of cardiovascular risk being built across these markers, regardless of age. Her score of 75 is high, driven primarily by her Lp(a) at 172.23 and her elevated LDL and ApoB. Her excellent HDL (2.1), low CRP (0.2), and healthy triglycerides provide significant counterbalance but cannot fully offset the Lp(a). The modifiable portion of this score, the LDL and ApoB, is what the dietary changes and potential medication discussion aim to reduce.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells; when the liver is healthy, very little leaks into the blood. Her ALT at 14 is well within the optimal range for women (below 25), reflecting a liver under no metabolic strain at all. This is an excellent result, especially at BMI 30 where fatty liver is common.","low_causes":"","high_causes":"Fatty liver disease, alcohol excess, hepatitis, medication effects, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3854","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/l","description":"AST is an enzyme found in the liver, heart, and muscle cells. Her AST at 18 is comfortably within the optimal range, confirming healthy liver and muscle tissue. The low level is reassuring alongside her training volume.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart injury, intense exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1447","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/l","description":"GGT is a liver enzyme particularly sensitive to alcohol, medications, and metabolic stress. Her GGT at 11 is well within the optimal range for women (below 25), showing the liver is handling her medications, alcohol intake, and metabolic load cleanly. At BMI 30, this is a particularly reassuring result.","low_causes":"","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP is an enzyme found in the liver, bone, and bile ducts. Her ALP at 73 is comfortably within range. ALP can rise during perimenopause as bone turnover increases, so a normal level here is a positive finding for bone health.","low_causes":"Zinc or magnesium deficiency, hypothyroidism","high_causes":"Bone disease, bile duct obstruction, liver disease, vitamin D deficiency, perimenopause","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. Her bilirubin at 11 is mid-range and healthy, confirming normal red cell turnover and bile processing.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein is the sum of albumin and globulin in the blood, reflecting the liver's synthetic capacity and immune protein production. Her total protein at 70 is within the optimal range, confirming adequate protein synthesis.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, nutrients, and medications, and helps maintain fluid balance. Her albumin at 37 is within the laboratory range but below the optimal threshold of 40. In the context of a post-viral illness, albumin commonly dips because the liver redirects its protein-making capacity towards acute phase proteins. This is likely transient and should recover over the coming weeks as she recovers fully.","low_causes":"Post-viral illness, chronic inflammation, liver disease, malnutrition, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin represents the immune and transport proteins in the blood. Her globulin at 33 is within the laboratory range but slightly above the optimal upper threshold of 32. This is consistent with a mildly activated immune system in the aftermath of a viral illness. Her individual immunoglobulins (IgG, IgM, IgA) are all within their respective ranges, so this is not a concern.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4432","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Her amylase at 57 is mid-range and healthy, confirming normal pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4610","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. Her lipase at 31 is mid-range and healthy, confirming the pancreas is working well.","low_causes":"","high_causes":"Pancreatitis, gallstones, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6178","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol-carrying particles in the blood. Her total cholesterol at 6.4 is above the desirable limit of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk because it includes the protective HDL fraction, which in her case is very high at 2.1. The more meaningful measures are her LDL, ApoB, and non-HDL cholesterol, all discussed separately.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, menopause","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3941","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, mainly reflecting recent dietary intake of carbohydrates and sugars. Her triglycerides at 1.34 are within the laboratory range (below 1.7 fasting) but above the optimal target of below 1.0. At this level, they are not concerning, but the sugary food she consumes on some days is a likely contributor. Reducing refined sugar would be expected to bring this below 1.0.","low_causes":"Low-carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate or sugar intake, alcohol, insulin resistance, obesity, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3910","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL carries triglycerides from the liver to tissues. Her VLDL at 0.61 is within range, consistent with her triglyceride level. It is marginally above the optimal 0.6 threshold but not a concern.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"High carbohydrate intake, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6774","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL is the protective cholesterol particle that removes excess cholesterol from artery walls and returns it to the liver. Her HDL at 2.1 is excellent, well above the 1.6 optimal threshold for women. This is one of the strongest results in the report and provides meaningful cardiovascular protection alongside her elevated Lp(a).","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6283","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL is the main cholesterol particle responsible for depositing cholesterol into artery walls. Her LDL at 3.77 is above the reference limit of 3.0 and above the optimal target of 2.6. Given her elevated Lp(a), part of this LDL measurement (approximately 0.56 mmol/L) comes from Lp(a) particles rather than standard LDL. The Lp(a)-corrected LDL is 3.21, which is still above the target. Dietary changes, specifically increasing soluble fibre and oily fish while reducing saturated fat and refined sugar, are the first step. If these do not bring ApoB below 0.9 within three months, pharmacological intervention should be discussed with her GP given the Lp(a) context.","low_causes":"Hyperthyroidism, malnutrition, certain medications","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, menopause, familial hypercholesterolaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3389","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a quick picture of the balance between harmful and protective cholesterol. Her ratio of 3.05 is within the optimal range (below 3.5), driven by her excellent HDL. This is a favourable result despite the elevated total cholesterol.","low_causes":"","high_causes":"Low HDL, elevated total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol captures everything that is not the protective HDL fraction: LDL, VLDL, IDL, and Lp(a). Her non-HDL at 4.3 is above the 4.0 limit and above the 3.4 optimal target. This is consistent with her elevated LDL and ApoB, and the Lp(a) contribution makes up part of this number.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet, genetic factors, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6786","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. It drives the reverse cholesterol transport process that removes cholesterol from artery walls. Her ApoA1 at 1.9 is excellent, consistent with her high HDL. This is a strong protective factor.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Exercise, moderate alcohol, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB counts the total number of atherogenic (artery-damaging) particles in the blood. Each LDL, VLDL, and Lp(a) particle carries exactly one ApoB molecule, making it a more accurate measure of cardiovascular risk than LDL cholesterol alone. Her ApoB at 1.03 is above the desirable threshold of 0.9 and above the optimal target of 0.8. With her elevated Lp(a), some of these particles are Lp(a) and cannot be reduced by lifestyle alone. The dietary changes recommended aim to reduce the modifiable LDL particle count.","low_causes":"Hyperthyroidism, malnutrition, certain medications","high_causes":"High saturated fat diet, genetic factors, insulin resistance, hypothyroidism, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.542","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3013","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio summarises the balance between the atherogenic particles (ApoB) and the protective particles (ApoA1). Her ratio of 0.54 is below the 0.6 lower-risk threshold, meaning her protective particles outnumber the harmful ones. This is a favourable finding in the context of her lipid profile, though the goal remains to bring ApoB itself down.","low_causes":"","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"172.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"2.6910","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a cholesterol particle with an additional protein (apolipoprotein(a)) attached to it. It is entirely genetically determined and cannot be changed by diet, exercise, or any currently available supplement. Her Lp(a) at 172.23 nmol/L is well above the 32 nmol/L limit, placing her in the moderate-to-high inherited cardiovascular risk category. Lp(a) deposits cholesterol into artery walls, encourages blood clotting, and drives localised inflammation. This is a permanent piece of medical information that should be recorded in her GP notes, and first-degree relatives should be offered testing because it is inherited. The practical implication is that her modifiable cardiovascular risk factors must be managed as tightly as possible.","low_causes":"","high_causes":"Entirely genetic, cannot be modified by lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2133","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"","description":"The TG/HDL ratio is a strong indicator of insulin sensitivity and metabolic health. Her ratio of 0.64 is well within the optimal range (below 0.9), confirming good insulin sensitivity and a metabolically favourable triglyceride-to-HDL balance. At BMI 30, this is a genuinely positive finding.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried in triglyceride-rich particles (VLDL and IDL) after the LDL and HDL fractions are subtracted. Her remnant cholesterol at 0.53 is within the laboratory range but marginally above the optimal target of 0.5. This is a minor finding and consistent with her triglycerides being slightly above ideal.","low_causes":"","high_causes":"High triglycerides, insulin resistance, high carbohydrate diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5350","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This calculation removes the estimated cholesterol contribution from Lp(a) particles to show the modifiable LDL. Her corrected LDL of 3.21 confirms that even after stripping out the inherited Lp(a) component, her diet-driven LDL remains above the 3.0 limit and well above the 2.0 optimal target. This is the portion that responds to dietary changes and, if needed, medication.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.195","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5551","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma uses the ratio of triglycerides to HDL to estimate the size of LDL particles. A negative value indicates larger, less dangerous LDL particles. Her result of minus 0.195 is within the optimal band, reflecting her excellent HDL and reasonable triglycerides. This is a favourable metabolic indicator.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2571","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"This ratio compares LDL (harmful) to HDL (protective) cholesterol. Her ratio of 1.8 is within the optimal range (below 2.5), reflecting the protective influence of her high HDL. Despite her elevated LDL, the balance between the two is still favourable.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4","upper_optimal_position":"0.5627","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Her glucose at 4.3 is well within the optimal range (4.0 to 5.4), confirming healthy blood sugar regulation. At BMI 30, this is a positive result.","low_causes":"Fasting, excessive insulin, adrenal insufficiency","high_causes":"Insulin resistance, diabetes, stress, medication effects, high carbohydrate intake","padding":"1","one_sided":"0.5",
