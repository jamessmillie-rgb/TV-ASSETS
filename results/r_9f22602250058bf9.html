ith no significant systemic inflammatory drive. This is consistent with his excellent hs-CRP.","low_causes":"Neutropenia, lymphocytosis","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"63.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7897","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5135","units":"%","description":"Transferrin saturation measures what percentage of the body's iron transport protein (transferrin) is loaded with iron. Normal range is 18 to 55%, with an optimal range of 25 to 40%. Jashan's result of 63.32% is above the upper limit, meaning his transferrin is carrying more iron than it should. Combined with his elevated serum iron and very low iron binding capacity, this pattern raises the possibility of haemochromatosis, an inherited condition where the body absorbs too much iron. An HFE gene test will clarify this.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, iron overload, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"38.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7733","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3788","upper_optimal_position":"0.5455","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. Normal range is 11.6 to 31.3 umol/L. Jashan's result of 38.8 is above the upper limit. Serum iron can fluctuate with meals and time of day, and a non-fasting sample or iron-rich meal shortly before the blood draw can transiently elevate it. However, combined with the high transferrin saturation and very low iron binding capacity, this forms a pattern that needs investigation for haemochromatosis.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3977","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. The liver produces more transferrin when iron stores are low and less when they are adequate. Normal range is 2.15 to 3.65 g/L. Jashan's result of 2.44 is within range, suggesting the liver is not increasing production to compensate for iron deficiency. In haemochromatosis, transferrin is often normal or low because iron stores are replete.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"7.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0333","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3749","upper_optimal_position":"0.6039","units":"umol/l","description":"Iron binding capacity, also called TIBC or total iron binding capacity, measures how much additional iron the blood could carry. It reflects the spare capacity of transferrin to pick up more iron. Normal range is 44 to 76.1 umol/L. Jashan's result is reported as below 7.2, which is dramatically below the lower limit. This means there is almost no spare iron-carrying capacity in the blood, because transferrin is already saturated with iron. This is the most striking abnormality in the iron panel and strongly supports the need for an HFE gene test to investigate haemochromatosis.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3767","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5256","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is stored in the liver, spleen, and bone marrow. Normal male range is 22 to 322 ng/mL, with an optimal range of 50 to 200. Jashan's result of 61 is within the optimal range. Despite the elevated serum iron and transferrin saturation, the ferritin is not yet dramatically elevated. In early haemochromatosis, ferritin can still be normal or modestly raised while the saturation is already high, because it takes time for excess iron to accumulate in storage. If haemochromatosis is confirmed, serial ferritin monitoring becomes important.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian diet","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"243","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4105","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5816","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. The morning reference range is 145.4 to 619.4 nmol/L. Jashan's result of 243 is within the optimal range, suggesting normal adrenal function and no evidence of excessive stress response or adrenal insufficiency.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary disorders","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, depression, alcohol use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"110","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3767","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, present in small amounts in men. It plays a role in bone health, brain function, and libido. In men, it is produced by the conversion of testosterone through an enzyme called aromatase, which is more active in body fat. Normal male range is below 146.1 pmol/L. Jashan's result of 110 is within range. At his BMI, oestradiol could be expected to be elevated due to increased aromatase activity in adipose tissue, so a result within range is reassuring.","low_causes":"Very low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity (increased aromatase activity), liver disease, testosterone therapy, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4148","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5706","units":"nmol/L","description":"Progesterone is present in small amounts in men, produced by the adrenal glands and testes. It plays a minor role in brain function and sleep. Normal male range is 0.89 to 3.88 nmol/L. Jashan's result of 1.62 is within the normal range and is unremarkable.","low_causes":"Not clinically significant in men at mild levels","high_causes":"Adrenal hyperplasia, testicular tumours, exogenous progesterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.5","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"mIU/ml","description":"Luteinising hormone, or LH, is produced by the pituitary gland in the brain and stimulates the testes to produce testosterone. Normal range is 1.5 to 9.3. Jashan's result of 4.24 is within the optimal range, indicating the pituitary-testicular axis is signalling normally. His below-optimal testosterone with a normal LH suggests that the issue is not a failure of the signal but rather peripheral factors such as insulin resistance and excess body weight reducing the efficiency of testosterone production.","low_causes":"Pituitary disorders, anabolic steroid use, severe illness, obesity","high_causes":"Primary testicular failure, Klinefelter syndrome, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4819","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5693","units":"mIU/ml","description":"Follicle stimulating hormone, or FSH, is produced by the pituitary gland and stimulates sperm production in men. Normal range is 1.4 to 18.1. Jashan's result of 3.96 is within the optimal range, indicating normal pituitary signalling for sperm production.","low_causes":"Pituitary disorders, anabolic steroid use, severe illness","high_causes":"Primary testicular failure, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"13.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4532","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, mood, libido, and cognitive function. Normal male range is 8.4 to 28.7 nmol/L, with an optimal range of 18 to 30 for a 28-year-old. Jashan's result of 13.7 is within the laboratory range but below the optimal floor. At 28, testosterone should ideally be in the upper portion of the range. The most likely explanation is his insulin resistance and BMI near 30, both of which suppress testosterone production. Excess body fat increases the activity of aromatase, the enzyme that converts testosterone to oestradiol, and insulin resistance reduces the liver's production of SHBG, further disrupting the testosterone balance. Weight loss and improvement in insulin sensitivity are the most effective ways to raise testosterone naturally.","low_causes":"Obesity, insulin resistance, sleep deprivation, chronic stress, alcohol, pituitary disorders, aging","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"130","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4192","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3894","upper_optimal_position":"0.6106","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, it plays a role in immune regulation and reproductive function. Significantly elevated levels can suppress testosterone and libido. Normal range is 45 to 375. Jashan's result of 130 is within the optimal range and is not contributing to his below-optimal testosterone.","low_causes":"Not clinically significant in most cases","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"85.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4858","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index, or FAI, estimates the proportion of testosterone that is biologically active by using the ratio of total testosterone to SHBG. Normal male range is 30 to 150. Jashan's result of 85.09 is within the optimal range. Despite his total testosterone being below optimal, his very low SHBG means a higher proportion of that testosterone is free and active. While this maintains the free androgen level in range, it also means more testosterone is available for conversion to dihydrotestosterone (DHT), which is relevant to his hair thinning and skin breakouts.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"Low SHBG, insulin resistance, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3531","upper_optimal_position":"0.6223","units":"umol/L","description":"DHEA sulphate is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is considered a marker of adrenal function and biological ageing. Normal range is 0.44 to 13.4 umol/L. Jashan's result of 10 is within the optimal range and indicates healthy adrenal function.","low_causes":"Adrenal insufficiency, aging, chronic stress, corticosteroid use","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"16.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3103","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3836","upper_optimal_position":"0.5792","units":"nmol/l","description":"Sex hormone binding globulin, or SHBG, is a protein produced by the liver that binds to testosterone and oestradiol, controlling how much of each hormone is free and active in the body. Normal male range is 17.3 to 65.8 nmol/L, with an optimal range of 25 to 55. Jashan's result of 16.1 is below the lower limit. Low SHBG is strongly associated with insulin resistance, elevated BMI, high refined carbohydrate intake, and metabolic syndrome, all of which apply to Jashan. When SHBG is low, more testosterone is free and available for conversion to DHT by the enzyme 5-alpha reductase. This increased DHT activity is the primary driver of androgenetic (male pattern) hair loss and can also increase sebum production, contributing to skin breakouts. Improving insulin sensitivity through weight loss and dietary change is the most effective way to raise SHBG.","low_causes":"Insulin resistance, obesity, type 2 diabetes, metabolic syndrome, hypothyroidism, anabolic steroid use","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen therapy, anticonvulsant medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.346","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0.2","upper_normal":"0.6","lower_optimal":"0.3","upper_optimal":"0.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"nmol/l","description":"Free testosterone is the portion of total testosterone that is not bound to proteins and is therefore biologically active. It is calculated from total testosterone, SHBG, and albumin. Jashan's result of 0.346 is within the laboratory range. Despite a below-optimal total testosterone of 13.7, his very low SHBG of 16.1 means a larger fraction is unbound, keeping the free testosterone within range. However, this unbound testosterone is also more available for conversion to DHT, which is relevant to his hair thinning.","low_causes":"Low total testosterone, high SHBG, aging, obesity","high_causes":"Low SHBG, anabolic steroid use, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5920","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free thyroxine, or FT4, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the more active form, T3, in the tissues. Normal range is 11.5 to 22.7 pmol/L, with an optimal range of 14 to 20. Jashan's result of 20.2 is marginally above the optimal ceiling but within the laboratory range. Combined with his TSH of 1.94 and FT3 of 6, this indicates the thyroid is working very well.","low_causes":"Hypothyroidism, pituitary disorders, iodine deficiency, medications","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4430","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3686","upper_optimal_position":"0.4633","units":"mIU/l","description":"Thyroid stimulating hormone, or TSH, is produced by the pituitary gland to regulate the thyroid. It acts as a thermostat: when thyroid hormones are low, TSH rises to stimulate production; when they are adequate, TSH stays low. Normal range is 0.55 to 4.78 mIU/L, with an optimal range of 1.0 to 2.5. Jashan's result of 1.94 is within the optimal range, indicating the pituitary is satisfied with the thyroid hormone output.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary failure","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid hormone resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5852","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the most active thyroid hormone. It is produced mainly by the conversion of T4 in the liver, kidneys, and other tissues. Normal range is 2.6 to 7.1 pmol/L, with an optimal range of 4.5 to 6.5. Jashan's result of 6 is within the optimal range, indicating excellent conversion of T4 to T3 and effective thyroid function at the tissue level.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/ml","description":"Thyroid peroxidase antibodies, or TPO antibodies, are autoantibodies that attack the thyroid gland. Their presence suggests autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. The laboratory threshold is below 13.8 U/mL. Jashan's result of below 6.6 is negative, ruling out autoimmune thyroid disease.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another type of autoantibody directed against the thyroid gland. The cut-off for autoimmune thyroid disease is above 4.4 U/mL. Jashan's result of below 1.3 is negative. Combined with his negative TPO antibodies, autoimmune thyroid disease is effectively ruled out.","low_causes":"Not applicable (negative is normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.39","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin from sunlight and obtained from a small number of dietary sources. The sufficiency threshold is above 50 nmol/L, with an optimal range of 75 to 120. Jashan's result of 39 is in the insufficient category, between the deficiency threshold of 30 and the sufficiency level of 50. South Asian skin contains more melanin, which reduces vitamin D production from sunlight, making supplementation particularly important. His insufficient vitamin D is likely contributing to his borderline low corrected calcium and phosphate. Supplementation at 4,000 IU daily with a fat-containing meal should bring his level into the optimal range within 8 to 12 weeks.","low_causes":"Limited sun exposure, darker skin pigmentation, obesity (fat sequesters vitamin D), poor dietary intake, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5680","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5387","units":"pmol/L","description":"Parathyroid hormone, or PTH, is produced by the four small parathyroid glands behind the thyroid. It is the primary regulator of calcium in the blood, raising calcium when it drops by pulling it from bones, increasing kidney reabsorption, and stimulating vitamin D activation. Normal range is 0.98 to 4.73 pmol/L. Jashan's result of 4 is within the laboratory range but sitting in the upper third, which may represent the parathyroid glands beginning to compensate for his low corrected calcium and insufficient vitamin D. Correcting the vitamin D should bring PTH into the lower, more optimal portion of the range.","low_causes":"Post-thyroid surgery, magnesium deficiency, hypercalcaemia, vitamin D excess","high_causes":"Vitamin D deficiency, calcium deficiency, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"244","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3398","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4390","upper_optimal_position":"0.5720","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. Normal range is 193 to 982 pg/mL, with an optimal range of 500 to 900. Jashan's result of 244 is within the laboratory range but well below the optimal floor of 500. At this level, the body has enough to prevent overt deficiency symptoms like anaemia or neuropathy, but there is not enough for optimal nerve function, energy production, and homocysteine metabolism. A convenience-based diet is often low in B12-rich foods such as meat, fish, eggs, and dairy. Supplementation with sublingual methylcobalamin 1,000 mcg daily will address this.","low_causes":"Poor dietary intake, vegetarian or vegan diet, malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5294","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4980","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, red blood cell production, and neural tube development. Normal range is 3 to 17 ng/mL, with an optimal range above 8. Jashan's result of 18 is marginally above the upper laboratory limit. This is not a concern and most likely reflects dietary intake of folate-rich foods or a supplement containing folic acid. Excess folate is water-soluble and excreted by the kidneys.","low_causes":"Poor dietary intake, alcohol use, malabsorption, pregnancy, medications (methotrexate)","high_causes":"Supplementation, high folate diet, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"2.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7893","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mmol/l","description":"Total antioxidant activity measures the overall antioxidant capacity of the blood, reflecting the combined effect of dietary antioxidants, endogenous enzymes, and supplements. Normal range is 1.3 to 1.77 mmol/L. Jashan's result of 2.14 is above range. This is typically driven by antioxidant supplementation, high uric acid (though his is normal), or high dietary antioxidant intake. It is not a clinical concern.","low_causes":"Oxidative stress, poor dietary antioxidant intake, chronic disease","high_causes":"Antioxidant supplementation, high dietary intake, elevated uric acid, elevated bilirubin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1786","lower_normal":"40","upper_normal":"320","lower_optimal":"60","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase, or CK, is an enzyme found in muscles, the heart, and the brain. It is released into the blood when muscle is damaged or stressed, such as after intense exercise. Normal male range is 40 to 320 U/L. Jashan's result of below 15 is below the lower limit. A low CK, combined with his low creatinine of 42, suggests depleted muscle creatine stores. For someone training four resistance sessions per week, this is unexpectedly low and may indicate that the sessions are not generating sufficient mechanical load, or that dietary creatine intake is very low. Creatine monohydrate supplementation at 3 to 5 grams daily would help replenish these stores and improve training adaptations.","low_causes":"Low muscle mass, low creatine stores, sedentary lifestyle, alcoholic liver disease","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin medications, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.142","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"ng/ml","description":"Prostate-specific antigen, or PSA, is a protein produced by the prostate gland. It is used as a screening marker for prostate conditions including benign prostatic hyperplasia (BPH) and prostate cancer. Normal range for men under 50 is below 2.5 ng/mL. Jashan's result of 0.71 is well within range, which is expected at 28 and provides a useful baseline for future comparison.","low_causes":"Not clinically significant","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"PSA (Free)","group":"PROSTATE","result":"0.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA is the portion of PSA that is not bound to proteins in the blood. The ratio of free to total PSA helps distinguish between benign and malignant causes of elevated PSA. A higher free PSA ratio is reassuring. Jashan's result of 0.23 is within range.","low_causes":"Not applicable at normal PSA levels","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Ratio","group":"PROSTATE","result":"0.324","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8526","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio is the percentage of free PSA relative to total PSA. A ratio above 0.19 (19%) is considered normal and is reassuring. Jashan's ratio of 0.324 (32.4%) is well within the normal range and is reassuring.","low_causes":"Increased risk of prostate malignancy","high_causes":"Benign prostatic conditions, normal finding","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"11.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1605","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic and biliary cancers. It can also be mildly elevated in pancreatitis, liver disease, and other non-malignant conditions. Normal range is below 37 U/mL. Jashan's result of 11.87 is well within range, providing reassurance despite the mildly elevated lipase.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, biliary cancer, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA Marker","group":"TUMOR MARKERS","result":"4.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9239","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4348","units":"ng/ml","description":"Carcinoembryonic antigen, or CEA, is a protein that can be elevated in certain cancers, particularly colorectal cancer, but also in several non-malignant conditions. The reference range for non-smokers is below 2.3 ng/mL, and for smokers below 4.1. Jashan vapes nicotine but does not smoke tobacco. His result of 4.25 is above both thresholds. At 28, the pre-test probability of colorectal malignancy is extremely low. Non-malignant causes include alcohol use, liver inflammation, inflammatory bowel conditions, and nicotine exposure. His mildly elevated CEA most likely reflects one or more of these benign causes. Nevertheless, this should be noted by his GP and repeated in three months to confirm stability.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, other cancers, smoking, alcohol, inflammatory bowel disease, liver disease, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"9.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4632","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"Immunoglobulin G, or IgG, is the most abundant antibody in the blood and provides long-term immunity against infections. Normal range is 6.5 to 16 g/L. Jashan's result of 9.3 is within range. Despite his significantly elevated total globulin and rheumatoid factor, his IgG is normal, which suggests the globulin excess may be driven by a specific antibody subclass or a monoclonal protein rather than a broad IgG elevation. Serum protein electrophoresis will clarify this.","low_causes":"Immune deficiency, medications (immunosuppressants), nephrotic syndrome","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"Immunoglobulin M, or IgM, is the first antibody produced in response to a new infection. Normal range is 0.5 to 3 g/L. Jashan's result of 0.7 is within range. Rheumatoid factor is typically an IgM antibody, and despite his RF being above 90, his total IgM is only 0.7. This is not contradictory because rheumatoid factor is a specific IgM and can be elevated without raising total IgM significantly.","low_causes":"Immune deficiency, medications, certain lymphomas","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5914","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"Immunoglobulin A, or IgA, is the main antibody found in mucosal surfaces such as the gut, respiratory tract, and urogenital tract. It provides first-line defence against inhaled and ingested pathogens. Normal range is 0.4 to 3.5 g/L. Jashan's result of 2.8 is within range. Adequate IgA is also important for the validity of the coeliac screen (tissue transglutaminase IgA), which is negative.","low_causes":"Selective IgA deficiency (most common primary immune deficiency), medications","high_causes":"IgA nephropathy, liver disease, coeliac disease, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"100","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"IU/ml","description":"Immunoglobulin E, or IgE, is the antibody associated with allergic reactions and parasitic infections. Normal range is below 100 IU/mL. This result is pending and will be reviewed when available.","low_causes":"Not clinically significant","high_causes":"Allergies, asthma, eczema, parasitic infections, certain immune disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor, or RF, is an autoantibody that targets the body's own immunoglobulin G antibodies. It is most commonly associated with rheumatoid arthritis but can also be elevated in other autoimmune conditions, chronic infections, and liver disease. Normal range is below 14 IU/mL. Jashan's result is above 90, which is significantly elevated, more than six times the upper limit. This is not a borderline finding. While Jashan does not currently report joint symptoms, RF at this level warrants thorough investigation. The GP should arrange anti-CCP antibodies, which are more specific for rheumatoid arthritis, along with ANA to screen for other autoimmune conditions, and serum protein electrophoresis given the concurrent elevated globulin. Early detection of autoimmune conditions before joint damage occurs is one of the most valuable outcomes of comprehensive blood testing.","low_causes":"Not applicable (negative is normal)","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, systemic lupus, chronic infection, hepatitis C, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"1.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0710","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA, or tTG-IgA, is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten. The test is only valid if the patient is eating a gluten-containing diet and has adequate IgA levels. Jashan's result of 1.02 is negative (below 7.19), and his IgA is 2.8, confirming the test is valid. This effectively rules out coeliac disease as a cause of any symptoms.","low_causes":"Not applicable (negative is normal)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urine_ph","name":"Urine pH","group":"URINALYSIS","result":"6","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity or alkalinity of the urine. Normal range is typically 4.5 to 8. Jashan's urine pH of 6 is mildly acidic and within normal limits.","low_causes":"High protein diet, metabolic acidosis, cranberry consumption","high_causes":"Urinary tract infection, vegetarian diet, metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_protein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/l","description":"Urine protein tests for the presence of protein in the urine, which can indicate kidney damage or disease. Jashan's result is negative, indicating no protein leakage from the kidneys. This is reassuring for kidney health.","low_causes":"","high_causes":"Kidney disease, urinary tract infection, dehydration, intense exercise, fever","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_ketones","name":"Urine Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine ketones test for the presence of ketone bodies, which are produced when the body burns f function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){

  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{

}

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }

function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');

}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
