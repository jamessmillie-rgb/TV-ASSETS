<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

is dramatically below the lower limit of 44. Transferrin saturation above 45% on two separate occasions is the standard trigger for investigating hereditary haemochromatosis, a genetic condition in which the body absorbs too much iron from food and deposits it in organs over time. His ferritin at 61 is reassuringly within range, which suggests that if this is haemochromatosis, it has been caught early before significant iron accumulation has occurred. The fact that his CRP is below 0.2 makes an inflammatory explanation for the high iron very unlikely. His GP should order an HFE gene test, which is a simple blood test looking for the C282Y and H63D mutations that cause the vast majority of haemochromatosis cases. If positive, catching this at 28 is an enormous advantage because the treatment, regular blood donation, is straightforward and prevents all the long-term complications. He should not take any iron-containing supplements until this has been investigated.\n\nThe third finding for his GP is his Lp(a), or lipoprotein little a, which is 203.17, well above the upper limit of 32 and sitting at the boundary between the moderate and high risk categories. Lp(a) is a genetically inherited particle that is essentially a modified LDL particle with an extra protein wrapped around it. It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like regular LDL, it promotes blood clotting, and it drives local inflammation. Lp(a) cannot be changed through diet, exercise, or any currently available medication in routine practice. The level is set by genetics and remains essentially fixed for life. This is a permanent entry in his medical record. It also means his first-degree relatives, parents and siblings, should be offered an Lp(a) test because there is a 50% chance of inheriting the trait. What makes this finding particularly important is the context: Jashan is 28, South Asian, and now has a confirmed elevated Lp(a). South Asian ethnicity already carries a higher baseline cardiovascular risk, and Lp(a) adds to that independently. This means every other modifiable cardiovascular risk factor, his LDL, his ApoB, his triglycerides, his weight, his diet, and his alcohol intake, becomes more important to optimise because these are the levers he can actually pull.\n\nWith those three priorities stated, there is genuine good news in this report. His inflammatory marker hs-CRP is below 0.2, which is about as low as that marker can read. CRP, or C-reactive protein, measures systemic inflammation, and at a BMI just under 30 with a convenience-based diet and regular alcohol, this level is genuinely impressive. It means there is no measurable background inflammation in his system. His thyroid is in excellent health. TSH at 1.94 sits in the ideal range, free T4 at 20.2 is in the upper portion of the optimal band, and free T3 at 6.0 is also well within the optimal range. Both thyroid antibodies are firmly negative, ruling out any autoimmune thyroid process. His liver function is clean. ALT is below 21 and GGT is below 7, which at more than seven drinks per week is genuinely reassuring because GGT is the enzyme most sensitive to alcohol and his is essentially undetectable. His FIB-4 fibrosis score is 0.8, well within the safe range, confirming no sign of liver scarring. His kidney function, as measured by cystatin C, is excellent. Cystatin C at below 0.25 gives a calculated eGFR of 193, reflecting outstanding filtration. His creatinine at 42 is below the laboratory range of 65 to 104, but this is almost certainly explained by his body composition. Creatinine is produced by muscle, and his creatine kinase, the enzyme that reflects muscle mass and muscle turnover, is below 15, which is well below the lower limit of 40. Together these suggest he is carrying relatively little skeletal muscle mass despite training four times a week, which may relate to the quality of his nutrition or the nature of his training. The cystatin C result confirms his kidneys are not the issue. His PSA at 0.71 is low and entirely normal for a 28-year-old. His urine is completely clean with no protein, no blood cells, no bacteria, and no growth on culture.\n\nNow to his cardiovascular risk profile, which beyond the Lp(a) already discussed, shows a pattern driven by diet, alcohol, and body composition. His total cholesterol is 7.6, his LDL is 4.84 against an ideal below 2.6, and his ApoB is 1.59, which the laboratory classifies as very high. ApoB, or apolipoprotein B, is a count of every atherogenic particle in the blood, essentially every particle capable of depositing cholesterol into an artery wall. At 1.59 against a target of below 0.9 and an ideal of below 0.8, this is nearly double where it should be. His ApoB to ApoA1 ratio is 0.98, above the higher risk threshold of 0.9. ApoA1 at 1.62 is healthy and reflects his HDL of 1.6, which is a genuinely strong result and sits in the protective range. His triglycerides at 2.66 are elevated, likely reflecting the combination of alcohol, a convenience-based diet, and the relatively high carbohydrate intake that tends to accompany takeaway food. His VLDL at 1.21 and remnant cholesterol at 1.16 are both elevated, and these triglyceride-rich remnant particles are now recognised as independently harmful to artery walls. His TG to HDL ratio is 1.66, above the ideal of below 0.87 and above the upper threshold of 1.5. The overall picture is a lipid profile carrying significant risk, made more urgent by the Lp(a). The encouraging part is that almost everything except the Lp(a) is modifiable. Reducing alcohol, shifting away from convenience food toward whole foods, losing body fat, and increasing soluble fibre intake could substantially improve these numbers.\n\nHis glucose metabolism tells a clear and important story. His fasting glucose is 5.8, which is within the laboratory range of 3.5 to 6.0 but sits in what is medically classified as impaired fasting glucose, the grey zone between 5.6 and 6.0. His HbA1c at 39 mmol/mol, which represents his average blood sugar over the previous three months, is within the normal range below 42 but is approaching the pre-diabetic threshold. His fasting insulin at 11.54 is within the laboratory range but well above the optimal ceiling of 8, and his HOMA-IR, a calculation that estimates insulin resistance, is 2.97, above the threshold of 2.9 that indicates significant insulin resistance. His C-peptide at 2.0 ug/L, which converts to 662 pmol/L, is within range and confirms the pancreas is producing plenty of insulin. The pattern is unmistakable: his cells are becoming resistant to insulin, forcing the pancreas to produce more and more insulin to keep blood sugar controlled. At 28, this is the earliest possible warning that the metabolic trajectory is heading toward type 2 diabetes if nothing changes. South Asian ethnicity is associated with insulin resistance developing at a lower BMI than in European populations, so a BMI of 29.6 in a South Asian male may carry the same metabolic burden as a BMI of 33 or 34 in a European male. The positive framing is that catching this at 28 means it is entirely reversible through dietary change, fat loss, and continued exercise.\n\nHis rheumatoid factor has returned at above 90, which is significantly above the upper limit of 14. Rheumatoid factor, or RF, is an antibody that is most commonly associated with rheumatoid arthritis, but it can also be elevated in chronic infections, other autoimmune conditions, and occasionally in people who smoke or vape without any disease at all. At 28 with no reported joint pain or swelling, this may be an incidental finding, but the level is high enough that it warrants a conversation with his GP. They may wish to check an anti-CCP antibody, which is more specific for rheumatoid arthritis, and examine his joints clinically. His IgE is also elevated at 222 against an upper limit of 100. IgE is the antibody class associated with allergic responses, and this level suggests he may have an underlying allergic tendency, whether that manifests as hayfever, eczema, food sensitivities, or asthma. Given his reported skin breakouts, the elevated IgE may be relevant. It would be worth discussing with his GP whether allergy testing is appropriate.\n\nHis total protein at 97, albumin at 57, and globulin at 40 are all above their respective upper limits. Albumin at 57 is unusually high and most commonly reflects dehydration at the time of the blood draw, which concentrates all proteins in the blood. This is consistent with a fasting sample where fluid intake may have been restricted, and it may also be relevant to the low sodium if there was a combination of dehydration and then rapid water intake. The globulin at 40 against an upper limit of 36, combined with the very high rheumatoid factor and elevated IgE, may reflect genuine immune activation rather than simple dehydration. His GP can assess this alongside the rheumatoid factor investigation.\n\nHis corrected calcium is 2.02, below the lower limit of 2.2. The laboratory notes that calcium can be falsely reduced in older specimens, and his albumin is significantly elevated, which affects the correction formula. The raw calcium at 2.24 is within range, and the correction formula, which adjusts calcium downward when albumin is high, may be overcorrecting in this case because the albumin is elevated from dehydration rather than from genuine protein excess. His PTH at 4.0 is within range, which is reassuring because if calcium were genuinely low, the body would push PTH higher to compensate. His GP should repeat calcium, albumin, and PTH on a fresh, well-hydrated sample before attributing significance to this result.\n\nHis magnesium at 1.44 is above the upper limit of 1.11. Elevated magnesium is uncommon and may reflect supplementation, recent antacid use, or the same dehydration effect concentrating the blood. If he is supplementing with magnesium, this would be the most likely explanation.\n\nHis lipase at 88 is above the upper limit of 60 while his amylase at 76 is normal. Lipase is produced primarily by the pancreas and is a marker of pancreatic function. A mildly elevated lipase without symptoms such as severe abdominal pain, nausea, or vomiting is usually not indicative of acute pancreatitis, but regular alcohol intake is the second most common cause of pancreatic inflammation after gallstones. This is worth monitoring, and reducing alcohol intake would be the most direct way to support his pancreatic health.\n\nHis CEA, or carcinoembryonic antigen, is 4.25 against a non-smoker upper limit of 2.3. CEA is a protein that can be elevated in several cancers but is also commonly raised by smoking and, relevantly, by vaping nicotine. Given that he vapes, this is the most likely explanation, and the smoker reference range of 0 to 4.1 makes his result only marginally above that adjusted threshold. His GP should be aware of this finding, and it would be worth repeating CEA if he were to stop vaping, to confirm the level normalises.\n\nHis testosterone at 13.7 is within the laboratory range but below the optimal threshold of 18, and his SHBG at 16.1 is below the lower limit of 17.3. SHBG, or sex hormone binding globulin, is the protein that carries testosterone in the blood, and low SHBG is strongly associated with insulin resistance, which is consistent with his HOMA-IR of 2.97. When SHBG is low, more testosterone is free and bioavailable, which is why his free androgen index at 85.09 and calculated free testosterone at 0.319 are both within range. His hair thinning may relate to this pattern: when more testosterone is in the free, active form, more of it is converted to DHT, or dihydrotestosterone, which is the hormone responsible for androgenetic hair loss. His skin breakouts may share the same mechanism, as free androgens stimulate sebum production. Improving insulin resistance through diet and fat loss would be expected to raise SHBG, which in turn would reduce the proportion of free testosterone and potentially help both symptoms.\n\nHis vitamin D at 39 is classified as insufficient, sitting between the 30 and 50 thresholds and well below the optimal range of 75 to 120. At South Asian ethnicity with higher melanin levels, vitamin D synthesis from sunlight is less efficient, making supplementation particularly important. His vitamin B12 at 244 is within the laboratory range but below the optimal threshold of 500. A convenience-based diet may not provide sufficient B12-rich foods, and this level is worth improving. His folate at 18 is marginally above the upper limit of 17, which is a harmless finding and may reflect a recent meal high in folate or supplementation.\n\nHis ESR at 19 is above the upper limit of 12. ESR, or erythrocyte sedimentation rate, is a non-specific marker of inflammation. Given his CRP is below 0.2, the elevated ESR is unlikely to reflect acute systemic inflammation. ESR can be elevated by high globulin levels, which he has, and by the elevated immunoglobulins suggested by his immune profile. This is most likely being driven by the same process that is producing the high rheumatoid factor and elevated IgE rather than representing a separate concern.\n\nHis MCHC at 345 sits exactly at the upper limit of the range, which is not clinically significant. His phosphate at 0.8 is at the floor of the range but within it. His cortisol at 243 is within the expected morning range. His oestradiol at 110 is within range for a male. His progesterone at 1.62 is within the male reference range. His LH and FSH are both normal, confirming the hypothalamic-pituitary-gonadal axis is functioning appropriately.","links":"The most impactful change Jashan can make is to his diet. A convenience and takeaway-based diet rated 5 out of 10 for quality is the single thread that connects his insulin resistance, his elevated triglycerides, his high LDL and ApoB, and his below-optimal testosterone. The goal is not perfection but a meaningful shift: reducing takeaway frequency to once or twice a week at most and building meals around whole protein sources, vegetables, and complex carbohydrates for the remaining meals. At his current weight of 99 kg with a BMI of 29.6, his estimated maintenance calories are approximately 2,750 to 2,850 per day given his six training sessions and daily step count. To lose body fat while preserving muscle, a target of 2,200 to 2,400 calories per day would create a sustainable deficit. His protein target should be 1.6 to 2.0 grams per kilogram of body weight, which means 158 to 198 grams of protein per day. This is difficult to achieve on a convenience diet, which is another reason the dietary shift matters. Protein supports muscle protein synthesis, improves satiety, and has a higher thermic effect than fat or carbohydrate, meaning more energy is used simply digesting it. A realistic initial body weight target would be 88 to 92 kg, which would bring his BMI into the 26 to 27 range and would be expected to significantly improve his insulin sensitivity, triglycerides, and SHBG.\n\nFor his cardiovascular risk profile, the specific dietary changes that would help most are: increasing soluble fibre to at least 10 grams per day from sources such as oats, barley, lentils, chickpeas, beans, and psyllium husk; eating oily fish such as salmon, mackerel, or sardines at least twice per week for their omega-3 content; reducing saturated fat by swapping fried foods and processed meats for grilled or baked alternatives; and adding a daily handful of nuts, particularly almonds or walnuts, which have evidence for LDL reduction. These changes, combined with fat loss, could realistically reduce his ApoB by 20 to 30% over six months.\n\nAlcohol should be reduced from more than seven drinks per week to under seven, and ideally under four. Beyond the direct calorie contribution, approximately 150 to 200 calories per drink, alcohol raises triglycerides directly, contributes to visceral fat accumulation, elevates lipase, and disrupts sleep architecture even when total sleep duration appears adequate. Given his elevated lipase, reducing alcohol is particularly relevant for his pancreatic health.\n\nVaping nicotine is the most likely explanation for his mildly elevated CEA. Nicotine from vaping also raises heart rate and blood pressure and has emerging evidence for promoting insulin resistance. Stopping vaping would allow a repeat CEA to confirm normalisation and would remove one more contributor to his cardiovascular risk profile.\n\nFor his GP, he should bring this report and specifically discuss: his sodium of 125 with a request for repeat electrolytes, paired urine and serum osmolality; his transferrin saturation of 63.3% and iron of 38.8 with a request for HFE gene testing for haemochromatosis; his Lp(a) of 203.17 for permanent medical records and family screening; his rheumatoid factor above 90 with a request for anti-CCP antibody and clinical joint examination; his HOMA-IR of 2.97 indicating significant insulin resistance; his CEA of 4.25 in the context of nicotine vaping; and his lipase of 88 in the context of alcohol consumption.\n\nA retest in four to six months should include a fasting lipid panel with ApoB, fasting glucose and insulin with HOMA-IR, HbA1c, a full iron panel, sodium, corrected calcium on a well-hydrated sample, lipase, CEA, and rheumatoid factor. This will show whether the dietary and lifestyle changes have shifted the metabolic picture.","flags":"SODIUM 125 mmol/L (range 133 to 146): Significant hyponatraemia in a 28-year-old male with no medications. Requires repeat electrolytes, paired serum and urine osmolality to determine the mechanism. May be dilutional, but must be investigated.\n\nIRON STUDIES: Serum iron 38.8 umol/L (range 11.6 to 31.3), transferrin saturation 63.3% (range 18 to 55%), UIBC below 7.2 (range 44 to 76.1). Ferritin 61 ng/mL within range. CRP below 0.2, ruling out inflammatory cause. Pattern is consistent with possible hereditary haemochromatosis. HFE gene testing recommended.\n\nLIPOPROTEIN(a) 203.17 nmol/L (range below 32): High risk category. Genetically fixed. Should be recorded as a permanent entry. First-degree relatives should be screened.\n\nAPOLIPOPROTEIN B 1.59 g/L (target below 0.9): Very high. ApoB/A1 ratio 0.98, above the higher risk threshold of 0.9. LDL 4.84 (ideal below 3.0). Total cholesterol 7.6. Non-HDL cholesterol 6.0. Triglycerides 2.66. Combined with Lp(a), this represents a significantly elevated cardiovascular risk profile in a 28-year-old South Asian male.\n\nHOMA-IR 2.97 (range 0.5 to 1.5): Significant insulin resistance. Fasting glucose 5.8 (impaired fasting glucose range). HbA1c 39 mmol/mol approaching pre-diabetic threshold. Fasting insulin 11.54. Early metabolic syndrome pattern. South Asian ethnicity confers additional risk at lower BMI thresholds.\n\nRHEUMATOID FACTOR above 90 IU/mL (range below 14): Significantly elevated. No joint symptoms reported. Anti-CCP antibody recommended to assess specificity for rheumatoid arthritis. Clinical joint examination advised.\n\nIgE 222 IU/mL (range below 100): Elevated, suggesting allergic tendency. May be relevant to reported skin breakouts. Consider allergy panel if clinically appropriate.\n\nCEA 4.25 ng/mL (non-smoker range 0 to 2.3, smoker range 0 to 4.1): Patient vapes nicotine, which is the most likely explanation. Marginally above even the smoker range. Recommend repeat if patient stops vaping.\n\nLIPASE 88 U/L (range 13 to 60): Mildly elevated with normal amylase. No abdominal symptoms reported. Alcohol is the most likely contributor. Monitor with reduced alcohol intake.\n\nCORRECTED CALCIUM 2.02 mmol/L (range 2.2 to 2.6): Below range, but raw calcium 2.24 is within range. Albumin 57 is significantly elevated, likely from dehydration, and the correction formula may be overcorrecting. PTH 4.0 is within range. Recommend repeat on well-hydrated fresh sample.\n\nSODIUM, CORRECTED CALCIUM, and PROTEIN PANEL (total protein 97, albumin 57, globulin 40 all above range): The combination suggests possible dehydration concentrating proteins, with the corrected calcium artefactually low as a consequence. Repeat on well-hydrated sample.\n\nSHBG 16.1 nmol/L (range 17.3 to 65.8): Below range. Low SHBG is strongly associated with insulin resistance and metabolic syndrome, consistent with HOMA-IR 2.97.\n\nCREATININE 42 umol/L (range 65 to 104): Below range but explained by low muscle mass, as evidenced by CK below 15. Cystatin C eGFR 193 confirms excellent renal function.\n\nCREATINE KINASE below 15 U/L (range 40 to 320): Below range, indicating low muscle mass despite reported resistance training. May reflect training intensity, nutritional support for muscle, or body composition.\n\nESR 19 mm/hour (range below 12): Elevated, likely driven by elevated globulin and immunoglobulin levels rather than acute inflammation, given CRP below 0.2.\n\nMAGNESIUM 1.44 mmol/L (range 0.53 to 1.11): Above range. May reflect supplementation or dehydration effect. Clarify supplement use.\n\nVITAMIN D 39 nmol/L: Insufficient. Below the sufficient threshold of 50 and well below optimal of 75 to 120. South Asian ethnicity reduces cutaneous synthesis.\n\nVITAMIN B12 244 pg/mL: Within laboratory range (193 to 982) but below optimal of 500.\n\nReassuring negatives: CRP below 0.2, ruling out systemic inflammation. Both thyroid antibodies negative. Tissue transglutaminase negative, ruling out coeliac disease. PSA 0.71, entirely normal. CA 19-9 at 11.87, normal. Urine fully clean with no growth on culture. FIB-4 0.8, no liver fibrosis. Liver enzymes all clean despite alcohol intake. Haemoglobin, red cell indices, platelets, and white cell differential all normal.","recommendations":"Discuss sodium of 125 with GP as a priority. Request repeat electrolytes and paired osmolality studies.\n\nRequest HFE gene test from GP to investigate transferrin saturation of 63.3% and elevated serum iron. Do not take any iron-containing supplements until this has been resolved.\n\nRecord Lp(a) of 203.17 as a permanent entry in medical records. Arrange Lp(a) testing for parents and siblings.\n\nDiscuss rheumatoid factor above 90 with GP. Request anti-CCP antibody test and clinical joint examination.\n\nDiscuss elevated CEA of 4.25 with GP in the context of nicotine vaping. Plan to repeat CEA if vaping is stopped.\n\nReduce takeaway and convenience food to once or twice per week. Build meals around whole protein sources, vegetables, and complex carbohydrates. Target 2,200 to 2,400 calories per day with 158 to 198 grams of protein daily.\n\nTarget a body weight of 88 to 92 kg over the next six to nine months through the dietary changes and continued training.\n\nReduce alcohol to under seven drinks per week, ideally under four, to support triglyceride reduction, pancreatic health, and fat loss.\n\nStop vaping nicotine to allow CEA normalisation and remove a cardiovascular risk contributor.\n\nIncrease soluble fibre to at least 10 grams per day from oats, lentils, chickpeas, beans, and psyllium husk. Eat oily fish at least twice per week. Add a daily handful of almonds or walnuts.\n\nSupplement vitamin D at 4,000 IU daily with vitamin K2.\n\nSupplement vitamin B12 as sublingual methylcobalamin 1,000 mcg daily.\n\nClarify magnesium supplementation with GP given elevated level of 1.44. If supplementing, stop and retest.\n\nRetest in four to six months: fasting lipid panel with ApoB, fasting glucose and insulin with HOMA-IR, HbA1c, full iron panel, sodium, corrected calcium on a well-hydrated sample, lipase, CEA, rheumatoid factor, vitamin D, and B12.","supplementation":"DO NOT take any iron-containing supplements or multivitamins containing iron. His transferrin saturation is 63.3% and serum iron is 38.8, both significantly above range, and until hereditary haemochromatosis has been excluded by HFE gene testing, adding iron could accelerate organ damage if the condition is present.\n\nVitamin D3 as cholecalciferol, 4,000 IU daily taken with a meal containing fat to aid absorption. His level of 39 is insufficient and South Asian skin produces vitamin D less efficiently from sunlight. The higher dose of 4,000 IU rather than the standard 2,000 IU is appropriate because his BMI of 29.6 means fat tissue will sequester some of the supplemented vitamin D, reducing what reaches the bloodstream. The target is to bring his level above 75 and ideally into the 75 to 120 optimal range.\n\nVitamin K2 as MK-7, 200 mcg daily, taken alongside the vitamin D. Vitamin K2 directs calcium into bones and teeth rather than allowing it to deposit in arteries. It works synergistically with vitamin D and should always accompany vitamin D supplementation, particularly in someone with an elevated cardiovascular risk profile.\n\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue rather than swallowed as a tablet. Sublingual delivery bypasses the digestive system and provides more reliable absorption. His level of 244 is within the laboratory range but below the optimal threshold of 500, and a convenience-based diet is unlikely to provide enough B12-rich foods consistently. B12 is essential for red blood cell formation, neurological function, and homocysteine metabolism.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This should be a high-concentration product so that the dose can be achieved in two to three capsules rather than six to eight. Omega-3 fatty acids help reduce triglycerides, support the anti-inflammatory balance in the body, and may contribute to modest improvements in insulin sensitivity. Given his triglycerides of 2.66 and ApoB of 1.59, this is one of the more evidence-based supplements for his specific profile.\n\nRegarding magnesium: his level at 1.44 is above the upper limit of 1.11. If he is currently taking a magnesium supplement, he should stop it and retest. If he is not supplementing, his GP should be made aware of this result. He should not begin magnesium supplementation until the repeat result confirms whether the level normalises.\n\nThe most important changes from this report are not supplements. They are the shift from convenience food to whole-food meals with adequate protein, the reduction in alcohol, stopping vaping, and the GP investigations for his sodium, iron studies, Lp(a), and rheumatoid factor. These will determine his health trajectory far more than any capsule.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5600","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body maintains blood sugar when no food is coming in. Jashan's result of 5.8 is within the laboratory range of 3.5 to 6.0 but sits above the 5.6 threshold that defines impaired fasting glucose, an early warning zone for metabolic health. For a 28-year-old aiming for long-term health, the ideal fasting glucose is between 4.0 and 5.4. His result, combined with his insulin and HOMA-IR findings, suggests his body is having to work harder than it should to keep blood sugar controlled.","low_causes":"Fasting too long before the test, excessive exercise before the test, reactive hypoglycaemia, insulin-producing tumours (rare)","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress hormones, high-carbohydrate meal the night before, medications such as corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4750","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning it has sugar permanently attached to it. Because red blood cells live for about three months, HbA1c gives an average blood sugar picture over that period. Jashan's result of 5.7% is within the normal range below 6.0% but sits in the upper portion, consistent with his fasting glucose and insulin resistance findings.","low_causes":"Recent blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes, iron deficiency (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5476","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the international standard unit. Jashan's result of 39 is within the normal range below 42 but above the optimal ceiling of 36. The pre-diabetic threshold begins at 42, and his result is approaching that boundary. This is consistent with his insulin resistance pattern and reinforces the importance of dietary changes.","low_causes":"Recent blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"11.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4682","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5492","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar controlled when no food is coming in. A truly insulin-sensitive body needs very little. Jashan's result of 11.54 is within the laboratory range of 2.6 to 24.9 but sits well above the optimal ceiling of 8. This means his pancreas is having to produce more insulin than ideal to maintain his blood sugar at 5.8, which is the hallmark of early insulin resistance. The body is compensating successfully for now, but the compensation itself carries metabolic consequences including fat storage, elevated triglycerides, and low SHBG.","low_causes":"Low-carbohydrate diet, prolonged fasting, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high-carbohydrate diet, excess body fat (especially visceral), metabolic syndrome, polycystic ovarian syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"662","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4752","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5279","units":"pmol/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It is a more reliable measure of how much insulin the pancreas is actually producing because, unlike insulin, it is not cleared rapidly by the liver. Jashan's result of 662 pmol/L (converted from 2.0 ug/L) is within range and confirms his pancreas is producing adequate insulin. Combined with his elevated HOMA-IR, this confirms the issue is not insulin production but insulin resistance at the cellular level.","low_causes":"Type 1 diabetes, advanced type 2 diabetes with pancreatic exhaustion, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9900","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin and provides a single number that estimates how resistant the body's cells are to insulin. Below 1.0 indicates excellent insulin sensitivity. Above 1.9 indicates early insulin resistance. Above 2.9 indicates significant insulin resistance. Jashan's result of 2.97 crosses the significant insulin resistance threshold. At 28, this is a critical early warning. Insulin resistance is the metabolic engine behind type 2 diabetes, elevated triglycerides, low HDL, low SHBG, and visceral fat accumulation. The encouraging news is that it is fully reversible at this stage through dietary change, fat loss, and exercise.","low_causes":"High insulin sensitivity, low-carbohydrate diet, lean body composition, regular exercise","high_causes":"Excess body fat, high-carbohydrate/processed diet, sedentary lifestyle, South Asian ethnicity, sleep deprivation, chronic stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"100.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4474","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates pancreatic beta cell function, essentially how well the insulin-producing cells of the pancreas are working. Calculated as (20 x Insulin) / (Glucose - 3.5), Jashan's result of 100.35 is within the healthy range of 80 to 200, confirming that his pancreas is functioning adequately. The issue is not insulin production but insulin resistance at the tissue level.","low_causes":"Pancreatic beta cell exhaustion, late-stage type 2 diabetes, type 1 diabetes, chronic pancreatitis","high_causes":"Insulin resistance with compensatory hyperinsulinaemia, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"63.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7427","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.4928","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is currently loaded with iron. It is the most useful screening marker for iron overload. Jashan's result of 63.32% is above the upper limit of 55% and well above the optimal range of 25 to 40%. A transferrin saturation above 45% on repeated testing is the standard trigger for investigating hereditary haemochromatosis, a genetic condition where the body absorbs too much iron from food. This finding should be discussed with his GP.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Hereditary haemochromatosis, iron supplementation, liver disease, recent iron-rich meal, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"38.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7264","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3842","upper_optimal_position":"0.5485","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood. Jashan's result of 38.8 is significantly above the upper limit of 31.3. Serum iron can fluctuate with meals and time of day, but when combined with his elevated transferrin saturation and suppressed UIBC, the pattern is consistent and warrants investigation for hereditary haemochromatosis.","low_causes":"Iron deficiency, chronic disease, poor dietary intake, blood loss","high_causes":"Hereditary haemochromatosis, iron supplementation, liver damage, haemolytic anaemia, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3977","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.15","upper_optimal":"3.65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream. The body produces more transferrin when iron stores are low and less when they are adequate or high. Jashan's transferrin at 2.44 is within the normal range. In iron deficiency, transferrin rises as the body tries to scavenge more iron; in iron overload, it can fall. His level being within range alongside very high serum iron and saturation is consistent with a haemochromatosis pattern where the body has not yet downregulated transferrin production.","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uibc","name":"Iron Binding Capacity (UIBC)","group":"IRON STUDIES","result":"7.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0489","lower_normal":"44","upper_normal":"76.1","lower_optimal":"44","upper_optimal":"76.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"umol/L","description":"UIBC, or unsaturated iron binding capacity, measures how much spare capacity the transferrin protein has to carry additional iron. A low UIBC means the transferrin is already heavily loaded with iron, leaving little room for more. Jashan's result of below 7.2 against a lower limit of 44 is dramatically low, confirming that his iron transport system is nearly saturated. This is the third piece of the iron overload picture alongside his elevated serum iron and high transferrin saturation.","low_causes":"Iron overload, haemochromatosis, excessive iron supplementation","high_causes":"Iron deficiency, increased iron demand","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3766","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5926","units":"ng/mL","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve in the liver, spleen, and bone marrow. Jashan's ferritin at 61 is within both the laboratory range and the optimal range of 50 to 200. In the context of his very elevated serum iron and transferrin saturation, a normal ferritin is potentially reassuring because it suggests that if haemochromatosis is present, iron has not yet accumulated to damaging levels in the organs. At 28, this would represent very early detection.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, heavy exercise, coeliac disease","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"148","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"130","upper_normal":"170","lower_optimal":"135","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. It picks up oxygen in the lungs and delivers it to every cell in the body. Jashan's level of 148 is comfortably within the male reference range and the optimal band, indicating healthy oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, smoking/vaping, living at altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^12/L","description":"Red blood cell count measures the total number of red cells
