lammation marker that specifically tracks cardiovascular inflammation, is below 0.2, which is exceptional and is a genuinely surprising positive given his BMI, elevated lipids, and alcohol intake. This suggests that despite the metabolic strain showing in his lipids and glucose, the inflammatory component of cardiovascular risk is currently very low. His thyroid function is excellent. His TSH is 1.94, sitting comfortably within the optimal range of 1.0 to 2.5. His free T4 is 20.2, within the optimal band of 14 to 20. His free T3 is 6, within the optimal range of 4.5 to 6.5. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His kidney function by Cystatin C, which is a more reliable marker than creatinine at higher body weights, gives an eGFR of 193, which is excellent. His creatinine is 42, which is below the laboratory range of 65 to 104, but creatinine is produced by muscle mass and his creatine kinase is below 15, also below range. This suggests low muscle creatine stores rather than kidney impairment, and the Cystatin C confirms the kidneys are working superbly. His uric acid is 290, within range. His full blood count is healthy across the board, with haemoglobin at 148, red cells at 4.95, white cells at 4.7, platelets at 229, and a neutrophil to lymphocyte ratio of 1.15, which sits in the optimal range of 1.0 to 2.0 and suggests a well-balanced immune system. His PSA is 0.71, well within range, and his free PSA ratio of 0.324 is normal, which is expected at 28 but provides a useful baseline. His CA 19-9 is 11.87, within range. His reproductive hormones show LH, FSH, prolactin, oestradiol, and DHEA-S all within healthy ranges. His urine is completely clean with no protein, no glucose, no blood, no white cells, no nitrites, and no bacterial growth.\n\nHis testosterone at 13.7 is within the laboratory range of 8.4 to 28.7 but sits below the optimal floor of 18 for a 28-year-old man. His SHBG, or sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues, is 16.1, below the lower limit of 17.3. Low SHBG is commonly driven by insulin resistance, excess body weight, and high-carbohydrate convenience diets, all of which apply here. The combination of below-optimal testosterone and low SHBG is relevant to his reported hair thinning, because when SHBG is low, a higher proportion of testosterone is free and available for conversion to dihydrotestosterone, or DHT, which is the hormone most associated with male pattern hair loss. His free androgen index is 85, which is within range but reflects this dynamic. The skin breakouts he reports may also relate to the higher free androgen availability driving sebum production. Improving insulin sensitivity through weight loss and dietary change should raise SHBG, which would reduce the free androgen load and may help both the hair thinning and the skin breakouts.\n\nHis vitamin D at 39 is insufficient, sitting between the 30 deficiency threshold and the 50 sufficiency threshold, and well below the optimal range of 75 to 120. South Asian skin produces less vitamin D from sunlight due to higher melanin content, making supplementation essential. His vitamin B12 at 244 is within the laboratory range of 193 to 982 but below the optimal floor of 500. At this level the body has enough to prevent deficiency symptoms but not enough for optimal nerve function and energy metabolism. His folate at 18 is marginally above the upper limit of 17, which is not a concern and likely reflects dietary intake or supplementation.\n\nHis creatine kinase at below 15 is below the lower limit of 40. CK is released from muscle during exercise and at rest reflects baseline muscle mass. For someone training four resistance sessions per week, this is unexpectedly low and may suggest either that the resistance sessions are not generating sufficient mechanical stress on the muscle, or that muscle creatine stores are genuinely low. This, combined with the low creatinine, paints a picture of someone whose body composition may benefit from more progressive resistance training and potentially creatine supplementation. His total antioxidant activity at 2.14 is above the upper limit of 1.77, which is likely driven by dietary antioxidants or supplements and is not a clinical concern. His progesterone at 1.62 is within the male range of 0.89 to 3.88 and is unremarkable. His MCHC at 345 sits exactly at the upper boundary of the range, which is not clinically significant.","links":"There are several conversations that Jashan needs to have with his GP, and these should happen within the next two to three weeks rather than being deferred.\n\nThe sodium of 125 is the most time-sensitive. He should contact his GP within the next few days, mention the result, and ask for a repeat sodium on a fresh sample along with paired serum and urine osmolality. He should mention his alcohol intake honestly because beer potomania is a recognised cause of low sodium in young men who drink regularly. In the meantime, he should avoid drinking excessive volumes of water and should not restrict salt.\n\nThe rheumatoid factor above 90 with elevated globulin and raised ESR should be discussed at the same appointment. He should ask for anti-CCP antibodies, a full autoimmune screen including ANA, and serum protein electrophoresis to characterise the elevated globulin. He does not need to be alarmed, but this pattern warrants thorough investigation.\n\nThe iron studies should be discussed, specifically the transferrin saturation of 63% and iron binding capacity below 7.2. He should ask for an HFE gene test to screen for haemochromatosis. He should mention whether he was fasting for the blood draw and whether he had eaten red meat in the preceding 24 hours, as this can affect serum iron. He should not take any iron-containing supplements until the HFE result is back.\n\nThe lipid profile and Lp(a) of 203 should be discussed together. He should ask the GP to record the Lp(a) permanently in his medical notes, as this is an inherited and unchangeable risk factor. He should ask about formal cardiovascular risk assessment and whether, given his South Asian ethnicity, family history of cardiovascular disease if any, and the combination of high ApoB with high Lp(a), early statin therapy should be considered. His first-degree relatives should be offered Lp(a) testing.\n\nThe HOMA-IR of 2.97 should be mentioned as context for the lipid picture and to establish a baseline. His GP may wish to arrange an oral glucose tolerance test given his South Asian ethnicity and the glucose of 5.8.\n\nThe corrected calcium of 2.02 and vitamin D of 39 should be mentioned, with a request to repeat calcium on a fresh fasted morning sample once vitamin D supplementation has been started.\n\nThe CEA of 4.25 should be noted and repeated in three months. The lipase of 88 should be noted in the context of his alcohol intake.\n\nFor diet and nutrition, the single most impactful change Jashan can make is to move away from the takeaway and convenience-based diet toward home-prepared meals. He does not need to follow a named diet plan. He needs to cook more. His maintenance calories at 99 kg, 183 cm, and his current activity level of six training sessions plus 7,500 to 10,000 steps sit at approximately 2,900 to 3,100 calories per day. To lose weight gradually and improve his insulin sensitivity, he should aim for 2,300 to 2,500 calories per day, which creates a moderate deficit of around 500 to 600 calories. His protein target should be 1.6 to 2.0 grams per kilogram of body weight, which at 99 kg means 158 to 198 grams of protein per day. This is non-negotiable for preserving muscle during weight loss and for supporting the resistance training he is already doing. A target body weight of 82 to 88 kg, which would bring his BMI into the 24 to 26 range, would substantially improve his insulin sensitivity, raise his SHBG, improve his testosterone, and reduce the modifiable portion of his LDL.\n\nFor the lipids specifically, he should increase soluble fibre intake through oats, lentils, chickpeas, beans, and barley, aiming for at least 10 grams of soluble fibre per day. He should eat oily fish such as salmon, mackerel, or sardines at least twice per week, which will also help bring down the triglycerides. He should reduce saturated fat by switching from takeaway fried foods to grilled or baked alternatives, using olive oil instead of butter or ghee for cooking, and choosing leaner cuts of meat. He should minimise refined carbohydrates and sugary drinks, which directly drive triglyceride production in the liver.\n\nFor alcohol, he should aim to reduce to fewer than seven drinks per week, and ideally to fewer than four. This single change would likely improve his triglycerides, reduce the lipase, protect against further sodium disruption, and reduce CEA. He does not need to stop entirely, but the current level is contributing to multiple findings in this report.\n\nFor his hair thinning and skin breakouts, the most effective intervention is not a topical product but the metabolic improvements described above. Losing weight and improving insulin sensitivity will raise SHBG, which will reduce the free testosterone available for conversion to DHT, which should slow the hair thinning and reduce the skin breakouts. If the hair loss progresses despite these changes, he should discuss finasteride or minoxidil with his GP or a dermatologist.\n\nFor sleep and recovery, he should maintain a fixed wake time, get outside within an hour of waking for natural light exposure, cut caffeine by early afternoon, and keep his bedroom cool. Good sleep directly improves insulin sensitivity and testosterone production.\n\nRetesting should be arranged in 12 to 16 weeks, focusing on a repeat sodium, serum protein electrophoresis results, HFE gene test results, fasting lipid profile, fasting glucose and insulin with HOMA-IR, corrected calcium, vitamin D, and B12. The Lp(a) does not need repeating as it does not change.","flags":"GP-URGENT: Sodium 125 mmol/L (range 133 to 146). Moderate hyponatraemia requiring prompt investigation. Recommend repeat on fresh sample with paired serum and urine osmolality. Consider beer potomania given alcohol intake above seven drinks per week.\n\nGP-URGENT: Rheumatoid Factor above 90 IU/mL (range below 14). Significantly elevated in a 28-year-old without joint symptoms. Concurrent findings: Globulin 49 g/L (range 18 to 36), Total Protein 100 g/L (range 57 to 82), ESR 19 mm/hour (range below 12). This cluster suggests significant immune activation. Recommend anti-CCP antibodies, ANA, serum protein electrophoresis, and clinical review.\n\nIRON STUDIES: Serum Iron 38.8 umol/L (range 11.6 to 31.3), Transferrin Saturation 63.32% (range 18 to 55%), Iron Binding Capacity below 7.2 umol/L (range 44 to 76.1). Ferritin 61 ng/mL (range 22 to 322). Pattern raises the possibility of haemochromatosis. Recommend HFE gene test (C282Y and H63D mutations). Advise no iron supplementation pending result.\n\nLIPIDS AND CARDIOVASCULAR: LDL 4.84 mmol/L (target below 3), ApoB 1.59 g/L (target below 0.9), Total Cholesterol 7.6, Triglycerides 2.66, Non-HDL 6.0 (target below 4), VLDL 1.21 (target below 0.78), ApoB/A-I Ratio 0.98 (target below 0.7), TC/HDL Ratio 4.75 (target below 4.5). Lp(a) 203.17 nmol/L (target below 32), high-risk category. Lp(a) is inherited and unchangeable. Should be recorded permanently. First-degree relatives should be tested. Given South Asian ethnicity and high Lp(a), formal cardiovascular risk assessment and consideration of early pharmacotherapy is recommended.\n\nGLUCOSE AND INSULIN: Fasting Glucose 5.8 mmol/L (range 3.5 to 6, optimal below 5.4), HbA1c 39 mmol/mol (range below 42), Insulin 11.54 mIU/L (range 2.6 to 24.9, optimal 2 to 8), HOMA-IR 2.97 (range 0.5 to 1.5). Significant insulin resistance at age 28 in a South Asian male. Reversible with lifestyle modification.\n\nCORRECTED CALCIUM: 2.02 mmol/L (range 2.2 to 2.6). PTH 4.0 pmol/L (range 0.98 to 4.73), upper third of range. Phosphate 0.8 mmol/L (range 0.78 to 1.65), borderline low. Vitamin D 39 nmol/L, insufficient. Lab notes calcium may be falsely reduced in older specimens. Recommend repeat on fresh sample after vitamin D repletion.\n\nMAGNESIUM: 1.44 mmol/L (range 0.53 to 1.11). Elevated without kidney impairment. Most likely supplementation or antacid use. Recommend stopping any magnesium-containing supplement and retesting.\n\nCEA: 4.25 ng/mL (non-smoker range below 2.3). Vapes nicotine. Mildly elevated, low pre-test probability of malignancy at 28. Recommend repeat in three months.\n\nLIPASE: 88 U/L (range 13 to 60). Amylase 76 IU/L (range 30 to 118), within range. Mildly elevated lipase may reflect subclinical pancreatic irritation from alcohol.\n\nESR: 19 mm/hour (range below 12). Likely related to the elevated globulin and autoimmune activity rather than a standalone finding.\n\nHORMONES: Testosterone 13.7 nmol/L (range 8.4 to 28.7, optimal 18 to 30). SHBG 16.1 nmol/L (range 17.3 to 65.8). Below-optimal testosterone with low SHBG, consistent with insulin resistance and elevated BMI. Relevant to hair thinning and skin breakouts via increased free androgen availability.\n\nALBUMIN: 51 g/L (range 34 to 50). Marginally above range. May reflect mild dehydration.\n\nCREATININE: 42 umol/L (range 65 to 104). Below range but Cystatin C eGFR 193 confirms excellent kidney function. Low creatinine reflects low muscle creatine stores, consistent with CK below 15 U/L (range 40 to 320).\n\nVITAMIN D: 39 nmol/L, insufficient. South Asian ethnicity increases requirement.\n\nVITAMIN B12: 244 pg/mL (range 193 to 982, optimal above 500). Below optimal.\n\nPENDING: C-Peptide and IgE reported as to follow.\n\nReassuring negatives: hs-CRP below 0.2, thyroid function excellent with negative antibodies, liver enzymes clean (ALT below 21, GGT below 7, FIB-4 0.8), urine fully clear, PSA 0.71 with normal free ratio, CA 19-9 11.87, coeliac screen negative, full blood count healthy, kidney function excellent by Cystatin C.","recommendations":"1. Contact GP within the next few days regarding sodium of 125. Request repeat sodium on fresh sample with paired serum and urine osmolality.\n\n2. Discuss rheumatoid factor above 90 with GP. Request anti-CCP antibodies, ANA, and serum protein electrophoresis.\n\n3. Request HFE gene test to investigate iron overload pattern. Do not take any iron supplements in the meantime.\n\n4. Record Lp(a) of 203 permanently in medical notes. Offer Lp(a) testing to parents and siblings. Discuss formal cardiovascular risk assessment with GP.\n\n5. Reduce calorie intake to 2,300 to 2,500 calories per day with 158 to 198 grams of protein per day. Shift from takeaway meals to home-prepared food. This single change addresses insulin resistance, lipids, testosterone, hair thinning, and skin breakouts simultaneously.\n\n6. Reduce alcohol to fewer than four drinks per week. This addresses sodium, lipase, triglycerides, CEA, and long-term liver and pancreatic health.\n\n7. Stop vaping nicotine. This contributes to cardiovascular risk alongside the elevated Lp(a) and lipids.\n\n8. Increase soluble fibre intake to at least 10 grams per day from oats, lentils, chickpeas, and beans. Eat oily fish at least twice per week. Reduce saturated fat and refined carbohydrates.\n\n9. Start vitamin D3 supplementation at 4,000 IU daily. South Asian skin and a BMI near 30 both increase the dose requirement.\n\n10. Start sublingual methylcobalamin B12 at 1,000 mcg daily.\n\n11. Stop any magnesium supplement if currently taking one, and retest magnesium in six to eight weeks.\n\n12. Aim for a target body weight of 82 to 88 kg over the next six to twelve months.\n\n13. Ensure resistance training is progressively overloaded. Consider adding creatine monohydrate at 3 to 5 grams daily to support muscle creatine stores.\n\n14. Repeat CEA in three months. Repeat sodium, calcium, vitamin D, B12, fasting lipids, fasting glucose, insulin, and HOMA-IR in 12 to 16 weeks.\n\n15. C-Peptide and IgE results are pending. Review these when available.","supplementation":"DO NOT take iron supplements. Jashan's iron studies show elevated serum iron, high transferrin saturation, and very low iron binding capacity. Until haemochromatosis has been excluded by HFE gene testing, any additional iron could accelerate harmful iron accumulation.\n\nVitamin D3 (cholecalciferol): 4,000 IU daily, taken with his largest meal that contains some fat. His level is 39, which is insufficient, and as a South Asian male with a BMI near 30, he needs the higher end of the supplementation range. South Asian skin produces less vitamin D from sunlight, and body fat sequesters the vitamin, reducing its availability. The goal is to bring his level above 75 and ideally into the 75 to 120 range. This should also help resolve his borderline low corrected calcium, since vitamin D is essential for absorbing calcium from the gut.\n\nVitamin K2 (MK-7): 200 mcg daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bones and teeth and away from soft tissues and arteries. It should always accompany vitamin D supplementation.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, split across two doses with meals. This will help reduce his triglycerides of 2.66, support a healthier ApoB to ApoA-I ratio, and provide an anti-inflammatory benefit. He should look for a product that lists the EPA and DHA content per capsule rather than just total fish oil.\n\nSublingual methylcobalamin (vitamin B12): 1,000 mcg daily, dissolved under the tongue. His B12 at 244 is within the laboratory range but below the optimal floor of 500. Sublingual delivery bypasses gut absorption, which is more reliable. A convenience-based diet is often low in B12-rich foods.\n\nCreatine monohydrate: 3 to 5 grams daily, mixed into water or a shake, taken at any time. His creatine kinase below 15 and creatinine of 42 both suggest very low muscle creatine stores. Creatine is the most well-researched sports supplement available, is safe, and will support his resistance training by improving strength output, muscle recovery, and over time, lean muscle mass.\n\nIf magnesium supplementation is currently being taken, stop it. His magnesium is 1.44, significantly above the upper limit of 1.11. Once the source of the elevation is identified and the level normalises, magnesium glycinate at 300 to 400 mg before bed could be reintroduced if needed for sleep or recovery, but not until the current elevated level is explained.\n\nThe most important changes from this report are not supplements. They are moving away from takeaway food toward home-cooked meals, reducing alcohol to fewer than four drinks per week, and losing 10 to 15 kg of body weight. These three changes would improve his insulin resistance, lower his triglycerides and LDL, raise his SHBG and testosterone, likely improve his hair thinning and skin breakouts, and reduce the strain on his pancreas. No supplement can replicate that.","biomarkers":[{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"100","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. Normal range is 57 to 82 g/L. Jashan's result of 100 is significantly above the upper limit, driven primarily by elevated globulin at 49. This suggests the immune system is producing a large volume of antibodies. When total protein is elevated alongside a very high rheumatoid factor and raised ESR, the pattern points toward an immune-driven process that warrants further investigation with serum protein electrophoresis. Dehydration can concentrate proteins and contribute a few points, but it cannot explain a result this far above range.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease (nephrotic syndrome)","high_causes":"Chronic inflammation, autoimmune conditions, dehydration, multiple myeloma, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"51","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7292","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and keeps fluid from leaking out of blood vessels. Normal range is 34 to 50 g/L. Jashan's result of 51 is marginally above the upper limit. A slightly elevated albumin most commonly reflects mild dehydration concentrating the blood, particularly if the sample was taken after an overnight fast without adequate hydration. It is not a concern in isolation and is clinically insignificant at this margin.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease, malabsorption","high_causes":"Dehydration, high protein intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin is a group of proteins in the blood that includes antibodies (immunoglobulins) produced by the immune system. Normal range is 18 to 36 g/L. Jashan's result of 49 is significantly above the upper limit. Elevated globulin means the immune system is producing more antibody protein than normal. Combined with his rheumatoid factor above 90 and ESR of 19, this creates a pattern of immune activation that warrants investigation. Serum protein electrophoresis will help determine whether this is a polyclonal elevation, typical of autoimmune conditions, or a monoclonal spike, which would require different investigation.","low_causes":"Immune deficiency, malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, autoimmune disease, chronic inflammation, liver disease, haematological conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. It is calculated by dividing albumin by globulin. Normal range is 1.1 to 2.5. Jashan's ratio of 1.04 is below the lower limit because his globulin is significantly elevated while his albumin is only marginally above range. A low A/G ratio suggests that globulin production is disproportionately high, which aligns with the elevated rheumatoid factor and total protein findings. This is not a separate concern but rather another expression of the same immune activation pattern.","low_causes":"Elevated immunoglobulins, autoimmune disease, chronic infection, liver disease","high_causes":"Immune deficiency, nephrotic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase, or ALP, is an enzyme found in the liver, bones, kidneys, and intestines. It is used to assess liver and bone health. Normal range is 46 to 116 IU/L. Jashan's result of 47 is at the lower end of the range, which is healthy and indicates no evidence of bile duct obstruction, bone disease, or liver congestion.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333333333","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Normal range is 5 to 21 umol/L. Jashan's result of 5 is at the bottom of the range, indicating efficient processing of red blood cell breakdown products by the liver.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"Alanine aminotransferase, or ALT, is an enzyme found primarily in liver cells. When the liver is damaged or inflamed, ALT leaks into the bloodstream. The laboratory range is below 56 IU/L, but the optimal male target is below 30. Jashan's result of below 21 is well within the optimal range, indicating the liver cells are healthy and not under metabolic strain. This is a genuinely positive finding given his alcohol intake and convenience-based diet.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, hepatitis, alcohol use, medication toxicity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/l","description":"Aspartate aminotransferase, or AST, is an enzyme found in the liver, heart, and muscles. It rises when any of these tissues are damaged. Normal range is 13 to 45 IU/L. Jashan's result of 30 is comfortably within range and within the optimal band, indicating no significant tissue damage.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle injury, alcohol use, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2759","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, AST, ALT, and platelet count. A score below 1.45, or below 1.3 for under-65s, suggests a low probability of significant liver fibrosis. Jashan's score of 0.8 is well below the threshold, indicating no evidence of liver scarring. Combined with his clean ALT and GGT, this is reassuring.","low_causes":"Not applicable","high_causes":"Liver fibrosis, cirrhosis, age, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0479","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.3910","units":"IU/l","description":"Gamma-glutamyl transferase, or GGT, is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems, and fatty liver disease. The male range is 4 to 73 IU/L, with an optimal target below 25. Jashan's result of below 7 is exceptionally low. For someone drinking more than seven drinks per week, a GGT this clean is notable. It tells us the liver is currently handling the alcohol without visible enzyme strain. However, this does not mean the alcohol is harmless, as the elevated lipase suggests the pancreas may be less resilient than the liver.","low_causes":"Not clinically significant","high_causes":"Alcohol use, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starch into sugars. Normal range is 30 to 118 IU/L. Jashan's result of 76 is comfortably within range. While his lipase is elevated, the normal amylase provides some reassurance that there is no acute pancreatic inflammation.","low_causes":"Chronic pancreatitis (burnt-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7624","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down dietary fat. When the pancreas is irritated or inflamed, lipase leaks into the bloodstream. Normal range is 13 to 60 U/L. Jashan's result of 88 is above the upper limit. In acute pancreatitis, lipase typically rises to three times the upper limit or higher, so this is a mild elevation rather than an emergency. The most common cause of mildly elevated lipase in a young man drinking more than seven alcoholic drinks per week is subclinical pancreatic irritation from alcohol. This is an early warning that the pancreas may be less tolerant of alcohol than the liver is.","low_causes":"Not clinically significant","high_causes":"Pancreatitis, alcohol use, gallstones, high triglycerides, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7336","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL fractions. A desirable level is below 5.18 mmol/L. Jashan's result of 7.6 is significantly elevated. However, total cholesterol alone is a blunt measure because it includes protective HDL. The more important markers are LDL, ApoB, and the ApoB/A-I ratio, which are all elevated in Jashan's case.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, insulin resistance, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7824","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats circulating in the blood, mainly produced by the liver from dietary sugars, refined carbohydrates, and alcohol. Fasting target is below 1.7 mmol/L, with an optimal level below 1.0. Jashan's result of 2.66 is elevated. The main drivers in his case are the convenience-based diet, which tends to be high in refined carbohydrates and sugars, alcohol intake above seven drinks per week, and the insulin resistance shown by his HOMA-IR of 2.97. Elevated triglycerides contribute to cardiovascular risk and also drive the production of VLDL and remnant cholesterol particles. Reducing alcohol, refined carbohydrates, and adding omega-3 fish oil are the most effective interventions.","low_causes":"Malnutrition, hyperthyroidism, very low-fat diet","high_causes":"Alcohol, refined carbohydrates, insulin resistance, obesity, genetic factors, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7756","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"Very low-density lipoprotein, or VLDL, is a particle produced by the liver that carries triglycerides through the bloodstream. Target is below 0.78 mmol/L. Jashan's result of 1.21 is elevated, which directly reflects his elevated triglycerides. The liver is packaging excess fat into VLDL particles at a higher rate than normal, driven by the same factors: refined carbohydrate intake, alcohol, and insulin resistance.","low_causes":"Not clinically significant","high_causes":"High triglycerides, alcohol, refined carbohydrate excess, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"High-density lipoprotein, or HDL, is often called 'good' cholesterol because it carries excess cholesterol away from artery walls and back to the liver for disposal. A desirable level for men is above 1.04, and the optimal target is above 1.4. Jashan's result of 1.6 is in the desirable and optimal range, which is a genuine positive. HDL at this level provides some cardiovascular protection, though it is being offset by the significant volume of atherogenic LDL and ApoB particles.","low_causes":"Smoking, sedentary lifestyle, obesity, insulin resistance, high refined carbohydrate intake","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8067","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"Low-density lipoprotein, or LDL, carries cholesterol from the liver to the tissues. When present in excess, LDL particles penetrate the artery wall and contribute to atherosclerotic plaque formation. Target is below 3 mmol/L, with an optimal level below 2.6. Jashan's result of 4.84 is significantly above both targets. Part of this elevation is being driven by his Lp(a) of 203, which is an inherited particle that carries LDL cholesterol and cannot be modified by lifestyle. The remainder is driven by diet, insulin resistance, and body weight, and this modifiable portion is what dietary changes and weight loss should target.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet high in saturated fat, genetic factors, obesity, insulin resistance, hypothyroidism, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5278","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. A ratio below 4.5 is desirable. Jashan's ratio of 4.75 is above the target because his total cholesterol is high while his HDL, though good, cannot offset the volume. Reducing the total cholesterol through dietary changes will bring this ratio down.","low_causes":"High HDL relative to total cholesterol","high_causes":"Elevated total cholesterol, low HDL, or both","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"21.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5263","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol indicates what proportion of the total cholesterol is the protective type. A desirable level is above 20%. Jashan's result of 21.05% meets the minimum threshold, but is below the optimal target of above 25% because total cholesterol is so elevated that even a good absolute HDL represents a small fraction of the whole.","low_causes":"Elevated total cholesterol relative to HDL, low HDL","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.75","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic, or artery-damaging, cholesterol including LDL, VLDL, and remnant particles. Target is below 4 mmol/L. Jashan's result of 6 is significantly above target, reflecting the combined burden of elevated LDL, VLDL, and remnant cholesterol.","low_causes":"Low total cholesterol, high HDL","high_causes":"Elevated LDL, elevated triglycerides, insulin resistance, obesity, dietary factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.675","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1, or ApoA-I, is the main structural protein of HDL particles. It reflects the functional capacity of the HDL system to remove cholesterol from artery walls. A desirable level is above 1.20 g/L. Jashan's result of 1.62 is healthy and indicates good HDL particle function. This is one of the genuine positives in his lipid profile.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B, or ApoB, is the single most important lipid marker for cardiovascular risk. Each LDL, VLDL, and Lp(a) particle carries exactly one ApoB molecule, so the ApoB level directly counts the number of atherogenic particles in the blood. Target is below 0.9 g/L, optimal below 0.8. Jashan's result of 1.59 is classified as 'very high' by the lab and represents nearly double the target. This means there are a very large number of particles capable of entering the artery wall and contributing to plaque formation. Given his Lp(a) of 203, a portion of these ApoB particles are Lp(a) particles that cannot be reduced by lifestyle changes. The remainder, driven by LDL and VLDL, is modifiable through diet, weight loss, and potentially medication.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet high in saturated fat, genetic factors, elevated Lp(a), insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio is considered the single best summary metric for lipid-driven cardiovascular risk. It compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA-I). A lower-risk ratio is below 0.7 for men. Jashan's ratio of 0.98 places him in the higher-risk category above 0.9. Despite having a healthy ApoA-I of 1.62, the sheer volume of ApoB particles overwhelms the protective capacity. This ratio will improve as ApoB is reduced through dietary changes, weight loss, and potentially medication.","low_causes":"Low atherogenic particle count, high HDL function","high_causes":"Elevated LDL, elevated triglycerides, elevated Lp(a), low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"203.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle. It is inherited, cannot be changed by diet, exercise, supplements, or any currently available medication, and remains essentially constant throughout life. It needs to be tested only once and the result recorded permanently. Target is below 32 nmol/L. Jashan's result of 203.17 places him in the high-risk category. Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it interferes with the body's clot-dissolving system promoting blood clots, and it drives inflammation in vessel walls. Because Lp(a) is inherited, first-degree relatives (parents and siblings) should also be tested. The clinical significance for Jashan is that a portion of his elevated LDL and ApoB is being driven by Lp(a) particles he cannot modify, making it even more important that the modifiable portion is addressed aggressively. Novel therapies targeting Lp(a) are in advanced clinical trials, and this result should prompt ongoing conversation with his GP.","low_causes":"Genetic factors","high_causes":"Genetic factors (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a practical marker of insulin resistance and metabolic health. It is calculated by dividing triglycerides by HDL. A ratio below 1.5 is within range, and below 0.87 is optimal. Jashan's ratio of 1.66 is above the upper limit, suggesting metabolic dysfunction consistent with his elevated HOMA-IR. This ratio is one of the best simple predictors of small dense LDL particles, which are more dangerous than large buoyant ones.","low_causes":"Good insulin sensitivity, low triglycerides, high HDL","high_causes":"Insulin resistance, elevated triglycerides, metabolic syndrome, high refined carbohydrate diet, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.725","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles, including VLDL remnants and chylomicron remnants. These particles are now recognised as independently atherogenic, meaning they damage arteries in their own right. Target is below 0.8, optimal below 0.5. Jashan's result of 1.16 is elevated, driven by his high triglycerides and VLDL. Reducing triglycerides through dietary change, alcohol reduction, and omega-3 supplementation will lower remnant cholesterol.","low_causes":"Low triglycerides, good metabolic health","high_causes":"Elevated triglycerides, insulin resistance, alcohol, refined carbohydrate excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5600","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Normal range is 3.5 to 6.0 mmol/L, with an optimal range of 4.0 to 5.4. Jashan's result of 5.8 is within the laboratory range but above the optimal ceiling and approaching the pre-diabetic threshold of 6.1 mmol/L. At 28, with South Asian ethnicity, a BMI near 30, insulin resistance shown by HOMA-IR, and a convenience-based diet, this is an early metabolic warning sign. The good news is that at this stage, dietary change, weight loss, and continued exercise can reverse the trajectory entirely.","low_causes":"Fasting too long, excessive insulin production, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, illness, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.475","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c (percentage) is an alternative expression of glycated haemoglobin, showing what percentage of haemoglobin has glucose attached. Normal is below 6.0%, pre-diabetes is 6.0 to 6.4%, and diabetes is above 6.5%. Jashan's result of 5.7% is within the normal range but approaching the pre-diabetic threshold, consistent with the glucose and HOMA-IR findings.","low_causes":"Recent blood loss, haemolytic anaemia, iron deficiency","high_causes":"Sustained elevated blood glucose, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin, the oxygen-carrying protein in red blood cells, that has glucose attached to it. Because red blood cells live for about three months, HbA1c reflects average blood sugar over that period rather than a single snapshot. Normal is below 42 mmol/mol, pre-diabetes is 42 to 47, and diabetes is above 48. Jashan's result of 39 is within the normal range but above the optimal target of below 36, indicating that average blood sugar over the past three months has been higher than ideal without crossing into the pre-diabetic category.","low_causes":"Recent blood loss, haemolytic anaemia, iron deficiency","high_causes":"Sustained elevated blood glucose, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"11.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5337","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3153","upper_optimal_position":"0.4490","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. Normal range is 2.6 to 24.9 mIU/L, with an optimal range of 2 to 8. Jashan's result of 11.54 is within the laboratory range but above the optimal ceiling. The pancreas is having to produce more insulin than ideal to maintain blood sugar near the top of the range. This is the hallmark of insulin resistance: the body's cells are not responding efficiently to insulin, so the pancreas compensates by producing more. At 28, this is fully reversible with weight loss, dietary improvement, and continued exercise.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, obesity, high carbohydrate diet, metabolic syndrome, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ug/l","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It is used to assess how much insulin the pancreas is producing and can help distinguish between type 1 and type 2 diabetes. This result is pending and will be reviewed when available. The lab notes that samples not separated within four hours can show reduced C-Peptide levels.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.99","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculated score that estimates how resistant the body's cells are to insulin. It is derived from fasting glucose and fasting insulin. Normal range is 0.5 to 1.5, with below 1.0 being optimal. The lab classifies above 2.9 as significant insulin resistance. Jashan's result of 2.97 crosses that threshold. This means his cells are not responding efficiently to insulin, forcing the pancreas to work harder. For a 28-year-old South Asian male, this is the most important metabolic finding in the report because it sits at the root of multiple other abnormalities: the elevated triglycerides, the low SHBG, the below-optimal testosterone, and the glucose sitting at 5.8. The encouraging reality is that insulin resistance at this age and stage is fully reversible through weight loss, dietary improvement, and the exercise he is already doing.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Obesity, high carbohydrate diet, sedentary lifestyle, metabolic syndrome, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"100.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4696","lower_normal":"80","upper_normal":"200","lower_optimal":"100","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"","description":"HOMA-B, or the Homeostatic Model Assessment of Beta-cell Function, estimates how well the insulin-producing beta cells in the pancreas are working. It is calculated from fasting insulin and glucose. Normal range is 80 to 200. Jashan's calculated result of approximately 100 is within the normal range, indicating the pancreas is still producing adequate insulin. However, the fact that the pancreas needs to produce this much insulin (fasting insulin 11.54) to achieve a glucose of only 5.8 confirms the resistance is at the tissue level, not a failure of pancreatic output.","low_causes":"Beta-cell exhaustion, late-stage type 2 diabetes, type 1 diabetes","high_causes":"Insulin resistance with compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.02","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein, or hs-CRP, is a protein produced by the liver in response to inflammation. It is the most widely used marker of systemic inflammation and cardiovascular inflammatory risk. The laboratory range is below 5 mg/L, but the optimal target for cardiovascular risk is below 1.0. Jashan's result of below 0.2 is exceptional. At a BMI near 30 with elevated lipids, insulin resistance, and alcohol intake above seven drinks per week, a CRP this low is genuinely surprising and positive. It means that despite the metabolic strain visible elsewhere in the report, the inflammatory component of cardiovascular risk is currently very low.","low_causes":"Not clinically significant, indicates low systemic inflammation","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular disease, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7917","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate, or ESR, measures how quickly red blood cells settle to the bottom of a tube over one hour. Faster settling indicates more inflammation because inflammatory proteins cause red blood cells to clump together. Normal range for a male under 50 is below 12 mm/hour. Jashan's result of 19 is above range. ESR is a non-specific marker, meaning it can be elevated by many conditions. In his case, the elevated globulin and rheumatoid factor above 90 are the most likely drivers. The hs-CRP being below 0.2 while ESR is elevated is an interesting dissociation: CRP responds quickly to acute inflammation while ESR responds more to chronic protein changes, which supports an immune-mediated rather than acute inflammatory process.","low_causes":"Not clinically significant","high_causes":"Autoimmune disease, chronic infection, anaemia, elevated immunoglobulins, malignancy, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"125","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0513","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the main electrolyte that controls fluid balance across every cell in the body. It regulates blood pressure, nerve function, and muscle contraction. Normal range is 133 to 146 mmol/L. Jashan's result of 125 is significantly below the lower limit, a finding classified as moderate hyponatraemia. At this level, symptoms can include fatigue, nausea, headache, difficulty concentrating, and in more severe cases, confusion or seizures. In a 28-year-old drinking more than seven alcoholic drinks per week, the most common explanations include beer potomania, where high-volume low-solute fluids dilute sodium, excessive water intake, or occasionally a syndrome called SIADH where the body retains too much water. This result requires GP review promptly, with repeat sodium on a fresh sample and paired serum and urine osmolality to determine the cause.","low_causes":"Excessive fluid intake, beer potomania, SIADH, diuretics, vomiting, diarrhoea, Addison's disease","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/l","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance and acid-base equilibrium. Normal range is 95 to 108 mmol/L. Jashan's result of 97 is within the laboratory range but at the lower end. Chloride often tracks with sodium, and his mildly low chloride is consistent with his significantly low sodium.","low_causes":"Vomiting, excessive sweating, SIADH, dilution, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a buffer that helps maintain the blood's acid-base balance. Normal range is 20 to 31 mmol/L. Jashan's result of 24.5 is within the optimal range, indicating normal acid-base balance.","low_causes":"Metabolic acidosis, diabetic ketoacidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4269","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6082","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling, and blood clotting. Normal range is 2.08 to 2.65 mmol/L. Jashan's raw calcium of 2.24 is within the laboratory range. However, because calcium travels bound to albumin in the blood, the corrected calcium, which adjusts for albumin level, is the more clinically relevant figure. His corrected calcium is 2.02, which is below range. See the corrected calcium entry for interpretation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1417","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the patient's albumin level, because much of the calcium in the blood is bound to albumin. This gives a more accurate picture of the physiologically active calcium. Normal range is 2.2 to 2.6 mmol/L. Jashan's corrected calcium is 2.02, below the lower limit. His PTH (parathyroid hormone) is 4.0, sitting in the upper third of its range (0.98 to 4.73), which may represent an early compensatory response to the low calcium. His vitamin D at 39 is insufficient, and since vitamin D is essential for absorbing calcium from the gut, this is the most likely explanation. The lab also notes that calcium can be falsely reduced in older specimens. His GP should repeat calcium on a fresh morning sample after vitamin D supplementation has been started.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6034","units":"mmol/l","description":"Phosphate works alongside calcium in bone formation and energy metabolism. Normal range is 0.78 to 1.65 mmol/L. Jashan's result of 0.8 is within range but borderline low, sitting just above the lower limit. Low phosphate alongside low corrected calcium and insufficient vitamin D forms a consistent pattern: inadequate vitamin D is impairing the absorption of both calcium and phosphate from the gut.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, antacid use, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, cell breakdown","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8563","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4425","upper_optimal_position":"0.5109","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body including muscle function, nerve signalling, blood sugar regulation, and sleep. Normal range is 0.53 to 1.11 mmol/L. Jashan's result of 1.44 is significantly above the upper limit. Elevated magnesium with normal kidney function is unusual. The kidneys are very efficient at excreting excess magnesium, and with his Cystatin C eGFR of 193, renal impairment is not the cause. The most common explanation is external supplementation, either through a magnesium supplement, a multivitamin, or antacid medications containing magnesium. If Jashan is taking any of these, he should stop and retest in six to eight weeks.","low_causes":"Alcohol use, diuretics, poor dietary intake, diarrhoea, diabetes","high_causes":"Magnesium supplementation, antacid use, kidney disease, Addison's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"290","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4003","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5218","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced naturally by the body. Elevated levels can cause gout and are associated with cardiovascular risk. Normal range is 220 to 547 umol/L. Jashan's result of 290 is within the optimal range of 200 to 380, which is a positive finding given his alcohol intake and convenience-based diet, both of which can elevate uric acid.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"Alcohol, high purine diet, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product formed when the liver breaks down protein. The kidneys filter it out through urine. Normal range is 3.2 to 8.2 mmol/L. Jashan's result of 5.9 is within the optimal range, indicating adequate protein metabolism and kidney clearance.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0641","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism. It is filtered by the kidneys and used to estimate kidney function. Normal range is 65 to 104 umol/L. Jashan's result of 42 is below the lower limit. Low creatinine typically reflects low muscle creatine stores rather than kidney problems. His creatine kinase is also below range at under 15, confirming that his muscle creatine pool is depleted. His Cystatin C, which is a kidney function marker independent of muscle mass, gives an eGFR of 193, confirming the kidneys are working excellently. The low creatinine is not a kidney concern but does suggest he would benefit from creatine supplementation to support his resistance training.","low_causes":"Low muscle mass, low creatine stores, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate, or eGFR, estimates how well the kidneys filter waste from the blood. It is calculated from creatinine, age, and sex. A result above 60 is within the laboratory range, and above 90 is optimal. The lab reported Jashan's eGFR as greater than 90. However, because his creatinine is unusually low, this creatinine-based eGFR may overestimate kidney function. The Cystatin C eGFR of 193 provides a more reliable confirmation that kidney function is excellent.","low_causes":"Kidney disease, dehydration, obstruction, medications","high_causes":"Not clinically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1136","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells in the body. Unlike creatinine, its level is not affected by muscle mass, diet, or exercise, making it a more reliable measure of kidney function in people with unusually high or low muscle mass. Normal range is below 1.1 mg/L. Jashan's result of below 0.25 is very low, giving a Cystatin C eGFR of 193, which confirms excellent kidney function. This is the definitive measure for Jashan given his low creatinine.","low_causes":"Excellent kidney function","high_causes":"Kidney disease, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"193","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8042","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR is the estimated glomerular filtration rate calculated from Cystatin C rather than creatinine. It provides a more accurate assessment of kidney function, particularly when creatinine is unreliable due to unusual muscle mass. Jashan's result of 193 is excellent and confirms his kidneys are functioning superbly.","low_causes":"Kidney disease","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"148","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"130","upper_normal":"170", ","result_position":"0.4359","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that help form blood clots and stop bleeding. Normal range is 150 to 410. Jashan's result of 229 is within the optimal range.","low_causes":"Viral infections, bone marrow disorders, liver disease, medications, autoimmune conditions","high_causes":"Infection, inflammation, iron deficiency, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets are generally younger and more reactive. Normal range is 7.1 to 10.1 fL. Jashan's result of 9.8 is within the laboratory range but above the optimal ceiling. Mildly elevated MPV can indicate increased platelet turnover, but at this margin within range it is not clinically significant.","low_causes":"Bone marrow suppression, aplastic anaemia, chemotherapy","high_causes":"Increased platelet production, inflammation, immune thrombocytopenia, cardiovascular risk marker","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Count","group":"HEMATOLOGY","result":"4.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_
