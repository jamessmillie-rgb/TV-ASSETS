obulin are individually elevated. The most common cause of elevated total protein is dehydration, which concentrates all blood components. However, the separately elevated globulin and immunoglobulin changes suggest some of this may reflect genuine immune activation.","low_causes":"Liver disease, malnutrition, kidney disease (protein loss), overhydration","high_causes":"Dehydration, chronic infections, autoimmune conditions, multiple myeloma (rare), chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8229","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance by keeping water inside blood vessels. Jashan's albumin at 57 is above the upper limit of 50. Albumin cannot be overproduced in any meaningful clinical scenario, so this almost certainly reflects dehydration concentrating the blood. This is relevant to the corrected calcium calculation, which may have been artefactually lowered by the high albumin.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, inflammation, overhydration","high_causes":"Dehydration (most common), prolonged tourniquet application during blood draw","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7889","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin is a collective term for the immune proteins, or immunoglobulins, and other transport proteins in the blood. Jashan's globulin at 40 is above the upper limit of 36. While dehydration concentrates globulin like albumin, the elevation is proportionally greater for globulin, and in the context of his very elevated rheumatoid factor and raised IgE, some of this likely reflects genuine immune protein elevation.","low_causes":"Immunodeficiency, liver disease, nephrotic syndrome","high_causes":"Chronic infections, autoimmune conditions, liver disease, dehydration, multiple myeloma (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. A low ratio can indicate immune activation or liver disease. Jashan's ratio of 1.43 is within the healthy range, suggesting that while both proteins are elevated, the balance between them is maintained.","low_causes":"Autoimmune disease, chronic infection, liver disease, multiple myeloma","high_causes":"Immunodeficiency (rare), genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase, or ALP, is an enzyme found in the liver, bones, kidneys, and digestive system. It is used alongside other liver markers to assess biliary health. Jashan's ALP at 47 is at the lower end of the range, which is a normal finding.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, post-cardiac surgery","high_causes":"Bone growth (young adults), bile duct obstruction, liver disease, vitamin D deficiency, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes and clears it. Jashan's bilirubin at 5 is at the lower boundary of the range, which is entirely normal and indicates efficient hepatic clearance.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome (benign), haemolytic anaemia, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (GPT)","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is a liver enzyme that rises when liver cells are damaged. It is the most specific marker for liver cell injury. Jashan's ALT at below 21 is well within the optimal range of below 30, indicating no liver cell damage. This is a reassuring finding given his alcohol consumption.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, alcohol excess, viral hepatitis, medications, muscle damage (to a lesser extent)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (GOT)","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST, or aspartate aminotransferase, is found in the liver, heart, and muscles. It rises when any of these tissues are damaged. Jashan's AST at 30 is within both the laboratory and optimal ranges.","low_causes":"Vitamin B6 deficiency (can affect the assay), uraemia","high_causes":"Liver disease, muscle damage, heart damage, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2759","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the degree of liver fibrosis, or scarring, using age, AST, ALT, and platelet count. A score below 1.3 in someone under 65 suggests no significant fibrosis. Jashan's score of 0.8 is well within the safe range, confirming no evidence of liver scarring.","low_causes":"Young age, healthy liver","high_causes":"Liver fibrosis/cirrhosis, age above 50 (inflates the score), low platelet count, very low ALT (mathematical effect)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0479","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is the liver enzyme most sensitive to alcohol. It rises with even moderate drinking in many people and is also elevated by fatty liver disease, medications, and bile duct issues. Jashan's GGT at below 7 is exceptionally low and well within the optimal range of below 25. At more than seven drinks per week, this is a genuinely positive finding: the liver is handling the alcohol without visible enzymatic strain at present.","low_causes":"Not clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications (anticonvulsants, statins)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. Elevated levels can indicate pancreatic inflammation. Jashan's amylase at 76 is within the healthy range, which is reassuring alongside his elevated lipase.","low_causes":"Chronic pancreatitis with pancreatic damage, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7340","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is an enzyme produced almost exclusively by the pancreas that digests fats. It is more specific to the pancreas than amylase. Jashan's lipase at 88 is above the upper limit of 60. A lipase more than three times the upper limit is typically needed to diagnose acute pancreatitis, so this level is mildly elevated rather than acutely concerning. However, alcohol is the second most common cause of pancreatic inflammation, and a persistently elevated lipase with regular alcohol intake suggests the pancreas may be under low-grade strain. Reducing alcohol is the most direct way to address this.","low_causes":"Chronic pancreatitis with significant gland damage","high_causes":"Acute pancreatitis, alcohol excess, gallstones, high triglycerides, medications, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4269","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is essential for bone health, nerve function, muscle contraction, and heart rhythm. Jashan's total calcium at 2.24 is within the laboratory range. The corrected calcium, which adjusts for albumin levels, is discussed separately.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level in the blood, because calcium binds to albumin and a high or low albumin can make calcium appear falsely normal or abnormal. Jashan's corrected calcium at 2.02 is below the lower limit of 2.2. However, his albumin is significantly elevated at 57, almost certainly from dehydration, and the correction formula subtracts calcium for every gram of albumin above 40. This likely represents overcorrection rather than true hypocalcaemia. His PTH at 4.0 is within range and not elevated, which it would be if calcium were genuinely low. This should be repeated on a well-hydrated sample.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, pancreatitis, malabsorption, artefact from high albumin correction","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3795","upper_optimal_position":"0.5718","units":"mmol/L","description":"Phosphate works closely with calcium for bone health and is essential for energy production in every cell. Jashan's phosphate at 0.8 is within the laboratory range but near the floor and below the optimal range of 0.9 to 1.4. Low phosphate can occur with poor dietary intake, vitamin D insufficiency, and high carbohydrate diets. His insufficient vitamin D may be contributing.","low_causes":"Vitamin D deficiency, refeeding syndrome, alcohol excess, antacids, hyperparathyroidism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, phosphate-containing laxatives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8241","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5185","upper_optimal_position":"0.6343","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, energy production, and blood sugar regulation. Jashan's magnesium at 1.44 is above the upper limit of 1.11. Elevated magnesium is uncommon and may be caused by magnesium supplementation, antacid use, or dehydration concentrating the blood. If he is supplementing, he should stop and retest.","low_causes":"Poor dietary intake, alcohol excess, medications (PPIs, diuretics), diabetes, chronic diarrhoea","high_causes":"Magnesium supplementation, antacid use (Mg-containing), kidney impairment, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. It is produced in the skin in response to sunlight and obtained from a small number of foods. Jashan's level of 39 is classified as insufficient, below the 50 nmol/L threshold for sufficiency and well below the optimal range of 75 to 120. South Asian skin has higher melanin, which reduces vitamin D synthesis from sunlight, making supplementation particularly important. His convenience-based diet is also unlikely to provide adequate dietary vitamin D. This insufficiency may be contributing to his low-normal phosphate and may be relevant to his immune findings.","low_causes":"Insufficient sun exposure, dark skin, poor dietary intake, obesity (fat sequesters vitamin D), malabsorption, liver or kidney disease","high_causes":"Excessive supplementation, granulomatous diseases (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5680","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4253","upper_optimal_position":"0.5587","units":"pmol/L","description":"PTH, or parathyroid hormone, is produced by four small glands behind the thyroid. It regulates calcium and phosphate levels by controlling how much calcium is released from bones, absorbed from food, and retained by the kidneys. Jashan's PTH at 4.0 is within the laboratory range but in the upper portion, sitting above the optimal ceiling of 3.5. Given his insufficient vitamin D, the PTH may be starting to rise in response, as the body attempts to maintain calcium levels when vitamin D is low. This is another reason to supplement vitamin D promptly.","low_causes":"Post-thyroid surgery, autoimmune hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency (compensatory rise), primary hyperparathyroidism (parathyroid adenoma), chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"244","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3398","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6159","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and homocysteine metabolism. It is found primarily in animal products. Jashan's B12 at 244 is within the laboratory range but below the optimal threshold of 500. A convenience-based diet may not provide consistent B12-rich foods. Suboptimal B12 can contribute to fatigue, brain fog, and over time to neurological symptoms. Supplementation as sublingual methylcobalamin is recommended.","low_causes":"Poor dietary intake, vegan/vegetarian diet, pernicious anaemia, malabsorption, metformin use, PPIs","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7143","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, works alongside B12 in DNA synthesis, red blood cell production, and homocysteine clearance. Jashan's folate at 18 is marginally above the upper limit of 17. This is not a concern. Mildly elevated folate can result from a recent folate-rich meal, supplementation, or natural dietary variation. There is no clinical consequence to a folate at this level.","low_causes":"Poor dietary intake, alcohol excess, coeliac disease, medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, folate-rich meal before the test, B12 deficiency (folate trapped in unusable form)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP, or C-reactive protein, is a marker of systemic inflammation produced by the liver. It rises in response to infection, tissue damage, and chronic low-grade inflammation. Levels below 1.0 are considered optimal for cardiovascular risk, and levels below 0.5 are excellent. Jashan's result of below 0.2 is about as low as this marker can read, indicating virtually no systemic inflammation. At a BMI of 29.6 with a convenience diet and regular alcohol, this is a genuinely impressive and reassuring finding.","low_causes":"Low inflammation (healthy finding)","high_causes":"Infection, autoimmune conditions, obesity, smoking, cardiovascular disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7336","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including protective HDL and harmful LDL. Jashan's total cholesterol at 7.6 is well above the desirable limit of 5.18. While total cholesterol alone is a crude measure, at this level it signals significant excess, and the breakdown into LDL and HDL tells the more detailed story.","low_causes":"Malnutrition, hyperthyroidism, liver failure, malabsorption","high_causes":"Diet high in saturated fat, genetic predisposition (familial hypercholesterolaemia), hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7824","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood that come from dietary fat, alcohol, and excess sugar and carbohydrate that the liver converts to fat. Jashan's triglycerides at 2.66 are above the fasting desirable limit of 1.7. Elevated triglycerides are strongly associated with alcohol intake, refined carbohydrate consumption, insulin resistance, and excess body fat, all of which are present in his profile. Reducing alcohol and shifting away from convenience food would be expected to lower this substantially.","low_causes":"Very low-fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"Alcohol, refined carbohydrates, insulin resistance, obesity, familial hypertriglyceridaemia, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7756","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, is a triglyceride-rich particle produced by the liver. It carries fat to tissues and is eventually converted to LDL. Jashan's VLDL at 1.21 is above the upper limit of 0.78, reflecting his elevated triglycerides. VLDL is driven by the same factors as triglycerides: alcohol, refined carbohydrates, and insulin resistance.","low_causes":"Very low-fat diet, hyperthyroidism","high_causes":"Alcohol, high carbohydrate diet, insulin resistance, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. Higher HDL is better. Jashan's HDL at 1.6 is above the desirable threshold of 1.55 and above the optimal threshold of 1.4 for a male. This is a genuine positive in his lipid profile and contributes to his ApoA1 being in a healthy range.","low_causes":"Sedentary lifestyle, smoking, obesity, high refined carbohydrate diet, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol consumption, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8067","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the primary cholesterol particle responsible for depositing cholesterol into artery walls. Jashan's LDL at 4.84 is well above the upper limit of 3.0 and nearly double the optimal ceiling of 2.6. In the context of his elevated Lp(a), every point of LDL reduction becomes more important because Lp(a) particles also carry cholesterol into arteries through a mechanism that diet cannot change.","low_causes":"Hyperthyroidism, malabsorption, liver disease, very low-fat diet, statin medication","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5278","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio puts the overall cholesterol in the context of the protective HDL fraction. A lower ratio is better. Jashan's ratio of 4.75 is above the desirable limit of 4.5 and above the optimal ceiling of 3.5, reflecting his elevated total cholesterol despite his healthy HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"High LDL, low HDL, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"21.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5263","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"This measures what proportion of total cholesterol is the protective HDL. Higher is better. Jashan's HDL represents 21.05% of his total cholesterol, which is above the minimum threshold of 20% but below the optimal target of 28% or higher. The percentage is being pulled down by his very high total cholesterol rather than by a low HDL.","low_causes":"High total cholesterol, low HDL, metabolic syndrome","high_causes":"Excellent HDL, low total cholesterol, healthy metabolism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.75","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus the protective HDL. It captures all the atherogenic, or artery-damaging, cholesterol including LDL, VLDL, and remnant particles. Jashan's non-HDL at 6.0 is well above the desirable limit of 4.0, reflecting the combined burden of his elevated LDL, VLDL, and remnant cholesterol.","low_causes":"Low LDL, low triglycerides, statin medication","high_causes":"High LDL, high triglycerides, high VLDL, metabolic syndrome, genetic hyperlipidaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.675","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. It reflects the number of protective HDL particles in the blood. Higher ApoA1 is better. Jashan's ApoA1 at 1.62 is above the desirable threshold of 1.2 and above the optimal threshold of 1.4, confirming his healthy HDL particle count. This is the denominator of the ApoB/A1 ratio.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol consumption, healthy metabolism, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB, or apolipoprotein B, is the single most important number for cardiovascular risk because each atherogenic particle, whether it is an LDL, VLDL, or Lp(a), carries exactly one ApoB molecule. So ApoB is essentially a count of every particle capable of depositing cholesterol into an artery wall. Jashan's ApoB at 1.59 is classified as very high, nearly double the desirable target of below 0.9 and well above the optimal ceiling of 0.8. This is the number his dietary and lifestyle changes should aim to reduce.","low_causes":"Statin medication, very low-fat diet, hyperthyroidism, malabsorption","high_causes":"High LDL, high triglycerides, insulin resistance, diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.981","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7007","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio captures the balance between atherogenic (artery-damaging) and protective particles in a single number. Below 0.7 indicates lower risk, 0.7 to 0.9 indicates average risk, and above 0.9 indicates higher risk. Jashan's ratio of 0.98 sits above the higher risk threshold, driven by his very high ApoB despite his healthy ApoA1. This ratio should improve as dietary changes reduce ApoB.","low_causes":"Low ApoB (low LDL/triglycerides), high ApoA1 (high HDL)","high_causes":"High ApoB (high LDL/triglycerides), low ApoA1 (low HDL), metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"203.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written as Lp(a), is a genetically determined particle that is essentially an LDL particle with an extra protein called apolipoprotein(a) wrapped around it. It contributes to cardiovascular risk through three mechanisms: depositing cholesterol in artery walls, promoting blood clotting, and driving inflammation at the site of arterial plaques. Jashan's Lp(a) at 203.17 sits at the boundary between moderate risk (90 to 200) and high risk (200 to 400). This level is entirely genetic, cannot be changed by diet, exercise, or any currently available routine medication, and will remain essentially the same for life. It should be recorded as a permanent entry in his medical records. His first-degree relatives should be tested because there is a 50% chance of inheriting the trait. As a South Asian male with elevated Lp(a), every other modifiable cardiovascular risk factor becomes more important to optimise.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a simple calculation that provides insight into insulin resistance and cardiovascular risk. A lower ratio is better. Jashan's ratio of 1.66 is above the upper normal limit of 1.5 and well above the optimal ceiling of 0.87. This elevated ratio is consistent with his insulin resistance and is driven primarily by his high triglycerides.","low_causes":"Low triglycerides, high HDL, excellent insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome, alcohol, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.725","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, including VLDL remnants and chylomicron remnants. These particles are now recognised as independently atherogenic. Jashan's remnant cholesterol at 1.16 is above both the normal limit of 0.8 and the optimal ceiling of 0.5, reflecting his elevated triglycerides and VLDL.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, alcohol, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2440","lower_normal":"40","upper_normal":"320","lower_optimal":"60","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase, or CK, is an enzyme found primarily in skeletal muscle, the heart, and the brain. It is released into the blood when muscle fibres are damaged or active. Jashan's CK at below 15 is well below the lower limit of 40. This is a surprising finding for someone reporting four resistance training sessions per week. Low CK suggests low muscle mass or very low training intensity. Combined with his low creatinine, this indicates he may need to increase training intensity, volume, or nutritional support for muscle building. Adequate protein intake of 158 to 198 grams per day is essential.","low_causes":"Low muscle mass, sedentary lifestyle, liver disease, early pregnancy","high_causes":"Resistance training, muscle injury, statin medication, rhabdomyolysis, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5929","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5871","units":"pmol/L","description":"Free T4, or thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. Jashan's FT4 at 20.2 is within the optimal range of 14 to 20, sitting at the upper end, which indicates healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, severe illness, medications (amiodarone, lithium)","high_causes":"Hyperthyroidism (Graves' disease, toxic nodule), thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4432","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.5295","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland to tell the thyroid how much hormone to make. High TSH means the pituitary is pushing the thyroid harder because output is too low; low TSH means the thyroid is producing too much. Jashan's TSH at 1.94 sits perfectly within the optimal range of 1.0 to 2.5, indicating the thyroid is working well without needing extra stimulation.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease, early pregnancy","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from non-thyroidal illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5852","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism in every cell. It is produced by converting T4 into T3. Jashan's FT3 at 6.0 is within the optimal range of 4.5 to 6.5, confirming excellent thyroid hormone conversion and activity.","low_causes":"Hypothyroidism, severe illness (sick euthyroid syndrome), selenium deficiency, calorie restriction","high_causes":"Hyperthyroidism, early thyroiditis, thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are immune proteins that attack thyroid peroxidase, an enzyme the thyroid needs to produce hormones. Elevated TPO antibodies are the hallmark of Hashimoto's thyroiditis, the most common cause of underactive thyroid. Jashan's result of below 6.6 is well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (healthy finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Jashan's result of below 1.3 is undetectable, which is normal for more than 80% of the population and confirms no autoimmune thyroid process.","low_causes":"No autoimmune thyroid disease (healthy finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.142","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"ng/mL","description":"PSA, or prostate-specific antigen, is a protein produced by the prostate gland. It is used as a screening marker for prostate conditions including benign enlargement and prostate cancer. Jashan's PSA at 0.71 is low and entirely normal for a 28-year-old male.","low_causes":"Normal finding in young men","high_causes":"Benign prostatic hyperplasia (BPH), prostatitis, prostate cancer, recent ejaculation, vigorous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"PSA (Free)","group":"PROSTATE","result":"0.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA measures the proportion of PSA that is not bound to proteins in the blood. A higher free-to-total PSA ratio is reassuring because prostate cancer tends to produce more bound PSA. Jashan's free PSA at 0.23 is normal.","low_causes":"Normal finding","high_causes":"Benign prostatic hyperplasia, prostatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Ratio","group":"PROSTATE","result":"0.324","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8526","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio, or free-to-total PSA ratio, helps distinguish between benign and malignant causes of elevated PSA. A ratio above 0.19 is considered normal, and above 0.25 is reassuring. Jashan's ratio of 0.324 is healthy.","low_causes":"Higher proportion of bound PSA, which may suggest malignancy when PSA is elevated","high_causes":"Benign prostatic conditions, normal finding","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"11.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1605","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic cancer but also produced in other gastrointestinal cancers. It can be mildly elevated in benign conditions including pancreatitis and bile duct obstruction. Jashan's CA 19-9 at 11.87 is well within the normal range.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, other GI cancers, pancreatitis, bile duct obstruction, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"4.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9239","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4348","units":"ng/mL","description":"CEA, or carcinoembryonic antigen, is a protein that can be elevated in several cancers, particularly colorectal cancer, but is also commonly raised by smoking and nicotine. The non-smoker reference range is 0 to 2.3, while the smoker range is 0 to 4.1. Jashan's CEA at 4.25 is above both thresholds, though only marginally above the smoker limit. Given that he vapes nicotine, this is the most likely explanation. His GP should be made aware, and if he stops vaping, a repeat CEA would be expected to normalise. If it does not, further investigation would be warranted.","low_causes":"Normal finding","high_causes":"Smoking/vaping, colorectal cancer, other GI cancers, lung cancer, pancreatitis, liver disease, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"9.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4649","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7.0","upper_optimal":"14.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides the majority of antibody-based immunity against infections. It is also the antibody that confers long-term immunity after vaccination. Jashan's IgG at 9.3 is within the laboratory range, indicating healthy immune function.","low_causes":"Immunodeficiency, certain medications (rituximab, corticosteroids), protein-losing conditions","high_causes":"Chronic infections, autoimmune conditions, liver disease, multiple myeloma (IgG type)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced during an acute immune response. It indicates the body's ability to mount an early defence against new infections. Jashan's IgM at 0.7 is within the laboratory range.","low_causes":"Immunodeficiency, chronic lymphocytic leukaemia, certain medications","high_causes":"Acute infections, Waldenstrom's macroglobulinaemia, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5634","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4301","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, lungs, and urinary tract. It is also the antibody used in coeliac disease testing. Jashan's IgA at 2.8 is within range. Importantly, his IgA being in range confirms that the tissue transglutaminase IgA test for coeliac disease is valid, as IgA deficiency can cause false negatives.","low_causes":"Selective IgA deficiency (most common primary immunodeficiency), medications","high_causes":"Liver disease (particularly alcohol-related), IgA nephropathy, chronic infections, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"222","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"80","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"IU/mL","description":"IgE is the antibody class responsible for allergic reactions. It triggers the release of histamine from mast cells when it encounters an allergen. Jashan's IgE at 222 is more than double the upper limit of 100, indicating a significant allergic tendency. This may be relevant to his reported skin breakouts, as allergic processes can drive skin inflammation. Common triggers include environmental allergens (dust mites, pollen, pet dander), food sensitivities, and contact allergens. Allergy testing may help identify specific triggers.","low_causes":"Immunodeficiency, certain medications","high_causes":"Allergies (hayfever, eczema, asthma, food allergies), parasitic infections, atopic dermatitis, certain autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"IU/mL","description":"Rheumatoid factor, or RF, is an antibody that targets the body's own IgG antibodies. It is most commonly associated with rheumatoid arthritis but can also be elevated in other autoimmune conditions, chronic infections, liver disease, and occasionally in healthy people. Jashan's RF at above 90 is significantly above the upper limit of 14. At 28 with no reported joint pain or swelling, this may not indicate rheumatoid arthritis, but the level is high enough to warrant investigation. His GP should check an anti-CCP antibody, which is more specific for rheumatoid arthritis, and perform a clinical joint examination. Early detection of rheumatoid arthritis, if present, allows treatment before joint damage occurs.","low_causes":"Normal finding, absence of autoimmune disease","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, systemic lupus erythematosus, chronic infections (hepatitis C, TB), liver disease, smoking/vaping","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"1.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0710","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA, or tTG-IgA, is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten. Jashan's result of 1.02 is negative and well within range, effectively ruling out coeliac disease as a cause of any digestive symptoms. This test is valid because his IgA level is within range.","low_causes":"Normal finding, no coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis, other autoimmune conditions (less specific)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7660","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, the reactive molecules that damage cells. Jashan's result of 2.14 is above the upper limit of 1.77. Elevated TAA is commonly caused by antioxidant supplementation, high uric acid, or a diet rich in polyphenols. At this level, it is not a concern and may reflect dietary or supplemental intake of antioxidants.","low_causes":"Oxidative stress, poor dietary antioxidant intake, chronic disease","high_causes":"Antioxidant supplementation, high uric acid, polyphenol-rich diet, bilirubin elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"243","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4107","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"170","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3852","upper_optimal_position":"0.5818","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and falling throughout the day. Jashan's cortisol at 243 is within the morning reference range and within the optimal band, indicating healthy adrenal function. The fact that cortisol is not suppressed is relevant given his low sodium, as adrenal insufficiency is one possible cause of hyponatraemia but is less likely with a normal cortisol.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic fatigue","high_causes":"Stress, Cushing's syndrome, corticosteroid medications, depression, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"110","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3765","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men and women. In men, it is produced from testosterone by the enzyme aromatase, which is more active in fat tissue. Jashan's oestradiol at 110 is within range. At a BMI of 29.6, some increase in aromatase activity is expected, but his level is not elevated.","low_causes const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');

  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';

function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;

}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
