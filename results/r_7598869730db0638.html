below) tells a more specific story about bone marrow output.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss recovery, haemolytic anaemia, treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocyte Count (Absolute)","group":"HEMATOLOGY","result":"36.369","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1546","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells being released into the circulation, rather than the percentage. Sakina's count of 36.4 is below the lower limit of 50, meaning the bone marrow is producing fewer new red cells than expected. This is consistent with her iron depletion: when iron stores are low (ferritin 20, transferrin saturation 16%), the bone marrow does not have enough raw material to produce red cells at the normal rate. The body is maintaining haemoglobin by slowing turnover rather than by producing fewer cells of lower quality, which is why her MCV and MCH remain normal.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic disease, aplastic anaemia","high_causes":"Acute blood loss, haemolytic anaemia, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"19.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index is the MCV divided by the red blood cell count and is used to help distinguish between iron deficiency anaemia and thalassaemia trait. A value above 13 suggests iron deficiency rather than thalassaemia. Sakina's Mentzer index of 19.4 is reported for context. Her MCV is normal, so this index is not clinically relevant at present.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate (ESR)","group":"INFLAMMATION","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube over one hour, which is a non-specific marker of inflammation. Sakina's ESR of 22 is above the upper limit of 12 for a woman of her age. This indicates that an inflammatory process is active in the body. The most likely drivers are the autoimmune thyroid disease confirmed by the TPO antibodies, possible contribution from the heavy menstrual cycle, and potentially gut inflammation from her IBS. The ESR is not specific enough to pinpoint the source, but in combination with the above-optimal CRP, it confirms a real inflammatory burden.","low_causes":"Usually normal; polycythaemia, sickle cell, very high white cell count","high_causes":"Autoimmune disease, infection, inflammation, malignancy, pregnancy, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is a protein produced by the liver in response to inflammation anywhere in the body. It is one of the best single markers of systemic inflammation and is also used as a cardiovascular risk indicator. Sakina's result of 3.1 is within the laboratory range (below 5) but well above the optimal ceiling of 1.0. A CRP above 1.0 but below 5 in a young woman without obesity or infection points to a chronic low-grade inflammatory process. The autoimmune thyroid disease is the most likely source, with possible contribution from gut inflammation and the heavy menstrual cycle. Reducing this inflammatory burden through omega-3, anti-inflammatory diet patterns and managing the autoimmune process will be important for both symptom relief and long-term cardiovascular health, especially given the Lp(a).","low_causes":"Good health, low inflammation","high_causes":"Infection, autoimmune disease, obesity, chronic inflammation, cardiovascular risk, injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"16.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2305","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5306","units":"%","description":"Transferrin saturation tells us what proportion of the iron-carrying protein in the blood (transferrin) is actually loaded with iron. Sakina's result of 16.26% is below the lower limit of 18% and well below the optimal floor of 25%. This means her body does not have enough circulating iron to fully load its transport system. Combined with a ferritin of 20 and normal transferrin levels, this confirms iron depletion, likely driven by heavy menstrual losses. A saturation below 20% is associated with impaired energy production, poor temperature regulation and reduced thyroid hormone synthesis, all symptoms Sakina reports.","low_causes":"Iron deficiency, heavy menstrual losses, poor dietary iron intake, chronic disease, malabsorption","high_causes":"Haemochromatosis, iron overload, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"10.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3627","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4116","upper_optimal_position":"0.5824","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. Sakina's result of 10.9 is just inside the lower limit of 9 but below the optimal floor of 14. Serum iron fluctuates throughout the day and with meals, so it is less reliable than ferritin and transferrin saturation as a measure of iron status, but in this context it confirms the pattern of iron depletion seen across all the iron markers.","low_causes":"Iron deficiency, heavy periods, poor dietary intake, chronic inflammation, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver damage, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3872","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that carries iron through the blood to the bone marrow and other tissues. Sakina's transferrin of 2.67 is within the optimal range, meaning the body is making an appropriate amount of carrier protein. The issue is not a lack of transport capacity but a lack of iron to fill it, as confirmed by the low transferrin saturation.","low_causes":"Chronic inflammation, liver disease, malnutrition, iron overload","high_causes":"Iron deficiency (body makes more carrier protein to capture what little iron is available), pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"62.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5284","lower_normal":"44","upper_normal":"76.1","lower_optimal":"47","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3645","upper_optimal_position":"0.5004","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron, closely related to the amount of transferrin available. Sakina's TIBC of 62.8 is within the laboratory range but above the optimal ceiling of 60. A slightly elevated TIBC is a characteristic response to iron depletion: the body makes more binding capacity in an attempt to capture every available iron molecule. This is consistent with her low ferritin and low transferrin saturation.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"20","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3690","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4404","upper_optimal_position":"0.5329","units":"ng/mL","description":"Ferritin is the body's iron storage protein. Each molecule of ferritin stores thousands of iron atoms, so the blood level reflects how full the body's iron reserves are. Sakina's ferritin of 20 is within the laboratory range (10 to 291) but well below the optimal floor of 40 for a woman. At 20, her iron stores are genuinely depleted. For a 24-year-old woman with heavy, painful periods, this is the most common pattern: menstrual iron losses exceed dietary intake month after month, gradually emptying the stores. A ferritin below 30 is associated with fatigue, poor concentration, cold intolerance and hair thinning, even when haemoglobin is maintained. This is one of the most actionable findings in the report.","low_causes":"Heavy menstrual losses, inadequate dietary iron, malabsorption, coeliac disease, chronic blood loss","high_causes":"Inflammation, infection, liver disease, haemochromatosis, iron overload, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"135","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3872","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is an essential electrolyte that regulates fluid balance, blood pressure and nerve function. Sakina's sodium of 136 is within the optimal range, confirming healthy fluid and electrolyte balance.","low_causes":"Overhydration, diuretics, SIADH, adrenal insufficiency, vomiting/diarrhoea","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is an electrolyte essential for muscle contraction, nerve signalling and heart rhythm. Sakina's potassium of 5.0 is within the laboratory range but above the optimal ceiling of 4.8. The lab notes that delayed separation or prolonged time on cells can falsely elevate potassium. At 5.0 with normal kidney function and no medications that affect potassium, this is most likely a sample handling effect rather than a true elevation. It does not require action.","low_causes":"Diuretics, diarrhoea, vomiting, poor dietary intake, excess aldosterone","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, sample haemolysis, delayed separation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333", thin the optimal range, confirming healthy calcium levels.","low_causes":"Vitamin D deficiency, parathyroid disorders, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of the biologically active calcium. Sakina's corrected calcium of 2.3 is within the optimal range, confirming healthy calcium metabolism. Together with a normal PTH and adequate vitamin D, this indicates healthy bone and mineral metabolism.","low_causes":"Vitamin D deficiency, parathyroid disorders, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4176","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"1.0","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4176","upper_optimal_position":"0.5560","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and is essential for energy production (as part of ATP, the energy molecule). Sakina's phosphate of 1.0 is within the laboratory range but at the floor of the optimal band. This is not a concern at this level but is worth monitoring if bone health becomes a focus.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive intake, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5115","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6218","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, and sleep regulation. Sakina's magnesium of 0.84 is within the laboratory range but just below the optimal floor of 0.85. Given her constant stress, chronic fatigue, poor sleep quality despite adequate hours, and the energy demands of managing an autoimmune condition, optimising magnesium with glycinate supplementation before bed is a worthwhile and low-risk intervention.","low_causes":"Poor dietary intake, stress, alcohol, medications (diuretics, PPIs), diarrhoea, malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"2.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2100","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3933","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product formed when the body breaks down protein, filtered out by the kidneys. Sakina's urea of 2.7 is below the laboratory range of 3.2 to 8.2. Low urea in a young, lean woman at 49 kg usually reflects a combination of low muscle mass (less protein being broken down), efficient kidney clearance, and potentially lower protein intake relative to what her body needs. Her kidney function is confirmed as excellent by her cystatin C eGFR of 131, so this is not a kidney problem. It may, however, reflect that her protein intake could be higher, and the recommended target of 64 to 78 grams per day should help.","low_causes":"Low protein intake, liver disease, overhydration, low muscle mass, pregnancy","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2138","lower_normal":"49","upper_normal":"90","lower_optimal":"52","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product produced by muscle metabolism and filtered by the kidneys. Sakina's creatinine of 44 falls below the laboratory range of 49 to 90. This is entirely expected in a petite woman at 49 kg and 157 cm with limited muscle mass. Creatinine production is directly proportional to muscle mass, so less muscle means less creatinine. This does not indicate kidney disease; it means the creatinine-based kidney test is unreliable in someone of her build. This is exactly why cystatin C was included: her cystatin C eGFR of 131 confirms excellent kidney function independent of muscle mass.","low_causes":"Low muscle mass, small body size, low protein diet, advanced liver disease","high_causes":"Kidney disease, high muscle mass, intense exercise, high meat intake, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"The estimated glomerular filtration rate measures how well the kidneys filter waste from the blood. Sakina's creatinine-based eGFR is reported as greater than 90, which is above the ideal threshold. However, because her creatinine is artificially low due to her small build, this figure overestimates kidney function. The cystatin C eGFR of 131, which is independent of muscle mass, gives a more accurate picture and confirms her kidneys are working excellently.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, medications","high_causes":"Pregnancy, high cardiac output, overestimation from low creatinine","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"249","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines (found in certain foods and produced by the body). Sakina's uric acid of 249 is within the optimal range for a woman (160 to 320), indicating healthy purine metabolism and no risk of gout or uric acid kidney stones.","low_causes":"Low purine diet, Fanconi syndrome, Wilson's disease","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, obesity, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3318","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, sex or diet, making it a more accurate kidney marker in someone of Sakina's petite build. Her cystatin C of 0.73 is excellent, and the eGFR derived from it (131) confirms strong kidney function.","low_causes":"Not clinically significant","high_causes":"Kidney disease, thyroid dysfunction, corticosteroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"118","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR (Cystatin C) is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"131","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cyst mmune activity. Sakina's total protein of 74 is within the optimal range, confirming adequate protein production and nutrition.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and medications, and maintains the fluid balance between blood vessels and tissues. Sakina's albumin of 42 is within the optimal range, confirming good liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease (nephrotic syndrome)","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5556","units":"g/L","description":"Globulins are a group of proteins that include antibodies and transport proteins. Sakina's globulin of 32 is within the laboratory range but above the optimal ceiling of 30. Slightly elevated globulin can reflect chronic immune activation, which is consistent with her autoimmune thyroid disease. It is not a concern on its own but fits the broader inflammatory pattern.","low_causes":"Immunodeficiency, malnutrition, liver disease","high_causes":"Chronic inflammation, autoimmune disease, infection, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3905","upper_optimal_position":"0.6095","units":"IU/L","description":"ALP is an enzyme found in the liver, bones and bile ducts. Sakina's ALP of 60 is within the optimal range, indicating healthy liver and bone metabolism. At 24, this is the expected finding.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism, anaemia","high_causes":"Bone growth (normal in young adults), liver disease, bile duct obstruction, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down, processed by the liver and excreted in bile. Sakina's bilirubin of 11 is within the optimal range, confirming normal red cell turnover and healthy liver processing.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optima ncreatitis, bowel obstruction, kidney disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4125","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4762","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune regulation, thyroid function and mood. Sakina's level of 99 nmol/L is within the optimal range of 75 to 120 and reflects the supplementation she has been taking. For someone with South Asian heritage, autoimmune thyroid disease and a BMI of 19.9, maintaining vitamin D in this range is particularly important because vitamin D modulates the immune system and there is evidence that adequate levels may slow the progression of Hashimoto's. Without continued supplementation, especially through winter months, this level will fall.","low_causes":"Insufficient sunlight, darker skin pigmentation, low dietary intake, malabsorption, obesity","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"1.209","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3944","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5387","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate levels in the blood. Sakina's PTH of 1.209 is within the optimal range, which is the expected finding when vitamin D is adequate (99 nmol/L) and calcium is within range. This confirms healthy mineral metabolism.","low_causes":"Hypoparathyroidism, excess vitamin D, high calcium","high_causes":"Vitamin D deficiency, low calcium, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"453","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5223","upper_optimal_position":"0.6113","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. Sakina's B12 of 453 is within the laboratory range but below the optimal floor of 500. Given that she paused her multivitamin before the test, her usual level may be slightly higher, but the result suggests she is not absorbing or consuming enough B12 to reach the optimal band. B12 below 500 can contribute to fatigue, brain fog and low mood, all symptoms Sakina reports. Sublingual methylcobalamin is recommended because it bypasses the gut, which is relevant given her digestive symptoms.","low_causes":"Vegetarian/vegan diet, malabsorption, pernicious anaemia, atrophic gastritis, metformin, IBS","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5882","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.6905","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and neural tube development. Sakina's folate of 20 is above the laboratory range of 3 to 17, which is driven by her good vegetable and fruit intake (4 to 5 portions daily) and her multivitamin supplementation. Above-range folate is not harmful and does not require action. It confirms excellent intake of green vegetables and fortified foods.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, alcohol, medications (methotrexate, phenytoin)","high_causes":"Supplementation, high dietary intake, B12 deficiency masking (folate remains high)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3964","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions: LDL, HDL, VLDL and Lp(a). Sakina's total cholesterol of 4.1 is within the desirable range (below 5.18) and within the optimal band. On its own this looks healthy, but the breakdown into individual fractions (particularly ApoB and Lp(a)) tells a more nuanced story.","low_causes":"Malnutrition, hyperthyroidism, liver failure, malabsorption","high_causes":"Diet, genetics (familial hypercholesterolaemia), hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1912","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, primarily influenced by carbohydrate and sugar intake, alcohol and metabolic health. Sakina's triglycerides of 0.65 are excellent, well within the optimal ceiling of 1.0. This reflects her low sugar intake, absence of alcohol and good insulin sensitivity.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar/carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1923","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. Sakina's VLDL of 0.3 is within the optimal range, reflecting her healthy triglyceride level and good metabolic health.","low_causes":"Low triglycerides, good metabolic health","high_causes":"High triglycerides, insulin resistance, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is known as 'good cholesterol' because it removes excess cholesterol from the blood and carries it back to the liver for disposal. Sakina's HDL of 1.6 is right at the optimal floor of 1.6 for a woman, and comfortably above the desirable threshold of 1.55. This reflects her healthy diet quality and absence of alcohol. HDL is protective against cardiovascular disease and helps counterbalance the inherited Lp(a) risk.","low_causes":"Sedentary lifestyle, smoking, poor diet, obesity, insulin resistance, medications","high_causes":"Regular exercise, healthy diet, genetics, moderate alcohol (not recommended for this purpose)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5733","units":"mmol/L","description":"LDL (low-density lipoprotein) is often called 'bad cholesterol' because it deposits cholesterol in artery walls. Sakina's LDL of 2.2 is within the optimal ceiling of 2.6. However, the standard LDL measurement includes the cholesterol carried by Lp(a) particles, which cannot be modified. Her Lp(a)-corrected LDL, which removes the Lp(a) contribution, is only 1.72, meaning her modifiable LDL is very low. This is a genuinely positive finding.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, kidney disease, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2844","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. Sakina's ratio of 2.56 is well within the optimal range (below 3.5), indicating a favourable balance between total cholesterol and protective HDL.","low_causes":"High HDL, low total cholesterol","high_causes":"High total cholesterol, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"39.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of protective HDL. Sakina's HDL accounts for 39% of her total cholesterol, which is excellent and well above the desirable threshold of 20%. The higher this percentage, the more of her cholesterol is in the protective fraction.","low_causes":"Low HDL relative to total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol and captures all the 'bad' lipoproteins in one number (LDL, VLDL and Lp(a)). Sakina's non-HDL of 2.5 is within the optimal range (below 3.2). However, a significant portion of this is carried by Lp(a) particles, which are inherited and unmodifiable.","low_causes":"Low LDL, low triglycerides","high_causes":"High LDL, high triglycerides, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4929","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and is a marker of HDL quantity and quality. Sakina's ApoA1 of 1.38 is marginally below the desirable threshold of 1.4. This is consistent with her HDL sitting right at the optimal floor. Increasing exercise, particularly resistance training and aerobic exercise, is the most effective way to raise ApoA1 and HDL together.","low_causes":"Sedentary lifestyle, smoking, poor diet, metabolic syndrome, genetic factors","high_causes":"Regular exercise, genetics, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic (artery-damaging) lipoprotein particle, including LDL, VLDL and Lp(a). It is the single best measure of how many dangerous particles are circulating. Sakina's ApoB of 0.91 is marginally above the desirable limit of 0.9. Crucially, her Lp(a)-corrected LDL is only 1.72, meaning the modifiable (dietary and lifestyle-responsive) component of her ApoB is low. The ApoB elevation is largely driven by her inherited Lp(a) of 147.74. Standard dietary changes will have a limited impact on ApoB in this situation, and the GP should consider whether pharmacological reduction is appropriate given the family history.","low_causes":"Low LDL, low triglycerides, good metabolic health","high_causes":"High LDL, elevated Lp(a), familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.65942","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5495","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (harmful) lipoprotein particles to the number of protective HDL particles. Sakina's ratio of 0.66 sits in the average risk category (0.6 to 0.8), above the lower risk threshold of 0.6. This ratio is elevated because of the Lp(a) contribution to ApoB combined with the marginally below-threshold ApoA1. Increasing exercise to raise ApoA1 and HDL will improve this ratio on the protective side.","low_causes":"High HDL/ApoA1, low LDL/ApoB","high_causes":"High LDL/ApoB, low HDL/ApoA1, elevated Lp(a), metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"147.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"2.3084","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lp(a) is a genetically inherited lipoprotein that behaves like a particularly sticky and dangerous form of LDL. It deposits cholesterol in artery walls, promotes blood clotting and drives local inflammation in blood vessels. Sakina's Lp(a) of 147.74 is well above the normal limit of 32 and falls in the moderate risk category (90 to 200). Unlike LDL, Lp(a) cannot be lowered by diet, exercise or statin medication. It is genetically determined, does not change over a lifetime, and once measured never needs measuring again. Given Sakina's family history of heart attack or stroke before 60, this inherited Lp(a) may be part of the explanation for that family pattern. This result should be recorded permanently on her medical file, and her first-degree relatives (parents, siblings) should be tested. New targeted therapies for Lp(a) are in development, and the GP should be aware of this finding for future management options.","low_causes":"Genetic (favourable variant)","high_causes":"Genetic (inherited, unchangeable), familial pattern","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme released from muscles when they are damaged or stressed. Sakina's CK of 60 is within the optimal range, indicating no muscle damage or excessive breakdown. This is the expected finding with her moderate training load.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5149","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5869","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone circulating in the blood. The thyroid releases T4, which is then converted into the active form, T3, in the tissues. Sakina's FT4 of 17 is within the optimal range of 14 to 20, meaning the thyroid is producing adequate amounts of this hormone despite the autoimmune attack confirmed by the TPO antibodies. This is the current picture; the concern is whether it will hold over time as the Hashimoto's process continues.","low_causes":"Hypothyroidism, Hashimoto's disease, pituitary failure, medications","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"2.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4539","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5350","units":"mIU/L","description":"TSH is the signal the pituitary gland in the brain sends to the thyroid, telling it how much hormone to produce. When the thyroid is underperforming, TSH rises as the brain 'shouts louder'. Sakina's TSH of 2.08 is within the optimal band of 1.0 to 2.5. On its own this looks healthy, but in the context of TPO antibodies above 400, it carries a different meaning. The thyroid is currently responding to normal-level signalling, but as the autoimmune process damages more thyroid tissue over time, TSH will gradually need to rise to maintain the same output. A TSH that creeps from 2 towards 3, 4 and beyond over the coming years would indicate declining thyroid function. This is why repeat monitoring is essential.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary failure","high_causes":"Hypothyroidism, Hashimoto's disease, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active form of thyroid hormone that drives metabolism, energy production, temperature regulation and cognitive function. Sakina's FT3 of 4.7 sits just inside the optimal band of 4.5 to 6.5 but towards the lower end. Given that T3 is the hormone responsible for the functions Sakina is struggling with (energy, temperature, mental clarity), a level at the lower end of optimal, while technically adequate, may not be enough for her to feel well. This is a pattern often seen in early Hashimoto's: the numbers are 'in range' but the person does not feel well because they are at the bottom of that range.","low_causes":"Hypothyroidism, low T4 to T3 conversion, chronic illness, calorie restriction, stress","high_causes":"Hyperthyroidism, T3-dominant thyroiditis, excessive T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"> 400","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3261","units":"U/mL","description":"Thyroid peroxidase antibodies are proteins produced by the immune system that attack thyroid peroxidase, an enzyme the thyroid needs to produce its hormones. Sakina's result is above 400, dramatically exceeding the upper limit of 13.8. A level this high is strongly associated with Hashimoto's thyroiditis, an autoimmune condition where the immune system gradually destroys the thyroid gland. Hashimoto's is the most common cause of hypothyroidism in developed countries and affects women far more often than men. Even though Sakina's thyroid hormones are currently within range, the autoimmune process is clearly active, and the risk is that thyroid function will decline over time. This result connects directly to her chronic symptoms of fatigue, cold intolerance, brain fog and energy crashes, all of which are recognised features of thyroid autoimmunity. The GP should arrange regular monitoring of thyroid function (TSH, FT4 and FT3) at least every six months.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibody","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce its hormones. Sakina's result is below 1.3, which is negative and means the immune system is not producing this particular antibody. In Hashimoto's thyroiditis, it is common for TPO antibodies to be strongly positive while thyroglobulin antibodies remain negative, and this does not change the diagnosis. The TPO antibody result alone is sufficient to confirm the autoimmune process.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.276","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts T4 (the storage form of thyroid hormone) into T3 (the active form). Sakina's ratio of 0.276 sits at the very floor of the optimal band (0.27 to 0.4), meaning conversion is technically adequate but at the lower boundary. In early Hashimoto's, conversion efficiency can gradually decline as thyroid tissue is damaged. This ratio should be monitored on repeat testing alongside TSH and FT4.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca199","name":"CA19-9","group":"TUMOR MARKERS","result":"183.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3378","units":"U/mL","description":"CA19-9 is a protein that can be produced by certain cells in the pancreas, bile ducts, stomach, colon and ovaries. It is used as a tumour marker, meaning elevated levels can be associated with cancers of these organs, particularly pancreatic cancer. Sakina's CA19-9 of 183.38 is nearly five times the upper limit of 37. However, CA19-9 is also well known to be raised by many benign (non-cancerous) conditions including autoimmune diseases, ovarian cysts, endometriosis, IBS with inflammation, bile duct irritation and even menstruation. At 24, with no red-flag symptoms (no unexplained weight loss, no jaundice, no palpable mass), with normal pancreatic enzymes (amylase 97, lipase 42), and with an active autoimmune process (TPO above 400) and raised inflammatory markers (ESR 22, CRP 3.1), the most likely explanation is a benign or inflammatory elevation. Nevertheless, this result requires investigation: an abdominal ultrasound and a repeat CA19-9 in six to eight weeks are recommended.","low_causes":"Normal finding; approximately 5-10% of the population cannot produce CA19-9 (Lewis antigen negative)","high_causes":"Pancreatic cancer, bile duct cancer, ovarian pathology, endometriosis, IBS, autoimmune disease, cholestasis, pancreatitis, menstruation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2152","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4348","units":"ng/mL","description":"CEA (carcinoembryonic antigen) is a protein that can be elevated in colorectal, lung and other cancers, as well as in smokers and some inflammatory conditions. Sakina's CEA of 0.99 is well within the non-smoker limit of 2.3, which is reassuring and makes a colorectal or gastrointestinal malignancy very unlikely.","low_causes":"Normal finding","high_causes":"Colorectal cancer, lung cancer, smoking, chronic inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA125","group":"TUMOR MARKERS","result":"16.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2314","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"U/mL","description":"CA125 is a protein that can be elevated in ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease and during menstruation. Sakina's CA125 of 16.2 is within the normal range and well below the limit of 35. This is reassuring for ovarian health and reduces the likelihood that the elevated CA19-9 has a gynaecological origin.","low_causes":"Normal finding","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammation, menstruation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA15-3","group":"TUMOR MARKERS","result":"12.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2165","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"U/mL","description":"CA15-3 is a protein most commonly used to monitor breast cancer. Sakina's CA15-3 of 12.99 is within the normal range, which is a reassuring baseline result.","low_causes":"Normal finding","high_causes":"Breast cancer, ovarian cancer, liver disease, benign breast conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"13.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5509","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7.0","upper_optimal":"13.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5509","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections. Sakina's IgG of 13.3 is within the laboratory range but above the optimal ceiling of 13.0. Slightly elevated IgG is consistent with chronic immune activation, which fits the autoimmune thyroid picture. It is not a concern on its own.","low_causes":"Immunodeficiency, medications (corticosteroids, immunosuppressants)","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"1.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5200","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.4667","units":"g/L","description":"IgM is the first antibody produced when the body encounters a new infection. Sakina's IgM of 1.9 is within the laboratory range. This is a normal finding.","low_causes":"Immunodeficiency, chronic disease","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4516","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.4409","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces (gut lining, respiratory tract, urinary tract). Sakina's IgA of 1.5 is within the laboratory range. An adequate IgA level also confirms that the tissue transglutaminase test for coeliac disease is valid (IgA deficiency can cause a false negative).","low_causes":"Selective IgA deficiency (most common immunodeficiency), medications","high_causes":"Chronic infection, liver disease, autoimmune conditions, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"10.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0535","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"IU/mL","description":"IgE is the antibody associated with allergic reactions and parasitic infections. Sakina's IgE of 10.7 is very low and well within the optimal range, which makes a significant allergic component to her symptoms (bloating, skin breakouts, fatigue) very unlikely. This is useful information because it means the investigation should focus on autoimmune, functional and digestive causes rather than allergy.","low_causes":"Normal finding, immunodeficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody often found in rheumatoid arthritis and other autoimmune conditions. Sakina's result is below 4, which is negative and makes rheumatoid arthritis unlikely. This is useful context given her autoimmune thyroid finding: not all autoimmune conditions cluster together, and her joints appear unaffected by autoimmunity.","low_causes":"Normal finding (no rheumatoid arthritis)","high_causes":"Rheumatoid arthritis, Sjögren's syndrome, lupus, chronic infections, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA (tTG)","group":"AUTOIMMUNE & CELIAC","result":"< 0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0139","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition where gluten triggers damage to the small intestine. Sakina's result is below 0.2, which is negative and effectively rules out coeliac disease, provided she was eating gluten regularly in the weeks before the test. This is important information given her bloating and digestive symptoms: the cause of those symptoms is not coeliac disease, and the investigation should focus on other possibilities such as IBS, SIBO, food intolerances or gut motility issues.","low_causes":"No coeliac disease (normal finding)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8085","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4681","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals (reactive molecules that damage cells). Sakina's result of 1.97 is above the upper limit of 1.77, which is almost certainly driven by her supplements (vitamin D, TUDCA, multivitamin) and her good vegetable and fruit intake. Above-range antioxidant activity is not harmful and is a reflection of good dietary and supplemental antioxidant intake. No action is needed.","low_causes":"Poor diet, oxidative stress, chronic disease, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"305","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4423","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3719","upper_optimal_position":"0.5816","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural rhythm, peaking in the morning and falling throughout the day. Sakina's morning cortisol of 305 is within the optimal range, which is reassuring given that she reports stress as constantly hard to manage. A single morning cortisol, however, only captures one point in the day and does not tell us about the evening or overnight cortisol pattern. Her 'wired at night' energy pattern could reflect a flattened or shifted cortisol rhythm where cortisol does not fall adequately in the evening, but this cannot be confirmed from a single blood measurement.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary failure, chronic stress (late stage)","high_causes":"Acute stress, Cushing's syndrome, corticosteroid medication, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"625","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"204.8","upper_normal":"786.1","lower_optimal":"204.8","upper_optimal":"786.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, produced mainly by the ovaries. Sakina's level of 625 falls within the luteal phase range (204.8 to 786.1), confirming that she was in the luteal phase (the second half of the cycle, after ovulation) at the time of the test. This, together with the progesterone level, confirms she is ovulating normally, which is reassuring for overall hormonal health.","low_causes":"Menopause, premature ovarian insufficiency, low body weight, excessive exercise","high_causes":"Pregnancy, ovarian cysts, oestrogen-producing tumours, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"59.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"14.12","upper_optimal":"81.28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3662","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is a hormone produced by the corpus luteum (the structure left behind after the egg is released) during the luteal phase of the menstrual cycle. Sakina's progesterone of 59.03 is within the luteal range and above the mid-luteal threshold of 14.12, confirming ovulation has occurred. A healthy progesterone level in the luteal phase is important for cycle regularity, mood and sleep quality.","low_causes":"Anovulation, luteal phase deficiency, PCOS, stress, low body weight","high_causes":"Pregnancy, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"1.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0.5","upper_normal":"16.9","lower_optimal":"0.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5790","units":"mIU/mL","description":"LH is a hormone produced by the pituitary gland that triggers ovulation. Sakina's LH of 1.28 is within the luteal phase range (0.5 to 16.9), approp function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail

  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;

  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">

      <span class="bc-tick tick-${col}"></span>
