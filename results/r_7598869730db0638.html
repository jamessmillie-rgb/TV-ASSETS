<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Sakina Rose","dob":"30/08/2002","report_date":"2026-09-25","summary":"Sakina is a 24-year-old female presenting with a BMI of 19.9, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are larger than average (volume 7 out of 10). She trains twice a week, one cardio session and one resistance session at moderate intensity, with 5,000 to 7,500 daily steps. She sleeps 8 or more hours but wakes tired most mornings, with energy low all day, and stress feels hard to manage constantly. She does not drink alcohol. She has diagnosed chronic fatigue syndrome (ME/CFS), ADHD, anxiety disorder, acne vulgaris and IBS. She takes a multivitamin and has recently paused additional supplements including vitamin D, TUDCA, digestive enzymes and L-glutamine. She has a family history of heart attack or stroke before 60 and type 2 diabetes. She reports low energy and fatigue, bloating and digestive discomfort, skin breakouts, and feeling cold with cold hands and feet, all of which she describes as having been present for as long as she can remember. Her goals are to improve digestion and gut health, improve energy levels, and improve long-term health and longevity. In her own words, she is looking for answers behind brain fog, chronic fatigue, energy crashes, insomnia alongside oversleeping, cystic acne, bloating and gas after most meals, feeling cold extremely easily, excessive thirst, and the possibility of leaky gut, SIBO or candida. This is her first blood test.\n\nThe most important finding in this report is a thyroid peroxidase antibody level above 400, which is dramatically above the upper limit of 13.8, and this result needs to go to Sakina's GP as a priority. Thyroid peroxidase antibodies, known as TPO antibodies, are proteins the immune system makes that attack the thyroid gland itself. A level this high is strongly associated with a condition called Hashimoto's thyroiditis, where the immune system gradually damages the thyroid and, over time, reduces its ability to produce the hormones the body depends on for energy, temperature regulation, metabolism and mood. At 24, Sakina's thyroid is still producing adequate amounts of hormone: her TSH (thyroid stimulating hormone, the signal the brain sends to tell the thyroid to work harder) is 2.08, which sits inside the laboratory range of 0.55 to 4.78 but is already above the optimal band of 1.0 to 2.5 and moving towards the upper end of ideal. Her free T4 (thyroxine, the storage form of thyroid hormone) is 17, comfortably within the ideal range of 14 to 20. Her free T3 (the active form the body actually uses) is 4.7, which sits just inside the optimal band of 4.5 to 6.5 but towards the lower end. The FT3 to FT4 ratio is 0.276, which is at the very floor of the optimal band, meaning conversion from the storage form to the active form is adequate but not generous. The picture this paints is a thyroid gland that is under autoimmune attack but still holding its ground, producing enough hormone to keep the blood results within range for now. The concern is what happens next. Hashimoto's is a slow process. The antibodies may have been elevated for years before this test, and the thyroid may gradually lose capacity over the coming years or decades. Every one of Sakina's core symptoms, the chronic fatigue, the brain fog, feeling cold and having cold extremities, energy crashes, difficulty waking despite long sleep, and even the skin breakouts and digestive bloating, is a recognised feature of autoimmune thyroid disease. It would be wrong to say the thyroid is definitely causing all of these symptoms when the hormone levels are still within range, but it would be equally wrong to dismiss the connection. A TSH of 2.08 with antibodies this high is not the same as a TSH of 2.08 with negative antibodies. The GP should be aware of this result, should arrange a repeat TSH and FT4 in three months to track direction of travel, and should consider referral to endocrinology given the symptom burden and the family history of autoimmune-adjacent conditions. Sakina's thyroglobulin antibody, the other thyroid antibody tested, came back below 1.3, which is negative. In Hashimoto's it is common for one antibody to be strongly positive while the other is negative, and this does not change the interpretation.\n\nThe second finding that must go to Sakina's GP is a CA19-9 of 183.38, which is nearly five times the upper limit of 37. CA19-9 is a tumour marker, a substance that can be produced by certain cancers, particularly of the pancreas, bile ducts and ovaries. However, and this is critical context, CA19-9 is also raised by a wide range of benign conditions. It is well documented that autoimmune conditions, ovarian cysts, endometriosis, IBS with inflammation, liver or bile duct irritation, and even menstruation can push CA19-9 well above the reference range. Her other tumour markers are reassuringly normal: CEA is 0.99 (well within the non-smoker limit of 2.3), CA125 is 16.2 (well within its limit of 35), and CA15-3 is 12.99 (well within its limit of 30). Given that Sakina is 24, has no red-flag symptoms such as unexplained weight loss, jaundice or a palpable mass, and has IBS and an active autoimmune process already confirmed by her TPO antibodies, the most likely explanation is that this is an inflammatory or benign elevation rather than a malignant one. Nevertheless, a result this high cannot be left uninvestigated. The GP should arrange an abdominal ultrasound and a repeat CA19-9 in six to eight weeks. If it is falling, the likely explanation is a transient benign cause. If it remains elevated, further investigation with cross-sectional imaging would be warranted.\n\nThe third significant finding is an ESR of 22, above the upper limit of 12 for a woman of her age. ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over one hour, and a faster rate indicates inflammation or increased protein in the blood. Alongside this, her high-sensitivity CRP is 3.1, which is within the laboratory limit of 5 but well above the optimal threshold of 1.0. CRP (C-reactive protein) is produced by the liver in response to inflammation anywhere in the body. Together, a raised ESR and an above-optimal CRP tell us there is a low-grade inflammatory process running. The most likely source is the autoimmune thyroid disease, which generates chronic immune activation. Her menstrual cycle is described as heavy or painful, and the timing of the blood draw relative to her cycle could also contribute to both the ESR and the CRP. The combination does not point to infection (her white cell count is normal at 5.86, neutrophils are healthy, and urinalysis is clean), but it does mean her body is carrying an inflammatory burden that contributes to fatigue, brain fog and general malaise.\n\nTurning now to what is working well. Sakina's blood sugar control is excellent. Her fasting glucose is 4.9, within the ideal range of 4.0 to 5.4. Her HbA1c (a measure of average blood sugar over the previous two to three months) is 32 mmol/mol, comfortably below the optimal ceiling of 36, which essentially rules out any movement towards insulin resistance or type 2 diabetes despite her family history. Her fasting insulin is 6.37 mIU/L, sitting beautifully within the optimal band of 2 to 8, and her HOMA-IR (a calculation that estimates insulin resistance using fasting glucose and insulin together) is 1.39, within the healthy range. This is reassuring given the family history of type 2 diabetes and means her metabolic health is in excellent shape. Her C-peptide came back at 0.995, marginally below the laboratory range of 1.1 to 4.4. C-peptide is released alongside insulin by the pancreas and is a measure of how much insulin the body is actually producing. At a fasting insulin of 6.37 and a fasting glucose of 4.9, a C-peptide at the lower end of the range simply reflects low insulin demand, which is a sign of excellent insulin sensitivity, not of pancreatic insufficiency. The lab note mentions that delayed sample separation can reduce C-peptide levels, and this may have contributed a small amount. This is not a concern.\n\nHer liver is in excellent health. ALT is 16, well within the optimal ceiling of 25 for a woman. AST is 19. GGT (gamma-glutamyl transferase, a marker that rises with liver stress, alcohol, medications or metabolic strain) is 14, which is very clean. Her bilirubin is 11, comfortably mid-range. Her FIB-4 score, which estimates liver scarring using age, platelets, ALT and AST, is 0.64, well below the threshold. Total protein, albumin and globulin are all within healthy ranges. Her amylase and lipase, which reflect pancreatic function, are both mid-range, which is useful given the CA19-9 finding: a genuinely inflamed pancreas almost always pushes these enzymes up, and hers are entirely normal.\n\nHer kidney function is strong. Her cystatin C, which is a more reliable marker of kidney filtration than creatinine in someone of Sakina's build, is 0.73, giving a cystatin C eGFR of 131 and a combined eGFR of 131, both excellent at 24. Her creatinine is 44, which falls below the laboratory range of 49 to 90, but this is expected in a petite woman at 49 kg and 157 cm. Creatinine is produced by muscle, and less muscle means less creatinine; it does not indicate kidney disease. Her urea is 2.7, also below the laboratory range of 3.2 to 8.2. Low urea in a lean young woman with adequate protein intake usually reflects efficient kidneys clearing urea quickly, and at her weight and build this is a normal finding rather than a sign of liver disease or malnutrition. Her uric acid, electrolytes, bicarbonate and chloride are all within range.\n\nHer full blood count is largely healthy. Haemoglobin is 135, mid-range for a woman. Red blood cells, haematocrit, MCV, MCH and RDW are all within range and within the ideal bands. Her white cell count, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within normal limits. Her platelets are 179, within range. Her reticulocyte percentage is 0.81, which is normal, but her absolute reticulocyte count is 36.4, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count can reflect either low iron availability limiting new red cell production or the bone marrow running slightly conservatively. Given her ferritin and iron picture (discussed next), the low reticulocyte count likely reflects early iron restriction on red cell production. Her MPV (mean platelet volume, which measures the average size of platelets) is 11.3, above the upper limit of 10.1. MPV rises when the bone marrow is producing younger, larger platelets, often in response to mild inflammation or increased platelet turnover. In the context of her raised ESR and above-optimal CRP, this is consistent with a low-grade inflammatory state rather than a platelet disorder.\n\nHer iron studies tell an important story and connect directly to her fatigue and feeling cold. Her ferritin is 20, which is within the laboratory range of 10 to 291 but below the optimal floor of 40 for a woman. Ferritin is the body's iron storage protein, and at 20 the stores are genuinely depleted. Her serum iron is 10.9, just inside the lower limit of 9. Her transferrin saturation is 16.26%, below the lower limit of 18% and well below the optimal floor of 25%. Transferrin saturation tells us what proportion of the iron-carrying protein in the blood is actually loaded with iron, and at 16% the body does not have enough iron to fully load its transport system. Her transferrin itself and her total iron binding capacity are both within range, meaning the body is making an appropriate amount of carrier protein but simply does not have enough iron to fill it. For a 24-year-old woman with heavy, painful periods, this pattern is almost certainly driven by menstrual iron losses outstripping dietary intake. Iron is essential for oxygen transport, energy production in every cell, thyroid hormone synthesis, and temperature regulation. At a ferritin of 20 and a saturation of 16%, Sakina does not meet the criteria for iron deficiency anaemia (her haemoglobin is normal), but she does meet the criteria for iron depletion, and this is a significant contributor to her chronic fatigue, brain fog, feeling cold and cold extremities, and possibly her skin quality. The low absolute reticulocyte count fits this picture: the bone marrow has just enough iron to maintain haemoglobin but not enough to produce reticulocytes at the normal rate.\n\nHer lipid profile is mostly good, but there is one inherited finding that is clinically important. Her total cholesterol is 4.1, her LDL is 2.2 (within the optimal ceiling of 2.6), her HDL is 1.6 (right at the optimal floor of 1.6 for a woman), and her triglycerides are 0.65, which is excellent and well within the optimal ceiling of 1.0. Her VLDL is 0.3, remnant cholesterol is low, and her atherogenic index is negative at minus 0.391, all of which point to a healthy metabolic lipid pattern. However, her ApoB (apolipoprotein B, the protein carried by every LDL and VLDL particle, and the best single measure of how many atherogenic particles are circulating) is 0.91, marginally above the desirable limit of 0.9. And her Lp(a) is 147.74 nmol/L, well above the normal limit of 32 and sitting in the moderate risk category (90 to 200). Lp(a), pronounced lipoprotein little a, is an inherited lipoprotein that behaves like a particularly sticky form of LDL. It deposits cholesterol in artery walls, promotes blood clotting and drives local inflammation. Unlike LDL, Lp(a) cannot be lowered by diet, exercise or standard cholesterol-lowering medication. It is genetically determined, does not change over a lifetime, and once measured it never needs measuring again. Given her family history of heart attack or stroke before 60, this Lp(a) level may be part of the explanation for that family pattern, and first-degree relatives should be tested. Her Lp(a)-corrected LDL, which subtracts the cholesterol carried by Lp(a) particles from the total LDL figure, is 1.72, meaning her modifiable LDL is actually very low. The ApoB of 0.91 is therefore largely driven by Lp(a) particles rather than by diet or lifestyle, and this is important because it means the standard advice of lowering saturated fat, while still sensible, will only move the ApoB a small amount. The conversation with the GP should include whether statin or PCSK9 inhibitor therapy is appropriate in the context of a high Lp(a) and a family history of premature cardiovascular disease. This is not urgent at 24, but it should be on the medical record permanently.\n\nHer Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that reflects the cumulative burden of lipid, inflammatory and metabolic risk factors, is 70 out of 100, which is high. This is driven almost entirely by the Lp(a) and the above-optimal CRP. Because this score has no age term, it measures the risk being built rather than the ten-year probability of an event. At 24 her ten-year risk is extremely low, but the gap between a high score and a low ten-year risk is the window in which acting on modifiable factors pays the greatest dividend over a lifetime.\n\nHer vitamin D is 99 nmol/L, which is excellent and sits within the optimal range of 75 to 120. This likely reflects the supplementation she has been taking. Her vitamin B12 is 453, within the laboratory range but below the optimal floor of 500. On a mixed diet without supplementation (she paused her multivitamin before the test), B12 at 453 is adequate but not generous, and given her fatigue and brain fog, bringing this into the optimal band with sublingual methylcobalamin would be worthwhile. Her folate is 20, above the laboratory range of 3 to 17, which is likely driven by her multivitamin and her vegetable intake. Above-range folate is not harmful and is simply a reflection of good intake. Her magnesium is 0.84, within the laboratory range but just below the optimal floor of 0.85. Magnesium is involved in over 300 enzymatic reactions including energy production, sleep quality and stress response, and at 0.84 with constant stress, poor sleep quality despite long hours, and fatigue, optimising magnesium is a simple and worthwhile intervention. Her calcium, corrected calcium, phosphate and parathyroid hormone are all within healthy ranges.\n\nHer total antioxidant activity is 1.97, above the upper limit of 1.77. This is almost certainly driven by her supplements (vitamin D, TUDCA and any antioxidant-containing multivitamin) and her good vegetable and fruit intake. This is not a concern.\n\nHer hormones are consistent with the luteal phase of her menstrual cycle. Oestradiol at 625 and progesterone at 59.03 both sit within the luteal range, and LH and FSH are appropriately suppressed at 1.28 and 3.27 respectively, which is the expected pattern after ovulation. This confirms she is ovulating, which is reassuring. Her testosterone is 1.1, within the female range of 0.5 to 2.6. Her SHBG (sex hormone binding globulin, the protein that binds testosterone and oestradiol in the blood) is 77.7, within range but on the higher side, which can be driven by oestrogen levels and by thyroid autoimmunity. Her free androgen index and free testosterone are within range. Her DHEA-S is 6.6 umol/L, healthy for her age. Her cortisol is 305 nmol/L, within the morning reference range, which is reassuring given her constant stress, though cortisol is a snapshot and does not capture the diurnal rhythm. Her prolactin is 188, within the non-pregnant range. Her bioavailable testosterone is 0.25, within the optimal band. Her creatine kinase is 60, mid-range, reflecting no muscle damage.\n\nHer immune markers are healthy. IgG, IgM, IgA and IgE are all within range, and IgE at 10.7 makes a significant allergic component to her symptoms unlikely. Rheumatoid factor is below 4, which is negative. Her tissue transglutaminase IgA is negative, which rules out coeliac disease as a cause of her bloating and digestive symptoms, provided she was eating gluten in the weeks before the test.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 16.4, about 8 years younger than a calendar age of 24.\n\nHer urinalysis is entirely clean. No protein, no glucose, no blood, no white cells, no nitrites, no significant bacterial growth. Urine glucose is negative, which is relevant given her report of excessive thirst: her blood glucose and HbA1c are normal, and there is no glucose spilling into the urine, so diabetes is effectively excluded as a cause of the thirst. Excessive thirst in the context of normal glucose and normal kidney function can be driven by subclinical thyroid changes affecting fluid regulation, by stress and anxiety increasing sympathetic nervous system activity, or simply by inadequate fluid intake relative to need.\n\nHer potassium is 5.0, within the laboratory range of 3.5 to 5.3 but towards the upper end. The lab notes that delayed separation or prolonged time on cells can falsely elevate potassium, and at 5.0 in a 24-year-old with normal kidney function this is most likely a sample handling effect rather than a true elevation. It does not require action but should be noted.\n\nHer free testosterone is reported at 0.011 nmol/L, which the lab has flagged as abnormal high against a range of 0.01 to 0.25. This is at the very floor of the range, and the flag appears to be a laboratory artefact. At 0.011 out of a range that extends to 0.25, this is not elevated in any clinically meaningful sense.\n\nTo bring the threads together: Sakina has come to this test looking for an explanation for a constellation of symptoms that have been with her for as long as she can remember. The blood results do provide several pieces of the answer, but they also honestly exclude some possibilities she has been considering. The biggest finding is the TPO antibodies above 400, which confirm an autoimmune process targeting the thyroid. Even though her thyroid hormone levels are still within range, Hashimoto's thyroiditis can cause symptoms of underactivity before the blood levels formally fall below range, particularly fatigue, cold intolerance, brain fog, energy crashes and skin changes. The iron depletion, with a ferritin of 20 and a transferrin saturation of 16% in the context of heavy periods, is a second and compounding driver of exactly the same symptoms. The low-grade inflammation shown by the ESR of 22 and CRP of 3.1 adds a third layer. These three factors, autoimmune thyroid disease, iron depletion and chronic inflammation, are not independent: Hashimoto's itself drives inflammation, and inflammation impairs iron absorption and utilisation, which worsens fatigue, which worsens stress tolerance, which feeds back into inflammation. Breaking this cycle requires addressing all three.\n\nWhat the bloods do not explain is the bloating and gas after meals, and this is worth addressing directly. Her coeliac screen is negative. Her pancreatic enzymes are normal. Her liver is pristine. Her immunoglobulins do not suggest an immune-driven gut process. Blood tests cannot diagnose IBS, SIBO, candida overgrowth or increased intestinal permeability. If Sakina wants to investigate the gut symptoms further, the most useful next steps would be a hydrogen and methane breath test for SIBO (which can be arranged privately or through the GP), a trial elimination of common triggers such as high-FODMAP foods (working with a dietitian experienced in IBS), and potentially a stool test looking at pancreatic elastase, calprotectin and microbial composition. The digestive enzymes and L-glutamine she has been taking may have been masking symptoms rather than addressing the root cause, and understanding what is actually happening in the gut will be more useful long-term than continuing to supplement blind.","links":"The central thread in Sakina's results is autoimmune thyroid disease and its downstream effects. TPO antibodies above 400 confirm the immune system is actively targeting the thyroid gland. While the thyroid hormones are still within range, the TSH is already drifting towards the upper half of ideal, and the FT3 to FT4 conversion ratio is sitting at the very floor of the optimal band. This pattern is consistent with early Hashimoto's thyroiditis where the gland is under attack but compensating. The symptoms Sakina describes, chronic fatigue, cold intolerance, brain fog, energy crashes despite long sleep, and skin breakouts, are all recognised features of thyroid autoimmunity, and they can manifest before hormone levels formally cross the laboratory boundary into hypothyroidism.\n\nThe second thread is iron depletion driven by heavy menstrual losses. Ferritin at 20, transferrin saturation at 16% and a low absolute reticulocyte count form a coherent picture: the body's iron stores are depleted, not enough iron is available for transport, and the bone marrow is producing fewer new red blood cells as a result. Haemoglobin is maintained for now, meaning this is pre-anaemic iron depletion rather than frank anaemia. Iron depletion at this level causes fatigue, cold extremities, poor concentration and reduced exercise tolerance, all of which overlap with and compound the thyroid-driven symptoms. Hashimoto's itself may worsen iron absorption through the inflammatory pathway, creating a vicious cycle.\n\nThe third thread is low-grade systemic inflammation. The ESR of 22 and hsCRP of 3.1 are both above their optimal thresholds. The autoimmune thyroid process is the most likely primary driver, with possible contribution from the heavy menstrual cycle and from gut inflammation related to her IBS. The raised CA19-9 at 183 likely sits within this inflammatory thread: CA19-9 is well known to rise with benign inflammatory conditions, ovarian cysts, endometriosis and autoimmune processes. The normal CEA, CA125, CA15-3, amylase and lipase make a pancreatic or gastrointestinal malignancy extremely unlikely at 24, but the result cannot be ignored and requires ultrasound imaging and a repeat level to confirm it is falling.\n\nThe fourth thread is the inherited cardiovascular risk from Lp(a) at 147.74. This is genetically fixed, cannot be changed by diet or exercise, and given the family history of premature cardiovascular events, may be the heritable factor behind that pattern. The good news is that Sakina's modifiable lipid profile is excellent: her Lp(a)-corrected LDL is only 1.72, her triglycerides are 0.65, and her HDL is 1.6. The ApoB of 0.91, marginally above target, is largely carried by Lp(a) particles rather than by conventional LDL. This means her diet and lifestyle are doing their job on the modifiable side, and the conversation with the GP is about whether pharmacological reduction of ApoB is warranted given the inherited component.\n\nWhat has been excluded is equally important. Diabetes and insulin resistance are ruled out by an HbA1c of 32, fasting glucose of 4.9 and HOMA-IR of 1.39. Coeliac disease is excluded by a negative tissue transglutaminase. Kidney disease is excluded by a cystatin C eGFR of 131. Liver disease is excluded by clean enzymes and a FIB-4 of 0.64. Significant allergy is unlikely given an IgE of 10.7. Autoimmune connective tissue disease is unlikely with a negative rheumatoid factor. Hormonal imbalance in terms of ovulation, oestrogen and progesterone is excluded by a clear luteal-phase pattern. The bloating and digestive symptoms remain unexplained by blood markers and require functional gut testing to investigate further.","lifestyle":"Start an iron-rich meal once a day: red meat, dark poultry, lentils or fortified cereal paired with a source of vitamin C such as a glass of orange juice or a handful of peppers. Anchor: build this into your evening meal, the one you sit down for. Why: your ferritin is 20 and your transferrin saturation is 16%, and dietary iron alongside vitamin C is the most effective way to rebuild stores alongside supplementation.\nAdd a palm-sized portion of oily fish (salmon, mackerel, sardines) twice a week, replacing one of your current protein choices. Anchor: pick two fixed days, such as Tuesday and Friday. Why: omega-3 lowers the inflammatory burden behind your CRP of 3.1 and ESR of 22, supports thyroid function, and is protective for the cardiovascular risk carried by your Lp(a).\nKeep your vegetable and fruit intake at 4 to 5 portions but add one extra portion of soluble fibre daily: oats at breakfast, a handful of flaxseed on yoghurt, or a portion of beans or lentils. Anchor: add it to the first meal of the day. Why: soluble fibre feeds gut bacteria that reduce bloating over time, lowers LDL by binding bile acids, and steadies energy through the morning.\nWalk for 20 minutes within an hour of waking, outside, in daylight. Anchor: shoes on before you check your phone. Why: morning light resets your circadian rhythm, which directly improves the quality of sleep you are getting despite 8 or more hours, and daylight exposure supports thyroid and cortisol regulation. This single habit addresses your tired-on-waking pattern more effectively than sleeping longer.\nAdd one more resistance session per week, bringing you to two. Anchor: pair it with a day you already train so the habit is established. Why: resistance training at moderate intensity improves insulin sensitivity (protecting your family-history risk of type 2 diabetes), builds the muscle mass that supports metabolic rate and energy, and has been shown to reduce systemic inflammation.\nSet a caffeine cut-off at midday. Anchor: after your lunchtime drink, switch to herbal tea or water for the rest of the day. Why: caffeine after midday fragments sleep architecture even when you fall asleep easily, and fragmented sleep is a known driver of the tired-on-waking pattern you describe despite getting 8 or more hours.\nBuild a five-minute wind-down before bed: no screen, low light, slow breathing or a brief body scan. Anchor: set an alarm 30 minutes before your target bedtime. Why: with stress rated as constantly hard to manage, the nervous system is likely running in sympathetic overdrive at night, which explains the insomnia pattern you describe alongside oversleeping, and a deliberate transition helps shift it.\nKeep a simple food and symptom diary for two weeks: write down what you eat and rate bloating on a 0 to 3 scale two hours after each meal. Anchor: note it on your phone straight after the meal. Why: this will identify whether specific foods consistently trigger your bloating and will give a dietitian or GP something concrete to work with before arranging a SIBO breath test.","flags":"TPO antibodies above 400 (limit 13.8) with TSH 2.08 and FT3 at the lower end of optimal. This is strongly associated with Hashimoto's thyroiditis. The thyroid is currently compensating but the autoimmune process is active. GP referral for monitoring and possible endocrinology input is recommended. Thyroglobulin antibody is negative.\nCA19-9 at 183.38 (limit 37). All other tumour markers are normal (CEA 0.99, CA125 16.2, CA15-3 12.99). Amylase and lipase are normal. Most likely a benign or inflammatory elevation given age, IBS and active autoimmune disease, but requires abdominal ultrasound and repeat CA19-9 in six to eight weeks.\nESR 22 (limit 12) and hsCRP 3.1 (optimal below 1.0). Low-grade systemic inflammation, most likely driven by the autoimmune thyroid process and possibly contributed to by heavy menstruation and IBS.\nFerritin 20 (optimal above 40 for women), transferrin saturation 16.26% (limit 18%), absolute reticulocytes 36.4 (limit 50). Pre-anaemic iron depletion with evidence the bone marrow is producing fewer new red blood cells as a result. Consistent with heavy menstrual losses outstripping intake.\nLp(a) 147.74 nmol/L (limit 32), moderate risk category. Genetically determined, unchangeable, and given the family history of heart attack or stroke before 60, should be on Sakina's permanent medical record. First-degree relatives should be tested.\nApoB 0.91 (limit 0.9) and ApoB/A1 ratio 0.66 (limit 0.6). Marginally above target, but the Lp(a)-corrected LDL is only 1.72, meaning the modifiable component is excellent and the ApoB elevation is largely Lp(a)-driven.\nCardiovascular Risk Score 70 out of 100 (target below 40, ideal below 20), driven by the Lp(a) and the above-optimal CRP. Ten-year event risk at 24 is very low, but the inherited burden should be managed proactively.\nMPV 11.3 (limit 10.1). Mildly elevated, consistent with the inflammatory picture rather than a primary platelet disorder.\nC-Peptide 0.995 ug/L (range 1.1 to 4.4), marginally below range. With normal glucose, HbA1c and insulin, this reflects low insulin demand and excellent insulin sensitivity rather than pancreatic failure.\nCreatinine 44 (range 49 to 90) and urea 2.7 (range 3.2 to 8.2). Both below range. Expected in a petite woman at 49 kg with low muscle mass. Cystatin C eGFR is 131, confirming excellent kidney function.\nVitamin B12 453 (optimal above 500). Adequate but below ideal; sublingual methylcobalamin recommended.\nMagnesium 0.84 (optimal 0.85 to 1.05). Marginally below optimal. Supplementation recommended given fatigue and stress burden.\nFolate 20 (range 3 to 17). Above range, driven by diet and multivitamin. Not harmful.\nTotal antioxidant activity 1.97 (range 1.3 to 1.77). Above range, likely supplement-driven. Not a concern.\nFree testosterone flagged as abnormal high at 0.011 (range 0.01 to 0.25). This is at the floor of the range and the flag is a laboratory artefact; not clinically elevated.\nReassuring negatives: HbA1c 32 and HOMA-IR 1.39 exclude diabetes and insulin resistance. Tissue transglutaminase negative excludes coeliac disease. Liver enzymes, FIB-4 and GGT all clean. Cystatin C eGFR 131 confirms excellent kidney function. IgE 10.7 makes significant allergy unlikely. Rheumatoid factor negative. Haemoglobin 135 excludes anaemia. CA125, CA15-3 and CEA all normal. Urinalysis entirely clean.","recommendations":"Discuss the TPO antibody result (above 400, limit 13.8) with the GP as a priority. Request a repeat TSH and FT4 in three months to track whether thyroid function is declining, and ask whether referral to endocrinology is appropriate given the symptom burden.\nRequest an abdominal ultrasound and a repeat CA19-9 in six to eight weeks. Bring the current result of 183.38 (limit 37) and the context that all other tumour markers and pancreatic enzymes are normal.\nRequest iron studies to be repeated in three months after supplementation. Bring the current ferritin of 20 and transferrin saturation of 16.26%. Discuss whether referral to gynaecology for the heavy, painful periods is appropriate to reduce menstrual iron losses.\nAsk the GP to record the Lp(a) of 147.74 nmol/L permanently on Sakina's medical file. Discuss whether proactive lipid-lowering therapy is warranted given the family history of premature cardiovascular disease. Request that first-degree relatives are offered Lp(a) testing.\nDiscuss the ESR of 22 and CRP of 3.1 in the context of the autoimmune thyroid disease. If thyroid function is stable on repeat testing, the GP may consider whether further investigation of the inflammatory source is needed.\nDiscuss referral for a hydrogen and methane breath test to investigate SIBO as a potential cause of the bloating and gas after meals, given that coeliac disease has been excluded.\nCalorie and protein targets: at 49 kg, 157 cm, 24 years old, with moderate activity (two training sessions plus 5,000 to 7,500 steps), estimated TDEE is approximately 1,750 to 1,850 kcal per day. Protein target: 64 to 78 g per day (1.3 to 1.6 g per kg). These targets support iron absorption, thyroid function and the energy levels Sakina is trying to improve. Retest: repeat the Ultimate panel in four to six months, specifically tracking TSH, FT4, FT3, ferritin, transferrin saturation, reticulocytes, ESR, CRP, CA19-9, ApoB and vitamin B12.","supplementation":"Iron as ferrous bisglycinate, 25 mg daily, taken with a source of vitamin C (orange juice, kiwi or a 250 mg vitamin C tablet) on an empty stomach or with a light meal. Take it at least two hours away from tea, coffee, dairy or calcium supplements, which block absorption. Why: ferritin is 20 and transferrin saturation is 16.26%, both below optimal, and heavy periods are the likely cause. Bisglycinate is the gentlest form on the gut, which matters given the IBS.\nVitamin D3 as cholecalciferol, 2,000 IU daily with a meal containing fat. Why: Sakina's level is 99 nmol/L, which is excellent, but this reflects supplementation she has now paused. Without continued intake, vitamin D will fall, particularly through the winter months. 2,000 IU is a maintenance dose to hold the level within the 75 to 120 optimal band.\nVitamin K2 as MK-7, 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone and away from arteries, and should always accompany vitamin D supplementation, especially with a high Lp(a) where arterial health matters.\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Why: B12 is 453, below the optimal floor of 500. Sublingual bypasses the gut, which is relevant given the digestive symptoms and possible absorption issues.\nMagnesium as magnesium glycinate, 300 mg before bed. Why: magnesium is 0.84, just below the optimal floor of 0.85. Glycinate is the best tolerated form for the gut and has a mild calming effect that supports sleep quality, which is poor despite adequate hours.\nOmega-3 fish oil providing 2 g of combined EPA and DHA daily, with a meal. Why: omega-3 lowers CRP (currently 3.1), supports thyroid function in autoimmune thyroid disease, and is cardioprotective in the context of elevated Lp(a).\nDo not take a multivitamin containing iron alongside the separate iron supplement, as this risks exceeding the dose. Check the multivitamin label: if it contains iron, switch to an iron-free version.\nDo not take calcium supplements or drink milk within two hours of the iron supplement.\nThe most important changes from this report are not supplements. They are getting the TPO antibody result and the CA19-9 to the GP, rebuilding iron through diet and supplementation together, investigating the gut symptoms properly with a breath test rather than masking them, and building the morning light, movement and sleep-quality habits that address the fatigue from a direction supplements cannot reach.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 48.8. Weakest systems: kidney function 11%, inflammation 16%, tumor markers 19%. Biggest drags: Urea, Creatinine, Lipoprotein(a), High-Sensitivity CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"16.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2828","lower_normal":"","upper_normal":"29","lower_optimal":"","upper_optimal":"24","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4138","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cumulative cardiovascular risk being built, not the ten-year probability of an event. Sakina's score of 70 is high, driven almost entirely by her inherited Lp(a) of 147.74 and her above-optimal CRP of 3.1. Her modifiable lipid factors (triglycerides, HDL, Lp(a)-corrected LDL) are all excellent. At 24, her ten-year risk of a cardiovascular event is very low, but this score highlights that the inherited Lp(a) and the chronic inflammation are building risk over time, and the gap between a high score and a low ten-year risk is the window in which acting pays the greatest lifetime dividend. The GP conversation should include whether proactive lipid-lowering therapy is appropriate.","low_causes":"Low Lp(a), low ApoB, low CRP, healthy lipids","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. Sakina's result of 4.9 sits comfortably within the optimal range of 4.0 to 5.4, indicating excellent blood sugar control. This effectively rules out diabetes and pre-diabetes, which is particularly reassuring given her family history of type 2 diabetes. The excessive thirst she reports is not explained by blood sugar, as this level is healthy.","low_causes":"Prolonged fasting, excessive exercise, insulin overproduction, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, corticosteroid use, pancreatic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"3.5","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6267","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has sugar attached to it, reflecting average blood sugar control over the previous two to three months. Sakina's result of 5.1% is well within the normal range (below 6.0) and below the pre-diabetes threshold of 6.0. This confirms excellent long-term blood sugar regulation.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol. Sakina's result of 32 is well below the normal ceiling of 42 and below the optimal ceiling of 36, confirming excellent average blood sugar control over the past two to three months. At 24 with a family history of type 2 diabetes, this is a genuinely reassuring result.","low_causes":"Haemolytic anaemia, chronic blood loss","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3503","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.4293","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing to keep blood sugar under control. Sakina's level of 6.37 sits neatly within the optimal band of 2 to 8, meaning her pancreas is working efficiently without having to overproduce insulin. This indicates excellent insulin sensitivity, which is the opposite of insulin resistance and is protective against type 2 diabetes.","low_causes":"Very low carbohydrate diet, low calorie intake, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high sugar diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.995","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2248","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts alongside insulin and is used to measure how much insulin the body is truly producing. Sakina's result of 0.995 is marginally below the laboratory range of 1.1 to 4.4. In the context of a healthy fasting glucose of 4.9, a healthy insulin of 6.37 and an HbA1c of 32, a low C-peptide simply reflects low insulin demand, which is a sign of excellent insulin sensitivity rather than a failing pancreas. The lab also notes that delayed sample separation can reduce C-peptide levels. This is not a clinical concern.","low_causes":"Low insulin demand (insulin sensitivity), fasting, low carbohydrate diet, delayed sample processing","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose is derived from the HbA1c and represents the average blood sugar level over the past two to three months. Sakina's estimated average glucose of 5.5 mmol/L is within the optimal range (below 6.2), confirming excellent long-term blood sugar control. This is another reassuring finding in the context of her family history of type 2 diabetes.","low_causes":"Very low carbohydrate diet, excessive exercise, haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4455","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"135","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Sakina's haemoglobin of 135 is mid-range and within the optimal band of 125 to 145, confirming she is not anaemic. This is reassuring given her depleted iron stores: the body is prioritising haemoglobin production, but the low reticulocyte count suggests it is doing so at a stretch.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, heavy periods, bone marrow disorders","hig ithin_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"11.6","upper_normal":"14","lower_optimal":"12.0","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5972","units":"%","description":"RDW measures the variation in size of red blood cells. A wider variation suggests a mix of old and new cells or cells produced under different conditions (such as iron deficiency). Sakina's RDW of 13% is mid-range and within the optimal band, meaning her red blood cells are uniform in size. This is a good sign and suggests the iron depletion is not yet causing a significant change in red cell production quality.","low_causes":"Usually not clinically significant","high_causes":"Iron deficiency, B12/folate deficiency, mixed anaemia, chronic disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume (MCV)","group":"HEMATOLOGY","result":"87.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4917","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"MCV measures the average size of red blood cells. Sakina's MCV of 87.3 is within the optimal range, meaning her red cells are a normal size. In iron deficiency, MCV eventually falls as the body makes smaller, paler cells, but Sakina's iron depletion has not progressed to that point. This is consistent with pre-anaemic iron depletion rather than established iron deficiency anaemia.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, liver disease, alcohol, hypothyroidism, myelodysplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin inside each red blood cell. Sakina's MCH of 30 is within the optimal band, confirming that each cell is carrying a healthy amount of oxygen-transporting protein. Like the MCV, this tells us the iron depletion has not yet affected the quality of the red cells being produced.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"344","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6556","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. Sakina's MCHC of 344 is within the laboratory range but just above the optimal ceiling of 340. At this margin, this is within normal variation and does not indicate a problem. It simply means the haemoglobin is packed slightly more densely within each cell, which can occur with minor dehydration or as normal variation.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"179","within_normal":"TRUE","within_optimal":"FALSE","result_position"
