hin the optimal range and healthy.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, refeeding","high_causes":"Kidney disease, hypoparathyroidism, excessive phosphate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.80","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4885","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6069","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle contraction, nerve function and heart rhythm. At 0.80, this is within the laboratory range of 0.53 to 1.11 but below the optimal band of 0.85 to 1.05. Serum magnesium reflects only about 1 percent of total body magnesium, so a below-optimal serum level often means intracellular stores are genuinely depleted. The improvement in palpitations since starting magnesium glycinate is consistent with marginal deficiency. Continue supplementation.","low_causes":"Poor dietary intake, alcohol, diuretics, proton pump inhibitors, chronic diarrhoea","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"134","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"This adjusts the sodium reading for the effect of glucose on fluid shifts. At 134, it is unchanged from the raw sodium because glucose is normal. Reported for context and not applicable at present.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"278.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3967","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Calculated serum osmolality estimates the concentration of dissolved particles in the blood. At 278.8, this is within the laboratory range of 275 to 295 but just below the optimal floor of 280. This likely reflects the mildly low sodium and hydration status at the time of the draw. It is not clinically significant.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2792","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune function, mood regulation and muscle function. At 67, this is sufficient (above 50) but below the optimal range of 75 to 120. With fewer than 2,000 steps a day suggesting very little outdoor time, dietary sources are unlikely to be adequate, and supplementation is the primary route to optimal. The D3/K2 combination recently started is the right approach and should bring this into the optimal range within 8 to 12 weeks at an adequate dose.","low_causes":"Low sunlight exposure, dark skin, obesity, malabsorption, indoor lifestyle","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5520","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5645","units":"pmol/L","description":"Parathyroid hormone controls calcium levels in the blood by regulating calcium release from bone, absorption from the gut and retention by the kidneys. At 3.8, this is within the laboratory range but above the optimal ceiling of 3.5. PTH tends to rise when vitamin D is below optimal, because the body needs more PTH to maintain calcium when vitamin D is insufficient to support calcium absorption. The vitamin D at 67 explains this mild elevation. As vitamin D rises into the optimal range with supplementation, PTH should settle.","low_causes":"Excessive vitamin D or calcium, post-parathyroid surgery","high_causes":"Vitamin D deficiency, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"786","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5845","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5558","upper_optimal_position":"0.6230","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 786, this is within the optimal range of 500 to 900, likely reflecting the recent B12 supplementation. This is an excellent level and rules out B12 deficiency as a cause of fatigue or low mood.","low_causes":"Poor dietary intake (vegan/vegetarian), pernicious anaemia, malabsorption, metformin","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate is a B vitamin essential for DNA synthesis, red blood cell production and foetal development. At 8, this sits at the very floor of the optimal range. Given the near-absence of vegetables and fruit in the diet, dietary folate intake is very low, and this level could easily fall below optimal. Increasing vegetable intake, particularly green leafy vegetables, beans and lentils, will support this marker.","low_causes":"Poor dietary intake, alcohol, coeliac disease, medications, pregnancy","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0800","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures the protein the liver produces in response to systemic inflammation. At 0.8, this is below the optimal threshold of 1.0, meaning there is no significant low-grade inflammation. This is a genuinely positive finding and reduces cardiovascular risk context around the lipid findings.","low_causes":"Normal health","high_causes":"Infection, autoimmune disease, obesity, cardiovascular risk, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5792","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including both protective HDL and harmful LDL. At 6.0, this is above the desirable limit of 5.18. However, total cholesterol alone is a crude measure. The breakdown matters more: the HDL at 1.6 is excellent, but the LDL at 4.15 and ApoB at 0.97 are both elevated, meaning the excess cholesterol is carried in atherogenic particles. Given the family history of early cardiovascular events, this warrants a GP conversation and dietary intervention.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1882","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat circulating in the blood. At 0.64, this is well below the optimal ceiling of 1.0 and is an excellent result. Low triglycerides alongside high HDL is a strongly protective metabolic pattern, even though the LDL is elevated.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar diet, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1859","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. At 0.29, this is within the optimal range, consistent with the healthy triglyceride level.","low_causes":"Low fat diet, malnutrition","high_causes":"High sugar diet, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5161","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective lipoprotein that removes excess cholesterol from artery walls and returns it to the liver for disposal. At 1.6, this is above the optimal male threshold of 1.4 and is an excellent result. High HDL partially offsets the risk from elevated LDL.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetics, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6917","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL is the lipoprotein that deposits cholesterol into artery walls, driving atherosclerosis (the build-up of fatty plaques). At 4.15, this is well above the upper limit of 3.0 and more than double the optimal target of below 2.0. At 32 with a family history of heart attack or stroke before 60, this is the most important finding in the report. The Lp(a) below 25 confirms the elevation is driven by modifiable factors, primarily dietary saturated fat from takeaways and processed food, meaning lifestyle change can bring this down significantly.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, liver disease","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio summarises cardiovascular risk by accounting for both the harmful and protective lipoproteins. At 3.75, this is within the optimal range of below 4.0. Despite the elevated total cholesterol, the strong HDL of 1.6 keeps this ratio favourable.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"26.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6668","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows what proportion of cholesterol is in the protective form. At 26.67 percent, this is above the desirable minimum of 20 percent and above the optimal threshold of 25 percent, confirming a healthy proportion of protective cholesterol.","low_causes":"Sedentary lifestyle, poor diet, obesity, smoking","high_causes":"Exercise, healthy weight, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol captures all cholesterol carried in atherogenic particles (LDL, VLDL and remnant particles). At 4.4, this is above the 4.0 limit. It confirms the LDL story: there are too many cholesterol-carrying particles in the blood. The low VLDL means the excess is almost entirely in LDL particles.","low_causes":"Very low fat diet, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6583","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. At 1.58, this is above the optimal threshold of 1.4, confirming a healthy number of protective HDL particles. The ApoA1 level validates the excellent HDL cholesterol reading.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome","high_causes":"Exercise, healthy weight, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single protein found on every atherogenic lipoprotein particle (LDL, VLDL, IDL and Lp(a)). Because each particle carries exactly one ApoB molecule, this is effectively a direct count of the particles that can enter artery walls and deposit cholesterol. At 0.97, this is above the desirable threshold of 0.9 and well above the optimal target of below 0.8. Many cardiologists now consider ApoB the single best measure of atherogenic risk. Given the family history of early cardiovascular events, this is the number to bring to the GP.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.614","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4386","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio balances the atherogenic particle count (ApoB) against the protective particle count (ApoA1). At 0.614, this is below the lower-risk threshold of 0.7. Despite the elevated ApoB, the strong ApoA1 of 1.58 keeps this ratio favourable. This does not mean the LDL elevation can be ignored, but it does mean the protective side is doing its job well.","low_causes":"High HDL, low LDL, exercise, healthy weight","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined particle similar to LDL that adds cardiovascular risk independently. Its level is set by your genes and does not change with diet or lifestyle. At below 25, this is within the ideal range of below 32. This is genuinely useful information because it confirms that the elevated LDL and ApoB are driven entirely by modifiable factors, giving dietary change the full power to bring them down.","low_causes":"Genetic variation","high_causes":"Genetic variation (inherited)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase is an enzyme released from damaged muscle cells. At 71, this is low and expected in someone who does no resistance or high-intensity training. As exercise is introduced, this number may rise after sessions, which is normal.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4629","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3887","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the main thyroid hormone circulating in the blood, produced by the thyroid gland. At 15.2, this is within the optimal range of 14 to 20, confirming adequate thyroid hormone production.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5074","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5277","units":"mIU/L","description":"TSH is the hormone the pituitary gland sends to the thyroid to tell it how much hormone to produce. At 2.7, this is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. A TSH above optimal with normal FT4 and FT3 and negative antibodies does not indicate thyroid disease at present, but it places him at the upper end of normal. In the context of fatigue and low mood, it is worth rechecking in 12 months to ensure it is stable.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, early thyroid failure, recovery from illness, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5111","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism in every cell. At 5.2, this is within the optimal range of 4.5 to 6.5, confirming the thyroid is converting T4 to T3 effectively. The active hormone output is healthy.","low_causes":"Hypothyroidism, severe illness, low calorie diet, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are immune proteins that attack the thyroid gland and are the hallmark of Hashimoto's thyroiditis, the most common cause of underactive thyroid. At below 6.6, these are negative, ruling out autoimmune thyroid disease.","low_causes":"Normal, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target a protein used in thyroid hormone production. At below 1.3, these are negative, providing further reassurance that there is no autoimmune thyroid process.","low_causes":"Normal, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.342","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5227","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active hormone (T3). At 0.342, this is within the optimal range of 0.27 to 0.4, confirming efficient thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA (Total)","group":"PROSTATE","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0800","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/ml","description":"PSA is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, inflammation or, less commonly, prostate cancer. At 0.4, this is very low and entirely normal at 32.","low_causes":"Normal prostate health","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"PSA (Free)","group":"PROSTATE","result":"0.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA measures the unbound fraction of PSA. The ratio of free to total PSA helps distinguish benign from malignant prostate conditions when PSA is elevated. At 0.23, this is low and normal, consistent with the very low total PSA.","low_causes":"Normal at low total PSA","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"PSA Free:Total Ratio","group":"PROSTATE","result":"0.575","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The free-to-total PSA ratio helps distinguish benign from malignant prostate conditions. At 0.575 (57.5 percent), this is well above the 0.19 normal threshold and highly reassuring.","low_causes":"Prostate cancer risk (below 0.15 is concerning)","high_causes":"Benign prostatic conditions, normal prostate","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"<1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_posit ning cortisol or cortisol day curve would clarify whether this is a sustained pattern.","low_causes":"Adrenal insufficiency, pituitary dysfunction","high_causes":"Stress, poor sleep, Cushing's syndrome, medications (prednisolone), infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2498","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the main oestrogen in men, important for bone density, brain function and cardiovascular health. At 73, this is within the optimal range for a male, confirming a healthy balance with testosterone.","low_causes":"Low body fat, aromatase inhibitors, hypogonadism","high_causes":"Obesity, liver disease, aromatisation of testosterone, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4448","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3700","upper_optimal_position":"0.5738","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. At 2, this is within the optimal range and healthy. It plays a minor role in mood regulation and sleep quality.","low_causes":"Adrenal insufficiency, very low in males normally","high_causes":"Adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.03","within_normal":"TRUE","within_optimal // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){

  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');

    runIntro();

    gerr.style.display='block'; dob.classList.add('shake');

}
