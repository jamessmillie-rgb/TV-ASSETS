<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Nadim Chenia","dob":"31/07/1994","report_date":"2026-10-22","summary":"This is a 32-year-old male of mixed ethnic background presenting with a BMI of 20.0, following a takeaway and convenience-based diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food daily; portions are about average (volume 5 out of 10). He does no structured exercise, no cardio and no resistance training, with fewer than 2,000 daily steps. He sleeps 8 or more hours but wakes tired most mornings, with an afternoon energy crash; stress feels hard to manage some weeks. He does not drink alcohol. He vapes nicotine. He takes no medications. He has recently started supplementing with magnesium glycinate, vitamin B12 and vitamin D3 with K2. His family history includes heart attack or stroke before 60 and type 2 diabetes. He has not had blood tests before. He reports low mood and anxiety, low energy and fatigue, and palpitations or dizziness, all lasting months. The palpitations appear to have improved since starting the magnesium. His goals are to improve his energy levels and his mood.\n\nHis PhenoAge is 27.5, which is four and a half years younger than his calendar age of 32. That is a genuinely positive result and reflects good underlying metabolic health in several areas despite the dietary pattern. His Cardiovascular Risk Score, however, is 50 out of 100, which is above the 40 threshold and well above the ideal of 20 or below. That score is driven almost entirely by his LDL cholesterol and ApoB, and given the family history of early heart attack or stroke, it deserves serious attention.\n\nStarting with the positives, and there are plenty. His kidney function is excellent. Cystatin C, a protein filtered by the kidneys that gives a more accurate measure of filtration than creatinine alone, is 0.89, giving a combined eGFR of 110, exactly where it should be at 32. Creatinine, urea and uric acid are all within the ideal range. His liver is in very good health. ALT, the enzyme most specific to liver cell damage, is 29, which is within the laboratory range but just touches the optimal ceiling of 30 for a male, and GGT at 24 is just inside the optimal limit of 25. AST at 22 is clean. FIB-4, a fibrosis score that combines age, platelets, AST and ALT to estimate whether the liver has any scarring, is 0.56, well within the safe range, and the APRI score at 0.237 confirms no fibrosis signal at all. Bilirubin at 20 is at the top of the laboratory range of 5 to 21 but with clean liver enzymes; this is most likely a reflection of Gilbert's syndrome, an inherited and entirely harmless trait affecting roughly 5 to 10 percent of the population where the liver processes bilirubin slightly more slowly. It does not progress, does not need treatment, and if anything is associated with antioxidant benefit. His pancreas is healthy, with amylase at 97 and lipase at 43 both comfortably within range. His blood sugar control is good on the surface: fasting glucose at 5.1 and HbA1c at 37 mmol per mol, which reflects average blood sugar over three months, are both within the ideal range. His full blood count is largely clean. Haemoglobin at 150 is mid-range and healthy, red cell count and haematocrit are ideal, and platelets at 232 are solid. His white cell count at 4.8 is within range, and the differential, the breakdown of white cells into neutrophils, lymphocytes, monocytes, eosinophils and basophils, is balanced. ESR, a measure of inflammation based on how quickly red cells settle, is 8, well within the normal limit of 12. His high-sensitivity CRP, a more precise inflammation marker measuring the protein the liver produces in response to systemic inflammation, is 0.8, which is below the optimal threshold of 1.0, meaning there is no significant inflammatory process running. His iron studies are well balanced: ferritin at 69 is comfortably within the optimal male range of 50 to 200, serum iron at 18 is mid-range, transferrin saturation at 29 percent sits within the optimal band of 25 to 40 percent, and total iron binding capacity at 55.3 is healthy. His immune system markers are reassuring. IgG, IgA, IgM and IgE, the four classes of immunoglobulin that reflect immune function and allergic tendency, are all within range. IgE at 57.4 is well below the 100 limit, so there is no suggestion of an active allergic or parasitic process. Rheumatoid factor is negative and tissue transglutaminase IgA, the coeliac disease screening antibody, is negative, which rules out coeliac disease as a cause of his fatigue. His thyroid antibodies, TPO and thyroglobulin, are both negative, ruling out autoimmune thyroid disease, which matters given the family history of thyroid disease was not reported but is worth knowing. His prostate markers are entirely clean at 32, with PSA at 0.4 and a free PSA ratio of 0.575, both excellent. His tumour markers CA19-9 and CEA are well within range. Creatine kinase, a muscle enzyme that rises with damage or heavy training, is 71, low and expected given he does no exercise. His total antioxidant activity at 1.88 is marginally above the upper limit of 1.77. This is not a concern and is most commonly driven by supplementation, diet or normal variation; it simply reflects circulating antioxidant capacity.\n\nNow the findings that need attention. The most important story in this report is the lipid profile, particularly in the context of his family history of heart attack or stroke before 60. His total cholesterol is 6.0, above the desirable threshold of 5.18. His LDL cholesterol, the lipoprotein that deposits cholesterol into artery walls, is 4.15, well above the upper limit of 3.0 and more than double the optimal target of below 2.0. His ApoB, which counts the actual number of atherogenic particles in the blood rather than just the cholesterol they carry, is 0.97, above the 0.9 threshold and well above the optimal target of below 0.8. His non-HDL cholesterol, which captures all the cholesterol carried by harmful particles, is 4.4, above the 4.0 limit. His Lp(a)-corrected LDL, which removes the small contribution of Lp(a) from the LDL number to show what is modifiable, is 4.07, confirming that almost all of this LDL elevation is driven by factors that can be changed. His Lp(a) itself, a genetically determined lipoprotein that adds cardiovascular risk independently, is below 25 nmol per litre, which is below the 32 ideal threshold. This is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors, primarily diet and lifestyle, not by an inherited particle he cannot change. The good news within the lipid panel is significant. His HDL cholesterol, the protective lipoprotein that removes cholesterol from artery walls and returns it to the liver, is 1.6, which is above the 1.4 optimal threshold for a male and is excellent. His triglycerides at 0.64 are very low, well below the 1.0 optimal target. His ApoB to ApoA1 ratio, the single best summary of atherogenic risk from lipoproteins, is 0.61, below the 0.7 lower risk threshold. His atherogenic index of plasma at minus 0.398 is well within the ideal range. So the picture is one of high LDL particle count alongside excellent HDL and triglycerides. At 32 with no alcohol, no obesity and no metabolic syndrome, the most likely driver is the diet: a convenience-based pattern high in saturated fat from takeaways and processed food, with almost no vegetables, fruit or fibre. Saturated fat raises LDL by reducing the number of LDL receptors on liver cells, meaning fewer particles are cleared from the blood. The family history of early cardiovascular events makes this finding more urgent than it would be in someone without that background. This is the finding to take to his GP.\n\nHis fasting insulin at 9.94 gives a HOMA-IR of 2.25. HOMA-IR is a calculation that combines fasting insulin and fasting glucose to estimate how sensitive the body's cells are to insulin. The ideal range is 0.5 to 1.5, and below 1.0 is considered optimal. At 2.25, this crosses the early insulin resistance threshold of 1.9 identified by the laboratory. What this means in practice is that his pancreas is having to produce more insulin than it should need to keep his blood sugar at 5.1. The glucose and HbA1c look clean because the pancreas is compensating, but the compensation itself is the early warning sign. At 32 with a BMI of only 20, this is not driven by excess body fat. It is driven by diet quality: daily sugar intake, ultra-processed food most days, and very low vegetable and fibre intake. The family history of type 2 diabetes makes this pattern particularly important to address now, while the glucose is still normal and the trajectory is entirely reversible with dietary change. His C-peptide at 1.7 micrograms per litre, which converts to 563 pmol per litre, is consistent with the insulin level and confirms the pancreas is producing insulin normally, just producing more of it than ideal.\n\nHis cortisol at 671 is above the morning reference range of 145.4 to 619.4. Cortisol is the body's primary stress hormone, produced by the adrenal glands. A single morning blood draw is a snapshot, and cortisol is highly sensitive to the moment: the stress of a blood draw itself, poor sleep the night before, rushing to an appointment, or even caffeine can all push it above range. At 32 with no diagnosed conditions and no medications, a single elevated cortisol reading is not diagnostic of any adrenal condition. However, it is worth connecting to his symptoms. He reports low mood and anxiety, afternoon energy crashes, waking tired despite sleeping 8 or more hours, and stress that feels hard to manage some weeks. The waking-tired-with-afternoon-crash pattern, combined with stress some weeks, could reflect a shifted cortisol rhythm where cortisol is higher than it should be in the evening, keeping him wired, and fails to produce a strong enough morning surge, leaving him sluggish on waking. This is a functional pattern driven by lifestyle rather than a disease, and it improves with consistent wake times, morning light exposure, and stress management. If symptoms persist, his GP could arrange a repeat morning cortisol or a cortisol day curve to check the rhythm.\n\nHis testosterone at 17.6 is within the laboratory range of 8.4 to 28.7 but sits below the optimal threshold of 18. Free testosterone at 0.357 is within range, and bioavailable testosterone at 8.18 is within range. SHBG at 35.8, the protein that binds testosterone and determines how much is free and active, is within the optimal band of 25 to 55. At 32, a testosterone just below optimal is not clinically concerning on its own, but it is worth noting in the context of his goals around energy and mood, because testosterone contributes to both. The most likely explanation is the combination of no exercise, very low physical activity, poor diet quality, and possible disrupted sleep quality. Resistance training is the single most effective way to support testosterone naturally, and he does none at present.\n\nHis thyroid function shows TSH at 2.7, which is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. Free T4 at 15.2 is within range, and free T3 at 5.2 is within the optimal band. The FT3 to FT4 ratio at 0.342 confirms good conversion. Both thyroid antibodies are negative. A TSH of 2.7 at 32 is borderline and not diagnostic of anything, but it places him at the upper end of normal. In the context of fatigue and low mood, it is worth rechecking in 12 months to ensure it is not drifting upward. For now, the thyroid is functioning adequately.\n\nHis vitamin D at 67 is sufficient but below the optimal range of 75 to 120. He has recently started D3 with K2, which is exactly the right approach, but with fewer than 2,000 steps a day suggesting very little outdoor time, he will need to maintain supplementation consistently to reach and hold the optimal range. His B12 at 786 is excellent, well within the optimal band of 500 to 900, likely reflecting his recent supplementation. His folate at 8 is at the floor of the optimal range, which is expected given the near-absence of vegetables and fruit in his diet. Folate is found in green vegetables, beans and lentils, and at 0 to 1 portions a day, dietary intake is very low.\n\nHis magnesium at 0.80 is within the laboratory range of 0.53 to 1.11 but below the optimal band of 0.85 to 1.05. Magnesium is essential for heart rhythm, muscle function, sleep quality and over 300 enzymatic reactions in the body. His palpitations improving with magnesium glycinate supplementation is entirely consistent with a marginal magnesium level. He should continue supplementing. His sodium at 134 is at the very bottom of the laboratory range of 133 to 146 and below the optimal range. Calculated serum osmolality at 278.8 is just below the optimal band of 280 to 292, which may simply reflect hydration status at the time of the draw. It is not clinically significant on a single reading but worth noting.\n\nHis MCHC at 347 is marginally above the upper limit of 345. At this margin, this is almost always a laboratory artefact related to temperature and sample storage, as the lab note itself acknowledges. It is not a clinical concern.\n\nTurning to the urinalysis, urine red blood cells at 20 are within the laboratory threshold of below 25 as not significant. Urine protein shows a trace, which can occur with concentrated urine, exercise or even standing for long periods and is not significant as an isolated finding. The bacterial culture and sensitivities are pending and will be reviewed when they return.\n\nHis symptoms of low energy, fatigue, low mood, afternoon crashes and waking tired despite adequate sleep hours deserve a direct answer. The bloods have excluded several important causes: his thyroid is working, there is no anaemia, iron stores are healthy, B12 is excellent, there is no coeliac disease, there is no significant inflammation, liver and kidney function are excellent, and testosterone, while below optimal, is not low enough to explain these symptoms alone. What the bloods have found is early insulin resistance from a high-sugar, high-processed-food diet, which causes the exact afternoon crash pattern he describes: glucose spikes after meals followed by insulin-driven dips that produce fatigue, brain fog and irritability. The very low step count and absence of any exercise are also major contributors. Physical activity is one of the most effective interventions for both energy and mood, and at fewer than 2,000 steps with no training, his body is profoundly sedentary. The cortisol pattern may be contributing to the waking-tired feeling. And nicotine from vaping, while it provides short-term alertness, disrupts sleep architecture even when sleep duration seems adequate, which may explain why 8 or more hours of sleep is not producing refreshed mornings. These are all modifiable, and the plan below addresses each one.","links":"The central thread in this report connects diet quality to both of the main findings: the elevated LDL and ApoB, and the early insulin resistance shown by a HOMA-IR of 2.25. A convenience-based diet high in saturated fat, ultra-processed food and daily sugar, with almost no vegetables or fruit, drives both problems through different mechanisms. Saturated fat reduces LDL receptor expression on liver cells, so fewer LDL particles are cleared from the blood, and they accumulate. Meanwhile, daily sugar and refined carbohydrate cause repeated glucose and insulin spikes that, over time, reduce the sensitivity of muscle and fat cells to insulin, forcing the pancreas to produce more. At 32 with a BMI of 20, there is no excess body fat contributing, so diet composition is the dominant driver of both findings. The family history of early cardiovascular events and type 2 diabetes makes this combination more significant than the numbers alone would suggest.\n\nThe symptom picture, low energy with an afternoon crash, low mood, and waking tired despite long sleep, connects to the insulin resistance and to the sedentary lifestyle rather than to a single deficient marker. The afternoon crash is characteristic of reactive hypoglycaemia following insulin overshoot after high-sugar meals. The fatigue on waking despite 8 or more hours of sleep is harder to pin on a single blood result, but the elevated cortisol, if it reflects a shifted rhythm with cortisol remaining high in the evening, would impair sleep quality without reducing sleep quantity. Nicotine from vaping has the same effect: it fragments deep sleep and REM sleep while leaving total hours intact.\n\nThe positive findings are genuinely reassuring and narrow the field considerably. Normal inflammatory markers (CRP 0.8, ESR 8, NLR 1.21), negative autoimmune and coeliac screens, excellent kidney and liver function, healthy iron stores, strong B12 and adequate folate, a clean thyroid with negative antibodies, and an Lp(a) below the ideal threshold all mean the abnormalities in this report are lifestyle-driven and reversible. The Lp(a) result is particularly important because it confirms the LDL elevation is not compounded by an inherited particle, giving dietary and lifestyle change the full power to bring the lipid numbers down.\n\nThe magnesium sitting below optimal at 0.80, with palpitations that improved on supplementation, is a clean cause-and-effect connection. Serum magnesium is a poor reflection of total body stores because only about 1 percent of magnesium is in the blood, so a serum level below optimal often means intracellular stores are genuinely low. Continued supplementation is appropriate.\n\nThe loose end is the cortisol. A single elevated morning reading does not confirm an adrenal problem, and the most likely explanation is situational: stress, poor sleep quality, or the blood draw itself. But if the fatigue and mood symptoms do not improve with the lifestyle changes below, a repeat cortisol or a cortisol day curve would be the logical next step to rule out a more sustained elevation.","lifestyle":"Swap one takeaway or convenience meal a day for a home-cooked meal built around protein and vegetables. It does not need to be complicated: a chicken breast or salmon fillet with a bag of pre-washed salad, a tin of beans and some olive oil is a complete meal in ten minutes. Anchor: the meal you currently eat at home most often. Why: this single swap reduces the saturated fat driving your LDL of 4.15 and replaces it with the fibre and nutrients your diet is almost entirely missing.\nAdd at least two portions of vegetables or fruit to your day, starting today. A banana with breakfast, a handful of spinach in whatever you are eating, a tin of chickpeas added to a meal. Anchor: one portion with your first meal, one with your last. Why: soluble fibre from vegetables, beans and oats directly lowers LDL cholesterol by binding bile acids in the gut, and your current intake of 0 to 1 portions a day means you are getting almost none.\nCut sugary food and drink from daily to no more than twice a week. Swap sugary drinks for water, black coffee or tea. Anchor: when you reach for something sweet, have it only on two chosen days. Why: daily sugar is the primary driver of your fasting insulin of 9.94 and HOMA-IR of 2.25, and reducing it is the fastest way to reverse early insulin resistance and eliminate the afternoon crash.\nWalk for 20 minutes after your largest meal every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin spike from that meal, directly addressing your HOMA-IR of 2.25 and the afternoon energy crash you describe.\nBuild your daily steps from under 2,000 to at least 5,000 within two weeks, then aim for 7,500. Use a phone or watch to track. Anchor: the post-meal walk counts toward this. Why: very low step counts are independently associated with fatigue, low mood and poor sleep quality, all three of which you report.\nStart two resistance training sessions per week, even 20 minutes at home with bodyweight exercises: press-ups, squats, lunges, planks. Anchor: choose two fixed days and times. Why: resistance training is the most effective natural stimulus for testosterone, which at 17.6 is just below optimal, and is one of the strongest evidence-based interventions for both energy and mood.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking, even briefly. Anchor: alarm goes off, curtains open, step outside for two minutes. Why: morning light resets the cortisol rhythm, which may explain why you wake tired despite sleeping 8 or more hours, and a fixed wake time is the single most effective sleep-quality intervention.\nConsider reducing or stopping nicotine vaping, particularly in the four hours before bed. Why: nicotine fragments deep sleep and REM sleep even when total sleep hours look adequate, which could explain waking tired, and it constricts blood vessels, which alongside your LDL of 4.15 and family history of early cardiovascular events adds unnecessary vascular risk.","flags":"LDL 4.15 (limit 3.0), ApoB 0.97 (target below 0.9), total cholesterol 6.0, non-HDL cholesterol 4.4 (limit 4.0), Lp(a)-corrected LDL 4.07 (limit 3.0). These are all one story: elevated atherogenic lipoproteins driven by dietary saturated fat and ultra-processed food. Family history of heart attack or stroke before 60 makes this finding clinically significant at 32. HDL 1.6 and triglycerides 0.64 are both excellent, and Lp(a) below 25 confirms the elevation is entirely modifiable. ApoB/A1 ratio 0.61 is below the lower risk threshold. Cardiovascular Risk Score 50 out of 100, driven by LDL and ApoB.\nHOMA-IR 2.25 (optimal below 1.5, early insulin resistance threshold 1.9). Fasting insulin 9.94 mIU/L with fasting glucose 5.1 and HbA1c 37. The glucose and HbA1c are normal because the pancreas is compensating with higher insulin output. Early insulin resistance at BMI 20 is diet-driven (daily sugar, ultra-processed food, near-zero fibre). Family history of type 2 diabetes.\nCortisol 671 nmol/L (morning range 145.4 to 619.4). A single elevated morning cortisol is not diagnostic. Most likely situational (blood draw stress, disrupted sleep quality). If symptoms persist after lifestyle changes, recommend repeat morning cortisol or cortisol day curve.\nVitamin D 67 nmol/L (sufficient but below optimal 75 to 120). Recently started D3/K2 supplementation, which should bring this into the optimal range over 8 to 12 weeks at adequate dose.\nMagnesium 0.80 mmol/L (lab range but below optimal 0.85 to 1.05). Palpitations improved with magnesium glycinate supplementation, supporting marginal deficiency. Continue supplementation.\nTestosterone 17.6 nmol/L (lab range 8.4 to 28.7, below optimal 18). Not clinically low but below optimal at 32. Likely driven by sedentary lifestyle and poor diet. Resistance training is the primary intervention.\nTSH 2.7 mIU/L (lab range, above optimal 2.5). FT4 15.2, FT3 5.2, both antibodies negative. Not diagnostic, but worth rechecking in 12 months given fatigue symptoms.\nMCHC 347 (limit 345). Marginal, likely laboratory artefact related to sample temperature and storage. Not a clinical concern.\nReassuring negatives: kidney function excellent (Cystatin C eGFR 110), liver clean (FIB-4 0.56, APRI 0.237, GGT 24, ALT 29), no anaemia (Hb 150, ferritin 69), no inflammation (CRP 0.8, ESR 8), no thyroid autoimmunity (both antibodies negative), no coeliac disease (tTG negative), no immune deficiency (all immunoglobulins normal), IgE normal, rheumatoid factor negative, PSA 0.4, Lp(a) below 25, PhenoAge 27.5 (4.5 years younger than calendar age).","recommendations":"Discuss the lipid results with your GP, bringing the following numbers: LDL 4.15 (limit 3.0), ApoB 0.97 (target below 0.9), total cholesterol 6.0, non-HDL 4.4, alongside the family history of heart attack or stroke before 60. Lp(a) below 25 confirms these are modifiable with diet and lifestyle. Your GP can assess whether a QRISK3 cardiovascular risk score is appropriate and discuss whether dietary change alone is sufficient or whether early lipid-lowering therapy should be considered given the family history.\nMention the HOMA-IR of 2.25 and fasting insulin of 9.94 to your GP in the context of your family history of type 2 diabetes. Glucose and HbA1c are currently normal, but early insulin resistance at 32 warrants dietary intervention now and monitoring over time.\nIf fatigue, low mood and the tired-on-waking pattern persist after 8 to 12 weeks of the dietary and activity changes below, ask your GP for a repeat morning cortisol or a cortisol day curve to check whether the elevated cortisol of 671 reflects a sustained pattern or was situational.\nAsk your GP whether a baseline cardiovascular assessment (blood pressure, resting ECG) is appropriate given the family history and the palpitation history, even though the palpitations have improved with magnesium.\nRetest in 12 weeks with a fasting lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB), fasting glucose and insulin (to recalculate HOMA-IR), vitamin D, magnesium and TSH. These are the markers that will show whether the dietary changes are working. Aim for a calorie intake of approximately 2,100 to 2,300 kcal per day (maintenance for your height, weight and a target of light to moderate activity), with at least 87 to 107 grams of protein per day (1.3 to 1.6 grams per kilogram) to support the resistance training. You do not need to lose weight; the goal is to replace the composition of your calories, not reduce them.","supplementation":"Vitamin D3, cholecalciferol, 3,000 IU daily, taken with your largest meal that contains some fat. Continue the D3/K2 combination you have started. Your level at 67 is sufficient but below optimal (75 to 120), and with very low outdoor time at fewer than 2,000 steps, you will rely on supplementation to reach and hold the optimal range. Recheck in 12 weeks.\nVitamin K2, MK-7, 100 to 200 mcg daily, taken with the vitamin D. You are already taking this in combination with your D3. K2 directs calcium into bone and away from arteries, which matters alongside the lipid findings.\nMagnesium glycinate, 300 to 400 mg elemental magnesium, taken before bed. Continue what you have started. Your serum magnesium at 0.80 is below optimal (0.85 to 1.05), and the improvement in palpitations confirms your body was short. Glycinate is the right form for sleep quality and heart rhythm.\nVitamin B12, sublingual methylcobalamin, 1,000 mcg daily. Your B12 at 786 is excellent and likely reflects your recent supplementation. Continue to maintain this level given the very low vegetable and whole-food intake in your diet. Sublingual methylcobalamin is better absorbed than oral tablets.\nOmega-3 fish oil, 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports your LDL and ApoB reduction goal: omega-3 lowers triglycerides (yours are already excellent) but also has a mild LDL-lowering effect, reduces inflammation, and supports mood, which is relevant to your low mood and anxiety symptoms.\nFolate: rather than supplementing, increase dietary folate by eating more green vegetables, beans and lentils. Your folate at 8 is at the floor of optimal, and the reason is clear from your diet. If vegetable intake does not improve within 4 weeks, consider methylfolate 400 mcg daily.\nDo not take iron supplements. Your ferritin at 69 and transferrin saturation at 29 percent are healthy, and unnecessary iron supplementation when stores are adequate can cause oxidative damage.\nThe most important changes from this report are not supplements. They are replacing ultra-processed and sugary food with whole food built around protein, vegetables and fibre, and building physical activity from near zero to a sustainable routine that includes walking and resistance training. These changes will move the LDL, the insulin resistance, the testosterone, the energy and the mood more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 66 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 66.1. Weakest systems: lipids & cardiovascular 26%, glucose & insulin 61%, hormones 62%. Biggest drags: LDL Cholesterol, Cortisol (Morning), Apolipoprotein B, HOMA-IR.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3716","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4324","units":"years","description":"PhenoAge is a biological age estimate derived from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count). At 27.5 against a calendar age of 32, this means the body is ageing four and a half years more slowly than average. The main drivers of this favourable result are the low CRP of 0.8, healthy albumin, healthy creatinine and well-balanced blood counts. The dietary and activity changes recommended in this report should maintain or even improve this advantage.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c into a single score from 0 to 100 that measures the atherogenic risk being built right now, regardless of age. At 50, this is above the 40 threshold and well above the ideal of 20 or below. The score is driven by the elevated LDL and ApoB. At 32, the ten-year absolute risk of a cardiovascular event is still low, but the score reflects the rate at which risk is accumulating, and the gap between a low ten-year risk and a high score is the window for acting. The family history of early cardiovascular events reinforces the urgency of dietary change.","low_causes":"Healthy lipids, low inflammation, low HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the sugar circulating in the blood after an overnight fast. At 5.1, this sits within the optimal range of 4.0 to 5.4. On its own this looks healthy, but when combined with the fasting insulin level, it reveals the pancreas is working harder than it should to keep this number normal. The insulin resistance discussion below gives the full picture.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6133","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar over the previous two to three months. At 5.5 percent, this is within the normal range and below the pre-diabetes threshold of 6.0 percent. This confirms blood sugar control has been adequate over recent months.","low_causes":"Anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3849","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. At 37 mmol/mol, it is within the laboratory range and just above the optimal ceiling of 36. Given the daily sugar intake and ultra-processed food pattern, this is holding well, but the HOMA-IR finding below suggests the insulin system is working hard to maintain it.","low_causes":"Anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin (Fasting)","group":"GLUCOSE & INSULIN","result":"9.94","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4441","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3060","upper_optimal_position":"0.5751","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to maintain blood sugar after an overnight fast. At 9.94, this is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8.0. The pancreas is producing more insulin than it ideally should to keep glucose at 5.1, which is the hallmark of early insulin resistance. At a BMI of 20 with no excess body fat, this is driven by diet composition: daily sugar and ultra-processed food.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high sugar diet, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"563","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4443","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5486","units":"pmol/L","description":"C-peptide is a protein released in equal amounts to insulin by the pancreas. It confirms how much insulin the body is producing. At 563 pmol/L (converted from 1.7 ug/L), this is within the normal range and confirms the pancreas is functioning normally. It is producing insulin appropriately but at a higher level than ideal, consistent with the insulin resistance pattern.","low_causes":"Low carbohydrate diet, type 1 diabetes, fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR uses fasting glucose and fasting insulin to estimate how sensitive the body's cells are to insulin. At 2.25, this is above the upper limit of 1.5 and above the early insulin resistance threshold of 1.9. The ideal is below 1.0. This means the body's cells are not responding to insulin as efficiently as they should, so the pancreas compensates by producing more. At a BMI of 20, this is driven by diet quality rather than body fat. Daily sugar, ultra-processed food and very low fibre intake are the primary drivers, and this is fully reversible with dietary change.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting","high_causes":"Insulin resistance, high sugar diet, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4429","lower_norm optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and Cystatin C to give the most accurate estimate of kidney filtration rate. At 110, this is well above the optimal threshold of 90 and confirms excellent kidney function at 32.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"73.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5172","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between causes of abnormal kidney markers. At 73.1, this is within the optimal range, confirming a normal balance between protein metabolism and kidney clearance with no suggestion of dehydration or gastrointestinal bleeding.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3853","upper_optimal_position":"0.5747","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. At 74, this is within the optimal range, confirming adequate protein hich is a positive finding. It confirms no bile duct stress and no metabolic load from the current diet pattern that the liver cannot handle, at least for now.","low_causes":"Normal health","high_causes":"Alcohol, fatty liver disease, bile duct obstruction, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4261","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6136","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. At 97, this is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4929","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5879","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. At 43, this is within the optimal range. Together with normal amylase, it confirms the pancreas is working well.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4795","lower_normal
