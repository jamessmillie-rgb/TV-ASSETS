ood cells freshly released from the bone marrow. The reticulocyte percentage indicates how actively the bone marrow is producing new red cells. Shahir's percentage of 0.65% is within the laboratory range but below the optimal band. Given his healthy haemoglobin and adequate iron, B12, and folate, this suggests a slightly conservative but stable rate of red cell production.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression, chronic disease, aplastic anaemia","high_causes":"Haemolytic anaemia, blood loss with marrow compensation, response to anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"32.955","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of immature red blood cells in the blood per litre. Shahir's result of 32.955 is below the lower limit of 50. However, his haemoglobin is healthy at 149, his red cell count and haematocrit are normal, and his iron stores, B12, and folate are all adequate. This indicates that the bone marrow is maintaining adequate red cell mass but producing new cells at a slightly lower rate than the laboratory's reference population. This is worth monitoring on future tests but does not require intervention at this time.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression, chronic kidney disease, aplastic anaemia","high_causes":"Active blood loss compensation, haemolytic anaemia, response to EPO or iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR","group":"HEMATOLOGY","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is calculated by dividing neutrophils by lymphocytes. It is used as a marker of systemic inflammation and immune balance. A ratio within the optimal range of 1.0 to 2.0 indicates a healthy balance between the innate immune response (neutrophils) and the adaptive immune response (lymphocytes). Shahir's NLR of 1.56 is within the optimal range.","low_causes":"Not clinically significant at moderate levels","high_causes":"Systemic inflammation, infection, physiological stress, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"41.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5493","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5280","units":"%","description":"Transferrin saturation measures what proportion of the body's iron transport protein (transferrin) is carrying iron. It reflects how much iron is being actively transported in the blood. Shahir's result of 41.86% is within the laboratory range but slightly above the optimal upper threshold of 40%. This is a marginal finding and in the context of healthy ferritin and transferrin levels, it simply indicates good iron availability. It does not suggest iron overload.","low_causes":"Iron deficiency, chronic inflammation, chronic disease","high_causes":"Iron overload, haemochromatosis, excessive iron supplementation, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"30.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6399","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3455","upper_optimal_position":"0.5818","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It can fluctuate significantly throughout the day and in response to meals. Shahir's result of 30.8 umol/L is within the laboratory range but near the upper end and above the optimal threshold. This is a snapshot value and in the context of healthy ferritin and transferrin, it indicates good iron status without any suggestion of overload.","low_causes":"Iron deficiency, chronic disease, vegetarian diet, heavy exercise, blood loss","high_causes":"Haemochromatosis, excessive iron supplementation, recent high-iron meal, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream to the bone marrow and other tissues. The liver produces transferrin, and its level reflects both iron status and liver function. Shahir's transferrin of 2.93 g/L is within the optimal range, indicating healthy iron transport capacity and good liver synthetic function.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency (the body increases transferrin production to capture more iron), pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"68.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5849","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3521","upper_optimal_position":"0.6204","units":"umol/L","description":"Total iron binding capacity (TIBC) measures the maximum amount of iron that transferrin can carry. It indirectly reflects transferrin levels and iron status. Shahir's TIBC of 68.3 umol/L is within the optimal range, consistent with healthy iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"147","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5260","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. It reflects total body iron stores more reliably than serum iron, which fluctuates throughout the day. Shahir's ferritin of 147 ng/ml is within the optimal range of 50 to 200 for males, indicating well-stocked iron reserves. This is important for energy production, oxygen transport, and immune function, and is particularly relevant for someone training 8 times per week.","low_causes":"Iron deficiency, chronic blood loss, vegetarian diet, intense exercise, coeliac disease","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"301","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4344","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5781","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural daily rhythm, peaking in the morning and declining through the day. It plays essential roles in blood sugar regulation, immune function, and the stress response. Shahir's cortisol of 301 nmol/L is within the optimal range for a morning sample, indicating a healthy stress response and adrenal function.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction, overtraining","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, sleep deprivation, overtraining","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1814","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen. In men, small amounts are produced by the testes and through conversion of testosterone by the aromatase enzyme. Oestradiol plays important roles in bone health, brain function, and cardiovascular protection in men. Shahir's result of 53 pmol/L is within the optimal range, indicating a healthy oestrogen level that supports bone and cardiovascular health without being excessive.","low_causes":"Aromatase inhibitors, very low body fat, hypogonadism","high_causes":"Obesity (more aromatase activity in fat tissue), liver disease, testosterone replacement therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in the production of other hormones and has some effects on sleep and mood. Shahir's result of 1 nmol/L is within the male reference range and is unremarkable.","low_causes":"Not typically clinically significant in males","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4123","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.5769","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the testes to produce testosterone. In the context of elevated prolactin, LH can be suppressed because prolactin inhibits the release of GnRH from the hypothalamus, which in turn reduces LH secretion. Shahir's LH of 3.68 is within the laboratory range but sits in the lower half. This is consistent with the suppressive effect of his elevated prolactin on the hypothalamic-pituitary-gonadal axis.","low_causes":"Hyperprolactinaemia, pituitary dysfunction, anabolic steroid use, severe stress or illness","high_causes":"Primary hypogonadism (testicular failure), menopause (in women), Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"5.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4556","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5693","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and in men stimulates the production of sperm in the testes. Shahir's FSH of 5.37 is within the optimal range, indicating that sperm production signalling is functioning normally.","low_causes":"Pituitary dysfunction, anabolic steroid use, hyperprolactinaemia","high_causes":"Primary testicular failure, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"13.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4163","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, red blood cell production, libido, energy, and mood. Shahir's result of 13.5 nmol/L is within the laboratory range of 8.4 to 28.7 but well below the optimal zone of 18 to 30. At 47, some age-related decline is expected, but the magnitude of suppression here is very likely being driven by his dramatically elevated prolactin of 2001. Prolactin suppresses the brain's release of GnRH, which reduces LH production, which in turn reduces testosterone output from the testes. Once the prolactin issue is addressed, testosterone may recover significantly.","low_causes":"Ageing, hyperprolactinaemia, obesity, poor sleep, chronic stress, opioid use, pituitary dysfunction","high_causes":"Exogenous testosterone or anabolic steroid use, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"2001","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"375","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland at the base of the brain. In women it is best known for stimulating breast milk production, but in both sexes it plays roles in immune regulation and reproductive function. In men, prolactin normally circulates at low levels. Shahir's result of 2001 uIU/ml is more than five times the upper limit of 375, which is a significant elevation. At this magnitude, the most common cause is a prolactinoma, a small benign tumour of the pituitary gland that overproduces prolactin. These are almost always non-cancerous and respond well to medication. Elevated prolactin at this level suppresses the hypothalamic-pituitary-gonadal axis, reducing testosterone production. This is very likely contributing to Shahir's below-optimal testosterone of 13.5 and his difficulty building muscle and losing body fat. Urgent GP referral for pituitary MRI and endocrinology assessment is recommended.","low_causes":"Not typically clinically significant","high_causes":"Prolactinoma, medications (antipsychotics, metoclopramide), hypothyroidism, pituitary stalk compression, stress, macroprolactinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"28.36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3195","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3417","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) estimates the amount of biologically active testosterone by accounting for the binding effect of SHBG (sex hormone binding globulin). A higher FAI indicates more free testosterone available for use by tissues. Shahir's FAI of 28.36 is just below the lower limit of 30, meaning that the amount of testosterone available to his muscles, bones, and other tissues is below the expected range. His SHBG is within range at 47.6, so the low FAI is being driven by the low total testosterone, which in turn is most likely suppressed by his elevated prolactin.","low_causes":"Low testosterone, elevated SHBG, hyperprolactinaemia, ageing, obesity","high_causes":"High testosterone, low SHBG, PCOS (in women), anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1105.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3476","lower_normal":"162.1","upper_normal":"4940.9","lower_optimal":"800","upper_optimal":"3500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.5567","units":"ug/dL","description":"DHEA sulphate (DHEA-S) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is the most abundant circulating hormone and declines with age. Shahir's result of 3 umol/L (approximately 1,105.5 ug/dL) is within the optimal range, indicating healthy adrenal function and a good reserve of this important precursor hormone.","low_causes":"Ageing, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"47.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5386","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3492","upper_optimal_position":"0.6112","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to testosterone and oestradiol, regulating how much of these hormones is available for the body to use. Higher SHBG means less free hormone available. Shahir's SHBG of 47.6 nmol/L is within the optimal range of 25 to 55. This means his SHBG is not the reason for his low Free Androgen Index. Rather, his total testosterone is simply too low to generate a healthy FAI even at a reasonable SHBG level.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy, low testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.218","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4297","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3890","upper_optimal_position":"0.5531","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to proteins and therefore immediately available for use by tissues. Shahir's calculated free testosterone of 0.218 nmol/L is within the laboratory range but below the optimal band of 0.3 to 0.8. This is consistent with his below-optimal total testosterone and is very likely being driven by the suppressive effect of his elevated prolactin. Free testosterone is the fraction most directly responsible for muscle building, fat metabolism, energy, and libido.","low_causes":"Low total testosterone, elevated SHBG, hyperprolactinaemia, ageing","high_causes":"Anabolic steroid use, low SHBG, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3942","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4790","units":"mIU/L","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland and controls thyroid hormone production. It works on a feedback loop: when thyroid hormones fall, TSH rises to stimulate more production, and vice versa. Shahir's TSH of 1.32 mIU/L is within the optimal range of 1.0 to 2.5, indicating that the pituitary is satisfied with his thyroid hormone levels and is not having to push the thyroid hard. This is an excellent result.","low_causes":"Hyperthyroidism (Graves' disease), excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5152","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone, produced by the thyroid gland and converted into the active form (T3) in peripheral tissues. Shahir's FT4 of 16.9 pmol/L is within the optimal range of 14 to 20, indicating healthy thyroid hormone production.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4370","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6000","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy production, and heat generation in every cell. It is produced primarily by conversion from T4 in peripheral tissues. Shahir's FT3 of 4.0 pmol/L is within the laboratory range but below the optimal band of 4.5 to 6.5. This suggests that conversion from T4 to T3 is not as efficient as it could be. Selenium and zinc are important cofactors for the enzyme that converts T4 to T3, and optimising these nutrients may help improve conversion. Suboptimal T3 can contribute to lower energy levels and a slower metabolic rate, both of which are relevant to Shahir's goals of fat loss and muscle building.","low_causes":"Poor T4-to-T3 conversion, selenium or zinc deficiency, calorie restriction, illness, stress, medications","high_causes":"Hyperthyroidism, T3-predominant thyrotoxicosis, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Elevated levels are associated with autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Shahir's result of less than 6.6 U/ml is well within the normal range of below 13.8, ruling out autoimmune thyroid disease.","low_causes":"Not applicable; absence of antibodies is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce thyroid hormones. Elevated levels can indicate autoimmune thyroid disease. Shahir's result of less than 1.3 U/ml is well within the normal range, consistent with no autoimmune thyroid process.","low_causes":"Not applicable; absence is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4042","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6786","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin in response to sunlight and obtained from a small number of dietary sources. Shahir's result of 97 nmol/L is within the optimal range of 75 to 120, which is an excellent level. This should be maintained with ongoing supplementation of 2,000 IU daily through the winter months when UVB exposure is insufficient.","low_causes":"Insufficient sun exposure, dark skin pigmentation, obesity, malabsorption, low dietary intake, northern latitude","high_causes":"Excessive supplementation, granulomatous diseases (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.774","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2606","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3481","upper_optimal_position":"0.5013","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the four small parathyroid glands located behind the thyroid. Its primary role is to regulate blood calcium levels. When calcium falls, PTH rises to increase calcium absorption from the gut, release calcium from bones, and reduce calcium excretion by the kidneys. Shahir's PTH of 0.774 pmol/L is marginally below the lower limit of 0.98. However, his corrected calcium is healthy at 2.48 and his vitamin D is excellent at 97 nmol/L. Good vitamin D enhances calcium absorption from the gut, which maintains healthy blood calcium without the parathyroid glands needing to work hard. This is the most likely explanation for the marginally low PTH, and it represents a physiologically appropriate response rather than a pathological one.","low_causes":"Adequate calcium and vitamin D (physiological suppression), hypoparathyroidism, previous thyroid surgery, magnesium deficiency","high_causes":"Vitamin D deficiency, calcium deficiency, chronic kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"481","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4550","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6234","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is found primarily in animal foods. Shahir's B12 of 481 pg/ml is within the laboratory range but just below the optimal threshold of 500. Supplementing with sublingual methylcobalamin at 1,000 mcg daily would bring this comfortably into the optimal zone and support energy production and nervous system health.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, metformin use, low stomach acid","high_causes":"Supplementation, liver disease, kidney disease, some blood cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, cell division, and red blood cell formation. It works closely with B12. Shahir's folate of 13 ng/ml is within the optimal range of above 8, indicating good dietary intake from green leafy vegetables, legumes, and fortified foods.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, pregnancy, methotrexate or antic const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible

function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';

  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
