ly reflects a pancreas that does not need to produce much insulin because the body is using it very efficiently. This is a positive finding, not a sign of pancreatic insufficiency.\n\nHis absolute reticulocyte count is 32.955 against a lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A low absolute count with a normal percentage (0.65%, within the 0.5 to 2.5 range) and completely healthy haemoglobin, red cell count, and haematocrit suggests the bone marrow is producing red cells at a steady but slightly conservative rate. Given that his iron stores, B12, and folate are all adequate, this is not a nutritional deficiency. It may simply reflect individual variation or a mildly lower rate of red cell turnover. It is worth noting but not acting upon unless haemoglobin starts to trend downward on future tests.\n\nHis parathyroid hormone, or PTH, is 0.774 pmol/L, just below the lower limit of 0.98. PTH is released by the four small parathyroid glands behind the thyroid in response to falling blood calcium levels. When calcium is adequate or high, PTH is suppressed. Shahir's corrected calcium is 2.48, comfortably within the range of 2.2 to 2.6, and his vitamin D is 97 nmol/L, which is excellent and within the optimal band of 75 to 120. Good vitamin D status enhances calcium absorption from the gut, which keeps blood calcium healthy, which in turn means the parathyroid glands do not need to work hard. This is the most likely explanation for the marginally suppressed PTH, and it is actually a reassuring pattern rather than a concerning one. His magnesium at 0.86 is within the optimal range of 0.85 to 1.05, which is relevant because magnesium is required for PTH secretion and action.\n\nHis IgM is 0.4 g/L, just below the lower limit of 0.5. IgM is the first antibody the immune system produces in response to a new infection. A mildly low isolated IgM with normal IgG and IgA is a common incidental finding and is rarely clinically significant. It does not indicate immunodeficiency in the context of an otherwise healthy immune panel. It is worth mentioning to the GP for documentation, but it does not require any action in isolation.\n\nHis ESR, the erythrocyte sedimentation rate, is 12 mm/hour, sitting right at the upper limit of 12. ESR is a non-specific marker of inflammation. At this level it is borderline and not clinically significant, particularly given that his hs-CRP, which is a more sensitive and specific marker of systemic inflammation, is 1.8 mg/L. This CRP is within the laboratory range of below 5 but above the optimal threshold of 1.0. A CRP between 1 and 3 is considered average cardiovascular risk. In the context of his joint pain and stiffness, and his training load of 8 sessions per week, some background inflammation is expected. Reducing this toward below 1.0 through omega-3 supplementation, anti-inflammatory dietary strategies, and adequate recovery between sessions would be beneficial.\n\nHis vitamin D at 97 nmol/L is in excellent shape and sits within the optimal range of 75 to 120. His B12 at 481 pg/ml is within the laboratory range but below the optimal threshold of 500. Folate at 13 ng/ml is healthy and above the optimal threshold of 8. His vitamin D level is a credit to either supplementation or good sun exposure and should be maintained.\n\nThe urine sample showed a trace of protein, which at this level is not clinically significant and can result from exercise, dehydration, or normal variation. All other urinary markers are clean, with no glucose, no ketones, no significant white cells or red cells, and no nitrites. The culture returned a mixed growth reported as probable contamination by the laboratory.\n\nHis progesterone at 1 nmol/L is within the male reference range of 0.89 to 3.88 and is unremarkable. His creatine kinase at 225 is within range for a man training 8 times per week and simply reflects normal muscle turnover from his resistance sessions.","links":"The most urgent action from this report is a GP appointment to discuss the prolactin result of 2001 uIU/ml, which is more than five times the upper limit of the reference range. Shahir should bring this report and ask the GP to arrange an urgent pituitary MRI and referral to endocrinology. It would be worth mentioning to the GP that his testosterone is below optimal at 13.5 and his Free Androgen Index is below range at 28.36, as these are very likely being suppressed by the elevated prolactin. The GP should also be made aware of the Lp(a) result of 176.95 nmol/L, which is an inherited and permanent cardiovascular risk factor, alongside his ApoB of 1.15 and LDL of 4.62. A formal cardiovascular risk assessment would be appropriate, and this is a conversation about whether statin therapy is warranted given the combination of modifiable lipid elevation and non-modifiable Lp(a) risk. The GP should also be asked to record the Lp(a) permanently in Shahir's medical notes and to recommend Lp(a) testing for his first-degree relatives.\n\nFor body composition, at 87 kg, 183 cm, training 8 times per week with moderate daily steps, Shahir's estimated maintenance calories sit around 2,700 to 2,900 kcal per day. To lose body fat at a sustainable rate of around 0.5 kg per week while preserving muscle, a daily intake of 2,200 to 2,400 kcal would be appropriate. His protein intake should be at least 140 to 160 grams per day, which at approximately 1.6 to 1.8 g per kg of bodyweight supports muscle protein synthesis during resistance training while in a calorie deficit. Given that his insulin sensitivity is excellent and his glucose metabolism is in great shape, the calorie deficit is the primary driver here rather than any particular macronutrient manipulation.\n\nFor his lipid profile, alongside the GP conversation about medication, dietary strategies that can reduce ApoB and LDL include increasing soluble fibre intake to at least 10 to 15 grams per day from sources like oats, barley, lentils, chickpeas, beans, flaxseed, and psyllium husk. Oily fish twice per week, such as salmon, mackerel, sardines, or trout, provides EPA and DHA that lower triglycerides (already excellent), raise HDL, and reduce inflammation. Reducing saturated fat intake by swapping butter for olive oil, reducing red meat frequency to two to three times per week, and limiting full-fat dairy can lower LDL by 5 to 15%. Plant sterols and stanols, available in fortified spreads or supplements at 2 grams per day, can provide an additional 7 to 10% LDL reduction.\n\nFor his joint pain and stiffness, his uric acid is normal, ruling out gout. At 47, training 8 times per week, some mechanical load on joints is expected. Omega-3 supplementation has an anti-inflammatory effect that can benefit joint symptoms. Ensuring adequate warm-ups, incorporating mobility work, and periodically deloading training intensity would be sensible. Collagen peptide supplementation at 10 to 15 grams per day taken 30 to 60 minutes before training with vitamin C has emerging evidence for supporting connective tissue health.\n\nFor his bloating and digestive discomfort, his coeliac screen is negative, which rules out coeliac disease as a contributor. His pancreatic enzymes are normal. Common causes at this point include food intolerances, insufficient chewing, eating speed, or gut microbiome imbalances. A food diary over two to three weeks, noting symptoms against specific meals, may help identify triggers. Fermented foods such as kefir, sauerkraut, kimchi, and natural yoghurt support gut microbial diversity.\n\nFor his vitamin B12 at 481, this is adequate but below the optimal threshold of 500. Sublingual methylcobalamin at 1,000 mcg daily would bring this comfortably into the optimal range. His vitamin D at 97 should be maintained with ongoing supplementation at 2,000 IU daily through the winter months and can be reduced during summer if he has regular sun exposure.\n\nFor sleep and recovery, given 8 training sessions per week, recovery is as important as the training itself. A fixed wake time, exposure to natural light within an hour of waking, a caffeine cut-off by early afternoon, and a cool, dark bedroom all support deep sleep quality. Magnesium glycinate before bed can support both sleep quality and muscle recovery.\n\nRetesting should be performed in 12 to 16 weeks and should include prolactin (to assess response to any treatment initiated), testosterone, Free Androgen Index, a full lipid panel including ApoB, hs-CRP, B12, and a full blood count including reticulocytes. Lp(a) does not need to be retested as it is genetically fixed.","flags":"URGENT: Prolactin 2001 uIU/ml (upper limit 375). More than five-fold elevation. Differential includes prolactinoma (most likely at this magnitude), medication effect (no medications reported), and macroprolactinaemia. Recommend urgent pituitary MRI and endocrinology referral. This level is likely suppressing the gonadal axis, as evidenced by below-optimal testosterone (13.5 nmol/L) and below-range Free Androgen Index (28.36, lower limit 30).\n\nCARDIOVASCULAR: Lp(a) 176.95 nmol/L (upper limit 32). Genetically inherited, non-modifiable. Moderate to high risk category. Should be permanently recorded. First-degree relatives should be tested. LDL 4.62 mmol/L (upper limit 3.0). ApoB 1.15 g/L (target below 0.9, borderline high). ApoB/A1 ratio 0.78 (target below 0.7, average risk). Non-HDL cholesterol 4.9 mmol/L (target below 4). Total cholesterol 6.4 mmol/L. Part of the LDL elevation is attributable to Lp(a) particles. Formal cardiovascular risk assessment recommended. Discussion regarding lipid-lowering therapy warranted given the combination of elevated ApoB and high Lp(a).\n\nHORMONES: Testosterone 13.5 nmol/L (range 8.4 to 28.7, optimal 18 to 30). Below optimal but likely secondary to hyperprolactinaemia. Free Androgen Index 28.36 (lower limit 30). Likely driven by elevated prolactin rather than primary hypogonadism. Reassess after prolactin is treated.\n\nIMMUNE: IgM 0.4 g/L (lower limit 0.5). Isolated mild IgM reduction with normal IgG and IgA. Likely incidental. No action required unless recurrent infections develop.\n\nHAEMATOLOGY: Absolute reticulocyte count 32.955 (lower limit 50). Reticulocyte percentage within range (0.65%). Haemoglobin, red cell count, and indices all normal. Iron, B12, and folate adequate. Monitor on repeat testing.\n\nKIDNEY: Urea 10.2 mmol/L (upper limit 8.2). Likely driven by high dietary protein intake. Creatinine 85, Cystatin C eGFR 93, creatinine eGFR >90. No evidence of renal impairment.\n\nENDOCRINE: PTH 0.774 pmol/L (lower limit 0.98). Marginally suppressed in the context of adequate calcium (2.48 mmol/L) and excellent vitamin D (97 nmol/L). Physiologically appropriate suppression rather than pathological.\n\nGLUCOSE: C-Peptide 0.881 ug/L (lower limit 1.1). Reflects low insulin demand in an insulin-sensitive individual. Fasting glucose 4.4, HbA1c 39, HOMA-IR 0.95. Not indicative of pancreatic insufficiency.\n\nINFLAMMATION: hs-CRP 1.8 mg/L. Within laboratory range but above optimal threshold of 1.0. ESR 12 at upper limit of 12. Mild background inflammation consistent with high training load and reported joint symptoms.\n\nReassuring negatives: Fasting glucose, HbA1c, and HOMA-IR all optimal, ruling out insulin resistance and pre-diabetes. Liver panel entirely clean with FIB-4 1.17. Kidney function confirmed healthy by Cystatin C eGFR 93. Thyroid function normal with negative antibodies. PSA 0.47 with excellent free ratio, ruling out prostate concern. CA 19-9 and CEA undetectable. Coeliac screen negative. Rheumatoid factor low. Uric acid within optimal range, ruling out gout.","recommendations":"1. Book an urgent GP appointment to discuss the prolactin result of 2001 uIU/ml. Request pituitary MRI and endocrinology referral. Bring this report.\n\n2. Ask the GP to record the Lp(a) result of 176.95 nmol/L permanently in medical notes and to arrange formal cardiovascular risk assessment given the combination of elevated ApoB (1.15) and high Lp(a).\n\n3. Recommend Lp(a) testing for first-degree relatives (siblings, children, parents).\n\n4. Begin omega-3 fish oil supplementation at 2 to 3 grams of combined EPA and DHA daily to support cardiovascular health and reduce inflammation.\n\n5. Increase soluble fibre intake to 10 to 15 grams per day from oats, lentils, beans, flaxseed, and psyllium husk to support LDL reduction.\n\n6. Reduce saturated fat intake by using olive oil in place of butter, limiting red meat to two to three times per week, and reducing full-fat dairy.\n\n7. Eat oily fish at least twice per week.\n\n8. Consider plant sterol supplementation at 2 grams per day for additional LDL reduction.\n\n9. Maintain vitamin D supplementation at 2,000 IU daily through winter to keep levels in the 75 to 120 optimal range.\n\n10. Begin sublingual methylcobalamin B12 at 1,000 mcg daily to bring B12 above the optimal threshold of 500.\n\n11. Consider magnesium glycinate 300 to 400 mg before bed for sleep quality, muscle recovery, and to support the optimal magnesium level.\n\n12. Consider collagen peptides 10 to 15 grams daily with vitamin C before training to support joint and connective tissue health.\n\n13. Target a calorie intake of 2,200 to 2,400 kcal per day with at least 140 to 160 grams of protein to support fat loss while preserving muscle.\n\n14. Keep a food diary for two to three weeks to identify potential triggers for bloating and digestive discomfort. Include fermented foods for gut health.\n\n15. Incorporate mobility work and periodic training deloads to manage joint stiffness alongside the high training volume.\n\n16. Retest in 12 to 16 weeks: prolactin, testosterone, Free Androgen Index, full lipid panel with ApoB, hs-CRP, B12, full blood count with reticulocytes.","supplementation":"Omega-3 Fish Oil: 2 to 3 grams of combined EPA and DHA per day, taken with a meal containing fat. This supports cardiovascular health by helping to manage LDL particle number and inflammation. Given Shahir's elevated ApoB of 1.15 and hs-CRP of 1.8, omega-3 addresses both lipid and inflammatory pathways simultaneously. It also has a modest benefit for joint stiffness and pain.\n\nVitamin D3 (cholecalciferol): 2,000 IU daily, taken with a fat-containing meal. Shahir's current level of 97 nmol/L is excellent and sits within the optimal range of 75 to 120. This dose is a maintenance dose to sustain this level through the winter months when UVB exposure in the UK is insufficient for skin synthesis. During summer with regular sun exposure, supplementation can be reduced or paused.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. Vitamin K2 directs calcium into bones and teeth and away from soft tissues and arteries. It works synergistically with vitamin D and is recommended whenever vitamin D is supplemented long-term.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Shahir's B12 at 481 pg/ml is adequate but sits just below the optimal threshold of 500. Sublingual methylcobalamin is the preferred form because it bypasses gut absorption and delivers the active, methylated form of the vitamin directly. This supports energy metabolism, red blood cell production, and neurological function.\n\nMagnesium Glycinate: 300 to 400 mg elemental magnesium before bed. Shahir's magnesium at 0.86 is at the lower end of the optimal range of 0.85 to 1.05. Magnesium glycinate is the best-tolerated form for sleep support, does not cause the digestive upset associated with magnesium oxide or citrate at higher doses, and supports muscle recovery given his 8 weekly training sessions. The glycinate form also has a mild calming effect that supports sleep onset.\n\nCollagen Peptides: 10 to 15 grams daily, taken 30 to 60 minutes before training with a source of vitamin C such as a small glass of orange juice. Emerging evidence suggests that collagen peptides taken before exercise increase collagen synthesis in tendons, ligaments, and joint cartilage. Given Shahir's joint pain and stiffness alongside a high training volume, this is a practical and well-tolerated addition.\n\nPlant Sterols or Stanols: 2 grams per day, either from fortified spreads or a standalone supplement taken with meals. Plant sterols block cholesterol absorption in the gut and can reduce LDL cholesterol by 7 to 10%. Given the elevated LDL and ApoB, every modifiable reduction helps, particularly because a portion of Shahir's cardiovascular risk comes from his non-modifiable Lp(a).\n\nThe most important actions from this report are not supplements. They are getting the prolactin result investigated by a GP and endocrinologist, having a formal cardiovascular risk assessment in the context of his Lp(a) and ApoB results, and managing his calorie intake to support the body composition goals he is working toward.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5893","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. It reflects how well the body manages its primary fuel source. Shahir's result of 4.4 mmol/L sits comfortably within the optimal range of 4.0 to 5.4, indicating that his body is clearing glucose from the bloodstream efficiently. Combined with his excellent insulin and HOMA-IR results, this confirms strong metabolic health.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, excessive alcohol","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, infection, medications such as corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6183","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for approximately 120 days, this provides a picture of average blood sugar control over the preceding two to three months. Shahir's result of 5.8% is within the normal range of below 6.0% and is not in the pre-diabetes zone. This is consistent with his healthy fasting glucose and confirms good long-term glucose management.","low_causes":"Haemolytic anaemia, recent blood loss, chronic kidney disease","high_causes":"Pre-diabetes, type 2 diabetes, sustained high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. Shahir's result of 39 mmol/mol is within the normal range, below the 42 threshold that defines pre-diabetes. This is a reassuring result confirming stable blood sugar control over recent months.","low_causes":"Haemolytic anaemia, recent blood loss, chronic kidney disease","high_causes":"Pre-diabetes, type 2 diabetes, sustained high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3679","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4483","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Lower levels indicate that the body is responsive to insulin and does not need much to do the job. Shahir's result of 4.85 mIU/L is within both the laboratory and optimal ranges, confirming excellent insulin sensitivity. His body is managing blood sugar with minimal hormonal effort, which is a strong protective factor against metabolic disease.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, PCOS, excess carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"291.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1330","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5280","units":"pmol/L","description":"C-Peptide is a protein fragment released by the pancreas in equal amounts to insulin. It provides a direct measure of pancreatic insulin production. Shahir's result of 291.6 pmol/L (converted from 0.881 ug/L) is below the laboratory lower limit of 364.1 pmol/L. However, in the context of his perfectly healthy fasting glucose of 4.4, HbA1c of 39, and excellent HOMA-IR of 0.95, this low C-Peptide simply reflects a pancreas that does not need to produce much insulin because the body is using it very efficiently. This is a sign of good insulin sensitivity rather than pancreatic failure.","low_causes":"High insulin sensitivity with low insulin demand, fasting, type 1 diabetes, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, which stands for Homeostatic Model Assessment of Insulin Resistance, is a calculated index that estimates how resistant the body's cells are to the effects of insulin. A score below 1.0 indicates optimal insulin sensitivity. Shahir's result of 0.95 places him firmly in the insulin-sensitive category, meaning his cells respond efficiently to insulin and his pancreas does not need to overwork. This is one of the strongest metabolic findings in this report and is an excellent foundation for his goals of fat loss and long-term health.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, regular exercise, lean body composition","high_causes":"Insulin resistance, excess body fat particularly visceral, sedentary lifestyle, high refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"107.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5648","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, which are the cells responsible for producing insulin. It is calculated from fasting insulin and glucose levels. Shahir's result of 107.8 is within the reference range of 80 to 200, indicating that his pancreas has adequate functional reserve and is producing an appropriate amount of insulin for his metabolic needs.","low_causes":"Beta cell exhaustion from prolonged insulin resistance, type 1 diabetes, late-stage type 2 diabetes, pancreatitis","high_causes":"Early insulin resistance where the pancreas compensates by overproducing insulin, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined level of albumin and globulin in the blood. These proteins perform essential functions including transporting hormones and nutrients, maintaining fluid balance, and supporting immune function. Shahir's result of 71 g/L is well within range and reflects good nutritional status and liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease with protein loss, malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance by keeping water inside blood vessels and transports hormones, medications, and nutrients. Shahir's result of 42 g/L is within the optimal range and is a positive marker of both liver synthetic function and nutritional status.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6222","units":"g/L","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies) and transport proteins. It is calculated by subtracting albumin from total protein. Shahir's result of 29 g/L is within range, indicating a healthy balance of immune and transport proteins.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune conditions, liver cirrhosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between these two protein groups. Shahir's ratio of 1.45 is within the optimal range, reflecting healthy liver function and no signs of chronic inflammation or immune system overactivation.","low_causes":"Liver disease, autoimmune conditions, chronic infection, kidney disease","high_causes":"Immune deficiency conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3857","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and digestive system. Elevated levels can indicate bile duct obstruction, bone disease, or liver inflammation. Shahir's result of 57 IU/L is within the optimal range, indicating no signs of biliary or bone pathology.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes bilirubin and excretes it in bile. Elevated levels can indicate liver dysfunction, bile duct blockage, or excessive red blood cell destruction. Shahir's result of 16 umol/L is within range and consistent with healthy liver function.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2321","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Shahir's result of 26 IU/L is within the optimal range for a male (below 30), indicating that his liver cells are healthy and under no significant stress. This is a strong positive finding.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, hepatitis, alcohol excess, medications, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT, as muscle damage from exercise can also raise it. Shahir's result of 27 IU/L is within range and is not elevated despite his high training volume of 8 sessions per week, which is a good sign.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle injury, intense exercise, hepatitis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4034","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the risk of liver fibrosis (scarring) using age, platelet count, AST, and ALT. A score below 1.3 (or below 2.0 in those over 65) suggests a low risk of significant fibrosis. Shahir's score of 1.17 is within the low-risk zone, confirming that there are no signs of liver scarring.","low_causes":"Not clinically significant, reflects healthy liver","high_causes":"Liver fibrosis, cirrhosis, chronic hepatitis, fatty liver disease, low platelet count, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1986","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"Gamma GT (gamma-glutamyltransferase) is a liver enzyme that is particularly sensitive to alcohol, bile duct problems, and metabolic stress on the liver. It is often the first liver enzyme to rise in response to liver strain. Shahir's result of 29 IU/L is within the laboratory range of 4 to 73 for males but sits slightly above the optimal threshold of 25. This is not a concern but suggests a mild degree of metabolic or oxidative load on the liver. This can be influenced by body composition, diet, and alcohol intake.","low_causes":"Not clinically significant","high_causes":"Alcohol consumption, bile duct obstruction, fatty liver disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5455","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch into simpler sugars. Elevated levels can indicate pancreatitis or other pancreatic pathology. Shahir's result of 102 IU/L is within range, suggesting healthy pancreatic function.","low_causes":"Chronic pancreatitis with pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic duct obstruction, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4474","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down fats. It is a more specific marker of pancreatic health than amylase. Shahir's result of 34 U/L is within range, confirming that his pancreas is functioning well and digesting fats efficiently.","low_causes":"Chronic pancreatic insufficiency","high_causes":"Acute pancreatitis, gallstones, peptic ulcer disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6184","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL fractions. While total cholesterol provides a broad overview, the individual components, particularly LDL and HDL, are more meaningful for assessing cardiovascular risk. Shahir's result of 6.4 mmol/L is above the desirable threshold of 5.18, driven primarily by his elevated LDL and his genetically high Lp(a).","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Genetic factors, high saturated fat diet, hypothyroidism, obesity, familial hypercholesterolaemia, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily from dietary sources and liver production. Elevated triglycerides are associated with insulin resistance, metabolic syndrome, and cardiovascular risk. Shahir's result of 0.73 mmol/L is well within the optimal range of below 1.0, which is an excellent finding and consistent with his strong insulin sensitivity. Low triglycerides alongside good HDL is a very favourable metabolic pattern.","low_causes":"Low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"Insulin resistance, excess carbohydrate or alcohol intake, obesity, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2115","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol is produced by the liver and carries triglycerides through the bloodstream. It is converted to LDL as it delivers its triglyceride payload. Shahir's VLDL of 0.33 mmol/L is well within range, consistent with his excellent triglyceride level and healthy metabolic profile.","low_causes":"Not clinically significant","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, excess carbohydrate or alcohol intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because it carries excess cholesterol away from artery walls back to the liver for disposal. Higher levels are protective against cardiovascular disease. Shahir's HDL of 1.5 mmol/L is within the laboratory range and just below the optimal threshold of 1.55 for males. This is a reasonable level, and it can be improved further through regular aerobic exercise, omega-3 intake, and moderate alcohol reduction if applicable.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high refined carbohydrate diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, high omega-3 diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7700","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol is the primary carrier of cholesterol into artery walls, where it can accumulate and form plaques that narrow the arteries over time. Shahir's LDL of 4.62 mmol/L is significantly above the upper limit of 3.0 and well above the optimal target of below 2.6. However, part of this elevation is being driven by his genetically high Lp(a), which is measured within the LDL fraction. The modifiable portion of LDL can be addressed through dietary changes including increased soluble fibre, reduced saturated fat, and omega-3 supplementation. Given the combination with his high Lp(a), a conversation with his GP about lipid-lowering therapy is warranted.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, very low fat diet","high_causes":"Genetic factors, high saturated fat diet, hypothyroidism, obesity, familial hypercholesterolaemia, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4744","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a quick assessment of cardiovascular risk by comparing total cholesterol to the protective HDL fraction. A lower ratio indicates a better balance. Shahir's ratio of 4.27 is within the laboratory range of below 4.5 but above the optimal threshold of below 4.0, reflecting his elevated total cholesterol driven largely by LDL and Lp(a).","low_causes":"High HDL, low total cholesterol","high_causes":"High LDL or total cholesterol, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"23.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5860","lower_normal":"20","upper_normal":"100","lower_optimal":"20","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"This marker shows what percentage of total cholesterol is made up of the protective HDL fraction. A higher percentage is better, with above 20% being desirable. Shahir's result of 23.44% is above the 20% threshold, indicating that a reasonable proportion of his total cholesterol is the protective HDL type.","low_causes":"Low HDL, high total cholesterol, metabolic syndrome","high_causes":"High HDL, regular exercise, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol fractions in a single number, including LDL, VLDL, and Lp(a). Shahir's result of 4.9 mmol/L is above the target of below 4.0, driven by his elevated LDL and high Lp(a). This is one of the key metrics to monitor as he implements dietary changes and discusses lipid-lowering therapy with his GP.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"High LDL, elevated triglycerides, elevated Lp(a), genetic factors, high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6125","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main protein component of HDL particles. It is responsible for the protective function of HDL, enabling it to pick up excess cholesterol from artery walls and transport it back to the liver. Shahir's result of 1.47 g/L is above the desirable threshold of 1.20 and within the optimal range, indicating good HDL function.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the single protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this test effectively counts the total number of particles that can deposit cholesterol into artery walls. Many cardiologists now consider ApoB the single best predictor of cardiovascular risk. Shahir's result of 1.15 g/L is above the desirable target of below 0.9 and above the optimal target of below 0.8, placing him in the borderline high category. Part of this is driven by his genetically elevated Lp(a), but the modifiable portion warrants dietary intervention and a GP discussion about lipid-lowering medication.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL particle number, elevated Lp(a), genetic factors, high saturated fat diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5571","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). It provides a single metric that captures the balance between cardiovascular risk and protection. A ratio below 0.7 is considered lower risk for males. Shahir's ratio of 0.78 sits in the average risk band of 0.7 to 0.9. This reflects his elevated LDL and Lp(a) particles relative to his protective HDL particles.","low_causes":"High HDL, low LDL, regular exercise","high_causes":"High LDL, high Lp(a), low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"176.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that is set at birth and cannot be meaningfully changed by diet, exercise, or any currently available supplement. It is inherited from one or both parents. Shahir's Lp(a) is 176.95 nmol/L, which is significantly above the normal threshold of 32 nmol/L, placing him in the moderate to high risk category. Lp(a) drives cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clot formation by inhibiting the body's natural clot-dissolving system, and it drives local inflammation at sites of arterial damage. Because Lp(a) is measured within the LDL fraction, part of Shahir's elevated LDL is attributable to Lp(a) particles. This result should be permanently recorded in his medical notes and will never need to be retested. His first-degree relatives should also be tested, as approximately half will carry the same elevated level.","low_causes":"Genetic factors","high_causes":"Genetic inheritance (non-modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1633","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful surrogate marker for insulin resistance and metabolic health. A lower ratio indicates better metabolic function. Shahir's ratio of 0.49 is well within the optimal range of below 0.87, confirming excellent metabolic health and insulin sensitivity. This is one of the strongest positive findings in the lipid panel.","low_causes":"Excellent metabolic health, high insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, excess alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1750","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Shahir's remnant cholesterol of 0.28 mmol/L is well within the optimal range of below 0.5, which is consistent with his excellent triglyceride level and healthy metabolic profile.","low_causes":"Good metabolic health, low triglycerides","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1800","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver. It is used both as a general inflammation marker and as a cardiovascular risk indicator. Levels below 1.0 mg/L are considered low cardiovascular risk, 1.0 to 3.0 is average risk, and above 3.0 is higher risk. Shahir's result of 1.8 mg/L places him in the average risk category. In the context of his joint pain and stiffness and his high training volume of 8 sessions per week, some background inflammation is expected. Reducing this toward below 1.0 through omega-3 supplementation, adequate recovery, and anti-inflammatory dietary strategies would be beneficial.","low_causes":"Low levels of systemic inflammation, good cardiovascular health","high_causes":"Acute infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions, intense exercise without adequate recovery","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. Shahir's ESR of 12 mm/hour sits right at the upper limit of the reference range. ESR is a non-specific marker that can be influenced by many factors including age, infection, and inflammation. In the context of his joint symptoms and high training volume, this borderline result is consistent with mild background inflammation rather than a specific pathological process.","low_causes":"Not clinically significant","high_causes":"Infection, inflammation, autoimmune disease, anaemia, malignancy, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is the main electrolyte in the fluid outside cells and plays a critical role in maintaining blood pressure, fluid balance, and nerve function. Shahir's sodium of 143 mmol/L is within the optimal range, indicating well-regulated fluid and electrolyte balance.","low_causes":"Excessive fluid intake, diuretics, adrenal insufficiency, heart failure, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Both high and low levels can be dangerous, particularly for the heart. Shahir's result of 4.2 mmol/L is within the optimal range, indicating healthy potassium balance.","low_causes":"Diuretics, diarrhoea, vomiting, excessive sweating, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, sample haemolysis, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3487","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and the acid-base balance of the blood. Shahir's result of 98 mmol/L is within range, confirming healthy electrolyte balance.","low_causes":"Vomiting, diuretics, respiratory acidosis, adrenal insufficiency","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4712","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a key buffer in the blood that helps maintain the acid-base balance. The kidneys regulate bicarbonate levels. Shahir's result of 24.5 mmol/L is within the optimal range, indicating healthy acid-base balance and kidney buffering function.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5702","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6158","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Blood calcium is tightly regulated by parathyroid hormone and vitamin D. Shahir's calcium of 2.48 mmol/L is within the optimal range, reflecting good calcium homeostasis supported by his excellent vitamin D level.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate picture of biologically active calcium. When albumin is low, total calcium can appear falsely low. Shahir's corrected calcium of 2.48 mmol/L is within the optimal range, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3908","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5184","upper_optimal_position":"0.6149","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body including energy production, muscle function, nerve signalling, and sleep regulation. Shahir's result of 0.86 mmol/L is just within the optimal range of 0.85 to 1.05, sitting at the lower end. Given his high training volume of 8 sessions per week, which increases magnesium losses through sweat, and his reported joint stiffness, supplementing with magnesium glycinate before bed would help maintain and improve this level while supporting sleep quality and muscle recovery.","low_causes":"High training volume, excessive sweating, alcohol, diuretics, poor dietary intake, gut malabsorption","high_causes":"Kidney disease, excessive supplementation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"350","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4660","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4877","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and in the body's own cells. The kidneys excrete uric acid. Elevated levels can cause gout, a form of inflammatory arthritis, and are associated with cardiovascular and kidney disease. Shahir's uric acid of 350 umol/L is within the optimal range of 200 to 380 for males. This is particularly relevant given his joint pain and stiffness, as it rules out uric acid crystal deposition (gout) as a contributing factor.","low_causes":"Low purine diet, liver disease, Fanconi syndrome","high_causes":"High purine diet (red meat, shellfish, organ meats), alcohol excess, kidney impairment, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7458","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate. It represents the unmeasured anions in the blood. Shahir's calculated anion gap of 24.7 mmol/L is above the reference range of 8 to 16. However, the anion gap calculation varies depending on which formula is used and whether albumin correction is applied. Given that all of Shahir's individual electrolytes are within normal ranges, his kidney function is healthy, his glucose is normal, and there are no signs of metabolic acidosis, this elevated anion gap is most likely a calculation artefact related to unmeasured proteins rather than a clinically significant finding. It does not require any action but is noted for completeness.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Lactic acidosis, diabetic ketoacidosis, kidney failure, toxin ingestion, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"10.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6200","units":"mmol/L","description":"Urea is a waste product of protein metabolism, produced in the liver and excreted by the kidneys. Elevated levels can indicate kidney impairment or high protein intake. Shahir's urea of 10.2 mmol/L is above the upper limit of 8.2, but in the context of perfectly healthy creatinine (85), Cystatin C eGFR of 93, and a high-quality diet with high volume rated 8 out of 10 alongside intensive training, this elevation is almost certainly driven by high dietary protein intake rather than any kidney problem. The kidneys are clearing the urea efficiently; there is simply more protein going in." linically significant, can occur in early diabetes or pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.775","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Cystatin C eGFR provides an alternative estimate of kidney filtration rate using a protein called Cystatin C that is produced at a constant rate by all cells in the body. Unlike creatinine, it is not influenced by muscle mass, making it particularly useful in individuals with high or low muscle mass. Shahir's Cystatin C eGFR of 93 confirms healthy kidney function above the optimal threshold of 90.","low_causes":"Chronic kidney disease, acute kidney injury","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein freely filtered by the kidneys and used as a direct measure of kidney filtration ability. Unlike creatinine, its production is not affected by muscle mass, diet, or exercise. Shahir's result of 0.97 mg/L is within the laboratory range of below 1.1 but slightly above the optimal threshold of 0.95. This is a marginal finding and the corresponding eGFR of 93 confirms healthy kidney function.","low_causes":"Not clinically significant","high_causes":"Kidney disease, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"149","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. It is the primary marker of blood oxygen-carrying capacity. Shahir's haemoglobin of 149 g/L is within the optimal range for a male of 140 to 165, indicating healthy oxygen transport capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, kidney disease, blood loss","high_causes":"Dehydration, polycythaemia vera, chronic lung disease, living at high altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"5.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red blood cells per litre of blood. These cells carry haemoglobin and are responsible for oxygen delivery. Shahir's count of 5.07 is within the optimal range, consistent with healthy red cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result" e haemoglobin is appropriately concentrated within his red cells.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact from temperature or storage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"213","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4141","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3410","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small cell fragments in the blood that are essential for blood clotting and wound healing. Shahir's platelet count of 213 is within the optimal range, indicating healthy platelet production and no signs of clotting disorders or bone marrow problems.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, medications, liver disease, heavy alcohol use","high_causes":"Iron deficiency, infection, inflammation, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.5800","units":"fL","description":"Mean platelet volume (MPV) measures the average size of platelets. Larger platelets are generally younger and more metabolically active. Shahir's MPV of 9.8 fL is within the laboratory range but above the optimal threshold. This is a minor finding and at this margin is typically normal variation.","low_causes":"Bone marrow suppression, inflammatory conditions with chronic platelet consumption","high_causes":"Active platelet production, immune thrombocytopenia, inflammation, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"4.68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4467","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5000","units":"x10^9/L","description":"White blood cells (WBCs) are the immune system's frontline defenders against infection and disease. Shahir's count of 4.68 is within the laboratory range of 4 to 10 but below the optimal band of 5 to 8. A WBC in this range is not a concern and may reflect his training volume, as intense exercise can transiently suppress white cell counts. His differential (the breakdown of white cell types) is well balanced, which is reassuring.","low_causes":"Intense exercise, viral infections, bone marrow disorders, medications, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, corticosteroid use, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4373","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. Shahir's neutrophil count of 2.52 is within the optimal range, indicating a healthy innate immune response.","low_causes":"Viral infections, intense exercise, medications, autoimmune conditions, bone marrow disorders, ethnic variation","high_causes":"Bacterial
