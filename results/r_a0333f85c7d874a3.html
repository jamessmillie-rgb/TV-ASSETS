<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

specific gravity of 1.03 showing adequate hydration.\n\nHis iron stores are well balanced. Ferritin at 94 is comfortably within the optimal male range of 50 to 200, serum iron at 24.4 is healthy, transferrin saturation at 38.7 percent sits within the ideal 25 to 40 percent window, and total iron binding capacity at 60 is mid-range. There is no iron deficiency and no iron overload. This is relevant because low iron is one of the most common causes of fatigue in young men who train, and it has been ruled out here.\n\nHis red blood cell production is healthy. Haemoglobin at 162 is strong, haematocrit at 0.472 is mid-range, and RBC count at 4.89 is normal. RDW at 13.7 is fine, MCV at 96.6 is within range, and MCHC at 342 sits comfortably within the normal band. Platelets at 269 are healthy and MPV at 9 is mid-range. Creatine kinase at 238 is within the male range of 40 to 320 and consistent with someone training four times a week in the gym.\n\nHis blood sugar control is mostly reassuring but deserves attention given his family history of type 2 diabetes. Fasting glucose at 5.0 is within the optimal range of 4.0 to 5.4. HbA1c at 38 mmol/mol, which measures average blood sugar over the past two to three months, is within the normal range of under 42 but above the optimal ceiling of 36. Fasting insulin at 7.48 is within the optimal band of 2 to 8, and C-peptide at 1.78 (589 pmol/L) confirms appropriate insulin secretion. However, HOMA-IR, which is a ratio of insulin and glucose that estimates how sensitive the cells are to insulin, is 1.66, above the upper limit of 1.5. This is not insulin resistance in the clinical sense, but it means the body is working slightly harder than it should to keep glucose in check. At 32, with a lean BMI, a family history of type 2 diabetes and a diet high in ultra-processed food and sugary food on some days, this is an early signal. The estimated average glucose of 6.4 is above the optimal ceiling of 6.2, consistent with the same drift. The TyG index at 8.09 remains within a healthy range. The pattern is not alarming, but it deserves a deliberate dietary response because the family history means Cameron's margin for error is narrower than average.\n\nHis prostate markers are excellent. PSA at 0.48 and free PSA at 0.28 with a ratio of 0.583 are all ideal for his age. Tumour markers CA19-9 and CEA are both undetectable, which is reassuring. Coeliac screening is negative. Rheumatoid factor is well within range. Immunoglobulins IgG, IgM, IgA and IgE are all normal, confirming a balanced immune system with no sign of allergy or immune overactivation. ESR at 2 is as low as it gets, confirming no systemic inflammation from an erythrocyte sedimentation standpoint.\n\nHis cortisol at 404, taken from a morning sample, is within the expected morning range and does not suggest adrenal dysfunction. Prolactin at 248 is within range. DHEA-S at 7.9 umol/L (2,913 ug/dL) is healthy. LH at 6.42 and FSH at 6.64 are both within range, showing the pituitary gland is communicating normally with the testes. Progesterone at 1.9 is within the male reference range.\n\nNow the findings that need action.\n\nThe most important result in this report, because it is permanent and inherited, is Cameron's lipoprotein(a), usually written Lp(a). Lp(a) is a particle in the blood that looks like LDL cholesterol but carries an extra protein tail that makes it stickier, more inflammatory and harder for the body to clear. It deposits cholesterol in artery walls, encourages blood clotting and drives local inflammation. Unlike every other lipid marker, Lp(a) is entirely genetic and does not change with diet, exercise, weight loss or any currently available lifestyle intervention. Cameron's Lp(a) is 101.16 nmol/L, above the 32 nmol/L threshold that defines elevated risk and sitting in the moderate risk band of 90 to 200. This number should be recorded in his permanent medical record and discussed with his GP. It also means that first-degree relatives, including parents and any siblings, should be tested because they have a roughly 50 percent chance of carrying the same trait. The good news is that Cameron's modifiable lipid markers are mostly in excellent shape. Total cholesterol at 4.0 is healthy. Triglycerides at 0.82 are excellent. HDL at 1.2, which is high-density lipoprotein, the particle that carries cholesterol away from artery walls, is above the risk threshold of 1.04 but below the optimal level of 1.4 for a man. LDL at 2.43 is within the laboratory range but above the optimal target of 2.6 only marginally, and when corrected for the cholesterol carried by Lp(a), the Lp(a)-corrected LDL drops to 2.1, which tells us that a meaningful portion of what the lab calls LDL is actually Lp(a) and not modifiable. ApoB, which counts the total number of atherogenic particles in the blood and is the single best predictor of cardiovascular risk, is 0.83, just above the optimal target of 0.8 but below the laboratory flag of 0.9. ApoA1 at 1.35 is healthy, and the ApoB to ApoA1 ratio at 0.615 is below the 0.7 lower-risk threshold, which is reassuring. The atherogenic index of plasma at minus 0.165 is ideal, the LDL to HDL ratio at 2.03 is within the optimal band, and remnant cholesterol is healthy. The Cardiovascular Risk Score, which is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 45 out of 100, above the 40 threshold. This score carries no age term, so it does not mean Cameron has a high ten-year risk of a cardiovascular event; at 32, his ten-year risk is low. What it means is that the risk is being built now, primarily by the Lp(a), and the window for acting on the modifiable inputs is wide open. Raising HDL (exercise, reducing alcohol), keeping ApoB below 0.8 (diet quality, omega-3) and keeping hs-CRP low are the levers Cameron can pull. For individuals with elevated Lp(a), the European Atherosclerosis Society recommends keeping LDL and ApoB as low as possible to offset the genetic risk.\n\nCameron's hs-CRP, which is high-sensitivity C-reactive protein, a marker of systemic inflammation, is 1.1 mg/L. This is well within the laboratory range of under 5 but above the optimal ceiling of 1.0. At a BMI of 22.6 with no obvious inflammatory driver, this mild elevation could reflect the combination of ultra-processed food, regular alcohol, recreational drug use or the vaping. It is not alarming, but in someone with an elevated Lp(a), keeping CRP below 1.0 is worth targeting because Lp(a) and inflammation compound each other's effects on artery walls.\n\nCameron's testosterone is 30.3 nmol/L, which is above the laboratory upper limit of 28.7 and well above the optimal band of 18 to 30. Free testosterone, calculated at 0.4538 nmol/L, is within range. SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues) is 63, near the top of the range at 17.3 to 65.8, meaning that although total testosterone is high, a substantial proportion is bound. Bioavailable testosterone, which includes the free fraction plus the loosely albumin-bound fraction, is 10.63 nmol/L, above the standard range upper limit of 9. Oestradiol at 176 pmol/L is above the male upper limit of 146.1. In men, oestradiol is made from testosterone by an enzyme called aromatase, and higher testosterone often leads to higher oestradiol because there is simply more substrate for the enzyme to convert. At 32 with a BMI of 22.6, the elevated testosterone is most likely constitutional, meaning this is Cameron's natural set point, but it is worth asking whether he is using any performance-enhancing substances or testosterone-boosting supplements beyond creatine, as these would be the other explanation. The elevated oestradiol is consistent with the high testosterone and does not require treatment on its own, but it is worth mentioning to the GP, particularly if Cameron develops any symptoms such as breast tenderness or mood changes.\n\nCameron's white blood cell count is 3.38, below the lower limit of 4.0, and his neutrophils are 1.28, below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the body's first responders to bacterial infection. Lymphocytes at 1.68 are within range, and monocytes, eosinophils and basophils are all normal. The reticulocyte percentage at 0.9 is within range, but absolute reticulocytes at 44 are just below the lower limit of 50, meaning the bone marrow is producing red blood cells at a slightly slower pace than expected. The neutrophil to lymphocyte ratio at 0.76 is below the optimal band of 1.0 to 2.0 because the neutrophils are disproportionately low. This pattern, a low total white count driven primarily by low neutrophils with normal lymphocytes, has several possible explanations at 32. Benign ethnic neutropenia is common in people of African, Middle Eastern and some Southern European descent, but Cameron identifies as White European, making this less likely. Viral suppression from a recent infection can transiently lower neutrophils for weeks. Recreational drug use, particularly cocaine and MDMA, can suppress bone marrow production. Regular heavy caffeine and nicotine exposure can also modestly affect white cell counts. It is also possible that Cameron naturally runs a low neutrophil count, a finding sometimes called constitutional neutropenia, which is harmless but should be documented so that future blood tests are interpreted in context. The low absolute reticulocyte count fits with a mildly quieter bone marrow overall. This is not dangerous at these levels, but it does warrant a repeat test in three to four months to confirm whether it is Cameron's baseline or a transient finding, and it should be discussed with his GP.\n\nMCH at 33 pg is marginally above the upper limit of 32. This is a measure of the average amount of haemoglobin in each red blood cell, and at this margin, with a normal MCV and normal MCHC, it is laboratory variation and not clinically significant.\n\nTotal antioxidant activity at 1.98 is above the upper range of 1.77. This marker measures the blood's overall capacity to neutralise free radicals, and a high result is not harmful. It may reflect the creatine supplementation, dietary antioxidants or the body upregulating its own defences in response to oxidative stress from smoking, vaping or recreational substances.\n\nVitamin D at 85 nmol/L is sufficient and within the optimal band of 75 to 120. Vitamin B12 at 530 pg/ml is within the optimal range of 500 to 900. Folate at 16 is excellent. Calcium at 2.4 and corrected calcium at 2.38 are both healthy, with PTH at 3.1 confirming normal calcium regulation. Phosphate at 1.2 and magnesium at 0.85 are both within range, though magnesium sits right at the lower edge of the optimal band of 0.85 to 1.05, which is worth addressing given Cameron's training load, sleep quality complaints and energy symptoms.\n\nReturning to Cameron's primary complaint, which is feeling tired all day and waking unrefreshed despite sleeping eight or more hours, with brain fog and low mood that have been present for as long as he can remember. The bloods have positively excluded the most common medical causes: the thyroid is working well, there is no anaemia, iron stores are healthy, B12 and folate are good, blood sugar is not low, testosterone is if anything high, there is no coeliac disease, cortisol is normal, there is no significant inflammation and kidney and liver function are intact. This is actually useful information because it narrows the search considerably. The most likely drivers of Cameron's symptoms are the things blood cannot measure but his quiz answers point clearly towards. First, diet quality: 0 to 1 portions of vegetables and fruit a day with ultra-processed food most days means the brain and mitochondria are not getting the micronutrient density they need. Magnesium at the floor of optimal, and a diet that is almost certainly low in polyphenols, fibre and omega-3, all contribute to the low-grade fatigue and brain fog he describes. Second, substance load: vaping delivers nicotine, which is a stimulant that disrupts natural dopamine regulation; cocaine and MDMA directly deplete serotonin and dopamine reserves, which are the neurotransmitters behind mood, motivation and mental clarity; and overuse of caffeine or energy drinks creates a cycle of stimulation and crash that fragments the body's natural energy rhythm. The combination of these substances is the most likely explanation for waking tired despite adequate sleep hours, feeling low all day and struggling with focus. Third, the \"wired at night\" energy pattern Cameron describes, where energy arrives late in the day, is a classic sign of a shifted cortisol rhythm, often driven by stimulant use and screen exposure in the evening. Cortisol should peak in the first hour after waking and fall steadily through the day; caffeine, nicotine and cocaine all push it later. Fourth, 5 to 9 drinks a week at 32 is not extreme, but alcohol disrupts REM sleep architecture, meaning that even eight hours in bed may not deliver restorative sleep. Cameron may be sleeping long enough but not deeply enough. The combination of stimulants, depressants and a nutrient-poor diet is a coherent explanation for every symptom he reports, and improving these will deliver more benefit than any supplement.","links":"The thread running through Cameron's results connects three stories. The first is the Lp(a) and what it means for his cardiovascular future. His modifiable lipid markers are largely healthy: LDL is reasonable, triglycerides are excellent, ApoB is close to optimal and the ApoB to ApoA1 ratio is in the lower-risk zone. But the Lp(a) at 101 nmol/L adds a fixed layer of risk that cannot be dieted away. The Cardiovascular Risk Score of 45 is being driven primarily by that Lp(a) and to a lesser extent by the hs-CRP of 1.1 and the HDL of 1.2, both of which sit just outside optimal. For Cameron, the strategy is to make every modifiable input as strong as possible: push ApoB below 0.8, push HDL above 1.4 and push CRP below 1.0. That triad offsets the genetic hand he has been dealt.\n\nThe second story is the white blood cell picture. A total white count of 3.38 with neutrophils at 1.28, both below range, alongside borderline low absolute reticulocytes at 44, points to a bone marrow that is running quietly. The lymphocytes, monocytes, eosinophils and basophils are all normal, so this is a neutrophil-specific finding. At 32 with no medical conditions, the differential includes constitutional low neutrophil count, transient viral suppression, or the cumulative effect of recreational drug use and stimulant load on marrow activity. There is no sign of infection (ESR is 2, CRP is 1.1, the urine is clean), so the low neutrophils are not a response to active illness. The key step is a repeat blood count in three to four months to establish whether this is Cameron's baseline.\n\nThe third story is the symptom picture: fatigue, brain fog and low mood that have always been present, despite a young age, healthy BMI and strong testosterone. The bloods have systematically ruled out the medical explanations. The thyroid, iron, B12, folate, glucose, cortisol, kidney and liver are all clear. What they have not ruled out, and what the quiz answers strongly suggest, is a lifestyle pattern that drains the very systems responsible for energy and mood. Ultra-processed food most days with almost no fruit or vegetables starves the mitochondria of the B vitamins, magnesium, zinc, polyphenols and fibre they rely on. Cocaine and MDMA strip serotonin and dopamine. Caffeine and nicotine override the natural wake-sleep cortisol curve. Alcohol fragments deep sleep. These are not small contributors; together, they are the most plausible explanation for symptoms that have been present for years. The HOMA-IR of 1.66 sits in this same story: a diet that leans on processed carbohydrate and sugar, combined with a family history of type 2 diabetes, is nudging insulin resistance upward even at a lean BMI.\n\nThe elevated testosterone and oestradiol form a separate, smaller finding. Testosterone at 30.3 is only marginally above the laboratory ceiling, and the oestradiol at 176 follows logically from higher aromatase conversion. If Cameron is not using any exogenous hormones or prohormones, this is most likely his constitutional level and is not harmful. It is worth confirming with his GP and documenting.\n\nWhat has been excluded matters. There is no thyroid disease, no coeliac disease, no diabetes, no liver disease, no kidney disease, no iron deficiency, no B12 or folate deficiency, no significant inflammation, no prostate concern, no abnormal tumour markers, and no autoimmune signal. These are important negatives that frame the action plan: the changes Cameron needs to make are lifestyle changes, not medical treatments.","lifestyle":"Add at least three portions of vegetables or fruit to your day, starting with one at every meal you already eat. A handful of spinach in eggs, a banana with your shake, frozen mixed vegetables with dinner. Anchor: before you plate anything processed, the vegetable goes on first. Why: 0 to 1 portions a day means your body is missing the magnesium, potassium, folate, fibre and polyphenols that drive energy production and gut health, and it is the single biggest lever for your hs-CRP of 1.1, your HOMA-IR of 1.66 and how you feel every morning.\nSwap one ultra-processed meal a day for a whole-food alternative. If lunch is a meal deal, make it a chicken and avocado wrap you assemble yourself, or rice and mince you batch-cooked on Sunday. Anchor: pick the meal that is most consistently processed and change that one first. Why: ultra-processed food drives the insulin response behind your HOMA-IR of 1.66, and your family history of type 2 diabetes means that response will accelerate faster than average if the diet stays the same.\nInclude a palm-sized portion of protein at every meal: eggs, chicken, Greek yoghurt, fish, mince or whey. Anchor: protein goes on the plate before carbohydrate. Why: at 84 kg training four times a week, you need at least 109 to 134 grams of protein a day to build muscle and support recovery, and protein at each meal blunts the insulin spike that is pushing HOMA-IR above optimal.\nEat two portions of oily fish a week (salmon, mackerel, sardines) or take an omega-3 supplement daily. Anchor: make one of them your easiest weeknight dinner. Why: omega-3 lowers triglycerides, raises HDL and reduces inflammation, all three of which matter for keeping your Cardiovascular Risk Score in check given the Lp(a) you cannot change.\nSet a fixed caffeine cut-off at 1pm, no exceptions, and cap total intake at two coffees or one energy drink before that time. Anchor: after 1pm, switch to water or decaf. Why: caffeine has a half-life of five to six hours, meaning a 3pm coffee is still half-active at 9pm, which explains why you feel wired at night and tired on waking despite eight hours in bed.\nAdd two 20-minute brisk walks to your week, ideally after your largest meal. Anchor: plate in the sink, shoes on, walk for 20 minutes. Why: post-meal walking directly lowers the glucose and insulin response to that meal, which targets your HOMA-IR of 1.66, and dedicated cardio twice a week will help raise your HDL from 1.2 toward the 1.4 target.\nHave an honest conversation with yourself about cocaine, MDMA and the vaping. These are the most likely drivers of your brain fog, low mood and flat energy. Serotonin and dopamine take days to weeks to recover after MDMA, and cocaine use followed by a crash depletes the same pathways. Nicotine from vaping disrupts natural dopamine reward. Reducing or stopping these will do more for how you feel than any supplement or dietary change.\nAim for a fixed wake time seven days a week, morning light within 30 minutes of waking, and no screens for the last 45 minutes before bed. Anchor: alarm at the same time every day, open the curtains or step outside first, and charge your phone outside the bedroom. Why: your shifted energy pattern (low all day, wired at night) suggests your cortisol rhythm is inverted, and consistent light exposure and wake time are the strongest resets.","flags":"Lp(a) 101.16 nmol/L, above the 32 nmol/L threshold, moderate risk band (90 to 200). This is inherited, permanent and cannot be modified by lifestyle. Should be recorded in Cameron's permanent medical record. First-degree relatives should be tested. All modifiable lipid markers should be kept as low as possible to offset this genetic risk. HDL at 1.2 is below the optimal 1.4 target for a man, and hs-CRP at 1.1 is above the optimal 1.0 ceiling; both should be improved to reduce the compounding effect alongside Lp(a). Cardiovascular Risk Score 45 out of 100, driven primarily by Lp(a).\nWhite cell count 3.38 (range 4.0 to 10.0), neutrophils 1.28 (range 2.0 to 7.0), both below range. Absolute reticulocytes 44 (range 50 to 100), also below range. Lymphocytes, monocytes, eosinophils and basophils all normal. No sign of active infection (ESR 2, CRP 1.1, urine clean). Differential includes constitutional neutropenia, transient viral suppression or substance-related marrow suppression. Recommend repeat FBC in three to four months to establish baseline.\nHOMA-IR 1.66, above the upper limit of 1.5. Fasting glucose 5.0 and insulin 7.48 are individually within range but the ratio indicates early insulin resistance. HbA1c 38 is within the normal range but above the optimal of 36. Family history of type 2 diabetes increases relevance. Dietary change is the primary intervention.\nTestosterone 30.3 nmol/L, above the upper limit of 28.7. Oestradiol 176 pmol/L, above the male upper limit of 146.1. Bioavailable testosterone 10.63, above the upper range of 9. SHBG 63, near the top of range. LH and FSH are normal. Pattern is consistent with constitutional high testosterone with secondary oestradiol elevation from aromatase conversion. Should be documented and discussed with GP, particularly to exclude exogenous hormone use.\nGamma GT 47 IU/L, within the laboratory range but above the optimal ceiling of 25. ALT 34, above the optimal male ceiling of 30 but within the laboratory range. Consistent with regular alcohol intake and ultra-processed diet. No fibrosis risk (FIB-4 0.67, APRI 0.307).\nMCH 33 pg, marginally above the upper limit of 32 pg. With normal MCV and MCHC, this is laboratory variation and not clinically significant.\nTotal antioxidant activity 1.98 mmol/L, above the upper range of 1.77. Not harmful; likely reflects creatine supplementation or oxidative stress response.\nReassuring negatives: thyroid function normal with negative antibodies, coeliac screen negative, PSA 0.48 with excellent free ratio, tumour markers CA19-9 and CEA undetectable, rheumatoid factor negative, immunoglobulins all normal, liver fibrosis scores low, iron studies balanced, vitamin D sufficient, B12 and folate optimal, calcium and PTH normal, kidney function adequate, cortisol within morning range, urine clean.\nUrine culture and sensitivities and bacterial count are pending (to follow). Results will be reviewed when available.","recommendations":"Record the Lp(a) result of 101.16 nmol/L in your permanent medical notes and discuss its implications with your GP. Ask whether first-degree family members (parents, siblings) should be tested. Ask your GP whether, given the Lp(a), your modifiable lipid targets should be more aggressive than standard guidelines (LDL below 2.0, ApoB below 0.8).\nDiscuss the low white cell count (3.38) and low neutrophils (1.28) with your GP. Request a repeat full blood count in three to four months to establish whether this is your constitutional baseline or a transient finding. Mention your recreational drug use and stimulant intake as the GP will want to consider these as contributing factors.\nDiscuss the testosterone of 30.3 and oestradiol of 176 with your GP. Confirm that you are not using any exogenous hormones, prohormones or testosterone-boosting supplements beyond creatine, so the GP can document this as your natural level.\nAsk your GP about cardiovascular risk management in the context of elevated Lp(a). Current guidelines suggest that individuals with Lp(a) above 50 nmol/L should have all other modifiable risk factors optimised. Emerging therapies targeting Lp(a) directly are in late-stage clinical trials and may become available in the coming years.\nAddress the HOMA-IR of 1.66 through dietary changes (reducing ultra-processed food, increasing fibre and protein, adding post-meal movement). Given the family history of type 2 diabetes, retest fasting glucose, insulin and HbA1c in six months to track the direction of travel.\nCalorie target: approximately 2,350 to 2,500 kcal per day for a gradual body recomposition (slight fat loss while building muscle at 84 kg, 193 cm, four resistance sessions per week). Protein target: 109 to 134 grams per day (1.3 to 1.6 g per kg bodyweight). Retest in six months: repeat FBC with differential, fasting glucose, insulin, HbA1c, HOMA-IR, lipid panel including ApoB and HDL, hs-CRP, GGT and liver enzymes.","supplementation":"Omega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with your largest meal. Why: omega-3 raises HDL (currently 1.2, target above 1.4), lowers triglycerides and reduces hs-CRP, all three of which help offset the cardiovascular risk from an Lp(a) of 101.\nMagnesium glycinate: 300 to 400 mg daily, taken before bed. Why: your magnesium at 0.85 sits at the very bottom of the optimal band, and magnesium glycinate supports sleep quality (you wake tired despite 8+ hours), muscle recovery (four resistance sessions a week) and insulin sensitivity (HOMA-IR 1.66).\nVitamin D3 (cholecalciferol): maintain current intake or ensure 2,000 IU daily with a fat-containing meal, paired with vitamin K2 (MK-7) at 100 mcg. Why: your vitamin D at 85 nmol/L is within the optimal band, and a maintenance dose keeps it there through winter months. K2 ensures the calcium that vitamin D helps absorb is directed to bones rather than arteries, which is particularly relevant given the Lp(a) finding.\nCreatine monohydrate: continue at 3 to 5 grams daily. Your CK at 238 is within range, confirming your muscles are tolerating it well. Note that creatine may modestly raise creatinine and cystatin C, which is why your cystatin C is at the upper boundary; this is not kidney damage.\nDo not take iron supplements. Your ferritin at 94, transferrin saturation at 38.7 percent and serum iron at 24.4 are all healthy, and supplemental iron when stores are adequate can cause oxidative stress.\nThe most important changes from this report are not supplements. They are adding vegetables and whole food to every meal, cutting ultra-processed food, setting a caffeine cut-off at 1pm, and having an honest reckoning with the cocaine, MDMA and vaping that are almost certainly driving the fatigue, brain fog and low mood you have lived with for years.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6182","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 68 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 68.1. Weakest systems: hematology 35%, hormones 37%, lipids & cardiovascular 44%. Biggest drags: Lipoprotein(a), Oestradiol, White Blood Cell Count, Bicarbonate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3757","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4324","units":"years","description":"PhenoAge is a biological age estimate based on blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. Cameron's PhenoAge of 27.8 against a calendar age of 32 means his blood markers are ageing roughly four years younger than his birthday. The clean CRP, healthy albumin, good kidney function and normal glucose are the main drivers holding this score down. This is an encouraging baseline that can be improved further by addressing the dietary and lifestyle factors flagged in this report.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the risk being built right now, not the ten-year probability of function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  this.value=f;
});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
