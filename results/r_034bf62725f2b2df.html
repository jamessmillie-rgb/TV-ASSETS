<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Rory Foster","dob":"22/12/1995","report_date":"2026-09-26","summary":"Rory is a 30-year-old male presenting with a BMI of 27.8, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He trains five times per week, split across two cardio sessions and three resistance sessions, with 10,000 to 15,000 daily steps. He reports no medications and no particular habits. His symptoms are weight gain and difficulty losing weight, poor exercise recovery, and joint pain and stiffness. His goals are to improve energy levels, lose body fat, and improve long-term health and longevity. He adds that he has always had issues with nerve and soft tissue injuries, tendonitis, and tight muscles, and that previous GP bloods came back fine and nerve relaxants prescribed for these issues did not help.\n\nThe most important finding in this report is the lipid profile. Rory's ApoB, which is apolipoprotein B, the protein that sits on every LDL particle and is the best single measure of how much cholesterol is being deposited in artery walls, is 1.14 g/L, above the 0.9 threshold and well above the ideal target of below 0.8. His LDL cholesterol, the so-called bad cholesterol that carries most of the cholesterol in the bloodstream, is 3.65 mmol/L against an ideal of below 2.6 and a lab ceiling of 3.0. His total cholesterol is 6.1 mmol/L, above the desirable limit of 5.18, and his non-HDL cholesterol, which captures everything that is not the protective HDL fraction, is 4.1 against a limit of 4.0. These four results are telling the same story: there is more atherogenic cholesterol circulating than is safe for a 30-year-old who wants to protect his long-term cardiovascular health. The Lp(a) result, lipoprotein(a), which is a genetically inherited particle that accelerates cholesterol deposition and cannot be changed by diet or exercise, is pending and marked as to follow. Once that result arrives it will be important because it will tell us whether the elevated LDL and ApoB are entirely driven by modifiable factors like diet and body composition, or whether an inherited component is also contributing. We will update this section when that result is available.\n\nThe good news is that there is a great deal working in Rory's favour within the same lipid panel. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls and returns it to the liver, is 2.0 mmol/L, which is genuinely excellent. That is well above the ideal threshold of 1.4 for men, and it means his body is running an efficient reverse cholesterol transport system. His triglycerides are 1.13 mmol/L, comfortably below the 1.7 fasting limit, although a shade above the tighter optimal of 1.0. His ApoB to ApoA1 ratio is 0.60, below the 0.7 lower-risk threshold, which means the balance between harmful and protective lipoproteins is still favourable overall. His Atherogenic Index of Plasma is negative at minus 0.248, which is a positive sign. His TC to HDL ratio is 3.05, well within the 4.5 limit. So the picture is not one of metabolic dysfunction; it is one of a young man with a strong protective cholesterol profile whose LDL production is running higher than it should, most likely driven by dietary saturated fat intake and the excess body fat he wants to lose.\n\nBeyond lipids, Rory's metabolic health is in very good shape. His fasting glucose is 4.5 mmol/L, right in the middle of the ideal range. His HbA1c, which reflects average blood sugar over the past two to three months, is 33 mmol/mol, comfortably below the 36 optimal ceiling and well below the 42 pre-diabetes threshold. His fasting insulin is 4.76 mIU/L, sitting within the ideal window of 2 to 8, which tells us his pancreas is not having to work hard to keep blood sugar controlled. His HOMA-IR, a calculated index of insulin resistance derived from fasting glucose and insulin, is 0.95, under the 1.0 mark that defines optimal insulin sensitivity. At a BMI of nearly 28, this level of insulin sensitivity is a genuine positive and suggests that his body composition, while carrying some extra fat, has not yet begun to affect how his cells respond to insulin. His C-Peptide, which is a byproduct released when the pancreas produces insulin and serves as a more stable measure of insulin output, came back at 0.79 ug/L, which converts to approximately 261 pmol/L, below the laboratory range of 1.1 to 4.4 ug/L. In context, this is not concerning. His glucose and HbA1c are both ideal, and his insulin is low-normal, so the low C-Peptide simply reflects low insulin demand rather than pancreatic insufficiency. His pancreas is producing exactly what it needs to and no more, which is the hallmark of good metabolic health.\n\nHis liver is in excellent condition. ALT, the enzyme most specific to liver cell damage, is 18 IU/L, well under the optimal ceiling of 30 for men. AST is 21, mid-range and healthy. Gamma GT, which is often the first enzyme to rise with alcohol, metabolic strain, or fatty infiltration, is just 13 IU/L, about as clean as that marker gets. His FIB-4 score, a composite index that estimates liver scarring from age, platelets, AST and ALT, is 0.66, well below the 1.45 threshold, confirming no sign of fibrosis. His APRI score is 0.233 and his NAFLD Fibrosis Score is minus 2.629, both comfortably in the low-risk zone. Bilirubin, albumin and total protein are all healthy. Amylase and lipase, the two pancreatic enzymes that would rise with pancreatic inflammation, are both mid-range. The liver and pancreas are under no strain at all.\n\nKidney function is excellent. His Cystatin C, a protein filtered by the kidneys that gives a more accurate picture of filtration than creatinine alone, especially in muscular or active individuals, is 0.95 mg/L, and the eGFR calculated from it is 104 mL/min, well above the 90 optimal floor. His creatinine-based eGFR is also above 90. Urea, sodium, chloride, bicarbonate and potassium are all within their ideal ranges. His uric acid is 279 umol/L, within the ideal window of 200 to 380 for men, so there is no gout risk and no sign of purine overload.\n\nHis thyroid is working well. TSH, thyroid stimulating hormone, which is the brain's signal telling the thyroid how hard to work, is 1.84 mIU/L, sitting within the optimal band of 1.0 to 2.5. Free T4, the storage form of thyroid hormone, is 20.1 pmol/L, towards the upper end of the range and within ideal. Free T3, the active form that cells actually use for energy and metabolism, is 5.9 pmol/L, solidly within the optimal window of 4.5 to 6.5. The FT3 to FT4 ratio is 0.294, within the ideal range, confirming good conversion from storage to active hormone. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. This is particularly useful given his fatigue symptoms, because it means the thyroid is not the explanation.\n\nHis immune system and inflammation markers are reassuring. High-sensitivity CRP, the most sensitive marker of systemic inflammation, is below 0.5 mg/L, essentially undetectable and well under the optimal ceiling of 1.0. ESR, another inflammation marker, is 4 mm/hour, very low. His immunoglobulins, IgG, IgM and IgA, are all within their laboratory ranges, indicating a normally functioning immune system. IgE, which rises with allergic responses, is 52.4 IU/mL, within the 100 limit. Rheumatoid factor is below 4, negative, which is relevant given his joint pain and stiffness. Tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of his symptoms. The Systemic Immune-Inflammation Index is 261, within optimal, and the Platelet to Lymphocyte Ratio is 123.6, also healthy.\n\nHis hormones are broadly healthy but have one area worth watching. Testosterone is 17.3 nmol/L, within the laboratory range of 8.4 to 28.7 but sitting below the optimal floor of 18 for a 30-year-old man. His free testosterone, calculated at 0.47 nmol/L, is within range, and his bioavailable testosterone is 11.26 nmol/L, actually above the laboratory upper limit, which tells us that the testosterone he has is highly available to tissues because his SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it inactive, is 18.9 nmol/L, just above the lower limit of 17.3. Low SHBG means less testosterone is locked up, so despite the total being below ideal, the amount reaching muscles and tissues is adequate. That said, at 30 with training five times a week, total testosterone sitting just under 18 is below where it should be. The most likely drivers are the excess body fat, since fat tissue contains aromatase, an enzyme that converts testosterone to oestrogen, and possibly insufficient recovery between training sessions, which he has identified as a symptom. His oestradiol at 65 pmol/L is within range and not elevated, so aromatisation is not running away, but it is a mechanism that will improve as body fat decreases. Cortisol is 316 nmol/L, within the morning reference range, suggesting his stress axis is functioning normally. LH and FSH, the pituitary hormones that drive testicular testosterone production, are both within range, confirming the signal from brain to testes is intact. Prolactin is healthy. DHEA-S, an adrenal androgen precursor, is 3.8 umol/L, within range. Progesterone is 0.74 nmol/L, below the laboratory range of 0.89 to 3.88. In men, progesterone is produced in small amounts and has a role in mood, sleep and balancing other hormones, but at this margin below range it is not clinically significant and does not require action.\n\nHis iron studies are well balanced. Ferritin, the storage form of iron, is 128 ng/mL, comfortably within the optimal range of 50 to 200 for men. Serum iron is 23.5 umol/L, transferrin is 2.22 g/L, transferrin saturation is 42.15%, and iron binding capacity is 52.1 umol/L, all within their respective ranges. The saturation of 42% is within the healthy window of 25 to 40 optimal, sitting just a touch above but well within the laboratory range of 18 to 55, so there is no suggestion of iron overload or deficiency.\n\nHis full blood count is healthy with two minor findings. Haemoglobin is 157 g/L, mid-range for a man. Red cell count, haematocrit, MCV, MCH, RDW, platelets and MPV are all within range. His white cell count is 4.36, just above the lower limit of 4.0, and his neutrophils are 2.11, just above the lower limit of 2.0. Both are within range but sitting low. In a lean, active 30-year-old this is most likely constitutional, sometimes called benign ethnic neutropenia though it occurs across ethnicities, or simply reflects a quieter immune baseline in someone with very low inflammation. It is not a concern but is worth noting for future comparison. His MCHC at 348 g/L is marginally above the upper limit of 345. At this margin, this is almost always a laboratory artefact related to temperature and storage effects on the red cell measurement, as the lab note itself flags. It does not indicate a clinical problem. His absolute reticulocyte count, which measures newly produced red blood cells from the bone marrow, is 37.5 against a range of 50 to 100. The percentage reticulocyte count is 0.73%, within range. In the context of a completely normal haemoglobin, haematocrit and red cell count, a low absolute reticulocyte count simply means the bone marrow is not being asked to produce red cells urgently because there is no anaemia driving demand. It is not a sign of marrow suppression.\n\nVitamins and minerals are mostly strong. Vitamin D is 194 nmol/L, well above the sufficient threshold of 50 and above the optimal ceiling of 120, indicating he is likely supplementing. This level is safe but he does not need to increase his dose and could consider maintaining at a lower level. Folate is 16 ng/mL, just under the 17 upper limit and well above the 8 optimal floor. Corrected calcium is 2.26 mmol/L, within range. Phosphate is 1.2, healthy. Magnesium is 1.05 mmol/L, at the top of the optimal range, which is excellent and supports muscle function and recovery. PTH, parathyroid hormone which regulates calcium and bone metabolism, is 1.177 pmol/L, within range. Vitamin B12 is 354 pg/mL, within the laboratory range but below the optimal floor of 500. B12 is essential for nerve function, energy production and red blood cell formation. At 354, he is not deficient, but given his symptoms of fatigue, poor recovery, and particularly his longstanding nerve and soft tissue issues, optimising B12 towards 500 or above would be worthwhile.\n\nTumour markers and prostate health are all clear. PSA is 1.01 ng/mL, well below the 2.5 limit, and his free PSA ratio is 0.525, very reassuringly high. CA19-9 and CEA are both well within range.\n\nHis urinalysis is clean. pH, specific gravity, protein, glucose, ketones, urobilinogen, casts, white cells, red cells and nitrites are all negative or within expected limits. Bacterial count and urine culture are pending.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 18.6, about 11 years younger than a calendar age of 30. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, hsCRP, HbA1c and Lp(a), was also not computed because the Lp(a) result is still pending. Once both arrive, they will be added to the report.\n\nTurning to his symptoms, the joint pain, stiffness, tendonitis and soft tissue injuries he describes are not explained by any inflammatory, autoimmune or structural marker in this panel. His CRP and ESR are both very low, ruling out systemic inflammation. Rheumatoid factor is negative, making rheumatoid arthritis very unlikely. Coeliac disease, which can cause joint pain, has been excluded. His calcium, phosphate, magnesium and vitamin D are all healthy, so bone and mineral metabolism is not contributing. Uric acid is within the ideal range, ruling out gout. His thyroid is normal. The bloods, in other words, have done their job by excluding the conditions that blood can measure, and that is useful information rather than a dead end. The most likely explanations for his pattern of tendonitis, tight muscles and soft tissue vulnerability sit outside what blood testing can see. Collagen and connective tissue quality is partly genetic and partly influenced by training load, recovery and nutrition. At five sessions per week with symptoms of poor recovery, it is possible that his training volume is exceeding his recovery capacity, particularly if he is not periodising intensity or building in deload weeks. Magnesium is excellent, but his B12 at 354 is below optimal, and B12 plays a role in nerve health and myelin maintenance, which is relevant given his history of nerve-related symptoms. Increasing B12 may help, though it is not guaranteed to be the full explanation. A physiotherapy assessment focused on movement patterns, tendon loading strategies and flexibility work would be more likely to address the root cause than any blood marker.\n\nFor the weight gain and difficulty losing weight, his metabolic health is excellent, with ideal insulin sensitivity, perfect blood sugar control and a well-functioning thyroid, so there is no hormonal or metabolic block to fat loss. The explanation is most likely a modest calorie surplus. At a BMI of 27.8 with a diet volume of 7 out of 10 and quality of 7 out of 10, he is eating slightly more than he is burning. The good news is that with his metabolic machinery in such good order, a moderate calorie deficit will produce results efficiently, and the fat loss will in turn improve his testosterone, his LDL and ApoB, and likely his joint symptoms through reduced load on tendons and connective tissue.","links":"The central thread in Rory's results is a lipid profile that needs attention in the context of otherwise excellent metabolic health. His ApoB at 1.14 and LDL at 3.65 are being driven by two modifiable factors: dietary saturated fat intake and a BMI of 27.8. The fact that his insulin sensitivity is ideal, his liver is completely clean, and his triglycerides are low tells us this is not a metabolic syndrome pattern. It is a diet-and-body-composition-driven elevation in a young man whose cardiovascular plumbing is otherwise in excellent shape, as shown by his HDL of 2.0 and his ApoB/A1 ratio of 0.60. The pending Lp(a) result will determine whether there is also a genetic component that cannot be modified.\n\nThe second thread connects his below-optimal testosterone at 17.3, his low SHBG at 18.9, and his excess body fat. Fat tissue produces aromatase, which converts testosterone to oestradiol. His oestradiol is not elevated, so aromatisation is not excessive, but as he loses body fat, testosterone will almost certainly rise. His bioavailable testosterone is actually high because the low SHBG leaves more unbound, so his tissues are not starved of androgen even though the total sits below the ideal threshold. Losing fat is the single intervention that will improve both the lipid profile and the testosterone level simultaneously.\n\nThe third thread is his symptom complex of joint stiffness, tendonitis, nerve issues and poor recovery. The bloods have systematically excluded the measurable causes: no inflammation, no autoimmune disease, no coeliac, no thyroid dysfunction, no mineral deficiency, no iron problem, no gout. What remains is a combination of connective tissue vulnerability, which may be constitutional, training load that exceeds recovery capacity, and a suboptimal B12 of 354 that could be contributing to the nerve component. This is a pattern best addressed through training modification, physiotherapy input and B12 optimisation rather than further blood testing.\n\nThe minor findings, MCHC marginally above range, absolute reticulocytes below range with a normal haemoglobin, low-normal white cells and neutrophils, and progesterone marginally below range, are all explainable by laboratory artefact, low demand on the bone marrow, constitutional variation, and the low clinical significance of progesterone in men respectively. None requires action or follow-up.","lifestyle":"Create a moderate calorie deficit by reducing portion sizes at your largest meal by roughly a quarter, keeping protein the same and cutting back the starch and fat. Anchor: serve onto a slightly smaller plate at dinner. Why: at a BMI of 27.8 with ideal insulin sensitivity, a 300 to 400 calorie deficit is the most efficient lever for fat loss, and losing fat will improve both your LDL cholesterol and your testosterone.\nAdd a palm-sized portion of protein to every meal and snack, aiming for at least 140 grams of protein across the day. Anchor: protein goes on the plate first, everything else fills around it. Why: protein preserves muscle during a deficit, supports tendon and connective tissue repair, and keeps you full, which matters when you are eating slightly less.\nSwap two portions of butter, cheese or fatty meat per week for oily fish, specifically salmon, mackerel or sardines. Anchor: make two dinners per week fish-based. Why: this directly replaces saturated fat, which is driving your LDL of 3.65 and ApoB of 1.14, with omega-3 fatty acids that lower triglycerides and reduce inflammation.\nAdd a daily portion of oats, barley or beans for soluble fibre. Anchor: porridge or overnight oats at breakfast, or a handful of beans added to lunch. Why: soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more, which is one of the most effective dietary tools for lowering ApoB.\nBuild one deload week into every four weeks of training, reducing volume by 40 to 50 percent. Anchor: every fourth Monday, halve the sets. Why: your symptoms of poor recovery, tendonitis and tight muscles suggest your training load is exceeding your recovery capacity, and structured deloads allow connective tissue to repair and adapt.\nAdd ten minutes of dedicated stretching or mobility work after every resistance session. Anchor: after the last set, before you leave the gym. Why: this addresses the tight muscles and stiffness you describe and supports tendon health alongside the strength work.\nWalk for fifteen minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: post-meal walking lowers the glucose and insulin response to that meal, supports the calorie deficit, and adds gentle movement that aids recovery without loading joints.","flags":"LDL cholesterol 3.65 mmol/L (ideal below 2.6, lab range below 3.0), ApoB 1.14 g/L (target below 0.9, ideal below 0.8), total cholesterol 6.1 mmol/L (desirable below 5.18), non-HDL cholesterol 4.1 (limit 4.0). These are one finding: diet-and-body-composition-driven elevation in atherogenic lipoproteins. HDL is excellent at 2.0 and ApoB/A1 ratio is 0.60, below the lower-risk threshold, so the protective side is strong. Lp(a) is pending and will clarify whether an inherited component is present. Recommend dietary saturated fat reduction and fat loss as first-line intervention, with lipid recheck in four to six months.\nTestosterone 17.3 nmol/L, below the optimal floor of 18 for a 30-year-old male, with SHBG 18.9 nmol/L sitting just above the lower limit of 17.3. Bioavailable testosterone is 11.26, above range, so tissue delivery is adequate. The below-optimal total is most likely driven by excess body fat and will improve with fat loss. Not urgent, but worth monitoring on retest.\nVitamin B12 354 pg/mL, within laboratory range (193 to 982) but below the optimal floor of 500. Relevant given his symptoms of nerve issues and soft tissue vulnerability. Supplementation with sublingual methylcobalamin recommended.\nC-Peptide 0.79 ug/L (approximately 261 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. In context of ideal fasting glucose (4.5), ideal HbA1c (33) and ideal fasting insulin (4.76), this reflects low insulin demand rather than pancreatic insufficiency. No action required.\nProgesterone 0.74 nmol/L, marginally below range of 0.89 to 3.88. In men, progesterone is produced in small amounts and at this margin the finding is not clinically significant.\nMCHC 348 g/L, marginally above the upper limit of 345. At this margin and with the lab noting temperature and storage effects, this is laboratory artefact rather than a clinical finding.\nAbsolute reticulocytes 37.5 x10^9/L, below range of 50 to 100, with percentage reticulocytes 0.73% within range. Haemoglobin, haematocrit and red cell count are all normal, so this reflects low demand on the bone marrow rather than marrow suppression.\nReassuring negatives: thyroid function and antibodies normal, CRP undetectable, ESR 4, rheumatoid factor negative, coeliac screen negative, liver enzymes and fibrosis scores excellent, kidney function excellent (Cystatin C eGFR 104), HOMA-IR 0.95, HbA1c 33, ferritin 128, iron studies balanced, PSA 1.01 with free ratio 0.53, immunoglobulins within range, IgE within range, cortisol normal, urinalysis clean.\nNot returned by the laboratory: Lp(a), Total Antioxidant Activity (TAA), bacterial count, urine culture and sensitivities. Lp(a) is clinically important and will be added when available.","recommendations":"Discuss the lipid findings with your GP: ApoB 1.14 (target below 0.9), LDL 3.65 (ideal below 2.6), total cholesterol 6.1, non-HDL 4.1. At 30 these do not require medication immediately, but they should be on record. The first-line intervention is dietary saturated fat reduction and fat loss, with a recheck in four to six months. If Lp(a) comes back elevated, this conversation becomes more urgent because it adds an inherited and unmodifiable risk layer.\nAsk your GP to note the Lp(a) result when it arrives. If it is above 32 nmol/L, it should be recorded permanently in your medical notes and your first-degree relatives should be tested.\nMention the B12 of 354 and your history of nerve and soft tissue symptoms. The GP may wish to check methylmalonic acid or homocysteine to assess functional B12 status, or may be content with supplementation and a recheck.\nA physiotherapy referral focused on tendon loading strategies, movement patterns and connective tissue resilience would be more productive for your joint and soft tissue symptoms than further blood investigation, given that inflammation, autoimmune markers and minerals are all clear.\nRetest in four to six months: lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB, Lp(a) if not yet received), testosterone, SHBG, B12. Targets by then: ApoB below 0.9, LDL below 3.0, testosterone above 18, B12 above 500, weight 80 to 83 kg. Calorie target for fat loss: approximately 2,100 to 2,300 kcal per day (TDEE estimated at 2,600 kcal using a moderate activity multiplier of 1.6 on a BMR of approximately 1,870 for a 30-year-old, 87 kg, 177 cm male, with a 300 to 500 kcal deficit). Protein target: 130 to 145 grams per day (1.5 to 1.7 g per kg of target body weight of 82 kg).","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Why: your B12 at 354 is below the optimal floor of 500, and given your history of nerve symptoms and soft tissue issues, optimising B12 supports nerve health, myelin maintenance and energy production. Sublingual delivery bypasses absorption issues in the gut.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with your largest meal. Why: omega-3 supports the shift away from saturated fat driving your ApoB of 1.14 and LDL of 3.65, and has an anti-inflammatory effect that may benefit your joint and tendon symptoms.\nVitamin D3: maintain your current supplementation but consider reducing to 2,000 IU daily with a fat-containing meal. Your level of 194 nmol/L is well above optimal and safe, but there is no benefit to pushing it higher. Pair with vitamin K2 (MK-7), 100 to 200 mcg daily, which directs calcium into bone rather than arteries.\nMagnesium glycinate: 300 to 400 mg before bed. Your magnesium is already at the top of the optimal range at 1.05, which is excellent, but glycinate specifically supports sleep quality, muscle relaxation and recovery, all of which are relevant to your training load and symptoms. If you are already supplementing, maintain the current dose.\nDo not take iron supplements. Your ferritin at 128, transferrin saturation at 42% and serum iron at 23.5 are all healthy and well-stocked. Additional iron would risk pushing stores too high.\nThe most important changes from this report are not supplements. They are the dietary shift away from saturated fat and towards soluble fibre and oily fish, the moderate calorie deficit to bring body weight to 80 to 83 kg, and the structured deload weeks that will let your connective tissue recover.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 63 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 62.8. Weakest systems: lipids & cardiovascular 19%, vitamins & nutrients 21%, glucose & insulin 77%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Vitamin D 25(OH), C-Peptide.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"18.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2657","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the bloodstream at the time the sample was taken. A fasting level of 4.5 mmol/L is right in the middle of the ideal range, indicating that Rory's body is regulating blood sugar precisely. This rules out insulin resistance and any drift towards pre-diabetes as explanations for his fatigue or weight difficulty.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin-producing tumours","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress response, high-carbohydrate meals before testing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3400","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c expressed as a percentage. At 5.1%, Rory is well below the 6.0% pre-diabetes threshold. This confirms excellent average blood sugar control over the past two to three months.","low_causes":"Very low carbohydrate diet, anaemia with high red cell turnover","high_causes":"Pre-diabetes, type 2 diabetes, consistently elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin that has been glycated, meaning sugar has attached to it, over the lifespan of a red blood cell (roughly 90 days). It is the gold-standard measure of average blood sugar control. Rory's result of 33 mmol/mol is comfortably below the 36 optimal ceiling and well below the 42 pre-diabetes threshold, confirming excellent long-term glucose management.","low_causes":"Very low carbohydrate diet, haemolytic anaemia, recent blood loss","high_causes":"Pre-diabetes, type 2 diabetes, consistently elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4296","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5751","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas to move glucose from the blood into cells. Fasting insulin reveals how hard the pancreas is working to keep blood sugar controlled. At 4.76 mIU/L, Rory's insulin sits within the ideal window of 2 to 8, meaning his pancreas is producing only what is needed. This is a strong positive at a BMI of 27.8, confirming his cells remain sensitive to insulin.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, pre-diabetes, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2393","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a fragment released in equal amounts to insulin when the pancreas produces it, and because it is cleared more slowly, it gives a stable picture of how much insulin the pancreas is making. Rory's result of 0.79 ug/L (approximately 261 pmol/L) is below the laboratory range of 1.1 to 4.4. However, in the context of a perfect fasting glucose of 4.5, an ideal HbA1c of 33 and a healthy fasting insulin of 4.76, this simply reflects low insulin demand. His pancreas is producing exactly what is needed, no more, which is the hallmark of excellent metabolic health rather than pancreatic insufficiency.","low_causes":"Low insulin demand in insulin-sensitive individuals, fasting, low carbohydrate diet, sample degradation if not promptly separated","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaveragegluco
