sult":"1.177","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3858","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5587","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate balance in the blood. When calcium drops, PTH rises to pull calcium from bone and increase gut absorption. At 1.177 pmol/L, Rory's PTH is low-normal, which is exactly what we would expect when vitamin D is replete at 194. The strong vitamin D supply means the body does not need to push PTH up to maintain calcium levels.","low_causes":"High calcium, high vitamin D, surgical removal of parathyroid glands","high_causes":"Vitamin D deficiency, chronic kidney disease, primary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"354","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4038","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5376","upper_optimal_position":"0.6032","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. At 354 pg/mL, Rory is within the laboratory range but below the optimal floor of 500. Given his specific symptoms of nerve issues, soft tissue injuries and poor recovery, optimising B12 towards 500 or above is worthwhile. Sublingual methylcobalamin is the recommended form for supplementation as it is well absorbed and already in the active form the body uses.","low_causes":"Inadequate dietary intake (vegetarian or vegan diets), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and neural development. At 16 ng/mL, Rory's folate is at the top of the range and well within optimal, confirming excellent folate status from his diet.","low_causes":"Poor dietary intake, alcohol, malabsorption, coeliac disease, medications (methotrexate)","high_causes":"Supplementation, excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5893","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including the protective HDL and the atherogenic LDL and VLDL fractions. At 6.1 mmol/L, this is above the desirable limit of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk. In Rory's case, his excellent HDL of 2.0 accounts for a third of the total, meaning the elevated number is partly driven by a high level of the protective fraction. The more useful measures, ApoB and LDL, are discussed separately.","low_causes":"Malnutrition, hyperthyroidism, liver disease, very low fat diet","high_causes":"High saturated fat diet, genetic predisposition, hypothyroidism, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3324","lower_normal":"0","upper_normal":"1.70","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the bloodstream, primarily influenced by carbohydrate intake, alcohol, and body fat. At 1.13 mmol/L, Rory's triglycerides are within the fasting limit of 1.70 but above the tighter optimal of 1.0. This is not a concern in isolation but does contribute slightly to the atherogenic lipid load. The moderate calorie deficit and reduction in refined carbohydrates recommended for fat loss will bring this into the ideal range.","low_causes":"Low fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High carbohydrate or sugar diet, alcohol, obesity, insulin resistance, hypothyroidism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3269","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. At 0.51 mmol/L, this is within the ideal range and confirms that the liver is not overproducing triglyceride-rich particles.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9615","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL cholesterol is the protective fraction that removes excess cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. At 2.0 mmol/L, Rory's HDL is genuinely excellent, well above the ideal threshold of 1.4 for men. This provides strong cardiovascular protection and is one of the best results in this panel. High HDL runs in some families and is also supported by regular exercise.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, anabolic steroids","high_causes":"Regular exercise, moderate alcohol, genetic predisposition, low body fat","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5767","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL cholesterol carries cholesterol from the liver to tissues, and when present in excess, deposits it in artery walls, forming plaques that narrow and stiffen arteries over decades. At 3.65 mmol/L, Rory's LDL is above the laboratory ceiling of 3.0 and above the ideal target of 2.6. At 30, this level will not cause an event soon, but it represents years of cumulative arterial exposure. Reducing dietary saturated fat, increasing soluble fibre, and losing the excess body fat are the first-line interventions that can bring this back towards 2.6.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption, genetic variation","high_causes":"High saturated fat diet, genetic predisposition, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3389","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. It is a quick measure of the balance between total and protective cholesterol. At 3.05, well below the 4.5 threshold and within the ideal range, this confirms that despite the elevated total cholesterol, the high HDL keeps the ratio favourable.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"32.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8198","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the circulating cholesterol is the protective type. At 32.79%, nearly a third of Rory's total cholesterol is HDL, which is well above the 20% minimum and the 28% optimal floor. This is an excellent ratio.","low_causes":"Sedentary lifestyle, obesity, high triglycerides","high_causes":"High HDL, exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol fractions in one number: LDL, VLDL and intermediate-density lipoproteins. At 4.1 mmol/L, Rory's non-HDL is just above the 4.0 limit. This reflects the elevated LDL and is part of the same lipid story. The same dietary and body composition interventions that lower LDL will bring non-HDL below 4.0.","low_causes":"Low LDL, low triglycerides, very low fat diet","high_causes":"High LDL, high triglycerides, high saturated fat diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7875","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein on HDL particles, and its level reflects the total number and function of HDL particles available for reverse cholesterol transport. At 1.89 g/L, this is excellent and confirms that Rory's outstanding HDL level is backed by a strong HDL particle count.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein on every LDL, VLDL and Lp(a) particle. One ApoB molecule per particle, so the ApoB level is the single best count of how many atherogenic particles are circulating. At 1.14 g/L, Rory's ApoB is above the 0.9 desirable limit and well above the 0.8 ideal target. This is the most important cardiovascular marker in this panel and the number that most directly predicts long-term artery damage. At 30, the priority is to bring this below 0.9 through dietary changes and fat loss before considering medication.","low_causes":"Low fat diet, hyperthyroidism, genetic variation, malnutrition","high_causes":"High saturated fat diet, genetic predisposition, obesity, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.603175","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4308","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is one of the most powerful predictors of cardiovascular risk. It compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). At 0.60, Rory's ratio is below the 0.7 lower-risk threshold, just at the optimal ceiling. This means his strong HDL and ApoA1 are partially offsetting the elevated ApoB, keeping the overall balance in the favourable zone. However, lowering ApoB would improve this ratio further.","low_causes":"High HDL, low LDL, healthy lifestyle","high_causes":"High LDL, low HDL, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"to follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"32","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined lipoprotein particle that accelerates cholesterol deposition in artery walls and promotes blood clotting. It cannot be changed by diet, exercise or lifestyle. This result is pending and will be added to the report when it arrives. If elevated, it would mean part of Rory's cardiovascular risk is inherited and permanent, making the modifiable risk factors (LDL, ApoB, body fat) even more important to optimise.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"149","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4625","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme released when muscle cells are damaged or stressed. It is commonly elevated after intense resistance training. At 149 U/L, Rory's CK is mid-range and healthy, suggesting his muscles are recovering adequately between sessions despite his reports of poor recovery. This is a reassuring finding.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5893","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound, storage form of thyroid hormone produced by the thyroid gland. It must be converted to the active form, T3, before cells can use it. At 20.1 pmol/L, Rory's FT4 sits right at the top of the optimal range, indicating the thyroid is producing plenty of hormone. This is a healthy and well-functioning thyroid.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, early Hashimoto's (transient), excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4353","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4399","upper_optimal_position":"0.4753","units":"mIU/L","description":"TSH is the signal from the pituitary gland telling the thyroid how hard to work. When the thyroid is producing enough hormone, TSH stays low; when it is struggling, TSH rises. At 1.84 mIU/L, Rory's TSH is within the optimal window of 1.0 to 2.5, confirming the brain and thyroid are communicating well and the thyroid is working at an appropriate level.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells use to regulate metabolism, energy production, heart rate and body temperature. At 5.9 pmol/L, solidly within the optimal range of 4.5 to 6.5, this confirms excellent thyroid output and good conversion from the storage form T4 to the active T3. This rules out thyroid dysfunction as a cause of Rory's fatigue or weight difficulty.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as seen in Hashimoto's thyroiditis. At below 6.6, Rory's result is negative, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. When elevated, they suggest autoimmune thyroid disease. At below 1.3, Rory's result is well below the cut-off and negative, providing further confirmation that his thyroid is healthy with no autoimmune process.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.294","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio assesses how efficiently the body converts the storage thyroid hormone (T4) to the active form (T3). At 0.294, within the optimal range, this confirms efficient thyroid hormone conversion and a well-functioning thyroid system.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"PSA (Prostate Specific Antigen)","group":"PROSTATE","result":"1.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2020","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/mL","description":"PSA is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, inflammation or, rarely, prostate cancer. At 1.01 ng/mL, well below the 2.5 threshold for a 30-year-old, Rory's prostate health looks excellent. This establishes a useful baseline for future comparison.","low_causes":"","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the unbound fraction of total PSA. When a high proportion of PSA is free (as opposed to bound to proteins), it is more reassuring. At 0.53 with a total PSA of 1.01, the free ratio is 0.525 (52.5%), which is very reassuringly high and consistent with a healthy prostate.","low_causes":"","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"PSA Ratio (Free/Total)","group":"PROSTATE","result":"0.525","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps distinguish benign from concerning causes of elevated PSA. A ratio above 0.25 is reassuring. At 0.525, Rory's ratio is very high, indicating the PSA present is overwhelmingly the benign type. Excellent prostate health.","low_causes":"Prostate cancer (lower proportion of free PSA)","high_causes":"Benign prostatic hyperplasia, healthy prostate","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0304","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic and gastrointestinal cancers. At 2.25 U/mL, well below the 37 threshold, this is a reassuring normal result. It is used as a screening baseline rather than a diagnostic tool.","low_causes":"","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA (Carcinoembryonic Antigen)","group":"TUMOR MARKERS","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1739","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA is a tumour marker that can be elevated in colorectal, lung and other cancers, as well as in smokers. At 0.8 ng/mL, well below the 2.3 limit for a non-smoker, this is a reassuring normal result.","low_causes":"","high_causes":"Colorectal cancer, lung cancer, breast cancer, pancreatic cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"13.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5544","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and provides the majority of antibody-based immunity against infections. At 13.3 g/L, this is within the laboratory range, indicating a normally functioning adaptive immune system.","low_causes":"Immune deficiency, medications (corticosteroids, immunosuppressants), nephrotic syndrome","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6133","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgM is the first antibody produced during an immune response and plays a key role in early defence against infections. At 2.6 g/L, this is within the laboratory range, indicating a healthy immune response.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5054","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgA is the main antibody found in mucosal surfaces, including the gut, respiratory tract and saliva. At 2.1 g/L, this is within the laboratory range and confirms healthy mucosal immunity. IgA adequacy is also important for interpreting the coeliac screen (tTG IgA), which relies on IgA being present to detect coeliac antibodies.","low_causes":"Selective IgA deficiency (common), medications","high_causes":"Chronic infection, liver disease, autoimmune conditions, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"52.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2620","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"IgE is the antibody involved in allergic responses and parasitic infections. At 52.4 IU/mL, within the 100 limit, this is normal and does not suggest an active allergic or parasitic process.","low_causes":"Normal variation, immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor (RF)","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody often elevated in rheumatoid arthritis and other autoimmune conditions. At below 4 IU/mL, well under the 14 threshold, this is negative and makes rheumatoid arthritis very unlikely as an explanation for Rory's joint pain and stiffness.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, systemic lupus, chronic infection, age","padding":"1","one_sided":"0.5","range_type":"no lower"}, rimary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. At 316 nmol/L, within the morning reference range, Rory's cortisol is within the ideal window, suggesting his stress axis is functioning normally and his adrenal glands are producing an appropriate amount of cortisol.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic fatigue","high_causes":"Chronic stress, Cushing's syndrome, acute illness, corticosteroid medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol (E2)","group":"HORMONES","result":"65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2224","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4106","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, produced mainly through the conversion of testosterone by the enzyme aromatase in fat tissue. At 65 pmol/L, within range and within the ideal window, this confirms that aromatisation is not excessive despite the slightly elevated body fat. As body fat decreases, oestradiol may decrease slightly, which would allow a mild rise in testosterone.","low_causes":"Very low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity, excess aromatisation, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2478","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It has roles in mood, sleep and balancing other steroid hormones. At 0.74 nmol/L, marginally below the laboratory range of 0.89 to 3.88, this is not clinically significant in men. Progesterone is not routinely used to guide treatment decisions in males, and at this small margin below range, it does not require action.","low_causes":"Normal variation in men, adrenal stress, low cholesterol substrate","high_causes":"Adrenal hyperplasia, testicular tumours (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"3.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4045","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5385","units":"mIU/mL","description":"LH is a pituitary hormone that signals the testes to produce testosterone. At 3.11 mIU/mL, within the ideal range, this confirms the brain-to-testes signalling pathway is intact and functioning normally.","low_causes":"Pituitary disease, anabolic steroid use, obesity, opioid use","high_causes":"Primary hypogonadism (testicular failure), Klinefelter syndrome, age","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"4.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4849","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5193","units":"mIU/mL","description":"FSH is a pituitary hormone that in men supports sperm production. At 4.05 mIU/mL, within the ideal range, this confirms no tation but which in men can suppress testosterone and libido when elevated. At 129 uIU/mL, well within the ideal range, this is a healthy result and confirms the pituitary is not overproducing prolactin.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary tumour (prolactinoma), medications (antipsychotics, SSRIs), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index (FAI)","group":"HORMONES","result":"91.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5127","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active by comparing total testosterone to SHBG. At 91.53, this is within the ideal range, confirming that despite the total testosterone being just under optimal, the low SHBG means a high proportion of it is available to tissues. This is a functional positive.","low_causes":"High SHBG, low testosterone, liver disease, thyroid disease","high_causes":"Low SHBG, obesity, insulin resistance, polycystic ovary syndrome (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4212","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4537","upper_optimal_position":"0.5463","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 3.8 umol/L (approximately 1,400 ug/dL), this is within the ideal range for a 30-year-old, confirming healthy adrenal function.","low_causes":"Adrenal insufficiency, ageing, chronic illness, corticosteroid use","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"18.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3440","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3825","upper_optimal_position":"0.5951","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds to testosterone and oestradiol, making them inactive. At 18.9 nmol/L, just above the lower limit of 17.3 but below the optimal floor of 25, Rory's SHBG is low. Low SHBG is commonly associated with insulin resistance and excess body fat, though in Rory's case his insulin sensitivity is excellent, so the body composition is the more likely driver. The practical effect of low SHBG is that more testosterone is free and available to tissues, which is why his bioavailable testosterone and Free Androgen Index are healthy despite the total being just under optimal. As body fat decreases, SHBG will likely rise towards the ideal range.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use, polycystic ovary syndrome (women)","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4451","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.25","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_posi function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  if(norm(dob.value)===norm(data.dob)){

    runIntro();
  } else {

  }
}
