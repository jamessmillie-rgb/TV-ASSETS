L are counterbalancing the borderline ApoB.","low_causes":"","high_causes":"High ApoB, low ApoA1","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"49.89","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7795","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is an inherited lipoprotein particle that behaves like a stickier version of LDL. It is entirely genetically determined and does not change with diet, exercise or most medications. At 49.89 nmol/L, this is above the ideal threshold of 32 but within the normal range and below the level of approximately 125 nmol/L at which it is generally considered to add meaningful independent cardiovascular risk. It is worth knowing about alongside his other lipid markers but is not a concern on its own at this level.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, cannot be modified by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol left behind in the bloodstream after triglyceride-rich particles (VLDL and chylomicrons) have been partially broken down. At 0.94 mmol/L, above the upper limit of 0.8 and the optimal ceiling of 0.5, this is directly driven by the elevated triglycerides and VLDL. Remnant cholesterol is increasingly recognised as an independent cardiovascular risk factor. It will come down as triglycerides improve.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"6.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. At 6.3 mmol/L, this is above the upper limit of 6.0, placing it in the impaired fasting glucose range (6.1 to 6.9). This means the body is no longer able to fully clear glucose from the blood overnight, despite the elevated insulin levels. Combined with the HOMA-IR of 6.34, this confirms that the pancreas is working hard to compensate for insulin resistance but is beginning to fall behind. With a family history of type 2 diabetes, this is the most important metabolic finding to address.","low_causes":"Fasting, excessive insulin, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, infection","padding":"1","one_sided":"0","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4917","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar over the preceding two to three months. At 5.9 percent, this is within the normal range (below 6.0) but very close to the pre-diabetes threshold of 6.0 to 6.4 percent. It mirrors the mmol/mol value of 41 and confirms that average blood sugar has been running higher than ideal for several months.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised unit for glycated haemoglobin. At 41 mmol/mol, this is one point below the pre-diabetes threshold of 42, and well above the optimal ceiling of 36. Normal is below 42, pre-diabetes is 42 to 47, and diabetes is 48 or above. At 41, this is at the upper boundary of normal and warrants close monitoring and active dietary intervention, especially given the family history of type 2 diabetes.","low_causes":"Haemolytic anaemia, blood loss","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"22.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6332","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures the amount of the hormone insulin circulating in the blood after an overnight fast. Insulin is produced by the pancreas to drive glucose into cells for energy. When cells become resistant to insulin's signal, the pancreas has to produce more to achieve the same effect. At 22.66 mIU/L, this is within the laboratory range of 2.6 to 24.9 but far above the optimal ceiling of 8. His pancreas is producing roughly three times the ideal amount of insulin to keep blood sugar only marginally above range. This is the hallmark of insulin resistance: the body is compensating, but the compensation is reaching its limit.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate, obesity, pre-diabetes","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4879","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.02","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5273","units":"ug/l","description":"C-Peptide is a byproduct released in equal measure every time the pancreas produces insulin. Because it is not cleared as quickly as insulin, it gives a more stable picture of pancreatic insulin output. At 2.63 ug/L, this is within range and confirms the pancreas is producing a large amount of insulin, consistent with the insulin resistance pattern. The pancreas is working hard but is still functional, which is the window of opportunity for intervention.","low_causes":"Type 1 diabetes, low insulin demand, low carbohydrate diet","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"6.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculated index that multiplies fasting insulin by fasting glucose and divides by a constant. It is the most commonly used measure of insulin resistance. At 6.34, this is well above the upper limit of 1.5 and far above the significant insulin resistance threshold of 2.9. A score below 1.0 indicates optimal insulin sensitivity. His score of 6.34 confirms established insulin resistance, meaning his cells are requiring more than six times the ideal insulin signal to respond. This is the single most actionable finding in the report.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, obesity, excess carbohydrate, sedentary lifestyle, metabolic syndrome","padding":"1","one_sided":"0","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4857","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and represents the average blood sugar level over the past two to three months. At 6.8 mmol/L, within the normal ceiling of 7.0 but above the optimal ceiling of 6.2, this confirms that blood sugar has been running higher than ideal on average, consistent with the insulin resistance pattern.","low_causes":"Low carbohydrate diet, excellent insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"9.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5347","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and fasting glucose into a single metric of insulin resistance that does not depend on the insulin assay. At 9.41, above the upper limit of 8.8 and the optimal ceiling of 8.5, this independently confirms the insulin resistance pattern seen in the HOMA-IR. Both triglycerides and glucose are contributing.","low_causes":"Excellent insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein is a marker of systemic inflammation produced by the liver in response to inflammatory signals from anywhere in the body. At 0.7 mg/L, well within the optimal ceiling of 1.0, this is an excellent result, particularly at a BMI of 29.7 where visceral fat typically pushes CRP upward. It tells us there is no significant systemic inflammation despite the metabolic findings.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. A faster rate suggests inflammation. At 2 mm/hour, this is as low as it gets, confirming the absence of systemic inflammation. This is particularly relevant alongside his joint pain: an ESR of 2 alongside a CRP of 0.7 and a negative rheumatoid factor makes inflammatory arthritis very unlikely as the cause of his symptoms.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4289","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio divides the platelet count by the lymphocyte count and is used as a broad marker of inflammation and immune activation. At 103, within the optimal band of 80 to 160, there is no concern.","low_causes":"","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"195","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3967","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The systemic immune-inflammation index combines neutrophils, platelets and lymphocytes into a single metric. At 195, within the optimal band, this confirms low systemic inflammation. The relatively low neutrophil count (from the benign ethnic neutropenia pattern) keeps this index in a favourable range.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium regulates fluid balance and nerve and muscle function. At 139 mmol/L, within both the laboratory and optimal ranges, this is healthy and confirms normal fluid balance.","low_causes":"Overhydration, heart failure, kidney disease, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 95 mmol/L, this sits at the very bottom of the laboratory range and below the optimal floor of 98. At this margin, it is not a clinical concern but is worth noting.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4545","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's main buffer for maintaining blood pH. At 24 mmol/L, within both the laboratory and optimal ranges, acid-base balance is normal.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5205","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/l","description":"Calcium is essential for bone structure, muscle contraction, nerve signalling and blood clotting. At 2.4 mmol/L, within both the laboratory and optimal ranges, calcium regulation is healthy. Given his mother's osteoporosis, maintaining optimal calcium intake and vitamin D levels is important for his long-term bone health.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of the calcium that is physiologically active. At 2.33 mmol/L, within both ranges, calcium regulation is normal.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D","padding":"1","one_sided":"0","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6494","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function, insulin signalling and sleep regulation. At 1.08 mmol/L, within the laboratory range but slightly above the optimal ceiling of 1.05, this reflects his recent magnesium glycinate supplementation. Having paused supplementation, this will drift down. Magnesium is particularly important for him given the insulin resistance, as magnesium improves insulin sensitivity, and the sleep and stress issues, as it supports relaxation and sleep quality.","low_causes":"Poor diet, alcohol, diarrhoea, certain medications, insulin resistance","high_causes":"Supplementation, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"393","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5097","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in red meat, seafood and alcohol. The kidneys excrete it, but insulin resistance reduces this excretion, allowing levels to rise. At 393 umol/L, within the laboratory range but above the male optimal ceiling of 380, this is mildly elevated and fits the insulin resistance cluster. Sustained elevation increases the risk of gout and kidney stones. It should come down as insulin sensitivity improves.","low_causes":"Low purine diet, kidney disease (certain types)","high_causes":"Insulin resistance, alcohol, purine-rich diet, kidney impairment, gout","padding":"1","one_sided":"0","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/l","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. At 6.7 mmol/L, within both ranges, kidney clearance of protein waste is normal.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, kidney disease, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5214","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a constant rate. At 87 umol/L, within both ranges, this is healthy for a man of his build who does resistance training.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high protein diet, creatine supplementation, high muscle mass","padding":"1","one_sided":"0","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"ml/min/1.73m2","description":"Estimated glomerular filtration rate based on creatinine estimates how well the kidneys filter waste. A value above 90 indicates normal kidney function. His result is above 90, confirming healthy kidneys. The lab note suggests multiplying by 1.21 for patients of African origin, which would place it even higher.","low_causes":"Kidney disease, dehydration, obstruction","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4318","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4545","units":"mg/l","description":"Cystatin C is a protein produced by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function in people who train with weights or have a larger build. At 0.95 mg/L, wi as it should. This pattern impairs sleep quality, worsens insulin resistance and contributes to abdominal fat storage.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, acute illness, corticosteroid use","padding":"1","one_sided":"0","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4172","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3735","upper_optimal_position":"0.5792","units":"umol/L","description":"DHEA-S is a precursor hormone produced by the adrenal glands that converts into testosterone and oestradiol. It declines with age. At 3.7 umol/L, within range, adrenal hormone production is healthy for a 40-year-old man.","low_causes":"Aging, adrenal insufficiency, chronic stress","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (women)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"11.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"3.8","upper_normal":"20","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3580","upper_optimal_position":"0.5638","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and the loosely albumin-bound fraction, representing the testosterone available to tissues. At 11.53 nmol/L, within the optimal band of 5 to 15, this is healthy and consistent with the overall testosterone picture.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5 al_position":"0.5863","units":"pmol/l","description":"Free T4, or free thyroxine, is the storage form of thyroid hormone circulating in the blood. The thyroid releases it and peripheral tissues convert it into the active form, T3. At 20.3 pmol/L, within the laboratory range and just above the optimal ceiling of 20, the thyroid is producing an ample supply of T4.","low_causes":"Hypothyroidism, Hashimoto's, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the active thyroid hormone that drives metabolism, energy and body temperature. At 5.1 pmol/L, within the optimal band of 4.5 to 6.5, the body is converting T4 to T3 adequately and the active thyroid hormone level is healthy.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, low calorie intake","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies are immune proteins that attack thyroid peroxidase, an enzyme the thyroid needs to make its hormones. Elevated TPO antibodies indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At below 6.6 U/mL, well within range, there is no evidence of autoimmune thyroid attack.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to store and produce hormones. Elevated levels indicate autoimmune thyroid disease. At below 1.3 U/mL, well within range and consistent with the majority of the population, there is no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.251","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.251, within the reference range, and with FT3 in the optimal band and FT4 just above its optimal ceiling, conversion from T4 to T3 is adequate and the body's needs are being met. No action is needed, but optimising selenium and zinc intake may support conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"110","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and insulin sensitivity. It is produced in the skin from sunlight and supplemented through diet and capsules. At 110 nmol/L, within the optimal band of 75 to 120, this is an excellent level that reflects his recent supplementation. However, he has paused his D3, and given his darker skin pigmentation (which reduces UVB-driven vitamin D synthesis), his BMI of 29.7 (fat tissue sequesters vitamin D), and the UK winter, this level will fall without supplementation. Resuming D3 at 3,000 to 4,000 IU daily is important, especially given his mother's osteoporosis.","low_causes":"Lack of sunlight, dark skin, obesity, malabsorption, winter season","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"481","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4550","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 481 pg/mL, within the laboratory range but below the optimal floor of 500, this is adequate but not ideal. B12 comes from animal products, and his standard mixed diet likely provides some, but levels below 500 are associated with suboptimal nerve and cognitive function. Sublingual methylcobalamin supplementation would bring this into the optimal band.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, red blood cell production and methylation, the process the body uses to regulate gene expression, detoxification and neurotransmitter production. At 7 ng/mL, within the laboratory range but below the optimal floor of 8, this is directly explained by his diet providing only 0 to 1 portions of vegetables and fruit per day. Folate comes primarily from green leafy vegetables, beans and lentils. Increasing vegetable intake is the primary intervention, with a methylfolate supplement as a bridge.","low_causes":"Low vegetable intake, alcohol, coeliac disease, pregnancy, medications","high_causes":"Supplementation, B12 deficiency (functional folate trap)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4338","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","low function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
