<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Philmon Habtai","dob":"15/10/1986","report_date":"2026-10-31","summary":"Customer is a 40-year-old male presenting with a BMI of 29.7, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). He trains 3 times per week (resistance only, moderate intensity) with 2,000 to 5,000 daily steps. He sleeps 6 to 7 hours, feels tired most mornings, with energy that is lowest on waking; stress feels hard to manage most days. Alcohol intake is 5 to 9 drinks per week. He takes creatine 2 to 3 days per week and has recently paused vitamin D3, K2, omega-3, zinc and magnesium glycinate for the past couple of weeks. His family history includes type 2 diabetes in his father, prostate cancer in his father, and osteoporosis in his mother. He has not had previous blood testing. He reports low energy and fatigue, low mood and anxiety, bloating and digestive discomfort, and joint pain and stiffness, all of which have been present for as long as he can remember. His goals are to lose body fat, build muscle and improve long-term health and longevity. He is particularly interested in his metabolic health and risk of insulin resistance given his father's type 2 diabetes, and he describes long-standing joint sensitivity and pain in his knees, left hip, left elbow and lower back dating back to his teens.\n\nThe most important finding in this report is the metabolic picture, and it confirms the concern he came to us with. His fasting glucose is 6.3 mmol/L, above the upper limit of 6.0, and his HbA1c is 41 mmol/mol, which sits one point below the threshold of 42 that defines pre-diabetes. HbA1c is a measure of average blood sugar over the preceding two to three months, built from how much glucose attaches itself to haemoglobin in red blood cells. At 41, this is technically within the normal band but pressing against the ceiling. His fasting insulin, the hormone the pancreas releases to drive glucose out of the bloodstream and into cells, is 22.66 mIU/L. That is inside the laboratory range of 2.6 to 24.9 but far above the optimal zone of 2 to 8. The body is having to produce roughly three times the ideal amount of insulin to keep blood sugar only marginally above range. That effort is captured by his HOMA-IR, a calculated index of insulin resistance. His score is 6.34, against an upper limit of 1.5 and an optimal ceiling of 1.0. A score above 2.9 is considered significant insulin resistance, and his sits well above that threshold. His C-Peptide, a byproduct released in equal measure every time the pancreas makes insulin and therefore a reliable gauge of how hard the pancreas is working, is 2.63 ug/L, comfortably within range but confirming the high insulin output. His TyG index, which combines triglycerides and glucose into a single insulin resistance metric, is 9.41 against an upper limit of 8.8, reinforcing the same story. His estimated average glucose, derived from HbA1c, is 6.8 mmol/L, within the normal ceiling of 7 but above the optimal ceiling of 6.2. What all of this means, taken together, is that his body is compensating for insulin resistance by flooding the system with insulin, and the compensation is just about holding. The fasting glucose slipping above range and the HbA1c sitting one point below pre-diabetes tell us the compensation is starting to fall short. With a father who has had type 2 diabetes for many years, this is the pattern that, left unaddressed, progresses in exactly that direction. The encouraging news is that at this stage the trajectory is entirely modifiable. Diet, body composition and activity are the three levers, and all three have significant room for improvement.\n\nHis triglycerides are 2.43 mmol/L, above the desirable fasting threshold of 1.70, and his VLDL cholesterol, the lipoprotein particle the liver assembles to export triglycerides into the bloodstream, is 1.1 mmol/L against an upper limit of 0.78. Elevated triglycerides and VLDL are driven primarily by insulin resistance and dietary carbohydrate and sugar, and they sit squarely inside the metabolic pattern described above. His total cholesterol is 5.3 mmol/L, marginally above the desirable threshold of 5.18. His LDL cholesterol, the particle that deposits cholesterol into artery walls, is 2.66 mmol/L, within the laboratory range of 0.5 to 3.0 but above the optimal ceiling of 2.6. His ApoB, a direct count of the number of atherogenic lipoprotein particles in the blood and a more accurate measure of cardiovascular risk than LDL alone, is 0.9 g/L, at the upper boundary of the desirable range. When the triglycerides are high, standard LDL calculations can undercount the number of small, dense LDL particles, which is why ApoB is the better marker here. His Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) particles to show only the modifiable portion, is 2.5 mmol/L, confirming that most of his LDL burden is diet and lifestyle driven. His Lp(a) is 49.89 nmol/L, above the ideal threshold of 32 but within the normal range and below the level of approximately 125 nmol/L at which it is generally considered to add meaningful independent cardiovascular risk. Lp(a) is an inherited lipoprotein particle that behaves like a stickier version of LDL; it cannot be changed by diet or exercise. At this level it is worth knowing about but is not a concern on its own. His remnant cholesterol, the cholesterol carried by triglyceride-rich particles, is 0.94 mmol/L, above the optimal ceiling of 0.5 and the normal ceiling of 0.8, driven directly by the elevated triglycerides. His cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 30 out of 100, above the ideal ceiling of 20 but within the acceptable ceiling of 40. The two inputs driving the score are the triglycerides and the ApoB. The bright spot in the lipid panel is his HDL cholesterol at 1.7 mmol/L, well above the desirable threshold of 1.55 and inside the optimal band above 1.4 for a man. His ApoA1, the protein on the surface of HDL particles, is 1.86 g/L, excellent. His ApoB to ApoA1 ratio is 0.484, well within the lower risk band below 0.7. His TC to HDL ratio is 3.12, healthy. His atherogenic index of plasma is 0.155, within range. The overall cardiovascular picture is one of strong protective factors being offset by the metabolic load of insulin resistance and excess triglycerides. Addressing the insulin resistance will bring the triglycerides, VLDL, remnant cholesterol and ApoB down together.\n\nHis full blood count shows a pattern worth explaining. His neutrophils are 1.89 x10^9/L, just below the lower limit of 2.0, and his monocytes are 0.14 x10^9/L, below the lower limit of 0.2. His lymphocytes are 3.29 x10^9/L, marginally above the upper limit of 3.0. Neutrophils are the first-response white cells the immune system sends to bacterial infections; lymphocytes handle viral defence and longer-term immune memory; monocytes are the clean-up and repair cells. In people of Black African and Caribbean ancestry, a pattern of lower neutrophil counts alongside relatively higher lymphocyte counts is well recognised and is called benign ethnic neutropenia. It is not a disease, it does not increase susceptibility to infection, and it does not need treatment. It is simply a normal variation in how white cells are distributed. His total white cell count is 5.39 x10^9/L, comfortably within range, which supports this interpretation. The marginally low monocytes fit the same redistribution pattern. His neutrophil-to-lymphocyte ratio, or NLR, is 0.57, below the lower limit of 1.0, which is entirely explained by the ethnic distribution rather than by any inflammatory or immune problem. His ESR, erythrocyte sedimentation rate, a broad marker of inflammation, is 2 mm/hour, essentially as low as it can be. His hs-CRP, a more sensitive inflammation marker, is 0.7 mg/L, within the optimal band below 1.0. At a BMI of 29.7, a CRP this low is a genuinely positive finding, because visceral fat typically pushes CRP upward. The platelet-to-lymphocyte ratio is 103, and the systemic immune-inflammation index is 195, both comfortably within their optimal bands. The rest of the blood count is clean: haemoglobin 148 g/L, red cells 5.12, haematocrit 0.434, MCV 84.9, MCH 29, MCHC 342, platelets 339, reticulocytes 1.2 percent with an absolute count of 61.44, RDW 13.9, MPV 9.2, eosinophils and basophils within range. There is no anaemia, no sign of abnormal red cell production, and no platelet concern.\n\nHis liver function is largely reassuring but not quite clean. His ALT is 41 IU/L, within the laboratory ceiling of 56 but above the optimal ceiling of 30 for a man. ALT is the enzyme most specific to the liver; when liver cells are under strain, they release more of it. At 41, this is a mild elevation most likely driven by the insulin resistance and early fatty infiltration that accompanies it. His GGT is 42 IU/L, within the male range of 4 to 73 but above the optimal ceiling of 25. GGT rises with metabolic strain, alcohol and fatty liver. With 5 to 9 drinks per week and the insulin resistance pattern, both are contributing. His AST is 31 IU/L, within range. His AST to ALT ratio, or De Ritis ratio, is 0.76, just below the optimal lower bound of 0.8, which is a pattern seen when ALT is mildly pushed up by fatty change rather than by significant liver injury. His FIB-4 score, a fibrosis screening index, is 0.57, well below the threshold of 1.45, ruling out any significant liver scarring. His APRI score is 0.229, well within range. His NAFLD fibrosis score is minus 2.905, within the safe band. Alkaline phosphatase is 78, bilirubin 8, albumin 45, total protein 79, globulin 34, all within range. Amylase and lipase, the pancreatic enzymes, are 86 and 42 respectively, both within range, with no sign of pancreatic strain. The liver is under mild metabolic pressure from the insulin resistance and alcohol combined, but there is no scarring and no significant injury.\n\nHis kidney function is excellent. His cystatin C is 0.95 mg/L, within range, giving a cystatin C-based eGFR of 96 mL/min, and the combined creatinine plus cystatin C eGFR is also 96. Cystatin C is a more reliable measure of kidney filtration at higher body weights because it is not influenced by muscle mass in the way creatinine can be. Both confirm healthy kidneys. His urea is 6.7 mmol/L, creatinine 87 umol/L, urea-to-creatinine ratio 77, sodium 139, chloride 95, bicarbonate 24, all within range. His serum osmolality is 291 mOsm/kg, within the optimal band. His uric acid is 393 umol/L, within the laboratory range of 220 to 547 but above the optimal ceiling of 380 for a man. Uric acid rises with insulin resistance because insulin reduces the kidney's ability to excrete it; it is part of the same metabolic cluster and will come down with the same interventions.\n\nHis thyroid is working well. TSH is 1.41 mIU/L, within the optimal band of 1.0 to 2.5. Free T4 is 20.3 pmol/L, within the laboratory range and just above the optimal ceiling of 20. Free T3, the active thyroid hormone, is 5.1 pmol/L, within the optimal band of 4.5 to 6.5. His FT3-to-FT4 ratio is 0.251, within range but just below the optimal lower bound of 0.27, which suggests conversion from T4 to T3 is adequate but not especially efficient. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease.\n\nHis hormones are in a healthy place. Testosterone is 21.2 nmol/L, within the optimal band of 18 to 30 for a man of 40. Free testosterone is 0.471 nmol/L, within range. Bioavailable testosterone, the fraction available to tissues, is 11.53 nmol/L, within the optimal band. His SHBG is 30.2 nmol/L, within range but toward the lower end, which is typical with insulin resistance because insulin suppresses SHBG production. The free androgen index is 70.2, within range. LH is 4.2, FSH 2.35, both within range and showing normal pituitary signalling. DHEA-S is 3.7 umol/L, within range. Oestradiol is 106 pmol/L, within range. Progesterone is 0.96 nmol/L, just above the lower limit of 0.89 for a male, which is normal; progesterone in men is produced in small amounts and has no clinical significance at this level. Prolactin is 153 uIU/mL, within range. Cortisol is 572 nmol/L, within the morning reference band of 145 to 619 but sitting in the upper quarter. Given that he reports stress feeling hard to manage most days, tiredness on waking, and low mood and anxiety, this upper-range cortisol is consistent with a chronically activated stress response. A cortisol that is high-normal in the morning combined with feeling wired or stressed most days and tired on waking suggests the cortisol rhythm may be shifted, with cortisol remaining elevated later into the evening, impairing sleep onset and overnight recovery.\n\nHis vitamin D is 110 nmol/L, within the optimal band of 75 to 120, which reflects the supplementation he was taking until recently. Having paused his D3 for two weeks, this level will drift downward over the coming months, particularly through winter, and especially given his skin pigmentation, which reduces vitamin D synthesis from sunlight. He should resume his D3. His vitamin B12 is 481 pg/mL, within range but below the optimal floor of 500. Given he is not supplementing B12, this is adequate but could be better. His folate is 7 ng/mL, within range but below the optimal floor of 8. At 0 to 1 portions of vegetables and fruit per day, this is the explanation: folate comes primarily from green leafy vegetables, and he is eating almost none. His magnesium is 1.08 mmol/L, within range but above the optimal ceiling of 1.05, which reflects recent supplementation with magnesium glycinate. As with vitamin D, this will drift down now he has paused it. His calcium is 2.4 mmol/L and corrected calcium is 2.33 mmol/L, both within range. His PTH is 2.11 pmol/L, within range, confirming normal calcium regulation. His total antioxidant activity is 2.01 mmol/L, above the upper limit of 1.77. This is almost certainly driven by the creatine supplementation and possibly the recent antioxidant supplements; it is not a concern.\n\nHis iron stores are healthy. Ferritin is 284 ng/mL, within the laboratory range of 22 to 322 but above the optimal ceiling of 200. This does not suggest iron overload because his transferrin saturation is 29.17 percent, within the optimal band of 25 to 40 percent, his serum iron is 21.1 umol/L, within range, and his transferrin and iron binding capacity are both normal. A ferritin in the upper part of the range with normal saturation is most commonly driven by insulin resistance and visceral fat, both of which push ferritin up as an acute phase response independent of actual iron stores. It does not need investigation for haemochromatosis at this level with normal saturation, but it is worth watching on a retest.\n\nHis immune markers are clean. IgG 13.9, IgA 1.8, IgM 0.7, IgE 12.9, all within range. Rheumatoid factor is 8 IU/mL, within range, which is relevant given his long-standing joint pain. A negative rheumatoid factor does not completely exclude inflammatory arthritis but makes rheumatoid arthritis substantially less likely. His tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of his bloating. His prostate screen is clean: PSA 0.58 ng/mL, well below the threshold of 2.5, free PSA 0.22, free-to-total ratio 0.379, reassuringly high. Given his father's prostate cancer, this is useful baseline data. CA19-9 is below 1.2, within range. Creatine kinase is 148 U/L, within range for a man who trains with resistance three times a week.\n\nHis urinalysis is entirely clean: no protein, glucose, ketones, blood, white cells, nitrites, casts or urobilinogen. Specific gravity and pH are normal.\n\nHis PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 33.6 years against his calendar age of 40, meaning his blood markers suggest a biological age roughly six years younger than his actual age. This is a strong result, driven largely by his excellent CRP, healthy albumin, and good kidney function. The markers that would push it in the wrong direction, glucose and RDW, are only marginally suboptimal.\n\nTurning to his symptoms: his fatigue, low mood and anxiety are not explained by any single blood marker. His thyroid is working well, there is no anaemia, his B12 and folate are adequate if not optimal, his testosterone is healthy, and there is no significant inflammation. What the bloods have positively excluded is valuable. What they point toward is a combination of factors the blood cannot directly measure: 6 to 7 hours of sleep with poor sleep quality and tiredness on waking, chronic stress that feels hard to manage most days, a diet providing almost no vegetables or fruit, insulin resistance creating blood sugar instability throughout the day, 5 to 9 alcoholic drinks per week impairing sleep architecture, and a step count of only 2,000 to 5,000 per day meaning very little movement outside of his gym sessions. The upper-range cortisol and the tired-on-waking pattern suggest a shifted cortisol rhythm, which typically leaves people wired in the evening and unrefreshed in the morning. His bloating and digestive discomfort, present for as long as he can remember, are not explained by coeliac disease (excluded) or by any pancreatic enzyme abnormality. The most likely explanations are dietary, either food intolerances, insufficient fibre creating slow gut motility, or the combination of ultra-processed food and sugar some days driving fermentation in the gut. A structured food and symptom diary over two to three weeks would help identify specific triggers, and if the bloating persists, a hydrogen breath test through his GP could investigate SIBO (small intestinal bacterial overgrowth) or lactose intolerance. His joint pain and stiffness since childhood, with involvement of multiple sites including the lower back, knees, left hip and left elbow, are not explained by rheumatoid arthritis (rheumatoid factor negative) or by systemic inflammation (CRP 0.7, ESR 2). The pattern of widespread joint sensitivity from a young age, particularly with certain loading patterns in the gym, raises the possibility of a connective tissue characteristic such as joint hypermobility, which would be worth discussing with his GP or a physiotherapist who can assess the Beighton score. Alternatively, biomechanical factors and training form may be contributing, and a sports physiotherapy assessment would help identify whether specific movement patterns are loading his joints unevenly.","links":"The central thread in this report is insulin resistance, and it connects more findings than might be immediately obvious. The fasting glucose of 6.3, the HbA1c of 41, the fasting insulin of 22.66, and the HOMA-IR of 6.34 form the core of the pattern: the body is producing roughly three times the ideal amount of insulin to keep blood sugar only marginally above range. The triglycerides at 2.43 and the VLDL at 1.1 are direct downstream consequences of this, because when cells become resistant to insulin's signal to absorb glucose, the liver converts the excess into triglycerides and packages them into VLDL particles. The ApoB at 0.9, sitting right at the desirable boundary, is being pushed up by those same triglyceride-rich particles. The remnant cholesterol at 0.94 is the cholesterol left behind as those particles are broken down in the bloodstream. The ferritin at 284, above optimal despite normal iron saturation, is being elevated by the metabolic and inflammatory milieu that accompanies insulin resistance. The ALT at 41 and the GGT at 42, both above their optimal ceilings, reflect early metabolic strain on the liver, the organ most directly affected when the body is processing excess glucose and assembling excess triglyceride particles. The uric acid at 393, above optimal, rises because insulin reduces the kidney's ability to clear it. Even the SHBG at 30.2, sitting in the lower third of its range, is being suppressed by the elevated insulin. Every one of these findings improves when insulin sensitivity improves.\n\nThe second thread is the lifestyle picture that is driving the insulin resistance. A diet with 0 to 1 portions of vegetables and fruit per day, sugary food some days, ultra-processed food weekly, a step count of 2,000 to 5,000 (meaning very little movement outside gym sessions), and 5 to 9 alcoholic drinks per week creates the conditions for the metabolic pattern above. The resistance training three times a week is a genuine positive because muscle is the largest glucose sink in the body, but the benefit of those sessions is being offset by what happens during the other 23 hours of each day: low non-exercise movement, a diet that is high in refined carbohydrate and low in fibre, and alcohol that both adds calories and impairs insulin sensitivity. The 6 to 7 hours of poor-quality sleep and chronic stress compound everything, because sleep deprivation and sustained cortisol elevation both independently worsen insulin resistance.\n\nThe third thread is what was excluded and why that matters. The thyroid is working well with negative antibodies. The testosterone is healthy at 21.2 with good free and bioavailable fractions. There is no anaemia, no iron deficiency, no significant B12 or folate deficiency, no coeliac disease, no rheumatoid factor, no systemic inflammation, no kidney impairment, no liver scarring, no pancreatic abnormality, and a clean prostate screen. His PhenoAge of 33.6, six years younger than his calendar age, tells us that despite the metabolic findings, his body is in strong underlying shape. This is a report about trajectory rather than current damage.\n\nThe one loose end is the joint pain. Bloods cannot diagnose hypermobility, osteoarthritis, or biomechanical issues, and the negative inflammatory markers and rheumatoid factor mean the joints are not being attacked by the immune system. Given the history stretching back to childhood, a clinical assessment of joint mobility and connective tissue is the logical next step, and his mother's osteoporosis makes bone and joint health worth keeping on the agenda as he ages.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast: eggs, Greek yoghurt, chicken, or tinned fish. Anchor: protein goes on the plate before anything else. Why: protein blunts the insulin spike behind your HOMA-IR of 6.34 and supports the muscle-building goal your training is working toward. Aim for at least 140g of protein per day across three to four meals.\nAdd two to three portions of vegetables to your daily intake, building up to five. Start with one portion at lunch and one at dinner this week: a handful of spinach, broccoli, peppers, or a mixed salad. Anchor: vegetables go on the plate alongside the protein. Why: your folate at 7 is below optimal because folate comes from green vegetables, and fibre from vegetables will help the bloating and feed healthy gut bacteria.\nSwap sugary snacks and drinks for whole food alternatives, one swap at a time. If you drink sugary drinks, switch to water, sparkling water or black coffee. If you snack on biscuits or chocolate, switch to nuts, fruit or dark chocolate. Anchor: replace one sugary item per week until the habit sticks. Why: sugar is the most direct driver of the triglycerides at 2.43 and the fasting glucose at 6.3.\nWalk for fifteen to twenty minutes after your largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses the HOMA-IR of 6.34. This also builds your daily step count toward 7,500 or more.\nReduce alcohol to under 7 drinks per week, ideally under 4, and have at least three consecutive alcohol-free days each week. Anchor: set the alcohol-free days at the start of each week so they are planned, not reactive. Why: alcohol adds empty calories, impairs insulin sensitivity, disrupts sleep architecture (contributing to your tired-on-waking pattern), and is contributing to the GGT at 42.\nFix your wake time to the same time every day, including weekends, and get outside into daylight within 30 minutes of waking. Anchor: alarm goes off, curtains open or step outside before coffee. Why: morning light resets the cortisol rhythm, and your pattern of tiredness on waking with stress most days suggests cortisol is peaking too late and staying elevated too long. A fixed wake time is the single most effective sleep intervention.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, and consuming it in the afternoon pushes back sleep onset, compounding the 6 to 7 hours you are already getting.\nAim for a total daily calorie intake of approximately 2,000 to 2,200 kcal to create a moderate deficit for fat loss while preserving muscle. Your estimated maintenance is around 2,500 to 2,600 kcal based on your weight, height, and moderate activity level. A deficit of 400 to 500 kcal per day, combined with your resistance training and a protein intake of at least 140g per day, will support fat loss of roughly 0.5 kg per week while protecting muscle mass. Target weight range: 82 to 86 kg, which would bring your BMI into the 25 to 27 range.","flags":"Fasting glucose 6.3 mmol/L (above the upper limit of 6.0) with HbA1c 41 mmol/mol (one point below the pre-diabetes threshold of 42), fasting insulin 22.66 mIU/L (within lab range but three times the optimal ceiling of 8), and HOMA-IR 6.34 (above the upper limit of 1.5 and well above the significant insulin resistance threshold of 2.9). This is an established insulin resistance pattern with early impaired fasting glucose. Given the family history of type 2 diabetes in his father, this warrants a GP review to discuss formal glucose tolerance testing and a structured metabolic risk reduction plan.\nTriglycerides 2.43 mmol/L (above the desirable fasting threshold of 1.70), VLDL 1.1 mmol/L (above the upper limit of 0.78), remnant cholesterol 0.94 mmol/L (above the upper limit of 0.8), and ApoB 0.9 g/L (at the boundary of the desirable range of below 0.9). Driven by the insulin resistance pattern. Total cholesterol 5.3 mmol/L is marginally above the desirable threshold of 5.18. LDL 2.66 mmol/L is within range but above optimal. HDL 1.7 mmol/L and ApoB/A1 ratio 0.484 are both excellent and protective.\nLp(a) 49.89 nmol/L (above the ideal threshold of 32 nmol/L). This is an inherited lipoprotein that cannot be modified by lifestyle. At this level it is above ideal but within the normal range and below the approximately 125 nmol/L threshold at which it is generally considered to add meaningful independent cardiovascular risk. Worth noting alongside the other lipid findings for the GP.\nNeutrophils 1.89 x10^9/L (below the lower limit of 2.0), monocytes 0.14 x10^9/L (below the lower limit of 0.2), lymphocytes 3.29 x10^9/L (above the upper limit of 3.0). This pattern is consistent with benign ethnic neutropenia, a well-recognised normal variant in individuals of Black African and Caribbean ancestry. Total white cell count is 5.39, within range, with no clinical concern.\nALT 41 IU/L (within lab range but above the optimal ceiling of 30) and GGT 42 IU/L (within lab range but above the optimal ceiling of 25). Mild metabolic strain on the liver consistent with insulin resistance and moderate alcohol intake. FIB-4 0.57, APRI 0.229 and NAFLD fibrosis score minus 2.905 all rule out significant fibrosis.\nCortisol 572 nmol/L, within the morning reference band but in the upper quarter (145 to 619). Consistent with chronic stress reported as hard to manage most days, and the tired-on-waking energy pattern.\nFolate 7 ng/mL (within range but below the optimal floor of 8), driven by very low vegetable and fruit intake at 0 to 1 portions per day.\nFerritin 284 ng/mL (within range but above the optimal ceiling of 200), with normal transferrin saturation at 29.17%. Most likely elevated by insulin resistance rather than true iron overload. Worth monitoring on retest.\nUric acid 393 umol/L (within range but above the optimal ceiling of 380). Driven by insulin resistance reducing renal clearance.\nTotal antioxidant activity 2.01 mmol/L (above the upper limit of 1.77). Most likely driven by creatine supplementation and recent antioxidant supplement use. Not a clinical concern.\nReassuring negatives: thyroid function excellent with negative antibodies, testosterone healthy at 21.2 nmol/L, no anaemia, no iron deficiency, kidney function excellent (cystatin C eGFR 96), no liver scarring (FIB-4 0.57), hs-CRP 0.7 (excellent), ESR 2, rheumatoid factor negative, coeliac screen negative, PSA 0.58 with reassuring free ratio, vitamin D optimal at 110, immunoglobulins all within range, urinalysis clean, PhenoAge 33.6 (six years younger than calendar age).","recommendations":"Discuss the insulin resistance pattern with your GP: fasting glucose 6.3, HbA1c 41, fasting insulin 22.66, HOMA-IR 6.34. Given your father's type 2 diabetes, ask about a formal oral glucose tolerance test (OGTT) to assess how your body handles a glucose load, and discuss whether structured metabolic monitoring (HbA1c and fasting glucose every six months) is appropriate.\nBring the lipid results to the same appointment: triglycerides 2.43, ApoB 0.9, total cholesterol 5.3, Lp(a) 49.89. The GP can assess overall cardiovascular risk using the QRISK3 tool, which factors in ethnicity, family history and these numbers together.\nDiscuss your long-standing joint pain with your GP or request a referral to a musculoskeletal physiotherapist. The negative rheumatoid factor and absent inflammation make inflammatory arthritis unlikely, but the pattern of multi-joint sensitivity since childhood warrants a clinical assessment of joint mobility, connective tissue characteristics, and biomechanics.\nIf bloating persists after increasing fibre and keeping a food and symptom diary for three weeks, ask your GP about a hydrogen breath test to investigate lactose intolerance or small intestinal bacterial overgrowth (SIBO).\nResume vitamin D3, K2, omega-3, zinc and magnesium glycinate supplementation as outlined in the supplementation section below. Your vitamin D is optimal now but will fall through winter without supplementation, especially given your skin pigmentation.\nAim for a calorie intake of 2,000 to 2,200 kcal per day with at least 140g of protein per day (approximately 1.5g per kg of body weight) to support fat loss toward a target weight of 82 to 86 kg while preserving muscle. Retest in four to five months with fasting glucose, HbA1c, fasting insulin, HOMA-IR, full lipid panel including triglycerides and ApoB, ALT, GGT, ferritin and uric acid to track progress.","supplementation":"Vitamin D3 (cholecalciferol), 3,000 to 4,000 IU daily, taken with a meal containing fat. Why: your level is 110 nmol/L now, but you have paused supplementation, and with darker skin pigmentation and UK winter ahead, it will drop. A higher dose than the standard 2,000 IU is appropriate given your BMI of 29.7, because fat tissue sequesters vitamin D. Your mother's osteoporosis makes maintaining optimal vitamin D especially important for your own bone health.\nVitamin K2 (MK-7), 100 to 200 mcg daily, taken alongside your vitamin D. Why: K2 directs calcium into bone rather than into artery walls, and should always accompany vitamin D supplementation.\nOmega-3 fish oil, 2 to 3g combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (yours are 2.43, above the desirable threshold), reduces inflammation, and supports cardiovascular health. Look for a product that specifies the EPA and DHA content per capsule rather than just \"fish oil\".\nMagnesium glycinate, 300 to 400mg elemental magnesium, taken before bed. Why: magnesium improves insulin sensitivity (relevant to your HOMA-IR of 6.34), supports sleep quality (relevant to your tired-on-waking pattern), and helps with muscle recovery from your resistance training. Glycinate is the best-absorbed form and least likely to cause digestive upset.\nZinc (zinc bisglycinate or picolinate), 15 to 25mg daily, taken with food (not at the same time as magnesium, as they compete for absorption). Why: zinc supports testosterone production, immune function and insulin signalling.\nMethylfolate (5-MTHF), 400 to 800 mcg daily. Why: your folate at 7 ng/mL is below the optimal floor of 8, driven by very low vegetable intake. While increasing vegetables is the primary solution, a methylfolate supplement will bring levels up while the dietary change takes hold. Methylfolate is the active form and is better absorbed than folic acid.\nContinue creatine monohydrate, 3 to 5g daily (every day, not just training days). Why: creatine supports muscle performance and recovery, and emerging evidence suggests it improves glucose disposal into muscle, which is relevant to your insulin resistance. Daily dosing maintains saturation.\nDo not take iron supplements. Your ferritin at 284 is already above the optimal ceiling, and additional iron would push it higher without benefit.\nThe most important changes from this report are not supplements. They are increasing vegetable and fruit intake from 0 to 1 portions to at least five, reducing sugar and refined carbohydrate, walking after meals, reducing alcohol, fixing sleep timing, and creating the moderate calorie deficit that will bring your weight from 94 kg toward 82 to 86 kg. Those changes will move the insulin, glucose, triglycerides, ALT, GGT, ferritin and uric acid more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 62.3; held to 59 by a system rated \"See your GP\". Weakest systems: glucose & insulin 30%, lipids & cardiovascular 40%, hematology 79%. Biggest drags: HOMA-IR, Lipoprotein(a), Triglycerides, Insulin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"33.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3733","lower_normal":"","upper_normal":"45","lower_optimal":"","upper_optimal":"40","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"years","description":"PhenoAge is a biological ageing estimate calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge is 33.6 years against a calendar age of 40, meaning his blood markers suggest a biological age roughly six years younger. This is a strong result, driven largely by his excellent CRP at 0.7, healthy albumin at 45, good kidney function and normal MCV. The markers that would push PhenoAge higher, mainly glucose at 6.3, are being offset by the strong performance everywhere else.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term, so it measures the risk being built rather than the ten-year probability of an event. At 30 out of 100, above the ideal ceiling of 20 but within the acceptable ceiling of 40, the score is being driven primarily by the elevated triglycerides at 2.43 and the ApoB at the boundary of 0.9. His excellent HDL and low CRP are holding the score down. At 40, his ten-year cardiovascular risk is low, but the gap between a low ten-year risk and a score of 30 is the window for acting.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3661","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When the liver is under strain, damaged cells release more ALT into the bloodstream. His ALT at 41 IU/L is within the laboratory ceiling of 56 but above the optimal ceiling of 30 for a man. This mild elevation is most likely driven by the insulin resistance pattern and early metabolic fatty liver, with moderate alcohol intake as an additional contributor. It is not at a level that suggests significant liver injury, and the clean fibrosis scores confirm there is no scarring.","low_causes":"","high_causes":"Fatty liver disease, alcohol, obesity, medications, hepatitis, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in liver cells, heart muscle and skeletal muscle. His AST at 31 IU/L is within range and within the optimal band. Unlike ALT, which is liver-specific, AST can rise from exercise as well as liver strain. At 31, this is unremarkable and consistent with a liver that is under mild metabolic pressure but not significantly injured.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart disease, alcohol, intense exercise","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5169","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that rises with metabolic strain, alcohol consumption, fatty liver and bile duct issues. His GGT at 42 IU/L is within the male laboratory range of 4 to 73 but above the optimal ceiling of 25. At this level it reflects the combined effect of insulin resistance and moderate alcohol intake. It is not at a level that suggests significant liver disease, particularly with the clean fibrosis scores, but it is a marker to track as the metabolic changes take effect.","low_causes":"","high_causes":"Alcohol, fatty liver, metabolic syndrome, medications, bile duct disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. His ALP at 78 IU/L is comfortably within both the laboratory and optimal ranges, indicating no bile duct obstruction and no abnormal bone turnover.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bone disease, bile duct obstruction, liver disease, vitamin D deficiency","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when the body breaks down old red blood cells. The liver processes it for excretion. His total bilirubin at 8 umol/L is within range and shows normal liver processing and healthy red cell turnover.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood, reflecting liver synthetic function and immune protein production. At 79 g/L, this is within range and shows the liver is producing protein normally.","low_causes":"Liver disease, malnutrition, kidney disease","high_causes":"Chronic inflammation, dehydration, infection, myeloma","padding":"1","one_sided":"0","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and drugs, and maintains fluid balance. At 45 g/L, this is in excellent shape, confirming strong liver synthetic function and good nutritional status. Albumin is also one of the inputs to PhenoAge, and his healthy level here is one of the reasons his biological age is estimated six years younger than his calendar age.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins that includes antibodies and transport proteins. His globulin at 34 g/L is within range but slightly above the optimal ceiling of 32. This is not a concern; it likely reflects the upper end of normal immune protein production.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, infection, liver disease, autoimmune conditions","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1966","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis (scarring) using age, AST, ALT and platelet count. His score of 0.57 is well below the threshold of 1.45, confidently ruling out significant liver fibrosis. This means that despite the mild metabolic strain visible in the ALT and GGT, the liver has not sustained any lasting structural damage.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age-related calculation effect, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5455","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starch into sugar. At 86 IU/L, within range, there is no sign of pancreatic inflammation or obstruction.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5390","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. At 42 U/L, within range, this confirms healthy pancreatic function with no sign of inflammation.","low_causes":"","high_causes":"Pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5116","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL and VLDL. At 5.3 mmol/L, this is marginally above the desirable threshold of 5.18. The number itself is less important than the breakdown: his HDL is excellent at 1.7, and the elevation is driven by LDL and triglyceride-rich particles. The total cholesterol should come down as the triglycerides improve with dietary change.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet, insulin resistance, hypothyroidism, genetics, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat transported in the blood. The liver assembles them from excess glucose and dietary fat and packages them into VLDL particles. At 2.43 mmol/L, well above the desirable fasting threshold of 1.70 and the optimal ceiling of 1.0, this is the lipid marker most directly driven by his insulin resistance and dietary sugar and refined carbohydrate intake. Triglycerides are one of the most responsive markers to dietary change and should be one of the first to improve.","low_causes":"Malnutrition, hyperthyroidism, very low-carb diet","high_causes":"Insulin resistance, excess carbohydrate and sugar, alcohol, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7051","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, is the particle the liver builds to export triglycerides into the bloodstream. At 1.1 mmol/L, above the upper limit of 0.78, this directly reflects the elevated triglyceride production driven by insulin resistance. As triglycerides come down, VLDL will follow.","low_causes":"","high_causes":"Insulin resistance, excess carbohydrate, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8173","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL, or high-density lipoprotein, is the protective cholesterol particle that carries cholesterol away from artery walls and back to the liver for disposal. At 1.7 mmol/L, well above the desirable threshold of 1.55 and the optimal floor of 1.4 for a man, this is an excellent result. It is the strongest protective factor in his lipid panel and suggests that despite the metabolic strain elsewhere, his body is handling reverse cholesterol transport very efficiently.","low_causes":"Smoking, obesity, sedentary lifestyle, insulin resistance, very low-fat diet","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6213","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, or low-density lipoprotein, is the particle that deposits cholesterol into artery walls and drives atherosclerosis. At 2.66 mmol/L, this is within the laboratory range but marginally above the optimal ceiling of 2.6. When triglycerides are elevated, the standard Sampson LDL calculation can undercount the number of small, dense LDL particles, which is why ApoB is a more reliable measure in this context. His Lp(a)-corrected LDL is 2.5 mmol/L, confirming that most of his LDL burden is modifiable through diet and lifestyle.","low_causes":"Hyperthyroidism, malnutrition, very low-fat diet","high_causes":"Diet, genetics, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3467","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol and is a simple measure of cardiovascular risk. At 3.12, well within the desirable threshold of 4.5 and the optimal ceiling of 4.0, this is a healthy ratio, driven primarily by his excellent HDL at 1.7.","low_causes":"","high_causes":"High total cholesterol, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"32.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8020","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"The HDL percentage shows what proportion of total cholesterol is carried by the protective HDL particle. At 32.08 percent, well above the minimum of 20 percent, this is a strong result showing that nearly a third of his cholesterol is in the protective fraction.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic particles (LDL, VLDL and remnants) in one number. At 3.6 mmol/L, within the laboratory ceiling of 4.0 but above the optimal ceiling of 3.2, this reflects the combined contribution of the mildly elevated LDL, the elevated VLDL and the remnant cholesterol. It should improve as triglycerides and insulin resistance are addressed.","low_causes":"","high_causes":"High LDL, high triglycerides, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7750","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main structural protein on HDL particles. A higher ApoA1 means more HDL particles and better reverse cholesterol transport. At 1.86 g/L, well above the minimum of 1.20, this is excellent and consistent with his strong HDL cholesterol.","low_causes":"Smoking, obesity, sedentary lifestyle, genetics","high_causes":"Exercise, genetics, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic lipoprotein particle (LDL, VLDL and Lp(a)). Each particle carries exactly one ApoB molecule, making it a direct count of the total number of particles that can deposit cholesterol into artery walls. At 0.9 g/L, this sits at the boundary of the desirable range (below 0.9) and above the optimal ceiling of 0.8. It is a more accurate measure of cardiovascular risk than LDL alone, particularly when triglycerides are elevated and small, dense LDL particles are more numerous. Reducing the insulin resistance and triglycerides should bring this below 0.9.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet, insulin resistance, genetics, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.484","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3457","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). It is one of the best summary measures of cardiovascular risk from lipids. At 0.484, well within the lower risk threshold of 0.7 and the male optimal ceiling of 0.6, this is a reassuring result. His excellent ApoA1 and HD
