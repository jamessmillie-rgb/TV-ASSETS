<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Nigel Eve","dob":"12/07/1972","report_date":"2026-10-01","summary":"Nigel is a 54-year-old male presenting with a BMI of 25.3, following a standard mixed diet, eating six or more portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains four times per week (two cardio, two resistance) at moderate intensity with 7,500 to 10,000 daily steps. He sleeps seven to eight hours a night and wakes feeling refreshed, with steady energy through the day. Stress feels hard to manage some weeks. He drinks five to nine alcoholic drinks per week. He supplements with protein powder only. He has no diagnosed conditions and takes no medications. He has had a previous blood test where everything was normal. His goal is to improve long-term health and longevity. No symptoms are reported.\n\nThis is a detailed report with several genuinely important findings alongside a great deal of good news, and the balance between the two is worth understanding carefully. The most clinically significant result is an IgE of 1,075, more than ten times the upper limit of 100. IgE is the antibody the immune system produces in response to allergens, and a level this high indicates a significant allergic process happening somewhere in the body. This could be environmental (dust mites, pollen, animal dander, mould), dietary, or occasionally parasitic, but at this concentration in a 54-year-old man living in the UK, environmental or dietary allergy is far more likely. What makes this worth investigating is not just the number itself but the fact that his ESR, the erythrocyte sedimentation rate, is also raised at 30 against an upper limit of 12. ESR measures how quickly red blood cells settle in a tube and rises when inflammation or immune activation is present. With a CRP of only 1.1, the ESR and CRP are telling slightly different stories: CRP responds to acute inflammation and infection, while ESR responds more to chronic immune activation, immunoglobulin production and plasma protein changes. A raised ESR with a near-normal CRP is a pattern commonly seen with allergic disease, elevated immunoglobulins, or chronic low-grade immune stimulation, and the massively elevated IgE provides the explanation. We would recommend discussing both the IgE and the ESR with his GP, who may wish to arrange specific allergen testing (a radioallergosorbent test or skin prick testing) to identify what is driving this immune response. It is worth noting that his IgG is also towards the upper end of its range at 14.5, which adds to the picture of an immune system that is working hard.\n\nThe second finding that warrants a GP conversation is the thyroid peroxidase antibody result. TPO antibodies are proteins the immune system produces against the thyroid gland's own enzyme, thyroid peroxidase, and Nigel's level is 58.6 against an upper limit of 13.8. This is a pattern associated with a condition called Hashimoto's thyroiditis, where the immune system slowly targets the thyroid. The important context here is that his thyroid is currently working well: TSH, the signal the brain sends to tell the thyroid how hard to work, is 1.26, comfortably within the ideal range of 1.0 to 2.5. Free T4, the main hormone the thyroid produces, is 17.3, and free T3, the active form the body converts it into, is 5.1, both within ideal ranges. The ratio between FT3 and FT4 is 0.295, confirming good conversion. So the antibodies are present but the thyroid has not yet been affected functionally. This is not unusual; positive TPO antibodies can precede any change in thyroid function by years or even decades, and not everyone with positive antibodies goes on to develop an underactive thyroid. However, it does mean the thyroid should be monitored. His GP should be aware of this result, and a repeat of TSH and FT4 every twelve months is sensible to catch any drift early. The thyroglobulin antibody is negative at less than 1.3, which means only one of the two thyroid antibody types is positive.\n\nThe third area that needs attention is the lipid profile. Nigel's total cholesterol is 6.4, LDL cholesterol is 4.38 against a target of below 3.0, ApoB is 1.40 against a target of below 0.9, and non-HDL cholesterol is 4.8 against a target of below 4.0. ApoB, apolipoprotein B, is the protein carried by every LDL particle, and it is the single best measure of how many atherogenic particles are circulating. At 1.40, which the laboratory classifies as very high, there are a significant number of LDL particles in contact with the artery walls. His Lp(a), lipoprotein(a), is 61.7 against a target of below 32. Lp(a) is an inherited lipoprotein that behaves like a particularly sticky form of LDL: it deposits cholesterol, promotes clotting and drives inflammation in arterial walls. It is entirely genetic, cannot be changed by diet, exercise or any currently available supplement, and the level Nigel has will remain the same throughout his life. This is genuinely useful information because it means part of his elevated LDL and ApoB is being driven by something he cannot modify, but part is also being driven by factors he can. The Lp(a)-corrected LDL, which subtracts the cholesterol carried by Lp(a) particles, is 4.18, still well above the 3.0 target, confirming that there is a substantial modifiable component. His cardiovascular risk score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 60 out of 100, which is elevated and driven primarily by the ApoB, LDL and Lp(a). This score measures the risk being built in the arteries rather than a ten-year event probability, and at 54 it represents the accumulation of particle exposure over time. His GP should be made aware of the Lp(a) result so it can be recorded permanently in his medical notes, and first-degree relatives (siblings, children) should be offered Lp(a) testing because the trait is inherited. The encouraging side of the lipid picture is that the metabolic markers around the cholesterol are excellent. His HDL is 1.60, which is above the desirable threshold of 1.55 and within the optimal range. His triglycerides are 1.05, well controlled. His ApoA1, the protein on protective HDL particles, is 1.63, healthy. His VLDL is 0.48, well within range. The ApoB to ApoA1 ratio is 0.86, which sits in the average risk band but is being pulled up by the high ApoB rather than by a low ApoA1. The TG to HDL ratio, one of the best markers of insulin resistance and small dense LDL, is 0.66, which is excellent and suggests his LDL particles are likely to be the larger, less dangerous subtype. Remnant cholesterol is 0.42, within the optimal range of below 0.5. The atherogenic index of plasma is negative 0.18, also ideal. So the picture is one of elevated particle count driven partly by genetics and partly by dietary saturated fat and cholesterol intake, sitting alongside an otherwise metabolically healthy lipid environment.\n\nThere is a great deal of good news in this report that deserves attention. Nigel's glucose metabolism is in excellent shape. Fasting glucose is 5.1, HbA1c is 39 mmol per mol (5.7 percent), both within healthy ranges. Fasting insulin is 5, and HOMA-IR, the homeostatic model assessment of insulin resistance calculated from glucose and insulin, is 1.13, comfortably within the ideal range. C-peptide, a marker of how much insulin the pancreas is producing, is 1.18, at the lower end of range, consistent with a pancreas that does not need to work hard because the body is responding well to insulin. This is an excellent metabolic profile at 54.\n\nHis liver is in very good health. ALT at 14 and GGT at 19 are both well within optimal ranges, meaning the liver is under no metabolic strain. AST is 24, normal. Alkaline phosphatase is 71, mid-range. The FIB-4 score, a fibrosis screening index calculated from age, platelets, AST and ALT, is 1.52, marginally above the 1.45 threshold. At 54, age is the dominant input to this calculation, and with an ALT of only 14 making the denominator small, the score is being inflated by the arithmetic rather than by any sign of liver disease. With GGT, ALT, AST, bilirubin and albumin all healthy, there is no indication of liver fibrosis, and this score does not require a fibroscan. The APRI, another fibrosis index, is 0.263, well within the normal range, which confirms the same conclusion. His total bilirubin is 24 against an upper limit of 21, but with every liver enzyme clean, this pattern is consistent with Gilbert's syndrome, an inherited and completely harmless variation in bilirubin metabolism that affects five to ten percent of the population. It does not progress, does not need treatment, and explains why the number sits slightly above range. The De Ritis ratio, AST divided by ALT, is 1.71, marginally above the 1.6 upper limit, but this is simply because his ALT is so low (14) that the ratio is pushed up arithmetically. A De Ritis ratio is only clinically meaningful when the enzymes themselves are elevated, and here they are both excellent.\n\nKidney function shows a result worth discussing. His cystatin C is 1.13 against an upper limit of 1.10, and the cystatin C-based eGFR is 76. Cystatin C is a small protein filtered by the kidneys that gives a more reliable estimate of filtration rate than creatinine, particularly because it is not affected by muscle mass. The creatinine-based eGFR is 78, and the combined eGFR is 76. An eGFR between 60 and 89 falls into the category of mildly reduced kidney function, and at 54 some age-related decline from peak filtration is expected; eGFR falls by roughly one millilitre per minute per year after the age of 40, so a peak of 120 at 25 would be expected to be around 90 at 54. At 76, the filtration rate is slightly lower than would be predicted by age alone. There is no protein in the urine, no blood in the urine, and urea is 7.5, within range but towards the upper end, which is consistent with a mildly reduced clearance rate. Electrolytes are all well balanced: sodium 141, potassium 4.6, chloride 97, bicarbonate 26.3, all within their respective ranges. Uric acid is 362, within range and well within the optimal band. This is not an urgent finding, but it is worth the GP recording the eGFR so it can be trended over time, and a repeat in twelve months would confirm whether this is stable.\n\nHis iron studies are well balanced. Ferritin is 112, comfortably within the optimal range of 50 to 200 for a man. Serum iron is 23.6, transferrin is 2.97, iron binding capacity is 66.2, and transferrin saturation is 31.6 percent, all within ideal ranges. His full blood count is healthy: haemoglobin 158, red cell count 5.04, haematocrit 0.459, MCV 91.1, MCH 31.4, all textbook. White cell count is 4.96, within range, with a healthy differential: neutrophils 2.41, lymphocytes 1.57, monocytes 0.74, eosinophils 0.21, basophils 0.03. Platelets are 228, MPV is 9.4, both well within range. The reticulocyte percentage is 0.91, normal, though the absolute reticulocyte count is 45.9 against a lower limit of 50. At 54, a marginally low absolute reticulocyte count with normal haemoglobin and normal iron stores is most likely a reflection of age-related changes in bone marrow activity and does not indicate a problem with red cell production.\n\nHis hormonal profile is interesting. Total testosterone is 32.4, above the upper limit of 28.7, which is an unusually strong result at 54. However, his SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues, is 95.4 against an upper limit of 65.8. SHBG at this level means that although the total testosterone is high, much of it is bound and inactive. His free testosterone, calculated at 0.338, is within the laboratory range of 0.13 to 1.04, and his bioavailable testosterone is 8.28, within range but towards the upper end. The free androgen index is 33.96, at the lower end of its range of 30 to 150, which reflects the high SHBG pulling the ratio down. The net effect is that Nigel has adequate free testosterone for normal function, but the high SHBG means his tissues are seeing less testosterone than the impressive total number would suggest. Elevated SHBG in men can be driven by age, low body fat, high fibre intake, moderate alcohol consumption, or thyroid antibody activity, and several of these apply here. Oestradiol is 117 against an upper limit of 146, within range. LH is 1.73 and FSH is 6.21, both within range, confirming normal pituitary signalling. Cortisol is 459, within the morning reference range, consistent with a healthy stress response. DHEA-S is 3.0 umol per litre, equivalent to approximately 1,106 micrograms per decilitre, within range. Prolactin is 90, well within range. Progesterone is 0.94, just above the lower limit of 0.89, which in men is simply a baseline level and carries no clinical significance.\n\nHis vitamin D is 89, above the sufficiency threshold of 50 but below the optimal range of 75 to 120. Given that his goal is longevity and he has positive thyroid antibodies (there is some evidence that optimising vitamin D may help modulate autoimmune thyroid activity), bringing this into the 100 to 120 range with supplementation is worthwhile. Vitamin B12 is 451, within the laboratory range but below the optimal threshold of 500. Folate is 7.0, within the laboratory range but below the optimal level of 8. Neither is deficient, but both are below the levels associated with the best long-term outcomes for homocysteine metabolism and cellular repair, which is relevant to his longevity goal. Calcium, corrected calcium, phosphate, magnesium and PTH are all within their ideal ranges.\n\nHis prostate markers are reassuring. PSA is 0.77, well below the threshold, and the free PSA ratio is 0.636, strongly reassuring. CEA and CA19-9 are both within range. Rheumatoid factor is negative. Coeliac screening (tissue transglutaminase IgA) is negative. Total antioxidant activity is 1.61, within range. Creatine kinase is 107, within range, consistent with his moderate training. Amylase is 30, at the lower boundary of its range, and lipase is 32, within range, both confirming normal pancreatic function.\n\nHis urinalysis is clean: no protein, no glucose, no blood, no white cells, no nitrites, no casts, no ketones. Urine culture is pending.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 47.7, about 6 years younger than a calendar age of 54. Overall, this is a report with three areas to address: the allergic immune activation driving IgE and ESR, the thyroid antibodies requiring monitoring, and the lipid profile requiring both GP awareness of Lp(a) and dietary modification to bring down the modifiable component of ApoB and LDL. The kidney function should be trended. Everything else is either healthy or excellent.","links":"The most striking connection in this report is between the massively elevated IgE and the raised ESR. These two results are telling the same story: the immune system is chronically activated by an allergen, and that activation is producing enough immunoglobulin to raise the sedimentation rate. The CRP being only 1.1 fits this interpretation perfectly, because CRP is driven by interleukin-6 and acute-phase hepatic synthesis, while ESR is influenced by immunoglobulin concentration and plasma viscosity. Allergic immune activation raises immunoglobulins (IgE dramatically, and IgG is also at the upper end of its range at 14.5) without necessarily raising CRP. This means the inflammation Nigel has is immune-mediated rather than metabolic or infectious, and identifying the allergen is the key to resolving it.\n\nThe thyroid antibody finding sits alongside this as a second piece of evidence that Nigel's immune system is more active than average. TPO antibodies at 58.6 represent autoimmune activity against the thyroid, and while this is a separate process from the IgE-driven allergy, both reflect an immune system with a tendency to overreact. The good news is that the thyroid itself is completely unaffected so far: TSH, FT4 and FT3 are all ideal, and the conversion ratio is healthy. The elevated SHBG could theoretically be linked to subclinical thyroid autoimmunity (even without overt hypothyroidism, thyroid antibodies can subtly influence hepatic protein synthesis), but it is equally explained by his high fibre intake, moderate alcohol, and healthy BMI. The elevated SHBG is not causing a clinical problem because his free and bioavailable testosterone remain within functional ranges.\n\nThe lipid profile is its own story, largely independent of the immune findings. The combination of elevated LDL, elevated ApoB and elevated Lp(a) with excellent HDL, excellent triglycerides and an ideal TG:HDL ratio creates a specific pattern: high particle count in an otherwise metabolically healthy environment. The Lp(a) accounts for some of the particle burden, but the corrected LDL of 4.18 confirms that a large portion is modifiable through diet. With no insulin resistance, no metabolic syndrome and a healthy BMI, the most likely drivers are dietary saturated fat and cholesterol intake and the genetic Lp(a) contribution. The alcohol intake of five to nine drinks per week may actually be raising HDL (which is excellent) while having a neutral or mildly adverse effect on LDL particle count.\n\nThe mildly reduced eGFR at 76 stands alone and does not connect to the other findings. There is no proteinuria, no haematuria, no electrolyte disturbance, and the uric acid is well controlled. At 54, this may simply represent the lower end of normal age-related decline, but it is worth trending because it provides a baseline. The reticulocyte count being marginally low connects to age-related bone marrow changes rather than to any of the other findings, and with normal haemoglobin and iron stores, it is not clinically significant.\n\nWhat has been excluded is as important as what has been found. There is no diabetes or insulin resistance. There is no liver disease. There is no anaemia or iron deficiency. There is no thyroid dysfunction despite the antibodies. There is no prostate concern. There is no coeliac disease. There is no rheumatological disease. There is no kidney disease in the traditional sense, just a mildly reduced filtration rate to monitor. The report leaves two questions to answer: what allergen is driving the IgE, and whether the lipid profile warrants statin therapy given the Lp(a) and the ApoB level.","lifestyle":"Add two portions of oily fish per week (salmon, mackerel, sardines), replacing a red meat meal each time. Anchor: fixed days, such as Tuesday and Friday dinners. Why: omega-3 fatty acids lower triglycerides, reduce inflammation (relevant to your ESR of 30 and CRP of 1.1), and the swap reduces saturated fat intake, which is the main modifiable driver behind your ApoB of 1.40 and LDL of 4.38.\nAdd a daily portion of soluble fibre: a bowl of oats at breakfast, or a handful of almonds, or a portion of beans or lentils with lunch. Anchor: attach it to the meal you eat most reliably. Why: soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol out of the blood to make more. Three grams a day of beta-glucan from oats can reduce LDL by five to ten percent.\nReplace butter, cheese and processed meat portions with olive oil, avocado and nuts where possible, one swap at a time, starting with cooking fat this week. Why: saturated fat is the single biggest dietary driver of ApoB, and at 1.40 your particle count has a large modifiable component.\nKeep your protein intake at or above 130 grams per day (1.5 grams per kilogram of bodyweight). Your current protein powder use is helpful; ensure protein appears at every meal, not just in shakes. Why: adequate protein supports muscle maintenance, satiety and metabolic rate, all relevant to longevity at 54.\nAim for a daily calorie intake of approximately 2,500 to 2,600 kcal to maintain your current healthy weight, based on your BMR of roughly 1,800 kcal and moderate activity multiplier. If you notice weight creeping up, a small reduction to 2,300 kcal provides a gentle deficit.\nAdd one extra resistance session per week, building from two to three. Anchor: attach it to a day you already train cardio, or a fixed weekday evening. Why: resistance training three times per week at 54 is the single most evidence-based intervention for longevity, bone density, insulin sensitivity and maintaining the excellent metabolic profile you already have.\nLimit alcohol to under seven drinks per week, ideally under four, with at least three alcohol-free days. Why: moderate alcohol raises SHBG (yours is 95.4, nearly 50 percent above the upper limit) and contributes to the ESR being elevated. Reducing intake may allow SHBG to fall, freeing more of your strong testosterone for tissue use.\nMaintain your current sleep pattern of seven to eight hours with refreshed waking. This is one of the strongest foundations in the report and directly supports immune regulation, which matters given the IgE finding.","flags":"IgE 1,075 against an upper limit of 100, more than ten times the threshold. This indicates significant allergic sensitisation. The allergen should be identified through specific IgE testing or skin prick testing. Eosinophils are 0.21, within range, which may reflect chronic rather than acute allergic activation. ESR at 30 is likely explained by the immunoglobulin elevation rather than a separate inflammatory process.\nESR 30 against an upper limit of 12. In the context of a CRP of only 1.1, this is most likely driven by elevated immunoglobulin concentration (IgE 1,075, IgG 14.5) rather than acute inflammation. If allergen investigation does not explain it fully, a repeat ESR and protein electrophoresis could be considered.\nTPO antibodies 58.6 against an upper limit of 13.8, consistent with thyroid autoimmunity (Hashimoto's pattern). Thyroglobulin antibodies negative. TSH 1.26 and FT4 17.3 are both ideal, confirming no current thyroid dysfunction. Annual monitoring of TSH and FT4 is recommended.\nApoB 1.40 (very high, target below 0.9), LDL 4.38 (target below 3.0), non-HDL 4.80 (target below 4.0), total cholesterol 6.4. These are partially driven by Lp(a) at 61.7 (above 32 threshold, inherited and unmodifiable). Lp(a)-corrected LDL is 4.18, confirming a large modifiable component. Cardiovascular risk score 60 out of 100. HDL 1.60, triglycerides 1.05 and TG:HDL ratio 0.66 are all excellent, indicating a metabolically healthy lipid environment with elevated particle count.\nLp(a) 61.7 against a target of below 32. This is inherited, permanent, and cannot be changed by lifestyle. It should be recorded in the permanent medical record. First-degree relatives should be offered testing.\nSHBG 95.4 against an upper limit of 65.8. Despite a total testosterone of 32.4 (above range), free testosterone is 0.338 and bioavailable testosterone is 8.28, both within functional ranges. Elevated SHBG is likely multifactorial: age, high fibre intake, moderate alcohol, possible subclinical thyroid autoimmune effect.\nCystatin C 1.13 against an upper limit of 1.10. Combined eGFR 76. No proteinuria, no haematuria, electrolytes normal. Likely represents mild age-related decline but should be trended annually.\nBilirubin 24 against an upper limit of 21 with all liver enzymes clean. Pattern consistent with Gilbert's syndrome, an inherited and harmless variation.\nFIB-4 1.52 against a threshold of 1.45. At 54, driven by age and a very low ALT (14) inflating the calculation. APRI 0.263 and all liver markers are normal. No fibroscan needed.\nReticulocyte absolute count 45.9 against a lower limit of 50, marginally low. With normal haemoglobin, iron stores and reticulocyte percentage, this reflects age-related bone marrow changes and is not clinically significant.\nDe Ritis ratio 1.71 against an upper limit of 1.6. Driven by the very low ALT of 14 rather than an elevated AST (24, normal). Not clinically meaningful when both enzymes are within range.\nReassuring negatives: glucose metabolism excellent (HbA1c 39, fasting insulin 5, HOMA-IR 1.13), liver healthy (ALT 14, GGT 19, APRI 0.26), prostate clear (PSA 0.77, free ratio 0.64), coeliac negative, rheumatoid factor negative, full blood count normal, iron studies ideal, thyroid function normal despite antibodies, urinalysis clean, tumour markers clear.","recommendations":"Discuss the IgE of 1,075 (ten times the upper limit) and ESR of 30 with your GP. Request specific allergen testing (specific IgE panel or referral for skin prick testing) to identify the trigger. Bring the eosinophil count of 0.21 (within range) as additional context.\nAsk your GP to record your Lp(a) of 61.7 permanently in your medical notes. This is inherited, unmodifiable, and increases cardiovascular risk independently of LDL. Request that first-degree relatives (siblings, children) are offered Lp(a) testing.\nDiscuss the lipid profile with your GP: ApoB 1.40, LDL 4.38, non-HDL 4.80, Lp(a) 61.7. Given the combination of elevated ApoB and raised Lp(a), your GP may consider statin therapy. Dietary modification should be attempted first (or alongside), but the Lp(a) component means lifestyle alone may not bring ApoB below target.\nInform your GP of the TPO antibodies at 58.6 with current normal thyroid function (TSH 1.26, FT4 17.3, FT3 5.1). Request annual thyroid monitoring (TSH and FT4) to detect any future decline early.\nAsk your GP to note the cystatin C eGFR of 76 as a baseline and repeat kidney function including cystatin C in twelve months to establish the trend.\nRetest in six months: lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB, ApoA1), IgE, ESR, CRP, TSH, FT4, cystatin C and eGFR. This will show whether dietary changes are moving ApoB, whether allergen management has reduced IgE and ESR, and whether thyroid function and kidney filtration remain stable. Maintain your calorie intake around 2,500 kcal with at least 130 grams of protein per day to support your training, metabolic health and longevity goal.","supplementation":"Vitamin D3 (cholecalciferol), 3,000 IU daily, taken with your largest meal (it needs dietary fat for absorption). Pair with vitamin K2 (MK-7), 100 micrograms daily, taken at the same time. Why: your vitamin D is 89, above sufficient but below the optimal range of 75 to 120. With positive TPO antibodies, there is evidence that vitamin D in the 100 to 120 range may help modulate autoimmune thyroid activity. K2 ensures the calcium mobilised by vitamin D is directed to bones rather than arteries.\nOmega-3 fish oil, 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (yours are already good at 1.05, so this is a maintenance dose), reduces inflammation (relevant to your ESR of 30 and CRP of 1.1), and may provide a modest reduction in Lp(a)-associated risk.\nVitamin B12 (sublingual methylcobalamin), 1,000 micrograms daily, dissolved under the tongue. Why: your B12 is 451, within the laboratory range but below the optimal threshold of 500. Sublingual delivery bypasses any absorption issues and is more effective than oral tablets.\nFolate (methylfolate), 400 micrograms daily. Why: your folate is 7.0, just below the optimal level of 8. B12 and folate work together in the methylation cycle, and optimising both supports homocysteine metabolism and DNA repair, which is directly relevant to your longevity goal.\nMagnesium (glycinate), 300 milligrams, taken before bed. Why: your magnesium is 0.95, within the optimal range, but supplementation supports sleep quality, muscle recovery from your four weekly sessions, and may help on the weeks when stress is harder to manage.\nDo not take iron supplements. Your ferritin is 112, transferrin saturation is 31.6 percent, and iron stores are ideal. Additional iron at this level risks pushing stores into the range associated with oxidative stress.\nThe most important changes from this report are not supplements. They are identifying the allergen behind the IgE of 1,075, reducing saturated fat to lower ApoB, adding oily fish and soluble fibre, and discussing Lp(a) and the lipid profile with your GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 48 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 48.3. Weakest systems: lipids & cardiovascular 10%, immunology 25%, inflammation 30%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Sex Hormone Binding Globulin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"47.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4042","lower_normal":"","upper_normal":"59","lower_optimal":"","upper_optimal":"54","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4576","units":"years","description":"PhenoAge is calculat "upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how many millilitres of blood the kidneys filter per minute, calculated from creatinine, age, sex and ethnicity. An eGFR above 90 is considered ideal; 60 to 89 is mildly reduced. Nigel's creatinine-based eGFR of 78 sits in the mildly reduced category. Creatinine can overestimate kidney function in people with low muscle mass and underestimate it in muscular individuals, so the cystatin C-based eGFR provides a more reliable comparison.","low_causes":"Kidney disease, dehydration, medications, obstruction","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5136","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells, freely filtered by the kidneys and not affected by muscle mass, diet or exercise. This makes it a more reliable marker of kidney filtration than creatinine, particularly in people with above-average or below-average muscle mass. Nigel's cystatin C is 1.13 against an upper limit of 1.10, marginally above range. The cystatin C-based eGFR is 76, confirming a mildly reduced filtration rate. With no proteinuria, no haematuria and normal electrolytes, this is likely early age-related kidney decline, but it should be monitored annually to confirm stability.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Reduced kidney function, inflammation, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C rather than creatinine, providing a muscle-mass-independent estimate of kidney filtration. Nigel's cystatin C eGFR of 76 is consistent with his creatinine-based eGFR of 78, both indicating mildly reduced filtration. At 54, this is slightly lower than expected by age alone and should be trended over time.","low_causes":"Kidney disease, ageing, medications","high_causes":"High cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"362","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4729","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2705","upper_optimal_position":"0.5398","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in foods like red meat, shellfish and alcohol. High levels can crystallise in joints (gout) and are associated with cardiovascular risk and kidney stones. Nigel's 362 is within the ideal range for a man of 200 to 380, indicating good uric acid clearance.","low_causes":"Low purine diet, medications, liver disease","high_causes":"High purine diet, alcohol, kidney impairment, metabolic syndrome, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This is the combined eGFR, calculated using both creatinine and cystatin C for the most reliable estimate of kidney filtration. At 76, it confirms mildly reduced filtration, consistent with both the individual eGFR estimates. No proteinuria or haematuria is present. This should be trended annually to confirm stability.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"High cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"78.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5494","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal causes of elevated urea (dehydration, high protein diet) and intrinsic kidney disease. Nigel's ratio of 78.9 is within the ideal range, suggesting that his mildly elevated urea is proportionate to his creatinine and likely reflects high protein intake rather than a renal problem.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6400","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. Nigel's 80 is within the ideal range, reflecting good nutrition and liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5729","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, drugs and nutrients, and maintains fluid balance. Nigel's 45 is within the ideal range, indicating good liver function and nutrition. Albumin is also one of the inputs to PhenoAge, where higher levels are associated with a younger biological age.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulins are a group of proteins that include immunoglobulins (antibodies) and transport proteins. Nigel's globulin of 35 is within the laboratory range but above the optimal band of 20 to 32. This is consistent with his elevated IgE (1,075) and IgG at the upper end (14.5), as both are globulins and contribute directly to the total. It reflects immune activation rather than liver disease.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune conditions, elevated immunoglobulins, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3690","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. A low ratio suggests either reduced albumin or elevated globulin. Nigel's ratio of 1.29 is within the laboratory range but just below the optimal band of 1.3, pulled down by the elevated globulin (35) rather than by low albumin (45, which is ideal). The elevated globulin is explained by the high IgE and upper-range IgG driving up the globulin fraction.","low_causes":"Elevated immunoglobulins, liver disease, chronic infection, autoimmune conditions","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. It can be elevated in liver obstruction, bone disease or during periods of bone growth. Nigel's 71 is within the ideal range, confirming healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Liver obstruction, bone disease, Paget's disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Nigel's bilirubin is 24 against an upper limit of 21. Crucially, every liver enzyme is clean: ALT 14, GGT 19, AST 24, ALP 71, and albumin 45. This pattern, where bilirubin is mildly elevated with entirely normal liver enzymes, is consistent with Gilbert's syndrome. Gilbert's is an inherited variation in bilirubin metabolism that affects five to ten percent of the population. It is completely harmless, does not progress, and does not require treatment. It is worth knowing about because it will cause bilirubin to appear flagged on future blood tests.","low_causes":"Normal variation","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme predominantly found in liver cells. When liver cells are
