const REPORT_DATA = {"patient_name":"Szymon Stodolak","dob":"31/07/1996","report_date":"2026-10-15","summary":"Customer is a 30-year-old male presenting with a BMI of 22.7, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food daily and sugary food some days; portions are slightly below average (volume 4 out of 10). He trains once per week with one cardio session and no resistance training at moderate intensity, averaging 7,500 to 10,000 daily steps. He sleeps 7 to 8 hours but wakes tired most mornings, with energy low all day; stress feels hard to manage some weeks. He does not drink alcohol. He supplements with protein powder and omega-3 fish oil. He has no family history recorded and has not had a previous blood test. He has a diagnosis of ankylosing spondylitis for the past ten years. He reports low energy and fatigue, brain fog, and low sex drive. His goals are to improve sleep quality, improve energy levels, and improve mood.\n\nThe finding that stands out most in this report, and the one that colours almost everything else, is his inflammatory marker. His high-sensitivity CRP is 7.7, well above the upper limit of 5 and nearly eight times the optimal ceiling of 1.0. In a healthy 30-year-old male with a BMI of 22.7 and no alcohol intake, a CRP this high is not coming from metabolic strain or lifestyle. The most likely explanation, by a considerable margin, is his ankylosing spondylitis. CRP is a protein the liver releases into the bloodstream when there is active inflammation anywhere in the body, and ankylosing spondylitis is a chronic inflammatory condition of the spine and sacroiliac joints that drives CRP upward during flares or periods of ongoing disease activity. This level suggests the disease is not fully quiescent, and it would be worth discussing with his rheumatologist or GP whether his current management, if any, needs reviewing. Active inflammation at this level is also one of the most plausible explanations for the fatigue, brain fog, and low energy he reports: systemic inflammation is biologically expensive and diverts resources away from the processes that maintain alertness, concentration, and drive.\n\nHis ESR is 33, nearly three times the upper limit of 12 for a male. ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over an hour, and it rises when inflammatory proteins in the blood make red cells clump together. An ESR of 33 alongside a CRP of 7.7 confirms that this is genuine, sustained inflammation rather than a one-off spike. Again, ankylosing spondylitis is the overwhelmingly likely source, and the two markers together give his GP or rheumatologist a clear picture of current disease activity.\n\nHis IgA is 4.4, above the upper limit of 3.5. IgA, or immunoglobulin A, is an antibody that protects the linings of the gut, respiratory tract, and urinary tract. Elevated IgA is a recognised feature of ankylosing spondylitis. The condition is strongly associated with mucosal immune activation, and raised IgA is common enough in AS that it is almost expected. His coeliac screen (tissue transglutaminase IgA) is negative, which rules out coeliac disease as a separate cause. It is worth noting, however, that his IgA being elevated means the coeliac screen is reliable, because a falsely negative coeliac result only occurs when IgA is low, not high.\n\nHis IgE is 141, above the upper limit of 100. IgE is the antibody the immune system produces in response to allergens, parasites, or certain inflammatory conditions. At 141 it is moderately raised, and while this could reflect a mild allergic tendency, there is also a body of evidence linking raised IgE to spondyloarthropathies. He does not report hay fever, asthma, or eczema in his quiz, so environmental allergy is possible but not confirmed. If he experiences any allergic symptoms, this is worth discussing with his GP, but in isolation the elevation is mild and does not require urgent action.\n\nWith those inflammatory findings established as the dominant theme, there is a great deal of genuinely positive news in this report. His thyroid function is excellent. TSH at 0.98 sits right in the optimal zone between 1.0 and 2.5 (just fractionally below the ideal floor, but functionally perfect), Free T4 at 17 is comfortably within the ideal window of 14 to 20, and Free T3 at 5.2 falls within the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which rules out autoimmune thyroid disease entirely. This is worth calling out explicitly because autoimmune conditions can cluster, and knowing his thyroid is clear and antibody-negative is reassuring. His blood sugar control is excellent. Fasting glucose at 4.8 sits comfortably in the optimal window below 5.4, HbA1c at 34 mmol/mol is well below the optimal ceiling of 36, and his fasting insulin at 5.36 is within the ideal band of 2 to 8. His HOMA-IR, a measure of how well his cells respond to insulin, is 1.14, which is firmly in the insulin-sensitive range. His estimated average glucose is 5.8, and his TyG index at 8.71 is within range. His pancreas is doing exactly what it should with very little effort, and there is no sign of insulin resistance whatsoever. His kidney function is good. Creatinine at 65 sits right at the lower boundary of the lab range, which at his lean build is normal. His Cystatin C-derived eGFR is 96 and the combined creatinine-Cystatin C eGFR is also 96, both above the optimal threshold of 90, meaning his kidneys are filtering efficiently. His urea, sodium, potassium, chloride, and bicarbonate are all within range, and his calculated serum osmolality at 290.2 confirms normal fluid balance. His liver is in good health. ALT at 37 is within the laboratory limit of 56 but sits above the tighter optimal ceiling of 30 for a male. This is a very minor finding and at this margin is more likely normal individual variation than any liver concern, particularly given that his AST at 23, GGT at 23 (well below the optimal ceiling of 25), ALP at 63, bilirubin at 7, and albumin at 41 are all healthy. His FIB-4 score at 0.58 and APRI at 0.292 both confirm there is no sign of liver scarring. His NAFLD fibrosis score at minus 3.081 firmly excludes fibrotic change. His amylase and lipase, the two pancreatic enzymes, are both mid-range, which means his pancreas is under no strain. His full blood count is mostly very healthy. Haemoglobin at 143, red cell count at 4.74, haematocrit at 0.412, and all red cell indices are within range. His white cell count at 6.49 is normal, with neutrophils, lymphocytes, monocytes, eosinophils, and basophils all well placed. His NLR (neutrophil-to-lymphocyte ratio) calculates to 2.51, within the laboratory range of 1 to 3 but above the optimal ceiling of 2.0, which is consistent with the inflammatory picture already established by CRP and ESR. His platelets at 197 are healthy. His prostate markers are excellent, with PSA at 0.54 well below the 2.5 threshold and a free-to-total ratio of 0.407, which is strongly reassuring. His tumour markers CA19-9 and CEA are both undetectable. Rheumatoid factor at 4 is well within range, which is useful because it helps distinguish his ankylosing spondylitis from rheumatoid arthritis. IgG and IgM are both normal. His cortisol at 260 is within the morning reference range, sitting in the middle of the expected band, which does not suggest adrenal insufficiency or excess. DHEA-S at 6.5 umol/L (approximately 2,395 ug/dL) is healthy for a 30-year-old male. His creatine kinase at 184 is well within range, meaning there is no muscle damage or excessive breakdown.\n\nTurning to his lipid profile, this is the area where lifestyle action can make the biggest difference. His total cholesterol is 5.4, above the desirable threshold of 5.18. His LDL cholesterol, the main carrier of cholesterol into artery walls, is 3.65 against an upper limit of 3.0 and an optimal target below 2.6. His ApoB, which is a direct count of the number of cholesterol-carrying particles in the blood and considered the single best predictor of cardiovascular risk, is 1.22, well above the desirable threshold of 0.9 and above the optimal target of 0.8. His ApoB-to-ApoA1 ratio is 0.89, sitting at the boundary of average and higher risk, above the optimal threshold of 0.7. His HDL, the protective cholesterol that carries fat away from artery walls, is 1.1. While this sits above the high-risk floor of 1.04, it is below the optimal level of 1.4 for a male. His triglycerides at 1.58 are within the fasting limit of 1.7 but above the optimal ceiling of 1.0, which, combined with low HDL, is a pattern that responds strongly to dietary change, specifically reducing ultra-processed food and refined carbohydrates while increasing fibre, oily fish, and healthy fats. His Lp(a), or lipoprotein(a), is 70.8, above the ideal threshold of 32. Lp(a) is an inherited lipoprotein particle that deposits cholesterol into artery walls, encourages blood clotting, and promotes inflammation. It is genetically determined and cannot be changed by diet, exercise, or any currently available supplement. This is a permanent piece of medical information that should be recorded in his GP notes and shared with first-degree relatives so they can be tested. His Lp(a)-corrected LDL, which estimates how much of his LDL is modifiable by lifestyle, is 3.42, still above the 3.0 limit but showing that the majority of his LDL burden is driven by diet and lifestyle rather than Lp(a) alone. The combination of elevated ApoB, elevated LDL, below-optimal HDL, above-optimal triglycerides, and a raised Lp(a) gives him a Cardiovascular Risk Score of 80 out of 100 on the TrueVitals scale. This score has no age component: it measures the biological risk being built right now, and at 80 it is high. His ten-year absolute risk of a cardiovascular event at 30 is low simply because of his age, but the gap between a high biological score and a low ten-year risk is exactly the window in which to act. ApoB and LDL are the primary drivers, triglycerides and HDL are secondary, and Lp(a) adds a fixed inherited contribution. Reducing his ApoB and LDL through diet, and raising his HDL through exercise, are the two most powerful levers.\n\nHis testosterone at 17 is within the laboratory range of 8.4 to 28.7 but sits below the optimal band of 18 to 30. Free testosterone, calculated at 0.389, is within range, and bioavailable testosterone at 8.71 is also within range. SHBG at 29.6 is normal. LH at 2.18 and FSH at 3.49 are both within range, sitting at the lower end, which means the pituitary gland is not pushing hard to stimulate the testes, suggesting this is not a testicular failure pattern but rather that the hypothalamic-pituitary axis is set at a low-normal operating point. Oestradiol at 78 and prolactin at 90 are both well within range and not suppressing testosterone. At 30 with a BMI of 22.7 and no alcohol, a testosterone of 17 is not clinically deficient, but it is below the level associated with optimal energy, drive, mood, and libido, and it may be contributing to the low sex drive he reports. Chronic inflammation, as evidenced by his CRP of 7.7 and ESR of 33, is a recognised suppressor of testosterone production, acting on the hypothalamus to reduce the signal to the testes. Better control of his ankylosing spondylitis inflammation, combined with the addition of resistance training (which he is currently not doing at all), could meaningfully raise this number. Sleep quality is another factor: he sleeps 7 to 8 hours but wakes tired, and testosterone is produced primarily during deep sleep, so improving sleep quality rather than just duration may help.\n\nHis vitamin D at 68 is sufficient but below the optimal range of 75 to 120. Vitamin D plays a role in immune regulation, bone health, mood, and energy, and in someone with ankylosing spondylitis there is a particular interest in maintaining optimal levels because vitamin D modulates the inflammatory pathways involved in the disease. His current level would benefit from supplementation to bring it into the 80 to 100 range. His B12 at 395 is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism, and a level below 500 can contribute to fatigue and brain fog in some individuals. His folate at 11 is healthy and above the optimal threshold of 8. Magnesium at 0.78 is within the laboratory range but below the optimal band of 0.85 to 1.05. Magnesium is involved in over 300 enzymatic processes including sleep regulation, muscle relaxation, and mood, and given his sleep complaints and fatigue, optimising this level with supplementation is worthwhile. Calcium at 2.37 and corrected calcium at 2.4 are both well within range. Phosphate at 1.1 and PTH at 3.3 are normal, confirming healthy bone mineral metabolism.\n\nHis iron studies tell a mixed story. Ferritin at 92 is within the optimal male range of 50 to 200, which is reassuring. Serum iron at 11.6 sits right at the lower boundary of the reference range. Transferrin at 2.1 is marginally below the lower limit of 2.15. Transferrin is the protein that carries iron through the bloodstream, and it is also a negative acute-phase protein, meaning it falls when inflammation is present. With a CRP of 7.7, the marginally low transferrin is almost certainly being suppressed by his ankylosing spondylitis inflammation rather than representing a true iron transport problem. His transferrin saturation at 22% is within the laboratory range of 18 to 55 but below the optimal band of 25 to 40%, and again, the inflammatory suppression of transferrin can distort this ratio. Iron binding capacity at 46.9 is within range. The overall picture is that his iron stores are adequate but the transport and availability of iron is being mildly impaired by chronic inflammation.\n\nHis C-Peptide at 1.03 ug/L converts to approximately 341 pmol/L, which is marginally below the lower limit of the lab range (1.1 ug/L or 364 pmol/L). C-Peptide is released alongside insulin in equal amounts by the pancreas and serves as a reliable marker of how much insulin the body is producing. With his fasting glucose at 4.8 and HbA1c at 34, this is not a sign of pancreatic failure. It simply reflects that his body is insulin-sensitive and does not need to produce much insulin to maintain excellent blood sugar control. This is a positive finding dressed up as an abnormal number.\n\nHis reticulocyte absolute count at 40.8 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count means the marrow is producing red cells at a slightly reduced rate. His haemoglobin at 143 is perfectly healthy, so this is not causing anaemia. Chronic inflammation is a recognised suppressor of erythropoiesis, the process of red cell production in the bone marrow, and at a CRP of 7.7 this is the most likely explanation. It does not require separate investigation but adds to the case for better inflammatory control.\n\nHis MCHC at 347 is marginally above the upper limit of 345. At this margin, this is laboratory variation, often influenced by sample temperature and storage, and is of no clinical significance. His total antioxidant activity at 2.03 is above the upper limit of 1.77, which is a positive finding, likely reflecting his omega-3 supplementation and dietary antioxidants.\n\nHis Cystatin C at 1.11 is marginally above the upper limit of 1.1. Cystatin C is a small protein filtered by the kidneys and used to estimate kidney function. However, his Cystatin C-derived eGFR is 96, which is above the optimal threshold of 90 and indicates healthy kidney filtration. A borderline Cystatin C in the presence of a healthy eGFR at age 30 is not a concern, but systemic inflammation can mildly elevate Cystatin C independently of kidney function, and at a CRP of 7.7 that is the most plausible explanation.\n\nHis PhenoAge is 26.9 against a calendar age of 30, placing him 3.1 years biologically younger. This is a positive finding, driven by his healthy glucose, albumin, and white cell count, despite the inflammatory markers pulling in the other direction. With better inflammatory control, this gap could widen further.\n\nNo urine sample was received, so the urinalysis panel is not available for this report.\n\nPulling this together, the dominant theme of this report is chronic inflammation from ankylosing spondylitis, and the secondary theme is a lipid profile that needs attention through diet and exercise. The inflammation is likely contributing to his fatigue, brain fog, low drive, mildly suppressed testosterone, low reticulocytes, suppressed transferrin, and possibly the mildly elevated Cystatin C. The lipid picture, with elevated ApoB and LDL, low HDL, above-optimal triglycerides, and an inherited raised Lp(a), gives a cardiovascular risk score that demands action now while his age provides the window for it. His blood sugar control, thyroid, liver, kidney function, prostate, and immune function (outside the IgA and IgE findings explained by his AS) are all in excellent shape. The lifestyle levers he has available, reducing ultra-processed food, adding resistance training, optimising vitamin D, B12, and magnesium, and working with his rheumatologist on inflammatory control, are clear and actionable.","links":"The thread that ties the majority of the abnormal findings together is his ankylosing spondylitis and the chronic inflammation it drives. His CRP at 7.7 and ESR at 33 are both significantly elevated, and rather than representing two separate problems, they confirm the same thing: there is active, ongoing systemic inflammation. From that single source, several downstream effects follow. His transferrin at 2.1, marginally below the lower limit, is being suppressed because transferrin is a negative acute-phase protein, meaning the liver produces less of it when inflammation is present. His transferrin saturation at 22%, below the optimal 25%, is partly a consequence of that suppressed transferrin distorting the ratio. His reticulocyte absolute count at 40.8, below the lower limit of 50, reflects mild suppression of red cell production in the bone marrow, a well-recognised effect of chronic inflammation on erythropoiesis. His Cystatin C at 1.11, marginally above 1.1, may be mildly elevated by the inflammatory state rather than by any kidney dysfunction, given that his eGFR calculates to 96. His IgA at 4.4 is a direct immunological feature of ankylosing spondylitis itself, driven by mucosal immune activation that is characteristic of spondyloarthropathies. Even his NLR at 2.51, above the optimal ceiling of 2.0, and his SII at 494, at the upper end of normal, fit the inflammatory picture without representing separate pathology. His testosterone at 17, below the optimal floor of 18, is also plausibly being held down by the same inflammatory signalling, which acts on the hypothalamus to reduce gonadotropin-releasing hormone output.\n\nThe lipid findings are a separate story, unrelated to the ankylosing spondylitis and driven by dietary pattern and genetics. His ApoB at 1.22, LDL at 3.65, and below-optimal HDL at 1.1 point to a diet high in ultra-processed food and refined carbohydrate (which he confirms he eats daily) combined with very little exercise (one cardio session, no resistance training). His triglycerides at 1.58, while within the fasting limit, are above optimal and consistent with this dietary pattern. Layered on top of this modifiable picture is his Lp(a) at 70.8, an inherited and unchangeable particle that adds its own contribution to cardiovascular risk. His Lp(a)-corrected LDL at 3.42 shows that even after removing the Lp(a) contribution, his LDL remains above target, confirming that the dietary and lifestyle contribution is substantial and worth addressing.\n\nWhat has been positively excluded is as important as what has been found. His thyroid is clear, with both antibodies undetectable, ruling out autoimmune thyroid disease, a condition that can cluster with other autoimmune conditions. His blood sugar metabolism is excellent across every measure, which at his BMI is expected but still worth confirming given the dietary pattern. His liver shows no strain, his kidneys are filtering well, his prostate markers are exemplary, and his tumour markers are undetectable. Rheumatoid factor is negative, which helps distinguish his spondyloarthropathy from rheumatoid arthritis and confirms the inflammation is not from a second autoimmune joint condition.\n\nThe loose ends are few. His IgE at 141 could reflect an allergic tendency or could be part of the spondyloarthropathy immunological profile; it does not require urgent investigation but is worth mentioning if he develops allergic symptoms. His vitamin D at 68, B12 at 395, and magnesium at 0.78, while not abnormal in the laboratory sense, are all below the optimal levels associated with energy, mood, immune regulation, and sleep quality, and optimising them is straightforward with targeted supplementation.","lifestyle":"Cut back on ultra-processed food to no more than twice a week, starting this week. Swap the daily UPF for a meal built around whole ingredients: rice, pasta, potatoes, or bread with a protein source and vegetables. Anchor: your evening meal is the easiest place to start. Why: ultra-processed food drives up triglycerides (yours are 1.58, above the optimal 1.0) and LDL, and replacing it is the single biggest lever for your ApoB of 1.22.\nAdd a palm-sized portion of protein to every meal, including breakfast. Eggs, Greek yoghurt, tinned fish, chicken, or your protein powder all count. Anchor: protein goes on the plate before anything else. Why: protein at every meal supports satiety on a diet volume of 4 out of 10, helps build the muscle your testosterone and energy need, and gives the building blocks for the immune repair your body is doing with an ESR of 33.\nEat two portions of oily fish a week: salmon, mackerel, sardines, or trout. Anchor: replace two of your current evening meals. Why: the omega-3 in oily fish lowers triglycerides, raises HDL (yours is 1.1, below the 1.4 target), and has a direct anti-inflammatory effect relevant to your ankylosing spondylitis.\nAdd two resistance training sessions per week, even 20 to 30 minutes each. Bodyweight exercises, dumbbells, or machines all work. Anchor: attach them to two existing days in your week, same time, same place. Why: resistance training is the most reliable way to raise HDL, increase testosterone (yours is 17, below the optimal 18), improve energy, and build the muscle that protects your spine and joints in ankylosing spondylitis.\nIncrease your vegetable and fruit intake from 2 to 3 portions to at least 5 a day. Add one portion to lunch and one to dinner this week, then build. Anchor: every meal has at least one portion of colour on the plate. Why: the soluble fibre in vegetables and fruit actively lowers LDL cholesterol and ApoB, and the micronutrients support the immune system working overtime with an IgA of 4.4.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk improves glucose and triglyceride clearance and, combined with your existing step count, edges HDL upward.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking for natural light. Anchor: alarm goes off, curtains open, step outside. Why: a fixed light-dark signal resets the circadian rhythm that governs deep sleep, which is when testosterone is produced and tissue repair happens, both of which matter for your fatigue and the tired-on-waking pattern you report.\nCut caffeine after 1pm. Anchor: your last coffee or tea is with or before lunch. Why: caffeine has a half-life of five to six hours, and any consumed after early afternoon fragments the deep sleep stages you need for recovery and testosterone production.","flags":"hs-CRP 7.7 (limit less than 5, optimal less than 1.0) and ESR 33 (limit less than 12): significantly elevated inflammatory markers consistent with active ankylosing spondylitis. This level of systemic inflammation is the dominant finding and is likely contributing to fatigue, brain fog, suppressed reticulocyte production, mildly suppressed transferrin, and below-optimal testosterone. His rheumatologist or GP should review whether current disease management is adequate.\nApoB 1.22 (desirable less than 0.9, optimal less than 0.8), LDL 3.65 (limit 3.0, optimal less than 2.6), total cholesterol 5.4 (desirable less than 5.18), non-HDL 4.3 (limit less than 4.0), TC/HDL ratio 4.91 (limit less than 4.5), ApoB/A1 ratio 0.89 (optimal less than 0.7), HDL 1.1 (optimal above 1.4 for male), triglycerides 1.58 (optimal less than 1.0): a lipid profile with elevated atherogenic particle count and below-optimal protective cholesterol, driven by dietary pattern and partly by inherited Lp(a). Cardiovascular Risk Score 80 out of 100, driven primarily by ApoB, LDL, Lp(a), and HDL.\nLp(a) 70.8 (ideal less than 32): inherited, genetically fixed, slightly increased risk category. Cannot be modified by diet or exercise. Should be recorded permanently in GP notes. First-degree relatives should be offered testing.\nIgA 4.4 (range 0.4 to 3.5): elevated, consistent with ankylosing spondylitis mucosal immune activation. Coeliac screen negative, ruling out coeliac disease.\nIgE 141 (limit less than 100): mildly elevated. May reflect allergic tendency or spondyloarthropathy-related immune activation. Worth noting if allergic symptoms develop.\nTestosterone 17 (range 8.4 to 28.7, optimal 18 to 30): below optimal at 30. Low-normal LH at 2.18 suggests hypothalamic-pituitary suppression, likely contributed to by chronic inflammation. Connected to his low libido complaint.\nReticulocyte absolute count 40.8 (range 50 to 100): mildly suppressed red cell production, most likely due to chronic inflammatory suppression of erythropoiesis. Haemoglobin is normal at 143, so no anaemia.\nTransferrin 2.1 (range 2.15 to 3.65): marginally below range, likely suppressed as a negative acute-phase protein in the context of CRP 7.7.\nCystatin C 1.11 (limit less than 1.1): marginally above range, but eGFR from Cystatin C is 96, indicating healthy kidney function. Mild elevation likely related to systemic inflammation rather than renal impairment.\nC-Peptide 1.03 ug/L (range 1.1 to 4.4): marginally below range, but with fasting glucose 4.8 and HbA1c 34, this reflects low insulin demand in an insulin-sensitive individual, not pancreatic insufficiency.\nVitamin D 68 (sufficient, optimal 75 to 120): below optimal. Supplementation recommended, especially given ankylosing spondylitis and immune regulation needs.\nB12 395 (range 193 to 982, optimal above 500): below optimal. May contribute to fatigue and brain fog.\nMagnesium 0.78 (range 0.53 to 1.11, optimal 0.85 to 1.05): below optimal. Relevant to sleep quality and energy complaints.\nMCHC 347 (range 315 to 345): marginally above range by 2 units, likely laboratory variation related to sample storage and temperature. Not clinically significant.\nTotal antioxidant activity 2.03 (range 1.3 to 1.77): above range, a positive finding likely reflecting omega-3 supplementation.\nReassuring negatives: thyroid function excellent with both antibodies undetectable, blood sugar control optimal across all measures (glucose 4.8, HbA1c 34, insulin 5.36, HOMA-IR 1.14), liver fully healthy with FIB-4 0.58 and all enzymes within range, kidney filtration healthy at eGFR 96, prostate markers excellent (PSA 0.54), tumour markers undetectable, rheumatoid factor negative, cortisol normal, DHEA-S healthy, coeliac screen negative.\nNo urine sample was received, so the full urinalysis panel is not available for this report.","recommendations":"Discuss the CRP of 7.7 and ESR of 33 with your rheumatologist or GP. These levels suggest your ankylosing spondylitis is not fully quiescent and may benefit from a review of your current management. Bring these numbers to the appointment.\nAsk your GP to record your Lp(a) of 70.8 permanently in your medical notes. This is an inherited cardiovascular risk factor that cannot be changed by lifestyle. Request that first-degree relatives (parents, siblings) are offered an Lp(a) test.\nDiscuss your lipid profile with your GP: ApoB 1.22, LDL 3.65, HDL 1.1, triglycerides 1.58, and Lp(a) 70.8. Given the inherited Lp(a) contribution, dietary and exercise changes are the first line, but your GP should be aware of the full picture in case pharmacological support is considered in future.\nDiscuss your testosterone of 17 and your low libido symptom with your GP. Given the chronic inflammation, the first step is optimising inflammatory control, adding resistance training, and retesting in four to six months before considering hormonal investigation.\nAsk your GP or rheumatologist whether your IgA of 4.4 and IgE of 141 have been tracked previously and whether they warrant monitoring alongside your ankylosing spondylitis.\nCalorie and protein targets: at 72 kg, 178 cm, 30 years old, and lightly active (one cardio session, 7,500 to 10,000 steps), your estimated maintenance is approximately 2,250 to 2,400 calories per day. With a diet volume of 4 out of 10, you may be under-eating. Aim for at least 2,200 calories daily. Protein target: 94 to 115 g per day (1.3 to 1.6 g per kg), increasing to 115 to 144 g per day if you add resistance training. Retest in four to six months, repeating CRP, ESR, full lipid profile with ApoB, testosterone, vitamin D, B12, and a full blood count to track reticulocyte recovery and inflammatory control.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal containing fat. Why: your level is 68, below the optimal range of 75 to 120. Vitamin D modulates the immune pathways involved in ankylosing spondylitis and supports mood, energy, and bone health. Aim to retest in four months and adjust to maintain 80 to 100.\nVitamin K2 (MK-7): 100 mcg daily, taken alongside your vitamin D. Why: K2 directs calcium into bones and away from arteries. Always taken alongside vitamin D supplementation, and particularly relevant with a chronic inflammatory condition affecting the spine.\nMagnesium glycinate: 300 to 400 mg, taken before bed. Why: your magnesium is 0.78, below the optimal range of 0.85 to 1.05. Glycinate is the form best absorbed and least likely to cause gut irritation, and it supports sleep quality, which you report as poor, as well as muscle relaxation and energy production.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue, not swallowed as a tablet. Why: your B12 is 395, below the optimal threshold of 500. B12 supports nerve function and energy metabolism and may contribute to the brain fog and fatigue you report.\nOmega-3 fish oil: continue your current supplement, aiming for a combined EPA and DHA dose of 2 to 3 g daily (check the label; many capsules contain only 300 to 500 mg of actual EPA plus DHA per capsule). Take with food. Why: omega-3 has a direct anti-inflammatory effect relevant to your CRP of 7.7, and at therapeutic doses it lowers triglycerides (yours are 1.58) and supports HDL.\nDo not take iron supplements. Your ferritin is 92, well within the optimal range, and supplementing iron when stores are adequate can cause oxidative stress and gut irritation.\nThe most important changes from this report are not supplements. They are reducing ultra-processed food, adding resistance training, and working with your rheumatologist to bring your inflammatory markers under control.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 52 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 52.1. Weakest systems: inflammation 9%, lipids & cardiovascular 24%, immunology 27%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), C-Peptide.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"26.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3843","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a composite biological age estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count. His PhenoAge of 26.9 against a calendar age of 30 means his blood profile suggests a biological age 3.1 years younger than his actual age. This is a positive finding, driven by his healthy glucose, albumin, kidney function, and blood cell parameters. His CRP of 7.7 is pulling PhenoAge upward; with better inflammatory control, this gap could widen further in his favour.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It ranges from 0 to 100 and measures the biological risk being built now, with no age component. At 80, this is high, driven primarily by ApoB at 1.22, LDL at 3.65, Lp(a) at 70.8, below-optimal HDL at 1.1, and CRP at 7.7. His ten-year absolute risk of a cardiovascular event is low at 30 simply because of his age, but the gap between a high biological score and a low ten-year risk is the window in which to act. Dietary changes to lower ApoB and LDL, exercise to raise HDL, and inflammatory control to lower CRP are the levers that will bring this score down.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5536","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5119","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found mainly inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream and the level rises. His result of 37 is within the laboratory limit of 56 but above the tighter optimal ceiling of 30 for a male. This is a very mild elevation and, in the context of perfectly healthy GGT, AST, bilirubin, albumin, and fibrosis scores, does not suggest liver disease. It may reflect dietary factors or normal individual variation.","low_causes":"","high_causes":"Fatty liver, alcohol, medications, hepatitis, obesity, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It rises when any of those tissues are damaged. His result of 23 sits comfortably within both the laboratory and optimal ranges, confirming the liver is not under any strain.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, medications, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4296","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol, medications, and metabolic strain. At 23, well within the optimal ceiling of 25 and the laboratory limit of 73, this is an excellent result. In a 30-year-old who does not drink alcohol, this confirms the liver is under no metabolic or toxic strain.","low_causes":"","high_causes":"Alcohol, fatty liver, medications, bile duct obstruction, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bones, and bile ducts. It rises when there is bile duct obstruction, bone turnover, or liver disease. His result of 63 is well within range, indicating healthy liver and bone metabolism.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes it for excretion. At 7, his bilirubin is low and healthy, indicating efficient red cell recycling and liver clearance.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"62","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein is the sum of albumin and globulin in the blood. It reflects the liver's ability to produce proteins and the immune system's antibody output. At 76, this is healthy and indicates good nutritional status and liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and is a marker of nutritional and liver health. At 41, his albumin is within the optimal range, confirming good liver synthetic function and adequate protein intake.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins in the blood that includes antibodies (immunoglobulins) and transport proteins. At 35, it sits near the top of the laboratory range and above the optimal ceiling of 32. This is consistent with the elevated IgA of 4.4 seen elsewhere in this report, reflecting the increased immunoglobulin production associated with his ankylosing spondylitis.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5227","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest starch. Elevated levels can indicate pancreatic inflammation (pancreatitis). At 76, comfortably mid-range, his pancreas is functioning normally.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase and rises significantly in pancreatitis. At 41, within both the laboratory and optimal ranges, this confirms healthy pancreatic function.","low_causes":"","high_causes":"Pancreatitis, gallstones, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5213","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL, and VLDL. At 5.4, above the desirable limit of 5.18, it is mildly elevated. However, total cholesterol alone is less informative than the breakdown into its components, and the key numbers to focus on are his ApoB and LDL, which are discussed in detail elsewhere.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4647","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats in the blood that the body uses for energy. They rise after meals, especially meals rich in refined carbohydrates, sugar, and ultra-processed food. At 1.58, within the fasting limit of 1.7 but well above the optimal ceiling of 1.0, this is a clear signal that his daily ultra-processed food and sugary food habits are driving triglyceride production. Lowering triglycerides through dietary change will also help raise his HDL.","low_causes":"Very low-fat diet, hyperthyroidism, malnutrition","high_causes":"Diet high in sugar and refined carbohydrates, ultra-processed food, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4615","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, is the cholesterol fraction that carries triglycerides from the liver to the tissues. At 0.72, within the laboratory limit of 0.78 but above the optimal ceiling of 0.6, it tracks with his elevated triglycerides and reflects the same dietary pattern.","low_causes":"","high_causes":"High triglycerides, diet, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5289","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein, is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. Higher is better. At 1.1, his HDL is above the high-risk floor of 1.04 but below the optimal level of 1.4 for a male. Low HDL at a normal BMI with no alcohol is most commonly driven by lack of exercise and a diet high in refined carbohydrates, both of which apply here. Adding resistance training and replacing ultra-processed food with whole foods are the most effective ways to raise HDL.","low_causes":"Sedentary lifestyle, smoking, high-carbohydrate diet, obesity, genetics","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6083","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL, or low-density lipoprotein, is the cholesterol fraction that deposits into artery walls and drives atherosclerosis over time. At 3.65, above both the upper limit of 3.0 and the optimal target below 2.6, this is elevated. Combined with an ApoB of 1.22 and a raised Lp(a), this makes his lipid profile the most actionable area for cardiovascular risk reduction. A significant portion of this LDL is modifiable through diet: reducing saturated fat, increasing soluble fibre (oats, beans, lentils), and replacing ultra-processed food with whole foods.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5456","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL and gives a summary of the balance between harmful and protective cholesterol. At 4.91, above the limit of 4.5, this ratio is elevated because total cholesterol is high while HDL is low. Improving either side of this ratio, by lowering LDL through diet or raising HDL through exercise, will bring it down.","low_causes":"","high_causes":"High total cholesterol, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"20.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5093","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This measures what percentage of total cholesterol is HDL. Ideally above 25%, his result of 20.37% just clears the minimum threshold of 20%, meaning that only a fifth of his total cholesterol is the protective kind. Raising HDL through exercise and lowering total cholesterol through dietary changes will improve this proportion.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol, active lifestyle","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, representing all the cholesterol fractions that contribute to artery disease. At 4.3, above the limit of 4.0, this confirms the elevated atherogenic burden seen in the ApoB and LDL results.","low_causes":"","high_causes":"High LDL, high triglycerides, diet, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5708","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the number of protective cholesterol carriers in the blood. At 1.37, above the minimum of 1.2 but below the optimal level of 1.5, it tracks with his below-optimal HDL. Exercise is the most effective way to raise ApoA1.","low_causes":"Sedentary lifestyle, smoking, genetics","high_causes":"Regular exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL, and Lp(a) particle. Because each of these particles carries exactly one ApoB molecule, ApoB is a direct count of the total number of atherogenic particles in the blood and is considered the single best predictor of cardiovascular risk. At 1.22, well above the desirable limit of 0.9 and the optimal target of 0.8, there are too many cholesterol-carrying particles in his blood. This is the most important lipid number in this report and the one to focus dietary and lifestyle changes on.","low_causes":"","high_causes":"Diet high in saturated fat, genetics, high Lp(a), insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6357","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio summarises the balance between atherogenic (ApoB) and protective (ApoA1) particles. At 0.89, above the lower-risk threshold of 0.7 and sitting at the boundary of average and higher risk, this reflects both the high ApoB and below-optimal ApoA1. Bringing ApoB down and ApoA1 up through diet and exercise will improve this ratio.","low_causes":"","high_causes":"High ApoB, low ApoA1, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"70.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a), or lipoprotein(a), is an inherited lipoprotein particle similar to LDL but with an additional protein (apolipoprotein(a)) attached. It deposits cholesterol into artery walls, encourages blood clotting, and promotes local inflammation in the arteries. At 70.8, above the ideal threshold of 32, this places him in the slightly increased risk category. Critically, Lp(a) is genetically determined and cannot be changed by diet, exercise, or any currently available supplement. This result should be recorded permanently in his GP notes and first-degree relatives (parents, siblings, children) should be offered testing. His Lp(a)-corrected LDL shows that even after accounting for the Lp(a) contribution, his modifiable LDL remains above target.","low_causes":"","high_causes":"Genetics (inherited)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4063","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich particles (total cholesterol minus HDL minus LDL). At 0.65, within the laboratory limit of 0.8 but above the optimal ceiling of 0.5, it reflects the above-optimal triglyceride level. Reducing dietary sugar and ultra-processed food will lower this.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4800","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"","description":"The triglyceride-to-HDL ratio is a simple indicator of insulin resistance and cardiovascular risk. At 1.44, within the laboratory limit of 1.5 but well above the optimal ceiling of 0.9, it is driven by the combination of above-optimal triglycerides and below-optimal HDL. Despite a healthy HOMA-IR, this ratio suggests that his dietary carbohydrate and ultra-processed food load is pushing triglyceride production toward the upper tolerance.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance, high-carbohydrate diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5700","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This is his LDL cholesterol with the estimated contribution from Lp(a) particles subtracted. It represents the portion of his LDL that is modifiable through diet and lifestyle. At 3.42, still above the limit of 3.0 and well above the optimal target of 2.0, it confirms that the majority of his elevated LDL is driven by dietary and metabolic factors rather than by Lp(a) alone. This is the number that should improve with the dietary changes recommended.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.157","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6521","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from the logarithm of the triglyceride-to-HDL ratio and estimates the size and density of LDL particles. At 0.157, within the laboratory range but above the optimal ceiling of 0.11, it suggests his LDL particles may tend toward the smaller, denser type that is more easily deposited into artery walls. Lowering triglycerides and raising HDL will improve this index.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"3.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4743","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_posit cription":"MPV, or mean platelet volume, measures the average size of platelets. Larger platelets are younger and more active. At 8.1, within the optimal range, platelet production is balanced.","low_causes":"Bone marrow suppression, old platelets","high_causes":"Increased platelet destruction, inflammation, B12/folate deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4717","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. At 6.49, within the optimal range, the immune system is appropriately active without being over-stimulated.","low_causes":"Viral infections, medications, bone marrow disorders, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"4.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4737","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 4.21, within the optimal range, neutrophil production and function are healthy.","low_causes":"Viral infections, medications, autoimmune conditions, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{" upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. At 0.07, well within range, there is no sign of active allergic or parasitic activity, despite the mildly elevated IgE noted elsewhere.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infection, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory reactions. At 0.01, at the bottom of the range, this is normal.","low_causes":"Steroid use, acute allergic reaction","high_causes":"Allergies, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3900","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"The reticulocyte percentage measures the proportion of young, newly released red blood cells in the circulation. At 0.86%, within the normal range, the percentage is adequate.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow suppression","high_causes":"Blood loss, haemolysis, response to anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"40.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2720","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells in a litre of blood. At 40.8, below the lower limit of 50, the bone marrow is producing red cells at a slightly reduced rate. With haemoglobin at 143, this is not causing anaemia, but it suggests the bone marrow is being mildly suppressed. Chronic inflammation, as evidenced by his CRP of 7.7 and ESR of 33, is a well-recognised cause of suppressed erythropoiesis (the process of making new red blood cells). Better inflammatory control should restore this to the normal range.","low_causes":"Chronic inflammation, iron deficiency, B12/folate deficiency, bone marrow suppression","high_causes":"Blood loss, haemolysis, response to treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"18.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by red blood cell count and is used to distinguish iron deficiency anaemia from thalassaemia trait when the MCV is low. At 18.3, above the threshold of 13, this favours iron deficiency over thalassaemia if the MCV were to drop. In the context of a normal MCV, it is reported for reference and is not clinically relevant.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4111","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's main iron storage protein. It reflects how much iron is held in reserve. At 92, within the optimal range of 50 to 200 for a male, iron stores are healthy. Ferritin is also an acute-phase protein that rises with inflammation, so this level may be mildly inflated by his CRP of 7.7. Even accounting for that, stores appear adequate.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"11.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6162","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and after meals, making it less reliable than ferritin as a long-term indicator. At 11.6, right at the lower boundary of the reference range, it is low-normal. In the context of adequate ferritin (92) and chronic inflammation (CRP 7.7), this low serum iron likely reflects the inflammatory state redirecting iron away from the circulation and into storage, a well-recognised mechanism called functional iron deficiency or anaemia of chronic disease.","low_causes":"Iron deficiency, chronic inflammation, infection, malabsorption","high_causes":"Iron overload, haemochromatosis, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3000","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream. At 2.1, marginally below the lower limit of 2.15, it is slightly low. Transferrin is a negative acute-phase protein, meaning its production in the liver decreases when there is systemic inflammation. With a CRP of 7.7, this is the most likely explanation. His iron stores (ferritin 92) are adequate, so this does not represent an iron deficiency problem.","low_causes":"Inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"46.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3635","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3520","upper_optimal_position":"0.5761","units":"umol/l","description":"TIBC, or total iron binding capacity, measures how much capacity transferrin has to carry iron. Low TIBC with low transferrin in the setting of inflammation is a recognised pattern. At 46.9, within the laboratory range but below the optimal band, it is consistent with the inflammatory suppression of transferrin already noted.","low_causes":"Inflammation, iron overload, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3694","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures what percentage of the body's iron-carrying capacity is being used. At 22%, within the laboratory range of 18 to 55 but below the optimal band of 25 to 40%, the saturation is low-normal. This ratio is influenced by both the low serum iron and the suppressed transferrin, both of which are being affected by chronic inflammation. With adequate ferritin, this does not indicate true iron deficiency.","low_causes":"Iron deficiency, chronic inflammation","high_causes":"Iron overload, haemochromatosis, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4747","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for sex drive, muscle mass, bone density, mood, and energy. At 17, within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30, it is below the level associated with feeling at his best. At 30, with a healthy BMI and no alcohol, the most likely explanation for a below-optimal testosterone is his chronic inflammation (CRP 7.7, ESR 33), which acts on the hypothalamus to reduce the hormonal signal that stimulates testosterone production. His low-normal LH at 2.18 supports this: the pituitary is not pushing hard, suggesting the suppression is happening at the brain level rather than the testes. Adding resistance training, optimising vitamin D, and improving inflammatory control are the most effective ways to raise this.","low_causes":"Aging, obesity, chronic inflammation, stress, poor sleep, medications, hypothalamic suppression","high_causes":"Steroid use, testicular tumour, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.389","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4284","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3893","upper_optimal_position":"0.5893","units":"nmol/l","description":"Free testosterone is the small fraction of testosterone that is not bound to proteins and is immediately available for the body to use. At 0.389, within ion, and body temperature regulation. At 5.2, within the optimal range of 4.5 to 6.5, the body is converting T4 into T3 efficiently, which means the thyroid is not contributing to his fatigue or brain fog.","low_causes":"Hypothyroidism, chronic illness, low T4, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system when it attacks the thyroid gland. Their presence suggests autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At less than 6.6, well below the threshold of 13.8, there are no detectable antibodies, which rules out autoimmune thyroid disease. This is particularly reassuring in someone with an existing autoimmune condition (ankylosing spondylitis), as autoimmune diseases can cluster.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulinab","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies attack thyroglobulin, a protein used by the thyroid to produce hormones. At less than 1.3, well below the threshold of 4.4, these antibodies are undetectable, which is the case in more than 80% of the population. This further function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
