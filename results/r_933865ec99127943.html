const REPORT_DATA = {"patient_name":"Elaine Harris","dob":"24/07/1976","report_date":"2026-08-26","summary":"Elaine is a 50-year-old female presenting with a BMI of 25.3, following a standard mixed diet rated 6 out of 10 for quality with a volume of 7 out of 10. She does not currently perform any dedicated cardio or resistance training and averages 5,000 to 7,500 daily steps. She is taking HRT for perimenopausal symptoms and a proton pump inhibitor (PPI), likely omeprazole, for gastrointestinal symptoms. She reports low energy, poor sleep, and brain fog. Her goals are to reduce stress and anxiety, improve digestion and gut health, and improve sleep quality. Elaine describes feeling unwell for some time, with pain under her left lower rib radiating to her back, burning in her stomach and oesophagus, and throat pain, despite CT and ultrasound scans returning clear. She is under extreme stress and wants a comprehensive screening to look for anything underlying.\n\nThe finding in this report that stands out most sharply is her lipoprotein(a), reported at above 212.5 nmol/L, which places it in the high risk category. Lipoprotein(a), often written Lp(a), is a modified form of LDL cholesterol particle that carries an additional protein called apolipoprotein(a). It is almost entirely genetically determined, meaning diet, exercise, and lifestyle have very little effect on the level. It does three harmful things: it deposits cholesterol into artery walls just like standard LDL, it encourages blood clot formation by interfering with the body's clot-dissolving system, and it drives localised inflammation. A level above 32 nmol/L is considered elevated, and above 200 nmol/L is classified as high risk. Elaine's result exceeds even the upper reporting limit of the assay. This is a permanent piece of medical information. It should be recorded in her GP notes, it will never change, and it means that her first-degree relatives, including her children, siblings, and parents, should also be tested, since the trait is inherited and each relative has roughly a 50% chance of carrying it. The practical consequence is that her cardiovascular risk is higher than standard calculators would estimate, and her GP or a lipid specialist should factor this into any future decisions about lipid-lowering therapy. We would strongly recommend discussing this finding with her GP.\n\nAlongside the Lp(a), her broader lipid picture does need attention. Her LDL cholesterol is 3.66 mmol/L, above the 3.0 upper limit, and her ApoB, the protein that represents the actual number of atherogenic particles in the blood, is 1.06 g/L, above the 0.9 threshold. Her ApoB to ApoA1 ratio is 0.82, placing it just into the higher risk band above 0.8. Her total cholesterol is 5.6, above the desirable threshold of 5.18, and her non-HDL cholesterol sits at 4.0, right at the upper boundary. What makes this lipid picture more complicated is the Lp(a). Because Lp(a) particles each carry one ApoB molecule, a substantial proportion of her elevated ApoB count is being driven by the Lp(a) itself, something she cannot change through diet or exercise. However, there is still a modifiable component. Her triglycerides are excellent at 0.84 mmol/L, and her HDL cholesterol is 1.6, which is good and sits in the desirable range. Her TG to HDL ratio calculates to 0.53, which is a strong indicator of insulin sensitivity and metabolic health. The focus for the modifiable portion of her lipid risk should be dietary, increasing soluble fibre from oats, beans, lentils, and flaxseed, including oily fish two to three times per week, and reducing saturated fat intake, while her GP considers whether the Lp(a) level, combined with the LDL and ApoB elevation, warrants pharmacological intervention.\n\nThere is genuine good news in this report. Her blood sugar control is excellent. Fasting glucose at 4.5 mmol/L sits comfortably within the optimal range, HbA1c at 33 mmol/mol is well below the 36 optimal threshold, and her HOMA-IR, a calculated measure of insulin resistance, is 0.62, which is firmly in the insulin-sensitive range. At a healthy BMI of 25.3 and age 50, this is exactly what we would hope to see and it means her metabolic machinery is handling sugar efficiently. Her fasting insulin at 3.12 mIU/L is low but within range, reflecting genuinely low insulin demand rather than any deficiency. Her C-Peptide, which the lab flagged as low at 0.739 ug/L against a range of 1.1 to 4.4, converts to approximately 245 pmol/L. C-Peptide is released in equal amounts to insulin from the pancreas, so it acts as a cross-check. In the context of a low but adequate insulin level and perfect glucose control, this is consistent with efficient insulin signalling rather than pancreatic underperformance. The lab note also cautions that C-Peptide can degrade if the sample is not separated promptly, which may have contributed to the low reading. This is not a concern in the context of her other glucose markers.\n\nHer liver is in good health. ALT at 13 IU/L is well within the optimal range for women, AST at 17, GGT at 17, and bilirubin at 12 are all clean. Albumin at 42 g/L confirms good synthetic liver function. Her FIB-4 score, a calculation that estimates the likelihood of liver fibrosis, has come back at 1.58, just above the 1.45 threshold. However, this score is a formula that divides age multiplied by AST by platelets multiplied by the square root of ALT. At 50 with slightly low platelets of 149 and a very low ALT of 13, the maths inflates the result. With every single direct marker of liver health being clean, including a GGT of 17 which is about as reassuring as that marker gets, this FIB-4 score is being driven by the arithmetic rather than by any sign of liver disease. It is worth noting for completeness but is not a concern. Her amylase at 61 and lipase at 37 are both comfortably within range, which is particularly reassuring given her left-sided rib and back pain, as these enzymes would be expected to rise if the pancreas were inflamed.\n\nHer kidney function is strong. Cystatin C at 0.89 gives a calculated eGFR of 94, and her creatinine-based eGFR is above 90. Sodium, chloride, bicarbonate, and potassium are all within range, though potassium at 3.5 sits right at the lower boundary of its range. PPIs can occasionally contribute to low potassium and low magnesium through altered gut absorption, so this is worth monitoring. Uric acid at 205 umol/L is within range and below the optimal ceiling. Calcium, phosphate, and magnesium are all healthy, with magnesium at 0.89 sitting within the optimal band of 0.85 to 1.05.\n\nHer thyroid function is broadly normal but shows a pattern worth noting. TSH at 1.78 mIU/L is within the optimal range, and both thyroid antibodies are negative, which rules out autoimmune thyroid disease such as Hashimoto's thyroiditis. However, her free T4, the main circulating thyroid hormone, is 13.9 pmol/L, which sits just inside the lower end of the laboratory range of 11.5 to 22.7 and below the optimal band of 14 to 20. Her free T3, the active form that cells actually use, is 4.4 pmol/L, which is within the lab range but below the optimal band of 4.5 to 6.5. With TSH being normal, the thyroid is not being asked to work harder, so this likely reflects a constitutional pattern rather than thyroid disease. That said, free T4 just below optimal can contribute to the fatigue, brain fog, and sleep disruption she describes, and it may be worth mentioning to her GP if symptoms persist, particularly as perimenopause and thyroid function can interact.\n\nHer vitamin D at 79 nmol/L is sufficient and within the optimal range of 75 to 120, which is a positive finding. Her vitamin B12 at 266 pg/mL is within the laboratory range but below the optimal threshold of 500. This is a finding that connects directly to her PPI use. Omeprazole reduces stomach acid, and stomach acid is required for the body to release B12 from food and absorb it. Long-term PPI use is one of the most common causes of gradual B12 depletion, and suboptimal B12 is associated with fatigue, brain fog, and poor concentration, all of which Elaine is experiencing. Folate at 14 ng/mL is healthy and above the optimal threshold of 8. Supplementing B12 in sublingual form, which bypasses the stomach acid issue created by the PPI, is the most practical solution here.\n\nHer full blood count reveals several findings that together paint a coherent picture. Her white cell count is 3.01, below the lower limit of 4.0. Her neutrophils, the most abundant type of white blood cell and the body's first responders to bacterial infection, are 1.52, below the 2.0 lower limit. Her lymphocytes at 1.12 are within range but at the lower end. Her platelets are 149, just one point below the 150 lower limit, and her MPV, the mean platelet volume, is 10.3, marginally above the 10.1 upper limit. Her absolute reticulocyte count, which measures how many new red blood cells the bone marrow is producing, is 22.97, well below the 50 to 100 range. Her ESR, a general marker of inflammation, is 13, marginally above the 12 upper limit for women. Taken individually, several of these are borderline. Taken together, they suggest the bone marrow is running at a slightly reduced output across all three cell lines: white cells, platelets, and reticulocyte production. There are several possible explanations. Chronic stress, which Elaine describes as extreme, can suppress bone marrow activity through sustained cortisol elevation. Her cortisol at 261 nmol/L is within the morning reference range but sits in the lower half, which could reflect adrenal adaptation to chronic stress rather than acute elevation. PPI use has been associated in some studies with mild suppression of white cell and platelet production. Viral infections, even subclinical ones, can transiently suppress counts. And some individuals, particularly women of European ancestry, have constitutionally lower neutrophil counts, a pattern sometimes called benign ethnic neutropenia, though it is more common in people of African or Middle Eastern descent. Given Elaine's symptom burden of fatigue, brain fog, and feeling unwell, and the fact that these counts are suppressed across multiple cell lines, we would recommend her GP is made aware. A repeat full blood count in six to eight weeks would help establish whether this is a transient dip or a persistent pattern, and if persistent, further investigation would be warranted.\n\nHer hormonal picture is consistent with perimenopause on HRT. Her FSH at 23.42 mIU/mL sits in the zone between cycling and post-menopausal values, confirming ongoing perimenopausal transition. Her oestradiol at 379 pmol/L is well above the post-menopausal range, reflecting her HRT supplementation and indicating that the oestrogen component is providing good levels. Her LH at 12.73 is consistent with follicular or perimenopausal phase. Progesterone at 0.57 nmol/L is very low, sitting within the follicular phase range. If her HRT regimen includes a progestogen component, this level may warrant discussion with her HRT prescriber to ensure adequate endometrial protection. If she is on oestrogen-only HRT with a Mirena coil for progestogen delivery, the blood level would be expected to be low as the progestogen acts locally. Her total testosterone at 0.6 nmol/L is within the female reference range, and her free androgen index at 1.09 is healthy. DHEA-S at 1.6 umol/L, converting to approximately 590 ug/dL, is within range. SHBG at 54.9 nmol/L is within range and not excessively elevated, meaning it is not binding up too much of her available hormones.\n\nHer hs-CRP, the high-sensitivity measure of systemic inflammation, is 0.4 mg/L, which is excellent and well within the optimal range of below 1.0. This is reassuring because it suggests there is no significant systemic inflammatory process driving her symptoms. Her immunoglobulins, IgG, IgM, IgA, and IgE, are all within range, and her rheumatoid factor is negative at 6 IU/mL. Her coeliac screen, tissue transglutaminase IgA, is negative, which is worth noting given her gastrointestinal symptoms, though coeliac disease is only one of many possible causes of digestive discomfort.\n\nHer tumour markers are all reassuring. CA-125 at 9.6 is well within the normal range, CA 15-3 at 16.11 is normal, CA 19-9 at 1.79 is very low, and CEA is below 0.5. These are screening markers and are not diagnostic on their own, but a clean set at 50 is a positive finding.\n\nHer urine sample shows white blood cells at 100 per microlitre, which is significantly above the threshold of 10 and indicates the presence of urinary tract inflammation or infection. Nitrites are negative and red blood cells are below 1, which is reassuring. The bacterial culture and sensitivities are reported as pending and will need to be reviewed when available. The combination of elevated urinary white cells with negative nitrites can occur in early or low-grade urinary tract infections, or with contamination, but given the count of 100 it is more likely to represent genuine urinary inflammation. If the culture returns positive, a course of antibiotics may be indicated. If it returns negative, a repeat clean-catch sample would be sensible to confirm.\n\nHer total antioxidant activity at 1.79 is marginally above the 1.77 upper limit, which is not a clinical concern. This can be influenced by dietary antioxidant intake and supplementation and is a favourable finding rather than a problem. Her creatine kinase at 62 U/L is well within range, confirming no significant muscle damage or strain.\n\nPulling the threads of this report together for Elaine, the most important finding is the Lp(a) above 212.5 nmol/L, which should be recorded permanently and discussed with her GP as it has implications for long-term cardiovascular risk management. The suppressed blood counts across white cells, platelets, and reticulocytes deserve a repeat check in six to eight weeks. Her suboptimal B12, likely driven by her PPI use, connects directly to her fatigue and brain fog and is readily correctable. Her gastrointestinal symptoms of burning, oesophageal pain, and left rib discomfort, with clean amylase, lipase, and tumour markers, and clear imaging, may relate to her PPI management, stress, or functional gut issues, and these remain best explored with her GP. The urinary white cells need follow-up once the culture result is available.","links":"Elaine's results point to several practical areas where targeted changes could make a meaningful difference to how she feels day to day, alongside some findings that need a conversation with her GP.\n\nThe Lp(a) finding is the most important item to take to her GP. The specific numbers to share are: Lp(a) above 212.5 nmol/L (high risk category, threshold 32 nmol/L), ApoB 1.06 g/L (above 0.9 target), and LDL 3.66 mmol/L (above 3.0). The conversation should cover whether the combination of a very high inherited Lp(a) with modestly elevated LDL and ApoB warrants lipid-lowering therapy such as a statin, and whether referral to a lipid clinic would be appropriate. Standard cardiovascular risk calculators do not account for Lp(a), so the GP should be aware that her true risk is higher than those calculators suggest. Elaine should also arrange for her first-degree relatives to have their Lp(a) tested, as this is an inherited trait.\n\nFor the modifiable portion of her lipid profile, dietary changes can help bring the LDL and ApoB down. Soluble fibre is the most effective dietary tool. Porridge oats provide around 3g of beta-glucan per 75g serving, and two servings of oat-based food per day can reduce LDL by 5 to 10%. Adding ground flaxseed (two tablespoons daily), beans or lentils to meals most days, and increasing fruit and vegetable intake will add further soluble fibre. Including oily fish such as salmon, mackerel, or sardines two to three times per week provides omega-3 fatty acids that support healthy triglyceride levels and have anti-inflammatory benefits. Reducing saturated fat by swapping butter for olive oil, choosing leaner cuts of meat, and limiting processed food would also help. These changes alone will not overcome the Lp(a), but they can meaningfully reduce the modifiable ApoB particles.\n\nHer B12 at 266 pg/mL is below optimal and is very likely related to her PPI use. The most effective solution is sublingual methylcobalamin at 1,000 mcg daily, placed under the tongue and allowed to dissolve, which bypasses the stomach acid reduction caused by omeprazole and delivers B12 directly into the bloodstream. This is one of the most straightforward changes in this report and may improve her energy, mental clarity, and brain fog within four to six weeks.\n\nHer calorie and protein targets, based on her weight of 71.2 kg, height of 167.6 cm, age 50, and current activity level of roughly sedentary with light walking, give a maintenance calorie estimate of approximately 1,750 to 1,850 kcal per day. At her current BMI of 25.3, she does not need to lose weight, and her focus should be on nutrient density rather than restriction. Her protein target should be at least 1.0 to 1.3 g per kilogram of body weight, giving a range of 71 to 93 grams of protein per day. Given her fatigue and the suppressed blood counts, adequate protein is particularly important as it provides the amino acids the bone marrow needs to produce blood cells. Spreading protein across three meals, aiming for at least 25 grams per meal from sources like eggs, fish, chicken, Greek yoghurt, beans, and lentils, would be ideal.\n\nFor sleep, which is one of her primary goals and connects to her stress, fatigue, and brain fog, the evidence-based foundations are: setting a fixed wake time seven days a week and protecting it even at weekends, getting outside within an hour of waking for natural light exposure which sets the circadian clock, cutting caffeine by early afternoon at the latest, keeping the bedroom cool at around 18 degrees, and establishing a wind-down period of 30 to 60 minutes before bed without screens or stimulating content. Magnesium glycinate before bed, which she should consider supplementing at 300 to 400 mg, supports both sleep quality and the stress response. Her current magnesium at 0.89 is within the optimal range, but under chronic stress the body uses magnesium at a higher rate, and supplementation is safe and often beneficial.\n\nRegarding her gastrointestinal symptoms, the clean amylase, lipase, and tumour markers are reassuring, and her imaging has been clear. The burning and oesophageal symptoms may relate to her PPI management. If she has been on omeprazole for an extended period and symptoms are returning, this warrants a discussion with her GP about whether the dose is adequate, whether a trial of a different PPI might help, or whether further investigation such as an endoscopy is warranted. It is also worth noting that long-term PPI use can affect absorption of B12, magnesium, calcium, and iron, so monitoring these markers annually is sensible.\n\nThe suppressed blood counts, specifically white cell count at 3.01, neutrophils at 1.52, platelets at 149, and absolute reticulocytes at 22.97, should be flagged to her GP. A repeat full blood count in six to eight weeks will show whether these are stable, improving, or declining. If stable and Elaine is otherwise well, they may represent her constitutional baseline, but given she feels unwell, investigation is appropriate. The GP should also be informed of the ESR at 13, marginally above range, in the context of these counts.\n\nThe urinary white blood cells at 100 need follow-up. Once the bacterial culture result is available, if it shows significant growth, treatment with antibiotics as per sensitivity testing is appropriate. If the culture is negative, a repeat midstream clean-catch urine sample should be sent to confirm the result.\n\nFor stress management, which Elaine identifies as a primary goal, the physiological evidence supports regular movement as the most effective stress buffer. Even without formal cardio or resistance training, increasing her daily step count from the current 5,000 to 7,500 range toward 8,000 to 10,000 would provide meaningful benefit for mood, sleep, stress resilience, and cardiovascular health. Adding even one or two sessions per week of resistance training, which could be bodyweight exercises, resistance bands, or light weights, would support bone density, which becomes increasingly important through perimenopause and beyond, and would improve body composition, sleep quality, and energy levels.\n\nRetesting recommendations: a repeat full blood count in six to eight weeks, B12 recheck after three months of supplementation, a lipid panel recheck in three to four months after dietary changes are established, and urinary follow-up once the culture result is available. The Lp(a) does not need repeating as it is genetically fixed.","flags":"HAEMATOLOGY: White cell count 3.01 (range 4.0 to 10.0), neutrophils 1.52 (range 2.0 to 7.0), platelets 149 (range 150 to 410), MPV 10.3 (range 7.1 to 10.1), absolute reticulocytes 22.97 (range 50 to 100), ESR 13 (range below 12). Pancytopenia-spectrum suppression across all three cell lines. In the context of chronic stress, PPI use, and reported malaise, recommend repeat FBC in 6 to 8 weeks. If persistent, consider haematology referral. Peripheral smear may be informative.\n\nLIPIDS AND CARDIOVASCULAR: Lp(a) above 212.5 nmol/L (high risk, threshold 32). This is genetically determined and permanent. Confers significant additional cardiovascular risk independent of standard lipid markers. Recommend permanent recording in GP notes, lipid clinic referral consideration, and first-degree relative testing. LDL 3.66 mmol/L (range 0.5 to 3.0), ApoB 1.06 g/L (threshold below 0.9), ApoB/A1 ratio 0.82 (threshold below 0.6), total cholesterol 5.6 (desirable below 5.18), non-HDL cholesterol 4.0 (threshold below 4.0). A proportion of the ApoB elevation is driven by the Lp(a) particles. Discuss lipid-lowering therapy in the context of the Lp(a) finding.\n\nGLUCOSE AND INSULIN: C-Peptide 0.739 ug/L (range 1.1 to 4.4, flagged low). In the context of normal glucose (4.5), normal HbA1c (33), normal insulin (3.12), and HOMA-IR 0.62, this reflects low insulin demand rather than pancreatic insufficiency. Lab notes sample handling may affect result. Not clinically concerning in isolation.\n\nFIB-4: Score 1.58 (threshold 1.45). Driven by age (50), low platelets (149), and low ALT (13). All direct liver markers are normal. No clinical concern but noted for completeness.\n\nURINALYSIS: Urinary WBCs 100 per microlitre (significant above 10). Nitrites negative. RBCs below 1. Bacterial culture and sensitivities pending. Likely urinary tract inflammation or infection. Follow up on culture result.\n\nTHYROID: FT4 13.9 pmol/L, below optimal band of 14 to 20 though within lab range. FT3 4.4 pmol/L, below optimal band of 4.5 to 6.5 though within lab range. TSH 1.78, normal. Antibodies negative. May contribute to fatigue symptoms. Worth monitoring.\n\nVITAMIN B12: 266 pg/mL, within lab range (193 to 982) but below optimal threshold of 500. Likely related to PPI use. Recommend sublingual methylcobalamin supplementation.\n\nReassuring negatives: hs-CRP 0.4 (excellent, no systemic inflammation), amylase and lipase both normal (no pancreatic pathology), all tumour markers clean (CA-125 9.6, CA 15-3 16.11, CA 19-9 1.79, CEA below 0.5), thyroid antibodies both negative (no autoimmune thyroid disease), coeliac screen negative, rheumatoid factor negative, kidney function strong (Cystatin C eGFR 94), glucose metabolism excellent (HOMA-IR 0.62, HbA1c 33), liver enzymes all clean.","recommendations":"1. Discuss the Lp(a) result (above 212.5 nmol/L) with your GP as a priority. This is a genetically inherited cardiovascular risk factor that should be permanently recorded in your medical notes. Ask about referral to a lipid clinic given the combination of high Lp(a) with elevated LDL (3.66) and ApoB (1.06).\n\n2. Arrange Lp(a) testing for your first-degree relatives (children, siblings, parents) as each has approximately a 50% chance of inheriting the same trait.\n\n3. Start sublingual methylcobalamin (vitamin B12) at 1,000 mcg daily to address the suboptimal B12 level, which is likely being driven by your PPI use and may be contributing to your fatigue and brain fog.\n\n4. Begin magnesium glycinate at 300 to 400 mg before bed to support sleep quality and the stress response.\n\n5. Increase soluble fibre intake: porridge oats daily, ground flaxseed (two tablespoons), beans or lentils at least four times per week. Include oily fish two to three times per week. Reduce saturated fat by choosing olive oil over butter and leaner protein sources.\n\n6. Aim for at least 71 to 93 grams of protein per day, spread across three meals, with at least 25 grams per meal.\n\n7. Follow up on the urinary culture and sensitivity results when available. If positive for infection, treatment will be needed. If negative, a repeat clean-catch sample should be submitted.\n\n8. Ask your GP for a repeat full blood count in six to eight weeks to check whether the suppressed white cell count, neutrophils, platelets, and reticulocytes are stable or transient.\n\n9. Discuss your progesterone level (0.57 nmol/L) with your HRT prescriber to confirm that your current regimen provides adequate progestogen coverage.\n\n10. Discuss your ongoing gastrointestinal symptoms with your GP, particularly whether the current PPI dose is adequate or whether further investigation such as endoscopy is warranted.\n\n11. Gradually increase daily step count toward 8,000 to 10,000 and consider adding one to two sessions per week of resistance training to support bone density, energy, and stress resilience.\n\n12. Prioritise sleep hygiene: fixed wake time, morning outdoor light exposure, caffeine cut-off by early afternoon, cool bedroom, and a 30 to 60 minute wind-down routine before bed.\n\n13. Retest B12 in three months, lipid panel in three to four months after dietary changes, and full blood count in six to eight weeks.","supplementation":"Based on Elaine's results, the following supplements are recommended:\n\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily, placed under the tongue and allowed to dissolve fully. This form is specifically chosen because Elaine is taking a PPI (omeprazole), which reduces stomach acid and impairs the absorption of oral B12 from food and standard tablets. Sublingual delivery bypasses the stomach entirely and enters the bloodstream through the mucous membranes under the tongue. Her current level of 266 pg/mL is within the laboratory range but well below the optimal threshold of 500, and suboptimal B12 is directly associated with the fatigue, brain fog, and low energy she is experiencing. Take at any time of day, away from food for best absorption.\n\nMagnesium glycinate, 300 to 400 mg elemental magnesium, taken in the evening approximately 30 to 60 minutes before bed. Glycinate is the preferred form because it has high bioavailability and the glycine component has a mild calming effect that supports sleep onset. Elaine's serum magnesium at 0.89 mmol/L is within the optimal range, but serum magnesium reflects only about 1% of total body stores, and under chronic stress the body depletes magnesium at a faster rate. Given her reported poor sleep, extreme stress, and the fact that PPI use can impair magnesium absorption over time, supplementation is a sensible precaution.\n\nVitamin D3 as cholecalciferol, 2,000 IU daily, taken with a meal containing fat for absorption. Her current level at 79 nmol/L is within the optimal range of 75 to 120, and this dose is a maintenance dose to keep it there, particularly through the autumn and winter months when UVB exposure in the UK drops to near zero.\n\nVitamin K2 as MK-7, 100 mcg daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bones and teeth and away from soft tissues and blood vessels. It works synergistically with vitamin D and should always be taken alongside it.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports healthy triglyceride levels (hers are already good at 0.84), provides anti-inflammatory benefit, and may help reduce the modifiable component of her cardiovascular risk alongside dietary changes. EPA in particular has evidence for mood and stress resilience support.\n\nThe most important changes from this report are not supplements. They are getting the Lp(a) result recorded with her GP and discussing cardiovascular risk management, following up on the suppressed blood counts with a repeat test, increasing dietary soluble fibre and oily fish intake to address the modifiable portion of her lipid risk, and building consistent movement and sleep habits to support her energy, stress resilience, and overall wellbeing.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6093","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It is the most direct snapshot of how the body is managing blood sugar at rest. Elaine's result of 4.5 mmol/L sits comfortably within the optimal range of 4.0 to 5.4, indicating efficient glucose regulation. Combined with her excellent HbA1c and low HOMA-IR, this confirms strong metabolic health with no sign of insulin resistance or pre-diabetes.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, very low carbohydrate intake","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, corticosteroid use, pancreatic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c represents the percentage of haemoglobin in red blood cells that has become glycated, meaning sugar has attached to it. Because red blood cells live for approximately 120 days, this marker gives an average picture of blood sugar control over the preceding two to three months, rather than a single snapshot. Elaine's result of 5.2% is well within the normal range (below 6.0%) and firmly in healthy territory, consistent with her excellent fasting glucose.","low_causes":"Haemolytic anaemia, blood loss, some haemoglobin variants","high_causes":"Pre-diabetes, type 2 diabetes, chronically elevated blood sugar, iron deficiency (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised mmol/mol units. Elaine's result of 33 mmol/mol is well below the 42 threshold for pre-diabetes and below the optimal ceiling of 36. This confirms excellent long-term blood sugar control over the past two to three months.","low_causes":"Haemolytic anaemia, blood loss, some haemoglobin variants","high_causes":"Pre-diabetes, type 2 diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3415","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3973","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is releasing to manage blood sugar at rest. A low fasting insulin with normal blood glucose, as seen here, indicates that the body is highly insulin-sensitive, meaning it needs only a small amount of insulin to keep blood sugar in check. Elaine's result of 3.12 mIU/L is within both the laboratory and optimal ranges. This is a genuinely positive finding and reflects efficient metabolic function.","low_causes":"Very low carbohydrate intake, high insulin sensitivity, prolonged fasting, type 1 diabetes (in context of high glucose)","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, excess carbohydrate intake, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.739","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1114","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"4.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It acts as an independent measure of how much insulin the pancreas is actually producing, separate from any external insulin. Elaine's result of 0.739 ug/L falls below the laboratory range of 1.1 to 4.4. However, in the context of her excellent glucose control (4.5 mmol/L), normal HbA1c (33 mmol/mol), and low but adequate insulin (3.12 mIU/L), this low C-Peptide reflects low insulin demand from the body rather than inadequate pancreatic function. The lab also notes that samples not separated within 4 hours can see C-Peptide decrease significantly, which may be a contributing factor. This is not a clinical concern in this context.","low_causes":"Low insulin demand (insulin-sensitive individuals), sample handling delays, type 1 diabetes (in context of high glucose), prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated score using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's signal. A lower score indicates better insulin sensitivity. Elaine's HOMA-IR of 0.62 is excellent, sitting well within the optimal range and confirming that her cells respond efficiently to insulin. Below 1.0 is considered insulin-sensitive, which is the ideal state. This is one of the strongest positives in this report.","low_causes":"High insulin sensitivity (favourable), very low carbohydrate diet, prolonged fasting","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, PCOS, chronic stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"62.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2200","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the insulin-producing beta cells in the pancreas are working. It is calculated as (20 x Insulin) / (Glucose - 3.5). Elaine's result of 62.4 is below the 80 to 200 reference range. However, this formula is heavily influenced by fasting insulin level, and in someone who is genuinely insulin-sensitive with low fasting insulin and perfect glucose control, the score will mathematically sit below range. This does not indicate beta-cell failure. Her glucose and HbA1c confirm that the pancreas is producing exactly the right amount of insulin for her needs.","low_causes":"Low insulin demand in insulin-sensitive individuals, very low carbohydrate diet, early beta-cell decline (only concerning if glucose is also elevated)","high_causes":"Insulin resistance (pancreas overworking to compensate), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins are essential for maintaining fluid balance, transporting substances through the blood, fighting infection, and repairing tissues. Elaine's result of 72 g/L sits comfortably within both the laboratory and optimal ranges, indicating good nutritional status and healthy liver function, since the liver produces the majority of blood proteins.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption, chronic illness","high_causes":"Chronic inflammation, chronic infection, dehydration, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood and is produced exclusively by the liver. It maintains fluid balance by keeping water within the blood vessels and transports hormones, vitamins, and medications throughout the body. Elaine's albumin at 42 g/L is healthy, confirming good liver synthetic function and adequate protein nutrition.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, chronic inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.5889","units":"g/L","description":"Globulin is a group of proteins that includes immunoglobulins (antibodies), transport proteins, and clotting factors. The globulin level is calculated by subtracting albumin from total protein. Elaine's result of 30 g/L is within the laboratory range. It sits at the upper boundary of the optimal band, reflecting an adequate immune protein pool without any suggestion of chronic inflammation or overproduction.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3405","upper_optimal_position":"0.5714","units":"","description":"The albumin-to-globulin ratio compares the two main protein groups in the blood. A healthy ratio indicates a good balance between the liver's production of albumin and the immune system's production of globulins. Elaine's ratio of 1.4 is within both the laboratory and optimal ranges, confirming balanced protein production.","low_causes":"Chronic inflammation, immune overactivation, liver disease, kidney protein loss","high_causes":"Immune deficiency (very rare in isolation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6190","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and intestines. It is used primarily to assess liver and bone health. Elaine's result of 46 IU/L sits at the bottom of the reference range, which is perfectly normal and indicates no biliary obstruction or bone turnover abnormality.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, malnutrition","high_causes":"Liver disease (particularly biliary obstruction), bone disease, Paget's disease, pregnancy, growing children","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elaine's bilirubin at 12 umol/L is well within range, confirming healthy liver processing and normal red blood cell turnover.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome (benign, inherited), liver disease, bile duct obstruction, haemolytic anaemia, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1161","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood, making it one of the most sensitive markers of liver cell health. Elaine's ALT at 13 IU/L is well within the optimal range for women (below 25), indicating that her liver cells are healthy and not under any metabolic strain.","low_causes":"Not clinically significant (very low ALT can occasionally indicate B6 deficiency)","high_causes":"Fatty liver disease, alcohol-related liver damage, hepatitis, medication effects, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3875","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5313","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, muscles, and kidneys. Like ALT, it rises when these tissues are damaged. Elaine's AST at 17 IU/L is well within both the laboratory and optimal ranges, and alongside the clean ALT and GGT, paints a picture of excellent liver health.","low_causes":"Not clinically significant","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5448","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that estimates the likelihood of liver fibrosis (scarring) using age, AST, ALT, and platelet count. Elaine's score of 1.58 is above the 1.45 threshold. However, this is a mathematical artefact rather than a sign of liver disease. At age 50, with a very low ALT of 13 (which makes the denominator small) and platelets of 149 (marginally below range, which also inflates the score), the formula produces a falsely elevated result. Every direct marker of liver health in this report, including ALT, AST, GGT, bilirubin, and albumin, is clean. The FIB-4 is noted for completeness but does not indicate liver fibrosis.","low_causes":"Young age, high platelet count, high ALT (mathematically suppresses the score)","high_causes":"Liver fibrosis, cirrhosis, older age, low platelet count, low ALT (mathematical inflation)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2237","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems, and metabolic strain on the liver. It is often the first liver marker to rise when something is amiss. Elaine's GGT at 17 IU/L is well within the optimal range for women (below 25), which is a genuinely clean result and confirms the liver is not under any significant stress.","low_causes":"Not clinically significant","high_causes":"Alcohol use, fatty liver disease, bile duct obstruction, medication effects (including some PPIs), metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4508","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands. It breaks down starches into sugars. Elevated amylase can indicate pancreatic inflammation (pancreatitis). Elaine's result of 61 IU/L is comfortably within range. This is particularly reassuring given her left-sided rib and back pain, as pancreatic inflammation would be expected to push this marker significantly above the upper limit.","low_causes":"Chronic pancreatitis (burnt-out pancreas), cystic fibrosis, severe liver disease","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4255","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5745","units":"U/L","description":"Lipase is a digestive enzyme produced almost exclusively by the pancreas to break down dietary fats. It is considered a more specific marker for pancreatic health than amylase. Elaine's lipase at 37 U/L is well within range, adding further reassurance alongside the normal amylase that there is no pancreatic inflammation despite her abdominal symptoms.","low_causes":"Chronic pancreatitis (advanced), cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic duct obstruction, kidney disease, bowel disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5405","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all cholesterol carried in the blood, including HDL (protective), LDL (atherogenic), and VLDL. Elaine's total cholesterol at 5.6 mmol/L is above the desirable threshold of 5.18. However, total cholesterol alone is not the most useful marker because it includes the protective HDL fraction. In Elaine's case, her HDL of 1.6 accounts for a healthy portion of the total, and the more informative markers are her LDL, ApoB, and Lp(a).","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption, genetic factors","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, diabetes, kidney disease, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2471","lower_normal":"0","upper_normal":"1.70","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat circulating in the blood, derived from dietary fat and from the liver converting excess calories into storage form. Fasting triglycerides below 1.0 mmol/L are considered optimal and are a strong indicator of metabolic health. Elaine's result of 0.84 mmol/L is excellent, reflecting good insulin sensitivity and efficient fat metabolism. This is consistent with her outstanding HOMA-IR score.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"Excess calorie intake, high sugar/refined carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2436","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol is produced by the liver and carries triglycerides to tissues. It is a precursor to LDL. Elaine's VLDL at 0.38 mmol/L is well within the optimal range, consistent with her excellent triglyceride level and healthy insulin sensitivity.","low_causes":"Not clinically significant","high_causes":"High triglycerides, insulin resistance, excess calorie intake, obesity, alcohol use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.55","upper_normal":"100","lower_optimal":"1.6","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5000","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) cholesterol is often called the 'good' cholesterol because it transports excess cholesterol from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is generally protective against cardiovascular disease. Elaine's HDL at 1.6 mmol/L sits at the desirable threshold. For women, the optimal level is above 1.6, so she is right at the boundary. Regular exercise is the most effective way to raise HDL, and adding even modest activity to her routine could push this into a more protective range.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high carbohydrate diet, certain medications","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen (endogenous or HRT)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6107","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol carries cholesterol from the liver to the rest of the body. When there is too much, it deposits into artery walls and begins the process of atherosclerosis (plaque build-up). Elaine's LDL at 3.66 mmol/L is above the 3.0 upper limit. In the context of her very high Lp(a), a portion of this LDL measurement includes Lp(a) particles, which are a modified form of LDL. This means some of the elevation is genetically driven and not modifiable through diet alone. Dietary changes can still help reduce the conventional LDL component, and her GP should consider the overall picture when deciding on management.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption, certain medications","high_causes":"Diet high in saturated fat, genetic factors (including familial hypercholesterolaemia), hypothyroidism, obesity, menopause, sedentary lifestyle, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. It is a useful summary metric because it balances the atherogenic cholesterol against the protective HDL. Elaine's ratio of 3.5 is within the desirable range of below 4.5, indicating that despite the elevated total cholesterol, the proportion of protective HDL is reasonable.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, elevated total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"28.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"This expresses HDL cholesterol as a percentage of total cholesterol. A value above 20% is considered desirable, and above 25% is optimal. Elaine's HDL percentage of 28.57% indicates a healthy proportion of her total cholesterol is the protective HDL type.","low_causes":"Low HDL, very high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions, including LDL, VLDL, and Lp(a). Elaine's result of 4.0 mmol/L sits right at the upper boundary of the laboratory range. Given her very high Lp(a), a substantial portion of this non-HDL reading is driven by inherited Lp(a) particles that cannot be reduced through lifestyle measures.","low_causes":"Very low LDL, malnutrition, hyperthyroidism","high_causes":"Elevated LDL, elevated Lp(a), high triglycerides, diet, genetic factors, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"1.4","upper_normal":"100","lower_optimal":"1.5","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein of HDL cholesterol particles. It is essentially a count of the protective HDL particles in the blood. Elaine's ApoA1 at 1.3 g/L is below the desirable threshold of 1.4 for women, which is consistent with her HDL sitting right at the lower boundary of optimal. Higher ApoA1 generally reflects better reverse cholesterol transport and cardiovascular protection. Exercise is the most effective way to raise ApoA1.","low_causes":"Sedentary lifestyle, smoking, obesity, genetic factors, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, oestrogen, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is a protein present on every atherogenic lipoprotein particle, including LDL, VLDL, and Lp(a). Each particle carries exactly one ApoB molecule, so this marker effectively counts the total number of particles that can deposit cholesterol into artery walls. It is considered a more accurate predictor of cardiovascular risk than LDL cholesterol alone. Elaine's ApoB at 1.06 g/L is above the desirable threshold of 0.9 and falls in the borderline high category (1.0 to 1.19). Importantly, because each Lp(a) particle also carries one ApoB molecule, a portion of her elevated ApoB is driven by her very high Lp(a), which is genetically determined. The modifiable portion can be addressed through dietary changes and, if indicated by her GP, lipid-lowering medication.","low_causes":"Hyperthyroidism, malnutrition, liver disease, lipid-lowering medications","high_causes":"Elevated LDL, elevated Lp(a), high saturated fat diet, genetic factors, insulin resistance, hypothyroidism, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6833","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). It is considered one of the most informative single metrics for cardiovascular risk. A ratio below 0.6 represents lower risk for women, 0.6 to 0.8 represents average risk, and above 0.8 represents higher risk. Elaine's ratio of 0.82 places her just into the higher risk band. This is being driven by both her elevated ApoB (including the Lp(a) contribution) and her slightly below-target ApoA1. Improving both sides of this ratio through dietary changes, omega-3 supplementation, and exercise would be beneficial.","low_causes":"Low ApoB (favourable), high ApoA1, lipid-lowering therapy","high_causes":"Elevated ApoB, low ApoA1, sedentary lifestyle, metabolic syndrome, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a specialised form of LDL cholesterol particle that carries an additional protein called apolipoprotein(a). It is almost entirely genetically determined, meaning its level is set by inherited genes and is not meaningfully affected by diet, exercise, or lifestyle. Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like standard LDL, it interferes with the body's clot-dissolving system (promoting blood clots), and it drives localised inflammation in the arteries. A level below 32 nmol/L is considered normal, 32 to 90 slightly increased risk, 90 to 200 moderate risk, and above 200 high risk. Elaine's result exceeds 212.5 nmol/L, placing her in the high risk category. This is a permanent piece of medical information. The level will not change over her lifetime and should be recorded permanently in her GP notes. Her first-degree relatives (children, siblings, parents) should also be tested, as each has approximately a 50% chance of carrying the same genetic trait. There are currently no widely available medications that specifically target Lp(a), though clinical trials are underway. The practical implication is that managing all other modifiable cardiovascular risk factors becomes even more important.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (the dominant factor), kidney disease (can elevate), menopause (oestrogen decline may modestly increase levels)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1756","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride-to-HDL ratio is a calculated marker that provides a strong indication of insulin sensitivity and metabolic health. A lower ratio is better. Elaine's ratio of 0.53 is excellent, well within the optimal range of below 0.87, and reflects the combination of her healthy triglycerides and reasonable HDL. This is one of the most reassuring metabolic markers in the report.","low_causes":"Excellent insulin sensitivity, low triglycerides, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high triglycerides, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant lipoproteins (VLDL and intermediate-density lipoproteins). Elevated remnant cholesterol is an independent cardiovascular risk factor. Elaine's result of 0.34 mmol/L is well within the optimal range of below 0.5, reflecting her healthy triglyceride metabolism.","low_causes":"Low triglycerides, efficient lipoprotein clearance","high_causes":"Insulin resistance, high triglycerides, obesity, type 2 diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is one of the most sensitive markers of systemic low-grade inflammation, which is linked to cardiovascular disease, metabolic dysfunction, and chronic disease. Elaine's hs-CRP at 0.4 mg/L is excellent and well within the optimal range of below 1.0. This is a very reassuring finding because it indicates there is no significant systemic inflammatory process occurring, despite her feeling unwell and being under extreme stress.","low_causes":"Not clinically significant (low is desirable)","high_causes":"Acute infection, chronic inflammation, obesity, smoking, autoimmune disease, cardiovascular disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. Elaine's ESR at 13 mm/hour is marginally above the 12 upper limit for women. At this margin, this
