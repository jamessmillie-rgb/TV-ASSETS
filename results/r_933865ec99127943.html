optimal_position":"0.3485","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid-base buffer, helping to maintain blood pH within the narrow range needed for normal cell function. The kidneys regulate bicarbonate levels. Elaine's bicarbonate at 23.8 mmol/L is healthy and within both ranges, confirming normal acid-base balance.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, chronic respiratory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"10.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4458","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate levels. It estimates the concentration of unmeasured negatively charged particles in the blood and is used to help identify the cause of metabolic acidosis. Elaine's anion gap of 10.7 mmol/L is within the normal and optimal ranges, confirming normal acid-base chemistry.","low_causes":"Low albumin, laboratory error, lithium toxicity","high_causes":"Metabolic acidosis (lactic acidosis, ketoacidosis, toxic ingestion), kidney failure, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve transmission, and blood clotting. The body tightly regulates calcium through the parathyroid glands, vitamin D, and the kidneys. Elaine's calcium at 2.41 mmol/L is well within both the laboratory and optimal ranges, indicating healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease, PPI use (long-term)","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation, dehydration, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for albumin concentration, because roughly half of calcium in the blood is bound to albumin. This gives a more accurate picture of the biologically available calcium. Elaine's corrected calcium at 2.41 mmol/L is identical to her total calcium (because her albumin is normal at 42), and sits well within both ranges.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3471","upper_optimal_position":"0.6161","units":"mmol/L","description":"Phosphate works alongside calcium for bone and teeth mineralisation and plays a critical role in energy production at the cellular level. Elaine's phosphate at 1.2 mmol/L is well within both ranges, confirming healthy mineral balance.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, antacid or PPI use (long-term), alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis, tumour lysis syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5287","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4885","upper_optimal_position":"0.6092","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar regulation, and protein synthesis. It is also important for sleep quality and the stress response. Elaine's serum magnesium at 0.89 mmol/L is within the optimal range. However, serum magnesium represents only about 1% of total body stores, with the rest held in bones and cells. Under chronic stress, the body uses magnesium at an increased rate, so supplementation is still recommended given her symptoms.","low_causes":"PPI use, chronic stress, diarrhoea, alcohol use, diuretics, poor dietary intake, malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"205","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product produced when the body breaks down purines, substances found naturally in the body and in certain foods like red meat, organ meats, and shellfish. The kidneys excrete uric acid. Elaine's level at 205 umol/L is within the laboratory range. It sits below the optimal ceiling of 320 for women. This is a healthy result.","low_causes":"Low purine diet, liver disease, Fanconi syndrome, certain medications","high_causes":"High purine diet, kidney disease, gout, obesity, metabolic syndrome, alcohol use, dehydration, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product formed in the liver from the breakdown of protein and excreted by the kidneys. It is a useful marker of both kidney function and protein metabolism. Elaine's urea at 4.6 mmol/L is well within range, confirming healthy kidney excretion and adequate protein intake.","low_causes":"Low protein diet, severe liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4634","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3341","upper_optimal_position":"0.6260","units":"umol/L","description":"Creatinine is a waste product from normal muscle metabolism that is filtered by the kidneys at a fairly constant rate. It is the most commonly used marker for estimating kidney function. Elaine's creatinine at 68 umol/L is well within the female reference range, indicating healthy kidney filtration.","low_causes":"Low muscle mass, malnutrition, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) estimates how well the kidneys are filtering waste from the blood. It is calculated from creatinine, age, sex, and ethnicity. A value above 90 indicates normal kidney function. Elaine's eGFR of above 90 confirms healthy kidney filtration, consistent with her normal creatinine and urea.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, certain medications, ageing","high_causes":"Hyperfiltration (early diabetes), pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate kidney marker in people with low or high muscle mass. Elaine's Cystatin C at 0.89 mg/L is well within the laboratory range and within the optimal band, providing an independent confirmation of healthy kidney function.","low_causes":"Not clinically significant (very rare)","high_causes":"Kidney disease, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"","description":"This eGFR is calculated from Cystatin C rather than creatinine, providing an alternative and often more accurate estimate of kidney function. Elaine's Cystatin C eGFR of 94 confirms that her kidneys are filtering at a healthy rate for her age. Both creatinine-based and Cystatin C-based estimates are concordant, which adds further confidence.","low_causes":"Chronic kidney disease, acute kidney injury, ageing","high_causes":"Hyperfiltration, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"129","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4333","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Elaine's haemoglobin at 129 g/L is within the female reference range of 120 to 150 but below the optimal band of 125 to 145. At 129, she is not anaemic, but she is towards the lower end, which may contribute to some of the fatigue she is experiencing. Adequate iron, B12, and folate are all needed for haemoglobin production.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, heavy menstruation, chronic blood loss","high_causes":"Dehydration, chronic lung disease, polycythaemia vera, living at high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4100","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6133","units":"x10^12/L","description":"The red blood cell count measures the total number of red blood cells per litre of blood. These cells are the oxygen carriers. Elaine's RBC at 4.03 is within the laboratory range but below the optimal band of 4.0 to 4.6. This is consistent with her haemoglobin sitting at the lower end and the low reticulocyte production, suggesting the bone marrow is producing red cells at a modest rate.","low_causes":"Iron, B12, or folate deficiency, chronic disease, bone marrow suppression, heavy menstruation","high_causes":"Dehydration, polycythaemia vera, chronic lung disease, living at high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.378","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3933","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit represents the proportion of blood volume occupied by red blood cells. It mirrors the haemoglobin and red cell count. Elaine's haematocrit at 0.378 is within the laboratory range but at the lower end, consistent with her other red cell indices.","low_causes":"Anaemia, overhydration, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia vera, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"13.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"%","description":"Red cell distribution width (RDW) measures the variation in size among red blood cells. A high RDW suggests the body is producing red cells of inconsistent sizes, which can occur with iron, B12, or folate deficiency. Elaine's RDW at 13.6% is within the normal range, indicating fairly uniform red cell production.","low_causes":"Not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, liver disease, haemolytic anaemia, recent blood transfusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"93.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5311","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6278","units":"fL","description":"Mean corpuscular volume (MCV) measures the average size of red blood cells. Small red cells (low MCV) suggest iron deficiency, while large red cells (high MCV) suggest B12 or folate deficiency. Elaine's MCV at 93.8 fL is in the healthy mid-range, indicating normal red cell size and no obvious nutritional deficiency affecting red cell production.","low_causes":"Iron deficiency, thalassaemia, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol use, hypothyroidism, liver disease, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6307","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6666666667","units":"pg","description":"Mean corpuscular haemoglobin (MCH) measures the average amount of haemoglobin in each red blood cell. Elaine's MCH at 31.9 pg is within both the laboratory and optimal ranges, confirming that each red cell is carrying an appropriate amount of haemoglobin.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol use, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"340","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3389","upper_optimal_position":"0.6666666667","units":"g/L","description":"Mean corpuscular haemoglobin concentration (MCHC) measures the average concentration of haemoglobin within each red blood cell. Elaine's MCHC at 340 g/L is within both ranges, confirming normal haemoglobin concentration in the red cells.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, sample artefact (temperature/storage effects)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"149","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3295","lower_normal":"150","upper_normal":"410","lower_optimal":"160","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3372","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small cell fragments produced by the bone marrow that are essential for blood clotting and wound healing. Elaine's platelet count at 149 is just one point below the 150 lower limit, which is a marginal finding. However, viewed alongside her suppressed white cell count and low reticulocytes, it fits a pattern of mildly reduced bone marrow output across all cell lines. At this margin, the platelet count alone would not cause concern, but the pattern warrants monitoring with a repeat full blood count.","low_causes":"Bone marrow suppression, viral infection, autoimmune destruction, chronic liver disease, some medications, alcohol, PPI use (rarely), B12 or folate deficiency","high_causes":"Iron deficiency, chronic inflammation, infection, bone marrow disorder, post-splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6633","units":"fL","description":"Mean platelet volume (MPV) measures the average size of platelets. Larger platelets are younger and more metabolically active. When the platelet count is low, the bone marrow often compensates by releasing larger, younger platelets, which pushes the MPV up. Elaine's MPV at 10.3 fL is marginally above the 10.1 upper limit, which is consistent with the mildly low platelet count. The bone marrow appears to be compensating by producing slightly larger platelets. This is an expected physiological response and not a concern in itself.","low_causes":"Bone marrow failure, aplastic anaemia, cytotoxic chemotherapy","high_causes":"Platelet destruction (immune thrombocytopenia), recent bone marrow recovery, chronic inflammation, diabetes, hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1683","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"9.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6167","units":"x10^9/L","description":"White blood cells (WBCs) are the immune system's defenders, fighting infection and foreign invaders. The total white cell count includes neutrophils, lymphocytes, monocytes, eosinophils, and basophils. Elaine's WBC at 3.01 is below the 4.0 lower limit, indicating leucopenia. This is being driven primarily by her low neutrophil count. Possible causes include chronic stress (sustained cortisol can suppress white cell production), PPI use, viral infection (even subclinical), autoimmune neutropenia, or constitutionally low counts. Given her fatigue and feeling generally unwell, a repeat in six to eight weeks is recommended.","low_causes":"Chronic stress, viral infection, bone marrow suppression, autoimmune conditions, some medications (including PPIs), B12 or folate deficiency, constitutional/benign ethnic neutropenia","high_causes":"Bacterial infection, inflammation, stress response (acute), steroid use, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2373","lower_normal":"2","upper_normal":"7","lower_optimal":"2.0","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and serve as the body's first line of defence against bacterial infections. They are produced in the bone marrow and have a short lifespan of hours to days. Elaine's neutrophils at 1.52 are below the 2.0 lower limit, a finding called neutropenia. At this level, she is not at immediate risk of infection, but it does indicate reduced bone marrow output. Possible causes include chronic stress, PPI use, viral infections, autoimmune mechanisms, or constitutional factors. A repeat test will help determine whether this is stable or transient.","low_causes":"Chronic stress, viral infection, bone marrow suppression, autoimmune neutropenia, some medications, B12 or folate deficiency, constitutional/benign ethnic neutropenia","high_causes":"Bacterial infection, acute stress, inflammation, smoking, steroid use, chronic myeloid leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3533","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including producing antibodies (B lymphocytes) and destroying virus-infected and cancerous cells (T lymphocytes). Elaine's lymphocytes at 1.12 are within the laboratory range but at the lower end. This is consistent with the overall pattern of mildly suppressed blood cell production. Chronic stress, through sustained cortisol, is a well-recognised cause of lymphocyte suppression.","low_causes":"Chronic stress, corticosteroid use, HIV, autoimmune disease, severe infections, malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, which engulf and destroy pathogens and dead cells. They also play a role in inflammation and tissue repair. Elaine's monocytes at 0.24 are within range.","low_causes":"Bone marrow disorders, overwhelming infection","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and mediating allergic responses. Elaine's eosinophils at 0.09 are well within range. A normal eosinophil count argues against significant allergic or parasitic disease.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergic conditions, parasitic infections, asthma, eczema, autoimmune disease, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell. They play a role in allergic reactions and inflammation by releasing histamine. Elaine's basophils at 0.04 are within range.","low_causes":"Acute allergic reactions, corticosteroid use, hyperthyroidism","high_causes":"Allergic reactions, chronic myeloid leukaemia, hypothyroidism, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_pct","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3450","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.7","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5833","units":"%","description":"The reticulocyte percentage measures the proportion of young, newly released red blood cells among all red cells. It indicates how actively the bone marrow is producing new red cells. Elaine's reticulocyte percentage of 0.57% is just within the laboratory range but at the very low end, suggesting that the bone marrow is producing red cells at a modest rate.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, chronic kidney disease, aplastic anaemia","high_causes":"Recovery from anaemia, haemolytic anaemia, acute blood loss, response to treatment (iron, B12, EPO)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_abs","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"22.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1264","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells being released from the bone marrow, rather than just a percentage. Elaine's absolute reticulocyte count of 22.97 is well below the 50 to 100 range, which means the bone marrow is producing fewer new red blood cells than expected. This is part of the broader pattern of reduced bone marrow output across all cell lines (white cells, platelets, and now red cell precursors). The most likely explanations include chronic stress, PPI effects, or a viral-related transient suppression. A repeat full blood count in six to eight weeks will help clarify whether this is resolving or persistent.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, chronic kidney disease (low erythropoietin), aplastic anaemia, chronic disease","high_causes":"Recovery from anaemia, haemolytic anaemia, acute blood loss, EPO therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is a calculated marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, with lower values being more favourable. Elaine's NLR of 1.36 is within the optimal range, indicating a balanced immune response without excessive inflammation. Despite her individual counts being low, the ratio between them is well-balanced.","low_causes":"Not clinically significant in isolation","high_causes":"Acute infection, chronic inflammation, physiological stress, cardiovascular disease, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"28.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4489","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation indicates what proportion of the body's iron-carrying protein (transferrin) is currently loaded with iron. It provides a snapshot of how much iron is available for use. Elaine's saturation at 28.44% is within the optimal range of 25 to 40%, indicating healthy iron availability for red blood cell production and other functions.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, haemolytic anaemia, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4737","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3474","upper_optimal_position":"0.5818","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin and transferrin saturation. Elaine's serum iron at 18 umol/L is well within both ranges, indicating adequate circulating iron.","low_causes":"Iron deficiency, chronic disease, inflammation, heavy menstruation, poor dietary intake, malabsorption (PPI use can contribute)","high_causes":"Haemochromatosis, excessive supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3385","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. The liver produces more transferrin when iron stores are low and less when stores are adequate. Elaine's transferrin at 2.52 g/L is just within the laboratory range but below the optimal band. In isolation, a low-normal transferrin can simply reflect adequate iron stores (the liver does not need to produce as much carrier). Her ferritin at 50, iron at 18, and saturation at 28% all support this interpretation.","low_causes":"Adequate iron stores, chronic inflammation (negative acute phase protein), liver disease, malnutrition, haemochromatosis","high_causes":"Iron deficiency (body produces more to capture available iron), pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"56.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4620","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3344","upper_optimal_position":"0.6142","units":"umol/L","description":"Total iron binding capacity (TIBC) measures the blood's total capacity to bind and transport iron. It reflects the amount of transferrin available to carry iron. A high TIBC typically indicates iron deficiency (the body is increasing its capacity to capture iron), while a low TIBC can indicate iron overload or chronic disease. Elaine's TIBC at 56.4 umol/L is well within range, consistent with adequate iron stores.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3809","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.4841","units":"ng/mL","description":"Ferritin is the main storage protein for iron in the body. It gives the best single measure of total iron stores. Elaine's ferritin at 50 ng/mL is within both the laboratory and optimal ranges for women (optimal 40 to 150). This is a reassuring finding, particularly given her PPI use, which can impair iron absorption over time. Her iron stores are adequate to support red blood cell production and energy metabolism.","low_causes":"Iron deficiency, heavy menstruation, poor dietary intake, malabsorption, chronic blood loss, PPI use (long-term)","high_causes":"Iron overload, haemochromatosis, chronic inflammation (acute phase protein), liver disease, infection, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"261","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3487","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6082","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and declining through the day. A morning cortisol within the reference range confirms the adrenal glands are functioning. Elaine's cortisol at 261 nmol/L is within the morning reference range but sits in the lower half. In someone under extreme chronic stress, this can sometimes reflect adrenal adaptation, where the adrenal glands have been producing cortisol at a high rate for an extended period and begin to produce less. It does not indicate adrenal failure, but it is consistent with her reported fatigue and stress burden.","low_causes":"Adrenal insufficiency (Addison's disease), adrenal fatigue/adaptation (controversial), pituitary dysfunction, long-term steroid use (adrenal suppression)","high_causes":"Acute stress, Cushing's syndrome, pituitary tumour, corticosteroid use, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"379","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"71.6","upper_normal":"786.1","lower_optimal":"200","upper_optimal":"600","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3513","upper_optimal_position":"0.5740","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen and plays essential roles in bone density, cardiovascular health, brain function, mood, and skin. In perimenopausal women on HRT, this level indicates whether the oestrogen component of the replacement is reaching adequate levels. Elaine's oestradiol at 379 pmol/L is well above the post-menopausal range (below 118) and sits in the mid-follicular range, confirming that her HRT is providing good oestrogen coverage. This is a positive finding.","low_causes":"Menopause, perimenopause, low body fat, excessive exercise, primary ovarian insufficiency, pituitary dysfunction","high_causes":"HRT (expected), ovarian cysts, PCOS, obesity (aromatisation), liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4617","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone is produced primarily by the ovaries after ovulation and by the placenta during pregnancy. In the follicular phase of the cycle and in post-menopausal women, levels are naturally very low. Elaine's progesterone at 0.57 nmol/L falls within the follicular phase reference range (0.0 to 4.45). As a perimenopausal woman on HRT, the progesterone component of her regimen is important for endometrial protection if she still has a uterus. If her HRT includes oral or transdermal progesterone (such as utrogestan), this low blood level may warrant discussion with her prescriber. If she uses a Mirena coil for progestogen delivery, a low serum level is expected because it acts locally.","low_causes":"Follicular phase of cycle, anovulatory cycle, menopause, progesterone delivered locally (Mirena coil)","high_causes":"Luteal phase, pregnancy, ovarian cysts, congenital adrenal hyperplasia, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"12.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"1.9","upper_normal":"76.3","lower_optimal":"1.9","upper_optimal":"54.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6333","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the ovaries to produce hormones and release eggs. In perimenopausal women, LH levels can fluctuate widely. Elaine's LH at 12.73 mIU/mL sits within the follicular phase range (1.9 to 12.5), just marginally above the upper boundary. This is consistent with perimenopause, where the pituitary starts sending slightly stronger signals to the ovaries as their responsiveness declines.","low_causes":"Pituitary dysfunction, stress, excessive exercise, eating disorders, hormonal contraception","high_causes":"Perimenopause, menopause, polycystic ovarian syndrome, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"23.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"2.5","upper_normal":"116.3","lower_optimal":"2.5","upper_optimal":"40.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5547","units":"mIU/mL","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and drives follicle development and oestrogen production in the ovaries. Rising FSH is one of the hallmark signs of perimenopause and menopause, as the pituitary pushes harder to stimulate ovaries that are becoming less responsive. Elaine's FSH at 23.42 mIU/mL is above the typical follicular phase range (2.5 to 10.2) but below the post-menopausal threshold (23 to 116). This confirms active perimenopause. Her HRT is keeping oestradiol at good levels despite the elevated FSH drive.","low_causes":"Pituitary dysfunction, stress, excessive exercise, eating disorders, hormonal contraception, HRT (partial suppression)","high_causes":"Perimenopause, menopause, primary ovarian insufficiency, ovarian surgery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3492","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands in small amounts. It plays important roles in energy, libido, mood, muscle maintenance, and bone density. Elaine's testosterone at 0.6 nmol/L is within the laboratory range but towards the lower end and below the optimal band of 0.8 to 2.0. Low testosterone in perimenopausal women can contribute to fatigue, reduced motivation, and difficulty maintaining muscle mass. Her HRT prescriber may wish to consider whether testosterone supplementation could be beneficial.","low_causes":"Menopause, perimenopause, adrenal insufficiency, oral contraceptives, stress, low DHEA","high_causes":"PCOS, congenital adrenal hyperplasia, adrenal tumours, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3993","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3383","upper_optimal_position":"0.6083","units":"","description":"The free androgen index (FAI) estimates the proportion of testosterone that is biologically active (not bound to SHBG). It is calculated from total testosterone and SHBG. Elaine's FAI at 1.09 is within range, indicating that her SHBG is not excessively binding up her available testosterone.","low_causes":"Low testosterone, high SHBG, menopause, oral oestrogen use","high_causes":"PCOS, insulin resistance, low SHBG, exogenous androgens","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3697","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3496","upper_optimal_position":"0.5562","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It naturally declines with age but is a useful indicator of adrenal function. Elaine's DHEA-S at 1.6 umol/L (approximately 590 ug/dL) is within the laboratory range but below the optimal band. DHEA-S tends to decline during perimenopause and under chronic stress. A lower DHEA-S can contribute to the fatigue, low mood, and reduced resilience she is experiencing.","low_causes":"Ageing, chronic stress, adrenal insufficiency, long-term corticosteroid use","high_causes":"PCOS, congenital adrenal hyperplasia, adrenal tumour, DHEA supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5429","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, primarily known for its role in milk production. In non-pregnant, non-breastfeeding women, prolactin levels should be within the normal range. Elevated prolactin can cause menstrual irregularities and headaches. Elaine's prolactin at 102 uIU/mL is well within the normal range, ruling out prolactin-related pituitary issues.","low_causes":"Dopamine agonist medications, pituitary infarction (rare)","high_causes":"Pituitary adenoma (prolactinoma), some medications (antipsychotics, PPIs, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"54.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4102","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3435","upper_optimal_position":"0.5445","units":"nmol/L","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds to sex hormones, primarily testosterone and oestradiol, and regulates how much is available for the body to use. Elaine's SHBG at 54.9 nmol/L is within the optimal range. It is not excessively high, which means it is not overly restricting her available testosterone. This is consistent with her free androgen index being within range.","low_causes":"Insulin resistance, obesity, hypothyroidism, PCOS, high androgen levels","high_causes":"Oral oestrogen (HRT or contraception), hyperthyroidism, liver disease, ageing, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.008","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Free testosterone represents the small fraction of total testosterone that is not bound to proteins and is therefore biologically active. In women, this is a very small number. Elaine's calculated free testosterone of 0.008 nmol/L is consistent with her total testosterone of 0.6 and SHBG of 54.9. As a reference marker in women, this helps confirm that testosterone availability is at the lower end but not absent.","low_causes":"Low total testosterone, high SHBG, menopause","high_causes":"PCOS, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4105","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3640","upper_optimal_position":"0.4647","units":"mIU/L","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland to regulate the thyroid. It works on a feedback loop: when thyroid hormones are low, TSH rises to push the thyroid harder, and when they are adequate, TSH decreases. Elaine's TSH at 1.78 mIU/L is within the optimal range of 1.0 to 2.5, indicating the pituitary is satisfied with thyroid output. This is reassuring and rules out overt thyroid dysfunction.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction, early pregnancy","high_causes":"Hypothyroidism (primary), Hashimoto's thyroiditis, iodine deficiency, thyroid medication too low, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"13.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4048","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5905","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in the tissues. The 'free' portion is the unbound, biologically available fraction. Elaine's FT4 at 13.9 pmol/L is within the laboratory range (11.5 to 22.7) but sits just below the optimal band of 14 to 20. A lower FT4, even within the lab range, can contribute to symptoms of fatigue, brain fog, and poor concentration, all of which Elaine reports. With TSH being normal, this is not hypothyroidism, but it suggests the thyroid is operating at the lower end of its capacity. Worth monitoring if symptoms persist.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction, severe illness, some medications","high_causes":"Hyperthyroidism, early thyroid inflammation, excessive thyroid medication, amiodarone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4556","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use. It is produced primarily by converting T4 in the liver, kidneys, and other tissues. Elaine's FT3 at 4.4 pmol/L is within the lab range but just below the optimal band of 4.5 to 6.5. This is consistent with her FT4 being at the lower end. T3 is the hormone most directly related to energy, mental clarity, and metabolic rate, so suboptimal T3 could be contributing to her fatigue and brain fog. Conversion of T4 to T3 can be impaired by chronic stress, low selenium, low iron, and gut dysfunction.","low_causes":"Low FT4 (reduced substrate), impaired conversion (stress, inflammation, liver disease, selenium deficiency), non-thyroidal illness, certain medications","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are autoantibodies directed against an enzyme in the thyroid gland. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Elaine's TPO antibodies are below 6.6, well within the normal range, which effectively rules out autoimmune thyroid disease. This is an important negative finding.","low_causes":"Normal finding (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies are autoantibodies against thyroglobulin, a protein produced by the thyroid gland. Like TPO antibodies, their presence suggests autoimmune thyroid disease. Elaine's thyroglobulin antibodies are below 1.3, which is undetectable, as found in more than 80% of the population. This adds further reassurance that her thyroid is not being attacked by the immune system.","low_causes":"Normal finding (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (sometimes), other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3950","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.4889","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is primarily produced in the skin through sun exposure and is difficult to obtain in adequate amounts from diet alone, particularly in northern latitudes. Elaine's vitamin D at 79 nmol/L is within the optimal range of 75 to 120. This is a good result and means her current intake or sun exposure is adequate. A maintenance dose of vitamin D3 through autumn and winter will help sustain this level.","low_causes":"Limited sun exposure, northern latitude, dark skin, obesity (fat sequesters vitamin D), malabsorption, PPI use, liver or kidney disease, ageing","high_causes":"Excessive supplementation, granulomatous disease (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"4.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5547","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.6053","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the four small parathyroid glands in the neck. It regulates calcium and phosphate levels by acting on the bones, kidneys, and intestines. When calcium drops, PTH rises to bring it back up. Elaine's PTH at 4.1 pmol/L is within the laboratory range but at the upper end, above the optimal ceiling of 4.0. However, her corrected calcium at 2.41 is healthy, her vitamin D at 79 is adequate, and her phosphate is normal. A PTH at the upper end of range with normal calcium and vitamin D simply suggests the parathyroid glands are working at the upper end of their normal activity and is not a concern in this context.","low_causes":"Hypoparathyroidism, high calcium, high vitamin D, magnesium deficiency (paradoxically can suppress PTH)","high_causes":"Vitamin D deficiency, low calcium, primary hyperparathyroidism, kidney disease, secondary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"266","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3759","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6149","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It requires stomach acid for absorption from food, which is why PPI (proton pump inhibitor) use is a well-recognised cause of gradual B12 depletion. Elaine's B12 at 266 pg/mL is within the laboratory range (193 to 982) but significantly below the optimal threshold of 500. This suboptimal level connects directly to her symptoms of fatigue, brain fog, and low energy, all of which are associated with inadequate B12. Because her PPI reduces stomach acid and impairs B12 absorption from food and standard oral supplements, sublingual methylcobalamin (placed under the tongue) is the recommended form, as it bypasses the stomach entirely.","low_causes":"PPI or H2 blocker use, vegan or vegetarian diet, pernicious anaemia, atrophic gastritis, Crohn's disease (ileal), metformin use, ageing","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6666666667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and cell division. It works closely with B12, and deficiency in either can cause similar problems. Elaine's folate at 14 ng/mL is healthy and above the optimal threshold of 8, indicating adequate dietary intake. This is a positive finding.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, alcohol use, some medications (methotrexate, phenytoin), pregnancy","high_causes":"Supplementation, high folate diet, B12 deficiency (folate can appear elevated when B12 is deficient as it is not being utilised)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3543","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in the heart, brain, and skeletal muscle. It is released into the blood when these tissues are damaged. Elaine's CK at 62 U/L is well within range, confirming no significant muscle damage or strain. This is consistent with her current low activity level.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, heart attack (CK-MB fraction), hypothyroidism, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"9.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1548","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA-125 is a protein that can be elevated in ovarian cancer, but is also raised by many benign conditions including endometriosis, fibroids, pelvic inflammatory disease, and menstruation. It is used as a screening and monitoring tool rather than a diagnostic one. Elaine's CA-125 at 9.6 U/mL is well within the normal range, which is a reassuring finding.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, menstruation, pregnancy, liver disease, peritonitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"16.11","within_normal":"TRUE","within_optimal":"TRUE","resu ":"Carcinoembryonic antigen (CEA) is a protein that can be elevated in several cancers, particularly colorectal cancer, as well as in some benign conditions and in smokers. Elaine's CEA at below 0.5 ng/mL is very low, confirming no elevation. This is a clean result.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, pancreatic cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4702","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"Immunoglobulin G (IgG) is the most abundant antibody in the blood and is responsible for long-term immunity against bacteria and viruses. It is produced by B lymphocytes as part of the adaptive immune response. Elaine's IgG at 10.4 g/L is within the reference range, indicating a healthy humoral immune system.","low_causes":"Immunodeficiency, certain medications (immunosuppressants), nephrotic syndrome, chronic lymphocytic leukaemia","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma (IgG type), sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"Immunoglobulin M (IgM) is the first antibody produced in response to a new infection. It indicates recent or acute immune activation. Elaine's IgM at 1.5 g/L is within range, suggesting no current acute immune challenge.","low_causes":"Immunodeficiency, certain medications, chronic lymphocytic leukaemia","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4613","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"Immunoglobulin A (IgA) is the main antibody found in mucosal surfaces, including the gut, respiratory tract, and urogenital tract. It provides the first line of immune defence at these surfaces. Elaine's IgA at 1.6 g/L is within range. Adequate IgA is important for validating the coeliac screen, as IgA-deficient individuals can have false-negative coeliac results. Elaine's IgA is adequate, so her negative coeliac screen is reliable.","low_causes":"Selective IgA deficiency (commonest primary immunodeficiency), immunosuppressive medications","high_causes":"Liver disease (especially alcoholic), coeliac disease, IgA nephropathy, chronic infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"41.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2095","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Immunoglobulin E (IgE) is the antibody most associated with allergic reactions and parasitic infections. Elevated IgE indicates allergic tendency or parasitic exposure. Elaine's IgE at 41.9 IU/mL is within range, suggesting no significant allergic predisposition or parasitic infection.","low_causes":"Not clinically significant in isolation","high_causes":"Allergic conditions (eczema, asthma, hay fever), parasitic infections, allergic bronchopulmonary aspergillosis, hyper-IgE syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor (RF) is an autoantibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Elaine's RF at 6 IU/mL is within the normal range and negative, making rheumatoid arthritis less likely as a cause of any joint symptoms.","low_causes":"Not clinically significant (negative is normal)","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, systemic lupus erythematosus, chronic infection, liver disease, ageing (false positives increase with age)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"Negative","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0877","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening blood test for coeliac disease, an autoimmune condition triggered by gluten. A negative result, as Elaine has at 1.26 CU (well below the 7.19 threshold), makes coeliac disease very unlikely while she is eating a gluten-containing diet. This is an important negative finding given her gastrointestinal symptoms. Her IgA level is adequate, which confirms the test is valid (IgA-deficient individuals can have false-negative coeliac screens).","low_causes":"Not applicable (negative is normal)","high_causes":"Coeliac disease, dermatitis herpetiformis, rarely other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7021","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3759","upper_optimal_position":"0.6666666667","units":"mmol/L","description":"Total antioxidant activity (TAA) measures the overall capacity of the blood to neutralise free radicals and oxidative stress. Elaine's TAA at 1.79 mmol/L is marginally above the 1.77 upper limit. This is not a concern. A slightly elevated antioxidant capacity can result from dietary antioxidant intake (fruits, vegetables, tea, coffee) or supplementation. If anything, it reflects a positive dietary pattern.","low_causes":"Poor dietary antioxidant intake, chronic oxidative stress, smoking, chronic disease","high_causes":"High dietary antioxidant intake, supplementation (vitamin C, vitamin E, polyphenols), bilirubin elevation, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"6","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity or alkalinity of the urine. Normal urine pH typically ranges from 4.5 to 8. A pH of 6 is mildly acidic, which is normal and reflects the body's acid-base regulation through the kidneys.","low_causes":"High protein diet, metabolic acidosis, dehydration, cranberry intake","high_causes":"Vegetarian/vegan diet, urinary tract infection (urease-producing organisms), metabolic alkalosis, bicarbonate supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_protein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/L","description":"Urine protein tests for the presence of protein in the urine. Healthy kidneys retain protein in the blood, so a negative result is expected and confirms that Elaine's kidneys are not leaking protein, which is consistent with her excellent eGFR and creatinine results.","low_causes":"Not applicable","high_causes":"Kidney disease, urinary tract infection, diabetes, hypertension, fever, intense exercise, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urine_ketones","name":"Urine Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Ketones in the urine indicate the body is burning fat for fuel rather than glucose. This can occur during fasting, very low carbohydrate diets, or in uncontrolled diabetes (diabetic ketoacidosis). A negative result is expected on a standard mixed diet with normal blood sugar control.","low_causes":"Not applicable","high_causes":"Fasting, very l function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

//  COMPONENT BUILDERS

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);

}

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
