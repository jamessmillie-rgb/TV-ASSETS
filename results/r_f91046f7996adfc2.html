orth noting for her records.\n\nHer hormone profile suggests she was likely in the follicular phase of her menstrual cycle at the time of the blood draw. Oestradiol at 726 pmol/L is at the upper end of the follicular range, approaching mid-cycle levels, which may indicate she was in the late follicular phase or approaching ovulation. Progesterone at 0.77 nmol/L is consistent with the follicular phase, before ovulation triggers progesterone production. LH at 7.77 and FSH at 5.03 are both within follicular ranges. Her testosterone at 1.4 nmol/L is within the female range, and her free androgen index at 2.83 is within range. SHBG at 49.4 is within range. DHEA-S at 4.4 umol/L, converting to approximately 1,621 ug/dL, is within range. Prolactin at 230 is within the non-pregnant range.\n\nHer cortisol at 430 nmol/L is within the morning reference range of 145 to 619. Cortisol is the body's primary stress hormone, and at 430 it sits in the upper half of the range. While this is not abnormal, it is worth noting alongside her reported stress and anxiety. A single morning cortisol cannot diagnose a stress problem, as it fluctuates throughout the day, but lifestyle strategies to manage cortisol, discussed below, may help her symptoms.\n\nHer uric acid at 204 umol/L is within the laboratory range but sits within the optimal band of 160 to 320 for women. Her creatine kinase at 162 is within range, reflecting no significant muscle damage. Her MPV, mean platelet volume, at 10.2 is marginally above the upper limit of 10.1. At this margin, this is laboratory variation and not clinically significant. Her MCHC at 344 is marginally below the upper limit of 345, effectively at the boundary and of no concern.\n\nHer urinalysis is largely unremarkable. WBCs at 10 are at the threshold of significance, and with a negative nitrite test and no symptoms, this does not suggest infection. Her bacterial count and urine culture are pending and should be reviewed when available.\n\nLate-arriving results: her Total Antioxidant Activity sample was returned as 'Insufficient' by the laboratory, meaning the sample could not be analysed, most likely due to a processing issue rather than anything related to her health. This is not a clinical concern and does not change any of the findings or recommendations in this report. If she is interested in this marker, it can be repeated on a fresh sample at her next blood draw. The remaining candidates, Reticulocytes Absolute, Cystatin C eGFR, FIB-4 Score, VLDL Cholesterol, Parathyroid Hormone, and CA 15-3, were all already included and interpreted in the original report.\n\nLate-arriving results: the urine culture has returned showing significant growth of Escherichia coli, with broad antibiotic sensitivity including to ciprofloxacin, ampicillin, amoxicillin/clavulanic acid, gentamicin, ceftriaxone, and several other agents, and intermediate sensitivity to cefuroxime and temocillin. Importantly, the sample was collected in a plain bottle without boric acid preservative, which the laboratory has specifically flagged as a factor that can cause bacterial overgrowth during transport. Given that Mishal has no urinary symptoms, her nitrite test was negative, and her urinary white blood cells were only borderline at 10, this picture is most consistent with sample contamination or overgrowth rather than a genuine urinary tract infection. No antibiotic treatment is needed. However, if she develops any urinary symptoms such as burning, frequency, urgency, or cloudy urine, she should see her GP promptly and bring this culture result, as the sensitivity profile would allow targeted antibiotic selection. Any future urine samples should be collected in a boric acid-preserved bottle for a more reliable result.","links":"Mishal's most impactful changes will come from three areas: optimising her diet and activity to support fat loss, addressing her nutritional gaps, and having a focused conversation with her GP about her Lp(a) and lipid profile.\n\nStarting with nutrition, her basal metabolic rate at 68.5 kg, 155 cm, and age 29 is approximately 1,430 kcal. With her current activity level of one cardio session per week and 5,000 to 7,500 steps, her maintenance calories sit at roughly 2,070 to 2,150 kcal per day. To achieve steady fat loss of 0.5 to 0.75 kg per week, a calorie range of 1,550 to 1,700 kcal per day would be appropriate, creating a moderate deficit without being restrictive enough to cause fatigue or mood deterioration. Her protein target should be 90 to 110 grams per day, which at her body weight equates to approximately 1.3 to 1.6 g/kg. Protein is the most important macronutrient for preserving muscle during fat loss, for satiety, and for supporting her iron and B12 status through food first. Good sources that also deliver iron and B12 include red meat twice per week, eggs, poultry, fish, and legumes. A realistic initial weight target would be 58 to 62 kg, which would bring her BMI into the 24 to 26 range, but even losing 5 kg to reach 63.5 kg would meaningfully improve her metabolic markers and energy levels.\n\nFor her lipid profile, dietary changes that can lower LDL and ApoB include increasing soluble fibre to 10 to 15 grams per day through oats, barley, lentils, beans, and psyllium husk. Eating oily fish such as salmon, mackerel, or sardines two to three times per week provides omega-3 fatty acids that lower triglycerides (already excellent) and have anti-inflammatory effects on the vessel wall, which is particularly relevant with her elevated Lp(a). Reducing saturated fat by swapping butter for olive oil, choosing leaner cuts of meat, and reducing processed food intake will help lower LDL. These changes, combined with fat loss, could realistically bring her ApoB below 0.9 and her LDL closer to the 2.6 target within six to twelve months.\n\nFor activity, adding two to three resistance training sessions per week would be the single most impactful change she could make. Resistance training improves insulin sensitivity, supports fat loss by preserving and building metabolically active muscle tissue, improves mood and reduces anxiety through neurochemical pathways, strengthens bones, and is associated with improved cardiovascular outcomes independent of weight loss. Increasing her daily steps to 7,500 to 10,000 would also meaningfully increase her daily energy expenditure and has strong evidence for improving mood and reducing anxiety.\n\nFor alcohol, while her liver is currently handling the intake well, reducing from more than 7 drinks per week to under 7, and ideally under 4, would support her fat loss goals because alcohol provides roughly 7 kcal per gram with no nutritional value, disrupts sleep quality even when it feels like it helps with falling asleep, and can contribute to low mood and anxiety through its effects on GABA and serotonin signalling. It is also worth noting that alcohol is one of the few modifiable factors that may interact with Lp(a)-driven risk, though the evidence here is less established than for LDL.\n\nFor her GP conversation, she should bring three specific findings. First, her Lp(a) of 196.85 nmol/L, which should be recorded permanently on her medical record and may warrant referral to a lipid clinic given her age and the level. The GP may wish to calculate her QRISK score with Lp(a) factored in, and should consider whether statin therapy is appropriate given the combination of elevated Lp(a), elevated ApoB, and South Asian ethnicity, all of which are independent cardiovascular risk factors. Second, her CA-125 of 35.6 should be repeated on a fresh sample, ideally in the early follicular phase, to confirm whether this is a transient finding. Third, her corrected calcium of 2.16 and PTH of 1.0 should be noted, with a repeat calcium on a fresh sample if the GP considers it warranted.\n\nFor sleep and stress, given her reported anxiety and fatigue, practical steps include setting a fixed wake time seven days a week, getting outside within an hour of waking for natural light exposure, cutting caffeine by 1pm, keeping the bedroom cool at 16 to 18 degrees, and considering a wind-down routine that avoids screens for 30 to 60 minutes before bed. Magnesium glycinate taken before bed, discussed in supplementation, supports both sleep quality and stress resilience.\n\nA retest in four to six months should include a lipid panel with ApoB to track progress, vitamin D to check supplementation response, vitamin B12 to check supplementation response, ferritin and a full blood count, corrected calcium, and a repeat CA-125 timed to the early follicular phase.","flags":"LIPIDS AND CARDIOVASCULAR: Lp(a) 196.85 nmol/L (target below 32). Genetically determined, moderate to high risk category. Permanent medical record entry recommended. First-degree relative testing advised. Referral to lipid clinic may be appropriate given combination with elevated ApoB, South Asian ethnicity, and age 29, allowing decades of cumulative exposure. ApoB 0.95 g/L (target below 0.9). LDL 3.19 mmol/L (optimal below 2.6). ApoB/A-I ratio 0.62 (target below 0.6 for women). Total cholesterol 5.4 (desirable below 5.18). These modifiable lipid markers should be optimised aggressively given the non-modifiable Lp(a) burden.\n\nTUMOUR MARKERS: CA-125 35.6 U/mL (upper limit 35). Marginal elevation in a premenopausal woman most likely reflects benign ovarian activity, endometriosis, or cycle-related fluctuation. Recommend repeat in early follicular phase (days 1 to 5) on a fresh sample.\n\nELECTROLYTES AND MINERALS: Corrected calcium 2.16 mmol/L (range 2.2 to 2.6). PTH 1.0 pmol/L (range 0.98 to 4.73). The marginal corrected calcium reduction with non-elevated PTH likely reflects overcorrection due to albumin at 47. Repeat on fresh sample if clinically indicated. Vitamin D 53 nmol/L, just sufficient but below optimal range of 75 to 120. Supplementation recommended.\n\nHAEMATOLOGY: WBC 3.7 (range 4.0 to 10.0). Neutrophils 1.53 (range 2.0 to 7.0). In a patient of South Asian heritage with normal CRP, ESR, and lymphocytes, this pattern is consistent with benign ethnic neutropenia. Recommend noting on GP record to avoid repeated investigation. Reticulocyte absolute count 46.2 (range 50 to 100). Marginal reduction likely reflecting early iron-limited erythropoiesis in the context of low ferritin.\n\nIRON STUDIES: Ferritin 22 ng/mL. Within laboratory range but below optimal threshold of 40 for premenopausal women. Transferrin saturation 20.7%, below optimal band of 25 to 40%. Consistent with depleting iron stores.\n\nGLUCOSE AND INSULIN: C-Peptide 0.608 ug/L (range 1.1 to 4.4). Low in the context of low-normal insulin and normal glucose/HbA1c, reflecting insulin sensitivity rather than pancreatic insufficiency. HOMA-IR 0.74 confirms.\n\nVITAMINS: B12 239 pg/mL. Within laboratory range but below optimal threshold of 500. Supplementation recommended.\n\nMINOR: MPV 10.2 fL (range 7.1 to 10.1). Marginal, not clinically significant.\n\nPENDING: Total Antioxidant Activity, Bacterial Count, and Urine Culture and Sensitivities are awaited. Review on receipt.\n\nReassuring negatives: CRP 0.3, ESR 1, liver enzymes all clean, GGT 18 despite alcohol intake, FIB-4 0.58, thyroid function optimal with negative antibodies, HbA1c 38, HOMA-IR 0.74, kidney function excellent with Cystatin C eGFR 104, all immunoglobulins normal, rheumatoid factor negative, coeliac screen negative, CA 15-3 normal, CA 19-9 normal, CEA normal.","recommendations":"1. Book a GP appointment to discuss the Lp(a) result of 196.85 nmol/L. Request this be recorded permanently on her medical record. Ask about referral to a lipid clinic and whether statin therapy should be considered given the combination of elevated Lp(a), elevated ApoB, and South Asian heritage.\n\n2. Ask first-degree relatives (parents, siblings) to have their Lp(a) tested, as the trait is inherited with approximately 50% chance of transmission.\n\n3. Mention the CA-125 of 35.6 to her GP. Request a repeat test timed to days 1 to 5 of her menstrual cycle.\n\n4. Mention the corrected calcium of 2.16 and PTH of 1.0 to her GP for their records.\n\n5. Begin vitamin D supplementation at 3,000 IU daily with a fat-containing meal, alongside vitamin K2 MK-7 at 100 mcg.\n\n6. Begin sublingual methylcobalamin (vitamin B12) at 1,000 mcg daily.\n\n7. Address iron stores through diet first: red meat twice per week, pairing plant-based iron sources with vitamin C. If ferritin has not improved to above 40 on retest, consider ferrous bisglycinate 25 mg every other day with vitamin C.\n\n8. Increase dietary soluble fibre to 10 to 15 grams per day (oats, lentils, beans, psyllium husk) to support LDL reduction.\n\n9. Eat oily fish (salmon, mackerel, sardines) two to three times per week.\n\n10. Reduce saturated fat intake by swapping butter for olive oil, choosing leaner cuts, and reducing processed food.\n\n11. Set calorie intake to 1,550 to 1,700 kcal per day with 90 to 110 grams of protein daily to support fat loss while preserving muscle.\n\n12. Add two to three resistance training sessions per week. This is the single most impactful addition for her goals of fat loss, mood improvement, and long-term health.\n\n13. Increase daily steps to 7,500 to 10,000.\n\n14. Reduce alcohol to under 7 drinks per week, ideally under 4.\n\n15. Implement sleep hygiene: fixed wake time, outdoor light within an hour of waking, caffeine cut-off at 1pm, cool bedroom at 16 to 18 degrees.\n\n16. Retest in four to six months: lipid panel with ApoB, vitamin D, B12, ferritin, full blood count, corrected calcium, and CA-125 (early follicular phase).","supplementation":"Vitamin D3: 3,000 IU (75 mcg) of cholecalciferol daily, taken with her largest meal that contains fat. Her level of 53 nmol/L is just sufficient but well below the optimal range of 75 to 120 nmol/L. As someone of South Asian heritage, she has a higher baseline requirement for supplementation due to reduced cutaneous synthesis from higher melanin levels. The 3,000 IU dose is appropriate to bring her into the optimal range over three to four months without overshooting. Vitamin D supports calcium absorption, immune function, and mood regulation, all relevant to her reported symptoms.\n\nVitamin K2: 100 mcg of MK-7 daily, taken alongside her vitamin D. Vitamin K2 directs calcium into bones and teeth rather than allowing it to deposit in blood vessels. It should always accompany vitamin D supplementation, and is particularly relevant here given her marginally low corrected calcium.\n\nVitamin B12: 1,000 mcg of sublingual methylcobalamin daily, dissolved under the tongue. Her B12 at 239 pg/mL is below the optimal threshold of 500 and is a plausible contributor to her fatigue and low mood. Sublingual delivery bypasses the digestive tract and provides more reliable absorption than oral tablets. She should notice an improvement in energy within four to six weeks if B12 was a contributing factor.\n\nMagnesium: 300 mg of magnesium glycinate taken 30 to 60 minutes before bed. Her serum magnesium at 0.94 is within the optimal range, but magnesium glycinate specifically supports sleep quality, stress resilience, and muscle recovery. The glycinate form is the best tolerated and has calming properties through its interaction with GABA receptors, making it the right choice for someone reporting anxiety and low mood.\n\nOmega-3: 2 grams of combined EPA and DHA daily from a high-quality fish oil, taken with food. While her triglycerides are already excellent, omega-3 fatty acids have anti-inflammatory effects on the blood vessel wall that are particularly important in the presence of elevated Lp(a). They also have evidence for supporting mood and reducing anxiety. If she can eat oily fish two to three times per week, the supplemental dose can be reduced to 1 gram daily.\n\nSoluble fibre: 5 to 10 grams of psyllium husk daily (in addition to dietary sources like oats and lentils), mixed into water or a smoothie. Soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol from the blood to make more, thereby lowering circulating LDL. This is one of the most effective non-pharmaceutical tools for reducing ApoB.\n\nThe most important changes from this report are not supplements. They are adding resistance training two to three times per week, increasing her daily steps, reducing her calorie intake to the 1,550 to 1,700 range with adequate protein, reducing alcohol, and having the GP conversation about her Lp(a) and lipid profile. The supplements support the foundation, but the foundation is built through movement, nutrition, and recovery.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1607","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it one of the most specific markers of liver health. Mishal's ALT at 18 IU/L is well within the optimal threshold of below 25 for women, indicating her liver cells are healthy and under no metabolic strain. This is a reassuring finding, particularly given her alcohol intake.","low_causes":"","high_causes":"Liver disease, alcohol excess, medications, obesity, viral hepatitis, non-alcoholic fatty liver disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5271","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT because it can be released during exercise or muscle damage. Mishal's AST at 19 IU/L is within the optimal range, and when viewed alongside her clean ALT and GGT, confirms a healthy liver.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart disease, muscle damage, strenuous exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2368","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5263","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol intake and bile duct obstruction. It is often the first liver enzyme to rise when alcohol is causing strain. Mishal's GGT at 18 IU/L is well within the optimal threshold of below 25, which is a genuinely positive finding for someone consuming more than 7 drinks per week. It means the liver is currently processing alcohol without visible metabolic cost.","low_causes":"","high_causes":"Alcohol excess, bile duct obstruction, liver disease, medications, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bones, and bile ducts. It can be elevated in liver or bone disease but is also naturally higher in younger people whose bones are still remodelling. Mishal's ALP at 46 IU/L is at the lower boundary of the laboratory range, which is entirely normal and reflects healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bone disease, liver disease, bile duct obstruction, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. It is processed by the liver and excreted in bile. Elevated bilirubin can indicate liver disease or excessive red blood cell destruction, though it can also be harmlessly elevated in a condition called Gilbert's syndrome. Mishal's bilirubin at 14 umol/L is comfortably within range.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It provides a broad overview of nutritional status and immune function. Mishal's total protein at 70 g/L is comfortably within the optimal range, suggesting adequate protein intake and normal liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6042","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications around the body and maintains fluid balance between blood vessels and tissues. Mishal's albumin at 47 g/L is within the optimal range and reflects healthy liver synthetic function and adequate protein nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) and transport proteins. It is calculated by subtracting albumin from total protein. Mishal's globulin at 23 g/L is within the optimal range, consistent with normal immune function.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"2.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5571","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.5","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. A healthy ratio suggests that the liver is producing albumin adequately and that the immune system is not overproducing globulins in response to inflammation or infection. Mishal's ratio of 2.04 is within the optimal range.","low_causes":"Liver disease, autoimmune conditions, chronic infection","high_causes":"Immunodeficiency syndromes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"0.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. A score below 1.3 reliably excludes significant fibrosis. Mishal's score of 0.58 is well below this threshold, confirming no evidence of liver scarring.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age-related calculation artefact","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4621","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6136","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels can indicate pancreatic inflammation or disease. Mishal's amylase at 68 IU/L is comfortably within range, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis with pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4894","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase, making it a reliable marker of pancreatic health. Mishal's lipase at 35 U/L is within the optimal range.","low_causes":"","high_causes":"Acute pancreatitis, chronic pancreatitis, pancreatic obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5213","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures the combined amount of all cholesterol in the blood, including LDL, HDL, and VLDL. While the total number provides an overview, it is less informative than the individual fractions. Mishal's total cholesterol at 5.4 mmol/L is above the desirable threshold of 5.18, but importantly, a significant proportion is carried by her excellent HDL of 2.0. The non-HDL cholesterol of 3.4 and the ApoB of 0.95 give a more accurate picture of risk.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1441","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are a type of fat carried in the blood, primarily reflecting recent dietary fat and carbohydrate intake and the body's ability to clear fat from the bloodstream. Mishal's triglycerides at 0.49 mmol/L are excellent, well below the optimal threshold of 1.0. This is a strong indicator of good metabolic health and efficient fat metabolism.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption","high_causes":"High-carbohydrate diet, obesity, alcohol excess, insulin resistance, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1410","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein cholesterol, carries triglycerides from the liver to tissues. It is a precursor to LDL and reflects triglyceride metabolism. Mishal's VLDL at 0.22 mmol/L is well within the optimal range, consistent with her excellent triglyceride level.","low_causes":"","high_causes":"High-carbohydrate diet, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6452","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein cholesterol, is often called 'good' cholesterol because it transports cholesterol away from artery walls back to the liver for disposal. Higher levels are protective against cardiovascular disease. Mishal's HDL at 2.0 mmol/L is excellent, well above the optimal threshold of 1.6 for women. This is one of the strongest positives in her lipid profile.","low_causes":"Sedentary lifestyle, obesity, smoking, high-carbohydrate diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5317","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, or low-density lipoprotein cholesterol, carries cholesterol from the liver to cells throughout the body. When levels are too high, LDL particles can penetrate artery walls and trigger plaque formation, the process that underlies heart attacks and strokes. Mishal's LDL at 3.19 mmol/L is above both the laboratory upper limit of 3.0 and the optimal target of below 2.6. With her elevated Lp(a), which independently drives cholesterol into artery walls, optimising her modifiable LDL through diet, activity, and potentially medication is particularly important.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick assessment of cardiovascular risk by comparing total cholesterol to the protective HDL fraction. A lower ratio is better. Mishal's ratio of 2.7 is excellent, well within the optimal range, driven primarily by her high HDL of 2.0.","low_causes":"","high_causes":"High LDL, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"37.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9260","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"This represents the proportion of total cholesterol carried by protective HDL particles. A higher percentage indicates a more favourable distribution of cholesterol. Mishal's HDL percentage of 37% is excellent, meaning over a third of her total cholesterol is the protective type.","low_causes":"Sedentary lifestyle, obesity, insulin resistance","high_causes":"Regular exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions, including LDL and VLDL, in a single number. Mishal's non-HDL at 3.4 is within the laboratory range of below 4 but above the optimal target of below 3.0, reflecting her elevated LDL.","low_causes":"","high_causes":"High LDL, elevated triglycerides, diet, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.55","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It reflects the number and function of HDL particles, which remove cholesterol from artery walls and transport it back to the liver. Mishal's ApoA-I at 1.54 g/L is above the desirable threshold of 1.4, consistent with her excellent HDL level and confirming good reverse cholesterol transport capacity.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the structural protein found on every LDL, VLDL, and Lp(a) particle. Because each of these particles carries exactly one ApoB molecule, the ApoB level effectively counts the total number of atherogenic particles in the blood. Many cardiologists consider it a more accurate predictor of cardiovascular risk than LDL cholesterol alone. Mishal's ApoB at 0.95 g/L is above the desirable threshold of 0.9 and the optimal target of below 0.8. Importantly, a portion of her ApoB count is being driven by her very high Lp(a), which she cannot change. This makes optimising the modifiable LDL-driven portion through diet, exercise, and potentially medication all the more important.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet, genetics, elevated Lp(a), hypothyroidism, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA-I ratio compares the number of atherogenic (artery-damaging) particles to protective (artery-clearing) particles. It is considered one of the best single summary markers of cardiovascular risk. A ratio below 0.6 indicates lower risk for women. Mishal's ratio of 0.62 is marginally above this threshold, placing her in the average risk category. Her strong ApoA-I of 1.54 is partially offsetting her elevated ApoB, but reducing ApoB through lifestyle changes would bring this ratio into the lower-risk zone.","low_causes":"","high_causes":"High LDL, elevated Lp(a), low HDL, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"196.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a specialised lipoprotein particle that is almost entirely genetically determined. Unlike LDL cholesterol, diet, exercise, and most medications have minimal effect on Lp(a) levels. It increases cardiovascular risk through three mechanisms: depositing cholesterol into artery walls, promoting blood clot formation due to its structural similarity to plasminogen (a clot-dissolving protein), and driving inflammation at the vessel wall. Mishal's Lp(a) at 196.85 nmol/L is significantly above the desirable threshold of 32, placing her in the moderate to high risk category. This is an inherited finding and should be recorded permanently on her medical record. First-degree relatives should be offered testing. This result elevates the importance of optimising all modifiable cardiovascular risk factors.","low_causes":"","high_causes":"Genetics (inherited trait, not modifiable through lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that serves as a powerful surrogate for insulin resistance and the presence of small, dense LDL particles, which are more atherogenic than large buoyant ones. A ratio below 0.87 is optimal. Mishal's ratio of 0.25 is outstanding and one of the strongest metabolic markers in her report, indicating excellent insulin sensitivity and a favourable LDL particle profile.","low_causes":"","high_causes":"Insulin resistance, high-carbohydrate diet, metabolic syndrome, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_chol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1313","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol estimates the cholesterol carried by triglyceride-rich intermediate-density lipoprotein particles. It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent risk factor for cardiovascular disease and is closely linked to insulin resistance. Mishal's remnant cholesterol at 0.21 mmol/L is excellent, well within the optimal range of below 0.5.","low_causes":"","high_causes":"Insulin resistance, obesity, high-carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after a period of not eating. It provides a snapshot of how well the body is controlling blood sugar at that moment. Mishal's glucose at 4.6 mmol/L is within the optimal range of 4.0 to 5.4, indicating excellent blood sugar control.","low_causes":"Fasting, excessive insulin, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for approximately three months, it reflects average blood sugar control over that period. Mishal's HbA1c of 5.6% is within the normal range of below 6.0%, indicating healthy long-term blood sugar management.","low_causes":"Anaemia with high red cell turnover, blood loss","high_causes":"Pre-diabetes, diabetes, sustained high blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in SI units (mmol/mol) rather than percentage. Mishal's result of 38 mmol/mol is within the normal range of below 42 and close to the optimal threshold of below 36. While not quite in the optimal zone, this is a healthy result that shows no sign of pre-diabetes.","low_causes":"Anaemia with high red cell turnover, blood loss","high_causes":"Pre-diabetes, diabetes, sustained high blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ins","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"3.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3499","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4057","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. Lower levels (within range) indicate better insulin sensitivity, meaning the body's cells respond well to insulin's signal. Mishal's insulin at 3.64 mIU/L is within the optimal range of 2 to 8, reflecting excellent insulin sensitivity. This is particularly reassuring at a BMI of 28.5, as it means her body is handling glucose efficiently without needing to produce excessive insulin.","low_causes":"Insulin sensitivity (positive), very low carbohydrate diet, type 1 diabetes (with high glucose)","high_causes":"Insulin resistance, pre-diabetes, obesity, metabolic syndrome, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.608","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0920","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is produced by the pancreas in equal amounts to insulin. It serves as a reliable marker of how much insulin the pancreas is manufacturing, because unlike insulin itself, C-Peptide is not cleared by the liver on first pass. Mishal's C-Peptide at 0.608 ug/L (approximately 201 pmol/L) is below the laboratory range of 1.1 to 4.4. However, this must be interpreted alongside her normal glucose, normal HbA1c, and low-normal insulin. The low C-Peptide simply reflects that her pancreas does not need to produce much insulin because her cells are highly responsive to it. This is a sign of insulin sensitivity, not pancreatic insufficiency. The lab note cautions that delayed sample separation can reduce C-Peptide levels, which may also be a contributing factor.","low_causes":"Insulin sensitivity (when glucose is normal), delayed sample processing, type 1 diabetes (when glucose is high)","high_causes":"Insulin resistance, insulinoma, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3700","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculation that estimates how resistant the body's cells are to insulin's effects, using fasting glucose and fasting insulin. A lower score indicates better insulin sensitivity. Mishal's HOMA-IR at 0.74 places her firmly in the insulin-sensitive category (below 1.0 is optimal). This is a genuinely encouraging finding at a BMI of 28.5, as it means her body is managing blood sugar efficiently without metabolic strain.","low_causes":"High insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, pre-diabetes, obesity, metabolic syndrome, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"66.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2551","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"","description":"HOMA-B estimates pancreatic beta-cell function, reflecting how much insulin the pancreas produces relative to the blood sugar level. Mishal's HOMA-B calculates to 66.2, below the laboratory range of 80 to 200. However, her fasting glucose at 4.6 and HbA1c at 38 are both healthy, meaning the pancreas is producing exactly the right amount of insulin for her needs. A lower HOMA-B in the context of normal blood sugar reflects efficient insulin signalling where a small amount of insulin does the full job. This is insulin sensitivity, not beta-cell failure.","low_causes":"Insulin sensitivity (with normal glucose), beta-cell dysfunction (with high glucose), low carbohydrate diet","high_causes":"Insulin resistance (compensatory increase), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"HS-CRP","group":"INFLAMMATION","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.03","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity CRP measures low levels of C-reactive protein, a marker produced by the liver in response to inflammation anywhere in the body. It is used both to detect acute illness and as a long-term predictor of cardiovascular risk. A level below 1.0 mg/L is considered optimal for cardiovascular risk assessment. Mishal's hs-CRP at 0.3 mg/L is excellent, indicating minimal background inflammation. This is a reassuring finding and argues against any chronic inflammatory process contributing to her symptoms.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. Mishal's ESR at 1 mm/hour is about as low as this marker gets, providing strong confirmation alongside her CRP of 0.3 that there is no systemic inflammation.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, anaemia, pregnancy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Sodium is the primary electrolyte that maintains fluid balance and blood pressure. It is tightly regulated by the kidneys. Mishal's sodium at 140 mmol/L is within the optimal range, reflecting normal fluid balance and kidney regulation.","low_causes":"Overhydration, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance, blood pressure, and the acid-base balance of the blood. Mishal's chloride at 97 mmol/L is within the laboratory range, sitting just below the optimal band. This is a minor variation of no clinical significance.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3545","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's main acid-base buffer, helping to maintain blood pH within its narrow range. It is regulated by the lungs and kidneys. Mishal's bicarbonate at 20.7 mmol/L is within the laboratory range but at the lower end. This is a common finding and is not clinically significant in isolation.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4503","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4152","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Most calcium in the blood is bound to albumin, with a smaller fraction circulating freely. Mishal's uncorrected calcium at 2.28 mmol/L is within the optimal range. The corrected calcium (see below) adjusts for her albumin level.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the measured calcium for the patient's albumin level, providing a more accurate estimate of the physiologically active calcium in the blood. When albumin is at the higher end of range, as Mishal's is at 47, the correction formula can overcorrect, pushing the result slightly below the threshold. Mishal's corrected calcium at 2.16 is marginally below the lower limit of 2.2. Her PTH at 1.0 is not elevated, which would be expected if calcium were genuinely low. This pattern suggests a calculation artefact rather than true hypocalcaemia, but it should be mentioned to her GP for completeness, particularly as her vitamin D is suboptimal and vitamin D is needed for calcium absorption.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease, calculation artefact with high albumin","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5690","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, and sleep regulation. Mishal's magnesium at 0.94 mmol/L is within the optimal band of 0.85 to 1.05. However, serum magnesium reflects only about 1% of total body magnesium, so supplementation with magnesium glycinate before bed is still recommended for its sleep and stress benefits.","low_causes":"Alcohol excess, poor diet, diuretics, diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ua","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"204","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5190","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and are also produced by the body. High levels can crystallise in joints causing gout and are associated with cardiovascular and kidney disease. Mishal's uric acid at 204 umol/L is within the optimal range for women.","low_causes":"Low purine diet, liver disease","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. It reflects both protein intake and kidney function. Mishal's urea at 6 mmol/L is within the optimal range.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3659","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, produced at a fairly constant rate and filtered out by the kidneys. It is used to estimate kidney function. Mishal's creatinine at 53 umol/L is within the laboratory range but on the lower side, which is common in smaller-framed women with lower muscle mass. The Cystatin C-based eGFR provides a more reliable assessment of her kidney function.","low_causes":"Low muscle mass, small body size","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","low ile cells that are too large can suggest B12 or folate deficiency. Mishal's MCV at 90.8 fL is within the optimal range, indicating normal-sized red blood cells.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12/folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin in each red blood cell. Mishal's MCH at 31.2 pg is within the optimal range, indicating each red blood cell is carrying an appropriate amount of oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12/folate deficiency, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"344","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures how concentrated haemoglobin is within red blood cells. Mishal's MCHC at 344 g/L is within the laboratory range but just above the optimal band, which at this margin is not clinically significant and likely reflects minor laboratory variation.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"224","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4282","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that help the blood clot. Too few can lead to excessive bleeding, while too many can increase clotting risk. Mishal's platelets at 224 are within the optimal range.","low_causes":"Viral infection, bone marrow disorders, medications, liver disease","high_causes":"Inflammation, infection, iron deficiency, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6833","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5778","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets are generally younger and more metabolically active. Mishal's MPV at 10.2 fL is marginally above the upper limit of 10.1. At this margin, this is effectively laboratory variation and has no clinical significance. A marginally elevated MPV can simply indicate active platelet production.","low_causes":"Bone marrow suppression, inflammatory conditions with platelet consumption","high_causes":"Active platelet production, immune thrombocytopenia, large platelet disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"3.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6111","units":"x10^9/L","description":"White blood cells are the immune system's frontline defence. A total count below the laboratory range of 4.0 is called leukopenia. In Mishal's case, her WBC of 3.7 is below range, driven primarily by her low neutrophil count. As discussed below, this is very likely benign ethnic neutropenia, a recognised and harmless finding in people of South Asian heritage. Her lymphocytes, monocytes, eosinophils, and basophils are all within range, and her inflammatory markers are excellent, which together argue strongly against any pathological cause.","low_causes":"Benign ethnic neutropenia, viral infection, bone marrow suppression, medications, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking, medications, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"1.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2360","lower_normal":"2","upper_normal":"7","lower_optimal":"2","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the body's first responders to bacterial infection. Mishal's neutrophils at 1.53 are below the laboratory lower limit of 2.0. In people of South Asian, African, and Middle Eastern heritage, a constitutionally lower neutrophil count is a well-recognised and entirely benign phenomenon called benign ethnic neutropenia. It does not indicate immune deficiency or increased infection risk. Her excellent CRP and ESR confirm no underlying inflammatory or infective process. This should be documented on her GP record so it is not unnecessarily re-investigated in future.","low_causes":"Benign ethnic neutropenia, viral infection, medications, autoimmune conditions, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4817","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including antibody production and recognising specific pathogens. Mishal's lymphocytes at 1.89 are within the optimal range.","low_causes":"Viral infection (late stage), HIV, immunosuppressive medications, stress","high_causes":"Viral infection (acute), chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells. They also play a role in chronic inflammation. Mishal's monocytes at 0.24 are within the laboratory range.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, inflammation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"F d marker that provides insight into the balance between innate and adaptive immune responses. It is used as a marker of systemic inflammation and physiological stress. Mishal's NLR at 0.81 is below the lower limit of 1.0, which is expected given her low neutrophil count from benign ethnic neutropenia. This does not reflect pathology; it simply reflects the lower neutrophil baseline typical of her ethnic background.","low_causes":"Benign ethnic neutropenia, low neutrophil count from any cause","high_causes":"Infection, inflammation, physiological stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"20.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3609","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3923","upper_optimal_position":"0.5189","units":"%","description":"Transferrin saturation indicates what percentage of the iron-carrying protein transferrin is currently loaded with iron. It reflects how much iron is available for the body to use at any given moment. Mishal's transferrin saturation at 20.7% is within the laboratory range but below the optimal band of 25 to 40%, suggesting that while she is not yet iron deficient, her iron availability is on the lower side.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4481","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5815","units":"umol/l","description":"Serum iron measures the amount of iron currently circulating in the blood, bound to transferrin. It fluctuates throughout the day and with recent meals. Mishal's serum iron at 17 umol/L is within the optimal range.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"3.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5282","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that transports iron through the blood to the bone marrow and other tissues. The body increases transferrin production when iron stores are low and decreases it when stores are adequate. Mishal's transferrin at 3.27 g/L is within the optimal range, sitting at the upper half which is consistent with her body maintaining adequate iron transport capacity despite her lower ferritin stores.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency (compensatory increase), pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"68.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5890","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.5525","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the total capacity of the blood to transport iron. When iron stores are low, the body increases its le was received in a plain bottle without boric acid preservative. Boric acid prevents bacterial multiplication after collection, so its absence means organisms present at collection can overgrow during transport, potentially turning a small contamination into what appears to be significant growth. Mishal has no reported urinary symptoms, her nitrite test was negative, and her urinary WBCs were borderline at 10. This combination, significant growth on culture but no symptoms, no nitrites, and borderline WBCs in a non-preserved sample, is most consistent with contamination or overgrowth rather than true urinary tract infection. The organism is sensitive to ciprofloxacin, gentamicin, ampicillin, meropenem, ceftriaxone, amikacin, amoxicillin/clavulanic acid, ertapenem, aztreonam, cefepime, ceftazidime, and piperacillin/tazobactam, with intermediate sensitivity to cefuroxime and temocillin. No antibiotic treatment is recommended in the absence of symptoms. If she develops urinary symptoms such as frequency, urgency, burning, or cloudy urine, she should see her GP promptly, bringing this culture result, as the sensitivity profile would guide antibiotic choice. If a repeat urine test is needed in future, it should be collected in a boric acid-preserved bottle for a more reliable result.","low_causes":"","high_causes":"Urinary tract infection, contamination, absence of boric acid preservative causing overgrowth","padding":"1","one_sided":"0.5","range_type":"normal"}]};

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function runIntro(){

  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';

  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
