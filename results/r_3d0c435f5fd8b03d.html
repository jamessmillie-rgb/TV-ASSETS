const REPORT_DATA = {"patient_name":"Chris Turner-Green","dob":"17/04/1978","report_date":"2026-08-21","summary":"Chris is a 48-year-old male presenting with a BMI of 34.2, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He trains twice per week with cardio only and no resistance training, averaging 5,000 to 7,500 daily steps. He consumes more than 7 alcoholic drinks per week. He reports brain fog, low mood and anxiety, and joint pain and stiffness. His goals are to lose body fat, prevent disease, and improve mood.\n\nThe finding that should be discussed with his GP first is the combination of early insulin resistance and pre-diabetes. His HbA1c, a measure of average blood sugar over the previous three months, has come back at 44 mmol/mol, which places him in the pre-diabetic range of 42 to 47. His fasting glucose at 5.3 is still within the normal range, but his fasting insulin at 9 mIU/L is above the optimal ceiling of 8, and when these two are combined into the HOMA-IR calculation, a measure of how effectively his cells respond to insulin, the result is 2.12 against an upper limit of 1.5. The lab flags anything above 1.9 as early insulin resistance, and Chris is above that threshold. At a BMI of 34.2 with limited physical activity and no resistance training, this pattern is not unexpected, but it is the single most important finding in the report because pre-diabetes is fully reversible at this stage and becomes significantly harder to reverse once HbA1c crosses 48.\n\nHis testosterone is 7.5 nmol/L, below the lower limit of 8.4 and well below the recommended level of 12. His sex hormone binding globulin, the protein that carries testosterone in the blood and determines how much is available for use, is also below range at 16.2 against a lower limit of 17.3. Low SHBG is strongly associated with insulin resistance, visceral fat, and metabolic syndrome, and it is likely that these findings share a common root cause: excess body fat driving insulin resistance, which in turn suppresses both SHBG production and testosterone output. This is directly relevant to his reported symptoms. Low testosterone is one of the most common drivers of brain fog, low mood, anxiety, reduced motivation, and joint stiffness in men of his age, and improving it through weight loss and resistance training could meaningfully change how he feels day to day. His free androgen index at 46.3 is within range because the low SHBG means a larger proportion of his already-low testosterone is unbound, but the total pool is still too small. This should be discussed with his GP. If testosterone remains below 8.4 after lifestyle changes over three to six months, further investigation or a referral to endocrinology may be appropriate.\n\nHis kidney markers require attention. Cystatin C, a protein filtered by the kidneys that provides a more reliable estimate of kidney function than creatinine alone, especially in people carrying extra weight, is 1.21 mg/L against an upper limit of 1.1, giving a Cystatin C-based eGFR of 74, which falls into the mildly reduced category. His creatinine-based eGFR is 81, which is also below the optimal threshold of 90. His urea is marginally elevated at 8.4 against a limit of 8.2. His sodium is 148, above the upper limit of 146, which could reflect mild dehydration at the time of blood draw, and his bicarbonate is 19.6, just below the lower limit of 20. These electrolyte findings are minor in isolation, but together with the Cystatin C result they suggest the kidneys are working harder than ideal. At 48 with a BMI of 34 and early insulin resistance, the most likely explanation is that metabolic load is placing extra demand on the kidneys. This should be discussed with his GP and monitored over time, because weight loss and improved insulin sensitivity are the interventions most likely to protect kidney function going forward.\n\nHis urine culture has returned significant growth of Citrobacter freundii, a gram-negative bacterium. However, the sample was received in a plain bottle without boric acid preservative, his white blood cells in the urine are less than 1, nitrites are negative, and he has reported no urinary symptoms. In the absence of boric acid, bacterial overgrowth in the sample container is common, and the combination of no white cells, no nitrites, and no symptoms strongly suggests this is a contaminant rather than a true infection. If he develops any urinary symptoms such as burning, frequency, urgency, or cloudy urine, the sample should be repeated in a boric acid container. The sensitivity panel has been recorded for reference.\n\nHis lipase is 67 U/L, above the upper limit of 60. Lipase is an enzyme produced by the pancreas to help digest fats. Mild elevations are common and are often associated with higher alcohol intake, higher BMI, or simply normal variation, and his amylase at 103 is within range. In the absence of abdominal pain, nausea, or other symptoms of pancreatitis, this is unlikely to be clinically significant but should be noted by his GP.\n\nHis vitamin B12 is 215 pg/mL, which is technically within the laboratory range of 193 to 982 but sits in the bottom 3 percent of that range and is well below the optimal floor of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism. At this level, it is a plausible contributor to his brain fog and low mood. His folate at 7 ng/mL is also below the optimal level of 8. B12 and folate work together in a process called methylation, which is critical for neurotransmitter production, and when both are suboptimal the effects on mood and cognitive clarity can be noticeable.\n\nHis hs-CRP, a marker of systemic inflammation, is 1.8 mg/L, which is within the laboratory range of under 5 but above the optimal threshold of 1.0. At his BMI, some background inflammation is expected because visceral fat produces inflammatory signalling molecules, but this level is worth tracking because chronic low-grade inflammation is associated with accelerated cardiovascular disease, joint pain, and insulin resistance. It may be contributing to his reported joint stiffness.\n\nTurning to the positives, and there are genuine reasons for reassurance. His liver is holding up well despite the alcohol intake. His GGT at 59 is within range, his ALT at 42 is within range, AST at 32 is comfortably placed, bilirubin is clean, and his FIB-4 score at 1.03 shows no sign of liver fibrosis. The GGT is not low, and at more than 7 drinks per week that marker is the first to respond to alcohol load, so it is worth monitoring, but for now the liver is coping. His lipid profile is surprisingly good for his BMI and metabolic picture. Total cholesterol at 4.4, LDL at 2.37, ApoB at 0.89 just under the 0.9 threshold, and a TG/HDL ratio of 1.12 are all respectable. His ApoB to ApoA1 ratio at 0.63 is below the 0.7 lower-risk threshold, which is genuinely encouraging. His HDL at 1.4 is at the boundary, not quite reaching the optimal male level of above 1.4 when interpreted strictly, but far better than the low HDL often seen at this BMI. His thyroid is functioning well. TSH at 2.84 is within the optimal range, free T4 at 19.2 and free T3 at 5.5 are both in excellent positions within their respective optimal bands, and both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His full blood count is healthy, with haemoglobin at 152, red cells at 4.94, and a clean white cell differential. His iron studies are well balanced, with ferritin at 156, transferrin saturation at 28 percent, and no sign of deficiency or overload. His prostate markers are reassuring, with PSA at 1.4 and a free PSA ratio of 24.3 percent, both comfortably within normal limits. His tumour markers CA 19-9 and CEA are both well within range. His cortisol at 369 is appropriate for a morning sample. His calcium, corrected calcium, magnesium, and PTH are all within healthy ranges. His creatine kinase at 154 is mid-range and unremarkable. His vitamin D at 82 nmol/L is in the sufficient range and within the optimal band of 75 to 120, which is a solid result. His total antioxidant activity at 1.55 is healthy. His immunoglobulins are all within range, rheumatoid factor is negative, and coeliac screening is negative.\n\nHis MCHC at 346 is one point above the upper limit of 345. At this margin, this is almost certainly laboratory variation, particularly as the lab notes that MCHC can be affected by temperature and storage. It is not a clinical concern. His triglycerides at 1.57 are within the acceptable fasting range of under 1.7 but above the optimal level of under 1.0, and they may respond well to reducing alcohol and refined carbohydrate intake. His uric acid at 422 is within the laboratory range but above the optimal ceiling of 380. Elevated uric acid is associated with insulin resistance, higher BMI, and alcohol intake, and it is relevant to his joint stiffness because uric acid crystals can deposit in joints. This is another marker that should improve with weight loss and reduced alcohol intake.","links":"The most impactful change Chris can make is to lose body fat, and the good news is that every major finding in this report, the pre-diabetes, the insulin resistance, the low testosterone, the kidney strain, the joint stiffness, the low mood, and the mildly elevated inflammation, is expected to improve with sustained fat loss. A realistic and sustainable target is to lose 15 to 20 kg over the next 12 to 18 months, bringing his weight from 103 kg towards 83 to 88 kg and his BMI from 34.2 towards 27 to 29. His estimated maintenance calories at his current weight and activity level are approximately 2,500 to 2,600 kcal per day. A deficit of 500 kcal per day, targeting 2,000 to 2,100 kcal, will produce steady fat loss of around 0.5 kg per week without the metabolic disruption that comes with aggressive dieting. His protein intake should be at least 135 to 165 grams per day, which is 1.3 to 1.6 grams per kilogram of body weight. Protein is the single most important macronutrient for preserving muscle during fat loss, for improving insulin sensitivity, and for supporting testosterone production.\n\nAdding resistance training is the second most important change. Chris currently does two sessions of cardio per week and no resistance training. Resistance training is the most effective intervention for improving insulin sensitivity, raising testosterone, protecting muscle mass during weight loss, strengthening joints, and improving mood. He should aim to introduce two to three sessions per week, starting with compound movements such as squats, deadlifts, rows, and presses, ideally with guidance from a coach or personal trainer to ensure good form and reduce the risk of aggravating his joint stiffness. His step count of 5,000 to 7,500 is reasonable but could be improved to 7,500 to 10,000 to increase daily energy expenditure without adding stress to recovery.\n\nAlcohol should be reduced. At more than 7 drinks per week, alcohol is contributing to his triglyceride level, may be contributing to the lipase elevation, is adding empty calories that make fat loss harder, and is a known suppressor of testosterone production. A target of under 7 drinks per week, ideally under 4, would remove a significant obstacle to his goals. Even modest reductions are beneficial.\n\nHis GP should be made aware of the following findings and the specific numbers to bring to the appointment. First, HbA1c at 44 mmol/mol with HOMA-IR at 2.12, indicating pre-diabetes with early insulin resistance. The GP may wish to repeat this in three to six months to track response to lifestyle changes. Second, testosterone at 7.5 nmol/L with SHBG at 16.2, both below range. If lifestyle changes over three to six months do not improve testosterone, further investigation including a morning testosterone, LH, FSH, and prolactin panel would be appropriate. Third, Cystatin C at 1.21 with Cystatin C eGFR at 74, suggesting mildly reduced kidney function. The GP may wish to check an albumin to creatinine ratio on a urine sample and repeat Cystatin C in six months. Fourth, the urine culture growing Citrobacter freundii, noting the plain bottle caveat and absence of symptoms, for their records in case urinary symptoms develop.\n\nFor his brain fog and low mood, the combination of low testosterone, suboptimal B12, suboptimal folate, early insulin resistance, and chronic low-grade inflammation provides multiple plausible explanations. Addressing these through supplementation, diet, and exercise is likely to produce a noticeable improvement. For his joint pain and stiffness, the mildly elevated uric acid, the background inflammation, and the low testosterone are all potential contributors. Weight loss will reduce the mechanical load on joints, reduce uric acid levels, and reduce systemic inflammation simultaneously.\n\nA retest is recommended in four to six months, focusing on HbA1c, fasting glucose, fasting insulin, HOMA-IR, Cystatin C, Cystatin C eGFR, testosterone, SHBG, hs-CRP, GGT, lipase, vitamin B12, folate, and a lipid panel including ApoB. This will show whether the lifestyle changes are translating into measurable improvement.","flags":"PRE-DIABETES AND INSULIN RESISTANCE: HbA1c 44 mmol/mol (pre-diabetic range 42-47, diabetic above 48). HOMA-IR 2.12 (upper limit 1.5, lab flags above 1.9 as early insulin resistance). Fasting insulin 9 mIU/L (within lab range but above optimal ceiling of 8). Fasting glucose 5.3 mmol/L is still within range. Pattern is consistent with early metabolic syndrome at BMI 34.2. Reversible with weight loss and lifestyle modification.\n\nTESTOSTERONE AND SHBG: Testosterone 7.5 nmol/L (below lower limit 8.4, lab recommends above 12). SHBG 16.2 nmol/L (below lower limit 17.3). Low SHBG is characteristic of insulin resistance and visceral adiposity. Free androgen index 46.3 is within range due to low SHBG. If testosterone does not improve with weight loss and resistance training over three to six months, further endocrine investigation is warranted.\n\nKIDNEY FUNCTION: Cystatin C 1.21 mg/L (above upper limit 1.1). Cystatin C eGFR 74 (mildly reduced, below optimal 90). Creatinine-based eGFR 81. Urea 8.4 mmol/L (marginally above upper limit 8.2). Sodium 148 mmol/L (above upper limit 146, likely mild dehydration). Bicarbonate 19.6 mmol/L (marginally below lower limit 20). Cystatin C is more reliable than creatinine at elevated BMI. Consider albumin-creatinine ratio and repeat Cystatin C in six months.\n\nURINE CULTURE: Significant growth of Citrobacter freundii. Plain bottle without boric acid. WBC less than 1, nitrites negative, no reported urinary symptoms. Most likely contaminant due to absence of preservative. Sensitivities recorded. Repeat in boric acid bottle if urinary symptoms develop.\n\nLIPASE: 67 U/L (above upper limit 60). Amylase 103 within range. No abdominal symptoms reported. Mild elevation, likely related to BMI and alcohol intake. Monitor.\n\nVITAMIN B12: 215 pg/mL (within lab range 193-982 but well below optimal 500). Supplement and recheck.\n\nFOLATE: 7 ng/mL (within lab range but below optimal 8).\n\nMCHC: 346 g/L (marginally above upper limit 345). Likely laboratory variation.\n\nReassuring negatives: Liver function intact with FIB-4 1.03 and no fibrosis signal. Lipid profile favourable with ApoB 0.89, LDL 2.37, ApoB/A1 ratio 0.63. Thyroid function normal with negative antibodies. PSA 1.4 with free ratio 24.3 percent. Tumour markers CA 19-9 and CEA within range. Rheumatoid factor negative. Coeliac screen negative. Immunoglobulins within range. Full blood count normal. Iron studies balanced. Vitamin D sufficient at 82. Calcium, magnesium, and PTH normal.","recommendations":"1. Reduce calorie intake to 2,000 to 2,100 kcal per day with a protein floor of 135 to 165 grams per day. Target weight loss of 15 to 20 kg over 12 to 18 months.\n\n2. Begin resistance training two to three times per week, focusing on compound movements. This is the most effective intervention for insulin sensitivity, testosterone, joint health, and mood.\n\n3. Increase daily steps to 7,500 to 10,000.\n\n4. Reduce alcohol to under 7 drinks per week, ideally under 4. This will support fat loss, lower triglycerides, protect the liver, support testosterone production, and may resolve the lipase elevation.\n\n5. Book a GP appointment to discuss HbA1c 44, HOMA-IR 2.12, testosterone 7.5, SHBG 16.2, Cystatin C 1.21, and Cystatin C eGFR 74.\n\n6. Begin sublingual methylcobalamin 1,000 mcg daily for B12.\n\n7. Begin methylfolate 400 mcg daily for folate.\n\n8. Continue maintaining vitamin D levels with 2,000 IU cholecalciferol daily with a fat-containing meal, paired with vitamin K2 MK-7 100 mcg.\n\n9. Begin omega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily to support inflammation, triglycerides, and mood.\n\n10. Prioritise sleep quality: fixed wake time, daylight exposure within an hour of waking, no caffeine after 1pm, cool bedroom. Poor sleep worsens insulin resistance, suppresses testosterone, and increases appetite.\n\n11. Increase soluble fibre intake through oats, beans, lentils, and flaxseed. Soluble fibre improves insulin sensitivity, lowers triglycerides, and supports gut health.\n\n12. Retest in four to six months: HbA1c, fasting glucose, fasting insulin, HOMA-IR, Cystatin C, Cystatin C eGFR, testosterone, SHBG, hs-CRP, GGT, lipase, B12, folate, and lipid panel.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. His B12 at 215 is near the floor of the laboratory range and well below the optimal level of 500. B12 is essential for nerve function, energy production, and neurotransmitter synthesis, and improving it may help with his brain fog and low mood. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets.\n\nMethylfolate: 400 mcg daily, taken alongside B12. His folate at 7 is below the optimal level of 8, and folate works in tandem with B12 in the methylation cycle that produces serotonin and dopamine. Methylfolate is the bioactive form and is preferred over folic acid.\n\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with a meal containing fat. His vitamin D at 82 is within the optimal range of 75 to 120 and this dose is to maintain that level. At his BMI, fat tissue sequesters vitamin D, so consistent daily supplementation is important to prevent a decline.\n\nVitamin K2: MK-7 form, 100 mcg daily, taken with vitamin D. K2 directs calcium into bones and teeth rather than arteries and soft tissue, and should always accompany vitamin D supplementation.\n\nOmega-3 fish oil: a supplement providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This will support the reduction of his triglycerides from 1.57 towards the optimal level of under 1.0, help lower his hs-CRP from 1.8 towards the optimal level of under 1.0, and EPA in particular has good evidence for supporting mood and reducing the inflammation that contributes to joint stiffness.\n\nMagnesium glycinate: 300 mg before bed. His serum magnesium at 0.91 is within the optimal range, but magnesium glycinate supports sleep quality, reduces muscle tension, improves insulin sensitivity, and may help with his joint stiffness. The glycinate form is well absorbed and has a calming effect that supports sleep.\n\nHe should not take iron supplements. His ferritin at 156, transferrin saturation at 28 percent, and iron at 17.2 are all well balanced, and supplementing iron when stores are adequate can cause harm.\n\nThe most important changes from this report are not supplements. They are losing 15 to 20 kg through a sustained calorie deficit, starting resistance training two to three times per week, reducing alcohol to under 4 drinks per week, and discussing the pre-diabetes, testosterone, and kidney findings with his GP.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.375","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"Alanine aminotransferase (ALT) is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Chris's ALT at 42 is within the laboratory range of under 56 but above the optimal male threshold of 30. At his BMI and with regular alcohol intake, some elevation above optimal is expected as the liver handles a greater metabolic workload. This is not in the danger zone, but bringing ALT below 30 through weight loss and reduced alcohol would indicate the liver is under less strain.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, alcohol, medications, obesity, viral hepatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208333333","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/l","description":"Aspartate aminotransferase (AST) is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. Chris's AST at 32 is comfortably within the normal range and within the optimal band, indicating no significant tissue damage. AST is less liver-specific than ALT because it is also released during exercise and muscle turnover.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4041","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"Gamma-glutamyl transferase (GGT) is a liver enzyme that is particularly sensitive to alcohol intake and biliary stress. Chris's GGT at 59 is within the laboratory range of 4 to 73 but well above the optimal level of under 25. GGT is the liver marker most responsive to alcohol, and at more than 7 drinks per week this elevation is expected. The liver is coping, but this marker is showing that it is working hard to do so. Reducing alcohol intake is the single most effective way to bring GGT down, and this marker responds quickly, often within weeks of reduction.","low_causes":"","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4809523810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5904761905","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, and bile ducts. It rises in conditions affecting these tissues. Chris's ALP at 73 is comfortably within range and within the optimal band, indicating healthy bile flow and bone turnover.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750000000","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833333333","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. Elevated bilirubin can indicate liver disease or excessive red cell breakdown, while a clean result like Chris's 7 confirms the liver is processing waste products efficiently.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800000000","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3453333333","upper_optimal_position":"0.6133333333","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform critical functions including maintaining fluid balance, transporting hormones and nutrients, and supporting immune function. Chris's total protein at 69 is within the optimal range, confirming adequate protein synthesis by the liver.","low_causes":"Liver disease, malnutrition, kidney disease","high_causes":"Chronic inflammation, infection, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208333333","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.6250000000","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and drugs, and serves as a marker of nutritional status and liver synthetic function. Chris's albumin at 43 is within the optimal range, confirming the liver is producing protein effectively.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4814814815","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703703704","upper_optimal_position":"0.5925925926","units":"g/l","description":"Globulin represents the sum of immune proteins (immunoglobulins) and transport proteins in the blood. It reflects immune system activity and liver function. Chris's globulin at 26 is within the optimal range.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4642857143","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571428571","upper_optimal_position":"0.5952380952","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood. A healthy ratio indicates balanced protein production and no excessive immune activation. Chris's ratio at 1.65 is within the optimal range.","low_causes":"Liver disease, autoimmune conditions, kidney disease","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3552","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. A score below 1.3 in people under 65 suggests a low probability of significant fibrosis. Chris's score at 1.03 is reassuring and indicates no sign of liver scarring despite his alcohol intake.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"103","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5853","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712121212","upper_optimal_position":"0.5984848485","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starch into sugars. Elevated amylase can indicate pancreatic inflammation, though mild fluctuations are common. Chris's amylase at 103 is within the laboratory range and not a concern.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7159","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5595744681","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is a more specific marker of pancreatic health than amylase. Chris's lipase at 67 is above the upper limit of 60. Mild lipase elevations are common and can be related to higher alcohol intake, higher BMI, or normal variation. Significant pancreatitis typically produces lipase three times the upper limit or more. With amylase within range and no abdominal symptoms, this is a minor finding but should be noted by his GP and monitored.","low_causes":"","high_causes":"Pancreatitis, alcohol, gallstones, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4247","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL, and VLDL. On its own it provides limited information, but in combination with HDL, LDL, and ApoB it helps build a complete picture of cardiovascular risk. Chris's total cholesterol at 4.4 is within the desirable range of under 5.18.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet, obesity, hypothyroidism, genetics, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3948","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"Low-density lipoprotein (LDL) cholesterol is often called 'bad cholesterol' because when present in excess it deposits in artery walls and drives atherosclerosis. Chris's LDL at 2.37 is within range and within the optimal band of under 2.6, which is a genuinely positive finding at his BMI.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, obesity, genetics, hypothyroidism, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"1.55","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.8462","upper_optimal_position":"1","units":"mmol/l","description":"High-density lipoprotein (HDL) cholesterol is the 'good cholesterol' that removes excess cholesterol from the arteries and returns it to the liver for disposal. Higher levels are protective against cardiovascular disease. Chris's HDL at 1.4 is above the minimum desirable level of 1.04 but just at the optimal male threshold of 1.4, so is classified as in range but not quite optimal. Increasing exercise, particularly resistance training, and reducing alcohol and refined carbohydrates can help push HDL higher.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, derived from dietary fat and from the liver converting excess calories, alcohol, and sugar into storage form. Chris's triglycerides at 1.57 are within the fasting acceptable range of under 1.7 but above the optimal level of under 1.0. Elevated triglycerides are closely linked to insulin resistance, excess calorie intake, and alcohol consumption, all of which are relevant factors for Chris. Reducing alcohol, refined carbohydrates, and overall calorie intake, along with increasing omega-3 fatty acids, should bring this number down.","low_causes":"Low fat diet, hyperthyroidism, malnutrition","high_causes":"Excess calories, alcohol, refined carbohydrates, insulin resistance, obesity, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4551","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"Very low-density lipoprotein (VLDL) cholesterol carries triglycerides from the liver to tissues. It is a precursor to LDL. Chris's VLDL at 0.71 is within the laboratory range but above the optimal ceiling of 0.6, reflecting the mildly elevated triglycerides.","low_causes":"Low fat diet","high_causes":"Excess calories, alcohol, insulin resistance, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3489","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a simple measure of cardiovascular risk by comparing the total amount of cholesterol to the protective HDL fraction. A lower ratio is better. Chris's ratio at 3.14 is within the desirable range of under 4.5 and within the optimal band of under 4, which is a positive result.","low_causes":"","high_causes":"Low HDL, high total cholesterol, obesity, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"20","upper_normal":"60","lower_optimal":"28","upper_optimal":"60","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol reflects the proportion of protective cholesterol in the blood. A higher percentage is desirable. Chris's 31.82 percent is above the minimum of 20 and within the optimal range, indicating a favourable balance between good and total cholesterol.","low_causes":"Obesity, sedentary lifestyle, insulin resistance","high_causes":"Exercise, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic (artery-clogging) cholesterol fractions in a single number, including LDL, VLDL, and remnant cholesterol. Chris's non-HDL at 3.0 is within the desirable range of under 4 and within the optimal band.","low_causes":"","high_causes":"Diet, obesity, insulin resistance, genetics, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein of HDL particles. Higher levels are associated with better cardiovascular protection. Chris's ApoA1 at 1.42 is above the minimum of 1.2 and just within the optimal band of above 1.4.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein embedded in every LDL, VLDL, and remnant cholesterol particle. Because each atherogenic particle carries exactly one ApoB molecule, this marker effectively counts the total number of particles capable of entering artery walls. It is considered a better predictor of cardiovascular risk than LDL cholesterol alone. Chris's ApoB at 0.89 is just under the desirable threshold of 0.9 but above the optimal level of under 0.8. This is a borderline result and worth improving through dietary changes, weight loss, and omega-3 supplementation.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, obesity, genetics, insulin resistance, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (harmful) particles to protective HDL particles. It is one of the strongest predictors of cardiovascular risk. A ratio below 0.7 is considered lower risk. Chris's ratio at 0.63 is within the lower-risk range, which is genuinely encouraging and suggests his overall cardiovascular particle balance is favourable.","low_causes":"","high_causes":"High LDL particle count, low HDL, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3938","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent driver of cardiovascular disease. Chris's remnant cholesterol at 0.63 is within the laboratory range of under 0.8 but above the optimal level of under 0.5, consistent with his mildly elevated triglycerides.","low_causes":"","high_causes":"Elevated triglycerides, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a simple but powerful proxy for insulin resistance and cardiovascular risk. A lower ratio indicates better metabolic health. Chris's ratio at 1.12 is within the laboratory range of under 1.5 but above the optimal level of under 0.87, consistent with his insulin resistance pattern. This ratio should improve with weight loss, reduced alcohol and refined carbohydrate intake, and increased physical activity.","low_causes":"","high_causes":"Insulin resistance, excess carbohydrates, alcohol, obesity, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533333333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000000000","upper_optimal_position":"0.5866666667","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body is managing blood sugar at rest. Chris's glucose at 5.3 is within the normal range and within the optimal band of 4.0 to 5.4. While the glucose is well controlled, the HbA1c and HOMA-IR tell a more nuanced story about his longer-term blood sugar regulation.","low_causes":"Fasting, insulin excess, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c (glycated haemoglobin) measures the percentage of red blood cells that have been coated with sugar over the previous two to three months. It provides a more reliable picture of blood sugar control than a single fasting glucose reading. Chris's HbA1c at 6.2 percent falls in the pre-diabetic range of 6.0 to 6.4. This means his average blood sugar over the past three months has been higher than it should be, even though his fasting glucose on the day of the test was within range. This is the marker that, combined with his HOMA-IR, confirms early insulin resistance and pre-diabetes.","low_causes":"Recent blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, diabetes, excess calorie intake, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5238","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units (mmol/mol) rather than percentage. Chris's result of 44 mmol/mol is above the normal upper limit of 42 and within the pre-diabetic range of 42 to 47. The optimal level is below 36 mmol/mol. A result of 48 or above would indicate diabetes. At 44, Chris is in the early pre-diabetic range, which is the ideal time to intervene because the condition is fully reversible with lifestyle changes at this stage.","low_causes":"Recent blood loss, haemolytic anaemia","high_causes":"Insulin resistance, pre-diabetes, diabetes, excess calorie intake, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4484","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3153333333","upper_optimal_position":"0.4484304933","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. Higher levels suggest the body's cells are becoming resistant to insulin's effects, forcing the pancreas to produce more. Chris's insulin at 9 is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8 mIU/L. In the context of his HbA1c and HOMA-IR, this confirms that the pancreas is working harder than it should need to, which is a hallmark of insulin resistance.","low_causes":"Type 1 diabetes, low carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, pre-diabetes, obesity, excess carbohydrate intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4825757576","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5757575758","units":"ug/l","description":"C-peptide is released in equal amounts to insulin when the pancreas produces it, and is a more stable measure of pancreatic insulin production because it is not cleared as quickly by the liver. Chris's C-peptide at 2.08 ug/L (equivalent to approximately 688 pmol/L) is within the normal and optimal range, confirming that the pancreas is producing insulin appropriately. The issue is not insufficient production but rather the body's reduced response to the insulin being made.","low_causes":"Type 1 diabetes, insulinoma treatment","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7067","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated score that combines fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 indicates optimal insulin sensitivity. Chris's HOMA-IR at 2.12 is above the upper limit of 1.5 and above the 1.9 threshold that the lab flags as early insulin resistance. This is the clearest single marker in the report confirming that his cells are not responding efficiently to insulin, which is driving his pre-diabetic HbA1c. Weight loss and resistance training are the most effective interventions.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, obesity, sedentary lifestyle, excess calorie intake, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates the functional capacity of the insulin-producing beta cells in the pancreas. It is calculated as (20 x Insulin) / (Glucose - 3.5). Chris's HOMA-B at 100 is within the healthy range of 80 to 200, indicating that the pancreas is still producing insulin adequately. The problem is not beta-cell failure but insulin resistance in the target tissues.","low_causes":"Beta-cell dysfunction, progression towards type 2 diabetes, pancreatic disease","high_causes":"Compensatory hyperinsulinism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.18","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) measures low levels of systemic inflammation in the body. It is produced by the liver in response to inflammatory signals. Chris's hs-CRP at 1.8 is within the laboratory range of under 5 but above the optimal level of under 1.0. Levels between 1.0 and 3.0 are associated with moderate cardiovascular risk. At his BMI, visceral fat is the most likely source of this background inflammation, as fat tissue produces inflammatory signalling molecules called cytokines. This may also be contributing to his joint stiffness. Weight loss is the most effective way to reduce hs-CRP.","low_causes":"","high_causes":"Obesity, visceral fat, infection, chronic inflammatory conditions, smoking, poor sleep","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle in a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. Chris's ESR at 8 is within the normal range of under 12 and within the optimal band, indicating no significant systemic inflammatory process.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, cancer, anaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"148","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8205128205","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564102564","upper_optimal_position":"0.6179487179","units":"mmol/l","description":"Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve function. Chris's sodium at 148 is above the upper limit of 146, which most commonly reflects mild dehydration at the time of blood draw. If he was not well hydrated on the morning of the test, this can easily push sodium above range. However, in the context of his kidney findings, it is worth noting. If sodium remains elevated on repeat testing, further investigation would be appropriate.","low_causes":"Excess fluid intake, diuretics, kidney disease, heart failure, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.6111111111","units":"mmol/l","description":"Potassium is an essential electrolyte for heart rhythm, muscle contraction, and nerve signalling. Chris's potassium at 4.4 is in the middle of the optimal range, which is reassuring.","low_causes":"Diuretics, vomiting, diarrhoea, poor dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium supplements, haemolysed sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4871794872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564102564","upper_optimal_position":"0.6179487179","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. Chris's chloride at 102 is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2969696970","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939393939","upper_optimal_position":"0.5757575758","units":"mmol/l","description":"Bicarbonate is the body's primary buffer against acid. It helps maintain the blood's pH within a very narrow range. Chris's bicarbonate at 19.6 is marginally below the lower limit of 20. This is a very small deviation and could reflect mild metabolic acidosis, which can be associated with early kidney changes or simply with the mild dehydration suggested by his elevated sodium. In isolation, this is not alarming but adds context to the kidney picture.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, dehydration","high_causes":"Vomiting, metabolic alkalosis, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"30.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9500","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833333333","units":"mmol/l","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate). It helps identify the cause of metabolic acidosis by detecting unmeasured anions in the blood. Chris's calculated anion gap is 30.8, which is above the upper limit of 16. However, this result should be interpreted with caution. His sodium is mildly elevated at 148, likely due to dehydration, and his bicarbonate is marginally low at 19.6, both of which inflate the anion gap. It is possible that his elevated sodium on a dehydrated sample is the main driver of this calculated result. This should be noted by his GP and rechecked on a well-hydrated sample. If the anion gap normalises when sodium returns to range, it confirms dehydration as the explanation.","low_causes":"Laboratory error, hypoalbuminaemia","high_causes":"Metabolic acidosis, lactic acidosis, ketoacidosis, renal failure, toxic ingestion, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5380116959","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3543859649","upper_optimal_position":"0.6093567251","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling, and blood clotting. Chris's serum calcium at 2.43 is within the optimal range, indicating healthy calcium metabolism.","low_causes":"Vitamin D deficiency, parathyroid disease, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083333333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6250000000","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement to account for albumin levels, providing a more accurate reflection of the physiologically active calcium in the blood. Chris's corrected calcium at 2.41 is within the optimal range.","low_causes":"Vitamin D deficiency, parathyroid disease, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517241379","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172413793","upper_optimal_position":"0.6293103448","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar regulation, and sleep. Chris's magnesium at 0.91 is within the optimal range of 0.85 to 1.05. This is a positive finding, particularly given the importance of magnesium for insulin sensitivity.","low_causes":"Alcohol, poor diet, diabetes, diuretics, gut malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"422","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5380733945","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3027522936","upper_optimal_position":"0.5779816514","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and are produced by the body. The kidneys filter uric acid from the blood. Chris's uric acid at 422 is within the laboratory range of 220 to 547 but above the optimal male ceiling of 380. Elevated uric acid is strongly associated with insulin resistance, higher BMI, and alcohol intake, all three of which apply here. When uric acid rises above optimal, it can deposit as crystals in joints, contributing to pain and stiffness, which is relevant to Chris's reported symptoms. It also has emerging links to kidney damage and cardiovascular risk. Weight loss and reducing alcohol and purine-rich foods (organ meats, shellfish, beer) should help bring this down.","low_causes":"Low purine diet, certain medications","high_causes":"Obesity, insulin resistance, alcohol, kidney disease, high purine diet, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4648","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472266667","upper_optimal_position":"0.6138933333","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the parathyroid glands in the neck and regulates calcium levels in the blood by controlling calcium release from bones, absorption in the gut, and retention by the kidneys. Chris's PTH at 2.6 is within the optimal range, confirming normal parathyroid function and healthy calcium regulation.","low_causes":"Hypoparathyroidism, excess calcium, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7066666667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533333333","upper_optimal_position":"0.5866666667","units":"mmol/l","description":"Urea is a waste product from protein metabolism, produced by the liver and excreted by the kidneys. Rising urea can indicate reduced kidney clearance, dehydration, or high protein intake. Chris's urea at 8.4 is marginally above the upper limit of 8.2. In the context of his elevated sodium (suggesting dehydration) and elevated Cystatin C, this is consistent with the kidneys working harder than ideal. Adequate hydration and weight loss to reduce metabolic burden on the kidneys are the key interventions.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, kidney disease, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5384615385","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3461538462","upper_optimal_position":"0.6282051282","units":"umol/l","description":"Creatinine is a waste product produced by muscles and filtered by the kidneys. It is used to estimate kidney function. Chris's creatinine at 95 is within the normal and optimal range. However, creatinine can be influenced by muscle mass, and at a BMI of 34.2 with no resistance training, the Cystatin C-based eGFR provides a more accurate picture of kidney function.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.675","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) uses creatinine to estimate how well the kidneys are filtering waste from the blood. An eGFR above 90 is considered normal, 60 to 89 is mildly reduced, and below 60 indicates chronic kidney disease. Chris's creatinine-based eGFR at 81 is mildly reduced. While this is above the 60 threshold for concern, it is below the ideal of 90, and the Cystatin C-based eGFR at 74 suggests the creatinine-based estimate may actually be slightly optimistic.","low_causes":"Kidney disease, dehydration, diabetes, hypertension, obesity","high_causes":"Low muscle mass, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.55","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells in the body and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet, or body composition, making it a more reliable marker of kidney function, especially in people with higher or lower than average muscle mass. Chris's Cystatin C at 1.21 is above the upper limit of 1.1, and the resulting Cystatin C eGFR of 74 indicates mildly reduced kidney function. At his BMI, with insulin resistance and elevated uric acid, the kidneys are under increased metabolic demand. Weight loss, improved blood sugar control, and adequate hydration are the most important protective measures.","low_causes":"","high_causes":"Reduced kidney function, obesity, diabetes, hypertension, inflammation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR uses Cystatin C instead of creatinine to estimate kidney filtration rate. It is considered more accurate, particularly in individuals whose muscle mass may affect creatinine levels. Chris's Cystatin C eGFR at 74 is above the 60 threshold for chronic kidney disease but below the ideal of 90. This is the more reliable of his two eGFR results and should be the one discussed with his GP.","low_causes":"Kidney disease, diabetes, hypertension, obesity","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"152","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5166666667","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.6250000000","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Chris's haemoglobin at 152 is w
