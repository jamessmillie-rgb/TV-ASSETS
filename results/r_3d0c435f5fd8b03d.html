o his reported brain fog, low mood, anxiety, and joint stiffness. Weight loss and resistance training are the first-line interventions and can significantly raise testosterone levels. If testosterone remains below range after sustained lifestyle changes, his GP should investigate further.","low_causes":"Obesity, insulin resistance, ageing, chronic stress, sleep deprivation, alcohol, pituitary dysfunction","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"16.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3107216495","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3821649485","upper_optimal_position":"0.5776288660","units":"nmol/l","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds to testosterone, oestradiol, and other sex hormones, controlling how much is available for the body to use. Chris's SHBG at 16.2 is below the lower limit of 17.3 and well below the optimal floor of 25. Low SHBG is one of the most reliable biochemical markers of insulin resistance and metabolic syndrome. The liver produces less SHBG when insulin levels are chronically elevated, and this directly connects to his HOMA-IR of 2.12. Low SHBG means a greater proportion of his already-low testosterone is unbound, which is why his free androgen index is still within range despite the low total testosterone.","low_causes":"Insulin resistance, obesity, type 2 diabetes, hypothyroidism, PCOS (women)","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen, anorexia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"46.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4694444444","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472222222","upper_optimal_position":"0.5277777778","units":"","description":"The free androgen index (FAI) estimates the proportion of testosterone that is biologically active by dividing total testosterone by SHBG. Chris's FAI at 46.3 is within the normal and optimal range, but this is being driven by his very low SHBG rather than by adequate testosterone. When SHBG is suppressed, the FAI can appear falsely reassuring because a greater fraction of a small total is unbound. The total testosterone at 7.5 remains the more important clinical finding.","low_causes":"Hypogonadism, high SHBG, ageing","high_causes":"Low SHBG, insulin resistance, PCOS (women), anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.203","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4740","lower_normal":"0.1","upper_normal":"0.42","lower_optimal":"0.225","upper_optimal":"0.42","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4305555556","upper_optimal_position":"0.6666666667","units":"nmol/l","description":"Free testosterone is the portion of testosterone not bound to proteins and therefore available to enter cells and exert its effects. Chris's calculated free testosterone at 0.203 nmol/L is within the laboratory range but below the optimal floor of 0.225. As with the FAI, the low SHBG means a larger proportion is unbound, but the total pool is insufficient. Improving total testosterone through weight loss and resistance training will raise free testosterone as well.","low_causes":"Low total testosterone, high SHBG, obesity, ageing","high_causes":"High total testosterone, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2021","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men as well as women, produced mainly by the aromatase enzyme converting testosterone in fat tissue. In men, it plays a role in bone health, brain function, and libido. Chris's oestradiol at 59 is within range. At a higher BMI, aromatase activity is typically increased, which can convert testosterone to oestradiol and contribute to low testosterone. His oestradiol is not elevated, which is reassuring.","low_causes":"Low body fat, aromatase inhibitors, hypogonadism","high_causes":"Obesity (increased aromatase), liver disease, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4906020067","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in mood regulation and serves as a precursor to other hormones. Chris's progesterone at 1.36 is within the normal range.","low_causes":"Adrenal insufficiency","high_causes":"Adrenal hyperplasia, congenital adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4263461538","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974358974","upper_optimal_position":"0.6038461538","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the testes to produce testosterone. Chris's LH at 3.01 is within range. In the context of his low testosterone, a normal LH suggests the pituitary is not yet responding to the low testosterone by increasing its signal. This is typical of testosterone suppression driven by obesity and insulin resistance rather than primary testicular failure, and it means the system should respond to weight loss.","low_causes":"Pituitary dysfunction, obesity, medications, chronic illness","high_causes":"Primary hypogonadism (testicular failure), menopause (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"FSH","group":"HORMONES","result":"3.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4437349398","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693975904","upper_optimal_position":"0.5180722892","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) in men stimulates sperm production in the testes. Chris's FSH at 3.34 is within the optimal range, confirming normal pituitary signalling to the testes.","low_causes":"Pituitary dysfunction, obesity, anabolic steroids","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4636363636","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939393939","upper_optimal_position":"0.6060606061","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone and libido. Chris's prolactin at 144 is within the optimal range, ruling out prolactin excess as a cause of his low testosterone.","low_causes":"Dopamine agonists","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"369","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4720","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718631179","upper_optimal_position":"0.5830614948","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning cortisol should be at its peak as part of the normal circadian rhythm. Chris's cortisol at 369 is within the optimal morning range, indicating healthy adrenal function and a normal stress response.","low_causes":"Adrenal insufficiency, pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, medications (prednisolone)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4745360825","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860824742","upper_optimal_position":"0.5597938144","units":"umol/L","description":"DHEA sulphate (DHEA-S) is produced by the adrenal glands and serves as a precursor to both testosterone and oestradiol. It declines naturally with age. Chris's DHEA-S at 5.8 umol/L (equivalent to approximately 2,137 ug/dL) is within the optimal range for his age, indicating healthy adrenal function.","low_causes":"Adrenal insufficiency, ageing, chronic illness","high_causes":"Adrenal tumours, PCOS (women), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625000000","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000000000","upper_optimal_position":"0.5601190476","units":"pmol/l","description":"Free thyroxine (FT4) is the main hormone produced by the thyroid gland. It is converted into the more active T3 in tissues throughout the body. Chris's FT4 at 19.2 is within the optimal range of 14 to 20, indicating the thyroid is producing an excellent amount of hormone.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5136792453","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3700471698","upper_optimal_position":"0.4924528302","units":"mIU/l","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland and tells the thyroid how much hormone to produce. A higher TSH means the pituitary is pushing the  thyroid disease, most commonly Hashimoto's thyroiditis. Chris's TPO antibodies are below 6.6, well within the negative range of under 13.8, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2273","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Chris's thyroglobulin antibodies are below 1.3, which the lab notes is the level in over 80 percent of the population, confirming no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. It is produced in the skin in response to sunlight and is difficult to obtain in sufficient amounts from food alone. Chris's vitamin D at 82 nmol/L is within the optimal range of 75 to 120. This is a solid result, particularly at his BMI, because fat tissue sequesters vitamin D and makes it harder to maintain adequate levels. Continued supplementation with 2,000 IU daily will help maintain this level through the winter months.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, kidney disease","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"215","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3614536058","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4628891399","upper_optimal_position":"0.6316909024","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is found in animal products and is absorbed in the small intestine with the help of intrinsic factor. Chris's B12 at 215 is technically within the laboratory range of 193 to 982 but sits in the bottom 3 percent and is well below the optimal floor of 500. B12 deficiency is associated with fatigue, brain fog, low mood, and neurological symptoms, all of which Chris reports. Supplementation with sublingual methylcobalamin is recommended, and this marker should be rechecked in four to six months to confirm improvement.","low_causes":"Poor dietary intake, malabsorption, pernicious anaemia, medications (metformin, PPIs), alcohol","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4285714286","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4523809524","upper_optimal_position":"0.6666666667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and methylation, a biochemical process critical for neurotransmitter production and detoxification. Chris's folate at 7 is within the laboratory range but below the optimal floor of 8. Combined with his suboptimal B12, this may be impairing methylation and contributing to his brain fog and low mood. Increasing leafy green vegetables, beans, and lentils, and considering a methylfolate supplement, would help optimise this level.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications, pregnancy","high_causes":"Supplementation, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5354609929","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mmol/l","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals and oxidative stress. Chris's TAA at 1.55 is within the optimal range, suggesting his diet is providing adequate antioxidant nutrients.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"154","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4690476190","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_nor  Chris's IgM at 1.0 is within the normal range.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4107142857","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"Immunoglobulin A (IgA) is the main antibody found in mucosal surfaces, including the gut, lungs, and saliva. It provides frontline defence against pathogens at entry points. Chris's IgA at 1.1 is within the normal range. IgA adequacy is important for interpreting the coeliac screen, as IgA-deficient individuals can produce false-negative results. His IgA is adequate, so the negative coeliac screen is reliable.","low_causes":"Selective IgA deficiency (genetic), medications","high_causes":"Chronic infection, liver disease, IgA nephropathy, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"9.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0470","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"IU/ml","description":"Immunoglobulin E (IgE) is the antibody associated with allergic responses and parasitic infections. Chris's IgE at 9.39 is low, indicating no significant allergic or parasitic activity.","low_causes":"","high_causes":"Allergies, asthma, eczema, parasitic infection, some immune disorders","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"rheu function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
