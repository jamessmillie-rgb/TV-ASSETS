 syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3485","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3902","upper_optimal_position":"0.6136","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. Elevated levels can indicate pancreatic inflammation. Cheryl's amylase at 42 IU/L is within both the reference and optimal ranges, indicating a healthy pancreas.","low_causes":"Chronic pancreatitis (burnt-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4965","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3757","upper_optimal_position":"0.5886","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase. Cheryl's lipase at 36 U/L is within both the reference and optimal ranges, further confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease, gallstones","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3860","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4211","upper_optimal_position":"0.6404","units":"mmol/L","description":"Calcium is essential for bone strength, nerve transmission, muscle contraction, and blood clotting. Cheryl's calcium at 2.3 mmol/L is within the reference range. While within the lab range, it sits in the lower half. Combined with her corrected calcium of 2.25, also within range, and a normal PTH of 3 pmol/L, calcium metabolism is functioning normally.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration, giving a more accurate picture of true calcium status. Cheryl's corrected calcium at 2.25 mmol/L is within the reference range but at the lower boundary of the optimal zone. It is adequate and her PTH is responding normally.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5632","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle function, nerve signalling, and sleep regulation. Cheryl's magnesium at 0.93 mmol/L is within both the reference and optimal ranges. This is a positive finding, especially given her sleep complaints, because it means magnesium deficiency is not contributing to her insomnia.","low_causes":"Poor dietary intake, alcohol excess, diuretics, chronic diarrhoea, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3083","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin that the body produces in response to sunlight and obtains from a limited number of foods. It is essential for calcium absorption, bone density, immune function, and mood regulation. Cheryl's vitamin D at 74 nmol/L is above the NHS sufficiency threshold of 50 but just below the optimal range of 75 to 120 nmol/L. For a postmenopausal woman, maintaining vitamin D in the optimal zone is particularly important to support bone density as oestrogen's protective effect on bone has been lost. Supplementation through autumn and winter is recommended.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, low dietary intake","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5147","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4193","upper_optimal_position":"0.6047","units":"pmol/L","description":"Parathyroid hormone, or PTH, is released by the parathyroid glands to regulate calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bone, increase gut absorption, and reduce kidney excretion. Cheryl's PTH at 3 pmol/L is within both the reference and optimal ranges, indicating that calcium regulation is functioning normally.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"253","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3586","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6153","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy production. It is primarily found in animal products, with the richest sources being red meat, organ meats, dairy, and eggs. Fish provides moderate amounts. Cheryl's B12 at 253 pg/mL is within the laboratory range but well below the optimal zone of 500 to 900 pg/mL. On a pescatarian diet, B12 intake can be marginal. A suboptimal B12 level may be contributing to her fatigue, and alongside her borderline folate, it is the most likely explanation for her raised RDW. Sublingual methylcobalamin supplementation is recommended.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, gastric surgery, metformin use, age-related decline in absorption","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, works closely with B12 in red blood cell production and DNA synthesis. It is found in dark leafy greens, legumes, and fortified foods. Cheryl's folate at 7 ng/mL is within the laboratory range but below the optimal threshold of 8 ng/mL. Combined with her suboptimal B12, this borderline folate may be contributing to the raised RDW. Increasing dietary intake of dark leafy greens, lentils, and chickpeas should help close this gap.","low_causes":"Poor dietary intake, malabsorption, alcohol excess, pregnancy, methotrexate use","high_causes":"Supplementation, very high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0800","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein, or hs-CRP, is a precise measure of low-grade systemic inflammation. It is produced by the liver in response to inflammatory signals anywhere in the body. Levels below 1.0 mg/L indicate low cardiovascular inflammatory risk. Cheryl's hs-CRP at 0.8 mg/L is within the optimal range, which is genuinely reassuring alongside her elevated Lp(a), as it means inflammation is not compounding her inherited cardiovascular risk.","low_causes":"Not clinically significant when low","high_causes":"Infection, chronic inflammation, obesity, metabolic syndrome, autoimmune conditions, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5695","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the combined measurement of all cholesterol in the blood, including HDL (protective), LDL (atherogenic), and VLDL. Cheryl's total cholesterol at 5.9 mmol/L is above the desirable threshold of 5.18. However, total cholesterol alone is a poor predictor of risk because it does not distinguish between protective HDL and harmful LDL. Her HDL is excellent, which accounts for a large share of this number. The more important markers are her LDL, ApoB, and Lp(a), which are discussed in detail below.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, hypothyroidism, familial hypercholesterolaemia, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3882","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, derived from dietary fats and produced by the liver from excess carbohydrates. They are a key marker of metabolic health. Cheryl's triglycerides at 1.32 mmol/L are within the desirable range of below 1.7 but above the optimal threshold of below 1.0. Reducing refined carbohydrate intake and increasing omega-3 from oily fish could help bring this towards optimal.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism","high_causes":"High sugar or refined carbohydrate diet, alcohol excess, obesity, metabolic syndrome, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3846","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"Very low-density lipoprotein, or VLDL, carries triglycerides from the liver to tissues. It is a precursor to LDL. Cheryl's VLDL at 0.6 mmol/L is within both the reference range and at the boundary of optimal.","low_causes":"Very low fat diet, malabsorption","high_causes":"High triglycerides, metabolic syndrome, obesity, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5938","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective form of cholesterol. It carries excess cholesterol from arterial walls back to the liver for disposal, a process called reverse cholesterol transport. Cheryl's HDL at 1.9 mmol/L is excellent, well above both the 1.04 low-risk threshold and the 1.6 optimal target for women. This provides genuine protective benefit against the atherogenic particles measured by her LDL and ApoB.","low_causes":"Sedentary lifestyle, obesity, smoking, high refined carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, very low carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5783","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the primary carrier of cholesterol to tissues. When present in excess, LDL particles deposit cholesterol in arterial walls, contributing to atherosclerosis. Cheryl's LDL at 3.47 mmol/L is above both the 3.0 upper limit and the 2.6 optimal target. In the context of her very high Lp(a), a portion of this LDL number includes Lp(a) particles that cannot be reduced through diet or exercise. The remaining conventional LDL is still modifiable through dietary changes, and potentially through medication if her GP considers it appropriate given the overall risk picture.","low_causes":"Hyperthyroidism, malnutrition, liver disease, statins","high_causes":"Diet high in saturated fat, hypothyroidism, familial hypercholesterolaemia, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3456","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of the balance between total and protective cholesterol. A lower ratio indicates better cardiovascular health. Cheryl's ratio at 3.11 is within both the reference and optimal ranges, reflecting the protective benefit of her excellent HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"32.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8050","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"HDL percentage shows what proportion of total cholesterol is made up of the protective HDL fraction. A higher percentage is better. Cheryl's HDL makes up 32.2% of her total cholesterol, which is above both the 20% minimum and the 28% optimal threshold, indicating a healthy proportion of protective cholesterol.","low_causes":"Low HDL, obesity, sedentary lifestyle","high_causes":"High HDL, exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl_cholesterol","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic cholesterol fractions in one number. Cheryl's non-HDL at 4.0 mmol/L sits right at the upper limit of the reference range and above the optimal target of 3.4. This is consistent with her elevated LDL and ApoB findings.","low_causes":"Low LDL, malnutrition","high_causes":"Elevated LDL, raised triglycerides, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoprotein_a1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5393","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles and is essential for their function in reverse cholesterol transport. Higher levels are protective. Cheryl's ApoA1 at 1.51 g/L is above the 1.4 target, consistent with her excellent HDL level.","low_causes":"Low HDL, metabolic syndrome, smoking, sedentary lifestyle","high_causes":"Exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apolipoprotein_b","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B, or ApoB, is the single protein present on every LDL, VLDL, IDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, the ApoB level gives the most accurate count of atherogenic particles in the blood. It is considered a better predictor of cardiovascular risk than LDL cholesterol alone. Cheryl's ApoB at 1.08 g/L is above the 0.9 desirable threshold and above the 0.8 optimal target. The lab classifies this as borderline high. Given her Lp(a) above 212.5, a meaningful portion of her ApoB is contributed by Lp(a) particles that cannot be reduced by lifestyle changes.","low_causes":"Statins, low LDL, malnutrition","high_causes":"Elevated LDL, familial hypercholesterolaemia, high Lp(a), hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio provides the best single summary of the balance between atherogenic (artery-damaging) and protective lipoproteins. Cheryl's ratio at 0.72 is above the 0.6 lower-risk threshold but below the 0.8 higher-risk cut-off, placing her in the average-risk category. Her excellent ApoA1 is partially offsetting the elevated ApoB. Reducing the ApoB through dietary changes and potentially medication would improve this ratio.","low_causes":"Excellent lipid balance, statins, high HDL","high_causes":"Elevated LDL, low HDL, metabolic syndrome, high Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL cholesterol. Each Lp(a) particle carries the same ApoB protein as regular LDL, plus an additional protein called apolipoprotein(a) that makes the particle stickier, more inflammatory, and more prone to promoting blood clots. Unlike standard LDL, Lp(a) levels are almost entirely determined by genetics and do not change meaningfully with diet, exercise, or weight loss. Cheryl's Lp(a) is above 212.5 nmol/L, well above the 32 nmol/L threshold for increased risk and classified as high risk (200 to 400 range). This is the most significant cardiovascular risk factor identified in this report. This result should be recorded as a permanent part of Cheryl's medical record as it will not change over her lifetime. First-degree relatives should be tested, as approximately half of them will carry the same trait. While Lp(a) cannot currently be lowered by lifestyle or standard medications, it makes managing all other modifiable risk factors, including LDL, blood pressure, inflammation, and metabolic health, even more important. PCSK9 inhibitors can reduce Lp(a) by approximately 20 to 30%, and specific Lp(a)-lowering therapies are in late-stage clinical trials.","low_causes":"Genetic variation (favourable)","high_causes":"Inherited (genetic), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"109","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"170","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4190","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase, or CK, is an enzyme found in muscles, the heart, and the brain. It is released into the blood when muscle tissue is damaged or stressed. Cheryl's CK at 109 U/L is within both the reference and optimal ranges for women, indicating no current muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4500","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar. Because red blood cells live for approximately three months, HbA1c provides a rolling average of blood sugar control over that period. Cheryl's HbA1c at 5.8% is within the normal range of below 6.0% but above the optimal zone of below 5.4%. This places her in the upper normal range, two points from the pre-diabetes threshold of 6.0%. It warrants monitoring, particularly alongside her low insulin and C-Peptide findings.","low_causes":"Haemolytic anaemia, recent blood loss, iron deficiency treatment","high_causes":"High blood sugar, pre-diabetes, diabetes, high carbohydrate diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, which is the internationally standardised unit. Cheryl's HbA1c at 40 mmol/mol is within the normal range of below 42 but above the optimal target of below 36. As discussed above, this is at the upper end of normal and warrants monitoring.","low_causes":"Haemolytic anaemia, recent blood loss","high_causes":"High blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"1.72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2296","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2929","upper_optimal_position":"0.5750","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is releasing into the blood when no food has been eaten. Insulin's job is to move glucose from the blood into cells for energy. Cheryl's fasting insulin at 1.72 mIU/L is below the lower limit of 2.6. In isolation, low fasting insulin can be a positive sign of excellent insulin sensitivity, meaning the body needs very little insulin to manage blood sugar. However, combined with her HbA1c of 40 mmol/mol sitting at the upper end of normal and her low C-Peptide, this pattern warrants monitoring to ensure the pancreas is not falling behind demand. A repeat test with a fasting glucose measurement in three to four months would help clarify the picture.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, early type 1 diabetes (LADA), pancreatic insufficiency","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.731","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2589","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5091","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in a one-to-one ratio with insulin. Because it is not cleared by the liver as quickly as insulin, it provides a more reliable measure of how much insulin the pancreas is actually producing. Cheryl's C-Peptide at 0.731 ug/L (approximately 242 pmol/L) is below the lower limit of 1.1 ug/L. This confirms that her pancreatic insulin output is genuinely low rather than the insulin level being an artefact. As discussed in the summary, this needs to be interpreted alongside her HbA1c and warrants repeat testing. The lab note advises that samples not separated within four hours can show falsely low C-Peptide, so sample handling should be confirmed with the phlebotomy provider.","low_causes":"Low insulin demand (insulin sensitive), low carbohydrate diet, type 1 diabetes, LADA, sample degradation","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3631","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5655","units":"pmol/L","description":"Free T4, or free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in tissues. The 'free' measurement captures only the unbound, biologically available hormone. Cheryl's FT4 at 14 pmol/L is within the laboratory range and sits right at the lower boundary of the optimal zone of 14 to 20 pmol/L. In the context of her TSH being above optimal and her positive thyroglobulin antibody, this lower-end FT4 suggests the thyroid is producing adequate but not abundant hormone in response to a moderately strong pituitary signal.","low_causes":"Hypothyroidism, pituitary disease, severe illness, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5944","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4392","upper_optimal_position":"0.4745","units":"mIU/L","description":"Thyroid stimulating hormone, or TSH, is produced by the pituitary gland in the brain and tells the thyroid how hard to work. When thyroid hormone levels drop, the pituitary raises TSH to stimulate more production. Cheryl's TSH at 3.86 mIU/L is within the laboratory range of 0.55 to 4.78 but above the optimal zone of 1.0 to 2.5. A TSH above 2.5, particularly in the presence of thyroid antibodies, suggests the pituitary is having to work harder than ideal to maintain adequate thyroid hormone levels. This warrants monitoring.","low_causes":"Hyperthyroidism, pituitary disease, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use for metabolism, energy production, and temperature regulation. Most T3 is produced by converting T4 in tissues rather than directly by the thyroid. Cheryl's FT3 at 4.2 pmol/L is within the laboratory range but below the optimal zone of 4.5 to 6.5. This means that despite the thyroid producing adequate T4, the active hormone available to cells is towards the lower end. This could be contributing to her fatigue, difficulty losing weight, and poor sleep.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, selenium deficiency, chronic illness, caloric restriction","high_causes":"Hyperthyroidism, thyroiditis, T3-containing medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are autoantibodies that target thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence indicates autoimmune thyroid activity. Cheryl's TPO antibodies are below 6.6 U/mL, which is negative (below the 13.8 cut-off). This is reassuring, though her thyroglobulin antibodies are positive. Some people with autoimmune thyroid disease have one antibody positive and the other negative.","low_causes":"No autoimmune thyroid activity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibody","name":"Thyroglobulin Antibody","group":"THYROID","result":"4.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5227","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid gland to produce thyroid hormones. Elevated levels indicate autoimmune thyroid activity. Cheryl's thyroglobulin antibody at 4.6 U/mL is above the 4.4 U/mL cut-off for autoimmune thyroid disease. The lab notes that more than 80% of the population have undetectable levels below 1.3 IU/mL. This positive result, combined with her above-optimal TSH and lower-end thyroid hormones, is consistent with early autoimmune thyroid disease, possibly Hashimoto's thyroiditis. This warrants monitoring and GP discussion.","low_causes":"No autoimmune thyroid activity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"to follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"31","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"U/mL","description":"CA-125 is a protein that can be elevated in ovarian cancer but also in many benign conditions including endometriosis, ovarian cysts, and pelvic inflammatory disease. This result is pending and will be reviewed when available.","low_causes":"Not clinically significant when low","high_causes":"Ovarian cancer, endometriosis, pelvic inflammatory disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15_3","name":"CA 15-3","group":"TUMOR MARKERS","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"30","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"U/mL","description":"CA 15-3 is a protein associated with breast cancer monitoring. It is not used for screening but can be useful in tracking disease progression. This result is pending and will be reviewed when available.","low_causes":"Not clinically significant when low","high_causes":"Breast cancer, ovarian cancer, liver disease, benign breast conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"to follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"37","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"U/mL","description":"CA 19-9 is a protein associated with pancreatic and other gastrointestinal cancers. It is primarily used for monitoring rather than screening. This result is pending and will be reviewed when available.","low_causes":"Not clinically significant when low","high_causes":"Pancreatic cancer, colorectal cancer, liver disease, bile duct obstruction, pancreatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"< 0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1087","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"Carcinoembryonic antigen, or CEA, is a protein that can be elevated in certain cancers, particularly colorectal cancer, and in some benign conditions. Cheryl's CEA at below 0.5 ng/mL is reassuringly low, well within the non-smoker reference range of 0 to 2.3.","low_causes":"Not clinically significant when low","high_causes":"Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"8.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3860","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against previously encountered infections. Cheryl's IgG at 8.5 g/L is within the reference range, indicating a healthy adaptive immune response.","low_causes":"Immune deficiency, medications, chronic kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced in response to a new infection, providing early-stage immune defence. Cheryl's IgM at 1.0 g/L is within the reference range.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4516","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, respiratory tract, and urinary tract. It is also the antibody used in coeliac disease screening. Cheryl's IgA at 1.5 g/L is within the reference range, and importantly, a normal IgA confirms that the coeliac screening test (tTG IgA) is reliable.","low_causes":"Selective IgA deficiency, medications","high_causes":"Chronic infection, liver disease, IgA nephropathy, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"5.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0266","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"IgE is the antibody involved in allergic responses and parasitic infections. Cheryl's IgE at 5.32 IU/mL is very low, well within range, indicating no current allergic activation or parasitic infection.","low_causes":"Not clinically significant when low","high_causes":"Allergies, asthma, eczema, parasitic infection, drug reactions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"IU/mL","description":"Rheumatoid factor is an autoantibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Cheryl's RF at 13 IU/mL is within the reference range of below 14 but sits near the upper limit. In isolation, a borderline RF is not diagnostic and can be seen in healthy people, particularly with advancing age. However, it is worth noting alongside her positive thyroglobulin antibody, as autoimmune conditions can cluster. If Cheryl develops persistent joint symptoms, this baseline value will be useful context.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, other autoimmune conditions, age-related","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"< 0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0139","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA, or tTG IgA, is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the lining of the small intestine. Cheryl's tTG IgA is negative at below 0.2 CU, which, combined with her normal IgA level confirming the test is reliable, effectively rules out coeliac disease on a gluten-containing diet.","low_causes":"No coeliac disease (normal finding)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"total_antioxidant_activity","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6170","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which are reactive molecules that can damage cells. Cheryl's TAA at 1.56 mmol/L is within both the reference and optimal ranges, indicating adequate antioxidant defence.","low_causes":"Poor dietary antioxidant intake, chronic oxidative stress, smoking","high_causes":"High antioxidant supplementation, very high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"277","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4653","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4486","upper_optimal_position":"0.5823","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and declining through the day. A morning cortisol within range indicates the adrenal glands are responding normally. Cheryl's cortisol at 277 nmol/L is within both the morning reference range and the optimal zone, suggesting healthy adrenal function.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic stress fatigue","high_causes":"Acute stress, chronic stress, Cushing's syndrome, corticosteroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"< 43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1818","lower_normal":"0","upper_normal":"118.2","lower_optimal":"0","upper_optimal":"118.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, the key female sex hormone responsible for reproductive function, bone density, cardiovascular protection, skin health, and brain function. In postmenopausal women, oestradiol falls to very low levels as the ovaries cease production. Cheryl's oestradiol at below 43 pmol/L is within the postmenopausal reference range of 0 to 118.2 pmol/L. While this is expected and normal for her stage of life, the loss of oestrogen's protective effects contributes to increased cardiovascular risk, bone density loss, and many of the symptoms she reports including fatigue, poor sleep, and difficulty losing weight. If Cheryl is considering or already using HRT, this baseline level is useful for monitoring.","low_causes":"Menopause, premature ovarian insufficiency, low body fat, excessive exercise, pituitary disease","high_causes":"Ovulation (mid-cycle), pregnancy, HRT, ovarian tumours","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1185","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone primarily produced after ovulation and during pregnancy. In postmenopausal women, levels are very low as ovulation has ceased. Cheryl's progesterone at 0.55 nmol/L is within the postmenopausal reference range of 0 to 2.32 and is entirely expected for her hormonal stage.","low_causes":"Menopause, anovulation, luteal phase defect","high_causes":"Pregnancy, ovulation (luteal phase), HRT, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"33.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3528","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mIU/mL","description":"Luteinising hormone, or LH, is produced by the pituitary gland and, in premenopausal women, triggers ovulation. After menopause, LH rises because the pituitary is sending stronger signals to ovaries that are no longer responding. Cheryl's LH at 33.85 mIU/mL is within the postmenopausal reference range of 15.9 to 54, confirming her postmenopausal status.","low_causes":"Pituitary disease, malnutrition, excessive exercise","high_causes":"Menopause, primary ovarian insufficiency, PCOS (relative to FSH)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"77.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4377","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mIU/mL","description":"Follicle stimulating hormone, or FSH, stimulates the ovaries to produce eggs and oestrogen. After menopause, FSH rises significantly because the pituitary is trying to stimulate ovaries that are no longer producing eggs. Cheryl's FSH at 77.26 mIU/mL is well within the postmenopausal range of 23 to 116.3, firmly confirming that she is postmenopausal.","low_causes":"Pituitary disease, pregnancy, hormonal contraception","high_causes":"Menopause, primary ovarian insufficiency, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3492","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"nmol/L","description":"Testosterone in women plays a role in muscle maintenance, bone density, energy levels, libido, and mood. While produced in much smaller quantities than in men, it remains important throughout life. Cheryl's testosterone at 0.6 nmol/L is within the reference range of 0.5 to 2.6 but sits close to the lower limit and well below the optimal zone of 0.8 to 2.2. This low testosterone, combined with her very low free testosterone, may be contributing to her fatigue, difficulty building muscle, and weight management challenges. Discussing testosterone replacement as part of an HRT conversation with her GP would be worthwhile.","low_causes":"Menopause, adrenal insufficiency, pituitary disease, oral contraceptives, chronic illness","high_causes":"PCOS, adrenal tumours, congenital adrenal hyperplasia, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index","group":"HORMONES","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3778","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.5","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The free androgen index, or FAI, estimates the proportion of testosterone that is biologically active by accounting for SHBG binding. Cheryl's FAI at 1.3 is within the reference range but below the optimal zone. This is consistent with her low total and free testosterone levels and reflects limited androgen availability to tissues.","low_causes":"Low testosterone, high SHBG, menopause, oral contraceptives","high_causes":"PCOS, low SHBG, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3580","lower_normal":"0.26","upper_normal":"11","lower_optimal":"1.5","upper_optimal":"7.0","lower_normal_position":"0 imal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3518","upper_optimal_position":"0.4936","units":"nmol/L","description":"Sex hormone binding globulin, or SHBG, is a protein produced by the liver that binds sex hormones, primarily testosterone and oestradiol, making them unavailable to tissues. Cheryl's SHBG at 46.1 nmol/L is within both the reference and optimal ranges. Importantly, her SHBG is not excessively high, meaning her very low free testosterone is not being caused by excessive binding but rather reflects genuinely low testosterone production.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS","high_causes":"Hyperthyroidism, liver disease, oral contraceptives, ageing, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.009","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"0.005","upper_normal":"0.035","lower_optimal":"0.01","upper_optimal":"0.03","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"nmol/L","description":"Free testosterone measures the tiny fraction of total testosterone that is not bound to proteins and is therefore biologically active. It is the testosterone that cells can actually use. Cheryl's free testosterone at 0.009 nmol/L is within the reference range but below the optimal zone. Combined with her low total testosterone, this means very little active testosterone is available to support muscle building, energy, and other androgen-dependent functions.","low_causes":"Low total testosterone, high SHBG, menopause, ageing","high_causes":"PCOS, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"INFLAMMATION","r function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
