<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Cheryl Kim Jackson","dob":"09/09/1970","report_date":"2026-08-29","summary":"Cheryl is a 55-year-old female presenting with a BMI of 26.2, following a pescatarian diet rated 5 out of 10 for quality with a volume of 7 out of 10. She does not currently perform any structured cardio or resistance training and averages 5,000 to 7,500 daily steps. She vapes nicotine. She reports low energy and fatigue, poor sleep and insomnia, and difficulty losing weight. Her goals are to lose body fat, build muscle, and balance her hormones. There is no additional context provided.\n\nThe most important finding in this report is Cheryl's Lipoprotein(a), which is above 212.5 nmol/L, well above the 32 nmol/L threshold that defines increased cardiovascular risk. Lipoprotein(a), often written Lp(a), is a variant of LDL cholesterol that carries an extra protein called apolipoprotein(a) on its surface. This protein makes the particle stickier, more inflammatory, and harder for the body to clear. Unlike standard LDL, Lp(a) is almost entirely genetically determined. It does not change meaningfully with diet, exercise, or weight loss, and it stays essentially the same for life. A level above 200 nmol/L is classified as high risk. This result should be recorded as a permanent part of Cheryl's medical record, and we would strongly recommend that her first-degree relatives, including her children and siblings, are tested as well, since approximately half of them will carry the same inherited trait. In the context of her other lipid results, which show LDL and ApoB both elevated, the Lp(a) means that a significant portion of her cardiovascular risk is not modifiable by lifestyle alone. This does not make lifestyle changes pointless, far from it, but it does mean that her GP should be made aware of the full lipid picture including the Lp(a), because the threshold for considering medical intervention is lower when Lp(a) is driving a substantial share of the risk.\n\nAlongside the Lp(a), Cheryl's thyroglobulin antibodies have returned at 4.6 U/mL, which is above the 4.4 U/mL cut-off for autoimmune thyroid disease. Her thyroid peroxidase antibodies, known as TPO, are negative at below 6.6 U/mL. Having one antibody positive and one negative can still indicate early autoimmune thyroid activity, a pattern associated with a condition called Hashimoto's thyroiditis, in which the immune system gradually targets the thyroid gland. Her TSH, which is the hormone the pituitary gland uses to instruct the thyroid, is 3.86 mIU/L. This sits within the laboratory reference range of 0.55 to 4.78 but is above the optimal zone of 1.0 to 2.5 mIU/L. Her free T4, the main hormone the thyroid produces, is 14 pmol/L, sitting right at the floor of the optimal range. Her free T3, the active form that cells actually use, is 4.2 pmol/L, which is within the laboratory range but below the optimal zone of 4.5 to 6.5. Put these together, and the picture is of a thyroid that is working but being pushed. The pituitary is sending a moderately strong signal, yet thyroid hormone output is towards the lower end. In the presence of a positive thyroglobulin antibody, this warrants monitoring. Subclinical hypothyroidism, even at this early stage, can contribute directly to the fatigue, poor sleep, and difficulty losing weight that Cheryl describes. It also slows the rate at which the liver clears LDL cholesterol from the bloodstream, which means that a portion of her elevated LDL may be thyroid-driven rather than purely dietary. We would recommend Cheryl discusses these thyroid results with her GP and requests a repeat thyroid panel including both antibodies in three to four months.\n\nThere is a good deal of reassuring news in this report. Cheryl's kidney function is solid, with a Cystatin C of 1.04 mg/L and a Cystatin C-derived eGFR of 80, which is appropriate for 55 and shows no sign of kidney strain. Her liver is in good health. ALT at 21 IU/L and Gamma GT at 23 IU/L are both clean, and AST, bilirubin, albumin, and alkaline phosphatase are all within range. Her FIB-4 score, a composite calculation that estimates liver fibrosis risk, is 1.51, which is marginally above the 1.45 threshold. However, at 55, age itself pushes this calculation upward. The lab note confirms that in the absence of other clinical indicators, a score below 2 is typically insignificant, and given that every individual liver marker is healthy, this score is being driven by the arithmetic rather than by any sign of liver disease. Her hs-CRP, a measure of systemic inflammation, is 0.8 mg/L, which is within the optimal range of below 1.0. At any BMI, this is a good result, but it is particularly reassuring alongside the elevated Lp(a) because it means there is no additional inflammatory fuel being added to the cardiovascular risk. Her HDL cholesterol at 1.9 mmol/L is excellent, comfortably above the 1.6 optimal threshold for women, and her Apolipoprotein A1, the protective protein carried on HDL particles, is 1.51 g/L, well above the 1.4 target. Her triglycerides at 1.32 mmol/L are within the desirable range, and the TG/HDL ratio, which is one of the better surrogate markers for insulin resistance, calculates to 0.69, which is well within the optimal zone of below 0.87. Remnant cholesterol, the cholesterol carried on intermediate particles and calculated as total cholesterol minus HDL minus LDL, is 0.53 mmol/L, marginally above the 0.5 optimal cut-off but within range. Her ESR, a general marker of inflammation, is a reassuring 5 mm/hour. Her calcium, magnesium, sodium, potassium, and chloride are all within healthy ranges, with magnesium at 0.93 mmol/L sitting within the optimal zone. Her creatine kinase, a marker of muscle damage, is 109 U/L, entirely normal. Her urinalysis is clean across the board, with no protein, glucose, blood, or white cells detected.\n\nHer hormonal picture confirms what is expected at 55. Her FSH at 77.26 mIU/mL and LH at 33.85 mIU/mL are both firmly in the postmenopausal range, confirming that ovarian function has ceased. Her oestradiol is below 43 pmol/L, which is consistent with postmenopause and is within the postmenopausal reference range of 0 to 118.2 pmol/L, so despite the lab flagging this, it is not abnormal for her stage of life. Her progesterone at 0.55 nmol/L is also consistent with postmenopause. Her total testosterone at 0.6 nmol/L is within the female reference range of 0.5 to 2.6, but it sits right at the floor. Her free testosterone, calculated at 0.009 nmol/L, is very low. Her SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues, is 46.1 nmol/L, which is mid-range. The low free testosterone is therefore not being caused by excessive SHBG binding but reflects genuinely low production. In a woman whose goals include building muscle, this is relevant. Testosterone, even in small amounts, plays a meaningful role in muscle protein synthesis, energy, libido, and mood. Her DHEA-S, a precursor hormone produced by the adrenal glands, is 0.8 umol/L, which converts to approximately 295 ug/dL. This is within range but towards the lower end for 55, and it means the adrenal contribution to androgen production is modest. Her cortisol at 277 nmol/L is mid-range for a morning sample and does not suggest adrenal dysfunction. Her prolactin at 73 uIU/mL is within the non-pregnant reference range. If Cheryl is not already discussing hormone replacement therapy with her GP, this would be a worthwhile conversation given her symptoms of fatigue, poor sleep, weight gain, and the confirmed postmenopausal status with low oestradiol and very low testosterone.\n\nHer white blood cell count at 3.94 x10^9/L is marginally below the lower limit of 4.0, and her neutrophils at 1.68 x10^9/L are below the lower limit of 2.0. This pattern, sometimes called benign ethnic neutropenia, can be a normal variant in some populations, but in a white European woman gumes or a higher metabolic demand. Both suboptimal B12 and borderline folate can contribute to the raised RDW, to fatigue, and to poor sleep quality.\n\nHer bicarbonate at 18 mmol/L is below the lower limit of 20. Bicarbonate is part of the body's acid-base buffering system. A low level can reflect a mild metabolic acidosis, which can be caused by dietary acid load, mild dehydration at the time of sampling, or occasionally kidney tubular handling. Given that her kidney function is otherwise healthy, this is most likely dietary or a sample-related finding, but it should be repeated on a fresh sample to confirm.\n\nHer insulin at 1.72 mIU/L is below the laboratory lower limit of 2.6, and her C-Peptide at 0.731 ug/L, which converts to approximately 242 pmol/L, is below the lower limit of 1.1 ug/L (approximately 364 pmol/L). C-Peptide is released in a one-to-one ratio with insulin from the pancreas and is a reliable marker of how much insulin the body is producing. When both insulin and C-Peptide are low but fasting glucose is reasonable and HbA1c is 40 mmol/mol (5.8%), this typically means the pancreas is producing very little insulin because the body is not demanding much. Her HbA1c at 40 mmol/mol is within the normal range of below 42 but is at the upper end of the range, just two points from the pre-diabetes threshold. Her fasting glucose was not separately reported, so we cannot calculate HOMA-IR or HOMA-B directly. The pattern here needs careful interpretation. In a lean, insulin-sensitive person on a low-carb diet, low insulin and C-Peptide with a low HbA1c would be entirely benign. In Cheryl's case, the HbA1c at 40 suggests that blood sugar is being managed adequately but without much margin. If insulin production is genuinely low rather than simply low because demand is low, there is a possibility that the pancreas is beginning to fall behind. We would recommend her GP is made aware of this combination and that a fasting glucose and repeat insulin and C-Peptide are performed in three to four months to establish a trend.\n\nHer lipid profile, as mentioned, shows total cholesterol at 5.9 mmol/L, LDL at 3.47 mmol/L (above the 3.0 upper limit and well above the 2.6 optimal target), and ApoB at 1.08 g/L (above the 0.9 desirable threshold and above the 0.8 optimal target). ApoB is the single protein carried on every LDL, VLDL, and Lp(a) particle, so it provides the most accurate count of atherogenic particles in the blood. The ApoB/A1 ratio at 0.72 is above the 0.6 lower-risk threshold, placing her in the average-risk category. With Lp(a) above 212.5, a meaningful share of her ApoB is coming from Lp(a) particles that cannot be reduced through lifestyle changes. However, the remaining LDL-driven ApoB is still modifiable. Dietary changes, specifically increasing soluble fibre intake from oats, beans, lentils, and flaxseed, increasing oily fish to three portions per week, and reducing saturated fat from cheese and coconut-based products, can lower LDL by 10 to 15%. Given the Lp(a), this conversation should happen with her GP, who may consider whether statin therapy or a PCSK9 inhibitor referral is appropriate given the combined risk.\n\nHer immunoglobulins are all within range. IgG at 8.5, IgM at 1.0, and IgA at 1.5 are reassuring. Her rheumatoid factor at 13 IU/mL is within the reference range of below 14 but is at the upper end, which in isolation is not diagnostic but is worth noting if she develops joint symptoms. Her tissue transglutaminase IgA is negative, which rules out coeliac disease on a gluten-containing diet. Her IgE at 5.32 IU/mL is very low, suggesting no current allergic activation. Her total antioxidant activity at 1.56 mmol/L is within range. Her CEA tumour marker is below 0.5 ng/mL, which is reassuringly low. Her CA125, CA15-3, and CA19-9 results are pending and will be reviewed when available.\n\nHer vitamin D at 74 nmol/L is sufficient by NHS standards but below the optimal range of 75 to 120 nmol/L. At this level, supplementation through the autumn and winter months would bring her into the optimal zone and support bone density, immune function, and mood, all of which are relevant for a postmenopausal woman with fatigue and poor sleep.","links":"Cheryl's results point to several practical areas where targeted changes could make a meaningful difference to how she feels and to her long-term health.\n\nStarting with nutrition, at 73 kg and 167 cm with no structured exercise and 5,000 to 7,500 daily steps, her approximate maintenance calorie requirement is around 1,750 to 1,850 calories per day using a sedentary to light activity multiplier. To lose body fat at a sustainable rate of 0.3 to 0.5 kg per week, a target of 1,450 to 1,600 calories per day would be appropriate, provided protein intake is protected. Her protein target should be at least 95 to 105 grams per day, roughly 1.3 to 1.4 g per kg of bodyweight, which is the minimum needed to preserve lean mass during a calorie deficit. On a pescatarian diet, this means prioritising fish, eggs, Greek yoghurt, cottage cheese, lentils, chickpeas, tofu, and tempeh at every meal. A diet quality rating of 5 out of 10 suggests there is room to improve the composition of what she eats. Increasing dark leafy greens, beans, lentils, and berries would directly support her low folate, provide soluble fibre to help lower LDL cholesterol, and improve overall micronutrient density.\n\nFor her lipid profile, the dietary changes most likely to reduce her modifiable LDL and ApoB are: adding 3 grams of soluble fibre daily from oats, ground flaxseed, or psyllium husk; eating oily fish such as salmon, mackerel, or sardines three times per week; reducing saturated fat from cheese, butter, and coconut products; and including plant sterols from fortified foods or supplements if her GP agrees. These changes can reduce LDL by 10 to 15% over eight to twelve weeks. However, given her Lp(a) above 212.5 nmol/L, lifestyle changes alone may not bring her ApoB below the 0.9 target. She should bring her full lipid panel including the Lp(a) result to her GP to discuss whether pharmacological intervention is warranted. The specific numbers to share are: Lp(a) above 212.5 nmol/L, ApoB 1.08 g/L, LDL 3.47 mmol/L, and ApoB/A1 ratio 0.72.\n\nFor her thyroid, she should ask her GP to note the positive thyroglobulin antibody at 4.6 U/mL alongside the TSH of 3.86, FT4 of 14, and FT3 of 4.2. The GP should be asked about repeating a full thyroid panel including both TPO and thyroglobulin antibodies in three to four months to track whether TSH is rising. If subclinical hypothyroidism is confirmed on repeat testing, treatment with levothyroxine could improve her energy, sleep, weight management, and may also help lower her LDL cholesterol.\n\nFor the insulin and C-Peptide findings, the numbers to bring to the GP are: fasting insulin 1.72 mIU/L, C-Peptide 0.731 ug/L (242 pmol/L), and HbA1c 40 mmol/mol. The GP should arrange a fasting glucose alongside repeat insulin and C-Peptide in three to four months to establish whether this pattern reflects benign low demand or early pancreatic insufficiency.\n\nFor her white cell count, the GP should note WBC 3.94 and neutrophils 1.68. If this is her first time below range, a repeat full blood count in eight to twelve weeks would clarify whether this is her normal baseline or a transient finding.\n\nExercise is the single most impactful change Cheryl could make. She currently does no structured cardio or resistance training. For her goals of losing body fat, building muscle, and balancing hormones, starting with two to three resistance training sessions per week would increase insulin sensitivity, support bone density which is critical postmenopause, improve sleep quality, and begin to build the lean mass she is aiming for. Even bodyweight exercises or resistance bands at home would be a meaningful start. Adding one to two brisk walks of 20 to 30 minutes on non-training days and gradually increasing daily steps towards 8,000 to 10,000 would provide cardiovascular benefit and support weight management.\n\nFor sleep, practical steps include setting a fixed wake time seven days a week, getting outside within an hour of waking for natural light exposure, cutting caffeine after midday, keeping the bedroom cool at around 18 degrees, and avoiding screens for at least 30 minutes before bed. Nicotine from vaping is a stimulant and can directly disrupt sleep architecture, particularly when used in the evening. If Cheryl can avoid vaping in the two to three hours before bed, this may improve sleep onset.\n\nRetest recommendations: repeat thyroid panel including TSH, FT4, FT3, TPO antibodies, and thyroglobulin antibodies in three to four months. Repeat fasting glucose, insulin, and C-Peptide in three to four months. Repeat full blood count in eight to twelve weeks. Repeat lipid panel including ApoB after eight to twelve weeks of dietary changes. Note the Lp(a) permanently, as it does not need repeating. Follow up on pending CA125, CA15-3, CA19-9, bacterial count, and urine culture when results are available.","flags":"GP-URGENT ITEMS:\n\nLp(a) above 212.5 nmol/L (threshold below 32 nmol/L). This is a high-risk inherited lipoprotein that independently and significantly increases cardiovascular risk. It is genetically fixed and does not respond to lifestyle modification. Combined with LDL 3.47 mmol/L, ApoB 1.08 g/L, and ApoB/A1 ratio 0.72, the overall atherogenic burden is elevated. GP discussion regarding lipid-lowering therapy and PCSK9 inhibitor referral is recommended. First-degree relatives should be tested for Lp(a).\n\nThyroglobulin antibody 4.6 U/mL (cut-off 4.4 U/mL) with TSH 3.86 mIU/L (above optimal 2.5), FT4 14 pmol/L (at lower optimal boundary), FT3 4.2 pmol/L (below optimal 4.5). TPO antibodies negative. This pattern is consistent with early autoimmune thyroid disease, possibly Hashimoto's thyroiditis with a single antibody positive. Repeat thyroid panel with both antibodies recommended in three to four months. Subclinical hypothyroidism may be contributing to fatigue, weight gain, poor sleep, and elevated LDL.\n\nInsulin 1.72 mIU/L (below range 2.6 to 24.9) and C-Peptide 0.731 ug/L (below range 1.1 to 4.4; approximately 242 pmol/L) with HbA1c 40 mmol/mol. Fasting glucose not separately reported. The combination of low insulin production markers with an HbA1c approaching the upper limit of normal warrants repeat testing with fasting glucose, insulin, and C-Peptide in three to four months to exclude early pancreatic insufficiency.\n\nOTHER FLAGS:\n\nLDL 3.47 mmol/L (above 3.0 upper limit, above 2.6 optimal). ApoB 1.08 g/L (above 0.9 desirable, above 0.8 optimal). ApoB/A1 ratio 0.72 (above 0.6 lower-risk threshold). Total cholesterol 5.9 mmol/L. Non-HDL cholesterol 4.0 mmol/L. All part of the atherogenic picture discussed above.\n\nWBC 3.94 x10^9/L (below 4.0) and neutrophils 1.68 x10^9/L (below 2.0). Mild leucopenia and neutropenia. May be constitutional but first occurrence should be repeated in eight to twelve weeks. Basophils 0.01 (below 0.02) is not clinically significant at this margin.\n\nRDW 15.1% (above 14.0%). Raised red cell distribution width with normal MCV. May reflect early B12 or folate insufficiency. B12 253 pg/mL (below optimal 500) and folate 7 ng/mL (below optimal 8) support this.\n\nBicarbonate 18 mmol/L (below 20). Mild metabolic acidosis. Kidney function otherwise normal. Likely dietary or sample-related. Recommend repeat on fresh sample.\n\nSerum iron 31.7 umol/L (marginally above 30.4 upper limit). Transferrin saturation 44.14% (within range but upper end). Ferritin 41 ng/mL (within range). No iron overload pattern. Isolated mildly elevated serum iron may reflect recent dietary intake or sample timing.\n\nFIB-4 1.51 (above 1.45). All individual liver markers normal. Age-driven calculation. Not clinically significant in this context.\n\nPending results: CA125, CA15-3, CA19-9, bacterial count, and urine culture and sensitivities are to follow. Review when available.\n\nReassuring negatives: hs-CRP 0.8 (no systemic inflammation), HDL 1.9 (excellent), triglycerides 1.32 (healthy), TG/HDL ratio 0.69 (excellent), HbA1c 40 (normal), all liver enzymes clean, kidney function adequate for age, calcium and magnesium normal, PTH normal, urinalysis clean, CEA below 0.5, IgE 5.32 (no allergic activation), coeliac screen negative, rheumatoid factor within range.","recommendations":"1. Book a GP appointment to discuss the Lp(a) result (above 212.5 nmol/L), full lipid panel, and thyroid findings. Bring this report or the specific numbers listed in the flags section.\n\n2. Request first-degree relatives (children, siblings) are tested for Lp(a) given the inherited nature of this finding.\n\n3. Increase dietary soluble fibre to at least 3 grams per day from oats, ground flaxseed, beans, and lentils to support LDL reduction.\n\n4. Eat oily fish (salmon, mackerel, sardines) three times per week for omega-3 and to support the pescatarian protein target of 95 to 105 grams per day.\n\n5. Reduce saturated fat from cheese, butter, and coconut-based products.\n\n6. Begin resistance training two to three times per week, starting with bodyweight exercises or resistance bands if needed, building gradually.\n\n7. Increase daily steps towards 8,000 to 10,000 and add one to two brisk 20 to 30 minute walks on non-training days.\n\n8. Begin sublingual methylcobalamin B12 supplementation at 1,000 mcg daily to bring B12 from 253 towards the optimal range.\n\n9. Begin vitamin D3 supplementation at 2,000 to 3,000 IU daily with a fat-containing meal through autumn and winter.\n\n10. Increase folate-rich foods: dark leafy greens, lentils, chickpeas, asparagus, and broccoli daily.\n\n11. Aim for a calorie intake of 1,450 to 1,600 calories per day with at least 95 to 105 grams of protein to support fat loss while preserving lean mass.\n\n12. Set a fixed wake time, get outside within an hour of waking, cut caffeine after midday, and avoid vaping in the two to three hours before bed to improve sleep.\n\n13. Repeat thyroid panel (TSH, FT4, FT3, TPO antibodies, thyroglobulin antibodies) in three to four months.\n\n14. Repeat fasting glucose, insulin, and C-Peptide in three to four months.\n\n15. Repeat full blood count in eight to twelve weeks to confirm whether WBC and neutrophil levels are Cheryl's baseline.\n\n16. Repeat lipid panel including ApoB after eight to twelve weeks of dietary changes.\n\n17. Follow up on pending CA125, CA15-3, CA19-9, and urine culture results when available.","supplementation":"Vitamin D3: 2,000 to 3,000 IU of cholecalciferol daily, taken with a meal that contains fat to aid absorption. Cheryl's vitamin D at 74 nmol/L is just below the optimal threshold of 75 nmol/L. Through the autumn and winter months when UVB exposure is minimal, this dose will maintain levels in the 80 to 100 nmol/L range. Vitamin D supports bone density, which is particularly important postmenopause when oestrogen-mediated bone protection has been lost, as well as immune function and mood.\n\nVitamin K2: 100 to 200 mcg of the MK-7 form daily, taken alongside vitamin D3. Vitamin K2 directs calcium into bone rather than allowing it to deposit in arterial walls. Given Cheryl's elevated cardiovascular risk markers, this is a sensible companion to vitamin D supplementation.\n\nVitamin B12: 1,000 mcg of sublingual methylcobalamin daily, placed under the tongue and allowed to dissolve. Sublingual delivery bypasses the gut and is more reliable than oral tablets. Cheryl's B12 at 253 pg/mL is well below the optimal range of 500 to 900. On a pescatarian diet, B12 intake is often insufficient because the richest sources are red meat and organ meats. Fish and eggs provide some, but supplementation is the most reliable way to bring levels up. Adequate B12 supports red blood cell formation, nerve function, and energy production, and may help resolve the raised RDW.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. While Cheryl's triglycerides are within range, omega-3 supports the anti-inflammatory side of her cardiovascular picture and may help with the atherogenic burden driven by her Lp(a). It also supports mood and joint health.\n\nMagnesium glycinate: 300 mg before bed. Cheryl's serum magnesium at 0.93 mmol/L is within the optimal range, so this is not correcting a deficiency but supporting sleep quality. Magnesium glycinate has a mild calming effect on the nervous system and may help with her reported insomnia. The glycinate form is well absorbed and least likely to cause digestive discomfort.\n\nFolate: Rather than supplementing, Cheryl should increase dietary folate through daily servings of dark leafy greens, lentils, chickpeas, and broccoli. Her folate at 7 ng/mL is only marginally below the 8 ng/mL optimal threshold, and a genuine improvement in diet quality from 5 towards 7 or 8 out of 10 should close this gap. If after eight weeks of dietary focus folate remains below 8, a methylfolate supplement of 400 mcg daily could be considered.\n\nThe most important changes from this report are not supplements. They are beginning resistance training, improving diet quality and composition to support her lipid profile and B12/folate status, discussing the Lp(a) and thyroid findings with her GP, and addressing the sleep disruption through consistent sleep habits and reduced evening nicotine use. These four actions will do more for Cheryl's energy, body composition, hormonal balance, and long-term cardiovascular health than any supplement can.","biomarkers":[{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"131","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4778","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Cheryl's level at 131 g/L is comfortably within the female reference range of 120 to 150 g/L but slightly below the optimal zone of 125 to 150, though only marginally so. This level is adequate for oxygen delivery and is not a cause for concern.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, heavy menstruation","high_causes":"Dehydration, chronic lung disease, living at high altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"red_blood_count","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6667","units":"x10^12/L","description":"Red blood cells are the cells responsible for carrying oxygen around the body. The count tells us whether the bone marrow is producing an appropriate number. Cheryl's count at 4.42 is well within the reference range and the optimal zone, indicating healthy red cell production.","low_causes":"Anaemia, nutritional deficiency, chronic disease, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.384","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4147","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is made up of red blood cells. Cheryl's haematocrit at 0.384 is within both the reference and optimal ranges, indicating a healthy balance between red cells and plasma.","low_causes":"Anaemia, overhydration, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"15.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8194","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"%","description":"Red cell distribution width measures the variation in size among red blood cells. When all red cells are a uniform size, the RDW is low and healthy. When the body is producing some cells that are larger or smaller than normal, the RDW rises. Cheryl's RDW at 15.1% is above the upper limit of 14%. With a normal MCV (meaning the average cell size is normal), a raised RDW often indicates that some cells are being made smaller or larger than others, which can be an early sign of B12 or folate insufficiency, or mixed nutritional changes, even before full anaemia develops. Given her B12 is below optimal and her folate is borderline, these nutritional factors are the most likely explanation.","low_causes":"Usually not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, liver disease, recent blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"fL","description":"Mean cell volume measures the average size of red blood cells. Cells that are too small may indicate iron deficiency, while cells that are too large can suggest B12 or folate deficiency. Cheryl's MCV at 87 fL is within both the reference and optimal ranges, indicating that her red blood cells are an appropriate average size.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"29.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"pg","description":"Mean cell haemoglobin measures the average amount of haemoglobin inside each red blood cell. Cheryl's MCH at 29.8 pg is within both the reference and optimal ranges, indicating that each red cell is carrying an appropriate amount of the oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"343","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the concentration of haemoglobin within red blood cells. Cheryl's MCHC at 343 g/L is within both the reference and optimal ranges, very close to the upper limit but still within it. This confirms that red cells are appropriately packed with haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact from sample processing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"207","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4026","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that enable blood clotting. Too few can increase bleeding risk, while too many can increase clotting risk. Cheryl's platelet count at 207 is healthy and well within both the reference and optimal ranges.","low_causes":"Viral infection, bone marrow disorders, medications, liver disease, autoimmune conditions","high_causes":"Infection, inflammation, iron deficiency, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4778","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets are typically younger and more active. Cheryl's MPV at 8.4 fL is within both the reference and optimal ranges, indicating normal platelet production and turnover.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Increased platelet destruction, inflammatory conditions, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"white_cell_count","name":"White Cell Count","group":"HEMATOLOGY","result":"3.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3233","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's frontline defence against infection. The total count includes neutrophils, lymphocytes, monocytes, eosinophils, and basophils. Cheryl's WBC at 3.94 is marginally below the lower limit of 4.0. This is being driven by her low neutrophil count. A repeat full blood count in eight to twelve weeks would clarify whether this is her normal baseline or a transient finding.","low_causes":"Viral infection, bone marrow suppression, nutritional deficiency, medications, autoimmune conditions, constitutional variation","high_causes":"Infection, inflammation, stress, smoking, corticosteroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2693","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and are the first responders to bacterial infection. Cheryl's neutrophils at 1.68 are below the lower limit of 2.0. Mild neutropenia like this can be constitutional, meaning it is simply her normal level, or it can reflect nutritional factors, viral infection recovery, or medication effects. Given no medications are reported and no other concerning patterns, this may be her baseline, but it should be confirmed with a repeat test.","low_causes":"Constitutional variation, viral infection, nutritional deficiency, medications, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4817","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including fighting viruses and producing antibodies. Cheryl's lymphocyte count at 1.89 is within both the reference and optimal ranges, indicating a healthy adaptive immune system.","low_causes":"HIV, corticosteroid use, autoimmune conditions, malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, engulfing pathogens and dead cells. Cheryl's monocyte count at 0.3 is within both the reference and optimal ranges.","low_causes":"Bone marrow disorders, corticosteroid use","high_causes":"Chronic infection, inflammatory conditions, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Cheryl's eosinophil count at 0.06 is within range and low, consistent with her very low IgE, indicating no active allergic or parasitic process.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergic reactions, parasitic infection, asthma, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic responses and inflammation. Cheryl's basophils at 0.01 are fractionally below the lower limit of 0.02. At this margin, this is not clinically meaningful and does not require any action.","low_causes":"Acute allergic reaction (transient), hyperthyroidism, corticosteroid use","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_count","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. Their percentage reflects how actively the bone marrow is producing new red cells. Cheryl's reticulocyte count at 1.46% is within both the reference and optimal ranges, indicating healthy and appropriate red cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Recovery from blood loss or anaemia, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"64.532","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4311","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in circulation, which is more reliable than the percentage alone. Cheryl's absolute reticulocyte count at 64.5 is within both the reference and optimal ranges.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression","high_causes":"Recovery from blood loss, haemolytic anaemia, erythropoietin therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2083","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"Erythrocyte sedimentation rate, or ESR, is a general marker of inflammation. It measures how quickly red blood cells settle in a tube of blood over one hour. Faster settling indicates more inflammation. Cheryl's ESR at 5 mm/hour is reassuringly low, well within both the reference and optimal ranges, indicating no significant systemic inflammation.","low_causes":"Not clinically significant when low","high_causes":"Infection, autoimmune disease, malignancy, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"44.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5689","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures how much of the body's iron-carrying protein, transferrin, is loaded with iron. Cheryl's transferrin saturation at 44.14% is within the laboratory reference range of 18 to 55% but above the optimal range of 25 to 40%. This is consistent with her mildly elevated serum iron and likely reflects recent dietary intake or the timing of the blood draw relative to her last meal containing fish or other iron-rich foods. It is not in the range that would suggest iron overload, and her ferritin is not elevated.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Ir iption":"Cystatin C eGFR is an alternative measure of kidney filtration that is not influenced by muscle mass, making it more reliable than creatinine-based eGFR in many people. Cheryl's Cystatin C eGFR of 80 is above the 60 threshold and consistent with her creatinine-based eGFR of 84. At 55, this is an appropriate level and confirms healthy kidney function.","low_causes":"Chronic kidney disease, age-related decline","high_causes":"Thyroid dysfunction can affect cystatin C levels","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"305","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product formed when the body breaks down purines, found naturally in the body and in certain foods including seafood. Cheryl's uric acid at 305 umol/L is within both the laboratory range and the optimal range for women. Given her pescatarian diet includes fish, which can be higher in purines, this healthy level is reassuring.","low_causes":"Low purine diet, medications, liver disease","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered
