<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Pretesh Mistry","dob":"02/11/1983","report_date":"2026-10-08","summary":"Pretesh is a 42-year-old male of South Asian ancestry presenting with a BMI of 21.9, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are about average (volume 5 out of 10). He trains four times per week (one cardio session and three resistance sessions at moderate intensity) with 10,000 to 15,000 daily steps. He sleeps 7 to 8 hours but reports feeling exhausted or waking in the night, with steady energy through the day. Stress feels hard to manage some weeks. He does not drink alcohol. He supplements with vitamin D, vitamin B12, magnesium, omega-3 fish oil, a multivitamin, protein powder, creatine and zinc. A previous blood test returned everything normal. He reports poor sleep and insomnia, low sex drive and libido, and hair thinning and hair loss, all lasting over a year. His goals are to improve sleep quality, build muscle and improve energy levels.\n\nThe finding that needs the most attention in this report is Pretesh's lipoprotein(a), measured at 134.1 nmol/L against a target of below 32. Lipoprotein(a), usually written Lp(a), is a particle produced by the liver that looks a lot like LDL cholesterol but carries an extra protein called apolipoprotein(a) wrapped around it. That extra protein does three things: it deposits cholesterol into artery walls more aggressively than ordinary LDL, it encourages blood clots by interfering with the body's clot-dissolving system, and it promotes inflammation inside arteries. Unlike every other lipid marker in this report, Lp(a) is entirely inherited. Diet, exercise, weight loss and medication do not meaningfully change it. A level of 134.1 places Pretesh in the moderate-risk category (90 to 200), and because it is genetically fixed, this result should be recorded permanently in his medical notes. It also means that his first-degree relatives, parents, siblings and eventually children, should be tested, because they have at least a 50 percent chance of carrying the same trait. This is genuinely important information. It does not mean cardiovascular disease is inevitable, but it does mean the modifiable risk factors around it, ApoB, blood pressure, blood sugar, inflammation, need to be kept as tight as possible because his baseline risk is higher than average.\n\nThat context makes his ApoB result more significant than it would otherwise be. Apolipoprotein B is a protein carried on every LDL, VLDL and Lp(a) particle, and it is the best single measure of how many atherogenic particles are circulating. Pretesh's ApoB is 1.04 g/L, above the 0.9 desirable threshold and above the 0.8 optimal target. His LDL cholesterol at 2.74 mmol/L is within the laboratory range but above the optimal target of 2.6. However, a portion of that LDL is actually Lp(a) being measured alongside it. When the Lp(a) contribution is stripped out, the corrected LDL drops to 2.31 mmol/L, which is a more reassuring number and tells us that the modifiable, diet-and-lifestyle-driven portion of his LDL is reasonably well controlled. His HDL cholesterol at 1.50 is just shy of the desirable threshold of 1.55 and above the 1.04 lower risk boundary, his triglycerides at 1.11 are healthy, his ApoA1 at 1.61 is strong, and his ApoB-to-ApoA1 ratio at 0.65 is below the 0.7 lower-risk threshold. So the lipid picture is a paradox: the overall pattern is healthy and the ratios are good, but the inherited Lp(a) load adds particle burden that shows up in the ApoB. The Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), high-sensitivity CRP and HbA1c, comes in at 55 out of 100. That score is above the 40 threshold almost entirely because of the Lp(a), and this is exactly the kind of case where the score is doing its job: flagging inherited risk that would otherwise be hidden inside an apparently decent lipid panel. At 42, Pretesh's ten-year absolute risk of a cardiovascular event is low because he is young, lean and active, but the gap between that low short-term risk and the elevated lifetime risk is the window for acting. We would recommend discussing this with his GP and asking about a referral to a lipid clinic, where proactive management of ApoB through dietary changes and, if needed, medication can offset the Lp(a) burden over the decades ahead.\n\nHis free thyroxine, known as FT4, is 23 pmol/L, marginally above the upper limit of 22.7. FT4 is the storage form of thyroid hormone produced by the thyroid gland. His TSH, thyroid stimulating hormone, the signal from the brain that tells the thyroid how hard to work, is 0.87 mIU/L, which is within the ideal range and not suppressed. His FT3, the active form of thyroid hormone that cells actually use, is 4.6 pmol/L, comfortably within range. Both thyroid antibody tests, TPO and thyroglobulin, are negative. This pattern, a marginally elevated FT4 with a normal TSH and normal FT3, is not hyperthyroidism; if the thyroid were genuinely overactive the TSH would be suppressed below 0.1. The most likely explanation is normal biological variation or a mild timing effect from the blood draw. His FT3-to-FT4 ratio is 0.20, which sits at the very bottom of the reference range and below the optimal band, suggesting that while the thyroid is producing plenty of T4, conversion to the active T3 could be slightly sluggish. This is worth keeping an eye on at retest but does not need action now.\n\nTurning to the positives, and there are many. Pretesh's metabolic health is excellent. His fasting glucose is 5.0 mmol/L, his HbA1c (a measure of average blood sugar over the past three months) is 39 mmol/mol, and his fasting insulin is 3.8 mIU/L. His HOMA-IR, a calculation that combines glucose and insulin to estimate how sensitive the body is to insulin, is 0.84, well within the optimal range and indicating strong insulin sensitivity. This is particularly reassuring given his South Asian ancestry, which carries a statistically higher risk of insulin resistance and type 2 diabetes; his metabolic machinery is working very efficiently. His C-Peptide, a protein released alongside insulin that confirms how much insulin the pancreas is actually producing, is 0.807 ug/L, which sits below the laboratory range of 1.1 to 4.4. In the context of a normal fasting glucose, a healthy HbA1c and a low-normal insulin, this is not a sign of pancreatic failure. It simply reflects low insulin demand: the pancreas does not need to produce much insulin because his cells respond to it so well. This is a positive finding.\n\nHis liver is in good health. ALT at 48 is within the laboratory range of below 56, though it sits above the optimal target of below 30 for men. AST at 41 is within range. GGT at 22 is comfortably below the optimal threshold of 25, which is about as clean as that marker gets. His FIB-4 score, a calculation that estimates liver scarring using age, platelets, AST and ALT, is 1.13, well below the 1.45 threshold, ruling out any significant fibrosis. The APRI score at 0.47 and the NAFLD Fibrosis Score at minus 3.11 both confirm the same thing: no evidence of liver disease. The ALT at 48 is most likely explained by his resistance training; muscle damage from weight training releases ALT into the bloodstream, and with a creatine kinase of 197 (a direct measure of muscle breakdown, within range), this is the expected pattern in someone lifting three times a week. It is not a concern.\n\nHis lipase at 62 U/L is marginally above the upper limit of 60. Lipase is an enzyme produced by the pancreas to digest fats. At this margin, just two units above range, this is almost certainly normal variation. His amylase, the other pancreatic enzyme, is 88, comfortably within range. There are no symptoms of pancreatic inflammation, and the two results together do not suggest any pathology.\n\nKidney function is solid. His cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, is 0.99 mg/L, and the eGFR calculated from it is 88 mL/min. The creatinine-based eGFR is 84. Both sit just below the optimal threshold of 90 but well above the 60 boundary for concern. At 42 with a lean build and regular training, the creatinine of 96 likely reflects muscle mass pushing the creatinine slightly higher, which makes the cystatin C measure more representative. His urea at 8.4 is marginally above the upper limit of 8.2, which at this margin is most likely explained by his protein intake from the protein powder and his training; urea is a waste product of protein metabolism, and more protein in means more urea out. Uric acid at 191 is below the lower limit of 220. Uric acid is a waste product from purine metabolism, and a low level in a lean, non-drinking man with good kidney function is usually simply a reflection of low dietary purine intake and efficient clearance. It is not a clinical concern.\n\nHis inflammation markers are excellent. High-sensitivity CRP, the most sensitive marker of systemic inflammation, is below 0.5 mg/L, which is as low as the assay can read and is genuinely ideal. His ESR at 2 is negligible. The Systemic Immune-Inflammation Index at 165 and the Platelet-to-Lymphocyte Ratio at 111.7 both sit within optimal ranges. There is no inflammatory signal in this blood.\n\nIron studies are well balanced. Ferritin at 106 ng/mL is comfortably within the optimal range of 50 to 200 for men, serum iron at 28 is strong, transferrin at 3.16 and iron binding capacity at 58.6 are both healthy, and transferrin saturation at 35.3 percent sits within the ideal 25 to 40 percent band. His body is storing and transporting iron exactly as it should.\n\nVitamin D at 87 nmol/L is sufficient and above the 75 threshold for optimal. Given that he supplements with vitamin D, this confirms the supplementation is working. His B12 at 555 pg/mL is within the optimal range, reflecting his B12 supplementation. Folate is reported as above 24 ng/mL, which is above the laboratory upper limit of 17. Elevated folate in a man taking a multivitamin is expected and not harmful; the body excretes what it does not need. His Total Antioxidant Activity at 2.07 is above the range of 1.3 to 1.77, which is driven by his supplementation with multivitamins, omega-3 and zinc. This is not a concern.\n\nHis full blood count shows a pattern that deserves attention. His white cell count at 3.81 is below the lower limit of 4.0, his neutrophils at 1.48 are below the lower limit of 2.0, and his monocytes at 0.18 are marginally below the lower limit of 0.2. This is a pattern of mild leucopenia (low total white cells) with neutropenia (low neutrophils specifically). In a man of South Asian ancestry, this has a very common and benign explanation: Benign Ethnic Neutropenia, sometimes called constitutional neutropenia. It is present in up to 25 to 50 percent of people of African, Middle Eastern and South Asian descent. The bone marrow produces a normal number of neutrophils but holds a smaller proportion of them in the circulating blood, keeping them in the bone marrow reserve instead. The immune system functions normally; the cells are there when needed, they are just not all circulating at the time of the blood draw. His lymphocytes at 1.97 are healthy, confirming the adaptive immune system is intact. His previous blood test returned everything as normal, so if that also showed low white cells it would further support this being his constitutional baseline. That said, the low absolute reticulocyte count at 43.3, below the lower limit of 50, adds a mild note. Reticulocytes are young red blood cells freshly released from the bone marrow. A low count can suggest the bone marrow is producing red cells a little slowly. His haemoglobin at 149, red cell count at 5.09 and haematocrit at 0.434 are all healthy, so there is no anaemia. The reticulocyte percentage at 0.85 percent is within range. The most likely explanation is that his bone marrow is producing red cells at a steady but unhurried pace because there is no demand for more; he is not losing blood and his iron is excellent. Combined with the ethnic neutropenia pattern, this is consistent with a bone marrow that is functioning normally but running conservatively. His MPV at 11.6 is above the upper limit of 10.1. MPV, mean platelet volume, measures the average size of platelets. Larger platelets are younger and more active. A raised MPV alongside a normal platelet count of 220 is common and usually reflects the bone marrow producing slightly larger, fresher platelets. It is not clinically significant in isolation.\n\nHis hormones are where the symptoms start to find some explanation. Testosterone at 14.8 nmol/L is within the laboratory range of 8.4 to 28.7 and above the recommended minimum of 12, but it sits below the optimal range of 18 to 30 for a man of his age. His SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues, is 22.8 nmol/L, which is below the optimal range of 25 to 55 but within the laboratory range. A low SHBG means a higher proportion of his testosterone is free and bioavailable, which partially compensates for the below-optimal total. His free testosterone at 0.354 nmol/L and bioavailable testosterone at 8.84 nmol/L are both within range. His free androgen index at 64.9 is healthy. So while the total testosterone is not critically low, it is in the lower third of where a 42-year-old would ideally sit, and this is a plausible contributor to his low libido and could also slow muscle-building progress. His DHEA-S at 8.4 umol/L (3,095 ug/dL) is healthy, his cortisol at 257 nmol/L is within the morning reference range, his LH at 2.27 and FSH at 4.73 are both within range, suggesting the pituitary is not driving the testes harder, which is consistent with the testosterone being in a range the brain considers acceptable even if it is not optimal. Oestradiol at 94 pmol/L is within range, and prolactin at 240 uIU/mL is normal.\n\nThe hair thinning Pretesh reports is worth addressing directly. His blood results do not reveal a nutritional cause: iron, ferritin, zinc (he supplements), thyroid function, testosterone and vitamin D are all adequate. In a 42-year-old man, the most common cause of progressive hair thinning is androgenetic alopecia, male pattern hair loss, which is driven by the sensitivity of hair follicles to dihydrotestosterone (DHT) rather than by any abnormal blood marker. This is genetic and would not show up on a blood test. If it is a concern, a dermatologist or GP can assess the pattern and discuss options.\n\nPretesh's poor sleep and insomnia are the symptoms that matter most to him, and the bloods do not point to a single hormonal or metabolic cause. His thyroid is essentially normal, his cortisol is not elevated, his blood sugar and insulin are excellent, his magnesium is within the optimal range, and his iron is strong. What the blood has positively excluded is valuable: there is no thyroid dysfunction driving sleep disruption, no blood sugar instability causing night waking, no iron deficiency causing restless legs, and no inflammatory signal suggesting pain or illness interrupting sleep. The causes most likely to explain his pattern, exhausted on waking despite 7 to 8 hours in bed, are ones that blood cannot measure: sleep architecture (how much deep and REM sleep he gets versus light sleep), sleep-disordered breathing (even at a lean BMI, positional or structural factors can cause mild apnoea), evening screen exposure and blue light, stress and rumination before bed, caffeine timing (even moderate intake after midday can fragment sleep), and bedroom environment. His quiz reports that stress feels hard to manage some weeks, and his energy pattern is steady through the day, which suggests his circadian rhythm is not grossly disrupted but the sleep itself is not restorative. A sleep study, either a home-based screening device or a formal polysomnography, would be the most useful next investigation if the lifestyle changes below do not resolve things within two to three months.\n\nHis PhenoAge, a biological ageing score built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 29.3 years against his calendar age of 42, making him nearly thirteen years younger biologically. This is an excellent result and reflects his lean body composition, low inflammation, strong metabolic health and active lifestyle. The low CRP and healthy glucose are the biggest contributors to this favourable score.\n\nHis prostate markers are reassuring. PSA at 0.97 is well below the 2.5 threshold, with a free PSA ratio of 0.63, which is strongly reassuring. Tumour markers CA19-9 at 1.96 and CEA at 1.97 are both well within range. Immunoglobulins IgG, IgM, IgA and IgE are all within their respective ranges, rheumatoid factor is negative, and coeliac screening via tissue transglutaminase IgA is negative. His urinalysis is entirely clear.\n\nPotassium and phosphate were not returned by the laboratory because the required SST sample tube was not received. HbA1c in percentage format was similarly not returned as the EDTA tube was not received, though the HbA1c in mmol/mol was processed from a different sample. These missing markers do not materially change the clinical picture, as the available results cover the same ground, but potassium should be included at retest.\n\nIn summary, Pretesh is a lean, active, metabolically healthy 42-year-old with an excellent biological age. The two findings that need action are the inherited Lp(a) elevation, which should be recorded permanently and discussed with a lipid-aware GP, and the below-optimal testosterone, which is a modifiable contributor to his low libido and may respond to the sleep and lifestyle adjustments below. The white cell pattern is almost certainly Benign Ethnic Neutropenia. The sleep difficulty is not explained by any blood marker, and the next step is to optimise sleep hygiene and consider a sleep study if symptoms persist.","links":"The central thread in Pretesh's results is an inherited cardiovascular risk factor sitting inside an otherwise enviable metabolic profile. His Lp(a) at 134.1 nmol/L is the single marker that elevates his Cardiovascular Risk Score to 55, because everything else, his triglycerides, HDL, CRP, HbA1c and the ratios built from them, is either ideal or close to it. The Lp(a) also inflates his ApoB to 1.04 because every Lp(a) particle carries an ApoB molecule, so the particle count looks higher than the modifiable portion alone would produce. When the Lp(a) contribution is subtracted, his corrected LDL drops to 2.31, which is within the optimal range. This means the dietary and lifestyle-driven component of his lipid risk is well controlled, and the excess comes from a genetic source he cannot change. That distinction matters because it determines the strategy: the goal is not to overhaul his diet, which is already producing a healthy lipid pattern, but to keep every modifiable risk factor as low as possible so that the fixed Lp(a) burden has the least possible impact over decades.\n\nThe second thread connects his symptoms. His testosterone at 14.8 is not low enough to explain dramatic symptoms, but it is below the optimal band of 18 to 30, and in a man whose primary complaints are low libido and difficulty building muscle, it is a plausible contributor. His SHBG at 22.8 is on the low side, which means a higher fraction of his testosterone is free, partially compensating, but the total pool is still modest. The most effective lever for nudging testosterone upward without medication is sleep quality, and this is where his symptoms converge: poor, unrestorative sleep suppresses overnight testosterone production, and low testosterone in turn impairs sleep architecture. It is a feedback loop, and breaking it at the sleep end, through the environmental and behavioural changes outlined in the lifestyle section, is the most direct route to improvement in both symptoms.\n\nThe full blood count pattern, low total white cells, low neutrophils, low monocytes and low absolute reticulocytes, looks concerning in isolation but is almost entirely explained by his South Asian ancestry. Benign Ethnic Neutropenia is a well-documented constitutional variant. The bone marrow is functioning normally, as demonstrated by healthy haemoglobin, a normal platelet count and intact lymphocytes. The low reticulocyte absolute count fits the same picture: the marrow is not stressed and is producing red cells at a pace that matches demand, not exceeding it. No intervention is needed, but the pattern should be noted on his medical record so that future clinicians do not investigate it unnecessarily.\n\nThe marginally elevated FT4 at 23 with a normal TSH and normal FT3 is a loose end that is almost certainly insignificant. The antibodies are negative, the TSH is not suppressed, and the FT3 is adequate. The low FT3-to-FT4 ratio of 0.20, sitting at the floor of the reference range, hints that peripheral conversion from T4 to T3 could be mildly sluggish. Selenium, zinc and adequate calorie intake support this conversion, and Pretesh is already supplementing zinc. This is worth rechecking at the six-month retest but does not require action now.\n\nFinally, what was excluded is as important as what was found. His fasting glucose, HbA1c, insulin and HOMA-IR comprehensively rule out insulin resistance and early diabetes, which is particularly valuable information for a man of South Asian ancestry. His liver enzymes, fibrosis scores and GGT rule out fatty liver disease. His iron panel rules out deficiency and overload. His inflammatory markers rule out any chronic inflammatory process. His thyroid antibodies rule out autoimmune thyroid disease. His coeliac screen is negative. His PSA and tumour markers are clear. These exclusions narrow the field for his symptoms and confirm that his body is fundamentally healthy.","lifestyle":"Fix your sleep environment first: set your bedroom to 16 to 18 degrees, use blackout curtains or a sleep mask, and put your phone on charge outside the bedroom by 9:30 pm. Anchor: plug the phone in at the same spot every night as part of brushing your teeth. Why: blue light and scrolling are the most common causes of fragmented sleep, and your blood shows no metabolic or hormonal reason for poor sleep, which means the answer is almost certainly environmental or behavioural.\nSet a fixed wake time seven days a week, even weekends, and get outside within 30 minutes of waking for at least 10 minutes. Anchor: alarm goes off, shoes go on. Why: morning light resets the circadian clock and improves both sleep onset and sleep depth the following night, which is the single best intervention for the unrestorative sleep you describe.\nCut caffeine after midday, completely. If you currently drink coffee in the afternoon, switch to decaf or herbal tea. Why: caffeine has a half-life of five to six hours, so a 2 pm coffee still has a quarter of its stimulant effect at 10 pm, enough to fragment deep sleep without you realising.\nAdd a second portion of oily fish per week (salmon, mackerel, sardines) and increase vegetables to 4 to 5 portions a day, starting by adding one portion to your evening meal. Why: omega-3 from food (alongside your supplement) supports ApoB reduction, and higher vegetable intake provides the fibre, potassium and magnesium that support both cardiovascular and sleep health.\nIncrease daily protein to 115 to 130 grams, spread across three meals, aiming for 30 to 40 grams per meal. You are already using protein powder, so use it to top up whichever meal falls short. Why: at 71 kg training three times a week, 1.6 to 1.8 g per kg is the range that supports muscle protein synthesis, and a below-optimal testosterone means your margin for error is smaller.\nAdd 10 grams of soluble fibre per day: a bowl of oats at breakfast (3 g), a tablespoon of ground flaxseed on lunch (2 g), and a portion of beans, lentils or chickpeas at dinner (4 to 5 g). Anchor: build into existing meals rather than adding new ones. Why: soluble fibre directly lowers ApoB and LDL by binding bile acids in the gut, which is the most effective dietary lever for the modifiable portion of your cholesterol.\nMaintain your current calorie intake at roughly 2,300 to 2,500 kcal per day (your TDEE at moderate activity is approximately 2,450). You do not need to lose weight; your BMI of 21.9 is ideal. If you are trying to add muscle, a modest surplus of 200 to 300 kcal above maintenance on training days, focused on protein and complex carbohydrates, will support that without adding unnecessary fat.\nContinue your current resistance training at three sessions per week and consider adding a second cardio session, even a brisk 30-minute walk, to support cardiovascular health given the Lp(a) finding. Anchor: the day after a rest day. Why: regular aerobic exercise improves endothelial function and HDL, both of which help offset the Lp(a) burden.","flags":"Lp(a) 134.1 nmol/L, above the 32 nmol/L threshold, placing him in the moderate-risk category (90 to 200). This is inherited, permanent and unchangeable by lifestyle. It should be recorded in his permanent medical notes and first-degree relatives should be tested. Combined with ApoB 1.04 g/L (above the 0.9 target), the cardiovascular particle burden is elevated. The Cardiovascular Risk Score is 55 out of 100, driven almost entirely by the Lp(a). The Lp(a)-corrected LDL of 2.31 confirms the modifiable portion of LDL is within optimal range.\nApoB 1.04 g/L, above the 0.9 desirable threshold and above the 0.8 optimal target. Partly inflated by the Lp(a) particle burden. TC/HDL ratio 3.13 and ApoB/A1 ratio 0.65 are both within range. Triglycerides 1.11 and HDL 1.50 are healthy. The dietary-driven lipid pattern is reasonable but ApoB should be pushed below 0.9 through soluble fibre, oily fish and, if needed, pharmacological discussion given the Lp(a) context.\nFT4 23 pmol/L, marginally above the upper limit of 22.7 with TSH 0.87 (not suppressed), FT3 4.6 (within range) and both antibodies negative. FT3:FT4 ratio 0.20, at the floor of the reference range. Not consistent with hyperthyroidism. Most likely normal variation. Recommend repeating at six-month retest.\nTestosterone 14.8 nmol/L, within the laboratory range (8.4 to 28.7) but below the optimal band of 18 to 30. SHBG 22.8 nmol/L (below optimal 25 to 55). Free testosterone 0.354 nmol/L and bioavailable testosterone 8.84 nmol/L both within range. A plausible contributor to low libido. Optimising sleep quality is the most effective non-pharmacological lever.\nWhite cell count 3.81 x10^9/L (below 4.0), neutrophils 1.48 x10^9/L (below 2.0), monocytes 0.18 x10^9/L (below 0.2). In a man of South Asian ancestry, this is most likely Benign Ethnic Neutropenia, a constitutional variant affecting up to 25 to 50 percent of this population. Lymphocytes 1.97 are healthy. Should be noted on his medical record.\nAbsolute reticulocytes 43.3 x10^9/L, below the lower limit of 50. Haemoglobin 149, RBC 5.09 and haematocrit 0.434 are all healthy. Reticulocyte percentage 0.85 is within range. The marrow is producing red cells at a steady pace with no demand for more. Not clinically significant in isolation but consistent with the conservative bone marrow output pattern seen with ethnic neutropenia.\nMPV 11.6 fL, above the upper limit of 10.1. Normal platelet count of 220. A raised MPV with normal platelets is common and reflects younger, larger platelets. Not clinically significant.\nUrea 8.4 mmol/L, marginally above the upper limit of 8.2. Most likely reflects protein intake (protein powder and resistance training). Kidney function is otherwise normal.\nUric acid 191 umol/L, below the lower limit of 220. In a lean, non-drinking man with healthy kidney function, this reflects low purine intake and efficient clearance. Not a clinical concern.\nC-Peptide 0.807 ug/L (267 pmol/L), below the laboratory range of 1.1 to 4.4. In the context of normal glucose (5.0), healthy HbA1c (39) and low-normal insulin (3.8), this reflects low insulin demand rather than pancreatic insufficiency. Positive finding.\nLipase 62 U/L, marginally above the upper limit of 60. Amylase 88 is within range. No symptoms of pancreatitis. Normal variation at this margin.\nFolate above 24 ng/mL, above the laboratory upper limit of 17. Expected with multivitamin supplementation. Not harmful.\nTotal Antioxidant Activity 2.07 mmol/L, above the range of 1.3 to 1.77. Expected with multiple antioxidant supplements. Not harmful.\nPotassium and phosphate were not returned by the laboratory (SST tube not received). Should be included at retest.\nReassuring negatives: fasting glucose 5.0, HbA1c 39, HOMA-IR 0.84 and insulin 3.8 comprehensively exclude insulin resistance and diabetes. CRP below 0.5, ESR 2 and SII 165 exclude systemic inflammation. GGT 22, FIB-4 1.13, APRI 0.47 and NAFLD score minus 3.11 exclude liver disease. Ferritin 106, transferrin saturation 35.3 percent exclude iron deficiency and overload. TSH 0.87 with negative antibodies excludes autoimmune thyroid disease. tTG IgA negative excludes coeliac disease. PSA 0.97 with free ratio 0.63 excludes prostate concern. CA19-9 1.96 and CEA 1.97 are clear. Urinalysis entirely normal. PhenoAge 29.3, thirteen years younger than calendar age.","recommendations":"Record the Lp(a) result of 134.1 nmol/L permanently in his medical notes and discuss referral to a lipid clinic. Lp(a) is inherited, fixed and lifelong. First-degree relatives (parents, siblings, future children) should be tested.\nDiscuss ApoB of 1.04 g/L with the GP in the context of the Lp(a). The modifiable LDL (corrected to 2.31) is reasonable, but the combined particle burden from Lp(a) plus LDL means the GP may consider statin therapy or PCSK9 inhibitor discussion, particularly as PCSK9 inhibitors are one of the few agents that can lower Lp(a) modestly (20 to 30 percent).\nNote the white cell pattern (WBC 3.81, neutrophils 1.48, monocytes 0.18) on his medical record as probable Benign Ethnic Neutropenia given South Asian ancestry. No investigation needed unless he develops recurrent infections.\nRepeat FT4 at the six-month retest to confirm the marginally elevated result of 23 is stable and not trending upward. Include a full thyroid panel (TSH, FT4, FT3).\nIf poor sleep persists after three months of the environmental and behavioural changes in the lifestyle section, consider a home sleep study to exclude mild obstructive sleep apnoea or upper airway resistance syndrome.\nIf low libido persists after sleep quality improves, request a repeat early-morning testosterone with SHBG to reassess whether the below-optimal level of 14.8 has responded to better sleep. If it has not, discuss further investigation or a trial of intervention with the GP.\nRetest in six months with the following markers: full lipid panel including ApoB and Lp(a) (to confirm the baseline), full thyroid panel (TSH, FT4, FT3), testosterone and SHBG (early morning), full blood count (to confirm the ethnic neutropenia pattern is stable), potassium and phosphate (not returned this time), and fasting glucose, insulin and HbA1c. Target daily intake: approximately 2,300 to 2,500 kcal with 115 to 130 grams of protein per day.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 IU daily with a fat-containing meal. His level of 87 nmol/L is within the optimal range, so the current dose is maintaining it well. Pair with vitamin K2 (MK-7) 100 mcg daily if not already in his multivitamin, as K2 directs the calcium that vitamin D helps absorb into bones rather than arteries.\nContinue vitamin B12 as sublingual methylcobalamin 1,000 mcg daily. His level of 555 pg/mL is within the optimal range, confirming the supplementation is effective.\nContinue magnesium glycinate 300 to 400 mg, taken 30 to 60 minutes before bed. His serum magnesium at 1.0 mmol/L is within the optimal range, so this is maintaining a good level. Glycinate form also has a mild calming effect that may support his sleep quality.\nContinue omega-3 fish oil at 2 to 3 grams of combined EPA and DHA daily, taken with a meal. Given his elevated Lp(a) and ApoB, omega-3 supports anti-inflammatory and mild triglyceride-lowering effects. It will not lower Lp(a) but helps maintain the healthy inflammatory and triglyceride profile that offsets it.\nContinue zinc at 15 to 25 mg daily (as zinc picolinate or citrate), taken with food to avoid nausea. His thyroid conversion (FT3:FT4 ratio at the floor of range) benefits from adequate zinc, and zinc also supports testosterone production.\nContinue creatine monohydrate at 3 to 5 grams daily. It supports his muscle-building goal and has no adverse interaction with any of his results.\nConsider adding selenium 100 to 200 mcg daily (as selenomethionine) if not already in his multivitamin. Selenium supports the conversion of T4 to T3, and his FT3:FT4 ratio of 0.20 at the floor of the range suggests conversion could benefit from support.\nDo not add iron. His ferritin at 106, serum iron at 28 and transferrin saturation at 35 percent are all ideal. Additional iron would risk pushing stores above optimal.\nThe most important changes from this report are not supplements. They are fixing the sleep environment to address his unrestorative sleep, adding soluble fibre to lower ApoB, and recording the Lp(a) finding with his GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":""," ding HIV), steroid use, stress, autoimmune disease","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf pathogens and dead cells and help bridge the innate and adaptive immune systems. Pretesh's monocyte count of 0.18 is marginally below the lower limit of 0.2. At this margin, and in the context of the Benign Ethnic Neutropenia pattern affecting other white cell lines, this is likely part of the same constitutional variant. It is not clinically significant.","low_causes":"Benign Ethnic Neutropenia, bone marrow suppression, steroid use","high_causes":"Chronic infection, chronic inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4028","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Pretesh's level of 0.12 is within the ideal range, showing no evidence of an active allergic or parasitic process.","low_causes":"Steroid use, acute stress","high_causes":"Allergy, asthma, parasitic infection, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"nor estyle, smoking, obesity, high carbohydrate diet, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4573","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL cholesterol is the form of cholesterol most associated with plaque build-up in arteries. Pretesh's LDL at 2.74 mmol/L is within the laboratory range of below 3.0 but above the optimal target of below 2.6. However, a portion of this LDL measurement includes Lp(a) particles. When Lp(a) is subtracted, the corrected LDL drops to 2.31, which is below optimal, confirming that the modifiable, lifestyle-driven component of his LDL is well controlled.","low_causes":"Low saturated fat diet, statin medication, hyperthyroidism","high_causes":"High saturated fat diet, genetics, hypothyroidism, obesity, Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3478","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. A lower number is better. Pretesh's ratio of 3.13 is well within the ideal range, reflecting a healthy balance between protective HDL and total cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7978","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7000","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the total cholesterol is the protective kind. Pretesh's result of 31.9 percent is above the 20 percent minimum and within the ideal range, confirming a healthy cholesterol composition.","low_causes":"Low HDL, high LDL or triglycerides","high_causes":"High HDL, low total cholesterol, exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.9","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3625","units":"mmol/L","description":"Non-HDL cholesterol is the total cholesterol minus the protective HDL, capturing all the potentially atherogenic cholesterol fractions. Pretesh's non-HDL at 3.2 mmol/L is within the laboratory range of below 4.0 but above the optimal target of below 2.9. The elevation is partly driven by Lp(a) particles being counted in the total. The modifiable component, reflected in the corrected LDL of 2.31, is well controlled.","low_causes":"Low LDL, healthy diet, medication","high_causes":"High LDL, high Lp(a), high triglycerides, poor diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6708","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL cholesterol and drives its protective function of removing cholesterol from artery walls. Pretesh's ApoA1 at 1.61 g/L is above the 1.2 desirable threshold and within the ideal range, confirming healthy HDL function.","low_causes":"Smoking, sedentary lifestyle, metabolic syndrome, genetic factors","high_causes":"Exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein carried on every LDL, VLDL and Lp(a) particle. Each of these particles carries exactly one ApoB molecule, making it the best single measure of the total number of atherogenic particles in the blood. Pretesh's ApoB at 1.04 g/L is above the 0.9 desirable threshold and above the 0.8 optimal target. This is partly driven by his elevated Lp(a), which adds extra ApoB-carrying particles that cannot be reduced by diet or lifestyle. The goal is to bring the modifiable ApoB (from LDL and VLDL) as low as possible to offset the fixed Lp(a) contribution.","low_causes":"Low LDL, statin therapy, healthy diet","high_causes":"High LDL, elevated Lp(a), high triglycerides, familial hypercholesterolaemia, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.646","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4614","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (harmful) to the number of protective HDL particles. Pretesh's ratio of 0.646 is below the 0.7 lower-risk threshold but above the optimal target of below 0.6. The healthy ApoA1 is partially offsetting the elevated ApoB. This ratio is one of the best summary measures of cardiovascular lipid risk.","low_causes":"High HDL function, low LDL, healthy lifestyle","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"134.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"2.0953","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined lipoprotein particle similar to LDL but with an additional protein called apolipoprotein(a). It deposits cholesterol in artery walls, promotes blood clotting and drives inflammation. Unlike all other lipid markers, Lp(a) is entirely inherited and cannot be meaningfully changed by diet, exercise or most medications. Pretesh's Lp(a) at 134.1 nmol/L is well above the 32 nmol/L threshold, placing him in the moderate-risk category (90 to 200). This result should be recorded permanently in his medical notes, and his first-degree relatives should be tested.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited), cannot be changed by lifestyle or most medication","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"197","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5202","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found in muscle tissue that is released into the blood when muscle fibres are damaged, such as after resistance training. Pretesh's CK at 197 U/L is within the ideal range for a man doing regular resistance training. This confirms normal exercise-related muscle turnover without excessive damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, rhabdomyolysis, muscle injury, statin medication, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6101","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6111","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. Pretesh's serum iron at 28 umol/L is within the ideal range, confirming healthy iron availability for red blood cell production and energy metabolism.","low_causes":"Iron deficiency, chronic disease, malabsorption, vegetarian diet","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.16","within_normal":"TRUE","within_optimal":"TR owest possible level. His fasting glucose and insulin are both excellent, so this is not a concern.","low_causes":"Low carbohydrate diet, excellent insulin sensitivity","high_causes":"High sugar or refined carbohydrate intake, insulin resistance, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3554","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4129","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check while fasting. A lower number indicates better insulin sensitivity. Pretesh's insulin at 3.8 mIU/L is within the optimal range of 2.6 to 8, indicating excellent insulin sensitivity. His pancreas barely needs to produce insulin to maintain a normal blood sugar, which is the hallmark of metabolic health.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, obesity, high sugar diet, pre-diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.807","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1472","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5079","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin, making it a reliable measure of how much insulin the body is actually producing. Pretesh's C-Peptide at 0.807 ug/L (equivalent to approximately 267 pmol/L) is below the laboratory range of 1.1 to 4.4. However, in the context of a normal fasting glucose of 5.0, a healthy HbA1c of 39 and a low-normal insulin of 3.8, this simply reflects low insulin demand. The pancreas is producing exactly as much insulin as a highly insulin-sensitive body requires. This is a positive finding, not a sign of pancreatic failure.","low_causes":"Low insulin demand (insulin sensitivity), type 1 diabetes, fasting","high_causes":"Insulin resistance, insulinoma, type 2 diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting glucose measures the level of sugar in the blood after an overnight fast. Pretesh's glucose at 5.0 mmol/L is within the ideal range of 4.0 to 5.4, confirming excellent blood sugar regulation. Combined with his low insulin and healthy HOMA-IR, this shows his body manages blood sugar very efficiently.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Pre-diabetes, diabetes, stress, steroid use, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2215","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average is not suppressed, which means the pituitary gland does not believe the thyroid is overactive. Both thyroid antibodies are negative. This is most likely normal biological variation rather than early hyperthyroidism, but it should be rechecked at the six-month retest.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, early thyroiditis, medication (levothyroxine, amiodarone), normal variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3419","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3686","upper_optimal_position":"0.4736","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. A high TSH means the thyroid is underperforming and needs more stimulation; a very low TSH means the thyroid is overproducing. Pretesh's TSH at 0.87 mIU/L is within the laboratory range but just below the optimal band of 1.0 to 2.5. In the context of a marginally elevated FT4, this is consistent: the pituitary has slightly eased off its signal because it detects enough thyroid hormone. It is not suppressed and does not suggest hyperthyroidism.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroid autoimmunity, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5148","upper   if (b.within_normal === 'FALSE') return 'flag';

function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
