<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Nicola Eve","dob":"18/10/1971","report_date":"2026-10-01","summary":"Nicola is a 54-year-old post-menopausal female presenting with a BMI of 22, following a standard mixed diet, eating 6+ portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She trains four times per week (two cardio, two resistance) at hard intensity, with 7,500 to 10,000 daily steps. She sleeps 6 to 7 hours and is slow to get going on waking, with energy described as tired on waking. Stress feels hard to manage some weeks. She drinks 1 to 4 alcoholic drinks per week and takes HRT. She has a previous blood test in which everything was classified as normal, though she notes that kidney function was below ideal. She reports joint pain and stiffness and feeling cold, or cold hands and feet, both lasting over a year. Her goals are to lose body fat, build muscle, and improve energy levels.\n\nNicola's cardiovascular risk is the central finding in this report. Her ApoB, which is the protein carried by every LDL particle and the single best measure of the number of cholesterol-carrying particles in the bloodstream, is 1.29 g/L, well above the 0.9 threshold and classified as high. Her LDL cholesterol is 3.98, above the 3.0 upper limit. Her non-HDL cholesterol, which captures all the atherogenic lipoproteins, is 4.4 against a limit of 4.0. And her Lp(a), a genetically inherited lipoprotein that deposits cholesterol into artery walls, encourages clotting, and drives inflammation, is 68.8 nmol/L against a target of below 32. Lp(a) is entirely genetic, cannot be changed by diet or exercise, and should be recorded as a permanent part of her medical record. Because it is inherited, her first-degree relatives (children, siblings, parents) should also be tested. The Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) particles to show what is modifiable, is 3.76, which means the vast majority of her elevated LDL is still driven by conventional LDL particles and is therefore responsive to dietary change. Her TrueVitals Cardiovascular Risk Score, a composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 45 out of 100, above the 40 threshold. The score carries no age term: it measures the risk being accumulated in the artery walls right now, regardless of age, which means a high score in someone with a low short-term event risk is the window in which acting makes the greatest difference.\n\nThe good news within this lipid picture is significant. Her HDL cholesterol is 2.2, which is excellent and strongly protective. HDL particles carry cholesterol away from artery walls back to the liver for disposal, and a level this high partially offsets the elevated LDL. Her triglycerides are 1.08, well within the healthy range, showing that her body is handling dietary fats efficiently. Her ApoA1, the protein on HDL particles, is 1.99, which is strong. The ApoB to ApoA1 ratio at 0.65 falls into the average risk category rather than higher risk, precisely because the HDL side is so powerful. Her atherogenic index of plasma is negative at minus 0.309, which is optimal. The TC to HDL ratio is 3.0, comfortably below 4.5. So the picture is not one of global lipid dysfunction; it is elevated LDL and ApoB, amplified by inherited Lp(a), sitting alongside genuinely protective HDL. The strategy is to bring the LDL down without disturbing the HDL, and diet is the primary lever for that.\n\nHer blood sugar and insulin metabolism are in excellent shape. Fasting glucose is 4.7, HbA1c is 36 mmol/mol, fasting insulin is 3.63, and HOMA-IR, the index that estimates how resistant the body's cells are to insulin, is 0.76, which is optimal. This means her cells respond efficiently to insulin and her pancreas is not working hard to maintain blood sugar. Her C-Peptide, a marker the pancreas releases alongside insulin that reflects how much insulin is being produced, is 0.763 ug/L (252.5 pmol/L), below the laboratory range of 1.1 to 4.4, but in the context of normal glucose, normal HbA1c and a low-normal insulin, this simply reflects low insulin demand rather than pancreatic failure. Her body is insulin-sensitive, so the pancreas does not need to produce much. This is a positive finding.\n\nHer liver is healthy. ALT, the enzyme most specific to liver cell damage, is 14, well within range. GGT, which rises with metabolic strain, alcohol exposure, or bile duct obstruction, is 34 against a female upper limit of 38, within the laboratory range though above the ideal of 25. AST is 27. The APRI score, which estimates liver scarring from AST and platelets, is 0.213, well within the healthy range. The NAFLD fibrosis score, which estimates the probability of significant liver fibrosis from age, BMI, diabetes status, platelets and liver enzymes, is minus 2.989, firmly in the low-risk category. FIB-4, a similar fibrosis index, is 1.23, below the 1.45 threshold. The De Ritis ratio (AST to ALT) is 1.93, above the 1.6 upper limit, but this is being driven entirely by the very low ALT of 14. When ALT is this low, the ratio inflates without signifying liver pathology. The clean GGT, excellent APRI and reassuring NAFLD score confirm the liver is in good health. Albumin at 48 is strong, reflecting good liver synthetic function and adequate protein intake. Total protein at 77 and globulin at 29 are both well placed.\n\nHer kidney function is the area she specifically flagged as below ideal on her previous test, and the picture here is worth discussing carefully. Her creatinine-based eGFR is 74, and the cystatin C-based eGFR, which is more reliable because cystatin C is unaffected by muscle mass, diet and exercise, is 79. The combined creatinine plus cystatin C eGFR is also 79. All three are above 60, which means kidney function is not impaired, but all three sit below the 90 threshold that defines fully optimal function. At 54, some decline from the peak eGFR of youth is physiological, and the usual rate of loss is roughly 1 mL/min per year from the mid-30s, so an eGFR in the high 70s is not unusual at this age. However, the consistency of the finding across two tests and two different methods means it is genuine and not a measurement artefact. We would recommend she mentions this to her GP, not because treatment is needed now, but because establishing a documented baseline means any future decline can be tracked. Simple measures that protect kidney function, adequate hydration, maintaining healthy blood pressure, and avoiding chronic NSAID use, are all worth reinforcing. Her urea at 7.8 is close to the upper limit of 8.2, and the urea to creatinine ratio at 100 is at the upper boundary, which can reflect mild dehydration at the time of sampling, higher protein intake, or simply the reduced clearance rate. Uric acid at 236 is comfortably within range. Cystatin C itself at 0.99 is just below the 1.1 upper limit.\n\nHer electrolytes are well balanced. Sodium is 140, chloride 98, bicarbonate 23.8, and magnesium is 0.97, right in the middle of the optimal band. Phosphate at 1.6 is just inside the upper limit of 1.65. Potassium at 5.0 is within the laboratory range of 3.5 to 5.3 but sits in the upper quarter, and the lab notes that potassium can rise in delayed or unseparated samples. In the absence of any kidney disease or potassium-sparing medication, this is most likely a sample effect and not clinically significant, but it is worth rechecking on future bloods. Corrected calcium at 2.34 and PTH at 1.6 are both well within range, confirming healthy calcium metabolism and parathyroid function.\n\nHer thyroid is functioning but not optimally. TSH, the hormone the pituitary gland sends to the thyroid to tell it how hard to work, is 2.85, within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. Free T4, the storage form of thyroid hormone, is 18 pmol/L, sitting nicely within the optimal band. Free T3, the active form that every cell uses for energy and temperature regulation, is 4.1, within the laboratory range of 2.6 to 7.1 but below the optimal floor of 4.5. The FT3 to FT4 ratio is 0.228, just inside the lower boundary of 0.2, confirming that conversion from the storage hormone to the active hormone is at the low end. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease (Hashimoto's). This pattern, a TSH creeping above ideal with a FT3 below optimal, can contribute to the symptoms Nicola reports: feeling cold, cold hands and feet, and being tired on waking are all recognised features of suboptimal thyroid output. It does not meet the threshold for hypothyroidism, and no medication is indicated, but it is a pattern worth monitoring and worth mentioning to her GP. Supporting thyroid conversion with adequate selenium, zinc, and iron stores is relevant here.\n\nHer hormonal picture is consistent with post-menopausal status on HRT. FSH at 51.98 and LH at 30.65 confirm the ovaries have ceased cycling. Her oestradiol at 102 pmol/L sits within the post-menopausal reference range of 0 to 118.2, suggesting the HRT is providing some oestrogen replacement but the level is at the lower end of what might give full symptom relief. Whether this is adequate depends on how she feels, and it is worth discussing with her HRT prescriber, particularly because her persistent joint stiffness, feeling cold, and morning tiredness could partly reflect oestrogen levels that are not quite high enough. Progesterone is below 0.21, which is expected post-menopausally unless she is taking cyclical progesterone as part of her HRT regimen. Her testosterone at 0.4 nmol/L is below the female range of 0.5 to 2.6, her free testosterone (calculated) at 0.003 nmol/L is below the 0.01 lower limit, and her free androgen index at 0.39 is below the 0.5 threshold. Her bioavailable testosterone at 0.08 nmol/L is within the laboratory range but below the optimal floor of 0.12. This is a consistent pattern of low androgens, driven partly by menopause and partly by a high SHBG of 102.3, which is the binding protein that locks testosterone away so the body cannot use it. High SHBG is common in women on oral HRT because the oestrogen passes through the liver and stimulates SHBG production. Transdermal HRT (patches or gel) has less effect on SHBG. Low free testosterone in women is associated with reduced libido, difficulty building muscle, fatigue, and reduced sense of vitality. Given that building muscle is one of Nicola's primary goals, this is a meaningful finding. Testosterone supplementation for women is now established clinical practice and is worth discussing with her HRT prescriber. DHEA-S at 0.4 umol/L (147.4 ug/dL) is within range but at the low end, consistent with age-related adrenal decline. Cortisol at 306 nmol/L is within the morning reference range and appropriate. Prolactin at 101 is within the post-menopausal range.\n\nHer full blood count is largely healthy but has two findings that need context. Her haemoglobin at 145 is strong, sitting near the top of the female range of 120 to 150, which means excellent oxygen-carrying capacity. Her red blood cell count at 4.86 is marginally above the upper limit of 4.8. This is a trivial margin and, with haemoglobin and haematocrit (0.422) both within range, it is not a polycythaemia pattern. It may simply reflect mild dehydration at the time of sampling or her high-normal haemoglobin running alongside slightly smaller red cells, keeping the count fractionally high. Her MCV at 86.8 and MCH at 29.7 are both well placed, confirming healthy red cell size and haemoglobin content. MCHC at 343 is within range. RDW at 13.5 shows consistent red cell production.\n\nHer reticulocyte count, however, is low. Reticulocytes are young red blood cells freshly released from the bone marrow, and a healthy percentage is 0.5 to 2.5 percent. Nicola's is 0.39 percent, with an absolute count of 18.954 against a range of 50 to 100. This means the bone marrow is producing fewer new red cells than expected. Because her haemoglobin is high-normal, the most likely explanation is physiological suppression: when haemoglobin is already abundant, the kidneys reduce erythropoietin production, and the marrow slows down because it does not need to replace cells at the usual rate. This is a feedback mechanism, not a deficiency. However, combined with the borderline ferritin (discussed below), it is worth noting for the GP to have on file and to recheck at the next test.\n\nHer white cell count at 5.59 is healthy, with neutrophils at 2.82, lymphocytes at 2.12, monocytes at 0.53, eosinophils at 0.09 and basophils at 0.03, all within range. The neutrophil to lymphocyte ratio is 1.33, well within the optimal band, indicating no systemic inflammatory stress. ESR at 6 is low, and hsCRP is below 0.5, which is excellent and confirms the absence of any significant systemic inflammation. Platelets at 317 with an MPV of 8.5 are both well placed. The platelet to lymphocyte ratio at 149.5 and the systemic immune-inflammation index at 422 are both within their optimal bands.\n\nHer iron studies sit in an interesting position. Ferritin, the body's iron storage protein, is 49 ng/mL. The laboratory range begins at 10, but the optimal floor for a woman who is training hard and wants to build muscle is 40 to 50. At 49 she is just at that floor, not deficient but with very little reserve. Transferrin saturation at 22.45 percent is below the optimal floor of 25 percent, confirming that the proportion of her transport protein carrying iron is on the low side. Serum iron at 15.9 and transferrin at 2.82 are within range, as is TIBC at 63. This is not iron deficiency, but it is not iron abundance either, and in the context of hard training four times a week with a goal of building muscle, iron stores closer to 80 to 100 would serve her better. The low reticulocyte count may in part reflect the bone marrow being cautious with limited iron reserves. A gentle iron top-up is warranted.\n\nHer immune markers are reassuring. IgG at 9.8, IgM at 1.4 and IgA at 1.5 are all well within range, showing a balanced adaptive immune system. IgE at 3.8 is very low, making allergic-driven inflammation unlikely. Rheumatoid factor at 4 is well below the 14 threshold, which is relevant given her joint pain: this effectively rules out rheumatoid arthritis as a cause. Tissue transglutaminase IgA is negative, ruling out coeliac disease.\n\nHer vitamins show room for improvement. Vitamin D at 61 nmol/L is above the sufficiency threshold of 50 but below the optimal band of 75 to 120. At her lean BMI there is no fat sequestration issue, so a moderate supplementation dose will bring it into the optimal range. Vitamin B12 at 401 pg/mL is within the laboratory range but below the optimal floor of 500. Given that B12 absorption declines with age and adequate B12 supports energy, nerve function and red cell production, supplementation is appropriate. Folate at 11 is healthy, consistent with her high vegetable intake.\n\nHer tumour markers are all reassuring. CA125 at 11.5, CA15-3 at 26.62, CA19-9 at 34 and CEA at 2.17 are all within their respective limits. CA19-9 at 34 is close to the 37 upper limit but within it, and minor fluctuations are common; it is not a concern at this level. Total antioxidant activity at 1.55 is within the optimal range, reflecting her excellent fruit and vegetable intake. Creatine kinase at 111 is within range and consistent with her training load.\n\nHer digestive markers are healthy. Amylase at 75 and lipase at 58 are both within range, confirming normal pancreatic function. Lipase at 58 is close to the upper limit of 60 but within it.\n\nHer urinalysis is clean. pH is 6, specific gravity 1.01, protein negative, glucose negative, ketones negative, urobilinogen negative, casts negative, white cells below 1, red cells below 1, and nitrites negative. The bacterial count and urine culture are pending and will be reported when available.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 44, about 10 years younger than a calendar age of 54.\n\nReturning to Nicola's symptoms. Her joint pain and stiffness, present for over a year, is not explained by rheumatoid factor (negative), inflammatory markers (CRP below 0.5, ESR 6), or autoimmune markers. The most likely contributors are hormonal: oestrogen plays a critical role in joint lubrication and cartilage health, and the drop in oestrogen at menopause is one of the most common causes of new-onset joint stiffness in women in their late 40s and 50s. Her oestradiol at 102 may not be providing full joint protection, and optimising her HRT dose could improve this. Low testosterone also contributes to reduced collagen turnover in joints. Her feeling cold and cold hands and feet, alongside tiredness on waking, could reflect the suboptimal FT3 (the active thyroid hormone that drives metabolic rate and heat production) or the lower-end oestradiol, or both. These are worth raising with her GP and HRT prescriber together.\n\nIn terms of her goals: losing body fat at a BMI of 22 means she is already lean, so any fat loss should be slow and modest, paired with adequate protein to protect muscle. Building muscle is her primary challenge, and the low free testosterone is a genuine headwind here. Addressing this hormonally, maintaining a protein intake of at least 1.6 g per kg per day (96 g), and ensuring adequate iron and vitamin D will all support this goal. Improving energy levels ties back to sleep (6 to 7 hours with poor waking quality), the suboptimal FT3, and the low androgens. A fixed sleep schedule, morning light exposure, and the hormonal conversation with her prescriber are the three biggest levers.","links":"The thread running through Nicola's results is a post-menopausal hormonal landscape that is not yet fully optimised by her HRT. Her FSH at 51.98 confirms the ovaries have stopped cycling. Her oestradiol at 102 is within the post-menopausal range, showing HRT is working but the level sits near the bottom of the replacement window. Her testosterone at 0.4, free testosterone at 0.003 and free androgen index at 0.39 are all below range, and this is partly because her SHBG at 102.3 is binding the small amount of testosterone she produces, leaving very little biologically available. High SHBG is a recognised consequence of oral oestrogen passing through the liver. Together, these explain her joint stiffness (oestrogen protects cartilage and joint fluid), her difficulty building muscle (testosterone drives muscle protein synthesis), and likely contribute to her morning fatigue and feeling cold.\n\nThe suboptimal thyroid conversion adds a second layer. Her FT4 is healthy at 18, but the conversion to FT3, the active hormone, is running at the lower edge. FT3 at 4.1 is below optimal and the FT3 to FT4 ratio at 0.228 confirms this. FT3 drives basal metabolic rate, heat production and energy. A low FT3 alongside low testosterone creates a compounding effect on energy and thermoregulation that is greater than either alone. The negative thyroid antibodies are genuinely reassuring because they mean this is not autoimmune thyroid disease progressing; it is more likely age-related slowing of the deiodinase enzymes that convert T4 to T3, potentially compounded by the borderline iron and vitamin D status, both of which are cofactors in that conversion.\n\nThe cardiovascular picture stands somewhat apart from the hormonal story but intersects with it. Her elevated ApoB and LDL are the modifiable risk. Her Lp(a) at 68.8 is the inherited, unmodifiable component that adds to that risk. The protective side, her excellent HDL and low triglycerides, means her net risk is not as severe as the ApoB alone would suggest, but the ApoB to ApoA1 ratio at 0.65 is still above the 0.6 ideal. Oestrogen is known to have a favourable effect on lipid profiles, and the relatively low oestradiol level may mean she is not getting the full lipid benefit that higher-dose HRT can provide. This is another reason to discuss her current HRT dose with her prescriber.\n\nWhat was excluded is as important as what was found. Rheumatoid factor is negative and CRP is below 0.5, so her joint pain is not inflammatory arthritis. Coeliac antibodies are negative. Her blood sugar metabolism is excellent, ruling out insulin resistance as a driver of fatigue or weight gain. Her liver is healthy across every metric. Her kidney function, while below optimal, is stable and consistent with age. There is no anaemia, no B12 or folate deficiency severe enough to cause symptoms, no adrenal insufficiency, and no immune dysfunction. The two loose ends are the pending urine culture and the reticulocyte count, which should be rechecked at her next test to confirm the physiological suppression explanation holds.","lifestyle":"Add a palm-sized portion of protein to every meal, aiming for at least 96 grams per day across the day. Anchor: weigh or estimate protein for one week until you can judge portions by eye. Why: at 0.003 nmol/L free testosterone, your body has very little anabolic signalling, so maximising the protein stimulus at every meal is the most important nutritional lever for your muscle-building goal.\nInclude two to three portions of oily fish per week (salmon, mackerel, sardines, anchovies) in place of red or processed meat. Anchor: plan two fish meals when you do your weekly shop. Why: omega-3 fatty acids lower ApoB and triglycerides, and your ApoB at 1.29 is the primary modifiable cardiovascular risk in this report.\nAdd 10 grams of soluble fibre daily from oats, flaxseed, beans, lentils, or psyllium husk. Anchor: add a tablespoon of ground flaxseed to breakfast and a portion of beans or lentils to one other meal. Why: soluble fibre binds bile acids in the gut and forces the liver to pull LDL cholesterol from the blood to make more, directly lowering your LDL of 3.98.\nDrink at least 2 litres of water across the day, with a glass first thing in the morning and one with every meal. Anchor: fill a bottle the night before and keep it by your bed. Why: your urea at 7.8 and potassium at 5.0 both suggest mild underhydration at the time of sampling, and adequate hydration supports the kidney function you want to protect.\nKeep your four training sessions per week, but ensure two of them are progressive resistance training with compound lifts (squat, deadlift, press, row) at weights that challenge you in the 6 to 12 rep range. Anchor: follow a structured programme rather than improvising. Why: progressive overload is the stimulus your muscles need, and at low testosterone levels the training signal matters even more than usual.\nFix your wake time to the same time seven days a week, within 30 minutes. Get outside or stand by a bright window within 30 minutes of waking. Anchor: alarm goes off, curtains open before anything else. Why: morning light resets the circadian clock and shifts cortisol to the morning, directly addressing your pattern of being tired on waking and wired later.\nSet a caffeine cut-off at 1pm. Why: caffeine has a half-life of 5 to 7 hours, and any consumed after early afternoon competes with the deep sleep your 6 to 7 hours needs to be restorative rather than just adequate.\nCalorie target: approximately 1,750 to 1,900 kcal per day for gradual body recomposition at your current weight and activity level (BMR of approximately 1,300 kcal multiplied by an activity factor of 1.45 to 1.5). Protein target: at least 96 grams per day (1.6 g per kg). If your goal shifts to modest fat loss, reduce to 1,650 to 1,750 kcal while keeping protein at 96 grams or above to protect muscle.","flags":"ApoB 1.29 g/L (limit below 0.9), LDL 3.98 mmol/L (limit below 3.0), non-HDL cholesterol 4.4 (limit below 4.0). Atherogenic lipid burden is elevated. ApoB is classified as high. HDL is excellent at 2.2 and triglycerides are healthy at 1.08, so the risk is driven by LDL particle number rather than a global lipid disorder. Lp(a)-corrected LDL is 3.76, confirming the majority of the LDL elevation is modifiable. Cardiovascular Risk Score 45/100 (threshold 40). Dietary intervention with soluble fibre, omega-3, and saturated fat reduction is first-line. Statin discussion warranted given Lp(a).\nLp(a) 68.8 nmol/L (limit below 32). Genetically inherited, cannot be modified by lifestyle, and confers independent cardiovascular risk through cholesterol deposition, pro-thrombotic and pro-inflammatory mechanisms. Should be recorded as a permanent part of her medical record. First-degree relatives should be offered testing.\nTestosterone 0.4 nmol/L (range 0.5 to 2.6), free testosterone 0.003 nmol/L (range 0.01 to 0.25), free androgen index 0.39 (range 0.5 to 6.5), bioavailable testosterone 0.08 nmol/L (optimal 0.12 to 0.55). Consistent low androgen state, partly menopausal and partly driven by high SHBG at 102.3 binding available testosterone. Clinically relevant to her goals of building muscle and improving energy. Testosterone supplementation for post-menopausal women is established practice and should be discussed with her HRT prescriber.\nFT3 4.1 pmol/L (optimal 4.5 to 6.5), TSH 2.85 (optimal below 2.5), FT3:FT4 ratio 0.228 (optimal 0.27 to 0.4). Suboptimal T4-to-T3 conversion with negative antibodies. Not hypothyroidism, but the low FT3 may contribute to cold intolerance, morning fatigue and reduced metabolic rate. Worth monitoring and supporting with adequate selenium, iron and vitamin D.\nReticulocytes 0.39% (range 0.5 to 2.5), absolute reticulocytes 18.954 (range 50 to 100). Low reticulocyte production in the context of high-normal haemoglobin (145) is most likely physiological suppression via reduced erythropoietin. Borderline iron stores (ferritin 49, transferrin saturation 22.45%) may also contribute. Recheck at next test.\nRed blood cell count 4.86 (range 3.8 to 4.8). Marginally above range by 0.06. Haemoglobin and haematocrit both within range. No clinical significance at this margin.\nC-Peptide 0.763 ug/L (range 1.1 to 4.4). Below range but in the context of normal glucose, normal HbA1c, and low-normal insulin, this reflects low insulin demand from high insulin sensitivity rather than pancreatic insufficiency.\nKidney function: creatinine eGFR 74, cystatin C eGFR 79, combined eGFR 79. All above 60 (no impairment) but below optimal of 90. Consistent with previous test findings and age-related decline. Baseline now documented across two tests. Monitor annually.\nVitamin D 61 nmol/L (optimal 75 to 120). Sufficient but below optimal. Supplementation recommended.\nVitamin B12 401 pg/mL (optimal above 500). Within laboratory range but below optimal. Supplementation recommended.\nDe Ritis ratio 1.93 (range 0.6 to 1.6). Elevated due to very low ALT denominator (14 IU/L). All other liver markers clean. No clinical concern.\nReassuring negatives: hsCRP below 0.5 and ESR 6 (no systemic inflammation), rheumatoid factor 4 (no rheumatoid arthritis), coeliac antibodies negative, fasting glucose 4.7 and HbA1c 36 and HOMA-IR 0.76 (excellent insulin sensitivity), all liver enzymes within range with APRI 0.213 and NAFLD score minus 2.989 (no liver fibrosis), thyroid antibodies negative (no autoimmune thyroid disease), all tumour markers within limits, all immunoglobulins within range, IgE 3.8 (no allergic process), urinalysis clean.","recommendations":"Discuss lipid results with GP: ApoB 1.29, LDL 3.98, Lp(a) 68.8. Dietary intervention is first-line, but given the inherited Lp(a) component, a statin discussion is appropriate. Bring the Lp(a) result specifically, as many GPs do not routinely test it and it changes the risk calculation.\nAsk GP to record Lp(a) 68.8 nmol/L as a permanent entry in the medical record and offer Lp(a) testing to first-degree relatives (children, siblings).\nDiscuss testosterone supplementation with HRT prescriber: total testosterone 0.4, free testosterone 0.003, FAI 0.39, all below range. Consider whether transdermal testosterone cream or gel is appropriate given her goals of building muscle and improving energy.\nDiscuss current oestradiol level (102 pmol/L) with HRT prescriber: this sits at the lower end of the replacement window and may not be providing full joint protection or metabolic benefit. Ask whether a dose adjustment or switch from oral to transdermal delivery would be appropriate, the latter also reducing SHBG (102.3) and freeing more testosterone.\nMention FT3 of 4.1 (below optimal) and TSH of 2.85 (above optimal) to GP. No treatment needed now, but document for future comparison. Thyroid antibodies are negative.\nMention kidney function: combined eGFR 79, consistent with previous below-ideal result. Ask GP to add annual eGFR monitoring to routine bloods.\nCalorie target 1,750 to 1,900 kcal per day for body recomposition, protein target at least 96 grams per day (1.6 g/kg). Retest in 6 months, repeating: lipid panel with ApoB, full thyroid panel, testosterone, free testosterone, SHBG, cystatin C eGFR, ferritin, reticulocytes, vitamin D, and B12.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal containing fat. Why: your level is 61 nmol/L and the optimal range is 75 to 120. Vitamin D supports bone density, immune function, and thyroid hormone conversion, all relevant to your results.\nVitamin K2 (MK-7): 100 mcg daily, taken with vitamin D. Why: K2 directs the calcium mobilised by vitamin D into bone rather than soft tissue. Always pair with D3 supplementation.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers ApoB and triglycerides, reduces inflammation, and supports joint comfort. Your ApoB at 1.29 is the target.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 401 is within range but below the 500 optimal floor, and absorption declines with age. Sublingual delivery bypasses the gut for better uptake.\nMagnesium glycinate: 300 mg before bed. Why: your magnesium at 0.97 is within the optimal range, but glycinate at bedtime supports sleep quality, which at 6 to 7 hours with poor waking quality is one of your key levers. Magnesium also supports muscle recovery given your four hard training sessions per week.\nIron (ferrous bisglycinate): 25 mg every other day, taken with vitamin C on an empty stomach, away from tea or coffee by at least an hour. Why: your ferritin at 49 is at the optimal floor for an active woman, and your transferrin saturation at 22.45% is below the 25% ideal. The reticulocyte suppression may partly reflect limited iron availability. Take every other day rather than daily for better absorption.\nSelenium (selenomethionine): 100 mcg daily with food. Why: selenium is a cofactor for the deiodinase enzymes that convert T4 to T3, and your FT3 at 4.1 and conversion ratio at 0.228 are at the lower edge. Combined with adequate iron and vitamin D, selenium supports thyroid conversion.\nThe most important changes from this report are not supplements. They are the conversation with your HRT prescriber about testosterone and oestradiol dosing, the dietary changes to lower ApoB, and the consistent sleep schedule to address morning fatigue.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 58.9. Weakest systems: lipids & cardiovascular 12%, hormones 54%, hematology 63%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Total Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3729","lower_normal":"","upper_normal":"59","lower_optimal":"","upper_optimal":"54","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4576","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It carries no age term and measures the risk being accumulated in the artery walls regardless of age. A score of 20 or below is ures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the previous two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. Nicola's result of 5.4% is within the normal range (below 6.0%) but slightly above the optimal ceiling of 5.2%. In mmol/mol terms her result of 36 is also within normal. This is a healthy result that does not suggest any glucose dysregulation.","low_causes":"Anaemia, blood loss, low carbohydrate diet, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, insulin resistance, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Nicola's result of 36 mmol/mol is at the upper boundary of the optimal range and well within the normal threshold of 42. Below 42 is normal, 42 to 47 indicates pre-diabetes, and above 48 indicates diabetes. Her result confirms excellent long-term blood sugar control.","low_causes":"Anaemia, blood loss, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3548","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3975","units": ithin the optimal range, showing a healthy innate immune response.","low_causes":"Viral infection, medications, autoimmune conditions, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including the production of antibodies and the memory that protects against previously encountered infections. Nicola's lymphocyte count of 2.12 is within the optimal range, confirming a healthy adaptive immune system.","low_causes":"Viral infection (acute phase), HIV, autoimmune disease, steroid use","high_causes":"Viral infection (recovery), chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4458","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest pathogens and dead cells, and present fragments to other immune cells to coordinate the response. Nicola's count of 0.53 is within the optimal range.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, autoimmune disease, chronic inflammatory conditions","padding":"1"," osition":"0.3333333333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, immature red blood cells freshly released from the bone marrow. Their percentage reflects how actively the marrow is producing new red cells. Nicola's reticulocyte count of 0.39% is below the lower limit of 0.5%. In the context of a high-normal haemoglobin of 145, this most likely represents physiological suppression: when haemoglobin is abundant, the kidneys reduce erythropoietin (the hormone that stimulates red cell production), and the marrow slows output because there is no need for replacement. Her borderline iron stores (ferritin 49, transferrin saturation 22.45%) may also contribute to slightly cautious marrow output. This is worth rechecking at her next test.","low_causes":"Adequate haemoglobin with reduced erythropoietin drive, iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Haemolysis, acute blood loss, recovery from anaemia, response to erythropoietin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"18.954","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1263","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"This is the absolute number of reticulocytes per litre of blood, providing a volume-independent measure of bone marrow red cell output. Nicola's absolute reticulocyte count of 18.954 is below the range of 50 to 100, consistent with the low percentage. As discussed above, this is most likely physiological suppression in the setting of high-normal haemoglobin, potentially contributed to by borderline iron stores.","low_causes":"Adequate haemoglobin with reduced demand, iron deficiency, bone marrow suppression","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"17.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index is the ratio of MCV to red blood cell count, used to distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. Nicola's Mentzer Index of 17.9 is above 13, which, in the context of microcytic anaemia, would point away from thalassaemia. However, her MCV is normal, so this index is reported for context and is not applicable at present.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle in a test tube over one hour. A faster rate indicates inflammation in the body. Nicola's ESR of 6 mm/hour is well within range, confirming no significant systemic inflammation. This is reassuring given her joint symptoms, as it makes inflammatory arthritis very unlikely.","low_causes":"Polycythaemia, sickle cell disease, high albumin","high_causes":"Infection, inflammation, autoimmune disease, cancer, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"22.45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4623","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-transport protein transferrin that is currently loaded with iron. It indicates how much iron is actively being delivered to tissues. Nicola's result of 22.45% is within the laboratory range but below the optimal floor of 25%, suggesting that iron delivery to tissues, including the bone marrow for red cell production, is on the lower side. This is consistent with her borderline ferritin and low reticulocyte count.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, excessive supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"15.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4403","lower_normal":"9","upper_normal":"30.4","lower_optimal":"1 city of the blood to bind and transport iron. When iron stores are low, the body increases TIBC to capture more of the available iron. Nicola's TIBC of 63 umol/L is within the optimal range, consistent with adequate iron status.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3805","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3665","upper_optimal_position":"0.4851","units":"ng/mL","description":"Ferritin is the protein that stores iron inside cells, and its blood level reflects total body iron reserves. Nicola's ferritin of 49 ng/mL is within the optimal range but sits right at the lower boundary of 40. For a woman training hard four times a week with a goal of building muscle, iron stores closer to 80 to 100 would better support red cell production, oxygen delivery to working muscles, and energy. The borderline level is consistent with her below-range transferrin saturation and low reticulocyte output.","low_causes":"Iron deficiency, poor dietary intake, chronic blood loss, malabsorption, heavy menstruation","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is ":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4917","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium reading for the albumin level, giving a more accurate picture of the physiologically active calcium. Nicola's corrected calcium of 2.34 mmol/L is within the optimal range, confirming healthy calcium metabolism alongside her normal PTH.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6475","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3609","upper_optimal_position":"0.5862","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bones and teeth, and is involved in energy production in every cell. Nicola's phosphate of 1.6 mmol/L is within the laboratory range but close to the upper limit of 1.65 and above the optimal ceiling of 1.45. Phosphate can be temporarily elevated by a recent meal or by increased PTH activity, but her PTH is normal. At this margin it is a minor finding and not a concern.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, refeeding","high_causes":"Kidney disease, hypoparathyroidism, excessive dairy intake, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5862","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including muscle contraction, nerve function, energy production and sleep regulation. Nicola's magnesium of 0.97 mmol/L sits right in the middle of the optimal band of 0.85 to 1.05. This is an excellent result.","low_causes":"Poor dietary intake, alcohol, diuretics, chronic diarrhoea, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys and excreted in urine. Nicola's urea of 7.8 mmol/L is within the laboratory range but above the optimal ceiling of 7.0. This can reflect higher protein intake, mild dehydration at sampling, or slightly reduced kidney clearance. Her creatinine and cystatin C eGFR provide a more reliable picture of kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, reduced kidney function, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5691","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5886","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a fairly constant rate. It is used to estimate kidney filtration. Nicola's creatinine of 78 umol/L is within the laboratory range and just below the optimal ceiling of 80. The creatinine-based eGFR derived from this is 74, which is adequate but below the ideal of 90.","low_causes":"Low muscle mass, liver disease","high_causes":"Reduced kidney function, dehydration, high meat intake, intense exercise, high muscle mass","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how many millilitres of blood the kidneys filter per minute, calculated from the creatinine result. Nicola's creatinine-based eGFR of 74 is above 60, which means kidney function is not impaired, but it is below the 90 threshold that represents fully optimal filtration. At 54, some decline is physiological (roughly 1 mL/min per year from the mid-30s), and the cystatin C-based eGFR at 79 provides a more accurate picture. This is consistent with her previous test and worth monitoring annually.","low_causes":"Chronic kidney disease, dehydration, nephrotoxic medications, diabetes, hypertension","high_causes":"Hyperfiltration (early diabetes), pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C, a small protein produced at a constant rate by all nucleated cells and filtered freely by the kidneys. Unlike creatinine, cystatin C is not affected by muscle mass, diet or exercise, making it a more reliable marker in many people. Nicola's cystatin C-based eGFR of 79 is above 60 but below the optimal threshold of 90, consistent with the creatinine-based estimate. Cystatin C itself at 0.99 is just within the 1.1 limit.","low_causes":"Chronic kidney disease, age-related decline, nephrotoxic medications","high_causes":"Hyperfiltration, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"236","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body's own cells. Nicola's uric acid of 236 umol/L is within the optimal range for a female (160 to 320), indicating healthy purine metabolism with no risk of gout or urate crystal deposition.","low_causes":"Low purine diet, Fanconi syndrome, SIADH","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, alcohol, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.99","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.85","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3864","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and freely filtered by the kidneys. Its blood level rises as kidney filtration declines. Nicola's cystatin C of 0.99 mg/L is within the laboratory limit of 1.1 but above the optimal ceiling of 0.85, consistent with the below-optimal eGFR readings. This confirms that the reduced filtration rate is genuine and not an artefact of creatinine measurement.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Reduced kidney function, age, inflammation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C for the most accurate estimate of kidney filtration available from blood tests. Nicola's combined eGFR of 79 is the most reliable of the three estimates and confirms that her kidneys are functioning adequately but below the optimal threshold of 90. This is consistent with her previous test result and age-related physiological decline. Annual monitoring is recommended.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"100","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish the cause of elevated urea. A high ratio can indicate dehydration, high protein intake, or upper gastrointestinal bleeding. Nicola's ratio of 100 is at the upper boundary of the laboratory range and above the optimal ceiling of 90. In the absence of any suggestion of bleeding and with no alarming symptoms, mild dehydration at the time of sampling or higher protein intake are the likely explanations. Adequate fluid intake, especially around training, is recommended.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is a marker of systemic inflammation produced by the liver. Levels below 1.0 are optimal for cardiovascular risk. Nicola's hs-CRP is reported as below 0.5 mg/L, which is excellent. This confirms no significant systemic inflammation and is a positive finding for cardiovascular health, particularly alongside her elevated lipids,
