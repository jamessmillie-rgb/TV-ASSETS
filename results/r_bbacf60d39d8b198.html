sition":"0.5148","units":"score","description":"The NAFLD Fibrosis Score estimates the probability of significant liver fibrosis in the context of non-alcoholic fatty liver disease, using age, BMI, diabetes status, platelets, albumin and liver enzymes. Nicola's score of minus 2.989 is firmly in the low-risk category, making advanced fibrosis very unlikely.","low_causes":"Healthy liver, young age, low BMI, no diabetes","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The De Ritis ratio divides AST by ALT. When both enzymes are elevated, a ratio above 2 can suggest alcoholic liver disease or cirrhosis. When both are normal, as they are here, the ratio is driven by the arithmetic rather than by liver pathology. Nicola's very low ALT of 14 makes the denominator small, inflating the ratio to 1.93 without any clinical significance. All her liver markers, GGT, APRI, FIB-4 and NAFLD score, are reassuring.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6371","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the osition":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. Nicola's VLDL of 0.49 mmol/L is within the optimal range, consistent with her healthy triglyceride level.","low_causes":"Low fat diet, malabsorption","high_causes":"High triglycerides, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6875","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective form of cholesterol that transports cholesterol from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Nicola's HDL of 2.2 mmol/L is excellent, well above the 1.55 desirable threshold and the 1.6 optimal floor. This is one of the strongest results in her lipid panel and provides meaningful protection against the cardiovascular risk posed by her elevated LDL and Lp(a).","low_causes":"Smoking, obesity, sedentary lifestyle, poor diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6633","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL is the form of cholesterol that deposits into artery walls, driving atherosclerosis over time. Nicola's LDL of 3.98 mmol/L is above the 3.0 upper limit. Reducing LDL towards the ideal of below 2.6 through dietary changes (soluble fibre, omega-3, reduced saturated fat) is a key priority from this report. Her Lp(a)-corrected LDL of 3.76 confirms that the majority of this elevation is from conventional LDL particles that respond to lifestyle intervention.","low_causes":"Hyperthyroidism, malabsorption, liver disease, statins","high_causes":"High saturated fat diet, genetic predisposition, hypothyroidism, menopause, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlrat","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC to HDL ratio divides total cholesterol by HDL to give a summary of cardiovascular risk. Nicola's ratio of 3.0 is within the optimal range, reflecting the powerful offset her excellent HDL provides against her elevated total cholesterol. A ratio below 3.5 is considered low risk.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"33.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6250","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is protective HDL. Nicola's HDL makes up 33.33% of her total cholesterol, well above the 20% floor and the 25% optimal threshold. This is an excellent proportion.","low_causes":"Low HDL, metabolic syndrome, obesity","high_causes":"High HDL, exercise, oestrogen, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4375","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) lipoproteins in a single number. Nicola's non-HDL of 4.4 mmol/L is above the 4.0 limit. This aligns with her elevated LDL and ApoB and reinforces the need for dietary intervention to reduce the atherogenic fraction.","low_causes":"Low LDL, hyperthyroidism, malabsorption","high_causes":"High LDL, high triglycerides, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7107","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. A higher ApoA1 means more HDL particles carrying cholesterol away from the arteries. Nicola's ApoA1 of 1.99 g/L is well above the 1.4 threshold, consistent with her excellent HDL and reflecting strong reverse cholesterol transport.","low_causes":"Smoking, obesity, sedentary lifestyle, metabolic syndrome","high_causes":"Exercise, oestrogen, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single protein present on every LDL, VLDL and Lp(a) particle, making it the most accurate measure of the total number of atherogenic particles in the blood. Each ApoB-carrying particle can penetrate the artery wall and deposit cholesterol. Nicola's ApoB of 1.29 g/L is classified as high, well above the 0.9 desirable limit and the 0.8 optimal target. This is the single most important cardiovascular finding in this report and the primary target for dietary intervention.","low_causes":"Statins, low fat diet, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, genetic predisposition, hypothyroidism, metabolic syndrome, menopause","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB:ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.648","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5400","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). A ratio below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Nicola's ratio of 0.648 falls into the average risk category. Her excellent ApoA1 is partially offsetting her elevated ApoB, but the ratio is still above the ideal threshold because the ApoB is high.","low_causes":"Low ApoB, high ApoA1, statin therapy","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"68.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically inherited lipoprotein that carries cholesterol and a pro-thrombotic protein called apolipoprotein(a). It deposits cholesterol into artery walls like LDL, but also promotes blood clotting and inflammation. Nicola's Lp(a) of 68.8 nmol/L is above the 32 nmol/L threshold, placing her at slightly increased cardiovascular risk from this inherited factor. Lp(a) cannot be lowered by diet, exercise, or any currently approved medication. It should be recorded as a permanent part of her medical record, and her first-degree relatives (children, siblings) should be offered testing. The fact that Lp(a) is elevated means that part of her LDL and ApoB reading comes from Lp(a) particles, but the Lp(a)-corrected LDL of 3.76 confirms the majority is still from conventional, modifiable LDL.","low_causes":"Genetic variation (favourable)","high_causes":"Genetic inheritance (entirely genetic, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1633","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a marker of insulin resistance and atherogenic dyslipidaemia. A low ratio indicates that the body is handling fats well and that insulin sensitivity is intact. Nicola's ratio of 0.49 is well within the optimal range, consistent with her excellent HOMA-IR and confirming no metabolic syndrome pattern.","low_causes":"High insulin sensitivity, exercise, healthy diet","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2625","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant particles (VLDL remnants and chylomicron remnants). It is calculated as total cholesterol minus HDL minus LDL. Nicola's remnant cholesterol of 0.42 mmol/L is within the optimal range, confirming that her triglyceride-rich lipoproteins are not contributing significant atherogenic risk.","low_causes":"Low triglycerides, healthy fat metabolism","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol carried by Lp(a) particles from the total LDL, showing how much of the LDL elevation is from conventional, modifiable LDL particles. Nicola's corrected LDL of 3.76 mmol/L is still above the 3.0 limit, confirming that the vast majority of her elevated LDL is driven by conventional LDL particles that respond to dietary changes, saturated fat reduction, soluble fibre and, if needed, statin therapy.","low_causes":"Low LDL, statin therapy","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.309","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5237","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from triglycerides and HDL and reflects the balance between atherogenic and protective lipoproteins. A negative value indicates low atherogenic risk. Nicola's AIP of minus 0.309 is within the optimal range, reflecting her excellent triglyceride and HDL levels. This is a genuinely positive finding within her otherwise elevated lipid panel.","low_causes":"High HDL, low triglycerides, exercise","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"1.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2586","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II index divides LDL by HDL, providing a ratio of harmful to protective cholesterol. Nicola's ratio of 1.81 is within the optimal range, again reflecting the powerful protective effect of her high HDL. Despite her elevated LDL in absolute terms, the ratio shows that her HDL is providing substantial counterbalance.","low_causes":"Low LDL, high HDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a simple marker of systemic inflammation and immune balance. Nicola's NLR of 1.33 is within the optimal range of 1.0 to 2.0, confirming no significant inflammatory stress or immune imbalance.","low_causes":"Not clinically significant in isolation","high_causes":"Bacterial infection, systemic inflammation, physiological stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"149.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5322","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet to lymphocyte ratio is a marker of systemic inflammation and immune balance. Nicola's PLR of 149.5 is within the optimal range, consistent with her low CRP and ESR, confirming no significant inflammatory process.","low_causes":"Bone marrow disorders, splenomegaly","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"422","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5480","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets and lymphocytes into a single index of systemic immune-inflammatory activity. Nicola's SII of 422 is within the optimal range, adding further confirmation that there is no significant inflammatory burden.","low_causes":"Immunosuppression, bone marrow disorders","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"23.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6533","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"mmol/L","description":"The anion gap measures the difference between measured cations (sodium and potassium) and measured anions (chloride and bicarbonate) in the blood. It helps identify acid-base disturbances. Nicola's anion gap of 23.2 mmol/L is above the 20 upper limit for the formula that includes potassium. However, her potassium of 5.0 may be mildly elevated due to sample handling, and all her individual electrolytes and bicarbonate are within range. With no clinical signs of metabolic acidosis and a normal bicarbonate, this is most likely a calculation artefact from the upper-range potassium rather than a genuine acid-base disturbance.","low_causes":"Low albumin, myeloma","high_causes":"Metabolic acidosis (lactic acidosis, diabetic ketoacidosis, renal failure), dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-Corrected Sodium is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"292.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Calculated Serum Osmolality is calculated from your measured results. It sits outside the ideal range. It is being driven by Urea, which sits outside the ideal range.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumincorrectedaniongap","name":"Albumin-Corrected Anion Gap","group":"ELECTROLYTES & MINERALS","result":"23.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"The albumin-corrected anion gap adjusts the standard anion gap for variations in albumin, providing a more accurate assessment of acid-base balance. Nicola's result of 23.2 ium is low, PTH rises to pull calcium from bones and increase absorption. Nicola's PTH of 1.6 pmol/L is within the optimal range, consistent with her healthy corrected calcium of 2.34. This confirms normal parathyroid function and healthy calcium metabolism.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"401","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4428","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4557","upper_optimal_position":"0.6146","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. Nicola's B12 of 401 pg/mL is within the laboratory range but below the optimal floor of 500. B12 absorption declines with age, and suboptimal levels can contribute to fatigue, nerve tingling and reduced cognitive sharpness. Sublingual methylcobalamin supplementation is recommended to bring her level into the optimal band.","low_causes":"Poor dietary intake (especially in vegetarians/vegans), age-related malabsorption, pernicious anaemia, metformin, proton pump inhibitors","high_causes":"B12 supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and methylation, a process that regulates gene expression and detoxification. Nicola's folate of 11 ng/mL is within the optimal range, reflecting her excellent fruit and vegetable intake of 6+ portions daily.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications (methotrexate, certain anticonvulsants)","high_causes":"Supplementation, high folate diet, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3546","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, the reactive molecules that damage cells and drive ageing. Nicola's TAA of 1.55 mmol/L is within the optimal range, reflecting her antioxidant-rich diet with 6+ daily portions of fruit and vegetables.","low_causes":"Poor diet, oxidative stress, chronic disease, smoking","high_causes":"High antioxidant diet, supplementation (vitamin C, E, polyphenols)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5268","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3893","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone, produced by the thyroid gland and converted into the active form, T3, in peripheral tissues. Nicola's FT4 of 18 pmol/L is within the optimal band of 14 to 20, showing that her thyroid is producing adequate hormone. The issue is not production but conversion to the active form.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome, iodine deficiency","high_causes":"Hyperthyroidism (Graves' disease), thyroiditis, excess thyroid medication, early pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5151","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4990","units":"mIU/L","description":"TSH is produced by the pituitary gland to tell the thyroid how hard to work. When the thyroid is underperforming, TSH rises to push it harder. Nicola's TSH of 2.85 mIU/L is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. A TSH creeping above 2.5 suggests the pituitary is having to push a little harder to maintain thyroid output. Combined with her below-optimal FT3, this indicates suboptimal thyroid function that could contribute to feeling cold, morning fatigue and difficulty losing weight. Her negative thyroid antibodies rule out autoimmune thyroid disease.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism (primary), iodine deficiency, recovery from illness, age, Hashimoto's thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that every cell in the body uses for energy production, metabolic rate and temperature regulation. It is converted from FT4 by deiodinase enzymes that require selenium, iron and zinc as cofactors. Nicola's FT3 of 4.1 pmol/L is within the laboratory range but below the optimal floor of 4.5. This means the conversion of the storage hormone (FT4, which is fine at 18) to the active hormone is running at the lower end. Low FT3 is associated with feeling cold, fatigue, difficulty losing weight and slower recovery from exercise, all of which are relevant to Nicola's symptoms and goals.","low_causes":"Poor T4-to-T3 conversion (selenium, iron or zinc deficiency), non-thyroidal illness, caloric restriction, ageing","high_causes":"Hyperthyroidism, T3 supplementation, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/mL","description":"TPO antibodies target thyroid peroxidase, an enzyme the thyroid needs to produce hormones. Elevated levels indicate autoimmune thyroid disease (Hashimoto's thyroiditis). Nicola's TPO antibodies are below 6.6 U/mL, well within the negative range, ruling out autoimmune thyroid disease as a cause of her suboptimal thyroid function.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2273","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses as a precursor for hormone production. Elevated levels, like TPO antibodies, indicate autoimmune thyroid disease. Nicola's thyroglobulin antibodies are below 1.3 U/mL, well within the negative range. Both thyroid antibodies being negative is genuinely reassuring and means her suboptimal thyroid conversion is not driven by autoimmune destruction.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, thyroid cancer (post-thyroidectomy marker)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.228","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3707","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Nicola's ratio of 0.228 is within the laboratory range but below the optimal floor of 0.27, confirming that peripheral conversion is suboptimal. Supporting conversion with adequate selenium, iron and vitamin D is the first-line approach.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"306","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4497","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5821","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. A morning cortisol in the optimal range confirms healthy adrenal function. Nicola's cortisol of 306 nmol/L is within the optimal band for a morning sample, indicating normal adrenal function. Given her report of being tired on waking but not exhausted, this is reassuring and makes adrenal insufficiency very unlikely.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, steroid withdrawal","high_causes":"Chronic stress, Cushing's syndrome, steroid use, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"102","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4322","lower_normal":"0","upper_normal":"118.2","lower_optimal":"60","upper_optimal":"118.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.2538","upper_optimal_position":"0.5","units":"pmol/L","description":"Oestradiol is the primary oestrogen, critical for bone density, cardiovascular protection, joint lubrication, skin elasticity, mood and cognitive function. Nicola's oestradiol of 102 pmol/L falls within the post-menopausal range of 0 to 118.2, confirming that her HRT is providing some oestrogen replacement. However, it sits towards the lower end of this window, and for someone reporting persistent joint stiffness and cold intolerance, a higher level may provide better symptom relief. Discussing the dose or delivery method (oral versus transdermal) with her HRT prescriber is recommended.","low_causes":"Menopause, low body fat, overexercise, pituitary disease","high_causes":"HRT, ovarian tumours, obesity (aromatisation), pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0452","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone that in pre-menopausal women rises after ovulation to prepare the uterus for pregnancy. In post-menopausal women, levels are expected to be very low. Nicola's progesterone is below 0.21 nmol/L, which is within the post-menopausal range of 0 to 2.32. Whether she takes progesterone as part of her HRT regimen depends on whether she still has her uterus, and this is a matter for her prescriber.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Pregnancy, ovulation, HRT, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"30.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4546","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"LH is produced by the pituitary gland and in pre-menopausal women triggers ovulation. In post-menopausal women, LH rises as the pituitary tries to stimulate ovaries that are no longer responding. Nicola's LH of 30.65 mIU/mL is within the post-menopausal range of 15.9 to 54, confirming post-menopausal status.","low_causes":"Pituitary disease, hypothalamic dysfunction, HRT suppression","high_causes":"Menopause, primary ovarian failure, PCOS (mid-cycle equivalent)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"51.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5362","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"FSH is produced by the pituitary gland to stimulate the ovaries to develop egg-containing follicles. After menopause, FSH rises significantly as the pituitary increases its signal to ovaries that no longer respond. Nicola's FSH of 51.98 mIU/mL is within the post-menopausal range, confirming that her ovaries have ceased cycling. The elevated FSH alongside an oestradiol of 102 suggests her HRT is providing partial but not complete hormonal suppression.","low_causes":"Pituitary disease, HRT suppression, pregnancy","high_causes":"Menopause, primary ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"0.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2905","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays a critical role in muscle protein synthesis, bone density, libido, energy and sense of vitality. Nicola's total testosterone of 0.4 nmol/L is below the female range of 0.5 to 2.6. After menopause, ovarian testosterone production declines, and her high SHBG of 102.3 (likely driven by oral HRT) is binding most of what remains. Low testosterone in women is associated with difficulty building muscle, reduced energy, lower libido, and reduced sense of wellbeing. Given Nicola's goal of building muscle and improving energy, this is a clinically significant finding that should be discussed with her HRT prescriber.","low_causes":"Menopause, oral contraceptives, oral HRT (via raised SHBG), adrenal insufficiency, oophorectomy","high_causes":"PCOS, adrenal tumour, congenital adrenal hyperplasia, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2723","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically active, calculated from total testosterone and SHBG. Nicola's FAI of 0.39 is below the lower limit of 0.5, confirming that very little testosterone is available for her tissues to use. This is driven by the combination of low total testosterone (0.4) and high SHBG (102.3).","low_causes":"High SHBG, low testosterone, oral oestrogen therapy, menopause","high_causes":"PCOS, obesity, insulin resistance, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"0.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3457","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3495","upper_optimal_position":"0.5524","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. Ni function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
