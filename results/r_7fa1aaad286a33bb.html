941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, mostly from dietary carbohydrate and fat. At 1.29 he is within the laboratory range of below 1.7 but above the optimal target of below 1.0. This is not a major concern but contributes to the cardiovascular risk picture. Reducing refined carbohydrates and increasing omega-3 intake, along with post-meal walks, can help bring triglycerides closer to the ideal level.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3782","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, is the particle that carries triglycerides from the liver into the bloodstream. At 0.59 it is within the optimal range, confirming the liver is not overproducing triglyceride-rich particles.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5288","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective cholesterol that carries excess cholesterol away from the arteries back to the liver for disposal. At 1.1 it is above the low-risk floor of 1.04 but below the desirable level of 1.55 and below the optimal target of 1.4 for men. A higher HDL is associated with lower cardiovascular risk. The most effective ways to raise HDL are regular aerobic exercise, adding resistance training, increasing omega-3 intake, and maintaining a healthy weight.","low_causes":"Sedentary lifestyle, smoking, obesity, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, omega-3 supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6213","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the cholesterol particle that deposits cholesterol into artery walls if present in excess. At 2.66 it is within the laboratory range of 0.5 to 3 but marginally above the optimal target of below 2.6. His Lp(a)-corrected LDL of 2.58 shows that almost all of this LDL is modifiable through diet and lifestyle. Increasing soluble fibre, reducing saturated fat and increasing oily fish intake are the most effective dietary strategies.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption, liver disease","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4344","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol and is a simple measure of cardiovascular risk. At 3.91 it is within the laboratory range of below 4.5 but above the optimal target of below 3.5. The ratio is above ideal primarily because HDL is below the optimal threshold. Raising HDL through exercise and dietary changes will bring this ratio down.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"25.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6395","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"This is the proportion of total cholesterol that is made up of the protective HDL fraction. At 25.58% it is above the 20% floor, but below the optimal threshold of 28% or higher. A higher percentage means a greater share of total cholesterol is protective. Raising HDL through exercise will improve this proportion.","low_causes":"Low HDL, sedentary lifestyle, obesity, metabolic syndrome","high_causes":"Regular exercise, genetic factors, high HDL","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-clogging) cholesterol fractions in one number. At 3.2 it is within the laboratory range of below 4 but above the optimal target of below 2.6. This aligns with the ApoB finding and confirms there is room to reduce the atherogenic cholesterol burden through diet and lifestyle.","low_causes":"Low-fat diet, malabsorption","high_causes":"Diet high in saturated fat, obesity, hypothyroidism, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6917","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main protein on HDL particles and reflects the number of protective HDL particles in the blood. At 1.66 it is well above the 1.2 normal threshold and above the 1.4 optimal level. This is a genuinely good result and means his protective cholesterol particles are plentiful, even though the HDL cholesterol concentration itself is below ideal.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is a protein present on every LDL and VLDL particle. It is the single best measure of the number of atherogenic particles circulating in the blood, because each particle carries exactly one ApoB molecule. At 0.93 it is above the 0.9 desirable threshold and above the 0.8 optimal target. This means there are more cholesterol-carrying particles in his blood than ideal, and these particles are what enter artery walls and drive plaque formation over decades. The good news is that his Lp(a) is below 25, meaning this is entirely modifiable. Increasing soluble fibre, reducing saturated fat, adding oily fish and resistance training are all proven to lower ApoB.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio compares atherogenic (harmful) particle count to protective particle count and is one of the strongest single predictors of cardiovascular risk. At 0.56 it is within the optimal range of below 0.6, which is a positive finding. This means the balance between harmful and protective particles is favourable, even though the absolute ApoB is slightly above the desirable threshold.","low_causes":"High HDL, low LDL, healthy lipid balance","high_causes":"High LDL, low HDL, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined variant of LDL that is stickier and more inflammatory than regular LDL. It is inherited and does not change with diet, exercise or most medications. At below 25, his Lp(a) is within the ideal range of below 32. This is genuinely useful information because it means the elevated ApoB and LDL in this report are driven entirely by modifiable factors such as diet and exercise, not by an inherited particle he cannot change.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"160","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found mainly in skeletal muscle, heart and brain. It is released into the blood when muscle is damaged or worked hard. At 160 it is within the optimal range, consistent with his regular hard cardio training. This level makes significant muscle damage unlikely.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"14.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3892","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3909","upper_optimal_position":"0.5601","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 14.9 it is within the laboratory range but just below the optimal floor of 15. Iron levels fluctuate during the day and with recent meals, so this snapshot is less reliable than ferritin for assessing long-term stores. In the context of his depleted ferritin, this mildly low serum iron is consistent with the overall picture of iron depletion.","low_causes":"Iron deficiency, chronic blood loss, chronic disease, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, liver disease, excessive supplementation, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4289","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. At 2.58 it is within the optimal range. In iron deficiency, transferrin typically rises as the body tries to scavenge more iron from the gut; the fact that it is normal here may reflect the early stage of depletion or the fact that the loss is gradual.","low_causes":"Chronic disease, liver disease, malnutrition, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"59.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4964","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity (TIBC) measures how much iron the blood could carry if every transferrin molecule were fully loaded. At 59.7 it is within the optimal range. In established iron deficiency, TIBC typically rises; its normal level here may reflect the gradual nature of the depletion.","low_causes":"Chronic disease, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3222","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein and is the most reliable single marker of iron reserves. At 12, it is below the lower limit of 22 and well below the optimal range of 50 to 200. In a 60-year-old man who does not lose iron through menstruation, a ferritin this low almost always indicates iron is being lost somewhere, most commonly through the gastrointestinal tract. The BUPA finding of trace blood in a stool sample provides the most likely explanation. Depleted ferritin can contribute to fatigue, reduced exercise capacity, joint discomfort and impaired immune function. The GP should be aware of this alongside the stool investigation.","low_causes":"Chronic blood loss (gastrointestinal, urinary), poor dietary intake, malabsorption, coeliac disease","high_causes":"Iron overload (haemochromatosis), inflammation, liver disease, infection, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3784","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation shows how much of the body's iron-carrying capacity is being used. At 23% it is within the laboratory range of 18 to 55 but below the optimal floor of 25%. This means the transferrin is not fully loaded with iron, consistent with the depleted ferritin stores. Once iron stores are replenished, this percentage should rise into the optimal band.","low_causes":"Iron deficiency, chronic disease, chronic blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the average blood sugar over the past two to three months by looking at how much glucose has attached to haemoglobin. At 38 he is within the normal threshold of below 42 but above the optimal ceiling of 36. Blood sugar control over the medium term is healthy, and prediabetes and diabetes are very unlikely, though bringing HbA1c below 36 through continued dietary attention would move this into the optimal band.","low_causes":"Haemolytic anaemia, chronic blood loss, red cell transfusion","high_causes":"Prediabetes, type 2 diabetes, high carbohydrate diet, sedentary lifestyle, iron deficiency (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3513","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to maintain blood sugar after an overnight fast. At 3.8 it is within the optimal range of 2 to 8, meaning the pancreas is producing a small, efficient amount of insulin and the cells are responding well to it. A high fasting insulin would indicate the cells are becoming resistant and the pancreas is compensating by overproducing, which is an early driver of type 2 diabetes. This result, combined with the excellent HOMA-IR, is one of the strongest positives in the report.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting state","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, high sugar intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747","units":"ug/L","description":"C-peptide is a byproduct released in equal amounts to insulin when the pancreas produces it. It provides a more stable measure of pancreatic insulin production than insulin itself, because it is not cleared as quickly by the liver. At 1.43 it is within the laboratory range and consistent with the healthy insulin and glucose levels, confirming the pancreas is working efficiently without overproducing.","low_causes":"Type 1 diabetes, low insulin demand, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting glucose measures the sugar level in the blood after an overnight fast. At 4.9 it is within the optimal range of 4.0 to 5.4, confirming the body is regulating blood sugar efficiently. Combined with the low insulin and healthy HbA1c, this completes an excellent metabolic picture.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Prediabetes, type 2 diabetes, stress response, medications (steroids), Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4571","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate average blood sugar over the past two to three months. At 6.4 it is within the reference range of below 7 but slightly above the optimal ceiling of 6.2. This is a mathematical conversion and adds no new information beyond the HbA1c of 38, which is within the healthy range. The small gap above optimal reflects normal variation rather than a blood sugar problem.","low_causes":"Low HbA1c, haemolytic conditions","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4847","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose to estimate insulin resistance without needing insulin itself. At 8.53 it is within the reference range but marginally above the optimal ceiling of 8.5. The slight elevation is driven by the triglycerides at 1.29. Given the excellent HOMA-IR of 0.83 and healthy insulin, this small margin above optimal is not a concern but supports the recommendation to lower triglycerides through dietary changes.","low_causes":"Low triglycerides, low glucose, high insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4196","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It is the inactive form that is converted into the active form, T3, in the tissues. At 14.4 it is within the laboratory range and just inside the optimal floor of 14, sitting in the lower quarter of the range. In the context of positive thyroid antibodies, this is worth watching: as autoimmune damage progresses, free T4 is typically the first hormone to fall. For now, the thyroid is still producing adequately, but annual monitoring is important.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4098","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland in the brain. It acts as a thermostat for the thyroid: when thyroid hormone levels drop, TSH rises to tell the thyroid to work harder. At 1.52 it is within the ideal range of 1.0 to 2.5, meaning the pituitary is not having to push the thyroid. This is reassuring given the positive antibodies, because a rising TSH is the first biochemical sign that the thyroid is struggling. Annual monitoring will detect any change.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, thyroid hormone resistance, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4741","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use for energy, metabolism and temperature regulation. It is converted from T4 in the tissues. At 4.5 it sits right at the optimal floor. The FT3:FT4 ratio of 0.313 is within the ideal range of 0.27 to 0.40, confirming the body is converting T4 to T3 adequately. For now the thyroid is delivering enough active hormone, but this is a marker to include in annual monitoring alongside TSH and FT4.","low_causes":"Hypothyroidism, non-thyroidal illness (sick euthyroid), calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excessive T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"45.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are proteins the immune system produces when it mistakenly targets thyroid peroxidase, an enzyme the thyroid needs to produce its hormones. At 45.4, more than three times the upper limit of 13.8, this is a clearly positive result. Elevated TPO antibodies are the hallmark of autoimmune thyroiditis, most commonly Hashimoto's thyroiditis. This does not mean the thyroid has failed; his TSH and hormone levels show it is still functioning. However, the immune process is underway and annual monitoring is recommended so that any future decline in thyroid function is caught early.","low_causes":"Normal finding, no autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis, family history of autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"69.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses as a building block for its hormones. At 69.6, more than fifteen times the upper limit of 4.4, this is a strongly positive result. More than 80% of the population have undetectable levels of this antibody. When elevated alongside TPO antibodies, the combination strongly suggests autoimmune thyroiditis (Hashimoto's pattern). Both antibodies being positive increases the probability of eventual progression to hypothyroidism, though many people remain euthyroid (normal thyroid function) for years or indefinitely. Annual monitoring with his GP is the appropriate response.","low_causes":"Normal finding, no autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.313","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio measures how efficiently the body converts the inactive thyroid hormone (T4) into the active form (T3). At 0.313 it is within the optimal range of 0.27 to 0.40, confirming healthy thyroid hormone conversion. This is reassuring in the context of the positive thyroid antibodies: the conversion machinery is working well even though the gland is under autoimmune pressure.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2778","units":"ng/ml","description":"PSA, or prostate-specific antigen, is a protein produced by the prostate gland. It is used as a screening marker for prostate conditions including benign enlargement and prostate cancer. At 1.3 it is well within the normal range of below 4.5 and within the optimal range, which is a reassuring result at 60.","low_causes":"Generally reflects normal prostate health","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2778","units":"ug/L","description":"Free PSA measures the proportion of PSA that is circulating unbound. The free PSA ratio, calculated as free PSA divided by total PSA, helps distinguish benign prostate conditions from malignancy. A ratio above 0.19 (19%) is considered normal. His ratio at 0.20 (20%) is reassuring and, combined with the low total PSA, makes prostate malignancy unlikely.","low_causes":"Generally not clinically significant in isolation","high_causes":"Benign prostatic hyperplasia (higher free fraction is reassuring)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"PSA Ratio","group":"PROSTATE","result":"0.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5263","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6579","upper_optimal_position":"1.0000","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps distinguish benign from malignant prostate conditions. At 0.20 it is above the 0.19 normal threshold but below the 0.25 level considered more reassuring. His ratio sits in the in-range zone; combined with a total PSA of just 1.3, the overall prostate picture is reassuring, though it falls short of the more confident threshold.","low_causes":"Higher proportion of bound PSA, which may be associated with malignancy","high_causes":"Benign prostatic hyperplasia (higher free fraction is reassuring)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"7.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1065","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic and biliary cancers, though it can also be mildly elevated in benign conditions. At 7.88, well below the 37 threshold, this is a reassuring result and makes pancreatic or biliary malignancy very unlikely.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, biliary obstruction, pancreatitis, liver disease, other gastrointestinal cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2283","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/ml","description":"CEA, or carcinoembryonic antigen, is a protein used as a tumour marker, particularly for colorectal cancer. At 1.05, well within the reference range of below 2.3, this is a reassuring result. In the context of the stool blood finding and ongoing bowel investigation, a normal CEA is a useful piece of reassurance, though it does not replace the direct investigation the BUPA team is pursuing.","low_causes":"Normal finding","high_causes":"Colorectal cancer, other gastrointestinal cancers, smoking, inflammatory bowel disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4596","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/L","description":"IgG is the most abundant immunoglobulin and provides the majority of antibody-based immunity against bacterial and viral infections. At 10.1 it is within the laboratory range, confirming a healthy immune response. This is the antibody the body produces after infection or vaccination to provide lasting protection.","low_causes":"Immune deficiency, medications (immunosuppressants), chronic disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.5333","units":"g/L","description":"IgM is the first antibody the immune system produces when it encounters a new infection. At 0.8 it is within the laboratory range, confirming a normal early immune response. An elevated IgM might suggest an acute or recent infection, while a very low level might suggest immune deficiency.","low_causes":"Immune deficiency, some genetic conditions","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5161","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces, including the gut, lungs and urinary tract. At 2.1 it is within the laboratory range. A normal IgA is also important for the reliability of the coeliac disease screening test (tissue transglutaminase IgA), which is negative in this report.","low_causes":"Selective IgA deficiency (common, often asymptomatic), immune deficiency","high_causes":"Chronic infection, liver disease, coeliac disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"1.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0054","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"5 ,"result_position":"0.3970","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. It follows a natural rhythm, peaking in the morning and declining through the day. At 236, within the expected morning range and within the optimal band, this confirms healthy adrenal function. His quiz answers support this: stress rarely feels hard to manage, energy is steady, and he wakes feeling refreshed.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic stress exhaustion","high_causes":"Acute stress, Cushing's syndrome, steroid medication, sleep deprivation, overtraining","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3457","lower_normal":"0","upper_normal":"146.1","lower_optimal":"","upper_optimal":"130","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen, produced in small amounts in men from testosterone via the enzyme aromatase. It plays a role in bone density, cardiovascular health and brain function. At 101 it is within the optimal range for a man, confirming healthy and proportionate oestrogen levels.","low_causes":"Low testosterone (as the precursor), aromatase inhibitor use, low body fat","high_causes":"Obesity (increased aromatase activity), liver disease, medications, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.55","within_normal":"FALSE","within_optimal":"FALS function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
