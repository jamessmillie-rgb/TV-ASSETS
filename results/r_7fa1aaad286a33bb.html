<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"DAVID MARCUS PHILLIPS MAISEY","dob":"25/02/1966","report_date":"2026-11-11","summary":"Patient is a 60-year-old male presenting with a BMI of 26.9, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). He trains twice a week with cardio at hard intensity and does no resistance training, averaging 5,000 to 7,500 daily steps. He sleeps 6 to 7 hours and wakes feeling refreshed, with steady energy through the day. Stress feels hard to manage rarely. He drinks 1 to 4 alcoholic drinks a week. He takes no medications and supplements with omega-3 fish oil. He has no diagnosed conditions. A previous blood test flagged something, and a recent BUPA medical showed slightly raised cholesterol and trace elements of blood in a stool sample, which is being followed up. He reports joint pain and stiffness that has lasted over a year. His goal is to improve long-term health and longevity.\n\nThe finding in this report that should go to his GP first is the combination of positive thyroid antibodies with low ferritin and microscopic blood in the urine. His thyroid peroxidase antibodies (TPO) are 45.4, more than three times the upper limit of 13.8, and his thyroglobulin antibodies are 69.6, more than fifteen times the upper limit of 4.4. These antibodies are proteins the immune system produces when it mistakenly targets the thyroid gland, and their presence at these levels is strongly associated with a condition called Hashimoto's thyroiditis, the most common cause of underactive thyroid. Right now, his thyroid is still functioning: his TSH, the hormone the pituitary gland sends to tell the thyroid to work harder, is 1.52, comfortably within the ideal range of 1.0 to 2.5, and his free T4 at 14.4 is within the laboratory range of 11.5 to 22.7, though it sits in the lower quarter. His free T3 at 4.5 is at n alongside the stool findings, because the two together point to the same explanation.\n\nHis urine sample showed red blood cells at 30, above the threshold of 25 that the laboratory considers significant. No white cells were present above threshold, no nitrites were detected, no bacteria grew, and protein was negative. Isolated microscopic haematuria, which means blood visible under the microscope but not to the naked eye, in a 60-year-old man warrants urological investigation. In many cases the cause is benign, a small blood vessel in the bladder or prostate, but at this age the GP should arrange further assessment to exclude anything more significant. His PSA, the prostate-specific antigen, is 1.3, comfortably below the 4.5 threshold, and his free PSA ratio at 0.20 sits just above the 0.19 normal threshold and is in a reasonable range, so the prostate picture is reassuring from a cancer-screening perspective, but microscopic haematuria is investigated on its own merits regardless of the PSA.\n\nTurning to the positives, and there are many. His metabolic health is excellent. His fasting glucose at 4.9 is within the ideal range, his HbA1c at 38 mmol/mol is within the normal threshold of 42, though just above the optimal ceiling of 36, and his fasting insulin at 3.8 is low and healthy, giving a HOMA-IR of 0.83, which means his cells are highly sensitive to insulin. This is exactly where it should be and is a strong foundation for long-term health and longevity. His C-peptide at 1.43 confirms the pancreas is producing insulin efficiently without overworking. His liver is in excellent health. ALT at 18 and GGT at 21 are both within the optimal range, AST at 22 is healthy, and bilirubin, albumin and alkaline phosphatase are all where they should be. The FIB-4 score, a formula that estimates liver scarring, comes back at 1.56, marginally above the 1.45 threshold, but at 60 years old this score is being driven by his age entering the calculation rather than by any sign of liver disease. With ALT at 18, GGT at 21, AST at 22, normal albumin and normal bilirubin, there is no clinical concern about liver fibrosis. His APRI score at 0.275 and NAFLD fibrosis score at minus 1.09 both confirm that liver scarring is very unlikely. His kidney function measured by creatinine gives an eGFR above 90, but his cystatin C, a more precise measure of kidney filtration that is not affected by muscle mass, is 1.18, above the 1.1 threshold, giving a cystatin C eGFR of 79. The combined eGFR is 79. At 60, an eGFR in the high 70s is common and sits within the expected range for age, but it is worth the GP having a baseline to track over time. His urea, sodium, chloride and bicarbonate are all within range, and the calculated serum osmolality at 290.9 is healthy. His cortisol at 236 is within the expected morning range, and his stress and energy answers confirm this: the adrenal axis is functioning well.\n\nHis cardiovascular profile is mixed and worth understanding in detail, particularly given the slightly raised cholesterol his BUPA medical flagged. His total cholesterol at 4.3 is below the desirable threshold of 5.18, his triglycerides at 1.29 are within the healthy range, and his VLDL at 0.59 is healthy. His HDL, the protective cholesterol that carries lipid away from artery walls, is 1.1, which is above the 1.04 low-risk floor but below the 1.55 level considered desirable and below the optimal threshold of 1.4 for men. His LDL at 2.66 is within the laboratory range of 0.5 to 3 but above the optimal target of 2.6 by a small margin. His ApoB, a protein that sits on every LDL and VLDL particle and is the best single measure of atherogenic particle count, is 0.93, above the 0.9 desirable threshold. The Lp(a)-corrected LDL, which removes the inherited component that cannot be changed, is 2.58, meaning almost all of his LDL is modifiable through diet and lifestyle. His Lp(a) itself is below 25, which is genuinely useful information: it means the cardiovascular risk he does carry is driven entirely by modifiable factors. His ApoB to ApoA1 ratio at 0.56 is below 0.7, which is lower risk, and his TC/HDL ratio at 3.91 is below 4.5. The cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c that measures the risk being built regardless of age, is 45, above the 40 threshold. The two inputs driving that score are the ApoB at 0.93 and the HDL at 1.1. This is not an emergency, but it is the area of his health with the most room for improvement, and it aligns with what BUPA flagged. The good news is that every driver is modifiable: increasing soluble fibre, increasing oily fish intake alongside his existing omega-3 supplement, adding regular resistance training, and bringing the HDL up through sustained aerobic work are all proven to shift these numbers.\n\nHis inflammatory markers are reassuring. His hsCRP, the most sensitive measure of systemic inflammation, is 0.9, below the ideal threshold of 1.0, which at a BMI of 26.9 is a genuinely good result. His ESR at 6 is well within range. His IgG, IgA and IgM immunoglobulins are all within range, and his IgE at 1.09 is very low, making allergic or parasitic conditions extremely unlikely. Tissue transglutaminase IgA is negative, making coeliac disease very unlikely. His total antioxidant activity at 2.04 is above the 1.77 upper limit, which in the context of omega-3 supplementation and a diet rich in vegetables and fruit is expected and is a positive finding reflecting good antioxidant intake.\n\nHis red cell indices are healthy. Haemoglobin at 146 is within the optimal range, red blood count at 4.6 is within range, MCV at 93.8 and MCH at 31.8 are healthy, and his haematocrit at 0.432 is within range. His RDW at 14.1 is within range. His reticulocyte percentage at 0.73 is within the laboratory range, but his absolute reticulocyte count at 33.58 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count alongside low ferritin suggests the bone marrow does not have enough iron to produce red cells at its full rate. This is consistent with the iron depletion picture and should improve once iron stores are replenished. His white cell count at 3.98 is fractionally below the lower limit of 4.0, and his lymphocytes at 1.05 sit just above their lower limit. At this margin, and with neutrophils at 2.51 comfortably within range, this is almost certainly a normal variant for him rather than a sign of immune compromise. Some people naturally run a white cell count just below 4, and mild iron deficiency can contribute. The platelet count at 200 is healthy. His MPV, which measures the average size of his platelets, is 10.5, marginally above the 10.1 upper limit. Larger platelets are younger and more active, and a mildly elevated MPV on its own, with a normal platelet count and no bleeding symptoms, is not a clinical concern.\n\nHis vitamin D at 84 is within the sufficient range and within the optimal band of 75 to 120, which is good. His B12 at 491 is within range but below the optimal floor of 500, so there is a small gap to close. His folate at 17 is at the top of the range, reflecting his good vegetable intake. His calcium at 2.41, corrected calcium at 2.41, phosphate at 0.9, magnesium at 0.85 and parathyroid hormone at 2.2 are all within their respective ranges, confirming healthy bone mineral metabolism. His magnesium at 0.85 sits exactly at the optimal floor, so there is room to strengthen it.\n\nHis hormones are in good shape for 60. Testosterone at 19.4 is within the ideal range of 18 to 30, and free testosterone at 0.338 and bioavailable testosterone at 7.74 are both within their optimal bands. SHBG at 46.2 is within the ideal range, LH and FSH are within range, and his free androgen index at 41.99 is healthy. Oestradiol at 101 is within range, and DHEA-S at 1.2 is within range. Prolactin at 71 is within range. Progesterone at 0.55 is below the laboratory range of 0.89 to 3.88, but in men progesterone is produced in small amounts and a level below range is common and clinically insignificant. His creatine kinase at 160 is mid-range, consistent with his cardio training. His amylase at 76 and lipase at 37 are both within range, confirming healthy pancreatic function. His tumour markers are reassuring: PSA at 1.3 with a healthy free ratio, CA19-9 at 7.88 well below 37, and CEA at 1.05 well within the normal range.\n\nHis PhenoAge, a biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 55.9 against a calendar age of 60, meaning his body is ageing roughly four years younger than his birth certificate. This is a genuinely positive result and reflects his good metabolic health, low inflammation and healthy liver and kidney function. The markers most responsible for keeping that number down are his low CRP, healthy glucose and good albumin.\n\nHis MCHC at 339 is comfortably within range. His urine pH at 5, specific gravity at 1.03, and all other urinary parameters aside from the red blood cells are unremarkable.\n\n","links":"The most important thread running through this report connects three findings: low ferritin, low absolute reticulocytes, and microscopic blood in the urine. Ferritin at 12 in a 60-year-old man who does not menstruate points to iron being lost rather than simply not eaten, and the BUPA finding of trace blood in a stool sample provides the most likely route of that loss. The bone marrow responds to depleted iron stores by slowing its production of new red blood cells, which explains the absolute reticulocyte count sitting at 33.58 against a lower limit of 50. The haemoglobin has not yet fallen, at 146 it is healthy, but the production line is running below capacity. The microscopic haematuria, red cells at 30 in the urine, may be a separate finding or may share a common vascular or inflammatory cause with the stool blood. The GP needs to see all three together.\n\nThe second thread is the thyroid autoimmunity. Both TPO antibodies at 45.4 and thyroglobulin antibodies at 69.6 are elevated, and together they paint a clear picture of the immune system targeting the thyroid gland. The thyroid is still keeping up, TSH at 1.52 confirms the pituitary is not having to push it, but free T4 at 14.4 sits in the lower quarter of its range and free T3 at 4.5 is at the bottom of the ideal band. This may reflect early, subclinical impact, or it may simply be where his set point sits. The GP should establish a monitoring schedule, typically annual TSH and free T4, so that any drift toward hypothyroidism is caught early. The joint pain and stiffness he has experienced for over a year may or may not be related: Hashimoto's thyroiditis is associated with joint symptoms, though the normal rheumatoid factor and low CRP make an aggressive inflammatory arthritis unlikely.\n\nThe third thread is cardiovascular. ApoB at 0.93, LDL at 2.66, and HDL at 1.1 combine to give a cardiovascular risk score of 45, above the 40 threshold. His Lp(a) below 25 is the key exclusion: it means none of this cardiovascular risk is inherited and unchangeable. Every driver, the ApoB, the LDL, the HDL, responds to diet, exercise and time. This aligns with the slightly raised cholesterol his BUPA medical flagged and gives him a clear set of targets to work toward.\n\nWhat has been excluded is as important as what has been found. His metabolic health is excellent, with a HOMA-IR of 0.83, a fasting glucose of 4.9 and an HbA1c of 38, so insulin resistance and prediabetes are not contributing to his cardiovascular picture. His liver is clean, his inflammatory markers are low, his prostate screening is reassuring, and his tumour markers are unremarkable. The coeliac screen is negative, his immunoglobulins are balanced, and his cortisol and adrenal hormones are healthy.\n\nThe loose end is the joint pain. The bloods make rheumatoid arthritis and coeliac disease unlikely, and inflammation is low. The thyroid antibodies are one possible contributor. At 60, osteoarthritis, the mechanical wear-and-tear form, is the most common explanation for persistent joint stiffness, and blood tests do not diagnose it; imaging and clinical examination do. If the GP considers it worthwhile, an X-ray of the affected joints would settle it.","lifestyle":"Add two portions of oily fish a week, such as salmon, mackerel or sardines, on top of your existing omega-3 supplement. Anchor: pick two fixed days, for example Tuesday and Friday, and make fish the default protein at dinner. Why: oily fish raises HDL and lowers triglycerides, both of which drive your cardiovascular risk score of 45 downward, and the omega-3s support joint health.\nAdd a source of soluble fibre to breakfast and lunch every day: oats, beans, lentils or a handful of nuts. Anchor: porridge or overnight oats as the default breakfast. Why: soluble fibre binds cholesterol in the gut before it reaches the bloodstream and is the most effective dietary tool for lowering ApoB, which at 0.93 is the main number to move.\nPair iron-rich foods with vitamin C at the same meal: red meat, dark poultry, lentils or spinach alongside peppers, tomatoes or citrus. Anchor: at least three meals a week built around one of those iron sources. Why: your ferritin is 12, below the 22 lower limit, and dietary iron with vitamin C maximises absorption while the GP investigates the cause of the depletion.\nAdd two resistance training sessions a week, even 30 minutes of bodyweight exercises or dumbbells at home. Anchor: attach them to two of your existing training days, before or after your cardio. Why: resistance training raises HDL, improves insulin sensitivity further, strengthens joints, and preserves bone density and muscle mass, all of which support your longevity goal at 60.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk blunts the glucose and insulin response to that meal and contributes to your daily step count, moving you toward the 7,500 to 10,000 range.\nAim for 7 to 7.5 hours of sleep rather than 6 to 7. Anchor: set a fixed lights-out time 7.5 hours before your alarm. Why: sleep below 7 hours is associated with higher inflammatory markers, slower recovery from training, and impaired immune regulation, which matters with thyroid antibodies circulating.\nKeep alcohol at or below 4 drinks a week. You are already close to this. Why: at low levels alcohol has minimal impact, but keeping it low supports liver health and HDL over time.\nCalorie target: approximately 2,300 to 2,500 kcal per day to maintain weight while supporting training and recovery (BMR approximately 1,780 kcal multiplied by a moderate activity factor of 1.45 gives a TDEE of roughly 2,580; eating at or slightly below this). Protein target: 120 to 145 grams per day (1.3 to 1.6 g per kg of bodyweight for an active man), spread across three meals. If the GP confirms iron deficiency and recommends a modest weight cut, a deficit of 300 kcal per day (around 2,200 kcal) with protein held at 130 g or above would support gradual fat loss without compromising recovery.","flags":"Thyroid peroxidase antibodies 45.4 (limit below 13.8) and thyroglobulin antibodies 69.6 (limit below 4.4). Both elevated, consistent with autoimmune thyroiditis (Hashimoto's pattern). TSH 1.52 and free T4 14.4 show the gland is still functioning, but annual monitoring of TSH and free T4 is recommended to detect any progression toward hypothyroidism.\nFerritin 12 (range 22 to 322), below range in a 60-year-old male, with transferrin saturation 23% (laboratory range 18 to 55%, optimal above 25%). In the context of a recent positive faecal occult blood test, this is consistent with chronic low-grade gastrointestinal blood loss. Absolute reticulocyte count 33.58 (range 50 to 100) confirms disease unlikely; hsCRP 0.9 and ESR 6 make significant systemic inflammation unlikely; HOMA-IR 0.83 with fasting glucose 4.9 and HbA1c 38 makes insulin resistance and prediabetes unlikely; IgE 1.09 makes allergic conditions unlikely.\nNot reported on this occasion: Potassium.","recommendations":"Discuss the thyroid antibody results with your GP. TPO antibodies 45.4 and thyroglobulin antibodies 69.6 are both elevated, consistent with autoimmune thyroiditis. Request annual monitoring of TSH and free T4 to detect any progression, and mention the joint pain and stiffness as a potentially related symptom.\nBring the ferritin result of 12 to your GP alongside the BUPA stool blood finding. These two results together suggest chronic gastrointestinal iron loss. The GP may wish to request iron studies after the bowel investigation is complete and consider iron supplementation once the source of loss is understood.\nRequest urological assessment for the microscopic haematuria (urinary red blood cells 30, threshold 25). PSA is reassuring at 1.3, but isolated microscopic haematuria at 60 warrants investigation in its own right.\nMention the cardiovascular picture: ApoB 0.93 (target below 0.9), HDL 1.1 (target above 1.4), and cardiovascular risk score 45. Ask whether a formal cardiovascular risk assessment (such as QRISK3) would be appropriate, and discuss whether dietary changes alone are sufficient or whether the GP would consider further intervention.\nMention the cystatin C eGFR of 79 so it is recorded as a baseline for future comparison. No action is needed now, but it is useful for the GP to have on file.\nAim for a retest in four to six months. Key markers to repeat: ferritin, full blood count (to check reticulocytes have recovered), TSH, free T4, ApoB, HDL, cystatin C, and a urine dipstick. By then, the bowel investigation should be complete, iron stores should be recovering, and the dietary changes should be reflected in the lipid markers.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily taken with a fat-containing meal. His level at 84 is within the optimal band, so this is a maintenance dose to keep it there through winter. Always pair with vitamin K2 (MK-7), 100 mcg daily, which directs calcium into bone rather than artery walls.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. His B12 at 491 is just below the optimal floor of 500. Sublingual delivery bypasses the gut and is more reliable than oral tablets, particularly at 60 when absorption can decline.\nMagnesium glycinate, 300 mg before bed. His magnesium at 0.85 sits at the bottom of the optimal range, and glycinate is the form best absorbed and least likely to cause gut discomfort. It supports sleep quality, muscle recovery and bone health.\nOmega-3 fish oil: continue his current supplement and aim for a combined EPA plus DHA intake of 2 to 3 grams per day (check the label, as many capsules contain only 300 to 500 mg of actual EPA and DHA per capsule). This supports the HDL and triglyceride targets and has anti-inflammatory properties relevant to his joint symptoms.\nDO NOT start iron supplementation without GP guidance. His ferritin at 12 is below range and his iron stores need replenishing, but the cause of the depletion, likely gastrointestinal blood loss given the positive stool test, needs to be identified first. Once the GP has completed the bowel investigation and confirmed there is no contraindication, ferrous bisglycinate 25 mg taken with vitamin C on an empty stomach is the best-tolerated form. The GP will advise on dose and duration.\nThe most important changes from this report are not supplements. They are adding resistance training, increasing soluble fibre and oily fish, and completing the GP investigations for the thyroid antibodies, the low ferritin and the microscopic haematuria.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"71","within_normal" "padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built regardless of age and has no age term. At 45 it is above the 40 threshold. The two inputs driving the score are ApoB at 0.93 and HDL at 1.1. Every driver is modifiable: increasing soluble fibre, oily fish, resistance training and sustained aerobic exercise are all proven to improve these numbers. The score should come down at the retest.","low_causes":"Healthy lipids, low inflammation, good metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"146","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. His level at 146 is within the optimal range for men, confirming good oxygen-carrying capacity. This is reassuring given his low ferritin, as it means the iron depletion has not yet affected haemoglobin production, though the low reticulocyte count suggests the bone marrow is beginning to feel the strain.","low_causes":"Iron deficiency, chronic blood loss, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^12/L","description":"Red blood count measures the total number of red blood cells per litre of blood. His result at 4.6 is within the laboratory range and at the lower end, just at the floor of the optimal band. This is adequate but consistent with the early iron depletion picture seen in his ferritin and reticulocyte count.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic lung disease, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.432","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4400","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.432 it is within the laboratory range and within a healthy band, reflecting adequate red cell mass. Hydration, altitude and training can all influence this number day to day.","low_causes":"Anaemia, overhydration, blood loss, nutritional deficiencies","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5810","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"RDW, or red cell distribution width, measures how varied the sizes of red blood cells are. A wider spread can indicate the bone marrow is producing a mix of older and newer cells of different sizes. At 14.1 he is within the laboratory range but above the optimal ceiling of 13.5. In the context of low ferritin, a mildly elevated RDW may reflect early iron-deficient red cell production alongside normal-sized existing cells.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, chronic disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"93.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"MCV, or mean corpuscular volume, is the average size of a red blood cell. At 93.8 it is within the optimal range, indicating red cells are a healthy size. Small cells suggest iron deficiency, large cells suggest B12 or folate deficiency. His cells are normally sized, which is consistent with an early stage of iron depletion where haemoglobin and cell size have not yet been affected.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folat wer_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot when a vessel is damaged. At 200 his count is within the optimal range, confirming healthy clotting function. Neither excessive clotting risk nor a bleeding tendency is suggested.","low_causes":"Viral infection, bone marrow suppression, medications, autoimmune conditions, liver disease","high_causes":"Iron deficiency, infection, inflammation, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV, or mean platelet volume, measures the average size of platelets. Larger platelets are younger and more metabolically active. His MPV at 10.5 is marginally above the upper limit of 10.1. With a healthy platelet count of 200 and no signs of bleeding or clotting problems, this is not a clinical concern and may reflect the bone marrow producing slightly larger, younger platelets as part of normal turnover.","low_causes":"Bone marrow suppression, aplastic conditions, cytotoxic medications","high_causes":"Increased platelet turnover, immune thrombocytopenia, inflammatory conditions, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3322","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_positi out adequate iron stores, the marrow cannot build haemoglobin into new cells at the normal pace. This should improve once iron stores are replenished.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease, aplastic anaemia","high_causes":"Haemolytic anaemia, acute blood loss with marrow compensation, erythropoietin therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"20.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by red blood count and is used to help distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. His MCV is normal at 93.8, so the index does not apply in his case and is reported for context only.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"  is a buffer that helps maintain the pH of the blood within a narrow, healthy range. At 26.8 it is within the optimal range, indicating well-balanced acid-base chemistry.","low_causes":"Metabolic acidosis, kidney disease, diabetic ketoacidosis, severe diarrhoea","high_causes":"Metabolic alkalosis, prolonged vomiting, diuretic use, chronic respiratory disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product of protein metabolism, filtered out by the kidneys. At 6 it is within the optimal range, confirming the kidneys are efficiently clearing protein waste. This is consistent with an adequate protein intake and good kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney impairment, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a steady rate. At 78 it is within the optimal range, and the creatinine-based eGFR is above 90, which looks healthy. However, the cystatin C-based eGFR gives a more precise picture at 79, which is discussed separately.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney impairment, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"432","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5494","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in many foods and produced naturally by the body. The kidneys filter it out. At 432 he is within the laboratory range of 220 to 547 but above the optimal ceiling of 380 for men. Elevated uric acid is associated with gout, a form of inflammatory arthritis that causes sudden, severe joint pain, and with cardiovascular risk. Given his joint pain and stiffness, it is worth the GP knowing this number, although gout typically presents as acute flares rather than chronic stiffness. Reducing high-purine foods such as organ meats, shellfish and beer, and staying well hydrated, can help lower uric acid over time.","low_causes":"Low purine diet, medication effects, liver disease","high_causes":"High purine diet, alcohol, kidney impairment, metabolic syndrome, dehydration, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet or exercise, making it a more precise measure of kidney filtration. At 1.18 it is above the 1.1 upper limit, giving a cystatin C-based eGFR of 79, which suggests mildly reduced kidney filtration. At 60, a gradual decline in GFR is normal, and 79 is within the expected range for age, but it is worth the GP recording this as a baseline.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Reduced kidney function, hypothyroidism, inflammation, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR, or estimated glomerular filtration rate, estimates how well the kidneys filter waste from the blood. Calculated from creatinine, his eGFR is above 90, which is classified as normal. However, creatinine-based eGFR can overestimate kidney function in people with average or lower muscle mass. The cystatin C-based eGFR of 79 provides a more accurate picture in this case.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, medications","high_causes":"High muscle mass, high protein diet, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to estimate kidney filtration, providing the most accurate single assessment of kidney function. At 79 it is above the 60 threshold that defines chronic kidney disease but below the 90 optimal level. At 60 years of age, a gradual decline in GFR is expected as part of normal ageing, and 79 falls within that expected trajectory. Worth recording as a baseline for future comparison but not a cause for concern at this level.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Generally reflects good kidney function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"76.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5383","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between different causes of raised urea. At 76.9 it is within the optimal range, confirming that the balance between protein waste production and kidney clearance is healthy. A very high ratio can suggest dehydration or upper gastrointestinal bleeding, while a very low ratio may suggest liver disease.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hsCRP) is one of the most useful measures of systemic inflammation. It is produced by the liver in response to inflammation anywhere in the body. At 0.9 it is below the ideal threshold of 1.0, which is an excellent result. Low hsCRP is associated with lower cardiovascular risk and suggests that the autoimmune thyroid process, while present, is not generating significant systemic inflammation.","low_causes":"Generally reflects low inflammation","high_causes":"Infection, chronic inflammation, cardiovascular risk, autoimmune disease, obesity, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or homeostatic model assessment of insulin resistance, is a calculation that combines fasting glucose and fasting insulin to estimate how sensitive the body's cells are to insulin. A lower number means greater insulin sensitivity. At 0.83 he is within the optimal range, meaning his cells respond efficiently to insulin and the pancreas does not have to overproduce it. This is one of the strongest positive findings in the report and is an excellent foundation for long-term metabolic health.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting state","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, high sugar intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"57","upper_normal":" al_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/L","description":"Gamma GT (GGT) is a liver enzyme that is particularly sensitive to alcohol, medications and bile duct problems. At 21 it is well within the optimal range of below 25, confirming the liver is handling his modest alcohol intake without strain. GGT is one of the earliest markers to rise when the liver is under stress, so a clean reading is a genuine positive.","low_causes":"Generally not clinically significant","high_causes":"Alcohol, fatty liver, bile duct disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5076","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starches. At 76 it is within the optimal range, confirming healthy pancreatic function. A significantly elevated amylase would suggest inflammation of the pancreas (pancreatitis).","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. At 37 it is within the optimal range, complementing the normal amylase and confirming the pancreas is functioning well.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease, gallbladder disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5379","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a formula that combines age, AST, ALT and platelet count to estimate the likelihood of liver fibrosis (scarring). At 1.56 it is marginally above the 1.45 threshold. However, age is a key input in this formula, and at 60 it inflates the score. His ALT at 18, GGT at 21, AST at 22, bilirubin at 9 and albumin at 42 are all healthy, and both the APRI score at 0.275 and the NAFLD fibrosis score at minus 1.09 confirm that liver scarring is very unlikely. The FIB-4 score is being driven by the calculation rather than by any sign of liver disease.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, age over 50, low ALT, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.41 it is within the optimal range. Combined with a normal corrected calcium, a normal parathyroid hormone and a healthy phosphate, his calcium and bone mineral metabolism is well balanced.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3793","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5900","units":"mmol/L","description":"Phosphate works alongside calcium to build and maintain bones and teeth, and plays a role in energy production at the cellular level. At 0.9 it is within the laboratory range, sitting right at the optimal floor. This is adequate and consistent with healthy bone metabolism alongside his normal calcium and parathyroid hormone.","low_causes":"Vitamin D deficiency, hyperparathyroidism, antacid use, refeeding syndrome, alcohol","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5172","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle contraction, nerve function and bone building. At 0.85 he sits exactly at the floor of the optimal range. While this is adequate, there is room to strengthen it. Magnesium glycinate supplementation before bed can support sleep quality, muscle recovery and bone health.","low_causes":"Poor dietary intake, alcohol, diuretics, gastrointestinal loss, diabetes","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8400","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone strength, immune regulation and mood. At 84 he is within the optimal range of 75 to 120. This is a good level. A maintenance dose of 2,000 IU of vitamin D3 daily through winter will keep it here.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, ageing, liver or kidney disease","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4418","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.5573","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the parathyroid glands in the neck and regulates calcium and phosphate balance. When calcium drops, PTH rises to pull calcium from bone and increase absorption from the gut. At 2.2 it is within the optimal range, and with calcium, corrected calcium, phosphate and vitamin D all healthy, the entire calcium-regulating system ations (methotrexate, anticonvulsants)","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium reading for the albumin level, giving a more accurate picture of the calcium available in the blood. At 2.41 it is within the optimal range, confirming healthy calcium metabolism.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium reading for blood glucose levels, which is relevant in diabetes where high glucose can dilute sodium. At 140, identical to his uncorrected sodium, this confirms his normal glucose is not affecting the sodium reading. Reported for context.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"290.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.598
