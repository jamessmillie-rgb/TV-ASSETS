<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Raeph Cumming","dob":"01/01/1980","report_date":"2026-11-10","summary":"Patient is a 46-year-old male presenting with a BMI of 21.1, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food daily; portions are about average (volume 5 out of 10). He trains three times per week (three cardio, no resistance) at moderate intensity with 2,000 to 5,000 daily steps. He sleeps 6 to 7 hours and wakes tired most mornings, with energy low all day. Stress feels hard to manage some weeks. He drinks 10 to 14 alcoholic drinks per week. He takes no medications. He supplements with vitamin D and magnesium. He has no diagnosed conditions. This is his first blood test. He reports low energy and fatigue, poor sleep and insomnia, low sex drive, and brain fog, all persisting for over a year. His goals are to improve energy levels, build muscle, and improve long-term health and longevity.\n\nThe finding that should be discussed with his GP first is the significantly raised GGT. His Gamma GT is 164, more than double the upper limit of 73. GGT, or gamma-glutamyl transferase, is an enzyme found mainly in the liver and bile ducts that rises when the liver is under strain, whether from alcohol, fatty change, medications, or metabolic stress. At 10 to 14 drinks per week, alcohol is the most likely driver here, and GGT is the liver enzyme most sensitive to regular alcohol intake. What makes this more noteworthy is that his other liver enzymes are not dramatically deranged: his ALT at 56 sits right at the upper limit of the reference range, and his AST at 35 is comfortably within range. The AST to ALT ratio, known as the De Ritis ratio, is 0.63, which is at the lower boundary of the normal range. When the De Ritis ratio is below 0.8, it typically suggests the liver irritation is coming from a metabolic or toxic source rather than from advanced liver disease, and the combination of a very high GGT with a borderline ALT and a normal AST is a pattern most commonly seen with regular alcohol use. His FIB-4 score, which estimates liver scarring by combining age, platelets, AST and ALT, is 0.94, well within the safe range and making significant fibrosis very unlikely at this stage. His APRI score of 0.384 and NAFLD fibrosis score of minus 3.1 both confirm the same reassuring picture: there is no sign of established liver damage. But the GGT at 164 is the liver waving a flag, and at this level the GP should be aware. A simple ultrasound of the liver would confirm whether there is any fatty change, and the single most effective intervention would be reducing alcohol to under seven drinks per week, ideally under four, for at least eight weeks and then retesting the GGT to see if it falls. This alone could be transformative for his energy, sleep, and mental clarity.\n\nHis urine shows red blood cells at 30 per microlitre, above the threshold of 25 that the laboratory considers significant. This is called microscopic haematuria, meaning blood cells visible under the microscope but not to the naked eye. His urine culture showed no bacterial growth, nitrites were negative, and white cells were at 10, which is not significant. There is no sign of infection. At 46, isolated microscopic haematuria is most commonly benign, often related to vigorous exercise, mild dehydration, or a small prostatic contribution, but it does need to be mentioned to the GP. His PSA is 0.62, which is very low and reassuring, and his kidney function is healthy, so the most likely outcome of investigation is reassurance, but the GP should decide whether a repeat sample and a referral for further assessment are warranted.\n\nHis neutrophils at 1.61 are below the lower limit of 2.0. Neutrophils are the most abundant white blood cells and the front line of the immune system against bacterial infection. A count of 1.61 is mildly low rather than dangerously low, and a mild dip like this can be temporary, for example after a recent viral illness. At his level of alcohol intake, alcohol is a plausible contributor: regular drinking can suppress bone marrow production of neutrophils. His total white cell count at 4.11 is just inside the lower limit, consistent with the neutrophil count pulling the total down. His lymphocytes at 1.99 are healthy, his monocytes, eosinophils and basophils are all normal, and his ESR at 2 and CRP below 0.5 show no inflammation whatsoever. This is worth the GP noting on his record, and it should be rechecked once the alcohol comes down; if it is still low, his GP can decide whether it needs looking into further.\n\nHis reticulocyte absolute count at 44.8 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a slightly low count means the marrow is producing red cells at a slightly slower rate than usual. His haemoglobin at 147 is perfectly healthy, his iron stores are good with a ferritin of 104 and a transferrin saturation of 28.6 percent, and his B12 at 442 and folate at 23 are both adequate, so there is no nutritional deficiency driving this. The most likely explanation is that the body simply does not need to produce red cells any faster because everything is in balance, and the marginal shortfall from the reference range is not clinically significant. It is worth monitoring on a future retest but does not need action now.\n\nTurning to the positives, and there are many. His cardiovascular profile is genuinely excellent. His total cholesterol at 4.3 is well controlled, his LDL at 2.34 is within the optimal range, and his ApoB, which is apolipoprotein B, the protein that carries LDL particles and the single best measure of how many atherogenic particles are circulating, is 0.8, right at the desirable threshold. His HDL at 1.6 is above the ideal level for a man, which is a strong protective factor. His triglycerides at 0.83 are excellent, and the triglyceride to HDL ratio, a surrogate marker for insulin resistance and small dense LDL particles, calculates to 0.52, which is well within the ideal range. His Lp(a), or lipoprotein little a, an inherited particle that adds cardiovascular risk independently of LDL, is below 25, which is reassuring because this inherited risk factor is not adding to his cardiovascular risk. His ApoB to ApoA1 ratio of 0.50 is in the lower risk category. His cardiovascular risk score is 5 out of 100, which is ideal and reflects the consistently strong performance across every lipid and metabolic input. His Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) particles to show the truly modifiable portion, is 2.26.\n\nHis blood sugar control is in good shape. Fasting glucose at 5.1 is within the ideal range, HbA1c at 39 mmol per mol is within the normal range, though above the tighter optimal threshold of 36, and his fasting insulin at 4.93 is low and healthy. His HOMA-IR, which stands for homeostatic model assessment of insulin resistance and is calculated from fasting glucose and insulin, is 1.12, sitting comfortably in the insulin-sensitive zone. His C-peptide at 1.18 micrograms per litre is at the lower end of the range but entirely consistent with a lean, insulin-sensitive man who does not need to produce much insulin to control his blood sugar. His TyG index of 8.13 and estimated average glucose of 6.5 are both within range.\n\nHis kidney function is healthy. Creatinine at 71 gives an eGFR above 90 by the creatinine method, and his cystatin C at 1.03 gives a cystatin C eGFR of 94. Cystatin C is a protein filtered by the kidneys that is not influenced by muscle mass the way creatinine is, so at his lean frame it provides a reliable second measure. The combined eGFR is 94, which is good function for 46. Uric acid at 285 is within range, urea at 3.9 is fine, and electrolytes including sodium at 136, chloride at 97 and bicarbonate at 29.2 are all normal. His calculated serum osmolality at 281 is within range.\n\nHis thyroid is working very well. TSH at 0.68, which is thyroid stimulating hormone, the pituitary signal that tells the thyroid how hard to work, is in the lower part of the range, indicating the pituitary is not having to push. Free T4, the storage form of thyroid hormone, is 21.1, which is in the upper part of the normal range and above the tighter optimal band, showing the thyroid is producing hormone abundantly. Free T3, the active form that cells actually use for energy and metabolism, is 6.6, which is in the upper part of the range and just above the optimal band, and represents excellent conversion from T4 to T3. The FT3 to FT4 ratio is 0.313, within the ideal range, confirming efficient conversion. Both thyroid antibodies, TPO and thyroglobulin, are negative, which makes autoimmune thyroid disease very unlikely. This is an important exclusion given his fatigue and brain fog, because an underactive thyroid is one of the most common treatable causes of those symptoms, and his results make an underactive thyroid unlikely.\n\nHis hormone profile is reassuring. Testosterone at 18.8 is within the optimal range for a man of 46, and his free testosterone, the portion not bound to proteins and available for the body to use, is 0.322, which is within range. His SHBG, sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation, is 46.9, in the middle of the range. His bioavailable testosterone, the fraction available to tissues, is 7.38, within the healthy range. LH at 2.5 and FSH at 4.9 are both normal, confirming the pituitary is communicating properly with the testes. DHEA-S at 4 micromoles per litre is healthy. Cortisol at 449 is within the morning reference range. Oestradiol at 101 is within range, and progesterone at 1.82 is normal for a male. Prolactin at 125 is normal. Given his reported low libido, the blood results do not point to a hormonal cause, which is useful information and redirects the search toward sleep, alcohol, and energy.\n\nHis iron studies are well balanced. Ferritin at 104 is in the ideal zone for a man, transferrin saturation at 28.6 percent is within the optimal range, serum iron at 18.1 and transferrin at 2.52 are both healthy. His haemoglobin at 147 and red cell indices are all normal, with an MCV of 91.9, MCH of 31.9 and haematocrit of 0.424 all sitting comfortably in range. Platelets at 228 and MPV at 8.6 are normal. His RDW at 13.4 is within range.\n\nHis vitamin D at 96 is within the optimal range of 75 to 120 and reflects his supplementation working well. His magnesium at 0.91 is within the optimal range and again reflects his supplementation. Calcium at 2.37 and phosphate at 1.0 are both normal, and PTH at 2.3 confirms calcium regulation is working properly. His B12 at 442 is within the laboratory range but sits below the optimal level of 500. Given his fatigue, brain fog and low energy, there is room to bring this up with sublingual methylcobalamin. His folate at 23 is above the upper limit of 17, which is not a concern and most likely reflects dietary intake or a supplement containing folic acid; high folate is not harmful unless B12 is deficient, which it is not.\n\nHis inflammatory markers are excellent. CRP below 0.5 and ESR at 2 together indicate virtually no systemic inflammation, which at any BMI is a positive finding and at his lean frame is expected. His immunoglobulins IgG at 10, IgM at 0.7 and IgA at 1.6 are all within range, and IgE at 12.2 is low, making an allergic component to any symptoms very unlikely. Rheumatoid factor at 4 is negative. His coeliac screen, tissue transglutaminase IgA, is negative, which makes coeliac disease very unlikely as a cause of his fatigue or any gut symptoms.\n\nHis prostate markers are excellent. PSA at 0.62 is very low, free PSA at 0.27 is well within range, and the free to total ratio at 0.435 is strongly reassuring. His tumour markers CA19-9 at below 1.2 and CEA at below 0.5 are both well within range. Creatine kinase at 75 is normal and suggests his muscles are not under excessive strain. Amylase at 63 and lipase at 39 are both normal, indicating healthy pancreatic function.\n\nHis PhenoAge is 36.6 against a calendar age of 46, which means his blood biomarkers are ageing nearly ten years younger than his birth certificate. This is driven by his excellent CRP, healthy albumin, good glucose control and low white cell count. It is a genuinely strong result and reflects good underlying biology.\n\nHis MCHC at 347 is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation. It is not clinically significant. His total antioxidant activity at 2.0 is above the upper reference of 1.77, which is not a concern.\n\nReturning to his symptoms of fatigue, low energy all day, poor sleep, low libido and brain fog, all lasting over a year, the bloods make the most common medical causes unlikely: his thyroid is working well, he is not anaemic, his iron is healthy, his B12 is adequate, his blood sugar and insulin are well controlled, there is no inflammation, his kidneys and liver are functioning (though the liver is under strain from alcohol), his testosterone is in the optimal range, and coeliac disease is unlikely. This is useful information because it narrows the search considerably. The most likely drivers of his symptoms, based on what his quiz tells us, are threefold. First, alcohol at 10 to 14 drinks per week. Regular alcohol at this level disrupts sleep architecture, specifically suppressing REM sleep and causing early waking, which would explain waking tired despite getting 6 to 7 hours. It impairs next-day energy, cognitive clarity and motivation, and over months and years it compounds into the exact pattern he describes: low energy all day, poor sleep, brain fog, and reduced libido. The GGT at 164 confirms the liver is feeling this. Second, sleep quantity and quality. Six to seven hours with poor quality is likely not providing enough restorative sleep, and if alcohol is fragmenting what sleep he does get, the effective recovery is even less. Third, daily sugary food alongside relatively low vegetable intake and no resistance training means he is not giving his body the building blocks or the stimulus to support his goal of building muscle, and the lack of resistance work may be contributing to lower baseline energy. His B12 at 442, while not deficient, is below the optimal level of 500, and supplementing this may offer a small additional benefit for energy and cognitive function.","links":"The central story in this report is a man whose internal biology is in very good shape, with a genuinely excellent cardiovascular profile, strong insulin sensitivity, healthy hormones and a PhenoAge nearly a decade younger than his calendar age, but whose liver is clearly signalling that alcohol at 10 to 14 drinks per week is too much. The GGT at 164, more than double the upper limit, is the loudest signal in the entire panel. The borderline ALT at 56, the mildly low neutrophils at 1.61 and the De Ritis ratio sitting at the floor of its range all fit the same explanation: regular alcohol irritating the liver and mildly suppressing bone marrow output. None of these findings, taken alone, would be alarming, but together they form a coherent pattern that points squarely at alcohol as the modifiable factor with the most potential for improvement.\n\nWhat is reassuring is that the liver has not progressed to scarring. The FIB-4 at 0.94, the APRI at 0.384 and the NAFLD fibrosis score at minus 3.1 all confirm that the liver architecture is intact. Albumin at 42 and bilirubin at 12 are both healthy, meaning the liver's synthetic and clearance functions are unimpaired. This is the window to act: the liver is complaining but has not been damaged, and reducing alcohol intake is likely to bring the GGT down substantially within eight to twelve weeks.\n\nThe symptoms he reports, fatigue lasting all day, poor sleep with tired waking, brain fog and low libido, for over a year, are not explained by any single blood abnormality. An underactive thyroid is unlikely with a healthy TSH, a strong FT3 and negative antibodies. He is not anaemic, with a haemoglobin of 147 and healthy iron stores. Testosterone at 18.8 is in the optimal range, which makes low testosterone unlikely as the cause. Blood sugar control is excellent and coeliac disease is unlikely. That leaves alcohol, sleep and lifestyle as the most plausible explanations, and the blood results support this conclusion: the GGT confirms the body is processing more alcohol than it would like, and the pattern of low-all-day energy with tired waking is the hallmark of alcohol-disrupted sleep rather than a medical condition.\n\nThe microscopic haematuria at 30 red blood cells per microlitre is a loose end that does not fit the alcohol story. It is an isolated finding with no infection, no protein in the urine, no casts and a very low PSA. It is most likely benign, perhaps related to exercise or mild dehydration, but at 46 it warrants a mention to the GP and potentially a repeat sample to confirm it resolves.\n\nThe reticulocyte count at 44.8 and the neutrophil count at 1.61 are both marginal findings that could both be explained by the mild bone marrow suppressive effect of regular alcohol. If the alcohol comes down, both are worth rechecking at the next test to see if they normalise.\n\nThe B12 at 442, while within the laboratory range, sits below the optimal threshold of 500. In a man reporting brain fog and fatigue, bringing this into the optimal zone with sublingual methylcobalamin is a low-cost, low-risk intervention that may contribute to improvement alongside the larger changes in alcohol and sleep.","lifestyle":"Reduce alcohol to under seven drinks per week, ideally under four, starting this week. Anchor: decide on two or three alcohol-free days and put them in the calendar as fixed. Why: the GGT at 164 is the single clearest signal in this report that the liver is under strain from alcohol, and reducing intake is the most impactful change for energy, sleep quality, brain fog and libido.\nStop all sugary food and drink for the first four weeks, then reintroduce as an occasional treat rather than a daily habit. Anchor: replace the daily sugar with a piece of fruit or a small handful of nuts. Why: daily sugar alongside alcohol compounds the metabolic load on the liver and contributes to the energy crashes behind your low-all-day fatigue.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, tinned fish, or a whey shake. Anchor: protein goes on the plate before anything else. Why: at 70 kg aiming to build muscle with no resistance training and average portions, he is almost certainly not eating enough protein. His target is 91 to 112 grams per day.\nStart two resistance training sessions per week, even if they are 30-minute full-body sessions at home or in a gym. Anchor: pick two fixed days and treat them like appointments. Why: he trains three times for cardio but does no resistance work, and resistance training is the primary stimulus for building muscle, raising resting metabolic rate, improving sleep quality and supporting long-term bone and metabolic health.\nIncrease vegetable and fruit intake from 2 to 3 portions to at least 5 per day. Anchor: add one portion to lunch and one to dinner this week, then build from there. Why: more fibre supports liver detoxification pathways, gut health and sustained energy, and 2 to 3 portions is below the threshold associated with reduced disease risk.\nSet a fixed wake time seven days a week, even on weekends, and get outside within 30 minutes of waking for natural light. Anchor: alarm goes off at the same time, shoes go on, walk outside. Why: a fixed wake time is the single most effective tool for consolidating sleep architecture, and morning light resets the circadian clock, which should help with his pattern of waking tired and feeling low all day.\nCut caffeine after 1pm. Anchor: set a phone alarm at 1pm as the caffeine cut-off. Why: caffeine has a half-life of five to six hours, meaning an afternoon coffee is still active at bedtime, and with 6 to 7 hours of already-short sleep, protecting sleep quality is essential.\nAim for a daily calorie intake of approximately 2,200 to 2,400 calories to support muscle building alongside his training. At 70 kg, 182 cm and moderate activity, his estimated TDEE is around 2,300 calories. With a protein target of 91 to 112 grams per day, building meals around protein first and filling the rest with whole grains, vegetables, healthy fats and fruit will support both his muscle goal and his liver recovery.","flags":"GGT 164, more than double the upper limit of 73. In the context of 10 to 14 alcoholic drinks per week, this is most likely alcohol-driven. ALT at 56 sits at the upper limit and the De Ritis ratio at 0.63 is at the lower boundary, both consistent with a metabolic or toxic liver irritant rather than advanced disease. FIB-4 0.94, APRI 0.384 and NAFLD fibrosis score minus 3.1 make significant fibrosis very unlikely. Recommend liver ultrasound, alcohol reduction and retest in 8 to 12 weeks.\nUrine red blood cells at 30 per microlitre, above the significant threshold of 25, with no infection (no growth, negative nitrites, WBC 10). PSA is 0.62, very reassuring. Isolated microscopic haematuria at 46 is most commonly benign but should be mentioned to the GP for consideration of a repeat sample and further assessment if it persists.\nNeutrophils 1.61, below the lower limit of 2.0, with a total white cell count of 4.11 (just within range). Lymphocytes, monocytes, eosinophils and basophils are all normal. CRP below 0.5 and ESR 2 make an infective or inflammatory cause unlikely. Regular alcohol is a plausible contributor to mild neutrophil suppression. Worth noting on the GP record and rechecking after alcohol reduction.\nReticulocyte absolute count 44.8, marginally below the lower limit of 50. Haemoglobin is healthy at 147 and iron stores are replete, so this is not driven by deficiency. Most likely reflects a mildly reduced marrow production rate that is clinically insignificant given the adequate red cell mass. Monitor on retest.\nALT 56, at the upper limit of the reference range. In isolation this would be borderline, but alongside the GGT at 164 it supports the picture of liver enzyme induction from alcohol. AST at 35 is within range.\nB12 at 442, within the laboratory range of 193 to 982 but below the optimal level of 500. In the context of fatigue and brain fog, supplementing to bring this above 500 is reasonable.\nMCHC 347, marginally above the upper limit of 345. At this margin, this is almost certainly analytical variation and not clinically significant.\nFolate 23, above the upper reference of 17. This is not harmful and most likely reflects dietary intake. No action needed.\nReassuring negatives: thyroid function is excellent with negative antibodies, making autoimmune thyroid disease very unlikely. Testosterone at 18.8 is in the optimal range, making low testosterone unlikely as a cause of his symptoms. HbA1c at 39 is within the normal range (though above the tighter optimal threshold of 36) and HOMA-IR at 1.12 is within the reference range, making diabetes and significant insulin resistance very unlikely. CRP below 0.5 and ESR 2 make systemic inflammation very unlikely. Coeliac screen is negative. PSA at 0.62 with a free ratio of 0.435 makes prostate pathology very unlikely. Tumour markers CA19-9 and CEA are both well within range. Kidney function is healthy with a combined eGFR of 94. Immunoglobulins are all normal and IgE is low, making an allergic process very unlikely.","recommendations":"Discuss the GGT of 164 with the GP. Request a liver ultrasound to check for fatty liver change. Reduce alcohol to under seven drinks per week, ideally under four, for at least eight weeks before retesting GGT, ALT and a full liver panel.\nMention the urine red blood cells at 30 to the GP. A repeat midstream urine sample in two to four weeks would confirm whether this persists or was a one-off finding. If it persists, the GP may consider referral for further urological assessment.\nNote the neutrophil count of 1.61 on the GP record. No immediate action is needed, but it should be rechecked after alcohol reduction to determine whether it is alcohol-related or a benign baseline finding.\nStart sublingual methylcobalamin 1,000 micrograms daily to bring B12 from 442 into the optimal range above 500, supporting energy and cognitive function.\nRetest in 10 to 12 weeks with a panel including GGT, ALT, AST, full blood count with differential and reticulocytes, B12 and a repeat urinalysis. This will show whether the liver enzymes have responded to alcohol reduction, whether the neutrophils and reticulocytes have normalised, whether B12 has improved, and whether the microscopic haematuria has resolved.\nDaily calorie target: 2,200 to 2,400 kcal. Protein target: 91 to 112 grams per day (1.3 to 1.6 g per kg at 70 kg with the goal of building muscle and starting resistance training).","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 micrograms daily, taken in the morning. His B12 at 442 is below the optimal level of 500, and in the context of fatigue and brain fog, bringing it into the optimal range may support improvement.\nVitamin D3: continue cholecalciferol at 2,000 IU daily, taken with his largest meal that contains fat. His vitamin D at 96 is in the optimal range of 75 to 120, so current supplementation is working well and should be maintained.\nVitamin K2: MK-7 form, 100 micrograms daily, taken with the vitamin D. Vitamin K2 directs calcium into bone and away from arteries, and is often taken alongside vitamin D.\nMagnesium: continue magnesium glycinate at 300 to 400 mg daily, taken before bed. His magnesium at 0.91 is within the optimal range and the glycinate form supports sleep quality, which is particularly relevant given his poor sleep and tired waking.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. While his triglycerides and inflammatory markers are already excellent, omega-3 supports liver health, brain function and mood, all of which are relevant given his symptoms and the liver strain from alcohol.\nDo not take iron supplements. His ferritin at 104 and transferrin saturation at 28.6 percent show healthy iron stores, and additional iron would risk pushing stores too high.\nThe most important changes from this report are not supplements. They are reducing alcohol to under seven drinks per week, adding resistance training twice a week, increasing protein to 91 to 112 grams per day, cutting daily sugar, and protecting sleep with a fixed wake time and a caffeine cut-off at 1pm.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 76.2; held to 59 by a system rated \"See your GP\". Weakest systems: urinalysis 22%, liver & metabolic 37%, hematology 67%. Biggest drags: Gamma GT, ALT/GPT, Reticulocytes Absolute, C-Peptide.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"36.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3588","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is a biological ageing measure calculated from blood biomarkers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge of 36.6 against a calendar age of 46 means his blood markers are ageing 9.4 years younger than his birth certificate. This is a genuinely strong result, driven principally by his excellent CRP, healthy albumin, good glucose control and low white cell count. Reducing alcohol and improving sleep would be expected to maintain or improve this advantage further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term and measures the cardiovascular risk being built regardless of age. A score of 20 or below is ideal, and his score of 5 is excellent, driven by his strong HDL, low ApoB, healthy triglycerides, low Lp(a) and m espread liver cell damage.","low_causes":"","high_causes":"Liver damage, heart damage, muscle injury, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"164","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol intake and bile duct irritation. His GGT at 164 is more than double the upper limit of 73, and well above the optimal level of 25. This is the most significant finding in his liver panel and strongly suggests the liver is under strain from regular alcohol consumption at 10 to 14 drinks per week. GGT is typically the first liver enzyme to rise with alcohol and the first to fall when intake is reduced. A liver ultrasound and alcohol reduction with retesting in 8 to 12 weeks are recommended.","low_causes":"","high_causes":"Alcohol, bile duct obstruction, fatty liver, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. His ALP at 78 is comfortably within the normal and optimal range, suggesting the bile duct system is not involved in the GGT elevation, which further supports alcohol as the driver.","low_c // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail

  if (b.description){

    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }

  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);

      <span class="bc-tick tick-${col}"></span>

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
