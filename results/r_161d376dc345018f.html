<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Ralph Goellnitz","dob":"02/02/1991","report_date":"2026-10-09","summary":"Ralph is a 35-year-old male presenting with a BMI of 29.7, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are small or he often skips meals (volume 2 out of 10). He does no structured cardio or resistance training, with 2,000 to 5,000 daily steps. He sleeps 6 to 7 hours, feels tired most mornings, with energy crashing in the afternoon; stress feels hard to manage some weeks. He drinks 10 to 14 alcoholic drinks per week and overuses caffeine or energy drinks. He has a family history of type 2 diabetes. He reports low energy and fatigue, brain fog, low mood and anxiety, and low sex drive, all persisting for months. His goals are to improve mood, improve energy levels, and balance hormones.\n\nThe finding that should be discussed with his GP before anything else in this report is his kidney function. His creatinine is 144, well above the upper limit of 104, and his Cystatin C is 1.14, above the upper limit of 1.1. Cystatin C is a protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, particularly in men with higher muscle mass, because creatinine is produced by muscle and can be elevated simply from having a larger frame. When both markers are used together, his combined estimated glomerular filtration rate (eGFR), which measures how many millilitres of blood the kidneys filter per minute, comes to 65, below the ideal threshold of 90 but above 60. At 35 this is not where it should be. Creatinine alone gives an eGFR of 54, which looks worse, but Cystatin C is the more trustworthy marker here and pulls the combined figure up. There are two explanations worth considering. The first is that Ralph has significant muscle mass at 106 kg and 189 cm, which inflates creatinine independently of kidney health. The second is that there is genuine early reduction in kidney filtration. Because this is his first blood test and there is no previous result to compare against, the GP needs to repeat creatinine and Cystatin C in four to six weeks on a fresh fasting sample, check blood pressure, and run a urine albumin-to-creatinine ratio to look for any protein leak. His urea at 6.6 is mid-range, his sodium and chloride are within the laboratory range, and his bicarbonate is healthy, so there is no sign of the electrolyte disruption that accompanies advanced kidney problems. His uric acid at 341 is well within range, which is reassuring because elevated uric acid can both result from and contribute to kidney strain. This is most likely a combination of his body size inflating creatinine and mild early pressure on the kidneys from his weight and alcohol intake, but it must be confirmed with the GP rather than assumed.\n\nHis calculated serum osmolality is 304, above the upper limit of 295. Osmolality measures the concentration of dissolved particles in the blood. At 304 the blood is more concentrated than it should be, which almost always means he is not drinking enough water. Combined with his sodium sitting right at the top of its range at 146 and his low fluid intake implied by small meals and skipped meals, dehydration is the most likely explanation. Chronic mild dehydration contributes to fatigue, brain fog, and reduced kidney filtration, all of which he is reporting. It may also be inflating his creatinine slightly.\n\nTurning to what is working well, his thyroid is in excellent health. TSH (thyroid stimulating hormone, the signal from the brain that tells the thyroid how hard to work) is 1.33, sitting right in the ideal zone between 1.0 and 2.5. Free T4 at 18.4 and Free T3 at 5.3 are both within the optimal range, meaning the thyroid is producing and converting its hormones efficiently. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease entirely. His FT3 to FT4 ratio of 0.288 confirms good conversion. This is important because thyroid dysfunction is one of the most common causes of the fatigue, brain fog, and low mood he is experiencing, and it has been comprehensively excluded.\n\nHis liver shows no sign of scarring or significant damage. His FIB-4 score (a calculation that estimates liver fibrosis using age, platelets, and liver enzymes) is 0.49, well below the threshold, and his APRI score is 0.2, also reassuringly low. His NAFLD Fibrosis Score is minus 4.0, the lowest it can reasonably be, meaning non-alcoholic fatty liver disease with fibrosis is extremely unlikely. His bilirubin at 8 is healthy, his albumin at 47 is strong, and his AST at 25 is clean. His ALT at 33 is within the laboratory range of less than 56 but sits above the tighter optimal threshold of 30 for men. This is a marginal elevation and not a concern in isolation. His Gamma GT at 63, however, tells a more meaningful story. While it falls within the laboratory range of 4 to 73, it is well above the optimal threshold of 25. Gamma GT (gamma-glutamyl transferase) is an enzyme that rises in response to alcohol, metabolic strain, and fatty liver. At 63 in a 35-year-old drinking 10 to 14 units a week, the most likely explanation is the alcohol load. The liver is coping, there is no scarring, but it is working harder than it should be. Reducing alcohol to under 7 units a week, ideally under 4, should bring this number down significantly.\n\nHis blood count is healthy across the board. Haemoglobin at 165 is strong, red blood cells at 5.34 are mid-range, and his reticulocyte count at 1.29 percent shows the bone marrow is producing new red cells at a normal rate. White blood cells at 6.37, neutrophils at 3.81, and lymphocytes at 1.88 are all well placed, and his neutrophil-to-lymphocyte ratio, a marker of systemic inflammation and immune balance, calculates to 2.03, within the ideal range. Platelets at 312 are healthy. His ESR (erythrocyte sedimentation rate, another inflammation marker) is just 2, which is about as low as it gets. His iron studies are reassuring: ferritin at 228 sits comfortably in the optimal zone for men, transferrin saturation at 23.57 percent is just below the optimal lower bound of 25 percent but well within the laboratory range, and his serum iron at 14.8 and transferrin at 2.5 are both healthy. There is no iron deficiency and no iron overload.\n\nHis inflammation profile is genuinely impressive for someone carrying extra weight and drinking at this level. High-sensitivity CRP (C-reactive protein, the most reliable single marker of systemic inflammation) is 0.5, well below the optimal threshold of 1.0. At a BMI just under 30 with 10 to 14 drinks a week, this is a surprisingly good result and suggests the body is not yet mounting a chronic inflammatory response. His platelet-to-lymphocyte ratio at 166 is within range, and his systemic immune-inflammation index at 632 is marginally above the upper optimal of 450 but within the laboratory range of 100 to 600, so inflammation is not a significant driver of his symptoms.\n\nHis immune markers are within range. IgG at 7 is at the lower end of its range of 6.5 to 16 but is not deficient. IgM at 0.5 sits right at the lower boundary. IgA at 2.1 and IgE at 57.6 are well placed. Rheumatoid factor is negative and coeliac antibodies are negative, ruling out coeliac disease as a cause of his fatigue and brain fog.\n\nProstate health is excellent. PSA (prostate-specific antigen) at 0.62 is very low, and the free PSA ratio of 1.0 (100 percent) is entirely reassuring. Tumour markers CA19-9 and CEA are both well within range.\n\nNow to the findings that connect most directly to his symptoms. His lipid profile is the most significant area of concern after his kidneys. His total cholesterol is 7.2, well above the desirable threshold of 5.18. His LDL (low-density lipoprotein, the cholesterol particle that deposits in artery walls) is 5.08, nearly double the upper limit of 3.0. His ApoB (apolipoprotein B, a more accurate measure of the number of atherogenic particles in the blood than LDL alone, because every harmful lipoprotein particle carries exactly one ApoB molecule) is 1.67, classified as \"very high\" and nearly double the target of less than 0.9. His Lp(a) is less than 25, which is normal and genuinely useful information: it means this entire lipid picture is driven by modifiable factors (diet, weight, alcohol, and activity) rather than by an inherited particle he cannot change. His Lp(a)-corrected LDL is 5.0, confirming that virtually all of the LDL is modifiable. His HDL (high-density lipoprotein, the particle that carries cholesterol back to the liver for disposal) is 1.2, below the desirable level of 1.55 and below the optimal threshold of 1.4 for men. His triglycerides at 2.11 are above the fasting target of 1.7. His VLDL at 0.96 is above the limit of 0.78. His remnant cholesterol (total cholesterol minus HDL minus LDL) calculates to 0.92, above the optimal threshold of 0.5, representing cholesterol sitting in triglyceride-rich particles that are independently atherogenic. His TC to HDL ratio is 6.0 against a target of less than 4.5, his ApoB to ApoA1 ratio is 1.16 against a target of less than 0.7, his Castelli II ratio (LDL to HDL) is 4.23 against a target of less than 3.5, and his atherogenic index of plasma is 0.245, above the optimal of 0.11. His TG to HDL ratio calculates to 1.76, above the optimal threshold of 0.87. Every lipid metric points in the same direction: there are too many atherogenic particles in the blood. At 35 with a family history of type 2 diabetes, this pattern carries real long-term cardiovascular risk. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP, and HbA1c, is 65, well above the threshold of 40. The score has no age term, so it measures the risk being built right now rather than the chance of an event in the next ten years. At 35 his ten-year event risk is still low, but the gap between a score of 65 and a low ten-year risk is exactly the window he has to act. The main drivers are ApoB at 1.67, LDL at 5.08, and HDL at 1.2. The positive news is that with Lp(a) normal, every part of this is within his control through diet, weight loss, activity, and alcohol reduction.\n\nHis blood sugar and insulin tell a connected story. His fasting glucose at 5.5 is within the laboratory range but above the optimal ceiling of 5.4. His HbA1c (glycated haemoglobin, which reflects average blood sugar over the past two to three months) is 35, within the optimal zone. His fasting insulin at 9.23 is within the laboratory range but above the optimal ceiling of 8, meaning his pancreas is having to produce more insulin than ideal to keep his blood sugar controlled. His HOMA-IR (a calculation that estimates insulin resistance by combining fasting glucose and insulin) is 2.26, above the upper limit of 1.5 and above the early insulin resistance threshold of 1.9. His HOMA-B (a calculation estimating how hard the pancreas is working to produce insulin) calculates to 92.3, within the range of 80 to 200. His C-Peptide at 1.87 micrograms per litre (619 pmol/L after conversion) is within range, confirming the pancreas is producing insulin adequately. His TyG index at 9.13 is above the upper limit of 8.8, providing independent confirmation of insulin resistance. His estimated average glucose at 5.9 is within range. Put this together and the picture is clear: Ralph is in early insulin resistance. His body is keeping blood sugar controlled, but only by producing more insulin than it should need to. With a family history of type 2 diabetes, this is the pattern that, left unaddressed, progresses toward prediabetes. The encouraging part is that insulin resistance at this stage is fully reversible with weight loss, dietary change, and movement.\n\nHis testosterone at 18.8 falls within the optimal band of 18 to 30, sitting right at the lower boundary. His free testosterone (the fraction not bound to proteins and therefore active in tissues) is 0.4263, within range. His bioavailable testosterone at 10.88 is actually above the upper limit of 9, which is a positive finding. His SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it inactive) at 26.5 is within range but at the lower end. His oestradiol at 139 is within range but approaching the upper limit of 146.1 for men. His free androgen index at 70.94 is healthy. His LH and FSH are both within range, confirming the brain is signalling the testes normally. His prolactin at 168 and DHEA-S at 5 (1,842 micrograms per decilitre after conversion) are both well placed. His progesterone at 1.33 is within range. His cortisol at 592 is within the morning reference range but sits near the upper end of 619.4, which combined with his afternoon energy crash and being wired from caffeine and energy drinks suggests his stress response is running higher than ideal. While his testosterone is technically at the lower edge of optimal, it is not deficient, and his symptoms of low libido and low energy are more likely explained by the insulin resistance, poor diet quality, alcohol, dehydration, disrupted sleep, and excess caffeine than by a hormone deficiency.\n\nHis vitamin D at 87 is within the optimal range of 75 to 120, which is a good result. His B12 at 319 is within the laboratory range but below the optimal threshold of 500. At this level B12 is not deficient, but it is not where it should be for optimal nerve function, energy metabolism, and mood regulation, all of which are among his complaints. His folate at 15 is well placed. His calcium and corrected calcium are both within range, his phosphate is healthy, and his magnesium at 1.07 is within the optimal band.\n\nHis PhenoAge, a biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count, is 39.5 against a calendar age of 35, meaning his blood markers suggest he is ageing four and a half years faster than his chronological age. The main drivers are the elevated creatinine and the glucose sitting at the top of its range. This is not a diagnosis but a useful benchmark: the lifestyle changes in this report, particularly weight loss, dietary improvement, hydration, and reduced alcohol, should bring this number down toward or below his calendar age on retest.\n\nHis creatine kinase at 347 is marginally above the upper limit of 320. CK (creatine kinase) is an enzyme released from muscle cells during damage or exertion. At this margin, even modest physical activity the day before the blood draw, including walking, lifting, or manual work, can produce this result. Given that he does no structured training, it may reflect minor muscle strain or simply natural variation. It is not a concern at this level.\n\nHis total antioxidant activity at 2.4 is above the upper limit of 1.77. This marker measures the overall antioxidant capacity of the blood and can be elevated by dietary antioxidants, supplements, or even the polyphenols in coffee and red wine. Given his caffeine intake, this is the most likely explanation. It is not a concern.\n\nHis MCHC at 345 sits right at the upper boundary of 345. This is within range and not a finding. His urine shows white blood cells at 30, above the threshold of 10, with no nitrites detected, no protein, and negative glucose and ketones. The bacterial count and culture are pending. White cells in the urine without nitrites can reflect a mild urinary tract irritation, early infection, or sample contamination. Once the culture result returns, this will either confirm an infection requiring treatment or show contamination. If he has any urinary symptoms such as burning, frequency, or pain, he should see his GP promptly; if not, the culture result will guide next steps.","links":"The central thread running through Ralph's results is metabolic. At 35, carrying extra weight at a BMI of 29.7, eating a low-quality diet with minimal vegetables, skipping meals, doing no exercise, and drinking 10 to 14 units of alcohol a week, his body is showing the early signatures of metabolic strain in three connected systems: his lipids, his insulin signalling, and his kidney filtration.\n\nThe insulin resistance is the root mechanism. When the body becomes less sensitive to insulin, the pancreas compensates by producing more, and this drives a cascade of downstream effects. Elevated insulin promotes the liver's production of VLDL particles, which carry triglycerides into the blood and eventually become the small, dense LDL particles that are most dangerous to artery walls. This is why his triglycerides are elevated at 2.11, his VLDL is above range, and his LDL and ApoB are so high. His low HDL is the other side of the same coin: insulin resistance accelerates the clearance of HDL particles, leaving fewer of them to do the protective work of reverse cholesterol transport. His TyG index and HOMA-IR both confirm the resistance, and his fasting glucose nudging above the optimal ceiling confirms the pancreas is beginning to feel the strain. With a family history of type 2 diabetes, this is exactly the pattern that needs intercepting now rather than in five years.\n\nThe kidney finding connects to the same metabolic picture but requires its own investigation. Insulin resistance, excess weight, mild dehydration (his osmolality is 304), and regular alcohol all place additional demand on the kidneys. His creatinine is elevated, his Cystatin C is marginally above range, and his combined eGFR is 65. At 35 this needs a GP review to establish whether it reflects genuine early kidney pressure or whether his body size is inflating the creatinine disproportionately. The fact that his urea, electrolytes, and uric acid are all healthy is reassuring, but a single time point cannot rule out early chronic kidney disease, so a repeat in four to six weeks is essential.\n\nThe Gamma GT at 63 sits apart from the other liver markers, all of which are clean. In the context of 10 to 14 drinks a week, this is almost certainly alcohol-driven. It is not causing damage yet, as confirmed by the excellent fibrosis scores, but it is a warning that the liver is under more enzymatic stress than it should be at 35.\n\nWhat the bloods do not explain is equally important. Ralph reports low energy, brain fog, low mood, and low libido, and the blood results have excluded the most common medical causes. His thyroid is working well, his iron stores are full, his B12 is adequate if not optimal, his testosterone is at the lower edge of optimal but not deficient, his blood sugar is controlled, and his inflammation is low. The symptoms are therefore most likely driven by the combination of factors the blood cannot measure but the quiz reveals clearly: poor sleep quality (tired most mornings, 6 to 7 hours), an afternoon energy crash pattern that may reflect the insulin resistance and blood sugar swings from a high-sugar, low-fibre diet, excessive caffeine masking fatigue while disrupting sleep further, regular alcohol suppressing sleep quality and mood, near-zero physical activity, and chronic mild dehydration. These are all modifiable, and addressing them is likely to resolve or substantially improve every symptom he reports.\n\nThe one loose end is the urinary white cells at 30 with culture pending. If the culture returns positive, he will need a short course of antibiotics. If negative, it was likely sample contamination and can be disregarded.","lifestyle":"Drink two to three litres of water a day, starting with a large glass first thing in the morning before coffee. Anchor: fill a bottle the night before and put it next to the kettle. Why: your serum osmolality is 304, meaning your blood is more concentrated than it should be. Chronic dehydration contributes to fatigue, brain fog, and inflates your creatinine, which is the marker flagging your kidney function.\nAdd a palm-sized portion of protein to every meal: eggs, Greek yoghurt, chicken, fish, or tinned beans. Anchor: protein goes on the plate before anything else. Why: protein at each meal blunts the insulin spike behind your HOMA-IR of 2.26 and keeps you full, which matters because you are skipping meals and then likely over-relying on convenience food and sugar.\nSwap sugary snacks, energy drinks, and white bread for whole grains, nuts, and fruit, one swap at a time, starting with breakfast this week. Why: your fasting glucose at 5.5, insulin at 9.23, and triglycerides at 2.11 are all being driven by fast-releasing carbohydrates and sugar. Slower carbohydrate sources lower the insulin your pancreas is overproducing.\nEat at least three portions of vegetables a day, building to five. Add a handful to whatever you are already eating: spinach in eggs, tomatoes in a sandwich, frozen vegetables with dinner. Anchor: one portion at each meal. Why: you are currently eating 0 to 1 portions a day, which provides almost no fibre. Soluble fibre from oats, beans, and vegetables directly lowers LDL cholesterol and improves insulin sensitivity.\nWalk for twenty minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly addresses your HOMA-IR of 2.26 and your afternoon energy crash. Walking also raises HDL over time.\nBuild to three resistance training sessions per week, starting with two short sessions of bodyweight exercises or a beginner gym programme. Why: resistance training is the single most effective intervention for insulin resistance, and it raises HDL, lowers triglycerides, and improves testosterone. At zero sessions currently, even two per week will make a measurable difference on retest.\nReduce alcohol to under seven drinks per week, ideally under four, with at least three alcohol-free days in a row. Why: your Gamma GT at 63 shows the liver is working harder than it should at 35, your triglycerides and LDL are partly alcohol-driven, and alcohol suppresses sleep quality, which feeds directly into your morning fatigue and afternoon crash.\nSet a caffeine cut-off of 1pm and limit to two caffeinated drinks before then. Replace afternoon caffeine with water or herbal tea. Anchor: after lunch, the kettle makes decaf only. Why: caffeine after early afternoon disrupts deep sleep even when you fall asleep easily, and your pattern of tired mornings with an afternoon crash suggests your sleep architecture is already compromised.","flags":"Creatinine 144 (limit 104), Cystatin C 1.14 (limit 1.1), combined eGFR 65 (ideal above 90). At 35 this needs GP investigation: repeat creatinine and Cystatin C in 4 to 6 weeks, check blood pressure, run urine albumin-to-creatinine ratio. Body size may be inflating creatinine, but Cystatin C above range confirms filtration is at least mildly reduced.\nSerum osmolality 304 (range 275 to 295). Blood is more concentrated than it should be, consistent with chronic mild dehydration. Contributing to fatigue, brain fog, and potentially inflating creatinine. Increase water intake and repeat on retest.\nApoB 1.67 (target below 0.9), LDL 5.08 (limit 3.0), total cholesterol 7.2 (desirable below 5.18), triglycerides 2.11 (target below 1.7), HDL 1.2 (desirable above 1.55), ApoB/A1 ratio 1.16 (target below 0.7), TC/HDL ratio 6.0 (target below 4.5), Castelli II 4.23 (target below 3.5), remnant cholesterol 0.92 (optimal below 0.5), TG/HDL ratio 1.76 (optimal below 0.87), atherogenic index 0.245 (optimal below 0.11). Comprehensive dyslipidaemia. Lp(a) normal, so entirely modifiable. Cardiovascular Risk Score 65 out of 100. Recommend dietary intervention, weight loss, alcohol reduction, and exercise as first line. If lipids do not improve on retest at 12 weeks, consider statin discussion with GP.\nHOMA-IR 2.26 (limit 1.5), fasting insulin 9.23 (optimal below 8), fasting glucose 5.5 (optimal below 5.4), TyG index 9.13 (limit 8.8). Early insulin resistance with family history of type 2 diabetes. Fully reversible with weight loss, dietary change, and exercise.\nGamma GT 63 (lab range 4 to 73, optimal below 25). Within laboratory range but well above optimal. Most likely alcohol-driven at 10 to 14 units per week. No fibrosis on FIB-4, APRI, or NAFLD scoring. Recommend reducing alcohol and retesting.\nB12 319 (lab range 193 to 982, optimal 500 to 900). Adequate but suboptimal. Supplementation with sublingual methylcobalamin 1,000 mcg daily recommended.\nPhenoAge 39.5 against calendar age 35. Biological ageing 4.5 years ahead, driven primarily by elevated creatinine and borderline glucose.\nUrine WBCs 30 (threshold below 10) with culture pending. If symptomatic, see GP. Await culture result.\nCrcreatine kinase 347 (limit 320). Marginally above range, likely minor muscle activity before blood draw. Not clinically significant.\nTotal antioxidant activity 2.4 (range 1.3 to 1.77). Likely driven by high caffeine and polyphenol intake. Not a concern.\nReassuring negatives: thyroid function excellent with negative antibodies, CRP 0.5, iron studies normal, testosterone at lower edge of optimal but not deficient, coeliac excluded, PSA very low, tumour markers clean, liver fibrosis scores all reassuringly low, Lp(a) normal.","recommendations":"Discuss kidney function with your GP. Bring this report showing creatinine 144, Cystatin C 1.14, and combined eGFR 65. Ask for a repeat of both markers in 4 to 6 weeks, a blood pressure check, and a urine albumin-to-creatinine ratio to assess for any protein leak. This is the most important action from this report.\nDiscuss your lipid profile with your GP. ApoB 1.67, LDL 5.08, triglycerides 2.11, HDL 1.2. Tell them Lp(a) is normal so the entire picture is modifiable. Ask whether a cardiovascular risk assessment and a 12-week lifestyle trial before considering medication is appropriate. Request a repeat lipid panel including ApoB at 12 weeks.\nMention your HOMA-IR of 2.26 and fasting glucose of 5.5 alongside your family history of type 2 diabetes. Ask whether an oral glucose tolerance test would be useful to assess glucose handling more precisely.\nIf you have any urinary symptoms (burning, frequency, urgency), see your GP with the urine culture result once it arrives. Your urine white cells were 30 against a threshold of 10.\nAim for a body weight of 90 to 95 kg as a first target, which would bring your BMI to 25 to 26.6 and is expected to significantly improve your insulin sensitivity, lipid profile, and kidney markers. A daily calorie target of 2,100 to 2,300 kcal with a protein floor of 138 to 170 grams per day (1.3 to 1.6 g per kg) will support fat loss while preserving muscle. Retest in 12 weeks with a repeat of the following markers: creatinine, Cystatin C, eGFR, full lipid panel including ApoB, fasting glucose, fasting insulin, HOMA-IR, HbA1c, Gamma GT, ALT, B12, and serum osmolality.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Your B12 at 319 is adequate but below the optimal level of 500. B12 supports nerve function, energy metabolism, and mood, all of which are among your reported symptoms. Sublingual delivery bypasses the gut for better absorption.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with your largest meal. Your ApoB at 1.67, triglycerides at 2.11, and HDL at 1.2 all benefit from omega-3 supplementation. EPA and DHA lower triglyceride production in the liver and have anti-inflammatory and mood-supporting effects.\nMagnesium glycinate: 300 to 400 mg before bed. Your magnesium at 1.07 is within range but magnesium glycinate supports sleep quality, stress response, and insulin sensitivity. Given your pattern of poor sleep and afternoon crashes, this is a worthwhile addition.\nVitamin D3 (cholecalciferol): 2,000 IU daily with a fat-containing meal, paired with Vitamin K2 (MK-7) 100 mcg daily. Your vitamin D at 87 is within the optimal range, and this maintenance dose will keep it there through winter.\nDo not take iron supplements. Your ferritin at 228 is healthy and additional iron is not needed.\nThe most important changes from this report are not supplements. They are drinking enough water, eating consistently with protein and vegetables at every meal, reducing alcohol, cutting afternoon caffeine, and starting regular movement.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 49.2; held to 49 by two or more systems rated \"See your GP\". Weakest systems: urinalysis 0%, lipids & cardiovascular 18%, glucose & insulin 33%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Gamma GT, Remnant Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"39.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4938","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"35","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4375","units":"years","description":"PhenoAge is a biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count. Ralph's PhenoAge is 39.5 against a calendar age of 35, meaning his blood markers suggest he is ageing four and a half years faster than his chronological age. The main drivers are his elevated creatinine (inflating the ageing calculation) and his fasting glucose sitting at the upper edge of its range. The lifestyle changes in this report, particularly weight loss, improved hydration, dietary improvement, and reduced alcohol, should bring PhenoAge closer to or below his calendar age on retest.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8125","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP, and HbA1c. It measures the cardiovascular risk being built right now rather than the ten-year chance of an event. Ralph's score of 65 is well above the flagged threshold of 40. The main drivers are ApoB at 1.67, LDL at 5.08, and HDL at 1.2. At 35 his ten-year event risk is still low, but the gap between a score of 65 and a low ten-year risk is exactly the window he has to act. With Lp(a) normal, every component of this score is modifiable through diet, weight loss, exercise, and alcohol reduction.","low_causes":"Optimal lipid profile, low inflammation, healthy metabolic markers","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5933","units":"mmol/l","description":"Blood glucose measures the amount of sugar circulating in the blood after fasting. Ralph's result of 5.5 is within the laboratory range of 3.5 to 6.0 but sits just above the optimal ceiling of 5.4. This means the body is keeping sugar controlled, but the margin is narrower than ideal. Combined with his elevated insulin and HOMA-IR, this suggests the pancreas is having to work harder to maintain glucose at this level. With a family history of type 2 diabetes, this is the right time to intervene with dietary changes and exercise to pull glucose back into the optimal zone.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, prediabetes, type 2 diabetes, stress, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar over the previous two to three months. Ralph's result of 5.3% is well within the normal range (b calcium and phosphate levels in the blood. When calcium drops, PTH rises to release calcium from bones and increase its absorption. Ralph's result of 3.5 is within the laboratory range and at the upper edge of the optimal band. In the context of healthy calcium and adequate vitamin D, this is not a concern.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"319","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3758","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4627","upper_optimal_position":"0.6321","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy metabolism. Ralph's result of 319 is within the laboratory range (193 to 982) but below the optimal threshold of 500. At this level he is not deficient, but his B12 is not supporting optimal energy, mood, or cognitive function. Given his symptoms of fatigue, brain fog, and low mood, supplementation with sublingual methylcobalamin is recommended to bring this into the optimal band.","low_causes":"Poor dietary intake (vegan or low meat diet), malabsorption, pernicious anaemia, medications","high_causes":"Supplementation, liver disease, myeloproliferative disorders (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5357","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in red blood cell production, DNA synthesis, and the methylation cycle. Ralph's result of 15 is within the optimal range, which is a good finding especially given his low vegetable intake. Folate is found in leafy greens, beans, and fortified grains.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, pregnancy, medications","high_causes":"Supplementation, B12 deficiency masking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP (C-reactive protein) is the most reliable single marker of systemic inflammation. It is produced by the liver in response to inflammation anywhere in the body. Ralph's result of 0.5 is well within the optimal range (below 1.0). At a BMI of 29.7 with 10 to 14 drinks per week, this is a genuinely surprising positive, showing that the body is not yet mounting a chronic inflammatory response despite the metabolic strain.","low_causes":"Generally not clinically significant","high_causes":"Infection, chronic inflammation, cardiovascular risk, autoimmune disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6950","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL. Ralph's result of 7.2 is well above the desirable level of less than 5.18. This is driven primarily by his elevated LDL and VLDL. Total cholesterol alone does not tell the full story, but in Ralph's case it aligns with uniformly unfavourable lipid subfractions.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, obesity, insulin resistance, hypothyroidism, genetics, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6206","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and carbohydrate intake, alcohol consumption, and insulin resistance. Ralph's result of 2.11 is above the fasting target of 1.7. Elevated triglycerides are a hallmark of insulin resistance because excess insulin drives the liver to produce more VLDL particles. His alcohol intake and high sugar intake are also direct contributors. Reducing refined carbohydrates, sugar, and alcohol, along with weight loss and exercise, should lower triglycerides significantly.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"Insulin resistance, high carbohydrate or sugar intake, alcohol, obesity, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6154","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. Ralph's result of 0.96 is above the limit of 0.78. Elevated VLDL reflects the liver producing more triglyceride-rich particles than it should, driven by insulin resistance, sugar, and alcohol. VLDL particles eventually become small, dense LDL, the most harmful type for artery walls.","low_causes":"Low fat diet, malnutrition","high_causes":"Insulin resistance, high sugar intake, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.4516","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol particle that carries excess cholesterol from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Ralph's result of 1.2 is below the desirable level of 1.55 and below the optimal threshold for men of 1.4. Low HDL is one of the most common features of insulin resistance and is worsened by sedentary lifestyle and excess weight. Regular exercise, particularly resistance training and brisk walking, is the most effective way to raise HDL. Moderate alcohol intake can raise HDL, but the net harm from 10 to 14 drinks outweighs this effect.","low_causes":"Sedentary lifestyle, insulin resistance, obesity, smoking, high refined carbohydrate diet","high_causes":"Regular exercise, moderate alcohol, genetics, omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8720","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits in artery walls and drives atherosclerosis. Ralph's result of 5.08 is nearly double the upper limit of 3.0 and well above the optimal ceiling of 2.6. This is the single largest contributor to his cardiovascular risk. With Lp(a) normal, this LDL is entirely driven by diet, weight, insulin resistance, and alcohol, all of which are modifiable. Dietary changes (reducing saturated fat, increasing soluble fibre from oats, beans, and vegetables), weight loss, and exercise should be the first approach, with lipid-lowering medication discussed with the GP if lifestyle changes do not bring LDL below 3.0 by the 12-week retest.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, obesity, insulin resistance, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC to HDL ratio divides total cholesterol by HDL. It is a simple way to assess the balance between harmful and protective cholesterol. Ralph's result of 6.0 is above the target of less than 4.5, driven by high total cholesterol and low HDL. A ratio above 5 is considered high cardiovascular risk.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, insulin resistance, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"16.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4168","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. Ralph's result of 16.67% is below the target of more than 20%, meaning too small a proportion of his total cholesterol is the protective type. Improving this requires both lowering LDL (reducing the denominator) and raising HDL (increasing the numerator) through exercise, weight loss, and dietary change.","low_causes":"High LDL, low HDL, insulin resistance","high_causes":"Regular exercise, low LDL, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the atherogenic (artery-damaging) cholesterol in one number, including LDL and VLDL. Ralph's result of 6.0 is well above the target of less than 4.0, reflecting the combined burden of his elevated LDL and VLDL.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"Diet, obesity, insulin resistance, alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles. It reflects HDL particle number and function. Ralph's result of 1.44 is above the minimum of 1.2 and just above the optimal threshold of 1.4. This is a positive finding amidst otherwise unfavourable lipids, suggesting his HDL particles, while few, are at least present in reasonable quality.","low_causes":"Sedentary lifestyle, smoking, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.67","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9278","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single most important lipid marker in the panel. Every atherogenic lipoprotein particle (LDL, VLDL, IDL, Lp(a)) carries exactly one ApoB molecule, so ApoB directly counts the number of particles that can penetrate and damage artery walls. Ralph's result of 1.67 is classified as \"very high\" (above 1.4) and is nearly double the desirable target of less than 0.9. This means there are far too many atherogenic particles in his blood. With Lp(a) normal, every one of these particles is modifiable through diet, weight loss, alcohol reduction, and exercise. If lifestyle changes do not bring ApoB below 0.9 within 12 weeks, medication should be discussed with his GP.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"High saturated fat diet, obesity, insulin resistance, familial hypercholesterolaemia, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8286","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is the single best summary of lipid-related cardiovascular risk. It compares the number of harmful particles (ApoB) to the protective ones (ApoA1). A ratio below 0.7 is lower risk; above 0.9 is higher risk. Ralph's result of 1.16 is firmly in the higher risk category, driven by his very high ApoB. This ratio will improve as ApoB comes down and HDL (and therefore ApoA1) rises with lifestyle changes.","low_causes":"High HDL, low LDL, healthy lifestyle","high_causes":"High LDL, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a) is an inherited lipoprotein particle that deposits cholesterol in artery walls, promotes clotting, and drives inflammation. Unlike LDL, its level is genetically determined and cannot be meaningfully changed by diet, exercise, or most medications. Ralph's result of less than 25 is within the normal range (below 32). This is genuinely useful information because it confirms that the entirety of his elevated LDL and ApoB is driven by modifiable factors: diet, weight, insulin resistance, and alcohol. It also means his first-degree relatives do not need to be tested for elevated Lp(a).","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"347","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6989","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found primarily in muscle cells. It is released into the blood when muscle fibres are damaged, whether from exercise, physical work, or injury. Ralph's result of 347 is marginally above the upper limit of 320 for men. At this margin, even moderate physical activity in the 48 hours before the blood draw can produce this result. Given that he does not train, it may reflect manual activity, a long walk, or simply natural variation. It is not a concern at this level but would be worth repeating if it rises further on retest.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin use, rhabdomyolysis (very high levels)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5375","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4076","upper_optimal_position":"0.5863","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active hormone T3 in the tissues. Ralph's result of 18.4 is within the optimal range (14 to 20), confirming the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3918","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.4588","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain and tells the thyroid how hard to work. A high TSH means the brain is asking the thyroid to produce more, suggesting underactivity. A low TSH means the opposite. Ralph's result of 1.33 sits right in the ideal zone between 1.0 and 2.5, confirming the brain is satisfied with thyroid output.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroiditis, pituitary adenoma (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism in every cell. It is converted from T4 in the tissues. Ralph's result of 5.3 is within the optimal range (4.5 to 6.5), confirming efficient conversion from T4 and healthy metabolic drive at the cellular level.","low_causes":"Hypothyroidism, low energy availability, chronic illness, medications","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are immune proteins that attack the thyroid enzyme thyroid peroxidase. Their presence suggests autoimmune thyroid disease (Hashimoto's thyroiditis). Ralph's result of less than 6.6 is negative (below 13.8), ruling out autoimmune thyroid disease.","low_causes":"Absence of autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target the thyroglobulin protein used by the thyroid to produce hormones. Their presence can indicate autoimmune thyroid disease. Ralph's result of less than 1.3 is negative (below 4.4), further confirming no autoimmune thyroid process. More than 80% of the population have undetectable levels.","low_causes":"Absence of autoimmune thyroid disease (normal finding)","high_cause function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
