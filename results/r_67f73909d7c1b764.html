<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"STEPHEN HEAD","dob":"09/04/1980","report_date":"2026-10-22","summary":"This is a 46-year-old male presenting with a BMI of 26.9, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). He trains eight or more times per week (five or more cardio sessions and three resistance sessions at moderate intensity) with 7,500 to 10,000 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking with energy that is lowest first thing in the morning. Stress feels hard to manage some weeks. He drinks 15 or more alcoholic drinks per week, smokes tobacco, uses cannabis and takes painkillers frequently (ibuprofen or paracetamol). He takes magnesium, omega-3 fish oil and a multivitamin. His family history includes dementia. A previous blood test returned normal results. He reports low energy and fatigue, weight gain and difficulty losing weight, low mood and anxiety, and hair thinning, all lasting several months. His goals are to improve long-term health and longevity and to reduce stress and anxiety.\n\nHis PhenoAge is 35.7, which is 10.3 years younger than his calendar age of 46. This is an excellent result and reflects clean inflammation, good kidney function, healthy blood sugar and well-maintained blood cells. It is one of the strongest positives in this report and a genuine marker of biological resilience. His cardiovascular risk score is 30 out of 100, which sits above the ideal threshold of 20 but within the acceptable range of 40. The score is being driven by the LDL and ApoB findings discussed below; the HDL, triglycerides and Lp(a) are all pulling the score down in his favour.\n\nThere is a lot of good news in this panel. His kidney function is excellent. Cystatin C, which is a more precise measure of kidney filtration than creatinine alone, gives an eGFR of 101, comfortably above the 90 threshold for full health. His urea, creatinine, sodium, chloride and bicarbonate are all within the ideal range, and his uric acid at 415, while above the optimal ceiling of 380, is within the laboratory range and not at a level that would cause gout or concern at present. His liver is in very good shape. ALT at 22 is below the stricter optimal ceiling of 30, AST at 20 is healthy, and GGT at 25 is right at the optimal ceiling of 25. The FIB-4 score, which estimates whether there is any scarring in the liver, is 0.63, well below the 1.45 threshold, and the APRI, another fibrosis index, is 0.16, both confirming no sign of liver strain. For a man drinking 15 or more units a week and using paracetamol frequently, these liver results are reassuring in the short term, though they do not guarantee the liver will tolerate this level of exposure indefinitely. His pancreas is healthy, with amylase at 80 and lipase at 32, both comfortably mid-range. His blood sugar control is good. Fasting glucose is 4.8, HbA1c is 40 mmol/mol (5.8%), and fasting insulin is 4.74, giving a HOMA-IR of 1.01, which means his cells respond well to insulin and his pancreas is not being overworked. The TyG index, another measure of metabolic health, is 8.46, just inside the optimal ceiling. His inflammation markers are excellent. High-sensitivity CRP is 0.2, which is exceptionally low and means there is no systemic inflammation detectable in the blood. ESR at 7 is clean. The platelet-to-lymphocyte ratio and systemic immune-inflammation index are both within their optimal ranges. His immune system is largely healthy. IgG at 9.1 and IgA at 2.3 are within range, IgE at 2.02 is very low (meaning no allergic drive), and rheumatoid factor is negative. The coeliac screen (tissue transglutaminase IgA) is negative. His prostate is in excellent health. PSA at 0.72 is very low, and the free PSA ratio of 0.458 is strongly reassuring. His calcium, corrected calcium, phosphate and parathyroid hormone are all within ideal ranges, meaning bone metabolism is well regulated. Magnesium at 0.87 is within the optimal band of 0.85 to 1.05. His vitamin D is 116, which is excellent and sits within the optimal range of 75 to 120, showing his supplementation is working well. Vitamin B12 at 534 is within the optimal band of 500 to 900. His full blood count is largely healthy: haemoglobin at 145, red cells at 4.78, haematocrit at 0.416, platelets at 312, white cells at 7.31, and all the differential white cell populations are within range. His thyroid antibodies are both negative, ruling out autoimmune thyroid disease. The urinalysis is clean across every parameter.\n\nTurning to the findings that need attention, the most important pattern is in the lipid panel. His total cholesterol is 5.6, above the desirable ceiling of 5.18. His LDL cholesterol, which is the main carrier of cholesterol into artery walls, is 3.5, above the upper limit of 3.0. His ApoB, which is arguably the most important cardiovascular marker because it counts the actual number of cholesterol-carrying particles in the blood rather than just the cholesterol inside them, is 0.9, sitting right at the desirable ceiling of 0.9. The Lp(a)-corrected LDL, which strips out the portion of LDL that is inherited and unchangeable, is 3.41, confirming that the vast majority of his LDL elevation is modifiable through diet and lifestyle. The good news within the lipid picture is genuine. His HDL at 1.6 is above the desirable threshold of 1.55 and above the optimal floor of 1.4 for a man. His triglycerides at 1.23 are within range, his VLDL is low at 0.56, and his ApoB-to-ApoA1 ratio at 0.57 is well below the 0.7 lower-risk threshold. His Lp(a), a genetically determined particle that adds cardiovascular risk independently of LDL, is 26.83, below the 32 nmol/L ideal ceiling, which is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors. The combination of high LDL and ApoB alongside good HDL and triglycerides points to diet as the primary driver, specifically the amount of saturated fat relative to fibre. With a family history of dementia, keeping ApoB below 0.9 and ideally below 0.8 is particularly relevant because the same particles that damage artery walls also cross the blood-brain barrier, and emerging evidence links elevated ApoB to increased risk of vascular dementia.\n\nHis testosterone at 13.5 is within the laboratory range of 8.4 to 28.7 but below the optimal range of 18 to 30. Free testosterone, which is the fraction not bound to proteins and therefore available to act on tissues, is 0.289, within range but at the lower end. Bioavailable testosterone, which includes both free testosterone and the loosely bound fraction, is 6.63, within range. SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable) is 30.6, within range. At 46, some decline from peak testosterone is expected, but 13.5 is lower than ideal and could be contributing to several of his reported symptoms: low energy, difficulty losing weight, low mood, and hair thinning are all recognised features of below-optimal testosterone. The most likely drivers in his case are alcohol and smoking. Alcohol at 15 or more drinks per week directly suppresses testosterone production by the testes and raises the enzyme aromatase, which converts testosterone into oestradiol. His oestradiol at 62 is within range, but the ratio of testosterone to oestradiol is lower than it should be, which is consistent with this mechanism. Smoking compounds the effect by reducing blood flow to the testes and by increasing SHBG in some individuals. Cannabis also suppresses testosterone through effects on the hypothalamus. His LH at 4.49 and FSH at 4.75 are both within range, which means the brain is not detecting the testosterone as critically low and is not sending stronger signals to the testes to produce more, suggesting this is a gradual decline rather than an acute failure. DHEA-S at 4.9 is healthy. Prolactin at 197 is within range, ruling out a prolactin-driven suppression. Cortisol at 512 is within the morning reference range of 145 to 619 but sits in the upper half. This is not abnormal, but combined with his report of feeling wired at night and slow to get going in the morning, it raises the possibility of a shifted cortisol rhythm where cortisol stays elevated into the evening (interfering with sleep onset) and takes longer to peak in the morning (explaining the sluggish waking). Stress that feels hard to manage some weeks, high alcohol intake, nicotine and cannabis can all flatten the normal cortisol curve.\n\nHis TSH at 4.03 is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. TSH is the signal the pituitary gland sends to the thyroid telling it how hard to work: the higher it climbs, the harder the thyroid is being pushed. His FT4 at 18.2 and FT3 at 6.2 are both within their optimal ranges, meaning the thyroid is still producing and converting well, but the pituitary is having to push slightly harder to achieve this output. Both thyroid antibodies (TPO and thyroglobulin) are firmly negative, which rules out autoimmune thyroid disease as the cause. At this level, the TSH does not require treatment, but it is worth monitoring because a TSH drifting upward over time can contribute to fatigue, weight gain and low mood, all of which he is experiencing. Smoking is a known disruptor of thyroid function, and high alcohol intake can also affect the hypothalamic-pituitary-thyroid axis.\n\nHis IgM is 0.3, below the lower limit of 0.5. IgM is the first antibody the immune system produces when it encounters a new infection. A low level can be an isolated finding with no clinical consequence, but it can also reflect chronic immune suppression. In his case, smoking, cannabis use and high alcohol intake are all immunosuppressive and are the most likely explanation. This is not urgent but should be noted by his GP, and if he reduces his alcohol and smoking, it would be worth rechecking.\n\nHis folate at 23 is above the upper laboratory limit of 17. This is almost certainly driven by his multivitamin, which will contain folic acid. At this level it is not harmful, but there is no benefit to having folate this high, and in smokers, very high folate combined with ongoing DNA damage from tobacco is a theoretical concern that some researchers have raised. He could consider switching to a multivitamin without folic acid given his dietary intake of 4 to 5 portions of vegetables and fruit provides adequate natural folate.\n\nHis total antioxidant activity at 1.95 is above the upper limit of 1.77. This is being driven by supplementation (the multivitamin and omega-3) and is not a concern. It simply confirms his supplements are raising his circulating antioxidant levels.\n\nHis reticulocyte absolute count at 44.45 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. At this margin, with haemoglobin at 145, red cells at 4.78 and iron stores that are full (ferritin 274, transferrin saturation 26%), there is no sign of anaemia or marrow failure. The count is marginally low and most likely reflects normal variation. His MCHC at 348 is marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin within each red cell. A reading 3 points above the upper limit is within the margin of laboratory and temperature variation noted on the sample and is not clinically significant.\n\nConnecting the findings back to his symptoms: his low energy and fatigue have a plausible explanation in the combination of below-optimal testosterone, a TSH that is pushing harder than ideal, high alcohol intake (which fragments sleep architecture even when total hours look adequate), smoking (which reduces oxygen delivery), and the pattern of feeling tired on waking and slow to get going, which suggests his sleep quality is poor despite adequate duration. His weight gain and difficulty losing weight are consistent with below-optimal testosterone (which shifts body composition toward fat and away from muscle) and the metabolic effects of alcohol (which provides empty calories, impairs fat oxidation and raises cortisol). His low mood and anxiety fit with both below-optimal testosterone and cortisol that may be dysregulated, compounded by cannabis use which is associated with increased anxiety in some individuals. His hair thinning at 46 can be driven by genetics, testosterone metabolism (specifically the conversion of testosterone to DHT, which miniaturises hair follicles), smoking (which reduces blood flow to the scalp), and stress. His blood results do not point to a nutritional cause: iron, B12, folate, vitamin D, zinc (not tested on this panel but his diet and supplementation suggest adequacy), and thyroid are all either optimal or close to it.\n\nThe single biggest lever in this report is alcohol. At 15 or more drinks per week, alcohol is the common thread running through the below-optimal testosterone, the low IgM, the upper-half cortisol, the impaired sleep quality despite adequate hours, the weight gain, the low mood and the cardiovascular risk from elevated LDL. Reducing to under 7 drinks per week, and ideally under 4, would likely improve several markers on a retest and is the change most likely to shift how he feels day to day. Stopping smoking is the second biggest lever, both for the testosterone, the immune function, the cardiovascular risk and the long-term dementia risk that his family history makes more personally relevant.","links":"The findings in this report are connected by two dominant threads: lifestyle-driven cardiovascular lipid elevation and a cluster of hormonal and immune effects driven primarily by alcohol, smoking and cannabis.\n\nThe lipid picture tells a clear, modifiable story. LDL at 3.5 and ApoB at 0.9 are both above their targets, but the Lp(a) at 26.83, safely below 32, confirms that this elevation is not genetic. The triglycerides at 1.23, the HDL at 1.6 and the ApoB-to-ApoA1 ratio at 0.57 are all favourable, meaning the lipid pattern is not one of metabolic syndrome or insulin resistance but rather one of dietary saturated fat intake outpacing clearance. The cardiovascular risk score of 30 reflects this: it is above the ideal 20 but below the 40 threshold, and reducing ApoB below 0.8 through diet would bring the score down. Given his family history of dementia, where vascular risk factors are among the few modifiable contributors, bringing LDL and ApoB into range has value beyond heart health.\n\nThe second thread connects testosterone, IgM, cortisol, sleep quality and several of his symptoms. Testosterone at 13.5 is below optimal at 46, and the three substances he is using regularly (alcohol, tobacco and cannabis) each independently suppress testosterone through different mechanisms: alcohol via direct testicular toxicity and aromatase upregulation, tobacco via reduced testicular perfusion, and cannabis via hypothalamic suppression. The IgM at 0.3, below the lower limit, fits the same pattern because all three substances are immunosuppressive. Cortisol at 512 is within the morning range but sits high, and his report of feeling tired on waking but potentially wired at night suggests the cortisol curve may be flattened, which alcohol, nicotine and stress all contribute to. The fatigue, low mood, weight gain and hair thinning he reports are downstream consequences of this pattern rather than separate problems.\n\nWhat has been excluded is important. His blood sugar and insulin sensitivity are excellent, ruling out metabolic syndrome as a driver. His liver shows no damage despite the alcohol and paracetamol load. His thyroid antibodies are negative, so the mildly elevated TSH is not autoimmune. His inflammation is negligible. His iron, B12, vitamin D and calcium are all healthy. His prostate screen is clean. His coeliac screen is negative. These exclusions mean the symptoms are not being caused by an undetected disease process.\n\nThe loose end is the TSH at 4.03. It is not high enough to treat and the thyroid output is adequate, but it is drifting toward the upper boundary of the laboratory range and sits well above the optimal ceiling of 2.5. Smoking is a known thyroid disruptor, and if he stops smoking and retests in four to six months, the TSH may settle. If it continues to climb, his GP should repeat it with antibodies to track the trend.\n\nThe practical implication is that the majority of his abnormal findings and his symptoms share common, modifiable causes. Reducing alcohol, stopping smoking and stopping cannabis would likely improve his testosterone, IgM, cortisol rhythm, sleep quality, energy, mood and weight within three to six months, and a retest would show the trajectory.","lifestyle":"Reduce alcohol to under 7 drinks per week, ideally under 4, starting by having at least four completely alcohol-free days each week. Anchor: choose your drinking days on Sunday evening and write them down. Why: alcohol is the single thread connecting your below-optimal testosterone of 13.5, your low IgM of 0.3, your disrupted sleep quality and your difficulty losing weight. Cutting back will improve several markers on your next test.\nSpeak to your GP or a smoking cessation service about stopping tobacco. Anchor: book the appointment this week. Why: smoking suppresses testosterone, damages blood vessel walls (compounding the LDL and ApoB elevation), impairs immune function and is the most significant modifiable risk factor for dementia given your family history.\nReduce or stop cannabis use. Anchor: replace the evening session with a walk, stretching or reading. Why: cannabis suppresses testosterone via the hypothalamus and is associated with increased anxiety in some people, working against your goal of reducing stress.\nSwap sugary snacks for whole food alternatives (nuts, fruit, dark chocolate, yoghurt) and reduce ultra-processed food to rare occasions. Anchor: do a weekly food shop with snack alternatives already in the house. Why: reducing sugar and processed food will lower LDL and ApoB, and replacing with fibre-rich foods (oats, beans, lentils, nuts) actively pulls cholesterol out of the blood.\nAdd two portions of oily fish per week (salmon, mackerel, sardines) and increase soluble fibre (oats, beans, lentils, flaxseed). Anchor: one fish meal replaces one red meat meal; add a handful of oats or flaxseed to breakfast. Why: oily fish raises HDL and lowers triglycerides, while soluble fibre binds bile acids in the gut, forcing the liver to pull LDL out of the blood to make more.\nSet a fixed wake time seven days a week, get outside within 30 minutes of waking, and stop caffeine after midday. Anchor: alarm at the same time every day including weekends, shoes on before you check your phone. Why: your pattern of tired on waking and slow to get going suggests your cortisol peak is delayed; morning light resets the cortisol curve and a consistent wake time trains the body clock.\nContinue your current training volume of five cardio and three resistance sessions per week, but ensure at least two of the resistance sessions are genuinely challenging with progressive overload. Anchor: track weights in a simple log. Why: resistance training is the most effective stimulus for testosterone production and for shifting body composition away from fat and toward muscle, which supports your weight loss goal.\nAim for a daily calorie intake of approximately 2,000 to 2,200 kcal to create a moderate deficit for gradual fat loss, with at least 120 to 130 grams of protein per day (roughly 1.6 g per kg of bodyweight). Anchor: build each meal around the protein source first. Why: protein preserves muscle during a deficit, supports testosterone, and keeps you full. A target weight range of 68 to 72 kg would bring your BMI into the 24 to 25.5 range.","flags":"LDL 3.5 (upper limit 3.0), ApoB 0.9 (desirable below 0.9), total cholesterol 5.6 (desirable below 5.18). The lipid elevation is diet-driven: Lp(a) at 26.83 (below 32) confirms no genetic contribution, and corrected LDL at 3.41 shows almost all of the elevation is modifiable. ApoB-to-ApoA1 ratio 0.57 is lower risk. HDL 1.6 and triglycerides 1.23 are favourable. Cardiovascular risk score 30 out of 100 (acceptable, not ideal).\nTestosterone 13.5 (optimal 18 to 30) with free testosterone 0.289 and bioavailable testosterone 6.63, both within range but toward the lower end. LH 4.49 and FSH 4.75 are within range, oestradiol 62 within range. Below-optimal testosterone is the most likely contributor to his fatigue, weight gain, low mood and hair thinning. Alcohol, smoking and cannabis are the most probable drivers.\nTSH 4.03 (optimal ceiling 2.5, lab upper limit 4.78) with FT4 18.2 and FT3 6.2 both within optimal ranges. TPO antibodies below 6.6 and thyroglobulin antibodies below 1.3, both negative. The thyroid is producing adequately but the pituitary is pushing harder than ideal. Not autoimmune. Worth monitoring on retest; smoking may be contributing.\nIgM 0.3 (lower limit 0.5). Isolated low IgM, most likely reflecting immunosuppression from alcohol, tobacco and cannabis. IgG 9.1 and IgA 2.3 are within range. Not urgent but should be noted by the GP and rechecked after lifestyle changes.\nCortisol 512 (morning range 145 to 619). Within range but in the upper half, consistent with his report of being tired on waking and potentially wired at night. Not pathological but suggestive of a flattened cortisol rhythm.\nFolate 23 (upper limit 17). Driven by multivitamin supplementation. Not harmful but no benefit at this level. Consider reducing folic acid supplementation.\nReticulocyte absolute count 44.45 (lower limit 50). Marginally below range with normal haemoglobin, red cells and iron stores. Most likely normal variation, not clinically significant.\nMCHC 348 (upper limit 345). Three points above range, within the margin of laboratory and temperature variation. Not clinically significant.\nTotal antioxidant activity 1.95 (upper limit 1.77). Supplement-driven, not a concern.\nReassuring negatives: fasting glucose 4.8, HbA1c 40, HOMA-IR 1.01 (excellent insulin sensitivity), CRP 0.2 (negligible inflammation), liver enzymes clean with FIB-4 0.63, kidney function excellent with cystatin C eGFR 101, PSA 0.72 with free ratio 0.458, thyroid antibodies negative, coeliac screen negative, urinalysis clean, Lp(a) 26.83 (below ideal 32), PhenoAge 35.7 (10.3 years younger than calendar age).","recommendations":"Discuss the lipid findings with your GP: LDL 3.5 (target below 3.0), ApoB 0.9 (target below 0.9), total cholesterol 5.6 (target below 5.18). Given the family history of dementia and the cardiovascular risk score of 30, dietary changes to bring ApoB below 0.8 should be the first approach, with reassessment in four to six months before considering medication.\nMention the below-optimal testosterone of 13.5 (optimal above 18) and the symptoms of fatigue, weight gain, low mood and hair thinning. The GP should note that LH and FSH are normal and that alcohol, smoking and cannabis are the most likely drivers. A retest after three to six months of reduced alcohol and smoking cessation would clarify whether lifestyle change is sufficient.\nMention the TSH of 4.03, above the optimal ceiling of 2.5, with negative antibodies and adequate FT4 and FT3. This does not need treatment now but should be repeated on the next test to track the trend, particularly after stopping smoking.\nMention the IgM of 0.3, below the lower limit of 0.5. Ask the GP to note it and recheck after lifestyle changes. If it remains low after reducing alcohol and stopping smoking, further investigation may be appropriate.\nDiscuss the frequent painkiller use (ibuprofen, paracetamol). Ibuprofen carries kidney and gastrointestinal risk with chronic use, and paracetamol at high or frequent doses stresses the liver. The GP should review whether the pain being treated has an alternative management strategy, particularly given the current clean liver and kidney results which should be protected.\nRetest in four to six months with: lipid panel including ApoB, testosterone, TSH, FT4, IgM, full blood count, liver function and GGT. This timeline allows enough time for dietary changes and alcohol reduction to show in the blood.","supplementation":"Continue vitamin D3 (cholecalciferol) at your current dose, which is producing an excellent level of 116 nmol/L. If your multivitamin provides less than 2,000 IU, consider a standalone 2,000 IU daily with a fat-containing meal to maintain this level through winter. Always take with vitamin K2 (MK-7) at 100 to 200 mcg daily.\nContinue omega-3 fish oil at a dose providing at least 2 grams of combined EPA and DHA daily. Take with food. Why: omega-3 supports the reduction of LDL and ApoB and has anti-inflammatory and neuroprotective effects relevant to his family history of dementia.\nContinue magnesium glycinate at 300 to 400 mg, taken before bed. Why: his level at 0.87 is within the optimal band, meaning supplementation is maintaining it well, and magnesium glycinate supports sleep quality and stress management.\nConsider switching to a multivitamin without folic acid, or stopping the multivitamin altogether. Why: his folate at 23 is well above the upper limit and his diet provides 4 to 5 portions of vegetables and fruit daily, which supplies adequate natural folate. His B12 at 534 is within the optimal range and does not need further supplementation.\nDo not take iron supplements. His ferritin at 274 is already in the upper half of the laboratory range and additional iron could push stores into excess.\nThe most important changes from this report are not supplements. They are reducing alcohol to under 7 drinks per week, stopping smoking, stopping cannabis, and adding soluble fibre and oily fish to bring LDL and ApoB into range.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 78.6; held to 74 by a system rated \"Needs attention\". Weakest systems: lipids & cardiovascular 43%, immunology 57%, vitamins & nutrients 77%. Biggest drags: LDL Cholesterol, Total Cholesterol, Apolipoprotein B, Bicarbonate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"35.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is a biological age estimate based on blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. His PhenoAge of 35.7 is 10.3 years younger than his calendar age of 46, which is an excellent result. The main drivers of this favourable gap are his very low CRP (0.2), healthy albumin (42), clean kidney function (creatinine 80), well-maintained blood cells and normal glucose. This suggests that despite the lifestyle exposures, his body is ageing well at the cellular level.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built in the arteries, not a ten-year event probability. His score of 30 is above the ideal threshold of 20 but within the acceptable range of below 40. The main inputs driving the score up are LDL at 3.5 and ApoB at 0.9. The inputs pulling it down are HDL at 1.6, Lp(a) at 26.83, CRP at 0.2 and triglycerides at 1.23. Bringing ApoB below 0.8 through dietary changes would bring this score toward ideal.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1964","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells. When the liver is under strain, ALT leaks into the blood and the level rises. His ALT at 22 is below t ning, it should peak to provide energy and alertness, then decline through the day. His morning cortisol at 512 is within the laboratory range but above the optimal ceiling of 500. Combined with his report of being tired on waking (suggesting a delayed cortisol peak) and potentially wired at night, this suggests the cortisol rhythm may be flattened. High alcohol intake, nicotine, cannabis and psychological stress can all contribute to a dysregulated cortisol pattern.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Stress, alcohol, smoking, Cushing's syndrome, shift work, sleep deprivation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4679","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4308","upper_optimal_position":"0.5641","units":"umol/L","description":"DHEA-S is a precursor hormone produced by the adrenal glands that converts into testosterone and oestrogen. It declines with age. His level at 4.9 umol/L (approximately 1,806 ug/dL) is within the optimal range, confirming healthy adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"6.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5538","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone includes both dies are negative, ruling out autoimmune thyroid disease. This TSH is worth monitoring on his next test, particularly after stopping smoking, which is a known thyroid disruptor.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5536","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"FT4 is the inactive form of thyroid hormone that circulates in the blood. The body converts it to the active form, FT3, in tissues. His level at 18.2 is within the optimal range of 14 to 20, confirming adequate thyroid hormone production despite the TSH being pushed above optimal.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5926","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4889","upper_optimal_position":"0.6222","units":"pmol/L","description":"FT3 is the active form of thyroid hormone that drives metabolism, energy and cognitive function. His level at 6.2 is within the optimal range of 4.5 to 6.5, confirming excellent thyroid conversion and active hormone delivery to tissues.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>

  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
