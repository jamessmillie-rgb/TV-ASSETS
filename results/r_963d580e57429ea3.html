const REPORT_DATA = {"patient_name":"Susan Richardson","dob":"14/03/1947","report_date":"2026-08-20","summary":"Susan is a 79-year-old female presenting with a BMI of 29.7, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. She does not undertake any structured exercise, with fewer than 2,000 daily steps. She takes a proton pump inhibitor (Omeprazole) and reports frequent use of painkillers such as ibuprofen or paracetamol. She has diagnosed chronic kidney disease, chronic fatigue syndrome (ME/CFS), hypertension, and long COVID or post-viral syndrome. She reports low energy, fatigue, joint pain and stiffness, and poor exercise recovery. Her goals are to improve long-term health and longevity, improve energy levels, and boost her immune system. Susan has requested a comprehensive review with particular attention to kidney function, liver health, digestion, bone health, autoimmune status, and any abnormal markers.\n\nThe most clinically significant finding in this report is the kidney function picture. Susan's Cystatin C, a protein produced at a steady rate by all cells and filtered by the kidneys, is 1.53, above the upper limit of 1.1. The eGFR calculated from Cystatin C is 49, and the creatinine-based eGFR is 56, both below the threshold of 60 that defines reduced kidney function. Cystatin C is generally considered the more reliable of the two measures because it is not affected by muscle mass, age-related muscle loss, or body composition in the way creatinine can be, and at 79 with a sedentary lifestyle, creatinine-based eGFR can sometimes overestimate kidney function. The Cystatin C figure of 49 is therefore likely the more accurate reflection of where Susan's kidneys are working. This is consistent with her known CKD diagnosis. The reassuring elements within this picture are that her urea is 6.7, comfortably within range, her electrolytes are all stable with sodium at 139, chloride at 97, bicarbonate at 25.7, and potassium at 4.9, and her urine shows no protein, no casts, and no red blood cells, meaning the kidneys are not leaking protein or showing signs of active damage. This is a stable CKD picture rather than an acute or rapidly worsening one, but it should be discussed with her GP or nephrologist to confirm it aligns with previous readings and to ensure monitoring intervals are appropriate.\n\nThe urine sample did return a positive nitrite result, which usually indicates the presence of bacteria that convert nitrates to nitrites. However, the bacterial count was low at 10 to the power of 4 CFU per ml, no white blood cells were detected, and the laboratory reported mixed growth with probable contamination. Taken together, this is most likely a contaminated sample rather than a genuine urinary tract infection. If Susan is experiencing urinary symptoms such as burning, frequency, or urgency, a repeat mid-stream sample via her GP would give a clearer answer.\n\nTurning to the positives, and there are many. Susan's liver is in excellent health. Her ALT is 14, well within the ideal range, her AST is 24, her GGT is 31, her bilirubin is 11, and her albumin is 37. The pancreatic enzymes amylase and lipase are both comfortably within range, which is reassuring for digestive function. Her FIB-4 score, a calculation that estimates the likelihood of liver fibrosis, is 1.78, which sits above the standard threshold of 1.45. However, at 79, the age-adjusted threshold is 2.0, and Susan's score falls below this. Furthermore, the FIB-4 formula uses age as a multiplier, so in a 79-year-old, the score is pushed upward by the calculation itself rather than by any sign of liver disease. With every individual liver marker looking clean, this score does not suggest liver fibrosis.\n\nHer inflammation markers are genuinely impressive. Her hs-CRP, the most sensitive measure of systemic inflammation, is 0.7, below the optimal threshold of 1.0. For someone with chronic fatigue syndrome, long COVID, joint pain, and CKD, a CRP this low is a very reassuring finding. It suggests that whatever is driving her symptoms, widespread systemic inflammation is not the primary mechanism. Her ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and rises with inflammation, is just 4, which is excellent.\n\nHer thyroid is working well. TSH, the hormone the pituitary gland sends to stimulate the thyroid, is 1.03, sitting in the optimal zone. Free T4, the main thyroid hormone, is 19.2, in the upper part of the optimal range. Free T3, the active form that cells actually use, is 4.6, which is within the optimal band. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. This is a well-functioning thyroid and can be excluded as a contributor to her fatigue.\n\nHer blood sugar regulation is well controlled. Fasting glucose is 5.1 and HbA1c, which reflects average blood sugar over the preceding two to three months, is 39 mmol per mol, both within the optimal range. Her fasting insulin is 5.64 and her HOMA-IR, a calculation that estimates insulin resistance by combining fasting glucose and insulin, is 1.28, sitting within the healthy range. This means her cells are responding well to insulin and she is not showing signs of insulin resistance, which at a BMI of 29.7 is a genuinely positive finding. Her C-Peptide, a molecule released in equal amounts to insulin and used to measure how much insulin the pancreas is producing, is 0.937 micrograms per litre, which converts to approximately 310 pmol per L, below the laboratory lower limit of 1.1 micrograms per litre (364 pmol per L). In the context of normal glucose, normal HbA1c, and a HOMA-IR that shows good insulin sensitivity, a low C-Peptide simply reflects that the pancreas does not need to produce large amounts of insulin to keep blood sugar controlled. This is a sign of efficiency rather than insufficiency. Her HOMA-B, a calculation estimating the percentage of normal beta cell function, is 70.5, which is below the standard range of 80 to 200. Again, in the context of completely normal blood sugar control, this reflects low insulin demand rather than pancreatic failure, but it is worth noting for future monitoring.\n\nHer bone health markers are reassuring. Corrected calcium is 2.54, within the healthy range. PTH, parathyroid hormone, which regulates calcium by pulling it from bones when levels drop, is 2.7, comfortably mid-range. Alkaline phosphatase, which can rise with bone turnover or liver disease, is 48, at the lower end of its range, and with the liver markers all clean this is a good sign for bone stability. Magnesium is 0.88, within the optimal band. This is a reassuring bone health picture, though a DEXA scan remains the gold standard for assessing bone density directly and would be worth discussing with her GP if one has not been performed recently.\n\nHer immune system markers are balanced. Her white cell count is 5.06, with a healthy distribution across neutrophils, lymphocytes, monocytes, eosinophils, and basophils. Her neutrophil to lymphocyte ratio is 2.25, within the normal range. Her immunoglobulins, the antibodies the body produces to fight infection, are all within range, with IgG at 10.5, IgA at 2.3, and IgM at 0.5, which sits right at the lower boundary of its range. IgE, the antibody associated with allergic responses, is very low at 1.06, which simply indicates no significant allergic activation. Rheumatoid factor is 8, below the threshold of 14, which is reassuring given her joint symptoms. The tissue transglutaminase IgA test for coeliac disease is negative, ruling out gluten-related autoimmune gut damage.\n\nHer full blood count is largely healthy. Haemoglobin is 128, within range for a woman. Red blood cells, haematocrit, MCV, MCH, and MCHC are all within normal limits. Platelets are 285, healthy. Her reticulocyte percentage is 0.84, within the normal range, but the absolute reticulocyte count is 34.8, below the lower limit of 50. Reticulocytes are young, newly produced red blood cells released from the bone marrow, and a low absolute count can indicate that the bone marrow is producing red blood cells at a slightly reduced rate. At 79, some reduction in bone marrow output is expected as part of normal ageing, and given that her haemoglobin is within range and she is not anaemic, this is not an immediate concern, but it is worth monitoring. Her iron studies support this: ferritin is 43, which is within the laboratory range but below the optimal threshold of 40 to 150 for a woman, though only marginally. Serum iron is 24.1, transferrin saturation is 38 percent, sitting within the optimal band of 25 to 40 percent, and transferrin and iron binding capacity are both within range. There is no iron deficiency here, and no iron overload.\n\nHer lipid profile is the area where there is the most room for improvement. Her total cholesterol is 5.8, above the desirable threshold of 5.18. Her LDL, the form of cholesterol most associated with arterial plaque development, is 3.34, above the upper limit of 3.0. Her ApoB, apolipoprotein B, which is a direct count of the number of potentially harmful cholesterol particles in the bloodstream, is 1.17, above the target of 0.9. ApoB is widely regarded as the single best blood marker for cardiovascular risk because each particle carrying an ApoB molecule can enter the artery wall and contribute to plaque formation. Her Apolipoprotein A1, the protein carried on protective HDL particles, is 1.72, which is healthy. However, the ApoB to A1 ratio is 0.68, above the lower risk threshold of 0.6, placing her in the average risk category. The encouraging elements of her lipid picture are her HDL at 2.0, which is excellent and well above the optimal threshold of 1.6 for a woman, her triglycerides at 1.15, within the desirable range, and her triglyceride to HDL ratio of 0.58, which is in the optimal zone and is a strong marker of metabolic health. Her VLDL is 0.52, within range. Her remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.46, within the optimal range of below 0.5. The Lp(a) result has now arrived: < 25 nmol/l, within range. Given her age, her hypertension diagnosis, and her CKD, the LDL and ApoB elevation is worth discussing with her GP. At 79, the decision about whether to introduce or adjust cholesterol-lowering medication is nuanced and depends on her overall cardiovascular risk profile, which her GP is best placed to assess.\n\nHer testosterone is 0.4, below the lower limit of 0.5, and her free androgen index is 0.4, also below the lower limit of 0.5. Her SHBG, sex hormone binding globulin, which is a protein that binds testosterone and reduces the amount available for tissues to use, is 101.2, which is in the upper part of its range. The combination of low total testosterone with high SHBG means that very little testosterone is available in its free, active form. Her calculated free testosterone is just 0.003 nmol per litre. At 79 and post-menopausal, some decline in testosterone is expected, but levels this low can contribute to fatigue, reduced muscle mass, joint stiffness, and difficulty recovering from physical activity, all symptoms Susan reports. Her FSH at 87.22 and LH at 23.16 confirm post-menopausal status, and oestradiol is below 43, consistent with this. Progesterone at 0.54 is within the post-menopausal range. Susan may wish to discuss testosterone replacement with her GP or a specialist, as there is growing evidence that low-dose testosterone therapy in post-menopausal women can help with energy, muscle maintenance, and quality of life, though it is not yet widely prescribed in the NHS.\n\nHer vitamin D is 72, which is sufficient but below the optimal range of 75 to 120. At her current level she would benefit from supplementation to bring this into the optimal zone, particularly given her CKD, limited mobility, and concern about bone health. Vitamin D is fat-soluble and is important for calcium absorption, bone mineralisation, immune function, and mood. Her B12 is 717, which is well within the optimal range of 500 to 900, and this is a good finding given her use of Omeprazole, a proton pump inhibitor that can reduce B12 absorption over time. Her folate is 14, above the optimal threshold of 8. Both are reassuring.\n\nHer total antioxidant activity is 2.14, above the upper limit of 1.77. This marker measures the overall capacity of the blood to neutralise free radicals and oxidative stress. An elevated result is not a clinical concern and may reflect dietary antioxidant intake or supplementation. It requires no action.\n\nHer cortisol is 209, which falls within the expected morning range of 145 to 619. DHEA-S, a precursor hormone produced by the adrenal glands, is 0.5 micromol per litre, which converts to approximately 184 micrograms per decilitre. This is within the laboratory range but is at the lower end, which is expected at 79 as DHEA-S declines steadily with age. Prolactin is 145, within the post-menopausal range. Creatine kinase, a marker of muscle damage, is 151, within range, which is reassuring given her joint and muscle symptoms.\n\nThe tumour markers CA-125, CA 15-3, CA 19-9, and CEA are all within their respective normal ranges, which is reassuring. These markers are screening tools and normal results reduce the likelihood of certain cancers being present, though they do not provide absolute exclusion.\n\nIn summary, Susan's blood work shows a stable chronic kidney disease picture without signs of acute deterioration, excellent liver health, impressive inflammatory control, well-functioning thyroid, good blood sugar regulation, and no autoimmune or coeliac markers. The areas for attention are her LDL and ApoB elevation, which should be discussed with her GP in the context of her cardiovascular risk profile, her low testosterone which may be contributing to her fatigue and joint symptoms, her vitamin D which would benefit from supplementation, and the low absolute reticulocyte count which should be monitored over time. The Lp(a) result has now arrived: < 25 nmol/l, within range.\n\nLate-arriving results: Lipoprotein(a): < 25. With this result in, the Cardiovascular Risk Score can now be calculated: 40 out of 100. See the Cardiovascular Risk Score card for what is driving it.","links":"Susan asked for this report to cover everything rather than concentrating on a limited number of conditions, and the good news is that many of the systems she was concerned about, liver, digestion, bone health, autoimmune status, are looking reassuringly healthy. The areas that would benefit from attention fall into a few practical categories.\n\nKidney health is the most important ongoing concern. Her Cystatin C eGFR of 49 places her in stage 3b CKD. She should ensure she has regular monitoring with her GP or nephrologist, ideally every three to six months, including Cystatin C alongside creatinine-based eGFR, a urine albumin to creatinine ratio, and electrolytes. Her frequent painkiller use is worth raising with her medical team. Non-steroidal anti-inflammatory drugs such as ibuprofen can reduce blood flow to the kidneys and are generally advised against in CKD. Paracetamol is usually the safer alternative, but even this should be discussed in the context of her kidney function. Staying well hydrated, aiming for around 1.5 litres of water per day unless otherwise advised by her nephrologist, supports kidney function.\n\nFor her cholesterol, she should discuss her LDL of 3.34 and ApoB of 1.17 with her GP. At 79, with hypertension and CKD, the decision about statin therapy or other lipid-lowering approaches is a conversation between her and her doctor. Dietary changes that can support her lipid profile include increasing soluble fibre from sources such as oats, barley, beans, lentils, and apples, which bind cholesterol in the gut and reduce absorption. Two to three portions of oily fish per week, such as salmon, mackerel, or sardines, provide omega-3 fatty acids that lower triglycerides and may modestly improve the overall lipid profile. Reducing saturated fat from processed meats, butter, cheese, and baked goods, and replacing with olive oil, nuts, and avocado, can lower LDL. Her Lp(a), an inherited lifelong marker, is below 25, which is ideal.\n\nFor her energy levels and fatigue, her low testosterone and very low free testosterone may be contributing factors alongside her CFS and long COVID. She could ask her GP or a specialist about whether low-dose testosterone replacement might be appropriate. This is an area of growing clinical interest in post-menopausal women, and a specialist in menopause or endocrinology would be the best person to advise. Ensuring adequate protein intake is important for maintaining muscle mass, supporting immune function, and managing fatigue. At her weight of 78 kilograms and with minimal activity, a protein target of 1.0 to 1.3 grams per kilogram per day, approximately 78 to 100 grams of protein daily, would be appropriate. Her current diet quality and volume are both rated 5 out of 10, and improving both would likely have a meaningful impact on energy. A calorie intake of approximately 1,400 to 1,600 calories per day would support gradual weight management at her activity level, calculated from her basal metabolic rate with a sedentary multiplier of 1.3. Prioritising protein at each meal, including eggs, fish, poultry, Greek yoghurt, beans, and lentils, will help her reach her protein target.\n\nFor movement, even very modest increases in daily steps can benefit kidney function, cardiovascular health, bone density, and energy levels. A realistic starting goal would be to increase from fewer than 2,000 steps to 3,000 to 4,000 steps per day over four to six weeks, building gradually. If joint pain limits walking, chair-based exercises or swimming and water-based movement can provide similar benefits with less joint stress.\n\nFor sleep and recovery, if fatigue and poor recovery are affecting her quality of life, practical steps include maintaining a fixed wake time each day, getting outside within an hour of waking for natural light exposure, avoiding caffeine after midday, and keeping the bedroom cool and dark. These measures support the circadian rhythm, which directly influences energy levels and immune function.\n\nA retest in six months, around February 2027, would be appropriate to monitor kidney function via Cystatin C and creatinine-based eGFR, repeat the full blood count to track reticulocytes, check vitamin D to confirm supplementation has brought levels into the optimal range, repeat lipids to see whether dietary changes have shifted LDL and ApoB, and capture the Lp(a) if it has not yet been returned. If her GP starts or adjusts any medication based on these results, earlier retesting may be appropriate as guided by her medical team.","flags":"GP-URGENT: Ibuprofen use with CKD. Susan reports frequent use of painkillers including ibuprofen. With a Cystatin C eGFR of 49 (stage 3b CKD), NSAIDs are generally contraindicated as they reduce renal perfusion and can accelerate kidney function decline. This should be reviewed urgently with her GP to identify safer alternatives for pain management.\n\nKIDNEY: Cystatin C 1.53 (upper limit 1.1). Cystatin C eGFR 49. Creatinine-based eGFR 56 (lower limit 60). Consistent with her known CKD diagnosis. Electrolytes stable. No proteinuria. Urine sediment clean. Recommend confirmation that monitoring intervals are appropriate and that this is consistent with her previous trajectory.\n\nLIPIDS: LDL 3.34 (upper limit 3.0). ApoB 1.17 (target below 0.9). Total cholesterol 5.8 (desirable below 5.18). ApoB/A1 ratio 0.68 (lower risk below 0.6). HDL is excellent at 2.0 and triglycerides are healthy at 1.15. The Lp(a) result has now arrived: < 25 nmol/l, within range. Given hypertension and CKD, cardiovascular risk assessment and discussion of lipid-lowering therapy is warranted.\n\nHORMONES: Testosterone 0.4 (lower limit 0.5). Free androgen index 0.4 (lower limit 0.5). Free testosterone calculated 0.003. SHBG 101.2, in upper range, contributing to low free testosterone. May be contributing to fatigue, joint stiffness, poor recovery, and reduced muscle mass. Discussion of low-dose testosterone replacement may be appropriate.\n\nHAEMATOLOGY: Absolute reticulocyte count 34.8 (lower limit 50). Reticulocyte percentage 0.84 is within range. Haemoglobin 128, within range. No anaemia. Likely reflects age-related bone marrow changes. Monitor on retest.\n\nGLUCOSE: C-Peptide 0.937 ug/L (lower limit 1.1), equating to approximately 310 pmol/L. In the context of normal glucose (5.1), normal HbA1c (39), and HOMA-IR 1.28, this reflects low insulin demand rather than pancreatic failure. HOMA-B calculated at 70.5, below the standard range of 80-200, consistent with the same pattern. Monitor on retest.\n\nURINE: Nitrites positive but laboratory reports mixed growth and probable contamination. No white blood cells detected. Not consistent with active UTI. Repeat via the GP if symptoms present.\n\nThe Lp(a) result has now arrived: < 25 nmol/l, within range.\n\nReassuring negatives: Liver function entirely normal (ALT 14, GGT 31, AST 24, bilirubin 11, albumin 37). FIB-4 1.78 is below the age-adjusted threshold of 2.0 at 79 and driven by the age component of the calculation. hs-CRP 0.7, excellent. ESR 4, excellent. Thyroid fully normal with negative antibodies. HbA1c 39, well controlled. No proteinuria. No urinary red blood cells. Rheumatoid factor negative. Coeliac screen negative. All tumour markers negative. Immunoglobulins within range. Bone markers (calcium, PTH, ALP, magnesium) all reassuring.","recommendations":"1. Discuss NSAID use urgently with GP. Ibuprofen is generally contraindicated with a Cystatin C eGFR of 49. Safer pain management alternatives should be identified, potentially including paracetamol at appropriate doses, topical treatments, or physiotherapy referral.\n\n2. Ensure kidney monitoring is on an appropriate schedule with GP or nephrologist, including Cystatin C, creatinine eGFR, urine albumin to creatinine ratio, and electrolytes every three to six months.\n\n3. Discuss LDL of 3.34 and ApoB of 1.17 with GP in the context of overall cardiovascular risk. Bring the full lipid results including the excellent HDL of 2.0 and triglycerides of 1.15, and when available, the Lp(a) result.\n\n4. Discuss low testosterone (0.4) and very low free testosterone (0.003) with GP or menopause specialist. Low-dose testosterone therapy may be appropriate given her fatigue, joint symptoms, and poor recovery.\n\n5. Begin vitamin D3 supplementation at 2,000 IU daily with a fat-containing meal, taken alongside vitamin K2 MK-7 at 100 micrograms daily, to move vitamin D from 72 into the optimal range of 75 to 120.\n\n6. Increase dietary quality and volume from 5 out of 10 toward 7 or 8. Prioritise protein at every meal, aiming for 78 to 100 grams per day. Include oily fish two to three times per week, increase soluble fibre from oats, beans, lentils, and apples, and reduce saturated fat from processed meats and baked goods.\n\n7. Gradually increase daily steps from under 2,000 toward 3,000 to 4,000 over four to six weeks. Consider water-based exercise or chair-based exercise if joint pain limits walking.\n\n8. If urinary symptoms are present (burning, frequency, urgency), request a repeat mid-stream urine sample from the GP.\n\n9. Record the Lp(a) result permanently in medical notes when it arrives.\n\n10. The Lp(a) result has now arrived: < 25 nmol/l, within range.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 IU daily, taken with her largest meal or a meal containing some fat to aid absorption. Susan's current level of 72 is just below the optimal threshold of 75. Given her limited sun exposure with fewer than 2,000 steps per day, her CKD which can impair the kidney's ability to activate vitamin D, and her BMI of 29.7 which means some vitamin D will be sequestered in fat tissue, ongoing supplementation is important. She should not exceed 2,000 IU daily without GP guidance, as CKD can affect how vitamin D is metabolised and higher doses may need monitoring of calcium levels.\n\nVitamin K2 (MK-7): 100 micrograms daily, taken at the same time as vitamin D3. Vitamin K2 directs calcium into bones and teeth rather than allowing it to deposit in soft tissues and arteries. This is particularly relevant given Susan's interest in bone health and her cardiovascular risk factors.\n\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. This supports her cardiovascular health given the elevated LDL and ApoB, and omega-3 fatty acids have mild anti-inflammatory properties that may help with joint stiffness. If she eats oily fish two to three times per week, supplementation can be reduced to 1 gram daily.\n\nMagnesium glycinate: 300 milligrams in the evening, approximately one hour before bed. Susan's magnesium is 0.88, within the optimal range, but supplementation at this dose supports sleep quality, muscle relaxation, and bone health. Glycinate is the best-absorbed form and is the least likely to cause digestive upset.\n\nSusan should NOT take an iron supplement. Her ferritin is 43, her transferrin saturation is 38 percent, and her serum iron is 24.1. There is no iron deficiency, and unnecessary iron supplementation can be harmful, particularly with CKD.\n\nA note on her Omeprazole: long-term PPI use can reduce absorption of magnesium, B12, calcium, and iron. Susan's B12 and magnesium are currently healthy, which is reassuring, but this is worth monitoring on future blood tests. She should not stop Omeprazole without discussing with her GP, but it may be worth reviewing whether it is still needed or whether the dose can be reduced.\n\nThe most important changes from this report are not supplements. They are reviewing her painkiller use with her GP to stop ibuprofen and protect her kidneys, increasing her protein intake to 78 to 100 grams per day to support muscle maintenance and energy, and gradually building her daily movement to 3,000 to 4,000 steps. These changes will do more for her energy, joint health, and long-term outcomes than any supplement.","biomarkers":[{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is 40 out of 100, acceptable, though above the ideal of 20 or below. It is a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, and it measures the risk being built rather than the ten-year chance of an event. The main contributors are ApoB at 1.17.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.125","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When the liver is under strain or damaged, ALT leaks into the bloodstream and the level rises. Susan's ALT is 14, well within the optimal range of below 25 for a woman. This indicates that her liver cells are healthy and not under metabolic stress. This is a reassuring finding given her use of Omeprazole and frequent painkillers, both of which are processed by the liver.","low_causes":"","high_causes":"Liver disease, alcohol, medications, fatty liver, obesity, viral hepatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3438","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It rises when any of these tissues are damaged. Susan's AST is 24, comfortably within the normal range and in the optimal zone. Combined with her normal ALT and GGT, this confirms healthy liver function.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle injury, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4079","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol use, bile duct obstruction, and metabolic strain on the liver. Susan's GGT is 31, within the laboratory range of 4 to 38 for women but above the optimal threshold of 25. This is a marginal finding and does not suggest liver disease, particularly with her ALT, AST, and bilirubin all being healthy. It may reflect her medication use or simply normal variation.","low_causes":"","high_causes":"Alcohol, medications, bile duct disease, fatty liver, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP, alkaline phosphatase, is an enzyme found in the liver and bones. Elevated levels can indicate bile duct disease, liver damage, or increased bone turnover. Susan's ALP is 48, at the lower end of the range, which with her clean liver markers suggests both liver and bone turnover are healthy. This is reassuring for her bone health concerns.","low_causes":"Malnutrition, zinc deficiency","high_causes":"Bile duct obstruction, bone disease, Paget's disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Elevated levels can indicate liver disease, bile duct problems, or excessive red blood cell destruction. Susan's bilirubin is 11, comfortably mid-range, confirming the liver is processing waste efficiently.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6133","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects nutritional status, liver synthetic function, and immune activity. Susan's total protein is 67, within both the normal and optimal ranges, indicating adequate protein nutrition and healthy liver production.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss)","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. Susan's albumin is 37, within the laboratory range but below the optimal threshold of 40. At 79, a modest decline in albumin is common and may reflect reduced liver synthetic reserve or lower dietary protein intake. Increasing her protein intake toward 78 to 100 grams per day could help support this level.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/l","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. Susan's globulin is 30, at the boundary of the optimal range. This is consistent with her immunoglobulin levels, which are all within range, indicating a normally functioning immune system.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin (37 divided by 30 = 1.23). It provides a quick assessment of the balance between these two protein groups. Susan's ratio of 1.23 is within range, indicating a healthy balance between liver-produced albumin and immune-related globulins.","low_causes":"Liver disease, autoimmune conditions, kidney disease","high_causes":"Underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.78","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4521","lower_normal":"0","upper_normal":"2","lower_optimal":"0","upper_optimal":"1.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3625","units":"","description":"The FIB-4 score is a calculated marker that estimates the likelihood of liver fibrosis (scarring) using age, platelet count, AST, and ALT. The standard threshold is 1.45, but in patients over 65 the age-adjusted threshold is 2.0 because the age component of the formula pushes the score upward regardless of liver health. Susan's score of 1.78 is above the standard threshold but below the age-adjusted threshold of 2.0, and with every individual liver marker being clean, this score is being driven by the calculation rather than by any sign of liver disease. No further investigation for liver fibrosis is needed.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelet count, low ALT","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4432","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands. It breaks down starches into sugars during digestion. Elevated levels can indicate pancreatic inflammation (pancreatitis). Susan's amylase is 59, comfortably within range, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4043","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is a more specific marker for pancreatic health than amylase. Susan's lipase is 23, well within range, confirming her pancreas is functioning normally. This is reassuring for her digestive health concerns.","low_causes":"","high_causes":"Pancreatitis, pancreatic disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5601","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures all the cholesterol carried in the bloodstream, including both the protective HDL and the potentially harmful LDL and VLDL fractions. Susan's total cholesterol is 5.8, above the desirable threshold of 5.18. However, total cholesterol alone is a limited measure because it includes HDL, which is protective, and Susan's HDL is excellent at 2.0. The more informative markers are LDL and ApoB, which are discussed separately.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, kidney disease, age","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3382","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat stored in the body and transported in the blood. Elevated levels are associated with cardiovascular risk, insulin resistance, and metabolic syndrome. Susan's triglycerides are 1.15, within the healthy fasting range of below 1.7 but above the optimal threshold of 1.0. This is a reasonable result, particularly in the context of her excellent insulin sensitivity.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High-sugar diet, obesity, insulin resistance, alcohol, genetic factors","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, very low-density lipoprotein, carries triglycerides from the liver to tissues throughout the body. Elevated VLDL contributes to cardiovascular risk. Susan's VLDL is 0.52, within both the normal and optimal ranges, reflecting her healthy triglyceride levels.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity, high-sugar diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6452","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL, high-density lipoprotein, is the protective form of cholesterol. It collects excess cholesterol from the arteries and returns it to the liver for disposal. Higher levels are associated with lower cardiovascular risk. Susan's HDL is 2.0, which is excellent and well above the optimal threshold of 1.6 for a woman. This is one of the strongest positive findings in her lipid profile.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, genetics","high_causes":"Exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5567","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL, low-density lipoprotein, carries cholesterol into the artery walls where it can accumulate and form plaques that narrow the arteries over time. Susan's LDL is 3.34, above the upper limit of 3.0 and above the optimal target of 2.6. Given her hypertension and CKD, managing LDL is important for protecting both her heart and her kidneys, as cardiovascular disease and kidney disease share common risk pathways.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, sedentary lifestyle, age","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3222","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick assessment of cardiovascular risk by balancing total cholesterol against the protective HDL fraction. A lower ratio is better. Susan's ratio is 2.9, well within the desirable range of below 4.5 and within the optimal zone of below 3.5. This reflects the balancing effect of her excellent HDL.","low_causes":"","high_causes":"High total cholesterol, low HDL","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"34.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4310","lower_normal":"20","upper_normal":"80","lower_optimal":"25","upper_optimal":"80","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5313","upper_optimal_position":"1","units":"%","description":"HDL percentage indicates what proportion of Susan's total cholesterol is carried by protective HDL particles. At 34.48%, more than a third of her total cholesterol is the beneficial type, which is an excellent finding and well above the minimum of 20%.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.475","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol fractions (LDL, VLDL, and remnants) in a single number. Susan's non-HDL is 3.8, within the laboratory range of below 4 but above the optimal target of 3.4. This aligns with her elevated LDL and ApoB and would benefit from the dietary changes described in the recommendations.","low_causes":"","high_causes":"High LDL, high triglycerides, diet, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6143","lower_normal":"1.4","upper_normal":"2.8","lower_optimal":"1.6","upper_optimal":"2.8","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein component of HDL particles. Higher levels indicate more protective HDL activity. Susan's ApoA1 is 1.72, above both the reference minimum of 1.4 and the optimal threshold of 1.6, reflecting her excellent HDL cholesterol level.","low_causes":"Sedentary lifestyle, obesity, smoking, genetics","high_causes":"Exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.65","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB, apolipoprotein B, is a protein found on each LDL, VLDL, and Lp(a) particle. Because there is exactly one ApoB molecule per particle, measuring ApoB effectively counts the total number of potentially atherogenic (artery-damaging) particles in the bloodstream. It is widely considered the single best blood marker for cardiovascular risk. Susan's ApoB is 1.17, above the target of 0.9 and classified as borderline high. This is the most important lipid finding in her report and should be discussed with her GP.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"High LDL, genetics, diet high in saturated fat, hypothyroidism, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio balances the number of harmful cholesterol particles (ApoB) against protective ones (ApoA1). It is one of the best summary measures of cardiovascular risk from a lipid panel. Susan's ratio is 0.68, above the lower risk threshold of 0.6 for women, placing her in the average risk category. While not in the higher risk zone (above 0.8), there is room for improvement through dietary changes.","low_causes":"","high_causes":"High LDL, low HDL, genetics, diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"32","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Lp(a), lipoprotein little a, is an inherited variant of LDL cholesterol that deposits cholesterol in artery walls, encourages blood clotting, and drives inflammation. Unlike other cholesterol markers, Lp(a) is almost entirely determined by genetics and cannot be meaningfully changed through diet, exercise, or most medications. It only needs to be measured once in a lifetime. This result arrived after your report was first published.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"","one_sided":"","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1933","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a powerful marker of metabolic health and insulin resistance. A low ratio indicates good metabolic function and insulin sensitivity. Susan's ratio is 0.58, well within the optimal range of below 0.87, which is an excellent result and consistent with her healthy insulin and HOMA-IR readings.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL (5.8 minus 2.0 minus 3.34 = 0.46). It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Susan's remnant cholesterol is 0.46, within the optimal range of below 0.5, which is a positive finding.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5433","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL is 3.26 mmol/L: LDL cholesterol with the cholesterol carried on Lp(a) particles taken out. It shows the part of LDL that diet and medication can change.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting glucose measures the level of sugar in the blood after a period of not eating. It reflects how well the body manages blood sugar at rest. Susan's fasting glucose is 5.1, within the optimal range of 4.0 to 5.4 and well below the pre-diabetic threshold. This is a healthy result.","low_causes":"Excessive insulin, prolonged fasting, adrenal insufficiency","high_causes":"Pre-diabetes, diabetes, stress, medications, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for about three months, this gives an average blood sugar reading over the preceding 8 to 12 weeks. Susan's HbA1c is 5.8%, below the normal threshold of 6.0% and just above the optimal target of below 5.7%. This is a well-controlled result.","low_causes":"Haemolytic anaemia, blood loss, hypoglycaemia","high_causes":"Pre-diabetes, diabetes, high-carbohydrate diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol per mol. Susan's reading of 39 is below the normal threshold of 42, confirming good long-term blood sugar control and no evidence of pre-diabetes or diabetes.","low_causes":"Haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"5.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3891","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3973","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing at rest. High levels suggest the body needs to produce large amounts of insulin to keep blood sugar down, which is an early sign of insulin resistance. Susan's fasting insulin is 5.64, within the optimal range of 2 to 8. The pancreas is producing just the right amount of insulin to maintain healthy blood sugar without being overworked.","low_causes":"Type 1 diabetes, low-carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, pre-diabetes, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.937","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2622","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It provides a reliable measure of how much insulin the pancreas is producing because, unlike insulin itself, C-Peptide is not cleared by the liver during its first pass. Susan's C-Peptide is 0.937 micrograms per litre (approximately 310 pmol per litre), below the laboratory lower limit of 1.1. In the context of her normal fasting glucose, normal HbA1c, and healthy HOMA-IR, this reflects low insulin demand rather than pancreatic failure. Her pancreas does not need to produce much insulin because her cells respond to it efficiently. This should be monitored on future tests but is not a concern at present.","low_causes":"Low insulin demand, high insulin sensitivity, type 1 diabetes, low-carbohydrate diet, sample handling","high_causes":"Insulin resistance, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A lower score indicates better insulin sensitivity. Susan's HOMA-IR is 1.28, within the healthy range of 0.5 to 1.5 and well below the threshold of 1.9 where early insulin resistance begins. At her BMI of 29.7, this level of insulin sensitivity is a genuinely positive finding.","low_causes":"High insulin sensitivity, low-carbohydrate diet","high_causes":"Insulin resistance, obesity, sedentary lifestyle, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"70.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2542","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the percentage of normal beta cell function in the pancreas. It is calculated as (20 multiplied by insulin) divided by (glucose minus 3.5), giving Susan a score of 70.5. This is below the standard range of 80 to 200. However, in the context of normal glucose, normal HbA1c, and a HOMA-IR showing good insulin sensitivity, this reflects low insulin demand rather than failing pancreatic function. The pancreas is producing less insulin because less insulin is needed. This should be monitored over time to ensure the pattern remains stable.","low_causes":"Low insulin demand, high insulin sensitivity, early beta cell decline, low-carbohydrate diet","high_causes":"Insulin resistance (compensatory overproduction), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.07","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is the most sensitive single marker of systemic inflammation and is also used as an independent cardiovascular risk marker. Susan's hs-CRP is 0.7, below the optimal threshold of 1.0. For someone with CKD, chronic fatigue syndrome, long COVID, and joint pain, this is a genuinely impressive result. It indicates that chronic systemic inflammation is not the primary driver of her symptoms.","low_causes":"","high_causes":"Infection, chronic inflammation, cardiovascular risk, autoimmune disease, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, the erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube in one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red cells to clump together. Susan's ESR is 4, well within the optimal range and an excellent result for a 79-year-old. This further confirms that systemic inflammation is well controlled.","low_causes":"","high_causes":"Infection, inflammation, autoimmune disease, anaemia, cancer","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"INFLAMMATION","result":"2.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is calculated by dividing the neutrophil count by the lymphocyte count (2.99 divided by 1.33 = 2.25). It is a marker of the balance between the innate immune response (neutrophils) and the adaptive immune response (lymphocytes), and an elevated ratio can indicate inflammation or physiological stress. Susan's NLR of 2.25 is within the normal range of 1 to 3, though above the optimal threshold of 2.0. This is a normal finding at 79.","low_causes":"Autoimmune conditions, some viral infections","high_causes":"Infection, inflammation, physiological stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"142","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5641","units":"mmol/l","description":"Sodium is the primary electrolyte that regulates fluid balance and blood pressure. The kidneys control sodium levels by adjusting how much is retained or excreted. Susan's sodium is 139, within the optimal range. Given her hypertension and CKD, stable sodium is a reassuring finding indicating the kidneys are managing fluid balance well.","low_causes":"Diuretics, kidney disease, excess fluid intake, heart failure","high_causes":"Dehydration, excess salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5741","units":"mmol/l","description":"Potassium is essential icarbonate is the body's main acid buffer, helping to maintain blood pH within a very narrow range. In CKD, bicarbonate can fall as the kidneys lose their ability to excrete acid, leading to metabolic acidosis. Susan's bicarbonate is 25.7, well within the healthy range, indicating that her kidneys are still managing acid-base balance effectively despite her reduced eGFR. This is a reassuring finding.","low_causes":"Kidney disease (metabolic acidosis), diarrhoea, diabetic ketoacidosis","high_causes":"Vomiting, metabolic alkalosis, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"11.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate), giving Susan a value of 11.2. It helps identify the cause of metabolic acidosis when present. Susan's anion gap of 11.2 is within the normal range of 8 to 16, confirming no significant acid-base disturbance.","low_causes":"Low albumin, laboratory error","high_causes":"Lactic acidosis, ketoacidosis, kidney failure, poisoning","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3684","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling, and heart rhythm. Susan's total od sugar regulation. Long-term PPI use (Omeprazole) can deplete magnesium stores, so Susan's level of 0.88, within the optimal range of 0.85 to 1.05, is a reassuring finding. Ongoing supplementation is still recommended to maintain this level given her PPI use.","low_causes":"PPI use, diuretics, poor dietary intake, alcohol, diarrhoea","high_causes":"Kidney disease (reduced excretion), excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"271","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5190","units":"umol/l","description":"Uric acid is a waste product formed when the body breaks down purines, substances found in certain foods and in DNA. The kidneys excrete most uric acid. Elevated levels can cause gout and are associated with cardiovascular and kidney disease risk. Susan's uric acid is 271, within the optimal range for a woman (160 to 320). Given her CKD, a healthy uric acid level is particularly reassuring as elevated uric acid can accelerate kidney function decline.","low_causes":"Low-purine diet, certain medications","high_causes":"Kidney disease, gout, high-purine diet, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced in the liver and excreted by the kidneys. Rising urea can indicate reduced kidney function or dehydration. Susan's urea is 6.7, within the optimal range. While her eGFR indicates reduced kidney filtration capacity, the fact that urea is not accumulating is a positive finding suggesting the kidneys are still clearing this waste product adequately.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high-protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6260","lower_normal":"49","upper_normal":"90","lower_optimal":"49","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism, filtered by the kidneys and excreted in urine. Higher levels can indicate reduced kidney function. Susan's creatinine is 85, within the laboratory range of 49 to 90 but above the optimal threshold. At 79, with low muscle mass and minimal physical activity, creatinine levels can be misleadingly low relative to actual kidney function, which is why the Cystatin C measurement provides a more accurate picture.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high protein diet, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) calculated from creatinine estimates how much blood the kidneys filter per minute. An eGFR below 60 indicates reduced kidney function. Susan's creatinine-based eGFR is 56, consistent with her known CKD. At 79, some decline in eGFR is expected as part of normal ageing, with the average eGFR for a healthy 80-year-old being around 60 to 70. However, her Cystatin C eGFR of 49 suggests slightly more advanced reduction than the creatinine-based calculation alone.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, medications","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6955","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells in the body. It is freely filtered by the kidneys, making it an excellent marker of kidney function that is not affected by muscle mass, age, sex, or diet in the way creatinine is. Susan's Cystatin C is 1.53, above the upper limit of 1.1, indicating reduced kidney filtration. The eGFR calculated from Cystatin C is 49, which is likely the most accurate measure of her kidney function given her age, sedentary lifestyle, and low muscle mass.","low_causes":"","high_causes":"Reduced kidney function, acute kidney injury","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatin_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4083","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"This is the eGFR calculated specifically from Cystatin C rather than creatinine. It provides a more accurate estimate of kidney function, especially in older adults and those with low muscle mass. Susan's Cystatin C eGFR of 49 places her in stage 3b CKD (eGFR 30 to 44 is stage 3b, 45 to 59 is stage 3a). At 49 she is at the lower end of stage 3a. This should be discussed with her GP or nephrologist to ensure monitoring and management are appropriate.","low_causes":"Chronic kidney disease, acute kidney injury","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"128","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Low haemoglobin indicates anaemia, which causes fatigue, breathlessness, and pallor. Susan's haemoglobin is 128, within the normal range for a woman (120 to 150) but below the optimal band of 125 to 145. She is not anaemic, which is reassuring given her CKD, as the kidneys produce erythropoietin, the hormone that stimulates red blood cell production, and kidney disease can reduce this output.","low_causes":"Iron deficiency, B12/folate deficiency, kidney disease, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"3.8","upper_normal":"4.8"," scription":"The reticulocyte percentage measures the proportion of young, newly produced red blood cells in the total red cell population. Susan's reticulocyte percentage is 0.84, within the normal range, indicating that the bone marrow is producing new red cells at an appropriate rate relative to the total red cell mass.","low_causes":"Bone marrow suppression, aplastic anaemia, iron/B12/folate deficiency","high_causes":"Haemolytic anaemia, blood loss, response to iron/B12 treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_abs","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"34.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2319","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells in the bloodstream, providing a more precise picture of bone marrow output than the percentage alone. Susan's absolute reticulocyte count is 34.78, below the lower limit of 50. This indicates that the bone marrow is producing fewer new red cells than the standard range, which at 79 is most likely an age-related reduction in bone marrow activity. Since her haemoglobin is 128 and she is not anaemic, the marrow is producing enough to maintain her red cell mass, just at a lower rate. This should be monitored on future tests.","low_causes":"Age-related bone marrow changes, iron/B12/folate deficiency, kidney disease (low erythropoietin), aplastic anaemia","high_causes":"Haemolytic anaemia, active blood loss, response to treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"38.23","within_normal":"TRUE","within_optimal":"TRUE","result_posit ition":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, produced mainly by the ovaries during reproductive years. After menopause, production drops dramatically. Susan's oestradiol is below 43 pmol per litre, which is within the post-menopausal range of 0 to 118.2. This is expected and consistent with her FSH of 87.22, which confirms post-menopausal status.","low_causes":"Menopause, ovarian insufficiency, low body fat","high_causes":"HRT, ovarian tumours, obesity (peripheral conversion)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.54","within_normal":"TRUE","within_optimal":"","result_position":"0.1164","lower_normal":"0","upper_normal":"2.32","lower_optimal":"","upper_optimal":"","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone produced primarily by the ovaries after ovulation. After menopause, levels are very low. Susan's progesterone is 0.54, within the post-menopausal range of 0 to 2.32. This is an expected finding.","low_causes":"Menopause, anovulation","high_causes":"Ovulation, pregnancy, HRT, ovarian cysts","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"23.16","within_normal":"TRUE","within_optimal":"","result_position":"0.3028","lower_normal":"15.9","upper_normal":"54","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH, luteinising hormone, is produced by the pituitary gland. In post-menopausal women, LH rises because the pituitary continues to signal the ovaries even though they are no longer producing significant horm
