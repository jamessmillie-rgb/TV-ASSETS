const REPORT_DATA = {"patient_name":"Sezer Bulbul","dob":"13/06/1996","report_date":"2026-10-01","summary":"Sezer is a 30-year-old male presenting with a BMI of 25.9, following a Mediterranean diet rated 4 out of 10 for quality with a volume of 7 out of 10. He does not currently train, with no resistance or cardio sessions per week, and walks between 2,000 and 5,000 steps a day. He takes a proton pump inhibitor (Omeprazole or similar) and has a diagnosis of psoriasis. He reports hair thinning, joint pain and stiffness, and poor exercise recovery. His goals are to lose body fat, improve long-term health and longevity, and improve energy levels.\n\nThe finding that matters most in this report, and the one that should shape every conversation Sezer has with his GP going forward, is his cardiovascular lipid profile. His ApoB is 1.64, almost double the 0.9 target. ApoB is the protein that sits on every LDL and VLDL particle, and it is the single best measure of the number of cholesterol-carrying particles circulating in the blood. The higher the particle count, the more cholesterol is being driven into the artery wall. His LDL cholesterol is 4.68 against a target of below 3.0, his total cholesterol is 7.0, his non-HDL cholesterol is 5.7 against a target of below 4.0, and his triglycerides are 2.36, which is above the fasting threshold of 1.7. His HDL, the protective cholesterol that carries lipid away from the arteries, is 1.3, which is within the laboratory range but below the ideal of 1.55 for a man. His ApoB to ApoA-I ratio, the best single summary of cardiovascular particle balance, is 1.15, well above the 0.7 threshold that separates lower risk from higher risk. Every lipid metric in this panel is pointing in the same direction: there are too many atherogenic particles and not enough protective ones.\n\nWhat makes this picture more serious is his lipoprotein(a). Lp(a) is a modified LDL particle with an extra protein tail that makes it stickier, more inflammatory, and harder for the body to clear. It is entirely inherited, set by genetics, and does not change with diet, exercise or medication. Sezer's Lp(a) is 100.16, above the 32 threshold and sitting in the moderate-risk band between 90 and 200. This means that a meaningful portion of his LDL particle count is made up of Lp(a) particles that he cannot modify. His Lp(a)-corrected LDL, which estimates the LDL that is modifiable through lifestyle and, if needed, medication, is 4.36, still well above the 3.0 target. So even after accounting for the genetic contribution, there is a large amount of modifiable risk. His Cardiovascular Risk Score, a TrueVitals index that combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c on a scale of 0 to 100, comes in at 80. That is high, driven almost entirely by the lipid numbers and the Lp(a). It does not mean an event is imminent at 30, but it means the process of atherosclerosis is being accelerated right now, and the earlier it is addressed the greater the benefit. His Lp(a) result should be recorded permanently in his medical notes, and his first-degree relatives, parents and siblings, should be offered testing because they have a roughly 50 percent chance of carrying the same variant.\n\nThe lipase result also needs a mention. Lipase is an enzyme produced by the pancreas to digest fat. His level is 85, above the upper limit of 60. In the context of normal amylase at 95, no abdominal pain, and no alcohol excess reported, a mildly elevated lipase is most commonly a benign finding, sometimes related to high triglycerides or to PPI use, both of which apply here. However, it is worth the GP being aware, particularly because his triglycerides are elevated, as persistent hypertriglyceridaemia is a recognised risk factor for pancreatic inflammation. If Sezer develops any upper abdominal pain radiating to the back, nausea after fatty meals, or unexplained weight loss, this should be revisited promptly.\n\nHis prolactin is 384, marginally above the upper limit of 375. Prolactin is a hormone produced by the pituitary gland. In men, significant elevations can cause low libido, fatigue and even breast tissue changes, but at this margin, the most common explanations are stress on the day of the blood draw, eating shortly before the sample, or mild physiological variation. His testosterone is 20 with a free testosterone of 0.393, both well within the healthy range, which argues against a prolactin problem of any clinical significance. It is worth repeating on a fasted, rested morning sample in three months to confirm it settles.\n\nHis corrected calcium is 2.15, just below the lower limit of 2.2. Corrected calcium adjusts for albumin levels to give a more accurate reading. His uncorrected calcium is 2.32, which is within range, and his PTH (parathyroid hormone, the hormone that regulates calcium) is 1.6, comfortably within range, which means the parathyroid glands are not being driven to compensate for low calcium. The laboratory notes that calcium can be falsely reduced in older specimens, and given the marginal nature of this finding with a normal PTH, the most likely explanation is a sample-handling effect. However, because Sezer takes a PPI, and PPIs are known to reduce calcium absorption over time, this is worth monitoring. A repeat corrected calcium on a fresh sample is sensible.\n\nHis white cell count is 3.3, below the lower limit of 4.0, driven by neutrophils at 1.17 against a lower limit of 2.0. Neutrophils are the most abundant white blood cell and the first line of defence against bacterial infection. A low neutrophil count in isolation in a young man of Middle Eastern ethnicity is most commonly explained by benign ethnic neutropenia, a well-recognised genetic variant in people of Middle Eastern, African and some Mediterranean ancestry where the bone marrow holds neutrophils in reserve rather than releasing them into the circulation. It does not increase infection risk and does not need treatment. His lymphocytes are 1.8, his monocytes, eosinophils and basophils are all normal, his CRP is below 0.5, and his ESR is 1, so there is no sign of active infection, inflammation or immune suppression. The pattern is strongly consistent with benign ethnic neutropenia rather than anything pathological. His GP should be aware, and the result should be recorded as a baseline so that future blood tests are interpreted in context.\n\nHis C-peptide is 0.995 against a lower limit of 1.1, which the lab has flagged as low. C-peptide is a byproduct of insulin production: every time the pancreas makes one molecule of insulin, it makes one molecule of C-peptide. However, the lab notes that C-peptide can degrade in samples not separated within four hours. His fasting insulin is 5.78, his fasting glucose is 4.8, his HbA1c is 36, and his HOMA-IR, the measure of insulin resistance, is 1.23. All of these are healthy. The pancreas is producing exactly the right amount of insulin for his glucose load. The marginally low C-peptide is almost certainly a sample-handling artefact rather than a sign of pancreatic insufficiency.\n\nNow for the good news, and there is plenty. His kidney function is excellent. Cystatin C, which is a more accurate marker of kidney filtration than creatinine alone, is 0.75, giving a cystatin C eGFR of 124 and a combined eGFR of 124, both well above the ideal threshold of 90. His uric acid at 291 is within range and within the optimal band. His liver is in good shape. ALT at 35 is within the laboratory range, GGT at 23 is below the optimal threshold of 25, AST at 23 is healthy, bilirubin at 11 is unremarkable, and his FIB-4 score at 0.57 and APRI at 0.28 both rule out any suggestion of liver fibrosis. His thyroid is working well. TSH at 1.33 sits within the optimal band of 1.0 to 2.5, free T4 at 17.9 and free T3 at 4.8 are both within the ideal range, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His blood sugar control is excellent: fasting glucose 4.8, HbA1c 36, fasting insulin 5.78, and a HOMA-IR of 1.23 all paint the picture of a metabolically healthy man with good insulin sensitivity. His iron studies are balanced: ferritin at 67, transferrin saturation at 34.65 percent, serum iron at 24.8, and transferrin at 2.85 are all comfortably within optimal ranges. His testosterone at 20 and free testosterone at 0.393 are healthy for 30, and SHBG at 33.9 is well placed. DHEA-S at 5.5 is in a good range. Cortisol at 408 is appropriate for a morning sample. His immune markers are reassuring: IgG, IgM, IgA and IgE are all within range, rheumatoid factor is negative at 4, and tissue transglutaminase is negative, ruling out coeliac disease, which is worth checking in anyone with joint symptoms and an autoimmune condition like psoriasis. His PSA at 0.23 with a healthy free PSA ratio is unremarkable at 30. His tumour markers CA19-9 and CEA are both well within range. His CRP below 0.5 and ESR of 1 are as low as these markers go, meaning there is no detectable systemic inflammation, which is a genuinely notable positive for someone with psoriasis, a condition driven by immune-mediated inflammation. His creatine kinase at 143 is mid-range and normal.\n\nHis vitamin D at 45 is insufficient, sitting below the 50 threshold the lab defines as sufficient and well below the optimal band of 75 to 120. At a BMI of 25.9 this is likely driven by low sun exposure or inadequate dietary intake rather than fat sequestration, but PPI use can also impair vitamin D absorption. Vitamin D plays a direct role in immune regulation, and there is a growing body of evidence linking low vitamin D to worsening psoriasis activity, so optimising this level is particularly relevant for Sezer. His B12 at 406 is within the laboratory range but below the optimal threshold of 500. B12 is absorbed in the part of the gut that PPIs affect: by reducing stomach acid, PPIs reduce the release of B12 from food proteins, and long-term PPI use is a well-recognised cause of gradual B12 depletion. At 406, he is not deficient, but the trajectory over time on a PPI is downward, and supplementing now is sensible. His folate at 22 is above the upper laboratory limit of 17, which is not a concern and simply reflects good dietary intake of leafy greens or fortified foods.\n\nHis haematocrit at 0.395 is marginally below the lower limit of 0.40. In the context of a normal haemoglobin of 139, normal red cell count of 4.66, and healthy iron stores, this is a trivial finding and most likely reflects hydration status at the time of the draw. His MCHC at 353 is above the upper limit of 345, and his MPV at 11.4 is above the upper limit of 10.1. MCHC (mean corpuscular haemoglobin concentration, the average concentration of haemoglobin inside each red cell) and MPV (mean platelet volume, the average size of platelets) are both influenced by sample temperature and transport time. At these margins, with every other red cell index normal, neither is clinically significant.\n\nHis total antioxidant activity at 2.01 is above the upper range of 1.77. This is a positive finding, reflecting good dietary antioxidant intake, likely from the Mediterranean diet pattern he follows.\n\nThe urine sample is clean: no protein of significance at trace levels, no glucose, no blood, no white cells, no nitrites, no bacterial growth. The trace protein on a dipstick in a young man with excellent kidney function and no hypertension is not clinically meaningful and does not need follow-up.\n\nHis oestradiol is reported as below 43, which the lab has flagged as abnormal low against a male upper limit of 146.1. In practice, a result below the assay's detection limit in a man with healthy testosterone and no symptoms of oestrogen deficiency (bone pain, significant fatigue, mood disturbance) is not a concern. Some men naturally aromatise very little testosterone to oestradiol, and a low oestradiol with good testosterone is a common and benign finding.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 17.4, about 13 years younger than a calendar age of 30.\n\nPutting this together: Sezer is a metabolically healthy 30-year-old with excellent blood sugar control, strong kidney and liver function, a well-functioning thyroid, healthy testosterone, no systemic inflammation, and no signs of autoimmune thyroid or coeliac disease. The dominant finding is a significantly adverse lipid profile compounded by an inherited elevation in Lp(a), and this is the finding that will shape his health trajectory more than anything else in this report. The lipase, prolactin and corrected calcium findings are minor and should be monitored. His vitamin D and B12 need supplementing, particularly given his PPI use. His symptoms of hair thinning, joint stiffness and poor recovery are not explained by any dramatic abnormality in this panel, but the combination of very low physical activity, insufficient vitamin D, a suboptimal B12 trajectory on a PPI, and the immune dysregulation of psoriasis itself may all be contributing. The joint stiffness in particular, in a 30-year-old with psoriasis, should be discussed with his GP because psoriatic arthritis is a recognised complication that presents with exactly this pattern and warrants early assessment.","links":"The central story in this report is cardiovascular lipid risk, and it has two distinct components that must be understood separately. The first is inherited: Sezer carries a lipoprotein(a) level of 100.16, more than three times the threshold. This is genetic, fixed, and permanent. It means that a portion of the LDL particles in his blood are Lp(a) particles, which are stickier, more inflammatory, and more atherogenic than standard LDL. No diet, supplement or exercise programme will change this number. The second component is modifiable: even after subtracting the Lp(a) contribution, his corrected LDL is 4.36, his ApoB is 1.64, his triglycerides are 2.36, and his HDL is below ideal. These are driven by diet quality, body composition, and activity level, all of which are within his control. His diet is rated 4 out of 10 for quality despite being described as Mediterranean, his step count is low, and he does no structured exercise. These are the levers that will bring the modifiable portion of his risk down.\n\nThe lipid picture and the lipase finding may share a connection. Elevated triglycerides increase the substrate load on the pancreas, and mildly elevated lipase can be an early signal that the pancreas is working harder than it should to process circulating fat. Bringing the triglycerides down through dietary change, particularly reducing refined carbohydrates and increasing omega-3 intake, may resolve the lipase elevation without any further intervention.\n\nThe low white cell count and neutrophils stand apart from the lipid story. In a man of Middle Eastern ethnicity with no infections, no inflammation (CRP below 0.5, ESR 1), normal lymphocytes and normal immunoglobulins, this pattern is strongly consistent with benign ethnic neutropenia, a genetic variant affecting neutrophil margination. It is not connected to the lipid findings or the psoriasis.\n\nThe symptoms Sezer reports, hair thinning, joint stiffness and poor exercise recovery, are not explained by any single dramatic abnormality. However, several threads converge. His vitamin D at 45 is insufficient, and vitamin D plays a direct role in immune modulation, hair follicle cycling and musculoskeletal health. His B12 at 406, while not deficient, is being gradually impaired by PPI use and may be contributing to fatigue and poor recovery over time. His complete absence of exercise means he has no training stimulus for joint mobility, muscle repair or cardiovascular conditioning, which makes recovery from any physical activity feel disproportionately hard. And his psoriasis itself is an immune-mediated condition that, even when skin symptoms are controlled, can drive systemic effects including joint inflammation. The combination of psoriasis, joint stiffness, and a young age raises the specific question of psoriatic arthritis, which affects up to 30 percent of people with psoriasis and should be assessed by his GP.\n\nWhat was ruled out is equally important. His thyroid is working well with negative antibodies, so thyroid disease is not behind the hair thinning or fatigue. His iron stores are healthy, so iron deficiency is not contributing. His testosterone and free testosterone are both in the healthy range, so hormonal hair loss from low androgens is excluded. His blood sugar and insulin sensitivity are excellent, so metabolic syndrome is not the explanation for his lipid profile, which makes the dietary and genetic contributions even clearer. His coeliac screen is negative, his inflammatory markers are flat, and his liver and kidneys are functioning well.","lifestyle":"Start a daily walk of at least 20 minutes, ideally after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the triglyceride and glucose response to that meal, and your triglycerides at 2.36 are the most immediately diet-responsive lipid marker in this report. Walking is also the simplest way to move from 2,000 to 5,000 steps toward the 7,500 to 10,000 range where cardiovascular benefit becomes measurable.\nAdd two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: pick two fixed evenings as fish nights. Why: omega-3 fatty acids directly lower triglycerides and reduce the inflammatory component of Lp(a) risk, and they support joint health, which matters with your psoriasis and joint stiffness.\nReduce refined carbohydrates: swap white bread, white rice, pastry and sugary drinks for wholegrain alternatives, oats, lentils and vegetables. Start with one meal this week. Why: refined carbohydrates are the primary dietary driver of triglycerides and VLDL, and your VLDL at 1.07 and triglycerides at 2.36 both reflect this.\nAdd a palm-sized portion of protein to every meal. Eggs, chicken, fish, Greek yoghurt, lentils or beans. Anchor: protein goes on the plate first, before anything else. Why: protein supports satiety for the body fat goal, preserves lean mass, and at your weight of 82 kg you should aim for 107 to 131 grams of protein per day.\nAdd 30 grams of soluble fibre per day from oats, beans, lentils, flaxseed and vegetables. Build up gradually over two weeks to avoid bloating. Why: soluble fibre binds bile acids in the gut, which forces the liver to pull LDL cholesterol out of the blood to make more, directly lowering LDL. With an LDL of 4.68, this is one of the most effective non-medication interventions available.\nBegin two resistance training sessions per week, even bodyweight exercises at home: squats, press-ups, rows, lunges. Anchor: pick two fixed days and set a phone reminder. Why: resistance training raises HDL, lowers triglycerides, improves insulin sensitivity, strengthens joints, and is the single most effective intervention for the poor exercise recovery you report. You are not recovering poorly from exercise; you are deconditioned from not doing any.\nAim for a calorie intake of approximately 2,000 to 2,200 kcal per day to create a modest deficit for fat loss while preserving lean mass. Your estimated maintenance is around 2,400 kcal based on your weight, height and current low activity level. As activity increases, maintenance rises and the deficit is maintained without dropping calories further.\nGet outside within an hour of waking for at least 10 minutes of natural light. Why: morning light exposure supports vitamin D synthesis, regulates cortisol rhythm, and improves sleep quality, all of which feed into energy levels.","flags":"ApoB 1.64 (target below 0.9), LDL 4.68 (target below 3.0), total cholesterol 7.0, triglycerides 2.36 (target below 1.7), HDL 1.3 (ideal above 1.55), non-HDL 5.7 (target below 4.0), ApoB/A-I ratio 1.15 (target below 0.7), Lp(a)-corrected LDL 4.36, atherogenic index 0.259, Castelli II ratio 3.6. Severely adverse lipid profile with both a large modifiable component and a fixed inherited component from Lp(a). Cardiovascular Risk Score 80 out of 100. Requires GP review for cardiovascular risk stratification and discussion of whether statin therapy is appropriate given the Lp(a) and the cumulative lifetime exposure at age 30.\nLp(a) 100.16 (threshold 32, moderate risk band 90 to 200). Entirely inherited, unchangeable by lifestyle or standard medication. Should be recorded permanently in medical notes. First-degree relatives should be offered testing. Emerging therapies targeting Lp(a) (antisense oligonucleotides) are in late-stage trials and may become available within years.\nLipase 85 (upper limit 60) with normal amylase 95. Mildly elevated in the context of elevated triglycerides and PPI use. No abdominal symptoms reported. Monitor and repeat if symptoms develop.\nProlactin 384 (upper limit 375). Marginally above range. Testosterone and gonadotrophins normal. Most likely stress or non-fasting artefact. Recommend repeat on a fasted, rested morning sample in three months.\nCorrected calcium 2.15 (lower limit 2.2) with uncorrected calcium 2.32 (in range) and PTH 1.6 (in range). Marginal finding, possibly sample-related, but worth monitoring given long-term PPI use which impairs calcium absorption. Repeat on fresh sample.\nWhite cell count 3.3 (lower limit 4.0), neutrophils 1.17 (lower limit 2.0). In a man of Middle Eastern ethnicity with no infection, no inflammation (CRP below 0.5, ESR 1), and normal lymphocytes and immunoglobulins, this is consistent with benign ethnic neutropenia. Should be recorded as baseline for future reference.\nC-peptide 0.995 (lower limit 1.1) in the context of normal fasting insulin 5.78, normal glucose 4.8, normal HbA1c 36, and HOMA-IR 1.23. Lab notes sample degradation possibility. Not consistent with pancreatic insufficiency. No action needed.\nVitamin D 45 (insufficient, optimal 75 to 120). Requires supplementation, particularly relevant given psoriasis and PPI use.\nVitamin B12 406 (optimal above 500). Suboptimal and at risk of further decline on long-term PPI therapy. Requires supplementation.\nHaematocrit 0.395 (lower limit 0.40). Marginal, with normal haemoglobin and red cell count. Likely hydration-related. No action needed.\nMCHC 353 (upper limit 345) and MPV 11.4 (upper limit 10.1). Both marginally above range and likely influenced by sample processing. No clinical significance with all other red cell indices normal.\nUrine protein trace. In a 30-year-old with excellent kidney function (eGFR 124) and no hypertension, a dipstick trace is not significant.\nReassuring negatives: thyroid function optimal with negative antibodies, coeliac screen negative, fasting glucose and HbA1c normal, insulin sensitivity excellent (HOMA-IR 1.23), liver function and fibrosis scores normal, kidney function excellent, testosterone healthy, iron stores balanced, PSA negligible, tumour markers clear, immunoglobulins normal, rheumatoid factor negative, CRP below 0.5, ESR 1, urine culture no growth.","recommendations":"Discuss the lipid profile with your GP as a priority. Bring these numbers: ApoB 1.64 (target below 0.9), LDL 4.68 (target below 3.0), triglycerides 2.36, Lp(a) 100.16 (threshold 32). At 30 with a high Lp(a) and significantly elevated ApoB, the GP should consider formal cardiovascular risk assessment and discuss whether early statin therapy is appropriate to reduce the cumulative lifetime exposure of the arterial wall to atherogenic particles.\nAsk the GP to record the Lp(a) result of 100.16 permanently in your medical notes. This is genetic, will not change, and should be factored into every future cardiovascular risk assessment. Request that your parents and siblings are offered Lp(a) testing.\nRaise the joint stiffness with your GP in the context of your psoriasis diagnosis. Psoriatic arthritis affects up to 30 percent of people with psoriasis and presents with joint pain and stiffness. Early assessment, potentially including imaging or rheumatology referral, can prevent joint damage.\nAsk the GP to review your long-term PPI use. PPIs impair absorption of calcium, magnesium, B12 and iron over time. Your corrected calcium is already borderline low and your B12 is below optimal. If the PPI is still clinically necessary, the GP may suggest the lowest effective dose and monitoring of these nutrients. If it was started empirically and never reviewed, stepping down or switching may be appropriate.\nRepeat prolactin on a fasted, rested morning sample in three months to confirm it was a one-off.\nRepeat corrected calcium on a fresh sample at the next blood draw.\nRetest in six months with a lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB, ApoA-I), vitamin D, B12, corrected calcium, lipase, prolactin, and a full blood count. The lipid markers will show whether the dietary changes are working. Target: ApoB below 1.2 as a first milestone, triglycerides below 1.7, HDL above 1.4. Calorie target 2,000 to 2,200 kcal per day, protein target 107 to 131 grams per day (1.3 to 1.6 g per kg), aiming for a weight of 76 to 78 kg over six to twelve months.","supplementation":"Vitamin D3 (cholecalciferol), 4,000 IU daily, taken with your largest meal that contains fat. Why: your vitamin D is 45, below the sufficient threshold and well below the optimal range of 75 to 120. Vitamin D is particularly important for immune regulation in psoriasis, for calcium absorption (your corrected calcium is borderline low), and for joint and musculoskeletal health. The higher dose of 4,000 IU rather than 2,000 IU is appropriate because you are starting from an insufficient level and PPI use impairs absorption.\nVitamin K2 (MK-7), 200 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone and away from arterial walls. With a borderline low corrected calcium, a cardiovascular risk profile that needs protecting, and high-dose vitamin D supplementation, K2 is essential.\nOmega-3 fish oil, 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 directly lowers triglycerides (yours are 2.36, target below 1.7), reduces arterial inflammation, and supports joint mobility. Choose a high-concentration product so you can reach 3 grams of EPA plus DHA in two to three capsules rather than ten.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. Why: your B12 is 406, below the optimal threshold of 500, and PPI use impairs B12 absorption from food by reducing stomach acid. Sublingual delivery bypasses the stomach entirely, which is why it is the preferred form for anyone on a PPI.\nMagnesium glycinate, 300 mg before bed. Why: your magnesium at 0.98 is within range but PPI use depletes magnesium over time. Glycinate is the best-absorbed form and supports sleep quality and muscle recovery.\nDo not take iron supplements. Your iron stores are healthy with a ferritin of 67 and transferrin saturation of 34.65 percent. Unnecessary iron supplementation increases oxidative stress and, in the context of an already adverse lipid profile, could accelerate arterial damage.\nThe most important changes from this report are not supplements. They are the dietary shift away from refined carbohydrates toward fibre, protein and oily fish, the addition of daily walking and twice-weekly resistance training, and the GP conversation about cardiovascular risk stratification given the Lp(a) and ApoB findings.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 56 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 56.2. Weakest systems: lipids & cardiovascular 13%, hematology 39%, electrolytes & minerals 56%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), White Cell Count.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"17.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2486","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the atherogenic burden being placed on the arteries right now, not the ten-year probability of an event. Sezer's score of 80 is high, driven almost entirely by the severely elevated ApoB, high LDL, elevated triglycerides and high Lp(a). His excellent hsCRP and HbA1c are the only moderating inputs. At 30, his ten-year absolute risk remains low, but the score reflects that the process of atherosclerosis is being accelerated, and the gap between the score and the absolute risk is the window for intervening.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4583","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found mainly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. Sezer's ALT is 35, within the laboratory range of up to 56 but above the optimal threshold of 30 for men. At 35, this is only marginally above the tighter ideal and is not a concern in the context of a clean GGT, normal AST, normal bilirubin and excellent fibrosis scores. It may reflect his diet quality rather than any liver pathology.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, alcohol, medications, obesity, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5729","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. It rises when any of those tissues are damaged. Sezer's AST at 23 is comfortably within both the laboratory and optimal ranges, confirming that his liver, heart and muscle tissue are healthy.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver damage, heart damage, muscle injury, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2397","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4362","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. It is often the first liver marker to rise when something is off. Sezer's GGT at 23 is well within the optimal range, which is reassuring and suggests his liver is handling his current diet and PPI medication without strain.","low_causes":"","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4238","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5429","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones and bile ducts. Elevations can point to liver or bone problems. Sezer's ALP at 65 is well within range and unremarkable.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6253","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting liver function, immune status and nutritional state. Sezer's total protein at 80 is at the top of the optimal band, indicating healthy protein production by the liver and adequate nutrition.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic inflammation, infection, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6146","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and medications, and maintains fluid balance. Sezer's albumin at 49 is excellent, confirming strong liver synthetic function and good nutritional status.","low_causes":"Liver disease, kidney disease, inflammation, malnutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin includes immune proteins (immunoglobulins) and transport proteins. It provides a broad view of immune activity. Sezer's globulin at 31 is well within range and consistent with his individual immunoglobulin levels, all of which are normal.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Sezer's bilirubin at 11 is comfortably within range, confirming healthy red cell turnover and liver clearance.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4886","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands to break down starch. Elevations suggest pancreatic inflammation. Sezer's amylase at 95 is within range, which is reassuring alongside the mildly elevated lipase.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fat. It is more specific to the pancreas than amylase. Sezer's lipase at 85 is above the upper limit of 60. In the context of normal amylase, no abdominal symptoms, and no alcohol excess, this mild elevation may be related to his elevated triglycerides (which increase pancreatic workload) or his PPI use. It should be monitored and repeated at the next test. If he develops upper abdominal pain, nausea after fatty meals or unexplained weight loss, he should see his GP promptly.","low_causes":"","high_causes":"Pancreatitis, pancreatic obstruction, kidney disease, high triglycerides, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6757","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. Sezer's total cholesterol at 7.0 is significantly above the desirable threshold of 5.18, driven by elevated LDL and VLDL. This number on its own is less useful than the breakdown, but it confirms the overall lipid burden is high.","low_causes":"Malnutrition, hyperthyroidism, liver failure","high_causes":"Diet high in saturated fat and refined carbohydrates, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6941","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats in the blood, largely driven by dietary carbohydrate, sugar and alcohol intake. The liver converts excess carbohydrate into triglycerides and packages them into VLDL particles. Sezer's triglycerides at 2.36 are above the fasting threshold of 1.7 and more than double the optimal level of below 1.0. Elevated triglycerides increase the number of atherogenic particles, are a risk factor for pancreatitis (relevant given his elevated lipase), and are one of the most responsive markers to dietary change, particularly reducing refined carbohydrates and sugar.","low_causes":"Very low-fat diet, malnutrition, hyperthyroidism","high_causes":"Refined carbohydrates, sugar, alcohol, obesity, insulin resistance, sedentary lifestyle, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"1.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6859","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. It is the precursor to LDL. Sezer's VLDL at 1.07 is above the upper limit of 0.78, a direct consequence of his elevated triglycerides. Lowering triglycerides through dietary change will bring VLDL down in parallel.","low_causes":"","high_causes":"High triglycerides, excess carbohydrate intake, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4194","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol that carries lipid away from artery walls and back to the liver for disposal. Higher is better. Sezer's HDL at 1.3 is above the minimum threshold of 1.04 but below the ideal of 1.4 for a man. HDL is raised by regular exercise (particularly resistance training and brisk walking), moderate alcohol, omega-3 fatty acids and weight loss. With zero current exercise, increasing activity is the most effective way to raise this number.","low_causes":"Sedentary lifestyle, smoking, obesity, high-carbohydrate diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7813","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the main carrier of cholesterol to the tissues and, when in excess, into the artery wall. It is the primary target of lipid-lowering therapy. Sezer's LDL at 4.68 is well above the upper limit of 3.0 and nearly double the optimal target of 2.6. A portion of this is driven by Lp(a) particles (which are measured as LDL), but even after correction his Lp(a)-corrected LDL is 4.36, still significantly above target. Dietary changes, increased fibre, reduced saturated fat, omega-3 and exercise, are the first-line intervention, with statin therapy to be discussed with his GP given the Lp(a).","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Saturated fat intake, refined carbohydrates, genetics, obesity, sedentary lifestyle, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.38","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5978","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL, giving a quick measure of the balance between harmful and protective cholesterol. Sezer's ratio of 5.38 is above the target of below 4.5, reflecting high total cholesterol and below-ideal HDL. Bringing LDL down and HDL up will improve this ratio from both directions.","low_causes":"","high_causes":"High LDL, low HDL, sedentary lifestyle, poor diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"18.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the cholesterol in the blood is the protective type. The target is above 20 percent. Sezer's HDL percentage at 18.57 is below target because his total cholesterol is high while his HDL is below ideal. Improving both metrics will push this percentage up.","low_causes":"High total cholesterol, low HDL, sedentary lifestyle, poor diet","high_causes":"Regular exercise, healthy diet, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic cholesterol (LDL, VLDL and Lp(a)) in one number. Sezer's non-HDL at 5.7 is well above the target of below 4.0, confirming the high atherogenic burden seen across all his lipid markers.","low_causes":"","high_causes":"High LDL, high triglycerides, high Lp(a), poor diet, genetics, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5958","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA-I is the main protein on HDL particles and reflects the number of protective particles in circulation. Sezer's ApoA-I at 1.43 is above the 1.2 minimum and just above the ideal of 1.4, which is a positive finding. Exercise and omega-3 intake can push this higher.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle. It is the single best measure of the total number of atherogenic (artery-damaging) particles in the blood, and is now considered more predictive of cardiovascular events than LDL cholesterol alone. Sezer's ApoB at 1.64 is nearly double the 0.9 target, classified as 'very high' by the laboratory. This is the most important number in his lipid panel and the one his GP should focus on when discussing treatment.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Genetics, high saturated fat intake, high Lp(a), insulin resistance, sedentary lifestyle, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8214","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio is the single best summary of cardiovascular particle balance: it compares the number of harmful particles (ApoB) to the number of protective ones (ApoA-I). A ratio below 0.7 is lower risk, 0.7 to 0.9 is average, and above 0.9 is higher risk. Sezer's ratio of 1.15 is in the higher-risk category, driven almost entirely by his very high ApoB. Reducing ApoB through diet, exercise and potentially medication will improve this ratio.","low_causes":"","high_causes":"High ApoB, low ApoA-I, sedentary lifestyle, poor diet, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"100.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a modified LDL particle with an extra protein tail that makes it stickier, more pro-inflammatory and harder for the body to clear. Its level is almost entirely determined by genetics and does not change with diet, exercise or standard cholesterol-lowering medication. Sezer's Lp(a) at 100.16 is above the 32 threshold and falls in the moderate-risk band (90 to 200). This result should be recorded permanently in his medical notes because it will never change, and his first-degree relatives should be offered testing. Emerging therapies (antisense oligonucleotides) that specifically target Lp(a) are in late-stage clinical trials.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the sugar level in the blood after an overnight fast. It is a direct snapshot of how well the body is regulating blood sugar right now. Sezer's glucose at 4.8 is within the optimal range of 4.0 to 5.4, confirming healthy blood sugar regulation.","low_causes":"Excess insulin, fasting, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the average blood sugar level over the past two to three months by looking at how much glucose has attached to red blood cells. A level below 6.0 percent is normal. Sezer's HbA1c at 5.4 percent is well within the normal range, confirming stable blood sugar control over the medium term.","low_causes":"","high_causes":"Chronically elevated blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in IFCC units. Sezer's result of 36 mmol/mol is right at the top of the optimal band and well below the pre-diabetes threshold of 42. This confirms excellent three-month blood sugar control.","low_causes":"","high_causes":"Pre-diabetes, diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"5.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3809","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3154","upper_optimal_position":"0.4244","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. Lower is better, as high fasting insulin indicates the body is working harder than it should to control glucose (insulin resistance). Sezer's fasting insulin at 5.78 is within the optimal range of 2 to 8, confirming he is insulin sensitive and his pancreas is under no strain.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, low-carbohydrate diet","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, sedentary lifestyle, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.995","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2996","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-peptide is produced in equal amounts to insulin and is used to measure how much insulin the pancreas is actually making (because injectable insulin does not contain C-peptide). Sezer's C-peptide at 0.995 is marginally below the lower limit of 1.1. However, the lab notes that C-peptide can degrade significantly in samples not separated promptly. With his fasting insulin at 5.78, glucose at 4.8, HbA1c at 36 and HOMA-IR at 1.23, all of which confirm healthy pancreatic function and insulin sensitivity, the marginally low C-peptide is almost certainly a sample-handling artefact rather than a sign of pancreatic insufficiency.","low_causes":"Sample degradation, low insulin demand (healthy), type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4730","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and insulin to estimate how resistant the body's cells are to insulin. Below 1.0 is optimal, below 1.5 is healthy, above 1.9 suggests early resistance and above 2.9 is significant resistance. Sezer's HOMA-IR of 1.23 is within the healthy range, confirming good insulin sensitivity. This is a strong positive finding that means his elevated lipids are not being driven by metabolic syndrome or insulin resistance.","low_causes":"Very high insulin sensitivity, low-carbohydrate diet","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts HbA1c into an average blood sugar level over the past two to three months. Sezer's estimated average glucose of 6.1 is within the optimal range, confirming consistent blood sugar control.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"9.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5176","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Triglycerides, which sits outside the ideal range.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"< 0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.05","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity CRP (C-reactive protein) is one of the most important markers of systemic inflammation in the body. It is produced by the liver in response to inflammation anywhere. Sezer's hsCRP is below 0.5, the lowest measurable level, which is genuinely notable for someone with psoriasis, an immune-mediated inflammatory condition. It means there is no detectable systemic inflammation, and his cardiovascular risk from inflammatory pathways is minimal. The cardiov tion, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"406","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4459","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5658","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. It is absorbed in the gut through a process that requires stomach acid. Sezer's B12 at 406 is within the laboratory range but below the optimal threshold of 500. He takes a PPI (proton pump inhibitor), which reduces stomach acid and impairs B12 absorption from food. Over time, PPI use is a well-recognised cause of gradual B12 depletion. At 406, he is not deficient, but the trajectory on continued PPI use is downward. Sublingual methylcobalamin supplementation is recommended because it bypasses the stomach entirely.","low_causes":"PPI use, poor dietary intake (vegan or vegetarian), pernicious anaemia, malabsorption, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7857","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and nervous system health. Sezer's folate at 22 is above the upper laboratory range of 17. Elevated folate is not harmful and simply reflects good dietary intake of folate-rich foods such as leafy greens, legumes and fortified foods, or the possibility of a supplement or fortified food. It is a positive finding and does not need action.","low_causes":"Poor dietary intake, malabsorption, alcohol, pregnancy, medications (methotrexate, PPIs)","high_causes":"Supplementation, fortified foods, high dietary intake, B12 deficiency (folate trapped in cells)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3887","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5720","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. Sezer's PTH at 1.6 is within the optimal range, meaning his parathyroid glands are not being driven to compensate for the marginally low corrected calcium. This is reassuring and suggests the calcium finding is likely a sample-handling artefact or a transient effect.","low_causes":"Hypoparathyroidism, excessive calcium or vitamin D, magnesium deficiency","high_causes":"Low calcium, vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"2.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7512","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3759","upper_optimal_position":"0.6667","units":"mmol/l","description":"To nflammation and immune balance. Sezer's PLR of 113.9 is within the optimal band, consistent with the absence of systemic inflammation seen in his CRP and ESR.","low_causes":"Bone marrow suppression, splenomegaly","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"133","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3553","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index combines neutrophils, lymphocytes and platelets to assess immune-inflammatory status. Sezer's SII of 133 is within the laboratory range but below the optimal band of 150 to 450, driven by his low neutrophil count. In his case, the low neutrophils reflect benign ethnic neutropenia rather than immune suppression, so this below-optimal SII is not a concern.","low_causes":"Low neutrophil count (benign ethnic neutropenia), bone marrow suppression","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tghdl","name":"Triglyceride:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6067","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a strong predictor of insulin resistance and cardiovascular risk. A ratio below 0.87 is optimal, and below 1.5 is acceptable. Sezer's ratio of 1.82 is above the upper limit, driven by high triglycerides and below-ideal HDL. Despite his excellent HOMA-IR, this ratio suggests the lipid-driven component of metabolic risk is elevated and will respond to the dietary and exercise changes recommended.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6375","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich particles (VLDL and their remnants) after subtracting HDL and LDL from total cholesterol. It is increasingly recognised as an independent cardiovascular risk factor. Sezer's remnant cholesterol at 1.02 is above the upper limit of 0.8, reflecting his elevated triglycerides. Reducing refined carbohydrate intake is the most effective way to lower this.","low_causes":"","high_causes":"High triglycerides, excess carbohydrate intake, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"4.36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7267","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL estimates the portion of LDL cholesterol that is modifiable, by subtracting the contribution from Lp(a) particles. Sezer's corrected LDL of 4.36 is still well above the 3.0 target, confirming that even after accounti // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
